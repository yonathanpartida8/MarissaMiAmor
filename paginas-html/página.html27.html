<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El bordado</title>

<style>
/* ══════════════════════════════════════════════════════════════════════
   Todo dentro de .bordado-mundo, con prefijo `bd-` en cada clase.
   ══════════════════════════════════════════════════════════════════════ */

html, body { margin: 0; height: 100%; }

.bordado-mundo {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  contain: layout paint;
  background:
    radial-gradient(ellipse 110% 70% at 50% 4%, #f2e6d6, transparent 58%),
    linear-gradient(172deg, #e4d2bc 0%, #d0b8a0 58%, #b89c84 100%);
  color: #45362c;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;

  --seguro-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seguro-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --e-suave: cubic-bezier(0.22, 1, 0.36, 1);
}

.bordado-mundo .bd-lienzo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  /* Los toques los recoge `.bd-toque`, que va justo encima. */
  pointer-events: none;
}

/* El bastidor entero. El libro sólo se queda el barrido que empieza en
   sus 24-44 px de borde. */
.bordado-mundo .bd-toque {
  position: absolute;
  inset: 0;
  touch-action: none;
  z-index: 2;
  cursor: crosshair;
}

.bordado-mundo .bd-ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  padding:
    calc(var(--seguro-t) + 18px) 22px
    calc(var(--seguro-b) + var(--barra) + 14px) 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.bordado-mundo .bd-titulo {
  margin: 0;
  font-family: var(--tipo-titulo, Georgia, serif);
  font-size: clamp(1rem, 4.4vw, 1.4rem);
  font-weight: 500;
  letter-spacing: 0.06em;
  color: #7d6048;
  opacity: 0.88;
  transition: opacity 800ms var(--e-suave);
}
.bordado-mundo.is-bordando .bd-titulo { opacity: 0.22; }

.bordado-mundo .bd-pie {
  margin: 0;
  min-height: 3.6em;
  max-width: 23em;
  font-size: clamp(0.82rem, 3.4vw, 0.97rem);
  line-height: 1.55;
  color: #4d3c30;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 640ms var(--e-suave), transform 640ms var(--e-suave);
}
.bordado-mundo .bd-pie.is-visible { opacity: 0.94; transform: none; }
.bordado-mundo .bd-pie em {
  display: block;
  margin-top: 0.3em;
  font-family: var(--tipo-mano, "Segoe Script", cursive);
  font-size: 1.16em;
  font-style: normal;
  color: #b04a62;
}

/* Los hilos de colores, abajo. */
.bordado-mundo .bd-hilos {
  position: absolute;
  left: 0; right: 0;
  /* Por encima del texto de abajo, no encima de él. */
  bottom: calc(var(--seguro-b) + var(--barra) + 108px);
  display: flex;
  justify-content: center;
  gap: 9px;
  z-index: 4;
}
.bordado-mundo .bd-hilo {
  width: 26px; height: 34px;
  border: 0; padding: 0;
  border-radius: 5px 5px 8px 8px;
  cursor: pointer;
  box-shadow: 0 2px 5px rgba(60, 40, 28, 0.32), inset 0 -6px 10px rgba(0, 0, 0, 0.18);
  transition: transform 220ms var(--e-suave), box-shadow 220ms var(--e-suave);
  position: relative;
}
.bordado-mundo .bd-hilo::after {
  content: "";
  position: absolute;
  left: 50%; top: -7px;
  width: 2px; height: 10px;
  margin-left: -1px;
  background: currentColor;
  border-radius: 1px;
}
.bordado-mundo .bd-hilo.is-elegido {
  transform: translateY(-9px) scale(1.1);
  box-shadow: 0 7px 14px rgba(60, 40, 28, 0.4), inset 0 -6px 10px rgba(0, 0, 0, 0.18);
}
.bordado-mundo .bd-hilo:focus-visible { outline: 2px solid #8a5c40; outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .bordado-mundo * { transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<div class="bordado-mundo" id="mundo">
  <canvas class="bd-lienzo" id="lienzo"></canvas>
  <div class="bd-toque" id="toque" aria-hidden="true"></div>
  <div class="bd-hilos" id="hilos" role="group" aria-label="Hilos"></div>
  <div class="bd-ui">
    <h1 class="bd-titulo" id="titulo">Sigue los puntos</h1>
    <p class="bd-pie" id="pie" role="status" aria-live="polite"></p>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN EDITABLE
   ══════════════════════════════════════════════════════════════════════ */

const CONF = {

  /* ---- LO QUE HAY QUE BORDAR ------------------------------------------
     Un dibujo marcado a lápiz en la tela: se pasa el dedo por encima y
     se va bordando. Cada figura tiene sus puntos, en coordenadas de 0 a
     1 dentro del bastidor.                                             */
  figuras: [
    {
      nombre: "el corazón",
      cerrada: true,
      hilo: 0,
      texto: "Un corazón. Lo más fácil y lo que más cuesta.",
      firma: "Como todo lo importante.",
      /* Se genera con la fórmula de siempre, pero se guarda como puntos
         para que el resto del código no sepa de fórmulas. */
      puntos: Array.from({ length: 36 }, (_, i) => {
        const t = (i / 36) * Math.PI * 2;
        return [
          0.5 + Math.pow(Math.sin(t), 3) * 0.26,
          0.46 - ((13 * Math.cos(t) - 5 * Math.cos(2 * t)
                 - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16) * 0.28,
        ];
      }),
    },
    {
      nombre: "la y",
      cerrada: false,
      hilo: 2,
      texto: "Una y. La primera letra.",
      firma: "Ya sabes de quién.",
      puntos: [[0.34, 0.26], [0.42, 0.44], [0.50, 0.26], null,
               [0.42, 0.44], [0.42, 0.72]],
    },
    {
      nombre: "el punto",
      cerrada: true,
      hilo: 3,
      texto: "Un punto. Pequeñito, pero hace falta.",
      firma: "Está entre las dos.",
      puntos: Array.from({ length: 10 }, (_, i) => {
        const t = (i / 10) * Math.PI * 2;
        return [0.5 + Math.cos(t) * 0.022, 0.70 + Math.sin(t) * 0.022];
      }),
    },
    {
      nombre: "la eme",
      cerrada: false,
      hilo: 1,
      texto: "Y una eme. Ya está la firma entera.",
      firma: "y punto m. Nosotros.",
      puntos: [[0.56, 0.72], [0.56, 0.26], [0.64, 0.46], [0.72, 0.26], [0.72, 0.72]],
    },
  ],

  /* ---- LOS HILOS ------------------------------------------------------- */
  hilos: [
    { nombre: "rojo",   color: "#c03a52", claro: "#e8677c" },
    { nombre: "rosa",   color: "#e07a9c", claro: "#f7a8c2" },
    { nombre: "verde",  color: "#5c9a6a", claro: "#8fc99c" },
    { nombre: "dorado", color: "#c99a3a", claro: "#f0c468" },
    { nombre: "azul",   color: "#4a72a8", claro: "#86a8d8" },
  ],

  /* ---- CÓMO SE BORDA --------------------------------------------------- */
  largoPunto: 15,        // px que mide cada puntada
  margenAguja: 30,       // cómo de cerca hay que pasar del trazo marcado

  /* ---- AL TERMINAR ------------------------------------------------------ */
  alAcabar: {
    texto: "Ya está. Lo has bordado tú entero.",
    firma: "Esto no se deshace. Los bordados no se deshacen.",
  },
};

/* ══════════════════════════════════════════════════════════════════════
   La maquinaria.
   ══════════════════════════════════════════════════════════════════════ */

const mundo  = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const zona   = document.getElementById("toque");
const elPie  = document.getElementById("pie");
const elHilos = document.getElementById("hilos");
const ctx    = lienzo.getContext("2d", { alpha: false });

const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
const azar  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

let A = 0, H = 0, dpr = 1;
let cx = 0, cy = 0, R = 0;       // el aro del bastidor

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width  = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R = Math.min(A * 0.40, H * 0.27);
  cx = A / 2;
  cy = H * 0.42;
}
new ResizeObserver(medir).observe(mundo);

/** De coordenadas de la figura (0..1) a píxeles dentro del aro. */
function aPixel(p) {
  const lado = R * 1.5;
  return { x: cx + (p[0] - 0.5) * lado, y: cy + (p[1] - 0.5) * lado };
}

/* ---- Las puntadas --------------------------------------------------------
   Cada figura se parte en puntadas de largo fijo. Una puntada se da
   cuando el dedo pasa cerca de ella, y queda dada para siempre.        */

const puntadas = [];

function prepararPuntadas() {
  puntadas.length = 0;
  CONF.figuras.forEach((f, fi) => {
    const pts = f.puntos.slice();
    if (f.cerrada) pts.push(f.puntos[0]);
    let anterior = null;
    for (const p of pts) {
      if (p === null) { anterior = null; continue; }   // levantar la aguja
      const q = aPixel(p);
      if (anterior) repartir(anterior, q, fi, f.hilo);
      anterior = q;
    }
  });
}

function repartir(a, b, figura, hilo) {
  const d = Math.hypot(b.x - a.x, b.y - a.y);
  const n = Math.max(1, Math.round(d / CONF.largoPunto));
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n;
    puntadas.push({
      x0: a.x + (b.x - a.x) * t0, y0: a.y + (b.y - a.y) * t0,
      x1: a.x + (b.x - a.x) * t1, y1: a.y + (b.y - a.y) * t1,
      figura, hilo,
      dada: false, crece: 0,
      /* Ni una puntada es igual que otra: un bordado a mano tiene
         siempre un poco de temblor, y sin él parece impreso. */
      tiembla: azar(-1.6, 1.6),
      giro: azar(-0.09, 0.09),
    });
  }
}

/* ---- Bordar --------------------------------------------------------------- */

let hiloElegido = 0;
let bordando = false;

function enPantalla(e) {
  const r = mundo.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

zona.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  zona.setPointerCapture(e.pointerId);
  bordando = true;
  mundo.classList.add("is-bordando");
  pasar(enPantalla(e));
});

zona.addEventListener("pointermove", (e) => {
  const p = enPantalla(e);
  aguja.x = p.x; aguja.y = p.y; aguja.dentro = true;
  if (bordando) pasar(p);
});

function soltar() {
  bordando = false;
  aguja.dentro = false;
}
zona.addEventListener("pointerup", soltar);
zona.addEventListener("pointercancel", soltar);
zona.addEventListener("pointerleave", () => { aguja.dentro = false; });

const aguja = { x: -999, y: -999, dentro: false };

function pasar(p) {
  aguja.x = p.x; aguja.y = p.y; aguja.dentro = true;
  let algo = false;
  for (const s of puntadas) {
    if (s.dada) continue;
    const mx = (s.x0 + s.x1) / 2, my = (s.y0 + s.y1) / 2;
    if (Math.hypot(mx - p.x, my - p.y) > CONF.margenAguja) continue;
    s.dada = true;
    s.hilo = hiloElegido;
    s.crece = 0.001;
    algo = true;
    dadas++;
  }
  if (algo) {
    pinchazo();
    mirarFiguras();
  }
}

/* ---- Los hilos ------------------------------------------------------------- */

CONF.hilos.forEach((h, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "bd-hilo" + (i === 0 ? " is-elegido" : "");
  b.style.background = `linear-gradient(170deg, ${h.claro}, ${h.color})`;
  b.style.color = h.color;
  b.setAttribute("aria-label", `Hilo ${h.nombre}`);
  b.addEventListener("click", () => {
    hiloElegido = i;
    [...elHilos.children].forEach((c, k) => c.classList.toggle("is-elegido", k === i));
    decir(`Hilo ${h.nombre}.`);
    colorines++;
    mirarSecretos();
  });
  elHilos.append(b);
});

/* ---- Contar y decir --------------------------------------------------------- */

let dadas = 0;
const hechas = new Set();

function mirarFiguras() {
  CONF.figuras.forEach((f, fi) => {
    if (hechas.has(fi)) return;
    const suyas = puntadas.filter((s) => s.figura === fi);
    if (suyas.some((s) => !s.dada)) return;
    hechas.add(fi);
    decir(f.texto, f.firma, true);
    campana(523 + hechas.size * 90);
    if (hechas.size === CONF.figuras.length) {
      setTimeout(() => {
        decir(CONF.alAcabar.texto, CONF.alAcabar.firma, true);
        firma = 0.001;
        campana(880);
      }, 2400);
    }
  });
  mirarSecretos();
}

let pidiendo = null;
let bloqueado = 0;

function decir(texto, firma2, importante) {
  const ahora = performance.now();
  if (!importante && ahora < bloqueado) return;
  if (pidiendo === texto) return;
  pidiendo = texto;
  if (importante) bloqueado = ahora + 4000;
  elPie.classList.remove("is-visible");
  setTimeout(() => {
    elPie.textContent = texto;
    if (firma2) {
      const em = document.createElement("em");
      em.textContent = firma2;
      elPie.append(em);
    }
    elPie.classList.add("is-visible");
  }, suave ? 10 : 270);
}

/* ---- Sonido ----------------------------------------------------------------- */

let audio = null;
let ultimoPinchazo = 0;

function pinchazo() {
  const ahora = performance.now();
  if (ahora - ultimoPinchazo < 70) return;
  ultimoPinchazo = ahora;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime;
    /* La aguja entrando en la tela: un roce cortísimo y agudo. */
    const n = Math.floor(audio.sampleRate * 0.03);
    const buf = audio.createBuffer(1, n, audio.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) {
      const k = i / n;
      d[i] = (Math.random() * 2 - 1) * Math.sin(k * Math.PI) * 0.9;
    }
    const src = audio.createBufferSource();
    src.buffer = buf;
    const f = audio.createBiquadFilter();
    f.type = "highpass";
    f.frequency.value = 3200;
    const g = audio.createGain();
    g.gain.value = 0.09;
    src.connect(f).connect(g).connect(audio.destination);
    src.start(t);
  } catch { /* sin sonido se borda igual */ }
}

function campana(hz) {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(hz, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.08, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + 1.5);
  } catch { /* nada */ }
}

/* ══════════════════════════════════════════════════════════════════════
   LOS SECRETOS
   ══════════════════════════════════════════════════════════════════════ */

/* 1. Al acabarlo todo, aparece bordada una fecha diminuta en el canto de
      abajo, como firman los bordados de verdad.                        */
let firma = 0;

/* 2. Usar los cinco hilos: la tela se tiñe un poco de cada color, como
      si se hubieran destreñido.                                       */
let colorines = 0;
const usados = new Set();
let destenyido = 0;

/* 3. Bordar dando vueltas por FUERA del dibujo (donde no hay nada
      marcado): a las tres vueltas sale un rulito de hilo suelto que se
      queda ahí colgando.                                              */
const sueltos = [];
let fueraSeguidas = 0;

function mirarSecretos() {
  usados.add(hiloElegido);
  if (usados.size >= CONF.hilos.length && destenyido <= 0) {
    destenyido = 0.001;
    decir("Has usado los cinco.", "La tela se ha teñido un poco de todos. Mejor así.", true);
    campana(392);
  }
}

zona.addEventListener("pointermove", (e) => {
  if (!bordando) { fueraSeguidas = 0; return; }
  const p = enPantalla(e);
  /* ¿Está lejos de TODA puntada sin dar? Entonces está bordando al aire. */
  let cerca = false;
  for (const s of puntadas) {
    const mx = (s.x0 + s.x1) / 2, my = (s.y0 + s.y1) / 2;
    if (Math.hypot(mx - p.x, my - p.y) < CONF.margenAguja * 1.6) { cerca = true; break; }
  }
  const dentroAro = Math.hypot(p.x - cx, p.y - cy) < R * 0.9;
  if (!cerca && dentroAro) {
    fueraSeguidas++;
    if (fueraSeguidas === 90) {
      sueltos.push({ x: p.x, y: p.y, hilo: hiloElegido, f: Math.random() * 6.283, largo: azar(18, 34) });
      if (sueltos.length > 8) sueltos.shift();
      decir("Se te ha quedado un hilo suelto.", "Déjalo. A mí me gusta que se note la mano.", true);
      campana(659);
      fueraSeguidas = 0;
    }
  } else {
    fueraSeguidas = 0;
  }
});

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */

let t0 = performance.now();
let reloj = 0;
let preparado = false;

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A || !H) return;
  if (!preparado) { prepararPuntadas(); preparado = true; }

  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.5) dt = 1 / 60;
  else if (dt > 0.1) dt = 0.1;
  reloj += dt;

  for (const s of puntadas) if (s.crece > 0 && s.crece < 1) s.crece = Math.min(1, s.crece + dt * 5);
  if (destenyido > 0) destenyido = Math.min(1, destenyido + dt * 0.4);
  if (firma > 0) firma = Math.min(1, firma + dt * 0.35);

  dibujar(dt);
}

function dibujar(dt) {
  /* --- la mesa --- */
  ctx.fillStyle = "#d0b8a0";
  ctx.fillRect(0, 0, A, H);
  const fondo = ctx.createLinearGradient(0, 0, 0, H);
  fondo.addColorStop(0, "rgba(242, 230, 214, 0.9)");
  fondo.addColorStop(0.55, "rgba(208, 184, 160, 0.4)");
  fondo.addColorStop(1, "rgba(150, 122, 100, 0.5)");
  ctx.fillStyle = fondo;
  ctx.fillRect(0, 0, A, H);

  /* --- la sombra del bastidor --- */
  ctx.fillStyle = "rgba(90, 64, 44, 0.22)";
  ctx.beginPath();
  ctx.ellipse(cx + R * 0.06, cy + R * 0.1, R * 1.06, R * 1.02, 0, 0, 6.283);
  ctx.fill();

  /* --- la tela --- */
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.96, 0, 6.283);
  ctx.clip();

  ctx.fillStyle = "#f6efdf";
  ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
  /* La trama del lino: dos rejillas finísimas. Es lo que hace que se vea
     TELA y no papel. */
  const paso = Math.max(3, R * 0.022);
  ctx.strokeStyle = "rgba(180, 160, 130, 0.35)";
  ctx.lineWidth = 1;
  for (let x = cx - R; x < cx + R; x += paso) {
    ctx.beginPath(); ctx.moveTo(x, cy - R); ctx.lineTo(x, cy + R); ctx.stroke();
  }
  for (let y = cy - R; y < cy + R; y += paso) {
    ctx.beginPath(); ctx.moveTo(cx - R, y); ctx.lineTo(cx + R, y); ctx.stroke();
  }

  /* El teñido del secreto 2. */
  if (destenyido > 0) {
    for (let i = 0; i < CONF.hilos.length; i++) {
      const a = (i / CONF.hilos.length) * 6.283 + reloj * 0.04;
      const gx = cx + Math.cos(a) * R * 0.55;
      const gy = cy + Math.sin(a) * R * 0.55;
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, R * 0.8);
      g.addColorStop(0, hexA(CONF.hilos[i].claro, 0.1 * destenyido));
      g.addColorStop(1, hexA(CONF.hilos[i].claro, 0));
      ctx.fillStyle = g;
      ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    }
  }

  /* --- el dibujo marcado a lápiz --- */
  ctx.setLineDash([3, 5]);
  ctx.strokeStyle = "rgba(140, 118, 96, 0.5)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (const s of puntadas) {
    if (s.dada) continue;
    ctx.moveTo(s.x0, s.y0);
    ctx.lineTo(s.x1, s.y1);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  /* --- las puntadas dadas --- */
  ctx.lineCap = "round";
  for (const s of puntadas) {
    if (!s.dada) continue;
    const h = CONF.hilos[s.hilo];
    const k = s.crece;
    const mx = (s.x0 + s.x1) / 2, my = (s.y0 + s.y1) / 2;
    const dx = (s.x1 - s.x0) * 0.5 * k, dy = (s.y1 - s.y0) * 0.5 * k;
    /* El temblor y el giro propios de cada puntada. */
    const nx = -(s.y1 - s.y0), ny = (s.x1 - s.x0);
    const nl = Math.hypot(nx, ny) || 1;
    const ox = nx / nl * s.tiembla, oy = ny / nl * s.tiembla;

    /* La sombra del hilo sobre la tela: un hilo tiene grosor y pesa. */
    ctx.strokeStyle = "rgba(90, 66, 44, 0.16)";
    ctx.lineWidth = 4.6;
    ctx.beginPath();
    ctx.moveTo(mx - dx + ox + 1, my - dy + oy + 1.4);
    ctx.lineTo(mx + dx + ox + 1, my + dy + oy + 1.4);
    ctx.stroke();

    ctx.strokeStyle = h.color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(mx - dx + ox, my - dy + oy);
    ctx.lineTo(mx + dx + ox, my + dy + oy);
    ctx.stroke();

    /* Y el brillo del hilo de algodón, una raya más fina y clara encima
       y un poco desplazada. */
    ctx.strokeStyle = h.claro;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(mx - dx * 0.75 + ox - 0.6, my - dy * 0.75 + oy - 0.8);
    ctx.lineTo(mx + dx * 0.75 + ox - 0.6, my + dy * 0.75 + oy - 0.8);
    ctx.stroke();
  }

  /* --- los hilos sueltos (secreto 3) --- */
  for (const s of sueltos) {
    const h = CONF.hilos[s.hilo];
    ctx.strokeStyle = h.color;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    for (let i = 1; i <= 6; i++) {
      const t = i / 6;
      ctx.lineTo(
        s.x + Math.sin(reloj * 1.2 + s.f + t * 5) * 9 * t,
        s.y + t * s.largo);
    }
    ctx.stroke();
  }

  /* --- la firma del secreto 1 --- */
  if (firma > 0) {
    ctx.globalAlpha = firma * 0.85;
    ctx.strokeStyle = CONF.hilos[3].color;
    ctx.lineWidth = 1.8;
    ctx.lineCap = "round";
    /* Escrita a puntaditas: una raya corta por cada trocito. */
    const texto = "y.m";
    ctx.font = `600 ${Math.round(R * 0.13)}px Georgia, serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = CONF.hilos[3].color;
    ctx.fillText(texto, cx, cy + R * 0.62);
    ctx.font = `400 ${Math.round(R * 0.055)}px ui-sans-serif, system-ui, sans-serif`;
    ctx.fillStyle = "rgba(160, 120, 40, 0.8)";
    ctx.fillText("hecho a mano", cx, cy + R * 0.73);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  /* --- el aro --- */
  const aro = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  aro.addColorStop(0, "#c49a68");
  aro.addColorStop(0.45, "#9a6f42");
  aro.addColorStop(1, "#6b4526");
  ctx.strokeStyle = aro;
  ctx.lineWidth = R * 0.085;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.99, 0, 6.283);
  ctx.stroke();
  ctx.strokeStyle = "rgba(255, 228, 190, 0.28)";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.arc(cx, cy, R * 0.96, 0, 6.283);
  ctx.stroke();

  /* El tornillo de arriba del aro. */
  ctx.fillStyle = "#8f7048";
  ctx.fillRect(cx - R * 0.09, cy - R * 1.12, R * 0.18, R * 0.16);
  ctx.fillStyle = "#c9ab7c";
  ctx.beginPath();
  ctx.arc(cx, cy - R * 1.04, R * 0.035, 0, 6.283);
  ctx.fill();

  /* --- la aguja --- */
  if (aguja.dentro) dibujarAguja();
}

function dibujarAguja() {
  const h = CONF.hilos[hiloElegido];
  const x = aguja.x, y = aguja.y;
  const L = Math.max(22, R * 0.2);
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.85);
  /* La aguja: una raya plateada con punta. */
  const g = ctx.createLinearGradient(0, 0, 0, -L);
  g.addColorStop(0, "#f2f4f6");
  g.addColorStop(0.5, "#a8b0b6");
  g.addColorStop(1, "#e2e6ea");
  ctx.strokeStyle = g;
  ctx.lineWidth = 2.4;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -L);
  ctx.stroke();
  /* El ojo. */
  ctx.strokeStyle = "#8f979c";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(0, -L * 0.86, 1.6, 3.4, 0, 0, 6.283);
  ctx.stroke();
  /* Y el hilo enhebrado, colgando. */
  ctx.strokeStyle = h.color;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(0, -L * 0.86);
  for (let i = 1; i <= 5; i++) {
    const t = i / 5;
    ctx.lineTo(Math.sin(reloj * 3 + t * 4) * 5 * t, -L * 0.86 - t * L * 0.8);
  }
  ctx.stroke();
  ctx.restore();
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ---- Arranque ---------------------------------------------------------------- */

medir();
decir("Está marcado a lápiz. Pasa el dedo por encima y se borda solo.");
requestAnimationFrame(paso);

})();
</script>
