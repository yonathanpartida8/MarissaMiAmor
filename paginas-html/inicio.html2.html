<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  inicio.html2 — LA SEGUNDA PÁGINA DEL LIBRITO.
  Es tuya: cámbiala entera o pega aquí tu propio HTML. Justo después
  viene el candado: sin la fecha no se puede pasar de ahí.
-->
<title>Antes de abrirlo</title>
<script src="sonido-libro.js"></script>
<style>
  :root{
    --rosa: var(--acento, #ffa9bf);
    --letra: var(--texto, #3d2a2b);
    --papel: #fffaf8;
    --sombra: rgba(120, 32, 62, .28);
    --subida: -70%;          /* cuánto sale la cartita del sobre */
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: safe center;
    gap: 1rem;
    padding: 1.4rem 1.2rem calc(var(--hueco-barra, 0rem) + 1.4rem);
    text-align: center;
    font-family: var(--tipo, Georgia, "Times New Roman", serif);
    color: var(--letra);
    overflow-x: hidden;
    background:
      radial-gradient(120% 55% at 50% -10%,
        color-mix(in srgb, var(--rosa) 28%, #fff) 0%, transparent 62%),
      var(--papel);
  }

  /* ---------- corazones flotando de fondo ---------- */
  .corazones{
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none; overflow: hidden;
  }
  .corazones span{
    position: absolute; bottom: -3rem;
    color: var(--rosa);
    animation: subir linear infinite;
    will-change: transform;
  }
  @keyframes subir{
    from{ transform: translate3d(0, 0, 0) rotate(-10deg); }
    to  { transform: translate3d(0, -115svh, 0) rotate(24deg); }
  }

  main{
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 1rem; width: 100%;
  }

  h1{
    margin: 0;
    font-family: var(--tipo-titulo, Georgia, serif);
    font-weight: 400;
    font-size: clamp(1.7rem, 8.5vw, 2.5rem);
    line-height: 1.1;
    letter-spacing: .01em;
  }

  .intro{
    margin: 0;
    max-width: 32ch;
    font-size: clamp(1rem, 4.2vw, 1.15rem);
    line-height: 1.55;
    opacity: .8;
  }

  /* ---------- escena del sobre ---------- */
  .escena{
    position: relative;
    width: min(80vw, 320px);
    height: min(80vw, 330px);   /* deja aire arriba para la cartita */
    display: grid;
    align-items: end;
    justify-items: center;
    margin-block: .3rem;
  }

  .sobre{
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    cursor: pointer;
    perspective: 1100px;
    border-radius: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  .sobre:focus-visible{
    outline: 2px solid color-mix(in srgb, var(--rosa) 80%, #c2335f);
    outline-offset: 8px;
  }

  /* ---- la cartita ---- */
  .carta{
    position: absolute;
    left: 7%; right: 7%; bottom: 8%; height: 82%;
    z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    gap: .35rem;
    padding: 12% .7rem .6rem;
    border-radius: 10px;
    background: linear-gradient(165deg, #fffdfc 0%, #fff0f4 100%);
    box-shadow: 0 -8px 20px -12px var(--sombra);
    transition: transform .85s cubic-bezier(.22,.9,.28,1.02) .45s,
                box-shadow .6s ease .45s;
  }
  .sobre.abierto .carta{
    transform: translateY(var(--subida));
    box-shadow: 0 -16px 32px -16px var(--sombra),
                0 12px 26px -20px rgba(0,0,0,.4);
  }
  .carta::before{
    content: "";
    position: absolute; inset: .35rem;
    border: 1px solid color-mix(in srgb, var(--rosa) 45%, #fff);
    border-radius: 7px;
    opacity: .7;
    pointer-events: none;
  }
  .carta .corazon{
    font-size: 1.5rem; line-height: 1; color: #d9426b;
    animation: latir 2.6s ease-in-out infinite;
  }
  @keyframes latir{
    0%, 100%{ transform: scale(1); }
    16%     { transform: scale(1.18); }
    32%     { transform: scale(1); }
    48%     { transform: scale(1.1); }
  }
  .carta .frase{
    margin: 0;
    font-size: .82rem;
    line-height: 1.4;
    font-style: italic;
    max-width: 20ch;
    opacity: .78;
  }

  /* ---- frente del sobre ---- */
  .frente{
    position: absolute; inset: 0;
    z-index: 2;
    border-radius: 14px;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--rosa) 64%, #fff) 0%,
      color-mix(in srgb, var(--rosa) 82%, #fff) 100%);
    box-shadow: 0 18px 38px -20px var(--sombra),
                inset 0 1px 0 rgba(255,255,255,.55);
    overflow: hidden;
  }
  /* pliegue en V del bolsillo, sutil */
  .frente::after{
    content: "";
    position: absolute; inset: 0;
    background: rgba(255,255,255,.22);
    clip-path: polygon(0 0, 50% 46%, 100% 0, 100% 100%, 0 100%);
  }

  /* ---- solapa ---- */
  .solapa{
    position: absolute; left: 0; right: 0; top: 0; height: 64%;
    z-index: 3;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 14px 14px 0 0;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--rosa) 56%, #fff) 0%,
      color-mix(in srgb, var(--rosa) 84%, #fff) 100%);
    transform-origin: top center;
    backface-visibility: hidden;
    transition: transform .5s cubic-bezier(.6,.05,.3,1);
  }
  .sobre.abierto .solapa{ transform: rotateX(-180deg); }

  /* ---- sello de cera ---- */
  .sello{
    position: absolute;
    left: 50%; top: 64%;
    translate: -50% -50%;
    z-index: 4;
    width: 2.4rem; height: 2.4rem;
    display: grid; place-items: center;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 28%, #ff9ab6, #d9426b 72%);
    color: #fff; font-size: .95rem; line-height: 1;
    box-shadow: 0 5px 12px -4px rgba(140,20,60,.6),
                inset 0 -2px 5px rgba(0,0,0,.18);
    transition: opacity .3s ease, transform .5s cubic-bezier(.34,1.4,.5,1);
    animation: pulso 2.6s ease-in-out infinite;
  }
  @keyframes pulso{
    0%, 100%{ box-shadow: 0 5px 12px -4px rgba(140,20,60,.6),
                          inset 0 -2px 5px rgba(0,0,0,.18),
                          0 0 0 0 color-mix(in srgb, var(--rosa) 55%, transparent); }
    55%     { box-shadow: 0 5px 12px -4px rgba(140,20,60,.6),
                          inset 0 -2px 5px rgba(0,0,0,.18),
                          0 0 0 12px color-mix(in srgb, var(--rosa) 0%, transparent); }
  }
  .sobre.abierto .sello{
    opacity: 0;
    transform: scale(.35) rotate(-28deg);
    animation: none;
    pointer-events: none;
  }

  /* ---------- la nota con la pista ---------- */
  .nota{
    margin: 0;
    max-width: 34ch;
    font-size: clamp(.92rem, 4vw, 1.05rem);
    line-height: 1.6;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .8s ease 1.1s,
                transform .8s cubic-bezier(.22,.9,.3,1) 1.1s;
    pointer-events: none;
  }
  .nota.visible{ opacity: 1; transform: none; }

  .clave{
    display: block;
    margin-top: .7rem;
    padding: .55rem .75rem;
    border-radius: 10px;
    border: 1px dashed color-mix(in srgb, var(--rosa) 62%, #fff);
    background: color-mix(in srgb, var(--rosa) 16%, #fff);
    color: #c2335f;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: .92em;
    letter-spacing: .04em;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  small{
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .5;
    transition: opacity .5s ease;
  }

  /* ---------- accesibilidad de movimiento ---------- */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

  <div class="corazones" aria-hidden="true"></div>

  <main>
    <h1>Antes de abrirlo…</h1>

    <p class="intro">
      El librito está cerrado con un candadito.
      Sólo tú sabes la fecha que lo abre.
    </p>

    <div class="escena">
      <div class="sobre" role="button" tabindex="0"
           aria-expanded="false" aria-label="Abrir la cartita">

        <div class="carta" aria-hidden="true">
          <span class="corazon">♥</span>
          <p class="frase">Sólo tú puedes abrirlo.</p>
        </div>

        <div class="frente" aria-hidden="true"></div>
        <div class="solapa" aria-hidden="true"></div>
        <div class="sello"  aria-hidden="true">♥</div>
      </div>
    </div>

    <p class="nota" role="status">
      Pista: no hay pista. Tú, literalmente, eres la única que sabe abrirlo.
      Sin la clave no se deja ver.
      <span class="clave">
        Bueno… te dejo la pista:<br>
        《 &lt;÷@/=! $÷"^! #÷ "&lt;?](÷ ?÷@ 》
      </span>
    </p>

    <small class="pista-mano">toca el sobre</small>
  </main>

<script>
  const sobre  = document.querySelector(".sobre");
  const nota   = document.querySelector(".nota");
  const pista  = document.querySelector(".pista-mano");
  const capa   = document.querySelector(".corazones");
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* --- corazones flotando --- */
  if (!quieto) {
    for (let i = 0; i < 16; i++) {
      const c = document.createElement("span");
      c.textContent = "♥";
      c.style.left            = (Math.random() * 100).toFixed(1) + "%";
      c.style.fontSize        = (0.55 + Math.random() * 0.9).toFixed(2) + "rem";
      c.style.opacity         = (0.08 + Math.random() * 0.16).toFixed(2);
      c.style.animationDuration = (8 + Math.random() * 8).toFixed(1) + "s";
      c.style.animationDelay    = (-Math.random() * 16).toFixed(1) + "s";
      capa.appendChild(c);
    }
  }

  /* --- abrir el sobre (una sola vez) --- */
  let abierto = false;

  function abrir() {
    if (abierto) return;
    abierto = true;

    sobre.classList.add("abierto");
    sobre.setAttribute("aria-expanded", "true");
    sobre.setAttribute("aria-label", "Cartita abierta");

    pista.textContent = "ahora desliza →";

    setTimeout(() => nota.classList.add("visible"), 1300);
  }

  sobre.addEventListener("click", abrir);
  sobre.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
      e.preventDefault();
      abrir();
    }
  });
</script>
</body>
</html>
