<!--
  EL RINCÓN DE ARENA — una islita de noche, toda en pixel art.

  · La palita sólo escarba si la ARRASTRAS y la mueves sobre la arena.
    Con el dedo solo no se puede. Y cuesta un poquito: hay que tallar.
  · Enterradas hay 6 cartitas con piropos, una llave, un cofre (en la X)
    y cuatro tesoritos más. Todo se arrastra: las cartitas a la canasta,
    la llave hasta el cofre para abrir el tesoro.
  · La luna explota si la tocas (y se vuelve a armar). Hay barquitos de
    papel y tiburones en el mar, palmeras y un faro que se mueven, lluvia
    con rayos, un cangrejito que platica y 7 secretos escondidos.
  · Cuando la luz del faro alumbra un barquito suena
    «musica arena/musica1.mp3» (si no está, una cajita de música).
    La luz también se puede arrastrar desde la lamparita.

  Los textos están todos juntos al principio del <script>.
-->
<style>
:root{
  --seg-t:var(--seguro-arriba,env(safe-area-inset-top,0px));
  --seg-b:var(--seguro-abajo,env(safe-area-inset-bottom,0px));
  --barra:var(--hueco-barra,0rem);
  --tinta:#3a1f3d;--papel:#fff6ea;--rosa:#ff5f95;--oro:#ffd166;--lila:#b99cff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0!important;width:100%;height:100%;overflow:hidden;background:#170f33;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:"Pixelify Sans",ui-monospace,Menlo,monospace;color:var(--tinta)}
#lienzo{position:absolute;left:0;top:0;display:block;touch-action:none;
  image-rendering:crisp-edges;image-rendering:pixelated}
#ui{position:absolute;inset:0;pointer-events:none;z-index:2}
#medida,#medidaT{position:absolute;left:0;width:1px;visibility:hidden;pointer-events:none}
#medida{bottom:0;height:calc(var(--barra) + var(--seg-b))}
#medidaT{top:0;height:var(--seg-t)}
.oculto{display:none!important}

/* ── la caja pixel: esquinas mordidas, como en los juegos de antes ── */
.px{background:var(--papel);color:var(--tinta);margin:4px;
  box-shadow:0 -4px 0 0 var(--tinta),0 4px 0 0 var(--tinta),-4px 0 0 0 var(--tinta),4px 0 0 0 var(--tinta),
    inset 0 -4px 0 0 #f0cdbf,inset 0 4px 0 0 #fff}
.boton{appearance:none;border:0;font:inherit;font-size:15px;padding:6px 12px;cursor:pointer;
  pointer-events:auto;color:var(--tinta);background:#ffe3ec;line-height:1.1}
.boton:active{transform:translateY(2px);box-shadow:0 -4px 0 0 var(--tinta),0 2px 0 0 var(--tinta),-4px 0 0 0 var(--tinta),4px 0 0 0 var(--tinta),inset 0 4px 0 0 #f0b7c9}
.boton.ancho{display:block;width:calc(100% - 8px);margin-top:14px;background:#ffd1e1}

.hud{position:absolute;top:calc(var(--seg-t) + 10px);left:10px;right:10px;display:flex;gap:6px;align-items:center}
.hud .boton{font-size:17px;padding:4px 8px}
.chip{font-size:13px;padding:4px 8px;white-space:nowrap}
.chip b{color:var(--rosa)}
.chip.brinca{animation:brinca .5s steps(5)}
.hud .hueco{flex:1}
#bMus{background:#fff2b3;animation:late 1s steps(2) infinite}
@keyframes late{50%{transform:scale(1.12)}}
@keyframes brinca{30%{transform:translateY(-6px)}60%{transform:translateY(2px)}}

.titulo{position:absolute;left:50%;top:calc(var(--seg-t) + 22%);transform:translate(-50%,-50%);width:92%;text-align:center;
  color:#fff;transition:opacity 1.2s steps(6);text-shadow:3px 0 var(--tinta),-3px 0 var(--tinta),0 3px var(--tinta),0 -3px var(--tinta),4px 4px #c2406a}
.titulo h1{margin:0;font-size:clamp(26px,8vw,44px);font-weight:700;letter-spacing:.02em}
.titulo p{margin:.4em 0 0;font-size:clamp(14px,4vw,18px)}
.titulo.fuera{opacity:0}

.dialogo{position:absolute;left:50%;top:calc(var(--seg-t) + 56px);transform:translateX(-50%);
  width:min(calc(100% - 28px),30rem);display:flex;gap:10px;align-items:flex-start;padding:9px 12px 10px;
  pointer-events:auto;animation:asoma .3s steps(3)}
@keyframes asoma{from{transform:translate(-50%,-10px);opacity:0}}
.dialogo canvas{width:52px;height:36px;flex:none;image-rendering:pixelated;background:#ffe3ec;
  box-shadow:0 0 0 3px #f5b3c8}
.dialogo b{display:block;font-size:12px;color:#c2406a;letter-spacing:.05em;font-weight:600}
.dialogo p{margin:2px 0 0;font-size:15px;line-height:1.32;min-height:2.64em}
.dialogo .sigue{position:absolute;right:10px;bottom:4px;font-size:10px;font-style:normal;color:#c2406a;animation:late 1s steps(2) infinite}

.toast{position:absolute;left:50%;bottom:calc(var(--barra) + var(--seg-b) + 14px);transform:translate(-50%,30px);
  padding:6px 12px;font-size:14px;opacity:0;white-space:nowrap;max-width:calc(100% - 28px);overflow:hidden;text-overflow:ellipsis;

.toast.ver{opacity:1;transform:translate(-50%,0)}

.flota{position:absolute;transform:translate(-50%,-100%);font-size:14px;color:#fff;white-space:nowrap;pointer-events:none;

@keyframes sube{0%{opacity:0;margin-top:6px}10%{opacity:1}75%{opacity:1}100%{opacity:0;margin-top:-34px}}

.modal{position:absolute;inset:0;background:rgba(23,12,42,.62);pointer-events:auto;display:flex;align-items:center;justify-content:center;

.recuerdos{display:grid;gap:10px;margin:6px 0 10px}
.recuerdo{margin:4px;padding:8px 10px;background:#fff;display:flex;gap:10px;align-items:center;opacity:0;animation:aparece .4s steps(4) forwards;animation-delay:calc(var(--i) * .35s + .2s)}
.recuerdo span{font-size:22px;color:var(--rosa)}
.recuerdo p{margin:0;font-size:14px}
@keyframes aparece{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tesoro .grande{font-size:19px;text-align:center;color:#c2406a;margin-top:12px;opacity:0;animation:aparece .5s steps(4) 1.8s forwards}

.pista{font-size:13px!important;color:#7a4fc0;background:#f1e8ff;padding:6px 8px}
.fila{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px}
.fila .boton{font-size:14px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:4px 0}
.casilla{appearance:none;border:0;font:inherit;font-size:24px;padding:6px 0 2px;pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.casilla small{font-size:11px;color:#c2406a;min-height:1em}
.leer{min-height:3.2em;background:#fff;padding:8px;margin-top:10px!important}
textarea{width:100%;font:inherit;font-size:16px;padding:8px;border:0;background:#fff;color:var(--tinta);resize:none;
  box-shadow:0 0 0 3px var(--tinta);-webkit-user-select:text;user-select:text;margin:6px 0 2px}
</style>
</head>

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

}

function R(x, y, w, h, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); }
function P(x, y, c) { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), 1, 1); }

}
function elipse(cx, cy, rx, ry, c) {
  cx = Math.round(cx); cy = Math.round(cy); ry = Math.max(1, Math.round(ry)); g.fillStyle = c;

}

  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);

    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function degradado(ctx, w, h, paradas, pasos = 5) {

  const pts = [[x0, rnd(SEGT + 4, HZ * 0.25)]];
  let x = x0, y = pts[0][1];
  const fin = rnd(HZ + 4, SY - 6);
  while (y < fin) { y = Math.min(fin, y + rnd(4, 9)); x += rnd(-6, 6); pts.push([x, y]); }
  const ramas = [];
  for (let k = 0; k < 2; k++) {
    const i = 1 + Math.floor(rnd(pts.length - 2)); let [bx, by] = pts[i]; const r = [[bx, by]], dir = Math.random() < 0.5 ? -1 : 1;
    for (let n = 0; n < 3; n++) { bx += dir * rnd(3, 7); by += rnd(3, 7); r.push([bx, by]); }
    ramas.push(r);
  }
  rayo = { pts, ramas, t: 0 }; destello = 0.75;
  setTimeout(() => Son.trueno(rnd(0.7, 1)), rnd(150, 600));
  const [ex, ey] = pts[pts.length - 1]; chispas(ex, ey, 12, ["#dfe9ff", "#ffffff"], 40);
}
function tocarFaro() {
  faro.toques = t - faro.tToque < 1.4 ? faro.toques + 1 : 1; faro.tToque = t;
  Son.clic(); chispas(LX, LY, 6, ["#fff3b0", "#ffd166"], 25);
  if (faro.toques >= 5) {
    faro.toques = 0; faro.rosa = 20;
    if (secreto("faro")) decir(D.faroRosa); else flotar("💗 faro rosita 💗", LX, LY - 8);
    corazones(LX, LY, 10, 30);

}
function caerCoco(p) {
  if (p.cocos <= 0) { flotar("ya no hay cocos 🥥", p.tx, p.ty); return; }
  p.cocos--; p.regen = 12;
  const x = p.tx + rnd(-3, 3);
  let suelo = p.y + rnd(4, 18);
  const pega = Math.abs(cangrejo.x - x) < 16;
  if (pega) suelo = cangrejo.y - 4;
  cocos.push({ x, y: p.ty + 3, vx: pega ? (cangrejo.x - x) * 0.8 : rnd(-8, 8), vy: 0, suelo, rebotes: 0, vida: 9, pega });
}
function saltarTiburon(s) {
  if (s.salto >= 0) return;
  s.salto = 0; s.sx = s.x; Son.chapuzon(); chispas(s.x, zyMar(s.f), 10, ["#bfeaf0", "#ffffff"], 30);
}
const zyMar = (f) => HZ + (SY - HZ) * f;

function actualizar(dt) {
  t += dt;
  escribir(dt);
  if (sacudida > 0) sacudida -= dt;
  if (destello > 0) destello -= dt * 1.6;

  // la tormenta
  if (!tormenta.on && t > tormenta.prox) empezarTormenta(false);
  if (tormenta.on && t > tormenta.fin) { tormenta.on = false; tormenta.prox = t + rnd(70, 110); tormenta.arco = t; setTimeout(() => decir(D.calma), 2200); }
  tormenta.nivel = clamp(tormenta.nivel + (tormenta.on ? dt * 0.35 : -dt * 0.3), 0, 1);
  Son.lluvia(tormenta.nivel);
  const cuantas = Math.round(W * 0.8 * tormenta.nivel);
  while (gotas.length < cuantas) gotas.push({ x: rnd(W + 40), y: rnd(-H, 0), v: rnd(150, 210), fin: rnd(HZ, H) });
  if (gotas.length > cuantas) gotas.length = cuantas;
  for (const d of gotas) {
    d.y += d.v * dt; d.x -= d.v * 0.25 * dt;
    if (d.y > d.fin) {
      if (Math.random() < 0.35) parts.push({ x: d.x, y: d.fin, vx: rnd(-12, 12), vy: rnd(-30, -12), g: 120, v: 0.25, m: 0.25, c: "#cfe3ff", k: "p" });
      d.y = rnd(-30, 0); d.x = rnd(W + 40); d.fin = rnd(HZ, H);
    }
  }
  if (tormenta.nivel > 0.6 && (tormenta.rayo -= dt) <= 0) { lanzarRayo(rnd(W * 0.1, W * 0.9)); tormenta.rayo = rnd(2.5, 6); }
  if (rayo && (rayo.t += dt) > 0.5) rayo = null;

  // el cielo
  for (const n of nubes) { n.x += n.v * dt * (1 + tormenta.nivel * 2); if (n.x > W + 30) n.x = -30; if (n.x < -30) n.x = W + 30; }
  if (!fugaz && (proxFugaz -= dt) <= 0) {
    fugaz = { x: rnd(W * 0.35, W * 1.05), y: rnd(SEGT + 4, HZ * 0.35), vx: -rnd(80, 110), vy: rnd(28, 45), v: 1.3 };
    proxFugaz = rnd(9, 18);
  }
  if (fugaz) { fugaz.x += fugaz.vx * dt; fugaz.y += fugaz.vy * dt; if ((fugaz.v -= dt) <= 0) fugaz = null; }
  if (constel > 0) constel -= dt;

  // la luna
  if (luna.estado === "boom") {
    luna.t += dt;
    for (const p of luna.piezas) { const f = Math.pow(0.12, dt); p.vx *= f; p.vy *= f; p.x += p.vx * dt; p.y += p.vy * dt + Math.sin(t * 3 + p.d * 9) * 0.05; }
    if (luna.t > 1.8) { luna.estado = "vuelve"; luna.t = 0; for (const p of luna.piezas) { p.sx = p.x; p.sy = p.y; } }
  } else if (luna.estado === "vuelve") {
    luna.t += dt;
    for (const p of luna.piezas) {
      const k = suave(clamp((luna.t - p.d) / 1.3, 0, 1));
      p.x = lerp(p.sx, p.ox, k) + Math.sin(k * Math.PI) * (p.oy - MY) * 0.6;
      p.y = lerp(p.sy, p.oy, k) - Math.sin(k * Math.PI) * (p.ox - MX) * 0.6;
    }
    if (luna.t > 1.8) { luna.estado = "entera"; luna.piezas = null; chispas(MX, MY, 24, ["#fff4d6", "#ffffff", "#ffd1e3"], 45); destello = 0.3; Son.rearmar(); }
  }

  // el mar
  for (const b of barcos) {
    b.x += b.v * dt; if (b.x > W + 12) { b.x = -12; b.var = (b.var + 1) % 3; }
    b.y = zyMar(b.f) + Math.sin(t * 1.8 + b.fase) * (1 + tormenta.nivel * 1.5);
    if (b.salto > 0) b.salto = Math.max(0, b.salto - dt * 1.8);
  }
  for (const s of tiburones) {
    if (s.salto >= 0) {
      s.salto += dt / 1.1;
      if (s.salto >= 1) { s.salto = -1; s.x = s.sx + s.dir * 30; Son.chapuzon(); chispas(s.x, zyMar(s.f), 12, ["#bfeaf0", "#ffffff"], 32); if (s.corazon) { s.corazon = false; } }
      continue;
    }
    s.x += s.dir * s.v * dt;
    if (s.x > W * 0.72) s.dir = -1; if (s.x < W * 0.04) s.dir = 1;
    if ((s.prox -= dt) <= 0) { s.prox = rnd(14, 28); saltarTiburon(s); }
  }

  // el faro
  faro.fase += dt * 1.1;
  if (faro.rosa > 0) { faro.rosa -= dt; if (Math.random() < dt * 6) { const k = rnd(0.2, 0.9); corazones(LX + Math.cos(faro.phi) * faro.len * k, LY + Math.sin(faro.phi) * faro.len * k, 1, 8); } }
  const agarrado = arr && arr.tipo === "faro";
  if (agarrado) faro.manual = 1; else if (faro.manual > 0) faro.manual -= dt / 3;
  if (faro.manual > 0) {
    const obj = Math.atan2(faro.my - LY, faro.mx - LX);
    faro.phi += difAng(obj, faro.phi) * Math.min(1, dt * 14);
    faro.len = Math.max(28, Math.hypot(faro.mx - LX, faro.my - LY) + 26); faro.I = 1;
  } else {
    const obj = lerp(PHI_A, PHI_B, 0.5 + 0.5 * Math.sin(t * 0.25));
    faro.phi += difAng(obj, faro.phi) * Math.min(1, dt * 2);
    faro.len += (LMAX - faro.len) * Math.min(1, dt * 2);
    faro.I = 0.5 + 0.5 * (0.5 + 0.5 * Math.sin(faro.fase * 2));
  }
  for (const b of barcos) {
    const dx = b.x - LX, dy = b.y - 3 - LY, d = Math.hypot(dx, dy);
    const da = Math.abs(difAng(Math.atan2(dy, dx), faro.phi));
    if (d < faro.len * 0.96 && da < 0.09 + 6 / d && faro.I > 0.55) { b.luz = Math.min(1, b.luz + dt * 4); if (b.luz > 0.5) barcoIluminado(b, faro.manual > 0); }
    else b.luz = Math.max(0, b.luz - dt * 1.2);
  }

  // las palmeras y sus cocos
  for (const p of palmas) {
    const vaiven = Math.sin(t * 0.9 + p.fase) * (0.7 + tormenta.nivel * 2.2) + tormenta.nivel * 2.5;
    p.tx = p.x + p.lean * p.h + vaiven; p.ty = p.y - p.h;
    if (p.cocos < 3 && (p.regen -= dt) <= 0) { p.cocos++; p.regen = 12; }
  }
  for (let i = cocos.length - 1; i >= 0; i--) {
    const c = cocos[i];
    if (c.y < c.suelo || c.vy < 0) {
      c.vy += 260 * dt; c.x += c.vx * dt; c.y += c.vy * dt;
      if (c.y >= c.suelo && c.vy > 0) {
        c.y = c.suelo; Son.coco();
        if (c.pega && c.rebotes === 0 && Math.abs(c.x - cangrejo.x) < 12) {
          cangrejo.aturdido = 2.5; chispas(cangrejo.x, cangrejo.y - 6, 10, ["#fff3b0", "#ffffff"], 30);
          if (secreto("coco")) decir(D.coco); else flotar("¡auch! 🥥", cangrejo.x, cangrejo.y - 10);
        }
        c.rebotes++; c.vy = c.rebotes < 3 ? -c.vy * 0.35 : 0; c.vx *= 0.6;
      }
    } else if ((c.vida -= dt) <= 0) cocos.splice(i, 1);
  }

  else if (cangrejo.pausa > 0) cangrejo.pausa -= dt;

    const dx = cangrejo.destino - cangrejo.x;
    if (Math.abs(dx) < 1) { cangrejo.pausa = rnd(1.5, 5); cangrejo.destino = rnd(W * 0.14, W * 0.7); cangrejo.y = zy(rnd(0.04, 0.3)); }

  }
  if (cangrejo.salta > 0) cangrejo.salta = Math.max(0, cangrejo.salta - dt * 2.5);

  // escarbar: SÓLO con la palita arrastrada y moviéndose
  excavar(dt);
  for (const it of items) { if (it.pop > 0) it.pop = Math.max(0, it.pop - dt * 1.6); if (it.sacude > 0) it.sacude -= dt; if (it.anim > 0 && it.anim < 1) it.anim = Math.min(1, it.anim + dt / 1.2); }
  if (canasta.rebote > 0) canasta.rebote = Math.max(0, canasta.rebote - dt * 2);
  canasta.abierta = arr && arr.tipo === "item" && Math.hypot(zx(arr.obj.fx) - zx(canasta.fx), zy(arr.obj.fy) - (zy(canasta.fy) - 6)) < 18 ? 1 : 0;
  if (castillo && castillo.p < 1) castillo.p = Math.min(1, castillo.p + dt / 1.6);

  // los fuegos del final
  if (fuegos > 0) {
    fuegos -= dt;
    if (Math.random() < dt * 2.6) {
      const x = rnd(W * 0.15, W * 0.85), y = rnd(SEGT + 20, HZ * 0.8), c = ["#ff6fa5", "#ffd166", "#b99cff", "#7ee0c8", "#ffffff"];
      chispas(x, y, 40, [c[Math.floor(rnd(5))], "#ffffff"], 60); Son.fuego();
      if (Math.random() < 0.4) corazones(x, y, 5, 20);
    }
  }

  // las partículas
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.v -= dt;
    if (p.v <= 0) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.4, dt);
  }
  if (parts.length > 700) parts.splice(0, parts.length - 700);

  // una pista si lleva rato sin hacer nada
  if (haTocado && !hablando && modal.classList.contains("oculto") && t - ultimaAccion > 32) { ultimaAccion = t; decir("💡 " + pistaActual()); }

function excavar(dt) {
  const conPala = arr && arr.tipo === "pala";
  if (!conPala) { pala.cav = Math.max(0, pala.cav - dt * 4); return; }
  const r = rastro.filter((p) => t - p[0] < 0.2);
  let vel = 0;
  if (r.length > 1) { let d = 0; for (let i = 1; i < r.length; i++) d += Math.hypot(r[i][1] - r[i - 1][1], r[i][2] - r[i - 1][2]); vel = d / Math.max(0.06, r[r.length - 1][0] - r[0][0]); }
  const x = pala.x, y = pala.y;
  const cavando = y > SY + 3 && y < FONDO + 2 && vel > 10;
  pala.cav = cavando ? Math.min(1, pala.cav + dt * 6) : Math.max(0, pala.cav - dt * 4);
  if (!cavando) return;
  let h = hoyos.find((h) => Math.hypot(zx(h.fx) - x, zy(h.fy) - y) < h.r + 2);
  if (!h) { h = { fx: aFx(x), fy: aFy(y), r: 1 }; hoyos.push(h); if (hoyos.length > 70) hoyos.splice(hoyos.findIndex((q) => q.r < 6), 1); }
  h.r = Math.min(6, h.r + dt * 1.5);
  if (Math.random() < dt * 30) arenita(x, y);
  if ((sonCavar -= dt) <= 0) { sonCavar = rnd(0.15, 0.22); Son.cavar(); }
  let cerca = false;
  for (const it of items) {
    if (it.e !== "enterrado") continue;
    if (Math.hypot(zx(it.fx) - x, zy(it.fy) - y) < 9) { cerca = true; it.prog += dt / it.need; it.tocado = t; if (it.prog >= 1) desenterrar(it); }
  }
  if (!cerca && (vacio += dt) > 4.5) { vacio = -6; decir(D.vacio); }
}

/* ═══════════════════════════ EL DIBUJO ═══════════════════════════ */

function dibujar() {
  const n = tormenta.nivel;
  g.setTransform(1, 0, 0, 1, sacudida > 0 ? Math.round(rnd(-2, 2) * sacudida * 2) : 0, sacudida > 0 ? Math.round(rnd(-2, 2) * sacudida * 2) : 0);

  // cielo
  g.drawImage(capaCielo, 0, 0);
  if (n > 0) R(0, 0, W, HZ, `rgba(22,16,44,${0.6 * n})`);
  if (t - tormenta.arco < 16) dibujaArcoiris((t - tormenta.arco) / 16);
  for (const e of estrellas) {
    const b = (0.45 + 0.55 * Math.abs(Math.sin(t * (0.6 + e.b) + e.f))) * (1 - n * 0.85);
    if (b < 0.15) continue;
    g.globalAlpha = b; P(e.x, e.y, e.c);
    if (e.grande && b > 0.7) { P(e.x - 1, e.y, e.c); P(e.x + 1, e.y, e.c); P(e.x, e.y - 1, e.c); P(e.x, e.y + 1, e.c); }
  }
  g.globalAlpha = 1;
  if (constel > 0) dibujaConstelacion();
  dibujaLuna();
  if (fugaz) {
    for (let k = 0; k < 14; k++) { g.globalAlpha = (1 - k / 14) * Math.min(1, fugaz.v * 2); P(fugaz.x - fugaz.vx * k * 0.012, fugaz.y - fugaz.vy * k * 0.012, k < 2 ? "#ffffff" : "#ffe7a8"); }
    g.globalAlpha = 1;
  }
  for (const nb of nubes) dibujaNube(nb, n);

  // mar
  g.drawImage(capaMar, 0, HZ);
  if (n > 0) R(0, HZ, W, SY - HZ, `rgba(10,14,40,${0.45 * n})`);
  dibujaOlas(n);
  for (const s of tiburones) dibujaTiburon(s);
  for (const b of barcos) dibujaBarco(b);

  // arena y orilla
  g.drawImage(capaArena, 0, SY);
  dibujaOrilla(n);
  dibujaFaro();
  dibujaHaz();
  for (const p of palmas) dibujaPalmera(p, n);

  // lo que hay en la arena
  const cofre = porId("cofre");
  if (cofre.e === "enterrado") dibujaX(zx(cofre.fx), zy(cofre.fy));
  for (const h of hoyos) dibujaHoyo(h);
  for (const it of items) if (it.e === "enterrado") dibujaPista(it);
  if (castillo) dibujaCastillo();
  const orden = items.filter((it) => (it.e === "fuera" || it.e === "abierto") && !(arr && arr.obj === it)).sort((a, b) => a.fy - b.fy);
  for (const it of orden) dibujaItem(it);
  dibujaCangrejo();
  for (const c of cocos) dibujaSpr("coco", c.x, c.y - 2);
  dibujaCanasta();
  if (!(arr && arr.tipo === "pala")) dibujaPalaTirada();
  for (const it of items) if (it.e === "enterrado" && it.prog > 0 && t - it.tocado < 1.2) dibujaAnillo(it);
  if (arr && arr.tipo === "item") dibujaItem(arr.obj, true);
  if (arr && arr.tipo === "pala") dibujaPalaEnMano();

  // partículas
  for (const p of parts) {
    g.globalAlpha = clamp(p.v / p.m * 1.6, 0, 1);
    if (p.k === "c") g.drawImage(SPR.minis[p.s], Math.round(p.x - 2), Math.round(p.y - 2));
    else if (p.k === "b") { P(p.x, p.y, p.c); if (p.v > p.m * 0.5) { P(p.x - 1, p.y, p.c); P(p.x + 1, p.y, p.c); P(p.x, p.y - 1, p.c); P(p.x, p.y + 1, p.c); } }
    else P(p.x, p.y, p.c);
  }
  g.globalAlpha = 1;

  // lluvia, rayo y destello
  if (n > 0) R(0, HZ, W, H - HZ, `rgba(18,12,40,${0.22 * n})`);
  if (gotas.length) { g.fillStyle = "rgba(200,220,255,.75)"; for (const d of gotas) { const x = Math.round(d.x), y = Math.round(d.y); g.fillRect(x, y, 1, 1); g.fillRect(x + 1, y - 1, 1, 1); g.fillRect(x + 1, y - 2, 1, 1); } }
  if (rayo) dibujaRayo();
  if (destello > 0) R(0, 0, W, H, `rgba(240,235,255,${Math.min(0.55, destello)})`);
  g.setTransform(1, 0, 0, 1, 0, 0);
}

function dibujaArcoiris(k) {
  const a = Math.sin(k * Math.PI) * 0.35;
  const cs = ["#ff6f91", "#ffb36b", "#ffe38a", "#8fe39a", "#7cc8ff", "#a58cff"];
  g.save(); g.lineWidth = 1;
  cs.forEach((c, i) => { g.globalAlpha = a; g.strokeStyle = c; g.beginPath(); g.arc(W * 0.42, HZ + 6, W * 0.5 - i, Math.PI, Math.PI * 2); g.stroke(); });
  g.restore();
}
function dibujaConstelacion() {
  const cx = W * 0.62, cy = HZ * 0.42, k = Math.min(W, HZ) / 42;
  const pts = [];
  for (let i = 0; i < 16; i++) { const a = (i / 16) * Math.PI * 2; pts.push([cx + 16 * Math.pow(Math.sin(a), 3) * k * 0.9, cy - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * k * 0.9]); }
  const a = Math.min(1, constel / 1.5) * Math.min(1, (10 - constel) * 2);
  g.globalAlpha = a * 0.5;
  pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length]; linea(p[0], p[1], q[0], q[1], "#ffc4dd"); });
  g.globalAlpha = a;
  for (const [x, y] of pts) { P(x, y, "#ffffff"); P(x - 1, y, "#ffd1e3"); P(x + 1, y, "#ffd1e3"); P(x, y - 1, "#ffd1e3"); P(x, y + 1, "#ffd1e3"); }
  g.globalAlpha = 1;
}
function dibujaLuna() {
  if (luna.estado === "entera") {
    const r = MR * (2.6 + Math.sin(t * 1.4) * 0.15);
    const gr = g.createRadialGradient(MX, MY, MR * 0.8, MX, MY, r);
    gr.addColorStop(0, "rgba(255,236,200,.35)"); gr.addColorStop(1, "rgba(255,200,230,0)");
    g.fillStyle = gr; g.fillRect(MX - r, MY - r, r * 2, r * 2);
    g.drawImage(capaLuna, MX - MR - 1, MY - MR - 1);
  } else if (luna.piezas) for (const p of luna.piezas) P(p.x, p.y, p.c);
}
function dibujaNube(nb, n) {
  const claro = mezcla("#d8b4e2", "#5d5872", n), oscuro = mezcla("#9a78b8", "#3a3650", n);
  for (const p of nb.puf) disco(nb.x + p.dx, nb.y + p.dy + 2, p.r, oscuro);
  for (const p of nb.puf) disco(nb.x + p.dx, nb.y + p.dy, p.r, claro);
  for (const p of nb.puf) R(nb.x + p.dx - 1, nb.y + p.dy - p.r + 1, 2, 1, mezcla("#fbe6f4", "#77728c", n));
}
function dibujaOlas(n) {
  for (let y = HZ + 2; y < SY - 1; y += 3) {
    const u = (y - HZ) / (SY - HZ), gap = 13 + ((y * 7) % 9), len = 2 + Math.round(u * 3 + n * 2);
    const off = (((y * 13) % gap) + t * (3 + u * 7) * (y % 2 ? 1 : -1)) % gap;
    g.fillStyle = u < 0.25 ? "rgba(255,200,230,.35)" : `rgba(190,235,255,${0.3 + u * 0.3})`;
    for (let x = off - gap; x < W; x += gap) g.fillRect(Math.round(x), y + (Math.sin(t * 1.6 + x * 0.21) > 0.55 ? 1 : 0), len, 1);
  }

function tocarQue(x, y) {
  if (Math.hypot(x - zx(pala.fx), y - zy(pala.fy)) < 12) return { tipo: "pala" };
  const fuera = items.filter((it) => it.e === "fuera" || it.e === "abierto").sort((a, b) => b.fy - a.fy);
  for (const it of fuera) {
    const s = SPR[it.tipo === "cofre" ? "cofre" : it.tipo];
    if (Math.abs(x - zx(it.fx)) < s.width / 2 + 7 && Math.abs(y - (zy(it.fy) - 3)) < s.height / 2 + 7) return { tipo: it.tipo === "cofre" ? "cofre" : "item", obj: it };
  }
  if (Math.abs(x - zx(canasta.fx)) < 16 && y > zy(canasta.fy) - 24 && y < zy(canasta.fy) + 4) return { tipo: "canasta" };
  if (castillo && Math.abs(x - castillo.x) < 11 && y > castillo.y - 22 && y < castillo.y + 3) return { tipo: "castillo" };
  if (Math.hypot(x - cangrejo.x, y - cangrejo.y) < 10) return { tipo: "cangrejo" };
  if (Math.hypot(x - LX, y - LY) < 12) return { tipo: "faro" };
  for (const gv of gaviotas) if (gv.x && Math.hypot(x - gv.x, y - gv.y) < 6) return { tipo: "gaviota", obj: gv };
  if (Math.hypot(x - MX, y - MY) < MR + 5) return { tipo: "luna" };
  if (fugaz && Math.hypot(x - fugaz.x, y - fugaz.y) < 18) return { tipo: "fugaz" };
  if (rayo && rayo.pts.some(([a, b]) => Math.hypot(x - a, y - b) < 14)) return { tipo: "rayo" };
  for (const b of barcos) if (Math.abs(x - b.x) < 11 && Math.abs(y - (b.y - 4)) < 9) return { tipo: "barco", obj: b };
  for (const s of tiburones) if (s.salto < 0 && Math.abs(x - s.x) < 9 && Math.abs(y - (zyMar(s.f) - 3)) < 8) return { tipo: "tiburon", obj: s };
  for (const p of palmas) if (Math.hypot(x - p.tx, y - p.ty) < 15) return { tipo: "palmera", obj: p };
  if (y < HZ) for (const nb of nubes) if (Math.abs(x - nb.x) < nb.w / 2 + 5 && Math.abs(y - nb.y) < 9) return { tipo: "nube", obj: nb };
  if (y < HZ) return { tipo: "cielo" };
  if (y > SY + 2) return { tipo: "arena" };

}

    arr = { tipo: q.tipo, obj: q.obj, x0: x, y0: y, movido: false, id: e.pointerId, ox: 0, oy: 0 };
    if (q.tipo === "item") { arr.ox = zx(q.obj.fx) - x; arr.oy = zy(q.obj.fy) - y; Son.pop(); }
    if (q.tipo === "canasta") { arr.ox = zx(canasta.fx) - x; arr.oy = zy(canasta.fy) - y; }
    if (q.tipo === "pala") {
      pala.x = x; pala.y = y - 12; Son.pop();
      if (!EST.obj.pala) { cumplir("pala"); decir(D.pala); }
    }
    if (q.tipo === "faro") { faro.mx = x; faro.my = y; }
    rastro.length = 0; rastro.push([t, x, y]);
    try { cv.setPointerCapture(e.pointerId); } catch (er) { /* nada */ }
    return;
  }
  tocar(q, x, y);
});
cv.addEventListener("pointermove", (e) => {
  if (!arr || e.pointerId !== arr.id) return;
  const [x, y] = aLogico(e);
  if (Math.hypot(x - arr.x0, y - arr.y0) > 3) arr.movido = true;
  rastro.push([t, x, y]); if (rastro.length > 30) rastro.shift();
  if (arr.tipo === "pala") { pala.x = x; pala.y = y - 12; }
  else if (arr.tipo === "item") { arr.obj.fx = aFx(x + arr.ox); arr.obj.fy = aFy(y + arr.oy); }
  else if (arr.tipo === "canasta") { canasta.fx = aFx(x + arr.ox); canasta.fy = clamp(aFy(y + arr.oy), 0.2, 1); }
  else if (arr.tipo === "faro") { faro.mx = x; faro.my = y; }
});
function soltar(e) {
  if (!arr || (e && e.pointerId !== arr.id)) return;
  const a = arr; arr = null;
  if (a.tipo === "pala") {
    if (!a.movido) decir(D.palaToque);
    pala.fx = aFx(pala.x); pala.fy = clamp(aFy(pala.y + 6), 0, 1);
  } else if (a.tipo === "item") {
    const it = a.obj;
    if (!a.movido) { if (it.tipo === "carta") abrirCarta(it); else if (it.tipo === "llave") decir(porId("cofre").e === "enterrado" ? D.llave : D.cofre); else abrirExtra(it); return; }
    const x = zx(it.fx), y = zy(it.fy);
    const cofre = porId("cofre");
    if (it.tipo === "llave") {
      if (cofre.e === "fuera" && Math.hypot(x - zx(cofre.fx), y - zy(cofre.fy)) < 16) return abrirCofre();
      if (Math.hypot(x - zx(canasta.fx), y - (zy(canasta.fy) - 6)) < 18) { decir(D.llaveCanasta); it.fy = clamp(it.fy - 0.12, 0, 1); return; }
      if (cofre.e === "enterrado" && !EST.avisoCofre) { EST.avisoCofre = true; decir(D.sinCofre); }
    } else if (Math.hypot(x - zx(canasta.fx), y - (zy(canasta.fy) - 6)) < 18) return alCanasta(it);
    guardar();
  } else if (a.tipo === "canasta") {
    if (!a.movido) abrirCanasta(); else guardar();
  } else if (a.tipo === "faro") {
    if (!a.movido) { faro.manual = 0; tocarFaro(); }
  }
}
cv.addEventListener("pointerup", soltar);
cv.addEventListener("pointercancel", soltar);
cv.addEventListener("lostpointercapture", soltar);

function tocar(q, x, y) {
  switch (q.tipo) {
    case "cofre": {
      const c = q.obj;
      if (c.e === "abierto") abrirTesoro();
      else { c.sacude = 0.4; Son.clic(); decir(porId("llave").e === "fuera" ? D.cofreCerrado : D.cofrePesa); }
      break;
    }
    case "castillo": Son.toc(); flotar("👑 para mi princesa", castillo.x, castillo.y - 22); corazones(castillo.x, castillo.y - 18, 3); break;
    case "cangrejo": {
      cangrejo.salta = 1; Son.toc();
      const o = OBJETIVOS.find((o) => !EST.obj[o.id]);
      decir(Math.random() < 0.45 && o ? "💡 " + PISTAS[o.id] : CANGREJO[Math.floor(rnd(CANGREJO.length))]);
      break;
    }
    case "gaviota": Son.gaviota(); flotar("cuiii 💗", q.obj.x, q.obj.y - 4); break;
    case "luna": explotarLuna(); break;
    case "fugaz":
      chispas(fugaz.x, fugaz.y, 20, ["#fff3b0", "#ffffff", "#ffd1e3"], 40); fugaz = null;
      secreto("deseo"); setTimeout(abrirDeseo, 350); break;
    case "rayo":
      if (secreto("rayo")) decir(D.rayo); else flotar("⚡💗", x, y);
      chispas(x, y, 18, ["#ffffff", "#e6ddff", "#fff3b0"], 50); destello = 0.5; break;
    case "barco": {
      const b = q.obj; b.salto = 1; Son.chapuzon();
      flotar(PIROPOS_BARCO[Math.floor(rnd(PIROPOS_BARCO.length))], b.x, b.y - 10); break;
    }
    case "tiburon": {
      const s = q.obj; saltarTiburon(s);
      EST.tib = (EST.tib || 0) + 1;
      if (EST.tib >= 3 && !EST.sec.tiburon) { s.corazon = true; setTimeout(() => { if (secreto("tiburon")) decir(D.tiburon); }, 500); }
      else flotar("🦈 ¡ñam!", s.x, zyMar(s.f) - 8);
      break;
    }
    case "palmera": caerCoco(q.obj); Son.toc(); break;
    case "nube": {
      const nb = q.obj; Son.toc();
      if (!tormenta.on) { if (++nb.toques >= 2) { nb.toques = 0; empezarTormenta(true); } else flotar("🌧️ ¿otra vez?", nb.x, nb.y); }
      else lanzarRayo(nb.x);
      break;
    }
    case "cielo": {
      toquesCielo = toquesCielo.filter((k) => t - k < 5); toquesCielo.push(t);
      chispas(x, y, 4, ["#ffffff", "#fff3b0"], 14);
      if (toquesCielo.length >= 7) { toquesCielo = []; constel = 10; Son.secreto(); if (secreto("estrellas")) decir(D.estrellas); }
      break;
    }
    case "arena": {
      toquesArena.push([t, x, y]);
      while (toquesArena.length && t - toquesArena[0][0] > 1) toquesArena.shift();
      const cerca = toquesArena.filter(([, a, b]) => Math.hypot(a - x, b - y) < 12);
      clearTimeout(tManita);
      if (cerca.length >= 3) {
        toquesArena.length = 0;
        castillo = { x, y, p: 0 }; Son.rearmar(); chispas(x, y - 6, 16, ["#f0c890", "#fff3b0"], 30);
        if (secreto("castillo")) decir(D.castillo);
      } else {
        for (let k = 0; k < 3; k++) arenita(x, y);
        tManita = setTimeout(() => { flotar("🪏 con la palita", x, y - 4); if (!EST.manita) { EST.manita = true; guardar(); decir(D.manita); } }, 380);
      }
      break;
    }
    case "mar": chispas(x, y, 6, ["#bfeaf0", "#ffffff"], 20); Son.chapuzon(); break;
  }
}

/* ═══════════════════════════ EL FINAL ═══════════════════════════ */

function celebrar() {
  fuegos = 9; destello = 0.4;
  setTimeout(abrirFinal, 3200);
}

/* ═══════════════════════════ ARRANCAR ═══════════════════════════ */

function inicio() {
  SPR.barcosLuz = SPR.barcos.map((b) => silueta(b, "#fff3b0"));
  const cf = porId("cofre"); if (cf.e === "abierto") cf.anim = 1;
  medir(); hud();
  let ultimo = performance.now();
  const cuadro = (ahora) => {
    const dt = Math.min(0.05, Math.max(0, (ahora - ultimo) / 1000)); ultimo = ahora;
    if (!document.hidden) { actualizar(dt); dibujar(); }
    requestAnimationFrame(cuadro);
  };
  requestAnimationFrame(cuadro);
  setTimeout(() => $("titulo").classList.add("fuera"), 3600);
  setTimeout(() => {
    if (!EST.visto) { EST.visto = true; guardar(); D.intro.forEach((d, i) => decir(d, undefined, i === 2 ? () => EST.obj.pala : null)); } else decir(D.volviste);
  }, 4000);
  let tRes = null;
  addEventListener("resize", () => { clearTimeout(tRes); tRes = setTimeout(medir, 120); });
}
inicio();
})();
