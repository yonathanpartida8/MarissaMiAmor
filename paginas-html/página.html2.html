const introEl = document.getElementById("intro");
const contadorEl = document.getElementById("contador");
const contadorN = document.getElementById("contadorN");
const cineEl = document.getElementById("cine");

/* Temporizadores con registro: al salir de la página se cancelan todos.
   Un `setTimeout` suelto que se despierta en una página que ya no existe
   es de donde salen la mitad de los errores raros. */
const relojes = new Set();
function temporizador(fn, ms) {
  const id = setTimeout(() => { relojes.delete(id); fn(); }, ms);
  relojes.add(id);
  return id;
}
function pararRelojes() {
  for (const id of relojes) clearTimeout(id);
  relojes.clear();
}

function ponerTextos() {
  document.getElementById("introTitulo").textContent = CONFIG.TEXTS.introTitulo;
  document.getElementById("introSub").textContent = CONFIG.TEXTS.introSub;
  document.getElementById("contadorTexto").textContent = CONFIG.TEXTS.contador;
  document.getElementById("contadorTotal").textContent = "/ " + estado.totalDetalles;
  document.getElementById("cartaFirma").textContent = CONFIG.TEXTS.cartaFirma;
  document.getElementById("cartaCerrar").textContent = CONFIG.TEXTS.cartaCerrar;
  document.getElementById("codigoTitulo").textContent = CONFIG.TEXTS.codigoTitulo;
  document.getElementById("codigoSub").textContent = CONFIG.TEXTS.codigoSub;
  document.getElementById("codigoSalir").textContent = CONFIG.TEXTS.codigoSalir;
  document.getElementById("tesoroTitulo").textContent = CONFIG.TEXTS.tesoroTitulo;
  document.getElementById("tesoroSub").textContent = CONFIG.TEXTS.tesoroSub;
  document.getElementById("tesoroCerrar").textContent = CONFIG.TEXTS.tesoroCerrar;
}

function actualizarContador() {
  contadorN.textContent = String(estado.encontrados);
  contadorN.classList.remove("is-sube");
  void contadorN.offsetWidth;          // reinicia la animación
  contadorN.classList.add("is-sube");
}

let cineReloj = 0;
function mostrarCine(texto, ms, deNoche) {
  clearTimeout(cineReloj);
  cineEl.textContent = texto;
  cineEl.classList.toggle("en-noche", !!deNoche);
  cineEl.classList.remove("is-fuera");
  cineEl.classList.add("is-dentro");
  cineReloj = temporizador(() => {
    cineEl.classList.remove("is-dentro");
    cineEl.classList.add("is-fuera");
  }, ms);
}

function pasarAExplorar() {
  if (estado.modo !== "intro") return;
  estado.modo = "explorar";
  introEl.classList.remove("is-dentro");
  introEl.classList.add("is-fuera");
  contadorEl.classList.add("is-dentro");
}

// ==========================
// LA CARTA
// ==========================

const veloCarta = document.getElementById("veloCarta");
const cartaEl = document.getElementById("carta");
const cartaTexto = document.getElementById("cartaTexto");

/* Los paneles se abren con muelle desde JavaScript y no con una
   transición de CSS. La diferencia se ve: una transición llega a su
   destino y para en seco; un muelle se pasa un pelín, vuelve y se
   asienta, que es como se mueven las cosas que pesan. */
const panelesVivos = new Set();

function abrirPanel(velo, caja, opciones) {
  const anim = {
    caja,
    escala: opciones.desde ?? 0.86,
    escalaV: 0,
    objetivo: 1,
    y: opciones.desdeY ?? 16,
    yV: 0,
    yObjetivo: 0,
    sacudida: 0,
    sacudidaV: 0,
    quieto: false,
  };
  panelesVivos.add(anim);
  velo.classList.add("is-abierto");
  return anim;
}

function cerrarPanel(velo, anim) {
  velo.classList.remove("is-abierto");
  if (anim) {
    anim.objetivo = 0.9;
    anim.yObjetivo = 12;
    anim.quieto = false;
    temporizador(() => panelesVivos.delete(anim), 520);
  }
}

/**
 * Mueve los paneles abiertos, Y LOS PARA CUANDO LLEGAN.
 *
 * Lo de pararlos no es un detalle de rendimiento: es lo que hace que se
 * puedan usar. Un muelle se acerca a su destino sin llegar nunca —cada
 * fotograma recorre una fracción de lo que queda—, así que el panel
 * seguía moviéndose milésimas de píxel para siempre. Y un botón que
 * nunca está quieto es un botón que no se puede pulsar: el navegador
 * espera a que se estabilice antes de entregar el toque, y como no se
 * estabilizaba jamás, el botón de cerrar la carta no respondía.
 *
 * En cuanto el muelle está lo bastante cerca y lo bastante lento, se
 * clava en su sitio, se escribe una última vez y se deja en paz. Un
 * empujón nuevo —la sacudida del código equivocado, el brinco al
 * acertar— le sube la velocidad y lo despierta solo.
 */
function moverPaneles(dt) {
  for (const a of panelesVivos) {
    const enMovimiento =
      Math.abs(a.escala - a.objetivo) > 0.0006 || Math.abs(a.escalaV) > 0.002 ||
      Math.abs(a.y - a.yObjetivo) > 0.02 || Math.abs(a.yV) > 0.05 ||
      Math.abs(a.sacudida) > 0.02 || Math.abs(a.sacudidaV) > 0.05;

    if (!enMovimiento) {
      if (a.quieto) continue;        // ya está en su sitio: ni se toca
      a.escala = a.objetivo; a.escalaV = 0;
      a.y = a.yObjetivo; a.yV = 0;
      a.sacudida = 0; a.sacudidaV = 0;
      a.quieto = true;
    } else {
      a.quieto = false;

      const m = muelle(a.escala, a.escalaV, a.objetivo, 128, 0.66, dt);
      a.escala = m.valor; a.escalaV = m.velocidad;
      const my = muelle(a.y, a.yV, a.yObjetivo, 128, 0.66, dt);
      a.y = my.valor; a.yV = my.velocidad;

      // La sacudida del código equivocado: un muelle al que se le da un
      // golpe y se deja oscilar hasta que se calma. No es una animación
      // de ida y vuelta, es de verdad un objeto que tiembla.
      const ms = muelle(a.sacudida, a.sacudidaV, 0, 420, 0.52, dt);
      a.sacudida = ms.valor; a.sacudidaV = ms.velocidad;
    }

    a.caja.style.transform =
      `translateY(${a.y.toFixed(2)}px) translateX(${a.sacudida.toFixed(2)}px) scale(${a.escala.toFixed(4)})`;
  }
}

let animCarta = null;
let cartaAbierta = null;

function abrirCarta(o) {
  if (estado.modo === "carta") return;
  estado.modo = "carta";
  cartaAbierta = o;
  cartaTexto.textContent = o.texto;
  animCarta = abrirPanel(veloCarta, cartaEl, { desde: 0.82, desdeY: 16 });
  Audio_.tocar("card");
  vibrar(12);

  // Partículas delicadas alrededor de donde estaba la carta.
  const p = aPantalla(o.x, o.z);
  chispasDeHallazgo(p.u, p.v, false);

  temporizador(() => document.getElementById("cartaCerrar")?.focus({ preventScroll: true }), 420);
}

function cerrarCarta() {
  if (estado.modo !== "carta") return;
  cerrarPanel(veloCarta, animCarta);
  animCarta = null;
  estado.modo = "explorar";
  Audio_.tocar("click");
  // Al cerrarla, la carta que se leyó se sacude un poquito en la arena.
  if (cartaAbierta) { cartaAbierta.altoV += 0.5; cartaAbierta.giroV += azar(-1, 1); cartaAbierta = null; }
}

document.getElementById("cartaCerrar").addEventListener("click", cerrarCarta);
veloCarta.addEventListener("click", (e) => { if (e.target === veloCarta) cerrarCarta(); });

// ==========================
// LA LLAVE
// ==========================

function encontrarLlave(o) {
  estado.llaveDescubierta = true;
  estado.modo = "llave";

  // Una secuencia con respiración: cada frase tiene su momento. Pero
  // CORTA, y se puede saltar tocando: durante estos segundos no se puede
  // cavar, y dejar a alguien mirando sin poder hacer nada deja de ser
  // cinematográfico en cuanto se alarga.
  mostrarCine(CONFIG.TEXTS.llaveEncontrada, 2500);
  temporizador(() => {
    if (estado.modo === "llave") mostrarCine(CONFIG.TEXTS.llavePista, 2800);
  }, 2700);
  temporizador(soltarLlave, 5400);

  // Polvo dorado que sigue cayendo un rato alrededor de la llave.
  let restantes = capacidad.flojo ? 8 : 22;
  const chispear = () => {
    if (restantes-- <= 0) return;
    const p = aPantalla(o.x, o.z);
    soltar(p.u + azar(-0.05, 0.05), p.v + azar(-0.06, 0.02), {
      vu: azar(-0.03, 0.03), vv: azar(-0.09, -0.02),
      vida: azar(1.2, 2.2), tam: azar(3, 6.5), tipo: 3, gravedad: 0.02,
      giro: azar(0, 6.28), giroV: azar(-1.4, 1.4),
    });
    temporizador(chispear, 110);
  };
  chispear();
}

/** Devuelve el control después del momento de la llave. */
function soltarLlave() {
  if (estado.modo === "llave") estado.modo = "explorar";
}

// ==========================
// CÓDIGO SECRETO
// ==========================

const veloCodigo = document.getElementById("veloCodigo");
const codigoEl = document.getElementById("codigo");
const huecosEl = document.getElementById("huecos");
const teclasEl = document.getElementById("teclas");
const codigoAviso = document.getElementById("codigoAviso");
let animCodigo = null;

/* Los huecos: tantos como dígitos tenga el código de la configuración. */
function construirHuecos() {
  huecosEl.replaceChildren();
  for (let i = 0; i < CONFIG.SECRET_CODE.length; i++) {
    const h = document.createElement("div");
    h.className = "hueco";
    h.setAttribute("aria-hidden", "true");
    huecosEl.append(h);
  }
}

function construirTeclas() {
  teclasEl.replaceChildren();
  const orden = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "borrar", "0", "ok"];
  for (const t of orden) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tecla" + (t === "borrar" || t === "ok" ? " tecla--accion" : "") + (t === "ok" ? " tecla--ok" : "");
    if (t === "borrar") { b.textContent = "⌫"; b.setAttribute("aria-label", "Borrar"); }
    else if (t === "ok") { b.textContent = "✓"; b.setAttribute("aria-label", "Confirmar"); }
    else { b.textContent = t; b.setAttribute("aria-label", t); }
    b.dataset.tecla = t;
    // El hundido va con muelle, igual que todo lo demás.
    b.__anim = { escala: 1, escalaV: 0, quieto: true };
    b.addEventListener("pointerdown", () => { b.__anim.escalaV -= 9; b.__anim.quieto = false; });
    b.addEventListener("click", () => pulsarTecla(t, b));
    teclasEl.append(b);
  }
}

function moverTeclas(dt) {
  if (estado.modo !== "codigo" && !veloCodigo.classList.contains("is-abierto")) return;
  for (const b of teclasEl.children) {
    const a = b.__anim;
    if (!a) continue;
    if (a.quieto) continue;
    if (Math.abs(a.escala - 1) < 0.0008 && Math.abs(a.escalaV) < 0.002) {
      // Clavada. Igual que los paneles: una tecla que nunca termina de
      // volver a su tamaño no se deja pulsar.
      a.escala = 1; a.escalaV = 0; a.quieto = true;
    } else {
      const m = muelle(a.escala, a.escalaV, 1, 380, 0.6, dt);
      a.escala = m.valor; a.escalaV = m.velocidad;
    }
    b.style.transform = `scale(${a.escala.toFixed(4)})`;
  }
}

function pintarHuecos(bien) {
  const hs = huecosEl.children;
  for (let i = 0; i < hs.length; i++) {
    const lleno = i < estado.codigo.length;
    hs[i].textContent = lleno ? estado.codigo[i] : "";
    hs[i].classList.toggle("is-lleno", lleno);
    hs[i].classList.toggle("is-bien", !!bien);
  }
}

function pulsarTecla(t, boton) {
  Audio_.despertar();
  if (estado.modo !== "codigo") return;

  if (t === "borrar") {
    estado.codigo = estado.codigo.slice(0, -1);
    Audio_.tocar("click");
    pintarHuecos(false);
    return;
  }
  if (t === "ok") { comprobarCodigo(); return; }

  if (estado.codigo.length >= CONFIG.SECRET_CODE.length) return;

  // El código se guarda como TEXTO. Es lo que hace que «0159» siga
  // siendo «0159»: en cuanto se toca un número, el cero de delante
  // desaparece y ya no hay manera de acertar nunca.
  estado.codigo += t;
  Audio_.tocar("pop");
  vibrar(8);
  pintarHuecos(false);

  // Al completar los cuatro, se comprueba solo: pedir además el ✓ sería
  // un paso de más justo en el momento de más emoción.
  if (estado.codigo.length === CONFIG.SECRET_CODE.length) {
    temporizador(comprobarCodigo, 260);
  }
}

function comprobarCodigo() {
  if (estado.codigo.length < CONFIG.SECRET_CODE.length) return;

  if (estado.codigo === CONFIG.SECRET_CODE) {
    pintarHuecos(true);
    desbloquear();
  } else {
    // Sacudida: se le da un golpe al muelle y se deja temblar.
    if (animCodigo) animCodigo.sacudidaV = 620;
    codigoAviso.textContent = CONFIG.TEXTS.codigoMal;
    codigoAviso.classList.add("is-dentro");
    Audio_.tocar("wrong");
    vibrar([14, 50, 14]);
    // Se borra solo para poder volver a intentarlo sin tener que borrar
    // a mano. Nunca se castiga: ni bloqueos, ni esperas, ni contadores.
    temporizador(() => {
      estado.codigo = "";
      pintarHuecos(false);
    }, 620);
    temporizador(() => codigoAviso.classList.remove("is-dentro"), 2600);
  }
}

function abrirCodigo() {
  if (estado.modo === "codigo") return;
  estado.modo = "codigo";
  estado.codigo = "";
  pintarHuecos(false);
  codigoAviso.classList.remove("is-dentro");
  animCodigo = abrirPanel(veloCodigo, codigoEl, { desde: 0.86, desdeY: 14 });
  Audio_.tocar("click");
  temporizador(() => teclasEl.querySelector('[data-tecla="1"]')?.focus({ preventScroll: true }), 420);
}

function cerrarCodigo() {
  if (estado.modo !== "codigo") return;
  cerrarPanel(veloCodigo, animCodigo);
  animCodigo = null;
  estado.modo = "explorar";
  Audio_.tocar("click");
}

document.getElementById("codigoSalir").addEventListener("click", cerrarCodigo);
veloCodigo.addEventListener("click", (e) => { if (e.target === veloCodigo) cerrarCodigo(); });

/* El teclado físico también vale, pero la página no depende de él: es un
   añadido para quien esté en un ordenador. */
window.addEventListener("keydown", (e) => {
  if (estado.modo === "codigo") {
    if (/^[0-9]$/.test(e.key)) { e.preventDefault(); pulsarTecla(e.key); }
    else if (e.key === "Backspace") { e.preventDefault(); pulsarTecla("borrar"); }
    else if (e.key === "Enter") { e.preventDefault(); pulsarTecla("ok"); }
    else if (e.key === "Escape") { e.preventDefault(); cerrarCodigo(); }
  } else if (estado.modo === "carta" && e.key === "Escape") {
    e.preventDefault(); cerrarCarta();
  } else if (estado.modo === "final" && e.key === "Escape") {
    e.preventDefault(); cerrarFinal();
  }
});

// ==========================
// EL DESBLOQUEO Y EL FINAL
// ==========================

function desbloquear() {
  estado.llaveAbierta = true;
  estado.modo = "desbloqueando";
  estado.desbloqueoObjetivo = 1;
  Audio_.tocar("unlock");
  vibrar([20, 60, 20, 60, 40]);

  // 1 · El panel celebra y se va.
  if (animCodigo) { animCodigo.escalaV += 4; }
  temporizador(() => {
    cerrarPanel(veloCodigo, animCodigo);
    animCodigo = null;
  }, 700);

  // 2 · La llave se enciende y sube.
  const llave = estado.objetos.find((o) => o.tipo === "llave");
  if (llave) {
    llave.altoObj = 0.62;
    llave.altoV += 1.1;
    llave.giroV += 2.4;
  }

  // 3 · La onda de luz que recorre la arena.
  if (llave) lanzarOnda(llave.x, llave.z);

  // 4 · Lluvia de oro durante unos segundos.
  let restantes = capacidad.flojo ? 26 : 70;
  const llover = () => {
    if (restantes-- <= 0) return;
    soltar(azar(0.08, 0.92), azar(0.28, 0.5), {
      vu: azar(-0.05, 0.05), vv: azar(-0.14, -0.03),
      vida: azar(1.4, 2.6), tam: azar(3, 7.5),
      tipo: Math.random() < 0.3 ? 2 : 3, gravedad: 0.03,
      giro: azar(0, 6.28), giroV: azar(-1.6, 1.6),
    });
    temporizador(llover, 52);
  };
  llover();

  // 5 · Los mensajes, uno detrás de otro y con aire entre ellos.
  temporizador(() => mostrarCine(CONFIG.TEXTS.accesoConcedido, 2600), 900);
  temporizador(() => mostrarCine(CONFIG.TEXTS.accesoDespues, 3200), 3700);

  // 6 · Y el tesoro.
  temporizador(abrirFinal, 7200);
}

const veloFinal = document.getElementById("veloFinal");
const tesoroEl = document.getElementById("tesoro");
const tesoroRejilla = document.getElementById("tesoroRejilla");
let animTesoro = null;

function construirTesoro() {
  tesoroRejilla.replaceChildren();
  for (const r of CONFIG.RECUERDOS) {
    const d = document.createElement("div");
    d.className = "recuerdo";
    d.innerHTML = (ICONOS_RECUERDO[r.icono] || ICONOS_RECUERDO.corazon) +
                  `<span>${r.texto.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`;
    // Cada uno con su propio reposo, para que no respiren a coro.
    d.__semilla = Math.random() * 10;
    d.__anim = { escala: 0.94, escalaV: 0, y: 14, yV: 0, listo: false };
    tesoroRejilla.append(d);
  }
}

function abrirFinal() {
  estado.modo = "final";
  animTesoro = abrirPanel(veloFinal, tesoroEl, { desde: 0.9, desdeY: 10 });
  veloFinal.classList.add("is-abierto");

  // Los recuerdos entran en cascada, uno detrás de otro.
  const hijos = [...tesoroRejilla.children];
  hijos.forEach((d, i) => {
    temporizador(() => {
      d.__anim.listo = true;
      d.__anim.escalaV += 2.2;
      d.style.opacity = "1";
      Audio_.tocar("pop");
    }, 260 + i * 170);
  });

  temporizador(() => document.getElementById("tesoroCerrar")?.focus({ preventScroll: true }), 900);
}

function moverTesoro(dt) {
  if (!veloFinal.classList.contains("is-abierto")) return;
  for (const d of tesoroRejilla.children) {
    const a = d.__anim;
    if (!a || !a.listo) continue;
    if (Math.abs(a.escala - 1) < 0.0008 && Math.abs(a.escalaV) < 0.002 &&
        Math.abs(a.y) < 0.02 && Math.abs(a.yV) < 0.05) {
      a.escala = 1; a.escalaV = 0; a.y = 0; a.yV = 0;
    } else {
      const m = muelle(a.escala, a.escalaV, 1, 120, 0.68, dt);
      a.escala = m.valor; a.escalaV = m.velocidad;
      const my = muelle(a.y, a.yV, 0, 120, 0.68, dt);
      a.y = my.valor; a.yV = my.velocidad;
    }
    const vaiven = capacidad.menosMovimiento ? 0 : Math.sin(estado.tiempo * 0.7 + d.__semilla) * 1.6;
    d.style.transform = `translateY(${(a.y + vaiven).toFixed(2)}px) scale(${a.escala.toFixed(4)})`;
  }
}

function cerrarFinal() {
  cerrarPanel(veloFinal, animTesoro);
  animTesoro = null;
  estado.modo = "explorar";
  Audio_.tocar("click");
}

document.getElementById("tesoroCerrar").addEventListener("click", cerrarFinal);
veloFinal.addEventListener("click", (e) => { if (e.target === veloFinal) cerrarFinal(); });

// ==========================
// LOOP PRINCIPAL
// ==========================

let raf = 0;
let ultimo = 0;
let corriendo = false;

/* Vigilancia de fps: si el aparato no sostiene el ritmo, se recorta sin
   avisar y sin que la escena se rompa. */
let fpsAcum = 0, fpsCuenta = 0, recortes = 0;

function vigilarRitmo(dt) {
  fpsAcum += dt;
  fpsCuenta++;
  if (fpsAcum < 1.5) return;
  const fps = fpsCuenta / fpsAcum;
  fpsAcum = 0; fpsCuenta = 0;
  if (fps < CONFIG.PERF.fpsMinimo && recortes < 2) {
    recortes++;
    capacidad.flojo = true;
    capacidad.calidad = 0;
    capacidad.maxCraters = 8;
    if (hoyos.length > 8) hoyos.length = 8;
    redimensionar();   // vuelve a medir con el tope de resolución bajo
  }
}

function fotograma(ahora) {
  if (!corriendo) return;
  raf = requestAnimationFrame(fotograma);

  // EL RELOJ, Y LA DIFERENCIA ENTRE «LENTO» Y «ESTUVO PARADO».
  //
  // Un fotograma larguísimo puede ser dos cosas muy distintas, y
  // confundirlas se nota. Si la pestaña ha estado escondida, han pasado
  // minutos enteros y hay que DESCARTARLOS: aplicarlos de golpe
  // teletransporta la palita y dispara todas las animaciones a la vez.
  // Pero si lo que pasa es que el aparato va justo, ese tiempo es real y
  // hay que RESPETARLO, sólo acotado para que la física no explote.
  //
  // Al principio se sustituían los dos casos por 1/60, y con eso un
  // aparato que fuera a cinco imágenes por segundo avanzaba dieciséis
  // milésimas por cada doscientas de verdad: el mundo entero iba a una
  // décima de su velocidad. Se veía en el entorno de pruebas, pintando
  // por software a resolución de escritorio, y le habría pasado igual a
  // un móvil viejo.
  let dt = (ahora - ultimo) / 1000;
  ultimo = ahora;
  if (!(dt > 0) || dt > 0.5) dt = 1 / 60;   // volvió de segundo plano
  else if (dt > 0.1) dt = 0.1;              // lento de verdad: acotado, no sustituido

  estado.tiempo += dt;
  estado.entrada = damp(estado.entrada, 1, 1.9, dt);
  estado.desbloqueo = damp(estado.desbloqueo, estado.desbloqueoObjetivo, 1.1, dt);

  moverCamara(dt);
  moverPalita(dt);
  moverObjetos(dt);
  moverParticulas(dt);
  moverOndas(dt);
  moverEasterEgg(dt);
  moverPaneles(dt);
  moverTeclas(dt);
  moverTesoro(dt);
  corazonEnElAire(dt);
  vigilarRitmo(dt);

  dibujar();
}

function dibujar() {
  if (!hayGL2) { respaldo?.dibujar(); return; }

  gl.viewport(0, 0, anchoPx, altoPx);

  // ── La arena ──
  gl.useProgram(progArena);
  gl.bindVertexArray(vaoArena);
  gl.uniform2f(uni.uRes, anchoPx, altoPx);
  gl.uniform1f(uni.uTime, estado.tiempo);
  gl.uniform2f(uni.uCam, camara.x, camara.y + camara.balanceo);
  gl.uniform1f(uni.uZoom, camara.zoom);
  gl.uniform2f(uni.uPala, palaSuelo.x, palaSuelo.z);
  gl.uniform1f(uni.uPalaFuerza, pala.removiendo);
  gl.uniform1f(uni.uNoche, estado.noche);
  gl.uniform1f(uni.uDesbloqueo, estado.desbloqueo);
  gl.uniform1f(uni.uEntrada, estado.entrada);
  gl.uniform1f(uni.uCalidad, capacidad.calidad);

  // Los arrays se rellenan en buffers reutilizados: ni un objeto nuevo
  // por fotograma, que es de donde salen los tirones del recolector.
  const nH = Math.min(hoyos.length, capacidad.maxCraters);
  for (let i = 0; i < nH; i++) {
    const h = hoyos[i];
    bufHoyos[i * 4] = h.x; bufHoyos[i * 4 + 1] = h.z;
    bufHoyos[i * 4 + 2] = h.r; bufHoyos[i * 4 + 3] = h.fuerza;
  }
  gl.uniform4fv(uni.uHoyos, bufHoyos);
  gl.uniform1i(uni.uNumHoyos, nH);

  const nO = Math.min(ondas.length, 4);
  for (let i = 0; i < nO; i++) {
    const o = ondas[i];
    bufOndas[i * 4] = o.x; bufOndas[i * 4 + 1] = o.z;
    bufOndas[i * 4 + 2] = o.edad; bufOndas[i * 4 + 3] = o.fuerza;
  }
  gl.uniform4fv(uni.uOndas, bufOndas);
  gl.uniform1i(uni.uNumOndas, nO);

  let nP = 0;
  for (const o of estado.objetos) {
    if (nP >= 12) break;
    if (o.descubierto || o.pista <= 0.01) continue;
    bufPistas[nP * 4] = o.x; bufPistas[nP * 4 + 1] = o.z;
    bufPistas[nP * 4 + 2] = o.pista; bufPistas[nP * 4 + 3] = o.tipo === "llave" ? 1 : 0;
    nP++;
  }
  gl.uniform4fv(uni.uPistas, bufPistas);
  gl.uniform1i(uni.uNumPistas, nP);

  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // ── Las partículas ──
  const n = subirParticulas();
  if (n > 0) {
    gl.useProgram(progPart);
    gl.bindVertexArray(vaoPart);
    gl.drawArrays(gl.POINTS, 0, n);
  }
  gl.bindVertexArray(null);
}

/* Buffers de uniforms, creados una sola vez. */
const bufHoyos = new Float32Array(16 * 4);
const bufOndas = new Float32Array(4 * 4);
const bufPistas = new Float32Array(12 * 4);

function arrancar() {
  if (corriendo) return;
  corriendo = true;
  ultimo = performance.now();
  raf = requestAnimationFrame(fotograma);
}

function parar() {
  corriendo = false;
  cancelAnimationFrame(raf);
}

function arrancarSiHaceFalta() {
  if (estado.arrancado) return;
  estado.arrancado = true;
}

/* Cuando la pestaña se esconde, se para todo: cero batería gastada. Y al
   volver se reinicia el reloj, para que el primer fotograma no traiga el
   salto entero de todo el rato que estuvo escondida. */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) parar();
  else { ultimo = performance.now(); arrancar(); }
});

window.addEventListener("resize", redimensionar, { passive: true });
window.addEventListener("orientationchange", () => {
  // Al girar, algunos móviles dan medidas viejas durante un par de
  // fotogramas. Se mide después de dejarles pasar.
  requestAnimationFrame(() => requestAnimationFrame(redimensionar));
});

/* Al salir de la página, el librito descarga el documento entero y con él
   se va todo. Aun así se recoge a mano: así el archivo también se porta
   bien si alguien lo incrusta de otra manera. */
window.addEventListener("pagehide", () => { parar(); pararRelojes(); });

// ==========================
// ARRANQUE
// ==========================

function iniciar() {
  medirCapacidad();
  ponerTextos();
  construirHuecos();
  construirTeclas();
  construirTesoro();
  crearObjetos();
  iniciarParticulas();

  hayGL2 = iniciarGL();
  if (!hayGL2) {
    respaldo = crearRespaldo();
    if (respaldo) {
      // Se avisa por lo bajo y sólo para quien mire: la experiencia es la
      // misma y no hay nada que ella tenga que hacer.
      const aviso = document.createElement("p");
      aviso.className = "sin-gl";
      aviso.textContent = "modo sencillo";
      document.body.append(aviso);
      console.info("[arena] sin WebGL2: se dibuja con Canvas 2D.");
    } else {
      console.warn("[arena] sin lienzo: sólo quedan los objetos y la llave.");
    }
  }

  redimensionar();
  actualizarContador();

  // La entrada: el mundo aparece, y un poco después el texto.
  temporizador(() => introEl.classList.add("is-dentro"), 700);

  // Si se queda mirando sin tocar, la intro se va sola y aparece el
  // contador: la página nunca se queda esperando eternamente.
  temporizador(() => { if (estado.modo === "intro") pasarAExplorar(); }, 9000);

  arrancar();
}

iniciar();
</script>
