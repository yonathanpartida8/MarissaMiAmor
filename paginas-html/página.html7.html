<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La caja de música</title>

<style>
/* ══════════════════════════════════════════════════════════════════════
   Todo dentro de .caja-mundo, con prefijo `cj-` en cada clase.
   ══════════════════════════════════════════════════════════════════════ */

html, body { margin: 0; height: 100%; }

.caja-mundo {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  contain: layout paint;
  background:
    radial-gradient(ellipse 120% 90% at 50% 8%, #fdf0e2, transparent 62%),
    linear-gradient(170deg, #f7e6d6 0%, #eed6c6 55%, #e2c3b4 100%);
  color: #4a2f2b;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;

  --madera: #8d5a43;
  --madera-h: #6b402e;
  --oro: #d9a441;
  --terciopelo: #b3405e;

  --seguro-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seguro-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --e-suave: cubic-bezier(0.22, 1, 0.36, 1);
  --e-tapa: cubic-bezier(0.34, 1.4, 0.5, 1);
}

.caja-mundo .cj-lienzo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}

/* ---- La caja -------------------------------------------------------- */

.caja-mundo .cj-escena {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(78vw, 300px);
  z-index: 2;
  perspective: 700px;
}

.caja-mundo .cj-tapa {
  position: relative;
  height: 86px;
  border-radius: 12px 12px 3px 3px;
  background: linear-gradient(175deg, #a06b50 0%, var(--madera) 46%, var(--madera-h) 100%);
  box-shadow:
    inset 0 2px 0 rgba(255, 228, 200, 0.4),
    inset 0 -8px 16px rgba(0, 0, 0, 0.28),
    0 10px 26px rgba(74, 40, 30, 0.35);
  transform-origin: 50% 100%;
  transform: rotateX(0deg);
  transition: transform 1100ms var(--e-tapa);
  cursor: pointer;
  z-index: 3;
}
.caja-mundo.is-abierta .cj-tapa { transform: rotateX(-108deg); }

/* El filete dorado de la tapa. */
.caja-mundo .cj-tapa::after {
  content: "";
  position: absolute;
  inset: 9px;
  border-radius: 7px;
  border: 1.5px solid rgba(217, 164, 65, 0.5);
  box-shadow: inset 0 0 14px rgba(217, 164, 65, 0.18);
}

.caja-mundo .cj-cuerpo {
  position: relative;
  height: 178px;
  margin-top: -3px;
  border-radius: 3px 3px 14px 14px;
  background: linear-gradient(180deg, var(--madera-h) 0%, var(--madera) 26%, #5c3626 100%);
  box-shadow:
    inset 0 10px 22px rgba(0, 0, 0, 0.45),
    0 22px 40px rgba(74, 40, 30, 0.4);
  overflow: hidden;
}

/* El terciopelo del interior. */
.caja-mundo .cj-interior {
  position: absolute;
  inset: 10px 10px 54px 10px;
  border-radius: 6px;
  background:
    radial-gradient(ellipse 110% 80% at 50% 0%, #d4587a, transparent 66%),
    linear-gradient(180deg, #8e2f49 0%, var(--terciopelo) 40%, #6e2038 100%);
  box-shadow: inset 0 6px 18px rgba(0, 0, 0, 0.5);
  display: grid;
  place-items: center;
  opacity: 0;
  transition: opacity 500ms var(--e-suave) 320ms;
}
.caja-mundo.is-abierta .cj-interior { opacity: 1; }

/* La bailarina: un cuerpo simple que gira sobre sí mismo. */
.caja-mundo .cj-bailarina {
  width: 60px;
  height: 92px;
  position: relative;
  transform-style: preserve-3d;
  animation: cj-girar 4.2s linear infinite paused;
}
.caja-mundo.is-sonando .cj-bailarina { animation-play-state: running; }

@keyframes cj-girar { to { transform: rotateY(360deg); } }

.caja-mundo .cj-falda {
  position: absolute;
  left: 50%; bottom: 8px;
  width: 54px; height: 40px;
  margin-left: -27px;
  border-radius: 50% 50% 46% 46% / 74% 74% 30% 30%;
  background: linear-gradient(180deg, #ffe9f2 0%, #ffc4dc 60%, #f59ec0 100%);
  box-shadow: 0 3px 10px rgba(110, 30, 60, 0.4);
}
.caja-mundo .cj-torso {
  position: absolute;
  left: 50%; bottom: 40px;
  width: 17px; height: 30px;
  margin-left: -8.5px;
  border-radius: 9px 9px 5px 5px;
  background: linear-gradient(180deg, #ffd9e6, #f7a8c6);
}
.caja-mundo .cj-cabeza {
  position: absolute;
  left: 50%; bottom: 66px;
  width: 20px; height: 20px;
  margin-left: -10px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff3e4, #f0c8ad 70%);
}
.caja-mundo .cj-monyo {
  position: absolute;
  left: 50%; bottom: 82px;
  width: 13px; height: 11px;
  margin-left: -6.5px;
  border-radius: 50%;
  background: #6b4030;
}
.caja-mundo .cj-brazos {
  position: absolute;
  left: 50%; bottom: 60px;
  width: 46px; height: 4px;
  margin-left: -23px;
  border-radius: 2px;
  background: #f7bcd2;
  transform: rotate(-16deg);
}

/* El espejo del fondo, que la duplica. */
.caja-mundo .cj-espejo {
  position: absolute;
  inset: 12px 12px 56px 12px;
  border-radius: 5px;
  background: linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02));
  pointer-events: none;
}

/* ---- Las teclas ------------------------------------------------------- */

.caja-mundo .cj-teclas {
  position: absolute;
  left: 10px; right: 10px; bottom: 10px;
  height: 40px;
  display: flex;
  gap: 3px;
  opacity: 0;
  transition: opacity 500ms var(--e-suave) 420ms;
}
.caja-mundo.is-abierta .cj-teclas { opacity: 1; }

.caja-mundo .cj-tecla {
  flex: 1;
  border: 0;
  padding: 0;
  border-radius: 3px 3px 6px 6px;
  background: linear-gradient(180deg, #fffaf2 0%, #f0e2d0 72%, #d9c3ad 100%);
  box-shadow: 0 3px 0 #a98a6e, inset 0 1px 0 #fff;
  cursor: pointer;
  transition: transform 90ms ease, box-shadow 90ms ease, background 260ms ease;
  font: inherit;
  color: #8a6a53;
  font-size: 0.6rem;
}
.caja-mundo .cj-tecla:active,
.caja-mundo .cj-tecla.is-pulsada {
  transform: translateY(3px);
  box-shadow: 0 0 0 #a98a6e, inset 0 1px 0 #fff;
  background: linear-gradient(180deg, #ffe8c8, #e8cfa8);
}
.caja-mundo .cj-tecla:focus-visible {
  outline: 2px solid var(--oro);
  outline-offset: 2px;
}

/* ---- Lo que se lee ---------------------------------------------------- */

.caja-mundo .cj-ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  padding:
    calc(var(--seguro-t) + 20px) 22px
    calc(var(--seguro-b) + var(--barra) + 18px) 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.caja-mundo .cj-titulo {
  margin: 0;
  font-family: var(--tipo-titulo, Georgia, serif);
  font-size: clamp(1rem, 4.4vw, 1.4rem);
  font-weight: 500;
  letter-spacing: 0.05em;
  color: #7a4d3c;
  opacity: 0.9;
  transition: opacity 700ms var(--e-suave);
}
.caja-mundo.is-abierta .cj-titulo { opacity: 0.32; }

.caja-mundo .cj-pie {
  margin: 0;
  min-height: 3.6em;
  max-width: 23em;
  font-size: clamp(0.82rem, 3.4vw, 0.97rem);
  line-height: 1.55;
  color: #5b3a31;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 640ms var(--e-suave), transform 640ms var(--e-suave);
}
.caja-mundo .cj-pie.is-visible { opacity: 0.94; transform: none; }
.caja-mundo .cj-pie em {
  display: block;
  margin-top: 0.3em;
  font-family: var(--tipo-mano, "Segoe Script", cursive);
  font-size: 1.16em;
  font-style: normal;
  color: #a8365c;
}

@media (prefers-reduced-motion: reduce) {
  .caja-mundo * { transition-duration: 1ms !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="caja-mundo" id="mundo">
  <canvas class="cj-lienzo" id="lienzo"></canvas>

  <div class="cj-escena">
    <div class="cj-tapa" id="tapa" role="button" tabindex="0" aria-label="Abrir la caja de música"></div>
    <div class="cj-cuerpo">
      <div class="cj-interior">
        <div class="cj-espejo"></div>
        <div class="cj-bailarina" id="bailarina" aria-hidden="true">
          <div class="cj-falda"></div>
          <div class="cj-torso"></div>
          <div class="cj-brazos"></div>
          <div class="cj-cabeza"></div>
          <div class="cj-monyo"></div>
        </div>
      </div>
      <div class="cj-teclas" id="teclas" role="group" aria-label="Notas"></div>
    </div>
  </div>

  <div class="cj-ui">
    <h1 class="cj-titulo" id="titulo">Levanta la tapa</h1>
    <p class="cj-pie" id="pie" role="status" aria-live="polite"></p>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN EDITABLE
   ══════════════════════════════════════════════════════════════════════ */

const CONF = {

  /* ---- LA MELODÍA ----------------------------------------------------
     Se toca sola al abrir la caja. Cada entrada es [nota, duración].
     Las notas van en el nombre de siempre: C4 es el do central, y una `s`
     detrás quiere decir sostenido (Cs4 = do sostenido). La duración va en
     negras: 1 es una negra, 0.5 una corchea, 2 una blanca.              */
  melodia: [
    ["G4",0.5],["C5",0.5],["E5",1],["D5",0.5],["C5",0.5],["D5",1],
    ["E5",0.5],["G5",0.5],["E5",1],["C5",0.5],["A4",0.5],["C5",1.5],
    ["G4",0.5],["C5",0.5],["E5",1],["G5",0.5],["F5",0.5],["E5",1],
    ["D5",0.5],["C5",0.5],["D5",1],["C5",2],
  ],
  compas: 132,              // pulsaciones por minuto

  /* ---- LAS TECLAS ----------------------------------------------------
     Las que ella puede tocar. Cada una lleva una frase: la primera vez
     que se pulsa, se lee.                                               */
  teclas: [
    { nota: "C5", letra: "do",  frase: "Do, de donde" },
    { nota: "D5", letra: "re",  frase: "Re, de recuerdo" },
    { nota: "E5", letra: "mi",  frase: "Mi, de mía" },
    { nota: "F5", letra: "fa",  frase: "Fa, de falta (cuando no estás)" },
    { nota: "G5", letra: "sol", frase: "Sol, de las mañanas" },
    { nota: "A5", letra: "la",  frase: "La, de la única" },
    { nota: "B5", letra: "si",  frase: "Si, de sí. Siempre sí." },
  ],

  /* ---- LO QUE SE LEE -------------------------------------------------- */
  alAbrir:  { texto: "La guardé para cuando la necesitaras.", firma: "Suena cuando tú quieras." },
  alCerrar: { texto: "Aquí sigue. No se gasta.", firma: "Vuelve cuando quieras." },
  alAcabar: { texto: "Esa es la que tarareo sin darme cuenta.", firma: "Ya la conoces." },
  alJugar:  "Toca las teclas. No hay forma de hacerlo mal.",

  /* ---- ADORNO --------------------------------------------------------- */
  motas: 46,                // cuántas motas de polvo dorado flotan
};

/* ══════════════════════════════════════════════════════════════════════
   La maquinaria.
   ══════════════════════════════════════════════════════════════════════ */

const mundo  = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const tapa   = document.getElementById("tapa");
const elTec  = document.getElementById("teclas");
const elPie  = document.getElementById("pie");
const elTit  = document.getElementById("titulo");
const ctx    = lienzo.getContext("2d");

const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- Notas ------------------------------------------------------------ */

const SEMI = { C:0, Cs:1, D:2, Ds:3, E:4, F:5, Fs:6, G:7, Gs:8, A:9, As:10, B:11 };

/** "Cs5" → los hercios que le tocan, con el la4 a 440. */
function hz(nombre) {
  const m = /^([A-G]s?)(-?\d)$/.exec(nombre);
  if (!m) return 440;
  const n = SEMI[m[1]] + (Number(m[2]) + 1) * 12;   // número MIDI
  return 440 * Math.pow(2, (n - 69) / 12);
}

/* ---- Sonido: una caja de música de verdad se sintetiza ---------------- */

let audio = null, maestro = null;

function despertarAudio() {
  if (audio) { if (audio.state === "suspended") audio.resume(); return audio; }
  try {
    audio = new (window.AudioContext || window.webkitAudioContext)();
    maestro = audio.createGain();
    maestro.gain.value = 0.5;
    maestro.connect(audio.destination);
  } catch { audio = null; }
  return audio;
}

/**
 * Una púa de caja de música: un golpe cortito, brillante, que se apaga
 * enseguida. Se hace con el fundamental y dos armónicos inarmónicos (una
 * lámina de metal no vibra en múltiplos exactos, y por eso suena a metal
 * y no a flauta).
 */
function pua(frecuencia, cuando, fuerza) {
  if (!audio) return;
  const t = cuando ?? audio.currentTime;
  const v = fuerza ?? 1;
  const parciales = [[1, 1], [2.76, 0.32], [5.4, 0.13]];
  for (const [mult, amp] of parciales) {
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(frecuencia * mult, t);
    /* Los armónicos se apagan antes que el fundamental: eso es lo que hace
       que el golpe suene metálico al principio y dulce al final. */
    const largo = 2.1 / mult;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16 * amp * v, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + largo);
    o.connect(g).connect(maestro);
    o.start(t); o.stop(t + largo + 0.05);
  }
}

/* ---- La melodía ------------------------------------------------------- */

let sonando = false;
let relojMelodia = null;

function tocarMelodia() {
  if (!despertarAudio()) { alTerminarMelodia(); return; }
  sonando = true;
  mundo.classList.add("is-sonando");

  const negra = 60 / CONF.compas;
  let t = audio.currentTime + 0.25;
  let total = 0;
  for (const [nota, dur] of CONF.melodia) {
    pua(hz(nota), t, 0.9);
    /* Y su reflejo una octava abajo, muy flojito: le da cuerpo sin
       ensuciar. */
    pua(hz(nota) / 2, t + 0.012, 0.22);
    const d = dur * negra;
    t += d; total += d;
  }
  clearTimeout(relojMelodia);
  relojMelodia = setTimeout(alTerminarMelodia, (total + 1.4) * 1000);
}

function alTerminarMelodia() {
  sonando = false;
  mundo.classList.remove("is-sonando");
  decir(CONF.alAcabar.texto, CONF.alAcabar.firma);
  setTimeout(() => { if (abierta && !sonando) decir(CONF.alJugar); }, suave ? 600 : 4200);
}

/* ---- La tapa ---------------------------------------------------------- */

let abierta = false;

function alternar() {
  abierta = !abierta;
  mundo.classList.toggle("is-abierta", abierta);
  tapa.setAttribute("aria-label", abierta ? "Cerrar la caja de música" : "Abrir la caja de música");
  elTit.textContent = abierta ? "La caja de música" : "Levanta la tapa";
  if (abierta) {
    despertarAudio();
    decir(CONF.alAbrir.texto, CONF.alAbrir.firma);
    brilloMotas = 1;
    setTimeout(() => { if (abierta) tocarMelodia(); }, suave ? 200 : 1150);
    contarAperturas();
  } else {
    clearTimeout(relojMelodia);
    sonando = false;
    mundo.classList.remove("is-sonando");
    decir(CONF.alCerrar.texto, CONF.alCerrar.firma);
  }
}

tapa.addEventListener("click", alternar);
tapa.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); alternar(); }
});

/* ---- Las teclas ------------------------------------------------------- */

const dichas = new Set();
let ultimasNotas = [];

CONF.teclas.forEach((t, i) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "cj-tecla";
  b.textContent = t.letra;
  b.setAttribute("aria-label", t.letra);
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); pulsar(i, b); });
  b.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pulsar(i, b); }
  });
  elTec.append(b);
});

function pulsar(i, boton) {
  const t = CONF.teclas[i];
  despertarAudio();
  pua(hz(t.nota), undefined, 1);
  boton.classList.add("is-pulsada");
  setTimeout(() => boton.classList.remove("is-pulsada"), 120);
  chispear(boton);
  if (!dichas.has(i)) { dichas.add(i); decir(t.frase); }
  if (dichas.size === CONF.teclas.length && !dichoTodas) {
    dichoTodas = true;
    setTimeout(() => decir("Do re mi fa sol la si.", "Todo eso y no me llega para decirlo."), 900);
  }
  vigilarSecreto(t.letra);
}
let dichoTodas = false;

/* ---- Los textos ------------------------------------------------------- */

let pidiendo = null;
function decir(texto, firma) {
  if (pidiendo === texto) return;
  pidiendo = texto;
  elPie.classList.remove("is-visible");
  setTimeout(() => {
    elPie.textContent = texto;
    if (firma) {
      const em = document.createElement("em");
      em.textContent = firma;
      elPie.append(em);
    }
    elPie.classList.add("is-visible");
  }, suave ? 10 : 300);
}

/* ══════════════════════════════════════════════════════════════════════
   LOS SECRETOS
   ══════════════════════════════════════════════════════════════════════ */

/* 1. Tocar «mi-la-mi» seguidas: la bailarina se acelera y suelta un giro
      bueno. Porque «mi la mi» es «mírame» mal escrito, y porque sí.      */
const SECRETO_NOTAS = ["mi", "la", "mi"];

function vigilarSecreto(letra) {
  ultimasNotas.push(letra);
  if (ultimasNotas.length > 6) ultimasNotas.shift();
  const fin = ultimasNotas.slice(-SECRETO_NOTAS.length).join(" ");
  if (fin === SECRETO_NOTAS.join(" ")) {
    ultimasNotas.length = 0;
    const b = document.getElementById("bailarina");
    b.style.animationDuration = "1.1s";
    mundo.classList.add("is-sonando");
    brilloMotas = 1;
    decir("Mi. La. Mi.", "Mírame, que es lo único que te pido.");
    for (let k = 0; k < 7; k++) {
      setTimeout(() => pua(hz(["E5","A5","E6","A5","C6","E6","A6"][k]), undefined, 0.7), k * 150);
    }
    setTimeout(() => {
      b.style.animationDuration = "";
      if (!sonando) mundo.classList.remove("is-sonando");
    }, 5200);
  }
}

/* 2. Abrir y cerrar la caja siete veces: se queda abierta y lo dice. */
let aperturas = 0;
function contarAperturas() {
  aperturas++;
  if (aperturas === 7) {
    setTimeout(() => decir("Siete veces la has abierto.", "Y yo te la abriría setenta más."), 1600);
    brilloMotas = 1;
  }
}

/* 3. Mantener la tapa pulsada tres segundos con la caja abierta: sale una
      nota que no está en ninguna tecla, la más grave de todas.           */
let apretando = null;
tapa.addEventListener("pointerdown", () => {
  apretando = setTimeout(() => {
    if (!abierta) return;
    despertarAudio();
    pua(hz("C3"), undefined, 1.1);
    pua(hz("G3"), audio ? audio.currentTime + 0.25 : undefined, 0.8);
    decir("Esa nota no está en ninguna tecla.", "Como algunas cosas que te digo.");
    brilloMotas = 1;
  }, 3000);
});
const soltarTapa = () => { clearTimeout(apretando); apretando = null; };
tapa.addEventListener("pointerup", soltarTapa);
tapa.addEventListener("pointercancel", soltarTapa);
tapa.addEventListener("pointerleave", soltarTapa);

/* ══════════════════════════════════════════════════════════════════════
   EL POLVO DORADO
   ══════════════════════════════════════════════════════════════════════ */

let A = 0, H = 0, dpr = 1;
let motas = [];
let brilloMotas = 0;

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width  = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sembrar();
}
new ResizeObserver(medir).observe(mundo);

const azar = (a, b) => a + Math.random() * (b - a);

function sembrar() {
  const n = A * H < 200000 ? Math.round(CONF.motas * 0.6) : CONF.motas;
  motas = new Array(n);
  for (let i = 0; i < n; i++) {
    motas[i] = {
      x: Math.random() * A,
      y: Math.random() * H,
      r: azar(0.6, 2.1),
      vy: azar(-9, -26),
      vx: azar(-5, 5),
      f: Math.random() * 6.283,
      w: azar(0.6, 1.7),
    };
  }
}

/* Un destello donde se ha pulsado una tecla. */
const chispas = [];
function chispear(boton) {
  const rb = boton.getBoundingClientRect();
  const rm = mundo.getBoundingClientRect();
  const x = rb.left - rm.left + rb.width / 2;
  const y = rb.top - rm.top;
  for (let i = 0; i < 7; i++) {
    chispas.push({
      x, y,
      vx: azar(-42, 42),
      vy: azar(-110, -40),
      v: 1,
    });
  }
  if (chispas.length > 90) chispas.splice(0, chispas.length - 90);
}

let t0 = performance.now();
let reloj = 0;

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A || !H) return;

  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.5) dt = 1 / 60;
  else if (dt > 0.1) dt = 0.1;
  reloj += dt;

  ctx.clearRect(0, 0, A, H);

  brilloMotas = brilloMotas + (0 - brilloMotas) * (1 - Math.exp(-1.2 * dt));
  const base = abierta ? 0.42 : 0.16;
  const fuerza = base + brilloMotas * 0.55;

  for (const m of motas) {
    m.y += m.vy * dt;
    m.x += (m.vx + Math.sin(reloj * m.w + m.f) * 11) * dt;
    if (m.y < -8) { m.y = H + 8; m.x = Math.random() * A; }
    if (m.x < -8) m.x = A + 8;
    if (m.x > A + 8) m.x = -8;
    const b = fuerza * (0.45 + 0.55 * Math.sin(reloj * 1.7 + m.f));
    if (b <= 0.01) continue;
    ctx.globalAlpha = b;
    ctx.fillStyle = "#e8b95c";
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, 6.283);
    ctx.fill();
  }

  for (let i = chispas.length - 1; i >= 0; i--) {
    const c = chispas[i];
    c.v -= dt * 1.5;
    if (c.v <= 0) { chispas.splice(i, 1); continue; }
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.vy += 190 * dt;
    ctx.globalAlpha = c.v * 0.8;
    ctx.fillStyle = "#ffd98a";
    ctx.beginPath();
    ctx.arc(c.x, c.y, 1 + c.v * 1.6, 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

medir();
decir("Está cerrada, pero no con llave.");
requestAnimationFrame(paso);

})();
</script>
