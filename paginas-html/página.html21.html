<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El reloj de nosotros</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Pinyon+Script&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   EL RELOJ DE NOSOTROS
   Un reloj de péndulo en la pared. Marca la hora de verdad y, si giras
   sus agujas, la luz del cuarto pasa por todo el día. Da igual la hora:
   dice siempre lo mismo. En cada hora en punto, en vez de un cucú, sale
   un corazón por su puertita. Prefijo `rj-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2038; }
.rj {
  position: fixed;
  inset: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  font-family: "Cormorant Garamond", Georgia, serif;
  --pared-a: #f6ecd8;
  --pared-b: #e8d6bd;
  --tinta: #4a2a24;
  background: linear-gradient(180deg, var(--pared-a), var(--pared-b));
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
}
.rj canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
/* El papel tapiz: rayas muy finas. */
.rj::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.025) 0 1px, transparent 1px 22px, rgba(255, 255, 255, 0.05) 22px 23px, transparent 23px 44px);
  pointer-events: none;
}
.rj-escena {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: calc(var(--seg-t) + 12px) 16px calc(var(--seg-b) + var(--barra) + 12px);
  box-sizing: border-box;
}
.rj-reloj {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  display: grid;
  place-items: center;
}
.rj-svg {
  height: 100%;
  max-height: 62vh;
  max-width: 88vw;
  overflow: visible;
  filter: drop-shadow(0 18px 26px rgba(40, 20, 10, 0.4));
  touch-action: none;
}
.rj-textos { flex: 0 0 auto; text-align: center; min-height: 6.6rem; display: grid; align-content: start; gap: 2px; }
.rj-uno {
  margin: 0;
  font-family: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  font-size: clamp(1.6rem, 7.6vw, 2.5rem);
  line-height: 1.15;
  color: var(--tinta);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
  transition: color 1.2s ease;
}
.rj-palabra { display: inline-block; white-space: nowrap; }
.rj-palabra span { display: inline-block; opacity: 0; transform: translateY(8px); filter: blur(4px); transition: opacity 900ms var(--suave), transform 900ms var(--suave), filter 900ms var(--suave); }
.rj-uno.is-ve .rj-palabra span { opacity: 1; transform: none; filter: none; }
.rj-dos {
  margin: 4px 0 0;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1rem, 4.4vw, 1.22rem);
  letter-spacing: 0.02em;
  color: var(--tinta);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 1.4s var(--suave), transform 1.4s var(--suave), color 1.2s ease;
}
.rj-dos::before, .rj-dos::after { content: "~"; margin: 0 0.5em; opacity: 0.5; }
.rj-dos.is-ve { opacity: 0.92; transform: none; }
.rj-pista {
  margin: 6px 0 0;
  font-size: clamp(0.58rem, 2.4vw, 0.68rem);
  font-weight: 600;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--tinta);
  opacity: 0.55;
  transition: color 1.2s ease;
}
.rj.is-noche { --tinta: #f6e8e0; }

@media (orientation: landscape) and (max-height: 540px) {
  .rj-escena { flex-direction: row; justify-content: center; gap: 24px; }
  .rj-reloj { width: 46%; height: 100%; }
  .rj-svg { max-height: 92vh; }
  .rj-textos { align-content: center; min-height: 0; max-width: 46%; }
}
</style>
</head>
<body>
<div class="rj" id="mundo">
  <canvas id="luz"></canvas>
  <div class="rj-escena">
    <div class="rj-reloj"><svg class="rj-svg" id="reloj" viewBox="0 0 300 560" aria-label="Un reloj de péndulo"></svg></div>
    <div class="rj-textos">
      <p class="rj-uno" id="uno" role="status" aria-live="polite"></p>
      <p class="rj-dos" id="dos">Siempre pienso en ti a todas horas.</p>
      <p class="rj-pista" id="pista">gira las agujas</p>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE DICE. Sólo esto.
   ══════════════════════════════════════════════════════════════════════ */
const FRASE_UNO = "Solo pensando en ti, todo el tiempo.";
const FRASE_DOS = "Siempre pienso en ti a todas horas.";

const mundo = document.getElementById("mundo");
const svg = document.getElementById("reloj");
const luz = document.getElementById("luz");
const gl = luz.getContext("2d");
const elUno = document.getElementById("uno");
const elDos = document.getElementById("dos");
const elPista = document.getElementById("pista");
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2;
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs, padre) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (padre) padre.appendChild(e);
  return e;
};
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const azar = (a, b) => a + Math.random() * (b - a);

/* La frase principal, letra por letra, para que aparezca con cariño. */
{
  // Cada palabra junta (para que no se parta al cambiar de renglón) y
  // cada letra con su retrasito.
  let i = 0;
  const partes = [];
  FRASE_UNO.split(" ").forEach((palabra, k) => {
    if (k) partes.push(document.createTextNode(" "));
    const w = document.createElement("span");
    w.className = "rj-palabra";
    for (const c of palabra) {
      const sp = document.createElement("span");
      sp.textContent = c;
      sp.style.transitionDelay = `${i++ * 38}ms`;
      w.append(sp);
    }
    i++;
    partes.push(w);
  });
  elUno.replaceChildren(...partes);
}
elDos.textContent = FRASE_DOS;

/* ══════════════════════════════════════════════════════════════════════
   EL RELOJ, en SVG
   ══════════════════════════════════════════════════════════════════════ */
const defs = s("defs", {}, svg);
function degr(id, paradas, attrs, tipo = "linearGradient") {
  const gg = s(tipo, Object.assign({ id }, attrs), defs);
  for (const [o, c] of paradas) s("stop", { offset: o, "stop-color": c }, gg);
}
degr("oro", [[0, "#fff1c4"], [0.25, "#c8952e"], [0.5, "#ffe08a"], [0.75, "#9a6a1c"], [1, "#e9c46a"]], { x1: 0, y1: 0, x2: 1, y2: 1 });
degr("caoba", [[0, "#6a2a1a"], [0.5, "#8e3c22"], [1, "#4a1a10"]], { x1: 0, y1: 0, x2: 1, y2: 0 });
degr("esmalte", [[0, "#fffdf6"], [0.8, "#f5ecd8"], [1, "#e2d2b0"]], { cx: 0.45, cy: 0.4, r: 0.65 }, "radialGradient");
degr("vidrio", [[0, "rgba(255,255,255,.28)"], [0.4, "rgba(255,255,255,.05)"], [1, "rgba(255,255,255,0)"]], { x1: 0, y1: 0, x2: 1, y2: 1 });
degr("fondoCaja", [[0, "#2a0e08"], [1, "#4a1c10"]], { x1: 0, y1: 0, x2: 0, y2: 1 });
degr("acero", [[0, "#2a3a6a"], [0.5, "#16204a"], [1, "#2c3c70"]], { x1: 0, y1: 0, x2: 1, y2: 0 });

const cx = 150, cy = 178, R = 104;
// La corona, con su puertita.
s("path", { d: "M58,120 Q58,40 150,26 Q242,40 242,120 Z", fill: "url(#caoba)", stroke: "url(#oro)", "stroke-width": 3 }, svg);
s("path", { d: "M78,112 Q80,56 150,44 Q220,56 222,112", fill: "none", stroke: "url(#oro)", "stroke-width": 1.2, opacity: 0.7 }, svg);
for (const sx of [-1, 1]) {
  s("path", { d: `M${150 + sx * 18},32 q${sx * 22},-4 ${sx * 34},10 q${sx * 8},10 ${sx * -2},16 q${sx * -8},4 ${sx * -10},-4`, fill: "none", stroke: "url(#oro)", "stroke-width": 2.4, "stroke-linecap": "round" }, svg);
}
s("circle", { cx: 150, cy: 20, r: 6, fill: "url(#oro)" }, svg);
const hueco = s("g", {}, svg);
s("rect", { x: 132, y: 52, width: 36, height: 34, rx: 16, fill: "#1a0806" }, hueco);
// El corazón que sale por la puertita (vive detrás de ella).
const corazonCucu = s("g", { transform: "translate(150 76)" }, svg);
s("rect", { x: -1.2, y: 0, width: 2.4, height: 30, fill: "url(#oro)" }, corazonCucu);
s("path", { d: "M0,6 C-12,-2 -8,-13 0,-7 C8,-13 12,-2 0,6 Z", fill: "#d62a4e", stroke: "#8a1030", "stroke-width": 0.8 }, corazonCucu);
s("circle", { cx: -3.4, cy: -5.4, r: 1.6, fill: "rgba(255,255,255,.7)" }, corazonCucu);
const puerta = s("g", {}, svg);
const hojaIzq = s("rect", { x: 132, y: 52, width: 18, height: 34, rx: 3, fill: "url(#caoba)", stroke: "url(#oro)", "stroke-width": 1.2 }, puerta);
const hojaDer = s("rect", { x: 150, y: 52, width: 18, height: 34, rx: 3, fill: "url(#caoba)", stroke: "url(#oro)", "stroke-width": 1.2 }, puerta);
// La caja del reloj.
s("rect", { x: 42, y: 70, width: 216, height: 216, rx: 22, fill: "url(#caoba)", stroke: "url(#oro)", "stroke-width": 3 }, svg);
// El tronco con su ventanita, donde se mueve el péndulo.
s("path", { d: "M84,280 L216,280 L206,500 Q150,520 94,500 Z", fill: "url(#caoba)", stroke: "url(#oro)", "stroke-width": 3 }, svg);
s("path", { d: "M102,300 L198,300 L190,478 Q150,492 110,478 Z", fill: "url(#fondoCaja)" }, svg);
const pendulo = s("g", {}, svg);
s("rect", { x: 148.6, y: 286, width: 2.8, height: 150, fill: "url(#oro)" }, pendulo);
s("circle", { cx: 150, cy: 444, r: 24, fill: "url(#oro)", stroke: "#8a5a14", "stroke-width": 1 }, pendulo);
s("circle", { cx: 150, cy: 444, r: 17, fill: "none", stroke: "#fff2c0", "stroke-width": 0.8, opacity: 0.7 }, pendulo);
s("path", { d: "M150,452 C138,444 142,432 150,438 C158,432 162,444 150,452 Z", fill: "#b8284c" }, pendulo);
s("path", { d: "M102,300 L198,300 L190,478 Q150,492 110,478 Z", fill: "url(#vidrio)", stroke: "url(#oro)", "stroke-width": 1.4 }, svg);
s("rect", { x: 70, y: 504, width: 160, height: 12, rx: 5, fill: "url(#oro)" }, svg);
// El bisel y la esfera.
s("circle", { cx, cy, r: R + 10, fill: "url(#oro)" }, svg);
s("circle", { cx, cy, r: R + 3, fill: "none", stroke: "#7a4a10", "stroke-width": 1 }, svg);
s("circle", { cx, cy, r: R, fill: "url(#esmalte)" }, svg);
// Guirnalda de corazoncitos en el borde de la esfera.
for (let i = 0; i < 60; i++) {
  const a = i / 60 * TAU - Math.PI / 2;
  const hora = i % 5 === 0;
  const r1 = R - (hora ? 12 : 7), r2 = R - 3;
  s("line", { x1: cx + Math.cos(a) * r1, y1: cy + Math.sin(a) * r1, x2: cx + Math.cos(a) * r2, y2: cy + Math.sin(a) * r2, stroke: hora ? "#6a3a1a" : "#b89468", "stroke-width": hora ? 2 : 0.8, "stroke-linecap": "round" }, svg);
}
const numeros = s("g", { "font-family": "'Cormorant Garamond', Georgia, serif", "font-size": 19, "font-weight": 600, fill: "#4a2a1a", "text-anchor": "middle" }, svg);
for (let h = 1; h <= 12; h++) {
  const a = h / 12 * TAU - Math.PI / 2;
  const t = s("text", { x: cx + Math.cos(a) * (R - 28), y: cy + Math.sin(a) * (R - 28) + 6.5 }, numeros);
  t.textContent = h;
}
// Una rueda de corazoncitos dorados que gira en el centro, como un volante.
const volante = s("g", {}, svg);
for (let i = 0; i < 8; i++) {
  const a = i / 8 * TAU;
  s("path", { d: `M${cx + Math.cos(a) * 24},${cy + Math.sin(a) * 24 + 3} c-4,-3 -3,-7 0,-5 c3,-2 4,2 0,5 z`, fill: "#c99a44", opacity: 0.55 }, volante);
}
s("circle", { cx, cy, r: 30, fill: "none", stroke: "#c99a44", "stroke-width": 0.6, opacity: 0.5 }, svg);
// Las agujas.
const aHora = s("path", { d: `M${cx - 3.2},${cy + 12} L${cx - 2},${cy - 44} Q${cx},${cy - 60} ${cx + 2},${cy - 44} L${cx + 3.2},${cy + 12} Z`, fill: "url(#acero)" }, svg);
const aMin = s("path", { d: `M${cx - 2.2},${cy + 16} L${cx - 1.2},${cy - 70} Q${cx},${cy - 86} ${cx + 1.2},${cy - 70} L${cx + 2.2},${cy + 16} Z`, fill: "url(#acero)" }, svg);
const aSeg = s("g", {}, svg);
s("line", { x1: cx, y1: cy + 20, x2: cx, y2: cy - 84, stroke: "#b8284c", "stroke-width": 1.1 }, aSeg);
s("path", { d: `M${cx},${cy - 60} c-5,-4 -3.5,-9 0,-6.5 c3.5,-2.5 5,2.5 0,6.5 z`, fill: "#b8284c" }, aSeg);
s("circle", { cx, cy, r: 5, fill: "url(#oro)" }, svg);
s("path", { d: `M${cx - 70},${cy - 72} A100,100 0 0 1 ${cx + 40},${cy - 92}`, fill: "none", stroke: "rgba(255,255,255,.55)", "stroke-width": 5, "stroke-linecap": "round", opacity: 0.5 }, svg);

/* ══════════════════════════════════════════════════════════════════════
   LA HORA
   Empieza en la hora de verdad y corre como un reloj normal. Si giras
   el minutero, mandas tú.
   ══════════════════════════════════════════════════════════════════════ */
const ahora0 = new Date();
let minutos = ahora0.getHours() * 60 + ahora0.getMinutes() + ahora0.getSeconds() / 60;
let girado = 0;                     // minutos que has hecho girar tú
let dosDicho = false;
let dedo = null;

function centroEnPantalla() {
  const r = svg.getBoundingClientRect();
  const k = r.height / 560;
  const ancho = 300 * k;
  const x0 = r.left + (r.width - ancho) / 2;
  return [x0 + cx * k, r.top + cy * k, k];
}
svg.addEventListener("pointerdown", (e) => {
  despertar();
  const [x, y] = centroEnPantalla();
  dedo = { id: e.pointerId, ang: Math.atan2(e.clientY - y, e.clientX - x) };
  try { svg.setPointerCapture(e.pointerId); } catch { /* nada */ }
});
svg.addEventListener("pointermove", (e) => {
  if (!dedo || e.pointerId !== dedo.id) return;
  const [x, y] = centroEnPantalla();
  const ang = Math.atan2(e.clientY - y, e.clientX - x);
  let d = ang - dedo.ang;
  if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
  dedo.ang = ang;
  const m = d / TAU * 60;
  minutos += m;
  girado += Math.abs(m);
  tic(Math.abs(m));
});
const soltar = (e) => { if (dedo && e.pointerId === dedo.id) dedo = null; };
svg.addEventListener("pointerup", soltar);
svg.addEventListener("pointercancel", soltar);

/* ══════════════════════════════════════════════════════════════════════
   EL SONIDO: el tic-tac, el trinquete al girar y la campana de la hora
   ══════════════════════════════════════════════════════════════════════ */
let ac = null, salida = null;
function despertar() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  salida = ac.createGain();
  salida.gain.value = 0.9;
  salida.connect(ac.destination);
  return ac;
}
function click(t, tono, v, ambiente) {
  const n = Math.floor(ac.sampleRate * 0.012);
  const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 5);
  const src = ac.createBufferSource(); src.buffer = b;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = tono; f.Q.value = 5;
  const gg = ac.createGain(); gg.gain.value = v;
  src.connect(f).connect(gg);
  if (ambiente && window.LibroSonido) window.LibroSonido.ambiente(gg); else gg.connect(salida);
  src.start(t);
}
let acumTic = 0;
function tic(m) {
  if (!ac) return;
  acumTic += m;
  if (acumTic < 1) return;
  acumTic = 0;
  click(ac.currentTime, 3200, 0.1, false);
}
function campanada(n) {
  if (!ac) return;
  const t = ac.currentTime;
  for (let k = 0; k < n; k++) {
    for (const [m, a, dur] of [[1, 1, 3], [2.4, 0.35, 1.6], [3.9, 0.15, 0.9], [0.5, 0.3, 3.5]]) {
      const o = ac.createOscillator(), gg = ac.createGain();
      o.frequency.value = 523.25 * m;
      const t0 = t + k * 0.55;
      gg.gain.setValueAtTime(0, t0);
      gg.gain.linearRampToValueAtTime(0.05 * a, t0 + 0.005);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(gg).connect(salida);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LA LUZ DEL CUARTO SEGÚN LA HORA
   ══════════════════════════════════════════════════════════════════════ */
const CIELO = [
  [0, "#1b1a38", "#2a2448"], [5, "#3a2e5a", "#7a5270"], [6.5, "#f3b69a", "#e8a07a"],
  [9, "#f7ecd6", "#ead8bc"], [13, "#fbf3e2", "#efe0c4"], [17, "#f8d6b0", "#eab48a"],
  [19, "#c9788a", "#6a4468"], [21, "#2c2650", "#1e1a3a"], [24, "#1b1a38", "#2a2448"],
];
const hexA = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function colorHora(h, cual) {
  for (let i = 0; i < CIELO.length - 1; i++) {
    const [h0, a0, b0] = CIELO[i], [h1, a1, b1] = CIELO[i + 1];
    if (h >= h0 && h <= h1) {
      const t = (h - h0) / (h1 - h0);
      const c0 = hexA(cual ? b0 : a0), c1 = hexA(cual ? b1 : a1);
      return `rgb(${c0.map((v, k) => Math.round(v + (c1[k] - v) * t)).join(",")})`;
    }
  }
  return "#000";
}

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */
let A = 0, H = 0, dpr = 1;
let t0 = performance.now(), reloj = 0;
let ultimaHora = Math.floor(minutos / 60), cucu = 0, relojTic = 0;
const motas = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random(), v: azar(0.004, 0.012), f: Math.random() * TAU }));
const corazones = [];

function medir() {
  const r = mundo.getBoundingClientRect();
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  luz.width = Math.round(A * dpr); luz.height = Math.round(H * dpr);
  gl.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(medir).observe(mundo);
medir();

function paso(ahora) {
  requestAnimationFrame(paso);
  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
  reloj += dt;

  if (!dedo) minutos += dt / 60;             // corre como un reloj de verdad
  const hDia = (((minutos / 60) % 24) + 24) % 24;

  // Las agujas.
  const m = ((minutos % 60) + 60) % 60, h12 = ((minutos / 60) % 12 + 12) % 12;
  const seg = dedo ? (m * 60) % 60 : (new Date().getSeconds() + new Date().getMilliseconds() / 1000);
  aMin.setAttribute("transform", `rotate(${(m * 6).toFixed(2)} ${cx} ${cy})`);
  aHora.setAttribute("transform", `rotate(${(h12 * 30).toFixed(2)} ${cx} ${cy})`);
  aSeg.setAttribute("transform", `rotate(${(seg * 6).toFixed(2)} ${cx} ${cy})`);
  volante.setAttribute("transform", `rotate(${(reloj * 18 + minutos * 3).toFixed(2)} ${cx} ${cy})`);

  // El péndulo: dos segundos de ida y vuelta.
  const angP = Math.sin(reloj * Math.PI) * 9;
  pendulo.setAttribute("transform", `rotate(${angP.toFixed(2)} 150 286)`);
  const tick = Math.floor(reloj);
  if (tick !== relojTic) { relojTic = tick; if (ac) click(ac.currentTime, tick % 2 ? 2100 : 2600, 0.05, true); }

  // Cada hora en punto: campanada y un corazón que sale por la puertita.
  const hora = Math.floor(minutos / 60);
  if (hora !== ultimaHora) {
    if (hora > ultimaHora || dedo) { cucu = 1; campanada(dedo ? 1 : Math.min(3, ((hora % 12) + 12) % 12 || 12)); soltarCorazones(); }
    ultimaHora = hora;
  }
  cucu = Math.max(0, cucu - dt * 0.45);
  const abre = cucu > 0.8 ? (1 - cucu) / 0.2 : cucu > 0.25 ? 1 : cucu / 0.25;
  // Cada hoja de la puertita gira sobre su bisagra.
  const k = (1 - abre * 0.85).toFixed(3);
  hojaIzq.setAttribute("transform", `translate(132 0) scale(${k} 1) translate(-132 0)`);
  hojaDer.setAttribute("transform", `translate(168 0) scale(${k} 1) translate(-168 0)`);
  const sale = abre * (1 + Math.sin(reloj * 14) * 0.05 * abre);
  corazonCucu.setAttribute("transform", `translate(150 ${(76 - sale * 40).toFixed(2)}) scale(${(0.8 + sale * 0.4).toFixed(3)})`);

  // La luz del cuarto.
  mundo.style.setProperty("--pared-a", colorHora(hDia, 0));
  mundo.style.setProperty("--pared-b", colorHora(hDia, 1));
  const noche = hDia < 6 || hDia > 19.8;
  mundo.classList.toggle("is-noche", noche);

  gl.clearRect(0, 0, A, H);
  // El rayo de sol (o de luna) que cruza la pared con la hora.
  const dia = clamp((hDia - 6) / 13, 0, 1);
  const bx = A * (1.1 - dia * 1.2), fuerza = noche ? 0.12 : Math.sin(dia * Math.PI) * 0.35 + 0.08;
  gl.save();
  gl.translate(bx, H * 0.1);
  gl.rotate(0.45);
  const rayo = gl.createLinearGradient(-A * 0.25, 0, A * 0.25, 0);
  const col = noche ? "190,205,255" : hDia > 16 ? "255,180,120" : "255,240,200";
  rayo.addColorStop(0, `rgba(${col},0)`);
  rayo.addColorStop(0.5, `rgba(${col},${fuerza})`);
  rayo.addColorStop(1, `rgba(${col},0)`);
  gl.fillStyle = rayo;
  gl.fillRect(-A * 0.25, -H * 0.3, A * 0.5, H * 1.8);
  gl.restore();
  // El polvito que flota en la luz.
  for (const p of motas) {
    p.y -= p.v * dt; p.x += Math.sin(reloj * 0.5 + p.f) * 0.002 * dt;
    if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); }
    const b = 0.3 + 0.7 * Math.abs(Math.sin(reloj + p.f));
    gl.fillStyle = `rgba(${col},${(fuerza * b * 1.8).toFixed(3)})`;
    gl.beginPath(); gl.arc(p.x * A, p.y * H, 1.1, 0, TAU); gl.fill();
  }
  // Los corazones que suben después del cucú.
  for (let i = corazones.length - 1; i >= 0; i--) {
    const c = corazones[i];
    c.t += dt;
    if (c.t > c.dur) { corazones.splice(i, 1); continue; }
    c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 10 * dt;
    const a = Math.sin(c.t / c.dur * Math.PI);
    gl.save();
    gl.translate(c.x, c.y);
    gl.rotate(Math.sin(reloj * 2 + c.f) * 0.3);
    gl.globalAlpha = a;
    gl.fillStyle = c.col;
    const r = c.r;
    gl.beginPath();
    gl.moveTo(0, r * 0.8);
    gl.bezierCurveTo(-r * 1.4, -r * 0.1, -r * 0.55, -r * 1.05, 0, -r * 0.35);
    gl.bezierCurveTo(r * 0.55, -r * 1.05, r * 1.4, -r * 0.1, 0, r * 0.8);
    gl.fill();
    gl.restore();
  }
  gl.globalAlpha = 1;

  // La segunda frase, cuando has recorrido medio día con las agujas.
  if (!dosDicho && girado > 12 * 60) {
    dosDicho = true;
    elDos.classList.add("is-ve");
    elPista.textContent = "a cualquier hora";
    campanada(3);
    for (let k = 0; k < 3; k++) setTimeout(soltarCorazones, k * 400);
  }
}

function soltarCorazones() {
  const r = svg.getBoundingClientRect(), m = mundo.getBoundingClientRect();
  const k = r.height / 560;
  const x = r.left - m.left + (r.width - 300 * k) / 2 + 150 * k, y = r.top - m.top + 40 * k;
  for (let i = 0; i < 9; i++) {
    corazones.push({ x, y, vx: azar(-40, 40), vy: azar(-70, -30), t: 0, dur: azar(2.2, 3.4), r: azar(4, 8), f: Math.random() * TAU, col: ["#d62a4e", "#ff8fa8", "#e9557f"][i % 3] });
  }
}

requestAnimationFrame(paso);
setTimeout(() => elUno.classList.add("is-ve"), suave ? 0 : 500);
})();
</script>
</body>
