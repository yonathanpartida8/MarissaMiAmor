<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>El caleidoscopio</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Caveat:wght@500&family=Great+Vibes&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   EL CALEIDOSCOPIO
   Se mira por el tubo de latón: dentro, cristalitos de colores que caen y
   ruedan al girarlo, y los espejos los repiten en una flor que nunca sale
   igual. Se gira con el dedo (o inclinando el teléfono) y con un toque se
   echa otro cristal, en forma de corazón. Prefijo `cl-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #0e0710; }
.cl {
  position: fixed;
  inset: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  font-family: "Cormorant Garamond", Georgia, serif;
  color: #fbeef2;
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
}
.cl canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cl-titulo {
  position: absolute;
  top: calc(var(--seg-t) + 16px);
  left: 0; right: 0;
  margin: 0;
  text-align: center;
  pointer-events: none;
  font-weight: 600;
  font-size: clamp(0.66rem, 2.8vw, 0.78rem);
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: rgba(255, 214, 190, 0.72);
}
.cl-pie {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--seg-b) + var(--barra) + 16px);
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 0 22px;
  pointer-events: none;
  text-align: center;
}
.cl-frase {
  margin: 0;
  max-width: 20em;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.08rem, 4.9vw, 1.38rem);
  line-height: 1.3;
  color: #fff6f8;
  text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8);
  transition: opacity 800ms var(--suave), transform 800ms var(--suave), filter 800ms var(--suave);
}
.cl-frase.is-piropo {
  font-family: "Great Vibes", "Caveat", cursive;
  font-style: normal;
  font-size: clamp(2rem, 10vw, 2.8rem);
  line-height: 1.1;
  color: #ffe3ec;
  text-shadow: 0 0 18px rgba(255, 120, 170, 0.75), 0 2px 12px rgba(0, 0, 0, 0.8);
}
.cl-frase.is-fuera { opacity: 0; transform: translateY(6px); filter: blur(4px); }
@media (orientation: landscape) and (max-height: 540px) {
  .cl-pie { left: 58%; right: 0; top: 0; bottom: 0; align-content: center; }
}
.cl-pista {
  margin: 2px 0 0;
  font-size: clamp(0.58rem, 2.4vw, 0.68rem);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(255, 210, 200, 0.55);
}
</style>
</head>
<body>
<div class="cl" id="mundo">
  <canvas id="lienzo"></canvas>
  <p class="cl-titulo">El caleidoscopio</p>
  <div class="cl-pie">
    <p class="cl-frase" id="frase" role="status" aria-live="polite">Asómate y gíralo despacito.</p>
    <p class="cl-pista">gira con el dedo · toca para echar un cristal</p>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE SE PUEDE CAMBIAR
   ══════════════════════════════════════════════════════════════════════ */
const CONF = {
  espejos: 6,          // cuántas veces se repite (6 = una flor de 12 pétalos)
  cristales: 66,       // los que hay al empezar
  maximo: 96,          // los que caben
  /* Cada vuelta y media, un piropo. Salen barajados, sin repetirse
     hasta que se acaban todos. */
  frases: [
    "Linda.", "Chula.", "Hermosa.", "Preciosa.", "Bonita.", "Bella.",
    "Guapísima.", "Divina.", "Una chulada.", "Hermosura.", "Mi niña bonita.",
    "Encantadora.", "Qué linda eres.", "Estás bien chula.", "Preciosísima.",
    "Mi reina.", "Mi cielo.", "Lo más bonito que existe.", "Mi princesa.",
    "Mi muñeca.", "Hermosa por dentro y por fuera.", "La más bonita de todas.",
  ],
  colores: ["#ff4d7d", "#ff8fb1", "#c2185b", "#ffb347", "#ffd86b", "#b388ff", "#e1bee7", "#ff6f61", "#fff0f5", "#7ee0c9"],
};

/* ══════════════════════════════════════════════════════════════════════ */
const mundo = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const g = lienzo.getContext("2d", { alpha: false });
const elFrase = document.getElementById("frase");
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;

const TAU = Math.PI * 2;
const azar = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const acercar = (v, o, k, dt) => o + (v - o) * Math.exp(-k * dt);

let A = 0, H = 0, dpr = 1;
let V = { cx: 0, cy: 0, R: 0 };             // la mirilla en pantalla
const CS = 420;                              // la cámara de los cristales
const CR = CS * 0.48;                        // su radio
let camara, gc, fondo;

/* ══════════════════════════════════════════════════════════════════════
   LOS CRISTALES
   Viven en la cámara (un círculo). Caen hacia donde es «abajo» según lo
   girado que esté el tubo, chocan entre sí y ruedan. Los espejos sólo
   repiten un gajo de esa cámara.
   ══════════════════════════════════════════════════════════════════════ */
const cristales = [];
const FORMAS = ["tri", "rombo", "perla", "gota", "corazon", "palito", "estrella"];
function nuevoCristal(forma, x, y) {
  const f = forma || FORMAS[Math.floor(Math.random() * (FORMAS.length - 1))];
  const r = f === "perla" ? azar(8, 13) : f === "palito" ? azar(10, 15) : azar(15, 28);
  return {
    forma: f, r,
    x: x ?? CS / 2 + azar(-CR * 0.6, CR * 0.6),
    y: y ?? CS / 2 + azar(-CR * 0.6, CR * 0.6),
    vx: 0, vy: 0,
    ang: Math.random() * TAU, va: 0,
    color: CONF.colores[Math.floor(Math.random() * CONF.colores.length)],
    alfa: f === "perla" ? 0.95 : azar(0.55, 0.8),
    brillo: 0,
  };
}
function sembrar() {
  cristales.length = 0;
  for (let i = 0; i < CONF.cristales; i++) cristales.push(nuevoCristal(i < 4 ? "corazon" : null));
}

function trazarForma(x, c) {
  const r = c.r;
  x.beginPath();
  switch (c.forma) {
    case "tri":
      x.moveTo(0, -r); x.lineTo(r * 0.9, r * 0.6); x.lineTo(-r * 0.9, r * 0.6); break;
    case "rombo":
      x.moveTo(0, -r); x.lineTo(r * 0.55, 0); x.lineTo(0, r); x.lineTo(-r * 0.55, 0); break;
    case "perla":
      x.arc(0, 0, r, 0, TAU); break;
    case "gota":
      x.moveTo(0, -r); x.quadraticCurveTo(r * 0.9, r * 0.2, 0, r); x.quadraticCurveTo(-r * 0.9, r * 0.2, 0, -r); break;
    case "palito":
      x.rect(-r * 1.3, -r * 0.28, r * 2.6, r * 0.56); break;
    case "estrella":
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * TAU - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
        if (i) x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); else x.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      break;
    case "corazon":
      x.moveTo(0, r * 0.8);
      x.bezierCurveTo(-r * 1.4, -r * 0.1, -r * 0.55, -r * 1.05, 0, -r * 0.35);
      x.bezierCurveTo(r * 0.55, -r * 1.05, r * 1.4, -r * 0.1, 0, r * 0.8);
      break;
  }
  x.closePath();
}

/* ══════════════════════════════════════════════════════════════════════
   EL SONIDO: tintineo de cristales y campanitas
   ══════════════════════════════════════════════════════════════════════ */
let ac = null, salida = null;
function despertar() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  salida = ac.createGain();
  salida.gain.value = 0.85;
  salida.connect(ac.destination);
  return ac;
}
let ultimoTin = 0;
function tin(fuerza) {
  if (!ac || performance.now() - ultimoTin < 45) return;
  ultimoTin = performance.now();
  const t = ac.currentTime, f = azar(2400, 5200);
  const o = ac.createOscillator(), gg = ac.createGain();
  o.frequency.value = f;
  gg.gain.setValueAtTime(0, t);
  gg.gain.linearRampToValueAtTime(Math.min(0.035, fuerza * 0.0002), t + 0.002);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(gg).connect(salida);
  o.start(t); o.stop(t + 0.14);
}
const ESCALA = [659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1567.98];
function campana(k, v = 0.045) {
  if (!ac) return;
  const t = ac.currentTime, f = ESCALA[k % ESCALA.length];
  for (const [m, a] of [[1, 1], [2.76, 0.3], [5.4, 0.1]]) {
    const o = ac.createOscillator(), gg = ac.createGain();
    o.frequency.value = f * m;
    gg.gain.setValueAtTime(0, t);
    gg.gain.linearRampToValueAtTime(v * a, t + 0.004);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + 1.8 / m);
    o.connect(gg).connect(salida);
    o.start(t); o.stop(t + 1.9);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   GIRAR
   ══════════════════════════════════════════════════════════════════════ */
let giro = 0, vGiro = 0;           // el ángulo del tubo
let vueltas = 0, nFrase = 0;
let dedo = null;
let inclinacion = null;

mundo.addEventListener("pointerdown", (e) => {
  despertar();
  const r = mundo.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  dedo = { id: e.pointerId, x, y, x0: x, y0: y, t: performance.now(), movido: false, ang: Math.atan2(y - V.cy, x - V.cx) };
  try { mundo.setPointerCapture(e.pointerId); } catch { /* nada */ }
});
mundo.addEventListener("pointermove", (e) => {
  if (!dedo || e.pointerId !== dedo.id) return;
  const r = mundo.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (Math.hypot(x - dedo.x0, y - dedo.y0) > 8) dedo.movido = true;
  // Girar alrededor del centro, o arrastrar de lado: las dos cosas giran.
  const ang = Math.atan2(y - V.cy, x - V.cx);
  let d = ang - dedo.ang;
  if (d > Math.PI) d -= TAU; else if (d < -Math.PI) d += TAU;
  if (Math.hypot(x - V.cx, y - V.cy) < V.R * 0.25) d = (x - dedo.x) / V.R * 1.4;
  dedo.ang = ang;
  dedo.x = x; dedo.y = y;
  giro += d;
  giroAcumulado += Math.abs(d);
  vGiro = d / (1 / 60);
});
function soltar(e) {
  if (!dedo || e.pointerId !== dedo.id) return;
  const d = dedo;
  dedo = null;
  if (!d.movido && performance.now() - d.t < 350) echarCristal();
}
mundo.addEventListener("pointerup", soltar);
mundo.addEventListener("pointercancel", soltar);
window.addEventListener("deviceorientation", (e) => {
  if (typeof e.gamma === "number") inclinacion = clamp(e.gamma, -60, 60) * Math.PI / 180;
});

function echarCristal() {
  if (cristales.length >= CONF.maximo) {
    // Si ya no cabe, una sacudida: todos saltan.
    for (const c of cristales) { c.vx += azar(-300, 300); c.vy += azar(-300, 300); c.va += azar(-8, 8); }
    campana(3);
    return;
  }
  const arriba = rot(0, -CR * 0.7, -giro);
  const c = nuevoCristal("corazon", CS / 2 + arriba[0], CS / 2 + arriba[1]);
  c.color = ["#ff4d7d", "#ff8fb1", "#c2185b", "#fff0f5"][Math.floor(Math.random() * 4)];
  c.brillo = 1;
  cristales.push(c);
  campana(cristales.length);
}
const rot = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];

/* Barajados: no se repite ninguno hasta haber dicho todos. */
let bolsa = [];
function piropo() {
  if (!bolsa.length) {
    bolsa = CONF.frases.slice();
    for (let i = bolsa.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [bolsa[i], bolsa[k]] = [bolsa[k], bolsa[i]]; }
  }
  return bolsa.pop();
}
function decir(t) {
  elFrase.classList.add("is-fuera");
  setTimeout(() => { elFrase.textContent = t; elFrase.classList.add("is-piropo"); elFrase.classList.remove("is-fuera"); }, suave ? 20 : 600);
}

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */
let t0 = performance.now(), reloj = 0, giroAcumulado = 0;

function fisica(dt) {
  // La gravedad, vista desde dentro del tubo, gira al revés que el tubo.
  const [gx, gy] = rot(0, 900, -giro);
  const sub = 2, h = dt / sub;
  for (let s = 0; s < sub; s++) {
    for (const c of cristales) {
      c.vx += gx * h; c.vy += gy * h;
      c.vx *= Math.exp(-h * 0.9); c.vy *= Math.exp(-h * 0.9);
      c.x += c.vx * h; c.y += c.vy * h;
      c.ang += c.va * h;
      c.va *= Math.exp(-h * 1.5);
      // La pared de la cámara.
      const dx = c.x - CS / 2, dy = c.y - CS / 2, d = Math.hypot(dx, dy);
      const lim = CR - c.r * 0.8;
      if (d > lim) {
        const nx = dx / d, ny = dy / d;
        c.x = CS / 2 + nx * lim; c.y = CS / 2 + ny * lim;
        const vn = c.vx * nx + c.vy * ny;
        if (vn > 0) {
          c.vx -= vn * nx * 1.35; c.vy -= vn * ny * 1.35;
          // Rodar: la velocidad a lo largo de la pared hace girar el cristal.
          c.va += (c.vx * -ny + c.vy * nx) / Math.max(4, c.r) * 0.5;
          if (vn > 140) tin(vn);
        }
      }
    }
    // Choques entre cristales (como círculos, que es suficiente).
    for (let i = 0; i < cristales.length; i++) {
      const a = cristales[i];
      for (let j = i + 1; j < cristales.length; j++) {
        const b = cristales[j];
        const dx = b.x - a.x, dy = b.y - a.y, min = (a.r + b.r) * 0.72;
        const d2 = dx * dx + dy * dy;
        if (d2 >= min * min || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, sol = (min - d) / 2;
        a.x -= nx * sol; a.y -= ny * sol;
        b.x += nx * sol; b.y += ny * sol;
        const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rv < 0) {
          const imp = -rv * 0.6;
          a.vx -= nx * imp; a.vy -= ny * imp;
          b.vx += nx * imp; b.vy += ny * imp;
          a.va += azar(-1, 1) * imp * 0.01; b.va += azar(-1, 1) * imp * 0.01;
          if (-rv > 180) tin(-rv);
        }
      }
    }
  }
}

function pintarCamara() {
  gc.clearRect(0, 0, CS, CS);
  // La luz del fondo, como mirar hacia una ventana.
  const luz = gc.createRadialGradient(CS / 2, CS / 2, 0, CS / 2, CS / 2, CR);
  luz.addColorStop(0, "#fff4f0");
  luz.addColorStop(0.6, "#f8d8e4");
  luz.addColorStop(1, "#d8a8c8");
  gc.fillStyle = luz;
  gc.fillRect(0, 0, CS, CS);
  gc.globalCompositeOperation = "multiply";
  for (const c of cristales) {
    gc.save();
    gc.translate(c.x, c.y);
    gc.rotate(c.ang);
    gc.globalAlpha = c.alfa;
    gc.fillStyle = c.color;
    trazarForma(gc, c);
    gc.fill();
    gc.restore();
  }
  gc.globalCompositeOperation = "source-over";
  // Los bordes y el brillo de cada cristal, encima.
  for (const c of cristales) {
    gc.save();
    gc.translate(c.x, c.y);
    gc.rotate(c.ang);
    trazarForma(gc, c);
    gc.strokeStyle = "rgba(255,255,255,.55)";
    gc.lineWidth = 1.2;
    gc.stroke();
    gc.globalAlpha = 0.45 + c.brillo * 0.5;
    gc.fillStyle = "#fff";
    gc.beginPath();
    gc.ellipse(-c.r * 0.25, -c.r * 0.3, c.r * 0.28, c.r * 0.12, -0.6, 0, TAU);
    gc.fill();
    gc.restore();
    c.brillo = Math.max(0, c.brillo - 0.01);
  }
}

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A) return;
  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.1) dt = 1 / 60;
  reloj += dt;

  // Sin dedo, el tubo sigue girando un poco por inercia; o se inclina solo.
  const antes = giro;
  if (!dedo) {
    // Inclinar el teléfono también lo gira.
    if (inclinacion !== null) {
      if (paso.inc0 !== undefined) giro += (inclinacion - paso.inc0) * 0.8;
      paso.inc0 = inclinacion;
    }
    vGiro *= Math.exp(-dt * 1.6);
    giro += vGiro * dt;
    // Y si nadie lo toca, gira solito, muy despacio.
    giro += dt * 0.06;
  } else vGiro *= Math.exp(-dt * 10);
  giroAcumulado += Math.abs(giro - antes);
  if (giroAcumulado > TAU * 0.9) {
    giroAcumulado = 0;
    decir(piropo());
    campana(0, 0.03); setTimeout(() => campana(2, 0.03), 160); setTimeout(() => campana(4, 0.03), 320);
  }

  fisica(dt);
  pintarCamara();

  /* ---- La habitación y el tubo ---- */
  g.drawImage(fondo, 0, 0, A, H);
  const { cx, cy, R } = V;

  /* ---- La flor de espejos: un gajo de la cámara, repetido y reflejado ---- */
  const M = CONF.espejos, gajo = Math.PI / M;
  g.save();
  g.translate(cx, cy);
  g.beginPath(); g.arc(0, 0, R, 0, TAU); g.clip();
  g.rotate(giro * 0.35);
  const esc = R / (CR * 0.98);
  // Los espejos miran siempre hacia donde se han juntado los cristales
  // (hacia «abajo» dentro del tubo): así la flor nunca sale vacía.
  const angAbajo = Math.PI / 2 - giro;
  for (let k = 0; k < M * 2; k++) {
    g.save();
    g.rotate(k * gajo);
    if (k % 2) { g.rotate(gajo); g.scale(1, -1); }
    g.beginPath();
    g.moveTo(0, 0);
    g.arc(0, 0, R + 2, -0.004, gajo + 0.004);
    g.closePath();
    g.clip();
    g.scale(esc, esc);
    g.rotate(-(angAbajo - gajo / 2));
    g.drawImage(camara, -CS / 2, -CS / 2);
    g.restore();
  }
  // Un velo de luz en el centro y viñeta hacia el borde, como un ojo que mira.
  const centro = g.createRadialGradient(0, 0, 0, 0, 0, R);
  centro.addColorStop(0, "rgba(255,255,255,.18)");
  centro.addColorStop(0.55, "rgba(255,255,255,0)");
  centro.addColorStop(1, "rgba(40,10,30,.55)");
  g.fillStyle = centro;
  g.fillRect(-R, -R, R * 2, R * 2);
  g.restore();

  /* ---- El aro de latón de la mirilla ---- */
  const aro = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  aro.addColorStop(0, "#f6dc9a");
  aro.addColorStop(0.25, "#9a6a28");
  aro.addColorStop(0.5, "#ffe9b0");
  aro.addColorStop(0.75, "#7a5018");
  aro.addColorStop(1, "#e8c070");
  g.lineWidth = R * 0.09;
  g.strokeStyle = aro;
  g.beginPath(); g.arc(cx, cy, R + R * 0.045, 0, TAU); g.stroke();
  g.lineWidth = 1.2;
  g.strokeStyle = "rgba(60,30,10,.8)";
  g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.stroke();
  g.beginPath(); g.arc(cx, cy, R * 1.09, 0, TAU); g.stroke();
  // Las muescas grabadas, que giran con el tubo.
  g.save();
  g.translate(cx, cy);
  g.rotate(giro);
  g.strokeStyle = "rgba(80,45,10,.6)";
  g.lineWidth = 1;
  for (let i = 0; i < 48; i++) {
    const a = i / 48 * TAU;
    const r1 = R * 1.012, r2 = R * (i % 4 ? 1.035 : 1.06);
    g.beginPath(); g.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); g.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); g.stroke();
  }
  g.fillStyle = "#b8284c";
  const ah = -Math.PI / 2;
  g.beginPath(); g.arc(Math.cos(ah) * R * 1.045, Math.sin(ah) * R * 1.045, R * 0.022, 0, TAU); g.fill();
  g.restore();
  // El brillo del cristal de la mirilla.
  g.globalCompositeOperation = "lighter";
  g.strokeStyle = "rgba(255,255,255,.18)";
  g.lineWidth = R * 0.04;
  g.lineCap = "round";
  g.beginPath(); g.arc(cx, cy, R * 0.9, Math.PI * 1.1, Math.PI * 1.4); g.stroke();
  g.globalCompositeOperation = "source-over";
}

function pintarFondo() {
  const c = document.createElement("canvas");
  c.width = Math.round(A * dpr); c.height = Math.round(H * dpr);
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const gr = x.createRadialGradient(V.cx, V.cy, V.R * 0.8, V.cx, V.cy, Math.max(A, H) * 0.8);
  gr.addColorStop(0, "#3a1830");
  gr.addColorStop(0.5, "#1e0c1c");
  gr.addColorStop(1, "#0a0409");
  x.fillStyle = gr;
  x.fillRect(0, 0, A, H);
  // El resplandor de colores que se escapa por el borde de la mirilla.
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * TAU, r = V.R * azar(1.15, 1.6);
    const px = V.cx + Math.cos(a) * r, py = V.cy + Math.sin(a) * r;
    const col = CONF.colores[i % CONF.colores.length];
    const b = x.createRadialGradient(px, py, 0, px, py, V.R * 0.35);
    b.addColorStop(0, col + "22");
    b.addColorStop(1, col + "00");
    x.fillStyle = b;
    x.fillRect(px - V.R * 0.35, py - V.R * 0.35, V.R * 0.7, V.R * 0.7);
  }
  fondo = c;
}

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const apaisado = A > H * 1.2;
  const R = apaisado ? Math.min(H * 0.36, A * 0.26) : Math.min(A * 0.4, H * 0.28);
  V = { cx: apaisado ? A * 0.34 : A / 2, cy: apaisado ? H * 0.5 : H * 0.45, R };
  if (!camara) {
    camara = document.createElement("canvas");
    camara.width = camara.height = CS;
    gc = camara.getContext("2d");
  }
  pintarFondo();
}
new ResizeObserver(() => requestAnimationFrame(medir)).observe(mundo);
medir();
sembrar();
// Que los cristales ya estén asentados al abrir.
for (let i = 0; i < 90; i++) fisica(1 / 60);
requestAnimationFrame(paso);
})();
</script>
