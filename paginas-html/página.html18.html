<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La máquina de escribir</title>

<style>
/* ══════════════════════════════════════════════════════════════════════
   Todo dentro de .maquina-mundo, con prefijo `mq-` en cada clase.
   ══════════════════════════════════════════════════════════════════════ */

html, body { margin: 0; height: 100%; }

.maquina-mundo {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  contain: layout paint;
  background:
    radial-gradient(ellipse 110% 70% at 50% 4%, #3a3230, transparent 62%),
    linear-gradient(174deg, #2b2422 0%, #1e1918 60%, #141110 100%);
  color: #e6ddd0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;

  --tecla: #2e2a28;
  --tecla-luz: #4a4340;

  --seguro-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seguro-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --e-suave: cubic-bezier(0.22, 1, 0.36, 1);
}

.maquina-mundo .mq-todo {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  padding:
    calc(var(--seguro-t) + 12px) 12px
    calc(var(--seguro-b) + var(--barra) + 12px) 12px;
  gap: 10px;
  box-sizing: border-box;
  z-index: 2;
}

/* ---- El papel ---------------------------------------------------------- */

.maquina-mundo .mq-papel {
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  border-radius: 3px 3px 0 0;
  background:
    repeating-linear-gradient(0deg, transparent 0 25px, rgba(150, 130, 100, 0.16) 25px 26px),
    linear-gradient(180deg, #f7f0e0 0%, #efe5d2 82%, #e2d5bd 100%);
  box-shadow: 0 -2px 0 rgba(255, 255, 255, 0.4), 0 14px 30px rgba(0, 0, 0, 0.5);
  overflow: hidden;
  padding: 22px 20px 16px;
  box-sizing: border-box;
}

/* El rodillo de arriba, por donde sale el papel. */
.maquina-mundo .mq-rodillo {
  height: 20px;
  flex: 0 0 auto;
  border-radius: 10px;
  background: linear-gradient(180deg, #4a4340 0%, #2a2422 55%, #181414 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 3px 8px rgba(0, 0, 0, 0.5);
  position: relative;
}
.maquina-mundo .mq-rodillo::before,
.maquina-mundo .mq-rodillo::after {
  content: "";
  position: absolute;
  top: 50%;
  width: 16px; height: 16px;
  margin-top: -8px;
  border-radius: 50%;
  background: radial-gradient(circle at 36% 32%, #8a7e6e, #3a3330 70%);
}
.maquina-mundo .mq-rodillo::before { left: -6px; }
.maquina-mundo .mq-rodillo::after  { right: -6px; }

.maquina-mundo .mq-texto {
  margin: 0;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: clamp(0.78rem, 3.5vw, 0.95rem);
  line-height: 1.75;
  color: #3a2f26;
  white-space: pre-wrap;
  word-break: break-word;
  /* Las letras no salen perfectas: una máquina de escribir golpea. */
  text-shadow: 0.4px 0.3px 0 rgba(90, 70, 50, 0.3);
}
.maquina-mundo .mq-cursor {
  display: inline-block;
  width: 0.62em;
  border-bottom: 2px solid #3a2f26;
  animation: mq-parpadeo 1.1s steps(1) infinite;
  vertical-align: -2px;
}
@keyframes mq-parpadeo { 50% { opacity: 0; } }

/* Lo que va escribiendo sola la máquina se marca distinto. */
.maquina-mundo .mq-suyo { color: #9c4a34; }

/* ---- El teclado --------------------------------------------------------- */

.maquina-mundo .mq-teclado {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 10px 8px 12px;
  border-radius: 10px;
  background: linear-gradient(180deg, #3a3330 0%, #241f1d 60%, #171313 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 10px 26px rgba(0, 0, 0, 0.55);
}
.maquina-mundo .mq-fila {
  display: flex;
  gap: 4px;
  justify-content: center;
}
.maquina-mundo .mq-tecla {
  flex: 1 1 0;
  min-width: 0;
  aspect-ratio: 1 / 1.08;
  max-width: 40px;
  border: 0;
  padding: 0;
  border-radius: 50% 50% 44% 44%;
  background: radial-gradient(circle at 40% 28%, var(--tecla-luz), var(--tecla) 62%, #191514 100%);
  box-shadow: 0 3px 0 #120f0e, 0 5px 8px rgba(0, 0, 0, 0.5);
  color: #ddd2c2;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: clamp(0.6rem, 2.9vw, 0.78rem);
  cursor: pointer;
  transition: transform 70ms ease, box-shadow 70ms ease;
}
.maquina-mundo .mq-tecla:active,
.maquina-mundo .mq-tecla.is-pulsada {
  transform: translateY(3px);
  box-shadow: 0 0 0 #120f0e, 0 1px 3px rgba(0, 0, 0, 0.5);
}
.maquina-mundo .mq-tecla:focus-visible { outline: 2px solid #c98f5a; outline-offset: 2px; }
.maquina-mundo .mq-ancha { flex: 3 1 0; max-width: none; border-radius: 8px; aspect-ratio: auto; height: 30px; }

@media (prefers-reduced-motion: reduce) {
  .maquina-mundo * { transition-duration: 1ms !important; animation: none !important; }
}
</style>
</head>
<body>

<div class="maquina-mundo" id="mundo">
  <div class="mq-todo">
    <div class="mq-rodillo" aria-hidden="true"></div>
    <div class="mq-papel">
      <p class="mq-texto" id="texto" aria-live="polite"></p>
    </div>
    <div class="mq-teclado" id="teclado" role="group" aria-label="Teclado"></div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN EDITABLE
   ══════════════════════════════════════════════════════════════════════ */

const CONF = {

  /* ---- LO QUE HAY ESCRITO AL EMPEZAR ---------------------------------- */
  encabezado: "Para ti,\n\n",

  /* ---- LAS PALABRAS QUE LA MÁQUINA RECONOCE ---------------------------
     Si ella escribe alguna de estas, la máquina le contesta sola: sigue
     escribiendo por su cuenta lo que ponga aquí.

     Se comparan en minúsculas y sin tildes, así que da igual cómo se
     escriban.                                                           */
  respuestas: [
    { palabra: "te quiero", dice: "\n...yo tambien. Mucho mas de lo que cabe en esta hoja.\n" },
    { palabra: "hola",      dice: "\n...hola. Llevaba todo el dia esperando a que escribieras.\n" },
    { palabra: "amor",      dice: "\n...esa palabra la escribo yo mejor: A M O R. Ya esta.\n" },
    { palabra: "gracias",   dice: "\n...no. Gracias a ti, que es distinto.\n" },
    { palabra: "siempre",   dice: "\n...siempre es mucho tiempo. Lo firmo igual.\n" },
    { palabra: "perdon",    dice: "\n...no hace falta. De verdad que no.\n" },
    { palabra: "vale",      dice: "\n...vale. Me encanta cuando dices vale.\n" },
    { palabra: "no se",     dice: "\n...yo tampoco. Y aun asi, aqui estamos.\n" },
    { palabra: "beso",      dice: "\n...toma dos.\n" },
    { palabra: "fin",       dice: "\n...esto no tiene fin. Sigue escribiendo.\n" },
  ],

  /* ---- CÓMO ESCRIBE SOLA ---------------------------------------------- */
  msPorLetra: 62,          // lo que tarda entre letra y letra

  /* ---- EL TECLADO ------------------------------------------------------
     Tres filas. Es un teclado de verdad, con la Ñ donde le toca.       */
  filas: [
    "QWERTYUIOP",
    "ASDFGHJKLÑ",
    "ZXCVBNM",
  ],

  maxLetras: 1400,         // a partir de aquí se va comiendo lo de arriba
};

/* ══════════════════════════════════════════════════════════════════════
   La maquinaria.
   ══════════════════════════════════════════════════════════════════════ */

const mundo   = document.getElementById("mundo");
const elTexto = document.getElementById("texto");
const teclado = document.getElementById("teclado");
const papel   = elTexto.parentElement;

const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
const azar  = (a, b) => a + Math.random() * (b - a);

/* El texto se guarda en trozos: cada uno sabe si lo escribió ella o la
   máquina, y así se pinta de un color o de otro sin tener que interpretar
   nada al pintar. */
const trozos = [{ quien: "yo", txt: CONF.encabezado }];
let escribiendoSola = null;

function pintar() {
  elTexto.textContent = "";
  for (const t of trozos) {
    const s = document.createElement("span");
    if (t.quien === "ella") s.className = "mq-suyo";
    s.textContent = t.txt;
    elTexto.append(s);
  }
  const cur = document.createElement("span");
  cur.className = "mq-cursor";
  cur.setAttribute("aria-hidden", "true");
  elTexto.append(cur);
  /* Siempre a la vista lo último escrito. */
  papel.scrollTop = papel.scrollHeight;
}

function texto() {
  return trozos.map((t) => t.txt).join("");
}

function escribir(ch, quien) {
  const ultimo = trozos[trozos.length - 1];
  if (ultimo && ultimo.quien === quien) ultimo.txt += ch;
  else trozos.push({ quien, txt: ch });

  /* Si se hace muy largo, se come lo de arriba. Un papel de verdad se
     acabaría; éste sigue, pero sin crecer sin límite. */
  let total = texto().length;
  while (total > CONF.maxLetras && trozos.length > 1) {
    const sobra = total - CONF.maxLetras;
    if (trozos[0].txt.length <= sobra) { total -= trozos[0].txt.length; trozos.shift(); }
    else { trozos[0].txt = trozos[0].txt.slice(sobra); total -= sobra; }
  }
  pintar();
}

function borrar() {
  for (let i = trozos.length - 1; i >= 0; i--) {
    if (!trozos[i].txt.length) { trozos.splice(i, 1); continue; }
    trozos[i].txt = trozos[i].txt.slice(0, -1);
    if (!trozos[i].txt.length) trozos.splice(i, 1);
    break;
  }
  if (!trozos.length) trozos.push({ quien: "yo", txt: "" });
  pintar();
}

/* ---- El teclado --------------------------------------------------------- */

function crearTeclado() {
  CONF.filas.forEach((letras) => {
    const fila = document.createElement("div");
    fila.className = "mq-fila";
    for (const L of letras) fila.append(tecla(L, () => teclear(L)));
    teclado.append(fila);
  });
  /* La última fila: espacio, borrar y salto de línea. */
  const fila = document.createElement("div");
  fila.className = "mq-fila";
  fila.append(tecla("⌫", () => { borrar(); golpe(0.7); }, "Borrar"));
  const esp = tecla("espacio", () => teclear(" "), "Espacio");
  esp.classList.add("mq-ancha");
  fila.append(esp);
  fila.append(tecla("↵", () => { escribir("\n", "yo"); campanilla(); }, "Nueva línea"));
  teclado.append(fila);
}

function tecla(rotulo, alPulsar, nombre) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "mq-tecla";
  b.textContent = rotulo;
  b.setAttribute("aria-label", nombre || rotulo);
  b.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    b.classList.add("is-pulsada");
    alPulsar();
  });
  const soltar = () => b.classList.remove("is-pulsada");
  b.addEventListener("pointerup", soltar);
  b.addEventListener("pointercancel", soltar);
  b.addEventListener("pointerleave", soltar);
  b.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); alPulsar(); }
  });
  return b;
}

/* También con el teclado de verdad, si lo hay. */
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "Backspace") { e.preventDefault(); borrar(); golpe(0.7); return; }
  if (e.key === "Enter")     { e.preventDefault(); escribir("\n", "yo"); campanilla(); return; }
  if (e.key.length === 1)    { e.preventDefault(); teclear(e.key.toUpperCase()); }
});

function teclear(L) {
  /* Si la máquina está contestando, se calla y le deja el sitio.
     Antes se tragaba la tecla, y como el saludo del principio tarda dos
     segundos y medio, las primeras letras que escribías no salían: la
     página parecía rota justo al llegar. Una máquina de escribir no
     ignora nunca un golpe. */
  if (escribiendoSola) escribiendoSola = null;
  escribir(L, "yo");
  golpe(1);
  mirarPalabras();
}

/* ---- Las respuestas ------------------------------------------------------ */

/** Sin tildes y en minúsculas: así «PERDÓN» encuentra «perdon». */
function pelar(s) {
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
}

const yaDichas = new Set();

function mirarPalabras() {
  const fin = pelar(texto()).slice(-30);
  for (const r of CONF.respuestas) {
    if (!fin.endsWith(pelar(r.palabra))) continue;
    if (yaDichas.has(r.palabra)) continue;
    yaDichas.add(r.palabra);
    contestar(r.dice);
    /* Se puede volver a provocar pasado un rato: si no, la máquina se
       queda muda en una conversación larga. */
    setTimeout(() => yaDichas.delete(r.palabra), 45000);
    return;
  }
  mirarSecretos(fin);
}

function contestar(frase) {
  escribiendoSola = { i: 0, frase };
  const siguiente = () => {
    if (!escribiendoSola) return;
    const { i, frase } = escribiendoSola;
    if (i >= frase.length) { escribiendoSola = null; return; }
    escribir(frase[i], "ella");
    if (frase[i] !== "\n" && frase[i] !== " ") golpe(0.8);
    if (frase[i] === "\n") campanilla();
    escribiendoSola.i++;
    setTimeout(siguiente, suave ? 1 : CONF.msPorLetra * azar(0.7, 1.5));
  };
  setTimeout(siguiente, suave ? 1 : 420);
}

/* ---- Sonido -------------------------------------------------------------- */

let audio = null;

function despertar() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
  } catch { audio = null; }
  return audio;
}

/** El golpe de un tipo contra el papel: un chasquido, no un tono. */
function golpe(fuerza) {
  if (!despertar()) return;
  const t = audio.currentTime;
  const n = Math.floor(audio.sampleRate * 0.045);
  const buf = audio.createBuffer(1, n, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
  const src = audio.createBufferSource();
  src.buffer = buf;
  const f = audio.createBiquadFilter();
  f.type = "bandpass";
  f.frequency.value = azar(1500, 2600);
  f.Q.value = 1.1;
  const g = audio.createGain();
  g.gain.value = 0.22 * fuerza;
  src.connect(f).connect(g).connect(audio.destination);
  src.start(t);
  /* Y el golpe del carro, más grave, a la vez. */
  const o = audio.createOscillator();
  const og = audio.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(azar(120, 190), t);
  og.gain.setValueAtTime(0.06 * fuerza, t);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  o.connect(og).connect(audio.destination);
  o.start(t); o.stop(t + 0.1);
}

/** La campanilla del final de línea. Es el sonido de la máquina. */
function campanilla() {
  if (!despertar()) return;
  const t = audio.currentTime;
  for (const [f, v] of [[2093, 0.07], [3136, 0.03]]) {
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + 1.2);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LOS SECRETOS. No están en la lista de respuestas.
   ══════════════════════════════════════════════════════════════════════ */

/* 1. Escribir su nombre —lo que pongas aquí— hace que la máquina se
      quede un momento callada y luego escriba algo distinto.          */
const SU_NOMBRE = "marissa";
let nombreDicho = false;

/* 2. Escribir la misma letra siete veces seguidas: la máquina se atasca
      y lo dice.                                                       */
let ultima = "", repes = 0;

/* 3. Dejar de escribir dos minutos: la máquina escribe sola, sin que se
      lo pidan.                                                        */
let ocioso = null;
const ESPERA_OCIO = 100000;

function mirarSecretos(fin) {
  /* — el nombre — */
  if (!nombreDicho && fin.endsWith(SU_NOMBRE)) {
    nombreDicho = true;
    setTimeout(() => {
      contestar("\n\n...ese nombre lo escribo despacio, que no se me\nestropee.\n\n");
      campanilla();
    }, 700);
    setTimeout(() => { nombreDicho = false; }, 60000);
    return;
  }

  /* — la letra atascada — */
  const c = fin.slice(-1);
  if (c && c === ultima) repes++;
  else { ultima = c; repes = 1; }
  if (repes === 7) {
    repes = 0;
    contestar("\n...se ha atascado el tipo. Damelo, que lo suelto yo.\n");
    return;
  }

  /* — el ocio — */
  clearTimeout(ocioso);
  ocioso = setTimeout(() => {
    if (escribiendoSola) return;
    contestar("\n...sigo aqui, por si quieres contarme algo.\n");
  }, ESPERA_OCIO);
}

/* ---- Arranque -------------------------------------------------------------- */

crearTeclado();
pintar();
/* La máquina saluda ella sola al llegar. */
setTimeout(() => contestar("Escribe lo que quieras. Yo te contesto.\n\n"), 900);

})();
</script>
</body>
</html>
