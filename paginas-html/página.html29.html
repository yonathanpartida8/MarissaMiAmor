<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El globo</title>

<style>
/* ══════════════════════════════════════════════════════════════════════
   Todo dentro de .globo-mundo, con prefijo `gl-` en cada clase.
   ══════════════════════════════════════════════════════════════════════ */

html, body { margin: 0; height: 100%; }

.globo-mundo {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  contain: layout paint;
  background: #b8dcf0;
  color: #3a4450;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;

  --seguro-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seguro-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --e-suave: cubic-bezier(0.22, 1, 0.36, 1);
}

.globo-mundo .gl-lienzo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  /* Los toques los recoge `.gl-toque`, que va justo encima. */
  pointer-events: none;
}

/* El cielo entero. El libro sólo se queda el barrido que empieza en sus
   24-44 px de borde. */
.globo-mundo .gl-toque {
  position: absolute;
  inset: 0;
  touch-action: none;
  z-index: 2;
  cursor: pointer;
}

.globo-mundo .gl-ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  padding:
    calc(var(--seguro-t) + 20px) 22px
    calc(var(--seguro-b) + var(--barra) + 16px) 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.globo-mundo .gl-titulo {
  margin: 0;
  font-family: var(--tipo-titulo, Georgia, serif);
  font-size: clamp(1rem, 4.4vw, 1.4rem);
  font-weight: 500;
  letter-spacing: 0.06em;
  color: #4a6a80;
  opacity: 0.85;
  transition: opacity 800ms var(--e-suave), color 1200ms var(--e-suave);
}
.globo-mundo.is-subiendo .gl-titulo { opacity: 0.2; }

.globo-mundo .gl-pie {
  margin: 0;
  min-height: 3.8em;
  max-width: 23em;
  font-size: clamp(0.82rem, 3.4vw, 0.97rem);
  line-height: 1.55;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 660ms var(--e-suave), transform 660ms var(--e-suave), color 1200ms var(--e-suave);
  color: #3f4b56;
}
.globo-mundo .gl-pie.is-visible { opacity: 0.94; transform: none; }
.globo-mundo .gl-pie em {
  display: block;
  margin-top: 0.3em;
  font-family: var(--tipo-mano, "Segoe Script", cursive);
  font-size: 1.16em;
  font-style: normal;
  color: #c2506a;
}

.globo-mundo .gl-altura {
  position: absolute;
  right: 20px;
  top: calc(var(--seguro-t) + 20px);
  font-variant-numeric: tabular-nums;
  font-size: 0.74rem;
  letter-spacing: 0.14em;
  color: #4a6a80;
  opacity: 0.85;
  transition: color 1200ms var(--e-suave);
}
.globo-mundo.is-alto .gl-altura,
.globo-mundo.is-alto .gl-titulo { color: #cfe0f4; }
.globo-mundo.is-alto .gl-pie { color: #e4ecf8; }

@media (prefers-reduced-motion: reduce) {
  .globo-mundo * { transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<div class="globo-mundo" id="mundo">
  <canvas class="gl-lienzo" id="lienzo"></canvas>
  <div class="gl-toque" id="toque" aria-hidden="true"></div>
  <div class="gl-ui">
    <h1 class="gl-titulo" id="titulo">Dale al quemador</h1>
    <p class="gl-pie" id="pie" role="status" aria-live="polite"></p>
  </div>
  <div class="gl-altura" id="altura" aria-hidden="true"></div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN EDITABLE
   ══════════════════════════════════════════════════════════════════════ */

const CONF = {

  /* ---- LAS INICIALES --------------------------------------------------
     Van cosidas en la tela del globo, en el gajo del medio.           */
  iniciales: "y.m",

  /* ---- EL VUELO -------------------------------------------------------
     Se toca para dar gas: el globo sube. Sin gas, baja solo. Y el aire
     se enfría, así que hay que ir dándole de vez en cuando.           */
  empuje: 320,          // lo que sube por cada toque
  enfria: 0.55,         // cuánto pierde por segundo
  bajaSola: 120,        // a qué velocidad cae sin gas

  /* ---- LAS CAPAS DEL CIELO --------------------------------------------
     Todo el viaje es UN número, los metros. Los colores, lo que se ve
     por la ventana y lo que se lee salen de él.                       */
  capas: [
    { m: 0,    cielo: ["#8fd0ee", "#e8f0d8"], texto: "Todavía se oye el pueblo.",               firma: "Agárrate, que vamos." },
    { m: 400,  cielo: ["#7ac4ea", "#c8e4f2"], texto: "Ya se ven los tejados pequeñitos.",       firma: "El tuyo es ese de ahí." },
    { m: 1200, cielo: ["#5fa8de", "#a8d0ec"], texto: "Estamos a la altura de los pájaros.",      firma: "Nos están mirando raro." },
    { m: 2400, cielo: ["#3f7fc4", "#7fb4e0"], texto: "Aquí arriba hace un frío estupendo.",      firma: "Ven, que te tapo." },
    { m: 4000, cielo: ["#2a5296", "#4d82c4"], texto: "Esa nube de ahí la hemos atravesado.",     firma: "Sabías tú que no se moja." },
    { m: 6500, cielo: ["#152e64", "#2a4f96"], texto: "Ya casi no hay aire.",                     firma: "Respira despacio." },
    { m: 9000, cielo: ["#07132e", "#12265c"], texto: "Se ve la curva de la Tierra.",             firma: "Y sigue siendo pequeña comparada." },
    { m: 12000, cielo: ["#020610", "#070f28"], texto: "Esto ya no es cielo. Esto es lo otro.",   firma: "No teníamos que haber llegado tan lejos, y mira." },
  ],

  /* ---- LAS NUBES ------------------------------------------------------- */
  nubes: 16,
};

/* ══════════════════════════════════════════════════════════════════════
   La maquinaria.
   ══════════════════════════════════════════════════════════════════════ */

const mundo  = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const zona   = document.getElementById("toque");
const elPie  = document.getElementById("pie");
const elAlt  = document.getElementById("altura");
const ctx    = lienzo.getContext("2d", { alpha: false });

const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
const azar  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const damp  = (act, obj, k, dt) => obj + (act - obj) * Math.exp(-k * dt);
const mez   = (a, b, t) => a + (b - a) * t;

function mezColor(c1, c2, t) {
  const p = (c) => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const [r1, g1, b1] = p(c1), [r2, g2, b2] = p(c2);
  return `rgb(${Math.round(mez(r1, r2, t))},${Math.round(mez(g1, g2, t))},${Math.round(mez(b1, b2, t))})`;
}

let A = 0, H = 0, dpr = 1;
let gx = 0, gy = 0, gr = 0;     // el globo: centro y radio

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width  = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gr = Math.min(A * 0.26, H * 0.17);
  gx = A * 0.5;
  gy = H * 0.36;
  sembrarNubes();
}
new ResizeObserver(medir).observe(mundo);

/* ---- La altura -------------------------------------------------------------- */

let metros = 0;
let velocidad = 0;
let gas = 0;                 // cuánto calor le queda, 0..1
let llama = 0;

function capaEn(m) {
  const C = CONF.capas;
  for (let i = C.length - 1; i >= 0; i--) {
    if (m >= C[i].m) {
      const j = Math.min(i + 1, C.length - 1);
      const span = Math.max(1, C[j].m - C[i].m);
      return { a: C[i], b: C[j], k: clamp((m - C[i].m) / span, 0, 1), i };
    }
  }
  return { a: C[0], b: C[0], k: 0, i: 0 };
}

/* ---- El quemador ------------------------------------------------------------- */

function enPantalla(e) {
  const r = mundo.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

let apretando = false;

zona.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  zona.setPointerCapture(e.pointerId);
  apretando = true;
  despertar();
  mundo.classList.add("is-subiendo");
  mirarSecretos(enPantalla(e));
});

const soltar = () => { apretando = false; pararLlama(); };
zona.addEventListener("pointerup", soltar);
zona.addEventListener("pointercancel", soltar);

/* ---- Las nubes ---------------------------------------------------------------
   Cada nube tiene SU altura en metros, no su posición en pantalla. Al
   subir, se calcula dónde cae: así el cielo es infinito y no hay que
   reciclar nada a mano.                                                    */

let nubes = [];

function sembrarNubes() {
  nubes = [];
  for (let i = 0; i < CONF.nubes; i++) {
    nubes.push({
      x: Math.random(),
      m: azar(-200, 7000),
      esc: azar(0.6, 2.1),
      v: azar(-0.004, 0.004),
      bultos: Array.from({ length: 5 }, (_, k) => ({
        dx: (k - 2) * 0.5 + azar(-0.14, 0.14),
        dy: azar(-0.1, 0.12),
        r: azar(0.5, 1),
      })),
    });
  }
}

/* ---- Los textos --------------------------------------------------------------- */

let pidiendo = null;
let bloqueado = 0;
let dichaCapa = -1;

function decir(texto, firma, importante) {
  const ahora = performance.now();
  if (!importante && ahora < bloqueado) return;
  if (pidiendo === texto) return;
  pidiendo = texto;
  if (importante) bloqueado = ahora + 4200;
  elPie.classList.remove("is-visible");
  setTimeout(() => {
    elPie.textContent = texto;
    if (firma) {
      const em = document.createElement("em");
      em.textContent = firma;
      elPie.append(em);
    }
    elPie.classList.add("is-visible");
  }, suave ? 10 : 290);
}

/* ---- Sonido: el quemador ------------------------------------------------------ */

let audio = null, maestro = null;
let llamaNodo = null, llamaGain = null;

function despertar() {
  try {
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      maestro = audio.createGain();
      maestro.gain.value = 0.6;
      maestro.connect(audio.destination);
    }
    if (audio.state === "suspended") audio.resume();
  } catch { audio = null; }
  return audio;
}

/** El rugido del quemador: ruido grave y fuerte, con un poco de sibilante. */
function arrancarLlama() {
  if (!despertar() || llamaNodo) return;
  const n = audio.sampleRate * 2;
  const buf = audio.createBuffer(1, n, audio.sampleRate);
  const d = buf.getChannelData(0);
  let ult = 0;
  for (let i = 0; i < n; i++) {
    const blanco = Math.random() * 2 - 1;
    ult = 0.88 * ult + 0.12 * blanco;
    d[i] = ult * 3.4;
  }
  llamaNodo = audio.createBufferSource();
  llamaNodo.buffer = buf;
  llamaNodo.loop = true;
  const f = audio.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.value = 900;
  llamaGain = audio.createGain();
  llamaGain.gain.value = 0;
  llamaGain.gain.linearRampToValueAtTime(0.22, audio.currentTime + 0.08);
  llamaNodo.connect(f).connect(llamaGain).connect(maestro);
  llamaNodo.start();
}

function pararLlama() {
  if (!llamaNodo) return;
  try {
    llamaGain.gain.linearRampToValueAtTime(0, audio.currentTime + 0.18);
    llamaNodo.stop(audio.currentTime + 0.25);
  } catch { /* ya estaba */ }
  llamaNodo = null;
}

function campana(hz) {
  if (!despertar()) return;
  const t = audio.currentTime;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(hz, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.07, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.5);
  o.connect(g).connect(maestro);
  o.start(t); o.stop(t + 1.6);
}

/* ══════════════════════════════════════════════════════════════════════
   LOS SECRETOS
   ══════════════════════════════════════════════════════════════════════ */

/* 1. Pasar de los doce mil: se apagan las nubes, salen las estrellas y
      se ve la Tierra redonda ahí abajo.                               */
let espacio = 0;
let espacioDicho = false;

/* 2. Tocar la cesta (abajo del globo): sale lo que llevamos dentro, que
      es una manta, un termo y poco más.                               */
let cestaAbierta = 0;

/* 3. Bajar del todo después de haber subido mucho: aterriza en el mismo
      prado y lo dice.                                                 */
let subioMucho = false;
let aterrizado = false;

function mirarSecretos(p) {
  const cy = gy + gr * 1.95;
  if (p && Math.hypot(p.x - gx, p.y - cy) < gr * 0.45) {
    cestaAbierta = cestaAbierta > 0.5 ? 0 : 1;
    if (cestaAbierta) {
      decir("En la cesta llevamos una manta y un termo.", "Y el termo está lleno. Lo he mirado.", true);
      campana(523);
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */

let t0 = performance.now();
let reloj = 0;

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A || !H) return;

  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.5) dt = 1 / 60;
  else if (dt > 0.1) dt = 0.1;
  reloj += dt;

  /* El gas: sube apretando y se enfría solo. Que se enfríe es lo que
     obliga a estar pendiente, y eso es de lo que va volar en globo. */
  if (apretando) {
    gas = Math.min(1, gas + dt * 1.5);
    arrancarLlama();
  }
  gas = Math.max(0, gas - CONF.enfria * dt);
  llama = damp(llama, apretando ? 1 : 0, 7, dt);

  const sube = gas * CONF.empuje - CONF.bajaSola;
  velocidad = damp(velocidad, sube, 1.1, dt);
  metros = Math.max(0, metros + velocidad * dt);

  elAlt.textContent = `${Math.round(metros)} m`;
  mundo.classList.toggle("is-alto", metros > 5200);
  if (!apretando && velocidad < -20) mundo.classList.remove("is-subiendo");

  if (metros > 4000) subioMucho = true;
  if (subioMucho && metros < 30 && !aterrizado) {
    aterrizado = true;
    decir("Hemos aterrizado en el mismo prado.", "Todo ese viaje para volver aquí. Perfecto.", true);
    campana(392);
  }
  if (metros > 200) aterrizado = false;

  if (metros > 12000) {
    espacio = Math.min(1, espacio + dt * 0.3);
    if (!espacioDicho && espacio > 0.6) {
      espacioDicho = true;
      decir("Mira hacia abajo.", "Eso redondo de ahí es todo lo demás. Y estamos aquí.", true);
      campana(880);
    }
  } else {
    espacio = Math.max(0, espacio - dt * 0.6);
  }

  if (cestaAbierta > 0 && cestaAbierta < 1) cestaAbierta = Math.min(1, cestaAbierta + dt * 3);

  const c = capaEn(metros);
  if (c.i !== dichaCapa) {
    dichaCapa = c.i;
    decir(c.a.texto, c.a.firma, true);
  }

  dibujar(dt, c);
}

function dibujar(dt, c) {
  /* --- el cielo --- */
  const c0 = mezColor(c.a.cielo[0], c.b.cielo[0], c.k);
  const c1 = mezColor(c.a.cielo[1], c.b.cielo[1], c.k);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, c0);
  g.addColorStop(1, c1);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, A, H);

  /* --- las estrellas, que sólo se ven muy arriba --- */
  const noche = clamp((metros - 5500) / 5000, 0, 1);
  if (noche > 0.02) {
    for (let i = 0; i < 110; i++) {
      const sx = ((i * 61) % 100) / 100 * A;
      const sy = ((i * 37) % 100) / 100 * H;
      ctx.globalAlpha = noche * (0.3 + 0.5 * Math.sin(reloj * 1.3 + i));
      ctx.fillStyle = "#e4ecff";
      ctx.beginPath();
      ctx.arc(sx, sy, 0.7 + (i % 3) * 0.5, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* --- el sol --- */
  ctx.globalAlpha = 1 - noche * 0.5;
  const sg = ctx.createRadialGradient(A * 0.8, H * 0.15, 0, A * 0.8, H * 0.15, Math.min(A, H) * 0.45);
  sg.addColorStop(0, "rgba(255, 250, 220, 0.6)");
  sg.addColorStop(1, "rgba(255, 250, 220, 0)");
  ctx.fillStyle = sg;
  ctx.fillRect(0, 0, A, H);
  ctx.globalAlpha = 1;

  /* --- el suelo, que se aleja --- */
  dibujarSuelo();

  /* --- las nubes --- */
  for (const n of nubes) {
    n.x += n.v * dt;
    if (n.x > 1.25) n.x = -0.25;
    if (n.x < -0.25) n.x = 1.25;
    /* Su altura en pantalla sale de la diferencia con la nuestra. */
    const dy = (n.m - metros) * -0.22;
    const y = H * 0.5 + dy;
    if (y < -H * 0.4 || y > H * 1.4) continue;
    const r = Math.min(A, H) * 0.1 * n.esc;
    ctx.globalAlpha = clamp(1 - noche * 1.2, 0, 1) * 0.82;
    ctx.fillStyle = "#ffffff";
    for (const b of n.bultos) {
      ctx.beginPath();
      ctx.arc(n.x * A + b.dx * r * 1.7, y + b.dy * r, r * b.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* --- el globo --- */
  dibujarGlobo();
}

function dibujarSuelo() {
  /* El prado se hunde según subimos, y a partir de cierta altura se
     convierte en la curva de la Tierra. Un solo número lo lleva. */
  const baja = metros * 0.22;
  const y = H * 0.9 + baja;
  if (y > H * 1.6 && espacio < 0.02) return;

  if (espacio > 0.02) {
    /* La Tierra, redonda. El radio crece con la altura, así que la curva
       se va viendo cada vez más. */
    const R = Math.max(A, H) * (2.6 - espacio * 1.2);
    const cyT = H * 0.92 + R;
    const gg = ctx.createRadialGradient(A * 0.3, cyT - R * 0.9, 0, A * 0.5, cyT, R);
    gg.addColorStop(0, "#8fd0ee");
    gg.addColorStop(0.5, "#4a8fb8");
    gg.addColorStop(1, "#1e4a6e");
    ctx.globalAlpha = espacio;
    ctx.fillStyle = gg;
    ctx.beginPath();
    ctx.arc(A * 0.5, cyT, R, 0, 6.283);
    ctx.fill();
    /* El halo de atmósfera en el canto. */
    ctx.strokeStyle = "rgba(160, 220, 255, 0.5)";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(A * 0.5, cyT, R + 3, Math.PI * 1.15, Math.PI * 1.85);
    ctx.stroke();
    ctx.globalAlpha = 1;
    return;
  }

  ctx.globalAlpha = clamp(1 - metros / 9000, 0, 1);
  const gg = ctx.createLinearGradient(0, y, 0, y + H * 0.4);
  gg.addColorStop(0, "#9cc27e");
  gg.addColorStop(1, "#6f9a58");
  ctx.fillStyle = gg;
  ctx.beginPath();
  ctx.moveTo(0, H * 2);
  ctx.lineTo(0, y);
  for (let x = 0; x <= A; x += 14) ctx.lineTo(x, y - Math.sin(x * 0.012) * 8);
  ctx.lineTo(A, H * 2);
  ctx.closePath();
  ctx.fill();

  /* Las casitas y los campos, que se hacen pequeños al subir. */
  const esc = clamp(1 - metros / 2600, 0.12, 1);
  for (let i = 0; i < 12; i++) {
    const x = ((i * 47) % 100) / 100 * A;
    const w = A * 0.05 * esc;
    const h = H * 0.02 * esc;
    ctx.fillStyle = i % 3 ? "rgba(140, 110, 90, 0.7)" : "rgba(170, 140, 110, 0.7)";
    ctx.fillRect(x, y + H * 0.03 - h, w, h);
  }
  ctx.globalAlpha = 1;
}

function dibujarGlobo() {
  /* La cesta se balancea un poco detrás del globo: el globo tira y la
     cesta sigue, con retraso. Es lo que hace que se vea que cuelga. */
  const meneo = Math.sin(reloj * 0.7) * 0.05 + Math.sin(reloj * 1.3) * 0.02;
  const bx = gx + Math.sin(meneo) * gr * 1.9;
  const by = gy + Math.cos(meneo) * gr * 1.95;

  /* --- la llama, dentro del globo --- */
  if (llama > 0.02) {
    const fy = gy + gr * 1.05;
    const gl = ctx.createRadialGradient(gx, fy, 0, gx, fy, gr * 0.7);
    gl.addColorStop(0, `rgba(255, 230, 140, ${0.85 * llama})`);
    gl.addColorStop(0.4, `rgba(255, 150, 50, ${0.5 * llama})`);
    gl.addColorStop(1, "rgba(255, 120, 40, 0)");
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(gx, fy, gr * 0.7, 0, 6.283); ctx.fill();
  }

  /* --- la tela --- */
  /* Ocho gajos, cada uno una tajada de elipse con su color. Es lo que
     hace que se lea como un globo de tela y no como un huevo. */
  const gajos = 8;
  const colores = ["#e8536a", "#f2a03a", "#f2d24a", "#5cb46a"];
  for (let i = 0; i < gajos; i++) {
    const a0 = (i / gajos) * 6.283 - Math.PI / 2;
    const a1 = ((i + 1) / gajos) * 6.283 - Math.PI / 2;
    const col = colores[i % colores.length];
    ctx.beginPath();
    /* La forma del globo: una elipse con la parte de abajo recogida en
       punta hacia la cesta. */
    for (let k = 0; k <= 12; k++) {
      const t = a0 + (a1 - a0) * (k / 12);
      const p = puntoGlobo(t);
      k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
    }
    ctx.lineTo(gx, gy + gr * 1.5);
    ctx.closePath();
    /* Los gajos que miran a la luz salen más claros. */
    const luz = 0.5 + 0.5 * Math.cos(a0 + 0.6);
    const g2 = ctx.createLinearGradient(gx - gr, gy - gr, gx + gr, gy + gr);
    g2.addColorStop(0, aclarar(col, 0.3 * luz));
    g2.addColorStop(1, aclarar(col, -0.28 + 0.2 * luz));
    ctx.fillStyle = g2;
    ctx.fill();
  }

  /* LAS INICIALES, cosidas en el gajo de delante. */
  ctx.save();
  ctx.fillStyle = "rgba(255, 250, 235, 0.92)";
  ctx.font = `600 ${Math.round(gr * 0.34)}px Georgia, "Times New Roman", serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(CONF.iniciales, gx, gy + gr * 0.1);
  ctx.strokeStyle = "rgba(120, 70, 40, 0.28)";
  ctx.lineWidth = 1;
  ctx.strokeText(CONF.iniciales, gx, gy + gr * 0.1);
  ctx.restore();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";

  /* El canto de abajo del globo. */
  ctx.strokeStyle = "rgba(90, 60, 40, 0.3)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(gx, gy + gr * 0.98, gr * 0.42, gr * 0.12, 0, 0, 6.283);
  ctx.stroke();

  /* --- las cuerdas --- */
  ctx.strokeStyle = "rgba(90, 70, 50, 0.7)";
  ctx.lineWidth = 1.4;
  for (let i = -1; i <= 1; i += 2) {
    ctx.beginPath();
    ctx.moveTo(gx + i * gr * 0.4, gy + gr * 1.02);
    ctx.lineTo(bx + i * gr * 0.3, by - gr * 0.2);
    ctx.stroke();
  }

  /* --- la cesta --- */
  const cw = gr * 0.72, ch = gr * 0.5;
  const g3 = ctx.createLinearGradient(bx - cw / 2, by - ch / 2, bx + cw / 2, by + ch / 2);
  g3.addColorStop(0, "#c49a5c");
  g3.addColorStop(0.5, "#a07840");
  g3.addColorStop(1, "#6e4e26");
  ctx.fillStyle = g3;
  ctx.fillRect(bx - cw / 2, by - ch / 2, cw, ch);
  /* El trenzado del mimbre: dos rejillas. */
  ctx.strokeStyle = "rgba(70, 48, 22, 0.4)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 5; i++) {
    const y = by - ch / 2 + (i / 5) * ch;
    ctx.beginPath(); ctx.moveTo(bx - cw / 2, y); ctx.lineTo(bx + cw / 2, y); ctx.stroke();
  }
  for (let i = 1; i < 7; i++) {
    const x = bx - cw / 2 + (i / 7) * cw;
    ctx.beginPath(); ctx.moveTo(x, by - ch / 2); ctx.lineTo(x, by + ch / 2); ctx.stroke();
  }
  ctx.strokeStyle = "rgba(60, 40, 18, 0.6)";
  ctx.lineWidth = 2.4;
  ctx.strokeRect(bx - cw / 2, by - ch / 2, cw, ch);

  /* Lo que lleva dentro (secreto 2). */
  if (cestaAbierta > 0.02) {
    ctx.globalAlpha = cestaAbierta;
    /* La manta doblada. */
    ctx.fillStyle = "#c2506a";
    ctx.fillRect(bx - cw * 0.38, by - ch * 0.12, cw * 0.32, ch * 0.3);
    ctx.fillStyle = "#e07a90";
    ctx.fillRect(bx - cw * 0.38, by - ch * 0.12, cw * 0.32, ch * 0.1);
    /* El termo. */
    ctx.fillStyle = "#4a7fa8";
    ctx.fillRect(bx + cw * 0.08, by - ch * 0.22, cw * 0.16, ch * 0.44);
    ctx.fillStyle = "#8fb8d8";
    ctx.fillRect(bx + cw * 0.08, by - ch * 0.28, cw * 0.16, ch * 0.08);
    ctx.globalAlpha = 1;
  }

  /* --- las dos cabecitas asomando --- */
  ctx.fillStyle = "#3e2a20";
  ctx.beginPath();
  ctx.arc(bx - cw * 0.16, by - ch * 0.5, gr * 0.08, 0, 6.283);
  ctx.fill();
  ctx.fillStyle = "#5c3a28";
  ctx.beginPath();
  ctx.arc(bx + cw * 0.16, by - ch * 0.5, gr * 0.08, 0, 6.283);
  ctx.fill();
}

/** El contorno del globo: una elipse que se recoge hacia abajo. */
function puntoGlobo(a) {
  const c = Math.cos(a), s = Math.sin(a);
  /* El 0.62 de abajo es lo que le da la forma de pera: sin él es un
     huevo y no parece un globo. */
  const rx = gr * (s > 0 ? 1 - s * 0.38 : 1);
  const ry = gr * (s > 0 ? 1.18 : 1.02);
  return { x: gx + c * rx, y: gy + s * ry };
}

function aclarar(hex, k) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const f = (v) => clamp(Math.round(v + 255 * k), 0, 255);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

/* ---- Arranque ---------------------------------------------------------------- */

medir();
decir("Aprieta y no sueltes. El aire caliente hace lo demás.");
requestAnimationFrame(paso);

})();
</script>
