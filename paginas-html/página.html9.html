<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Las luciérnagas</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Caveat:wght@500&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   LAS LUCIÉRNAGAS
   Un claro del bosque de noche. Si dejas el dedo, se acercan; si lo dejas
   un rato, vienen TODAS; y si lo levantas, estallan en un corazón de luz y
   nacen muchas más. Todo con prefijo `lc-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #030807; }

.lc {
  position: fixed;
  inset: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  color: #e8f6ea;
  font-family: "Cormorant Garamond", Georgia, serif;
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
}
.lc canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.lc-ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
  padding: calc(var(--seg-t) + 20px) 22px calc(var(--seg-b) + var(--barra) + 20px);
}
.lc-titulo {
  margin: 0;
  font-weight: 500;
  font-size: clamp(0.72rem, 3vw, 0.84rem);
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: rgba(214, 255, 222, 0.75);
  text-shadow: 0 0 18px rgba(150, 255, 180, 0.45);
  transition: opacity 900ms var(--suave), letter-spacing 1.4s var(--suave);
}
.lc.is-juntas .lc-titulo { opacity: 0.18; letter-spacing: 0.5em; }

.lc-pie { display: grid; gap: 4px; justify-items: center; min-height: 5.4rem; align-content: end; }
.lc-frase {
  margin: 0;
  max-width: 19em;
  font-style: italic;
  font-size: clamp(1.15rem, 5.2vw, 1.55rem);
  line-height: 1.3;
  color: #fbfff6;
  text-shadow: 0 0 22px rgba(255, 236, 150, 0.45), 0 2px 12px rgba(0, 0, 0, 0.9);
  transition: opacity 800ms var(--suave), transform 800ms var(--suave), filter 800ms var(--suave);
}
.lc-frase.is-fuera { opacity: 0; transform: translateY(8px); filter: blur(5px); }
.lc-firma {
  margin: 0;
  font-family: "Caveat", "Segoe Script", cursive;
  font-size: clamp(1.05rem, 4.6vw, 1.3rem);
  color: #ffe39a;
  text-shadow: 0 0 14px rgba(255, 210, 110, 0.5);
  transition: opacity 900ms var(--suave) 250ms;
}
.lc-firma.is-fuera { opacity: 0; transition-delay: 0ms; }
.lc-pista {
  margin: 4px 0 0;
  font-size: clamp(0.6rem, 2.5vw, 0.7rem);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(200, 240, 210, 0.55);
  transition: opacity 700ms var(--suave);
}
.lc-pista.is-fuera { opacity: 0; }
</style>
</head>
<body>
<div class="lc" id="mundo">
  <canvas id="lienzo"></canvas>
  <div class="lc-ui">
    <p class="lc-titulo">Las luciérnagas</p>
    <div class="lc-pie">
      <p class="lc-frase" id="frase" role="status" aria-live="polite"></p>
      <p class="lc-firma is-fuera" id="firma"></p>
      <p class="lc-pista" id="pista">y espera un ratito</p>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE SE PUEDE CAMBIAR
   ══════════════════════════════════════════════════════════════════════ */
const CONF = {
  cuantas: 64,             // las que hay al empezar
  maximo: 210,             // las que caben como mucho después de estallar
  nacenPorEstallido: 38,   // cuántas nuevas nacen en cada estallido
  paraEnjambre: 3.2,       // segundos de dedo quieto hasta que vienen TODAS

  textos: {
    inicio: "Deja el dedo quietito y ven a verlas.",
    cerca: ["Mira cómo se te acercan.", "Tienen curiosidad por ti, como yo."],
    enjambre: "Ahora vienen todas…",
    pistaEnjambre: "levanta el dedo",
    estallidos: [
      ["Así se me prende todo cuando llegas.", "y cada vez hay más luz"],
      ["Contigo hasta la noche brilla.", "mírala nomás"],
      ["Mira todo lo que encendiste.", "eso haces conmigo"],
      ["Cada vez hay más. Como lo que siento.", "no deja de crecer"],
      ["Te amo en todos los brillos.", "en este y en los que vengan"],
    ],
    dorada: ["Esa es la que siempre vuelve a ti.", "se le nota en el color"],
  },
};

/* ══════════════════════════════════════════════════════════════════════ */
const mundo = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const g = lienzo.getContext("2d", { alpha: false });
const elFrase = document.getElementById("frase");
const elFirma = document.getElementById("firma");
const elPista = document.getElementById("pista");
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;

const TAU = Math.PI * 2;
const azar = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const acercar = (v, o, k, dt) => o + (v - o) * Math.exp(-k * dt);

let A = 0, H = 0, dpr = 1;

/* ══════════════════════════════════════════════════════════════════════
   EL BOSQUE: tres capas con profundidad
   ══════════════════════════════════════════════════════════════════════ */
let capaCielo = null, capaLejos = null, capaMedio = null;
let hierba = [];
let luna = { x: 0, y: 0, r: 0 };

function lienzoNuevo(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * dpr));
  c.height = Math.max(1, Math.round(h * dpr));
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [c, x];
}

/* Un pino de silueta: pisos de ramas que caen un poco en las puntas. */
function siluetaDeArboles(x, base, alto, ancho, color, semilla) {
  let s = semilla;
  const r = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  const pisos = 5 + Math.floor(r() * 3);
  return (cx) => {
    x.fillStyle = color;
    x.beginPath();
    x.rect(cx - ancho * 0.06, base - alto * 0.14, ancho * 0.12, alto * 0.14);
    for (let i = 0; i < pisos; i++) {
      const k = i / pisos;
      const yb = base - alto * 0.1 - alto * 0.82 * k;
      const w = ancho * (1 - k * 0.82) * (0.5 + r() * 0.08);
      const cima = yb - (alto * 0.82 / pisos) * 1.9;
      const ladeo = (r() - 0.5) * w * 0.12;
      x.moveTo(cx - w, yb + alto * 0.012);
      x.quadraticCurveTo(cx - w * 0.3 + ladeo, yb - (yb - cima) * 0.38, cx + ladeo * 0.5, cima);
      x.quadraticCurveTo(cx + w * 0.3 + ladeo, yb - (yb - cima) * 0.38, cx + w, yb + alto * 0.012);
      x.quadraticCurveTo(cx + w * 0.5, yb - alto * 0.012, cx, yb - alto * 0.02);
      x.quadraticCurveTo(cx - w * 0.5, yb - alto * 0.012, cx - w, yb + alto * 0.012);
    }
    x.fill();
  };
}

function pintarBosque() {
  // El cielo, la luna y las estrellas.
  let x;
  [capaCielo, x] = lienzoNuevo(A, H);
  const cielo = x.createLinearGradient(0, 0, 0, H);
  cielo.addColorStop(0, "#040b14");
  cielo.addColorStop(0.45, "#0a1a22");
  cielo.addColorStop(0.75, "#0d2420");
  cielo.addColorStop(1, "#06110d");
  x.fillStyle = cielo;
  x.fillRect(0, 0, A, H);
  for (let i = 0; i < A * H / 1400; i++) {
    const sx = Math.random() * A, sy = Math.pow(Math.random(), 1.6) * H * 0.6;
    x.fillStyle = `rgba(230,240,255,${azar(0.15, 0.8) * (1 - sy / (H * 0.6))})`;
    x.fillRect(sx, sy, azar(0.6, 1.5), azar(0.6, 1.5));
  }
  luna = { x: A * 0.74, y: H * 0.16, r: Math.min(A, H) * 0.075 };
  let halo = x.createRadialGradient(luna.x, luna.y, luna.r * 0.8, luna.x, luna.y, luna.r * 7);
  halo.addColorStop(0, "rgba(220,240,230,.28)");
  halo.addColorStop(1, "rgba(220,240,230,0)");
  x.fillStyle = halo;
  x.fillRect(0, 0, A, H);
  const disco = x.createRadialGradient(luna.x - luna.r * 0.3, luna.y - luna.r * 0.3, 0, luna.x, luna.y, luna.r);
  disco.addColorStop(0, "#fbfff4");
  disco.addColorStop(1, "#cfe2d6");
  x.fillStyle = disco;
  x.beginPath(); x.arc(luna.x, luna.y, luna.r, 0, TAU); x.fill();
  x.fillStyle = "rgba(150,175,165,.25)";
  for (const [dx, dy, rr] of [[-0.3, -0.1, 0.22], [0.25, 0.3, 0.16], [0.1, -0.35, 0.12], [-0.15, 0.4, 0.1]]) {
    x.beginPath(); x.arc(luna.x + dx * luna.r, luna.y + dy * luna.r, rr * luna.r, 0, TAU); x.fill();
  }

  // Las colinas y la fila de pinos de lejos.
  [capaLejos, x] = lienzoNuevo(A + 60, H);
  x.fillStyle = "#0b1c1a";
  x.beginPath();
  x.moveTo(0, H * 0.62);
  for (let i = 0; i <= 12; i++) x.lineTo((A + 60) * i / 12, H * (0.56 + Math.sin(i * 1.7) * 0.03 + Math.sin(i * 0.6) * 0.02));
  x.lineTo(A + 60, H); x.lineTo(0, H); x.closePath(); x.fill();
  for (let i = 0; i < (A + 60) / 16; i++) {
    const cx = i * 16 + azar(-6, 6);
    siluetaDeArboles(x, H * 0.63, azar(H * 0.08, H * 0.16), azar(16, 24), "#0a1917", i * 13 + 7)(cx);
  }
  const brumaL = x.createLinearGradient(0, H * 0.45, 0, H * 0.7);
  brumaL.addColorStop(0, "rgba(120,170,160,0)");
  brumaL.addColorStop(1, "rgba(120,170,160,.12)");
  x.fillStyle = brumaL;
  x.fillRect(0, H * 0.45, A + 60, H * 0.3);

  // Los árboles de en medio, más grandes y más oscuros.
  [capaMedio, x] = lienzoNuevo(A + 120, H);
  for (let i = 0; i < (A + 120) / 42; i++) {
    const cx = i * 42 + azar(-14, 14);
    siluetaDeArboles(x, H * 0.8, azar(H * 0.26, H * 0.44), azar(38, 58), "#051110", i * 31 + 3)(cx);
  }
  // El suelo del claro: lomitas y matas, y se va oscureciendo hacia delante.
  const suelo = x.createLinearGradient(0, H * 0.76, 0, H);
  suelo.addColorStop(0, "#0a1a17");
  suelo.addColorStop(0.35, "#061210");
  suelo.addColorStop(1, "#020806");
  x.fillStyle = suelo;
  x.beginPath();
  x.moveTo(0, H);
  for (let i = 0; i <= 40; i++) {
    const px = (A + 120) * i / 40;
    x.lineTo(px, H * 0.785 + Math.sin(i * 1.3) * H * 0.008 + Math.sin(i * 0.37) * H * 0.012);
  }
  x.lineTo(A + 120, H);
  x.closePath();
  x.fill();
  for (let i = 0; i < (A + 120) / 26; i++) {
    const mx = i * 26 + azar(-8, 8), my = H * 0.79 + azar(-2, 4), mr = azar(8, 20);
    x.fillStyle = "#050f0d";
    x.beginPath();
    x.ellipse(mx, my, mr, mr * 0.55, 0, Math.PI, TAU);
    x.fill();
  }

  // La hierba de delante: cada brizna se dibuja en cada fotograma porque se
  // mece con el viento, se aparta del dedo y se dobla con el estallido.
  const n = Math.round(A / 3.2);
  hierba = [];
  for (let i = 0; i < n; i++) {
    hierba.push({
      x: (i / n) * A + azar(-3, 3),
      alto: azar(H * 0.05, H * 0.14) * (Math.random() < 0.12 ? 1.5 : 1),
      ancho: azar(1.2, 2.8),
      fase: Math.random() * TAU,
      doblez: 0, vel: 0,
      tono: Math.random() < 0.5 ? "#020806" : "#041009",
    });
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LOS SELLOS DE LUZ (se dibujan una vez y luego sólo se estampan)
   ══════════════════════════════════════════════════════════════════════ */
function sello(tam, paradas) {
  const c = document.createElement("canvas");
  c.width = c.height = tam;
  const x = c.getContext("2d");
  const r = x.createRadialGradient(tam / 2, tam / 2, 0, tam / 2, tam / 2, tam / 2);
  for (const [o, col] of paradas) r.addColorStop(o, col);
  x.fillStyle = r;
  x.fillRect(0, 0, tam, tam);
  return c;
}
const COLORES = {
  verde: sello(64, [[0, "rgba(235,255,190,1)"], [0.12, "rgba(200,255,150,.85)"], [0.35, "rgba(150,240,110,.28)"], [1, "rgba(120,220,90,0)"]]),
  oro: sello(64, [[0, "rgba(255,248,210,1)"], [0.12, "rgba(255,220,130,.9)"], [0.35, "rgba(255,190,80,.3)"], [1, "rgba(255,170,60,0)"]]),
  rosa: sello(64, [[0, "rgba(255,240,245,1)"], [0.12, "rgba(255,180,205,.85)"], [0.35, "rgba(255,130,170,.28)"], [1, "rgba(255,110,160,0)"]]),
};
const halo = sello(128, [[0, "rgba(255,245,200,.55)"], [0.3, "rgba(220,255,170,.2)"], [1, "rgba(200,255,150,0)"]]);
const niebla = sello(256, [[0, "rgba(150,200,185,.16)"], [1, "rgba(150,200,185,0)"]]);

/* ══════════════════════════════════════════════════════════════════════
   LAS LUCIÉRNAGAS
   ══════════════════════════════════════════════════════════════════════ */
const bichos = [];
function nuevoBicho(x, y, vx = 0, vy = 0, nace = 0) {
  const k = Math.random();
  return {
    x, y, vx, vy,
    z: azar(0.35, 1),                        // lejos .. cerca
    fase: Math.random() * TAU,
    ritmo: azar(0.6, 1.6),
    luz: 0,
    color: k < 0.78 ? "verde" : k < 0.93 ? "oro" : "rosa",
    nace,                                    // >0 mientras está naciendo
    rastro: [],
    dorada: false,
  };
}
function sembrar() {
  bichos.length = 0;
  const n = A * H < 220000 ? Math.round(CONF.cuantas * 0.75) : CONF.cuantas;
  for (let i = 0; i < n; i++) bichos.push(nuevoBicho(Math.random() * A, azar(H * 0.2, H * 0.92)));
  const d = bichos[Math.floor(Math.random() * bichos.length)];
  d.dorada = true; d.color = "oro"; d.z = 1;
}

/* ══════════════════════════════════════════════════════════════════════
   EL SONIDO
   ══════════════════════════════════════════════════════════════════════ */
let ac = null, salida = null;
function despertar() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  salida = ac.createGain();
  salida.gain.value = 0.85;
  const comp = ac.createDynamicsCompressor();
  salida.connect(comp).connect(ac.destination);
  return ac;
}
function campana(f, t, v = 0.05, dur = 1.6) {
  if (!ac) return;
  for (const [m, a] of [[1, 1], [2.01, 0.35], [3.9, 0.12]]) {
    const o = ac.createOscillator(), gg = ac.createGain();
    o.frequency.value = f * m;
    gg.gain.setValueAtTime(0, t);
    gg.gain.linearRampToValueAtTime(v * a, t + 0.01);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + dur / m);
    o.connect(gg).connect(salida);
    o.start(t); o.stop(t + dur + 0.05);
  }
}
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568, 1760];
function tintineo() { if (despertar()) campana(PENTA[Math.floor(Math.random() * PENTA.length)] * 2, ac.currentTime, 0.025, 1.1); }

/* El zumbido que crece mientras vienen todas. */
let crece = null;
function empezarCrecer() {
  if (!despertar() || crece) return;
  const t = ac.currentTime;
  const gg = ac.createGain();
  gg.gain.setValueAtTime(0, t);
  gg.gain.linearRampToValueAtTime(0.06, t + 1.6);
  const filtro = ac.createBiquadFilter();
  filtro.type = "lowpass";
  filtro.frequency.setValueAtTime(600, t);
  filtro.frequency.linearRampToValueAtTime(3200, t + 2.4);
  const oscs = [261.63, 329.63, 392, 523.25, 659.25].map((f, i) => {
    const o = ac.createOscillator();
    o.type = i % 2 ? "triangle" : "sine";
    o.frequency.setValueAtTime(f, t);
    o.detune.setValueAtTime(azar(-8, 8), t);
    o.frequency.linearRampToValueAtTime(f * 1.5, t + 3);
    o.connect(filtro);
    o.start(t);
    return o;
  });
  filtro.connect(gg).connect(salida);
  crece = { gg, oscs };
}
function pararCrecer(rapido) {
  if (!crece || !ac) return;
  const t = ac.currentTime, { gg, oscs } = crece;
  gg.gain.cancelScheduledValues(t);
  gg.gain.setValueAtTime(gg.gain.value, t);
  gg.gain.linearRampToValueAtTime(0, t + (rapido ? 0.08 : 0.6));
  for (const o of oscs) o.stop(t + (rapido ? 0.1 : 0.65));
  crece = null;
}
function sonidoEstallido(fuerza) {
  if (!despertar()) return;
  const t = ac.currentTime;
  // Un golpe grave y blando, como un latido grande.
  const o = ac.createOscillator(), gg = ac.createGain();
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.5);
  gg.gain.setValueAtTime(0.0001, t);
  gg.gain.exponentialRampToValueAtTime(0.32 * fuerza, t + 0.02);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
  o.connect(gg).connect(salida);
  o.start(t); o.stop(t + 0.75);
  // Un soplo de aire.
  const n = Math.floor(ac.sampleRate * 0.9);
  const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.5);
  const src = ac.createBufferSource(); src.buffer = b;
  const bp = ac.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.setValueAtTime(900, t); bp.frequency.exponentialRampToValueAtTime(5000, t + 0.6); bp.Q.value = 0.7;
  const gn = ac.createGain(); gn.gain.value = 0.14 * fuerza;
  src.connect(bp).connect(gn).connect(salida);
  src.start(t);
  // Y una cascada de campanitas que baja.
  for (let i = 0; i < 11; i++) campana(PENTA[9 - (i % 10)] * (i > 9 ? 0.5 : 1), t + 0.08 + i * 0.075, 0.045, 1.8);
  // El acorde que se queda sonando mientras el corazón brilla.
  for (const f of [523.25, 659.25, 783.99, 1046.5]) campana(f, t + 0.9, 0.03, 3.2);
}

/* ══════════════════════════════════════════════════════════════════════
   LOS TEXTOS
   ══════════════════════════════════════════════════════════════════════ */
let textoActual = "", bloqueo = 0;
function decir(frase, firma = "", pista, importante) {
  const ahora = performance.now();
  if (!importante && ahora < bloqueo) return;
  if (frase === textoActual && pista === undefined) return;
  textoActual = frase;
  if (importante) bloqueo = ahora + 4200;
  elFrase.classList.add("is-fuera");
  elFirma.classList.add("is-fuera");
  setTimeout(() => {
    elFrase.textContent = frase;
    elFrase.classList.remove("is-fuera");
    elFirma.textContent = firma;
    elFirma.classList.toggle("is-fuera", !firma);
    if (pista !== undefined) {
      elPista.classList.toggle("is-fuera", !pista);
      if (pista) elPista.textContent = pista;
    }
  }, suave ? 20 : 480);
}

/* ══════════════════════════════════════════════════════════════════════
   EL DEDO
   ══════════════════════════════════════════════════════════════════════ */
const dedo = { abajo: false, x: 0, y: 0, px: 0, py: 0, vel: 0, t0: 0, x0: 0, y0: 0 };
let carga = 0;             // segundos de dedo tranquilo, acumulados
let enjambre = 0;          // 0..1 cuánto se han juntado todas
let modoEnjambre = false;
let nEstallidos = 0;

function posicion(e) {
  const r = mundo.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top];
}
mundo.addEventListener("pointerdown", (e) => {
  despertar();
  const [x, y] = posicion(e);
  Object.assign(dedo, { abajo: true, x, y, px: x, py: y, vel: 0, t0: performance.now(), x0: x, y0: y, id: e.pointerId });
  try { mundo.setPointerCapture(e.pointerId); } catch { /* nada */ }
  // ¿Tocó a la dorada?
  const d = bichos.find((b) => b.dorada);
  if (d && Math.hypot(d.x - x, d.y - y) < 40) {
    decir(CONF.textos.dorada[0], CONF.textos.dorada[1], undefined, true);
    campana(1318.5, ac ? ac.currentTime : 0, 0.05, 2);
    for (let i = 0; i < 24; i++) chispa(d.x, d.y, azar(30, 140), "oro");
  }
  onda(x, y, 0.35);
});
mundo.addEventListener("pointermove", (e) => {
  if (!dedo.abajo || e.pointerId !== dedo.id) return;
  const [x, y] = posicion(e);
  dedo.x = x; dedo.y = y;
});
function soltar(e) {
  if (!dedo.abajo || (e && e.pointerId !== dedo.id)) return;
  dedo.abajo = false;
  if (modoEnjambre && enjambre > 0.35) estallar(dedo.x, dedo.y, enjambre);
  else if (modoEnjambre) { modoEnjambre = false; pararCrecer(false); mundo.classList.remove("is-juntas"); }
  else if (performance.now() - dedo.t0 < 260) {
    // Un toque corto: un destello y las de cerca se encienden.
    for (const b of bichos) if (Math.hypot(b.x - dedo.x, b.y - dedo.y) < 120) b.luz = 1;
    for (let i = 0; i < 10; i++) chispa(dedo.x, dedo.y, azar(20, 90), "verde");
    tintineo();
  }
}
mundo.addEventListener("pointerup", soltar);
mundo.addEventListener("pointercancel", soltar);

/* ══════════════════════════════════════════════════════════════════════
   EL ESTALLIDO
   ══════════════════════════════════════════════════════════════════════ */
const chispas = [];
const ondas = [];
let fogonazo = 0;
let corazon = null;       // { t, x, y, puntos: [{x,y}] }

function chispa(x, y, vel, color, extra) {
  const a = Math.random() * TAU;
  chispas.push(Object.assign({
    x, y, px: x, py: y,
    vx: Math.cos(a) * vel, vy: Math.sin(a) * vel,
    vida: 1, dur: azar(0.7, 1.8), tam: azar(0.6, 1.4),
    color, meta: null,
  }, extra || {}));
}
function onda(x, y, fuerza) { ondas.push({ x, y, r: 0, fuerza, t: 0 }); }

/* Los puntos de un corazón, repartidos a lo largo de su borde. */
function puntosCorazon(cx, cy, tam, n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const t = (i / n) * TAU;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    pts.push({ x: cx + (x / 17) * tam, y: cy + (y / 17) * tam });
  }
  return pts;
}

function estallar(x, y, fuerza) {
  modoEnjambre = false;
  mundo.classList.remove("is-juntas");
  pararCrecer(true);
  sonidoEstallido(0.7 + fuerza * 0.3);
  fogonazo = 1;
  onda(x, y, 1);
  setTimeout(() => onda(x, y, 0.6), 140);

  // Las que estaban juntas salen disparadas.
  for (const b of bichos) {
    const dx = b.x - x, dy = b.y - y, d = Math.hypot(dx, dy) || 1;
    const v = azar(280, 620) * (0.5 + fuerza * 0.5) * (d < 90 ? 1 : 0.4);
    const a = d < 12 ? Math.random() * TAU : Math.atan2(dy, dx) + azar(-0.5, 0.5);
    b.vx = Math.cos(a) * v; b.vy = Math.sin(a) * v;
    b.luz = 1;
  }

  // Un corazón de luz, que se queda un momento y luego suelta luciérnagas.
  const tam = Math.min(A, H) * 0.24;
  const cx = clamp(x, tam * 1.05, A - tam * 1.05);
  const cy = clamp(y, tam * 1.1, H - tam * 1.1);
  const pts = puntosCorazon(cx, cy, tam, 96);
  corazon = { t: 0, x: cx, y: cy, tam, pts };
  for (const p of pts) {
    chispa(x, y, azar(60, 200), Math.random() < 0.3 ? "rosa" : "oro", { meta: p, dur: 2.6, tam: azar(1, 1.6) });
  }
  // Y muchísimas chispas sueltas.
  const n = suave ? 60 : 220;
  for (let i = 0; i < n; i++) {
    const k = Math.random();
    chispa(x, y, azar(120, 760) * (0.6 + fuerza * 0.4), k < 0.6 ? "verde" : k < 0.88 ? "oro" : "rosa");
  }
  if (chispas.length > 700) chispas.splice(0, chispas.length - 700);

  // La hierba se aparta con la onda.
  for (const h of hierba) {
    const d = h.x - x;
    h.vel += Math.sign(d || 1) * 9 * Math.exp(-Math.abs(d) / (A * 0.35));
  }

  const [frase, firma] = CONF.textos.estallidos[nEstallidos % CONF.textos.estallidos.length];
  nEstallidos++;
  setTimeout(() => decir(frase, firma, "", true), 1100);
  carga = 0;
  enjambre = 0;
}

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */
let t0 = performance.now(), reloj = 0, relojCerca = 0, dichoCerca = 0;
let paralaje = 0, fugaz = null, relojFugaz = azar(6, 14);
const bancos = Array.from({ length: 5 }, () => ({ x: Math.random(), y: azar(0.55, 0.92), v: azar(4, 12), tam: azar(0.8, 1.6) }));

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A) return;
  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
  reloj += dt;

  /* ---- El dedo: su velocidad, su carga y el enjambre ---- */
  const vd = Math.hypot(dedo.x - dedo.px, dedo.y - dedo.py) / dt;
  dedo.vel = acercar(dedo.vel, Number.isFinite(vd) ? vd : 0, 8, dt);
  dedo.px = dedo.x; dedo.py = dedo.y;
  const corre = clamp(dedo.vel / 420, 0, 1.5);
  if (dedo.abajo) {
    carga += dt * (corre > 0.8 ? 0.25 : 1);
    if (!modoEnjambre && carga > CONF.paraEnjambre) {
      modoEnjambre = true;
      mundo.classList.add("is-juntas");
      empezarCrecer();
      decir(CONF.textos.enjambre, "", CONF.textos.pistaEnjambre, true);
    }
  } else {
    carga = Math.max(0, carga - dt * 0.35);
  }
  enjambre = modoEnjambre ? Math.min(1, enjambre + dt * 0.8) : Math.max(0, enjambre - dt * 1.5);

  /* ---- El fondo, con un poco de paralaje ---- */
  const objetivoPar = dedo.abajo ? (dedo.x / A - 0.5) : Math.sin(reloj * 0.08) * 0.3;
  paralaje = acercar(paralaje, objetivoPar, 1.2, dt);
  g.drawImage(capaCielo, 0, 0, A, H);
  // Una estrella fugaz de vez en cuando.
  relojFugaz -= dt;
  if (relojFugaz <= 0 && !fugaz) {
    fugaz = { x: azar(A * 0.1, A * 0.8), y: azar(H * 0.04, H * 0.25), t: 0, dir: Math.random() < 0.5 ? -1 : 1 };
    relojFugaz = azar(9, 20);
  }
  if (fugaz) {
    fugaz.t += dt;
    const k = fugaz.t / 0.9;
    if (k >= 1) fugaz = null;
    else {
      const x = fugaz.x + fugaz.dir * k * A * 0.35, y = fugaz.y + k * H * 0.1;
      const gr = g.createLinearGradient(x, y, x - fugaz.dir * 70, y - 20);
      gr.addColorStop(0, `rgba(255,255,255,${0.9 * Math.sin(k * Math.PI)})`);
      gr.addColorStop(1, "rgba(255,255,255,0)");
      g.strokeStyle = gr; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - fugaz.dir * 70, y - 20); g.stroke();
    }
  }
  g.drawImage(capaLejos, -30 - paralaje * 14, 0, A + 60, H);

  // Bancos de niebla que pasan despacio.
  for (const n of bancos) {
    n.x += n.v * dt / A;
    if (n.x > 1.3) n.x = -0.3;
    const w = A * 0.9 * n.tam;
    g.globalAlpha = 0.8;
    g.drawImage(niebla, n.x * A - w / 2 - paralaje * 30, n.y * H - w * 0.22, w, w * 0.44);
  }
  g.globalAlpha = 1;
  g.drawImage(capaMedio, -60 - paralaje * 34, 0, A + 120, H);

  /* ---- Las luciérnagas ---- */
  let cerca = 0;
  const radio = Math.min(A, H) * 0.42;
  for (const b of bichos) {
    // Su vuelo: un vaivén propio, lento y distinto en cada una.
    b.vx += Math.cos(reloj * b.ritmo * 0.7 + b.fase) * 18 * dt;
    b.vy += Math.sin(reloj * b.ritmo * 0.9 + b.fase * 1.7) * 15 * dt;

    if (dedo.abajo || enjambre > 0) {
      const dx = dedo.x - b.x, dy = dedo.y - b.y;
      const d = Math.hypot(dx, dy) || 0.001;
      if (enjambre > 0) {
        // TODAS al dedo, en espiral: tiran hacia él y giran alrededor.
        const tira = 900 * enjambre;
        const gira = 420 * enjambre * (b.fase > Math.PI ? 1 : -1);
        const cerquita = Math.min(1, d / 40);
        b.vx += (dx / d * tira * cerquita - dy / d * gira) * dt;
        b.vy += (dy / d * tira * cerquita + dx / d * gira) * dt;
        b.vx *= Math.exp(-dt * 2.2);
        b.vy *= Math.exp(-dt * 2.2);
        if (d < 60) cerca++;
      } else if (d < radio) {
        const k = 1 - d / radio;
        if (d < 80) cerca++;
        // Despacio, se acercan; si el dedo corre, se asustan.
        const tira = b.dorada ? 150 : 170 * (1 - Math.min(1, corre)) - 380 * Math.max(0, corre - 0.45);
        b.vx += dx / d * tira * k * dt;
        b.vy += dy / d * tira * k * dt;
        // Y giran un poco alrededor, que es lo bonito de verlas.
        b.vx += -dy / d * 40 * k * dt;
        b.vy += dx / d * 40 * k * dt;
      }
    }
    const roce = enjambre > 0 ? 1 : Math.exp(-dt * 0.9);
    b.vx *= roce; b.vy *= roce;
    // Velocidad máxima, más alta mientras vuelan al dedo o salen disparadas.
    const vmax = enjambre > 0 ? 900 : 650;
    const v = Math.hypot(b.vx, b.vy);
    if (v > vmax) { b.vx *= vmax / v; b.vy *= vmax / v; }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    // Los bordes las devuelven suave.
    if (b.x < 8) b.vx += 90 * dt; else if (b.x > A - 8) b.vx -= 90 * dt;
    if (b.y < H * 0.08) b.vy += 90 * dt; else if (b.y > H - 8) b.vy -= 90 * dt;
    if (!enjambre && (b.x < -80 || b.x > A + 80 || b.y < -80 || b.y > H + 80)) {
      b.x = clamp(b.x, 10, A - 10); b.y = clamp(b.y, H * 0.2, H - 10); b.vx *= -0.3; b.vy *= -0.3;
    }
    // El parpadeo.
    const onda0 = Math.pow(0.5 + 0.5 * Math.sin(reloj * b.ritmo * 1.6 + b.fase), 2.4);
    const objetivo = enjambre > 0 ? 0.55 + 0.45 * enjambre : onda0;
    b.luz = acercar(b.luz, objetivo, b.luz > objetivo ? 2.4 : 10, dt);
    if (b.nace > 0) b.nace = Math.max(0, b.nace - dt * 0.8);
    // El rastro, sólo cuando van rápido.
    if (v > 160) { b.rastro.push(b.x, b.y); if (b.rastro.length > 12) b.rastro.splice(0, 2); }
    else if (b.rastro.length) b.rastro.splice(0, 2);
  }

  // Las de lejos van detrás de la hierba; las de cerca, delante.
  g.globalCompositeOperation = "lighter";
  for (const b of bichos) if (b.z < 0.62) pintarBicho(b);
  g.globalCompositeOperation = "source-over";

  /* ---- La hierba ---- */
  const viento = Math.sin(reloj * 0.7) * 0.5 + Math.sin(reloj * 1.9) * 0.2;
  for (const h of hierba) {
    let empuje = 0;
    if (dedo.abajo && dedo.y > H - h.alto * 2.4) {
      const d = h.x - dedo.x;
      if (Math.abs(d) < 60) empuje = Math.sign(d) * (1 - Math.abs(d) / 60) * 1.4;
    }
    const objetivo = viento * 0.25 + Math.sin(reloj * 1.3 + h.fase) * 0.08 + empuje;
    h.vel += (objetivo - h.doblez) * 30 * dt;
    h.vel *= Math.exp(-dt * 4);
    h.doblez += h.vel * dt;
    const px = h.x + h.doblez * h.alto * 0.9, py = H - h.alto * (1 - Math.abs(h.doblez) * 0.15);
    g.fillStyle = h.tono;
    g.beginPath();
    g.moveTo(h.x - h.ancho, H);
    g.quadraticCurveTo(h.x + h.doblez * h.alto * 0.3, H - h.alto * 0.55, px, py);
    g.quadraticCurveTo(h.x + h.doblez * h.alto * 0.3 + h.ancho * 0.4, H - h.alto * 0.5, h.x + h.ancho, H);
    g.fill();
  }

  g.globalCompositeOperation = "lighter";
  for (const b of bichos) if (b.z >= 0.62) pintarBicho(b);

  /* ---- La bola de luz del enjambre ---- */
  if (enjambre > 0.05) {
    const r = 40 + enjambre * 70 + Math.sin(reloj * 9) * 6 * enjambre;
    g.globalAlpha = enjambre * 0.9;
    g.drawImage(halo, dedo.x - r, dedo.y - r, r * 2, r * 2);
    g.globalAlpha = enjambre * 0.5;
    g.drawImage(COLORES.oro, dedo.x - r * 0.4, dedo.y - r * 0.4, r * 0.8, r * 0.8);
    if (Math.random() < enjambre * dt * 30) chispa(dedo.x + azar(-20, 20), dedo.y + azar(-20, 20), azar(20, 80), "oro", { dur: 0.6 });
  } else if (dedo.abajo) {
    // Un halo chiquito bajo el dedo, que crece con la carga.
    const k = clamp(carga / CONF.paraEnjambre, 0, 1);
    const r = 24 + k * 36;
    g.globalAlpha = 0.15 + k * 0.35;
    g.drawImage(halo, dedo.x - r, dedo.y - r, r * 2, r * 2);
  }
  g.globalAlpha = 1;

  /* ---- Las chispas y el corazón ---- */
  if (corazon) corazon.t += dt;
  for (let i = chispas.length - 1; i >= 0; i--) {
    const c = chispas[i];
    c.vida -= dt / c.dur;
    if (c.vida <= 0) {
      // Las del corazón, al apagarse, se hacen luciérnagas.
      if (c.meta && bichos.length < CONF.maximo && Math.random() < CONF.nacenPorEstallido / 96) {
        const b = nuevoBicho(c.x, c.y, azar(-40, 40), azar(-60, 10), 1);
        b.color = c.color === "rosa" ? "rosa" : Math.random() < 0.6 ? "verde" : "oro";
        bichos.push(b);
      }
      chispas.splice(i, 1);
      continue;
    }
    c.px = c.x; c.py = c.y;
    if (c.meta && corazon && corazon.t < 2.1) {
      // Van a su sitio en el corazón con un muelle suave.
      const k = Math.min(1, corazon.t / 0.7);
      c.vx += (c.meta.x - c.x) * 40 * k * dt;
      c.vy += (c.meta.y - c.y) * 40 * k * dt;
      c.vx *= Math.exp(-dt * 7);
      c.vy *= Math.exp(-dt * 7);
    } else {
      c.vx *= Math.exp(-dt * 2.2);
      c.vy = c.vy * Math.exp(-dt * 2.2) + (c.meta ? -8 : 14) * dt;
    }
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    const alfa = c.meta ? Math.min(1, c.vida * 2.5) : c.vida;
    const tam = 7 * c.tam * (0.4 + alfa * 0.8) * (c.meta && corazon ? 1 + 0.25 * Math.sin(corazon.t * 8 + i) : 1);
    g.globalAlpha = alfa;
    g.drawImage(COLORES[c.color], c.x - tam, c.y - tam, tam * 2, tam * 2);
    const v = Math.hypot(c.vx, c.vy);
    if (v > 120) {
      g.strokeStyle = c.color === "rosa" ? "rgba(255,190,215,.55)" : c.color === "oro" ? "rgba(255,225,150,.55)" : "rgba(210,255,170,.5)";
      g.lineWidth = 1.2 * c.tam;
      g.beginPath();
      g.moveTo(c.x, c.y);
      g.lineTo(c.x - c.vx * 0.035, c.y - c.vy * 0.035);
      g.stroke();
    }
  }
  if (corazon) {
    // El brillo de dentro del corazón mientras se sostiene.
    const k = corazon.t < 0.7 ? corazon.t / 0.7 : corazon.t < 2.1 ? 1 : Math.max(0, 1 - (corazon.t - 2.1) / 0.8);
    if (k > 0) {
      const r = corazon.tam * 1.6;
      g.globalAlpha = k * 0.35;
      g.drawImage(COLORES.rosa, corazon.x - r, corazon.y - r * 0.9, r * 2, r * 2);
    }
    if (corazon.t > 3) corazon = null;
  }
  g.globalAlpha = 1;

  /* ---- Las ondas y el fogonazo ---- */
  for (let i = ondas.length - 1; i >= 0; i--) {
    const o = ondas[i];
    o.t += dt;
    o.r += (900 - o.r * 0.6) * dt * (0.6 + o.fuerza);
    const alfa = Math.max(0, 1 - o.t / (0.5 + o.fuerza * 0.7)) * o.fuerza;
    if (alfa <= 0) { ondas.splice(i, 1); continue; }
    g.strokeStyle = `rgba(230,255,210,${alfa * 0.55})`;
    g.lineWidth = 2 + o.fuerza * 6 * alfa;
    g.beginPath(); g.arc(o.x, o.y, o.r, 0, TAU); g.stroke();
  }
  g.globalCompositeOperation = "source-over";
  if (fogonazo > 0.01) {
    g.fillStyle = `rgba(255,248,215,${fogonazo * 0.5})`;
    g.fillRect(0, 0, A, H);
    fogonazo *= Math.exp(-dt * 5);
  }

  /* ---- Viñeta suave ---- */
  const vin = g.createRadialGradient(A / 2, H * 0.55, Math.min(A, H) * 0.35, A / 2, H * 0.55, Math.max(A, H) * 0.8);
  vin.addColorStop(0, "rgba(0,0,0,0)");
  vin.addColorStop(1, "rgba(0,0,0,.55)");
  g.fillStyle = vin;
  g.fillRect(0, 0, A, H);

  /* ---- Lo que se dice ---- */
  if (!modoEnjambre && dedo.abajo && cerca >= 7) {
    relojCerca += dt;
    if (relojCerca > 1.2) {
      relojCerca = 0;
      decir(CONF.textos.cerca[dichoCerca++ % CONF.textos.cerca.length], "", "no levantes el dedo todavía");
      tintineo();
    }
  } else relojCerca = Math.max(0, relojCerca - dt);
  if (dedo.abajo && cerca > 0 && Math.random() < dt * cerca * 0.08 && !modoEnjambre) tintineo();
}

function pintarBicho(b) {
  const escala = b.z * (b.dorada ? 1.35 : 1) * (1 + (b.nace > 0 ? b.nace * 0.8 : 0));
  const luz = clamp(b.luz, 0, 1) * (0.35 + b.z * 0.65) * (b.nace > 0 ? 1 - b.nace * 0.4 : 1);
  if (b.rastro.length > 2) {
    g.globalAlpha = luz * 0.35;
    g.strokeStyle = b.color === "oro" ? "#ffd98a" : b.color === "rosa" ? "#ffc2d6" : "#c8ff9e";
    g.lineWidth = 1.4 * escala;
    g.beginPath();
    g.moveTo(b.rastro[0], b.rastro[1]);
    for (let i = 2; i < b.rastro.length; i += 2) g.lineTo(b.rastro[i], b.rastro[i + 1]);
    g.stroke();
  }
  if (luz < 0.02) {
    // Apagada se ve igual: un puntito oscuro que vuela.
    g.globalAlpha = 0.25;
    g.fillStyle = "#2c3a26";
    g.fillRect(b.x - 1, b.y - 1, 2, 2);
    return;
  }
  const r = (b.dorada ? 22 : 17) * escala;
  g.globalAlpha = luz;
  g.drawImage(COLORES[b.color], b.x - r, b.y - r, r * 2, r * 2);
  if (luz > 0.6) {
    const r2 = r * 2.4;
    g.globalAlpha = (luz - 0.6) * 0.35;
    g.drawImage(halo, b.x - r2, b.y - r2, r2 * 2, r2 * 2);
  }
}

/* ══════════════════════════════════════════════════════════════════════ */
function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const primera = !A;
  const [a0, h0] = [A, H];
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  pintarBosque();
  if (primera) sembrar();
  else for (const b of bichos) { b.x *= A / a0; b.y *= H / h0; }
}
new ResizeObserver(() => requestAnimationFrame(medir)).observe(mundo);
medir();
decir(CONF.textos.inicio);
requestAnimationFrame(paso);
})();
</script>
</body>
