<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>La bola de nieve</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Caveat:wght@500&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   LA BOLA DE NIEVE
   Una bola de cristal sobre la mesa. Se agita moviendo el teléfono de
   verdad —o arrastrándola con el dedo— y la nieve se revuelve, cae y se
   asienta en el suelo de la escena. Todo con prefijo `bn-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #140e14; }
.bn {
  position: fixed;
  inset: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  font-family: "Cormorant Garamond", Georgia, serif;
  color: #fff3ea;
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
}
.bn canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bn-titulo {
  position: absolute;
  top: calc(var(--seg-t) + 16px);
  left: 0; right: 0;
  margin: 0;
  text-align: center;
  pointer-events: none;
  font-weight: 600;
  font-size: clamp(0.66rem, 2.8vw, 0.78rem);
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: rgba(255, 226, 214, 0.72);
}
.bn-pie {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--seg-b) + var(--barra) + 16px);
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 0 22px;
  pointer-events: none;
  text-align: center;
}
.bn-frase {
  margin: 0;
  max-width: 20em;
  font-style: italic;
  font-size: clamp(1.05rem, 4.8vw, 1.35rem);
  line-height: 1.3;
  color: #fff7f1;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
  transition: opacity 700ms var(--suave), transform 700ms var(--suave);
}
.bn-firma {
  margin: 0;
  font-family: "Caveat", "Segoe Script", cursive;
  font-size: clamp(1rem, 4.4vw, 1.22rem);
  color: #ffc7c7;
  transition: opacity 700ms var(--suave) 200ms;
}
.bn-frase.is-fuera { opacity: 0; transform: translateY(6px); }
.bn-firma.is-fuera { opacity: 0; transition-delay: 0ms; }
@media (orientation: landscape) and (max-height: 540px) {
  .bn-pie { left: 52%; right: 0; top: 0; bottom: 0; align-content: center; }
}
.bn-sensor {
  margin: 6px 0 0;
  pointer-events: auto;
  border: 1px solid rgba(255, 220, 210, 0.35);
  background: rgba(255, 240, 235, 0.06);
  color: rgba(255, 230, 220, 0.85);
  font: 600 clamp(0.6rem, 2.5vw, 0.7rem) "Cormorant Garamond", Georgia, serif;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
}
.bn-sensor[hidden] { display: none; }
.bn-pista {
  margin: 4px 0 0;
  font-size: clamp(0.58rem, 2.4vw, 0.68rem);
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(255, 220, 210, 0.5);
}
</style>
</head>
<body>
<div class="bn" id="mundo">
  <canvas id="lienzo"></canvas>
  <p class="bn-titulo">Agítala</p>
  <div class="bn-pie">
    <p class="bn-frase" id="frase" role="status" aria-live="polite"></p>
    <p class="bn-firma is-fuera" id="firma"></p>
    <button class="bn-sensor" id="sensor" type="button" hidden>Usar el movimiento del teléfono</button>
    <p class="bn-pista" id="pista">mueve el teléfono o arrástrala</p>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE SE PUEDE CAMBIAR
   ══════════════════════════════════════════════════════════════════════ */
const CONF = {
  copos: 360,          // los que flotan
  brillos: 60,         // escarcha dorada y plateada, que brilla al girar
  caida: 26,           // px/s a los que baja un copo en el agua quieta
  frases: [
    ["Mírala caer despacito.", "así me siento cuando me hablas"],
    ["Todo da vueltas…", "y aun así sé dónde estás tú"],
    ["Después de la tormenta, la calma.", "contigo siempre llega"],
    ["Agítala las veces que quieras.", "yo no me canso de volver a empezar"],
  ],
};

/* ══════════════════════════════════════════════════════════════════════ */
const mundo = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const g = lienzo.getContext("2d", { alpha: false });
const elFrase = document.getElementById("frase");
const elFirma = document.getElementById("firma");
const elSensor = document.getElementById("sensor");
const elPista = document.getElementById("pista");
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;

const TAU = Math.PI * 2;
const azar = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const acercar = (v, o, k, dt) => o + (v - o) * Math.exp(-k * dt);

let A = 0, H = 0, dpr = 1;
let B = { cx: 0, cy: 0, R: 0, suelo: 0 };          // la bola
let habitacion = null, escena = null;

function lienzoNuevo(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * dpr));
  c.height = Math.max(1, Math.round(h * dpr));
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [c, x];
}

/* ══════════════════════════════════════════════════════════════════════
   LA HABITACIÓN: una mesa, luces de fondo desenfocadas
   ══════════════════════════════════════════════════════════════════════ */
function pintarHabitacion() {
  let x;
  [habitacion, x] = lienzoNuevo(A, H);
  const pared = x.createLinearGradient(0, 0, 0, H);
  pared.addColorStop(0, "#241624");
  pared.addColorStop(0.6, "#2e1a26");
  pared.addColorStop(1, "#1a0f14");
  x.fillStyle = pared;
  x.fillRect(0, 0, A, H);
  for (let i = 0; i < 26; i++) {
    const bx = Math.random() * A, by = azar(0, H * 0.6), r = azar(10, 40);
    const col = Math.random() < 0.7 ? "255,190,130" : "255,140,170";
    const gr = x.createRadialGradient(bx, by, 0, bx, by, r);
    gr.addColorStop(0, `rgba(${col},${azar(0.08, 0.22)})`);
    gr.addColorStop(0.7, `rgba(${col},${azar(0.03, 0.08)})`);
    gr.addColorStop(1, `rgba(${col},0)`);
    x.fillStyle = gr;
    x.beginPath(); x.arc(bx, by, r, 0, TAU); x.fill();
  }
  // La mesa de madera.
  const mesaY = B.cy + B.R * 1.34;
  const mesa = x.createLinearGradient(0, mesaY - 20, 0, H);
  mesa.addColorStop(0, "#4a2c22");
  mesa.addColorStop(1, "#1e110d");
  x.fillStyle = mesa;
  x.fillRect(0, mesaY - 20, A, H);
  for (let i = 0; i < 40; i++) {
    x.strokeStyle = `rgba(0,0,0,${azar(0.05, 0.15)})`;
    x.lineWidth = azar(0.5, 1.5);
    const y = mesaY - 20 + Math.random() * (H - mesaY);
    x.beginPath(); x.moveTo(0, y); x.bezierCurveTo(A * 0.3, y + azar(-6, 6), A * 0.7, y + azar(-6, 6), A, y + azar(-4, 4)); x.stroke();
  }
  // El brillo de la luz de la bola sobre la mesa.
  const luz = x.createRadialGradient(B.cx, mesaY, 0, B.cx, mesaY, B.R * 1.8);
  luz.addColorStop(0, "rgba(255,210,170,.28)");
  luz.addColorStop(1, "rgba(255,210,170,0)");
  x.fillStyle = luz;
  x.fillRect(0, mesaY - B.R, A, B.R * 3);
}

/* ══════════════════════════════════════════════════════════════════════
   LA ESCENA DE DENTRO: el cielo, la casita, los pinos, la farola
   (se pinta una vez; lo que se mueve va aparte)
   ══════════════════════════════════════════════════════════════════════ */
const alturaNieve = new Float32Array(64);    // la nieve que se va posando
function sueloEn(x) {
  // El suelo de la escena, con sus lomitas, dentro del círculo.
  const k = (x - B.cx) / B.R;
  return B.suelo + Math.sin(k * 3.2 + 0.6) * B.R * 0.03 + k * k * B.R * 0.05;
}
function pintarEscena() {
  let x;
  const R = B.R;
  [escena, x] = lienzoNuevo(R * 2, R * 2);
  x.translate(R - B.cx, R - B.cy);
  const cielo = x.createLinearGradient(0, B.cy - R, 0, B.suelo);
  cielo.addColorStop(0, "#1a1f4a");
  cielo.addColorStop(0.7, "#3a3470");
  cielo.addColorStop(1, "#6a4f86");
  x.fillStyle = cielo;
  x.fillRect(B.cx - R, B.cy - R, R * 2, R * 2);
  for (let i = 0; i < 70; i++) {
    x.fillStyle = `rgba(255,255,255,${azar(0.3, 0.9)})`;
    x.fillRect(B.cx + azar(-R, R), B.cy - R + azar(0, R * 0.9), azar(0.6, 1.4), azar(0.6, 1.4));
  }
  // La luna.
  const lx = B.cx + R * 0.42, ly = B.cy - R * 0.42, lr = R * 0.11;
  const halo = x.createRadialGradient(lx, ly, lr, lx, ly, lr * 5);
  halo.addColorStop(0, "rgba(255,244,220,.3)");
  halo.addColorStop(1, "rgba(255,244,220,0)");
  x.fillStyle = halo;
  x.fillRect(lx - lr * 5, ly - lr * 5, lr * 10, lr * 10);
  x.fillStyle = "#fff6e4";
  x.beginPath(); x.arc(lx, ly, lr, 0, TAU); x.fill();
  // Montañitas al fondo.
  x.fillStyle = "#4a4a82";
  x.beginPath();
  x.moveTo(B.cx - R, B.suelo);
  for (let i = 0; i <= 10; i++) x.lineTo(B.cx - R + i * R * 0.2, B.suelo - R * (0.12 + 0.1 * Math.abs(Math.sin(i * 1.7))));
  x.lineTo(B.cx + R, B.suelo); x.fill();
  x.fillStyle = "rgba(255,255,255,.55)";
  for (let i = 0; i <= 10; i++) {
    const px = B.cx - R + i * R * 0.2, py = B.suelo - R * (0.12 + 0.1 * Math.abs(Math.sin(i * 1.7)));
    x.beginPath(); x.moveTo(px - R * 0.03, py + R * 0.025); x.lineTo(px, py); x.lineTo(px + R * 0.03, py + R * 0.025); x.fill();
  }
  // El suelo nevado.
  const nieve = x.createLinearGradient(0, B.suelo - R * 0.05, 0, B.cy + R);
  nieve.addColorStop(0, "#f4f6ff");
  nieve.addColorStop(1, "#b8c2e6");
  x.fillStyle = nieve;
  x.beginPath();
  x.moveTo(B.cx - R, B.cy + R);
  for (let px = B.cx - R; px <= B.cx + R; px += 4) x.lineTo(px, sueloEn(px));
  x.lineTo(B.cx + R, B.cy + R);
  x.closePath();
  x.fill();
  // Los pinos, con su nieve.
  const pinos = [[-0.62, 0.34], [-0.44, 0.26], [0.58, 0.3], [0.74, 0.22], [0.12, 0.2]];
  for (const [kx, ka] of pinos) {
    const px = B.cx + kx * R, base = sueloEn(px) + 2, alto = ka * R;
    for (let p = 0; p < 4; p++) {
      const y = base - alto * (p / 4), w = alto * 0.38 * (1 - p / 5);
      x.fillStyle = "#1f4a3c";
      x.beginPath(); x.moveTo(px - w, y); x.lineTo(px, y - alto * 0.42); x.lineTo(px + w, y); x.fill();
      x.fillStyle = "rgba(255,255,255,.85)";
      x.beginPath(); x.moveTo(px - w * 0.5, y - alto * 0.2); x.lineTo(px, y - alto * 0.42); x.lineTo(px + w * 0.5, y - alto * 0.2); x.lineTo(px, y - alto * 0.3); x.fill();
    }
  }
  // La casita.
  const cx = B.cx - R * 0.22, cy = sueloEn(cx) + 2, cw = R * 0.36, ch = R * 0.22;
  x.fillStyle = "#7a3b34";
  x.fillRect(cx - cw / 2, cy - ch, cw, ch);
  x.fillStyle = "#5a2a26";
  x.fillRect(cx - cw / 2, cy - ch, cw * 0.06, ch);
  x.fillStyle = "#3a2330";
  x.beginPath(); x.moveTo(cx - cw * 0.62, cy - ch); x.lineTo(cx, cy - ch - ch * 0.75); x.lineTo(cx + cw * 0.62, cy - ch); x.fill();
  x.fillStyle = "#fbfbff";
  x.beginPath(); x.moveTo(cx - cw * 0.66, cy - ch + 2); x.lineTo(cx, cy - ch - ch * 0.8); x.lineTo(cx + cw * 0.66, cy - ch + 2); x.lineTo(cx + cw * 0.5, cy - ch - 2); x.lineTo(cx, cy - ch - ch * 0.62); x.lineTo(cx - cw * 0.5, cy - ch - 2); x.fill();
  x.fillStyle = "#4a2a26";
  x.fillRect(cx + cw * 0.18, cy - ch - ch * 0.62, cw * 0.1, ch * 0.4);
  B.chimenea = [cx + cw * 0.23, cy - ch - ch * 0.64];
  x.fillStyle = "#2a1510";
  x.fillRect(cx - cw * 0.08, cy - ch * 0.55, cw * 0.16, ch * 0.55);
  B.ventanas = [[cx - cw * 0.3, cy - ch * 0.62, cw * 0.14, ch * 0.28], [cx + cw * 0.16, cy - ch * 0.62, cw * 0.14, ch * 0.28]];
  // La farola.
  const fx = B.cx + R * 0.34, fy = sueloEn(fx) + 2;
  x.fillStyle = "#1b1b2a";
  x.fillRect(fx - 1.5, fy - R * 0.36, 3, R * 0.36);
  x.fillRect(fx - 5, fy - R * 0.38, 10, 4);
  B.farola = [fx, fy - R * 0.33];
  // Dos que se toman de la mano bajo la farola.
  const px = fx - R * 0.13, py = sueloEn(px) + 1;
  x.fillStyle = "#2b2438";
  for (const [dx, alto, col] of [[-R * 0.03, R * 0.12, "#8a2a3c"], [R * 0.03, R * 0.135, "#2d3a5a"]]) {
    x.fillStyle = col;
    x.beginPath();
    x.moveTo(px + dx - R * 0.022, py);
    x.lineTo(px + dx - R * 0.018, py - alto * 0.72);
    x.lineTo(px + dx + R * 0.018, py - alto * 0.72);
    x.lineTo(px + dx + R * 0.022, py);
    x.fill();
    x.fillStyle = "#f1d3c4";
    x.beginPath(); x.arc(px + dx, py - alto * 0.84, R * 0.02, 0, TAU); x.fill();
  }
  x.strokeStyle = "#f1d3c4"; x.lineWidth = 1.4;
  x.beginPath(); x.moveTo(px - R * 0.012, py - R * 0.06); x.lineTo(px + R * 0.012, py - R * 0.06); x.stroke();
}

/* ══════════════════════════════════════════════════════════════════════
   LA NIEVE
   Los copos flotan en agua: bajan despacio en la dirección de la gravedad
   DE VERDAD (la del teléfono), el agua los frena, y cuando la bola se
   mueve, el agua se queda atrás y los arrastra. Los que llegan al suelo
   se posan y hacen montoncito; al agitar, el montoncito se levanta.
   ══════════════════════════════════════════════════════════════════════ */
const copos = [];
function nuevoCopo(x, y) {
  const brillo = copos.length < CONF.brillos;
  return {
    x, y, vx: 0, vy: 0,
    r: brillo ? azar(1, 1.8) : Math.pow(Math.random(), 1.6) * 2.2 + 0.7,
    fase: Math.random() * TAU,
    posado: false,
    brillo,
    color: brillo ? (Math.random() < 0.5 ? "255,220,150" : "220,230,255") : "255,255,255",
    lento: azar(0.7, 1.3),
  };
}
function sembrarNieve() {
  copos.length = 0;
  alturaNieve.fill(0);
  for (let i = 0; i < CONF.copos + CONF.brillos; i++) {
    // Al principio casi todo está posado: la bola lleva tiempo quieta.
    const c = nuevoCopo(B.cx + azar(-B.R * 0.85, B.R * 0.85), B.cy);
    c.posado = Math.random() < 0.82;
    if (c.posado) {
      const col = columna(c.x);
      alturaNieve[col] += c.r * 0.18;
      c.y = sueloEn(c.x) - alturaNieve[col];
    } else c.y = B.cy + azar(-B.R * 0.8, B.R * 0.3);
    copos.push(c);
  }
}
const columna = (x) => clamp(Math.floor((x - (B.cx - B.R)) / (B.R * 2) * 64), 0, 63);

let gx = 0, gy = 1;             // hacia dónde es «abajo», en la pantalla
let agitado = 0;                // cuánto se ha revuelto, para los textos
let giro = 0;                   // remolino

/* Un empujón al agua: la bola se acelera y el agua se queda atrás. */
function empujar(ax, ay, remolino) {
  const fuerza = Math.hypot(ax, ay);
  agitado = Math.min(1, agitado + fuerza * 0.0006);
  giro += remolino || 0;
  for (const c of copos) {
    if (c.posado) {
      // Se levantan del suelo si el empujón es fuerte.
      if (fuerza > 220 && Math.random() < Math.min(0.9, fuerza / 1600)) {
        c.posado = false;
        const col = columna(c.x);
        alturaNieve[col] = Math.max(0, alturaNieve[col] - c.r * 0.18);
        c.vy = -azar(40, 160) * Math.min(2, fuerza / 500);
        c.vx = azar(-60, 60);
      } else continue;
    }
    c.vx -= ax * c.lento * azar(0.8, 1.2) * 0.9;
    c.vy -= ay * c.lento * azar(0.8, 1.2) * 0.9;
  }
  if (fuerza > 300) chapoteo(fuerza);
}

/* ══════════════════════════════════════════════════════════════════════
   EL SENSOR DE MOVIMIENTO
   ══════════════════════════════════════════════════════════════════════ */
let convenio = 0;               // 1 Android, -1 iPhone (los signos van al revés)
let sensorVivo = false;
let ultimaMedida = 0;
function anguloPantalla() {
  const o = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  return ((o % 360) + 360) % 360;
}
function aPantalla(x, y) {
  // Del teléfono a la pantalla, contando con que se haya girado.
  switch (anguloPantalla()) {
    case 90: return [-y, x];
    case 180: return [-x, -y];
    case 270: return [y, -x];
    default: return [x, y];
  }
}
function alMoverse(e) {
  const ag = e.accelerationIncludingGravity;
  if (!ag || ag.x == null) return;
  sensorVivo = true;
  ultimaMedida = performance.now();
  // Averiguar el convenio con la primera medida clara: se da por hecho que
  // el teléfono está más o menos derecho, con «abajo» hacia abajo.
  let [sx, sy] = aPantalla(ag.x, ag.y);
  if (!convenio && Math.hypot(sx, sy) > 4) convenio = sy > 0 ? -1 : 1;
  if (!convenio) convenio = 1;
  // La gravedad en la pantalla (x a la derecha, y hacia abajo).
  const pgx = convenio === 1 ? -sx : sx, pgy = convenio === 1 ? sy : -sy;
  const plano = Math.hypot(pgx, pgy);
  if (plano > 2.5) { gx = acercar(gx, pgx / plano, 6, 0.05); gy = acercar(gy, pgy / plano, 6, 0.05); }
  else { gx = acercar(gx, 0, 3, 0.05); gy = acercar(gy, 1, 3, 0.05); }
  const n = Math.hypot(gx, gy) || 1; gx /= n; gy /= n;
  // Las sacudidas: la aceleración sin gravedad.
  const a = e.acceleration;
  let ax, ay;
  if (a && a.x != null) [ax, ay] = aPantalla(a.x, a.y);
  else { ax = sx - (alMoverse.px ?? sx); ay = sy - (alMoverse.py ?? sy); }
  alMoverse.px = sx; alMoverse.py = sy;
  // Al pasarlo a la pantalla, la y del teléfono va al revés.
  const kx = convenio === 1 ? ax : -ax, ky = convenio === 1 ? -ay : ay;
  const mag = Math.hypot(kx, ky);
  const rot = e.rotationRate && e.rotationRate.gamma != null ? e.rotationRate.alpha || 0 : 0;
  if (mag > 1.2 || Math.abs(rot) > 40) empujar(kx * 34, ky * 34, rot * 0.004);
}
function encenderSensor() {
  window.addEventListener("devicemotion", alMoverse);
}
function pedirPermiso() {
  const DME = window.DeviceMotionEvent;
  if (DME && typeof DME.requestPermission === "function") {
    DME.requestPermission().then((r) => {
      if (r === "granted") { encenderSensor(); elSensor.hidden = true; elPista.textContent = "mueve el teléfono"; }
    }).catch(() => {});
  }
}
if (window.DeviceMotionEvent && typeof window.DeviceMotionEvent.requestPermission === "function") {
  elSensor.hidden = false;
  elSensor.addEventListener("click", (e) => { e.stopPropagation(); despertar(); pedirPermiso(); });
} else encenderSensor();

/* ══════════════════════════════════════════════════════════════════════
   EL DEDO: arrastrar la bola la sacude; tocar el cristal hace «tin»
   ══════════════════════════════════════════════════════════════════════ */
let dedo = null;
const bola = { x: 0, y: 0, vx: 0, vy: 0, inc: 0 };     // su desplazamiento
mundo.addEventListener("pointerdown", (e) => {
  if (e.target === elSensor) return;
  despertar();
  pedirPermiso();
  const r = mundo.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  dedo = { id: e.pointerId, x0: x, y0: y, x, y, t: performance.now(), movido: false, ox: bola.x, oy: bola.y };
  try { mundo.setPointerCapture(e.pointerId); } catch { /* nada */ }
});
mundo.addEventListener("pointermove", (e) => {
  if (!dedo || e.pointerId !== dedo.id) return;
  const r = mundo.getBoundingClientRect();
  dedo.x = e.clientX - r.left; dedo.y = e.clientY - r.top;
  if (Math.hypot(dedo.x - dedo.x0, dedo.y - dedo.y0) > 8) dedo.movido = true;
});
function soltar(e) {
  if (!dedo || e.pointerId !== dedo.id) return;
  const d = dedo;
  dedo = null;
  if (!d.movido && performance.now() - d.t < 400) {
    const dx = d.x - B.cx - bola.x, dy = d.y - B.cy - bola.y;
    if (Math.hypot(dx, dy) < B.R * 1.05) {
      tin();
      // Un golpecito en el cristal mueve un poco el agua de ese lado.
      empujar(-dx * 0.8, -dy * 0.8, dx > 0 ? 0.6 : -0.6);
    }
  }
}
mundo.addEventListener("pointerup", soltar);
mundo.addEventListener("pointercancel", soltar);

/* ══════════════════════════════════════════════════════════════════════
   EL SONIDO
   ══════════════════════════════════════════════════════════════════════ */
let ac = null, salida = null, agua = null;
function despertar() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  salida = ac.createGain();
  salida.gain.value = 0.9;
  salida.connect(ac.destination);
  // El rumor del agua moviéndose: suena sólo mientras se revuelve.
  const n = ac.sampleRate * 2;
  const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(); s.buffer = b; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 700; f.Q.value = 0.9;
  const gg = ac.createGain(); gg.gain.value = 0;
  s.connect(f).connect(gg).connect(salida);
  s.start();
  agua = { gg, f };
  return ac;
}
function tin() {
  if (!despertar()) return;
  const t = ac.currentTime;
  for (const [m, a] of [[1, 1], [2.63, 0.4], [5.1, 0.15]]) {
    const o = ac.createOscillator(), gg = ac.createGain();
    o.frequency.value = 1760 * m;
    gg.gain.setValueAtTime(0, t);
    gg.gain.linearRampToValueAtTime(0.06 * a, t + 0.003);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + 1.2 / m);
    o.connect(gg).connect(salida);
    o.start(t); o.stop(t + 1.3);
  }
}
let ultimoChapoteo = 0;
function chapoteo(fuerza) {
  if (!ac || performance.now() - ultimoChapoteo < 180) return;
  ultimoChapoteo = performance.now();
  const t = ac.currentTime;
  const o = ac.createOscillator(), gg = ac.createGain();
  o.frequency.setValueAtTime(azar(220, 320), t);
  o.frequency.exponentialRampToValueAtTime(90, t + 0.18);
  gg.gain.setValueAtTime(0.0001, t);
  gg.gain.exponentialRampToValueAtTime(Math.min(0.12, fuerza / 6000), t + 0.02);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  o.connect(gg).connect(salida);
  o.start(t); o.stop(t + 0.3);
}
/* Cuando todo se asienta, una campanita de caja de música. */
function campanitas() {
  if (!ac) return;
  const t = ac.currentTime;
  [1318.5, 1567.98, 1975.5, 2637].forEach((f, i) => {
    const o = ac.createOscillator(), gg = ac.createGain();
    o.frequency.value = f;
    gg.gain.setValueAtTime(0, t + i * 0.16);
    gg.gain.linearRampToValueAtTime(0.03, t + i * 0.16 + 0.005);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.16 + 1.4);
    o.connect(gg).connect(salida);
    o.start(t + i * 0.16); o.stop(t + i * 0.16 + 1.5);
  });
}

/* ══════════════════════════════════════════════════════════════════════
   LOS TEXTOS
   ══════════════════════════════════════════════════════════════════════ */
let nFrase = 0;
function decir(frase, firma) {
  elFrase.classList.add("is-fuera");
  elFirma.classList.add("is-fuera");
  setTimeout(() => {
    elFrase.textContent = frase;
    elFrase.classList.remove("is-fuera");
    elFirma.textContent = firma || "";
    elFirma.classList.toggle("is-fuera", !firma);
  }, suave ? 20 : 450);
}

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */
let t0 = performance.now(), reloj = 0, calma = 0, dichoCalma = true;
const humo = [];

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A) return;
  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
  reloj += dt;

  /* ---- La bola sigue al dedo con un muelle, y sus sacudidas mueven el agua ---- */
  const ox = dedo && dedo.movido ? clamp(dedo.x - dedo.x0 + dedo.ox, -A * 0.3, A * 0.3) : 0;
  const oy = dedo && dedo.movido ? clamp(dedo.y - dedo.y0 + dedo.oy, -H * 0.2, H * 0.2) : 0;
  const k = 90, amort = 12;
  const axB = (ox - bola.x) * k - bola.vx * amort;
  const ayB = (oy - bola.y) * k - bola.vy * amort;
  bola.vx += axB * dt; bola.vy += ayB * dt;
  bola.x += bola.vx * dt; bola.y += bola.vy * dt;
  bola.inc = acercar(bola.inc, clamp(bola.vx * 0.0006, -0.25, 0.25), 8, dt);
  if (Math.abs(axB) + Math.abs(ayB) > 300) empujar(axB * 0.05, ayB * 0.05, bola.vx * 0.00003);
  if (!sensorVivo) { gx = acercar(gx, Math.sin(bola.inc), 5, dt); gy = acercar(gy, Math.cos(bola.inc), 5, dt); }

  /* ---- Física de los copos ---- */
  giro *= Math.exp(-dt * 0.7);
  let moviendo = 0;
  const R = B.R * 0.94;
  for (const c of copos) {
    if (c.posado) continue;
    // El remolino gira alrededor del centro.
    const rx = c.x - B.cx, ry = c.y - B.cy;
    c.vx += -ry * giro * 3 * dt;
    c.vy += rx * giro * 3 * dt;
    // El agua frena, y la gravedad los baja despacito (terminal).
    const roce = Math.exp(-dt * 1.8);
    const cae = CONF.caida * c.lento * (c.brillo ? 0.7 : 1);
    c.vx = c.vx * roce + gx * cae * (1 - roce) + Math.sin(reloj * 0.9 + c.fase) * 4 * dt;
    c.vy = c.vy * roce + gy * cae * (1 - roce);
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    moviendo += Math.hypot(c.vx, c.vy);
    // El cristal: rebotan hacia dentro.
    const d = Math.hypot(c.x - B.cx, c.y - B.cy);
    if (d > R) {
      const nx = (c.x - B.cx) / d, ny = (c.y - B.cy) / d;
      c.x = B.cx + nx * R; c.y = B.cy + ny * R;
      const vn = c.vx * nx + c.vy * ny;
      if (vn > 0) { c.vx -= vn * nx * 1.5; c.vy -= vn * ny * 1.5; }
    }
    // El suelo: si llegan despacio, se posan y hacen montón.
    const col = columna(c.x);
    const piso = sueloEn(c.x) - alturaNieve[col];
    if (c.y > piso) {
      if (Math.hypot(c.vx, c.vy) < 60 && gy > 0.4) {
        c.posado = true;
        c.y = piso;
        alturaNieve[col] = Math.min(B.R * 0.08, alturaNieve[col] + c.r * 0.18);
        // Se reparte un poquito con las columnas de al lado.
        if (col > 0) alturaNieve[col - 1] = Math.max(alturaNieve[col - 1], alturaNieve[col] * 0.7);
        if (col < 63) alturaNieve[col + 1] = Math.max(alturaNieve[col + 1], alturaNieve[col] * 0.7);
      } else { c.y = piso; c.vy = -Math.abs(c.vy) * 0.3; }
    }
  }
  // Si la gravedad se inclina, lo posado resbala.
  if (Math.abs(gx) > 0.5) {
    for (const c of copos) if (c.posado && Math.random() < dt * Math.abs(gx) * 2) { c.posado = false; c.vx = gx * 30; }
  }
  const actividad = moviendo / copos.length;
  if (agua && ac) agua.gg.gain.setTargetAtTime(clamp(actividad / 60, 0, 1) * 0.08, ac.currentTime, 0.1);
  agitado = Math.max(0, agitado - dt * 0.05);
  // Cuando vuelve la calma después de una buena sacudida, una frase.
  if (actividad > 45) { calma = 0; dichoCalma = false; }
  else calma += dt;
  if (!dichoCalma && calma > 2.2) {
    dichoCalma = true;
    const [f, s] = CONF.frases[nFrase++ % CONF.frases.length];
    decir(f, s);
    campanitas();
  }

  /* ---- Pintar ---- */
  g.drawImage(habitacion, 0, 0, A, H);
  const bx = B.cx + bola.x, by = B.cy + bola.y;
  g.save();
  g.translate(bx, by + B.R * 1.2);
  g.rotate(bola.inc);
  g.translate(-bx, -(by + B.R * 1.2));
  g.translate(bola.x, bola.y);

  // La sombra en la mesa.
  const sy = B.cy + B.R * 1.34 - bola.y;
  const sombra = g.createRadialGradient(B.cx, sy, 0, B.cx, sy, B.R * 1.1);
  sombra.addColorStop(0, "rgba(0,0,0,.45)");
  sombra.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = sombra;
  g.save(); g.translate(B.cx, sy); g.scale(1, 0.18); g.translate(-B.cx, -sy);
  g.fillRect(B.cx - B.R * 1.2, sy - B.R * 1.2, B.R * 2.4, B.R * 2.4);
  g.restore();

  // La base de madera, con su filo dorado.
  const baseY = B.cy + B.R * 0.84, baseH = B.R * 0.5, bw = B.R * 0.98;
  const madera = g.createLinearGradient(B.cx - bw, 0, B.cx + bw, 0);
  madera.addColorStop(0, "#2a150f"); madera.addColorStop(0.3, "#6b3a26"); madera.addColorStop(0.55, "#8a4e32"); madera.addColorStop(1, "#2a150f");
  g.fillStyle = madera;
  g.beginPath();
  g.moveTo(B.cx - bw * 0.72, baseY);
  g.lineTo(B.cx + bw * 0.72, baseY);
  g.quadraticCurveTo(B.cx + bw, baseY + baseH * 0.5, B.cx + bw * 0.92, baseY + baseH);
  g.lineTo(B.cx - bw * 0.92, baseY + baseH);
  g.quadraticCurveTo(B.cx - bw, baseY + baseH * 0.5, B.cx - bw * 0.72, baseY);
  g.fill();
  const oro = g.createLinearGradient(B.cx - bw, 0, B.cx + bw, 0);
  oro.addColorStop(0, "#6a4a1a"); oro.addColorStop(0.45, "#f3d488"); oro.addColorStop(0.6, "#c99a44"); oro.addColorStop(1, "#6a4a1a");
  g.fillStyle = oro;
  g.fillRect(B.cx - bw * 0.8, baseY + baseH * 0.28, bw * 1.6, baseH * 0.07);
  g.fillRect(B.cx - bw * 0.93, baseY + baseH * 0.9, bw * 1.86, baseH * 0.1);
  // Un corazoncito de latón en el frente.
  g.fillStyle = oro;
  const hx = B.cx, hy = baseY + baseH * 0.6, hs = baseH * 0.13;
  g.beginPath();
  g.moveTo(hx, hy + hs);
  g.bezierCurveTo(hx - hs * 1.6, hy - hs * 0.2, hx - hs * 0.6, hy - hs * 1.3, hx, hy - hs * 0.45);
  g.bezierCurveTo(hx + hs * 0.6, hy - hs * 1.3, hx + hs * 1.6, hy - hs * 0.2, hx, hy + hs);
  g.fill();

  // Dentro del cristal.
  g.save();
  g.beginPath(); g.arc(B.cx, B.cy, B.R, 0, TAU); g.clip();
  g.drawImage(escena, B.cx - B.R, B.cy - B.R, B.R * 2, B.R * 2);
  // Las ventanas de la casita y la farola, que titilan (y se encienden más si agitas).
  const vivo = 0.75 + 0.25 * Math.sin(reloj * 3.1) * Math.sin(reloj * 1.7) + agitado * 0.4;
  for (const [vx, vy, vw, vh] of B.ventanas) {
    g.fillStyle = `rgba(255,${200 + 30 * vivo | 0},120,${0.9})`;
    g.fillRect(vx, vy, vw, vh);
    const gl = g.createRadialGradient(vx + vw / 2, vy + vh / 2, 0, vx + vw / 2, vy + vh / 2, vw * 3);
    gl.addColorStop(0, `rgba(255,200,120,${0.35 * vivo})`);
    gl.addColorStop(1, "rgba(255,200,120,0)");
    g.fillStyle = gl;
    g.fillRect(vx - vw * 3, vy - vw * 3, vw * 7, vw * 7);
  }
  const [fx, fy] = B.farola;
  const parpadeo = agitado > 0.3 && Math.random() < 0.2 ? 0.3 : 1;
  const cono = g.createRadialGradient(fx, fy, 0, fx, fy, B.R * 0.45);
  cono.addColorStop(0, `rgba(255,226,160,${0.55 * parpadeo})`);
  cono.addColorStop(1, "rgba(255,226,160,0)");
  g.fillStyle = cono;
  g.fillRect(fx - B.R * 0.45, fy - B.R * 0.45, B.R * 0.9, B.R * 0.9);
  g.fillStyle = `rgba(255,240,200,${parpadeo})`;
  g.beginPath(); g.arc(fx, fy, 3.2, 0, TAU); g.fill();
  // El humito de la chimenea.
  if (Math.random() < dt * 3) humo.push({ x: B.chimenea[0], y: B.chimenea[1], t: 0 });
  for (let i = humo.length - 1; i >= 0; i--) {
    const h = humo[i];
    h.t += dt;
    if (h.t > 3) { humo.splice(i, 1); continue; }
    h.x += (Math.sin(reloj + i) * 3 + gx * 4) * dt;
    h.y -= 8 * dt;
    g.fillStyle = `rgba(230,230,245,${0.2 * (1 - h.t / 3)})`;
    g.beginPath(); g.arc(h.x, h.y, 2 + h.t * 3, 0, TAU); g.fill();
  }
  // La nieve posada en el suelo, como un montoncito suave.
  g.fillStyle = "#fbfcff";
  g.beginPath();
  g.moveTo(B.cx - B.R, B.cy + B.R);
  for (let i = 0; i < 64; i++) {
    const px = B.cx - B.R + (i + 0.5) * B.R * 2 / 64;
    g.lineTo(px, sueloEn(px) - alturaNieve[i]);
  }
  g.lineTo(B.cx + B.R, B.cy + B.R);
  g.closePath();
  g.fill();
  // Los copos.
  for (const c of copos) {
    if (c.brillo) {
      const b = Math.max(0, Math.sin(reloj * 4 + c.fase + c.x * 0.05));
      g.fillStyle = `rgba(${c.color},${0.35 + b * 0.65})`;
      g.fillRect(c.x - c.r * 0.5, c.y - c.r * 0.5, c.r, c.r);
      if (b > 0.85 && !c.posado) {
        g.fillRect(c.x - c.r * 2, c.y - 0.3, c.r * 4, 0.6);
        g.fillRect(c.x - 0.3, c.y - c.r * 2, 0.6, c.r * 4);
      }
    } else {
      g.fillStyle = c.posado ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.88)";
      g.beginPath(); g.arc(c.x, c.y, c.r, 0, TAU); g.fill();
    }
  }
  // El vidrio: más oscuro en el borde, con el reflejo de la habitación.
  const borde = g.createRadialGradient(B.cx, B.cy, B.R * 0.7, B.cx, B.cy, B.R);
  borde.addColorStop(0, "rgba(10,10,30,0)");
  borde.addColorStop(1, "rgba(10,10,30,.45)");
  g.fillStyle = borde;
  g.fillRect(B.cx - B.R, B.cy - B.R, B.R * 2, B.R * 2);
  g.restore();

  // Los brillos del cristal, por fuera.
  g.globalCompositeOperation = "lighter";
  const brillo = g.createRadialGradient(B.cx - B.R * 0.42, B.cy - B.R * 0.48, 0, B.cx - B.R * 0.42, B.cy - B.R * 0.48, B.R * 0.55);
  brillo.addColorStop(0, "rgba(255,255,255,.34)");
  brillo.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = brillo;
  g.beginPath(); g.arc(B.cx, B.cy, B.R, 0, TAU); g.fill();
  g.strokeStyle = "rgba(255,255,255,.5)";
  g.lineWidth = B.R * 0.035;
  g.lineCap = "round";
  g.beginPath(); g.arc(B.cx, B.cy, B.R * 0.9, Math.PI * 1.08, Math.PI * 1.36); g.stroke();
  g.lineWidth = B.R * 0.015;
  g.beginPath(); g.arc(B.cx, B.cy, B.R * 0.9, Math.PI * 1.42, Math.PI * 1.5); g.stroke();
  g.strokeStyle = "rgba(255,210,180,.22)";
  g.lineWidth = B.R * 0.02;
  g.beginPath(); g.arc(B.cx, B.cy, B.R * 0.93, Math.PI * 0.1, Math.PI * 0.35); g.stroke();
  g.globalCompositeOperation = "source-over";
  g.strokeStyle = "rgba(255,255,255,.25)";
  g.lineWidth = 1.5;
  g.beginPath(); g.arc(B.cx, B.cy, B.R, 0, TAU); g.stroke();
  g.restore();
}

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const primera = !A;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const apaisado = A > H * 1.2;
  const R = apaisado ? Math.min(H * 0.3, A * 0.2) : Math.min(A * 0.4, H * 0.27);
  B = { cx: apaisado ? A * 0.32 : A / 2, cy: H * (apaisado ? 0.4 : 0.43), R };
  B.suelo = B.cy + R * 0.42;
  pintarHabitacion();
  pintarEscena();
  if (primera) sembrarNieve();
  else for (const c of copos) { c.x = clamp(c.x, B.cx - R, B.cx + R); c.posado = false; }
}
new ResizeObserver(() => requestAnimationFrame(medir)).observe(mundo);
medir();
decir("Está quieta, esperándote.", "agítala");
requestAnimationFrame(paso);
})();
</script>
</body>
