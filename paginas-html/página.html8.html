<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mil grullas</title>
<script src="sonido-libro.js"></script>

<style>
/* ══════════════════════════════════════════════════════════════════════
   Todo dentro de .grullas-mundo, con prefijo `gr-` en cada clase.
   ══════════════════════════════════════════════════════════════════════ */

html, body { margin: 0; height: 100%; }

.grullas-mundo {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  contain: layout paint;
  background:
    radial-gradient(ellipse 130% 70% at 50% 100%, #ffe6ec, transparent 64%),
    linear-gradient(185deg, #cfe2f2 0%, #e6eef7 42%, #fdf3ef 100%);
  color: #40343f;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;

  --seguro-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seguro-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --e-suave: cubic-bezier(0.22, 1, 0.36, 1);
}

.grullas-mundo .gr-lienzo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  /* Los toques los recoge `.gr-toque`, que va justo encima. */
  pointer-events: none;
}

/* La hoja entera es papel: se dobla donde toques. El libro sólo se queda
   el barrido que empieza en sus 24-44 px de borde. */
.grullas-mundo .gr-toque {
  position: absolute;
  inset: 0;
  touch-action: none;
  z-index: 2;
  cursor: pointer;
}

.grullas-mundo .gr-ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  padding:
    calc(var(--seguro-t) + 20px) 22px
    calc(var(--seguro-b) + var(--barra) + 18px) 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.grullas-mundo .gr-titulo {
  margin: 0;
  font-family: var(--tipo-titulo, Georgia, serif);
  font-size: clamp(1rem, 4.4vw, 1.4rem);
  font-weight: 500;
  letter-spacing: 0.05em;
  color: #6b5570;
  opacity: 0.85;
  transition: opacity 800ms var(--e-suave);
}
.grullas-mundo.is-volando .gr-titulo { opacity: 0.2; }

.grullas-mundo .gr-contador {
  position: absolute;
  right: 20px;
  top: calc(var(--seguro-t) + 20px);
  font-variant-numeric: tabular-nums;
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  color: #8a7490;
}
.grullas-mundo .gr-contador b {
  font-size: 1.5em;
  font-weight: 600;
  color: #c2567e;
  display: block;
  line-height: 1;
}

.grullas-mundo .gr-pie {
  margin: 0;
  min-height: 3.6em;
  max-width: 23em;
  font-size: clamp(0.82rem, 3.4vw, 0.97rem);
  line-height: 1.55;
  color: #50404f;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 640ms var(--e-suave), transform 640ms var(--e-suave);
}
.grullas-mundo .gr-pie.is-visible { opacity: 0.94; transform: none; }
.grullas-mundo .gr-pie em {
  display: block;
  margin-top: 0.3em;
  font-family: var(--tipo-mano, "Segoe Script", cursive);
  font-size: 1.16em;
  font-style: normal;
  color: #c2567e;
}

/* ── Los hechizos: una fila de botoncitos abajo ── */
.grullas-mundo .gr-hechizos {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--seguro-b) + var(--barra) + 12px);
  z-index: 4;
  display: flex;
  gap: 6px;
  justify-content: safe center;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 6px 14px;
  pointer-events: none;
}
.grullas-mundo .gr-hechizos::-webkit-scrollbar { display: none; }
.grullas-mundo .gr-hechizos button {
  pointer-events: auto;
  flex: none;
  appearance: none;
  border: 0;
  width: 41px; height: 41px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.74);
  box-shadow: 0 4px 14px -6px rgba(90, 50, 90, 0.5), inset 0 0 0 1.5px rgba(194, 86, 126, 0.22);
  font-size: 20px;
  line-height: 1;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 220ms var(--e-suave), background 220ms, box-shadow 220ms;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.grullas-mundo .gr-hechizos button:active { transform: scale(0.9); }
.grullas-mundo .gr-hechizos button.is-activo {
  background: #ffe0ec;
  box-shadow: 0 0 0 2px #c2567e, 0 8px 18px -6px rgba(194, 86, 126, 0.7);
  transform: translateY(-4px);
}
.grullas-mundo .gr-hechizos button.is-usado::after {
  content: "";
  position: absolute;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #c2567e;
  transform: translate(15px, -15px);
}
.grullas-mundo .gr-ui { padding-bottom: calc(var(--seguro-b) + var(--barra) + 72px); }
.grullas-mundo .gr-noche {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 120% 60% at 50% 100%, rgba(255, 120, 170, 0.28), transparent 60%),
    linear-gradient(185deg, #0e1235 0%, #231a4d 50%, #45285e 100%);
  opacity: 0;
  transition: opacity 1400ms var(--e-suave);
  pointer-events: none;
}
.grullas-mundo.is-noche .gr-noche { opacity: 1; }
.grullas-mundo.is-noche .gr-pie,
.grullas-mundo.is-noche .gr-titulo,
.grullas-mundo.is-noche .gr-contador { color: #f3e6f5; }
.grullas-mundo.is-noche .gr-pie em,
.grullas-mundo.is-noche .gr-contador b { color: #ffb3cf; }

@media (prefers-reduced-motion: reduce) {
  .grullas-mundo * { transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<div class="grullas-mundo" id="mundo">
  <div class="gr-noche" aria-hidden="true"></div>
  <canvas class="gr-lienzo" id="lienzo"></canvas>
  <div class="gr-toque" id="toque" aria-hidden="true"></div>
  <div class="gr-ui">
    <h1 class="gr-titulo" id="titulo">Dobla una grulla</h1>
    <p class="gr-pie" id="pie" role="status" aria-live="polite"></p>
  </div>
  <div class="gr-contador" id="cuenta" aria-hidden="true"><b>0</b>de mil</div>
  <div class="gr-hechizos" id="hechizos" role="toolbar" aria-label="Hechizos">
    <button type="button" data-h="grulla" class="is-activo" aria-label="Grullas">🕊️</button>
    <button type="button" data-h="rayo" aria-label="Rayo">⚡</button>
    <button type="button" data-h="amor" aria-label="Hechizo de amor">💗</button>
    <button type="button" data-h="remolino" aria-label="Remolino">🌀</button>
    <button type="button" data-h="fuegos" aria-label="Fuegos artificiales">🎆</button>
    <button type="button" data-h="arcoiris" aria-label="Arcoíris">🌈</button>
    <button type="button" data-h="magia" aria-label="Multiplicar">🪄</button>
    <button type="button" data-h="noche" aria-label="Noche">🌙</button>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN EDITABLE
   ══════════════════════════════════════════════════════════════════════ */

const CONF = {

  /* ---- LA LEYENDA -----------------------------------------------------
     Mil grullas de papel y se concede un deseo. Aquí no hacen falta mil
     de verdad —eso sería crueldad—: cada toque cuenta por varias, y el
     número sube deprisa cuando se coge carrerilla.                      */
  porToque: 1,          // grullas por toque al principio
  carrerilla: 0.45,     // segundos entre toques para que cuente como racha
  rachaMax: 14,         // cuántas por toque como mucho, con racha larga
  meta: 1000,

  /* ---- LAS FRASES ESCONDIDAS ------------------------------------------
     Cada grulla guarda una. Se lee al doblarla, y no se repite hasta que
     se hayan visto todas.                                                */
  frases: [
    "Por los días en que no hace falta hablar.",
    "Por cómo suena mi nombre cuando lo dices tú.",
    "Por tu risa, que me arregla cualquier día.",
    "Porque contigo todo se siente como en casa.",
    "Porque a tu lado todo se siente tranquilo.",
    "Porque en todas tus fotos te ves preciosa.",
    "Porque cada día te amo un poquito más.",
    "Por tus abrazos.",
    "Porque me escuchas.",
    "Por la cara que pones cuando algo te gusta mucho.",
    "Porque no te rindes conmigo.",
    "Por todos los planes que nos faltan.",
    "Porque eres mi lugar favorito.",
    "Por tu forma de ser, completita.",
    "Porque quiero cuidarte siempre.",
    "Porque contigo lo quiero todo.",
    "Porque me enseñas a amar bonito.",
    "Por lo que no te digo y sabes igual.",
    "Porque eres preciosa, y lo sabes (y si no, te lo digo yo).",
    "Por tus ojitos cuando te ríes.",
    "Porque te amo más de lo que cabe en mil grullas.",
    "Por nuestras llamadas que nunca se acaban.",
    "Porque contigo hasta lo aburrido es bonito.",
    "Por la persona tan linda que eres.",
  ],

  /* ---- LOS HITOS ------------------------------------------------------
     Números en los que pasa algo. En orden.                             */
  hitos: [
    { n: 1,    texto: "Una.", firma: "Faltan novecientas noventa y nueve." },
    { n: 10,   texto: "Diez ya.", firma: "Vas rápido." },
    { n: 50,   texto: "Cincuenta grullas y ni te cansaste.", firma: "Me gusta cómo te concentras." },
    { n: 100,  texto: "Cien. Se te llenó el cielo.", firma: "Y apenas vamos empezando." },
    { n: 250,  texto: "Doscientas cincuenta.", firma: "Cuando lleguemos a mil te digo el deseo." },
    { n: 500,  texto: "Quinientas. La mitad.", firma: "La mitad de nada, si lo piensas." },
    { n: 750,  texto: "Setecientas cincuenta.", firma: "Ya casi. No pares." },
    { n: 999,  texto: "Novecientas noventa y nueve.", firma: "Una más." },
  ],

  /* ---- EL DESEO, al llegar a mil -------------------------------------- */
  deseo: {
    texto: "Mil. Dicen que ahora se concede un deseo.",
    firma: "El mío ya se cumplió: eres tú.",
  },

  /* ---- COLORES DEL PAPEL ---------------------------------------------- */
  papeles: [
    ["#ffd7e4", "#f7a8c6"],
    ["#ffe9c4", "#f6c887"],
    ["#d6f0e4", "#9dd8bd"],
    ["#dbe4ff", "#a9bcf2"],
    ["#f3dcf7", "#d2a6e0"],
    ["#fff0d6", "#f2d197"],
  ],

  vivas: 150,      // grullas en el aire como mucho (se reciclan)
};

/* ══════════════════════════════════════════════════════════════════════
   La maquinaria.
   ══════════════════════════════════════════════════════════════════════ */

const mundo  = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const zona   = document.getElementById("toque");
const elPie  = document.getElementById("pie");
const elCue  = document.getElementById("cuenta");
const ctx    = lienzo.getContext("2d");

const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;

let A = 0, H = 0, dpr = 1;

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width  = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(medir).observe(mundo);

const azar  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ---- Las grullas ------------------------------------------------------
   Agrupadas en un anillo de tamaño fijo: no se crea ni se tira ni un
   objeto mientras vuela nada, así que no hay recolector de basura
   metiéndose en mitad de una animación.                                  */

const N = CONF.vivas;
const gx = new Float32Array(N), gy = new Float32Array(N);
const gvx = new Float32Array(N), gvy = new Float32Array(N);
const gesc = new Float32Array(N);      // tamaño
const gale = new Float32Array(N);      // fase del aleteo
const gvel = new Float32Array(N);      // velocidad del aleteo
const ggir = new Float32Array(N);      // inclinación
const gvid = new Float32Array(N);      // 0 = libre
const gcol = new Int16Array(N);        // qué papel
const gnac = new Float32Array(N);      // 0..1, lo que lleva de nacer
const gbri = new Float32Array(N);      // 0..1, electrizada por un rayo
const gtx = new Float32Array(N), gty = new Float32Array(N);
const gtt = new Float32Array(N);       // segundos que le quedan yendo a su sitio del corazón
let cursor = 0;

function soltarGrulla(x, y) {
  let k = -1;
  for (let j = 0; j < N; j++) {
    const c = (cursor + j) % N;
    if (gvid[c] <= 0) { k = c; cursor = (c + 1) % N; break; }
  }
  /* Si están todas ocupadas se reutiliza la más vieja: mejor eso que
     dejar de responder al dedo. */
  if (k < 0) { k = cursor; cursor = (cursor + 1) % N; }

  gx[k] = x; gy[k] = y;
  const haciaDerecha = x < A * 0.5;
  gvx[k] = (haciaDerecha ? 1 : -1) * azar(28, 70);
  gvy[k] = azar(-52, -95);
  gesc[k] = azar(0.7, 1.35);
  gale[k] = Math.random() * 6.283;
  gvel[k] = azar(4.6, 7.4);
  ggir[k] = 0;
  gvid[k] = 1;
  gnac[k] = 0;
  gbri[k] = 0; gtt[k] = 0;
  gcol[k] = Math.floor(Math.random() * CONF.papeles.length);
  return k;
}

/* ---- Contar ----------------------------------------------------------- */

let total = 0;
let ultimoToque = 0;
let racha = 0;
let siguienteHito = 0;
let frasesLibres = [];
let deseoDicho = false;

function tocar(x, y) {
  const ahora = performance.now();
  racha = (ahora - ultimoToque < CONF.carrerilla * 1000) ? racha + 1 : 0;
  ultimoToque = ahora;

  /* Cuantas más seguidas, más grullas por toque: así llegar a mil es un
     rato agradable y no una tarea. */
  const cuantas = clamp(CONF.porToque + Math.floor(racha * 0.9), 1, CONF.rachaMax);
  const visibles = Math.min(cuantas, 6);   // en pantalla no hacen falta más
  /* Primero se dobla el papelito donde tocaste, y de ahí despegan. */
  if (pliegues.length < 8 && !suave) pliegues.push({ x, y, t: 0, col: Math.floor(Math.random() * CONF.papeles.length), n: visibles });
  else for (let i = 0; i < visibles; i++) soltarGrulla(x + azar(-16, 16), y + azar(-12, 12));

  const antes = total;
  total = Math.min(CONF.meta, total + cuantas);
  pintarCuenta();
  campanita(racha);
  mundo.classList.add("is-volando");

  /* La frase de la grulla, sin repetir hasta agotarlas. */
  if (!frasesLibres.length) frasesLibres = CONF.frases.slice();
  const i = Math.floor(Math.random() * frasesLibres.length);
  const frase = frasesLibres.splice(i, 1)[0];

  /* Los hitos mandan sobre la frase suelta. */
  let hito = null;
  while (siguienteHito < CONF.hitos.length && CONF.hitos[siguienteHito].n <= total) {
    if (CONF.hitos[siguienteHito].n > antes) hito = CONF.hitos[siguienteHito];
    siguienteHito++;
  }
  if (total >= CONF.meta && !deseoDicho) {
    deseoDicho = true;
    decir(CONF.deseo.texto, CONF.deseo.firma, true);
    lluviaDeGrullas();
    formarCorazon();
  } else if (hito) {
    decir(hito.texto, hito.firma, true);
  } else {
    decir(frase);
  }

  vigilarSecretos(x, y);
}

const pliegues = [];
const DOBLAR = 0.34;   // segundos que tarda en doblarse

/* El papel doblándose: un cuadrado que gira a rombo, se dobla por la
   mitad y se cierra en triangulito antes de ser grulla. */
function pliegue(p) {
  const k = clamp(p.t / DOBLAR, 0, 1);
  const [claro, hondo] = CONF.papeles[p.col];
  const t = 26 * Math.min(1, k * 3);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(Math.PI / 4 * Math.min(1, k * 2.4));
  const dobla = Math.cos(clamp((k - 0.35) / 0.45, 0, 1) * Math.PI);   // 1 → -1
  ctx.globalAlpha = 1 - clamp((k - 0.85) / 0.15, 0, 1);
  // Mitad de abajo, fija.
  ctx.fillStyle = claro;
  ctx.beginPath(); ctx.moveTo(-t / 2, 0); ctx.lineTo(t / 2, 0); ctx.lineTo(t / 2, t / 2); ctx.lineTo(-t / 2, t / 2); ctx.closePath(); ctx.fill();
  // Mitad de arriba, que se dobla hacia abajo por el pliegue.
  ctx.scale(1, dobla);
  ctx.fillStyle = dobla < 0 ? hondo : claro;
  ctx.beginPath(); ctx.moveTo(-t / 2, 0); ctx.lineTo(t / 2, 0); ctx.lineTo(t / 2, -t / 2); ctx.lineTo(-t / 2, -t / 2); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = hondo; ctx.lineWidth = 1; ctx.globalAlpha *= 0.6;
  ctx.beginPath(); ctx.moveTo(-t / 2, 0); ctx.lineTo(t / 2, 0); ctx.stroke();
  ctx.restore();
}

/* Las guirnaldas de mil grullas (senbazuru): una por cada cien, colgando
   de los bordes. Así se ve lo que llevas sin mirar el número. */
function guirnaldas() {
  const n = Math.min(10, Math.floor(total / 100));
  const xs = [0.05, 0.95, 0.12, 0.88, 0.19, 0.81, 0.26, 0.74, 0.33, 0.67];
  for (let g = 0; g < n; g++) {
    const x = xs[g] * A, largo = H * (0.22 + (g % 3) * 0.05);
    const vaiven = Math.sin(reloj * 0.9 + g) * 4;
    ctx.strokeStyle = "rgba(120, 80, 100, 0.35)";
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.quadraticCurveTo(x + vaiven, largo / 2, x + vaiven * 1.6, largo); ctx.stroke();
    for (let k = 1; k <= 6; k++) {
      const u = k / 6.4;
      grulla(x + vaiven * 1.6 * u, largo * u, 0.36, Math.PI / 2 + Math.sin(reloj * 1.6 + k + g) * 0.25, Math.sin(reloj + k) * 0.1, (g + k) % CONF.papeles.length, 0.85);
    }
    ctx.fillStyle = "#e0a0b8";
    ctx.beginPath(); ctx.arc(x + vaiven * 1.6, largo + 4, 2.4, 0, 6.283); ctx.fill();
  }
}

/* A las mil: las grullas vuelan a formar un corazón enorme. */
let formacion = null;
function formarCorazon() {
  const cx = A / 2, cy = H * 0.44, esc = Math.min(A, H) * 0.021;
  const piezas = [];
  const M = 46;
  for (let k = 0; k < M; k++) {
    const a = (k / M) * Math.PI * 2;
    const tx = cx + 16 * Math.pow(Math.sin(a), 3) * esc;
    const ty = cy - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * esc;
    piezas.push({ x: azar(0, A), y: H + azar(20, 140), tx, ty, ale: Math.random() * 6.28, col: k % CONF.papeles.length, d: azar(0, 0.8) });
  }
  formacion = { t: 0, piezas };
}

function pintarCuenta() {
  elCue.innerHTML = "";
  const b = document.createElement("b");
  b.textContent = String(total);
  elCue.append(b, document.createTextNode(total >= CONF.meta ? "mil" : "de mil"));
}

function lluviaDeGrullas() {
  let k = 0;
  const reloj = setInterval(() => {
    for (let i = 0; i < 3; i++) soltarGrulla(azar(0, A), H + azar(10, 60));
    if (++k > 22) clearInterval(reloj);
  }, 110);
}

/* ---- Toque ------------------------------------------------------------ */

function enPantalla(e) {
  const r = mundo.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

let arrastrando = false;
let ultimoSoltado = 0;

zona.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  zona.setPointerCapture(e.pointerId);
  arrastrando = true;
  const p = enPantalla(e);
  if (modo !== "grulla") { lanzar(p.x, p.y); ultimoSoltado = performance.now(); return; }
  if (atrapar(p.x, p.y)) return;
  tocar(p.x, p.y);
});

/* Tocar una grulla que ya va volando: da un brinco y suelta corazones. */
const FRASES_ATRAPADA = [
  "¡La atrapaste! Esa lleva tu nombre 🥹",
  "Esa quería un abrazo tuyo 🤍",
  "Te eligió a ti, como yo.",
  "Mira, te dejó corazoncitos.",
];
let atrapadas = 0;
function atrapar(x, y) {
  for (let i = 0; i < N; i++) {
    if (gvid[i] <= 0 || gnac[i] < 1) continue;
    const r = 24 * gesc[i];
    if (Math.hypot(x - gx[i], y - (gy[i] - 8 * gesc[i])) < r) {
      gvy[i] = -260;
      gvel[i] = 16;
      for (let k = 0; k < 7; k++) corazones.push({ x: gx[i], y: gy[i], vx: azar(-60, 60), vy: azar(-120, -40), t: 0, r: azar(5, 9) });
      decir(FRASES_ATRAPADA[atrapadas++ % FRASES_ATRAPADA.length], "", true);
      campanita(12);
      return true;
    }
  }
  return false;
}
const corazones = [];

function decir(texto, firma, importante) {
  const ahora = performance.now();
  if (!importante && ahora < bloqueado) return;
  if (pidiendo === texto) return;
  pidiendo = texto;
  if (importante) bloqueado = ahora + 3400;
  elPie.classList.remove("is-visible");
  setTimeout(() => {
    elPie.textContent = texto;
    if (firma) {
      const em = document.createElement("em");
      em.textContent = firma;
      elPie.append(em);
    }
    elPie.classList.add("is-visible");
  }, suave ? 10 : 260);
}

let audio = null;
function campanita(racha) {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime;
    /* Sube de tono con la racha: premia seguir. Y se queda dentro de una
       escala pentatónica, que es la que no puede sonar mal. */
    const escala = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21];
    const paso = escala[Math.min(racha, escala.length - 1)];
    const f = 523.25 * Math.pow(2, paso / 12);
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.07, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g).connect(audio.destination);
    o.start(t); o.stop(t + 0.5);
  } catch { /* sin sonido se dobla igual */ }
}

/* 1. Una grulla de cada cien es negra y no vuela: se queda posada hasta
      que se la toca otra vez, y entonces dice algo distinto.             */
let posada = null;
const PROB_POSADA = 0.012;

/* 2. Si se tocan las cuatro esquinas de la hoja, en cualquier orden y sin
      pasar un minuto, todas las grullas que haya en el aire dan la vuelta
      y se van hacia el mismo sitio.                                      */
const esquinas = [false, false, false, false];
let esquinasDesde = 0;

function vigilarSecretos(x, y) {
  /* — la grulla posada — */
  if (!posada && Math.random() < PROB_POSADA && total > 12) {
    posada = { x, y: Math.min(y, H - 80), ale: 0, esperando: true };
  }

  /* — las cuatro esquinas — */
  const m = Math.min(A, H) * 0.22;
  const ahora = performance.now();
  if (ahora - esquinasDesde > 60000) { esquinas.fill(false); esquinasDesde = ahora; }
  if (x < m && y < m) esquinas[0] = true;
  if (x > A - m && y < m) esquinas[1] = true;
  if (x < m && y > H - m) esquinas[2] = true;
  if (x > A - m && y > H - m) esquinas[3] = true;
  if (esquinas.every(Boolean)) {
    esquinas.fill(false);
    bandada = 1;
    decir("Todas a la vez, hacia el mismo sitio.", "Como nosotros, siempre hacia el mismo lado.", true);
  }
}
let bandada = 0;

/* 3. Si no se toca nada durante medio minuto, una grulla sola cruza la
      hoja de lado a lado, despacio, y deja una frase.                    */
let quieta = 0;

zona.addEventListener("pointerdown", (e) => {
  if (!posada) return;
  const p = enPantalla(e);
  const d = Math.hypot(p.x - posada.x, p.y - posada.y);
  if (d < 46) {
    posada = null;
    decir("Esa no quería volar.", "Hay días así, y también están bien.", true);
    campanita(9);
  }
});

/* ══════════════════════════════════════════════════════════════════════
   DIBUJAR UNA GRULLA
   Papel doblado: dos alas, un cuello y una cola. Todo con rectas, que es
   lo que es el origami.
   ══════════════════════════════════════════════════════════════════════ */

function grulla(x, y, esc, aleteo, giro, papel, alfa) {
  const [claro, hondo] = Array.isArray(papel) ? papel : CONF.papeles[papel];
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(giro);
  /* El 2.2 es lo que las hizo leerse. Al principio iban a tamaño 1 y a esa
     escala una grulla son cuatro rayas: lo que se veía era confeti. Una
     figura hecha de triángulos necesita tamaño para que se le distingan
     las partes, y aquí las partes SON la gracia. */
  ctx.scale(esc * 2.2, esc * 2.2);
  ctx.globalAlpha = alfa;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";

  /* El aleteo abre y cierra las alas: se miden a lo alto, no a lo ancho,
     porque un ave vista de lado sube y baja el ala, no la encoge. */
  const a = Math.cos(aleteo);          // -1 abajo · +1 arriba
  const subeD = a * 7;                 // ala de delante
  const subeT = a * 5;                 // la de atrás va con retraso

  /* — Ala de atrás. Se pinta primero y en el tono hondo: es lo que hace
       que se vea que hay dos alas y no una. — */
  ctx.fillStyle = hondo;
  ctx.beginPath();
  ctx.moveTo(0, -1);
  ctx.lineTo(-7, -9 - subeT);
  ctx.lineTo(4, -10 - subeT);
  ctx.closePath();
  ctx.fill();

  /* — El cuerpo: el rombo de papel de siempre. — */
  ctx.fillStyle = claro;
  ctx.beginPath();
  ctx.moveTo(-8, 0);          // por donde sale la cola
  ctx.lineTo(0, -4);          // el lomo
  ctx.lineTo(9, 0);           // por donde sale el cuello
  ctx.lineTo(0, 5);           // la panza
  ctx.closePath();
  ctx.fill();

  /* — El cuello y la cabeza. Papel doblado: dos rectas y un pico. — */
  ctx.fillStyle = claro;
  ctx.beginPath();
  ctx.moveTo(7, -1);
  ctx.lineTo(16, -9);
  ctx.lineTo(19, -8);         // el pico
  ctx.lineTo(15, -6);
  ctx.lineTo(8, 1);
  ctx.closePath();
  ctx.fill();

  /* — La cola, hacia arriba y hacia atrás, que es como va la de una
       grulla de papel. — */
  ctx.fillStyle = hondo;
  ctx.beginPath();
  ctx.moveTo(-6, 0);
  ctx.lineTo(-17, -6);
  ctx.lineTo(-15, -3);
  ctx.lineTo(-6, 3);
  ctx.closePath();
  ctx.fill();

  /* — Ala de delante, la grande, la que se ve entera. — */
  ctx.fillStyle = claro;
  ctx.beginPath();
  ctx.moveTo(1, -1);
  ctx.lineTo(-9, -13 - subeD);
  ctx.lineTo(6, -12 - subeD);
  ctx.closePath();
  ctx.fill();

  /* — Los pliegues. Son DOS rayas y son las que convierten un triángulo
       de color en papel doblado. — */
  ctx.strokeStyle = hondo;
  ctx.lineWidth = 0.9;
  ctx.globalAlpha = alfa * 0.55;
  ctx.beginPath();
  ctx.moveTo(1, -1);
  ctx.lineTo(-2, -12 - subeD);     // el nervio del ala
  ctx.moveTo(-8, 0);
  ctx.lineTo(9, 0);                // la quilla del cuerpo
  ctx.stroke();

  ctx.restore();
}

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */

let t0 = performance.now();
let reloj = 0;
let solitaria = null;

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A || !H) return;

  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.5) dt = 1 / 60;
  else if (dt > 0.1) dt = 0.1;
  reloj += dt;

  quieta = arrastrando ? 0 : quieta + dt;
  if (quieta > SECRETO_QUIETA && !solitaria) {
    quieta = -45;
    solitaria = { x: -40, y: H * azar(0.28, 0.6), ale: 0, esc: 1.7 };
    decir("Esa iba sola y no parecía triste.", "También se puede.", true);
  }

  bandada = bandada > 0 ? Math.max(0, bandada - dt * 0.5) : 0;

  ctx.clearRect(0, 0, A, H);

  /* --- las guirnaldas de los bordes --- */
  guirnaldas();

  /* --- los papelitos doblándose --- */
  for (let i = pliegues.length - 1; i >= 0; i--) {
    const p = pliegues[i];
    p.t += dt;
    if (p.t >= DOBLAR) {
      for (let k = 0; k < p.n; k++) soltarGrulla(p.x + azar(-16, 16), p.y + azar(-12, 12));
      pliegues.splice(i, 1);
      continue;
    }
    pliegue(p);
  }

  /* --- las grullas --- */
  for (let i = 0; i < N; i++) {
    if (gvid[i] <= 0) continue;

    gnac[i] = Math.min(1, gnac[i] + dt * 3.4);
    gale[i] += gvel[i] * dt;

    /* Empujoncito de aire: una corriente lenta que las mece a todas
       igual, más una ondulación propia de cada una. */
    const brisa = Math.sin(reloj * 0.6 + gy[i] * 0.004) * 16;
    let vx = gvx[i] + brisa;
    let vy = gvy[i] + Math.sin(reloj * 2.1 + gale[i]) * 12;

    if (bandada > 0) {
      /* El secreto de las esquinas: todas viran al mismo rumbo. */
      const k = Math.min(1, bandada * 2);
      vx = vx * (1 - k) + 120 * k;
      vy = vy * (1 - k) - 40 * k;
    }

    if (vortice) {
      const dx = gx[i] - vortice.x, dy = gy[i] - vortice.y, d = Math.hypot(dx, dy) || 1;
      if (d < vortice.r) { const f = (1 - d / vortice.r) * Math.min(1, vortice.t * 2); vx += (-dy / d) * 300 * f - (dx / d) * 60 * f; vy += (dx / d) * 300 * f - (dy / d) * 60 * f; }
    }
    if (gtt[i] > 0) { gtt[i] -= dt; vx = (gtx[i] - gx[i]) * 3.2; vy = (gty[i] - gy[i]) * 3.2; if (gtt[i] <= 0) gvy[i] = azar(-60, -100); }
    if (gbri[i] > 0) gbri[i] = Math.max(0, gbri[i] - dt * 0.35);

    gx[i] += vx * dt;
    gy[i] += vy * dt;
    gvy[i] -= 4 * dt;                 // van subiendo cada vez más
    ggir[i] = Math.atan2(vy, vx) * 0.32 + Math.sin(reloj * 1.4 + gale[i]) * 0.09;

    if (gy[i] < -70 || gx[i] < -80 || gx[i] > A + 80) { gvid[i] = 0; continue; }

    /* Se desvanecen arriba del todo en vez de cortarse de golpe. */
    const alfa = gtt[i] > 0 ? gnac[i] : Math.min(gnac[i], clamp(gy[i] / (H * 0.22), 0, 1));
    let papel = gcol[i];
    if (arcoiris > 0) { const h = (i * 37 + reloj * 140) % 360; papel = [`hsl(${h},95%,84%)`, `hsl(${h},85%,64%)`]; if (Math.random() < dt * 8) chispas.push({ x: gx[i] - 10, y: gy[i], vx: 0, vy: 10, t: 0, m: 0.8, c: `hsl(${h},90%,70%)`, r: 1.6 }); }
    if (gbri[i] > 0) { papel = ["#fff6c8", "#ffc94a"]; if (Math.random() < dt * 10) chispas.push({ x: gx[i] + azar(-12, 12), y: gy[i] + azar(-14, 6), vx: azar(-30, 30), vy: azar(-30, 30), t: 0, m: 0.35, c: "#fff3b0", r: 1.3 }); }
    if (noche > 0.05) { const r = 34 * gesc[i]; ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = noche * 0.5 * alfa; ctx.drawImage(farol, gx[i] - r, gy[i] - 8 * gesc[i] - r, r * 2, r * 2); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over"; }
    grulla(gx[i], gy[i], gesc[i] * (0.5 + 0.5 * gnac[i]), gale[i], ggir[i], papel, alfa);
  }

  /* --- la grulla posada (secreto 1) --- */
  if (posada) {
    posada.ale += dt * 1.1;
    ctx.save();
    ctx.globalAlpha = 0.9;
    /* Negra: se dibuja igual y se le echa un velo oscuro encima. */
    grulla(posada.x, posada.y, 1.25, Math.PI / 2, 0, 0, 1);
    ctx.globalCompositeOperation = "source-atop";
    ctx.fillStyle = "rgba(38, 28, 40, 0.86)";
    ctx.fillRect(posada.x - 40, posada.y - 40, 80, 80);
    ctx.restore();
    /* Un parpadeo del ojo, para que se note que está viva. */
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(posada.ale * 2.2);
    ctx.fillStyle = "#ffd9e6";
    ctx.beginPath();
    ctx.arc(posada.x + 13, posada.y - 5, 1.6, 0, 6.283);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* --- la grulla solitaria (secreto 3) --- */
  if (solitaria) {
    solitaria.x += 52 * dt;
    solitaria.y += Math.sin(reloj * 0.9) * 9 * dt;
    solitaria.ale += dt * 3.1;
    grulla(solitaria.x, solitaria.y, solitaria.esc, solitaria.ale, -0.06, 3, 0.85);
    if (solitaria.x > A + 80) solitaria = null;
  }

  /* --- el corazón de las mil --- */
  if (formacion) {
    formacion.t += dt;
    const ft = formacion.t;
    for (const p of formacion.piezas) {
      p.ale += dt * 6;
      const k = clamp((ft - p.d) / 2.4, 0, 1), e = 1 - Math.pow(1 - k, 3);
      let x = p.x + (p.tx - p.x) * e, y = p.y + (p.ty - p.y) * e;
      if (ft > 8) { y -= (ft - 8) * 160; x += Math.sin(p.ale) * 10; }
      else if (k >= 1) { y += Math.sin(ft * 2 + p.tx * 0.05) * 2; }
      grulla(x, y, 0.62, p.ale, 0, p.col, 1);
    }
    if (ft > 11) formacion = null;
  }

  dibujaHechizos(dt);

  /* --- los corazones de las grullas atrapadas --- */
  for (let i = corazones.length - 1; i >= 0; i--) {
    const c = corazones[i];
    c.t += dt; c.vy += 90 * dt; c.x += c.vx * dt; c.y += c.vy * dt;
    if (c.t > 1.4) { corazones.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - c.t / 1.4;
    ctx.fillStyle = "#ff6f9a";
    ctx.beginPath();
    ctx.moveTo(c.x, c.y + c.r * 0.8);
    ctx.bezierCurveTo(c.x - c.r * 1.4, c.y - c.r * 0.1, c.x - c.r * 0.55, c.y - c.r * 1.05, c.x, c.y - c.r * 0.35);
    ctx.bezierCurveTo(c.x + c.r * 0.55, c.y - c.r * 1.05, c.x + c.r * 1.4, c.y - c.r * 0.1, c.x, c.y + c.r * 0.8);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
}

medir();
pintarCuenta();
decir("Toca el papel. Se dobla solo.", "Y abajo hay hechizos ✨ pruébalos todos.");
requestAnimationFrame(paso);

})();
</script>
