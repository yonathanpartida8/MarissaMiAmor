<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>El vaho</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:wght@500&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   EL VAHO
   Una ventana empañada de noche, con la ciudad y la lluvia detrás. Un dedo
   que no se ve escribe en el vaho, letra por letra, los sitios que son
   nuestros. Todo con prefijo `vh-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0f1c; }
.vh {
  position: fixed;
  inset: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  font-family: "Cormorant Garamond", Georgia, serif;
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
}
.vh canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* El marco de madera de la ventana, por encima del cristal. */
.vh-marco {
  position: absolute;
  inset: 0;
  pointer-events: none;
  border: clamp(10px, 3.2vw, 18px) solid #2a1a14;
  border-top-width: calc(var(--seg-t) + clamp(10px, 3.2vw, 18px));
  border-bottom-width: calc(var(--seg-b) + var(--barra) + clamp(40px, 11vw, 56px));
  box-shadow:
    inset 0 0 0 2px rgba(0, 0, 0, 0.6),
    inset 0 0 26px rgba(0, 0, 0, 0.55);
  opacity: 0.97;
}
.vh-marco::after {
  /* La luz de dentro de casa rozando la madera. */
  content: "";
  position: absolute;
  inset: -40px;
  background: linear-gradient(180deg, rgba(255, 190, 130, 0.08), transparent 40%);
}

.vh-ui {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--seg-b) + var(--barra) + 8px);
  height: clamp(32px, 9vw, 44px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  pointer-events: none;
}
.vh-pista {
  margin: 0;
  font-size: clamp(0.6rem, 2.5vw, 0.7rem);
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: rgba(255, 226, 196, 0.62);
  transition: opacity 900ms ease;
}
.vh-pista.is-fuera { opacity: 0; }
.vh-puntos { display: flex; gap: 10px; pointer-events: auto; }
.vh-puntos button {
  width: 22px; height: 22px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  display: grid;
  place-items: center;
  -webkit-tap-highlight-color: transparent;
}
.vh-puntos button::before {
  content: "";
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255, 230, 205, 0.28);
  box-shadow: 0 0 0 1px rgba(255, 230, 205, 0.3);
  transition: background 500ms ease, transform 500ms ease, box-shadow 500ms ease;
}
.vh-puntos button.is-actual::before { background: #ffe7cc; transform: scale(1.35); box-shadow: 0 0 10px rgba(255, 210, 160, 0.8); }
.vh-puntos button.is-visto::before { background: rgba(255, 230, 205, 0.6); }
.vh-ui.is-inicio .vh-puntos { opacity: 0; pointer-events: none; }
.vh-ui:not(.is-inicio) .vh-pista { position: absolute; bottom: calc(100% + 2px); }
</style>
</head>
<body>
<div class="vh" id="mundo">
  <canvas id="lienzo"></canvas>
  <div class="vh-marco"></div>
  <div class="vh-ui is-inicio" id="ui">
    <p class="vh-pista" id="pista">toca el cristal</p>
    <div class="vh-puntos" id="puntos" role="tablist" aria-label="Lugares"></div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE SE ESCRIBE EN EL VAHO. Sólo esto, en este orden.
   ══════════════════════════════════════════════════════════════════════ */
const LUGARES = [
  ["Angelos Burger", "Tenemos que ir muchas veces más."],
  ["Los Portales Cafetería", "Una de nuestras citas, de mis favoritas. Explotaba de amor."],
  ["Tu casa", "Me encanta ir. Tu casa es muy relajante."],
  ["Morelia", "Tenemos que ir."],
  ["Nuestro futuro", "Me da miedo pensarlo, pero estoy seguro de lo que quiero contigo, así que eso me da menos miedo."],
];

const mundo = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const g = lienzo.getContext("2d", { alpha: false });
const elPista = document.getElementById("pista");
const elUi = document.getElementById("ui");
const elPuntos = document.getElementById("puntos");

const TAU = Math.PI * 2;
const azar = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

let A = 0, H = 0, dpr = 1;
const S = 0.6;                         // resolución de las capas del vaho

/* ══════════════════════════════════════════════════════════════════════
   LAS CAPAS
   fondo      la ciudad nítida, tal cual se ve por el cristal limpio
   borroso    la misma ciudad a través del vaho
   vaho       dónde hay vaho (blanco = empañado); el dedo lo borra
   escrito    lo que el dedo invisible ha escrito (blanco = limpio)
   bordes     el filo mojado de las letras
   ══════════════════════════════════════════════════════════════════════ */
let fondo, borroso, vaho, escrito, bordes, mezcla, tinta;
let gF, gV, gE, gB, gM, gT;
const luces = [];

function lienzoNuevo(w, h, escala = 1) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * escala));
  c.height = Math.max(1, Math.round(h * escala));
  return c;
}

function pintarCiudad() {
  fondo = lienzoNuevo(A, H, dpr);
  gF = fondo.getContext("2d");
  gF.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cielo = gF.createLinearGradient(0, 0, 0, H);
  cielo.addColorStop(0, "#0b1224");
  cielo.addColorStop(0.55, "#1b1f3a");
  cielo.addColorStop(1, "#2a1c2c");
  gF.fillStyle = cielo;
  gF.fillRect(0, 0, A, H);
  // Edificios con sus ventanas encendidas.
  let x = -10;
  while (x < A + 10) {
    const w = azar(40, 90), h = azar(H * 0.22, H * 0.55), y = H - h;
    gF.fillStyle = `rgb(${azar(10, 18) | 0},${azar(12, 20) | 0},${azar(26, 36) | 0})`;
    gF.fillRect(x, y, w, h);
    for (let wy = y + 10; wy < H - 10; wy += 14) {
      for (let wx = x + 6; wx < x + w - 8; wx += 11) {
        if (Math.random() < 0.3) {
          gF.fillStyle = Math.random() < 0.7 ? `rgba(255,${azar(180, 220) | 0},${azar(110, 160) | 0},${azar(0.5, 0.95)})` : "rgba(170,200,255,.7)";
          gF.fillRect(wx, wy, 5, 7);
        }
      }
    }
    x += w + azar(2, 10);
  }
  // Farolas y las luces de la calle, redondas y grandes.
  luces.length = 0;
  for (let i = 0; i < 26; i++) {
    const cal = Math.random() < 0.72;
    luces.push({
      x: Math.random() * A, y: azar(H * 0.35, H * 0.98), r: azar(10, 38),
      col: cal ? [255, azar(170, 215) | 0, azar(100, 150) | 0] : Math.random() < 0.5 ? [255, 90, 120] : [140, 190, 255],
      f: Math.random() * TAU,
    });
  }
  for (const l of luces) {
    const r = gF.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
    r.addColorStop(0, `rgba(${l.col},.95)`);
    r.addColorStop(0.35, `rgba(${l.col},.45)`);
    r.addColorStop(1, `rgba(${l.col},0)`);
    gF.fillStyle = r;
    gF.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
  }
  // Un brillo mojado en el suelo de la calle.
  const suelo = gF.createLinearGradient(0, H * 0.85, 0, H);
  suelo.addColorStop(0, "rgba(255,190,140,0)");
  suelo.addColorStop(1, "rgba(255,190,140,.14)");
  gF.fillStyle = suelo;
  gF.fillRect(0, H * 0.85, A, H * 0.15);

  // La versión borrosa: se encoge muchísimo y se vuelve a estirar.
  const chico = lienzoNuevo(A, H, 1 / 14);
  const gc = chico.getContext("2d");
  gc.drawImage(fondo, 0, 0, chico.width, chico.height);
  const medio = lienzoNuevo(A, H, 1 / 5);
  const gm = medio.getContext("2d");
  gm.imageSmoothingQuality = "high";
  gm.drawImage(chico, 0, 0, medio.width, medio.height);
  borroso = lienzoNuevo(A, H, dpr);
  const gb = borroso.getContext("2d");
  gb.imageSmoothingQuality = "high";
  gb.drawImage(medio, 0, 0, borroso.width, borroso.height);
  // El velo blanco del vaho, con su grano.
  gb.fillStyle = "rgba(206,214,230,.5)";
  gb.fillRect(0, 0, borroso.width, borroso.height);
  for (let i = 0; i < 2600; i++) {
    gb.fillStyle = `rgba(255,255,255,${azar(0.02, 0.08)})`;
    const s = azar(1, 3) * dpr;
    gb.fillRect(Math.random() * borroso.width, Math.random() * borroso.height, s, s);
  }
}

function prepararVaho() {
  vaho = lienzoNuevo(A, H, S);
  gV = vaho.getContext("2d");
  gV.fillStyle = "#fff";
  gV.fillRect(0, 0, vaho.width, vaho.height);
  escrito = lienzoNuevo(A, H, S);
  gE = escrito.getContext("2d");
  bordes = lienzoNuevo(A, H, S);
  gB = bordes.getContext("2d");
  mezcla = lienzoNuevo(A, H, dpr);
  gM = mezcla.getContext("2d");
  tinta = lienzoNuevo(A, H, S);
  gT = tinta.getContext("2d");
}

/* ══════════════════════════════════════════════════════════════════════
   EL SONIDO: el dedo rechinando en el cristal y las gotas
   ══════════════════════════════════════════════════════════════════════ */
let ac = null, salida = null, roce = null;
function despertar() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  salida = ac.createGain();
  salida.gain.value = 0.9;
  salida.connect(ac.destination);
  return ac;
}
function empezarRoce() {
  if (!despertar() || roce) return;
  const n = ac.sampleRate * 2;
  const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(); s.buffer = b; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 2400; f.Q.value = 6;
  const gg = ac.createGain(); gg.gain.value = 0;
  s.connect(f).connect(gg).connect(salida);
  s.start();
  roce = { s, f, gg };
}
function moverRoce(fuerza, tono) {
  if (!roce) return;
  const t = ac.currentTime;
  roce.gg.gain.setTargetAtTime(fuerza * 0.05, t, 0.03);
  roce.f.frequency.setTargetAtTime(1800 + tono * 1600, t, 0.05);
}
function pararRoce() {
  if (!roce) return;
  const t = ac.currentTime, r = roce;
  r.gg.gain.setTargetAtTime(0, t, 0.05);
  r.s.stop(t + 0.4);
  roce = null;
}
function gotita() {
  if (!despertar()) return;
  const t = ac.currentTime, o = ac.createOscillator(), gg = ac.createGain();
  const f = azar(1500, 2600);
  o.frequency.setValueAtTime(f, t);
  o.frequency.exponentialRampToValueAtTime(f * 0.55, t + 0.06);
  gg.gain.setValueAtTime(0.0001, t);
  gg.gain.exponentialRampToValueAtTime(0.03, t + 0.005);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
  o.connect(gg).connect(salida);
  o.start(t); o.stop(t + 0.1);
}

/* ══════════════════════════════════════════════════════════════════════
   LA ESCRITURA
   Cada lugar se parte en renglones: el nombre, grande; su frase, en letra
   más chica. El dedo invisible los va destapando de izquierda a derecha,
   un renglón detrás de otro, y deja el cristal limpio por donde pasa.
   ══════════════════════════════════════════════════════════════════════ */
let actual = -1;
let escritura = null;       // { renglones, i, x, fin }
let secado = 0;             // lo que le queda de visible a lo escrito, 0..1
let cambiando = 0;          // >0 mientras el vaho tapa lo anterior
const visto = new Set();

function partir(texto, fuente, ancho) {
  gE.font = fuente;
  const palabras = texto.split(" ");
  const renglones = [];
  let linea = "";
  for (const p of palabras) {
    const prueba = linea ? linea + " " + p : p;
    if (gE.measureText(prueba).width > ancho && linea) { renglones.push(linea); linea = p; }
    else linea = prueba;
  }
  if (linea) renglones.push(linea);
  return renglones;
}

function componer(i) {
  const [nombre, frase] = LUGARES[i];
  const ancho = A * S * 0.8;
  let tN = Math.min(A * 0.13, H * 0.075, 60) * S;
  let tF = Math.min(A * 0.078, H * 0.046, 34) * S;
  const fN = (t) => `700 ${t}px "Caveat", "Segoe Print", cursive`;
  const fF = (t) => `500 ${t}px "Caveat", "Segoe Print", cursive`;
  let rN = partir(nombre, fN(tN), ancho);
  let rF = partir(frase, fF(tF), ancho);
  // Si no cabe de alto, todo un poco más chico.
  const alto = () => rN.length * tN * 1.05 + tF * 0.6 + rF.length * tF * 1.12;
  while (alto() > H * S * 0.62 && tF > 12) {
    tN *= 0.92; tF *= 0.92;
    rN = partir(nombre, fN(tN), ancho);
    rF = partir(frase, fF(tF), ancho);
  }
  const renglones = [];
  let y = (H * S) * 0.44 - alto() / 2 + tN * 0.6;
  const inclina = azar(-0.035, 0.02);
  for (const r of rN) {
    renglones.push({ texto: r, fuente: fN(tN), tam: tN, y, inclina, nombre: true });
    y += tN * 1.05;
  }
  y += tF * 0.6;
  for (const r of rF) {
    renglones.push({ texto: r, fuente: fF(tF), tam: tF, y, inclina: inclina * 0.6 });
    y += tF * 1.12;
  }
  for (const r of renglones) {
    gE.font = r.fuente;
    r.ancho = gE.measureText(r.texto).width;
    r.x0 = (A * S - r.ancho) / 2 + azar(-6, 6) * S;
  }
  return renglones;
}

function escribirLugar(i) {
  actual = i;
  escritura = { renglones: componer(i), i: 0, x: 0, t: 0, pausa: 0 };
  secado = 1;
  gE.clearRect(0, 0, escrito.width, escrito.height);
  gB.clearRect(0, 0, bordes.width, bordes.height);
  visto.add(i);
  pintarPuntos();
  elUi.classList.remove("is-inicio");
  elPista.classList.add("is-fuera");
  empezarRoce();
}

/* Avanza el dedo invisible y destapa el pedacito nuevo de letra. */
function escribirPaso(dt) {
  const e = escritura;
  if (!e) return;
  if (e.pausa > 0) { e.pausa -= dt; moverRoce(0, 0); return; }
  const r = e.renglones[e.i];
  if (!r) {
    escritura = null;
    pararRoce();
    soltarGotasDeLetras();
    setTimeout(() => {
      if (!escritura) {
        elPista.textContent = actual < LUGARES.length - 1 ? "toca el cristal para el siguiente" : "toca el cristal para volver a empezar";
        elPista.classList.remove("is-fuera");
      }
    }, 2200);
    return;
  }
  // La velocidad del dedo cambia un poco, como la de una mano de verdad.
  const vel = r.tam * (7.5 + Math.sin(e.t * 9) * 2.5) * (r.nombre ? 0.85 : 1);
  e.t += dt;
  const antes = e.x;
  e.x = Math.min(r.ancho, e.x + vel * dt);
  moverRoce(0.6 + Math.sin(e.t * 23) * 0.4, (e.x / r.ancho) * 0.6 + Math.sin(e.t * 13) * 0.2);
  for (const [ctx, modo] of [[gE, "rellena"], [gB, "filo"]]) {
    ctx.save();
    ctx.translate(A * S / 2, r.y);
    ctx.rotate(r.inclina);
    ctx.translate(-A * S / 2, -r.y);
    ctx.beginPath();
    ctx.rect(r.x0 + antes - 1, r.y - r.tam * 1.2, e.x - antes + 2, r.tam * 1.9);
    ctx.clip();
    ctx.font = r.fuente;
    ctx.textBaseline = "alphabetic";
    if (modo === "rellena") {
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = r.tam * 0.07;
      ctx.lineJoin = "round";
      ctx.fillText(r.texto, r.x0, r.y);
      ctx.strokeText(r.texto, r.x0, r.y);
    } else {
      ctx.strokeStyle = "rgba(255,255,255,.9)";
      ctx.lineWidth = Math.max(0.8, r.tam * 0.05);
      ctx.strokeText(r.texto, r.x0, r.y);
    }
    ctx.restore();
  }
  // La punta del dedo, para dibujar su brillito.
  const k = r.inclina, dx = r.x0 + e.x - A * S / 2, dy = -r.tam * 0.3;
  const px = A * S / 2 + dx * Math.cos(k) - dy * Math.sin(k);
  const py = r.y + dx * Math.sin(k) + dy * Math.cos(k);
  e.punta = [px / S, py / S];
  if (e.x >= r.ancho) { e.i++; e.x = 0; e.pausa = r.nombre ? 0.45 : 0.22; }
}

/* Cuando la letra está recién hecha, el agua se junta abajo y escurre. */
function soltarGotasDeLetras() {
  const datos = gE.getImageData(0, 0, escrito.width, escrito.height).data;
  const w = escrito.width;
  let n = 0;
  for (let intento = 0; intento < 400 && n < 4; intento++) {
    const x = Math.floor(Math.random() * w);
    for (let y = escrito.height - 1; y > 0; y--) {
      if (datos[(y * w + x) * 4 + 3] > 200) {
        if (y > escrito.height * 0.2) {
          gotas.push({ x: x / S, y: y / S + 1, v: 0, r: azar(1.2, 2), corre: azar(0.3, 1.2), rastro: true, deLetra: true });
          n++;
        }
        break;
      }
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LAS GOTAS DEL CRISTAL Y LA LLUVIA DE FUERA
   ══════════════════════════════════════════════════════════════════════ */
const gotas = [];
const lluvia = [];

function sembrar() {
  lluvia.length = 0;
  for (let i = 0; i < 90; i++) lluvia.push({ x: Math.random() * A, y: Math.random() * H, v: azar(500, 900), l: azar(8, 20) });
  gotas.length = 0;
  for (let i = 0; i < 40; i++) gotas.push({ x: Math.random() * A, y: Math.random() * H, v: 0, r: azar(0.8, 2.6), corre: 0, rastro: false });
}

/* ══════════════════════════════════════════════════════════════════════
   EL DEDO DE VERDAD: toca, limpia, empaña
   ══════════════════════════════════════════════════════════════════════ */
let dedo = null;
mundo.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button")) return;
  despertar();
  const r = mundo.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  dedo = { id: e.pointerId, x, y, x0: x, y0: y, t0: performance.now(), movido: false, quieto: 0 };
  try { mundo.setPointerCapture(e.pointerId); } catch { /* nada */ }
});
mundo.addEventListener("pointermove", (e) => {
  if (!dedo || e.pointerId !== dedo.id) return;
  const r = mundo.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (!dedo.movido && Math.hypot(x - dedo.x0, y - dedo.y0) > 10) dedo.movido = true;
  if (dedo.movido) {
    limpiar(dedo.x, dedo.y, x, y);
    const vel = Math.hypot(x - dedo.x, y - dedo.y);
    empezarRoce();
    moverRoce(clamp(vel / 18, 0, 1) * 0.8, clamp(vel / 30, 0, 1));
    dedo.quieto = 0;
  }
  dedo.x = x; dedo.y = y;
});
function soltar(e) {
  if (!dedo || e.pointerId !== dedo.id) return;
  const d = dedo;
  dedo = null;
  if (!escritura) pararRoce();
  if (!d.movido && performance.now() - d.t0 < 450) siguiente();
}
mundo.addEventListener("pointerup", soltar);
mundo.addEventListener("pointercancel", soltar);

function limpiar(x0, y0, x1, y1) {
  const radio = Math.min(A, H) * 0.06 * S;
  gV.save();
  gV.globalCompositeOperation = "destination-out";
  gV.lineCap = "round";
  gV.strokeStyle = "rgba(0,0,0,.9)";
  gV.lineWidth = radio * 2;
  gV.beginPath();
  gV.moveTo(x0 * S, y0 * S);
  gV.lineTo(x1 * S, y1 * S);
  gV.stroke();
  gV.restore();
  // Al limpiar se juntan gotitas en el borde de abajo del trazo.
  if (Math.random() < 0.12) gotas.push({ x: x1 + azar(-radio, radio) / S, y: y1 + radio / S, v: 0, r: azar(1.2, 2.6), corre: azar(0.4, 1.4), rastro: true });
}

function siguiente() {
  if (escritura || cambiando > 0) return;
  const prox = (actual + 1) % LUGARES.length;
  if (actual < 0) escribirLugar(prox);
  else irA(prox);
}
function irA(i) {
  if (escritura || cambiando > 0) return;
  // Antes de escribir lo siguiente, se empaña otra vez: como quien echa
  // el aliento sobre el cristal para tener dónde escribir.
  cambiando = 1;
  aliento = 1;
  setTimeout(() => { cambiando = 0; escribirLugar(i); }, 1100);
}

function pintarPuntos() {
  elPuntos.replaceChildren();
  LUGARES.forEach(([nombre], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-label", nombre);
    b.className = (i === actual ? "is-actual " : "") + (visto.has(i) ? "is-visto" : "");
    b.addEventListener("click", () => { despertar(); if (i !== actual) irA(i); });
    elPuntos.append(b);
  });
}

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */
let t0 = performance.now(), reloj = 0, aliento = 0;

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A) return;
  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
  reloj += dt;

  /* ---- El vaho vuelve solo, y más rápido cuando se echa el aliento ---- */
  const vuelve = 0.018 + aliento * 2.2;
  gV.globalCompositeOperation = "source-over";
  gV.fillStyle = `rgba(255,255,255,${Math.min(1, vuelve * dt)})`;
  gV.fillRect(0, 0, vaho.width, vaho.height);
  aliento = Math.max(0, aliento - dt * 0.9);
  // Dedo quieto un rato: se empaña alrededor, como con el aliento.
  if (dedo && !dedo.movido && performance.now() - dedo.t0 > 500) {
    const r = Math.min(A, H) * 0.1 * S;
    const gr = gV.createRadialGradient(dedo.x * S, dedo.y * S, 0, dedo.x * S, dedo.y * S, r);
    gr.addColorStop(0, `rgba(255,255,255,${dt * 2})`);
    gr.addColorStop(1, "rgba(255,255,255,0)");
    gV.fillStyle = gr;
    gV.fillRect(dedo.x * S - r, dedo.y * S - r, r * 2, r * 2);
  }

  /* ---- Lo escrito se va secando: primero aguanta, luego se empaña ---- */
  escribirPaso(dt);
  if (!escritura) secado = Math.max(0, secado - dt * (cambiando > 0 ? 1.4 : 0.022));

  /* ---- La ciudad detrás del cristal ---- */
  g.drawImage(fondo, 0, 0, A, H);
  g.globalCompositeOperation = "lighter";
  for (const l of luces) {
    const b = 0.5 + 0.5 * Math.sin(reloj * 0.8 + l.f);
    if (b < 0.7) continue;
    g.globalAlpha = (b - 0.7) * 0.5;
    g.fillStyle = `rgb(${l.col})`;
    g.beginPath(); g.arc(l.x, l.y, l.r * 0.3, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  g.globalCompositeOperation = "source-over";
  // La lluvia de fuera, fina.
  g.strokeStyle = "rgba(190,205,235,.28)";
  g.lineWidth = 1;
  g.beginPath();
  for (const l of lluvia) {
    l.y += l.v * dt;
    l.x -= l.v * 0.12 * dt;
    if (l.y > H) { l.y = -20; l.x = Math.random() * A * 1.1; }
    g.moveTo(l.x, l.y);
    g.lineTo(l.x + l.l * 0.12, l.y - l.l);
  }
  g.stroke();

  /* ---- El vaho encima: borroso, menos donde se limpió o se escribió ---- */
  gM.globalCompositeOperation = "source-over";
  gM.clearRect(0, 0, mezcla.width, mezcla.height);
  gM.drawImage(borroso, 0, 0);
  gM.globalCompositeOperation = "destination-in";
  gM.imageSmoothingEnabled = true;
  gM.drawImage(vaho, 0, 0, mezcla.width, mezcla.height);
  if (secado > 0) {
    gM.globalCompositeOperation = "destination-out";
    gM.globalAlpha = Math.min(1, secado * 1.15);
    gM.drawImage(escrito, 0, 0, mezcla.width, mezcla.height);
    gM.globalAlpha = 1;
  }
  gM.globalCompositeOperation = "source-over";
  g.drawImage(mezcla, 0, 0, A, H);

  // Por donde pasó el dedo el cristal queda más oscuro que el vaho: así
  // se lee de verdad, como en una ventana empañada.
  if (secado > 0) {
    gT.globalCompositeOperation = "source-over";
    gT.clearRect(0, 0, tinta.width, tinta.height);
    gT.drawImage(escrito, 0, 0);
    gT.globalCompositeOperation = "source-in";
    gT.fillStyle = "#070a16";
    gT.fillRect(0, 0, tinta.width, tinta.height);
    g.globalAlpha = Math.min(1, secado * 1.15) * 0.42;
    g.drawImage(tinta, 0, 0, A, H);
    g.globalAlpha = 1;
  }
  // El filo mojado de las letras, que brilla un poquito.
  if (secado > 0) {
    g.globalCompositeOperation = "lighter";
    g.globalAlpha = secado * 0.2;
    g.drawImage(bordes, 0, 0, A, H);
    g.globalAlpha = 1;
    g.globalCompositeOperation = "source-over";
  }
  // La punta del dedo invisible.
  if (escritura && escritura.punta) {
    const [px, py] = escritura.punta;
    const gr = g.createRadialGradient(px, py, 0, px, py, 16);
    gr.addColorStop(0, "rgba(255,255,255,.35)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr;
    g.fillRect(px - 16, py - 16, 32, 32);
  }

  /* ---- Las gotas del cristal ---- */
  if (Math.random() < dt * 1.6) gotas.push({ x: Math.random() * A, y: Math.random() * H * 0.9, v: 0, r: azar(0.8, 2.2), corre: Math.random() < 0.1 ? azar(0.3, 1) : 0, rastro: false });
  for (let i = gotas.length - 1; i >= 0; i--) {
    const d = gotas[i];
    if (d.corre > 0) {
      // Escurren a trompicones: se paran, siguen, se paran.
      d.v += (Math.random() < 0.04 ? -d.v : 60) * dt * d.corre;
      d.v = clamp(d.v, 0, 160);
      const antes = d.y;
      d.y += d.v * dt;
      d.x += Math.sin(d.y * 0.08) * 0.2;
      if (d.rastro) {
        gV.save();
        gV.globalCompositeOperation = "destination-out";
        gV.strokeStyle = "rgba(0,0,0,.85)";
        gV.lineWidth = d.r * 1.1 * S;
        gV.beginPath(); gV.moveTo(d.x * S, antes * S); gV.lineTo(d.x * S, d.y * S); gV.stroke();
        gV.restore();
      }
      if (d.deLetra && Math.random() < dt * 0.3) gotita();
    }
    if (d.y > H + 10 || gotas.length > 160) { gotas.splice(i, 1); continue; }
    g.fillStyle = "rgba(10,12,24,.45)";
    g.beginPath(); g.arc(d.x + 0.4, d.y + 0.6, d.r, 0, TAU); g.fill();
    g.fillStyle = "rgba(235,240,255,.55)";
    g.beginPath(); g.arc(d.x - d.r * 0.3, d.y - d.r * 0.35, d.r * 0.45, 0, TAU); g.fill();
  }

  /* ---- La luz cálida de dentro de casa, en el cristal ---- */
  const calor = g.createRadialGradient(A * 0.15, H * 1.05, 0, A * 0.15, H * 1.05, H * 0.8);
  calor.addColorStop(0, "rgba(255,170,110,.18)");
  calor.addColorStop(1, "rgba(255,170,110,0)");
  g.fillStyle = calor;
  g.fillRect(0, 0, A, H);
}

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const primera = !A;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  pintarCiudad();
  prepararVaho();
  if (primera) sembrar();
  // Si ya había algo escrito, se vuelve a escribir entero con la medida nueva.
  if (actual >= 0) {
    escritura = { renglones: componer(actual), i: 0, x: 0, t: 0, pausa: 0 };
    for (let k = 0; k < 400 && escritura; k++) escribirPaso(100);
    pararRoce();
  }
}
new ResizeObserver(() => requestAnimationFrame(medir)).observe(mundo);
medir();
pintarPuntos();
try { document.fonts && document.fonts.load('700 40px "Caveat"'); } catch { /* sin fuentes */ }
requestAnimationFrame(paso);
})();
</script>
