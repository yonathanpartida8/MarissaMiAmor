<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>El tocadiscos</title>

<style>
/* ══════════════════════════════════════════════════════════════════════
   Todo dentro de .disco-mundo, con prefijo `ds-` en cada clase.
   ══════════════════════════════════════════════════════════════════════ */

html, body { margin: 0; height: 100%; }

.disco-mundo {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  contain: layout paint;
  background:
    radial-gradient(ellipse 110% 66% at 50% 8%, #2e2620, transparent 60%),
    linear-gradient(174deg, #211b16 0%, #17120f 58%, #0e0b09 100%);
  color: #e4d8c4;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;

  --seguro-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seguro-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --e-suave: cubic-bezier(0.22, 1, 0.36, 1);
}

.disco-mundo .ds-lienzo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  /* Los toques los recoge `.ds-toque`, que va justo encima. */
  pointer-events: none;
}

/* El plato entero. El libro sólo se queda el barrido que empieza en sus
   24-44 px de borde. */
.disco-mundo .ds-toque {
  position: absolute;
  inset: 0;
  touch-action: none;
  z-index: 2;
  cursor: grab;
}
.disco-mundo.is-rascando .ds-toque { cursor: grabbing; }

.disco-mundo .ds-ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
  padding:
    calc(var(--seguro-t) + 18px) 22px
    calc(var(--seguro-b) + var(--barra) + 14px) 22px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.disco-mundo .ds-cancion {
  margin: 0;
  font-family: var(--tipo-titulo, Georgia, serif);
  font-size: clamp(1rem, 4.6vw, 1.42rem);
  font-weight: 500;
  letter-spacing: 0.04em;
  color: #f0dfc2;
  transition: opacity 600ms var(--e-suave);
}
.disco-mundo .ds-cancion small {
  display: block;
  margin-top: 0.3em;
  font-family: var(--tipo, inherit);
  font-size: 0.5em;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0.5;
}

.disco-mundo .ds-pie {
  margin: 0;
  min-height: 3.8em;
  max-width: 23em;
  font-size: clamp(0.82rem, 3.4vw, 0.97rem);
  line-height: 1.55;
  color: #e6dac6;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 640ms var(--e-suave), transform 640ms var(--e-suave);
  text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
}
.disco-mundo .ds-pie.is-visible { opacity: 0.94; transform: none; }
.disco-mundo .ds-pie em {
  display: block;
  margin-top: 0.3em;
  font-family: var(--tipo-mano, "Segoe Script", cursive);
  font-size: 1.16em;
  font-style: normal;
  color: #e8a05c;
}

@media (prefers-reduced-motion: reduce) {
  .disco-mundo * { transition-duration: 1ms !important; }
}
</style>
</head>
<body>

<div class="disco-mundo" id="mundo">
  <canvas class="ds-lienzo" id="lienzo"></canvas>
  <div class="ds-toque" id="toque" aria-hidden="true"></div>
  <div class="ds-ui">
    <p class="ds-cancion" id="cancion" aria-live="polite">—<small>baja la aguja</small></p>
    <p class="ds-pie" id="pie" role="status" aria-live="polite"></p>
  </div>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   CONFIGURACIÓN EDITABLE
   ══════════════════════════════════════════════════════════════════════ */

const CONF = {

  /* ---- LA ETIQUETA DEL CENTRO ----------------------------------------- */
  sello: "y.m",
  sub: "grabaciones",

  /* ---- LAS CANCIONES --------------------------------------------------
     El disco tiene surcos: cada uno es una canción. Se elige bajando la
     aguja más cerca o más lejos del centro, como en uno de verdad.

     `desde` y `hasta` son la parte del radio que ocupa (0 el centro, 1 el
     canto). `notas` es la melodía: nombre de nota y duración en negras.
     Una `s` detrás de la letra es sostenido.                           */
  canciones: [
    {
      titulo: "La que sonaba",
      lado: "cara a · surco 1",
      texto: "La que sonaba en el coche aquella noche.",
      firma: "Ni te acuerdas, y yo sí.",
      desde: 0.86, hasta: 0.98, compas: 96,
      notas: [["E4",1],["G4",0.5],["A4",1.5],["G4",0.5],["E4",1],["D4",1],["E4",2]],
    },
    {
      titulo: "Domingo por la tarde",
      lado: "cara a · surco 2",
      texto: "Ésta es de estar tirados sin hacer nada.",
      firma: "Mi favorita, ya lo sabes.",
      desde: 0.72, hasta: 0.85, compas: 76,
      notas: [["C4",1.5],["E4",0.5],["G4",1],["F4",1],["E4",1.5],["D4",0.5],["C4",2]],
    },
    {
      titulo: "Lo que no te dije",
      lado: "cara b · surco 1",
      texto: "Ésta la puse muchas veces sin decirte nada.",
      firma: "Ahora ya lo sabes.",
      desde: 0.58, hasta: 0.71, compas: 66,
      notas: [["A3",1],["C4",1],["E4",1.5],["D4",0.5],["C4",1],["B3",1],["A3",2.5]],
    },
    {
      titulo: "Y luego tú",
      lado: "cara b · surco 2",
      texto: "Y en medio de todo aquello, apareciste.",
      firma: "Y se acabó el disco anterior.",
      desde: 0.44, hasta: 0.57, compas: 108,
      notas: [["G4",0.5],["A4",0.5],["B4",1],["D5",1],["B4",0.5],["A4",0.5],["G4",1.5],["D4",1]],
    },
  ],

  /* ---- EL PLATO -------------------------------------------------------- */
  rpm: 33.3,
  surcos: 90,        // cuántas rayitas de surco se dibujan
};

/* ══════════════════════════════════════════════════════════════════════
   La maquinaria.
   ══════════════════════════════════════════════════════════════════════ */

const mundo  = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const zona   = document.getElementById("toque");
const elPie  = document.getElementById("pie");
const elCanc = document.getElementById("cancion");
const ctx    = lienzo.getContext("2d", { alpha: false });

const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
const azar  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const damp  = (act, obj, k, dt) => obj + (act - obj) * Math.exp(-k * dt);

let A = 0, H = 0, dpr = 1;
let cx = 0, cy = 0, R = 0;
/* El eje del brazo: a la derecha y un poco por encima del plato. */
let bx = 0, by = 0, bl = 0;

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width  = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R = Math.min(A * 0.37, H * 0.25);
  cx = A * 0.44;
  cy = H * 0.46;
  bx = cx + R * 1.16;
  by = cy - R * 0.86;
  bl = R * 1.42;
}
new ResizeObserver(medir).observe(mundo);

/* ---- El disco ------------------------------------------------------------- */

let giro = 0;            // radianes
let velocidad = 0;       // rad/s
let objetivo = 0;
let sonando = -1;        // qué canción
let aguja = 0;           // dónde está la punta, en parte del radio (0..1)
let agujaObj = 1.12;     // fuera del disco
let bajada = false;

/* ---- El brazo -------------------------------------------------------------- */

function enPantalla(e) {
  const r = mundo.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

let modo = null;   // "aguja" o "rascar"

zona.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  zona.setPointerCapture(e.pointerId);
  const p = enPantalla(e);
  const d = Math.hypot(p.x - cx, p.y - cy);
  despertar();
  if (d < R * 1.06) {
    /* Encima del disco: se baja la aguja ahí, y si ya está bajada, se
       rasca. Que es lo que se hace con un disco. */
    if (!bajada) { bajarAguja(d / R); modo = "aguja"; }
    else { modo = "rascar"; rascando = { ang: Math.atan2(p.y - cy, p.x - cx), v: 0 }; mundo.classList.add("is-rascando"); }
  } else {
    /* Fuera del disco: se levanta. */
    levantarAguja();
    modo = null;
  }
});

let rascando = null;

zona.addEventListener("pointermove", (e) => {
  const p = enPantalla(e);
  if (modo === "aguja") {
    const d = Math.hypot(p.x - cx, p.y - cy);
    bajarAguja(clamp(d / R, 0.4, 1.02), true);
  } else if (modo === "rascar" && rascando) {
    const a = Math.atan2(p.y - cy, p.x - cx);
    let dd = a - rascando.ang;
    while (dd > Math.PI) dd -= Math.PI * 2;
    while (dd < -Math.PI) dd += Math.PI * 2;
    rascando.ang = a;
    rascando.v = dd;
    giro += dd;
    /* Rascar cambia el tono de lo que suena, como en un disco de verdad:
       el surco pasa más deprisa o más despacio por la aguja. */
    if (fuenteActual) {
      const k = clamp(1 + dd * 9, 0.25, 3.4);
      try { fuenteActual.playbackRate.setTargetAtTime(k, audio.currentTime, 0.02); } catch { /* nada */ }
    }
    rascadas++;
    mirarSecretos();
  }
});

function soltar() {
  if (modo === "rascar" && fuenteActual) {
    try { fuenteActual.playbackRate.setTargetAtTime(1, audio.currentTime, 0.12); } catch { /* nada */ }
  }
  modo = null;
  rascando = null;
  mundo.classList.remove("is-rascando");
}
zona.addEventListener("pointerup", soltar);
zona.addEventListener("pointercancel", soltar);

function cancionEn(r) {
  for (let i = 0; i < CONF.canciones.length; i++) {
    const c = CONF.canciones[i];
    if (r >= c.desde && r <= c.hasta) return i;
  }
  return -1;
}

function bajarAguja(r, arrastrando) {
  agujaObj = r;
  bajada = true;
  objetivo = (CONF.rpm / 60) * Math.PI * 2;
  const i = cancionEn(r);
  if (i === sonando) return;
  sonando = i;
  pararCancion();
  if (i < 0) {
    elCanc.textContent = "";
    elCanc.append(document.createTextNode("entre surcos"));
    const s = document.createElement("small");
    s.textContent = "mueve la aguja";
    elCanc.append(s);
    decir("Ahí no hay nada grabado.", "Sólo el ruido del vinilo.");
    return;
  }
  const c = CONF.canciones[i];
  elCanc.textContent = "";
  elCanc.append(document.createTextNode(c.titulo));
  const s = document.createElement("small");
  s.textContent = c.lado;
  elCanc.append(s);
  decir(c.texto, c.firma, true);
  tocarCancion(c);
  oidas.add(i);
  mirarSecretos();
  if (!arrastrando) ploc();
}

function levantarAguja() {
  if (!bajada) return;
  bajada = false;
  agujaObj = 1.12;
  objetivo = 0;
  sonando = -1;
  pararCancion();
  elCanc.textContent = "";
  elCanc.append(document.createTextNode("—"));
  const s = document.createElement("small");
  s.textContent = "baja la aguja";
  elCanc.append(s);
  decir("Levantada.", "Vuelve a bajarla donde quieras.");
}

/* ---- Los textos ----------------------------------------------------------- */

let pidiendo = null;
let bloqueado = 0;

function decir(texto, firma, importante) {
  const ahora = performance.now();
  if (!importante && ahora < bloqueado) return;
  if (pidiendo === texto) return;
  pidiendo = texto;
  if (importante) bloqueado = ahora + 3600;
  elPie.classList.remove("is-visible");
  setTimeout(() => {
    elPie.textContent = texto;
    if (firma) {
      const em = document.createElement("em");
      em.textContent = firma;
      elPie.append(em);
    }
    elPie.classList.add("is-visible");
  }, suave ? 10 : 280);
}

/* ---- Sonido ---------------------------------------------------------------- */

const SEMI = { C:0, Cs:1, D:2, Ds:3, E:4, F:5, Fs:6, G:7, Gs:8, A:9, As:10, B:11 };
function hz(n) {
  const m = /^([A-G]s?)(-?\d)$/.exec(n);
  if (!m) return 440;
  const k = SEMI[m[1]] + (Number(m[2]) + 1) * 12;
  return 440 * Math.pow(2, (k - 69) / 12);
}

let audio = null, maestro = null;
let ruidoNodo = null, ruidoGain = null;
let fuenteActual = null;

function despertar() {
  try {
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      maestro = audio.createGain();
      maestro.gain.value = 0.55;
      maestro.connect(audio.destination);
      arrancarRuido();
    }
    if (audio.state === "suspended") audio.resume();
  } catch { audio = null; }
  return audio;
}

/** El ruido del vinilo: soplido grave con chasquidos, en bucle. */
function arrancarRuido() {
  const seg = 3;
  const n = audio.sampleRate * seg;
  const buf = audio.createBuffer(1, n, audio.sampleRate);
  const d = buf.getChannelData(0);
  let ult = 0;
  for (let i = 0; i < n; i++) {
    const blanco = Math.random() * 2 - 1;
    ult = 0.96 * ult + 0.04 * blanco;
    d[i] = ult * 3;
  }
  /* Y los chasquidos: unos cuantos picos sueltos repartidos por el
     bucle. Es lo que hace que suene a vinilo y no a radio. */
  for (let k = 0; k < 42; k++) {
    const i = Math.floor(Math.random() * (n - 200));
    const fuerza = azar(0.25, 0.9);
    for (let j = 0; j < 90; j++) d[i + j] += (Math.random() * 2 - 1) * fuerza * Math.pow(1 - j / 90, 3);
  }
  ruidoNodo = audio.createBufferSource();
  ruidoNodo.buffer = buf;
  ruidoNodo.loop = true;
  const f = audio.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.value = 5200;
  ruidoGain = audio.createGain();
  ruidoGain.gain.value = 0;
  ruidoNodo.connect(f).connect(ruidoGain).connect(maestro);
  ruidoNodo.start();
}

let relojCancion = null;

/** Toca una melodía entera y la deja sonando en bucle. */
function tocarCancion(c) {
  if (!despertar()) return;
  /* Se renderiza la melodía a un buffer y se toca como una sola fuente:
     así rascar puede cambiar el `playbackRate` de TODO a la vez, que es
     justo lo que hace la mano en un plato. Con notas sueltas no habría
     manera de retorcerlas juntas. */
  const negra = 60 / c.compas;
  let total = 0;
  for (const [, dur] of c.notas) total += dur * negra;
  total += 0.6;

  const sr = audio.sampleRate;
  const buf = audio.createBuffer(1, Math.ceil(sr * total), sr);
  const d = buf.getChannelData(0);

  let t = 0.05;
  for (const [nota, dur] of c.notas) {
    const f = hz(nota);
    const largo = dur * negra;
    const i0 = Math.floor(t * sr);
    const n = Math.floor(largo * sr);
    for (let i = 0; i < n; i++) {
      const k = i / n;
      /* Envolvente de cuerda pulsada: sube rápido y cae despacio. */
      const env = Math.min(1, k * 40) * Math.pow(1 - k, 1.5);
      const fase = (i0 + i) / sr * f * 6.283;
      /* Fundamental más dos armónicos suaves: suena a instrumento sin
         llegar a sonar a sintetizador. */
      d[i0 + i] += (Math.sin(fase) + Math.sin(fase * 2) * 0.28
                 + Math.sin(fase * 3) * 0.12) * env * 0.22;
    }
    t += largo;
  }

  pararCancion();
  const src = audio.createBufferSource();
  src.buffer = buf;
  src.loop = true;
  const filtro = audio.createBiquadFilter();
  /* Un pasa-bajos suave: el vinilo se come los agudos, y por eso suena
     caliente. */
  filtro.type = "lowpass";
  filtro.frequency.value = 3400;
  const g = audio.createGain();
  g.gain.value = 0.85;
  src.connect(filtro).connect(g).connect(maestro);
  src.start();
  fuenteActual = src;
}

function pararCancion() {
  if (!fuenteActual) return;
  try { fuenteActual.stop(); } catch { /* ya estaba */ }
  fuenteActual = null;
}

/** El golpe de la aguja al posarse. */
function ploc() {
  if (!despertar()) return;
  const t = audio.currentTime;
  const n = Math.floor(audio.sampleRate * 0.05);
  const buf = audio.createBuffer(1, n, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = audio.createBufferSource();
  src.buffer = buf;
  const g = audio.createGain();
  g.gain.value = 0.3;
  src.connect(g).connect(maestro);
  src.start(t);
}

function campana(hzz) {
  if (!despertar()) return;
  const t = audio.currentTime;
  const o = audio.createOscillator();
  const g = audio.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(hzz, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.08, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
  o.connect(g).connect(maestro);
  o.start(t); o.stop(t + 1.5);
}

/* ══════════════════════════════════════════════════════════════════════
   LOS SECRETOS
   ══════════════════════════════════════════════════════════════════════ */

/* 1. Oír los cuatro surcos: aparece un quinto, escondidísimo, pegado a
      la etiqueta. Es el que no estaba en la funda.                    */
const oidas = new Set();
let elQuinto = false;

/* 2. Rascar mucho: se raya el disco y a partir de ahí salta siempre en
      el mismo sitio, con su clac.                                     */
let rascadas = 0;
let rayado = 0;
let saltoReloj = 0;

/* 3. Dejarlo sonando sin tocar nada tres minutos: al acabar la cara se
      levanta el brazo solo, como hacen los buenos.                    */
let solo = 0;

function mirarSecretos() {
  if (oidas.size >= CONF.canciones.length && !elQuinto) {
    elQuinto = true;
    CONF.canciones.push({
      titulo: "Sin título",
      lado: "surco escondido",
      texto: "Éste no está en la funda. No tiene nombre.",
      firma: `Lo grabé yo. Firmado ${CONF.sello}, muy pequeñito.`,
      desde: 0.30, hasta: 0.42, compas: 58,
      notas: [["C4",2],["E4",1],["G4",1],["C5",3],["B4",1],["G4",2]],
    });
    setTimeout(() => {
      decir("Queda sitio entre el último surco y la etiqueta.", "Baja ahí la aguja.", true);
      campana(880);
    }, 2600);
  }

  if (rascadas > 240 && rayado <= 0) {
    rayado = 1;
    decir("Lo has rayado.", "Da igual. Los discos rayados son los que más se han querido.", true);
    campana(330);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */

let t0 = performance.now();
let reloj = 0;

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A || !H) return;

  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.5) dt = 1 / 60;
  else if (dt > 0.1) dt = 0.1;
  reloj += dt;

  /* El plato tiene inercia: arranca despacio y se para despacio. Eso es
     media personalidad de un tocadiscos. */
  velocidad = damp(velocidad, objetivo, 1.4, dt);
  if (!rascando) giro += velocidad * dt;
  aguja = damp(aguja, agujaObj, 5, dt);

  if (ruidoGain) {
    /* El ruido del vinilo sólo se oye con la aguja puesta, y sube un
       poquito cuando está rayado. */
    const v = bajada ? 0.035 + rayado * 0.02 : 0;
    ruidoGain.gain.setTargetAtTime(v, audio.currentTime, 0.1);
  }

  /* El salto del disco rayado. */
  if (rayado > 0 && bajada && sonando >= 0) {
    saltoReloj -= dt;
    if (saltoReloj <= 0) {
      saltoReloj = azar(2.2, 4.4);
      ploc();
      if (fuenteActual) {
        try { fuenteActual.playbackRate.setValueAtTime(1.6, audio.currentTime);
              fuenteActual.playbackRate.setTargetAtTime(1, audio.currentTime + 0.06, 0.04); } catch { /* nada */ }
      }
    }
  }

  /* El secreto de dejarlo sonar. */
  solo = (bajada && !modo) ? solo + dt : 0;
  if (solo > 150 && bajada) {
    solo = 0;
    levantarAguja();
    decir("Se ha acabado la cara.", "El brazo se levanta solo. Para eso lo pagué.", true);
  }

  dibujar(dt);
}

function dibujar(dt) {
  /* --- el mueble --- */
  ctx.fillStyle = "#17120f";
  ctx.fillRect(0, 0, A, H);
  const g = ctx.createLinearGradient(0, cy - R * 1.6, 0, cy + R * 1.8);
  g.addColorStop(0, "#4e3a28");
  g.addColorStop(0.45, "#3a2a1d");
  g.addColorStop(1, "#241a12");
  ctx.fillStyle = g;
  const mx = cx - R * 1.5, my = cy - R * 1.5;
  const mw = R * 3.0, mh = R * 3.0;
  redondo(mx, my, mw, mh, R * 0.1);
  ctx.fill();
  /* La veta del mueble. */
  ctx.globalAlpha = 0.14;
  ctx.strokeStyle = "#8f6a44";
  ctx.lineWidth = 1;
  for (let i = 0; i < 22; i++) {
    const y = my + (i / 22) * mh;
    ctx.beginPath();
    ctx.moveTo(mx, y);
    ctx.bezierCurveTo(mx + mw * 0.3, y + 3, mx + mw * 0.7, y - 3, mx + mw, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* --- el fieltro del plato --- */
  ctx.fillStyle = "#2a2018";
  ctx.beginPath(); ctx.arc(cx, cy, R * 1.06, 0, 6.283); ctx.fill();

  /* --- el disco --- */
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(giro);

  ctx.fillStyle = "#13100e";
  ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.fill();

  /* Los surcos. Se dibujan como anillos y con una franja brillante que
     gira: es el reflejo del vinilo, y sin él parece un cartón negro. */
  for (let i = 0; i < CONF.surcos; i++) {
    const t = i / CONF.surcos;
    const rr = R * (0.3 + t * 0.68);
    /* Los bordes de cada canción se marcan un poco más: son los huecos
       por donde se baja la aguja. */
    let borde = false;
    for (const c of CONF.canciones) {
      if (Math.abs(rr / R - c.desde) < 0.008 || Math.abs(rr / R - c.hasta) < 0.008) borde = true;
    }
    ctx.strokeStyle = borde ? "rgba(150, 130, 110, 0.4)" : `rgba(90, 80, 72, ${0.1 + (i % 3) * 0.035})`;
    ctx.lineWidth = borde ? 1.4 : 0.8;
    ctx.beginPath(); ctx.arc(0, 0, rr, 0, 6.283); ctx.stroke();
  }

  /* El brillo: dos cuñas opuestas. */
  for (const a of [0, Math.PI]) {
    const gl = ctx.createRadialGradient(0, 0, R * 0.3, 0, 0, R);
    gl.addColorStop(0, "rgba(255, 228, 190, 0)");
    gl.addColorStop(0.6, "rgba(255, 228, 190, 0.09)");
    gl.addColorStop(1, "rgba(255, 228, 190, 0)");
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R, a - 0.42, a + 0.42);
    ctx.closePath();
    ctx.fill();
  }

  /* La raya del secreto 2. */
  if (rayado > 0) {
    ctx.strokeStyle = "rgba(210, 200, 190, 0.4)";
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(R * 0.34, -R * 0.1);
    ctx.lineTo(R * 0.92, R * 0.06);
    ctx.stroke();
  }

  /* --- la etiqueta, con las iniciales --- */
  const er = R * 0.29;
  const eg = ctx.createRadialGradient(-er * 0.3, -er * 0.35, er * 0.1, 0, 0, er);
  eg.addColorStop(0, "#e8b878");
  eg.addColorStop(0.55, "#c98a48");
  eg.addColorStop(1, "#8f5c28");
  ctx.fillStyle = eg;
  ctx.beginPath(); ctx.arc(0, 0, er, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "rgba(60, 34, 12, 0.4)";
  ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, 0, er * 0.86, 0, 6.283); ctx.stroke();

  ctx.fillStyle = "#4e2c10";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = `600 ${Math.round(er * 0.5)}px Georgia, "Times New Roman", serif`;
  ctx.fillText(CONF.sello, 0, -er * 0.12);
  ctx.font = `400 ${Math.round(er * 0.16)}px ui-sans-serif, system-ui, sans-serif`;
  ctx.fillStyle = "rgba(78, 44, 16, 0.75)";
  ctx.fillText(CONF.sub, 0, er * 0.34);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";

  /* El agujero del centro. */
  ctx.fillStyle = "#2a2018";
  ctx.beginPath(); ctx.arc(0, 0, R * 0.026, 0, 6.283); ctx.fill();

  ctx.restore();

  /* --- el eje --- */
  ctx.fillStyle = "#b8a890";
  ctx.beginPath(); ctx.arc(cx, cy, R * 0.022, 0, 6.283); ctx.fill();

  /* --- el brazo --- */
  dibujarBrazo();
}

function dibujarBrazo() {
  /* El ángulo del brazo sale de dónde está la aguja: se resuelve el
     triángulo entre el eje del brazo, el centro del plato y la punta.
     Así el brazo SIEMPRE apunta al surco, sin ajustar nada a mano. */
  const objetivoR = aguja * R;
  const dxc = cx - bx, dyc = cy - by;
  const dc = Math.hypot(dxc, dyc);
  /* Ley del coseno: el ángulo entre la recta al centro y el brazo. */
  const cosA = clamp((bl * bl + dc * dc - objetivoR * objetivoR) / (2 * bl * dc), -1, 1);
  const base = Math.atan2(dyc, dxc);
  const ang = base - Math.acos(cosA);

  const px = bx + Math.cos(ang) * bl;
  const py = by + Math.sin(ang) * bl;

  /* El contrapeso y el eje. */
  ctx.fillStyle = "#3a332c";
  ctx.beginPath(); ctx.arc(bx, by, R * 0.1, 0, 6.283); ctx.fill();
  ctx.fillStyle = "#6b6157";
  ctx.beginPath(); ctx.arc(bx, by, R * 0.07, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "#8f857a";
  ctx.lineWidth = R * 0.05;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(bx - Math.cos(ang) * R * 0.28, by - Math.sin(ang) * R * 0.28);
  ctx.lineTo(px, py);
  ctx.stroke();
  ctx.strokeStyle = "#c2b8aa";
  ctx.lineWidth = R * 0.022;
  ctx.beginPath();
  ctx.moveTo(bx - Math.cos(ang) * R * 0.28, by - Math.sin(ang) * R * 0.28);
  ctx.lineTo(px, py);
  ctx.stroke();
  /* El contrapeso del otro lado. */
  ctx.fillStyle = "#2e2822";
  ctx.beginPath();
  ctx.arc(bx - Math.cos(ang) * R * 0.3, by - Math.sin(ang) * R * 0.3, R * 0.06, 0, 6.283);
  ctx.fill();

  /* La cápsula, torcida como las de verdad. */
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(ang + 0.35);
  ctx.fillStyle = "#4a4038";
  redondo(-R * 0.07, -R * 0.05, R * 0.15, R * 0.1, R * 0.02);
  ctx.fill();
  ctx.fillStyle = bajada ? "#e8b878" : "#8f857a";
  ctx.beginPath();
  ctx.moveTo(R * 0.05, R * 0.04);
  ctx.lineTo(R * 0.08, R * 0.04);
  ctx.lineTo(R * 0.065, R * 0.1);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* Y cuando está bajada, el puntito de luz en el surco. */
  if (bajada && aguja <= 1.02) {
    const gl = ctx.createRadialGradient(px, py, 0, px, py, R * 0.1);
    gl.addColorStop(0, "rgba(255, 210, 150, 0.5)");
    gl.addColorStop(1, "rgba(255, 210, 150, 0)");
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(px, py, R * 0.1, 0, 6.283); ctx.fill();
  }
}

function redondo(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ---- Arranque -------------------------------------------------------------- */

medir();
aguja = agujaObj;
decir("Un disco puesto y sin sonar. Toca donde quieras empezar.");
requestAnimationFrame(paso);

})();
</script>
