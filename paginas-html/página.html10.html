<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>El lago de los deseos</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@500&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   EL LAGO DE LOS DESEOS
   Un lago de noche con la luna encima. Se desliza el dedo y se tira una
   piedra: si va rápida y rasante, rebota; cuando por fin se hunde, del
   agua sube la luz y escribe «Te amo» o «Siempre tuyo». Nada más.
   Todo con prefijo `lg-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #03060d; }
.lg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
}
.lg canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.lg-pista {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--seg-b) + var(--barra) + 18px);
  margin: 0;
  text-align: center;
  pointer-events: none;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-weight: 500;
  font-size: clamp(0.6rem, 2.6vw, 0.72rem);
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(206, 222, 255, 0.6);
  transition: opacity 1.2s ease;
}
.lg-pista.is-fuera { opacity: 0; }
</style>
</head>
<body>
<div class="lg" id="mundo">
  <canvas id="lienzo"></canvas>
  <p class="lg-pista" id="pista">desliza hacia arriba y tira una piedra</p>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE SE PUEDE CAMBIAR
   Las dos únicas frases del lago. Salen una y otra, por turnos.
   ══════════════════════════════════════════════════════════════════════ */
const FRASES = ["Te amo", "Siempre tuyo"];

const mundo = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const g = lienzo.getContext("2d", { alpha: false });
const elPista = document.getElementById("pista");
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;

const TAU = Math.PI * 2;
const azar = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const acercar = (v, o, k, dt) => o + (v - o) * Math.exp(-k * dt);

let A = 0, H = 0, dpr = 1, horizonte = 0, C = 0, F = 0;

/* ══════════════════════════════════════════════════════════════════════
   LA PERSPECTIVA
   El agua es un plano: `x` va de lado a lado (-1..1 en la orilla de
   delante) y `z` es la distancia (1 delante, 14 al fondo). Todo lo que
   pasa en el agua —las ondas, los rebotes, los peces— vive ahí, y sólo al
   pintarlo se pasa a la pantalla. Por eso las ondas de lejos salen
   aplastadas y chiquitas, como en un lago de verdad.
   ══════════════════════════════════════════════════════════════════════ */
const ZMAX = 14;
const aPantalla = (x, z, h = 0) => [A / 2 + x * F / z, horizonte + C / z - h * F / z];
function aAgua(sx, sy) {
  const z = C / Math.max(1, sy - horizonte);
  return [(sx - A / 2) * z / F, clamp(z, 1, ZMAX)];
}

/* ══════════════════════════════════════════════════════════════════════
   LO QUE NO SE MUEVE: cielo, luna, orilla del fondo
   ══════════════════════════════════════════════════════════════════════ */
let cielo = null, orilla = null, luna = { x: 0, y: 0, r: 0 };
const estrellas = [];

function lienzoNuevo(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * dpr));
  c.height = Math.max(1, Math.round(h * dpr));
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [c, x];
}
function pintarFijo() {
  let x;
  [cielo, x] = lienzoNuevo(A, horizonte + 2);
  const gr = x.createLinearGradient(0, 0, 0, horizonte);
  gr.addColorStop(0, "#050a1c");
  gr.addColorStop(0.6, "#0e1a3a");
  gr.addColorStop(1, "#27335a");
  x.fillStyle = gr;
  x.fillRect(0, 0, A, horizonte + 2);
  // La Vía Láctea, apenas.
  for (let i = 0; i < 900; i++) {
    const t = Math.random();
    const px = A * (0.05 + t * 0.95) + azar(-1, 1) * azar(0, 46), py = horizonte * (0.02 + t * 0.6) + azar(-1, 1) * azar(0, 30);
    x.fillStyle = `rgba(205,212,255,${azar(0.012, 0.035)})`;
    x.beginPath(); x.arc(px, py, azar(2, 7), 0, TAU); x.fill();
    if (i % 3 === 0) {
      x.fillStyle = `rgba(235,238,255,${azar(0.2, 0.6)})`;
      x.fillRect(px + azar(-10, 10), py + azar(-8, 8), 0.8, 0.8);
    }
  }
  estrellas.length = 0;
  for (let i = 0; i < A * horizonte / 1500; i++) {
    const s = { x: Math.random() * A, y: Math.pow(Math.random(), 1.3) * horizonte * 0.92, r: azar(0.4, 1.4), f: Math.random() * TAU };
    estrellas.push(s);
  }
  luna = { x: A * 0.7, y: horizonte * 0.34, r: Math.min(A, H) * 0.06 };
  const halo = x.createRadialGradient(luna.x, luna.y, luna.r, luna.x, luna.y, luna.r * 8);
  halo.addColorStop(0, "rgba(255,244,220,.3)");
  halo.addColorStop(1, "rgba(255,244,220,0)");
  x.fillStyle = halo;
  x.fillRect(0, 0, A, horizonte + 2);
  const disco = x.createRadialGradient(luna.x - luna.r * 0.3, luna.y - luna.r * 0.3, 0, luna.x, luna.y, luna.r);
  disco.addColorStop(0, "#fffdf2");
  disco.addColorStop(1, "#e9dfc4");
  x.fillStyle = disco;
  x.beginPath(); x.arc(luna.x, luna.y, luna.r, 0, TAU); x.fill();
  x.fillStyle = "rgba(190,178,150,.28)";
  for (const [dx, dy, rr] of [[-0.3, -0.1, 0.2], [0.25, 0.3, 0.15], [0.12, -0.35, 0.11]]) {
    x.beginPath(); x.arc(luna.x + dx * luna.r, luna.y + dy * luna.r, rr * luna.r, 0, TAU); x.fill();
  }

  // La orilla de enfrente: colinas y árboles.
  const alto = horizonte * 0.26;
  [orilla, x] = lienzoNuevo(A, alto);
  x.fillStyle = "#0a1022";
  x.beginPath();
  x.moveTo(0, alto);
  for (let i = 0; i <= 16; i++) x.lineTo(A * i / 16, alto * (0.45 + Math.sin(i * 1.1) * 0.12 + Math.sin(i * 0.4) * 0.1));
  x.lineTo(A, alto); x.closePath(); x.fill();
  x.fillStyle = "#060a17";
  for (let i = 0; i < A / 9; i++) {
    const cx = i * 9 + azar(-4, 4), h = azar(alto * 0.25, alto * 0.62), w = azar(4, 8);
    x.beginPath();
    x.moveTo(cx - w, alto);
    x.lineTo(cx - w * 0.4, alto - h * 0.6);
    x.lineTo(cx, alto - h);
    x.lineTo(cx + w * 0.4, alto - h * 0.6);
    x.lineTo(cx + w, alto);
    x.fill();
  }
  // Unas lucecitas lejanas en la orilla, como de casitas.
  for (let i = 0; i < 4; i++) {
    const cx = azar(A * 0.08, A * 0.92), cy = alto * azar(0.8, 0.95);
    const r = x.createRadialGradient(cx, cy, 0, cx, cy, 6);
    r.addColorStop(0, "rgba(255,210,140,.9)");
    r.addColorStop(1, "rgba(255,210,140,0)");
    x.fillStyle = r;
    x.fillRect(cx - 6, cy - 6, 12, 12);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LO QUE VIVE EN EL AGUA
   ══════════════════════════════════════════════════════════════════════ */
const ondas = [];         // { x, z, r, v, vida, fuerza }
const gotas = [];         // salpicaduras, en el mundo
const nenufares = [];
const peces = [];
const luces = [];         // luciérnagas sobre el agua
const juncos = [];

function sembrar() {
  nenufares.length = 0;
  const sitios = [[-0.9, 2.2], [-0.55, 3.4], [0.75, 2.6], [0.95, 4.6], [-1.3, 6.5], [1.6, 7.5], [-0.2, 9.5], [0.4, 5.6]];
  for (const [x, z] of sitios) {
    nenufares.push({ x: x * azar(0.9, 1.1), z: z * azar(0.9, 1.1), r: azar(0.12, 0.2), giro: Math.random() * TAU, flor: Math.random() < 0.45, abre: 0, bote: 0, vb: 0, brillo: 0 });
  }
  peces.length = 0;
  for (let i = 0; i < 5; i++) {
    peces.push({ x: azar(-1, 1), z: azar(2, 7), a: Math.random() * TAU, v: azar(0.15, 0.35), susto: 0, curioso: null, fase: Math.random() * TAU, color: i % 2 ? "#ff9a5c" : "#fff0e0" });
  }
  luces.length = 0;
  for (let i = 0; i < 9; i++) luces.push({ x: azar(-2, 2), z: azar(1.5, 9), h: azar(0.15, 0.6), f: Math.random() * TAU, v: azar(0.4, 1) });
  juncos.length = 0;
  for (let i = 0; i < 26; i++) {
    const izq = i < 13;
    juncos.push({ x: izq ? azar(-0.02, 0.2) * A : A - azar(-0.02, 0.2) * A, alto: azar(0.12, 0.3) * H, f: Math.random() * TAU, cola: Math.random() < 0.35, doblez: 0, v: 0 });
  }
}

/* Qué tan alto está el agua en (x, z) por las ondas que pasan. */
function alturaAgua(x, z, t) {
  let h = 0;
  for (const o of ondas) {
    const d = Math.hypot(x - o.x, z - o.z);
    const k = d - o.r;
    if (Math.abs(k) < 0.35) h += Math.cos(k * 18) * (1 - Math.abs(k) / 0.35) * o.vida * o.fuerza * 0.04;
  }
  return h;
}

/* ══════════════════════════════════════════════════════════════════════
   EL SONIDO
   ══════════════════════════════════════════════════════════════════════ */
let ac = null, salida = null;
function despertar() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  salida = ac.createGain();
  salida.gain.value = 0.9;
  salida.connect(ac.destination);
  return ac;
}
function ruido(dur) {
  const n = Math.max(1, Math.floor(ac.sampleRate * dur));
  const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = ac.createBufferSource(); s.buffer = b; return s;
}
function zas(fuerza) {
  if (!despertar()) return;
  const t = ac.currentTime, s = ruido(0.28);
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.4;
  f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(2600, t + 0.2);
  const gg = ac.createGain(); gg.gain.value = 0.05 + fuerza * 0.06;
  s.connect(f).connect(gg).connect(salida); s.start(t);
}
/* El «plop»: una gota que se hunde. Más grave cuanto más grande. */
function plop(grande, lejos) {
  if (!despertar()) return;
  const t = ac.currentTime;
  const vol = (grande ? 0.3 : 0.16) * (1.2 - Math.min(1, lejos / ZMAX));
  const o = ac.createOscillator(), gg = ac.createGain();
  const f0 = grande ? azar(420, 520) : azar(900, 1300);
  o.frequency.setValueAtTime(f0 * 0.6, t);
  o.frequency.exponentialRampToValueAtTime(f0, t + 0.03);
  o.frequency.exponentialRampToValueAtTime(f0 * 0.35, t + (grande ? 0.22 : 0.09));
  gg.gain.setValueAtTime(0.0001, t);
  gg.gain.exponentialRampToValueAtTime(vol, t + 0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + (grande ? 0.3 : 0.12));
  o.connect(gg).connect(salida);
  o.start(t); o.stop(t + 0.35);
  const s = ruido(grande ? 0.35 : 0.1);
  const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1800;
  const gn = ac.createGain(); gn.gain.value = vol * 0.35;
  s.connect(f).connect(gn).connect(salida); s.start(t);
  if (grande) {
    // Y las gotitas que caen después.
    for (let i = 0; i < 5; i++) {
      const tt = t + 0.18 + i * azar(0.05, 0.11);
      const o2 = ac.createOscillator(), g2 = ac.createGain();
      const f2 = azar(1400, 2600);
      o2.frequency.setValueAtTime(f2, tt);
      o2.frequency.exponentialRampToValueAtTime(f2 * 0.5, tt + 0.05);
      g2.gain.setValueAtTime(0.0001, tt);
      g2.gain.exponentialRampToValueAtTime(vol * 0.2, tt + 0.005);
      g2.gain.exponentialRampToValueAtTime(0.0001, tt + 0.07);
      o2.connect(g2).connect(salida);
      o2.start(tt); o2.stop(tt + 0.1);
    }
  }
}
function acorde(notas) {
  if (!despertar()) return;
  const t = ac.currentTime;
  notas.forEach((f, i) => {
    for (const [m, a] of [[1, 1], [2, 0.3], [3.01, 0.1]]) {
      const o = ac.createOscillator(), gg = ac.createGain();
      o.frequency.value = f * m;
      const t0 = t + i * 0.14;
      gg.gain.setValueAtTime(0, t0);
      gg.gain.linearRampToValueAtTime(0.045 * a, t0 + 0.02);
      gg.gain.exponentialRampToValueAtTime(0.0001, t0 + 3.2 / m);
      o.connect(gg).connect(salida);
      o.start(t0); o.stop(t0 + 3.3);
    }
  });
}

/* ══════════════════════════════════════════════════════════════════════
   LA PIEDRA
   ══════════════════════════════════════════════════════════════════════ */
const piedras = [];
let tiradas = 0;

function tirar(x0, z0, vx, vz, vh, rebota) {
  piedras.push({ x: x0, z: z0, h: 0.35, vx, vz, vh, giro: 0, rebotes: 0, puedeRebotar: rebota, forma: azar(0.7, 0.9) });
  zas(Math.min(1, Math.hypot(vx, vz) / 8));
}

function tocarAgua(p, x, z, final) {
  const fuerza = final ? 1 : 0.6;
  ondas.push({ x, z, r: 0.02, v: final ? 0.5 : 0.42, vida: 1, fuerza });
  if (final) setTimeout(() => ondas.push({ x, z, r: 0.02, v: 0.38, vida: 0.8, fuerza: 0.6 }), 180);
  const n = final ? 26 : 10;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, v = azar(0.2, final ? 0.9 : 0.5);
    gotas.push({ x, z, h: 0.01, vx: Math.cos(a) * v * 0.4 + p.vx * 0.08, vz: Math.sin(a) * v * 0.4 + p.vz * 0.05, vh: azar(0.6, final ? 2.2 : 1.3), vida: 1 });
  }
  plop(final, z);
  // Los nenúfares de cerca se bambolean; si le cae encima, se abre la flor.
  for (const n2 of nenufares) {
    const d = Math.hypot(n2.x - x, n2.z - z);
    if (d < n2.r * 1.3) { n2.vb -= 3; n2.brillo = 1; if (n2.flor) n2.abre = 1; }
  }
  // Los peces se asustan... y luego vuelven a ver qué fue.
  for (const f of peces) {
    const d = Math.hypot(f.x - x, f.z - z);
    if (d < 2.4) {
      f.susto = 1;
      f.a = Math.atan2(f.z - z, f.x - x) + azar(-0.4, 0.4);
      f.curioso = { x, z, t: azar(2.2, 3.4) };
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LAS PALABRAS DE LUZ
   Se escribe la frase en un lienzo escondido y se leen sus píxeles: cada
   punto de tinta es el sitio de una chispa. Las chispas suben del sitio
   donde se hundió la piedra y van a su letra.
   ══════════════════════════════════════════════════════════════════════ */
let palabra = null;       // { chispas, t, sy (línea del agua), fin }

function escribir(frase, sx, sy) {
  const LETRA = '"Great Vibes", "Snell Roundhand", "Apple Chancery", cursive';
  let tam = clamp(Math.min(A * 0.2, H * 0.11), 44, 104);
  const c = document.createElement("canvas");
  let x = c.getContext("2d");
  // Que quepa siempre de lado a lado, con aire.
  x.font = `${tam}px ${LETRA}`;
  const ancho0 = x.measureText(frase).width;
  if (ancho0 > A * 0.86) tam *= (A * 0.86) / ancho0;
  const w = Math.ceil(Math.min(ancho0, A * 0.86) + tam * 0.8), h = Math.ceil(tam * 1.7);
  c.width = w; c.height = h;
  x = c.getContext("2d");
  x.font = `${tam}px ${LETRA}`;
  x.textAlign = "center";
  x.textBaseline = "middle";
  x.fillStyle = "#fff";
  x.fillText(frase, w / 2, h / 2);
  const datos = x.getImageData(0, 0, w, h).data;
  const puntos = [];
  const paso = Math.max(2, Math.round(tam / 26));
  for (let yy = 0; yy < h; yy += paso) {
    for (let xx = 0; xx < w; xx += paso) {
      if (datos[(yy * w + xx) * 4 + 3] > 120) puntos.push([xx - w / 2, yy - h / 2]);
    }
  }
  // Dónde va la frase: encima del sitio de la piedra, sin salirse.
  let medido = x.measureText(frase).width;
  const cx = clamp(sx, medido / 2 + 16, A - medido / 2 - 16);
  const cy = clamp(sy - tam * 0.85, tam, horizonte + (H - horizonte) * 0.55);
  const lim = suave ? 260 : 620;
  while (puntos.length > lim) puntos.splice(Math.floor(Math.random() * puntos.length), 1);
  const chispas = puntos.map(([px, py]) => ({
    x: sx + azar(-6, 6), y: sy + azar(-4, 4),
    tx: cx + px, ty: cy + py,
    vx: azar(-40, 40), vy: azar(-160, -40),
    retraso: azar(0, 0.55) + (px + medido / 2) / Math.max(1, medido) * 0.5,
    f: Math.random() * TAU,
  }));
  palabra = { chispas, t: 0, linea: sy, cx, cy, tam };
}

/* ══════════════════════════════════════════════════════════════════════
   EL DEDO
   ══════════════════════════════════════════════════════════════════════ */
let dedo = null;
const estela = [];
mundo.addEventListener("pointerdown", (e) => {
  despertar();
  const r = mundo.getBoundingClientRect();
  dedo = { id: e.pointerId, x: e.clientX - r.left, y: e.clientY - r.top, t: performance.now(), hist: [] };
  dedo.hist.push([dedo.x, dedo.y, dedo.t]);
  try { mundo.setPointerCapture(e.pointerId); } catch { /* nada */ }
});
mundo.addEventListener("pointermove", (e) => {
  if (!dedo || e.pointerId !== dedo.id) return;
  const r = mundo.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top, t = performance.now();
  dedo.hist.push([x, y, t]);
  if (dedo.hist.length > 8) dedo.hist.shift();
  estela.push({ x, y, vida: 1 });
});
function soltar(e) {
  if (!dedo || e.pointerId !== dedo.id) return;
  const d = dedo;
  dedo = null;
  const ult = d.hist[d.hist.length - 1];
  const pri = d.hist[0];
  const dx = ult[0] - pri[0], dy = ult[1] - pri[1];
  const dtt = Math.max(16, ult[2] - pri[2]) / 1000;
  const recorrido = Math.hypot(dx, dy);
  elPista.classList.add("is-fuera");
  if (recorrido < 14) {
    // Un toque: la piedra va en globo justo a ese sitio.
    if (d.y <= horizonte + 6) return;
    const [tx, tz] = aAgua(d.x, d.y);
    const tVuelo = 0.9 + tz * 0.03;
    tirar(tx * 0.3, 0.7, (tx - tx * 0.3) / tVuelo, (tz - 0.7) / tVuelo, 0, false);
    const p = piedras[piedras.length - 1];
    p.vh = (9.8 * tVuelo) / 2 - 0.35 / tVuelo;
    return;
  }
  // Un deslizamiento: la fuerza del dedo es la de la piedra.
  const vel = recorrido / dtt;                      // px/s
  if (dy > -10) return;                             // hacia abajo no se tira nada
  const fuerza = clamp(vel / 1400, 0.15, 1.6);
  const dir = Math.atan2(dx, -dy);                  // 0 = recto hacia el fondo
  const v = 2.2 + fuerza * 7.5;
  const origen = aAgua(clamp(d.hist[0][0], 0, A), Math.max(horizonte + 20, H - 10));
  tirar(clamp(origen[0], -0.8, 0.8), 0.9, Math.sin(dir) * v * 0.45, Math.cos(dir) * v, 1.1 + (1 - Math.min(1, fuerza)) * 1.6, fuerza > 0.45);
}
mundo.addEventListener("pointerup", soltar);
mundo.addEventListener("pointercancel", soltar);

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */
let t0 = performance.now(), reloj = 0;
const sellos = {};
function sello(nombre, paradas, tam = 64) {
  const c = document.createElement("canvas");
  c.width = c.height = tam;
  const x = c.getContext("2d");
  const r = x.createRadialGradient(tam / 2, tam / 2, 0, tam / 2, tam / 2, tam / 2);
  for (const [o, col] of paradas) r.addColorStop(o, col);
  x.fillStyle = r; x.fillRect(0, 0, tam, tam);
  sellos[nombre] = c;
}
sello("oro", [[0, "rgba(255,250,225,1)"], [0.15, "rgba(255,226,150,.85)"], [0.4, "rgba(255,196,110,.25)"], [1, "rgba(255,180,90,0)"]]);
sello("luna", [[0, "rgba(240,246,255,.9)"], [0.3, "rgba(200,220,255,.3)"], [1, "rgba(180,200,255,0)"]]);
sello("verde", [[0, "rgba(240,255,200,1)"], [0.2, "rgba(190,255,140,.6)"], [1, "rgba(160,240,120,0)"]]);

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A) return;
  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.25) dt = 1 / 60;
  reloj += dt;

  /* ---- Física de las piedras ---- */
  for (let i = piedras.length - 1; i >= 0; i--) {
    const p = piedras[i];
    p.vh -= 9.8 * dt;
    p.x += p.vx * dt; p.z += p.vz * dt; p.h += p.vh * dt;
    p.giro += dt * 14;
    if (p.z > ZMAX - 0.6) { p.z = ZMAX - 0.6; p.vz = 0; }
    if (p.h <= 0) {
      const horiz = Math.hypot(p.vx, p.vz);
      if (p.puedeRebotar && horiz > 3.2 && p.rebotes < 7 && p.z < ZMAX - 1.5) {
        // ¡Rebota! Cada rebote le quita velocidad y altura.
        p.rebotes++;
        tocarAgua(p, p.x, p.z, false);
        p.h = 0.001;
        p.vh = Math.max(0.8, Math.abs(p.vh) * 0.55) * (0.8 + horiz / 12);
        p.vx *= 0.8; p.vz *= 0.78;
      } else {
        tocarAgua(p, p.x, p.z, true);
        const [sx, sy] = aPantalla(p.x, p.z);
        piedras.splice(i, 1);
        const frase = FRASES[tiradas % FRASES.length];
        tiradas++;
        setTimeout(() => {
          escribir(frase, sx, sy);
          acorde(frase === FRASES[0] ? [523.25, 659.25, 783.99, 1046.5] : [349.23, 440, 523.25, 698.46]);
        }, 650);
      }
    }
  }

  /* ---- El cielo ---- */
  g.drawImage(cielo, 0, 0, A, horizonte + 2);
  for (const s of estrellas) {
    const b = 0.5 + 0.5 * Math.sin(reloj * 1.3 + s.f);
    g.fillStyle = `rgba(235,240,255,${0.3 + b * 0.6})`;
    g.fillRect(s.x, s.y, s.r, s.r);
  }
  const altoOrilla = horizonte * 0.26;
  g.drawImage(orilla, 0, horizonte - altoOrilla, A, altoOrilla);

  /* ---- El agua ---- */
  const agua = g.createLinearGradient(0, horizonte, 0, H);
  agua.addColorStop(0, "#1a2548");
  agua.addColorStop(0.18, "#0e1731");
  agua.addColorStop(1, "#040814");
  g.fillStyle = agua;
  g.fillRect(0, horizonte, A, H - horizonte);

  // El reflejo de la orilla, al revés y temblando.
  const franja = 3;
  for (let yy = 0; yy < altoOrilla * 0.9; yy += franja) {
    const k = yy / altoOrilla;
    const off = Math.sin(reloj * 1.4 + yy * 0.35) * (0.6 + k * 3);
    g.globalAlpha = 0.5 * (1 - k);
    g.drawImage(orilla, 0, (altoOrilla - yy - franja) * dpr, orilla.width, franja * dpr, off, horizonte + yy, A, franja);
  }
  g.globalAlpha = 1;

  // Las estrellas, también en el agua.
  for (const s of estrellas) {
    const ry = horizonte + (horizonte - s.y) * 0.7;
    if (ry > H) continue;
    const b = 0.5 + 0.5 * Math.sin(reloj * 2.1 + s.f);
    g.fillStyle = `rgba(210,220,255,${(0.08 + b * 0.18) * (1 - (ry - horizonte) / (H - horizonte))})`;
    g.fillRect(s.x + Math.sin(reloj * 2 + s.y) * 1.5, ry, s.r * 1.6, s.r * 0.6);
  }

  // El camino de la luna: rayitas de luz que se mueven con el agua.
  g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 120; i++) {
    const k = i / 120;
    const y = horizonte + 2 + Math.pow(k, 1.6) * (H - horizonte) * 0.95;
    const z = C / Math.max(1, y - horizonte);
    const ancho = (6 + k * 60) * (0.5 + 0.5 * Math.sin(reloj * 1.7 + i * 1.3));
    const [xw] = aAgua(luna.x, y);
    const olas = alturaAgua(xw, z, reloj) * 900;
    const x = luna.x + Math.sin(reloj * 1.1 + i * 0.9) * (3 + k * 18) + olas;
    g.fillStyle = `rgba(255,240,205,${(0.4 - k * 0.3) * (0.4 + 0.6 * Math.abs(Math.sin(reloj * 0.9 + i)))})`;
    g.fillRect(x - ancho / 2, y, ancho, 0.8 + k * 1.8);
  }
  g.globalAlpha = 0.28;
  g.drawImage(sellos.luna, luna.x - luna.r * 3, horizonte + (horizonte - luna.y) * 0.5 - luna.r * 1.2, luna.r * 6, luna.r * 2.4);
  g.globalAlpha = 1;
  g.globalCompositeOperation = "source-over";

  /* ---- Los peces, debajo del agua ---- */
  for (const f of peces) {
    f.fase += dt * 6;
    if (f.curioso) {
      f.curioso.t -= dt;
      if (f.curioso.t <= 0) {
        const a = Math.atan2(f.curioso.z - f.z, f.curioso.x - f.x);
        f.a += Math.atan2(Math.sin(a - f.a), Math.cos(a - f.a)) * dt * 2;
        if (Math.hypot(f.curioso.z - f.z, f.curioso.x - f.x) < 0.3) f.curioso = null;
      }
    } else f.a += Math.sin(reloj * 0.4 + f.fase * 0.05) * dt * 0.6;
    f.susto = Math.max(0, f.susto - dt * 0.8);
    const v = f.v * (1 + f.susto * 5);
    f.x += Math.cos(f.a) * v * dt;
    f.z += Math.sin(f.a) * v * dt;
    if (f.x < -1.6 || f.x > 1.6) f.a = Math.PI - f.a;
    if (f.z < 1.4 || f.z > 9) f.a = -f.a;
    f.x = clamp(f.x, -1.7, 1.7); f.z = clamp(f.z, 1.3, 9.2);
    const [sx, sy] = aPantalla(f.x, f.z);
    const esc = F / f.z * 0.12;
    const ang = Math.atan2(Math.sin(f.a) * (C / f.z / (F)), Math.cos(f.a));
    g.save();
    g.translate(sx, sy + esc * 0.6);
    g.rotate(ang);
    g.scale(1, 0.55);
    g.globalAlpha = 0.28;
    g.fillStyle = f.color;
    g.beginPath();
    g.ellipse(0, 0, esc, esc * 0.32, 0, 0, TAU);
    g.fill();
    const cola = Math.sin(f.fase) * 0.4;
    g.beginPath();
    g.moveTo(-esc * 0.9, 0);
    g.lineTo(-esc * 1.45, -esc * 0.3 + cola * esc * 0.3);
    g.lineTo(-esc * 1.45, esc * 0.3 + cola * esc * 0.3);
    g.fill();
    g.restore();
  }
  g.globalAlpha = 1;

  /* ---- Las ondas ---- */
  for (let i = ondas.length - 1; i >= 0; i--) {
    const o = ondas[i];
    o.r += o.v * dt * (1 - o.r * 0.12);
    o.vida -= dt / 3.4;
    if (o.vida <= 0) { ondas.splice(i, 1); continue; }
    const [sx, sy] = aPantalla(o.x, o.z);
    for (let k = 0; k < 3; k++) {
      const r = o.r - k * 0.09;
      if (r <= 0.01) continue;
      const rx = r * F / o.z, ry = r * C / (o.z * o.z);
      const a = o.vida * o.fuerza * (1 - k * 0.28);
      g.lineWidth = Math.max(0.6, 2.2 * F / o.z / 200);
      g.strokeStyle = `rgba(0,0,10,${a * 0.35})`;
      g.beginPath(); g.ellipse(sx, sy + 1.2, rx, Math.max(0.5, ry), 0, 0, TAU); g.stroke();
      g.strokeStyle = `rgba(200,220,255,${a * 0.42})`;
      g.beginPath(); g.ellipse(sx, sy, rx, Math.max(0.5, ry), 0, 0, TAU); g.stroke();
    }
  }
  if (ondas.length > 40) ondas.splice(0, ondas.length - 40);

  /* ---- Los nenúfares ---- */
  const orden = nenufares.slice().sort((a, b) => b.z - a.z);
  for (const n of orden) {
    n.vb += (-n.bote * 40 - n.vb * 4) * dt;
    n.bote += n.vb * dt;
    n.brillo = Math.max(0, n.brillo - dt * 0.5);
    const hA = alturaAgua(n.x, n.z, reloj);
    const [sx, sy0] = aPantalla(n.x, n.z);
    const sy = sy0 - (hA + n.bote * 0.02) * F / n.z * 2;
    const rx = n.r * F / n.z, ry = n.r * C / (n.z * n.z);
    g.save();
    g.translate(sx, sy);
    g.fillStyle = "rgba(0,0,0,.35)";
    g.beginPath(); g.ellipse(0, ry * 0.25, rx, ry, 0, 0, TAU); g.fill();
    const gr = g.createLinearGradient(-rx, -ry, rx, ry);
    gr.addColorStop(0, "#2f5a3a");
    gr.addColorStop(1, "#0f2a1c");
    g.fillStyle = gr;
    g.beginPath();
    const muesca = n.giro;
    g.moveTo(0, 0);
    g.ellipse(0, 0, rx, ry, 0, muesca + 0.22, muesca + TAU - 0.22);
    g.closePath();
    g.fill();
    g.strokeStyle = "rgba(160,220,170,.18)";
    g.lineWidth = 0.8;
    g.stroke();
    if (n.flor) {
      n.abre = Math.max(n.abre - dt * 0.05, 0);
      const abierta = 0.55 + n.abre * 0.45;
      const fr = rx * 0.42;
      for (let p = 0; p < 8; p++) {
        const a = (p / 8) * TAU + reloj * 0.05;
        const px = Math.cos(a) * fr * 0.3 * abierta, py = Math.sin(a) * fr * 0.12;
        g.fillStyle = p % 2 ? "#f6b7cf" : "#ffd6e6";
        g.beginPath();
        g.ellipse(px, py - fr * 0.4 * abierta, fr * 0.22, fr * 0.55 * abierta, a * 0.25 + Math.cos(a) * 0.5, 0, TAU);
        g.fill();
      }
      g.fillStyle = "#ffe58a";
      g.beginPath(); g.arc(0, -fr * 0.45, fr * 0.14, 0, TAU); g.fill();
      if (n.abre > 0.02 || n.brillo > 0.02) {
        g.globalCompositeOperation = "lighter";
        g.globalAlpha = Math.max(n.abre, n.brillo) * 0.8;
        g.drawImage(sellos.oro, -fr * 1.6, -fr * 2, fr * 3.2, fr * 3.2);
        g.globalAlpha = 1;
        g.globalCompositeOperation = "source-over";
      }
    }
    g.restore();
  }

  /* ---- Las piedras en el aire, con su sombra ---- */
  for (const p of piedras) {
    const [sx, sy] = aPantalla(p.x, p.z);
    const [, syA] = aPantalla(p.x, p.z, p.h);
    const tam = Math.max(2, 0.085 * F / p.z);
    g.fillStyle = `rgba(0,0,0,${0.3 * Math.max(0, 1 - p.h)})`;
    g.beginPath(); g.ellipse(sx, sy, tam, tam * 0.3, 0, 0, TAU); g.fill();
    g.save();
    g.translate(sx, syA);
    g.rotate(p.giro);
    const gr = g.createRadialGradient(-tam * 0.3, -tam * 0.3, 0, 0, 0, tam);
    gr.addColorStop(0, "#c9c3bc");
    gr.addColorStop(1, "#4a4541");
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(0, 0, tam, tam * p.forma * 0.6, 0, 0, TAU); g.fill();
    g.restore();
  }

  /* ---- Las gotas ---- */
  g.fillStyle = "rgba(220,232,255,.85)";
  for (let i = gotas.length - 1; i >= 0; i--) {
    const d = gotas[i];
    d.vh -= 9.8 * dt;
    d.x += d.vx * dt; d.z += d.vz * dt; d.h += d.vh * dt;
    if (d.h <= 0) {
      if (Math.random() < 0.3) ondas.push({ x: d.x, z: d.z, r: 0.01, v: 0.25, vida: 0.5, fuerza: 0.3 });
      gotas.splice(i, 1);
      continue;
    }
    const [sx, sy] = aPantalla(d.x, d.z, d.h);
    const r = Math.max(0.6, 0.012 * F / d.z);
    g.beginPath(); g.arc(sx, sy, r, 0, TAU); g.fill();
  }

  /* ---- Las luciérnagas del lago, con su reflejo ---- */
  g.globalCompositeOperation = "lighter";
  for (const l of luces) {
    l.f += dt * l.v;
    l.x += Math.cos(l.f * 0.7) * dt * 0.1;
    l.z += Math.sin(l.f * 0.5) * dt * 0.15;
    l.z = clamp(l.z, 1.3, 10);
    const h = l.h + Math.sin(l.f * 1.3) * 0.05;
    const [sx, sy] = aPantalla(l.x, l.z, h);
    const [, ry] = aPantalla(l.x, l.z, -h);
    const b = Math.pow(0.5 + 0.5 * Math.sin(l.f * 2), 2);
    const r = Math.max(4, 0.12 * F / l.z);
    g.globalAlpha = b;
    g.drawImage(sellos.verde, sx - r, sy - r, r * 2, r * 2);
    g.globalAlpha = b * 0.3;
    g.drawImage(sellos.verde, sx - r + Math.sin(reloj * 3) * 2, ry - r * 0.5, r * 2, r);
  }
  g.globalAlpha = 1;

  /* ---- Las palabras de luz ---- */
  if (palabra) {
    palabra.t += dt;
    const P = palabra;
    const fin = P.t > 5.2;
    for (const c of P.chispas) {
      const t = P.t - c.retraso;
      if (t < 0) continue;
      if (!fin) {
        const k = Math.min(1, t / 0.9);
        c.vx += ((c.tx - c.x) * 30 * k - c.vx * 6 * k) * dt;
        c.vy += ((c.ty - c.y) * 30 * k - c.vy * 6 * k) * dt;
        if (k < 0.3) c.vy -= 60 * dt;
      } else {
        // Al final, se van cayendo al agua como una lluvia de luz.
        c.vy += 180 * dt;
        c.vx *= Math.exp(-dt);
      }
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      const titila = 0.75 + 0.25 * Math.sin(reloj * 6 + c.f);
      const alfa = fin ? Math.max(0, 1 - (P.t - 5.2) / 1.6) : Math.min(1, t * 2);
      const r = (P.tam / 13) * titila;
      g.globalAlpha = alfa * 0.9;
      g.drawImage(sellos.oro, c.x - r, c.y - r, r * 2, r * 2);
      // Y su reflejo en el agua, debajo de la línea del agua.
      const ry = P.linea + (P.linea - c.y) * 0.8;
      if (ry > P.linea && ry < H) {
        g.globalAlpha = alfa * 0.22;
        g.drawImage(sellos.oro, c.x - r + Math.sin(reloj * 2.4 + ry * 0.1) * 3, ry - r * 0.5, r * 2, r);
      }
    }
    if (fin && P.t > 6.9) palabra = null;
  }
  g.globalAlpha = 1;
  g.globalCompositeOperation = "source-over";

  /* ---- Los juncos de delante ---- */
  const viento = Math.sin(reloj * 0.6) * 0.06 + Math.sin(reloj * 1.7) * 0.02;
  for (const j of juncos) {
    j.v += ((viento + Math.sin(reloj * 1.2 + j.f) * 0.03) - j.doblez) * 20 * dt;
    j.v *= Math.exp(-dt * 3);
    j.doblez += j.v * dt;
    const px = j.x + j.doblez * j.alto, py = H - j.alto;
    g.strokeStyle = "#02040a";
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(j.x, H + 4);
    g.quadraticCurveTo(j.x + j.doblez * j.alto * 0.2, H - j.alto * 0.5, px, py);
    g.stroke();
    if (j.cola) {
      g.fillStyle = "#1a120c";
      g.beginPath();
      g.ellipse(px - j.doblez * 8, py + 14, 3.4, 12, j.doblez, 0, TAU);
      g.fill();
    }
  }

  /* ---- El rastro del dedo ---- */
  for (let i = estela.length - 1; i >= 0; i--) {
    const e = estela[i];
    e.vida -= dt * 3;
    if (e.vida <= 0) { estela.splice(i, 1); continue; }
    g.fillStyle = `rgba(200,220,255,${e.vida * 0.25})`;
    g.beginPath(); g.arc(e.x, e.y, 3 * e.vida, 0, TAU); g.fill();
  }

  /* ---- La bruma sobre el agua y la viñeta ---- */
  const bruma = g.createLinearGradient(0, horizonte - 10, 0, horizonte + (H - horizonte) * 0.3);
  bruma.addColorStop(0, "rgba(150,170,220,.16)");
  bruma.addColorStop(1, "rgba(150,170,220,0)");
  g.fillStyle = bruma;
  g.fillRect(0, horizonte - 10, A, (H - horizonte) * 0.3 + 10);
  const vin = g.createRadialGradient(A / 2, H * 0.5, Math.min(A, H) * 0.3, A / 2, H * 0.5, Math.max(A, H) * 0.78);
  vin.addColorStop(0, "rgba(0,0,0,0)");
  vin.addColorStop(1, "rgba(0,0,0,.5)");
  g.fillStyle = vin;
  g.fillRect(0, 0, A, H);
}

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const primera = !A;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  horizonte = H * (A > H ? 0.36 : 0.4);
  C = H - horizonte;
  F = A * 0.5;
  pintarFijo();
  if (primera) sembrar();
}
new ResizeObserver(() => requestAnimationFrame(medir)).observe(mundo);
medir();
// La letra de las frases tiene que estar lista antes de escribir con luz.
try { document.fonts && document.fonts.load('60px "Great Vibes"'); } catch { /* sin fuentes */ }
requestAnimationFrame(paso);
})();
</script>
</body>
