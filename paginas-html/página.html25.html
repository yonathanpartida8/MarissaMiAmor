<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Las medusas</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   LAS MEDUSAS — «Baja despacio»
   Se baja al fondo del mar arrastrando hacia arriba, con inercia, como
   si nadaras. Arriba entran rayos de sol; abajo sólo hay la luz de ellas.
   Las medusas laten, ondean sus tentáculos y se apartan con curiosidad.
   Prefijo `md-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #03101e; }
.md {
  position: fixed;
  inset: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  font-family: "Cormorant Garamond", Georgia, serif;
  color: #e6f4ff;
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
}
.md canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.md-titulo {
  position: absolute; top: calc(var(--seg-t) + 14px); left: 0; right: 0; margin: 0;
  text-align: center; pointer-events: none;
  font-weight: 600; font-size: clamp(0.66rem, 2.8vw, 0.78rem); letter-spacing: 0.36em; text-transform: uppercase;
  color: rgba(210, 240, 255, 0.7);
}
.md-metros {
  position: absolute; right: calc(var(--seguro-lado, 0px) + 12px); top: 50%; transform: translateY(-50%);
  margin: 0; pointer-events: none; writing-mode: vertical-rl;
  font-weight: 600; font-size: 0.68rem; letter-spacing: 0.3em; color: rgba(190, 230, 255, 0.5);
}
.md-pie {
  position: absolute; left: 0; right: 0; bottom: calc(var(--seg-b) + var(--barra) + 16px);
  display: grid; justify-items: center; gap: 3px; padding: 0 26px; pointer-events: none; text-align: center;
}
.md-frase {
  margin: 0; max-width: 20em; font-style: italic; font-weight: 500;
  font-size: clamp(1.05rem, 4.8vw, 1.32rem); line-height: 1.3; color: #effaff;
  text-shadow: 0 0 18px rgba(120, 200, 255, 0.35), 0 2px 12px rgba(0, 0, 0, 0.8);
  transition: opacity 900ms var(--suave), transform 900ms var(--suave), filter 900ms var(--suave);
}
.md-firma { margin: 0; font-family: "Caveat", cursive; font-size: clamp(1rem, 4.4vw, 1.22rem); color: #9fe0ff; transition: opacity 900ms var(--suave) 250ms; }
.md-frase.is-fuera { opacity: 0; transform: translateY(8px); filter: blur(5px); }
.md-firma.is-fuera { opacity: 0; transition-delay: 0ms; }
</style>
</head>
<body>
<div class="md" id="mundo">
  <canvas id="lienzo"></canvas>
  <p class="md-titulo">Baja despacio</p>
  <p class="md-metros" id="metros">0 m</p>
  <div class="md-pie">
    <p class="md-frase" id="frase" role="status" aria-live="polite"></p>
    <p class="md-firma is-fuera" id="firma"></p>
  </div>
</div>

<script>
(() => {
"use strict";

const CONF = {
  metrosPorPantalla: 260,
  tramos: [
    { m: 0,    color: ["#2a6b96", "#154a72"], texto: "La superficie. Se ve el sol si miras arriba.", firma: "Pero abajo hay más." },
    { m: 220,  color: ["#154a72", "#0d3252"], texto: "Aquí ya empieza a costar ver.",                firma: "Sigue, que vale la pena." },
    { m: 520,  color: ["#0d3252", "#071e36"], texto: "Doscientos metros más y no llega nada de luz.", firma: "La que hay, la ponen ellas." },
    { m: 900,  color: ["#071e36", "#030f1e"], texto: "Esto ya es noche todo el año.",                 firma: "Y mira qué bonito." },
    { m: 1400, color: ["#030f1e", "#01060e"], texto: "Aquí abajo no ha estado casi nadie.",           firma: "Tú y yo, y ya." },
  ],
  cuantas: 38,
  frases: [
    ["Aquí abajo no hace falta hablar.", "Se entiende todo igual."],
    ["Lo único que dan es luz.", "Y no piden nada."],
    ["No saben hacia dónde van.", "Van, y ya está. Como nosotros."],
    ["Llevan aquí más tiempo que los árboles.", "Y siguen siendo blandas."],
    ["Se dejan llevar por la corriente.", "A veces es lo más listo."],
    ["Si la aprietas se rompe.", "Hay cosas que se cuidan solas."],
    ["Brillan sin quemarse.", "Enséñame a hacer eso."],
  ],
  fondo: 1600,          // metros hasta el fondo
};

const mundo = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const g = lienzo.getContext("2d", { alpha: false });
const elFrase = document.getElementById("frase");
const elFirma = document.getElementById("firma");
const elMetros = document.getElementById("metros");
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2;
const azar = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const acercar = (v, o, k, dt) => o + (v - o) * Math.exp(-k * dt);
const hexA = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mezcla = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));

let A = 0, H = 0, dpr = 1;
const TECHO = 0;
let prof = TECHO, vProf = 0;    // metros y metros por segundo

/* ══════════════════════════════════════════════════════════════════════
   LAS MEDUSAS
   Viven en el mundo (x en pantalla, y en metros). Cada una late: la
   campana se cierra, empuja, y se abre despacio. Sus tentáculos son
   cadenas de puntos que se quedan atrás al subir.
   ══════════════════════════════════════════════════════════════════════ */
const PALETAS = [[255, 160, 210], [150, 210, 255], [190, 160, 255], [255, 200, 150], [140, 255, 220]];
const medusas = [];
function nuevaMedusa(yMundo) {
  const tam = azar(22, 52);
  const m = {
    x: Math.random() * A, y: yMundo, vx: 0, vy: 0,
    tam, z: azar(0.5, 1.15),
    fase: Math.random() * TAU, ritmo: azar(0.55, 1.05),
    col: PALETAS[Math.floor(Math.random() * PALETAS.length)],
    brillo: 0, tentaculos: [],
  };
  const n = 6;
  for (let t = 0; t < n; t++) {
    const puntos = [];
    for (let k = 0; k < 10; k++) puntos.push({ x: m.x, y: 0, px: m.x, py: 0 });
    m.tentaculos.push({ off: (t / (n - 1) - 0.5) * tam * 1.4, puntos, largo: tam * azar(0.18, 0.3) });
  }
  return m;
}
function sembrar() {
  medusas.length = 0;
  for (let i = 0; i < CONF.cuantas; i++) medusas.push(nuevaMedusa(azar(60, CONF.fondo)));
}

/* La nieve marina, en tres capas de profundidad para el paralaje. */
const nieve = [];
function sembrarNieve() {
  nieve.length = 0;
  for (let i = 0; i < 220; i++) nieve.push({ x: Math.random(), y: Math.random(), capa: i % 3, r: azar(0.4, 1.8), f: Math.random() * TAU });
}

/* ══════════════════════════════════════════════════════════════════════
   EL SONIDO: un fondo de mar muy grave y el «tin» de las medusas
   ══════════════════════════════════════════════════════════════════════ */
let ac = null, salida = null, mar = null;
function despertar() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  salida = ac.createGain(); salida.gain.value = 0.9; salida.connect(ac.destination);
  const n = ac.sampleRate * 3;
  const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  let u = 0;
  for (let i = 0; i < n; i++) { u = (u + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = u * 3; }
  const s = ac.createBufferSource(); s.buffer = b; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 300;
  const gg = ac.createGain(); gg.gain.value = 0;
  s.connect(f).connect(gg);
  if (window.LibroSonido) window.LibroSonido.ambiente(gg); else gg.connect(ac.destination);
  s.start();
  gg.gain.setTargetAtTime(0.12, ac.currentTime, 2);
  mar = { f, gg };
  return ac;
}
function tin(col) {
  if (!ac) return;
  const t = ac.currentTime, base = [523.25, 587.33, 659.25, 783.99, 880][Math.floor(Math.random() * 5)];
  for (const [m, a] of [[1, 1], [2.01, 0.3], [4.02, 0.08]]) {
    const o = ac.createOscillator(), gg = ac.createGain();
    o.frequency.value = base * m;
    gg.gain.setValueAtTime(0, t);
    gg.gain.linearRampToValueAtTime(0.04 * a, t + 0.05);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + 3 / m);
    o.connect(gg).connect(salida);
    o.start(t); o.stop(t + 3.1);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LOS TEXTOS
   ══════════════════════════════════════════════════════════════════════ */
let bloqueo = 0, tramoDicho = -1, nFrase = 0;
function decir(f, s, importante) {
  const ahora = performance.now();
  if (!importante && ahora < bloqueo) return;
  bloqueo = ahora + 4200;
  elFrase.classList.add("is-fuera"); elFirma.classList.add("is-fuera");
  setTimeout(() => {
    elFrase.textContent = f; elFrase.classList.remove("is-fuera");
    elFirma.textContent = s || ""; elFirma.classList.toggle("is-fuera", !s);
  }, suave ? 20 : 500);
}

/* ══════════════════════════════════════════════════════════════════════
   EL DEDO: arrastrar baja (con inercia); tocar una medusa la hace brillar
   ══════════════════════════════════════════════════════════════════════ */
let dedo = null;
mundo.addEventListener("pointerdown", (e) => {
  despertar();
  const r = mundo.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  dedo = { id: e.pointerId, x, y, y0: y, x0: x, t: performance.now(), tm: performance.now(), movido: false };
  vProf = 0;
  try { mundo.setPointerCapture(e.pointerId); } catch { /* nada */ }
});
mundo.addEventListener("pointermove", (e) => {
  if (!dedo || e.pointerId !== dedo.id) return;
  const r = mundo.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const dy = y - dedo.y;
  if (Math.hypot(x - dedo.x0, y - dedo.y0) > 8) dedo.movido = true;
  const mPorPx = CONF.metrosPorPantalla / H;
  prof = clamp(prof - dy * mPorPx, TECHO, CONF.fondo);
  const ahora = performance.now(), dtm = Math.max(8, ahora - dedo.tm) / 1000;
  dedo.tm = ahora;
  vProf = clamp(acercar(vProf, -dy * mPorPx / dtm, 10, dtm), -260, 260);
  dedo.x = x; dedo.y = y;
});
function soltar(e) {
  if (!dedo || e.pointerId !== dedo.id) return;
  const d = dedo;
  dedo = null;
  if (!d.movido && performance.now() - d.t < 350) tocar(d.x, d.y);
}
mundo.addEventListener("pointerup", soltar);
mundo.addEventListener("pointercancel", soltar);

function aPantallaY(yMundo) { return (yMundo - prof) / CONF.metrosPorPantalla * H + H * 0.14; }
function tocar(x, y) {
  let mejor = null, dmin = Infinity;
  for (const m of medusas) {
    const d = Math.hypot(m.x - x, aPantallaY(m.y) - y);
    if (d < m.tam * 1.6 && d < dmin) { dmin = d; mejor = m; }
  }
  if (mejor) {
    mejor.brillo = 1;
    mejor.vy -= 22;
    tin(mejor.col);
    const [f, s] = CONF.frases[nFrase++ % CONF.frases.length];
    decir(f, s, true);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   EL BUCLE
   ══════════════════════════════════════════════════════════════════════ */
let t0 = performance.now(), reloj = 0;
function colorAgua(m) {
  const T = CONF.tramos;
  let i = 0;
  while (i < T.length - 1 && m > T[i + 1].m) i++;
  const a = T[i], b = T[Math.min(i + 1, T.length - 1)];
  const k = b === a ? 0 : clamp((m - a.m) / (b.m - a.m), 0, 1);
  return [mezcla(hexA(a.color[0]), hexA(b.color[0]), k), mezcla(hexA(a.color[1]), hexA(b.color[1]), k)];
}

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A) return;
  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.1) dt = 1 / 60;
  reloj += dt;

  // La bajada sigue sola un poco (el agua frena), y nunca pasa del fondo.
  if (!dedo) { prof = clamp(prof + vProf * dt, TECHO, CONF.fondo); vProf *= Math.exp(-dt * 1.8); }
  elMetros.textContent = `${Math.max(0, Math.round(prof))} m`;
  const luz = clamp(1 - prof / 700, 0, 1);
  if (mar && ac) mar.f.frequency.setTargetAtTime(300 - (1 - luz) * 180, ac.currentTime, 0.5);

  // Cada tramo dice lo suyo al llegar.
  for (let i = CONF.tramos.length - 1; i >= 0; i--) {
    if (prof >= CONF.tramos[i].m - 10) { if (tramoDicho !== i) { tramoDicho = i; decir(CONF.tramos[i].texto, CONF.tramos[i].firma, true); } break; }
  }

  // El agua.
  const [c1, c2] = colorAgua(prof);
  const agua = g.createLinearGradient(0, 0, 0, H);
  agua.addColorStop(0, `rgb(${c1})`);
  agua.addColorStop(1, `rgb(${c2})`);
  g.fillStyle = agua;
  g.fillRect(0, 0, A, H);

  // La superficie y los rayos de sol, sólo cerca de arriba.
  const ySup = aPantallaY(0);
  if (luz > 0.02) {
    g.save();
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 7; i++) {
      const x = A * (0.1 + i * 0.14) + Math.sin(reloj * 0.3 + i * 1.7) * 30;
      const w = 30 + Math.sin(reloj * 0.5 + i) * 18;
      const gr = g.createLinearGradient(0, Math.max(0, ySup), 0, Math.max(0, ySup) + H * 1.2);
      gr.addColorStop(0, `rgba(200,240,255,${0.16 * luz})`);
      gr.addColorStop(1, "rgba(200,240,255,0)");
      g.fillStyle = gr;
      g.beginPath();
      g.moveTo(x - w * 0.3, Math.max(0, ySup));
      g.lineTo(x + w * 0.3, Math.max(0, ySup));
      g.lineTo(x + w * 2 + 80, H * 1.3);
      g.lineTo(x - w * 0.5 + 80, H * 1.3);
      g.fill();
    }
    g.restore();
    if (ySup > -20) {
      // La superficie vista desde abajo: ondas de luz.
      g.fillStyle = `rgba(210,245,255,${0.35 * luz})`;
      for (let x = 0; x < A; x += 6) {
        const y = ySup + Math.sin(x * 0.04 + reloj * 2) * 4 + Math.sin(x * 0.11 - reloj * 3) * 2;
        g.fillRect(x, y, 6, 2);
      }
      const brillo = g.createLinearGradient(0, ySup - 40, 0, ySup + 30);
      brillo.addColorStop(0, "rgba(255,255,255,0)");
      brillo.addColorStop(0.6, `rgba(220,245,255,${0.25 * luz})`);
      brillo.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = brillo;
      g.fillRect(0, ySup - 40, A, 70);
    }
  }

  // El fondo del mar, con sus algas, al llegar abajo.
  const yFondo = aPantallaY(CONF.fondo + 40);
  if (yFondo < H + 40) {
    const arena = g.createLinearGradient(0, yFondo, 0, H);
    arena.addColorStop(0, "#0a1624"); arena.addColorStop(1, "#050b14");
    g.fillStyle = arena;
    g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= A; x += 12) g.lineTo(x, yFondo + Math.sin(x * 0.02) * 10);
    g.lineTo(A, H); g.fill();
    for (let i = 0; i < 12; i++) {
      const x = (i + 0.5) / 12 * A, h = 40 + (i * 37) % 60;
      g.strokeStyle = `rgba(80,${160 + i * 6},170,.35)`; g.lineWidth = 3;
      g.beginPath(); g.moveTo(x, yFondo + 6);
      for (let k = 1; k <= 6; k++) g.lineTo(x + Math.sin(reloj * 1.2 + i + k * 0.6) * k * 2.4, yFondo + 6 - h * k / 6);
      g.stroke();
    }
  }

  // Nieve marina: capas a distinta distancia, cada una se mueve distinto.
  for (const n of nieve) {
    const par = [0.4, 0.75, 1.15][n.capa];
    let y = (n.y * H - (prof * par / CONF.metrosPorPantalla) * H - reloj * (4 + n.capa * 3)) % H;
    if (y < 0) y += H;
    const x = (n.x * A + Math.sin(reloj * 0.3 + n.f) * 8 + A) % A;
    const a = (0.15 + n.capa * 0.12) * (0.6 + 0.4 * Math.sin(reloj + n.f));
    g.fillStyle = luz > 0.3 ? `rgba(230,245,255,${a})` : `rgba(160,230,255,${a * 1.3})`;
    g.beginPath(); g.arc(x, y, n.r * (0.6 + n.capa * 0.5), 0, TAU); g.fill();
  }

  // Las medusas, de lejos a cerca.
  medusas.sort((a, b) => a.z - b.z);
  for (const m of medusas) {
    const lat = (Math.sin(reloj * m.ritmo * TAU + m.fase) + 1) / 2;       // 0 abierta, 1 cerrada
    const empuje = Math.max(0, Math.cos(reloj * m.ritmo * TAU + m.fase)) * 22;
    m.vy = acercar(m.vy, -empuje * 0.6, 1.4, dt);
    m.vx = acercar(m.vx, Math.sin(reloj * 0.2 + m.fase) * 6, 0.5, dt);
    const sy = aPantallaY(m.y);
    if (dedo && Math.hypot(dedo.x - m.x, dedo.y - sy) < 120) {
      const dx = m.x - dedo.x, dy = sy - dedo.y, d = Math.hypot(dx, dy) || 1;
      m.vx += dx / d * 40 * dt; m.vy += dy / d * 40 * dt * (CONF.metrosPorPantalla / H);
    }
    m.x += m.vx * dt; m.y += m.vy * dt * 0.35;
    if (m.x < -60) m.x = A + 50; if (m.x > A + 60) m.x = -50;
    if (m.y < 20) m.y = CONF.fondo - 20;
    if (m.y > CONF.fondo) m.y = 40;
    m.brillo = Math.max(0, m.brillo - dt * 0.4);
    if (sy < -120 || sy > H + 160) { for (const t of m.tentaculos) for (const p of t.puntos) { p.x = p.px = m.x + t.off; p.y = p.py = sy; } continue; }

    const esc = m.z;
    const ancho = m.tam * esc * (1 + lat * -0.18), alto = m.tam * esc * (0.8 + lat * 0.25);
    const glow = 0.35 + (1 - luz) * 0.5 + m.brillo * 0.6;
    const [r, gg, b] = m.col;

    // Los tentáculos: caen y se quedan atrás.
    for (const t of m.tentaculos) {
      const p0 = t.puntos[0];
      p0.x = m.x + t.off * esc * (1 - lat * 0.3); p0.y = sy + alto * 0.1;
      for (let k = 1; k < t.puntos.length; k++) {
        const p = t.puntos[k];
        const vx = (p.x - p.px) * 0.9, vy = (p.y - p.py) * 0.9;
        p.px = p.x; p.py = p.y;
        p.x += vx + Math.sin(reloj * 2 + k * 0.5 + t.off) * 0.25;
        p.y += vy + 0.35;
      }
      for (let it = 0; it < 3; it++) {
        for (let k = 1; k < t.puntos.length; k++) {
          const a = t.puntos[k - 1], p = t.puntos[k];
          const dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy) || 1;
          const l = t.largo * esc * 0.9;
          const f = (d - l) / d;
          p.x -= dx * f; p.y -= dy * f;
        }
      }
      g.strokeStyle = `rgba(${r},${gg},${b},${0.35 * glow})`;
      g.lineWidth = 1.1 * esc;
      g.beginPath(); g.moveTo(t.puntos[0].x, t.puntos[0].y);
      for (let k = 1; k < t.puntos.length; k++) g.lineTo(t.puntos[k].x, t.puntos[k].y);
      g.stroke();
    }
    // El halo de luz.
    g.globalCompositeOperation = "lighter";
    const halo = g.createRadialGradient(m.x, sy, 0, m.x, sy, ancho * 2.4);
    halo.addColorStop(0, `rgba(${r},${gg},${b},${0.3 * glow})`);
    halo.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = halo;
    g.fillRect(m.x - ancho * 2.4, sy - ancho * 2.4, ancho * 4.8, ancho * 4.8);
    // La campana translúcida.
    const campana = g.createRadialGradient(m.x, sy - alto * 0.5, 0, m.x, sy - alto * 0.2, ancho);
    campana.addColorStop(0, `rgba(255,255,255,${0.35 * glow})`);
    campana.addColorStop(0.5, `rgba(${r},${gg},${b},${0.3 * glow})`);
    campana.addColorStop(1, `rgba(${r},${gg},${b},${0.08 * glow})`);
    g.fillStyle = campana;
    g.beginPath();
    g.moveTo(m.x - ancho, sy);
    g.bezierCurveTo(m.x - ancho, sy - alto * 1.25, m.x + ancho, sy - alto * 1.25, m.x + ancho, sy);
    // El borde ondulado de abajo.
    for (let k = 6; k >= 0; k--) {
      const xx = m.x - ancho + k / 6 * ancho * 2;
      g.lineTo(xx, sy + (k % 2 ? alto * 0.12 : 0) + Math.sin(reloj * 3 + k) * 1.5);
    }
    g.fill();
    g.strokeStyle = `rgba(255,255,255,${0.25 * glow})`;
    g.lineWidth = 1;
    g.stroke();
    // Las cuatro «flores» de dentro.
    g.fillStyle = `rgba(${r},${gg},${b},${0.4 * glow})`;
    for (let k = 0; k < 4; k++) {
      const a = k / 4 * TAU + reloj * 0.3;
      g.beginPath(); g.ellipse(m.x + Math.cos(a) * ancho * 0.3, sy - alto * 0.45 + Math.sin(a) * alto * 0.12, ancho * 0.16, alto * 0.1, a, 0, TAU); g.fill();
    }
    g.globalCompositeOperation = "source-over";
  }

  // Viñeta de profundidad.
  const vin = g.createRadialGradient(A / 2, H / 2, Math.min(A, H) * 0.3, A / 2, H / 2, Math.max(A, H) * 0.75);
  vin.addColorStop(0, "rgba(0,0,0,0)");
  vin.addColorStop(1, `rgba(0,4,12,${0.35 + (1 - luz) * 0.35})`);
  g.fillStyle = vin;
  g.fillRect(0, 0, A, H);
}

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const primera = !A;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(A * dpr); lienzo.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (primera) { sembrar(); sembrarNieve(); }
}
new ResizeObserver(() => requestAnimationFrame(medir)).observe(mundo);
medir();
setTimeout(() => decir("Arrastra hacia arriba para bajar.", "no hay prisa", true), 300);
requestAnimationFrame(paso);
})();
</script>
