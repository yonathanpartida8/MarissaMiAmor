<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El hilo rojo</title>
<script src="sonido-libro.js"></script>
<meta name="color-scheme" content="dark">

<style>
/* ══════════════════════════════════════════════════════════════════════
   TODO VIVE DENTRO DE .romantic-world

   Esta página se incrusta dentro de un libro que tiene sus propios
   estilos, así que aquí no se toca nada de fuera: ni `button`, ni
   `canvas`, ni `p`, ni ninguna etiqueta a secas. Cada regla empieza por
   la clase raíz y todos los nombres llevan el prefijo `rw-`.
   ══════════════════════════════════════════════════════════════════════ */

html, body { margin: 0; height: 100%; }

.romantic-world {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  background: #100c14;
  color: #f0e8e4;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  contain: layout paint;

  /* Paleta. Todo lo que se ve sale de aquí: rosas empolvados, verdes
     salvia, un carmesí apagado para el hilo y un crema cálido para la
     tinta. Nada saturado — la escena tiene que parecer una acuarela
     nocturna, no un anuncio. */
  --rosa: #e8a8b8;
  --rosa-hondo: #8a5060;
  --verde: #a8c8b0;
  --verde-hondo: #587868;
  --hilo: #c04858;
  --tinta: #f0e8e4;

  --seguro-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seguro-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);

  --e-suave: cubic-bezier(0.22, 1, 0.36, 1);
}

.romantic-world .rw-lienzo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
}

.romantic-world .rw-toque {
  position: absolute;
  inset: 0;
  touch-action: none;
  z-index: 2;
}

/* ---- Las cartas ------------------------------------------------- */

.romantic-world .rw-cartas {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 3;
}

.romantic-world .rw-carta {
  position: absolute;
  left: 0;
  top: 0;
  width: 34px;
  height: 26px;
  margin: -13px 0 0 -17px;
  opacity: 0;
  will-change: transform, opacity;
}

.romantic-world .rw-carta svg { display: block; overflow: visible; }

/* ---- Frases al recibir una carta -------------------------------- */

.romantic-world .rw-frase {
  position: absolute;
  left: 0;
  top: 0;
  max-width: min(46vw, 15rem);
  padding: 0.32rem 0.66rem;
  margin: 0;
  border-radius: 10px;
  font-size: clamp(0.66rem, 2.7vw, 0.8rem);
  line-height: 1.42;
  text-align: center;
  color: #f8efe8;
  text-shadow: 0 1px 10px rgba(10, 6, 12, 0.7);
  background: rgba(28, 20, 30, 0.44);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  pointer-events: none;
  opacity: 0;
  will-change: transform, opacity;
  z-index: 4;
}

.romantic-world .rw-frase--larga {
  max-width: min(72vw, 21rem);
  font-size: clamp(0.72rem, 3vw, 0.88rem);
  background: rgba(40, 22, 30, 0.66);
  box-shadow: 0 0 0 1px rgba(200, 140, 160, 0.18), 0 12px 32px -16px rgba(120, 40, 60, 0.7);
}

/* ---- Interfaz mínima -------------------------------------------- */

.romantic-world .rw-ui {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

.romantic-world .rw-distancia {
  position: absolute;
  left: 50%;
  top: calc(var(--seguro-t) + 16px);
  transform: translateX(-50%);
  text-align: center;
  opacity: 0;
  transition: opacity 900ms var(--e-suave);
}

.romantic-world .rw-distancia.rw-dentro { opacity: 1; }

.romantic-world .rw-km {
  display: block;
  font-size: clamp(1.1rem, 4.6vw, 1.5rem);
  font-weight: 300;
  letter-spacing: 0.06em;
  font-variant-numeric: tabular-nums;
  color: #f2dede;
  text-shadow: 0 0 20px rgba(200, 90, 120, 0.35);
}

.romantic-world .rw-susurro {
  display: block;
  margin-top: 0.26rem;
  font-size: clamp(0.62rem, 2.6vw, 0.74rem);
  letter-spacing: 0.04em;
  color: rgba(240, 232, 228, 0.55);
  transition: opacity 420ms var(--e-suave);
}

.romantic-world .rw-pista {
  position: absolute;
  left: 50%;
  bottom: calc(var(--seguro-b) + var(--barra) + 20px);
  transform: translateX(-50%);
  font-size: clamp(0.64rem, 2.7vw, 0.76rem);
  letter-spacing: 0.28em;
  text-transform: lowercase;
  color: rgba(240, 232, 228, 0.45);
  opacity: 0;
  transition: opacity 1100ms var(--e-suave);
  white-space: nowrap;
}

.romantic-world .rw-pista.rw-dentro { opacity: 1; }

.romantic-world .rw-mandos {
  position: absolute;
  top: calc(var(--seguro-t) + 12px);
  right: 14px;
  display: flex;
  gap: 6px;
  pointer-events: auto;
}

.romantic-world .rw-boton {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid rgba(232, 200, 208, 0.12);
  border-radius: 50%;
  background: rgba(28, 20, 30, 0.5);
  color: rgba(240, 232, 228, 0.62);
  font: inherit;
  cursor: pointer;
  transition: background 240ms, color 240ms, transform 240ms var(--e-suave);
}

.romantic-world .rw-boton:hover { color: #f8efe8; background: rgba(46, 30, 40, 0.66); }
.romantic-world .rw-boton:active { transform: scale(0.9); }
.romantic-world .rw-boton:focus-visible {
  outline: 2px solid var(--rosa);
  outline-offset: 2px;
}
.romantic-world .rw-boton svg { display: block; }

.romantic-world .rw-final {
  position: absolute;
  left: 50%;
  top: auto;
  bottom: 16%;
  width: min(84%, 30rem);
  transform: translate(-50%, 0);
  text-align: center;
  font-size: clamp(1.05rem, 4.4vw, 1.5rem);
  font-weight: 300;
  line-height: 1.5;
  letter-spacing: 0.01em;
  color: #fbeee6;
  text-shadow: 0 0 30px rgba(200, 90, 120, 0.45), 0 2px 20px rgba(0, 0, 0, 0.6);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1400ms var(--e-suave);
  z-index: 6;
}

.romantic-world .rw-final.rw-dentro { opacity: 1; }

.romantic-world .rw-sencillo {
  position: absolute;
  left: 50%;
  bottom: calc(var(--seguro-b) + var(--barra) + 4px);
  transform: translateX(-50%);
  font-size: 0.56rem;
  letter-spacing: 0.14em;
  color: rgba(240, 232, 228, 0.28);
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  .romantic-world .rw-distancia,
  .romantic-world .rw-pista,
  .romantic-world .rw-final { transition-duration: 1ms; }
}
</style>
</head>

<body>

<div class="romantic-world" id="rw">
  <canvas class="rw-lienzo" id="rwLienzo"></canvas>
  <div class="rw-toque" id="rwToque" aria-hidden="true"></div>
  <div class="rw-cartas" id="rwCartas" aria-hidden="true"></div>

  <div class="rw-ui">
    <div class="rw-distancia" id="rwDistancia" aria-live="polite">
      <span class="rw-km" id="rwKm"></span>
      <span class="rw-susurro" id="rwSusurro"></span>
    </div>

    <p class="rw-pista" id="rwPista"></p>
    <p class="rw-final" id="rwFinal"></p>

    <div class="rw-mandos">
      <button class="rw-boton" id="rwSonido" type="button" aria-label="Activar sonido">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M3 6h2.4L8.6 3.2v9.6L5.4 10H3z" fill="currentColor"/>
          <path id="rwOndas" d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.6 3.6a6.2 6.2 0 0 1 0 8.8"
                stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0"/>
          <path id="rwMudo" d="M10.8 6.2l3.4 3.6M14.2 6.2l-3.4 3.6"
                stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="rw-boton" id="rwReinicio" type="button" aria-label="Volver a empezar">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13 8a5 5 0 1 1-1.6-3.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M13.2 2.2v2.9h-2.9" stroke="currentColor" stroke-width="1.3"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
/* ══════════════════════════════════════════════════════════════════════
   EL HILO ROJO

   Dos pequeños mundos separados, unidos por un listón, mandándose
   cartas hasta que alguien consigue juntarlos.

   Todo el código vive dentro de esta función: ni una variable suelta en
   `window`, porque esto se incrusta en un libro que tiene el suyo.
   ══════════════════════════════════════════════════════════════════════ */

// ══════════════════════════════════════════════════════════════════════
//  CONFIGURACIÓN EDITABLE
// ══════════════════════════════════════════════════════════════════════

const CONFIG = {
  CADENCIA_CARTA: 1.0,
  KM_MAXIMOS: 2480,

  SUSURROS: [
    { hasta: 0.001, texto: "Por fin. Aquí, y sin distancia. ❤️" },
    { hasta: 0.08,  texto: "Un poquito más…" },
    { hasta: 0.20,  texto: "Ya casi te alcanzo 🤍" },
    { hasta: 0.45,  texto: "Cada vez más cerquita…" },
    { hasta: 1.00,  texto: "Todavía queda un pedacito de mundo entre los dos." },
  ],

  PISTA: "acercaos",

  FRASE_FINAL:
    "De todos los caminos posibles, los nuestros seguían llevándome a ti.",

  FRASES: [
    "Te amo 🤍",
    "Siempre estás en mi corazón.",
    "Me haces muy feliz.",
    "Eres mi persona favorita.",
    "Qué bonito coincidir contigo.",
    "Te elegiría una y otra vez.",
    "Contigo todo se siente más bonito.",
    "Mi lugar favorito siempre será contigo.",
    "Gracias por existir.",
    "Eres mi pequeño hogar.",
    "Te pienso más de lo que imaginas.",
    "Mi corazón siempre encuentra el camino hacia ti.",
    "Eres mi casualidad favorita.",
    "No importa la distancia.",
    "Hoy también te elegí.",
    "Me gusta cómo suena tu nombre.",
    "Contigo hasta esperar es bonito.",
    "Guardo tus risas para los días grises.",
    "Eres lo mejor que me ha pasado sin buscarlo.",
    "Si me pierdo, búscame donde estés tú.",
    "Te quiero en los días fáciles y en los otros.",
    "Mi sitio es donde estés.",
    "Te pienso a las tres de la mañana.",
    "Volvería a empezar sólo para volver a encontrarte.",
  ],

  CARTA_ESPECIAL: {
    probabilidad: 0.022,
    texto: "Esta carta tardó un poquito más porque quería decirte algo importante… Te amo. 🤍",
  },

  FISICA: {
    muelleDedo: 240,
    amortiguacion: 0.86,
    repulsion: 1850,
    alcanceRepulsion: 1.9,
    minimo: 0.92,
    rendicion: 0.62,
    recuperacion: 0.34,
  },

  SECRETOS: {
    corazonFondo: 4.5,
    vueltasConstelacion: 2,
    cartasParaLuna: 10,
    estirar: 2.6,
    estirarDesde: 0.88,
    sacudidas: 5,
    sacudirEn: 1.1,
    dosDedos: 0.5,
    solasTras: 26,
  },

  PERF: {
    dprMax: 2,
    dprMaxFlojo: 1.25,
    particulas: 900,
    particulasFlojo: 280,
    fpsMinimo: 44,
  },
};

// ══════════════════════════════════════════════════════════════════════
//  MATEMÁTICAS
// ══════════════════════════════════════════════════════════════════════

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = (v) => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const azar = (a, b) => a + Math.random() * (b - a);
const damp = (actual, objetivo, k, dt) => objetivo + (actual - objetivo) * Math.exp(-k * dt);

// ══════════════════════════════════════════════════════════════════════
//  ESCENA
// ══════════════════════════════════════════════════════════════════════

class Escena {
  constructor(raiz, lienzo, alRedimensionar) {
    this.raiz = raiz;
    this.lienzo = lienzo;
    this.alRedimensionar = alRedimensionar;
    this.ancho = 1;
    this.alto = 1;
    this.dpr = 1;
    this.topeDpr = CONFIG.PERF.dprMax;

    this.observador = new ResizeObserver(() => this.medir());
    this.observador.observe(raiz);
    this.medir();
  }

  medir() {
    const caja = this.raiz.getBoundingClientRect();
    const w = Math.max(1, Math.round(caja.width));
    const h = Math.max(1, Math.round(caja.height));
    const dpr = Math.min(window.devicePixelRatio || 1, this.topeDpr);
    if (w === this.ancho && h === this.alto && dpr === this.dpr) return;

    this.ancho = w;
    this.alto = h;
    this.dpr = dpr;
    this.lienzo.width = Math.round(w * dpr);
    this.lienzo.height = Math.round(h * dpr);
    this.lienzo.style.width = w + "px";
    this.lienzo.style.height = h + "px";
    this.alRedimensionar?.(this);
  }

  get medida() { return Math.min(this.ancho, this.alto); }

  destruir() { this.observador.disconnect(); }
}

// ══════════════════════════════════════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════════════════════════════════════

class AudioManager {
  constructor() {
    this.ctx = null;
    this.maestro = null;
    this.encendido = false;
    this.listo = false;
  }

  despertar() {
    if (this.listo) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.maestro = this.ctx.createGain();
      this.maestro.gain.value = 0;
      this.maestro.connect(this.ctx.destination);
      this.listo = true;
    } catch { this.listo = false; }
  }

  alternar() {
    this.despertar();
    if (!this.listo) return false;
    this.encendido = !this.encendido;
    if (this.encendido && this.ctx.state === "suspended") this.ctx.resume();
    const t = this.ctx.currentTime;
    this.maestro.gain.cancelScheduledValues(t);
    this.maestro.gain.setTargetAtTime(this.encendido ? 0.32 : 0, t, 0.08);
    return this.encendido;
  }

  #tono(frec, dur, tipo, vol, hasta) {
    if (!this.listo || !this.encendido) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = tipo || "sine";
    o.frequency.setValueAtTime(frec, t);
    if (hasta) o.frequency.exponentialRampToValueAtTime(Math.max(40, hasta), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.maestro);
    o.start(t);
    o.stop(t + dur + 0.05);
  }

  tocar()    { this.#tono(680, 0.1, "sine", 0.10, 940); }
  enviar()   { this.#tono(520, 0.13, "triangle", 0.05, 720); }
  recibir()  { this.#tono(880, 0.2, "sine", 0.07); this.#tono(1320, 0.26, "sine", 0.035); }
  latido()   { this.#tono(160, 0.16, "sine", 0.14, 90); setTimeout(() => this.#tono(150, 0.2, "sine", 0.1, 84), 170); }
  encuentro() {
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) =>
      setTimeout(() => this.#tono(f, 1.1, "sine", 0.075), i * 130));
  }
  secreto()  { [660, 880, 1100].forEach((f, i) => setTimeout(() => this.#tono(f, 0.5, "sine", 0.06), i * 90)); }
}

// ══════════════════════════════════════════════════════════════════════
//  PARTÍCULAS
// ══════════════════════════════════════════════════════════════════════

/* Tipos: 0 polvo · 1 destello · 2 corazón · 3 estrella · 4 chispa del hilo */
class ParticleSystem {
  constructor(maximo) {
    this.max = maximo;
    this.x = new Float32Array(maximo);
    this.y = new Float32Array(maximo);
    this.vx = new Float32Array(maximo);
    this.vy = new Float32Array(maximo);
    this.vida = new Float32Array(maximo);
    this.maxVida = new Float32Array(maximo);
    this.tam = new Float32Array(maximo);
    this.tipo = new Float32Array(maximo);
    this.giro = new Float32Array(maximo);
    this.giroV = new Float32Array(maximo);
    this.grav = new Float32Array(maximo);
    this.tono = new Float32Array(maximo);
    this.alfa = new Float32Array(maximo);
    this.viva = new Uint8Array(maximo);
    this.cursor = 0;
    this.vivas = 0;
  }

  soltar(x, y, o) {
    for (let i = 0; i < this.max; i++) {
      const k = (this.cursor + i) % this.max;
      if (this.viva[k]) continue;
      this.cursor = (k + 1) % this.max;
      this.viva[k] = 1;
      this.x[k] = x; this.y[k] = y;
      this.vx[k] = o.vx || 0; this.vy[k] = o.vy || 0;
      this.vida[k] = 0;
      this.maxVida[k] = o.vida || 1;
      this.tam[k] = o.tam || 3;
      this.tipo[k] = o.tipo || 0;
      this.giro[k] = o.giro || 0;
      this.giroV[k] = o.giroV || 0;
      this.grav[k] = o.grav === undefined ? 0 : o.grav;
      this.tono[k] = o.tono || 0;
      this.alfa[k] = 0;
      return k;
    }
    return -1;
  }

  mover(dt, atractor) {
    let vivas = 0;
    for (let i = 0; i < this.max; i++) {
      if (!this.viva[i]) continue;
      this.vida[i] += dt;
      if (this.vida[i] >= this.maxVida[i]) { this.viva[i] = 0; this.alfa[i] = 0; continue; }

      this.vy[i] += this.grav[i] * dt;

      if (atractor && this.tipo[i] === 0) {
        const dx = atractor.x - this.x[i];
        const dy = atractor.y - this.y[i];
        const d2 = dx * dx + dy * dy;
        if (d2 < atractor.r * atractor.r && d2 > 1) {
          const f = (1 - Math.sqrt(d2) / atractor.r) * atractor.fuerza * dt;
          this.vx[i] += dx * f;
          this.vy[i] += dy * f;
        }
      }

      const roce = Math.pow(0.24, dt);
      this.vx[i] *= roce;
      this.vy[i] *= roce;
      this.x[i] += this.vx[i] * dt;
      this.y[i] += this.vy[i] * dt;
      this.giro[i] += this.giroV[i] * dt;

      const k = this.vida[i] / this.maxVida[i];
      this.alfa[i] = smoothstep(k / 0.14) * (1 - smoothstep((k - 0.6) / 0.4));
      vivas++;
    }
    this.vivas = vivas;
  }
}

// ══════════════════════════════════════════════════════════════════════
//  WEBGL2
// ══════════════════════════════════════════════════════════════════════

const VS_QUAD = `#version 300 es
in vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

/* ── FONDO ─────────────────────────────────────────────────────────────
   Un cielo nocturno sobrio. Ni nebulosas saturadas ni bokeh: un
   degradado cálido de arriba abajo, unas pocas estrellas pequeñas, un
   resplandor muy suave alrededor de cada esfera y —lo que da el 2.5D—
   una sombra difusa proyectada por debajo de cada una, como si flotaran
   sobre el cielo. */

const FS_FONDO = `#version 300 es
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform vec2  uRosa;
uniform vec2  uVerde;
uniform float uRadio;      // radio de las esferas, normalizado a la altura
uniform float uCerca;
uniform float uFinal;
uniform float uCorazon;
uniform float uLuna;
uniform float uLunaGuino;
uniform vec2  uLunaPos;
uniform vec2  uDedo;
uniform float uCalidad;

out vec4 oColor;

float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

float ruido(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1,0)), u.x),
             mix(hash(i + vec2(0,1)), hash(i + vec2(1,1)), u.x), u.y);
}

float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * ruido(p); p *= 2.07; a *= 0.5; }
  return v;
}

float sdCorazon(vec2 p) {
  p.x = abs(p.x);
  if (p.y + p.x > 1.0)
    return sqrt(dot(p - vec2(0.25, 0.75), p - vec2(0.25, 0.75))) - sqrt(2.0) / 4.0;
  return sqrt(min(dot(p - vec2(0.0, 1.0), p - vec2(0.0, 1.0)),
                  dot(p - 0.5 * max(p.x + p.y, 0.0), p - 0.5 * max(p.x + p.y, 0.0)))) * sign(p.x - p.y);
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 p = uv;
  p.y = 1.0 - p.y;                         // y hacia abajo, como el DOM
  float aspecto = uRes.x / max(uRes.y, 1.0);
  vec2 c = (p - 0.5) * vec2(aspecto, 1.0);

  // ── 1 · El cielo: dos tonos cálidos, apenas insinuados ─────────
  float radial = length(c);
  vec3 arriba = vec3(0.052, 0.036, 0.058);   // ciruela muy oscuro
  vec3 abajo  = vec3(0.100, 0.064, 0.084);   // vino cálido
  vec3 color = mix(abajo, arriba, smoothstep(0.0, 0.9, p.y + radial * 0.25));

  // ── 2 · La sombra proyectada (2.5D) ────────────────────────────
  // Un óvalo difuso por debajo-derecha de cada esfera. Se dibuja ANTES
  // que ellas, así que cuando lleguen sólo se verá el reborde que
  // sobresale —exactamente lo que pasa con una sombra de verdad—. Es lo
  // que las hace flotar sobre el cielo en vez de ser pegatinas.
  float rSombra = uRadio * 2.4;
  vec2 dRs = (p - uRosa) * vec2(aspecto, 1.0) - vec2(uRadio * 0.10, uRadio * 0.40);
  vec2 dVs = (p - uVerde) * vec2(aspecto, 1.0) - vec2(uRadio * 0.10, uRadio * 0.40);
  float sombraR = exp(-dot(dRs, dRs) / (rSombra * rSombra)) * 0.55;
  float sombraV = exp(-dot(dVs, dVs) / (rSombra * rSombra)) * 0.55;
  color *= 1.0 - clamp(sombraR + sombraV, 0.0, 0.65);

  // ── 3 · El resplandor de cada esfera sobre el cielo ────────────
  vec2 dr = (p - uRosa) * vec2(aspecto, 1.0);
  vec2 dv = (p - uVerde) * vec2(aspecto, 1.0);
  float haloR = exp(-dot(dr, dr) / (uRadio * uRadio * 18.0));
  float haloV = exp(-dot(dv, dv) / (uRadio * uRadio * 18.0));
  color += vec3(0.34, 0.14, 0.20) * haloR * (0.55 + uCerca * 0.4);
  color += vec3(0.14, 0.26, 0.19) * haloV * (0.55 + uCerca * 0.4);

  // Y entre las dos, cuando se acercan, una bruma cálida compartida.
  vec2 medio = (uRosa + uVerde) * 0.5;
  vec2 dm = (p - medio) * vec2(aspecto, 1.0);
  float entre = exp(-dot(dm, dm) / (uRadio * uRadio * 14.0));
  color += vec3(0.30, 0.16, 0.22) * entre * uCerca * uCerca * 0.55;

  // ── 4 · Las estrellas: pocas, pequeñas, quietas ────────────────
  // Sólo dos capas y con umbral alto: el cielo tiene que respirar. La
  // primera capa casi ni se mueve; la segunda tiene un pelín más de
  // parallax, que es lo único que hace falta para dar profundidad.
  for (int capa = 0; capa < 2; capa++) {
    float f = float(capa);
    float escala = 68.0 + f * 48.0;
    vec2 desliz = uDedo * (0.003 + f * 0.005);
    vec2 g = (p + desliz) * escala * vec2(aspecto, 1.0);
    vec2 id = floor(g);
    float r = hash(id + f * 17.0);
    if (r > 0.993 - f * 0.003) {
      vec2 centro = vec2(hash(id + 3.3), hash(id + 7.7)) * 0.7 + 0.15;
      float d = length(fract(g) - centro);
      float brillo = exp(-d * d * (140.0 - f * 30.0));
      float centelleo = 0.72 + 0.28 * sin(uTime * (0.7 + r * 1.2) + r * 60.0);
      float tinte = hash(id + f * 5.5);
      vec3 tono = mix(vec3(0.96, 0.92, 0.88), vec3(0.88, 0.92, 1.00), step(0.72, tinte));
      color += tono * brillo * centelleo * (0.30 + f * 0.20);
    }
  }

  // ── 5 · El corazón escondido ──────────────────────────────────
  if (uCorazon > 0.001) {
    vec2 hp = c / 0.42;
    hp.y = -hp.y + 0.28;
    float d = sdCorazon(hp);
    float borde = exp(-abs(d) * 14.0);
    float dentro = smoothstep(0.02, -0.12, d);
    color += vec3(0.62, 0.20, 0.28) * borde * uCorazon * 0.36;
    color += vec3(0.30, 0.09, 0.14) * dentro * uCorazon * 0.12;
  }

  // ── 5b · El guiño de la luna ──────────────────────────────────
  if (uLunaGuino > 0.001) {
    vec2 dg = (p - uLunaPos) * vec2(aspecto, 1.0);
    float d = length(dg);
    float r = 0.019;
    float disco = smoothstep(r, r * 0.72, d);
    float mordida = smoothstep(r * 0.94, r * 0.66, length(dg - vec2(r * 0.42, -r * 0.2)));
    float creciente = clamp(disco - mordida, 0.0, 1.0);
    float latido = 0.76 + 0.24 * sin(uTime * 1.2);
    color += vec3(0.94, 0.92, 0.88) * creciente * uLunaGuino * latido * 0.9;
    color += vec3(0.84, 0.86, 0.94) * exp(-d * 28.0) * uLunaGuino * latido * 0.45;
  }

  // ── 6 · La luna ───────────────────────────────────────────────
  if (uLuna > 0.001) {
    color = mix(color, color * vec3(0.55, 0.60, 0.85) + vec3(0.008, 0.012, 0.035), uLuna * 0.85);
    vec2 cl = c - vec2(0.0, -0.14);
    float d = length(cl);
    float r = min(0.155, aspecto * 0.24);
    float disco = smoothstep(r, r - 0.004, d);
    float mares = fbm(cl * (2.2 / r) + 2.0);
    vec3 luna = mix(vec3(0.92, 0.90, 0.86), vec3(0.66, 0.65, 0.70), smoothstep(0.35, 0.75, mares));
    luna *= 0.76 + 0.24 * sqrt(max(0.0, 1.0 - pow(d / r, 2.0)));
    color = mix(color, luna, disco * uLuna);
    color += vec3(0.84, 0.86, 0.94) * exp(-pow(max(d - r, 0.0) * 9.0, 1.3)) * uLuna * 0.22;
  }

  // ── 7 · El destello del encuentro ─────────────────────────────
  color += vec3(0.94, 0.74, 0.78) * uFinal * 0.30 * exp(-radial * 1.2);

  // Viñeta y tramado.
  color *= 1.0 - smoothstep(0.55, 1.30, radial) * 0.38;
  color += (hash(gl_FragCoord.xy + uTime) - 0.5) * 0.005;

  oColor = vec4(color, 1.0);
}`;

/* ── LAS ESFERAS ───────────────────────────────────────────────────────
   Farolillos de papel, en 2.5D.

   Dos dimensiones con una sola pista de profundidad: la luz viene de
   arriba-izquierda y siempre de ahí. Eso se traduce en tres cosas muy
   concretas dentro del disco —un degradado que va del claro (arriba-
   izquierda) al hondo (abajo-derecha), un filo iluminado en el borde
   que mira a la luz y un borde oscurecido en el contrario—. Nada de
   normales, nada de especular, nada de reflejos de tres puntos. Un
   gradiente y dos filos: es todo lo que hace falta para que lean como
   esferas sin que pesen.

   Fuera del cuerpo queda un halo muy suave y, opcional, un aro
   finísimo. Ese aro es la única joya; sobra todo lo demás. */

const FS_ESFERA = `#version 300 es
precision highp float;

uniform vec2  uRes;
uniform vec2  uCentro;
uniform float uRadio;
uniform vec3  uColor;
uniform vec3  uColorHondo;
uniform float uTime;
uniform float uBrillo;
uniform float uPulso;
uniform float uSemilla;

out vec4 oColor;

void main() {
  vec2 px = gl_FragCoord.xy;
  px.y = uRes.y - px.y;
  vec2 d = px - uCentro;
  float r = uRadio;
  float dist = length(d);

  float alcance = r * 4.0;
  if (dist > alcance) discard;

  float k = dist / r;
  float encendido = uBrillo * 0.5 + uPulso;

  // El ángulo que usamos para orientar la luz y el aro.
  float ang = atan(d.y, d.x);
  float luzDir = -2.36;   // arriba-izquierda, en estas coordenadas

  // ═══ 1 · Halo: muy suave, muy abierto, respira despacio ═════════
  float respiracion = 0.92 + 0.08 * sin(uTime * 1.2 + uSemilla * 6.0);
  float halo = exp(-pow(dist / (r * 1.95), 1.6)) * respiracion;
  halo *= (0.30 + encendido * 0.65);
  vec3 haloColor = uColor * halo;

  // ═══ 2 · Aro: fino, con un pelo de aire, se abre y se cierra ════
  float anilloR = r * 1.14 + uPulso * r * 0.10;
  float anillo = exp(-pow((dist - anilloR) / (r * 0.045), 2.0));
  float corte = 0.62 + 0.38 * cos(ang * 2.0 + uTime * 0.35 + uSemilla * 4.0);
  float pesoAnillo = (1.0 - smoothstep(r * 0.98, r * 1.02, dist)) * anillo * corte;
  pesoAnillo *= 0.30 + encendido * 0.55;
  vec3 ringColor = uColor * pesoAnillo * 0.9;

  // ═══ 3 · Cuerpo: degradado direccional + filos ═════════════════
  float filo = smoothstep(r, r - 1.8, dist);
  vec3 cuerpo = vec3(0.0);

  if (filo > 0.001) {
    // Gradiente direccional. El coseno con el ángulo de la luz nos da
    // 1.0 justo enfrente de la luz y 0.0 justo detrás. Elevado a un
    // exponente suave reparte el color por casi todo el disco.
    float luz = 0.5 + 0.5 * cos(ang - luzDir);
    luz = pow(clamp(luz, 0.0, 1.0), 0.85);
    cuerpo = mix(uColorHondo, uColor, luz);

    // Un puntito extra de claridad donde más pega la luz. Se consigue
    // desplazando el centro de un pequeño radial hacia arriba-izquierda:
    // no es una luz física, es un truco de ilustrador, y funciona.
    vec2 centroLuz = vec2(cos(luzDir), sin(luzDir)) * r * 0.34;
    float dLuz = length(d - centroLuz) / r;
    cuerpo += uColor * 0.16 * exp(-dLuz * dLuz * 3.2);

    // Brillo del corazón. Flojo en reposo, sube al recibir algo.
    cuerpo += uColor * exp(-k * k * 5.0) * (0.06 + uPulso * 0.42);

    // Filo iluminado: una banda estrecha pegada al canto, sólo por el
    // lado que mira a la luz. Sin esto, la esfera parecería recortada.
    float bandaFilo = smoothstep(0.80, 0.99, k) * smoothstep(1.00, 0.94, k);
    float haciaLuz = smoothstep(0.15, 1.0, cos(ang - luzDir));
    cuerpo += vec3(0.98, 0.94, 0.92) * bandaFilo * haciaLuz * 0.42;

    // Y en el lado contrario, un oscurecimiento breve para que el canto
    // no sea simétrico. Es lo que separa un dibujo con luz de un
    // dibujo sin ella.
    float haciaSombra = smoothstep(0.15, 1.0, -cos(ang - luzDir));
    cuerpo = mix(cuerpo, uColorHondo * 0.72, bandaFilo * haciaSombra * 0.55);

    // La subida de brillo al tocarla se aplica al cuerpo entero.
    cuerpo *= 1.0 + uBrillo * 0.35;
  }

  // ═══ 4 · Composición ═══════════════════════════════════════════
  // Premultiplicado, mezcla ONE/ONE_MINUS_SRC_ALPHA.
  // · Dentro del cuerpo: alfa=1, color=cuerpo → tapa el fondo.
  // · Fuera: alfa=0, color=halo+aro → se SUMA al fondo (es luz).
  // · En el filo antialias: las dos cosas mezcladas por igual.
  vec3 aditivo = haloColor + ringColor;
  vec3 finalRGB = filo * cuerpo + (1.0 - filo) * aditivo;
  float finalA = filo;

  if (finalA < 0.002 && dot(finalRGB, finalRGB) < 0.0001) discard;
  oColor = vec4(finalRGB, finalA);
}`;

/* ── EL LISTÓN ─────────────────────────────────────────────────────────
   Fino, sedoso, con un degradado a lo ancho: los cantos más hondos y el
   centro claro. Eso es todo lo que hace falta para que lea como cinta y
   no como línea. */

const VS_LISTON = `#version 300 es
in vec2  aPos;
in float aLado;
in float aLargo;
uniform vec2 uRes;
out float vLado;
out float vLargo;
void main() {
  vLado = aLado;
  vLargo = aLargo;
  vec2 c = aPos / uRes * 2.0 - 1.0;
  gl_Position = vec4(c.x, -c.y, 0.0, 1.0);
}`;

const FS_LISTON = `#version 300 es
precision highp float;
in float vLado;
in float vLargo;
uniform float uTime;
uniform float uTension;
uniform float uFinal;
out vec4 oColor;

void main() {
  // Distancia al centro de la cinta: 1 en el eje, 0 en los cantos.
  float borde = 1.0 - abs(vLado);

  // El cuerpo: gaussiana suave, sin cantos duros.
  float cuerpo = pow(borde, 1.15);

  // Paleta: carmesí apagado, no rojo de semáforo.
  vec3 hondo  = vec3(0.48, 0.16, 0.20);
  vec3 medio  = vec3(0.72, 0.28, 0.32);
  vec3 claro  = vec3(0.90, 0.50, 0.52);
  vec3 color = mix(hondo, claro, pow(borde, 1.4));
  color = mix(color, medio, (1.0 - borde) * 0.35);

  // Un brillo lento que recorre la cinta, muy tenue.
  float recorrido = sin(vLargo * 4.5 - uTime * 0.75) * 0.5 + 0.5;
  recorrido = pow(recorrido, 14.0);
  color += vec3(0.55, 0.35, 0.38) * recorrido * cuerpo * 0.35;

  // Tensa: se aclara un poco y se afina. Floja: más ancha y mate.
  color = mix(color, vec3(0.92, 0.74, 0.76), uTension * 0.35);
  float alfa = cuerpo * (0.82 + uTension * 0.14 + uFinal * 0.05);
  color *= 1.0 + uFinal * 0.45;

  oColor = vec4(color * alfa, alfa);
}`;

/* ── PARTÍCULAS ────────────────────────────────────────────────────────
   Paleta suavizada: nada de rosas chicle ni verdes fluorescentes, sólo
   tonos que ya viven en el cielo. */

const VS_PART = `#version 300 es
in vec2  aPos;
in float aTam;
in float aAlfa;
in float aTipo;
in float aGiro;
in float aTono;
uniform vec2 uRes;
out float vAlfa;
out float vTipo;
out float vGiro;
out float vTono;
void main() {
  vAlfa = aAlfa; vTipo = aTipo; vGiro = aGiro; vTono = aTono;
  vec2 c = aPos / uRes * 2.0 - 1.0;
  gl_Position = vec4(c.x, -c.y, 0.0, 1.0);
  gl_PointSize = aTam;
}`;

const FS_PART = `#version 300 es
precision mediump float;
in float vAlfa;
in float vTipo;
in float vGiro;
in float vTono;
out vec4 oColor;

float corazon(vec2 p) {
  p.y = -p.y - 0.06;
  float a = p.x * p.x + p.y * p.y - 0.34;
  return a * a * a - p.x * p.x * p.y * p.y * p.y;
}

void main() {
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float c = cos(vGiro), s = sin(vGiro);
  vec2 pr = vec2(p.x * c - p.y * s, p.x * s + p.y * c);

  float a = vAlfa;
  if (vTipo < 0.5) {                    // polvo
    a *= exp(-dot(p, p) * 2.2);
  } else if (vTipo < 1.5) {             // destello
    float l = length(p);
    a *= exp(-l * l * 3.0);
  } else if (vTipo < 2.5) {             // corazón
    a *= 1.0 - smoothstep(-0.02, 0.07, corazon(pr * 1.3));
  } else if (vTipo < 3.5) {             // estrella de cuatro puntas
    vec2 q = abs(pr);
    a *= 1.0 - smoothstep(0.22, 0.86, (q.x + q.y) * 0.75 + max(q.x, q.y) * 0.25);
  } else {                              // chispa del hilo
    vec2 q = pr * vec2(1.0, 2.6);
    a *= exp(-dot(q, q) * 3.0);
  }

  // Paleta empolvada — todos los tonos existen ya en el cielo.
  vec3 col =
      vTono < 0.5 ? vec3(0.94, 0.80, 0.84)      // rosa pálido
    : vTono < 1.5 ? vec3(0.82, 0.92, 0.86)      // verde salvia claro
    : vTono < 2.5 ? vec3(0.84, 0.42, 0.46)      // carmesí apagado
    :               vec3(0.96, 0.90, 0.78);     // oro suave

  if (a <= 0.004) discard;
  oColor = vec4(col * a, a);
}`;

class WebGLRenderer {
  constructor(lienzo) {
    this.lienzo = lienzo;
    this.ok = false;
    try {
      this.gl = lienzo.getContext("webgl2", {
        alpha: false, antialias: false, depth: false, stencil: false,
        premultipliedAlpha: true, powerPreference: "high-performance",
      });
    } catch { this.gl = null; }
    if (!this.gl) return;
    this.ok = this.#montar();
  }

  #compilar(tipo, fuente) {
    const gl = this.gl;
    const s = gl.createShader(tipo);
    gl.shaderSource(s, fuente);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn("[hilo] shader:", gl.getShaderInfoLog(s));
      return null;
    }
    return s;
  }

  #programa(vs, fs) {
    const gl = this.gl;
    const v = this.#compilar(gl.VERTEX_SHADER, vs);
    const f = this.#compilar(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return null;
    const p = gl.createProgram();
    gl.attachShader(p, v); gl.attachShader(p, f); gl.linkProgram(p);
    gl.deleteShader(v); gl.deleteShader(f);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.warn("[hilo] enlace:", gl.getProgramInfoLog(p));
      return null;
    }
    return p;
  }

  #uniformes(prog, nombres) {
    const u = {};
    for (const n of nombres) u[n] = this.gl.getUniformLocation(prog, n);
    return u;
  }

  #montar() {
    const gl = this.gl;

    this.pFondo = this.#programa(VS_QUAD, FS_FONDO);
    this.pEsfera = this.#programa(VS_QUAD, FS_ESFERA);
    this.pListon = this.#programa(VS_LISTON, FS_LISTON);
    this.pPart = this.#programa(VS_PART, FS_PART);
    if (!this.pFondo || !this.pEsfera || !this.pListon || !this.pPart) return false;

    this.uFondo = this.#uniformes(this.pFondo,
      ["uRes","uTime","uRosa","uVerde","uRadio","uCerca","uFinal","uCorazon","uLuna","uLunaGuino","uLunaPos","uDedo","uCalidad"]);
    this.uEsfera = this.#uniformes(this.pEsfera,
      ["uRes","uCentro","uRadio","uColor","uColorHondo","uTime","uBrillo","uPulso","uSemilla"]);
    this.uListon = this.#uniformes(this.pListon, ["uRes","uTime","uTension","uFinal"]);
    this.uPart = this.#uniformes(this.pPart, ["uRes"]);

    this.vaoQuad = gl.createVertexArray();
    gl.bindVertexArray(this.vaoQuad);
    const bq = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bq);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    for (const prog of [this.pFondo, this.pEsfera]) {
      const loc = gl.getAttribLocation(prog, "aPos");
      if (loc >= 0) { gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0); }
    }
    gl.bindVertexArray(null);

    this.MAX_TRAMOS = 64;
    this.datosListon = new Float32Array((this.MAX_TRAMOS + 1) * 2 * 4);
    this.vaoListon = gl.createVertexArray();
    gl.bindVertexArray(this.vaoListon);
    this.bufListon = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bufListon);
    gl.bufferData(gl.ARRAY_BUFFER, this.datosListon.byteLength, gl.DYNAMIC_DRAW);
    this.#atributos(this.pListon, [["aPos",2,0],["aLado",1,8],["aLargo",1,12]], 16);
    gl.bindVertexArray(null);

    this.vaoPart = gl.createVertexArray();
    gl.bindVertexArray(this.vaoPart);
    this.bufPart = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bufPart);
    this.datosPart = new Float32Array(CONFIG.PERF.particulas * 7);
    gl.bufferData(gl.ARRAY_BUFFER, this.datosPart.byteLength, gl.DYNAMIC_DRAW);
    this.#atributos(this.pPart,
      [["aPos",2,0],["aTam",1,8],["aAlfa",1,12],["aTipo",1,16],["aGiro",1,20],["aTono",1,24]], 28);
    gl.bindVertexArray(null);

    gl.disable(gl.DEPTH_TEST);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    return true;
  }

  #atributos(prog, campos, paso) {
    const gl = this.gl;
    for (const [nombre, tam, off] of campos) {
      const loc = gl.getAttribLocation(prog, nombre);
      if (loc < 0) continue;
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, tam, gl.FLOAT, false, paso, off);
    }
  }

  redimensionar(esc) {
    if (!this.ok) return;
    this.gl.viewport(0, 0, this.lienzo.width, this.lienzo.height);
  }

  dibujar(mundo, esc) {
    if (!this.ok) return;
    const gl = this.gl;
    const W = this.lienzo.width, H = this.lienzo.height;
    const d = esc.dpr;
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    // ── Fondo ──
    gl.useProgram(this.pFondo);
    gl.bindVertexArray(this.vaoQuad);
    const u = this.uFondo;
    gl.uniform2f(u.uRes, W, H);
    gl.uniform1f(u.uTime, mundo.tiempo);
    gl.uniform2f(u.uRosa, mundo.rosa.x / esc.ancho, mundo.rosa.y / esc.alto);
    gl.uniform2f(u.uVerde, mundo.verde.x / esc.ancho, mundo.verde.y / esc.alto);
    gl.uniform1f(u.uRadio, mundo.rosa.radio / esc.alto);
    gl.uniform1f(u.uCerca, mundo.cercania);
    gl.uniform1f(u.uFinal, mundo.destello);
    gl.uniform1f(u.uCorazon, mundo.corazonFondo);
    gl.uniform1f(u.uLuna, mundo.luna);
    gl.uniform1f(u.uLunaGuino, mundo.lunaGuino);
    gl.uniform2f(u.uLunaPos, mundo.lunaPos.x, mundo.lunaPos.y);
    gl.uniform2f(u.uDedo, mundo.parallax.x, mundo.parallax.y);
    gl.uniform1f(u.uCalidad, mundo.calidad);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // ── Listón ──
    if (mundo.liston.length >= 4) {
      const n = this.#subirListon(mundo.liston, d);
      if (n >= 4) {
        gl.useProgram(this.pListon);
        gl.bindVertexArray(this.vaoListon);
        gl.uniform2f(this.uListon.uRes, W, H);
        gl.uniform1f(this.uListon.uTime, mundo.tiempo);
        gl.uniform1f(this.uListon.uTension, mundo.tension);
        gl.uniform1f(this.uListon.uFinal, mundo.destello);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, n);
      }
    }

    // ── Las dos esferas ──
    gl.useProgram(this.pEsfera);
    gl.bindVertexArray(this.vaoQuad);
    for (const o of [mundo.verde, mundo.rosa]) {
      const e = this.uEsfera;
      gl.uniform2f(e.uRes, W, H);
      gl.uniform2f(e.uCentro, o.x * d, o.y * d);
      gl.uniform1f(e.uRadio, o.radio * d);
      gl.uniform3fv(e.uColor, o.color);
      gl.uniform3fv(e.uColorHondo, o.colorHondo);
      gl.uniform1f(e.uTime, mundo.tiempo);
      gl.uniform1f(e.uBrillo, o.brillo);
      gl.uniform1f(e.uPulso, o.pulso);
      gl.uniform1f(e.uSemilla, o.semilla);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    // ── Partículas ──
    const np = this.#subirParticulas(mundo.particulas, d);
    if (np > 0) {
      gl.useProgram(this.pPart);
      gl.bindVertexArray(this.vaoPart);
      gl.uniform2f(this.uPart.uRes, W, H);
      gl.drawArrays(gl.POINTS, 0, np);
    }
    gl.bindVertexArray(null);
  }

  #subirListon(puntos, dpr) {
    const gl = this.gl;
    const n = Math.min(puntos.length, this.MAX_TRAMOS + 1);
    const datos = this.datosListon;
    for (let i = 0; i < n; i++) {
      const p = puntos[i];
      const k = i / (n - 1);
      const o = i * 8;
      datos[o]     = (p.x - p.nx * p.ancho) * dpr;
      datos[o + 1] = (p.y - p.ny * p.ancho) * dpr;
      datos[o + 2] = -1;
      datos[o + 3] = k;
      datos[o + 4] = (p.x + p.nx * p.ancho) * dpr;
      datos[o + 5] = (p.y + p.ny * p.ancho) * dpr;
      datos[o + 6] = 1;
      datos[o + 7] = k;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bufListon);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, datos, 0, n * 8);
    return n * 2;
  }

  #subirParticulas(ps, dpr) {
    const gl = this.gl;
    const datos = this.datosPart;
    let n = 0;
    const tope = Math.min(ps.max, (datos.length / 7) | 0);
    for (let i = 0; i < ps.max && n < tope; i++) {
      if (!ps.viva[i] || ps.alfa[i] <= 0.004) continue;
      const o = n * 7;
      datos[o]     = ps.x[i] * dpr;
      datos[o + 1] = ps.y[i] * dpr;
      datos[o + 2] = ps.tam[i] * dpr;
      datos[o + 3] = ps.alfa[i];
      datos[o + 4] = ps.tipo[i];
      datos[o + 5] = ps.giro[i];
      datos[o + 6] = ps.tono[i];
      n++;
    }
    if (n === 0) return 0;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.bufPart);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, datos, 0, n * 7);
    return n;
  }
}

// ══════════════════════════════════════════════════════════════════════
//  RESPALDO — misma escena con Canvas 2D
// ══════════════════════════════════════════════════════════════════════

class FallbackRenderer {
  constructor(lienzo) {
    this.lienzo = lienzo;
    this.ctx = lienzo.getContext("2d");
    this.ok = !!this.ctx;
    this.estrellas = [];
  }

  redimensionar(esc) {
    const cuantas = Math.round((esc.ancho * esc.alto) / 7200);
    this.estrellas.length = 0;
    for (let i = 0; i < cuantas; i++) {
      this.estrellas.push({
        x: Math.random() * esc.ancho, y: Math.random() * esc.alto,
        r: azar(0.4, 1.3), f: azar(0.5, 1.8), d: azar(0, 6.28),
        t: Math.random() < 0.3 ? 1 : 0,
      });
    }
  }

  dibujar(mundo, esc) {
    const c = this.ctx;
    const { ancho: W, alto: H, dpr } = esc;
    c.save();
    c.scale(dpr, dpr);

    // Cielo: dos tonos cálidos, apenas insinuados.
    const cielo = c.createLinearGradient(0, 0, 0, H);
    cielo.addColorStop(0, "#0d0810");
    cielo.addColorStop(1, "#1a1018");
    c.fillStyle = cielo;
    c.fillRect(0, 0, W, H);

    // Resplandores suaves alrededor de cada esfera.
    for (const [o, col] of [[mundo.rosa, "232,168,184"], [mundo.verde, "168,200,176"]]) {
      const g = c.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.radio * 5.5);
      g.addColorStop(0, `rgba(${col},0.18)`);
      g.addColorStop(0.5, `rgba(${col},0.05)`);
      g.addColorStop(1, `rgba(${col},0)`);
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);
    }

    // Estrellas.
    for (const s of this.estrellas) {
      const alfa = 0.30 + 0.42 * (0.5 + 0.5 * Math.sin(mundo.tiempo * s.f + s.d));
      c.fillStyle = s.t ? `rgba(225,235,255,${alfa})` : `rgba(250,240,230,${alfa})`;
      c.fillRect(s.x, s.y, s.r, s.r);
    }

    // Corazón escondido.
    if (mundo.corazonFondo > 0.01) {
      c.save();
      c.globalAlpha = mundo.corazonFondo * 0.36;
      c.strokeStyle = "#b03850";
      c.lineWidth = 1.6;
      this.#trazarCorazon(c, W / 2, H * 0.5, Math.min(W, H) * 0.3);
      c.stroke();
      c.restore();
    }

    // Luna.
    if (mundo.luna > 0.01) {
      c.save();
      c.globalAlpha = mundo.luna * 0.75;
      c.fillStyle = "#10142e";
      c.fillRect(0, 0, W, H);
      c.globalAlpha = mundo.luna;
      const r = Math.min(W, H) * 0.17;
      const g = c.createRadialGradient(W / 2, H * 0.34, r * 0.2, W / 2, H * 0.34, r * 2.4);
      g.addColorStop(0, "rgba(240,240,255,0.45)");
      g.addColorStop(1, "rgba(240,240,255,0)");
      c.fillStyle = g;
      c.fillRect(0, 0, W, H);
      c.fillStyle = "#ebe8e0";
      c.beginPath(); c.arc(W / 2, H * 0.34, r, 0, Math.PI * 2); c.fill();
      c.restore();
    }

    // Listón.
    if (mundo.liston.length > 2) {
      c.save();
      c.lineCap = "round";
      // Sombra proyectada (2.5D).
      c.strokeStyle = "rgba(0,0,0,0.28)";
      c.lineWidth = 5.5 + mundo.tension * 1.2;
      c.beginPath();
      c.moveTo(mundo.liston[0].x, mundo.liston[0].y + 1.4);
      for (const p of mundo.liston) c.lineTo(p.x, p.y + 1.4);
      c.stroke();
      // Cuerpo del hilo.
      c.strokeStyle = `rgba(190,70,90,${0.72 + mundo.tension * 0.18})`;
      c.lineWidth = 3.6 + mundo.tension * 1.1;
      c.beginPath();
      c.moveTo(mundo.liston[0].x, mundo.liston[0].y);
      for (const p of mundo.liston) c.lineTo(p.x, p.y);
      c.stroke();
      // Reflejo claro en el centro.
      c.strokeStyle = `rgba(235,150,160,${0.5 + mundo.tension * 0.2})`;
      c.lineWidth = 1.4;
      c.beginPath();
      c.moveTo(mundo.liston[0].x, mundo.liston[0].y);
      for (const p of mundo.liston) c.lineTo(p.x, p.y);
      c.stroke();
      c.restore();
    }

    // Esferas: sombra proyectada, resplandor, cuerpo con luz direccional.
    const t = mundo.tiempo || 0;
    for (const o of [mundo.verde, mundo.rosa]) {
      const rosa = o === mundo.rosa;
      const claro  = rosa ? "#fbdfe6" : "#e4f3e6";
      const medio  = rosa ? "#e8a8b8" : "#a8c8b0";
      const hondo  = rosa ? "#8a5060" : "#587868";
      const rgb    = rosa ? "232,168,184" : "168,200,176";
      const enc = (o.brillo || 0) * 0.5 + (o.pulso || 0);

      // 1 · Sombra proyectada, desplazada abajo-derecha.
      c.save();
      c.globalAlpha = 0.42;
      const sx = o.x + o.radio * 0.10;
      const sy = o.y + o.radio * 0.42;
      const gs = c.createRadialGradient(sx, sy, o.radio * 0.2, sx, sy, o.radio * 2.2);
      gs.addColorStop(0, "rgba(0,0,0,0.55)");
      gs.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = gs;
      c.beginPath();
      c.ellipse(sx, sy, o.radio * 2.1, o.radio * 1.7, 0, 0, Math.PI * 2);
      c.fill();
      c.restore();

      // 2 · Resplandor.
      const aura = c.createRadialGradient(o.x, o.y, o.radio * 0.4, o.x, o.y, o.radio * 2.6);
      aura.addColorStop(0, `rgba(${rgb},${0.28 * (1 + enc * 0.5)})`);
      aura.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = aura;
      c.beginPath(); c.arc(o.x, o.y, o.radio * 2.6, 0, Math.PI * 2); c.fill();

      // 3 · Cuerpo con luz desde arriba-izquierda.
      //    El centro del gradiente está desplazado hacia el noroeste: eso
      //    es toda la pista de profundidad que necesita para leerse 2.5D.
      const g = c.createRadialGradient(
        o.x - o.radio * 0.38, o.y - o.radio * 0.38, o.radio * 0.10,
        o.x, o.y, o.radio
      );
      g.addColorStop(0.00, claro);
      g.addColorStop(0.55, medio);
      g.addColorStop(1.00, hondo);
      c.fillStyle = g;
      c.beginPath(); c.arc(o.x, o.y, o.radio, 0, Math.PI * 2); c.fill();

      // 4 · Filo iluminado (arco arriba-izquierda).
      c.save();
      c.globalAlpha = 0.42 + enc * 0.25;
      c.strokeStyle = claro;
      c.lineWidth = Math.max(1, o.radio * 0.07);
      c.beginPath();
      c.arc(o.x, o.y, o.radio * 0.93, Math.PI * 0.88, Math.PI * 1.80);
      c.stroke();
      c.restore();

      // 5 · Aro fino por fuera.
      c.save();
      c.globalAlpha = 0.42 + enc * 0.3;
      c.strokeStyle = medio;
      c.lineWidth = Math.max(0.8, o.radio * 0.05);
      c.beginPath();
      c.arc(o.x, o.y, o.radio * 1.14 + (o.pulso || 0) * o.radio * 0.10, 0, Math.PI * 2);
      c.stroke();
      c.restore();
    }

    // Partículas.
    const ps = mundo.particulas;
    for (let i = 0; i < ps.max; i++) {
      if (!ps.viva[i] || ps.alfa[i] <= 0.01) continue;
      c.globalAlpha = clamp01(ps.alfa[i]);
      const t = ps.tono[i];
      c.fillStyle = t < 0.5 ? "#e6c0c8" : t < 1.5 ? "#bcd8c2" : t < 2.5 ? "#c66a78" : "#ecdcc0";
      const s = Math.max(0.8, ps.tam[i] * 0.40);
      c.beginPath(); c.arc(ps.x[i], ps.y[i], s, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;

    if (mundo.destello > 0.01) {
      c.fillStyle = `rgba(240,200,210,${mundo.destello * 0.32})`;
      c.fillRect(0, 0, W, H);
    }
    c.restore();
  }

  #trazarCorazon(c, cx, cy, r) {
    c.beginPath();
    for (let i = 0; i <= 60; i++) {
      const t = (i / 60) * Math.PI * 2;
      const x = cx + (16 * Math.pow(Math.sin(t), 3)) / 16 * r;
      const y = cy - ((13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16) * r;
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    }
    c.closePath();
  }
}

// ══════════════════════════════════════════════════════════════════════
//  ORB
// ══════════════════════════════════════════════════════════════════════

class Orb {
  constructor(color, colorHondo, semilla) {
    this.x = 0; this.y = 0;
    this.vx = 0; this.vy = 0;
    this.radio = 30;
    this.color = new Float32Array(color);
    this.colorHondo = new Float32Array(colorHondo);
    this.semilla = semilla;
    this.brillo = 0;
    this.brilloObj = 0;
    this.pulso = 0;
    this.agarrada = false;
    this.dedoId = null;
    this.destinoX = 0; this.destinoY = 0;
    this.ultimoToque = 0;
    this.rastro = [];
  }

  golpe(fuerza = 1) {
    this.pulso = Math.min(1.6, this.pulso + fuerza);
  }

  mover(dt) {
    this.brillo = damp(this.brillo, this.brilloObj, 9, dt);
    this.pulso = damp(this.pulso, 0, 3.4, dt);
  }
}

// ══════════════════════════════════════════════════════════════════════
//  PHYSICS
// ══════════════════════════════════════════════════════════════════════

class Physics {
  constructor() {
    this.rendida = 0;
    this.atraccionExtra = 0;
  }

  paso(dt, rosa, verde, esc) {
    const F = CONFIG.FISICA;
    const radio = rosa.radio;

    for (const o of [rosa, verde]) {
      if (o.agarrada) {
        o.vx += (o.destinoX - o.x) * F.muelleDedo * dt;
        o.vy += (o.destinoY - o.y) * F.muelleDedo * dt;
      }
    }

    let dx = verde.x - rosa.x;
    let dy = verde.y - rosa.y;
    let d = Math.hypot(dx, dy) || 0.0001;
    const nx = dx / d, ny = dy / d;

    const alcance = radio * 2 * F.alcanceRepulsion;
    const minima = radio * 2 * F.minimo;

    if (d < alcance) {
      const cerca = 1 - d / alcance;
      const fuerza = F.repulsion * cerca * cerca * (1 - this.rendida);

      const arrastrando = (rosa.agarrada ? 1 : 0) + (verde.agarrada ? 1 : 0);
      if (arrastrando === 1) {
        const libre = rosa.agarrada ? verde : rosa;
        const signo = libre === verde ? 1 : -1;
        libre.vx += nx * signo * fuerza * dt;
        libre.vy += ny * signo * fuerza * dt;
      } else {
        rosa.vx -= nx * fuerza * 0.5 * dt;
        rosa.vy -= ny * fuerza * 0.5 * dt;
        verde.vx += nx * fuerza * 0.5 * dt;
        verde.vy += ny * fuerza * 0.5 * dt;
      }

      if (arrastrando > 0 && cerca > 0.35) {
        this.rendida = clamp01(this.rendida + F.rendicion * cerca * dt);
      }
    }

    if (!rosa.agarrada && !verde.agarrada) {
      this.rendida = clamp01(this.rendida - F.recuperacion * dt * 0.5);
    }

    if (this.atraccionExtra > 0 && d > minima) {
      const tiron = 90 * this.atraccionExtra;
      rosa.vx += nx * tiron * dt;  rosa.vy += ny * tiron * dt;
      verde.vx -= nx * tiron * dt; verde.vy -= ny * tiron * dt;
      this.rendida = clamp01(this.rendida + F.rendicion * 0.5 * this.atraccionExtra * dt);
    }

    if (d < minima) {
      const sobra = (minima - d) * 0.5;
      rosa.x -= nx * sobra; rosa.y -= ny * sobra;
      verde.x += nx * sobra; verde.y += ny * sobra;
      const rel = (verde.vx - rosa.vx) * nx + (verde.vy - rosa.vy) * ny;
      if (rel < 0) {
        const j = -rel * 0.32;
        rosa.vx -= nx * j; rosa.vy -= ny * j;
        verde.vx += nx * j; verde.vy += ny * j;
      }
    }

    const roce = Math.pow(CONFIG.FISICA.amortiguacion, dt * 60);
    const margen = radio * 1.15;
    for (const o of [rosa, verde]) {
      o.vx *= roce; o.vy *= roce;
      o.x += o.vx * dt;
      o.y += o.vy * dt;

      if (o.x < margen)              { o.x = lerp(o.x, margen, 0.3);              o.vx *= 0.5; }
      if (o.x > esc.ancho - margen)  { o.x = lerp(o.x, esc.ancho - margen, 0.3);  o.vx *= 0.5; }
      if (o.y < margen)              { o.y = lerp(o.y, margen, 0.3);              o.vy *= 0.5; }
      if (o.y > esc.alto - margen)   { o.y = lerp(o.y, esc.alto - margen, 0.3);   o.vy *= 0.5; }
    }

    return { d, nx, ny, minima, alcance };
  }
}

// ══════════════════════════════════════════════════════════════════════
//  RIBBON — más fino, más sedoso
// ══════════════════════════════════════════════════════════════════════

class Ribbon {
  constructor(nudos = 24) {
    this.n = nudos;
    this.px = new Float32Array(nudos);
    this.py = new Float32Array(nudos);
    this.vx = new Float32Array(nudos);
    this.vy = new Float32Array(nudos);
    this.puntos = [];
    this.iniciado = false;
    this.forma = 0;
    this.formaObj = 0;
  }

  colocar(rosa, verde) {
    for (let i = 0; i < this.n; i++) {
      const k = i / (this.n - 1);
      this.px[i] = lerp(rosa.x, verde.x, k);
      this.py[i] = lerp(rosa.y, verde.y, k);
      this.vx[i] = 0; this.vy[i] = 0;
    }
    this.iniciado = true;
  }

  mover(dt, rosa, verde, tension) {
    if (!this.iniciado) this.colocar(rosa, verde);
    this.forma = damp(this.forma, this.formaObj, 2.2, dt);

    const n = this.n;
    this.px[0] = rosa.x; this.py[0] = rosa.y;
    this.px[n - 1] = verde.x; this.py[n - 1] = verde.y;

    const rigidez = lerp(120, 420, tension);
    const roce = Math.pow(0.02, dt);
    const caida = lerp(70, 8, tension);

    for (let i = 1; i < n - 1; i++) {
      const k = i / (n - 1);
      let ox, oy;
      if (this.forma > 0.001) {
        const cx = (rosa.x + verde.x) * 0.5;
        const cy = (rosa.y + verde.y) * 0.5;
        const r = Math.max(rosa.radio, 22) * 2.9;
        const t = k * Math.PI * 2;
        const hx = cx + (16 * Math.pow(Math.sin(t), 3)) / 16 * r;
        const hy = cy - ((13 * Math.cos(t) - 5 * Math.cos(2 * t)
                        - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16) * r;
        const rectoX = lerp(rosa.x, verde.x, k);
        const rectoY = lerp(rosa.y, verde.y, k) + Math.sin(k * Math.PI) * caida;
        ox = lerp(rectoX, hx, this.forma);
        oy = lerp(rectoY, hy, this.forma);
      } else {
        ox = lerp(rosa.x, verde.x, k);
        oy = lerp(rosa.y, verde.y, k) + Math.sin(k * Math.PI) * caida;
      }

      this.vx[i] += (ox - this.px[i]) * rigidez * dt;
      this.vy[i] += (oy - this.py[i]) * rigidez * dt;
      this.vx[i] *= roce;
      this.vy[i] *= roce;
      this.px[i] += this.vx[i] * dt;
      this.py[i] += this.vy[i] * dt;
    }

    this.puntos.length = 0;
    // Más fina que antes: 4.6 en reposo, 2.6 tensa. Con estos números
    // lee como hilo y no como cinta ancha. Y se afila en las puntas para
    // meterse dentro de las esferas, no quedarse como un palo.
    const anchoBase = lerp(4.6, 2.6, tension);
    for (let i = 0; i < n; i++) {
      const k = i / (n - 1);
      const ia = Math.max(0, i - 1), ib = Math.min(n - 1, i + 1);
      let tx = this.px[ib] - this.px[ia];
      let ty = this.py[ib] - this.py[ia];
      const len = Math.hypot(tx, ty) || 1;
      tx /= len; ty /= len;
      const afilado = Math.sin(k * Math.PI) * 0.78 + 0.22;
      this.puntos.push({
        x: this.px[i], y: this.py[i],
        nx: -ty, ny: tx,
        ancho: anchoBase * afilado,
      });
    }
    return this.puntos;
  }

  punto(k) {
    const i = clamp(Math.round(k * (this.n - 1)), 0, this.n - 1);
    return { x: this.px[i], y: this.py[i] };
  }
}

// ══════════════════════════════════════════════════════════════════════
//  LETTERSYSTEM
// ══════════════════════════════════════════════════════════════════════

/* Ahora la carta es un papel crema con un sello de cera, no un sobre de
   colorines. Dos diseños —uno con lacre rosa empolvado, otro con lacre
   verde salvia— para que se distinga quién escribe sin gritar. */
const SOBRE_SVG = (color, colorHondo, sufijo) => `
<svg viewBox="0 0 34 26" width="34" height="26">
  <defs>
    <linearGradient id="papel${sufijo}" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fdf6ec"/>
      <stop offset="1" stop-color="#e8d8c4"/>
    </linearGradient>
    <radialGradient id="sello${sufijo}" cx="0.4" cy="0.35">
      <stop offset="0" stop-color="${color}"/>
      <stop offset="1" stop-color="${colorHondo}"/>
    </radialGradient>
  </defs>
  <!-- Sombra proyectada de la carta -->
  <rect x="1.6" y="3" width="32" height="22" rx="2.2" fill="rgba(0,0,0,0.28)"/>
  <!-- Papel -->
  <rect x="1" y="1.6" width="32" height="22" rx="2.2" fill="url(#papel${sufijo})"
        stroke="rgba(110,80,60,0.20)" stroke-width="0.6"/>
  <!-- Doblez superior, apenas insinuado -->
  <path d="M1.6 2.6 L17 12 L32.4 2.6" fill="none"
        stroke="rgba(110,80,60,0.14)" stroke-width="0.5"/>
  <!-- Sello de cera -->
  <circle cx="17" cy="14" r="3.6" fill="url(#sello${sufijo})"/>
  <circle cx="17" cy="14" r="3.6" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="0.5"/>
  <!-- Corazón grabado en el sello -->
  <path d="M17 15.9 C15.3 14.4 14.8 13.4 15.4 12.8 C15.9 12.3 16.5 12.5 17 13.2
           C17.5 12.5 18.1 12.3 18.6 12.8 C19.2 13.4 18.7 14.4 17 15.9 Z"
        fill="rgba(255,255,255,0.88)"/>
</svg>`;

class LetterSystem {
  constructor(capa, particulas, alLlegar) {
    this.capa = capa;
    this.ps = particulas;
    this.alLlegar = alLlegar;
    this.vivas = [];
    this.libres = [];
    this.entregadas = 0;

    for (let i = 0; i < 14; i++) {
      const el = document.createElement("div");
      el.className = "rw-carta";
      this.capa.append(el);
      this.libres.push(el);
    }
    this.svgRosa = SOBRE_SVG("#e8a8b8", "#8a5060", "r");
    this.svgVerde = SOBRE_SVG("#a8c8b0", "#587868", "v");
  }

  enviar(desde, hacia, esRosa, especial) {
    const el = this.libres.pop();
    if (!el) return null;
    el.innerHTML = esRosa ? this.svgRosa : this.svgVerde;

    const dx = hacia.x - desde.x, dy = hacia.y - desde.y;
    const dist = Math.hypot(dx, dy) || 1;
    const lado = esRosa ? 1 : -1;
    const combado = clamp(dist * 0.30, 26, 130) * lado;

    const carta = {
      el,
      x0: desde.x, y0: desde.y,
      x1: (desde.x + hacia.x) / 2 - (dy / dist) * combado,
      y1: (desde.y + hacia.y) / 2 + (dx / dist) * combado,
      hacia,
      t: 0,
      dur: clamp(dist / 260, 0.9, 2.4),
      esRosa,
      especial: !!especial,
      giro: 0,
      escala: 0,
      rastro: 0,
    };
    this.vivas.push(carta);
    return carta;
  }

  mover(dt) {
    for (let i = this.vivas.length - 1; i >= 0; i--) {
      const c = this.vivas[i];
      c.t += dt / c.dur;

      if (c.t >= 1) {
        this.#llegar(c);
        this.vivas.splice(i, 1);
        c.el.style.opacity = "0";
        this.libres.push(c.el);
        continue;
      }

      const t = c.t;
      const u = 1 - t;
      const x2 = c.hacia.x, y2 = c.hacia.y;
      const x = u * u * c.x0 + 2 * u * t * c.x1 + t * t * x2;
      const y = u * u * c.y0 + 2 * u * t * c.y1 + t * t * y2;

      const tx = 2 * u * (c.x1 - c.x0) + 2 * t * (x2 - c.x1);
      const ty = 2 * u * (c.y1 - c.y0) + 2 * t * (y2 - c.y1);
      c.giro = Math.atan2(ty, tx);

      const abre = smoothstep(t / 0.16);
      const cierra = 1 - smoothstep((t - 0.86) / 0.14);
      c.escala = (0.5 + abre * 0.5) * cierra * (c.especial ? 1.25 : 1);

      c.el.style.opacity = String(abre * cierra);
      c.el.style.transform =
        `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0)` +
        ` rotate(${(c.giro + Math.sin(t * 9) * 0.12).toFixed(3)}rad)` +
        ` scale(${c.escala.toFixed(3)})`;

      c.rastro += dt;
      if (c.rastro > 0.045) {
        c.rastro = 0;
        this.ps.soltar(x, y, {
          vx: azar(-14, 14), vy: azar(-14, 14),
          vida: azar(0.5, 1.0), tam: azar(1.8, 4.0),
          tipo: 1, tono: c.especial ? 3 : (c.esRosa ? 0 : 1),
        });
      }
    }
  }

  #llegar(c) {
    this.entregadas++;
    const { x, y } = c.hacia;
    const tono = c.especial ? 3 : (c.esRosa ? 0 : 1);
    const cuantas = c.especial ? 30 : 14;
    for (let i = 0; i < cuantas; i++) {
      const a = azar(0, Math.PI * 2);
      const v = azar(24, 110);
      this.ps.soltar(x, y, {
        vx: Math.cos(a) * v, vy: Math.sin(a) * v,
        vida: azar(0.7, 1.5), tam: azar(2.2, 5),
        tipo: i % 5 === 0 ? 2 : 1, tono,
        giro: azar(0, 6.28), giroV: azar(-3, 3),
      });
    }
    this.alLlegar?.(c);
  }

  reiniciar() {
    for (const c of this.vivas) { c.el.style.opacity = "0"; this.libres.push(c.el); }
    this.vivas.length = 0;
    this.entregadas = 0;
  }
}

// ══════════════════════════════════════════════════════════════════════
//  DISTANCESYSTEM
// ══════════════════════════════════════════════════════════════════════

class DistanceSystem {
  constructor(nodoKm, nodoSusurro) {
    this.km = nodoKm;
    this.susurro = nodoSusurro;
    this.valor = 1;
    this.ultimoTexto = "";
  }

  actualizar(dt, d, minima, maxima, juntas) {
    const bruto = clamp01((d - minima) / Math.max(1, maxima - minima));
    this.valor = damp(this.valor, bruto, 7, dt);
    const k = this.valor;

    const km = Math.pow(k, 1.6) * CONFIG.KM_MAXIMOS;

    let texto;
    if (juntas || bruto <= 0.006) texto = "0 km";
    else if (km < 0.95) texto = `${Math.max(1, Math.round(km * 1000))} m`;
    else if (km < 10) texto = `${km.toFixed(1)} km`;
    else texto = `${Math.round(km).toLocaleString("es-ES")} km`;

    if (texto !== this.ultimoTexto) {
      this.ultimoTexto = texto;
      this.km.textContent = texto;
    }

    const nivel = juntas ? 0 : bruto;
    for (const s of CONFIG.SUSURROS) {
      if (nivel <= s.hasta) {
        if (this.susurroPedido !== s.texto) {
          this.susurroPedido = s.texto;
          this.susurro.style.opacity = "0";
          clearTimeout(this._t);
          this._t = setTimeout(() => {
            this.susurro.textContent = s.texto;
            this.susurro.style.opacity = "1";
          }, this.susurro.textContent ? 220 : 0);
        }
        break;
      }
    }
    return bruto;
  }

  destruir() { clearTimeout(this._t); }
}

// ══════════════════════════════════════════════════════════════════════
//  EFFECTS
// ══════════════════════════════════════════════════════════════════════

class Effects {
  constructor(capa, esc) {
    this.capa = capa;
    this.esc = esc;
    this.vivas = [];
    this.libres = [];
    for (let i = 0; i < 9; i++) {
      const el = document.createElement("p");
      el.className = "rw-frase";
      this.capa.append(el);
      this.libres.push(el);
    }
    this.baraja = [];
  }

  #siguienteFrase() {
    if (!this.baraja.length) {
      this.baraja = CONFIG.FRASES.slice();
      for (let i = this.baraja.length - 1; i > 0; i--) {
        const j = (Math.random() * (i + 1)) | 0;
        [this.baraja[i], this.baraja[j]] = [this.baraja[j], this.baraja[i]];
      }
    }
    return this.baraja.pop();
  }

  frase(x, y, texto, larga) {
    let el = this.libres.pop();

    if (!el && larga) {
      let viejo = -1, masT = -1;
      for (let i = 0; i < this.vivas.length; i++) {
        if (this.vivas[i].el.classList.contains("rw-frase--larga")) continue;
        if (this.vivas[i].t > masT) { masT = this.vivas[i].t; viejo = i; }
      }
      if (viejo >= 0) {
        el = this.vivas[viejo].el;
        this.vivas.splice(viejo, 1);
      }
    }
    if (!el) return;
    el.textContent = texto || this.#siguienteFrase();
    el.classList.toggle("rw-frase--larga", !!larga);

    el.style.opacity = "0";
    const medio = el.offsetWidth / 2 + 8;
    const alto = el.offsetHeight || 34;
    const px = clamp(x, medio, Math.max(medio, this.esc.ancho - medio));

    const filas = 6;
    const salto = alto + 8;
    let py = null;
    for (let f = 0; f < filas && py === null; f++) {
      const cand = clamp(y - 58 - f * salto, 62 + alto * 0.5, this.esc.alto - 40);
      let libre = true;
      for (const v of this.vivas) {
        const dx = Math.abs(px - v.x);
        const dy = Math.abs(cand - v.y);
        if (dx < medio + v.medio && dy < (alto + v.alto) * 0.5 + 30) { libre = false; break; }
      }
      if (libre) py = cand;
    }
    if (py === null) py = clamp(y - 58 - filas * salto, 62 + alto * 0.5, this.esc.alto - 40);

    this.vivas.push({
      el, x: px, y: py, medio, alto,
      t: 0, dur: larga ? 5.2 : 2.9, deriva: azar(-8, 8),
    });
  }

  mover(dt) {
    for (let i = this.vivas.length - 1; i >= 0; i--) {
      const f = this.vivas[i];
      f.t += dt;
      const k = f.t / f.dur;
      if (k >= 1) {
        f.el.style.opacity = "0";
        this.libres.push(f.el);
        this.vivas.splice(i, 1);
        continue;
      }
      const entra = smoothstep(k / 0.14);
      const sale = 1 - smoothstep((k - 0.66) / 0.34);
      const sube = easeOutCubic(clamp01(k / 0.8)) * 26;
      const bal = Math.sin(f.t * 1.5) * 3;
      f.el.style.opacity = String(entra * sale);
      f.el.style.transform =
        `translate3d(${(f.x + f.deriva * k + bal).toFixed(1)}px, ${(f.y - sube).toFixed(1)}px, 0)` +
        ` translate(-50%, -50%) scale(${(0.9 + entra * 0.1).toFixed(3)})`;
    }
  }

  limpiar() {
    for (const f of this.vivas) { f.el.style.opacity = "0"; this.libres.push(f.el); }
    this.vivas.length = 0;
  }
}

// ══════════════════════════════════════════════════════════════════════
//  APP
// ══════════════════════════════════════════════════════════════════════

class App {
  constructor(raiz) {
    this.raiz = raiz;
    this.$ = (id) => raiz.querySelector("#" + id);

    this.lienzo = this.$("rwLienzo");
    this.zona = this.$("rwToque");

    this.flojo = this.#medirAparato();
    const nParticulas = this.flojo ? CONFIG.PERF.particulasFlojo : CONFIG.PERF.particulas;

    this.esc = new Escena(raiz, this.lienzo, (e) => this.#alRedimensionar(e));
    this.esc.topeDpr = this.flojo ? CONFIG.PERF.dprMaxFlojo : CONFIG.PERF.dprMax;

    this.ps = new ParticleSystem(nParticulas);
    this.audio = new AudioManager();
    this.fisica = new Physics();
    this.liston = new Ribbon(this.flojo ? 16 : 24);

    // Colores nuevos, suavizados.
    // La rosa va de un crema empolvado a un ciruela cálido, y la verde de
    // un marfil salvia a un musgo hondo. Los dos extremos existen ya en
    // el cielo, así que todo el conjunto se ve de la misma familia.
    this.rosa = new Orb([0.94, 0.74, 0.79], [0.50, 0.24, 0.32], 0.3);
    this.verde = new Orb([0.74, 0.88, 0.78], [0.26, 0.40, 0.32], 2.7);

    this.gl = new WebGLRenderer(this.lienzo);
    if (!this.gl.ok) {
      this.respaldo = new FallbackRenderer(this.lienzo);
      const aviso = document.createElement("p");
      aviso.className = "rw-sencillo";
      aviso.textContent = "modo sencillo";
      raiz.querySelector(".rw-ui").append(aviso);
    }

    this.cartas = new LetterSystem(this.$("rwCartas"), this.ps, (c) => this.#cartaRecibida(c));
    this.efectos = new Effects(raiz, this.esc);
    this.distancia = new DistanceSystem(this.$("rwKm"), this.$("rwSusurro"));

    this.tiempo = 0;
    this.relojCarta = { rosa: 0.35, verde: 0.85 };
    this.cercania = 0;
    this.tension = 0;
    this.destello = 0;
    this.corazonFondo = 0;
    this.corazonObj = 0;
    this.luna = 0;
    this.lunaObj = 0;
    this.lunaLista = false;
    this.lunaGuino = 0;
    this.lunaGuinoObj = 0;
    this.lunaPos = { x: 0, y: 0 };
    this.juntas = false;
    this.faseFinal = 0;
    this.lentitud = 1;
    this.parallax = { x: 0, y: 0 };
    this.parallaxObj = { x: 0, y: 0 };
    this.tiempoCerca = 0;
    this.calidad = this.flojo ? 0 : 1;
    this.polvoReloj = 0;
    this.chispaReloj = 0;
    this.relojes = new Set();
    this.constelacion = null;

    this.#colocar();
    this.#enganchar();
    this.#polvoInicial();

    this.$("rwDistancia").classList.add("rw-dentro");
    this.$("rwPista").textContent = CONFIG.PISTA;
    this.espera(() => this.$("rwPista").classList.add("rw-dentro"), 1400);

    this.corriendo = true;
    this.ultimo = performance.now();
    this.bucle = (t) => this.#fotograma(t);
    this.raf = requestAnimationFrame(this.bucle);

    this.alVisibilidad = () => {
      if (document.hidden) { this.corriendo = false; cancelAnimationFrame(this.raf); }
      else if (!this.corriendo) { this.corriendo = true; this.ultimo = performance.now(); this.raf = requestAnimationFrame(this.bucle); }
    };
    document.addEventListener("visibilitychange", this.alVisibilidad);
  }

  espera(fn, ms) {
    const id = setTimeout(() => { this.relojes.delete(id); fn(); }, ms);
    this.relojes.add(id);
    return id;
  }

  #medirAparato() {
    const nucleos = navigator.hardwareConcurrency || 4;
    const memoria = navigator.deviceMemory || 4;
    const menos = matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.menosMovimiento = menos;
    let p = 0;
    if (nucleos >= 8) p += 2; else if (nucleos >= 6) p += 1; else if (nucleos < 4) p -= 2;
    if (memoria >= 8) p += 2; else if (memoria >= 4) p += 1; else if (memoria < 2) p -= 2;
    return p < 1 || menos;
  }

  #colocar() {
    const { ancho: W, alto: H } = this.esc;
    const r = clamp(this.esc.medida * 0.072, 17, 42);
    this.rosa.radio = this.verde.radio = r;
    const sep = Math.min(W * 0.34, H * 0.30);
    this.rosa.x = W / 2 - sep; this.rosa.y = H / 2 + sep * 0.12;
    this.verde.x = W / 2 + sep; this.verde.y = H / 2 - sep * 0.12;
    for (const o of [this.rosa, this.verde]) { o.vx = o.vy = 0; }
    this.liston.colocar(this.rosa, this.verde);
  }

  #alRedimensionar(e) {
    if (!this.rosa || !this.verde) return;
    this.gl?.ok ? this.gl.redimensionar(e) : this.respaldo?.redimensionar(e);
    const r = clamp(e.medida * 0.072, 17, 42);
    this.rosa.radio = this.verde.radio = r;
    const m = r * 1.2;
    for (const o of [this.rosa, this.verde]) {
      o.x = clamp(o.x, m, e.ancho - m);
      o.y = clamp(o.y, m, e.alto - m);
    }
    this.efectos.esc = e;
  }

  #polvoInicial() {
    const { ancho: W, alto: H } = this.esc;
    const cuantas = this.flojo ? 40 : 110;
    for (let i = 0; i < cuantas; i++) {
      this.ps.soltar(Math.random() * W, Math.random() * H, {
        vx: azar(-6, 6), vy: azar(-8, 2),
        vida: azar(6, 15), tam: azar(1.2, 3.0),
        tipo: 0, tono: Math.random() < 0.5 ? 0 : 1,
      });
    }
  }

  #enganchar() {
    const z = this.zona;
    this.alBajar = (e) => this.#abajo(e);
    this.alMover = (e) => this.#mueve(e);
    this.alSubir = (e) => this.#arriba(e);
    z.addEventListener("pointerdown", this.alBajar, { passive: false });
    z.addEventListener("pointermove", this.alMover, { passive: false });
    z.addEventListener("pointerup", this.alSubir);
    z.addEventListener("pointercancel", this.alSubir);

    this.$("rwSonido").addEventListener("click", () => this.#alternarSonido());
    this.$("rwReinicio").addEventListener("click", () => this.reiniciar());
  }

  #local(e) {
    const c = this.raiz.getBoundingClientRect();
    return { x: e.clientX - c.left, y: e.clientY - c.top };
  }

  #abajo(e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    this.audio.despertar();
    this.$("rwPista").classList.remove("rw-dentro");

    const p = this.#local(e);

    if (this.lunaLista && this.lunaPos && this.lunaObj < 0.5) {
      if (Math.hypot(p.x - this.lunaPos.x, p.y - this.lunaPos.y) < this.esc.medida * 0.13) {
        this.tocarLuna();
        return;
      }
    }

    let mejor = null, mejorD = Infinity;
    for (const o of [this.rosa, this.verde]) {
      const d = Math.hypot(o.x - p.x, o.y - p.y);
      if (d < o.radio * 2.4 && d < mejorD) { mejor = o; mejorD = d; }
    }
    if (!mejor) return;
    if (this.faseFinal > 0 && this.faseFinal < 3) return;

    const ahora = performance.now();
    if (ahora - mejor.ultimoToque < 320) {
      this.#dobleToque(mejor);
      mejor.ultimoToque = 0;
    } else {
      mejor.ultimoToque = ahora;
    }

    mejor.agarrada = true;
    mejor.dedoId = e.pointerId;
    mejor.destinoX = p.x;
    mejor.destinoY = p.y;
    mejor.brilloObj = 1;
    mejor.golpe(0.5);
    mejor.rastro.length = 0;
    this.audio.tocar();
    try { this.zona.setPointerCapture(e.pointerId); } catch { /* no siempre se puede */ }
    if (e.cancelable) e.preventDefault();
  }

  #mueve(e) {
    const p = this.#local(e);
    this.parallaxObj.x = (p.x / this.esc.ancho - 0.5) * 2;
    this.parallaxObj.y = (p.y / this.esc.alto - 0.5) * 2;

    for (const o of [this.rosa, this.verde]) {
      if (!o.agarrada || o.dedoId !== e.pointerId) continue;
      o.destinoX = p.x;
      o.destinoY = p.y;
      o.rastro.push({ x: p.x, y: p.y, t: this.tiempo });
      if (o.rastro.length > 140) o.rastro.shift();
      this.#mirarSacudida(o, p);
      if (e.cancelable) e.preventDefault();
    }
  }

  #arriba(e) {
    for (const o of [this.rosa, this.verde]) {
      if (o.dedoId !== e.pointerId) continue;
      o.agarrada = false;
      o.dedoId = null;
      o.brilloObj = 0;
      this.#mirarConstelacion(o);
      o.rastro.length = 0;
    }
    try { this.zona.releasePointerCapture(e.pointerId); } catch { /* ya estaba */ }
  }

  #alternarSonido() {
    const on = this.audio.alternar();
    const b = this.$("rwSonido");
    b.setAttribute("aria-label", on ? "Silenciar" : "Activar sonido");
    this.$("rwOndas").setAttribute("opacity", on ? "1" : "0");
    this.$("rwMudo").setAttribute("opacity", on ? "0" : "1");
    if (on) this.audio.tocar();
  }

  // ── Secretos ────────────────────────────────────────────────────────

  #dobleToque(o) {
    o.golpe(1.2);
    o.vy -= 260;
    this.audio.latido();
    for (let i = 0; i < 16; i++) {
      const a = azar(0, Math.PI * 2);
      this.ps.soltar(o.x, o.y, {
        vx: Math.cos(a) * azar(30, 110), vy: Math.sin(a) * azar(30, 110) - 40,
        vida: azar(1.0, 1.9), tam: azar(5, 11), tipo: 2,
        tono: o === this.rosa ? 0 : 1, giro: azar(-0.4, 0.4), giroV: azar(-1.4, 1.4),
      });
    }
  }

  #mirarConstelacion(o) {
    const r = o.rastro;
    if (r.length < 30 || this.constelacion) return;
    let cx = 0, cy = 0;
    for (const p of r) { cx += p.x; cy += p.y; }
    cx /= r.length; cy /= r.length;

    let total = 0;
    let anterior = Math.atan2(r[0].y - cy, r[0].x - cx);
    let radioMedio = 0;
    for (let i = 1; i < r.length; i++) {
      const a = Math.atan2(r[i].y - cy, r[i].x - cx);
      let d = a - anterior;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      total += d;
      anterior = a;
      radioMedio += Math.hypot(r[i].x - cx, r[i].y - cy);
    }
    radioMedio /= r.length;

    const vueltas = Math.abs(total) / (Math.PI * 2);
    if (vueltas >= CONFIG.SECRETOS.vueltasConstelacion && radioMedio > o.radio * 1.4) {
      this.#lanzarConstelacion(cx, cy, Math.max(radioMedio, this.esc.medida * 0.18));
    }
  }

  #lanzarConstelacion(cx, cy, r) {
    this.constelacion = { t: 0 };
    this.audio.secreto();
    const n = this.flojo ? 26 : 46;
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2;
      const hx = cx + (16 * Math.pow(Math.sin(t), 3)) / 16 * r * 0.9;
      const hy = cy - ((13 * Math.cos(t) - 5 * Math.cos(2 * t)
                      - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16) * r * 0.9;
      this.ps.soltar(hx, hy, {
        vx: azar(-5, 5), vy: azar(-5, 5),
        vida: azar(3.4, 4.6), tam: azar(3.0, 5.6),
        tipo: 3, tono: 3, giro: azar(0, 6.28), giroV: azar(-0.5, 0.5),
      });
    }
    this.efectos.frase(cx, cy - r * 0.5, "Dibujaste un corazón sin saberlo. 🤍");
    this.espera(() => { this.constelacion = null; }, 6000);
  }

  #mirarEstiron(dt, bruto) {
    if (this.juntas || this.faseFinal > 0) { this.tiempoEstirado = 0; return; }
    const estirado = bruto >= CONFIG.SECRETOS.estirarDesde;
    if (!estirado) {
      this.tiempoEstirado = Math.max(0, (this.tiempoEstirado || 0) - dt * 1.4);
      return;
    }
    this.tiempoEstirado = (this.tiempoEstirado || 0) + dt;
    if (this.tiempoEstirado < CONFIG.SECRETOS.estirar || this.estironDicho) return;

    this.estironDicho = true;
    this.audio.secreto();
    const n = this.flojo ? 16 : 34;
    for (let i = 0; i <= n; i++) {
      const p = this.liston.punto(i / n);
      this.ps.soltar(p.x, p.y, {
        vx: azar(-10, 10), vy: azar(-16, 4),
        vida: azar(1.2, 2.2), tam: azar(2.4, 5), tipo: 4, tono: 2,
        giro: azar(0, 6.28), giroV: azar(-1.4, 1.4),
      });
    }
    const p = this.liston.punto(0.5);
    this.efectos.frase(p.x, p.y - 34, "Estira lo que quieras. No se rompe.", true);
    this.espera(() => { this.estironDicho = false; }, 14000);
  }

  #mirarSacudida(o, p) {
    const s = o.sacudida || (o.sacudida = { dir: 0, n: 0, t: 0, x: p.x });
    const ahora = this.tiempo;
    if (ahora - s.t > CONFIG.SECRETOS.sacudirEn) { s.n = 0; s.dir = 0; }

    const dx = p.x - s.x;
    if (Math.abs(dx) < o.radio * 0.5) return;
    const dir = dx > 0 ? 1 : -1;
    s.x = p.x;
    if (s.dir !== 0 && dir !== s.dir) { s.n++; s.t = ahora; }
    s.dir = dir;

    if (s.n < CONFIG.SECRETOS.sacudidas || this.sacudidaDicha) return;
    s.n = 0;
    this.sacudidaDicha = true;
    this.audio.secreto();
    o.golpe(1.4);
    const n = this.flojo ? 12 : 26;
    for (let i = 0; i < n; i++) {
      this.espera(() => {
        this.ps.soltar(o.x + azar(-o.radio, o.radio), o.y - o.radio * azar(0.4, 1.6), {
          vx: azar(-26, 26), vy: azar(-70, -20),
          vida: azar(1.6, 2.8), tam: azar(5, 11), tipo: 2,
          tono: 3, giro: azar(0, 6.28), giroV: azar(-1.2, 1.2),
        });
      }, i * 38);
    }
    this.efectos.frase(o.x, o.y - o.radio * 2, "Sacúdeme y salen más. 🤍", true);
    this.espera(() => { this.sacudidaDicha = false; }, 12000);
  }

  #mirarDosDedos(dt) {
    const dos = this.rosa.agarrada && this.verde.agarrada;
    if (!dos) { this.tiempoDosDedos = 0; return; }
    this.tiempoDosDedos = (this.tiempoDosDedos || 0) + dt;
    if (this.tiempoDosDedos < CONFIG.SECRETOS.dosDedos || this.dosDedosDicho) return;

    this.dosDedosDicho = true;
    this.audio.latido();
    this.espera(() => this.audio.latido(), 420);
    this.rosa.golpe(1.1);
    this.verde.golpe(1.1);
    const mx = (this.rosa.x + this.verde.x) / 2;
    const my = (this.rosa.y + this.verde.y) / 2;
    this.efectos.frase(mx, my, "Las dos a la vez. Así late mejor.", true);
    this.espera(() => { this.dosDedosDicho = false; }, 15000);
  }

  #mirarSoledad(dt) {
    if (this.juntas || this.faseFinal > 0) { this.tiempoSolas = 0; return; }
    if (this.rosa.agarrada || this.verde.agarrada) {
      this.tiempoSolas = 0;
      this.solasDicho = false;
      this.fisica.atraccionExtra = 0;
      return;
    }
    this.tiempoSolas = (this.tiempoSolas || 0) + dt;
    if (this.tiempoSolas < CONFIG.SECRETOS.solasTras) return;

    if (!this.solasDicho) {
      this.solasDicho = true;
      const mx = (this.rosa.x + this.verde.x) / 2;
      const my = (this.rosa.y + this.verde.y) / 2;
      this.efectos.frase(mx, my - 30, "Míralas. No hace falta que hagas nada.", true);
    }
    this.fisica.atraccionExtra = Math.min(
      1, (this.tiempoSolas - CONFIG.SECRETOS.solasTras) * 0.12);
  }

  #mirarLuna(dt) {
    if (this.lunaLista || this.juntas) return;
    if (this.cartas.entregadas < CONFIG.SECRETOS.cartasParaLuna) return;
    this.lunaLista = true;
    this.lunaPos = { x: this.esc.ancho * 0.5, y: this.esc.alto * 0.18 };
    this.lunaGuinoObj = 1;
    this.efectos.frase(this.lunaPos.x, this.lunaPos.y + 52, "¿Ves algo ahí arriba?", true);
  }

  tocarLuna() {
    if (!this.lunaLista || this.lunaObj > 0.5) return;
    this.lunaObj = 1;
    this.lunaGuinoObj = 0;
    this.audio.secreto();
    this.efectos.limpiar();
    this.espera(() => {
      this.efectos.frase(this.esc.ancho / 2, this.esc.alto * 0.68,
        "Incluso hasta la luna llegaría por ti. 🌙", true);
    }, 1200);
    this.espera(() => { this.lunaObj = 0; this.lunaLista = false; this.lunaGuinoObj = 0; }, 8200);
  }

  // ── Cartas ──────────────────────────────────────────────────────────

  #cartaRecibida(c) {
    const recibe = c.hacia === this.rosa ? this.rosa : this.verde;
    recibe.golpe(0.7);
    this.audio.recibir();
    if ((this.faseFinal >= 2 || this.lunaObj > 0.5) && !c.especial) return;
    if (c.especial) {
      this.efectos.frase(recibe.x, recibe.y, CONFIG.CARTA_ESPECIAL.texto, true);
    } else {
      this.efectos.frase(recibe.x, recibe.y);
    }
  }

  #mandarCartas(dt) {
    if (this.faseFinal > 0 && this.faseFinal < 3) return;
    for (const quien of ["rosa", "verde"]) {
      this.relojCarta[quien] -= dt;
      if (this.relojCarta[quien] > 0) continue;
      this.relojCarta[quien] = this.juntas ? CONFIG.CADENCIA_CARTA * 2.4 : CONFIG.CADENCIA_CARTA;
      const esRosa = quien === "rosa";
