    const memoria = navigator.deviceMemory || 4;
    const menos = matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.menosMovimiento = menos;
    let p = 0;
    if (nucleos >= 8) p += 2; else if (nucleos >= 6) p += 1; else if (nucleos < 4) p -= 2;
    if (memoria >= 8) p += 2; else if (memoria >= 4) p += 1; else if (memoria < 2) p -= 2;
    return p < 1 || menos;
  }

  #colocar() {
    const { ancho: W, alto: H } = this.esc;
    const r = clamp(this.esc.medida * 0.072, 17, 42);
    this.rosa.radio = this.verde.radio = r;
    // En apaisado se separan a lo ancho; en vertical, un poco en diagonal.
    const sep = Math.min(W * 0.34, H * 0.30);
    this.rosa.x = W / 2 - sep; this.rosa.y = H / 2 + sep * 0.12;
    this.verde.x = W / 2 + sep; this.verde.y = H / 2 - sep * 0.12;
    for (const o of [this.rosa, this.verde]) { o.vx = o.vy = 0; }
    this.liston.colocar(this.rosa, this.verde);
  }

  #alRedimensionar(e) {
    // `Escena` mide en cuanto nace, y nace antes que las esferas: este
    // aviso puede llegar cuando todavía no hay a quién avisar. No es un
    // caso raro, es el primero que ocurre siempre.
    if (!this.rosa || !this.verde) return;

    this.gl?.ok ? this.gl.redimensionar(e) : this.respaldo?.redimensionar(e);
    const r = clamp(e.medida * 0.072, 17, 42);
    this.rosa.radio = this.verde.radio = r;
    // Las esferas se quedan dentro del nuevo tamaño sin dar un salto.
    const m = r * 1.2;
    for (const o of [this.rosa, this.verde]) {
      o.x = clamp(o.x, m, e.ancho - m);
      o.y = clamp(o.y, m, e.alto - m);
    }
    this.efectos.esc = e;
  }

  #polvoInicial() {
    const { ancho: W, alto: H } = this.esc;
    const cuantas = this.flojo ? 40 : 110;
    for (let i = 0; i < cuantas; i++) {
      this.ps.soltar(Math.random() * W, Math.random() * H, {
        vx: azar(-6, 6), vy: azar(-8, 2),
        vida: azar(6, 15), tam: azar(1.4, 3.4),
        tipo: 0, tono: Math.random() < 0.5 ? 0 : 1,
      });
    }
  }

  // ── Interacción ─────────────────────────────────────────────────────

  #enganchar() {
    const z = this.zona;
    this.alBajar = (e) => this.#abajo(e);
    this.alMover = (e) => this.#mueve(e);
    this.alSubir = (e) => this.#arriba(e);
    z.addEventListener("pointerdown", this.alBajar, { passive: false });
    z.addEventListener("pointermove", this.alMover, { passive: false });
    z.addEventListener("pointerup", this.alSubir);
    z.addEventListener("pointercancel", this.alSubir);

    this.$("rwSonido").addEventListener("click", () => this.#alternarSonido());
    this.$("rwReinicio").addEventListener("click", () => this.reiniciar());
  }

  #local(e) {
    const c = this.raiz.getBoundingClientRect();
    return { x: e.clientX - c.left, y: e.clientY - c.top };
  }

  #abajo(e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    this.audio.despertar();
    this.$("rwPista").classList.remove("rw-dentro");

    const p = this.#local(e);

    // ¿La luna? Se mira antes que las esferas, pero no compiten: ella
    // vive arriba del todo y ellas en el medio.
    if (this.lunaLista && this.lunaPos && this.lunaObj < 0.5) {
      if (Math.hypot(p.x - this.lunaPos.x, p.y - this.lunaPos.y) < this.esc.medida * 0.13) {
        this.tocarLuna();
        return;
      }
    }

    // La esfera más cercana, con un margen generoso: en un móvil el dedo
    // tapa justo lo que quiere coger, así que el área sensible es mayor
    // que el dibujo.
    let mejor = null, mejorD = Infinity;
    for (const o of [this.rosa, this.verde]) {
      const d = Math.hypot(o.x - p.x, o.y - p.y);
      if (d < o.radio * 2.4 && d < mejorD) { mejor = o; mejorD = d; }
    }
    if (!mejor) return;
    if (this.faseFinal > 0 && this.faseFinal < 3) return;   // durante el encuentro, no

    // Doble toque: un salto y corazones.
    const ahora = performance.now();
    if (ahora - mejor.ultimoToque < 320) {
      this.#dobleToque(mejor);
      mejor.ultimoToque = 0;
    } else {
      mejor.ultimoToque = ahora;
    }

    mejor.agarrada = true;
    mejor.dedoId = e.pointerId;
    mejor.destinoX = p.x;
    mejor.destinoY = p.y;
    mejor.brilloObj = 1;
    mejor.golpe(0.5);
    mejor.rastro.length = 0;
    this.audio.tocar();
    try { this.zona.setPointerCapture(e.pointerId); } catch { /* no siempre se puede */ }
    if (e.cancelable) e.preventDefault();
  }

  #mueve(e) {
    const p = this.#local(e);
    this.parallaxObj.x = (p.x / this.esc.ancho - 0.5) * 2;
    this.parallaxObj.y = (p.y / this.esc.alto - 0.5) * 2;

    for (const o of [this.rosa, this.verde]) {
      if (!o.agarrada || o.dedoId !== e.pointerId) continue;
      o.destinoX = p.x;
      o.destinoY = p.y;
      // El rastro, para el patrón de la constelación.
      o.rastro.push({ x: p.x, y: p.y, t: this.tiempo });
      if (o.rastro.length > 140) o.rastro.shift();
      this.#mirarSacudida(o, p);
      if (e.cancelable) e.preventDefault();
    }
  }

  #arriba(e) {
    for (const o of [this.rosa, this.verde]) {
      if (o.dedoId !== e.pointerId) continue;
      o.agarrada = false;
      o.dedoId = null;
      o.brilloObj = 0;
      this.#mirarConstelacion(o);
      o.rastro.length = 0;
    }
    try { this.zona.releasePointerCapture(e.pointerId); } catch { /* ya estaba */ }
  }

  #alternarSonido() {
    const on = this.audio.alternar();
    const b = this.$("rwSonido");
    b.setAttribute("aria-label", on ? "Silenciar" : "Activar sonido");
    this.$("rwOndas").setAttribute("opacity", on ? "1" : "0");
    this.$("rwMudo").setAttribute("opacity", on ? "0" : "1");
    if (on) this.audio.tocar();
  }

  // ── Secretos ────────────────────────────────────────────────────────

  #dobleToque(o) {
    o.golpe(1.2);
    o.vy -= 260;
    this.audio.latido();
    for (let i = 0; i < 16; i++) {
      const a = azar(0, Math.PI * 2);
      this.ps.soltar(o.x, o.y, {
        vx: Math.cos(a) * azar(30, 110), vy: Math.sin(a) * azar(30, 110) - 40,
        vida: azar(1.0, 1.9), tam: azar(6, 13), tipo: 2,
        tono: o === this.rosa ? 0 : 1, giro: azar(-0.4, 0.4), giroV: azar(-1.4, 1.4),
      });
    }
  }

  /**
   * ¿Ha dibujado un círculo con la esfera?
   *
   * Se mide el ángulo TOTAL recorrido alrededor del centro del rastro,
   * sumando los giros con su signo. Sumar así distingue dar vueltas de
   * ir y venir: un vaivén suma y resta, un círculo sólo suma.
   */
  #mirarConstelacion(o) {
    const r = o.rastro;
    if (r.length < 30 || this.constelacion) return;
    let cx = 0, cy = 0;
    for (const p of r) { cx += p.x; cy += p.y; }
    cx /= r.length; cy /= r.length;

    let total = 0;
    let anterior = Math.atan2(r[0].y - cy, r[0].x - cx);
    let radioMedio = 0;
    for (let i = 1; i < r.length; i++) {
      const a = Math.atan2(r[i].y - cy, r[i].x - cx);
      let d = a - anterior;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      total += d;
      anterior = a;
      radioMedio += Math.hypot(r[i].x - cx, r[i].y - cy);
    }
    radioMedio /= r.length;

    const vueltas = Math.abs(total) / (Math.PI * 2);
    if (vueltas >= CONFIG.SECRETOS.vueltasConstelacion && radioMedio > o.radio * 1.4) {
      this.#lanzarConstelacion(cx, cy, Math.max(radioMedio, this.esc.medida * 0.18));
    }
  }

  #lanzarConstelacion(cx, cy, r) {
    this.constelacion = { t: 0 };
    this.audio.secreto();
    // Las partículas se colocan formando un corazón y se quedan quietas
    // un rato: es un dibujo hecho de motas, no una figura pintada.
    const n = this.flojo ? 26 : 46;
    for (let i = 0; i < n; i++) {
      const t = (i / n) * Math.PI * 2;
      const hx = cx + (16 * Math.pow(Math.sin(t), 3)) / 16 * r * 0.9;
      const hy = cy - ((13 * Math.cos(t) - 5 * Math.cos(2 * t)
                      - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16) * r * 0.9;
      this.ps.soltar(hx, hy, {
        vx: azar(-5, 5), vy: azar(-5, 5),
        vida: azar(3.4, 4.6), tam: azar(3.4, 6.5),
        tipo: 3, tono: 3, giro: azar(0, 6.28), giroV: azar(-0.5, 0.5),
      });
    }
    this.efectos.frase(cx, cy - r * 0.5, "Dibujaste un corazón sin saberlo. 🤍");
    this.espera(() => { this.constelacion = null; }, 6000);
  }

  /* ── SECRETO: estirar el listón ───────────────────────────────────────
     Llevarlas a dos extremos opuestos y aguantar. La cinta se pone tirante
     y blanca, y dice lo que tiene que decir: que aunque estires, no se
     rompe. Se mide la distancia en tanto por uno del máximo, así que vale
     igual en un móvil estrecho que en una tableta.                        */
  #mirarEstiron(dt, bruto) {
    if (this.juntas || this.faseFinal > 0) { this.tiempoEstirado = 0; return; }
    const estirado = bruto >= CONFIG.SECRETOS.estirarDesde;
    if (!estirado) {
      this.tiempoEstirado = Math.max(0, (this.tiempoEstirado || 0) - dt * 1.4);
      return;
    }
    this.tiempoEstirado = (this.tiempoEstirado || 0) + dt;
    if (this.tiempoEstirado < CONFIG.SECRETOS.estirar || this.estironDicho) return;

    this.estironDicho = true;
    this.audio.secreto();
    /* Una chispa por todo el listón a la vez: la cinta entera se enciende
       de punta a punta y se ve que aguanta. */
    const n = this.flojo ? 16 : 34;
    for (let i = 0; i <= n; i++) {
      const p = this.liston.punto(i / n);
      this.ps.soltar(p.x, p.y, {
        vx: azar(-10, 10), vy: azar(-16, 4),
        vida: azar(1.2, 2.2), tam: azar(3, 6.5), tipo: 4, tono: 2,
        giro: azar(0, 6.28), giroV: azar(-1.4, 1.4),
      });
    }
    const p = this.liston.punto(0.5);
    this.efectos.frase(p.x, p.y - 34, "Estira lo que quieras. No se rompe.", true);
    /* Y se rearma al volver a juntarlas, para que se pueda repetir. */
    this.espera(() => { this.estironDicho = false; }, 14000);
  }

  /* ── SECRETO: sacudir una bolita ──────────────────────────────────────
     Agitarla de lado a lado deprisa. Se cuentan los cambios de sentido en
     horizontal —no la velocidad—, porque eso es lo que distingue sacudir
     de arrastrar rápido, que no es lo mismo.                              */
  #mirarSacudida(o, p) {
    const s = o.sacudida || (o.sacudida = { dir: 0, n: 0, t: 0, x: p.x });
    const ahora = this.tiempo;
    if (ahora - s.t > CONFIG.SECRETOS.sacudirEn) { s.n = 0; s.dir = 0; }

    const dx = p.x - s.x;
    if (Math.abs(dx) < o.radio * 0.5) return;    // un temblor no cuenta
    const dir = dx > 0 ? 1 : -1;
    s.x = p.x;
    if (s.dir !== 0 && dir !== s.dir) { s.n++; s.t = ahora; }
    s.dir = dir;

    if (s.n < CONFIG.SECRETOS.sacudidas || this.sacudidaDicha) return;
    s.n = 0;
    this.sacudidaDicha = true;
    this.audio.secreto();
    o.golpe(1.4);
    /* Le caen corazones encima, como a un árbol que se agita. */
    const n = this.flojo ? 12 : 26;
    for (let i = 0; i < n; i++) {
      this.espera(() => {
        this.ps.soltar(o.x + azar(-o.radio, o.radio), o.y - o.radio * azar(0.4, 1.6), {
          vx: azar(-26, 26), vy: azar(-70, -20),
          vida: azar(1.6, 2.8), tam: azar(6, 13), tipo: 2,
          tono: 3, giro: azar(0, 6.28), giroV: azar(-1.2, 1.2),
        });
      }, i * 38);
    }
    this.efectos.frase(o.x, o.y - o.radio * 2, "Sacúdeme y salen más. 🤍", true);
    this.espera(() => { this.sacudidaDicha = false; }, 12000);
  }

  /* ── SECRETO: las dos a la vez ────────────────────────────────────────
     Un dedo en cada bolita. Se sincronizan los dos latidos y se lee la
     frase. Sólo hace falta aguantar medio segundo: es un secreto que se
     encuentra sin querer, y ésos son los mejores.                         */
  #mirarDosDedos(dt) {
    const dos = this.rosa.agarrada && this.verde.agarrada;
    if (!dos) { this.tiempoDosDedos = 0; return; }
    this.tiempoDosDedos = (this.tiempoDosDedos || 0) + dt;
    if (this.tiempoDosDedos < CONFIG.SECRETOS.dosDedos || this.dosDedosDicho) return;

    this.dosDedosDicho = true;
    this.audio.latido();
    this.espera(() => this.audio.latido(), 420);
    /* Los dos golpes en el MISMO instante: eso es lo que se ve, que laten
       a la vez. */
    this.rosa.golpe(1.1);
    this.verde.golpe(1.1);
    const mx = (this.rosa.x + this.verde.x) / 2;
    const my = (this.rosa.y + this.verde.y) / 2;
    this.efectos.frase(mx, my, "Las dos a la vez. Así late mejor.", true);
    this.espera(() => { this.dosDedosDicho = false; }, 15000);
  }

  /* ── SECRETO: dejarlas solas ──────────────────────────────────────────
     Si nadie las toca en un buen rato, se buscan ellas. No hace falta
     hacer nada: hace falta justo lo contrario.                            */
  #mirarSoledad(dt) {
    if (this.juntas || this.faseFinal > 0) { this.tiempoSolas = 0; return; }
    if (this.rosa.agarrada || this.verde.agarrada) {
      this.tiempoSolas = 0;
      this.solasDicho = false;
      this.fisica.atraccionExtra = 0;
      return;
    }
    this.tiempoSolas = (this.tiempoSolas || 0) + dt;
    if (this.tiempoSolas < CONFIG.SECRETOS.solasTras) return;

    if (!this.solasDicho) {
      this.solasDicho = true;
      const mx = (this.rosa.x + this.verde.x) / 2;
      const my = (this.rosa.y + this.verde.y) / 2;
      this.efectos.frase(mx, my - 30, "Míralas. No hace falta que hagas nada.", true);
    }
    /* Un tirón suave que crece muy despacio: van acercándose solas, y si
       ella vuelve a tocar, se corta y vuelven a lo suyo. */
    this.fisica.atraccionExtra = Math.min(
      1, (this.tiempoSolas - CONFIG.SECRETOS.solasTras) * 0.12);
  }

  #mirarLuna(dt) {
    if (this.lunaLista || this.juntas) return;
    if (this.cartas.entregadas < CONFIG.SECRETOS.cartasParaLuna) return;
    this.lunaLista = true;
    // No se anuncia con un cartel: se ENCIENDE una lunita pequeña arriba,
    // y quien se fije la encontrará. La frase sólo levanta la vista.
    this.lunaPos = { x: this.esc.ancho * 0.5, y: this.esc.alto * 0.18 };
    this.lunaGuinoObj = 1;
    this.efectos.frase(this.lunaPos.x, this.lunaPos.y + 52, "¿Ves algo ahí arriba?", true);
  }

  tocarLuna() {
    if (!this.lunaLista || this.lunaObj > 0.5) return;
    this.lunaObj = 1;
    this.lunaGuinoObj = 0;
    this.audio.secreto();
    this.efectos.limpiar();
    this.espera(() => {
      this.efectos.frase(this.esc.ancho / 2, this.esc.alto * 0.68,
        "Incluso hasta la luna llegaría por ti. 🌙", true);
    }, 1200);
    // Y se vuelve sola: nadie se queda encerrado en un secreto.
    this.espera(() => { this.lunaObj = 0; this.lunaLista = false; this.lunaGuinoObj = 0; }, 8200);
  }

  // ── Cartas ──────────────────────────────────────────────────────────

  #cartaRecibida(c) {
    const recibe = c.hacia === this.rosa ? this.rosa : this.verde;
    recibe.golpe(0.7);
    this.audio.recibir();
    // Con el corazón hecho —o con la luna abierta— las cartas siguen
    // cruzándose, pero calladas: lo que hay que poder leer es lo otro, y
    // dos globos por segundo encima no dejaban ver nada.
    if ((this.faseFinal >= 2 || this.lunaObj > 0.5) && !c.especial) return;
    if (c.especial) {
      this.efectos.frase(recibe.x, recibe.y, CONFIG.CARTA_ESPECIAL.texto, true);
    } else {
      this.efectos.frase(recibe.x, recibe.y);
    }
  }

  #mandarCartas(dt) {
    if (this.faseFinal > 0 && this.faseFinal < 3) return;
    for (const quien of ["rosa", "verde"]) {
      this.relojCarta[quien] -= dt;
      if (this.relojCarta[quien] > 0) continue;
      this.relojCarta[quien] = this.juntas ? CONFIG.CADENCIA_CARTA * 2.4 : CONFIG.CADENCIA_CARTA;
      const esRosa = quien === "rosa";
      const desde = esRosa ? this.rosa : this.verde;
      const hacia = esRosa ? this.verde : this.rosa;
      const especial = Math.random() < CONFIG.CARTA_ESPECIAL.probabilidad;
      if (this.cartas.enviar(desde, hacia, esRosa, especial)) {
        desde.golpe(0.28);
        this.audio.enviar();
      }
    }
  }

  // ── El encuentro ────────────────────────────────────────────────────

  #encuentro() {
    if (this.faseFinal) return;
    this.faseFinal = 1;
    this.juntas = true;
    this.audio.encuentro();
    try { navigator.vibrate?.([24, 70, 24, 70, 50]); } catch { /* da igual */ }

    // 1 · el mundo se para un instante
    this.lentitudObj = 0.22;

    // 2 · las dos se sueltan y se buscan
    for (const o of [this.rosa, this.verde]) { o.agarrada = false; o.dedoId = null; o.brilloObj = 0.6; }

    // 3 · la onda de luz y las partículas
    this.espera(() => {
      this.destelloObj = 1;
      const cx = (this.rosa.x + this.verde.x) / 2;
      const cy = (this.rosa.y + this.verde.y) / 2;
      const n = this.flojo ? 90 : 240;
      for (let i = 0; i < n; i++) {
        const a = azar(0, Math.PI * 2);
        const v = azar(60, 420);
        this.ps.soltar(cx, cy, {
          vx: Math.cos(a) * v, vy: Math.sin(a) * v,
          vida: azar(1.2, 2.8), tam: azar(3, 9),
          tipo: i % 4 === 0 ? 2 : (i % 3 === 0 ? 3 : 1),
          tono: i % 3 === 0 ? 2 : (i % 2 ? 0 : 1),
          giro: azar(0, 6.28), giroV: azar(-3, 3),
        });
      }
      this.rosa.golpe(1.6); this.verde.golpe(1.6);
    }, 380);

    // 4 · el listón se hace corazón
    this.espera(() => { this.liston.formaObj = 1; this.faseFinal = 2; }, 1100);

    // 5 · el mundo vuelve a su ritmo y aparece la frase
    this.espera(() => { this.lentitudObj = 1; this.destelloObj = 0; }, 1700);
    this.espera(() => {
      const f = this.$("rwFinal");
      f.textContent = CONFIG.FRASE_FINAL;
      f.classList.add("rw-dentro");
      this.faseFinal = 3;
    }, 2200);

    // 6 · y a partir de aquí, corazones cada tanto, para siempre
    this.corazonesEternos = true;
  }

  #orbitarJuntas(dt) {
    // Ya juntas, giran despacio una alrededor de la otra.
    const cx = this.esc.ancho / 2;
    const cy = this.esc.alto / 2;
    this.anguloOrbita = (this.anguloOrbita || 0) + dt * 0.42;
    const r = this.rosa.radio * 0.82;
    const objRx = cx + Math.cos(this.anguloOrbita) * r;
    const objRy = cy + Math.sin(this.anguloOrbita) * r * 0.62;
    const objVx = cx - Math.cos(this.anguloOrbita) * r;
    const objVy = cy - Math.sin(this.anguloOrbita) * r * 0.62;
    this.rosa.x = damp(this.rosa.x, objRx, 3.4, dt);
    this.rosa.y = damp(this.rosa.y, objRy, 3.4, dt);
    this.verde.x = damp(this.verde.x, objVx, 3.4, dt);
    this.verde.y = damp(this.verde.y, objVy, 3.4, dt);
    this.rosa.vx = this.rosa.vy = this.verde.vx = this.verde.vy = 0;

    // Corazoncitos que suben sin parar, muy de vez en cuando.
    this.corazonReloj = (this.corazonReloj || 0) - dt;
    if (this.corazonReloj <= 0) {
      this.corazonReloj = azar(0.5, 1.4);
      this.ps.soltar(cx + azar(-30, 30), cy + azar(-10, 20), {
        vx: azar(-12, 12), vy: azar(-46, -22),
        vida: azar(2.2, 3.6), tam: azar(7, 14), tipo: 2,
        tono: Math.random() < 0.5 ? 0 : 1,
        giro: azar(-0.3, 0.3), giroV: azar(-0.5, 0.5),
      });
    }
  }

  reiniciar() {
    for (const id of this.relojes) clearTimeout(id);
    this.relojes.clear();
    this.cartas.reiniciar();
    this.efectos.limpiar();
    this.$("rwFinal").classList.remove("rw-dentro");
    this.faseFinal = 0;
    this.juntas = false;
    this.corazonesEternos = false;
    this.liston.formaObj = 0;
    this.fisica.rendida = 0;
    this.destelloObj = 0;
    this.lentitudObj = 1;
    this.corazonObj = 0;
    this.lunaObj = 0;
    this.lunaGuinoObj = 0;
    this.lunaLista = false;
    this.tiempoCerca = 0;
    this.constelacion = null;
    this.#colocar();
    this.audio.tocar();
  }

  // ── El bucle ────────────────────────────────────────────────────────

  #fotograma(ahora) {
    if (!this.corriendo) return;
    this.raf = requestAnimationFrame(this.bucle);

    // Un fotograma imposible (la pestaña estuvo escondida) se descarta;
    // uno simplemente lento se respeta acotado, para que en un aparato
    // justo el mundo vaya despacio pero no en cámara lenta.
    let dt = (ahora - this.ultimo) / 1000;
    this.ultimo = ahora;
    if (!(dt > 0) || dt > 0.5) dt = 1 / 60;
    else if (dt > 0.1) dt = 0.1;

    // El encuentro ralentiza el mundo entero durante un instante.
    this.lentitud = damp(this.lentitud, this.lentitudObj ?? 1, 4, dt);
    const dtm = dt * this.lentitud;

    this.tiempo += dtm;
    this.#vigilarRitmo(dt);

    // Parallax
    this.parallax.x = damp(this.parallax.x, this.parallaxObj.x, 2.6, dt);
    this.parallax.y = damp(this.parallax.y, this.parallaxObj.y, 2.6, dt);

    // Física
    let info;
    if (this.juntas && this.faseFinal >= 2) {
      this.#orbitarJuntas(dtm);
      info = { d: this.rosa.radio * 1.9, minima: this.rosa.radio * 1.84,
               alcance: this.rosa.radio * 4 };
    } else {
      info = this.fisica.paso(dtm, this.rosa, this.verde, this.esc);
    }

    this.rosa.mover(dtm);
    this.verde.mover(dtm);

    // ¿Se han encontrado?
    const maxima = Math.hypot(this.esc.ancho, this.esc.alto) * 0.72;
    const bruto = this.distancia.actualizar(dt, info.d, info.minima, maxima, this.juntas);
    this.cercania = damp(this.cercania, 1 - bruto, 5, dt);
    this.tension = damp(this.tension, clamp01(info.d / maxima) * 0.9 + this.cercania * 0.1, 4, dt);

    if (!this.juntas && bruto <= 0.012 && this.fisica.rendida > 0.75) this.#encuentro();

    // El corazón del fondo: sale de tenerlas cerca sin llegar a juntarlas.
    if (!this.juntas && bruto < 0.14 && bruto > 0.02) {
      this.tiempoCerca += dt;
      if (this.tiempoCerca > CONFIG.SECRETOS.corazonFondo) this.corazonObj = 1;
    } else if (!this.juntas) {
      this.tiempoCerca = Math.max(0, this.tiempoCerca - dt * 0.6);
      if (this.tiempoCerca < 1) this.corazonObj = 0;
    }
    this.corazonFondo = damp(this.corazonFondo, this.corazonObj, 1.1, dt);
    this.luna = damp(this.luna, this.lunaObj, 1.4, dt);
    this.lunaGuino = damp(this.lunaGuino, this.lunaGuinoObj, 1.6, dt);
    this.destello = damp(this.destello, this.destelloObj ?? 0, 2.6, dt);

    // Listón
    this.liston.mover(dtm, this.rosa, this.verde, this.tension);

    // Cartas, frases y secretos
    this.#mandarCartas(dtm);
    this.cartas.mover(dtm);
    this.efectos.mover(dt);
    this.#mirarLuna(dt);
    this.#mirarEstiron(dt, bruto);
    this.#mirarDosDedos(dt);
    this.#mirarSoledad(dt);

    // Chispas que recorren el listón
    this.chispaReloj -= dtm;
    if (this.chispaReloj <= 0) {
      this.chispaReloj = this.flojo ? 0.2 : 0.075;
      const p = this.liston.punto(Math.random());
      this.ps.soltar(p.x, p.y, {
        vx: azar(-16, 16), vy: azar(-20, 6),
        vida: azar(0.5, 1.1), tam: azar(2.4, 5), tipo: 4, tono: 2,
        giro: azar(0, 6.28), giroV: azar(-2, 2),
      });
    }

    // Polvo de fondo, que se repone solo
    this.polvoReloj -= dt;
    if (this.polvoReloj <= 0) {
      this.polvoReloj = this.flojo ? 0.5 : 0.22;
      this.ps.soltar(Math.random() * this.esc.ancho, this.esc.alto + 8, {
        vx: azar(-6, 6), vy: azar(-22, -8),
        vida: azar(7, 14), tam: azar(1.4, 3.2), tipo: 0,
        tono: Math.random() < 0.5 ? 0 : 1,
      });
    }

    // Partículas, con el dedo empujándolas un poquito
    this.ps.mover(dtm, {
      x: this.parallax.x * this.esc.ancho * 0.5 + this.esc.ancho * 0.5,
      y: this.parallax.y * this.esc.alto * 0.5 + this.esc.alto * 0.5,
      r: this.esc.medida * 0.3, fuerza: 0.9,
    });

    this.#dibujar();
  }

  #vigilarRitmo(dt) {
    this.fpsAcum = (this.fpsAcum || 0) + dt;
    this.fpsCuenta = (this.fpsCuenta || 0) + 1;
    if (this.fpsAcum < 1.6) return;
    const fps = this.fpsCuenta / this.fpsAcum;
    this.fpsAcum = 0; this.fpsCuenta = 0;
    if (fps < CONFIG.PERF.fpsMinimo && (this.recortes || 0) < 2) {
      this.recortes = (this.recortes || 0) + 1;
      this.flojo = true;
      this.calidad = 0;
      this.esc.topeDpr = CONFIG.PERF.dprMaxFlojo;
      this.esc.medir();
    }
  }

  #dibujar() {
    const mundo = {
      tiempo: this.tiempo,
      rosa: this.rosa, verde: this.verde,
      liston: this.liston.puntos,
      particulas: this.ps,
      cercania: this.cercania,
      tension: this.tension,
      destello: this.destello,
      corazonFondo: this.corazonFondo,
      luna: this.luna,
      lunaGuino: this.lunaGuino,
      lunaPos: { x: this.lunaPos.x / this.esc.ancho, y: this.lunaPos.y / this.esc.alto },
      parallax: this.parallax,
      calidad: this.calidad,
    };
    if (this.gl?.ok) this.gl.dibujar(mundo, this.esc);
    else this.respaldo?.dibujar(mundo, this.esc);
  }

  destruir() {
    this.corriendo = false;
    cancelAnimationFrame(this.raf);
    for (const id of this.relojes) clearTimeout(id);
    this.relojes.clear();
    document.removeEventListener("visibilitychange", this.alVisibilidad);
    this.distancia.destruir();
    this.esc.destruir();
  }
}

// ── Arranque ────────────────────────────────────────────────────────
// Sin pantalla de bienvenida ni menú: la escena empieza y ya está.

const raiz = document.getElementById("rw");
const app = new App(raiz);

/* Al salir de la página el libro descarga el documento entero y con él se
   va todo. Aun así se recoge a mano, por si alguien la incrusta de otra
   manera y el documento sobrevive. */
window.addEventListener("pagehide", () => app.destruir());

})();
</script>
</body>
