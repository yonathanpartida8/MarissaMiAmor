<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>El hilo rojo</title>
<script src="sonido-libro.js"></script>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<!--
  EL HILO ROJO — dos mundos pequeñitos, tú y yo, amarrados por el hilo
  rojo del destino. Por el hilo viajan cartitas con cosas bonitas.

  · Arrastra un mundo hacia el otro (o los dos a la vez, con dos dedos).
    Al principio se hacen los difíciles, luego se rinden. Cuando se
    tocan, el hilo se hace un corazón alrededor de los dos.
  · Toca una cartita mientras viaja y se abre. Toca un mundo y manda una.
  · Secretos: estirar el hilo, sacudir un mundo, los dos dedos, dar
    vueltas alrededor del otro, quedarse cerquita, diez cartas (mira el
    cielo) y no hacer nada un ratito.

  Los textos están en CONFIG, al principio del <script>.
-->
<style>
:root{
  --seg-t:var(--seguro-arriba,env(safe-area-inset-top,0px));
  --seg-b:var(--seguro-abajo,env(safe-area-inset-bottom,0px));
  --barra:var(--hueco-barra,0rem);
  --tinta:#3b1d3a;--rosa:#ff7aa2;--hilo:#e8364f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0!important;width:100%;height:100%;overflow:hidden;background:#1a1033;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:Nunito,ui-rounded,system-ui,sans-serif;color:#fff4f7}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:absolute;inset:0;pointer-events:none}
.arriba{position:absolute;top:calc(var(--seg-t) + 12px);left:0;right:0;text-align:center;padding:0 104px}
.dist b{display:block;font-size:clamp(28px,8.5vw,40px);font-weight:800;letter-spacing:.01em;
  text-shadow:0 2px 18px rgba(255,90,140,.55)}
.dist span{display:block;margin-top:2px;font-size:15px;font-weight:600;color:#ffd6e3;min-height:1.3em;transition:opacity .5s}
.mandos{position:absolute;top:calc(var(--seg-t) + 10px);right:12px;display:flex;gap:8px}
.mandos button{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,214,227,.35);
  background:rgba(40,18,60,.55);color:#ffd6e3;display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mandos button:active{transform:scale(.92)}
.burbuja{position:absolute;transform:translate(-50%,-100%);max-width:min(74vw,17rem);padding:9px 14px 10px;border-radius:16px;
  background:rgba(255,248,251,.96);color:var(--tinta);font-size:15.5px;font-weight:600;line-height:1.3;text-align:center;
  box-shadow:0 8px 26px -8px rgba(20,0,30,.6);animation:burbuja .45s cubic-bezier(.34,1.5,.5,1);transition:opacity .7s,margin .7s}
.burbuja::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.burbuja.oro{background:#fff3c4;color:#6a3a10}
.burbuja.fuera{opacity:0;margin-top:-14px}
@keyframes burbuja{from{opacity:0;transform:translate(-50%,-80%) scale(.6)}}
.pista{position:absolute;left:0;right:0;bottom:calc(var(--barra) + var(--seg-b) + 18px);margin:0;text-align:center;font-size:15px;font-weight:700;
  color:#ffd6e3;opacity:0;transition:opacity 1s;animation:respira 2.4s ease-in-out infinite}
.pista.ver{opacity:.9}
@keyframes respira{50%{transform:translateY(-3px)}}
.final{position:absolute;left:50%;bottom:calc(var(--barra) + var(--seg-b) + 22%);transform:translateX(-50%);width:min(88vw,26rem);margin:0;
  text-align:center;font-family:Caveat,cursive;font-size:clamp(26px,7.5vw,36px);line-height:1.15;color:#fff;
  text-shadow:0 2px 16px rgba(255,80,130,.8);opacity:0;transition:opacity 1.6s}
.final.ver{opacity:1}
.carta{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,8,34,.55);pointer-events:auto;
  padding:calc(var(--seg-t) + 20px) 22px calc(var(--barra) + var(--seg-b) + 20px)}
.carta .papel{width:min(100%,22rem);background:#fff8f0;color:var(--tinta);border-radius:6px;padding:26px 22px 18px;text-align:center;
  box-shadow:0 20px 50px -14px rgba(0,0,0,.7);animation:abre .5s cubic-bezier(.34,1.4,.5,1);
  background-image:repeating-linear-gradient(#fff8f0 0 29px,#f7dbe4 29px 30px)}
.carta p{font-family:Caveat,cursive;font-size:30px;line-height:1.1;margin:.2em 0 .6em}
.carta small{display:block;font-size:13px;color:#c2406a;margin-bottom:6px;font-weight:800;letter-spacing:.06em}
.carta button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:999px;padding:10px 20px;background:var(--hilo);color:#fff;cursor:pointer}
@keyframes abre{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.oculto{display:none!important}
</style>
</head>
<body>
<canvas id="c" aria-label="Dos mundos pequeños unidos por un hilo rojo"></canvas>
<div class="ui">
  <div class="arriba"><div class="dist"><b id="km">2,480 km</b><span id="sus"></span></div></div>
  <div class="mandos">
    <button id="bSon" type="button" aria-label="Silenciar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M3 6h2.4L8.6 3.2v9.6L5.4 10H3z" fill="currentColor"/>
        <path id="ondas" d="M10.6 5.6a3.4 3.4 0 0 1 0 4.8M12.6 3.6a6.2 6.2 0 0 1 0 8.8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <path id="mudo" d="M10.8 6.2l3.4 3.6M14.2 6.2l-3.4 3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0"/>
      </svg>
    </button>
    <button id="bRe" type="button" aria-label="Volver a empezar">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M13 8a5 5 0 1 1-1.6-3.7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M13.2 2.2v2.9h-2.9" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div id="burbujas"></div>
  <p id="pista" class="pista"></p>
  <p id="final" class="final"></p>
  <div id="carta" class="carta oculto"><div class="papel"><small id="cartaDe">UNA CARTITA PARA TI</small><p id="cartaTxt"></p><button id="cartaOk" type="button">Guardarla 🤍</button></div></div>
</div>
<script>
(() => {
"use strict";

/* ═══════════════════════════ CONFIGURACIÓN ═══════════════════════════ */

const CONFIG = {
  KM_MAXIMOS: 2480,
  CARTA_CADA: 3.4,
  SUSURROS: [
    { hasta: 0.001, texto: "Por fin. Aquí, y sin distancia. ❤️" },
    { hasta: 0.08, texto: "Un poquito más…" },
    { hasta: 0.2, texto: "Ya casi te alcanzo 🤍" },
    { hasta: 0.45, texto: "Cada vez más cerquita…" },
    { hasta: 1.01, texto: "Todavía queda un pedacito de mundo entre los dos." },
    { hasta: 99, texto: "Estíralo lo que quieras, no se rompe 🧵" },
  ],
  PISTA: "Junta los dos mundos con el dedo 🤍",
  FRASE_FINAL: "De todos los caminos posibles, los nuestros siempre me llevaban a ti. ❤️",
  FRASES: [
    "Te amo 🤍", "Siempre estás en mi corazón.", "Me haces muy feliz.", "Eres mi persona favorita.",
    "Qué bonito coincidir contigo.", "Te elegiría una y otra vez.", "Contigo todo se siente más bonito.",
    "Mi lugar favorito siempre será contigo.", "Gracias por existir.", "Eres mi pequeño hogar.",
    "Te pienso más de lo que imaginas.", "Mi corazón siempre encuentra el camino hacia ti.",
    "Eres mi casualidad favorita.", "No importa la distancia.", "Hoy también te elegí.",
    "Me encanta cómo suena tu nombre.", "Contigo hasta esperar es bonito.", "Guardo tus risas para los días grises.",
    "Eres lo mejor que me ha pasado sin buscarlo.", "Si me pierdo, búscame donde estés tú.",
    "Te amo en los días fáciles y en los difíciles.", "Mi lugar es donde estés tú.",
    "Te pienso a las tres de la mañana.", "Volvería a empezar sólo para volver a encontrarte.",
  ],
  CARTA_ESPECIAL: { probabilidad: 0.04, texto: "Esta carta tardó un poquito más porque quería decirte algo importante… Te amo. 🤍" },
  SECRETOS: {
    estirar: "Estíralo lo que quieras. No se rompe. 🧵",
    sacudir: "Sacúdeme y salen más cartitas. 🤍",
    dosDedos: "Los dos a la vez. Así late mejor. 💓",
    vueltas: "Diste vueltas a mi alrededor… como yo alrededor de ti. 🤍",
    cerquita: "Así de cerquita me gusta estar de ti. 🥹",
    solos: "Míralos. No hace falta que hagas nada: el destino los junta solito. 🧵",
    luna: "¿Ves algo ahí arriba? 🌙",
    lunaToque: "Incluso hasta la luna llegaría por ti. 🌙",
    toque: "Toca un mundo y te manda una cartita 💌",
  },
};

/* ═══════════════════════════ BASE ═══════════════════════════ */

const $ = (id) => document.getElementById(id);
const cv = $("c"), g = cv.getContext("2d");
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, k) => a + (b - a) * k;
const rnd = (a, b) => a + Math.random() * (b - a);
const suave = (k) => { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); };
let W = 390, H = 800, DPR = 1, R = 36, ARRIBA = 110, ABAJO = 80;
let t = 0;

/* ═══════════════════════════ SONIDO ═══════════════════════════ */

const Son = (() => {
  let ac = null, sal = null, mudo = false;
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5];
  function iniciar() {
    if (ac) { if (ac.state === "suspended") ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { ac = new AC(); } catch (e) { return; }
    sal = ac.createGain(); sal.gain.value = mudo ? 0 : 0.5; sal.connect(ac.destination);
  }
  function tono(f, dur, vol = 0.08, en = 0, tipo = "sine") {
    if (!ac || mudo) return;
    const t0 = ac.currentTime + en, o = ac.createOscillator(), a = ac.createGain();
    o.type = tipo; o.frequency.value = f;
    a.gain.setValueAtTime(0.0001, t0); a.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); a.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(a).connect(sal); o.start(t0); o.stop(t0 + dur + 0.05);
  }
  return {
    iniciar,
    alternar() { mudo = !mudo; if (sal) sal.gain.value = mudo ? 0 : 0.5; return mudo; },
    campanita() { const f = PENTA[Math.floor(Math.random() * PENTA.length)]; tono(f, 1.4, 0.07); tono(f * 2, 0.6, 0.02); },
    papel() { tono(1800, 0.08, 0.02, 0, "triangle"); },
    secreto() { [784, 988, 1175, 1568].forEach((f, i) => tono(f, 0.8, 0.05, i * 0.08, "triangle")); },
    juntos() { [392, 494, 587, 740, 784, 988, 1175, 1480].forEach((f, i) => tono(f, 2.2, 0.06, i * 0.11)); tono(196, 3, 0.07, 0, "triangle"); },
    tension(k) { tono(90 + k * 60, 0.15, 0.03, 0, "triangle"); },
  };
})();

/* ═══════════════════════════ LOS DOS MUNDOS ═══════════════════════════ */

const A = { nombre: "tú", fase: 0, casa: [0.26, 0.58], c1: "#ffd0dc", c2: "#ff6f9b", c3: "#c93d6c", halo: "255,120,160", x: 0, y: 0, vx: 0, vy: 0, parpadeo: 2, esc: 1, dedo: null };
const B = { nombre: "yo", fase: 2.4, casa: [0.74, 0.45], c1: "#e2d6ff", c2: "#9b82f2", c3: "#5e45b8", halo: "160,130,255", x: 0, y: 0, vx: 0, vy: 0, parpadeo: 3.5, esc: 1, dedo: null };
const MUNDOS = [A, B];
let D0 = 300;
let juntos = null;            // { t, cx, cy } mientras están juntos
let volviendo = 0;            // animación de «volver a empezar»

/* ═══════════════════════════ EL HILO (verlet) ═══════════════════════════ */

const N = 26;
const hilo = { x: new Float32Array(N), y: new Float32Array(N), ox: new Float32Array(N), oy: new Float32Array(N), largo: 300 };
function nudo(p, q) {
  const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1;
  return [p.x + (dx / d) * R * 0.9 * p.esc, p.y + (dy / d) * R * 0.9 * p.esc + R * 0.18];
}
function iniciarHilo() {
  const [ax, ay] = nudo(A, B), [bx, by] = nudo(B, A);
  for (let i = 0; i < N; i++) { const k = i / (N - 1); hilo.x[i] = hilo.ox[i] = lerp(ax, bx, k); hilo.y[i] = hilo.oy[i] = lerp(ay, by, k) + Math.sin(k * Math.PI) * 30; }
  hilo.largo = Math.hypot(bx - ax, by - ay) * 1.12;
}
function moverHilo(dt) {
  const [ax, ay] = nudo(A, B), [bx, by] = nudo(B, A);
  const d = Math.hypot(bx - ax, by - ay);
  hilo.largo = lerp(hilo.largo, Math.max(40, Math.min(d * 1.14, D0 * 1.2)), Math.min(1, dt * 1.5));
  const seg = hilo.largo / (N - 1), gr = 900 * dt * dt;
  for (let i = 1; i < N - 1; i++) {
    const vx = (hilo.x[i] - hilo.ox[i]) * 0.985, vy = (hilo.y[i] - hilo.oy[i]) * 0.985;
    hilo.ox[i] = hilo.x[i]; hilo.oy[i] = hilo.y[i];
    hilo.x[i] += vx + Math.sin(t * 1.3 + i * 0.5) * 0.02; hilo.y[i] += vy + gr;
  }
  hilo.x[0] = ax; hilo.y[0] = ay; hilo.x[N - 1] = bx; hilo.y[N - 1] = by;
  for (let it = 0; it < 14; it++) {
    for (let i = 0; i < N - 1; i++) {
      const dx = hilo.x[i + 1] - hilo.x[i], dy = hilo.y[i + 1] - hilo.y[i], l = Math.hypot(dx, dy) || 0.001, e = (l - seg) / l * 0.5;
      const m0 = i === 0 ? 0 : 1, m1 = i + 1 === N - 1 ? 0 : 1, s = m0 + m1 || 1;
      hilo.x[i] += dx * e * (2 * m0 / s); hilo.y[i] += dy * e * (2 * m0 / s);
      hilo.x[i + 1] -= dx * e * (2 * m1 / s); hilo.y[i + 1] -= dy * e * (2 * m1 / s);
    }
  }
  return d / hilo.largo; // > 0.97: tirante
}
function hiloACorazon(k) {
  const cx = juntos.cx, cy = juntos.cy - R * 0.15, s = (R * 4.9) / 32;
  for (let i = 0; i < N; i++) {
    const a = (i / (N - 1)) * Math.PI * 2;
    const hx = cx + 16 * Math.pow(Math.sin(a), 3) * s, hy = cy - (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * s;
    hilo.x[i] = lerp(hilo.x[i], hx, k); hilo.y[i] = lerp(hilo.y[i], hy, k); hilo.ox[i] = hilo.x[i]; hilo.oy[i] = hilo.y[i];
  }
}
function puntoHilo(s) {
  const f = clamp(s, 0, 1) * (N - 1), i = Math.min(N - 2, Math.floor(f)), k = f - i;
  return [lerp(hilo.x[i], hilo.x[i + 1], k), lerp(hilo.y[i], hilo.y[i + 1], k), Math.atan2(hilo.y[i + 1] - hilo.y[i], hilo.x[i + 1] - hilo.x[i])];
}

/* ═══════════════════════════ CARTITAS, BURBUJAS Y CHISPAS ═══════════════════════════ */

const cartas = [];
let proxCarta = 1.5, entregadas = 0, ultimaFrase = -1;
function frase() {
  let i; do { i = Math.floor(Math.random() * CONFIG.FRASES.length); } while (i === ultimaFrase && CONFIG.FRASES.length > 1);
  ultimaFrase = i; return CONFIG.FRASES[i];
}
function mandarCarta(de, especial) {
  if (juntos) return;
  const esp = especial ?? Math.random() < CONFIG.CARTA_ESPECIAL.probabilidad;
  cartas.push({ s: de === A ? 0 : 1, dir: de === A ? 1 : -1, v: rnd(0.16, 0.22), txt: esp ? CONFIG.CARTA_ESPECIAL.texto : frase(), esp, gira: rnd(-0.2, 0.2) });
  Son.papel();
}
const capa = $("burbujas");
function burbuja(txt, x, y, oro, dura = 4200) {
  const vivas = [...capa.children].filter((b) => !b.classList.contains("fuera"));
  if (vivas.length >= 3) { vivas[0].classList.add("fuera"); setTimeout(() => vivas[0].remove(), 700); }
  const b = document.createElement("div"); b.className = "burbuja" + (oro ? " oro" : ""); b.textContent = txt;
  capa.appendChild(b);
  const ancho = b.offsetWidth, alto = b.offsetHeight;
  let top = clamp(y, ARRIBA + alto + 6, H - ABAJO);
  for (const o of vivas) { const oy = parseFloat(o.style.top); if (Math.abs(oy - top) < alto + 6 && Math.abs(parseFloat(o.style.left) - x) < ancho) top = oy - alto - 10; }
  top = Math.max(ARRIBA + alto + 6, top);
  b.style.left = clamp(x, ancho / 2 + 10, W - ancho / 2 - 10) + "px"; b.style.top = top + "px";
  setTimeout(() => { b.classList.add("fuera"); setTimeout(() => b.remove(), 700); }, dura);
}
const chispas = [];
function corazones(x, y, n, fuerza = 120, colores = ["#ff6f9b", "#ffb3c7", "#ffffff", "#ffd166"]) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), v = rnd(fuerza * 0.3, fuerza);
    chispas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - fuerza * 0.3, v: rnd(1.2, 2.2), m: 2.2, c: colores[i % colores.length], k: i % 3 === 0 ? "e" : "c", s: rnd(5, 10), r: rnd(-1, 1) });
  }
}

/* ═══════════════════════════ EL CIELO ═══════════════════════════ */

let estrellas = [], fondo = null, luna = 0, lunaVista = false, constel = 0, corazonFondo = 0;
function pintarFondo() {
  fondo = document.createElement("canvas"); fondo.width = W * DPR; fondo.height = H * DPR;
  const f = fondo.getContext("2d"); f.scale(DPR, DPR);
  const gr = f.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, "#150c2c"); gr.addColorStop(0.45, "#2d1648"); gr.addColorStop(0.8, "#5a2358"); gr.addColorStop(1, "#8a3a62");
  f.fillStyle = gr; f.fillRect(0, 0, W, H);
  // las nubecitas de abajo, en capas
  const capas = [["rgba(255,150,190,.10)", 0.8, 38], ["rgba(255,170,200,.14)", 0.87, 30], ["rgba(255,196,214,.18)", 0.94, 24]];
  for (const [c, yy, rr] of capas) {
    f.fillStyle = c; f.beginPath();
    for (let x = -rr; x < W + rr; x += rr * 1.1) { const cy = H * yy + Math.sin(x * 0.03) * 8, cr = rr + Math.sin(x) * 6; f.moveTo(x + cr, cy); f.arc(x, cy, cr, 0, Math.PI * 2); }
    f.rect(0, H * yy, W, H); f.fill();
  }
  estrellas = [];
  for (let i = 0; i < Math.round((W * H) / 2600); i++) estrellas.push({ x: Math.random() * W, y: Math.random() * H * 0.82, r: Math.random() < 0.12 ? rnd(1.2, 1.8) : rnd(0.4, 1), f: rnd(0, 7), v: rnd(0.6, 1.8) });
}
function estrella4(x, y, r, c) {
  g.fillStyle = c; g.beginPath(); g.moveTo(x, y - r); g.quadraticCurveTo(x, y, x + r, y); g.quadraticCurveTo(x, y, x, y + r); g.quadraticCurveTo(x, y, x - r, y); g.quadraticCurveTo(x, y, x, y - r); g.fill();
}
function corazonPath(x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * 0.35);
  g.bezierCurveTo(x - s * 1.1, y - s * 0.35, x - s * 0.5, y - s * 1.05, x, y - s * 0.45);
  g.bezierCurveTo(x + s * 0.5, y - s * 1.05, x + s * 1.1, y - s * 0.35, x, y + s * 0.35);
}
function dibujaCielo() {
  g.drawImage(fondo, 0, 0, W, H);
  // auroras suaves
  for (let k = 0; k < 2; k++) {
    const gr = g.createLinearGradient(0, H * 0.1, 0, H * 0.45);

  if (juntos) { const k = Math.min(1, juntos.t); const gr = g.createRadialGradient(juntos.cx, juntos.cy, 0, juntos.cx, juntos.cy, R * 5); gr.addColorStop(0, `rgba(255,120,170,${0.35 * k})`); gr.addColorStop(1, "rgba(255,120,170,0)"); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
  dibujaHilo(juntos ? 0.4 : hiloTenso);
  dibujaMundo(A, B, cerca); dibujaMundo(B, A, cerca);
  for (const c of cartas) dibujaCarta(c);
  dibujaChispas(dt);
}

/* ═══════════════════════════ ARRANCAR ═══════════════════════════ */

function medir() {
  W = innerWidth; H = innerHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const cs = getComputedStyle(document.documentElement);
  const px = (v) => { const d = document.createElement("div"); d.style.cssText = `position:absolute;visibility:hidden;height:${v}`; document.body.appendChild(d); const h = d.offsetHeight; d.remove(); return h; };
  ARRIBA = px("var(--seg-t)") + 96; ABAJO = px("calc(var(--barra) + var(--seg-b))") + 30;
  R = clamp(Math.min(W, H) * 0.095, 28, 48);
  const nuevo = !A.x;
  for (const p of MUNDOS) if (nuevo || juntos === null) { p.x = W * p.casa[0]; p.y = H * p.casa[1]; limites(p); }
  D0 = Math.hypot(B.x - A.x, B.y - A.y);
  if (juntos) { juntos.cx = W / 2; juntos.cy = H * 0.5; juntos.ax = A.x; juntos.ay = A.y; juntos.bx = B.x; juntos.by = B.y; }
  pintarFondo(); if (!juntos) iniciarHilo();
  void cs;
}
medir();
if (/prueba/.test(location.search)) window.__hilo = { A, B };
let tRes = null;
addEventListener("resize", () => { clearTimeout(tRes); tRes = setTimeout(medir, 150); });
$("pista").textContent = CONFIG.PISTA;
setTimeout(() => { if (!pistaVista) $("pista").classList.add("ver"); }, 1400);
let ultimo = performance.now();
function cuadro(ahora) {
  const dt = Math.min(0.05, Math.max(0, (ahora - ultimo) / 1000)); ultimo = ahora;
  if (!document.hidden) { actualizar(dt); dibujar(dt); }
  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);
})();
