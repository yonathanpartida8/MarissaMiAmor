<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El mapa de nosotros</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500;700&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   EL MAPA DE NOSOTROS — «Toca un alfiler»
   Un mapa dibujado a mano con un camino punteado y cinco alfileres, en
   orden: lo nuestro, desde el principio. Cada alfiler abre su nota; el
   camino se va entintando conforme lo recorres. Prefijo `mp-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #efe0c4; }
.mp {
  position: fixed;
  inset: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  font-family: "Cormorant Garamond", Georgia, serif;
  color: #4a2a20;
  background:
    radial-gradient(ellipse 80% 60% at 30% 20%, rgba(255, 248, 230, 0.8), transparent 70%),
    radial-gradient(ellipse 70% 50% at 80% 90%, rgba(196, 150, 100, 0.25), transparent 70%),
    linear-gradient(160deg, #f5e8cf, #ead6b2 55%, #dcc398);
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
  --tinta: #7a3b2e;
}
/* Las orillas del papel, tostadas por el tiempo. */
.mp::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 70px rgba(120, 70, 30, 0.45), inset 0 0 18px rgba(90, 50, 20, 0.35);
}
.mp-grano { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0.55; mix-blend-mode: multiply; }

.mp-mapa {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.mp-lienzo { transition: transform 1100ms var(--suave); transform-origin: 0 0; }

.mp-deco { fill: none; stroke: var(--tinta); stroke-linecap: round; stroke-linejoin: round; opacity: 0.35; }
.mp-camino-fondo { fill: none; stroke: rgba(122, 59, 46, 0.35); stroke-width: 0.55; stroke-dasharray: 0.2 1.6; stroke-linecap: round; }
.mp-camino-tinta { fill: none; stroke: #b3263e; stroke-width: 0.8; stroke-dasharray: 1.8 1.3; stroke-linecap: round; }
.mp-icono { fill: none; stroke: var(--tinta); stroke-width: 0.45; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; transition: opacity 600ms ease; }
.mp-alfiler { cursor: pointer; outline: none; }
.mp-alfiler:focus-visible .mp-bola { stroke: #fff; stroke-width: 0.5; }
.mp-alfiler .mp-cabeza { transition: transform 500ms var(--suave); transform-box: fill-box; transform-origin: 50% 100%; }
.mp-alfiler.is-visto .mp-bola { fill: url(#bolaVista); }
.mp-alfiler.is-actual .mp-cabeza { animation: mp-salta 900ms var(--suave); }
@keyframes mp-salta {
  0% { transform: translateY(0) scale(1); }
  30% { transform: translateY(-2.4px) scale(1.12, 0.92); }
  60% { transform: translateY(0) scale(0.94, 1.06); }
  100% { transform: translateY(0) scale(1); }
}
.mp-num { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; fill: #fff6ef; text-anchor: middle; pointer-events: none; }
.mp-onda { fill: none; stroke: #b3263e; stroke-width: 0.35; opacity: 0; }
.mp-alfiler.is-llamando .mp-onda { animation: mp-onda 2.2s ease-out infinite; }
@keyframes mp-onda { 0% { opacity: 0.7; r: 1.4; } 100% { opacity: 0; r: 5.5; } }

.mp-cartela {
  position: absolute;
  top: calc(var(--seg-t) + 12px);
  left: 50%;
  transform: translateX(-50%) rotate(-1.2deg);
  margin: 0;
  padding: 6px 18px 8px;
  font-family: "Caveat", "Segoe Print", cursive;
  font-weight: 700;
  font-size: clamp(1.4rem, 6.4vw, 1.9rem);
  color: #7a3b2e;
  background: rgba(255, 248, 232, 0.72);
  border: 1px solid rgba(122, 59, 46, 0.35);
  border-radius: 3px;
  box-shadow: 0 6px 16px -10px rgba(80, 40, 20, 0.6);
  white-space: nowrap;
  pointer-events: none;
}
.mp-cartela small {
  display: block;
  margin-top: -2px;
  text-align: center;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-weight: 600;
  font-size: 0.34em;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(122, 59, 46, 0.7);
}

/* ---- La nota que se abre ---------------------------------------------- */
.mp-nota {
  position: absolute;
  left: 50%;
  bottom: calc(var(--seg-b) + var(--barra) + 12px);
  width: min(92vw, 420px);
  max-height: 46%;
  box-sizing: border-box;
  padding: 18px 20px 14px;
  background:
    repeating-linear-gradient(0deg, transparent 0 25px, rgba(122, 59, 46, 0.08) 25px 26px),
    linear-gradient(170deg, #fffaf0, #fbefdc);
  border-radius: 4px;
  box-shadow: 0 18px 40px -18px rgba(70, 30, 10, 0.7), 0 2px 0 rgba(255, 255, 255, 0.8) inset;
  transform: translate(-50%, 120%) rotate(3deg);
  opacity: 0;
  transition: transform 800ms var(--suave), opacity 500ms ease;
  overflow: auto;
  scrollbar-width: none;
}
.mp-nota::-webkit-scrollbar { display: none; }
.mp-nota.is-abierta { transform: translate(-50%, 0) rotate(var(--giro, -0.8deg)); opacity: 1; }
/* Un pedazo de cinta, sujetando la nota. */
.mp-nota::before {
  content: "";
  position: absolute;
  top: -9px;
  left: 50%;
  width: 84px;
  height: 20px;
  transform: translateX(-50%) rotate(-3deg);
  background: rgba(240, 190, 190, 0.7);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
}
.mp-nota h2 {
  margin: 0 0 6px;
  font-family: "Caveat", "Segoe Print", cursive;
  font-weight: 700;
  font-size: clamp(1.5rem, 6.8vw, 1.95rem);
  line-height: 1.05;
  color: #a3243c;
}
.mp-nota p {
  margin: 0 0 8px;
  font-size: clamp(1.02rem, 4.4vw, 1.18rem);
  line-height: 1.42;
  color: #3e2419;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 700ms ease, transform 700ms var(--suave);
}
.mp-nota p.is-ve { opacity: 1; transform: none; }
.mp-mando {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 6px;
}
.mp-mando button {
  width: 40px; height: 40px;
  border: 1px solid rgba(122, 59, 46, 0.3);
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.5);
  color: #7a3b2e;
  font: 600 1.3rem/1 "Cormorant Garamond", Georgia, serif;
  cursor: pointer;
}
.mp-mando button:disabled { opacity: 0.25; }
.mp-puntos { display: flex; gap: 7px; }
.mp-puntos i { width: 7px; height: 7px; border-radius: 50%; background: rgba(163, 36, 60, 0.25); transition: background 400ms ease, transform 400ms ease; }
.mp-puntos i.is-actual { background: #a3243c; transform: scale(1.3); }

.mp-pista {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--seg-b) + var(--barra) + 18px);
  margin: 0;
  text-align: center;
  pointer-events: none;
  font-size: clamp(0.6rem, 2.5vw, 0.7rem);
  font-weight: 600;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: rgba(122, 59, 46, 0.7);
  transition: opacity 600ms ease;
}
.mp.is-leyendo .mp-pista { opacity: 0; }

@media (orientation: landscape) and (max-height: 540px) {
  .mp-nota {
    left: auto;
    right: calc(var(--seguro-lado, 0px) + 16px);
    bottom: auto;
    top: 50%;
    width: min(44vw, 380px);
    max-height: 84%;
    transform: translate(120%, -50%) rotate(3deg);
  }
  .mp-nota.is-abierta { transform: translate(0, -50%) rotate(var(--giro, -0.8deg)); }
}
</style>
</head>
<body>
<div class="mp" id="mundo">
  <svg class="mp-grano" aria-hidden="true">
    <filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0 0.18  0 0 0 0.35 0"/></filter>
    <rect width="100%" height="100%" filter="url(#grano)"/>
  </svg>
  <svg class="mp-mapa" id="mapa" aria-label="El mapa de nosotros"></svg>
  <p class="mp-cartela">El mapa de nosotros<small>toca un alfiler</small></p>
  <p class="mp-pista" id="pista">empieza por el primero</p>
  <article class="mp-nota" id="nota" aria-live="polite">
    <h2 id="notaTitulo"></h2>
    <div id="notaTexto"></div>
    <div class="mp-mando">
      <button type="button" id="antes" aria-label="Anterior">‹</button>
      <div class="mp-puntos" id="puntos"></div>
      <button type="button" id="despues" aria-label="Siguiente">›</button>
    </div>
  </article>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE HAY EN EL MAPA. Sólo esto, en este orden, con sus palabras.
   ══════════════════════════════════════════════════════════════════════ */
const MOMENTOS = [
  {
    titulo: "Donde te vi:",
    textos: ["En mi casa. Estabas tan bonita, sentada en mi sillón."],
    icono: "sillon",
  },
  {
    titulo: "Nuestro primer contacto:",
    textos: [
      "Tú me diste discos de videojuegos y yo me puse muy feliz.",
      "Después hablamos por TikTok, nos tuvimos agregados en TikTok y yo te mandaba videos graciosos. Era mi manera rara de mostrar interés.",
      "Rompí el hielo y te mostré todo mi cariño de una. Casi no sabía cómo retenerlo.",
    ],
    icono: "disco",
  },
  {
    titulo: "23 de agosto de 2025:",
    textos: ["Te pedí que fueras mi novia.", "Realmente te amo muchísimo."],
    icono: "corazon",
  },
  {
    titulo: "Después, nuestro primer beso.",
    textos: ["Aunque fue algo chistoso, casi me desmayo. No dormí por horas."],
    icono: "beso",
  },
  {
    titulo: "El viaje.",
    textos: ["Vivir en Morelia y consentirte tan lindo."],
    icono: "maleta",
  },
];

/* ══════════════════════════════════════════════════════════════════════ */
const mundo = document.getElementById("mundo");
const mapa = document.getElementById("mapa");
const nota = document.getElementById("nota");
const elTitulo = document.getElementById("notaTitulo");
const elTexto = document.getElementById("notaTexto");
const btnAntes = document.getElementById("antes");
const btnDespues = document.getElementById("despues");
const elPuntos = document.getElementById("puntos");
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS = "http://www.w3.org/2000/svg";
const s = (tag, attrs, padre) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (padre) padre.appendChild(e);
  return e;
};

/* ══════════════════════════════════════════════════════════════════════
   LOS DIBUJITOS (a pluma): el sillón, el disco, el corazón, el beso y la
   maleta. Cada uno en un cuadrito de 10×10, centrado en 0,0.
   ══════════════════════════════════════════════════════════════════════ */
const ICONOS = {
  sillon: "M-4,1 L-4,-2 Q-4,-4 -2,-4 L2,-4 Q4,-4 4,-2 L4,1 M-5,1 L5,1 L5,3 L-5,3 Z M-4,3 L-4,4.5 M4,3 L4,4.5 M-5,1 Q-5.6,-0.5 -4,-0.6 M5,1 Q5.6,-0.5 4,-0.6",
  disco: "M0,-4.5 A4.5,4.5 0 1 1 -0.01,-4.5 Z M0,-1.2 A1.2,1.2 0 1 1 -0.01,-1.2 Z M-2.8,-2 Q-1.8,-3.2 -0.4,-3.4 M2.6,2.2 Q1.8,3.2 0.6,3.4",
  corazon: "M0,4 C-6,0 -4.5,-4.6 -1.6,-4 C-0.6,-3.8 0,-3 0,-2.3 C0,-3 0.6,-3.8 1.6,-4 C4.5,-4.6 6,0 0,4 Z M-2.2,-2.2 Q-3,-1 -2.2,0.4",
  beso: "M-5,0 Q-2.5,-3.2 0,-1.4 Q2.5,-3.2 5,0 Q2.5,3.6 0,3.2 Q-2.5,3.6 -5,0 Z M-5,0 Q0,0.8 5,0",
  maleta: "M-5,-2 L5,-2 L5,4 L-5,4 Z M-2,-2 L-2,-4 L2,-4 L2,-2 M-5,1 L5,1 M-3,-2 L-3,4 M3,-2 L3,4",
};

/* ══════════════════════════════════════════════════════════════════════
   EL MAPA
   ══════════════════════════════════════════════════════════════════════ */
let W = 100, Hh = 160;
let pines = [], caminoTinta = null, largoTotal = 0, largos = [], lienzoMapa = null;
let actual = -1, vistoHasta = -1;

function posiciones(apaisado) {
  if (apaisado) return [[0.1, 0.36], [0.3, 0.68], [0.5, 0.34], [0.7, 0.66], [0.88, 0.38]];
  return [[0.26, 0.2], [0.72, 0.33], [0.3, 0.49], [0.7, 0.64], [0.36, 0.8]];
}

/* Una curva suave que pasa por todos los puntos (Catmull-Rom). */
function curva(puntos) {
  let d = `M${puntos[0][0]},${puntos[0][1]}`;
  for (let i = 0; i < puntos.length - 1; i++) {
    const p0 = puntos[i - 1] || puntos[i], p1 = puntos[i], p2 = puntos[i + 1], p3 = puntos[i + 2] || p2;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(2)},${c1[1].toFixed(2)} ${c2[0].toFixed(2)},${c2[1].toFixed(2)} ${p2[0].toFixed(2)},${p2[1].toFixed(2)}`;
  }
  return d;
}

function construir() {
  const r = mundo.getBoundingClientRect();
  const apaisado = r.width > r.height * 1.2;
  W = 100; Hh = 100 * r.height / r.width;
  mapa.setAttribute("viewBox", `0 0 ${W} ${Hh.toFixed(2)}`);
  mapa.replaceChildren();
  const defs = s("defs", {}, mapa);
  const bola = s("radialGradient", { id: "bola", cx: "35%", cy: "30%", r: "70%" }, defs);
  s("stop", { offset: "0", "stop-color": "#ff8f9f" }, bola);
  s("stop", { offset: "0.55", "stop-color": "#d42a48" }, bola);
  s("stop", { offset: "1", "stop-color": "#7e0f24" }, bola);
  const bolaV = s("radialGradient", { id: "bolaVista", cx: "35%", cy: "30%", r: "70%" }, defs);
  s("stop", { offset: "0", "stop-color": "#ffd28a" }, bolaV);
  s("stop", { offset: "0.55", "stop-color": "#e0a030" }, bolaV);
  s("stop", { offset: "1", "stop-color": "#8a5a10" }, bolaV);
  const mascara = s("mask", { id: "revela", maskUnits: "userSpaceOnUse" }, defs);

  lienzoMapa = s("g", { class: "mp-lienzo" }, mapa);

  // ---- Adornos del mapa: rosa de los vientos, olitas, montes y arbolitos.
  const deco = s("g", { class: "mp-deco", "stroke-width": 0.35 }, lienzoMapa);
  const [rx, ry] = apaisado ? [W * 0.9, Hh * 0.82] : [W * 0.84, Hh * 0.9];
  const rr = apaisado ? 5 : 6.5;
  s("circle", { cx: rx, cy: ry, r: rr }, deco);
  s("circle", { cx: rx, cy: ry, r: rr * 0.72, "stroke-dasharray": "0.3 0.8" }, deco);
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4, l = i % 2 ? rr * 0.6 : rr * 1.15;
    const ax = Math.cos(a - Math.PI / 2), ay = Math.sin(a - Math.PI / 2);
    const px = Math.cos(a), py = Math.sin(a);
    s("path", { d: `M${rx},${ry} L${rx + ax * l},${ry + ay * l} M${rx + px * 0.8},${ry + py * 0.8} L${rx + ax * l},${ry + ay * l} L${rx - px * 0.8},${ry - py * 0.8}` }, deco);
  }
  const n = s("text", { x: rx, y: ry - rr * 1.35, "font-size": 2.4, "text-anchor": "middle", fill: "#7a3b2e", stroke: "none", "font-family": "Cormorant Garamond, serif", "font-weight": 600 }, deco);
  n.textContent = "N";
  // Olitas en una esquina.
  for (let k = 0; k < 4; k++) {
    const oy = (apaisado ? Hh * 0.12 : Hh * 0.06) + k * 2.2 + (apaisado ? 0 : Hh * 0.03);
    const ox = apaisado ? W * 0.56 : W * 0.06;
    let d = `M${ox},${oy}`;
    for (let j = 0; j < 5; j++) d += ` q1.2,-1 2.4,0 t2.4,0`;
    s("path", { d }, deco);
  }
  // Montañitas.
  const montes = apaisado ? [[W * 0.2, Hh * 0.14], [W * 0.26, Hh * 0.16], [W * 0.62, Hh * 0.9]] : [[W * 0.6, Hh * 0.1], [W * 0.68, Hh * 0.115], [W * 0.1, Hh * 0.62], [W * 0.84, Hh * 0.46]];
  for (const [mx, my] of montes) {
    s("path", { d: `M${mx - 4},${my + 3} L${mx},${my - 3} L${mx + 4},${my + 3} M${mx - 1},${my - 1.5} L${mx + 0.6},${my - 0.4} L${mx + 1.6},${my - 1.2}` }, deco);
  }
  // Arbolitos.
  const arboles = apaisado ? [[W * 0.42, Hh * 0.82], [W * 0.45, Hh * 0.86], [W * 0.78, Hh * 0.18]] : [[W * 0.12, Hh * 0.36], [W * 0.16, Hh * 0.39], [W * 0.88, Hh * 0.22], [W * 0.56, Hh * 0.75], [W * 0.6, Hh * 0.78]];
  for (const [ax, ay] of arboles) {
    s("circle", { cx: ax, cy: ay - 1.6, r: 1.4 }, deco);
    s("path", { d: `M${ax},${ay - 0.2} L${ax},${ay + 1.6}` }, deco);
  }
  // Un río que serpentea.
  const rio = apaisado
    ? `M0,${Hh * 0.9} C${W * 0.2},${Hh * 0.8} ${W * 0.3},${Hh * 0.98} ${W * 0.5},${Hh * 0.92} S${W * 0.8},${Hh * 0.98} ${W},${Hh * 0.9}`
    : `M${W},${Hh * 0.42} C${W * 0.8},${Hh * 0.4} ${W * 0.86},${Hh * 0.52} ${W * 0.7},${Hh * 0.55} S${W * 0.5},${Hh * 0.56} ${W * 0.52},${Hh * 0.6}`;
  s("path", { d: rio, "stroke-width": 0.5 }, deco);
  s("path", { d: rio, "stroke-width": 0.25, transform: "translate(0.9 0.6)" }, deco);
  // Corazoncitos sueltos, apenas.
  for (let i = 0; i < 7; i++) {
    const hx = Math.random() * W, hy = Hh * (0.12 + Math.random() * 0.8);
    s("path", { d: `M${hx},${hy + 0.8} c-1.3,-0.9 -0.9,-2 0,-1.5 c0.9,-0.5 1.3,0.6 0,1.5 z`, "stroke-width": 0.25, opacity: 0.6 }, deco);
  }
  // Un marco punteado.
  s("rect", { x: 2.2, y: 2.2, width: W - 4.4, height: Hh - 4.4, rx: 1.2, "stroke-dasharray": "0.3 1.2", "stroke-width": 0.35 }, deco);

  // ---- El camino.
  const pos = posiciones(apaisado).map(([fx, fy]) => [fx * W, fy * Hh]);
  const d = curva(pos);
  s("path", { d, class: "mp-camino-fondo" }, lienzoMapa);
  caminoTinta = s("path", { d, class: "mp-camino-tinta", mask: "url(#revela)" }, lienzoMapa);
  const revelador = s("path", { d, fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-linecap": "round" }, mascara);
  largoTotal = revelador.getTotalLength();
  revelador.style.strokeDasharray = `${largoTotal} ${largoTotal}`;
  revelador.style.strokeDashoffset = `${largoTotal}`;
  caminoTinta.revelador = revelador;
  // El largo del camino hasta cada alfiler.
  largos = pos.map(([px, py]) => {
    let mejor = 0, dmin = Infinity;
    for (let l = 0; l <= largoTotal; l += 0.25) {
      const q = revelador.getPointAtLength(l);
      const dd = Math.hypot(q.x - px, q.y - py);
      if (dd < dmin) { dmin = dd; mejor = l; }
    }
    return mejor;
  });

  // ---- Los alfileres, con su dibujito al lado.
  pines = pos.map(([px, py], i) => {
    const lado = px > W / 2 ? -1 : 1;
    const ic = s("g", { class: "mp-icono", transform: `translate(${(px + lado * 8.5).toFixed(2)} ${(py - 2).toFixed(2)}) scale(0.8)` }, lienzoMapa);
    s("path", { d: ICONOS[MOMENTOS[i].icono] }, ic);
    const gp = s("g", { class: "mp-alfiler", transform: `translate(${px.toFixed(2)} ${py.toFixed(2)})`, role: "button", tabindex: 0, "aria-label": MOMENTOS[i].titulo }, lienzoMapa);
    s("circle", { class: "mp-onda", cx: 0, cy: 0, r: 1.4 }, gp);
    s("ellipse", { cx: 0.9, cy: 0.4, rx: 1.6, ry: 0.55, fill: "rgba(60,30,10,.28)" }, gp);
    const cab = s("g", { class: "mp-cabeza" }, gp);
    s("path", { d: "M0,0 L-0.25,-3.6 L0.25,-3.6 Z", fill: "#8a8f96" }, cab);
    s("circle", { class: "mp-bola", cx: 0, cy: -4.6, r: 2.1, fill: "url(#bola)", stroke: "#5a0a18", "stroke-width": 0.15 }, cab);
    s("circle", { cx: -0.7, cy: -5.3, r: 0.55, fill: "rgba(255,255,255,.75)" }, cab);
    const t = s("text", { class: "mp-num", x: 0, y: -3.95, "font-size": 2.3 }, cab);
    t.textContent = i + 1;
    // Zona de toque generosa, invisible.
    s("circle", { cx: 0, cy: -3, r: 5.5, fill: "transparent" }, gp);
    gp.addEventListener("click", () => abrir(i));
    gp.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); abrir(i); } });
    return { g: gp, x: px, y: py };
  });
  marcar();
  pintarRevelado(vistoHasta >= 0 ? largos[vistoHasta] : 0, false);
  if (actual >= 0) enfocar(actual, false);
}

function marcar() {
  pines.forEach((p, i) => {
    p.g.classList.toggle("is-visto", i <= vistoHasta);
    p.g.classList.toggle("is-llamando", i === vistoHasta + 1 && actual < 0 || (actual >= 0 && i === actual + 1 && i > vistoHasta));
  });
}

/* El camino se entinta hasta un largo, despacio, como a pluma. */
let largoPintado = 0;
function pintarRevelado(hasta, animar = true) {
  const rv = caminoTinta?.revelador;
  if (!rv) return;
  if (!animar || suave) {
    largoPintado = hasta;
    rv.style.strokeDashoffset = `${largoTotal - hasta}`;
    return;
  }
  const desde = largoPintado, t0 = performance.now(), dur = 900 + Math.abs(hasta - desde) * 18;
  const paso = (ahora) => {
    const k = Math.min(1, (ahora - t0) / dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    largoPintado = desde + (hasta - desde) * e;
    rv.style.strokeDashoffset = `${largoTotal - largoPintado}`;
    if (k < 1) requestAnimationFrame(paso);
  };
  requestAnimationFrame(paso);
  if (hasta > desde) pluma(dur / 1000);
}

/* Acerca el mapa al alfiler, dejándolo a la vista por encima de la nota. */
function enfocar(i, animar = true) {
  const r = mundo.getBoundingClientRect();
  const apaisado = r.width > r.height * 1.2;
  const esc = 1.35;
  const p = pines[i];
  // Todo en unidades del dibujo (el mapa mide W×Hh), no en píxeles.
  const objX = apaisado ? W * 0.3 : W * 0.5;
  const objY = apaisado ? Hh * 0.5 : Hh * 0.3;
  let tx = objX - p.x * esc, ty = objY - p.y * esc;
  tx = Math.min(0, Math.max(W - W * esc, tx));
  ty = Math.min(0, Math.max(Hh - Hh * esc, ty));
  lienzoMapa.style.transition = animar ? "" : "none";
  lienzoMapa.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${esc})`;
}
function alejar() {
  lienzoMapa.style.transform = "";
}

/* ══════════════════════════════════════════════════════════════════════
   LA NOTA
   ══════════════════════════════════════════════════════════════════════ */
function abrir(i) {
  despertar();
  const nuevo = i > vistoHasta;
  const salto = actual >= 0 && actual !== i;
  actual = i;
  if (nuevo) vistoHasta = Math.max(vistoHasta, i);
  pines.forEach((p, k) => p.g.classList.toggle("is-actual", k === i));
  // Reinicia la animación del saltito.
  const cab = pines[i].g;
  cab.classList.remove("is-actual"); void cab.getBBox(); cab.classList.add("is-actual");
  marcar();
  enfocar(i);
  pintarRevelado(largos[vistoHasta]);
  sonidoAlfiler(i);
  mundo.classList.add("is-leyendo");
  const poner = () => {
    const m = MOMENTOS[i];
    elTitulo.textContent = m.titulo;
    elTexto.replaceChildren();
    m.textos.forEach((t, k) => {
      const p = document.createElement("p");
      p.textContent = t;
      elTexto.append(p);
      setTimeout(() => p.classList.add("is-ve"), (suave ? 0 : 380) + k * (suave ? 0 : 520));
    });
    nota.style.setProperty("--giro", `${(i % 2 ? 0.9 : -1.1)}deg`);
    nota.scrollTop = 0;
    btnAntes.disabled = i === 0;
    btnDespues.disabled = i === MOMENTOS.length - 1;
    elPuntos.replaceChildren(...MOMENTOS.map((_, k) => { const d = document.createElement("i"); if (k === i) d.className = "is-actual"; return d; }));
    nota.classList.add("is-abierta");
    papel();
  };
  if (salto && nota.classList.contains("is-abierta")) {
    nota.classList.remove("is-abierta");
    setTimeout(poner, suave ? 0 : 380);
  } else poner();
  if (vistoHasta === MOMENTOS.length - 1 && nuevo) setTimeout(final, 1600);
}
function cerrar() {
  nota.classList.remove("is-abierta");
  mundo.classList.remove("is-leyendo");
  pines.forEach((p) => p.g.classList.remove("is-actual"));
  actual = -1;
  marcar();
  alejar();
}
btnAntes.addEventListener("click", (e) => { e.stopPropagation(); if (actual > 0) abrir(actual - 1); });
btnDespues.addEventListener("click", (e) => { e.stopPropagation(); if (actual < MOMENTOS.length - 1) abrir(actual + 1); });
nota.addEventListener("click", (e) => e.stopPropagation());
mundo.addEventListener("click", (e) => {
  if (e.target.closest(".mp-alfiler, .mp-nota")) return;
  if (actual >= 0) cerrar();
});

/* Al llegar al último: el camino entero brilla y salen corazoncitos. */
let yaFinal = false;
function final() {
  if (yaFinal) return;
  yaFinal = true;
  caminoTinta.style.transition = "stroke 1.2s ease, stroke-width 1.2s ease";
  caminoTinta.style.stroke = "#d4193f";
  caminoTinta.style.strokeWidth = "1";
  const brillo = s("path", { d: caminoTinta.getAttribute("d"), fill: "none", stroke: "#ffb3c2", "stroke-width": 2.6, "stroke-linecap": "round", opacity: 0, mask: "url(#revela)" }, lienzoMapa);
  lienzoMapa.insertBefore(brillo, caminoTinta);
  brillo.animate([{ opacity: 0 }, { opacity: 0.55 }, { opacity: 0.18 }], { duration: 2400, fill: "forwards", easing: "ease-out" });
  for (let k = 0; k < 14; k++) {
    const l = Math.random() * largoTotal;
    const q = caminoTinta.revelador.getPointAtLength(l);
    const h = s("path", { d: `M${q.x},${q.y + 0.9} c-1.5,-1 -1,-2.3 0,-1.7 c1,-0.6 1.5,0.7 0,1.7 z`, fill: "#e0385a", opacity: 0 }, lienzoMapa);
    h.animate([
      { opacity: 0, transform: "translate(0,0) scale(0.4)" },
      { opacity: 0.9, transform: "translate(0,-2px) scale(1)", offset: 0.3 },
      { opacity: 0, transform: `translate(${(Math.random() * 4 - 2).toFixed(1)}px,-9px) scale(0.8)` },
    ], { duration: 2600 + Math.random() * 1400, delay: k * 120, easing: "ease-out", fill: "forwards" });
  }
  campanitas();
}

/* ══════════════════════════════════════════════════════════════════════
   EL SONIDO
   ══════════════════════════════════════════════════════════════════════ */
let ac = null, salida = null;
function despertar() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  salida = ac.createGain();
  salida.gain.value = 0.9;
  salida.connect(ac.destination);
  return ac;
}
function ruido(dur, curva = 2) {
  const n = Math.max(1, Math.floor(ac.sampleRate * dur));
  const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, curva);
  const x = ac.createBufferSource(); x.buffer = b; return x;
}
const ESCALA = [392, 440, 523.25, 587.33, 659.25, 783.99];
function sonidoAlfiler(i) {
  if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), gg = ac.createGain();
  o.frequency.setValueAtTime(900, t);
  o.frequency.exponentialRampToValueAtTime(300, t + 0.06);
  gg.gain.setValueAtTime(0.0001, t);
  gg.gain.exponentialRampToValueAtTime(0.1, t + 0.004);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  o.connect(gg).connect(salida);
  o.start(t); o.stop(t + 0.1);
  for (const [k, dd] of [[0, 0.05], [2, 0.16]]) {
    const f = ESCALA[(i + k) % ESCALA.length] * 2;
    const n = ac.createOscillator(), gn = ac.createGain();
    n.frequency.value = f;
    gn.gain.setValueAtTime(0, t + dd);
    gn.gain.linearRampToValueAtTime(0.04, t + dd + 0.01);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + dd + 1.2);
    n.connect(gn).connect(salida);
    n.start(t + dd); n.stop(t + dd + 1.3);
  }
}
function papel() {
  if (!ac) return;
  const t = ac.currentTime, x = ruido(0.35, 1.5);
  const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 2200;
  const gg = ac.createGain(); gg.gain.value = 0.05;
  x.connect(f).connect(gg).connect(salida);
  x.start(t);
}
function pluma(seg) {
  if (!ac) return;
  const t = ac.currentTime;
  for (let k = 0; k < seg * 7; k++) {
    const x = ruido(0.05, 3), f = ac.createBiquadFilter(), gg = ac.createGain();
    f.type = "bandpass"; f.frequency.value = 3800 + Math.random() * 1500; f.Q.value = 3;
    gg.gain.value = 0.03;
    x.connect(f).connect(gg).connect(salida);
    x.start(t + k / 7 + Math.random() * 0.05);
  }
}
function campanitas() {
  if (!ac) return;
  const t = ac.currentTime;
  [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => {
    const o = ac.createOscillator(), gg = ac.createGain();
    o.frequency.value = f;
    gg.gain.setValueAtTime(0, t + i * 0.15);
    gg.gain.linearRampToValueAtTime(0.04, t + i * 0.15 + 0.01);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.15 + 2);
    o.connect(gg).connect(salida);
    o.start(t + i * 0.15); o.stop(t + i * 0.15 + 2.1);
  });
}

new ResizeObserver(() => requestAnimationFrame(construir)).observe(mundo);
construir();
})();
</script>
</body>
</html>
