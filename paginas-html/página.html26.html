<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>La ciudad dormida</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   LA CIUDAD DORMIDA — «Enciende las luces»
   Una calle entera de noche, que se recorre deslizando. Cada ventana que
   tocas se prende y dentro pasa algo; si la apagas y la vuelves a prender,
   vuelve a pasar. Y en la calle y en el cielo van pasando cosas: el del
   fierro viejo, los tamales, un gato por los techos, un ovni…
   Prefijo `cd-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #070a18; }
.cd {
  position: fixed; inset: 0; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
  font-family: "Cormorant Garamond", Georgia, serif; color: #f2ecff;
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
}
.cd canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cd-cabeza { position: absolute; top: calc(var(--seg-t) + 12px); left: 0; right: 0; display: grid; justify-items: center; gap: 2px; pointer-events: none; text-align: center; padding: 0 18px; }
.cd-titulo { margin: 0; font-weight: 600; font-size: clamp(0.66rem, 2.8vw, 0.78rem); letter-spacing: 0.36em; text-transform: uppercase; color: rgba(220, 215, 255, 0.72); }
.cd-cuenta { margin: 0; font-size: 0.72rem; letter-spacing: 0.2em; color: rgba(255, 220, 160, 0.7); }
.cd-dialogo {
  position: absolute; left: 50%; bottom: calc(var(--seg-b) + var(--barra) + 14px);
  transform: translateX(-50%); width: min(90vw, 440px); box-sizing: border-box;
  margin: 0; padding: 9px 16px 11px; border-radius: 14px;
  background: rgba(16, 14, 34, 0.78); border: 1px solid rgba(255, 220, 180, 0.2);
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-family: "Caveat", "Segoe Print", cursive; font-weight: 600;
  font-size: clamp(1.2rem, 5.4vw, 1.5rem); line-height: 1.18; text-align: center; color: #ffeede;
  transition: opacity 400ms var(--suave), transform 400ms var(--suave);
  pointer-events: none; min-height: 1.2em;
}
.cd-dialogo.is-fuera { opacity: 0; transform: translate(-50%, 8px); }
.cd-pista { position: absolute; left: 0; right: 0; top: calc(var(--seg-t) + 50px); margin: 0; text-align: center; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255, 230, 190, 0.6); pointer-events: none; transition: opacity 800ms; }
.cd-pista.is-fuera { opacity: 0; }
</style>
</head>
<body>
<div class="cd" id="mundo">
  <canvas id="lienzo"></canvas>
  <div class="cd-cabeza">
    <p class="cd-titulo">Enciende las luces</p>
    <p class="cd-cuenta" id="cuenta"></p>
  </div>
  <p class="cd-pista" id="pista">desliza para recorrer la calle · toca una ventana</p>
  <p class="cd-dialogo" id="dialogo" role="status" aria-live="polite">Toda la ciudad está dormida. Toca una ventana.</p>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE PASA EN CADA VENTANA
   `dice` es lo que te digo yo al verla; `grita`, lo que sale en un
   globito desde dentro. Cada escena se dibuja con su función de abajo.
   ══════════════════════════════════════════════════════════════════════ */
const ESCENAS = [
  { id: "rgb", dice: "Wow, esa tiene luces RGB." },
  { id: "fiesta", dice: "Wow, en esa tienen una fiesta." },
  { id: "grito", grita: "¡AAAAH!", dice: "¿Escuchaste? ¡Está loco!" },
  { id: "saluda", dice: "Nos está saludando, ush, no saludes, me da celos." },
  { id: "gato", dice: "Mira, un gatito. Nos está viendo." },
  { id: "baile", dice: "Esos dos están bailando lentito. Así te voy a sacar a bailar." },
  { id: "cocina", dice: "Alguien está cocinando a esta hora. Huele rico." },
  { id: "tele", dice: "Ese se quedó dormido viendo la tele." },
  { id: "plantas", dice: "Cuántas plantitas tiene esa ventana." },
  { id: "lee", dice: "Alguien leyendo con su lamparita. Qué paz." },
  { id: "perro", grita: "¡Guau!", dice: "¡Un perrito! Nos ladró." },
  { id: "sombras", dice: "Está haciendo sombras con las manos. Es un pajarito." },
  { id: "guitarra", dice: "Alguien toca la guitarra. Escúchalo." },
  { id: "navidad", dice: "Esa tiene lucecitas de navidad todo el año." },
  { id: "cortina", dice: "Uy, cerró la cortina. Nos vio." },
  { id: "telescopio", dice: "Ese está viendo las estrellas con telescopio." },
  { id: "ejercicio", dice: "Alguien haciendo ejercicio a medianoche." },
  { id: "pastel", dice: "Ahí están festejando un cumpleaños." },
  { id: "pecera", dice: "Una pecera. Qué bonita luz da." },
  { id: "pintor", dice: "Alguien pintando un cuadro. Le salió un corazón." },
  { id: "telefono", dice: "Alguien habla por teléfono, como yo contigo." },
  { id: "corazon", dice: "Alguien dibujó un corazón en el vidrio." },
  { id: "brinca", dice: "Un niño brincando en la cama. Ya duérmete." },
  { id: "burbujas", dice: "Están haciendo burbujas de jabón." },
  { id: "videollamada", dice: "Una videollamada. Así nos vemos tú y yo, a la distancia." },
  { id: "karaoke", grita: "♪ ¡Laaa laaa! ♪", dice: "Está cantando karaoke… y bien desafinado." },
  { id: "fantasma", dice: "¿Viste eso? Dime que tú también lo viste…" },
  { id: "ojos", dice: "Esa prendió… pero no hay nadie. Solo dos ojitos." },
  { id: "lampara", dice: "Esa luz parpadea sola. Mejor sigamos." },
  { id: "abuelitos", dice: "Unos abuelitos tomados de la mano. Así quiero que lleguemos tú y yo." },
  { id: "bebe", dice: "Shhh, ahí hay un bebé dormido." },
  { id: "videojuegos", dice: "Ese está jugando videojuegos. Seguro va perdiendo." },
  { id: "tiktok", dice: "Ese está grabando un TikTok. Qué pena ajena." },
  { id: "carta", dice: "Alguien escribiendo una carta. Seguro está enamorado, como yo." },
  { id: "disco", dice: "¡Una bola disco! Ahí sí saben." },
  { id: "canario", grita: "¡Pío, pío!", dice: "Un pajarito cantando a medianoche." },
  { id: "tejiendo", dice: "Una abuelita tejiendo una bufanda. Qué ternura." },
  { id: "yoga", dice: "Alguien haciendo yoga. Namasté." },
  { id: "cafe", dice: "Alguien tomando cafecito a esta hora. No va a dormir." },
  { id: "estrellitas", dice: "Tiene estrellitas que brillan en el techo." },
  { id: "trompeta", grita: "♪ ¡Tururú! ♪", dice: "¡Uno practicando la trompeta! A esta hora…" },
];
/* Las ventanas que no tienen escena: se prenden igual y dicen algo. */
const VACIAS = [
  "Esa está vacía… por ahora.", "Nadie. Pero qué bonito cuarto.", "Aquí vive alguien muy ordenado.",
  "Uy, ahí no hay nadie.", "Se ve calientito ese cuarto.", "Esa es puro adorno.",
  "Alguien dejó la luz prendida y se fue.", "Qué bonitas cortinas.",
];
const FINAL = "Mira, ya despertaste a toda la ciudad.";

/* ══════════════════════════════════════════════════════════════════════ */
const mundo = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const g = lienzo.getContext("2d", { alpha: false });
const elDialogo = document.getElementById("dialogo");
const elCuenta = document.getElementById("cuenta");
const elPista = document.getElementById("pista");
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2;
const azar = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const elegir = (l) => l[Math.floor(Math.random() * l.length)];

let A = 0, H = 0, dpr = 1, calle = 0, techo = 0, MW = 0;   // MW: ancho del mundo
let cielo = null, lejos = null, fachada = null;
let camX = 0, velCam = 0;
const edificios = [], ventanas = [], faroles = [], arboles = [];

/* ══════════════════════════════════════════════════════════════════════
   LA CIUDAD
   ══════════════════════════════════════════════════════════════════════ */
function lienzoNuevo(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr));
  const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [c, x];
}
const TIPOS = ["ladrillo", "deco", "colonial", "vidrio", "tienda", "angosto", "ladrillo", "colonial"];
const COLORES = { ladrillo: ["#5a2a2e", "#3a1a22"], deco: ["#2a2c50", "#171834"], colonial: ["#4a6a7a", "#2e4252"], vidrio: ["#1e3048", "#10192a"], tienda: ["#5a4466", "#35263e"], angosto: ["#3a3a58", "#20203a"] };
const COLONIALES = [["#d88a6a", "#a85a4a"], ["#e0b86a", "#b08040"], ["#7aa8a0", "#4a7870"], ["#c890b0", "#986080"]];
let totalEscenas = 0;
const encendidasEscena = () => ventanas.filter((v) => v.escena && v.encendida).length;

function construir() {
  edificios.length = 0; ventanas.length = 0; faroles.length = 0; arboles.length = 0;
  const cab = document.querySelector(".cd-cabeza").getBoundingClientRect();
  const dia = elDialogo.getBoundingClientRect();
  const r0 = mundo.getBoundingClientRect();
  calle = dia.top - r0.top - 64;
  techo = cab.bottom - r0.top + 42;
  const alto = calle - techo;
  // Se alarga la calle hasta que quepan todas las escenas y sobren
  // ventanas de adorno (en apaisado, con poco alto, hace falta más calle).
  for (let intento = 0, largo = clamp(alto * 3.4, A * 1.2, A * 3.2); intento < 8; intento++, largo *= 1.2) {
    edificios.length = 0; ventanas.length = 0;
    MW = largo;
    const nE = Math.max(5, Math.round(MW / Math.max(140, A * 0.34)));
    const huecos = 12;
    const pesos = Array.from({ length: nE }, (_, i) => [1, 1.15, 0.9, 1.1, 1.25, 0.75, 1, 0.95][i % 8] * azar(0.9, 1.1));
    const suma = pesos.reduce((a, b) => a + b, 0);
    const util = MW - huecos * (nE + 1);
    const altos = [0.7, 1, 0.55, 0.85, 0.62, 0.95, 0.74, 0.58];
    let x = huecos;
    const ww = clamp(Math.min(A, alto * 0.9) * 0.085, 26, 48);
    for (let i = 0; i < nE; i++) {
      const tipo = TIPOS[i % TIPOS.length];
      const w = util * pesos[i] / suma;
      const h = alto * altos[i % altos.length];
      const e = { i, x, y: calle - h, w, h, tipo, col: tipo === "colonial" ? COLONIALES[i % COLONIALES.length] : COLORES[tipo], f: Math.random() * TAU };
      edificios.push(e);
      // Las ventanas, en rejilla, dejando la planta baja libre.
      const baja = tipo === "tienda" ? h * 0.2 : Math.min(h * 0.16, 60);
      const arribaR = tipo === "deco" ? h * 0.1 : tipo === "colonial" ? h * 0.04 : h * 0.06;
      const cols = Math.max(1, Math.floor((w - 12) / (ww * 1.38)));
      const vw = Math.min(ww, (w - 12) / cols / 1.3);
      const vh = vw * (tipo === "colonial" ? 1.45 : 1.25);
      const libre = h - baja - arribaR - 8;
      const filas = Math.max(1, Math.floor(libre / (vh * 1.34)));
      const px = (w - cols * vw) / (cols + 1);
      const py = (libre - filas * vh) / (filas + 0.5);
      for (let f = 0; f < filas; f++) for (let c = 0; c < cols; c++) {
        ventanas.push({ x: x + px + c * (vw + px), y: e.y + arribaR + py * 0.6 + f * (vh + py), w: vw, h: vh, e, escena: null, luz: 0, encendida: false, t: 0, vez: 0, fila: f, deco: Math.random() });
      }
      x += w + huecos;
    }

    if (ventanas.length >= ESCENAS.length + 14) break;
  }
  // Las escenas se reparten entre ventanas al azar; las que sobran quedan
  // como ventanas «de adorno» que también se prenden.
  const orden = ventanas.map((_, i) => i).sort(() => Math.random() - 0.5);
  ESCENAS.forEach((s, k) => { if (orden[k] !== undefined) ventanas[orden[k]].escena = s; });
  // Faroles y arbolitos en la banqueta.
  for (let fx = 70; fx < MW; fx += Math.max(220, A * 0.6)) faroles.push({ x: fx, on: true });
  for (let tx = 150; tx < MW; tx += Math.max(260, A * 0.7)) arboles.push({ x: tx + azar(-30, 30), f: Math.random() * TAU });
  pintarCielo(); pintarLejos(); pintarFachada();
  totalEscenas = ventanas.filter((v) => v.escena).length;
  elCuenta.textContent = `${encendidasEscena()} de ${totalEscenas}`;
}

function pintarCielo() {
  let x;
  [cielo, x] = lienzoNuevo(A, H);
  const gr = x.createLinearGradient(0, 0, 0, calle);
  gr.addColorStop(0, "#04061a"); gr.addColorStop(0.55, "#10183a"); gr.addColorStop(0.85, "#2a2352"); gr.addColorStop(1, "#46305e");
  x.fillStyle = gr; x.fillRect(0, 0, A, H);
  const vl = x.createLinearGradient(0, calle * 0.9, A, 0);
  vl.addColorStop(0, "rgba(120,110,200,0)"); vl.addColorStop(0.5, "rgba(140,120,210,0.12)"); vl.addColorStop(1, "rgba(120,110,200,0)");
  x.fillStyle = vl; x.fillRect(0, 0, A, calle);
}
function pintarLejos() {
  let x;
  const w = MW * 0.55 + A;
  [lejos, x] = lienzoNuevo(w, H);
  lejos.anchoCss = w;
  let bx = -10;
  while (bx < w) {
    const bw = azar(24, 60), bh = azar((calle - techo) * 0.35, (calle - techo) * 0.75);
    x.fillStyle = Math.random() < 0.5 ? "#141a36" : "#18163a";
    x.fillRect(bx, calle - bh, bw, bh);
    if (Math.random() < 0.2) x.fillRect(bx + bw * 0.45, calle - bh - 16, 2, 16);
    for (let yy = calle - bh + 6; yy < calle - 6; yy += 9) for (let xx = bx + 4; xx < bx + bw - 4; xx += 7) {
      if (Math.random() < 0.14) { x.fillStyle = `rgba(255,${azar(190, 230) | 0},140,${azar(0.25, 0.6)})`; x.fillRect(xx, yy, 2.5, 3.5); }
    }
    bx += bw + azar(0, 8);
  }
}
function pintarFachada() {
  let x;
  [fachada, x] = lienzoNuevo(MW, H);
  for (const e of edificios) {
    const [c1, c2] = e.col;
    const gr = x.createLinearGradient(e.x, 0, e.x + e.w, 0);
    gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    x.fillStyle = gr;
    x.fillRect(e.x, e.y, e.w, e.h);
    if (e.tipo === "deco") {
      // Arriba escalonado, con su aguja.
      x.fillRect(e.x + e.w * 0.12, e.y - 14, e.w * 0.76, 14);
      x.fillRect(e.x + e.w * 0.28, e.y - 28, e.w * 0.44, 14);
      x.fillRect(e.x + e.w * 0.46, e.y - 60, e.w * 0.08, 32);
      x.strokeStyle = "rgba(255,220,160,.12)"; x.lineWidth = 1;
      for (let k = 1; k < 5; k++) { x.beginPath(); x.moveTo(e.x + e.w * k / 5, e.y); x.lineTo(e.x + e.w * k / 5, calle); x.stroke(); }
    } else if (e.tipo === "colonial") {
      x.fillStyle = "#8a3a2a";
      x.beginPath(); x.moveTo(e.x - 6, e.y + 2); x.lineTo(e.x + e.w * 0.5, e.y - e.w * 0.18); x.lineTo(e.x + e.w + 6, e.y + 2); x.fill();
      x.strokeStyle = "rgba(0,0,0,.18)"; x.lineWidth = 1;
      for (let k = 0; k < 8; k++) { x.beginPath(); x.moveTo(e.x + e.w * k / 8, e.y + 2); x.lineTo(e.x + e.w * 0.5, e.y - e.w * 0.18); x.stroke(); }
      x.fillStyle = "rgba(255,245,230,.35)"; x.fillRect(e.x, e.y + 4, e.w, 3);
    }
    if (e.tipo === "ladrillo") {
      for (let yy = e.y + 4; yy < calle; yy += 6) {
        x.fillStyle = "rgba(0,0,0,.12)"; x.fillRect(e.x, yy, e.w, 1);
        for (let xx = e.x + ((yy / 6) % 2) * 6; xx < e.x + e.w; xx += 12) x.fillRect(xx, yy - 5, 1, 5);
      }
      x.fillStyle = "#2a1418"; x.fillRect(e.x, e.y, e.w, 5);
    } else if (e.tipo === "vidrio") {
      const br = x.createLinearGradient(e.x, e.y, e.x + e.w, calle);
      br.addColorStop(0, "rgba(160,200,255,.12)"); br.addColorStop(0.5, "rgba(160,200,255,0)"); br.addColorStop(1, "rgba(160,200,255,.06)");
      x.fillStyle = br; x.fillRect(e.x, e.y, e.w, e.h);
      x.fillStyle = "#101828"; x.fillRect(e.x + e.w * 0.62, e.y - 20, e.w * 0.2, 16); x.fillRect(e.x + e.w * 0.64, e.y - 4, 3, 4); x.fillRect(e.x + e.w * 0.78, e.y - 4, 3, 4);
    } else if (e.tipo === "angosto") {
      x.strokeStyle = "#20243e"; x.lineWidth = 2;
      x.beginPath(); x.moveTo(e.x + e.w * 0.3, e.y); x.lineTo(e.x + e.w * 0.3, e.y - 34); x.stroke();
      x.beginPath(); x.moveTo(e.x + e.w * 0.3 - 9, e.y - 24); x.lineTo(e.x + e.w * 0.3 + 9, e.y - 24); x.stroke();
      x.beginPath(); x.moveTo(e.x + e.w * 0.3 - 6, e.y - 16); x.lineTo(e.x + e.w * 0.3 + 6, e.y - 16); x.stroke();
    } else if (e.tipo === "tienda") {
      x.fillStyle = "rgba(0,0,0,.12)"; for (let yy = e.y + 8; yy < calle; yy += 10) x.fillRect(e.x, yy, e.w, 1);
    }
    x.fillStyle = "rgba(255,255,255,.06)"; x.fillRect(e.x, e.y, e.w, 2);
    // La planta baja: la puerta, o la panadería con su toldo.
    if (e.tipo === "tienda") {
      const ty = calle - e.h * 0.18;
      x.fillStyle = "#2a1a10"; x.fillRect(e.x + 6, ty, e.w - 12, calle - ty);
      x.fillStyle = "rgba(255,200,120,.55)"; x.fillRect(e.x + 10, ty + 8, e.w * 0.55, calle - ty - 12);
      x.fillStyle = "#c8844a";
      for (let k = 0; k < 5; k++) { x.beginPath(); x.ellipse(e.x + 18 + k * e.w * 0.1, calle - 12, 5, 3, 0, 0, TAU); x.fill(); }
      x.fillStyle = "#1a1008"; x.fillRect(e.x + e.w * 0.7, ty + 6, e.w * 0.2, calle - ty - 6);
      for (let k = 0; k < 10; k++) { x.fillStyle = k % 2 ? "#e8e0d0" : "#c8384a"; x.fillRect(e.x + 2 + k * (e.w - 4) / 10, ty - 12, (e.w - 4) / 10, 12); }
      e.letrero = { x: e.x + e.w / 2, y: ty - 22 };
    } else {
      const pw = Math.min(26, e.w * 0.22), ph = Math.min(36, e.h * 0.1);
      const px = e.x + e.w * 0.5 - pw / 2;
      x.fillStyle = "#0a0b18"; x.fillRect(px, calle - ph, pw, ph);
      if (e.tipo === "colonial") { x.beginPath(); x.arc(px + pw / 2, calle - ph, pw / 2, Math.PI, 0); x.fill(); }
      x.fillStyle = "rgba(255,200,120,.3)"; x.fillRect(px - 2, calle - ph - 3, pw + 4, 2);
      x.fillStyle = "rgba(255,230,190,.5)"; x.font = "9px sans-serif"; x.fillText(String(100 + e.i * 7), px + pw + 4, calle - ph + 10);
    }
    // Escalera de incendios en los de ladrillo.
    if (e.tipo === "ladrillo") {
      const vs = ventanas.filter((v) => v.e === e);
      const filasY = [...new Set(vs.map((v) => Math.round(v.y + v.h)))];
      x.strokeStyle = "#141018"; x.lineWidth = 1.5;
      for (const fy of filasY) {
        x.beginPath(); x.moveTo(e.x + 4, fy + 4); x.lineTo(e.x + e.w - 4, fy + 4); x.stroke();
        for (let xx = e.x + 6; xx < e.x + e.w - 4; xx += 5) { x.beginPath(); x.moveTo(xx, fy + 4); x.lineTo(xx, fy - 4); x.stroke(); }
        x.beginPath(); x.moveTo(e.x + 4, fy - 4); x.lineTo(e.x + e.w - 4, fy - 4); x.stroke();
      }
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LAS ESCENAS: cada una se pinta dentro de su ventana (w × h), t = segundos

function persona(x, y, s, col = "#1a1020", brazo = 0) {
  g.fillStyle = col;

  for (let i = paseantes.length - 1; i >= 0; i--) {
    const p = paseantes[i]; p.t += dt; p.x += p.dir * p.v * dt;
    if (p.x < camX - 80) { paseantes.splice(i, 1); continue; }
    const pa = Math.sin(p.t * 6) * 2;
    persona(p.x, calle + 12, 34, "#101018");
    g.strokeStyle = "#101018"; g.lineWidth = 2; g.beginPath(); g.moveTo(p.x - 3, calle + 12); g.lineTo(p.x - 3 + pa, calle + 14); g.moveTo(p.x + 3, calle + 12); g.lineTo(p.x + 3 - pa, calle + 14); g.stroke();
    g.strokeStyle = "rgba(200,60,60,.8)"; g.lineWidth = 1; g.beginPath(); g.moveTo(p.x - 6, calle - 8); g.lineTo(p.x - 22, calle + 4); g.stroke();
    g.fillStyle = "#3a2a1a"; g.beginPath(); g.ellipse(p.x - 28, calle + 6, 8, 4, 0, 0, TAU); g.fill(); g.beginPath(); g.arc(p.x - 36, calle + 2, 3.5, 0, TAU); g.fill();
    g.fillRect(p.x - 34 + pa, calle + 8, 1.5, 4); g.fillRect(p.x - 22 - pa, calle + 8, 1.5, 4);
  }
  // Fuegos artificiales al final (algunos en forma de corazón).
  if (fuegos > 0 && Math.random() < dt * 1.4) cohetes.push({ x: camX + azar(A * 0.15, A * 0.85), y: calle, vy: -azar(260, 360), t: 0, estalla: azar(0.9, 1.3), col: `hsl(${Math.random() * 360},90%,65%)`, chispas: null, corazon: Math.random() < 0.35 });
  for (let i = cohetes.length - 1; i >= 0; i--) {
    const c = cohetes[i]; c.t += dt;
    if (!c.chispas) {
      c.y += c.vy * dt; c.vy += 120 * dt;
      g.fillStyle = "#fff"; g.fillRect(c.x - 1, c.y, 2, 5);
      if (c.t > c.estalla) {
        c.chispas = Array.from({ length: 44 }, (_, k) => {
          const a = k / 44 * TAU;
          if (c.corazon) { const hx = 16 * Math.sin(a) ** 3, hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)); return { x: c.x, y: c.y, vx: hx * 5, vy: hy * 5 }; }
          return { x: c.x, y: c.y, vx: Math.cos(a) * azar(60, 120), vy: Math.sin(a) * azar(60, 120) };
        });
        c.t = 0;
        if (ac) nota(80, ac.currentTime, 0.5, 0.2);
      }
    } else {
      if (c.t > 1.6) { cohetes.splice(i, 1); continue; }
      g.globalCompositeOperation = "lighter"; g.fillStyle = c.col; g.globalAlpha = 1 - c.t / 1.6;
      for (const s of c.chispas) { s.vy += 60 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.985; g.fillRect(s.x, s.y, 2, 2); }
      g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
    }
  }
  // Los globitos de texto.
  for (let i = globos.length - 1; i >= 0; i--) {
    const b = globos[i]; b.t += dt;
    if (b.t > b.dur) { globos.splice(i, 1); continue; }
    const k = Math.min(1, b.t / 0.2) * (b.t > b.dur - 0.4 ? (b.dur - b.t) / 0.4 : 1);
    g.save(); g.globalAlpha = k;
    g.font = `700 ${Math.round(clamp(A * 0.042, 15, 20))}px "Caveat", cursive`;
    const tw = Math.min(g.measureText(b.texto).width + 16, A - 12);
    const bx = clamp(b.x - tw / 2, camX + 6, camX + A - tw - 6), y = b.y - (1 - k) * 8;
    const px = clamp(b.x, bx + 10, bx + tw - 10);
    g.fillStyle = "#fffaf2"; g.beginPath(); g.roundRect(bx, y - 30, tw, 28, 10); g.fill();
    g.beginPath(); g.moveTo(px - 6, y - 3); g.lineTo(px, y + 7); g.lineTo(px + 5, y - 3); g.fill();
    g.fillStyle = "#2a1428"; g.textBaseline = "middle";
    g.beginPath(); g.rect(bx + 4, y - 30, tw - 8, 28); g.clip();
    g.fillText(b.texto, bx + 8 + (b.t < 0.5 ? Math.sin(b.t * 60) : 0), y - 16);
    g.restore();
  }
  g.restore();

  // Un indicio de que la calle sigue a los lados.
  if (camX < MW - A - 4) { const gr = g.createLinearGradient(A - 26, 0, A, 0); gr.addColorStop(0, "rgba(5,6,16,0)"); gr.addColorStop(1, "rgba(5,6,16,.55)"); g.fillStyle = gr; g.fillRect(A - 26, techo - 40, 26, calle - techo + 40); }
  if (camX > 4) { const gr = g.createLinearGradient(0, 0, 26, 0); gr.addColorStop(0, "rgba(5,6,16,.55)"); gr.addColorStop(1, "rgba(5,6,16,0)"); g.fillStyle = gr; g.fillRect(0, techo - 40, 26, calle - techo + 40); }
}

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const antes = ventanas.filter((v) => v.escena).map((v) => ({ id: v.escena.id, encendida: v.encendida, t: v.t }));
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(A * dpr); lienzo.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  construir();
  // Al girar el teléfono, cada escena conserva su luz.
  const porId = Object.fromEntries(antes.map((a) => [a.id, a]));
  for (const v of ventanas) if (v.escena && porId[v.escena.id]) { const a = porId[v.escena.id]; v.encendida = a.encendida; v.t = a.t; v.luz = a.encendida ? 1 : 0; }
  elCuenta.textContent = `${encendidasEscena()} de ${totalEscenas}`;
  estrellas.length = 0;
  for (let i = 0; i < A * calle / 1800; i++) estrellas.push({ x: Math.random() * A, y: Math.random() * calle * 0.75, r: azar(0.6, 1.6), b: azar(0.3, 0.9), v: azar(0.5, 2.5), f: Math.random() * TAU });
  luna.x = A * 0.82; luna.y = Math.max(techo + 6, 96); luna.r = Math.min(A, H) * 0.045;
  camX = clamp(camX || (MW - A) * 0.25, 0, Math.max(0, MW - A));
}
new ResizeObserver(() => requestAnimationFrame(medir)).observe(mundo);
medir();
requestAnimationFrame(paso);
})();
