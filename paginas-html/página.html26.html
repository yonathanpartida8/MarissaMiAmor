<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>La ciudad dormida</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   LA CIUDAD DORMIDA — «Enciende las luces»
   Una calle de noche con cuatro edificios y todas las ventanas apagadas.
   Cada ventana que tocas se enciende y dentro pasa algo distinto: luces
   RGB, una fiesta, alguien que se asoma a gritar, un gato, un perro…
   Ninguna se repite. Prefijo `cd-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #070a18; }
.cd {
  position: fixed; inset: 0; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
  font-family: "Cormorant Garamond", Georgia, serif; color: #f2ecff;
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
}
.cd canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cd-cabeza { position: absolute; top: calc(var(--seg-t) + 12px); left: 0; right: 0; display: grid; justify-items: center; gap: 2px; pointer-events: none; text-align: center; padding: 0 18px; }
.cd-titulo { margin: 0; font-weight: 600; font-size: clamp(0.66rem, 2.8vw, 0.78rem); letter-spacing: 0.36em; text-transform: uppercase; color: rgba(220, 215, 255, 0.72); }
.cd-cuenta { margin: 0; font-size: 0.72rem; letter-spacing: 0.2em; color: rgba(255, 220, 160, 0.7); }
.cd-dialogo {
  position: absolute; left: 50%; bottom: calc(var(--seg-b) + var(--barra) + 16px);
  transform: translateX(-50%); width: min(90vw, 420px); box-sizing: border-box;
  margin: 0; padding: 10px 16px 12px; border-radius: 14px;
  background: rgba(16, 14, 34, 0.72); border: 1px solid rgba(255, 220, 180, 0.2);
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  font-family: "Caveat", "Segoe Print", cursive; font-weight: 600;
  font-size: clamp(1.25rem, 5.6vw, 1.55rem); line-height: 1.2; text-align: center; color: #ffeede;
  transition: opacity 400ms var(--suave), transform 400ms var(--suave);
  pointer-events: none;
}
.cd-dialogo.is-fuera { opacity: 0; transform: translate(-50%, 8px); }
</style>
</head>
<body>
<div class="cd" id="mundo">
  <canvas id="lienzo"></canvas>
  <div class="cd-cabeza">
    <p class="cd-titulo">Enciende las luces</p>
    <p class="cd-cuenta" id="cuenta">0 de 24</p>
  </div>
  <p class="cd-dialogo" id="dialogo" role="status" aria-live="polite">Toda la ciudad está dormida. Toca una ventana.</p>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE PASA EN CADA VENTANA
   `dice` es lo que digo yo al verla; `grita`, lo que sale en un globito
   desde dentro de la ventana. Cada escena se dibuja con su función.
   ══════════════════════════════════════════════════════════════════════ */
const ESCENAS = [
  { id: "rgb", dice: "Wow, esa tiene luces RGB." },
  { id: "fiesta", dice: "Wow, en esa tienen una fiesta." },
  { id: "grito", grita: "¡AAAAH!", dice: "¿Escuchaste? ¡Está loco!" },
  { id: "gato", dice: "Mira, un gatito. Nos está viendo." },
  { id: "saluda", dice: "¡Nos está saludando! Salúdalo." },
  { id: "baile", dice: "Esos dos están bailando lentito." },
  { id: "cocina", dice: "Alguien está cocinando a esta hora. Huele rico." },
  { id: "tele", dice: "Ese se quedó dormido viendo la tele." },
  { id: "plantas", dice: "Cuántas plantitas tiene esa ventana." },
  { id: "lee", dice: "Alguien leyendo con su lamparita. Qué paz." },
  { id: "perro", grita: "¡Guau!", dice: "¡Un perrito! Nos ladró." },
  { id: "sombras", dice: "Está haciendo sombras con las manos. Es un pajarito." },
  { id: "guitarra", dice: "Alguien toca la guitarra. Escúchalo." },
  { id: "navidad", dice: "Esa tiene lucecitas de navidad todo el año." },
  { id: "cortina", dice: "Uy, cerró la cortina. Nos vio." },
  { id: "telescopio", dice: "Ese está viendo las estrellas con telescopio." },
  { id: "ejercicio", dice: "Alguien haciendo ejercicio a medianoche." },
  { id: "pastel", dice: "Ahí están festejando un cumpleaños." },
  { id: "pecera", dice: "Una pecera. Qué bonita luz da." },
  { id: "pintor", dice: "Alguien pintando un cuadro." },
  { id: "telefono", dice: "Alguien habla por teléfono, como yo contigo." },
  { id: "corazon", dice: "Alguien dibujó un corazón en el vidrio." },
  { id: "brinca", dice: "Un niño brincando en la cama. Ya duérmete." },
  { id: "burbujas", dice: "Están haciendo burbujas de jabón." },
];
const FINAL = "Mira, ya despertaste a toda la ciudad.";

const mundo = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const g = lienzo.getContext("2d", { alpha: false });
const elDialogo = document.getElementById("dialogo");
const elCuenta = document.getElementById("cuenta");
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;
const TAU = Math.PI * 2;
const azar = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

let A = 0, H = 0, dpr = 1, calle = 0;
let fondo = null;
const edificios = [];
const ventanas = [];

/* ══════════════════════════════════════════════════════════════════════
   LA CIUDAD
   ══════════════════════════════════════════════════════════════════════ */
function construir() {
  edificios.length = 0;
  ventanas.length = 0;
  const cab = document.querySelector(".cd-cabeza").getBoundingClientRect();
  const dia = elDialogo.getBoundingClientRect();
  calle = dia.top - mundo.getBoundingClientRect().top - 18;
  const techo = cab.bottom + 30;
  const n = 4, hueco = A * 0.02;
  const anchoTotal = A - hueco * (n + 1);
  const pesos = [1, 1.15, 0.95, 1.05];
  const suma = pesos.reduce((a, b) => a + b, 0);
  let x = hueco;
  const altos = [0.78, 1, 0.7, 0.88];
  const colores = ["#1d2140", "#231a3a", "#1a2436", "#2a1f38"];
  const orden = ESCENAS.map((_, i) => i).sort(() => Math.random() - 0.5);
  let k = 0;
  for (let i = 0; i < n; i++) {
    const w = anchoTotal * pesos[i] / suma;
    const h = (calle - techo) * altos[i];
    const e = { x, y: calle - h, w, h, color: colores[i], techo: i % 2 ? "tanque" : "antena" };
    edificios.push(e);
    const cols = 2, filas = 3;
    const mx = w * 0.12, my = h * 0.08;
    const vw = (w - mx * 2 - mx * 0.7) / cols, vh = Math.min(vw * 1.25, (h - my * 2 - h * 0.18) / filas - my * 0.6);
    for (let f = 0; f < filas; f++) for (let c = 0; c < cols; c++) {
      const vx = x + mx + c * (vw + mx * 0.7);
      const vy = e.y + my + f * (vh + my * 0.8);
      ventanas.push({ x: vx, y: vy, w: vw, h: vh, escena: ESCENAS[orden[k++]], luz: 0, encendida: false, t: 0, vista: false, cortina: 0 });
    }
    x += w + hueco;
  }
  pintarFondo();
}

function pintarFondo() {
  const c = document.createElement("canvas");
  c.width = Math.round(A * dpr); c.height = Math.round(H * dpr);
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cielo = x.createLinearGradient(0, 0, 0, calle);
  cielo.addColorStop(0, "#050817"); cielo.addColorStop(0.7, "#141a3c"); cielo.addColorStop(1, "#2c2350");
  x.fillStyle = cielo; x.fillRect(0, 0, A, H);
  for (let i = 0; i < A * H / 1500; i++) {
    x.fillStyle = `rgba(230,235,255,${azar(0.2, 0.8)})`;
    x.fillRect(Math.random() * A, Math.random() * calle * 0.7, azar(0.6, 1.4), azar(0.6, 1.4));
  }
  // La luna.
  const lx = A * 0.82, ly = H * 0.14, lr = Math.min(A, H) * 0.05;
  const halo = x.createRadialGradient(lx, ly, lr, lx, ly, lr * 6);
  halo.addColorStop(0, "rgba(255,240,210,.3)"); halo.addColorStop(1, "rgba(255,240,210,0)");
  x.fillStyle = halo; x.fillRect(0, 0, A, H);
  x.fillStyle = "#fff4dc"; x.beginPath(); x.arc(lx, ly, lr, 0, TAU); x.fill();
  // Edificios lejanos con sus ventanitas al azar.
  for (let i = 0; i < 14; i++) {
    const w = azar(20, 50), h = azar(calle * 0.2, calle * 0.5), bx = Math.random() * A;
    x.fillStyle = "#0f1330"; x.fillRect(bx, calle - h, w, h);
    for (let yy = calle - h + 6; yy < calle - 6; yy += 8) for (let xx = bx + 3; xx < bx + w - 4; xx += 6) {
      if (Math.random() < 0.12) { x.fillStyle = `rgba(255,${azar(190, 230) | 0},140,${azar(0.3, 0.7)})`; x.fillRect(xx, yy, 2.5, 3.5); }
    }
  }
  // Los cuatro edificios.
  for (const e of edificios) {
    const gr = x.createLinearGradient(e.x, 0, e.x + e.w, 0);
    gr.addColorStop(0, e.color); gr.addColorStop(1, "#0c0e22");
    x.fillStyle = gr; x.fillRect(e.x, e.y, e.w, e.h);
    x.fillStyle = "rgba(255,255,255,.05)"; x.fillRect(e.x, e.y, e.w, 3);
    // Ladrillitos suaves.
    for (let yy = e.y + 6; yy < calle; yy += 7) { x.fillStyle = "rgba(0,0,0,.08)"; x.fillRect(e.x, yy, e.w, 1); }
    if (e.techo === "tanque") {
      x.fillStyle = "#15182e";
      x.fillRect(e.x + e.w * 0.6, e.y - 22, e.w * 0.22, 18);
      x.fillRect(e.x + e.w * 0.62, e.y - 4, 3, 4); x.fillRect(e.x + e.w * 0.78, e.y - 4, 3, 4);
      x.beginPath(); x.moveTo(e.x + e.w * 0.58, e.y - 22); x.lineTo(e.x + e.w * 0.71, e.y - 32); x.lineTo(e.x + e.w * 0.84, e.y - 22); x.fill();
    } else {
      x.strokeStyle = "#20243e"; x.lineWidth = 2;
      x.beginPath(); x.moveTo(e.x + e.w * 0.3, e.y); x.lineTo(e.x + e.w * 0.3, e.y - 30); x.stroke();
      x.beginPath(); x.moveTo(e.x + e.w * 0.3 - 8, e.y - 22); x.lineTo(e.x + e.w * 0.3 + 8, e.y - 22); x.stroke();
    }
    // La puerta.
    x.fillStyle = "#0a0b18"; x.fillRect(e.x + e.w * 0.4, calle - e.h * 0.12, e.w * 0.2, e.h * 0.12);
    x.fillStyle = "rgba(255,200,120,.35)"; x.fillRect(e.x + e.w * 0.4, calle - e.h * 0.12 - 3, e.w * 0.2, 3);
  }
  // La banqueta y la calle.
  x.fillStyle = "#1a1a2a"; x.fillRect(0, calle, A, H - calle);
  x.fillStyle = "#2a2a3e"; x.fillRect(0, calle, A, 5);
  fondo = c;
}

/* ══════════════════════════════════════════════════════════════════════
   LAS ESCENAS: cada una se pinta dentro de su ventana
   ══════════════════════════════════════════════════════════════════════ */
function persona(x, y, s, col = "#1a1020", brazo = 0) {
  g.fillStyle = col;
  g.beginPath(); g.arc(x, y - s * 0.95, s * 0.22, 0, TAU); g.fill();
  g.beginPath(); g.moveTo(x - s * 0.3, y); g.quadraticCurveTo(x - s * 0.32, y - s * 0.7, x, y - s * 0.72); g.quadraticCurveTo(x + s * 0.32, y - s * 0.7, x + s * 0.3, y); g.fill();
  if (brazo) { g.strokeStyle = col; g.lineWidth = s * 0.1; g.lineCap = "round"; g.beginPath(); g.moveTo(x + s * 0.2, y - s * 0.6); g.lineTo(x + s * 0.2 + Math.cos(brazo) * s * 0.45, y - s * 0.6 - Math.sin(brazo) * s * 0.45); g.stroke(); }
}
function corazonEn(x, y, r) {
  g.beginPath();
  g.moveTo(x, y + r * 0.8);
  g.bezierCurveTo(x - r * 1.4, y - r * 0.1, x - r * 0.55, y - r * 1.05, x, y - r * 0.35);
  g.bezierCurveTo(x + r * 0.55, y - r * 1.05, x + r * 1.4, y - r * 0.1, x, y + r * 0.8);
}
const tibia = "#ffcf85";
const DIBUJOS = {
  rgb(w, h, t) {
    const hue = (t * 120) % 360;
    g.fillStyle = `hsl(${hue},90%,55%)`; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 6; i++) { g.fillStyle = `hsl(${(hue + i * 60) % 360},100%,65%)`; g.fillRect(i * w / 6, 0, w / 6, h * 0.08); }
    g.fillStyle = "#0a0a14"; g.fillRect(w * 0.2, h * 0.55, w * 0.6, h * 0.25);
    g.fillStyle = `hsl(${(hue + 180) % 360},100%,60%)`; g.fillRect(w * 0.25, h * 0.6, w * 0.5, h * 0.12);
  },
  fiesta(w, h, t) {
    const c = ["#ff2d7a", "#2de2ff", "#ffe02d", "#8a2dff", "#2dff8a"];
    g.fillStyle = c[Math.floor(t * 8) % c.length]; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 9; i++) { g.fillStyle = Math.sin(t * 20 + i * 2) > 0.3 ? "#fff" : c[i % 5]; g.beginPath(); g.arc((i + 0.5) * w / 9, h * 0.1, 2, 0, TAU); g.fill(); }
    for (let i = 0; i < 3; i++) persona(w * (0.25 + i * 0.25), h - Math.abs(Math.sin(t * 9 + i)) * h * 0.1, h * 0.5, "rgba(20,5,30,.9)", Math.sin(t * 9 + i) + 1.5);
  },
  grito(w, h, t, v) {
    g.fillStyle = tibia; g.fillRect(0, 0, w, h);
    const sale = clamp(t < 1.6 ? Math.sin(Math.min(1, t / 0.4) * Math.PI / 2) : 1 - (t - 1.6) / 0.6, 0, 1);
    persona(w / 2, h + h * 0.1 - sale * h * 0.2, h * (0.6 + sale * 0.35), "#2a1422");
    if (sale > 0.5) { g.fillStyle = "#2a1422"; g.beginPath(); g.ellipse(w / 2, h * 0.45 - sale * h * 0.1, w * 0.06, h * 0.08, 0, 0, TAU); g.fill(); }
  },
  gato(w, h, t) {
    g.fillStyle = "#ffd89a"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#231820";
    g.beginPath(); g.ellipse(w * 0.5, h * 0.84, w * 0.24, h * 0.12, 0, 0, TAU); g.fill();
    g.beginPath(); g.arc(w * 0.62, h * 0.66, w * 0.12, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(w * 0.53, h * 0.6); g.lineTo(w * 0.56, h * 0.48); g.lineTo(w * 0.61, h * 0.57); g.fill();
    g.beginPath(); g.moveTo(w * 0.65, h * 0.57); g.lineTo(w * 0.7, h * 0.48); g.lineTo(w * 0.72, h * 0.6); g.fill();
    g.strokeStyle = "#231820"; g.lineWidth = w * 0.05; g.lineCap = "round";
    g.beginPath(); g.moveTo(w * 0.28, h * 0.84); g.quadraticCurveTo(w * 0.12, h * (0.7 + Math.sin(t * 3) * 0.1), w * 0.2, h * 0.52); g.stroke();
    const parpadea = Math.sin(t * 1.7) > 0.95 ? 0.2 : 1;
    g.fillStyle = "#9cff7a"; g.beginPath(); g.ellipse(w * 0.58, h * 0.66, 2, 2 * parpadea, 0, 0, TAU); g.ellipse(w * 0.66, h * 0.66, 2, 2 * parpadea, 0, 0, TAU); g.fill();
  },
  saluda(w, h, t) {
    g.fillStyle = "#ffe0a8"; g.fillRect(0, 0, w, h);
    persona(w * 0.45, h * 1.02, h * 0.75, "#2a1a30", 1.3 + Math.sin(t * 10) * 0.5);
  },
  baile(w, h, t) {
    g.fillStyle = "#ffb4a0"; g.fillRect(0, 0, w, h);
    const a = Math.sin(t * 1.5) * w * 0.06;
    persona(w * 0.4 + a, h, h * 0.7, "#3a1020");
    persona(w * 0.58 + a, h, h * 0.62, "#3a1020");
  },
  cocina(w, h, t) {
    g.fillStyle = "#fff0c0"; g.fillRect(0, 0, w, h);
    persona(w * 0.35, h, h * 0.65, "#2a2020", 0.3);
    g.fillStyle = "#333"; g.fillRect(w * 0.55, h * 0.72, w * 0.35, h * 0.06);
    for (let i = 0; i < 3; i++) { const k = (t * 0.6 + i / 3) % 1; g.fillStyle = `rgba(255,255,255,${0.5 * (1 - k)})`; g.beginPath(); g.arc(w * 0.72 + Math.sin(k * 6 + i) * 4, h * 0.7 - k * h * 0.5, 3 + k * 4, 0, TAU); g.fill(); }
  },
  tele(w, h, t) {
    const b = 0.5 + 0.5 * Math.sin(t * 13) * Math.sin(t * 7);
    g.fillStyle = `rgb(${60 + b * 40},${90 + b * 60},${170 + b * 60})`; g.fillRect(0, 0, w, h);
    g.fillStyle = "#101428"; g.fillRect(w * 0.1, h * 0.6, w * 0.8, h * 0.4);
    persona(w * 0.5, h * 1.05, h * 0.5, "#0c0e1e");
    g.fillStyle = "#fff"; g.font = `${h * 0.18}px serif`; g.fillText("z", w * 0.62, h * (0.4 - (t % 2) * 0.1));
  },
  plantas(w, h, t) {
    g.fillStyle = "#ffe6b0"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 3; i++) {
      const x = w * (0.2 + i * 0.3);
      g.fillStyle = "#b0603a"; g.fillRect(x - w * 0.08, h * 0.8, w * 0.16, h * 0.2);
      g.strokeStyle = "#2f7a3a"; g.lineWidth = 2;
      for (let k = 0; k < 4; k++) { g.beginPath(); g.moveTo(x, h * 0.8); g.quadraticCurveTo(x + (k - 1.5) * w * 0.06, h * 0.6, x + (k - 1.5) * w * 0.08 + Math.sin(t * 2 + k) * 2, h * (0.45 + (k % 2) * 0.08)); g.stroke(); }
    }
  },
  lee(w, h, t) {
    g.fillStyle = "#3a2a3a"; g.fillRect(0, 0, w, h);
    const lz = g.createRadialGradient(w * 0.3, h * 0.35, 0, w * 0.3, h * 0.35, w * 0.8);
    lz.addColorStop(0, "#ffe6a8"); lz.addColorStop(1, "rgba(255,230,168,0)");
    g.fillStyle = lz; g.fillRect(0, 0, w, h);
    persona(w * 0.55, h, h * 0.6, "#241624");
    g.fillStyle = "#fff8e8"; g.fillRect(w * 0.6, h * 0.62, w * 0.2, h * 0.12);
  },
  perro(w, h, t, v) {
    g.fillStyle = "#ffdca0"; g.fillRect(0, 0, w, h);
    const salto = Math.max(0, Math.sin(t * 6)) * h * 0.05 * (t < 2 ? 1 : 0.2);
    g.fillStyle = "#6a3a1a";
    g.beginPath(); g.ellipse(w * 0.45, h * 0.82 - salto, w * 0.22, h * 0.12, 0, 0, TAU); g.fill();
    g.beginPath(); g.arc(w * 0.66, h * 0.66 - salto, w * 0.12, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(w * 0.6, h * 0.66 - salto, w * 0.04, h * 0.1, 0.4, 0, TAU); g.fill();
    g.strokeStyle = "#6a3a1a"; g.lineWidth = 3; g.beginPath(); g.moveTo(w * 0.24, h * 0.8 - salto); g.lineTo(w * 0.14, h * (0.66 + Math.sin(t * 20) * 0.05) - salto); g.stroke();
  },
  sombras(w, h, t) {
    g.fillStyle = "#fff0d0"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#2a1a1a";
    const al = Math.sin(t * 5) * 0.4;
    g.beginPath(); g.ellipse(w * 0.5, h * 0.55, w * 0.1, h * 0.08, 0, 0, TAU); g.fill();
    g.beginPath(); g.moveTo(w * 0.45, h * 0.52); g.quadraticCurveTo(w * 0.2, h * (0.3 - al * 0.3), w * 0.12, h * (0.4 - al * 0.2)); g.quadraticCurveTo(w * 0.3, h * 0.55, w * 0.45, h * 0.58); g.fill();
    g.beginPath(); g.moveTo(w * 0.55, h * 0.52); g.quadraticCurveTo(w * 0.8, h * (0.3 - al * 0.3), w * 0.88, h * (0.4 - al * 0.2)); g.quadraticCurveTo(w * 0.7, h * 0.55, w * 0.55, h * 0.58); g.fill();
  },
  guitarra(w, h, t) {
    g.fillStyle = "#f0c890"; g.fillRect(0, 0, w, h);
