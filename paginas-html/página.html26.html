<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<!-- Un mundo aparte: el libro la abre a pantalla completa, con sólo su barrita delgada. -->
<meta name="libro-pagina" content="completa">
<title>La ciudad dormida</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   LA CIUDAD DORMIDA — «Enciende las luces»
   Una calle entera de noche, que se recorre deslizando. Cada ventana que
   tocas se prende y dentro pasa algo; si la apagas y la vuelves a prender,
   vuelve a pasar. Y en la calle y en el cielo van pasando cosas: el del
   fierro viejo, los tamales, un gato por los techos, un ovni…
   Prefijo `cd-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #070a18; }
.cd {
  position: fixed; inset: 0; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
  font-family: "Cormorant Garamond", Georgia, serif; color: #f2ecff;
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
}
.cd canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cd-cabeza { position: absolute; top: calc(var(--seg-t) + 12px); left: 0; right: 0; display: grid; justify-items: center; gap: 2px; pointer-events: none; text-align: center; padding: 0 18px; }
.cd-titulo { margin: 0; font-weight: 600; font-size: clamp(0.66rem, 2.8vw, 0.78rem); letter-spacing: 0.36em; text-transform: uppercase; color: rgba(220, 215, 255, 0.72); }
.cd-cuenta { margin: 0; font-size: 0.72rem; letter-spacing: 0.2em; color: rgba(255, 220, 160, 0.7); }
.cd-dialogo {
  position: absolute; left: 50%; bottom: calc(var(--seg-b) + var(--barra) + 68px);
  transform: translateX(-50%); width: min(90vw, 440px); box-sizing: border-box;
  margin: 0; padding: 9px 16px 11px; border-radius: 14px;
  background: rgba(16, 14, 34, 0.9); border: 1px solid rgba(255, 220, 180, 0.2);
  box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
  font-family: "Caveat", "Segoe Print", cursive; font-weight: 600;
  font-size: clamp(1.08rem, 4.7vw, 1.34rem); line-height: 1.16; text-align: center; color: #ffeede;
  transition: opacity 400ms var(--suave), transform 400ms var(--suave);
  pointer-events: none; min-height: 1.2em;
}
.cd-dialogo.is-fuera { opacity: 0; transform: translate(-50%, 8px); }
/* en apaisado el diálogo se va a la esquina y se achica: la calle queda libre */
@media (orientation: landscape) and (max-height: 520px) {
  .cd-dialogo { left: auto; right: 12px; transform: none; width: min(42vw, 360px); bottom: calc(var(--seg-b) + var(--barra) + 10px); font-size: clamp(0.95rem, 2.6vw, 1.12rem); padding: 7px 12px 8px; }
  .cd-dialogo.is-fuera { transform: translateY(8px); }
}
.cd-pista { position: absolute; left: 0; right: 0; top: calc(var(--seg-t) + 50px); margin: 0; text-align: center; font-size: 0.62rem; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase; color: rgba(255, 230, 190, 0.6); pointer-events: none; transition: opacity 800ms; }
.cd-pista.is-fuera { opacity: 0; }
/* Quién habla: ella en rosa; yo, en Modo Dios, dorado. */
.cd-dialogo.es-ella { color: #ffa6d5; border-color: rgba(255, 140, 200, 0.55); box-shadow: 0 10px 30px -10px rgba(0,0,0,.8), 0 0 22px -6px rgba(255, 110, 180, 0.7); }
.cd-dialogo.es-dios { color: #ffe7a0; border-color: rgba(255, 214, 120, 0.55); box-shadow: 0 10px 30px -10px rgba(0,0,0,.8), 0 0 22px -6px rgba(255, 200, 90, 0.7); }
.cd-caos { margin: 0; font-size: 0.72rem; letter-spacing: 0.14em; color: #ff8a8a; min-height: 1em; font-family: system-ui, sans-serif; font-weight: 700; transition: opacity 0.5s; }

/* ── La barra de poderes ── */
.cd-poderes {
  position: absolute; left: 10px; bottom: calc(var(--seg-b) + var(--barra) + 8px); max-width: calc(100% - 20px);
  display: flex; gap: 5px; padding: 5px; overflow-x: auto; scrollbar-width: none; align-items: center;
  border-radius: 18px; background: rgba(12, 9, 28, 0.5); border: 1px solid rgba(255, 220, 180, 0.12);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  z-index: 3; touch-action: pan-x; transition: max-width 380ms var(--suave), background 300ms;
}
/* plegada: sólo el botón de abrir y el Modo Dios; así no tapa la calle */
.cd-poderes.cerrada { background: rgba(12, 9, 28, 0.32); }
.cd-poderes.cerrada button:not(.plegar):not(.dios) { display: none; }
.cd-poderes button.plegar { width: 34px; border-radius: 12px; background: rgba(40, 30, 70, 0.7); }
.cd-poderes button.plegar svg { transition: transform 300ms var(--suave); }
.cd-poderes:not(.cerrada) button.plegar svg { transform: rotate(180deg); }
.cd-poderes svg { width: 22px; height: 22px; display: block; color: #ffe2bf; filter: drop-shadow(0 1px 1px rgba(0,0,0,.5)); }
.cd-poderes button.dios svg { color: #ffe6a0; }
.cd-poderes button.dios.on svg { color: #5a3008; }
.cd-poderes button.oculto-p svg { opacity: .55; }
.cd-modo3d svg { width: 16px; height: 16px; }
.cd-poderes::-webkit-scrollbar { display: none; }
.cd-poderes button {
  flex: none; position: relative; width: 42px; height: 42px; border-radius: 13px; padding: 0;
  border: 1px solid rgba(255, 220, 180, 0.22); background: rgba(22, 18, 44, 0.86); color: #fff;
  font-size: 21px; line-height: 1; display: grid; place-items: center; cursor: pointer;
  box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.9);
  transition: transform 220ms var(--suave), box-shadow 220ms, filter 300ms, opacity 300ms, background 300ms;
}
.cd-poderes button:active { transform: scale(0.9); }
.cd-poderes button.bloq { filter: grayscale(1) brightness(0.72); opacity: 0.62; }
.cd-poderes button.bloq { border-style: dashed; }
.cd-poderes button.oculto-p { font-size: 18px; color: rgba(255,255,255,.6); border-style: dashed; }
.cd-poderes button.activo { transform: translateY(-5px); background: rgba(92, 58, 22, 0.95); box-shadow: 0 0 0 2px #ffd36e, 0 0 18px rgba(255, 210, 110, 0.75); }
.cd-poderes button.dios { width: 50px; border-color: rgba(255, 214, 130, 0.6); }
.cd-poderes button.dios.on { background: radial-gradient(circle at 50% 40%, #fff6cf, #ffc04a 55%, #b8702a); animation: cd-brilla 1.4s ease-in-out infinite; }
.cd-poderes button.nuevo { animation: cd-nuevo 0.7s ease 4; }
.cd-poderes button.no { animation: cd-no 0.4s ease; }
@keyframes cd-brilla { 50% { box-shadow: 0 0 0 2px #fff0b0, 0 0 30px rgba(255, 220, 120, 1); } }
@keyframes cd-nuevo { 50% { transform: translateY(-8px) scale(1.12); box-shadow: 0 0 24px rgba(255, 150, 220, 1); } }
@keyframes cd-no { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

/* ── Tarjetas: el K-drama de cerca, Angelos Burger, los misterios ── */
.cd-capa { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(6, 5, 18, 0.62);
  padding: calc(var(--seg-t) + 16px) 16px calc(var(--seg-b) + var(--barra) + 16px); animation: cd-entra 0.35s var(--suave); }
.cd-capa.oculto { display: none; }
@keyframes cd-entra { from { opacity: 0; } }
.cd-tarjeta { width: min(100%, 360px); max-height: 100%; overflow: auto; box-sizing: border-box; padding: 16px 16px 14px; border-radius: 18px;
  background: linear-gradient(170deg, #211a3e, #140f28); border: 1px solid rgba(255, 220, 180, 0.25); box-shadow: 0 20px 50px -14px #000;
  text-align: center; color: #fff2e6; animation: cd-sube 0.45s var(--suave); touch-action: pan-y; }
@keyframes cd-sube { from { transform: translateY(18px) scale(0.96); opacity: 0; } }
.cd-tarjeta h2 { margin: 2px 0 6px; font-family: "Caveat", cursive; font-size: 1.9rem; line-height: 1; color: #ffd9a8; }
.cd-tarjeta p { margin: 6px 0; font-size: 1.1rem; line-height: 1.3; }
.cd .cd-tarjeta canvas { position: static; inset: auto; width: 100%; height: auto; aspect-ratio: 3 / 2; border-radius: 12px; display: block; background: #0c0f22; }
.cd-tarjeta .mano { font-family: "Caveat", cursive; font-size: 1.55rem; color: #ffc8e0; }
.cd-tarjeta .estado { display: inline-block; margin: 4px 0; padding: 4px 12px; border-radius: 999px; font: 700 0.95rem system-ui, sans-serif; letter-spacing: 0.06em; }
.cd-tarjeta .estado.abierto { background: rgba(60, 200, 110, 0.18); color: #7dffa8; }
.cd-tarjeta .estado.cerrado { background: rgba(230, 60, 70, 0.18); color: #ff8a8a; }
.cd-tarjeta ul { list-style: none; margin: 4px 0 8px; padding: 0; text-align: left; display: grid; gap: 4px; font-size: 1rem; }
.cd-tarjeta li { padding: 5px 8px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); }
.cd-tarjeta li.si { background: rgba(255, 210, 120, 0.12); color: #ffe3a8; }
.cd-tarjeta li small { display: block; font-size: 0.82rem; opacity: 0.7; }
.cd-tarjeta h3 { margin: 12px 0 2px; font: 700 0.8rem system-ui, sans-serif; letter-spacing: 0.2em; text-transform: uppercase; color: #bfb4ff; }
.cd-tarjeta button { margin-top: 10px; font: 600 1rem "Cormorant Garamond", serif; border: 0; border-radius: 999px; padding: 8px 20px; background: #ffd9a8; color: #2a1428; cursor: pointer; }
.cd-aviso { position: absolute; left: 50%; top: calc(var(--seg-t) + 76px); transform: translate(-50%, -10px); z-index: 5; pointer-events: none;
  padding: 7px 14px; border-radius: 999px; background: rgba(30, 20, 60, 0.92); border: 1px solid rgba(255, 210, 140, 0.4);
  font: 700 0.86rem system-ui, sans-serif; color: #ffe3a8; white-space: nowrap; opacity: 0; transition: opacity 0.4s, transform 0.4s var(--suave); }
.cd-aviso.ver { opacity: 1; transform: translate(-50%, 0); }
.cd-envivo { position: absolute; left: 10px; right: 10px; top: calc(var(--seg-t) + 108px); z-index: 4; pointer-events: none; opacity: 0; transition: opacity 0.6s;
  padding: 6px 10px; border-radius: 8px; background: linear-gradient(90deg, #c8102e, #8a0c20 40%, #1a1a2e); color: #fff; font: 700 0.78rem system-ui, sans-serif; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd-envivo.ver { opacity: 1; }
/* ── El paso al modo 3D (la calle 2D se queda tal cual) ── */
.cd-modo3d { position: absolute; top: calc(var(--seg-t) + 10px); right: 12px; z-index: 6; display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px 7px 11px; border-radius: 999px; border: 1px solid rgba(255, 214, 150, 0.45); background: rgba(24, 16, 48, 0.82);
  color: #ffe3b0; font: 700 0.8rem system-ui, sans-serif; letter-spacing: 0.06em; cursor: pointer; box-shadow: 0 6px 18px -8px #000, 0 0 16px -6px rgba(255, 200, 120, 0.6);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: transform 0.25s var(--suave), opacity 0.4s; }
.cd-modo3d:active { transform: scale(0.94); }
.cd-modo3d b { font-size: 0.95rem; }
.cd-marco3d { position: fixed; inset: 0; z-index: 50; background: #0c0a1c; opacity: 0; transition: opacity 0.45s ease; }
.cd-marco3d.ver { opacity: 1; }
.cd-marco3d iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0c0a1c; }
.cd-marco3d p { position: absolute; left: 0; right: 0; top: 46%; margin: 0; text-align: center; font: 600 1.05rem "Cormorant Garamond", Georgia, serif; color: rgba(255, 230, 200, 0.75); letter-spacing: 0.08em; pointer-events: none; transition: opacity 0.4s; }
</style>
</head>
<body>
<div class="cd" id="mundo">
  <canvas id="lienzo"></canvas>
  <div class="cd-cabeza">
    <p class="cd-titulo">Enciende las luces</p>
    <p class="cd-cuenta" id="cuenta"></p>
    <p class="cd-caos" id="caos"></p>
  </div>
  <p class="cd-pista" id="pista">desliza para recorrer la calle · toca una ventana</p>
  <p class="cd-dialogo" id="dialogo" role="status" aria-live="polite">Mira… como nosotros próximamente 🤍</p>
  <div class="cd-poderes" id="poderes" role="toolbar" aria-label="Poderes" data-claim-drag></div>
  <div class="cd-aviso" id="aviso"></div>
  <div class="cd-envivo" id="envivo">🔴 EN VIVO · ¡Un héroe misterioso ilumina la ciudad dormida!</div>
  <div class="cd-capa oculto" id="capa"><div class="cd-tarjeta" id="tarjeta"></div></div>
  <button type="button" class="cd-modo3d" id="modo3d" aria-label="Cambiar a modo 3D"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8 20.5 7.5v9L12 21.2 3.5 16.5v-9z"/><path d="M3.5 7.5 12 12.2l8.5-4.7M12 12.2v9"/></svg> 3D</button>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE PASA EN CADA VENTANA
   `dice` es lo que te digo yo al verla (una frase, o varias que se van
   turnando cada vez que la prendes); `grita`, lo que sale en un globito
   desde dentro. Cada escena se dibuja con su función de abajo, y NO hay
   ventanas vacías: si la calle trae más ventanas que escenas, las que
   sobran se tapan antes de pintarla.
   ══════════════════════════════════════════════════════════════════════ */
const ESCENAS = [
  { id: "rgb", dice: ["Mira, amor, esa tiene luces RGB. Seguro es gamer :>", "Otra vez las lucecitas de colores… ya parece antro jajaja"] },

  { id: "plantas", dice: ["Cuántas plantitas. Tú serías la flor más bonita de todas 🌷", "Qué verde está todo ahí, aww 🌿"] },
  { id: "lee", dice: ["Alguien leyendo con su lamparita. Qué paz, ¿verdad? 🤍", "Sigue leyendo… ha de estar bien bueno ese libro :>"] },
  { id: "perro", grita: "¡Guau!", dice: ["¡Un perrito! Nos ladró 🥹", "Otra vez nos ladró… ya lo hicimos enojar jajaja"] },

  { id: "pinata", grita: "¡Dale, dale, dale!", dice: ["¡Rompieron la piñata! Ahí van los dulces 🪅", "Otra piñata… yo me agarro los dulces jajaja"] },
  { id: "luchador", dice: ["Un luchador entrenando con máscara y todo 😂 Yo igual te defiendo, eh.", "Sigue sacando músculo jajaja"] },

const linea = (x, vez) => (Array.isArray(x) ? x[(Math.max(1, vez) - 1) % x.length] : x);

/* ══════════════════════════════════════════════════════════════════════ */
const mundo = document.getElementById("mundo");

const TAU = Math.PI * 2;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

let A = 0, H = 0, dpr = 1, calle = 0, techo = 0, MW = 0;   // MW: ancho del mundo

/* ══════════════════════════════════════════════════════════════════════
   LA CIUDAD

function lienzoNuevo(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr));
  const x = c.getContext("2d"); x.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [c, x];
}
const TIPOS = ["ladrillo", "deco", "colonial", "vidrio", "tienda", "angosto", "ladrillo", "colonial"];
const COLORES = { burger: ["#a02a34", "#6a1822"], ladrillo: ["#5a2a2e", "#3a1a22"], deco: ["#2a2c50", "#171834"], colonial: ["#4a6a7a", "#2e4252"], vidrio: ["#1e3048", "#10192a"], tienda: ["#5a4466", "#35263e"], angosto: ["#3a3a58", "#20203a"] };
const COLONIALES = [["#d88a6a", "#a85a4a"], ["#e0b86a", "#b08040"], ["#7aa8a0", "#4a7870"], ["#c890b0", "#986080"]];
let totalEscenas = 0, camInicial = 0, ventanaKdrama = null;
const encendidasEscena = () => ventanas.filter((v) => v.escena && v.encendida).length;

function construir() {
  edificios.length = 0; ventanas.length = 0; faroles.length = 0; arboles.length = 0;
  const cab = document.querySelector(".cd-cabeza").getBoundingClientRect();
  const dia = elDialogo.getBoundingClientRect();
  const r0 = mundo.getBoundingClientRect();
  calle = dia.top - r0.top - 78;
  techo = cab.bottom - r0.top + 42;
  const alto = calle - techo;
  // Se alarga la calle hasta que quepan todas las escenas y sobren
  // ventanas de adorno (en apaisado, con poco alto, hace falta más calle).
  for (let intento = 0, largo = clamp(alto * 3.4, A * 1.2, A * 3.2); intento < 8; intento++, largo *= 1.2) {
    edificios.length = 0; ventanas.length = 0;
    MW = largo;
    const nE = Math.max(5, Math.round(MW / Math.max(140, A * 0.34)));
    const huecos = 12;
    const pesos = Array.from({ length: nE }, (_, i) => [1, 1.15, 0.9, 1.1, 1.25, 0.75, 1, 0.95][i % 8] * azar(0.9, 1.1));
    const suma = pesos.reduce((a, b) => a + b, 0);
    const util = MW - huecos * (nE + 1);
    const altos = [0.7, 1, 0.55, 0.85, 0.62, 0.95, 0.74, 0.58];
    let x = huecos;
    const ww = clamp(Math.min(A, alto * 0.9) * 0.085, 26, 48);
    // El tercer edificio es Angelos Burger, nuestro restaurante favorito.
    const iBurger = nE > 3 ? 2 : -1;
    if (iBurger >= 0) pesos[iBurger] = Math.max(pesos[iBurger], 1.35);
    const suma2 = pesos.reduce((a, b) => a + b, 0);
    for (let i = 0; i < nE; i++) {
      const tipo = i === iBurger ? "burger" : TIPOS[i % TIPOS.length];
      const w = util * pesos[i] / suma2;
      const h = alto * altos[i % altos.length];
      const e = { i, x, y: calle - h, w, h, tipo, col: tipo === "colonial" ? COLONIALES[i % COLONIALES.length] : COLORES[tipo], f: Math.random() * TAU };
      edificios.push(e);
      // Las ventanas, en rejilla, dejando la planta baja libre.
      e.hb = tipo === "burger" ? Math.max(h * 0.28, 74) : 0;
      const baja = tipo === "tienda" ? h * 0.2 : tipo === "burger" ? e.hb + 44 : Math.min(h * 0.16, 60);
      const arribaR = tipo === "deco" ? h * 0.1 : tipo === "colonial" ? h * 0.04 : h * 0.06;
      const cols = Math.max(1, Math.floor((w - 12) / (ww * 1.38)));
      const vw = Math.min(ww, (w - 12) / cols / 1.3);
      const vh = vw * (tipo === "colonial" ? 1.45 : 1.25);
      const libre = h - baja - arribaR - 8;
      const filas = Math.max(1, Math.floor(libre / (vh * 1.34)));
      const px = (w - cols * vw) / (cols + 1);
      const py = (libre - filas * vh) / (filas + 0.5);
      for (let f = 0; f < filas; f++) for (let c = 0; c < cols; c++) {
        ventanas.push({ x: x + px + c * (vw + px), y: e.y + arribaR + py * 0.6 + f * (vh + py), w: vw, h: vh, e, escena: null, luz: 0, encendida: false, t: 0, vez: 0, fila: f, deco: Math.random() });
      }
      x += w + huecos;
    }

    if (ventanas.length >= ESCENAS.length) break;
  }
  // Ni una ventana sin su escena: las que sobran se tapan (un aire
  // acondicionado, una maceta, un corazón pintado) y dejan de ser ventana.
  tapadas.length = 0;
  while (ventanas.length > ESCENAS.length) tapadas.push(ventanas.splice(Math.floor(Math.random() * ventanas.length), 1)[0]);
  // Y las escenas se reparten al azar: cada vez, la ciudad es otra.
  const mezcla = [...ESCENAS].sort(() => Math.random() - 0.5);
  ventanas.forEach((v, k) => { v.escena = mezcla[k]; });
  // Se empieza viendo Angelos Burger a la derecha y, a su izquierda, la
  // ventana de la pareja del K-drama, ya prendida.
  const bur = edificios.find((e) => e.tipo === "burger");
  camInicial = bur ? clamp(bur.x + bur.w + 16 - A, 0, Math.max(0, MW - A)) : (MW - A) * 0.25;
  const enVista = ventanas.filter((v) => v.x > camInicial + 14 && v.x + v.w < camInicial + A - 14 && (!bur || v.x + v.w < bur.x - 4));
  const medio = (techo + calle) / 2;
  const kd = (enVista.length ? enVista : ventanas).sort((a, b) => Math.abs(a.y - medio) - Math.abs(b.y - medio))[0];
  const otra = ventanas.find((v) => v.escena && v.escena.id === "kdrama");
  if (kd && otra && kd !== otra) [kd.escena, otra.escena] = [otra.escena, kd.escena];
  if (kd) { kd.encendida = true; kd.luz = 1; kd.vez = 1; ventanaKdrama = kd; }
  // Faroles y arbolitos en la banqueta.
  for (let fx = 70; fx < MW; fx += Math.max(220, A * 0.6)) faroles.push({ x: fx, on: true });
  for (let tx = 150; tx < MW; tx += Math.max(260, A * 0.7)) arboles.push({ x: tx + azar(-30, 30), f: Math.random() * TAU });
  pintarCielo(); pintarLejos(); pintarFachada();
  totalEscenas = ventanas.filter((v) => v.escena).length;
  elCuenta.textContent = `${encendidasEscena()} de ${totalEscenas}`;
}

function pintarCielo() {
  let x;
  [cielo, x] = lienzoNuevo(A, H);
  const gr = x.createLinearGradient(0, 0, 0, calle);
  gr.addColorStop(0, "#04061a"); gr.addColorStop(0.55, "#10183a"); gr.addColorStop(0.85, "#2a2352"); gr.addColorStop(1, "#46305e");
  x.fillStyle = gr; x.fillRect(0, 0, A, H);
  const vl = x.createLinearGradient(0, calle * 0.9, A, 0);
  vl.addColorStop(0, "rgba(120,110,200,0)"); vl.addColorStop(0.5, "rgba(140,120,210,0.12)"); vl.addColorStop(1, "rgba(120,110,200,0)");
  x.fillStyle = vl; x.fillRect(0, 0, A, calle);
}
function pintarLejos() {
  let x;
  const w = MW * 0.55 + A;
  [lejos, x] = lienzoNuevo(w, H);
  lejos.anchoCss = w;
  let bx = -10;
  while (bx < w) {
    const bw = azar(24, 60), bh = azar((calle - techo) * 0.35, (calle - techo) * 0.75);
    x.fillStyle = Math.random() < 0.5 ? "#141a36" : "#18163a";
    x.fillRect(bx, calle - bh, bw, bh);
    if (Math.random() < 0.2) x.fillRect(bx + bw * 0.45, calle - bh - 16, 2, 16);
    for (let yy = calle - bh + 6; yy < calle - 6; yy += 9) for (let xx = bx + 4; xx < bx + bw - 4; xx += 7) {
      if (Math.random() < 0.14) { x.fillStyle = `rgba(255,${azar(190, 230) | 0},140,${azar(0.25, 0.6)})`; x.fillRect(xx, yy, 2.5, 3.5); }
    }
    bx += bw + azar(0, 8);
  }
}
function pintarFachada() {
  let x;
  [fachada, x] = lienzoNuevo(MW, H);
  for (const e of edificios) {
    const [c1, c2] = e.col;
    const gr = x.createLinearGradient(e.x, 0, e.x + e.w, 0);
    gr.addColorStop(0, c1); gr.addColorStop(1, c2);
    x.fillStyle = gr;
    x.fillRect(e.x, e.y, e.w, e.h);
    if (e.tipo === "deco") {
      // Arriba escalonado, con su aguja.
      x.fillRect(e.x + e.w * 0.12, e.y - 14, e.w * 0.76, 14);

      x.fillRect(e.x + e.w * 0.46, e.y - 60, e.w * 0.08, 32);
      x.strokeStyle = "rgba(255,220,160,.12)"; x.lineWidth = 1;

    } else if (e.tipo === "colonial") {
      x.fillStyle = "#8a3a2a";
      x.beginPath(); x.moveTo(e.x - 6, e.y + 2); x.lineTo(e.x + e.w * 0.5, e.y - e.w * 0.18); x.lineTo(e.x + e.w + 6, e.y + 2); x.fill();
      x.strokeStyle = "rgba(0,0,0,.18)"; x.lineWidth = 1;
      for (let k = 0; k < 8; k++) { x.beginPath(); x.moveTo(e.x + e.w * k / 8, e.y + 2); x.lineTo(e.x + e.w * 0.5, e.y - e.w * 0.18); x.stroke(); }
      x.fillStyle = "rgba(255,245,230,.35)"; x.fillRect(e.x, e.y + 4, e.w, 3);
    }
    if (e.tipo === "ladrillo") {
      for (let yy = e.y + 4; yy < calle; yy += 6) {
        x.fillStyle = "rgba(0,0,0,.12)"; x.fillRect(e.x, yy, e.w, 1);
        for (let xx = e.x + ((yy / 6) % 2) * 6; xx < e.x + e.w; xx += 12) x.fillRect(xx, yy - 5, 1, 5);
      }
      x.fillStyle = "#2a1418"; x.fillRect(e.x, e.y, e.w, 5);
    } else if (e.tipo === "vidrio") {
      const br = x.createLinearGradient(e.x, e.y, e.x + e.w, calle);
      br.addColorStop(0, "rgba(160,200,255,.12)"); br.addColorStop(0.5, "rgba(160,200,255,0)"); br.addColorStop(1, "rgba(160,200,255,.06)");
      x.fillStyle = br; x.fillRect(e.x, e.y, e.w, e.h);
      x.fillStyle = "#101828"; x.fillRect(e.x + e.w * 0.62, e.y - 20, e.w * 0.2, 16); x.fillRect(e.x + e.w * 0.64, e.y - 4, 3, 4); x.fillRect(e.x + e.w * 0.78, e.y - 4, 3, 4);
    } else if (e.tipo === "angosto") {
      x.strokeStyle = "#20243e"; x.lineWidth = 2;
      x.beginPath(); x.moveTo(e.x + e.w * 0.3, e.y); x.lineTo(e.x + e.w * 0.3, e.y - 34); x.stroke();
      x.beginPath(); x.moveTo(e.x + e.w * 0.3 - 9, e.y - 24); x.lineTo(e.x + e.w * 0.3 + 9, e.y - 24); x.stroke();
      x.beginPath(); x.moveTo(e.x + e.w * 0.3 - 6, e.y - 16); x.lineTo(e.x + e.w * 0.3 + 6, e.y - 16); x.stroke();
    } else if (e.tipo === "tienda") {

    } else if (e.tipo === "burger") {
      x.fillStyle = "rgba(255,210,120,.07)"; for (let yy = e.y + 10; yy < calle - e.hb - 34; yy += 14) x.fillRect(e.x, yy, e.w, 2);
      x.fillStyle = "#3a0e14"; x.fillRect(e.x, e.y, e.w, 5);
      x.fillStyle = "#ffd23a"; x.fillRect(e.x, e.y + 5, e.w, 2);

    x.fillStyle = "rgba(255,255,255,.06)"; x.fillRect(e.x, e.y, e.w, 2);
    // La planta baja: la puerta, o la panadería con su toldo, o Angelos Burger.
    if (e.tipo === "burger") {

      x.strokeStyle = "#ffd23a"; x.lineWidth = 1.5; x.strokeRect(e.x + 5, ty - 32, e.w - 10, 20);
      for (let k = 0; k < 12; k++) {

      x.fillStyle = "#c8844a";
      for (let k = 0; k < 5; k++) { x.beginPath(); x.ellipse(e.x + 18 + k * e.w * 0.1, calle - 12, 5, 3, 0, 0, TAU); x.fill(); }
      x.fillStyle = "#1a1008"; x.fillRect(e.x + e.w * 0.7, ty + 6, e.w * 0.2, calle - ty - 6);
      for (let k = 0; k < 10; k++) { x.fillStyle = k % 2 ? "#e8e0d0" : "#c8384a"; x.fillRect(e.x + 2 + k * (e.w - 4) / 10, ty - 12, (e.w - 4) / 10, 12); }
      e.letrero = { x: e.x + e.w / 2, y: ty - 22 };
    } else {
      const pw = Math.min(26, e.w * 0.22), ph = Math.min(36, e.h * 0.1);

<script>
/* EL MODO 3D — se abre encima, en su propio marco, y al volver se descarga
   entero (su WebGL, su audio, sus relojes): así ir y venir nunca deja nada
   colgado. La calle 2D no se toca; sólo se pausa mientras tanto. */
(() => {
  const CLAVE = "ciudad_dormida_modo";
  const boton = document.getElementById("modo3d");
  let marco = null;
  const gl2 = (() => { try { return !!document.createElement("canvas").getContext("webgl2"); } catch (e) { return false; } })();
  if (!gl2) { boton.remove(); return; }
  function abrir() {
    if (marco) return;
    try { localStorage.setItem(CLAVE, "3d"); } catch (e) { /* sin memoria */ }
    window.__ciudadPausa && window.__ciudadPausa(true);
    marco = document.createElement("div"); marco.className = "cd-marco3d";
    marco.innerHTML = '<p>Despertando la ciudad…</p>';
    const f = document.createElement("iframe");
    f.title = "La ciudad dormida en 3D"; f.allow = "autoplay; fullscreen; accelerometer; gyroscope";
    f.addEventListener("load", () => { const p = marco && marco.querySelector("p"); if (p) p.style.opacity = 0; });
    marco.appendChild(f); document.body.appendChild(marco);
    requestAnimationFrame(() => requestAnimationFrame(() => marco && marco.classList.add("ver")));
    f.src = "ciudad-3d.html" + (location.search || "");
  }
  function cerrar() {
    if (!marco) return;
    try { localStorage.setItem(CLAVE, "2d"); } catch (e) { /* sin memoria */ }
    const m = marco; marco = null;
    window.__ciudadPausa && window.__ciudadPausa(false);
    m.classList.remove("ver");
    setTimeout(() => { const f = m.querySelector("iframe"); if (f) { try { f.contentWindow.location.replace("about:blank"); } catch (e) { f.src = "about:blank"; } } m.remove(); }, 480);
  }
  // el botón vive dentro de la calle, que captura el dedo para deslizar: que el toque se quede en el botón
  for (const ev of ["pointerdown", "pointermove", "pointerup"]) boton.addEventListener(ev, (e) => e.stopPropagation());
  boton.addEventListener("click", abrir);
  window.addEventListener("message", (e) => {
    const d = e.data; if (!d || typeof d !== "object") return;
    if (marco && e.source === marco.querySelector("iframe").contentWindow) {
      if (d.ciudad === "2d") cerrar();

      else if (d.libro && window.parent !== window) { try { window.parent.postMessage(d, "*"); } catch (er) { /* sin libro */ } }
    }

  let antes = "2d"; try { antes = localStorage.getItem(CLAVE) || "2d"; } catch (e) { /* sin memoria */ }

})();
</script>
