<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>La ciudad dormida</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@600;700&display=swap">
<!--
  LA CIUDAD DORMIDA — una pequeña ciudad nocturna romántica que parece
  tranquila… hasta que descubres que cualquier cosa puede pasar.

  El juego vive en `ciudad/` (módulos): mundo, cuerpos, jugador, gente,
  vehículos, poderes, eventos, lugares, efectos, audio e interfaz. Si el
  teléfono no tiene WebGL2, se abre la calle de siempre (ciudad-calle.html).
-->
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.min.js" } }</script>
<style>
:root{
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
  --vidrio: rgba(18, 14, 38, 0.72);
  --borde: rgba(255, 220, 180, 0.24);
  --crema: #fff2e4;
}
*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body{ margin: 0; padding: 0 !important; width: 100%; height: 100%; overflow: hidden; background: #0a0818; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; color: var(--crema); font-family: "Cormorant Garamond", Georgia, serif; }
#lienzo{ position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui{ position: fixed; inset: 0; pointer-events: none; z-index: 2; }
#ui button{ pointer-events: auto; font: inherit; color: inherit; cursor: pointer; }
.oculto{ display: none !important; }

/* arriba: contadores chiquitos */
.cd-arriba{ position: absolute; top: calc(var(--seg-t) + 10px); left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; }
.cd-chip{ display: inline-flex; gap: 5px; align-items: center; padding: 5px 11px; border-radius: 999px; background: var(--vidrio); border: 1px solid var(--borde);
  font: 600 13px system-ui, sans-serif; color: #ffe3c4; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.cd-chip b{ color: #ffb3d1; }
.cd-caos{ margin-left: auto; font: 700 13px system-ui, sans-serif; color: #ff8a8a; text-shadow: 0 0 10px rgba(255,60,60,.6); letter-spacing: .08em; }

/* el título del principio */
.cd-titulo{ position: absolute; left: 0; right: 0; top: calc(var(--seg-t) + 18%); text-align: center; transition: opacity 1.6s var(--suave), transform 1.6s var(--suave); }
.cd-titulo h1{ margin: 0; font-weight: 600; font-size: clamp(28px, 8vw, 46px); letter-spacing: .04em; text-shadow: 0 2px 24px rgba(255,140,200,.55); }
.cd-titulo p{ margin: 4px 0 0; font-family: Caveat, cursive; font-size: clamp(20px, 5.4vw, 26px); color: #ffc8e0; }
.cd-titulo.fuera{ opacity: 0; transform: translateY(-14px); }

/* el diálogo de abajo */
.cd-dialogo{ position: absolute; left: 50%; bottom: calc(var(--barra) + var(--seg-b) + 212px); transform: translateX(-50%); width: min(88vw, 430px); margin: 0;
  padding: 10px 16px 12px; border-radius: 16px; background: rgba(16, 12, 34, .86); border: 1px solid var(--borde); box-shadow: 0 10px 30px -10px #000;
  font: 600 clamp(19px, 5vw, 23px)/1.18 Caveat, cursive; text-align: center; color: #ffeede; transition: opacity .35s var(--suave), transform .35s var(--suave); }
.cd-dialogo.is-fuera{ opacity: 0; transform: translate(-50%, 8px); }
.cd-dialogo.es-ella{ color: #ffa6d5; border-color: rgba(255,140,200,.55); box-shadow: 0 10px 30px -10px #000, 0 0 24px -6px rgba(255,110,180,.7); }
.cd-dialogo.es-dios{ color: #ffe7a0; border-color: rgba(255,214,120,.55); box-shadow: 0 10px 30px -10px #000, 0 0 24px -6px rgba(255,200,90,.7); }
.cd-dialogo.es-rick{ color: #b8f0ff; border-color: rgba(120,230,255,.55); box-shadow: 0 10px 30px -10px #000, 0 0 24px -6px rgba(90,255,170,.6); }
.cd-dialogo.es-morty{ color: #fff3a0; border-color: rgba(255,230,90,.45); }
.cd-dialogo.es-poli{ color: #c8daff; border-color: rgba(120,160,255,.5); }

/* globitos sobre la gente */
.cd-burbujas{ position: absolute; inset: 0; overflow: hidden; }
.cd-globo{ position: absolute; left: 0; top: 0; max-width: 64vw; padding: 5px 10px 6px; border-radius: 12px; background: #fffaf2; color: #2a1428;
  font: 700 clamp(15px, 4vw, 18px)/1.1 Caveat, cursive; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 6px 16px -8px #000; opacity: 0; will-change: transform; }
.cd-globo.ella{ background: #ffd3ea; color: #8a1452; }
.cd-globo.yo, .cd-globo.dios{ background: #fff1c4; color: #5a3a08; }
.cd-globo.poli{ background: #d6e4ff; color: #12306a; }
.cd-globo.perro{ background: #e8fff0; color: #1a5a34; }
.cd-globo.rick{ background: #d8faff; color: #0a4a5a; }
.cd-globo.morty{ background: #fff6c0; color: #5a4a08; }

/* el joystick */
.cd-joy{ position: absolute; left: 0; top: 0; width: 120px; height: 120px; border-radius: 50%; border: 1.5px solid rgba(255,230,200,.3); background: radial-gradient(circle, rgba(255,240,220,.08), rgba(255,240,220,.02));
  opacity: 0; transition: opacity .2s; }
.cd-joy.ver{ opacity: 1; }
.cd-joy i{ position: absolute; left: 36px; top: 36px; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,236,214,.35); box-shadow: 0 0 18px rgba(255,180,220,.35); }

/* los botones */
.cd-botones{ position: absolute; right: 12px; bottom: calc(var(--barra) + var(--seg-b) + 14px); width: 186px; height: 186px; }
.cd-b{ position: absolute; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--borde); background: var(--vidrio);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 8px 20px -10px #000; font-size: 22px !important; line-height: 1; transition: transform .15s, background .3s, box-shadow .3s; }
.cd-b:active{ transform: scale(.9); }
.cd-golpe{ right: 0; bottom: 0; width: 74px; height: 74px; font-size: 30px !important; }
.cd-saltar{ right: 84px; bottom: 6px; width: 58px; height: 58px; }
.cd-bajar{ right: 148px; bottom: 6px; width: 46px; height: 46px; font-size: 19px !important; }
.cd-accion{ right: 6px; bottom: 84px; min-width: 62px; height: 46px; border-radius: 23px; padding: 0 14px; font: 700 16px Caveat, cursive !important; color: #ffd8b0; white-space: nowrap; }
.cd-accion span{ font: inherit; }
.cd-botones.dios .cd-accion{ right: 142px; bottom: 80px; }
.cd-dios{ right: 0; bottom: 140px; width: 46px; height: 46px; font-size: 20px !important; }
.cd-dios.on{ background: radial-gradient(circle at 50% 40%, #fff6cf, #ffc04a 55%, #b8702a); box-shadow: 0 0 0 2px #fff0b0, 0 0 26px rgba(255,220,120,.9); animation: brilla 1.4s ease-in-out infinite; }
@keyframes brilla{ 50%{ box-shadow: 0 0 0 2px #fff0b0, 0 0 40px rgba(255,220,120,1); } }
.cd-poder{ right: 76px; bottom: 76px; width: 58px; height: 58px; font-size: 26px !important; border-color: rgba(255,214,130,.6); background: rgba(70,44,16,.82); }
.cd-mini{ right: 56px; bottom: 140px; width: 38px; height: 38px; font-size: 18px !important; }
.cd-rueda{ position: absolute; right: 12px; bottom: calc(var(--barra) + var(--seg-b) + 204px); display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 260px; pointer-events: auto; }
.cd-rp{ width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--borde); background: var(--vidrio); font-size: 21px !important; display: grid; place-items: center; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.cd-rp.activo{ box-shadow: 0 0 0 2px #ffd36e, 0 0 18px rgba(255,210,110,.7); background: rgba(92,58,22,.95); }
.cd-rp.bloq{ filter: grayscale(1) brightness(.75); border-style: dashed; }

/* avisos, en vivo y el anillo de la luna */
.cd-aviso{ position: absolute; left: 50%; top: calc(var(--seg-t) + 52px); transform: translate(-50%, -10px); padding: 7px 14px; border-radius: 999px; background: rgba(30,20,60,.92);
  border: 1px solid rgba(255,210,140,.4); font: 700 14px system-ui, sans-serif; color: #ffe3a8; white-space: nowrap; opacity: 0; transition: opacity .4s, transform .4s var(--suave); max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
.cd-aviso.ver{ opacity: 1; transform: translate(-50%, 0); }
.cd-envivo{ position: absolute; left: 10px; right: 10px; top: calc(var(--seg-t) + 88px); padding: 6px 10px; border-radius: 8px; background: linear-gradient(90deg, #c8102e, #8a0c20 40%, #1a1a2e);
  font: 700 12.5px system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .6s; }
.cd-envivo.ver{ opacity: 1; }
.cd-luna{ position: absolute; left: 0; top: 0; width: 100px; height: 100px; opacity: 0; transition: opacity .3s; }
.cd-luna circle{ fill: none; stroke: #fff4d6; stroke-width: 3; stroke-dasharray: 277; stroke-dashoffset: 277; filter: drop-shadow(0 0 6px #fff); transform: rotate(-90deg); transform-origin: 50% 50%; }

/* tarjetas */
.cd-capa{ position: absolute; inset: 0; display: grid; place-items: center; background: rgba(6,5,18,.6); pointer-events: auto; z-index: 5;
  padding: calc(var(--seg-t) + 16px) 16px calc(var(--seg-b) + var(--barra) + 16px); animation: entra .35s var(--suave); }
@keyframes entra{ from{ opacity: 0; } }
.cd-tarjeta{ width: min(100%, 370px); max-height: 100%; overflow: auto; padding: 16px 16px 14px; border-radius: 18px; background: linear-gradient(170deg, #241b42, #140f28);
  border: 1px solid var(--borde); box-shadow: 0 20px 50px -14px #000; text-align: center; animation: sube .45s var(--suave); touch-action: pan-y; }
@keyframes sube{ from{ transform: translateY(18px) scale(.96); opacity: 0; } }
.cd-tarjeta h2{ margin: 2px 0 6px; font: 700 30px/1 Caveat, cursive; color: #ffd9a8; }
.cd-tarjeta p{ margin: 6px 0; font-size: 18px; line-height: 1.3; }
.cd-tarjeta canvas{ width: 100%; aspect-ratio: 3 / 2; border-radius: 12px; display: block; background: #0c0f22; }
.cd-tarjeta .mano{ font: 600 25px/1.15 Caveat, cursive; color: #ffc8e0; }
.cd-tarjeta .estado{ display: inline-block; margin: 4px 0; padding: 4px 12px; border-radius: 999px; font: 700 15px system-ui, sans-serif; letter-spacing: .06em; }
.cd-tarjeta .abierto{ background: rgba(60,200,110,.18); color: #7dffa8; }
.cd-tarjeta .cerrado{ background: rgba(230,60,70,.18); color: #ff8a8a; }
.cd-tarjeta ul{ list-style: none; margin: 4px 0 8px; padding: 0; text-align: left; display: grid; gap: 4px; font-size: 16px; }
.cd-tarjeta li{ padding: 5px 9px; border-radius: 10px; background: rgba(255,255,255,.05); }
.cd-tarjeta li.si{ background: rgba(255,210,120,.12); color: #ffe3a8; }
.cd-tarjeta li small{ display: block; font-size: 13.5px; opacity: .7; }
.cd-tarjeta h3{ margin: 12px 0 2px; font: 700 12px system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #bfb4ff; }
.cd-tarjeta button{ margin-top: 10px; font: 600 17px "Cormorant Garamond", serif !important; border: 0; border-radius: 999px; padding: 8px 22px; background: #ffd9a8; color: #2a1428 !important; }
@media (orientation: landscape) and (max-height: 500px){
  .cd-dialogo{ bottom: calc(var(--barra) + var(--seg-b) + 16px); width: min(52vw, 430px); }
  .cd-botones{ transform: scale(.85); transform-origin: 100% 100%; }
}
</style>
</head>
<body>
<canvas id="lienzo" aria-label="La ciudad dormida: una ciudad de noche para explorar"></canvas>
<div id="ui"></div>
<script type="module" src="ciudad/main.js"></script>
</body>
</html>
