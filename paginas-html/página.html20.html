<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La cometa</title>
<script src="sonido-libro.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Caveat:wght@500&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════════════
   LA COMETA
   Una tarde de viento en el campo. La cometa vuela sola, con su cuerda y
   su cola de moños: sube con las rachas, cabecea, se cae un poco cuando
   el aire afloja y da vueltas si sopla fuerte. Con el dedo llevas el
   carrete y das tirones; tocando el cielo mandas una ráfaga. Prefijo `ct-`.
   ══════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; overflow: hidden; background: #f7d9c4; }
.ct {
  position: fixed;
  inset: 0;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  font-family: "Cormorant Garamond", Georgia, serif;
  color: #5a2c3a;
  --seg-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seg-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --barra: var(--hueco-barra, 0rem);
  --suave: cubic-bezier(0.22, 1, 0.36, 1);
}
.ct canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ct-cabeza {
  position: absolute;
  top: calc(var(--seg-t) + 14px);
  left: 0; right: 0;
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 0 20px;
  pointer-events: none;
  text-align: center;
}
.ct-titulo {
  margin: 0;
  font-weight: 600;
  font-size: clamp(0.66rem, 2.8vw, 0.78rem);
  letter-spacing: 0.36em;
  text-transform: uppercase;
  color: rgba(110, 50, 70, 0.7);
}
.ct-frase {
  margin: 0;
  max-width: 20em;
  min-height: 1.3em;
  font-style: italic;
  font-weight: 500;
  font-size: clamp(1.06rem, 4.8vw, 1.32rem);
  line-height: 1.3;
  color: #6a2c40;
  text-shadow: 0 1px 10px rgba(255, 240, 230, 0.8);
  transition: opacity 700ms var(--suave), transform 700ms var(--suave);
}
.ct-frase.is-fuera { opacity: 0; transform: translateY(-6px); }
.ct-pista {
  position: absolute;
  left: 0; right: 0;
  bottom: calc(var(--seg-b) + var(--barra) + 12px);
  margin: 0;
  text-align: center;
  pointer-events: none;
  font-size: clamp(0.58rem, 2.4vw, 0.68rem);
  font-weight: 600;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: rgba(255, 250, 240, 0.8);
  text-shadow: 0 1px 6px rgba(40, 60, 20, 0.6);
}
</style>
</head>
<body>
<div class="ct" id="mundo">
  <canvas id="lienzo"></canvas>
  <div class="ct-cabeza">
    <p class="ct-titulo">La cometa</p>
    <p class="ct-frase" id="frase" role="status" aria-live="polite">Hoy hace buen viento.</p>
  </div>
  <p class="ct-pista">arrastra el carrete · toca el cielo para soplar</p>
</div>

<script>
(() => {
"use strict";

/* ══════════════════════════════════════════════════════════════════════
   LO QUE SE PUEDE CAMBIAR
   ══════════════════════════════════════════════════════════════════════ */
const CONF = {
  frases: {
    alta: ["Mírala, qué alto llega.", "Así me tienes: en las nubes."],
    vuelta: ["¡Dio una vuelta completa!", "Tú también me haces dar vueltas así."],
    tiron: ["Mientras yo la sostenga, no se cae.", "Aunque sople fuerte, no te suelto."],
    baja: ["Se cansó un poquito…", "ahorita vuelve el viento"],
  },
  colores: ["#e8436b", "#ffd3dc", "#b3265a", "#ffb4c4"],
};

/* ══════════════════════════════════════════════════════════════════════ */
const mundo = document.getElementById("mundo");
const lienzo = document.getElementById("lienzo");
const g = lienzo.getContext("2d", { alpha: false });
const elFrase = document.getElementById("frase");
const suave = matchMedia("(prefers-reduced-motion: reduce)").matches;

const TAU = Math.PI * 2;
const azar = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const acercar = (v, o, k, dt) => o + (v - o) * Math.exp(-k * dt);
const angDif = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };

let A = 0, H = 0, dpr = 1, suelo = 0, escala = 1, techo = 0;
let fondo = null;

/* Un ruido suave para el viento: suma de senos con fases raras. */
const ruido = (t, s) => Math.sin(t * 0.31 + s) * 0.5 + Math.sin(t * 0.73 + s * 2.1) * 0.3 + Math.sin(t * 1.9 + s * 3.7) * 0.2;

/* ══════════════════════════════════════════════════════════════════════
   EL PAISAJE
   ══════════════════════════════════════════════════════════════════════ */
let sol = { x: 0, y: 0 };
const nubes = [];
const hierba = [];
const semillas = [];
const pajaros = [];

function pintarFondo() {
  const c = document.createElement("canvas");
  c.width = Math.round(A * dpr); c.height = Math.round(H * dpr);
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cielo = x.createLinearGradient(0, 0, 0, suelo);
  cielo.addColorStop(0, "#8fbde6");
  cielo.addColorStop(0.45, "#c8d8ec");
  cielo.addColorStop(0.75, "#f6d3c6");
  cielo.addColorStop(1, "#ffd6a8");
  x.fillStyle = cielo;
  x.fillRect(0, 0, A, H);
  sol = { x: A * 0.78, y: suelo - H * 0.16 };
  const halo = x.createRadialGradient(sol.x, sol.y, 0, sol.x, sol.y, Math.max(A, H) * 0.55);
  halo.addColorStop(0, "rgba(255,236,190,.95)");
  halo.addColorStop(0.08, "rgba(255,220,170,.6)");
  halo.addColorStop(1, "rgba(255,210,170,0)");
  x.fillStyle = halo;
  x.fillRect(0, 0, A, H);
  x.fillStyle = "#fff4dc";
  x.beginPath(); x.arc(sol.x, sol.y, Math.min(A, H) * 0.045, 0, TAU); x.fill();
  // Lomas lejanas, azuladas por el aire.
  for (const [k, col] of [[0, "#b9b9d6"], [1, "#9fb99a"], [2, "#86a878"]]) {
    x.fillStyle = col;
    x.beginPath();
    x.moveTo(0, H);
    const base = suelo - H * (0.09 - k * 0.03);
    for (let i = 0; i <= 24; i++) x.lineTo(A * i / 24, base + Math.sin(i * 0.8 + k * 1.7) * H * 0.018 + Math.sin(i * 0.23 + k) * H * 0.02);
    x.lineTo(A, H);
    x.fill();
  }
  // Un árbol solito en la loma.
  const ax = A * 0.16, ay = suelo - H * 0.035;
  x.fillStyle = "#5a7a4a";
  x.fillRect(ax - 2, ay - H * 0.04, 4, H * 0.04);
  for (const [dx, dy, r] of [[0, -0.06, 0.035], [-0.02, -0.05, 0.025], [0.02, -0.05, 0.027]]) {
    x.beginPath(); x.arc(ax + dx * H, ay + dy * H, r * H, 0, TAU); x.fill();
  }
  const pasto = x.createLinearGradient(0, suelo, 0, H);
  pasto.addColorStop(0, "#8ab86a");
  pasto.addColorStop(1, "#4f7f3c");
  x.fillStyle = pasto;
  x.fillRect(0, suelo, A, H - suelo);
  fondo = c;
}

function sembrar() {
  nubes.length = 0;
  for (let i = 0; i < 7; i++) {
    const lejos = i < 3;
    nubes.push({ x: Math.random() * A * 1.4 - A * 0.2, y: azar(H * 0.08, suelo * (lejos ? 0.55 : 0.75)), s: azar(0.7, 1.4) * (lejos ? 0.6 : 1), lejos, bolas: Array.from({ length: 6 }, () => [azar(-1, 1), azar(-0.3, 0.2), azar(0.35, 0.7)]) });
  }
  hierba.length = 0;
  for (let i = 0; i < A / 3.5; i++) hierba.push({ x: i * 3.5 + azar(-2, 2), alto: azar(8, 26) * escala, f: Math.random() * TAU, tono: Math.random() < 0.5 ? "#3f6e30" : "#5b8f45", flor: Math.random() < 0.05 ? ["#ffffff", "#ffd1dc", "#ffe066"][Math.floor(Math.random() * 3)] : null });
}

/* ══════════════════════════════════════════════════════════════════════
   LA COMETA, SU CUERDA Y SU COLA
   ══════════════════════════════════════════════════════════════════════ */
const K = { x: 0, y: 0, vx: 0, vy: 0, ang: 0, va: 0, tam: 44 };
const carrete = { x: 0, y: 0, ox: 0, oy: 0 };
let largo = 0, largoMax = 0;
const N_CUERDA = 28, N_COLA = 16;
let cuerda = [], cola = [];

function punto(x, y) { return { x, y, px: x, py: y }; }
function armar() {
  largoMax = Math.hypot(A * 0.4, suelo * 0.85);
  largo = largoMax * 0.75;
  K.tam = clamp(Math.min(A, H) * 0.11, 30, 60);
  K.x = carrete.x + A * 0.1; K.y = suelo * 0.35; K.vx = K.vy = 0; K.ang = 0.1; K.va = 0;
  cuerda = Array.from({ length: N_CUERDA + 1 }, (_, i) => punto(carrete.x + (K.x - carrete.x) * i / N_CUERDA, carrete.y + (K.y - carrete.y) * i / N_CUERDA));
  const [bx, by] = bajoCometa();
  cola = Array.from({ length: N_COLA }, (_, i) => punto(bx, by + i * K.tam * 0.28));
}
function arribaCometa() { return [Math.sin(K.ang), -Math.cos(K.ang)]; }
function bajoCometa() { const [ux, uy] = arribaCometa(); return [K.x - ux * K.tam * 1.05, K.y - uy * K.tam * 1.05]; }
function bridaCometa() { const [ux, uy] = arribaCometa(); return [K.x - ux * K.tam * 0.25, K.y - uy * K.tam * 0.25]; }

/* ══════════════════════════════════════════════════════════════════════
   EL VIENTO
   ══════════════════════════════════════════════════════════════════════ */
let viento = 1, vientoX = 0, rafaga = 0;
function soplar(x, y) {
  rafaga = 1;
  K.va += (x < K.x ? 1 : -1) * azar(3, 6);
  K.vx += (K.x - x) * 0.6;
  K.vy -= 80;
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * TAU;
    semillas.push({ x, y, vx: Math.cos(a) * azar(60, 220), vy: Math.sin(a) * azar(60, 220), vida: 1, tipo: Math.random() < 0.5 ? "semilla" : "petalo", giro: Math.random() * TAU });
  }
  sonidoRafaga();
}

/* ══════════════════════════════════════════════════════════════════════
   EL SONIDO
   ══════════════════════════════════════════════════════════════════════ */
let ac = null, salida = null, aire = null;
function despertar() {
  if (ac) { if (ac.state === "suspended") ac.resume(); return ac; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; }
  salida = ac.createGain();
  salida.gain.value = 0.9;
  salida.connect(ac.destination);
  // El aire: ruido que sube y baja con el viento. Es ambiente.
  const n = ac.sampleRate * 2;
  const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(); s.buffer = b; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 500; f.Q.value = 0.6;
  const gg = ac.createGain(); gg.gain.value = 0;
  s.connect(f).connect(gg);
  if (window.LibroSonido) window.LibroSonido.ambiente(gg); else gg.connect(ac.destination);
  s.start();
  aire = { f, gg };
  return ac;
}
function ruidoCorto(dur) {
  const n = Math.max(1, Math.floor(ac.sampleRate * dur));
  const b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
  const s = ac.createBufferSource(); s.buffer = b; return s;
}
function sonidoRafaga() {
  if (!despertar()) return;
  const t = ac.currentTime, s = ruidoCorto(1.1);
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 0.8;
  f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(1800, t + 0.5); f.frequency.exponentialRampToValueAtTime(500, t + 1.1);
  const gg = ac.createGain(); gg.gain.value = 0.22;
  s.connect(f).connect(gg).connect(salida);
  s.start(t);
}
function sonidoTiron() {
  if (!despertar()) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), gg = ac.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(180, t);
  o.frequency.exponentialRampToValueAtTime(330, t + 0.08);
  o.frequency.exponentialRampToValueAtTime(240, t + 0.3);
  gg.gain.setValueAtTime(0.0001, t);
  gg.gain.exponentialRampToValueAtTime(0.08, t + 0.01);
  gg.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  o.connect(gg).connect(salida);
  o.start(t); o.stop(t + 0.4);
}
let ultimoAleteo = 0;
function aleteo(fuerza) {
  if (!ac || performance.now() - ultimoAleteo < 70) return;
  ultimoAleteo = performance.now();
  const t = ac.currentTime, s = ruidoCorto(0.04);
  const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1500;
  const gg = ac.createGain(); gg.gain.value = Math.min(0.06, fuerza * 0.02);
  s.connect(f).connect(gg);
  if (window.LibroSonido) window.LibroSonido.ambiente(gg); else gg.connect(ac.destination);
  s.start(t);
}
function campanitas() {
  if (!ac) return;
  const t = ac.currentTime;
  [783.99, 987.77, 1174.66, 1567.98].forEach((fr, i) => {
    const o = ac.createOscillator(), gg = ac.createGain();
    o.frequency.value = fr;
    gg.gain.setValueAtTime(0, t + i * 0.1);
    gg.gain.linearRampToValueAtTime(0.035, t + i * 0.1 + 0.01);
    gg.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.1 + 1.5);
    o.connect(gg).connect(salida);
    o.start(t + i * 0.1); o.stop(t + i * 0.1 + 1.6);
  });
}

/* ══════════════════════════════════════════════════════════════════════
   LOS TEXTOS
   ══════════════════════════════════════════════════════════════════════ */
let bloqueo = 0;
function decir(par) {
  const ahora = performance.now();
  if (ahora < bloqueo) return;
  bloqueo = ahora + 7000;
  const t = par[Math.floor(Math.random() * par.length)];
  elFrase.classList.add("is-fuera");
  setTimeout(() => { elFrase.textContent = t; elFrase.classList.remove("is-fuera"); }, suave ? 20 : 450);
}

/* ══════════════════════════════════════════════════════════════════════
   EL DEDO
   ══════════════════════════════════════════════════════════════════════ */
let dedo = null;
mundo.addEventListener("pointerdown", (e) => {
  despertar();
  const r = mundo.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  dedo = { id: e.pointerId, x, y, x0: x, y0: y, t: performance.now(), movido: false, lleva: y > suelo - H * 0.2 || Math.hypot(x - carrete.x, y - carrete.y) < 90, cx0: carrete.ox, cy0: carrete.oy, hist: [[y, performance.now()]] };
  try { mundo.setPointerCapture(e.pointerId); } catch { /* nada */ }
});
mundo.addEventListener("pointermove", (e) => {
  if (!dedo || e.pointerId !== dedo.id) return;
  const r = mundo.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  if (Math.hypot(x - dedo.x0, y - dedo.y0) > 10) { dedo.movido = true; dedo.lleva = true; }
  dedo.x = x; dedo.y = y;
  dedo.hist.push([y, performance.now()]);
  if (dedo.hist.length > 6) dedo.hist.shift();
  if (dedo.lleva) {
    carrete.ox = clamp(dedo.cx0 + (x - dedo.x0), -A * 0.4, A * 0.4);
    carrete.oy = clamp(dedo.cy0 + (y - dedo.y0), -H * 0.18, H * 0.06);
  }
});
function soltar(e) {
  if (!dedo || e.pointerId !== dedo.id) return;
  const d = dedo;
  dedo = null;
  // ¿Fue un tirón hacia abajo? Entonces la cometa sube de golpe.
  const [y0, t0] = d.hist[0], [y1, t1] = d.hist[d.hist.length - 1];
  const vy = (y1 - y0) / Math.max(0.016, (t1 - t0) / 1000);
  if (d.movido && vy > 700) {
    const [ux, uy] = [K.x - carrete.x, K.y - carrete.y];
    const n = Math.hypot(ux, uy) || 1;
    K.vx += ux / n * 260; K.vy += uy / n * 260 - 140;
    sonidoTiron();
    decir(CONF.frases.tiron);
  }
  if (!d.movido && performance.now() - d.t < 350 && d.y < suelo - H * 0.2) soplar(d.x, d.y);
  // El carrete vuelve despacio a su sitio.
}
mundo.addEventListener("pointerup", soltar);
mundo.addEventListener("pointercancel", soltar);

/* ══════════════════════════════════════════════════════════════════════
   LA FÍSICA
   ══════════════════════════════════════════════════════════════════════ */
let giroAcum = 0, relojBaja = 0, relojAlta = 0;

function fisica(dt, t) {
  // El viento: base suave, rachas que van y vienen, y la ráfaga del dedo.
  rafaga = Math.max(0, rafaga - dt * 0.6);
  viento = 0.95 + ruido(t * 0.6, 1) * 0.45 + Math.max(0, ruido(t * 1.3, 7)) * 0.5 + rafaga * 0.9;
  vientoX = ruido(t * 0.4, 3) * 70 + rafaga * 40 * Math.sign(Math.sin(t));

  // El carrete sigue a la mano (o vuelve a su sitio si no hay mano).
  if (!dedo) { carrete.ox = acercar(carrete.ox, carrete.ox * 0.6, 0.8, dt); carrete.oy = acercar(carrete.oy, 0, 2, dt); }
  carrete.x = A * 0.5 + carrete.ox;
  carrete.y = suelo + H * 0.06 + carrete.oy;

  // Se suelta cuerda si tira fuerte, y se recoge un poco si afloja.
  const tension = Math.hypot(K.x - carrete.x, K.y - carrete.y) / largo;
  largo = clamp(largo + (viento > 1.1 && tension > 0.98 ? 40 : -12) * dt, largoMax * 0.45, largoMax);

  // Fuerzas sobre la cometa.
  const [ux, uy] = arribaCometa();
  const sust = viento * viento * 170 * escala;
  let fx = ux * sust + vientoX * 0.9;
  let fy = uy * sust - viento * viento * 60 * escala + 150 * escala;     // la gravedad, abajo
  fx -= K.vx * 1.1; fy -= K.vy * 1.1;                                      // el aire la frena
  K.vx += fx * dt; K.vy += fy * dt;
  K.x += K.vx * dt; K.y += K.vy * dt;

  // La cuerda no se estira: si la cometa se pasa, vuelve al círculo.
  const dx = K.x - carrete.x, dy = K.y - carrete.y, d = Math.hypot(dx, dy);
  if (d > largo) {
    const nx = dx / d, ny = dy / d;
    K.x = carrete.x + nx * largo; K.y = carrete.y + ny * largo;
    const vn = K.vx * nx + K.vy * ny;
    if (vn > 0) { K.vx -= vn * nx; K.vy -= vn * ny; }
  }
  // El techo y el suelo.
  if (K.y < techo) { K.y = techo; K.vy = Math.abs(K.vy) * 0.3; }
  if (K.y > suelo - K.tam * 0.4) { K.y = suelo - K.tam * 0.4; K.vy = -Math.abs(K.vy) * 0.4; K.va += azar(-2, 2); }
  if (K.x < K.tam) { K.x = K.tam; K.vx = Math.abs(K.vx) * 0.5; }
  if (K.x > A - K.tam) { K.x = A - K.tam; K.vx = -Math.abs(K.vx) * 0.5; }

  // El giro: la cuerda la endereza hacia su dirección, la cola la frena y
  // las rachas la hacen cabecear. Con una racha fuerte, da la vuelta.
  const angCuerda = Math.atan2(dx, -dy);
  const torque = angDif(K.ang, angCuerda) * 7 - K.va * 2.2 + ruido(t * 2.3, 11) * viento * 3.2 + rafaga * ruido(t * 5, 2) * 12;
  K.va += torque * dt;
  K.ang += K.va * dt;
  giroAcum += K.va * dt;
  if (Math.abs(giroAcum) > TAU) { giroAcum = 0; decir(CONF.frases.vuelta); campanitas(); }
  giroAcum *= Math.exp(-dt * 0.25);
  if (Math.abs(K.va) > 2.5) aleteo(Math.abs(K.va));

  // La cuerda: puntos con verlet, atados al carrete y a la brida.
  const [bx, by] = bridaCometa();
  const seg = largo / N_CUERDA;
  for (let i = 1; i < N_CUERDA; i++) {
    const p = cuerda[i];
    const vx = (p.x - p.px) * 0.98, vy = (p.y - p.py) * 0.98;
    p.px = p.x; p.py = p.y;
    p.x += vx + vientoX * 0.002; p.y += vy + 260 * dt * dt;
  }
  cuerda[0].x = carrete.x; cuerda[0].y = carrete.y;
  cuerda[N_CUERDA].x = bx; cuerda[N_CUERDA].y = by;
  for (let it = 0; it < 12; it++) {
    for (let i = 0; i < N_CUERDA; i++) {
      const a = cuerda[i], b = cuerda[i + 1];
      const ddx = b.x - a.x, ddy = b.y - a.y, dd = Math.hypot(ddx, ddy) || 0.001;
      if (dd <= seg) continue;
      const k = (dd - seg) / dd * 0.5;
      if (i > 0) { a.x += ddx * k; a.y += ddy * k; }
      if (i + 1 < N_CUERDA) { b.x -= ddx * k; b.y -= ddy * k; }
    }
    cuerda[0].x = carrete.x; cuerda[0].y = carrete.y;
    cuerda[N_CUERDA].x = bx; cuerda[N_CUERDA].y = by;
  }

  // La cola: una cadena que cuelga, ondea y se queda atrás.
  const [cx0, cy0] = bajoCometa();
  cola[0].x = cx0; cola[0].y = cy0;
  const eslabon = K.tam * 0.3;
  for (let i = 1; i < N_COLA; i++) {
    const p = cola[i];
    const vx = (p.x - p.px) * 0.94, vy = (p.y - p.py) * 0.94;
    p.px = p.x; p.py = p.y;
    const ondea = Math.sin(t * 9 - i * 0.7) * viento * 30 * dt * dt * 60;
    p.x += vx + ondea + vientoX * 0.004 * i / N_COLA; p.y += vy + 220 * dt * dt;
  }
  for (let it = 0; it < 6; it++) {
    for (let i = 0; i < N_COLA - 1; i++) {
      const a = cola[i], b = cola[i + 1];
      const ddx = b.x - a.x, ddy = b.y - a.y, dd = Math.hypot(ddx, ddy) || 0.001;
      const k = (dd - eslabon) / dd;
      if (i === 0) { b.x -= ddx * k; b.y -= ddy * k; }
      else { a.x += ddx * k * 0.5; a.y += ddy * k * 0.5; b.x -= ddx * k * 0.5; b.y -= ddy * k * 0.5; }
    }
    cola[0].x = cx0; cola[0].y = cy0;
  }

  // Lo que se dice según cómo vuela.
  if (K.y < suelo * 0.22) { relojAlta += dt; if (relojAlta > 2) { relojAlta = -10; decir(CONF.frases.alta); } } else relojAlta = Math.max(0, relojAlta - dt);
  if (K.y > suelo * 0.8) { relojBaja += dt; if (relojBaja > 1.5) { relojBaja = -12; decir(CONF.frases.baja); } } else relojBaja = Math.max(0, relojBaja - dt);

  if (aire && ac) {
    aire.gg.gain.setTargetAtTime(clamp(viento - 0.5, 0, 1.5) * 0.05, ac.currentTime, 0.3);
    aire.f.frequency.setTargetAtTime(350 + viento * 400, ac.currentTime, 0.3);
  }
}

/* ══════════════════════════════════════════════════════════════════════
   PINTAR
   ══════════════════════════════════════════════════════════════════════ */
/* Cada nube se pinta una vez, suave, con muchas bolitas difuminadas. */
function hacerNube(n) {
  const s = n.s * Math.min(A, H) * 0.13;
  const w = s * 4.4, h = s * 2;
  const c = document.createElement("canvas");
  c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr);
  const x = c.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (let i = 0; i < 26; i++) {
    const bx = w / 2 + azar(-1, 1) * s * 1.5, by = h * 0.58 + azar(-0.45, 0.15) * s * (1 - Math.abs(bx - w / 2) / (s * 2));
    const br = azar(0.35, 0.7) * s;
    const gr = x.createRadialGradient(bx, by, 0, bx, by, br);
    gr.addColorStop(0, "rgba(255,255,255,.95)");
    gr.addColorStop(0.6, "rgba(255,255,255,.6)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    x.fillStyle = gr;
    x.fillRect(bx - br, by - br, br * 2, br * 2);
  }
  // Abajo, el tono rosado del atardecer.
  x.globalCompositeOperation = "source-atop";
  const sombra = x.createLinearGradient(0, h * 0.3, 0, h);
  sombra.addColorStop(0, "rgba(255,210,200,0)");
  sombra.addColorStop(1, "rgba(250,190,190,.55)");
  x.fillStyle = sombra;
  x.fillRect(0, 0, w, h);
  n.img = c; n.w = w; n.h = h;
}
function nube(n) {
  if (!n.img) hacerNube(n);
  g.globalAlpha = n.lejos ? 0.6 : 0.92;
  g.drawImage(n.img, n.x - n.w / 2, n.y - n.h / 2, n.w, n.h);
  g.globalAlpha = 1;
}

function pintarCometa() {
  const tam = K.tam;
  // Un poco de «giro» 3D: se estrecha cuando cabecea rápido.
  const ladeo = clamp(Math.abs(K.va) * 0.08, 0, 0.45);
  g.save();
  g.translate(K.x, K.y);
  g.rotate(K.ang);
  g.scale(1 - ladeo, 1);
  const P = [[0, -tam], [tam * 0.72, -tam * 0.18], [0, tam * 1.05], [-tam * 0.72, -tam * 0.18]];
  const centro = [0, -tam * 0.18];
  // Los cuatro paños, cada uno de un color, con su sombrita.
  const panos = [[P[0], P[1]], [P[1], P[2]], [P[2], P[3]], [P[3], P[0]]];
  panos.forEach(([a, b], i) => {
    const onda = Math.sin(reloj * 6 + i) * tam * 0.02 * viento;
    g.fillStyle = CONF.colores[i];
    g.beginPath();
    g.moveTo(centro[0], centro[1]);
    g.lineTo(a[0], a[1]);
    g.quadraticCurveTo((a[0] + b[0]) / 2 * 1.05 + onda, (a[1] + b[1]) / 2 * 1.05, b[0], b[1]);
    g.closePath();
    g.fill();
    const sombra = g.createLinearGradient(centro[0], centro[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    sombra.addColorStop(0, "rgba(255,255,255,.18)");
    sombra.addColorStop(1, "rgba(80,0,30,.2)");
    g.fillStyle = sombra;
    g.fill();
  });
  // Las varillas.
  g.strokeStyle = "rgba(90,50,30,.8)";
  g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(P[0][0], P[0][1]); g.lineTo(P[2][0], P[2][1]); g.stroke();
  g.beginPath(); g.moveTo(P[3][0], P[3][1]); g.lineTo(P[1][0], P[1][1]); g.stroke();
  // El corazón del medio.
  g.fillStyle = "#fff5f7";
  const hs = tam * 0.2, hy = -tam * 0.18;
  g.beginPath();
  g.moveTo(0, hy + hs * 0.8);
  g.bezierCurveTo(-hs * 1.4, hy - hs * 0.1, -hs * 0.55, hy - hs * 1.05, 0, hy - hs * 0.35);
  g.bezierCurveTo(hs * 0.55, hy - hs * 1.05, hs * 1.4, hy - hs * 0.1, 0, hy + hs * 0.8);
  g.fill();
  g.strokeStyle = "rgba(255,255,255,.7)";
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(P[0][0], P[0][1]); g.lineTo(P[1][0], P[1][1]); g.lineTo(P[2][0], P[2][1]); g.lineTo(P[3][0], P[3][1]); g.closePath(); g.stroke();
  g.restore();
}

function pintarCola() {
  g.strokeStyle = "#8a2a44";
  g.lineWidth = 1.4;
  g.beginPath();
  g.moveTo(cola[0].x, cola[0].y);
  for (let i = 1; i < N_COLA; i++) g.lineTo(cola[i].x, cola[i].y);
  g.stroke();
  // Los moñitos, uno cada dos eslabones.
  for (let i = 2; i < N_COLA; i += 2) {
    const a = cola[i - 1], b = cola[i];
    const ang = Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2;
    const s = K.tam * 0.18 * (1 - i / N_COLA * 0.3);
    g.save();
    g.translate(b.x, b.y);
    g.rotate(ang + Math.sin(reloj * 8 + i) * 0.3);
    g.fillStyle = CONF.colores[(i / 2) % CONF.colores.length];
    g.beginPath();
    g.moveTo(0, 0); g.lineTo(-s, -s * 0.6); g.lineTo(-s, s * 0.6); g.closePath();
    g.moveTo(0, 0); g.lineTo(s, -s * 0.6); g.lineTo(s, s * 0.6); g.closePath();
    g.fill();
    g.restore();
  }
}

let t0 = performance.now(), reloj = 0;
function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A) return;
  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.05) dt = 1 / 60;
  reloj += dt;
  fisica(dt, reloj);

  g.drawImage(fondo, 0, 0, A, H);

  // Las nubes lejanas, y los pájaros.
  for (const n of nubes) {
    n.x += (n.lejos ? 5 : 14) * viento * dt + vientoX * 0.02 * dt;
    if (n.x > A * 1.3) n.x = -A * 0.3;
    if (n.lejos) nube(n);
  }
  if (Math.random() < dt * 0.05 && pajaros.length === 0) {
    const y = azar(H * 0.1, suelo * 0.5);
    for (let i = 0; i < 5; i++) pajaros.push({ x: -20 - i * 18 - Math.random() * 10, y: y + (i % 2) * 10 + azar(-4, 4), f: Math.random() * TAU });
  }
  g.strokeStyle = "rgba(70,60,80,.7)";
  g.lineWidth = 1.3;
  for (let i = pajaros.length - 1; i >= 0; i--) {
    const p = pajaros[i];
    p.x += 55 * dt; p.y += Math.sin(reloj * 2 + p.f) * 6 * dt;
    if (p.x > A + 40) { pajaros.splice(i, 1); continue; }
    const al = Math.sin(reloj * 10 + p.f) * 3;
    g.beginPath(); g.moveTo(p.x - 5, p.y - al); g.quadraticCurveTo(p.x - 2, p.y - 2, p.x, p.y); g.quadraticCurveTo(p.x + 2, p.y - 2, p.x + 5, p.y - al); g.stroke();
  }

  // La cuerda.
  g.strokeStyle = "rgba(255,255,255,.85)";
  g.lineWidth = 1.1;
  g.beginPath();
  g.moveTo(cuerda[0].x, cuerda[0].y);
  for (let i = 1; i <= N_CUERDA; i++) g.lineTo(cuerda[i].x, cuerda[i].y);
  g.stroke();
  pintarCola();
  pintarCometa();

  // Las nubes cercanas pasan por delante de la cometa a veces.
  for (const n of nubes) if (!n.lejos) nube(n);

  // La hierba, que se peina con el viento.
  const empuje = viento * 0.25 + vientoX * 0.002;
  for (const h of hierba) {
    const ang = empuje + Math.sin(reloj * 2.2 + h.x * 0.03 + h.f) * 0.12 * viento;
    const px = h.x + Math.sin(ang) * h.alto, py = H - (H - suelo) * 0.1 - Math.cos(ang) * h.alto;
    g.strokeStyle = h.tono;
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(h.x, H); g.quadraticCurveTo(h.x + Math.sin(ang) * h.alto * 0.3, py + h.alto * 0.4, px, py); g.stroke();
    if (h.flor) { g.fillStyle = h.flor; g.beginPath(); g.arc(px, py, 2.4, 0, TAU); g.fill(); }
  }

  // El carrete de madera, con su cuerda enrollada.
  g.save();
  g.translate(carrete.x, carrete.y);
  g.rotate(reloj * (largo > largoMax * 0.99 ? 0 : 2));
  g.fillStyle = "#8a5a3a";
  g.beginPath(); g.arc(0, 0, 13 * escala, 0, TAU); g.fill();
  g.fillStyle = "#f3ece2";
  g.beginPath(); g.arc(0, 0, 9 * escala, 0, TAU); g.fill();
  g.strokeStyle = "rgba(160,120,90,.6)";
  g.lineWidth = 0.8;
  for (let k = 0; k < 4; k++) { g.beginPath(); g.arc(0, 0, 4 * escala + k * 1.3, 0, TAU); g.stroke(); }
  g.fillStyle = "#5a3a22";
  g.beginPath(); g.arc(0, 0, 2.6 * escala, 0, TAU); g.fill();
  g.restore();

  // Semillas y pétalos que van con el viento.
  if (Math.random() < dt * (1.5 + viento * 2)) semillas.push({ x: -10, y: azar(H * 0.15, suelo), vx: 0, vy: 0, vida: 1, tipo: Math.random() < 0.6 ? "semilla" : "petalo", giro: Math.random() * TAU });
  for (let i = semillas.length - 1; i >= 0; i--) {
    const s = semillas[i];
    s.vx += (60 * viento + vientoX - s.vx) * dt * 0.8;
    s.vy += (Math.sin(reloj * 2 + s.giro) * 20 - s.vy) * dt * 0.8;
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.giro += dt * 2;
    s.vida -= dt * 0.08;
    if (s.x > A + 20 || s.vida <= 0) { semillas.splice(i, 1); continue; }
    g.globalAlpha = Math.min(1, s.vida * 2) * 0.9;
    if (s.tipo === "semilla") {
      g.strokeStyle = "rgba(255,255,255,.9)"; g.lineWidth = 0.7;
      for (let k = 0; k < 6; k++) {
        const a = k / 6 * TAU + s.giro;
        g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x + Math.cos(a) * 4, s.y + Math.sin(a) * 4); g.stroke();
      }
    } else {
      g.fillStyle = "#ffb8c8";
      g.beginPath(); g.ellipse(s.x, s.y, 3.4, 1.8 * Math.abs(Math.sin(s.giro)) + 0.4, s.giro, 0, TAU); g.fill();
    }
  }
  g.globalAlpha = 1;
  if (semillas.length > 120) semillas.splice(0, semillas.length - 120);
}

function medir() {
  const r = mundo.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const primera = !A;
  A = r.width; H = r.height;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  lienzo.width = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  escala = clamp(Math.min(A, H) / 390, 0.8, 1.5);
  const segB = parseFloat(getComputedStyle(mundo).getPropertyValue("--seguro-abajo")) || 0;
  suelo = H - Math.max(90, H * 0.16) - segB;
  pintarFondo();
  sembrar();
  carrete.x = A * 0.5; carrete.y = suelo + H * 0.06;
  // La cometa no sube por encima del título: ahí se lee.
  const cab = document.querySelector(".ct-cabeza").getBoundingClientRect();
  techo = cab.bottom - r.top + clamp(Math.min(A, H) * 0.11, 30, 60) * 1.05;
  armar();
}
new ResizeObserver(() => requestAnimationFrame(medir)).observe(mundo);
medir();
requestAnimationFrame(paso);
})();
</script>
</body>
