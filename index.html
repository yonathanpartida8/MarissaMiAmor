<!-- Capa WebGL persistente: atmósfera, partículas y escenas 3D -->
<canvas id="gl" aria-hidden="true"></canvas>

<!-- Grano de película + viñeta (CSS, muy barato) -->

    <p class="boot__status">preparando los recuerdos…</p>
  </div>

    <p class="boot__noscript">Este librito necesita JavaScript activado para abrirse. 🤍</p>
