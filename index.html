<!-- INSTALABLE.

     El manifiesto y el icono de aquí son el respaldo: valen si el libro se
     abre sin JavaScript de por medio o si algo falla al arrancar. En cuanto
     arranca, `src/core/Instalable.js` los sustituye por los de verdad, con
     la imagen que haya en la carpeta `icono/` —la que sea, del tamaño que
     sea— recortada a lo que pide cada sistema.

     `mobile-web-app-capable` y su gemelo de Apple, que ya están arriba, son
     lo que hace que instalado se abra a pantalla completa y sin barras. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono/icono.png">
<link rel="apple-touch-icon" href="icono/icono.png">

<!-- LAS LETRAS NO PUEDEN RETRASAR EL LIBRO.

     Una hoja de estilo normal bloquea el pintado Y el `DOMContentLoaded`, y
     el libro entero arranca desde un módulo, que se ejecuta después de eso.
     Resultado: mientras Google tardara en contestar, no había libro. Medido
     con la petición atascada, el botón de entrar tardaba TRECE SEGUNDOS en
     aparecer, con la pantalla de carga quieta. En una conexión mala, en un
     avión o en una red donde fonts.googleapis.com no responda, eso es
     exactamente lo que le pasaría a ella.

     Con `media="print"` el navegador la descarga pero no espera por ella, y
     al llegar se pone en su sitio. El libro se abre con las letras del
     teléfono y se recompone solo cuando llegan las buenas —para eso está
     `display=swap` en la propia petición—. Si tardan mucho o no llegan, el
     libro se lee igual: las alternativas de `tokens.css` están elegidas
     para parecerse. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Caveat:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
<noscript>

        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Caveat:wght@400;500;600&family=Jost:wght@300;400;500&display=swap">
