/* ---- Los canales de ambiente ------------------------------------------
   Un canal por ambiente, con su ganancia propia. Encender y apagar es
   mover esa ganancia con una rampa, nunca de golpe.                   */

async function abrirCanal(id) {
  if (!despertarAudio()) return null;
  if (audio.canales.has(id)) return audio.canales.get(id);

  const conf = CONF.ambientes.find((a) => a.id === id);
  const gain = audio.ctx.createGain();
  gain.gain.value = 0;
  gain.connect(audio.maestro);

  const canal = { gain, fuente: null, vol: conf ? conf.vol : 0.5, on: false, sintetico: false };
  audio.canales.set(id, canal);

  /* Primero el archivo. Si está, manda. */
  const ruta = CONF.rutas.ambientes[id];
  const buf = ruta ? await traerBuffer(ruta) : null;

  if (buf) {
    const src = audio.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(gain);
    src.start();
    canal.fuente = src;
  } else if (sintetizar[id]) {
    /* Y si no, el gemelo. */
    const nodo = sintetizar[id]();
    nodo.connect(gain);
    canal.fuente = nodo;
    canal.sintetico = true;
  }
  return canal;
}

/** Enciende o apaga un ambiente, siempre con fundido. */
async function ambiente(id, encendido, vol) {
  const canal = await abrirCanal(id);
  if (!canal) return;
  canal.on = encendido;
  if (vol !== undefined) canal.vol = clamp01(vol);
  const destino = encendido ? canal.vol : 0;
  const t = audio.ctx.currentTime;
  canal.gain.gain.cancelScheduledValues(t);
  canal.gain.gain.setValueAtTime(canal.gain.gain.value, t);
  canal.gain.gain.linearRampToValueAtTime(destino, t + CONF.fundidoAudio);
}

/** Cambia el volumen de un ambiente que ya está sonando. */
function volumen(id, vol) {
  const canal = audio.canales.get(id);
  if (!canal) return;
  canal.vol = clamp01(vol);
  /* ---- El volumen es SÓLO volumen ----
     Antes, subirle el sonido a la lluvia hacía llover más: el mismo
     número era el volumen y la intensidad. Sonaba bonito de explicar y
     en la mano era un fastidio: bajar el ruido del agua porque molesta
     dejaba de mojar, y no hay manera de tener lluvia fuerte y callada.

     Ahora la piedra encendida dice SI llueve y cuánto; la barra dice
     cuánto se oye. Dos cosas, dos mandos. */
  if (!canal.on) return;
  const t = audio.ctx.currentTime;
  canal.gain.gain.cancelScheduledValues(t);
  canal.gain.gain.setValueAtTime(canal.gain.gain.value, t);
  canal.gain.gain.linearRampToValueAtTime(canal.vol, t + 0.22);
}

/** Baja todos los ambientes a la vez (para las cinemáticas). */
function agacharAmbientes(k, seg = 0.8) {
  for (const [, canal] of audio.canales) {
    if (!canal.on) continue;
    const t = audio.ctx.currentTime;
    canal.gain.gain.cancelScheduledValues(t);
    canal.gain.gain.setValueAtTime(canal.gain.gain.value, t);
    canal.gain.gain.linearRampToValueAtTime(canal.vol * k, t + seg);
  }
}

/* ---- Sonidos sueltos ---------------------------------------------------- */

/**
 * Toca un archivo una vez y AVISA CUANDO TERMINA DE VERDAD.
 *
 * Esto es lo que necesita la cinemática de la cabaña: los sonidos van
 * uno detrás de otro respetando su duración real, sin cortar ninguno.
 * Por eso se resuelve con `onended` y no con un temporizador a ojo.
 *
 * Si el archivo no está, suena el gemelo que se le pase y la promesa se
 * resuelve con su duración.
 *
 * @returns {Promise<void>}
 */
async function tocarUnaVez(ruta, gemelo, vol = 1) {
  if (!despertarAudio()) { if (gemelo) return gemelo(); return; }
  const buf = await traerBuffer(ruta);
  if (!buf) return gemelo ? gemelo() : undefined;

  return new Promise((resolver) => {
    const src = audio.ctx.createBufferSource();
    src.buffer = buf;
    const g = audio.ctx.createGain();
    g.gain.value = vol;
    src.connect(g).connect(audio.maestro);
    src.onended = () => resolver();
    src.start();
    /* Red de seguridad: si `onended` no llega (pasa en algún navegador
       si se suspende el contexto), se sigue adelante igual. */
    setTimeout(resolver, (buf.duration + 0.6) * 1000);
  });
}

/** Un tono corto, para los toques. */
function tono(hz, dur = 0.5, tipo = "sine", vol = 0.09, cuando = 0) {
  if (!despertarAudio()) return;
  const t = audio.ctx.currentTime + cuando;
  const o = audio.ctx.createOscillator();
  const g = audio.ctx.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(hz, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.maestro);
  o.start(t); o.stop(t + dur + 0.05);
}

/** Un golpe de ruido, para los pasos, las puertas y los chasquidos. */
function golpe(dur = 0.12, hzFiltro = 1200, vol = 0.2, tipoFiltro = "bandpass") {
  if (!despertarAudio()) return;
  const c = audio.ctx;
  const t = c.currentTime;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = c.createBufferSource();
  src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = tipoFiltro;
  f.frequency.value = hzFiltro;
  const g = c.createGain();
  g.gain.value = vol;
  src.connect(f).connect(g).connect(audio.maestro);
  src.start(t);
}

/** Una campanita mágica: tres tonos que suben, muy filtrados. */
function magia(base = 660) {
  [0, 4, 7, 12].forEach((s, i) => {
    tono(base * Math.pow(2, s / 12), 1.4 - i * 0.12, "sine", 0.06, i * 0.09);
  });
}

/* Los gemelos de los sonidos de la cabaña. Cada uno devuelve una
   promesa que dura lo que dura el sonido, igual que el archivo. */
const gemelosCabana = {
  async puertaAbre() {
    /* Una puerta que se abre: el chirrido de la bisagra y el pomo. */
    golpe(0.06, 2600, 0.16, "highpass");
    await esperar(120);
    if (despertarAudio()) {
      const c = audio.ctx, t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
      f.type = "bandpass"; f.frequency.value = 900; f.Q.value = 4;
      o.type = "sawtooth";
      o.frequency.setValueAtTime(180, t);
      o.frequency.linearRampToValueAtTime(96, t + 0.9);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.05, t + 0.15);
      g.gain.linearRampToValueAtTime(0, t + 1.0);
      o.connect(f).connect(g).connect(audio.maestro);
      o.start(t); o.stop(t + 1.1);
    }
    await esperar(1000);
  },
  async puertaCierra() {
    await esperar(160);
    golpe(0.2, 220, 0.34, "lowpass");
    golpe(0.05, 3000, 0.1, "highpass");
    await esperar(700);
  },
  async escaleras() {
    /* Seis peldaños de madera, cada uno un poco distinto. */
    for (let i = 0; i < 6; i++) {
      golpe(0.1, azar(200, 420), azar(0.16, 0.26), "lowpass");
      golpe(0.04, azar(1800, 3200), 0.05, "highpass");
      await esperar(azar(390, 520));
    }
  },
  async cuarto() {
    /* El silencio de una habitación no es silencio: es un zumbido
       gravísimo y una madera que cruje. */
    tono(58, 2.4, "sine", 0.05);
    await esperar(900);
    golpe(0.18, 300, 0.08, "lowpass");
    await esperar(1300);
  },
  async cama() {
    /* Sábanas: ruido agudo con una envolvente de seno, no de golpe. */
    if (despertarAudio()) {
      const c = audio.ctx, t = c.currentTime;
      const n = Math.floor(c.sampleRate * 1.3);
      const buf = c.createBuffer(1, n, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) {
        const k = i / n;
        d[i] = (Math.random() * 2 - 1) * Math.sin(k * Math.PI) * (0.35 + 0.65 * Math.random());
      }
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1600;
      const g = c.createGain(); g.gain.value = 0.13;
      src.connect(f).connect(g).connect(audio.maestro);
      src.start(t);
    }
    await esperar(1500);
    tono(96, 1.6, "sine", 0.05);
    await esperar(900);
  },
};

// ==========================================
// CLIMA — LLUVIA, TORMENTA Y NIEBLA
// ==========================================
//
// ── POR QUÉ ES UN MÓDULO Y NO UN EFECTO SUELTO ───────────────────────
// Porque el tiempo que hace lo cambia TODO: el color del bosque, la
// niebla, cuánto ilumina la fogata, si la fogata sigue viva siquiera, y
// cada cuánto cae un rayo. Si cada cosa mirara por su cuenta si llueve,
// acabarían desincronizadas.
//
// Así que hay un solo estado —`clima`— del que se lee en todas partes.
//
// ── LA LLUVIA APAGA LA FOGATA ────────────────────────────────────────
// No de golpe. La lluvia le va quitando vida al fuego cada segundo, y
// el fuego responde con lo que ya sabe hacer: menos llama, menos luz,
// menos chispas y más humo, porque el humo sale de la leña mojada. Al
// final sólo quedan las brasas, y luego ni eso.
//
// Cuando escampa, revive solo. Más despacio de lo que se apagó, que es
// como pasa de verdad.
//
// ── EL RAYO Y EL TRUENO ──────────────────────────────────────────────
// Van separados, como en el mundo: primero el destello, después el
// trueno, y el retraso depende de la distancia. Un rayo cerca da un
// fogonazo blanco y un golpe seco; uno lejos apenas ilumina las nubes y
// llega como un rumor cinco segundos después.

const clima = {
  /* 0 seco · 1 diluvio. Lo mueve el ambiente de lluvia del panel. */
  lluvia: 0,
  lluviaObj: 0,
  /* Igual con la tormenta. */
  tormenta: 0,
  tormentaObj: 0,
  /* El viento: un valor que se mueve solo y que empuja el humo, las
     llamas, las hojas y la lluvia. Todo lee de aquí. */
  viento: 0,
  /* El destello del relámpago, 0..1, y de qué lado viene. */
  destello: 0,
  destelloX: 0.5,
  pulsos: 0,
  relojRayo: azar(4, 10),
  /* Cuánto lleva arreciando, de 0 a 1. Sube sola con la tormenta
     puesta y baja al quitarla. */
  crece: 0,
  /* Los truenos pendientes: {cuando, distancia}. */
  truenos: [],
  /* La niebla, que sube cuando llueve. */
  brumaBandas: [],
};

function construirBruma() {
  clima.brumaBandas = [];
  for (let i = 0; i < CONF.niebla.bandas; i++) {
    const t = i / Math.max(1, CONF.niebla.bandas - 1);
    clima.brumaBandas.push({
      /* De la línea del horizonte hacia abajo: las de arriba más
         delgadas y más lejos, las de abajo más gordas. */
      y: mez(sitio.horizonte - U * 2, sitio.suelo + U * 3, t),
      alto: U * mez(5, 13, t),
      v: azar(0.004, 0.016) * (rnd() < 0.5 ? -1 : 1),
      x: rnd(),
      op: mez(0.5, 1, t),
      f: rnd() * 6.283,
    });
  }
}

/** Dispara un relámpago a una distancia dada (en segundos de retraso). */
function lanzarRayo(segundos) {
  /* Conforme arrecia, los rayos caen más cerca: se acorta el tramo
     largo de la distancia y el trueno llega antes. */
  const [d0, d1] = CONF.tormenta.distancia;
  const d = segundos ?? azar(d0, mez(d1, d0 + (d1 - d0) * 0.4, clima.crece || 0));
  /* Lo cerca que está decide lo fuerte que se ve. Uno a siete segundos
     apenas es un parpadeo en las nubes; uno a uno te ciega. */
  const cerca = clamp01(1 - (d - CONF.tormenta.distancia[0]) /
    (CONF.tormenta.distancia[1] - CONF.tormenta.distancia[0]));
  clima.destello = 0.25 + cerca * 0.75;
  clima.destello *= mez(0.85, 1.1, clima.crece || 0);
  clima.destelloX = azar(0.1, 0.9);
  clima.pulsos = Math.round(azar(CONF.tormenta.pulsos[0], CONF.tormenta.pulsos[1]));
  /* El trueno se apunta para más tarde. Ésa es toda la magia. */
  clima.truenos.push({ cuando: reloj + d, cerca });
  if (cerca > 0.62) sacudir(cerca * 0.5);
}

function moverClima(dt) {
  /* ---- El viento ----
     Tres senos con frecuencias que no encajan: rachas que no se repiten.
     Es el mismo truco que el fuego, y por eso los dos se mueven juntos
     sin estar sincronizados. */
  clima.viento =
    Math.sin(reloj * 0.17) * 0.55 +
    Math.sin(reloj * 0.43 + 1.3) * 0.3 +
    Math.sin(reloj * 0.91 + 2.6) * 0.15;
  /* Con lluvia y tormenta hace más aire. */
  clima.viento *= 1 + clima.lluvia * 0.8 + clima.tormenta * 0.5;

  clima.lluvia = damp(clima.lluvia, clima.lluviaObj, 1 / CONF.lluvia.sube * 6, dt);
  clima.tormenta = damp(clima.tormenta, clima.tormentaObj, 0.35, dt);
  /* Y al quitarla, amaina: la cuenta de cuánto lleva arreciando se va
     deshaciendo, así que volver a ponerla empieza otra vez suave. */
  if (clima.tormentaObj < 0.1) clima.crece = Math.max(0, clima.crece - dt * 0.06);

  /* ---- Los rayos ---- */
  if (clima.tormenta > 0.08) {
    /* ---- CUÁNDO CAE EL SIGUIENTE ----
       El reloj corre a la velocidad de la tormenta, así que una
       tormenta floja da un rayo cada mucho y una fuerte, cada poco.
       Eso ya estaba.

       Lo que faltaba es que la tormenta ARRECIE. `clima.crece` sube
       despacio mientras la tormenta está puesta y baja al quitarla, y
       lo que hace es dos cosas: acortar el hueco entre rayos y acercar
       los truenos. Así una tormenta que lleva un rato encima es peor
       que la que acaba de empezar, que es lo que hacen las tormentas.

       El hueco no es un número fijo con azar encima: es un azar entre
       dos límites que se mueven los dos. Con hueco fijo, los rayos caen
       a compás y se oye el metrónomo.                                */
    clima.crece = clamp01(clima.crece + dt * 0.012 * clima.tormenta);
    clima.relojRayo -= dt * clima.tormenta * mez(1, 1.9, clima.crece);
    if (clima.relojRayo <= 0) {
      const [a1, a2] = CONF.tormenta.cada;
      clima.relojRayo = azar(mez(a1, a1 * 0.4, clima.crece),
                             mez(a2, a2 * 0.45, clima.crece));
      /* Y de vez en cuando, dos seguidos: una tormenta de verdad no
         reparte los rayos uno a uno. */
      lanzarRayo();
      if (Math.random() < 0.18 + clima.crece * 0.22) {
        setTimeout(() => { if (clima.tormenta > 0.2) lanzarRayo(); }, azar(400, 1100));
      }
    }
  }
  /* El destello parpadea un par de veces y se va: un relámpago no es un
     fogonazo plano, son dos o tres golpes seguidos. */
  if (clima.destello > 0.001) {
    clima.destello -= dt * (clima.pulsos > 0 ? 9 : 3.4);
    if (clima.destello <= 0.06 && clima.pulsos > 0) {
      clima.pulsos--;
      if (clima.pulsos > 0) clima.destello = azar(0.3, 0.85);
    }
    clima.destello = Math.max(0, clima.destello);
  }

  /* ---- Los truenos que tocan ---- */
  for (let i = clima.truenos.length - 1; i >= 0; i--) {
    if (reloj < clima.truenos[i].cuando) continue;
    const t = clima.truenos.splice(i, 1)[0];
    const fuerza = 0.3 + t.cerca * 0.7;
    /* Primero tus truenos, si los has dejado en `audio/`. Uno de la
       lista, nunca el mismo dos veces seguidas: con un solo archivo la
       tormenta se convierte en el mismo ruido cada veinte segundos y
       eso se oye a la segunda vez. */
    sonarDeLista("trueno", CONF.rutas.sueltos.truenos, fuerza * 0.9).then((ok) => {
      if (!ok && audio.ctx) truenoSintetizado(audio.maestro, fuerza);
    });
    if (t.cerca > 0.7) sacudir(t.cerca * 0.35);
  }

  /* ---- La lluvia apaga la fogata ----
     Las dos cifras son POR SEGUNDO, y esto importa más de lo que
     parece: con la resta multiplicada por `dt * 60` —o sea, por
     fotograma— la fogata pasaba de entera a apagada en segundo y medio
     y no se veía ni uno de los seis escalones. Apagarse tiene que
     durar lo bastante para poder mirarlo.

     Y revivir tarda el triple que apagarse, que es lo que pasa de
     verdad: mojar es instantáneo y secar no. */
  if (clima.lluvia > 0.06 && escena === "bosque") {
    fuego.vidaObj = Math.max(0, fuego.vidaObj - CONF.lluvia.apagaFuego * clima.lluvia * dt);
    fuego.mojado = clima.lluvia;
  } else {
    fuego.mojado = damp(fuego.mojado || 0, 0, 0.6, dt);
    /* Cuando escampa, revive. Y linealmente, no con una exponencial:
       una exponencial arranca deprisa y luego no acaba nunca, y lo que
       se quiere es justo lo contrario. */
    if (fuego.vidaObj < 1) {
      fuego.vidaObj = Math.min(1, fuego.vidaObj + CONF.lluvia.revive * dt);
    }
  }

  moverGotas(dt);
}

/* ---- Las gotas, en tres planos ------------------------------------------
   Lejos: finas, lentas y casi transparentes. Cerca: gordas, rápidas y
   con salpicadura al llegar al suelo. Sin los tres planos la lluvia se
   ve como una cortina plana pegada a la pantalla.                      */

const LLUVIA_PLANOS = 3;
let gotaX = null, gotaY, gotaV, gotaL, gotaP;
let nGotas = 0;

function construirLluvia() {
  const c = CONF.lluvia;
  nGotas = flojo
    ? Math.round((c.gotasCerca + c.gotasMedio + c.gotasLejos) * 0.42)
    : c.gotasCerca + c.gotasMedio + c.gotasLejos;
  gotaX = new Float32Array(nGotas);
  gotaY = new Float32Array(nGotas);
  gotaV = new Float32Array(nGotas);
  gotaL = new Float32Array(nGotas);
  gotaP = new Int8Array(nGotas);
  for (let i = 0; i < nGotas; i++) {
    /* El plano se reparte por tercios. */
    const p = Math.floor((i / nGotas) * LLUVIA_PLANOS);
    gotaP[i] = p;
    gotaX[i] = azar(-A * 0.2, A * 1.2);
    gotaY[i] = azar(-H, H);
    gotaV[i] = azar(420, 720) * (0.45 + p * 0.38);
    gotaL[i] = azar(6, 14) * (0.5 + p * 0.5);
  }
}

const salpicaduras = [];

function moverGotas(dt) {
  if (!gotaX || clima.lluvia < 0.01) return;
  const empuje = clima.viento * 90;
  /* Cuántas gotas están vivas ahora mismo: con poca lluvia caen pocas,
     y así la intensidad se nota de verdad en vez de ser sólo opacidad. */
  const vivas = Math.round(nGotas * clima.lluvia);
  for (let i = 0; i < vivas; i++) {
    gotaY[i] += gotaV[i] * dt;
    gotaX[i] += empuje * (0.4 + gotaP[i] * 0.4) * dt;
    if (gotaY[i] > H) {
      /* Salpicadura, sólo las del plano de delante: las de lejos no se
         verían y costarían lo mismo. */
      if (gotaP[i] === LLUVIA_PLANOS - 1 && salpicaduras.length < 40) {
        salpicaduras.push({ x: gotaX[i], y: H - azar(0, U * 6), t: 0, r: azar(U * 0.8, U * 2) });
      }
      gotaY[i] = azar(-H * 0.4, -10);
      gotaX[i] = azar(-A * 0.2, A * 1.2);
    }
    if (gotaX[i] > A * 1.25) gotaX[i] = -A * 0.2;
    if (gotaX[i] < -A * 0.25) gotaX[i] = A * 1.2;
  }
  for (let i = salpicaduras.length - 1; i >= 0; i--) {
    salpicaduras[i].t += dt * 3.4;
    if (salpicaduras[i].t >= 1) salpicaduras.splice(i, 1);
  }
}

function dibujarLluvia() {
  if (!gotaX || clima.lluvia < 0.01) return;
  const vivas = Math.round(nGotas * clima.lluvia);
  const empuje = clima.viento * 0.16;
  ctx.lineCap = "round";
  for (let p = 0; p < LLUVIA_PLANOS; p++) {
    /* Un trazo por plano: cambiar de color y de grosor una vez cada
       plano en vez de una vez por gota. */
    const a = (0.12 + p * 0.13) * clamp01(clima.lluvia * 1.4);
    ctx.strokeStyle = `rgba(176,206,240,${a})`;
    ctx.lineWidth = 0.7 + p * 0.7;
    ctx.beginPath();
    for (let i = 0; i < vivas; i++) {
      if (gotaP[i] !== p) continue;
      const l = gotaL[i];
      ctx.moveTo(gotaX[i], gotaY[i]);
      ctx.lineTo(gotaX[i] - l * empuje, gotaY[i] - l);
    }
    ctx.stroke();
  }
  /* Las salpicaduras: un arito que se abre y se apaga. */
  for (const s of salpicaduras) {
    ctx.strokeStyle = `rgba(190,215,245,${(1 - s.t) * 0.34})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.r * (0.4 + s.t * 1.6), s.r * (0.2 + s.t * 0.6), 0, 0, 6.283);
    ctx.stroke();
  }
}

/** La bruma entre los árboles. Va por capas y se mueve muy despacio. */
function dibujarBruma(desde, hasta) {
  const fuerza = CONF.niebla.base + clima.lluvia * (CONF.niebla.conLluvia - CONF.niebla.base);
  for (const b of clima.brumaBandas) {
    if (b.y < desde || b.y > hasta) continue;
    b.x += b.v * 0.02;
    if (b.x > 1.4) b.x = -0.4;
    if (b.x < -0.4) b.x = 1.4;
    const y = b.y + Math.sin(reloj * 0.24 + b.f) * U * 0.8;
    const g = ctx.createLinearGradient(0, y - b.alto, 0, y + b.alto);
    /* Fría con lluvia, algo cálida sin ella: la niebla coge el color de
       lo que la ilumina, y de noche eso es la luna. */
    const r0 = Math.round(mez(120, 96, clima.lluvia));
    const g0 = Math.round(mez(132, 112, clima.lluvia));
    const b0 = Math.round(mez(158, 150, clima.lluvia));
    g.addColorStop(0, `rgba(${r0},${g0},${b0},0)`);
    g.addColorStop(0.5, `rgba(${r0},${g0},${b0},${0.16 * fuerza * b.op})`);
    g.addColorStop(1, `rgba(${r0},${g0},${b0},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(-20, y - b.alto, A + 40, b.alto * 2);
  }
}

// ==========================================
// SISTEMA DE PARTÍCULAS
// ==========================================
//
// Un solo grupo para todo: chispas, humo, polvo, brillos, lluvia y
// destellos. Está en arrays planos de `Float32Array` con un cursor que
// busca hueco, así que mientras la escena corre NO se crea ni se tira ni
// un objeto. Eso es lo que evita que el recolector de basura salte justo
// en mitad de una animación, que es el tirón que se nota en los móviles.

const TIPO = { CHISPA: 0, HUMO: 1, BRILLO: 2, POLVO: 3, GOTA: 4, CENIZA: 5, HOJA: 6 };

/**
 * El sprite del humo: una bola difuminada, dibujada UNA VEZ.
 *
 * El primer intento pintaba cada voluta con `arc()` y relleno plano, y
 * lo que se veía eran círculos duros flotando, no humo. La solución
 * obvia —un degradado radial por partícula— arregla el aspecto y crea
 * un objeto de gradiente por voluta y por fotograma: con treinta
 * volutas vivas son mil ochocientos gradientes por segundo.
 *
 * Así que se dibuja una sola bola difuminada en un lienzo aparte al
 * arrancar, y cada voluta es un `drawImage` de esa bola, estirado al
 * tamaño que toque. Sale suave Y sale barato.
 */
function crearBolaHumo(r, g2, b) {
  const S = 128;
  const cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const c = cv.getContext("2d");
  const g = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  /* La curva importa: si cae recta se ve el canto del círculo. Con el
     tramo largo a media opacidad y el final muy largo, se deshace. */
  g.addColorStop(0.00, `rgba(${r},${g2},${b},0.55)`);
  g.addColorStop(0.35, `rgba(${r},${g2},${b},0.30)`);
  g.addColorStop(0.70, `rgba(${r},${g2},${b},0.09)`);
  g.addColorStop(1.00, `rgba(${r},${g2},${b},0)`);
  c.fillStyle = g;
  c.fillRect(0, 0, S, S);
  return cv;
}

/* Tres, ya teñidas: la clara para la fogata, la gris para la chimenea
   de la cabaña y una casi blanca para el VAPOR, que es lo que sale de
   la leña mojada cuando llueve —y que no es humo: el humo tapa y el
   vapor brilla—. Teñir en el momento no vale —`source-atop` pinta sobre
   el lienzo entero, no sobre el sprite—, y tres canvas de 128 px son
   cuarenta y cinco kilobytes de memoria en total. */
const bolaHumoClara = crearBolaHumo(150, 148, 158);
const bolaHumoOscura = crearBolaHumo(74, 72, 82);
const bolaVapor = crearBolaHumo(212, 222, 234);

let P = CONF.perf.particulas;
let px, py, pvx, pvy, pvida, pmax, ptam, ptipo, pgiro, pgiroV, pton;
let cursorP = 0;

function crearParticulas(n) {
  P = n;
  px = new Float32Array(P); py = new Float32Array(P);
  pvx = new Float32Array(P); pvy = new Float32Array(P);
  pvida = new Float32Array(P); pmax = new Float32Array(P);
  ptam = new Float32Array(P); ptipo = new Int16Array(P);
  pgiro = new Float32Array(P); pgiroV = new Float32Array(P);
  pton = new Float32Array(P);
  cursorP = 0;
}
crearParticulas(P);

/**
 * Suelta una partícula. Si no hay hueco, no pasa nada: se pierde.
 *
 * Perder una chispa es invisible; pararse a hacer sitio, no. Por eso
 * esto nunca crece el grupo ni expulsa a nadie.
 */
function soltar(x, y, op) {
  let k = -1;
  for (let j = 0; j < P; j++) {
    const c = (cursorP + j) % P;
    if (pvida[c] <= 0) { k = c; cursorP = (c + 1) % P; break; }
  }
  if (k < 0) return;
  px[k] = x; py[k] = y;
  pvx[k] = op.vx || 0; pvy[k] = op.vy || 0;
  pmax[k] = pvida[k] = op.vida || 1;
  ptam[k] = op.tam || 2;
  ptipo[k] = op.tipo || 0;
  pgiro[k] = op.giro || 0;
  pgiroV[k] = op.giroV || 0;
  pton[k] = op.tono === undefined ? Math.random() : op.tono;
}

/** Mata todas las partículas de golpe.
 *
 *  Se llama en CADA cambio de escena, sin excepciones. El humo de la
 *  fogata mide treinta o cuarenta píxeles y vive varios segundos, así
 *  que si no se limpia aparece flotando en mitad de la pared del
 *  cuarto como una mancha gris que nadie sabe de dónde salió. Costó
 *  encontrarla justamente porque no se movía: al no haber viento
 *  dentro, el humo se quedaba clavado ahí. */
function limpiarParticulas() {
  for (let i = 0; i < P; i++) pvida[i] = 0;
}

function moverParticulas(dt) {
  const viento = Math.sin(reloj * 0.31) * 8 + Math.sin(reloj * 0.87) * 4;
  for (let i = 0; i < P; i++) {
    if (pvida[i] <= 0) continue;
    pvida[i] -= dt;
    if (pvida[i] <= 0) continue;

    const t = ptipo[i];
    if (t === TIPO.CHISPA) {
      /* Las chispas suben, pierden fuerza y al final caen: eso es lo
         que hace que una chispa parezca una brasa y no un punto. */
      pvy[i] += 34 * dt;
      pvx[i] += viento * 0.35 * dt;
      pvx[i] *= Math.exp(-1.1 * dt);
    } else if (t === TIPO.HUMO) {
      /* El humo sube cada vez más despacio y se va abriendo. */
      pvy[i] *= Math.exp(-0.55 * dt);
      pvx[i] += viento * 0.9 * dt;
      ptam[i] += 16 * dt;
    } else if (t === TIPO.GOTA) {
      pvy[i] += 340 * dt;
    } else if (t === TIPO.CENIZA) {
      pvy[i] += 10 * dt;
      pvx[i] += (viento * 1.2 + Math.sin(reloj * 2 + i) * 9) * dt;
      pvx[i] *= Math.exp(-0.8 * dt);
    } else if (t === TIPO.HOJA) {
      pvy[i] += 22 * dt;
      pvx[i] += Math.sin(reloj * 1.7 + i) * 26 * dt;
      pvx[i] *= Math.exp(-0.9 * dt);
    } else {
      /* Brillos y polvo: flotan y poco más. */
      pvx[i] += Math.sin(reloj * 0.9 + i) * 5 * dt;
      pvy[i] *= Math.exp(-0.35 * dt);
    }

    px[i] += pvx[i] * dt;
    py[i] += pvy[i] * dt;
    pgiro[i] += pgiroV[i] * dt;

    if (py[i] > H + 40 || px[i] < -60 || px[i] > A + 60) pvida[i] = 0;
  }
}

function dibujarParticulas() {
  /* Dos pasadas: primero lo que se suma a la luz (chispas y brillos) y
     luego lo que tapa (humo). Mezclarlas obligaría a cambiar el modo de
     composición decenas de veces por cuadro, que es de lo más caro que
     hay en un lienzo. */
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < P; i++) {
    if (pvida[i] <= 0) continue;
    const t = ptipo[i];
    if (t === TIPO.HUMO || t === TIPO.GOTA || t === TIPO.HOJA) continue;
    const k = pvida[i] / pmax[i];

    if (t === TIPO.CHISPA) {
      /* Una chispa se apaga pasando de amarillo a rojo. */
      const r = 255;
      const g = Math.round(mez(90, 220, k));
      const b = Math.round(mez(20, 120, k * k));
      const a = k * 0.95;
      ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
      const s = ptam[i] * (0.4 + k * 0.6);
      ctx.beginPath();
      ctx.arc(px[i], py[i], s, 0, 6.283);
      ctx.fill();
      /* Y deja una estela: la chispa va rápida y el ojo la ve alargada. */
      if (s > 1.1) {
        ctx.globalAlpha = a * 0.35;
        ctx.beginPath();
        ctx.moveTo(px[i], py[i]);
        ctx.lineTo(px[i] - pvx[i] * 0.03, py[i] - pvy[i] * 0.03);
        ctx.strokeStyle = `rgba(255,${g},${b},${a})`;
        ctx.lineWidth = s * 0.8;
        ctx.lineCap = "round";
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    } else if (t === TIPO.CENIZA) {
      ctx.fillStyle = `rgba(200,120,70,${k * 0.5})`;
      ctx.beginPath();
      ctx.arc(px[i], py[i], ptam[i] * 0.6, 0, 6.283);
      ctx.fill();
    } else {
      /* Brillos y polvo: un puntito con halo. */
      const col = pton[i] < 0.33 ? "255,220,180"
                : pton[i] < 0.66 ? "190,220,255"
                : "255,190,225";
      ctx.fillStyle = `rgba(${col},${k * 0.8})`;
      ctx.beginPath();
      ctx.arc(px[i], py[i], ptam[i] * (0.5 + k * 0.5), 0, 6.283);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = "source-over";

  /* El humo, la lluvia y las hojas, por encima y sin sumar luz. */
  for (let i = 0; i < P; i++) {
    if (pvida[i] <= 0) continue;
    const t = ptipo[i];
    const k = pvida[i] / pmax[i];
    if (t === TIPO.HUMO) {
      /* El humo entra, se queda y se va: si sólo se desvanece, parece
         que se evapora de golpe nada más salir. */
      /* `0.24` y no `0.34`: las bocanadas se solapan, así que la
         opacidad se suma, y una columna de humo espesa por delante de
         la cabaña le borraba media fachada. El humo tiene que verse,
         no tapar. */
      const a = Math.sin(clamp01(1 - k) * Math.PI) * 0.24;
      if (a < 0.004) continue;
      const s = ptam[i] * 2;
      /* `pton` elige el sprite: bajo es humo claro (la fogata), medio
         es humo gris (la chimenea, el bombón quemado) y alto es vapor,
         que además se ve MÁS que el humo porque es agua con luz dentro,
         no hollín. */
      const esVapor = pton[i] >= 0.85;
      const sprite = esVapor ? bolaVapor
                   : pton[i] < 0.5 ? bolaHumoClara : bolaHumoOscura;
      ctx.globalAlpha = esVapor ? a * 1.2 : a;
      ctx.drawImage(sprite, px[i] - s / 2, py[i] - s / 2, s, s);
      ctx.globalAlpha = 1;
    } else if (t === TIPO.GOTA) {
      ctx.strokeStyle = `rgba(175,205,240,${k * 0.42})`;
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(px[i], py[i]);
      ctx.lineTo(px[i] - pvx[i] * 0.016, py[i] - pvy[i] * 0.016);
      ctx.stroke();
    } else if (t === TIPO.HOJA) {
      ctx.save();
      ctx.translate(px[i], py[i]);
      ctx.rotate(pgiro[i]);
      ctx.globalAlpha = k * 0.7;
      ctx.fillStyle = pton[i] < 0.5 ? "#3e6b44" : "#5c7a3e";
      ctx.beginPath();
      ctx.ellipse(0, 0, ptam[i], ptam[i] * 0.45, 0, 0, 6.283);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
}

// ==========================================
// FOGATA
// ==========================================
//
// ── CÓMO ESTÁ HECHO EL FUEGO ─────────────────────────────────────────
//
// No hay ninguna imagen ni ninguna animación grabada. Las llamas son
// LENGUAS: seis u ocho tiras que suben, se estrechan y se retuercen, y
// cada una tiene su propia fase, su propia altura y su propio ritmo.
//
// Lo que hace que no se vea repetitivo es que la altura de cada lengua
// sale de sumar tres senos con frecuencias que no son múltiplos entre
// sí (1.7, 2.9 y 4.3). Tres ondas así no vuelven a coincidir nunca, así
// que el fuego no tiene ciclo: no se repite jamás.
//
// Encima de eso:
//   · el brillo general late con el fuego y baña toda la escena;
//   · las chispas salen de la punta de las lenguas, no del centro;
//   · los troncos se mueven un pelín y se asientan de vez en cuando;
//   · hay brasas debajo que respiran a su ritmo.

const fuego = {
  vida: 1,          // 0 apagándose · 1 fuerte · >1 avivado
  vidaObj: 1,
  brillo: 1,        // lo que ilumina alrededor, suavizado
  lenguas: [],
  troncos: [],
  brasas: [],
  relojChispa: 0,
  relojHumo: 0,
  asentar: 0,       // cuando un tronco se derrumba
  /* Cuánto lleva encendida sin que nadie la toque, para el easter egg
     del fuego azul. */
  quieta: 0,
  azul: 0,

  /* ---- Lo que le hace el tiempo ----
     `mojado` es cuánta agua le está cayendo encima, 0..1.
     `inclina` es cuánto la empuja el viento, CON SU PROPIO RETRASO: el
     aire cambia de golpe y la llama tarda en enterarse. Sin ese retraso
     la llama va pegada al viento y parece una bandera, no fuego.
     `fase` es en qué punto de apagarse está, de 1 (viva) a 6 (apagada). */
  mojado: 0,
  inclina: 0,
  fase: 1,
  relojChisporroteo: 0,
  relojVapor: 0,
  /* Cuánto lleva sin decir nada sobre lo que le está pasando: sin esto
     la fogata se pone a comentar cada dos segundos cuando la lluvia la
     deja justo en el filo entre dos fases. */
  calladaDesde: 0,
};

function construirFogata() {
  const f = sitio.fogata;
  fuego.lenguas = [];
  const n = flojo ? 5 : 7;
  for (let i = 0; i < n; i++) {
    fuego.lenguas.push({
      /* Repartidas a lo ancho de la base, las de fuera más bajas. */
      x: (i / (n - 1) - 0.5) * 1.5,
      fase: rnd() * 6.283,
      vel: azar(0.9, 1.5),
      alto: azar(0.72, 1.12),
      ancho: azar(0.42, 0.72),
    });
  }
  fuego.troncos = [
    { x: -0.9, y: 0.34, a: -0.28, l: 2.1, g: 0.42 },
    { x:  0.8, y: 0.30, a:  0.34, l: 2.0, g: 0.40 },
    { x: -0.1, y: 0.44, a:  0.06, l: 2.4, g: 0.46 },
    { x:  0.3, y: 0.22, a: -0.62, l: 1.6, g: 0.34 },
  ].map((t) => ({ ...t, meneo: rnd() * 6.283 }));
  fuego.brasas = [];
  for (let i = 0; i < 9; i++) {
    fuego.brasas.push({
      x: azar(-1.1, 1.1),
      y: azar(0.24, 0.46),
      r: azar(0.1, 0.22),
      fase: rnd() * 6.283,
      vel: azar(0.6, 1.5),
    });
  }
}

/** Cuánto vale la llama en este instante, de 0 a 1 y pico. */
function alturaLlama(l, t) {
  /* Tres senos con frecuencias que no encajan entre sí: la suma no se
     repite nunca. Eso es toda la variación procedural del fuego. */
  const a = Math.sin(t * 1.7 * l.vel + l.fase);
  const b = Math.sin(t * 2.9 * l.vel + l.fase * 1.7) * 0.6;
  const c = Math.sin(t * 4.3 * l.vel + l.fase * 2.3) * 0.3;
  return clamp01(0.52 + (a + b + c) * 0.24);
}

function moverFogata(dt) {
  fuego.vida = damp(fuego.vida, fuego.vidaObj, 1.6, dt);
  /* La vuelta al reposo, SÓLO hacia abajo: es para que un soplido o un
     dedo en la llama se deshinchen solos. Hacia arriba no puede tirar,
     porque si tira mientras llueve le está devolviendo a la fogata
     justo lo que el agua le quita, y entonces no se apaga nunca. */
  if (fuego.vidaObj > 1) fuego.vidaObj = damp(fuego.vidaObj, 1, 0.22, dt);

  /* Lo que le está haciendo el tiempo, y en qué escalón de apagarse
     está por culpa de ello. */
  moverFuegoClima(dt);
  mirarFaseFuego();

  /* El brillo general: la media de las lenguas, suavizada. Es lo que
     ilumina la cabaña, los troncos y las caras de todo. */
  let media = 0;
  for (const l of fuego.lenguas) media += alturaLlama(l, reloj);
  media /= Math.max(1, fuego.lenguas.length);
  fuego.brillo = damp(fuego.brillo, media * fuego.vida, 9, dt);

  fuego.quieta += dt;
  if (fuego.azul > 0) fuego.azul = Math.min(1, fuego.azul + dt * 0.3);

  const f = sitio.fogata;
  const alto = f.r * 2.4 * fuego.vida;

  /* ---- Chispas ---- */
  fuego.relojChispa -= dt;
  /* Con la leña mojada saltan muchas menos chispas: lo que sube ya no
     es fuego suelto, es agua evaporándose. */
  if (fuego.relojChispa <= 0 && Math.random() > fuego.mojado * 0.8 && fuego.vida > 0.05) {
    fuego.relojChispa = (flojo ? 0.09 : 0.045) / clamp(fuego.vida, 0.3, 2);
    /* Salen de la PUNTA de una lengua, no del centro: una chispa nace
       donde la llama se deshace, y ahí es donde se ve bien. */
    const l = fuego.lenguas[Math.floor(Math.random() * fuego.lenguas.length)];
    const k = alturaLlama(l, reloj);
    soltar(
      f.x + l.x * f.r * 0.5 + azar(-f.r * 0.2, f.r * 0.2),
      f.y - alto * k * 0.9,
      {
        /* El viento se las lleva: una chispa pesa nada. */
        vx: azar(-26, 26) + fuego.inclina * 70,
        vy: azar(-110, -48) * clamp(fuego.vida, 0.4, 2),
        vida: azar(0.9, 2.1),
        tam: azar(1.1, 2.6),
        tipo: TIPO.CHISPA,
      }
    );
  }

  /* ---- Humo ---- */
  fuego.relojHumo -= dt;
  if (fuego.relojHumo <= 0) {
    /* La leña mojada humea el doble: el agua que se evapora arrastra
       el hollín consigo. */
    fuego.relojHumo = (flojo ? 0.34 : 0.17) / (1 + fuego.mojado * 1.2);
    soltar(f.x + azar(-f.r * 0.4, f.r * 0.4), f.y - alto * 0.85, {
      vx: azar(-8, 8) + fuego.inclina * 34,
      vy: azar(-34, -18),
      vida: azar(3.2, 5.4),
      tam: azar(f.r * 0.22, f.r * 0.42),
      tipo: TIPO.HUMO,
      /* Hasta 0.85 y no hasta 1: de 0.85 para arriba es vapor, y el
         humo de una fogata seca no es vapor. */
      tono: Math.random() * 0.84,
    });
  }

  /* ---- Un tronco se asienta de vez en cuando ---- */
  if (Math.random() < dt * 0.06 * clamp(fuego.vida, 0, 1)) {
    fuego.asentar = 1;
    golpe(0.16, azar(160, 320), 0.12, "lowpass");
    for (let i = 0; i < 14; i++) {
      soltar(f.x + azar(-f.r * 0.6, f.r * 0.6), f.y - f.r * 0.3, {
        vx: azar(-70, 70), vy: azar(-150, -60),
        vida: azar(0.7, 1.6), tam: azar(1, 2.4), tipo: TIPO.CHISPA,
      });
    }
  }
  fuego.asentar = Math.max(0, fuego.asentar - dt * 2.4);
}

/* ---- LA FOGATA CONTRA EL TIEMPO ----------------------------------------
   Apagarse no es que el número `vida` baje. Una fogata bajo la lluvia
   pasa por estados, y cada uno se ve y se oye distinto:

     1. VIVA          llamas altas, chispas, humo fino
     2. CHISPORROTEA  la primera agua toca las brasas: siseo y vapor
     3. BAJA          las llamas encogen, el humo se dobla
     4. LUCHA         se apaga y vuelve, se apaga y vuelve
     5. BRASAS        ya no hay llama: rojo debajo y mucho vapor
     6. APAGADA       leña negra y un hilo de vapor que se va

   Y al revés cuando escampa, subiendo los mismos seis escalones. Por
   eso son escalones y no una rampa: una rampa de 1 a 0 se ve como un
   `globalAlpha` bajando, y esto se tiene que ver como una fogata
   peleando.                                                          */

/* Los cinco cortes entre las seis fases. */
const ESCALONES_FUEGO = [0.74, 0.54, 0.34, 0.17, 0.045];

function mirarFaseFuego() {
  const v = fuego.vida;
  let nueva = 6;
  for (let i = 0; i < ESCALONES_FUEGO.length; i++) {
    /* El corte se mueve un pelín según de dónde venimos. Sin esta
       holgura, con la lluvia dejando el fuego justo en el filo, la
       fogata se pasaba el rato entrando y saliendo de la misma fase —y
       cada entrada sisea, suelta vapor y a veces dice algo—. */
    const margen = fuego.fase > i + 1 ? 0.05 : 0;
    if (v > ESCALONES_FUEGO[i] + margen) { nueva = i + 1; break; }
  }
  if (nueva === fuego.fase) return;
  const subiendo = nueva < fuego.fase;
  fuego.fase = nueva;
  alCambiarFase(nueva, subiendo);
}

function alCambiarFase(n, subiendo) {
  const f = sitio.fogata;

  if (subiendo) {
    /* Revivir: un chasquido de leña seca y un puñado de chispas. */
    golpe(0.1, azar(420, 900), 0.12, "bandpass");
    for (let i = 0; i < 10 + n * 2; i++) {
      soltar(f.x + azar(-f.r * 0.5, f.r * 0.5), f.y - f.r * 0.4, {
        vx: azar(-50, 50), vy: azar(-140, -50),
        vida: azar(0.6, 1.5), tam: azar(1, 2.3), tipo: TIPO.CHISPA,
      });
    }
  } else {
    /* Apagarse: siseo y una bocanada de vapor. Cuanto más abajo, más. */
    sisear(0.5 + (n - 1) * 0.12);
    vaharada(6 + n * 4);
    if (n >= 4) sacudir(0.06);
  }

  /* Y alguien lo comenta, pero no siempre: con la lluvia al filo entre
     dos fases, comentarlo cada vez convierte una fogata en un locutor. */
  const frases = CONF.fuegoLluvia[subiendo ? "sube" : "baja"][n];
  if (frases && reloj - fuego.calladaDesde > 6 && Math.random() < 0.8) {
    fuego.calladaDesde = reloj;
    decir(f.x, f.y - f.r * 4.5, frases[Math.floor(Math.random() * frases.length)],
      { dur: 4, importante: n >= 5 });
  }
}

/** Una bocanada de vapor: agua, no humo. Sale ancha y sube despacio. */
function vaharada(n) {
  const f = sitio.fogata;
  for (let i = 0; i < n; i++) {
    soltar(f.x + azar(-f.r * 0.9, f.r * 0.9), f.y - f.r * azar(0, 0.5), {
      vx: azar(-16, 16) + clima.viento * 26,
      vy: azar(-30, -12),
      vida: azar(1.8, 3.6),
      tam: azar(f.r * 0.2, f.r * 0.5),
      tipo: TIPO.HUMO,
      /* De 0.85 para arriba, el dibujo lo pinta como vapor. */
      tono: 0.9,
    });
  }
}

/**
 * El siseo: agua sobre brasa.
 *
 * Ruido blanco muy agudo con un filtro que se CIERRA mientras suena.
 * Eso es lo que distingue un siseo de una estática: la estática no va a
 * ninguna parte, y el siseo empieza arriba y se apaga hacia abajo,
 * porque la gota se acaba.
 */
function sisear(fuerza) {
  if (!despertarAudio()) return;
  const c = audio.ctx, t = c.currentTime;
  const dur = 0.12 + fuerza * 0.5;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) {
    const k = i / n;
    /* La envolvente: golpe inmediato y caída larga, como la gota. */
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 1.7);
  }
  const src = c.createBufferSource(); src.buffer = buf;
  const fl = c.createBiquadFilter();
  fl.type = "bandpass"; fl.Q.value = 0.8;
  fl.frequency.setValueAtTime(azar(4200, 6200), t);
  fl.frequency.exponentialRampToValueAtTime(azar(900, 1500), t + dur);
  const g = c.createGain();
  g.gain.value = 0.045 + fuerza * 0.07;
  src.connect(fl).connect(g).connect(audio.maestro);
  src.start(t);
}

/**
 * Lo que la lluvia y el viento le hacen a la fogata, cada fotograma.
 *
 * Va aparte de `moverFogata` a propósito: `moverFogata` es la fogata
 * consigo misma —sus lenguas, sus chispas, sus troncos— y esto es la
 * fogata contra el mundo. Mezclarlos deja un `moverFogata` donde no se
 * distingue lo que es el fuego de lo que le están haciendo.
 */
function moverFuegoClima(dt) {
  /* El viento, con retraso. */
  const empuje = clima.viento * (0.62 + clima.lluvia * 0.7);
  fuego.inclina = damp(fuego.inclina, empuje, 3.2, dt);

  const mojado = fuego.mojado;
  if (mojado > 0.04) {
    /* ---- El chisporroteo ----
       Gotas sueltas cayendo sobre la brasa. Cuantas más gotas y más
       brasa queda, más seguidos van: una fogata casi apagada ya no
       tiene con qué sisear. */
    fuego.relojChisporroteo -= dt;
    if (fuego.relojChisporroteo <= 0) {
      fuego.relojChisporroteo = azar(0.1, 0.55) / (mojado * clamp(fuego.vida, 0.15, 1.2) + 0.15);
      sisear(azar(0.15, 0.5) * mojado);
      vaharada(Math.random() < 0.55 ? 1 : 2);
    }

    /* ---- El vapor de fondo ----
       Además de las bocanadas sueltas, la leña mojada echa vapor de
       continuo mientras le quede calor. */
    fuego.relojVapor -= dt;
    if (fuego.relojVapor <= 0) {
      /* El vapor sale del CALOR que le queda, no del agua: una fogata
         apagada del todo y fría ya no echa nada. Sin este factor, la
         escena se quedaba para siempre con una nube blanca encima de
         cuatro leños negros. */
      const calor = clamp(fuego.vida + 0.12, 0.12, 1.2);
      fuego.relojVapor = (flojo ? 0.4 : 0.2) / (clamp(mojado, 0.2, 1) * calor);
      vaharada(1);
    }
  }
}

function dibujarFogata() {
  const f = sitio.fogata;
  const d = desplazar(1.6);
  const x = f.x + d.x, y = f.y + d.y;
  const alto = f.r * 2.4 * fuego.vida;

  /* ---- El halo de luz en el suelo ---- */
  const luz = fuego.brillo;
  const calor = fuego.azul > 0.1
    ? `${Math.round(mez(255, 140, fuego.azul))},${Math.round(mez(170, 210, fuego.azul))},${Math.round(mez(80, 255, fuego.azul))}`
    : "255,170,80";
  haloOvalado(x, y + f.r * 0.2, f.r * 9, f.r * 4.4, [
    [0,    `rgba(${calor},${0.30 * luz})`],
    [0.35, `rgba(${calor},${0.13 * luz})`],
    [1,    `rgba(${calor},0)`],
  ]);

  /* ---- Las brasas de debajo ----
     Cuando la llama se va, las brasas son lo ÚNICO que queda, así que
     en las fases bajas se respetan enteras en vez de apagarse con el
     resto: una fogata apagada por la lluvia no se queda negra de golpe,
     se queda roja un buen rato. */
  const vivezaBrasa = fuego.fase >= 5 ? mez(0.55, 1, clamp01(fuego.vida * 12))
                    : clamp(fuego.vida, 0.35, 1.2);
  for (const b of fuego.brasas) {
    /* Y respiran más deprisa cuando les cae agua encima. */
    const k = 0.5 + 0.5 * Math.sin(reloj * b.vel * (1 + fuego.mojado * 1.4) + b.fase);
    const bx = x + b.x * f.r, by = y + b.y * f.r * 0.4;
    /* Mojada tira a rojo oscuro; seca, a naranja. */
    const verde = Math.round(mez(mez(70, 150, k), mez(30, 70, k), fuego.mojado));
    ctx.fillStyle = `rgba(255,${verde},40,${(0.4 + k * 0.5) * vivezaBrasa})`;
    ctx.beginPath();
    ctx.ellipse(bx, by, b.r * f.r, b.r * f.r * 0.5, 0, 0, 6.283);
    ctx.fill();
  }

  /* ---- El rescoldo ----
     Cuando ya no hay llama, las brasas solas no se ven: quedan medio
     tapadas por los troncos de delante y lo único que se lee en la
     pantalla es la nube de vapor. Así que en las fases bajas se les
     pone un resplandor rojo encima, sumando luz. Es lo que hace que una
     fogata apagada siga pareciendo una fogata y no cuatro palos
     mojados. */
  if (fuego.fase >= 4 && fuego.vida > 0.004) {
    const cuanto = clamp01(fuego.vida * 5);
    ctx.globalCompositeOperation = "lighter";
    haloOvalado(x, y, f.r * 2.2, f.r * 1.1, [
      [0,    `rgba(255,120,40,${0.5 * cuanto})`],
      [0.4,  `rgba(230,60,18,${0.2 * cuanto})`],
      [1,    "rgba(180,30,10,0)"],
    ]);
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---- Los troncos, por detrás de la llama ---- */
  dibujarTroncos(x, y, f.r, -1);

  /* ---- LAS LENGUAS ----
     En la fase 5 y la 6 ya no hay: sólo brasas. Dibujarlas con un alfa
     muy bajo dejaba un resplandor naranja fantasma sobre la leña
     mojada, que es exactamente lo que una fogata apagada no tiene. */
  ctx.globalCompositeOperation = "lighter";
  if (fuego.fase <= 4) for (const l of fuego.lenguas) {
    let k = alturaLlama(l, reloj);
    /* ---- La agonía ----
       En la fase 4 la llama no baja: PARPADEA. Cada lengua se apaga y
       vuelve a su ritmo, con un seno rápido y un corte duro. Es lo que
       hace que se lea como «está peleando» y no como «está bajando el
       volumen». */
    if (fuego.fase === 4) {
      const late = Math.sin(reloj * 6.1 * l.vel + l.fase * 3.1);
      k *= late > -0.15 ? 1 : 0.12;
    }
    const h = alto * k * l.alto;
    const lx = x + l.x * f.r * 0.5;
    /* La lengua se tuerce mientras sube: la punta va a un lado y el
       cuerpo al otro. Una llama recta no parece fuego.
       Y encima de esa torsión propia, el VIENTO la ladea entera: la
       punta se va mucho más que la base, que es lo que pasa de verdad
       —abajo la llama está sujeta por la leña—. */
    const torsion = Math.sin(reloj * 2.1 * l.vel + l.fase) * f.r * 0.34
                  + fuego.inclina * f.r * 2.4 * (0.3 + k * 0.7);
    /* Con viento fuerte la llama además se estira y se afina. */
    const estira = 1 + Math.abs(fuego.inclina) * 0.35;
    const w = f.r * l.ancho * (0.6 + k * 0.5) / estira;

    const g = ctx.createLinearGradient(lx, y, lx + torsion, y - h);
    if (fuego.azul > 0.1) {
      const a = fuego.azul;
      g.addColorStop(0,    `rgba(${Math.round(mez(255,120,a))},${Math.round(mez(240,220,a))},${Math.round(mez(190,255,a))},0.95)`);
      g.addColorStop(0.35, `rgba(${Math.round(mez(255,60,a))},${Math.round(mez(170,190,a))},${Math.round(mez(60,255,a))},0.7)`);
      g.addColorStop(1,    `rgba(${Math.round(mez(220,20,a))},${Math.round(mez(60,80,a))},${Math.round(mez(20,180,a))},0)`);
    } else {
      g.addColorStop(0,    "rgba(255,246,200,0.95)");
      g.addColorStop(0.28, "rgba(255,190,70,0.78)");
      g.addColorStop(0.62, "rgba(240,110,30,0.42)");
      g.addColorStop(1,    "rgba(190,40,10,0)");
    }
    ctx.fillStyle = g;

    /* La forma: una gota alargada. Base ancha, punta fina y curvada. */
    ctx.beginPath();
    ctx.moveTo(lx - w, y);
    ctx.bezierCurveTo(
      lx - w * 0.9, y - h * 0.42,
      lx + torsion - w * 0.28, y - h * 0.76,
      lx + torsion, y - h
    );
    ctx.bezierCurveTo(
      lx + torsion + w * 0.28, y - h * 0.76,
      lx + w * 0.9, y - h * 0.42,
      lx + w, y
    );
    ctx.closePath();
    ctx.fill();
  }

  /* El corazón: lo más blanco, abajo del todo. Se ladea con el viento
     como las lenguas, si no se quedaba el núcleo quieto en el centro
     mientras el resto del fuego se iba de lado. */
  const cx = x + fuego.inclina * f.r * 0.3;
  const gc = ctx.createRadialGradient(cx, y - f.r * 0.3, 0, cx, y - f.r * 0.3, f.r * 1.3);
  gc.addColorStop(0, `rgba(255,252,236,${0.85 * fuego.vida})`);
  gc.addColorStop(0.5, `rgba(255,200,110,${0.4 * fuego.vida})`);
  gc.addColorStop(1, "rgba(255,150,60,0)");
  ctx.fillStyle = gc;
  ctx.beginPath();
  ctx.arc(cx, y - f.r * 0.3, f.r * 1.3, 0, 6.283);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";

  /* ---- Y los troncos de delante ---- */
  dibujarTroncos(x, y, f.r, 1);

  /* Las piedras del círculo. */
  ctx.fillStyle = "#2a2622";
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * 6.283 + 0.3;
    const rx = x + Math.cos(a) * f.r * 1.7;
    const ry = y + f.r * 0.34 + Math.sin(a) * f.r * 0.62;
    if (Math.sin(a) < -0.3) continue;              // ésas están detrás
    const s = f.r * (0.22 + ((i * 7) % 5) * 0.03);
    /* Iluminadas por el fuego: las de cerca más. */
    const ilum = clamp01(1 - Math.abs(Math.cos(a)) * 0.5) * luz;
    ctx.fillStyle = `rgb(${Math.round(mez(34, 120, ilum))},${Math.round(mez(30, 84, ilum))},${Math.round(mez(28, 62, ilum))})`;
    ctx.beginPath();
    ctx.ellipse(rx, ry, s, s * 0.72, a * 0.3, 0, 6.283);
    ctx.fill();
  }
}

function dibujarTroncos(x, y, r, lado) {
  for (const t of fuego.troncos) {
    if (Math.sign(t.y - 0.33) !== lado && lado === 1) continue;
    if (Math.sign(t.y - 0.33) === 1 && lado === -1) continue;
    const meneoT = Math.sin(reloj * 0.7 + t.meneo) * 0.012 + fuego.asentar * 0.05;
    const tx = x + t.x * r * 0.9;
    const ty = y + t.y * r * 0.5;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(t.a + meneoT);
    const largo = r * t.l, grueso = r * t.g;
    /* El tronco: oscuro arriba y encendido por abajo, que es por donde
       le da el fuego. */
    /* La leña mojada es más oscura: el agua le rellena los poros y
       deja de rebotar la luz. Es el mismo motivo por el que una piedra
       mojada parece de otro color. */
    const seco = 1 - fuego.mojado * 0.45;
    const g = ctx.createLinearGradient(0, -grueso, 0, grueso);
    g.addColorStop(0, fuego.mojado > 0.2 ? "#181310" : "#241c16");
    g.addColorStop(0.55, `rgb(${Math.round(mez(58, 150, fuego.brillo) * seco)},${Math.round(mez(40, 86, fuego.brillo) * seco)},${Math.round(mez(30, 52, fuego.brillo) * seco)})`);
    g.addColorStop(1, `rgb(${Math.round(mez(90, 220, fuego.brillo) * seco)},${Math.round(mez(48, 110, fuego.brillo) * seco)},${Math.round(mez(26, 40, fuego.brillo) * seco)})`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect
      ? ctx.roundRect(-largo / 2, -grueso / 2, largo, grueso, grueso * 0.45)
      : ctx.rect(-largo / 2, -grueso / 2, largo, grueso);
    ctx.fill();
    /* Las vetas: tres rayas oscuras. */
    ctx.strokeStyle = "rgba(20,14,10,0.4)";
    ctx.lineWidth = Math.max(1, grueso * 0.07);
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(-largo * 0.42, k * grueso * 0.22);
      ctx.lineTo(largo * 0.42, k * grueso * 0.22 + grueso * 0.05);
      ctx.stroke();
    }
    /* Y si está mojada, un filo de agua por el canto de arriba: la
       raya de luz que deja una superficie húmeda. Es lo que hace que se
       LEA como mojada en vez de simplemente más oscura. */
    if (fuego.mojado > 0.15) {
      ctx.strokeStyle = `rgba(190,210,235,${0.18 * fuego.mojado})`;
      ctx.lineWidth = Math.max(0.7, grueso * 0.1);
      ctx.beginPath();
      ctx.moveTo(-largo * 0.4, -grueso * 0.3);
      ctx.lineTo(largo * 0.4, -grueso * 0.3);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ==========================================
// SISTEMA DE BOMBONES
// ==========================================
//
// Un palo con un bombón en la punta. Se arrastra el bombón y, cuanto
// más cerca del fuego, más deprisa se tuesta.
//
// ── DE QUÉ DEPENDE EL TUESTE ─────────────────────────────────────────
// De UN número, `tueste`, de 0 en adelante. De ahí sale el color, el
// humo, si se prende, qué se dice al comerlo y cuánto se hincha. Con un
// número para todo no hay manera de que el dibujo diga una cosa y el
// texto otra.
//
// Sube según lo cerca que esté de la llama, con una caída cuadrática:
// pegado al fuego va rapidísimo y a dos palmos casi no sube. Es lo que
// obliga a estar pendiente en vez de dejarlo puesto.
//
// ── EL PALO ──────────────────────────────────────────────────────────
// No se arrastra el bombón suelto: se arrastra la PUNTA de un palo que
// está clavado en el suelo. El palo se dobla un poco, así que el bombón
// no va exactamente donde está el dedo, va donde el palo le deja. Eso
// es lo que hace que se sienta un objeto y no un cursor.

const bombon = {
  /* ---- EL PALO ----
     No es una línea del mango al dedo: es una varilla con inercia. Se
     guarda su ÁNGULO y su LARGO, y la punta sale de los dos. Así el
     palo puede ir con retraso, pasarse de largo y volver, que es lo que
     hace un palo de verdad en la mano de alguien. */
  ang: 0, angV: 0, angObj: 0,
  largo: 0, largoV: 0, largoObj: 0,
  /* Dónde ha acabado la punta, y con qué velocidad. El bombón lee esto
     y nada más: por eso hereda el impulso del palo sin que nadie se lo
     pase. */
  px: 0, py: 0, pvx: 0, pvy: 0,
  /* El mango del palo, clavado en el suelo. */
  mangoX: 0, mangoY: 0,
  /* A dónde lleva el dedo la punta. */
  destX: 0, destY: 0,
  agarrado: false,
  dedoId: null,

  /* ---- EL BOMBÓN ----
     No está clavado en la punta: cuelga de ella con un muelle corto y
     un tope duro. Tiene su propia posición y su propia velocidad, y de
     la diferencia entre dónde está y dónde debería salen solos el
     balanceo, la inercia y la rotación. */
  x: 0, y: 0, vx: 0, vy: 0,
  giro: 0,

  /* ---- EL CALOR ----
     `calor` es la temperatura de dentro, con inercia: sube despacio
     junto al fuego y BAJA DESPACIO al sacarlo, así que sigue tostándose
     un rato después. `lados` es cuánto se ha tostado cada cara, y por
     eso hay que girarlo. `tueste` es la media, que es lo que mira todo
     lo demás. */
  calor: 0,
  lados: null,
  tueste: 0,
  blando: 0,            // cuánto se ha reblandecido: se hunde y se estira
  burbujas: [],
  relojBurbuja: 0,
  relojGota: 0,

  ardiendo: 0,          // 0..1, si se ha prendido
  hinchado: 0,
  comido: 0,            // animación de comérselo
  relojHumo: 0,
  seguidosQuemados: 0,
  vivo: true,
  /* Sobrante del paso fijo: la física va a 120 Hz pase lo que pase. */
  sobra: 0,
};

const diceComer = {};
for (const k of Object.keys(CONF.alComer)) diceComer[k] = barajador(CONF.alComer[k]);
const diceQuemarse = barajador(CONF.alQuemarse);

function colocarBombon(reiniciar) {
  const f = sitio.fogata;
  bombon.mangoX = f.x + U * (apaisado ? 20 : 23);
  bombon.mangoY = f.y + U * 5;
  /* ---- EL SITIO DE REPOSO: APARTADO DEL FUEGO ----
     Apuntaba A LA HOGUERA, y ése era el fallo gordo: el palo suelto se
     iba solo a la llama y el bombón se tostaba sin que nadie lo
     acercara. Y como se tostaba solo y despacio, cuando por fin lo
     cogías ya estaba a medias y no había manera de hacerlo bien.

     Ahora el palo descansa al otro lado, apartado y un poco levantado,
     como apoyado esperando. Para tostar hay que acercarlo, que es justo
     lo que se le pide a quien juega. */
  bombon.largoObj = U * (apaisado ? 16 : 19);
  bombon.angObj = Math.atan2(-U * 4, U * 9);

  if (reiniciar || !bombon.vivo || !bombon.estrenado) {
    bombon.estrenado = true;
    bombon.ang = bombon.angObj;
    bombon.angV = 0;
    bombon.largo = bombon.largoObj;
    bombon.largoV = 0;
    recolocarPunta();
    bombon.x = bombon.px; bombon.y = bombon.py + U * 1.2;
    bombon.vx = bombon.vy = 0;
    bombon.giro = 0;
    bombon.calor = 0;
    bombon.tueste = 0;
    bombon.lados = new Float32Array(CONF.bombon.lados);
    bombon.blando = 0;
    bombon.burbujas = [];
    bombon.ardiendo = 0;
    bombon.hinchado = 0;
    bombon.comido = 0;
    bombon.vivo = true;
  } else {
    /* Al remedir la pantalla no se reinicia nada: sólo se vuelve a
       colgar de donde toca ahora. */
    recolocarPunta();
  }
  if (!bombon.lados) bombon.lados = new Float32Array(CONF.bombon.lados);
}

function recolocarPunta() {
  bombon.px = bombon.mangoX + Math.cos(bombon.ang) * bombon.largo;
  bombon.py = bombon.mangoY + Math.sin(bombon.ang) * bombon.largo;
}

/** En qué estado está, según el tueste. */
function estadoBombon() {
  const t = bombon.tueste;
  for (const e of CONF.bombon.estados) if (t < e.hasta) return e;
  return CONF.bombon.estados[CONF.bombon.estados.length - 1];
}

/* ---- EL PASO FIJO -------------------------------------------------------
   Los muelles se integran a 120 Hz SIEMPRE, pase lo que pase con los
   fotogramas. No es manía: un muelle rígido integrado con un `dt` que
   sube de golpe —una pestaña que vuelve, un móvil que se atasca— no se
   pasa de la raya, EXPLOTA, y el bombón sale disparado fuera de la
   pantalla para no volver. Con paso fijo eso no puede pasar ni aunque
   el navegador se pare un segundo entero.                             */

const PASO_BOMBON = 1 / 120;
const MAX_PASOS_BOMBON = 8;

function moverBombon(dt) {
  if (!bombon.vivo) {
    /* Se lo ha comido: la animación y, cuando acaba, otro bombón. */
    bombon.comido += dt;
    if (bombon.comido > 1.4) colocarBombon(true);
    return;
  }

  bombon.sobra += dt;
  let pasos = 0;
  while (bombon.sobra >= PASO_BOMBON && pasos < MAX_PASOS_BOMBON) {
    bombon.sobra -= PASO_BOMBON;
    pasos++;
    pasoFisicaBombon(PASO_BOMBON);
  }
  /* Si se ha ido tantísimo tiempo que no caben los pasos, se tira lo
     que sobra en vez de acumularlo: acumularlo sólo garantiza que el
     siguiente fotograma tampoco llegue. */
  if (pasos >= MAX_PASOS_BOMBON) bombon.sobra = 0;

  cocerBombon(dt);
}

function pasoFisicaBombon(h) {
  const F = CONF.bombon.fisica;

  /* ---- 1. A dónde quiere ir el palo ----
     Si lo llevas cogido, apunta al dedo. Si no, vuelve a su sitio. El
     largo se limita aquí y no en el dedo: así, cuando estiras más allá
     del alcance, el palo se queda tirante y se nota que TIENE un
     alcance en vez de seguirte a cualquier parte. */
  /* ---- COGIDO: EL PALO PERSIGUE AL DEDO, SIN MUELLE ----
     Antes el dedo movía un ángulo OBJETIVO y un muelle tiraba del palo
     hacia él. Eso hace dos cosas malas a la vez: el palo llega tarde
     —se queda atrás mientras arrastras— y al parar se pasa y vuelve.
     En un palo eso no se lee como peso: se lee como goma.

     Ahora el ángulo va directo detrás del dedo con amortiguación pura:
     rápido, y sin pasarse nunca. Se siente libre porque lo es.

     Se guarda la velocidad de verdad que ha llevado, para que al soltar
     conserve el impulso; y el objetivo se queda pegado al ángulo real,
     para que al soltar NO tire de vuelta a ningún sitio. */
  if (bombon.agarrado) {
    const dx = bombon.destX - bombon.mangoX;
    const dy = bombon.destY - bombon.mangoY;
    if (Math.hypot(dx, dy) > U * 1.2) {
      const objetivo = Math.atan2(dy, dx);
      /* La diferencia CORTA. Sin esto, al cruzar el dedo por detrás del
         mango el palo daba la vuelta entera por el otro lado. */
      const dif = Math.atan2(Math.sin(objetivo - bombon.ang),
                             Math.cos(objetivo - bombon.ang));
      const avance = dif * (1 - Math.exp(-F.sigueDedo * h));
      bombon.ang += avance;
      bombon.angV = clamp(avance / h, -22, 22);
      bombon.angObj = bombon.ang;
    }
    recolocarPuntaYBombon(h);
    return;
  }

  /* ---- SUELTO: SE QUEDA DONDE LO DEJASTE ----
     Sólo se frena lo que llevara de impulso y se le deja un poquito de
     peso, topado para que nunca llegue a caerse dentro del fuego él
     solo. Un palo apoyado se queda apoyado. */
  bombon.angV *= Math.exp(-F.frenoSuelto * h);
  bombon.angV += Math.cos(bombon.ang) * F.pesoPalo * 0.25 * h;
  bombon.angV = clamp(bombon.angV, -6, 6);
  bombon.ang += bombon.angV * h;
  bombon.angObj = bombon.ang;
  recolocarPuntaYBombon(h);
}

/**
 * Lo que va DESPUÉS de saber dónde apunta el palo: la punta, el bombón
 * ensartado en ella y su giro.
 *
 * Está aparte porque el palo se resuelve de dos maneras muy distintas
 * —persiguiendo al dedo o quedándose quieto— y esto es igual en las
 * dos. Repetido en los dos sitios, se arreglaba en uno y no en el otro.
 */
function recolocarPuntaYBombon(h) {
  const F = CONF.bombon.fisica;

  /* ── POR QUÉ EL PALO NO ES ELÁSTICO, NI DE LARGO NI DE ÁNGULO ──────
     Porque un palo no se estira ni rebota. Al principio el largo tenía
     su propio muelle, así que al mover el dedo deprisa el palo se
     alargaba y se encogía; y el ángulo tenía otro, así que llegaba
     tarde y se pasaba al frenar; y el bombón colgaba de la punta con un
     tercero. Las tres elasticidades se sumaban y el conjunto se
     bamboleaba como gelatina.

     Ahora el largo es fijo, el ángulo persigue al dedo sin pasarse, y
     del bombón sólo queda un temblorcito. Si estiras el dedo más allá
     del alcance, el palo apunta hacia allá y se queda donde llega, que
     es lo que hace un palo de verdad cuando lo que quieres alcanzar
     está más lejos que el palo. */

  /* El largo sólo cambia si cambia el ALCANCE —al girar el teléfono—, y
     entonces va despacio y sin rebote: eso no es física, es recolocar. */
  bombon.largo = damp(bombon.largo, bombon.largoObj, 9, h);
  bombon.largoV = 0;

  /* ---- 3. La punta, y con qué velocidad se mueve ---- */
  const pxAntes = bombon.px, pyAntes = bombon.py;
  recolocarPunta();
  bombon.pvx = (bombon.px - pxAntes) / h;
  bombon.pvy = (bombon.py - pyAntes) / h;

  /* ---- 4. El bombón, ENSARTADO en la punta ----
     No cuelga: está atravesado por el palo, que es lo que se hace con
     un malvavisco. Su sitio es la punta y ya está.

     Lo que queda de muelle es un temblorcito muy corto y muy duro, para
     que al frenar de golpe se note que tiene masa. Derretido, y sólo
     derretido, se ablanda: entonces sí cede y se escurre un poco hacia
     abajo, que es lo que hace el azúcar cuando se va a caer. */
  const r = radioBombon();
  const blandura = bombon.blando;
  const rigidez = mez(F.muelleBombon, F.muelleBombon * 0.28, blandura);
  const freno = mez(F.frenoBombon, F.frenoBombon * 0.55, blandura);
  const repY = bombon.py + r * F.cuelga * blandura;
  let fx = (bombon.px - bombon.x) * rigidez - bombon.vx * freno;
  let fy = (repY - bombon.y) * rigidez - bombon.vy * freno + F.gravedad * blandura;
  bombon.vx += fx * h;
  bombon.vy += fy * h;
  bombon.x += bombon.vx * h;
  bombon.y += bombon.vy * h;

  /* ---- 5. El tope duro ----
     El palo está CLAVADO en el bombón: por muy deprisa que muevas la
     mano, no se puede separar más de un radio y pico. Un muelle solo no
     basta —con un tirón fuerte se estira sin límite y se ve el bombón
     flotando lejos del palo—, así que se corta en seco Y se le quita la
     parte de la velocidad que iba en esa dirección. Sin quitarla, se
     queda rebotando contra el tope para siempre. */
  const dx2 = bombon.x - bombon.px, dy2 = bombon.y - bombon.py;
  const dist = Math.hypot(dx2, dy2);
  const tope = r * F.maxSeparacion;
  if (dist > tope && dist > 0.0001) {
    const nx = dx2 / dist, ny = dy2 / dist;
    bombon.x = bombon.px + nx * tope;
    bombon.y = bombon.py + ny * tope;
    const radial = bombon.vx * nx + bombon.vy * ny;
    if (radial > 0) { bombon.vx -= nx * radial; bombon.vy -= ny * radial; }
  }

  /* ---- 6. El giro ----
     Ensartado, el bombón gira con EL PALO: su eje es el palo. Y encima
     se le suma lo poco que se haya desplazado del eje, que es lo que
     hace que al frenar de golpe se ladee un pelín sin despegarse.

     Antes el giro salía sólo de la dirección en la que colgaba, y por
     eso al mover el palo el bombón se revolvía como si estuviera
     atado con un hilo. */
  const ladeo = Math.atan2(bombon.y - bombon.py, bombon.x - bombon.px)
              - bombon.ang;
  const corto = Math.atan2(Math.sin(ladeo), Math.cos(ladeo));
  bombon.giro = bombon.ang + clamp(corto, -0.5, 0.5) * (0.25 + blandura * 0.5);
}

/** El radio del bombón ahora mismo, con lo hinchado y lo blando. */
function radioBombon() {
  return U * (2.6 + bombon.hinchado * 0.9);
}

/* ---- COCER EL BOMBÓN ----------------------------------------------------

   ── POR QUÉ NO ES `if (cercaDelFuego) quemar()` ──────────────────────
   Porque así no se tuesta nada. Se enciende y se apaga, y lo único que
   se puede hacer es acercarlo y esperar.

   Aquí hay tres cosas encadenadas, y cada una tarda lo suyo:

     1. el SITIO donde está tiene una temperatura (cae con el cuadrado
        de la distancia al fuego, y depende de cómo esté el fuego);
     2. el bombón coge esa temperatura DESPACIO, porque tiene masa. Por
        eso sigue tostándose un rato después de sacarlo, y por eso
        pasarlo un segundo por la llama no hace nada;
     3. y sólo por encima de cierta temperatura empieza a dorarse. El
        azúcar necesita un mínimo; por debajo, se calienta y ya.

   ── Y SE TUESTA POR LADOS ────────────────────────────────────────────
   Seis caras, cada una con su tueste. Cada una recibe calor según
   CUÁNTO MIRA AL FUEGO, así que el lado de abajo se quema mientras el
   de arriba sigue blanco, y hay que GIRARLO. Que es lo que se hace con
   un malvavisco de verdad.

   El calor se reparte un poco entre caras vecinas, porque el azúcar
   conduce. Sin eso salían seis gajos de colores planos y parecía una
   pelota de playa.                                                    */

function cocerBombon(dt) {
  const f = sitio.fogata;
  const C = CONF.bombon;
  const r = radioBombon();

  /* ---- 1. La temperatura del sitio ---- */
  const d = Math.hypot(bombon.x - f.x, (bombon.y - (f.y - f.r)) * 1.25);
  const alcance = f.r * 4.6 * C.radioCalor;
  const cerca = clamp01(1 - d / alcance);
  /* ---- LA CURVA DEL CALOR ----
     Pegado quema y a dos palmos casi no hace nada: eso es todo el
     juego. Pero era un CUADRADO y con eso ni pegado a la llama daba
     calor suficiente para pasar del umbral en más de dos caras: había
     que tener el bombón dentro del fuego medio minuto para que se
     dorara, y la mayoría de la gente lo sacaba antes pensando que no
     funcionaba.

     Con exponente 1.6 y un empujón de 1.3, metido de lleno en la llama
     llega a unos 0.85 de temperatura, que es lo que hace falta para que
     se dore en tres segundos y se queme en siete. Y fuera del alcance
     sigue siendo cero, que es lo otro que hacía falta. */
  const ambiente = Math.pow(cerca, 1.6) * clamp(fuego.vida, 0, 1.6) * 1.3
                 + bombon.ardiendo * 0.9;

  /* ---- 2. El bombón coge esa temperatura, pero con inercia ---- */
  bombon.calor = damp(bombon.calor, ambiente, 1 / C.masa, dt);

  /* ---- 3. Cada cara se tuesta según lo que mire al fuego ---- */
  const n = C.lados;
  if (!bombon.lados || bombon.lados.length !== n) bombon.lados = new Float32Array(n);
  const haciaFuego = Math.atan2((f.y - f.r) - bombon.y, f.x - bombon.x);
  const paso = 6.283185 / n;
  let suma = 0;

  for (let i = 0; i < n; i++) {
    /* Hacia dónde mira esta cara, contando el giro del bombón. */
    const mira = bombon.giro + i * paso;
    /* Cuánto le da el fuego: 1 de frente, 0 de canto, nada de espaldas.
       El +0.18 es el calor que le llega por el aire aunque esté del
       otro lado; sin él, la cara de arriba no se tostaba NUNCA por
       mucho que giraras, porque siempre había alguna cara tapándola. */
    const encara = Math.max(0, Math.cos(mira - haciaFuego)) * 0.82 + 0.18;
    const recibe = bombon.calor * encara;

    if (recibe > C.umbral) {
      bombon.lados[i] += C.calienta * (recibe - C.umbral) * dt;
    } else {
      bombon.lados[i] = Math.max(0, bombon.lados[i] - C.enfria * dt * 0.5);
    }
    bombon.lados[i] = Math.min(bombon.lados[i], 1.15);
    suma += bombon.lados[i];
  }

  /* ---- 4. El azúcar conduce: las caras se igualan un poco ----
     Se hace con una copia, si no cada cara leería el valor ya
     modificado de su vecina y el calor viajaría en una dirección. */
  const k = clamp01(C.conduce * dt);
  if (k > 0) {
    const copia = bombon.lados.slice();
    for (let i = 0; i < n; i++) {
      const izq = copia[(i + n - 1) % n], der = copia[(i + 1) % n];
      bombon.lados[i] += ((izq + der) * 0.5 - copia[i]) * k;
    }
  }

  bombon.tueste = suma / n;

  /* ---- 5. Lo blando y lo hinchado ----
     Se hincha con el calor y se ablanda con el tueste. Lo blando es lo
     que luego le hace colgar la barriga y gotear. */
  bombon.hinchado = damp(bombon.hinchado, clamp01(bombon.calor * 1.25), 2.2, dt);
  /* Reblandecerse pide calor DE VERDAD, no cualquier tibieza: con
     `calor * 1.6` se derretía entero sólo por estar cerca, y un bombón
     que gotea antes de dorarse no es un bombón. Y al tostarse vuelve a
     endurecerse por fuera, que es la costra. */
  bombon.blando = damp(bombon.blando,
    clamp01((bombon.calor - 0.3) * 1.1) * clamp01(1 - bombon.tueste * 0.55), 1.4, dt);

  /* ---- 6. Las burbujas ----
     El azúcar derretido burbujea. Nacen en un punto de la superficie,
     crecen y revientan. Es lo que hace que se vea COCIÉNDOSE y no
     simplemente cambiando de color. */
  for (let i = bombon.burbujas.length - 1; i >= 0; i--) {
    const b = bombon.burbujas[i];
    b.t += dt;
    if (b.t >= b.dur) {
      bombon.burbujas.splice(i, 1);
      /* Al reventar deja una marquita más tostada en su cara. */
      const cara = Math.round(b.a / paso) % n;
      bombon.lados[(cara + n) % n] = Math.min(1.15, bombon.lados[(cara + n) % n] + 0.012);
    }
  }
  if (bombon.calor > 0.3 && bombon.burbujas.length < 7) {
    bombon.relojBurbuja -= dt;
    if (bombon.relojBurbuja <= 0) {
      bombon.relojBurbuja = azar(0.12, 0.5) / clamp(bombon.calor, 0.3, 1.5);
      /* Nacen donde más calor hay, que es donde el fuego pega. */
      const sesgo = haciaFuego - bombon.giro + azar(-1.1, 1.1);
      bombon.burbujas.push({
        a: sesgo, rr: azar(0.16, 0.34),
        t: 0, dur: azar(0.5, 1.5),
      });
    }
  }

  /* ---- 7. Las gotas ----
     Cuando está muy blando, se le cae azúcar derretido. Y si cae sobre
     la fogata, chisporrotea. */
  if (bombon.blando > 0.45) {
    bombon.relojGota -= dt;
    if (bombon.relojGota <= 0) {
      bombon.relojGota = azar(0.5, 2.4) / bombon.blando;
      const e = estadoBombon();
      soltar(bombon.x + azar(-r * 0.5, r * 0.5), bombon.y + r * 0.8, {
        vx: bombon.vx * 0.25 + azar(-6, 6),
        vy: azar(4, 22),
        vida: azar(0.7, 1.4),
        tam: U * azar(0.28, 0.5),
        tipo: TIPO.CENIZA,
      });
      void e;
      /* Si cae cerca del fuego, se oye. */
      if (Math.abs(bombon.x - f.x) < f.r * 2.2 && bombon.y < f.y) {
        setTimeout(() => sisear(0.18), 220);
      }
    }
  }

  /* ---- 8. La sorpresa ----
     Cuando ya está muy caliente, puede prenderse de golpe. Es lo que
     hace que ninguna tostada se parezca a la anterior. */
  if (!bombon.ardiendo && bombon.tueste > 0.55 && bombon.calor > 0.45) {
    if (Math.random() < C.sorpresa * bombon.calor * dt) prenderBombon();
  }
  /* Y si alguna cara se pasa del todo, arde seguro. */
  if (!bombon.ardiendo) {
    for (let i = 0; i < n; i++) if (bombon.lados[i] > 0.95) { prenderBombon(); break; }
  }

  /* ---- 9. Ardiendo ---- */
  if (bombon.ardiendo > 0) {
    bombon.ardiendo = Math.min(1, bombon.ardiendo + dt * 0.9);
    /* Arder tuesta TODAS las caras, no sólo la que mira al fuego. */
    for (let i = 0; i < n; i++) bombon.lados[i] = Math.min(1.15, bombon.lados[i] + 0.3 * dt);
    /* Se apaga solo si lo sacas del fuego, pero tarda. Y si lo agitas
       de lado, se apaga antes: eso es soplarlo con el movimiento. */
    const agita = Math.hypot(bombon.vx, bombon.vy) / (U * 60);
    if (ambiente < 0.12) bombon.ardiendo -= dt * (0.22 + agita * 0.5);
    if (bombon.ardiendo <= 0) bombon.ardiendo = 0;

    if (Math.random() < dt * 22) {
      soltar(bombon.x + azar(-U, U), bombon.y - U * 0.6, {
        vx: azar(-20, 20) + fuego.inclina * 30, vy: azar(-80, -30),
        vida: azar(0.5, 1.2), tam: azar(0.9, 2), tipo: TIPO.CHISPA,
      });
    }
  }

  /* ---- 10. El humo del bombón ---- */
  if (bombon.tueste > 0.58) {
    bombon.relojHumo -= dt;
    if (bombon.relojHumo <= 0) {
      bombon.relojHumo = mez(0.42, 0.1, clamp01((bombon.tueste - 0.58) / 0.4));
      soltar(bombon.x + azar(-U * 0.6, U * 0.6), bombon.y - U * 1.2, {
        vx: azar(-6, 6) + fuego.inclina * 18, vy: azar(-30, -14),
        vida: azar(2.2, 3.6), tam: azar(U * 0.6, U * 1.2),
        tipo: TIPO.HUMO, tono: 0.8,
      });
    }
  }
}

function prenderBombon() {
  if (bombon.ardiendo > 0) return;
  bombon.ardiendo = 0.001;
  tono(azar(180, 260), 0.3, "sawtooth", 0.05);
  golpe(0.1, 1800, 0.12, "highpass");
  for (let i = 0; i < 16; i++) {
    soltar(bombon.x + azar(-U, U), bombon.y + azar(-U, U), {
      vx: azar(-60, 60), vy: azar(-120, -20),
      vida: azar(0.6, 1.4), tam: azar(1.2, 2.6), tipo: TIPO.CHISPA,
    });
  }
}

/** Comerse el bombón. */
function comerBombon() {
  if (!bombon.vivo) return;
  const e = estadoBombon();
  bombon.vivo = false;
  bombon.comido = 0;

  /* Un mordisco: un golpe blando y un tono corto. */
  golpe(0.09, 420, 0.16, "lowpass");
  tono(azar(300, 420), 0.18, "sine", 0.07, 0.05);
  tono(azar(520, 660), 0.22, "triangle", 0.05, 0.12);

  for (let i = 0; i < 18; i++) {
    soltar(bombon.x + azar(-U, U), bombon.y + azar(-U, U), {
      vx: azar(-90, 90), vy: azar(-110, -10),
      vida: azar(0.5, 1.3), tam: azar(1.4, 3),
      tipo: TIPO.BRILLO, tono: e.id === "quemado" ? 0.1 : 0.8,
    });
  }

  decir(bombon.x, bombon.y, diceComer[e.id](), { mimo: true, importante: true });

  /* ---- Easter egg: tres quemados seguidos ---- */
  if (e.id === "quemado" || e.id === "quemandose") {
    bombon.seguidosQuemados++;
    if (bombon.seguidosQuemados === 3) {
      setTimeout(() => decir(sitio.fogata.x, sitio.fogata.y - U * 22,
        "Tres seguidos. Voy a tener que tostarlos yo 😭", { mimo: true, importante: true }), 2200);
      magia(330);
    }
  } else {
    if (bombon.seguidosQuemados >= 2) {
      setTimeout(() => decir(bombon.x, bombon.y - U * 10,
        "¡Ahí está! Sabía que le ibas a agarrar el modo.", { mimo: true }), 1800);
    }
    bombon.seguidosQuemados = 0;
  }
  contarLogro("bombon");
}

/**
 * El color de una cara, según lo tostada que esté.
 *
 * El último estado tiene `hasta: 99` para que nada se salga de la
 * lista, y eso escondía un fallo: al interpolar dentro de él, con un
 * tramo de 98 de ancho y un tueste que como mucho llega a 1.15, el
 * factor salía 0.002 y el negro del quemado no se veía JAMÁS. Un bombón
 * carbonizado se quedaba marrón claro. Así que el tramo del último se
 * recorta al tueste máximo de verdad.
 */
const TUESTE_MAX = 1.15;

function colorTueste(t, hondo) {
  const est = CONF.bombon.estados;
  let i = 0;
  while (i < est.length - 1 && t >= est[i].hasta) i++;
  const antes = est[Math.max(0, i - 1)];
  const desde = i === 0 ? 0 : antes.hasta;
  const hasta = Math.min(est[i].hasta, TUESTE_MAX);
  const k = clamp01((t - desde) / Math.max(0.01, hasta - desde));
  return mezColor(antes.color[hondo ? 1 : 0], est[i].color[hondo ? 1 : 0], k);
}

function dibujarBombon() {
  const d = desplazar(1.9);
  const bx = bombon.x + d.x, by = bombon.y + d.y;
  const px = bombon.px + d.x, py = bombon.py + d.y;
  const mx = bombon.mangoX + d.x, my = bombon.mangoY + d.y;

  /* ---- El palo ----
     Una curva, no una recta: un palo de verdad se dobla con el peso. Y
     la comba no es fija: sale de lo LEJOS que esté la punta de donde
     debería estar si el palo fuera rígido. Cuando lo mueves deprisa el
     palo va por detrás, y entonces se dobla de verdad. */
  const largo = Math.hypot(px - mx, py - my);
  const retraso = bombon.angV * largo * 0.06;
  const comba = clamp(largo * 0.07 + retraso, -U * 6, U * 6);
  const nx = -(py - my) / Math.max(1, largo), ny = (px - mx) / Math.max(1, largo);
  const cxP = (mx + px) / 2 + nx * comba;
  const cyP = (my + py) / 2 + ny * comba + largo * 0.05;

  const g = ctx.createLinearGradient(mx, my, px, py);
  g.addColorStop(0, `rgb(${Math.round(mez(58, 130, fuego.brillo))},${Math.round(mez(42, 86, fuego.brillo))},${Math.round(mez(30, 54, fuego.brillo))})`);
  g.addColorStop(1, `rgb(${Math.round(mez(78, 170, fuego.brillo))},${Math.round(mez(56, 112, fuego.brillo))},${Math.round(mez(38, 68, fuego.brillo))})`);
  ctx.strokeStyle = g;
  ctx.lineWidth = U * 0.62;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(mx, my);
  ctx.quadraticCurveTo(cxP, cyP, px, py);
  ctx.stroke();

  if (!bombon.vivo) {
    /* Se lo está comiendo: el palo se queda solo un momento. */
    return;
  }

  /* ---- El bombón ---- */
  const r = radioBombon();
  /* ---- La forma ----
     De frío es un CILINDRO de pie: más alto que ancho. Al calentarse se
     hincha y al derretirse se hunde —se ensancha y se aplasta—, hasta
     quedarse casi redondo. Antes empezaba ya casi circular y no se
     notaba ningún cambio: era la misma bola siempre, sólo que de otro
     color. */
  const ancho = r * (0.9 + bombon.blando * 0.26 + bombon.hinchado * 0.1);
  const alto  = r * (1.3 - bombon.blando * 0.22 - bombon.hinchado * 0.05);

  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(bombon.giro);

  /* ---- El cuerpo, cara a cara ----
     Seis gajos, cada uno con el color de lo tostada que está esa cara.
     Con un degradado cónico si el navegador lo tiene —que es lo suyo,
     porque el tueste da la vuelta al bombón— y con gajos recortados si
     no. En los dos casos el tueste se ve GIRAR cuando giras el palo,
     que es lo que hace que valga la pena girarlo. */
  const n = CONF.bombon.lados;
  const paso6 = 6.283185 / n;
  ctx.beginPath();
  /* Un malvavisco es un CILINDRO, no una bola: cantos casi rectos y las
     dos tapas redondeadas. Con el radio a la mitad parecía un caramelo
     cuadrado; con 0.78 del ancho queda la cápsula de siempre. */
  if (ctx.roundRect) ctx.roundRect(-ancho, -alto, ancho * 2, alto * 2, ancho * 0.62);
  else ctx.rect(-ancho, -alto, ancho * 2, alto * 2);

  /* ---- El tueste, cara a cara ----
     El primer intento fue un degradado CÓNICO con una parada por cara.
     Técnicamente correcto y visualmente falso: un cónico reparte el
     color en gajos que salen del centro, así que el bombón salía como
     un gráfico de quesitos. Un malvavisco no se tuesta en quesitos: se
     tuesta A MANCHAS, por fuera, donde le ha dado la llama.

     Así que se pinta el cuerpo del color de la cara MENOS tostada —el
     fondo— y encima, recortada a la silueta, una mancha difuminada por
     cara, pegada al borde en su dirección y con la opacidad de lo que
     esa cara se haya tostado de más. Las manchas se solapan y se
     funden solas, que es exactamente lo que hacen las de verdad. */
  let minT = Infinity, maxT = -Infinity;
  for (let i = 0; i < n; i++) {
    if (bombon.lados[i] < minT) minT = bombon.lados[i];
    if (bombon.lados[i] > maxT) maxT = bombon.lados[i];
  }
  const gb = ctx.createLinearGradient(0, -alto, 0, alto);
  gb.addColorStop(0, colorTueste(minT, false));
  gb.addColorStop(1, colorTueste(minT, true));
  ctx.fillStyle = gb;
  ctx.fill();

  if (maxT - minT > 0.01) {
    ctx.save();
    ctx.clip();
    for (let i = 0; i < n; i++) {
      /* La opacidad sale de la diferencia DE VERDAD con la cara menos
         tostada, no de dónde queda entre la mínima y la máxima. Con la
         proporción, un bombón con todas las caras casi crudas pintaba
         la menos cruda a tope y parecía medio hecho. */
      const extra = clamp01((bombon.lados[i] - minT) * 3.2);
      if (extra < 0.05) continue;
      const a = i * paso6;
      const mx2 = Math.cos(a) * ancho * 0.72;
      const my2 = Math.sin(a) * alto * 0.72;
      const rr = Math.max(ancho, alto) * 0.95;
      const gm = ctx.createRadialGradient(mx2, my2, 0, mx2, my2, rr);
      const col = colorTueste(bombon.lados[i], false);
      gm.addColorStop(0, col);
      gm.addColorStop(0.55, col.replace("rgb(", "rgba(").replace(")", ",0.45)"));
      gm.addColorStop(1, col.replace("rgb(", "rgba(").replace(")", ",0)"));
      ctx.globalAlpha = clamp01(extra);
      ctx.fillStyle = gm;
      ctx.fillRect(-ancho * 1.2, -alto * 1.2, ancho * 2.4, alto * 2.4);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-ancho, -alto, ancho * 2, alto * 2, ancho * 0.62);
    else ctx.rect(-ancho, -alto, ancho * 2, alto * 2);
  }
