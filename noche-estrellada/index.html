<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Una noche en el bosque, junto a una fogata.">
<title>Noche estrellada</title>

<style>
/* ══════════════════════════════════════════════════════════════════════
   NOCHE ESTRELLADA — estilos

   Todo cuelga de `.noche` y lleva el prefijo `ne-`. Ni una etiqueta a
   secas: esta página funciona suelta, pero también se incrusta dentro
   del librito, y ahí no puede tocarle nada a nadie.
   ══════════════════════════════════════════════════════════════════════ */

html, body {
  margin: 0;
  height: 100%;
  background: #05070f;
  overscroll-behavior: none;
}

.noche {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  contain: layout paint;
  background: #05070f;
  color: #dfe6f5;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  cursor: default;

  /* Los márgenes seguros del móvil. Si esta página va dentro del librito,
     él ya los presta con estos nombres; si va suelta, salen de `env()`. */
  --seguro-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seguro-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --seguro-l: var(--seguro-lado, env(safe-area-inset-left, 0px));
  --barra: var(--hueco-barra, 0rem);

  --e-suave: cubic-bezier(0.22, 1, 0.36, 1);
  --e-cine: cubic-bezier(0.65, 0, 0.35, 1);

  --tipo-titulo: var(--tipo-titulo, Georgia, "Times New Roman", serif);
  --tipo-mano: var(--tipo-mano, "Segoe Script", "Bradley Hand", cursive);
}

/* El lienzo donde se pinta el mundo entero. */
.noche .ne-lienzo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  /* Los toques los recoge `.ne-toque`, que va justo encima. Así hay un
     solo sitio del que salen los gestos. */
  pointer-events: none;
}

/* La capa que recibe los dedos. Ocupa la escena entera.

   Si esta página va dentro del librito, él sólo se queda el barrido que
   EMPIEZA en sus 24-44 px de borde, así que aquí se puede arrastrar de
   lado a lado sin que se pase de hoja. */
.noche .ne-toque {
  position: absolute;
  inset: 0;
  touch-action: none;
  z-index: 2;
}

/* ── El rótulo de bienvenida ─────────────────────────────────────────── */

.noche .ne-entrada {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(10, 14, 28, 0.55), rgba(3, 5, 12, 0.92));
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  transition: opacity 900ms var(--e-suave), visibility 900ms;
  cursor: pointer;
  text-align: center;
  padding: 0 28px;
  box-sizing: border-box;
}
.noche.is-dentro .ne-entrada {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.noche .ne-entrada h1 {
  margin: 0 0 0.5em;
  font-family: var(--tipo-titulo);
  font-weight: 400;
  font-size: clamp(1.5rem, 7vw, 2.4rem);
  letter-spacing: 0.16em;
  color: #f2ecff;
  text-shadow: 0 0 40px rgba(170, 190, 255, 0.45);
}
.noche .ne-entrada p {
  margin: 0;
  font-size: clamp(0.82rem, 3.6vw, 1rem);
  line-height: 1.7;
  color: #b8c4e0;
  max-width: 22em;
}
.noche .ne-entrada .ne-pulso {
  display: inline-block;
  margin-top: 1.6em;
  padding: 0.7em 1.8em;
  border: 1px solid rgba(190, 205, 255, 0.34);
  border-radius: 999px;
  font-size: 0.82rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #dfe6ff;
  animation: ne-respira 3.4s ease-in-out infinite;
}
@keyframes ne-respira {
  0%, 100% { opacity: 0.55; transform: scale(1); }
  50%      { opacity: 1;    transform: scale(1.035); }
}

/* ── Los textos flotantes ────────────────────────────────────────────── */

/* Cada frase sale donde ha pasado algo y sube desvaneciéndose. Se crean
   una vez y se reciclan: en una escena que puede soltar varias por
   segundo, crear y tirar nodos es lo que hace que salte el recolector
   justo encima de una animación. */
.noche .ne-dichos {
  position: absolute;
  inset: 0;
  z-index: 25;
  pointer-events: none;
}
.noche .ne-dicho {
  position: absolute;
  left: 0; top: 0;
  max-width: min(17em, 74vw);
  padding: 0.5em 0.95em;
  border-radius: 14px;
  background: rgba(14, 18, 34, 0.62);
  border: 1px solid rgba(180, 196, 255, 0.16);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  font-size: clamp(0.76rem, 3.3vw, 0.92rem);
  line-height: 1.5;
  text-align: center;
  color: #e8eeff;
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
  opacity: 0;
  will-change: transform, opacity;
}
.noche .ne-dicho.ne-mimo {
  font-family: var(--tipo-mano);
  font-size: clamp(0.92rem, 4vw, 1.12rem);
  color: #ffd8e8;
  border-color: rgba(255, 180, 210, 0.24);
}

/* ── El panel de ambientes ───────────────────────────────────────────── */

/* Va dibujado con piedras en el lienzo, no con HTML: forma parte del
   mundo. Esto de aquí es sólo la etiqueta que explica lo que se toca,
   y se esconde en cuanto se usa una vez. */
.noche .ne-pista-panel {
  position: absolute;
  left: 50%;
  bottom: calc(var(--seguro-b) + var(--barra) + 8px);
  transform: translateX(-50%);
  z-index: 20;
  font-size: 0.66rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(190, 204, 240, 0.45);
  pointer-events: none;
  transition: opacity 700ms var(--e-suave);
}
/* Se va en cuanto se usa una piedra… y también en cuanto se sale del
   bosque: dentro de la cabaña no hay piedras que tocar, y el rótulo se
   quedaba ahí explicando algo que no está. */
.noche.is-panel-usado .ne-pista-panel,
.noche.is-habitacion .ne-pista-panel,
.noche.is-durmiendo .ne-pista-panel { opacity: 0; }

/* ── La carta del bosque ─────────────────────────────────────────────── */

.noche .ne-velo {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: calc(var(--seguro-t) + 20px) 20px calc(var(--seguro-b) + var(--barra) + 20px);
  box-sizing: border-box;
  background: radial-gradient(ellipse 90% 70% at 50% 50%, rgba(6, 14, 12, 0.72), rgba(2, 5, 8, 0.94));
  opacity: 0;
  visibility: hidden;
  /* `pointer-events` aparte y SIN transición: `visibility` tarda sus 900
     ms en llegar a `hidden`, y mientras tanto el velo ocupa la pantalla
     entera por encima de todo. Al cerrar la carta había casi un segundo
     en el que tocar el bosque no hacía nada. */
  pointer-events: none;
  transition: opacity 900ms var(--e-suave), visibility 900ms;
}
.noche .ne-velo.is-abierto {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.noche .ne-carta {
  position: relative;
  width: min(92vw, 380px);
  max-height: 100%;
  overflow: auto;
  padding: 30px 26px 26px;
  box-sizing: border-box;
  border-radius: 3px;
  /* Papel viejo: tres tramas finísimas y un degradado. Sin descargar
     nada, y nítido a cualquier tamaño. */
  background-image:
    repeating-linear-gradient(92deg, rgba(150, 125, 90, 0.05) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(2deg, rgba(150, 125, 90, 0.04) 0 1px, transparent 1px 5px),
    linear-gradient(166deg, #fdf8ec 0%, #f4ebd6 58%, #e4d7bc 100%);
  color: #3c3126;
  box-shadow:
    0 2px 4px rgba(20, 30, 20, 0.4),
    0 26px 60px rgba(0, 0, 0, 0.6),
    0 0 90px rgba(120, 255, 190, 0.14);
  transform: translateY(26px) scale(0.94) rotate(-1.2deg);
  opacity: 0;
  transition:
    transform 1100ms var(--e-suave) 160ms,
    opacity 800ms var(--e-suave) 160ms;
  scrollbar-width: none;
}
.noche .ne-carta::-webkit-scrollbar { display: none; }
.noche .ne-velo.is-abierto .ne-carta {
  transform: none;
  opacity: 1;
}

.noche .ne-carta p {
  margin: 0 0 0.9em;
  font-family: var(--tipo-mano);
  font-size: clamp(1rem, 4.4vw, 1.2rem);
  line-height: 1.75;
}
.noche .ne-carta p:last-of-type { margin-bottom: 0; }
.noche .ne-carta .ne-firma {
  margin-top: 1.3em;
  text-align: right;
  font-size: clamp(1.05rem, 4.8vw, 1.3rem);
  color: #8a3f52;
}
.noche .ne-carta .ne-sello {
  position: absolute;
  right: 18px;
  bottom: -18px;
  width: 52px; height: 52px;
  border-radius: 48% 52% 50% 46% / 50% 46% 54% 50%;
  background: radial-gradient(circle at 36% 30%, #4fd6a0, #1f9c6e 52%, #0d5c40 100%);
  box-shadow: 0 3px 10px rgba(6, 40, 28, 0.6), inset 0 -3px 8px rgba(6, 40, 28, 0.5);
  display: grid;
  place-items: center;
  font-family: var(--tipo-titulo);
  font-size: 0.95rem;
  color: rgba(8, 48, 34, 0.7);
  text-shadow: 0 1px 0 rgba(160, 255, 215, 0.4);
}

.noche .ne-cerrar {
  display: block;
  margin: 22px auto 0;
  padding: 0.62em 1.7em;
  border: 1px solid rgba(190, 205, 255, 0.3);
  border-radius: 999px;
  background: rgba(14, 20, 30, 0.5);
  color: #dfe6ff;
  font: inherit;
  font-size: 0.76rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 260ms var(--e-suave), border-color 260ms var(--e-suave);
}
.noche .ne-cerrar:hover { background: rgba(30, 40, 60, 0.6); border-color: rgba(190, 205, 255, 0.5); }
.noche .ne-cerrar:focus-visible { outline: 2px solid #9fb8ff; outline-offset: 3px; }

/* ── El botón de dormir, en la habitación ────────────────────────────── */

.noche .ne-dormir {
  position: absolute;
  left: 50%;
  bottom: calc(var(--seguro-b) + var(--barra) + 26px);
  transform: translateX(-50%) translateY(18px);
  z-index: 22;
  padding: 0.78em 2.1em;
  border: 1px solid rgba(190, 205, 255, 0.26);
  border-radius: 999px;
  background: rgba(12, 16, 30, 0.48);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #e2e8ff;
  font: inherit;
  font-size: 0.78rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 900ms var(--e-suave),
    transform 900ms var(--e-suave),
    visibility 900ms,
    background 300ms var(--e-suave);
}
.noche.is-habitacion .ne-dormir {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%);
}
.noche .ne-dormir:hover { background: rgba(28, 36, 62, 0.62); }
.noche .ne-dormir:focus-visible { outline: 2px solid #9fb8ff; outline-offset: 3px; }

/* ── Volver al bosque ────────────────────────────────────────────────── */

.noche .ne-volver {
  position: absolute;
  left: calc(var(--seguro-l) + 14px);
  top: calc(var(--seguro-t) + 14px);
  z-index: 22;
  width: 40px; height: 40px;
  border: 1px solid rgba(190, 205, 255, 0.2);
  border-radius: 50%;
  background: rgba(12, 16, 30, 0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #dfe6ff;
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transition: opacity 700ms var(--e-suave), visibility 700ms;
}
.noche.is-habitacion .ne-volver,
.noche.is-durmiendo .ne-volver { opacity: 1; visibility: visible; }
.noche .ne-volver:focus-visible { outline: 2px solid #9fb8ff; outline-offset: 3px; }

/* ── Los párpados (la transición de dormirse) ────────────────────────── */

/* Dos telones que bajan y suben. Con opacidad sola no se siente cerrar
   los ojos; con dos mitades que se juntan, sí. */
.noche .ne-parpados {
  position: absolute;
  inset: 0;
  z-index: 45;
  pointer-events: none;
}
.noche .ne-parpados i {
  position: absolute;
  left: -2%;
  width: 104%;
  height: 52%;
  background: #04060d;
  transition: transform 2600ms var(--e-cine);
}
.noche .ne-parpados .ne-arriba { top: 0;    transform: translateY(-100%); border-radius: 0 0 46% 46% / 0 0 18% 18%; }
.noche .ne-parpados .ne-abajo  { bottom: 0; transform: translateY(100%);  border-radius: 46% 46% 0 0 / 18% 18% 0 0; }
.noche.is-durmiendo .ne-parpados .ne-arriba,
.noche.is-durmiendo .ne-parpados .ne-abajo { transform: translateY(0); }

/* El texto del sueño, cuando ya está todo oscuro. */
.noche .ne-sueno {
  position: absolute;
  inset: 0;
  z-index: 46;
  display: grid;
  place-items: center;
  padding: 0 32px;
  box-sizing: border-box;
  text-align: center;
  font-family: var(--tipo-mano);
  font-size: clamp(1.05rem, 4.6vw, 1.36rem);
  line-height: 1.8;
  color: #cfd8f2;
  text-shadow: 0 0 30px rgba(140, 170, 255, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1800ms var(--e-suave) 1600ms;
}
.noche.is-durmiendo .ne-sueno { opacity: 0.92; }

/* ── El fogonazo de quemarse ─────────────────────────────────────────── */

.noche .ne-flash {
  position: absolute;
  inset: 0;
  z-index: 44;
  pointer-events: none;
  background: radial-gradient(ellipse 70% 60% at 50% 70%, rgba(255, 150, 60, 0.5), rgba(255, 90, 30, 0));
  opacity: 0;
}

/* ── Accesibilidad y rendimiento ─────────────────────────────────────── */

@media (prefers-reduced-motion: reduce) {
  .noche *,
  .noche *::before,
  .noche *::after {
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
  }
}

/* Sólo lectores de pantalla. */
.noche .ne-sr {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
</style>
</head>
<body>

<div class="noche" id="noche">

  <!-- El mundo entero se pinta aquí. -->
  <canvas class="ne-lienzo" id="lienzo" aria-hidden="true"></canvas>

  <!-- Y los dedos se recogen aquí, por encima. -->
  <div class="ne-toque" id="toque" aria-hidden="true"></div>

  <!-- Las frases que van saliendo. -->
  <div class="ne-dichos" id="dichos" aria-hidden="true"></div>

  <!-- Lo que se lee de verdad, para quien use lector de pantalla. -->
  <p class="ne-sr" id="vivo" role="status" aria-live="polite"></p>

  <p class="ne-pista-panel" id="pistaPanel">toca las piedras para el sonido</p>

  <button class="ne-volver" id="volver" type="button" aria-label="Volver al bosque">‹</button>
  <button class="ne-dormir" id="dormir" type="button">Dormir</button>

  <div class="ne-flash" id="flash" aria-hidden="true"></div>

  <div class="ne-parpados" aria-hidden="true">
    <i class="ne-arriba"></i><i class="ne-abajo"></i>
  </div>
  <p class="ne-sueno" id="sueno" aria-hidden="true"></p>

  <!-- La carta escondida en el bosque. -->
  <div class="ne-velo" id="velo" role="dialog" aria-modal="true" aria-labelledby="cartaTexto" aria-hidden="true">
    <div>
      <article class="ne-carta" id="carta">
        <div id="cartaTexto"></div>
        <span class="ne-sello" aria-hidden="true">y.m</span>
      </article>
      <button class="ne-cerrar" id="cerrarCarta" type="button">Guardarla</button>
    </div>
  </div>

  <!-- La puerta de entrada: hace falta un toque para que el navegador
       deje sonar el audio, así que se aprovecha para presentar la noche. -->
  <div class="ne-entrada" id="entrada" role="button" tabindex="0" aria-label="Entrar en la noche">
    <div>
      <h1>Noche estrellada</h1>
      <p>Una fogata, una cabaña y el cielo entero.<br>Quédate el rato que quieras.</p>
      <span class="ne-pulso">tocar para entrar</span>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════════════

   NOCHE ESTRELLADA

   Una noche en el bosque, junto a una fogata, cerca de una cabaña.

   Todo está aquí dentro: no descarga ninguna librería, ninguna imagen y
   ninguna fuente. Los únicos archivos de fuera son los de sonido, y si
   no están, se sintetizan (ver el SISTEMA DE AUDIO).

   El código va por módulos, en este orden:

       CONFIGURACIÓN
       UTILIDADES
       ESCENA Y MEDIDAS          (el lienzo, el parallax, la cámara)
       SISTEMA DE AUDIO
       SISTEMA DE PARTÍCULAS
       FOGATA
       SISTEMA DE BOMBONES
       PANEL DE AMBIENTES
       CAJITA MUSICAL
       CABAÑA
       CINEMÁTICA
       HABITACIÓN
       LUNA
       EASTER EGGS
       CARTA
       SISTEMA DE INTERACCIÓN
       DIBUJO DEL BOSQUE
       RESPONSIVE
       OPTIMIZACIÓN
       BUCLE Y ARRANQUE

   ══════════════════════════════════════════════════════════════════════ */

(() => {
"use strict";

// ==========================================
// CONFIGURACIÓN
// ==========================================
//
// Todo lo que se puede cambiar sin entender nada de lo demás: las frases,
// los colores, los números y las rutas de los sonidos.

const CONF = {

  /* ---- LAS RUTAS DE LOS SONIDOS ---------------------------------------
     Son EXACTAMENTE las que pediste. No las cambies de sitio: el código
     busca aquí y nada más.

     Si un archivo no está, no pasa nada: ese sonido se sintetiza con la
     Web Audio API y la experiencia funciona igual. Cuando dejes el mp3
     en su carpeta, se usa el tuyo sin tocar una línea.                  */
  rutas: {
    musica: "musica.mp3",
    /* Y si ahí no está, se mira en estos otros sitios antes de rendirse
       y tocar la nana sintetizada. El primero sigue mandando siempre:
       esto es sólo para que una canción que ya esté en el proyecto suene
       sin tener que copiarla dos veces. */
    musicaTambien: [
      "../assets/audio/musica.mp3",
      "../assets/audio/Musica.mp3",
    ],
    /* El sonido del búho. Va en la carpeta principal, al lado de
       `musica.mp3`. Si no está, se sintetiza uno. */
    misterio: "misterio.mp3",
    cabana: {
      puertaAbre:  "Cabaña/door.open.mp3",
      puertaCierra:"Cabaña/door.close.mp3",
      escaleras:   "Cabaña/escaleras.mp3",
      cuarto:      "Cabaña/cuarto.mp3",
      cama:        "Cabaña/cama.mp3",
    },
    ambientes: {
      fogata:     "audio/fogata.mp3",
      grillos:    "audio/grillos.mp3",
      aire:       "audio/aire.mp3",
      lluvia:     "audio/lluvia.mp3",
      relampagos: "audio/relampagos.mp3",
      bosque:     "audio/bosque.mp3",
    },
  },

  /* ---- LOS AMBIENTES DEL PANEL ----------------------------------------
     El orden de aquí es el orden de las piedras alrededor de la fogata.
     `on` dice cuáles empiezan sonando, y `vol` con cuánto volumen.     */
  ambientes: [
    { id: "fogata",     icono: "🔥", nombre: "Fogata",   on: true,  vol: 0.55, color: "#ff9a4a" },
    { id: "grillos",    icono: "🦗", nombre: "Grillos",  on: true,  vol: 0.40, color: "#9fe08a" },
    { id: "aire",       icono: "🌬️", nombre: "Aire",     on: true,  vol: 0.30, color: "#a8c8f0" },
    { id: "bosque",     icono: "🌲", nombre: "Bosque",   on: false, vol: 0.35, color: "#6fb88a" },
    { id: "lluvia",     icono: "🌧️", nombre: "Lluvia",   on: false, vol: 0.40, color: "#8fb4e0" },
    { id: "relampagos", icono: "⚡", nombre: "Tormenta", on: false, vol: 0.45, color: "#e0d08a" },
  ],

  /* Cuánto tardan los volúmenes en subir y bajar. Nunca de golpe: un
     ambiente que entra a saco se oye como un fallo, no como un ambiente. */
  fundidoAudio: 1.1,        // segundos

  /* ---- EL BOMBÓN ------------------------------------------------------
     Los estados van por temperatura, de 0 a 1 y un poco más allá. Cada
     uno tiene su color y lo que se dice al comérselo.                  */
  bombon: {
    /* Cuánto se tuesta por segundo una cara puesta de lleno en la
       llama. Con 0.22, un bombón bien hecho son unos cinco segundos de
       fuego: lo justo para que dé tiempo a girarlo y no tan largo como
       para que aburra. */
    calienta: 0.22,
    enfria: 0.055,          // cuánto baja por segundo lejos del fuego
    radioCalor: 1.0,        // en unidades de radio de fogata

    /* ---- LA FÍSICA ----
       El palo es una varilla con inercia colgada del mango, y el bombón
       cuelga de su punta con un muelle corto. Estos números son todo lo
       que hay que tocar para que se sienta más pesado o más ágil. */

// UTILIDADES

const azar   = (a, b) => a + Math.random() * (b - a);
const clamp  = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = (v) => clamp(v, 0, 1);
const mez    = (a, b, t) => a + (b - a) * t;
const suave3 = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };

/**
 * Amortiguación independiente de los fotogramas.
 *
 * `actual += (objetivo - actual) * 0.1` es la forma de siempre y está
 * MAL: a 120 Hz llega al doble de rápido que a 60. Con la exponencial,
 * el mismo recorrido en el mismo tiempo en cualquier pantalla.
 */
const damp = (actual, objetivo, k, dt) => objetivo + (actual - objetivo) * Math.exp(-k * dt);

/**
 * Lee un color y devuelve sus tres canales.
 *
 * Entiende `#rrggbb` Y `rgb(r,g,b)`, y esto último no es un capricho:
 * `mezColor` devuelve `rgb(...)`, así que en cuanto se mezcla el
 * resultado de otra mezcla —que es justo lo que hace el bombón al
 * interpolar dentro de su estado— hay que saber volver a leerlo. Con un
 * lector que sólo entendía hexadecimal, salía `rgb(NaN,NaN,…)`.
 */
function leerColor(c) {
  if (c[0] === "#") {
    return [
      parseInt(c.slice(1, 3), 16),
      parseInt(c.slice(3, 5), 16),
      parseInt(c.slice(5, 7), 16),
    ];
  }
  const n = c.match(/[\d.]+/g);
  return n ? [Number(n[0]), Number(n[1]), Number(n[2])] : [0, 0, 0];
}

/**
 * Un halo OVALADO, con el degradado ovalado también.
 *
 * ── EL FALLO QUE ARREGLA ─────────────────────────────────────────────
 * Lo natural es pedir un degradado radial y rellenar con él una elipse
 * aplastada. Pero un degradado radial es un CÍRCULO: si su radio es 275
 * y la elipse sólo mide 92 de alto, arriba y abajo la elipse se acaba
 * cuando el degradado va por su tercera parte —todavía casi opaco— y lo
 * que se ve es el CANTO de la elipse recortado en seco. En la escena
 * salía un arco gris enorme colgando de la cabaña, como un aro.
 *
 * La solución es no aplastar el relleno sino el LIENZO: se escala el
 * eje Y, se pinta un círculo de verdad y se deshace la escala. Así el
 * degradado se aplasta con la forma y se apaga justo en el borde.
 */
function haloOvalado(x, y, rx, ry, paradas, cy = y) {
  ctx.save();
  ctx.translate(x, cy);
  ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, (y - cy) * (rx / ry), 0, 0, (y - cy) * (rx / ry), rx);
  for (const [t, col] of paradas) g.addColorStop(t, col);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, rx, 0, 6.283);
  ctx.fill();
  ctx.restore();
}

/** Mezcla dos colores. Vale hexadecimal, `rgb(…)` o una mezcla de ambos. */
function mezColor(c1, c2, t) {
  const [r1, g1, b1] = leerColor(c1), [r2, g2, b2] = leerColor(c2);
  return `rgb(${Math.round(mez(r1, r2, t))},${Math.round(mez(g1, g2, t))},${Math.round(mez(b1, b2, t))})`;
}

/** Un azar REPETIBLE: el mismo bosque cada vez que se mide la pantalla. */
let semilla = 20240214;
function rnd() {
  semilla = (semilla * 1664525 + 1013904223) % 4294967296;
  return semilla / 4294967296;
}
const sembrar = (s) => { semilla = s; };

/**
 * Saca uno de una lista SIN repetir hasta agotarla.
 *
 * Con `Math.random()` a secas salían dos veces seguidas la misma frase
 * cada dos por tres, y una frase repetida mata el encanto al instante.
 */
function barajador(lista) {
  let bolsa = [];
  return () => {
    if (!bolsa.length) bolsa = lista.slice();
    const i = Math.floor(Math.random() * bolsa.length);
    return bolsa.splice(i, 1)[0];
  };
}

// El lienzo, el tamaño, el parallax y la cámara. Todo lo que se dibuja
// se mide contra `U`, que es la centésima parte del lado corto: así la
// escena entera se adapta a cualquier pantalla sin un solo número
// escrito a mano en píxeles.

const raiz   = document.getElementById("noche");
const lienzo = document.getElementById("lienzo");
const zona   = document.getElementById("toque");
const ctx    = lienzo.getContext("2d", { alpha: false });

let A = 0, H = 0, dpr = 1, U = 1;
let apaisado = false;
let flojo = false;                 // el móvil no da: ver OPTIMIZACIÓN

/* El parallax: hacia dónde mira la escena, de -1 a 1. */
const par = { x: 0, y: 0, ox: 0, oy: 0 };

/* La cámara de las cinemáticas: escala y desplazamiento. */
const cam = { z: 1, x: 0, y: 0, oz: 1, ox: 0, oy: 0 };

/* La sacudida (al quemarse, al caer un rayo). */
const meneo = { fuerza: 0, t: 0 };

/* En qué escena estamos. */

let bloqueado = false;             // durante una cinemática no se toca nada

function medir() {
  const r = raiz.getBoundingClientRect();
  if (!r.width || !r.height) return;
  A = r.width; H = r.height;
  apaisado = A > H * 1.15;
  U = Math.min(A, H) / 100;
  dpr = Math.min(window.devicePixelRatio || 1, flojo ? CONF.perf.dprMaxFlojo : CONF.perf.dprMax);
  lienzo.width  = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  construirMundo();
}

 *
 * Si esta página va suelta, es el margen seguro del móvil (la barra de
 * gestos). Si va dentro del librito, él además presta `--hueco-barra`
 * con lo que ocupa su barra flotante y sus flechas de pasar página.
 *
 * Sin esto, las piedras de los ambientes caían justo debajo de las
 * flechas del libro y no se podían tocar.
 */
function huecoAbajo() {
  const cs = getComputedStyle(raiz);
  const leer = (n) => {
    const v = cs.getPropertyValue(n).trim();
    if (!v) return 0;
    if (v.endsWith("rem")) return parseFloat(v) * 16;
    return parseFloat(v) || 0;
  };
  return leer("--seguro-b") + leer("--barra");
}

function colocarSitios() {
  const abajo = huecoAbajo();
  sitio.horizonte = H * (apaisado ? 0.56 : 0.60);
  sitio.suelo     = H * (apaisado ? 0.74 : 0.78) - abajo * 0.5;

  /* La fogata, en el centro-bajo: es el corazón de la escena y todo lo
     demás se ordena alrededor. */
  sitio.fogata.x = A * (apaisado ? 0.44 : 0.50);
  /* La fogata sube lo que ocupe la barra del libro: con ella y el arco
     de piedras pegados al canto, las flechas de pasar página caían
     justo encima y no se podía tocar ninguna. */
  sitio.fogata.y = H * (apaisado ? 0.775 : 0.845) - abajo * 0.9;
  sitio.fogata.r = U * (apaisado ? 7.4 : 8.4);

  /* La cabaña, a un lado, plantada en el suelo. */
  const ladoCabana = apaisado ? 0.80 : 0.755;
  sitio.cabana.w = U * (apaisado ? 26 : 32);
  sitio.cabana.h = sitio.cabana.w * 0.82;
  sitio.cabana.x = A * ladoCabana;
  sitio.cabana.y = sitio.suelo - U * 2;

  /* La luna, arriba y al otro lado, para que no compita con la cabaña. */
  sitio.luna.x = A * 0.21;
  sitio.luna.y = H * (apaisado ? 0.17 : 0.155);
  sitio.luna.r = U * (apaisado ? 6.6 : 7.2);

  /* La cajita musical, en una piedra al lado de la fogata. */
  sitio.cajita.x = sitio.fogata.x - U * (apaisado ? 19 : 22);
  sitio.cajita.y = sitio.fogata.y + U * 2.6;
  sitio.cajita.r = U * 5.4;

  /* Y la luz verde, metida en el bosque. */
  sitio.secreto.x = A * CONF.bosqueSecreto.x;
  sitio.secreto.y = mez(sitio.horizonte, sitio.suelo, 0.42);
  sitio.secreto.r = U * 5;
}

/* ---- El parallax ------------------------------------------------------
   Todas las capas se desplazan con `par`, cada una con su factor: las
   de atrás casi nada, las de delante mucho. Eso es TODA la profundidad
   de esta escena, y no cuesta nada.                                    */

function desplazar(factor) {
  return {
    x: par.x * U * factor,
    y: par.y * U * factor * 0.42,
  };
}

/* ---- La sacudida ------------------------------------------------------ */

function sacudir(fuerza) {
  meneo.fuerza = Math.max(meneo.fuerza, fuerza);
  meneo.t = 0;
}

/* ---- Frases flotantes -------------------------------------------------
   Se crean unas cuantas cajas y se reciclan. En una escena que puede
   soltar varias por segundo, crear y tirar nodos hace saltar el
   recolector justo encima de una animación.                            */

const capaDichos = document.getElementById("dichos");
const elVivo     = document.getElementById("vivo");
const librasDichos = [];
const dichosVivos  = [];

for (let i = 0; i < 7; i++) {
  const el = document.createElement("div");
  el.className = "ne-dicho";
  capaDichos.append(el);
  librasDichos.push(el);
}

/**
 * Suelta una frase en (x, y).
 *
 * @param {number} x  dónde, en píxeles
 * @param {number} y  dónde, en píxeles
 * @param {string} texto
 * @param {{mimo?:boolean, dur?:number, importante?:boolean}} [op]
 */
function decir(x, y, texto, op = {}) {
  elVivo.textContent = texto;

  let el = librasDichos.pop();

  /* Las importantes NUNCA se pierden. Si no queda ninguna caja libre,
     le quita el sitio a la más vieja de las corrientes: un secreto que
     se dispara y no se ve no es un secreto, es una frase tirada. */
  if (!el && op.importante) {
    let viejo = -1, masT = -1;
    for (let i = 0; i < dichosVivos.length; i++) {
      if (dichosVivos[i].importante) continue;
      if (dichosVivos[i].t > masT) { masT = dichosVivos[i].t; viejo = i; }
    }
    if (viejo >= 0) { el = dichosVivos[viejo].el; dichosVivos.splice(viejo, 1); }
  }
  if (!el) return;

  el.textContent = texto;
  el.classList.toggle("ne-mimo", !!op.mimo);
  el.style.opacity = "0";

  /* El margen sale del ANCHO REAL de la caja, medido ya con su texto:
     una frase larga centrada se sale por el canto si se usa un margen
     fijo, porque lo que hay que dejar libre es media caja. */
  const medio = el.offsetWidth / 2 + 10;
  const alto  = el.offsetHeight || 36;
  const px = clamp(x, medio, Math.max(medio, A - medio));

  /* Y se busca una fila libre de verdad, contando lo que va a subir
     mientras se apaga. Escalonar por turnos reparte pero no comprueba
     nada, y dos frases se acaban pisando. */
  let py = null;
  for (let f = 0; f < 5 && py === null; f++) {
    const cand = clamp(y - U * 7 - f * (alto + 10), U * 9, H - U * 12);
    let libre = true;
    for (const v of dichosVivos) {
      if (Math.abs(px - v.x) < medio + v.medio && Math.abs(cand - v.y) < (alto + v.alto) * 0.5 + 26) {
        libre = false; break;
      }
    }
    if (libre) py = cand;
  }
  if (py === null) py = clamp(y - U * 7, U * 9, H - U * 12);

  dichosVivos.push({
    el, x: px, y: py, medio, alto,
    t: 0, dur: op.dur ?? (op.importante ? 5.4 : 3.6),
    deriva: azar(-8, 8),
    importante: !!op.importante,
  });
}

function moverDichos(dt) {
  for (let i = dichosVivos.length - 1; i >= 0; i--) {
    const d = dichosVivos[i];
    d.t += dt;
    const k = d.t / d.dur;
    if (k >= 1) {
      d.el.style.opacity = "0";
      librasDichos.push(d.el);
      dichosVivos.splice(i, 1);
      continue;
    }
    const entra = suave3(k / 0.12);
    const sale  = 1 - suave3((k - 0.72) / 0.28);
    const sube  = (1 - Math.pow(1 - clamp01(k / 0.85), 3)) * 22;
    const bal   = Math.sin(d.t * 1.4) * 3;
    d.el.style.opacity = String(entra * sale);
    d.el.style.transform =
      `translate3d(${(d.x + d.deriva * k + bal).toFixed(1)}px, ${(d.y - sube).toFixed(1)}px, 0)` +
      ` translate(-50%, -50%) scale(${(0.92 + entra * 0.08).toFixed(3)})`;
  }
}

// ==========================================
// SISTEMA DE AUDIO
// ==========================================
//
// ── POR QUÉ CADA SONIDO TIENE UN GEMELO SINTETIZADO ──────────────────
//
// Las rutas de los mp3 son las que pediste y no se tocan. Pero un mp3
// puede no estar todavía, puede fallar la red o puede que el navegador
// no sepa descodificarlo. Si eso deja la noche en silencio, la mitad de
// la experiencia se cae por un archivo que falta.
//
// Así que cada ambiente y cada efecto tiene DOS formas de sonar:
//
//   1. el archivo, que es la buena y la que manda;
//   2. un gemelo hecho con la Web Audio API, que entra si el archivo no
//      está.
//
// El resto del código no sabe cuál está sonando: pide «fogata» y suena
// fogata. Cuando dejes tus mp3 en su carpeta, se usan los tuyos sin
// cambiar una línea.
//
// ── CÓMO SUENA CADA AMBIENTE SINTETIZADO ─────────────────────────────
// Ninguno es un tono: son ruidos filtrados, que es de lo que están
// hechos los sonidos de la naturaleza.
//
//   · fogata     ruido rosa grave + chasquidos sueltos
//   · grillos    pulsos agudos muy cortos, en grupos
//   · aire       ruido rosa con un filtro que se abre y se cierra
//   · bosque     aire flojito + hojas + algún pájaro lejano
//   · lluvia     ruido blanco filtrado, denso
//   · relámpagos ruido muy grave con envolvente de tres picos

const audio = {
  ctx: null,
  maestro: null,
  listo: false,
  buffers: new Map(),      // ruta → AudioBuffer (o null si no se pudo)
  canales: new Map(),      // id → { gain, fuente, vol, on }
};

function despertarAudio() {
  if (audio.ctx) {
    if (audio.ctx.state === "suspended") audio.ctx.resume();
    return audio.ctx;
  }
  try {
    audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    audio.maestro = audio.ctx.createGain();
    audio.maestro.gain.value = 0.9;
    audio.maestro.connect(audio.ctx.destination);
    audio.listo = true;
  } catch {
    audio.ctx = null;
  }
  return audio.ctx;
}

/**
 * Trae un archivo y lo descodifica. Si falla, devuelve null y el que
 * llama usa el gemelo sintetizado. Nunca lanza.
 */
async function traerBuffer(ruta) {
  if (audio.buffers.has(ruta)) return audio.buffers.get(ruta);
  if (!despertarAudio()) return null;
  try {
    const r = await fetch(ruta);
    if (!r.ok) throw new Error(String(r.status));
    const datos = await r.arrayBuffer();
    /* Algunos navegadores viejos sólo tienen la forma con callbacks. */
    const buf = await new Promise((res, rej) => {
      const p = audio.ctx.decodeAudioData(datos, res, rej);
      if (p && p.then) p.then(res, rej);
    });
    audio.buffers.set(ruta, buf);
    return buf;
  } catch {
    audio.buffers.set(ruta, null);
    return null;
  }
}

/* ---- Los generadores de ruido -----------------------------------------
   Se hacen una vez y se guardan: crear tres segundos de ruido cuesta
   unos milisegundos, y hacerlo en mitad de una animación se nota.    */

const ruidos = new Map();

/** Ruido blanco: todas las frecuencias por igual. Suena a estática. */
function bufferBlanco(seg) {
  const clave = `b${seg}`;
  if (ruidos.has(clave)) return ruidos.get(clave);
  const n = Math.floor(audio.ctx.sampleRate * seg);
  const buf = audio.ctx.createBuffer(1, n, audio.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  ruidos.set(clave, buf);
  return buf;
}

/**
 * Ruido rosa de pobre: blanco pasado por un filtro de un polo.
 *
 * Suena muchísimo más a naturaleza que el blanco —viento, fuego, mar—
 * porque tiene más energía en los graves, igual que el mundo real.
 */
function bufferRosa(seg, k = 0.96) {
  const clave = `r${seg}_${k}`;
  if (ruidos.has(clave)) return ruidos.get(clave);
  const n = Math.floor(audio.ctx.sampleRate * seg);
  const buf = audio.ctx.createBuffer(1, n, audio.ctx.sampleRate);
  const d = buf.getChannelData(0);
  let ult = 0;
  for (let i = 0; i < n; i++) {
    const blanco = Math.random() * 2 - 1;
    ult = k * ult + (1 - k) * blanco;
    d[i] = ult * (1 / (1 - k)) * 0.12;
  }
  ruidos.set(clave, buf);
  return buf;
}

/**
 * Los gemelos sintetizados de cada ambiente.
 *
 * Cada uno devuelve un nodo que ya está sonando en bucle; el llamante
 * sólo tiene que conectarlo a su ganancia.
 */
const sintetizar = {

  fogata() {
    const c = audio.ctx;
    const salida = c.createGain();
    /* El cuerpo: ruido rosa grave, que es el rumor de la leña. */
    const src = c.createBufferSource();
    src.buffer = bufferRosa(4, 0.97);
    src.loop = true;
    const f = c.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = 620;
    src.connect(f).connect(salida);
    src.start();
    /* Y los chasquidos, que son lo que la hace fuego y no viento. Van
       por su cuenta, a ratos, y se paran con el canal. */
    const reloj = setInterval(() => {
      if (!audio.ctx) return;
      const t = c.currentTime;
      const n = Math.floor(c.sampleRate * 0.05);
      const b = c.createBuffer(1, n, c.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6);
      const s = c.createBufferSource(); s.buffer = b;
      const bf = c.createBiquadFilter();
      bf.type = "bandpass"; bf.frequency.value = azar(900, 2600); bf.Q.value = 1.2;
      const g = c.createGain(); g.gain.value = azar(0.05, 0.22);
      s.connect(bf).connect(g).connect(salida);
      s.start(t);
    }, 420);
    salida._parar = () => { clearInterval(reloj); try { src.stop(); } catch {} };
    return salida;
  },

  grillos() {
    const c = audio.ctx;
    const salida = c.createGain();
    /* Un grillo es un pulso agudísimo repetido en grupos de tres o
       cuatro. Varios grillos desfasados hacen el campo entero. */
    const reloj = setInterval(() => {
      if (!audio.ctx) return;
      const base = c.currentTime + azar(0, 0.4);
      const cuantos = 3 + Math.floor(Math.random() * 3);
      const hz = azar(3800, 5200);
      for (let k = 0; k < cuantos; k++) {
        const t = base + k * 0.062;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(hz, t);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(azar(0.03, 0.07), t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
        o.connect(g).connect(salida);
        o.start(t); o.stop(t + 0.05);
      }
    }, 640);
    salida._parar = () => clearInterval(reloj);
    return salida;
  },

  aire() {
    const c = audio.ctx;
    const salida = c.createGain();
    const src = c.createBufferSource();
    src.buffer = bufferRosa(5, 0.95);
    src.loop = true;
    const f = c.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 480;
    f.Q.value = 0.55;
    /* El filtro se abre y se cierra muy despacio: eso son las rachas.
       Sin ese vaivén el viento suena a ventilador. */
    const lfo = c.createOscillator();
    const lfoG = c.createGain();
    lfo.frequency.value = 0.07;
    lfoG.gain.value = 300;
    lfo.connect(lfoG).connect(f.frequency);
    lfo.start();
    src.connect(f).connect(salida);
    src.start();
    salida._parar = () => { try { src.stop(); lfo.stop(); } catch {} };
    return salida;
  },

  bosque() {
    const c = audio.ctx;
    const salida = c.createGain();
    /* Hojas: ruido agudo y muy flojito, con su propio vaivén. */
    const src = c.createBufferSource();
    src.buffer = bufferRosa(5, 0.88);
    src.loop = true;
    const f = c.createBiquadFilter();
    f.type = "highpass";
    f.frequency.value = 1800;
    const g = c.createGain();
    g.gain.value = 0.5;
    src.connect(f).connect(g).connect(salida);
    src.start();
    /* Y algún pájaro lejano de vez en cuando: dos notas que bajan. */
    const reloj = setInterval(() => {
      if (!audio.ctx || Math.random() > 0.35) return;
      const t = c.currentTime;
      const hz = azar(1400, 2400);
      for (let k = 0; k < 2; k++) {
        const o = c.createOscillator();
        const gg = c.createGain();
        const ft = c.createBiquadFilter();
        ft.type = "lowpass"; ft.frequency.value = 3000;
        o.type = "sine";
        o.frequency.setValueAtTime(hz * (k ? 0.78 : 1), t + k * 0.18);
        o.frequency.exponentialRampToValueAtTime(hz * (k ? 0.68 : 0.88), t + k * 0.18 + 0.12);
        gg.gain.setValueAtTime(0, t + k * 0.18);
        gg.gain.linearRampToValueAtTime(0.035, t + k * 0.18 + 0.02);
        gg.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.18 + 0.2);
        o.connect(ft).connect(gg).connect(salida);
        o.start(t + k * 0.18); o.stop(t + k * 0.18 + 0.25);
      }
    }, 3400);
    salida._parar = () => { clearInterval(reloj); try { src.stop(); } catch {} };
    return salida;
  },

  lluvia() {
    const c = audio.ctx;
    const salida = c.createGain();
    const src = c.createBufferSource();
    src.buffer = bufferBlanco(4);
    src.loop = true;
    /* Pasa-banda ancho arriba: la lluvia es casi todo agudo, y lo grave
       que tiene es el rebote en el suelo. */
    const f = c.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 2400;
    f.Q.value = 0.4;
    const g = c.createGain();
    g.gain.value = 0.55;
    src.connect(f).connect(g).connect(salida);
    src.start();
    salida._parar = () => { try { src.stop(); } catch {} };
    return salida;
  },

  relampagos() {
    const c = audio.ctx;
    const salida = c.createGain();
    /* Truenos sueltos. Cada uno avisa a la escena para que dé el
       fogonazo a la vez: el rayo y el trueno van juntos aquí porque
       la tormenta está encima. */
    const reloj = setInterval(() => {
      if (!audio.ctx || Math.random() > 0.3) return;
      /* El ambiente de tormenta ya no pinta nada por su cuenta: avisa
         al clima y él decide a qué distancia cae el rayo, cuándo llega
         el trueno y cómo se ilumina el bosque. */
      lanzarRayo();
    }, 5200);
    salida._parar = () => clearInterval(reloj);
    return salida;
  },
};

/**
 * Un trueno. No es un golpe: es ruido muy grave que RUEDA, con una
 * envolvente de tres picos —el golpe y los dos rebotes en las nubes—.
 */
function truenoSintetizado(destino, fuerza) {
  const c = audio.ctx;
  const t = c.currentTime;
  const dur = 2.2;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  let u1 = 0, u2 = 0;
  for (let i = 0; i < n; i++) {
    const k = i / n;
    const blanco = Math.random() * 2 - 1;
    u1 = 0.96 * u1 + 0.04 * blanco;
    u2 = 0.9 * u2 + 0.1 * u1;
    const golpe  = Math.exp(-k * 13);
    const rueda  = Math.exp(-k * 2.1) * (0.6 + 0.4 * Math.sin(k * 20));
    const rueda2 = Math.exp(-k * 1.0) * 0.45 * (0.5 + 0.5 * Math.sin(k * 8));
    d[i] = u2 * 13 * (golpe + rueda + rueda2);
  }
  const src = c.createBufferSource();
  src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.value = 520;
  const g = c.createGain();
  g.gain.value = 0.85 * fuerza;
  src.connect(f).connect(g).connect(destino || audio.maestro);
  src.start(t);
}

/* ---- Los canales de ambiente ------------------------------------------
   Un canal por ambiente, con su ganancia propia. Encender y apagar es
   mover esa ganancia con una rampa, nunca de golpe.                   */

async function abrirCanal(id) {
  if (!despertarAudio()) return null;
  if (audio.canales.has(id)) return audio.canales.get(id);

  const conf = CONF.ambientes.find((a) => a.id === id);
  const gain = audio.ctx.createGain();
  gain.gain.value = 0;
  gain.connect(audio.maestro);

  const canal = { gain, fuente: null, vol: conf ? conf.vol : 0.5, on: false, sintetico: false };
  audio.canales.set(id, canal);

  /* Primero el archivo. Si está, manda. */
  const ruta = CONF.rutas.ambientes[id];
  const buf = ruta ? await traerBuffer(ruta) : null;

  if (buf) {
    const src = audio.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(gain);
    src.start();
    canal.fuente = src;
  } else if (sintetizar[id]) {
    /* Y si no, el gemelo. */
    const nodo = sintetizar[id]();
    nodo.connect(gain);
    canal.fuente = nodo;
    canal.sintetico = true;
  }
  return canal;
}

/** Enciende o apaga un ambiente, siempre con fundido. */
async function ambiente(id, encendido, vol) {
  const canal = await abrirCanal(id);
  if (!canal) return;
  canal.on = encendido;
  if (vol !== undefined) canal.vol = clamp01(vol);
  const destino = encendido ? canal.vol : 0;
  const t = audio.ctx.currentTime;
  canal.gain.gain.cancelScheduledValues(t);
  canal.gain.gain.setValueAtTime(canal.gain.gain.value, t);
  canal.gain.gain.linearRampToValueAtTime(destino, t + CONF.fundidoAudio);
}

/** Cambia el volumen de un ambiente que ya está sonando. */
function volumen(id, vol) {
  const canal = audio.canales.get(id);
  if (!canal) return;
  canal.vol = clamp01(vol);
  /* El volumen de la lluvia ES la intensidad de la lluvia: subirle el
     sonido moja más. Que las dos cosas sean el mismo número es lo que
     hace que el panel se sienta parte del mundo y no un mezclador. */
  if (typeof sincronizarClima === "function") sincronizarClima();
  if (!canal.on) return;
  const t = audio.ctx.currentTime;
  canal.gain.gain.cancelScheduledValues(t);
  canal.gain.gain.setValueAtTime(canal.gain.gain.value, t);
  canal.gain.gain.linearRampToValueAtTime(canal.vol, t + 0.22);
}

/** Baja todos los ambientes a la vez (para las cinemáticas). */
function agacharAmbientes(k, seg = 0.8) {
  for (const [, canal] of audio.canales) {
    if (!canal.on) continue;
    const t = audio.ctx.currentTime;
    canal.gain.gain.cancelScheduledValues(t);
    canal.gain.gain.setValueAtTime(canal.gain.gain.value, t);
    canal.gain.gain.linearRampToValueAtTime(canal.vol * k, t + seg);
  }
}

/* ---- Sonidos sueltos ---------------------------------------------------- */

/**
 * Toca un archivo una vez y AVISA CUANDO TERMINA DE VERDAD.
 *
 * Esto es lo que necesita la cinemática de la cabaña: los sonidos van
 * uno detrás de otro respetando su duración real, sin cortar ninguno.
 * Por eso se resuelve con `onended` y no con un temporizador a ojo.
 *
 * Si el archivo no está, suena el gemelo que se le pase y la promesa se
 * resuelve con su duración.
 *
 * @returns {Promise<void>}
 */
async function tocarUnaVez(ruta, gemelo, vol = 1) {
  if (!despertarAudio()) { if (gemelo) return gemelo(); return; }
  const buf = await traerBuffer(ruta);
  if (!buf) return gemelo ? gemelo() : undefined;

  return new Promise((resolver) => {
    const src = audio.ctx.createBufferSource();
    src.buffer = buf;
    const g = audio.ctx.createGain();
    g.gain.value = vol;
    src.connect(g).connect(audio.maestro);
    src.onended = () => resolver();
    src.start();
    /* Red de seguridad: si `onended` no llega (pasa en algún navegador
       si se suspende el contexto), se sigue adelante igual. */
    setTimeout(resolver, (buf.duration + 0.6) * 1000);
  });
}

/** Un tono corto, para los toques. */
function tono(hz, dur = 0.5, tipo = "sine", vol = 0.09, cuando = 0) {
  if (!despertarAudio()) return;
  const t = audio.ctx.currentTime + cuando;
  const o = audio.ctx.createOscillator();
  const g = audio.ctx.createGain();
  o.type = tipo;
  o.frequency.setValueAtTime(hz, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.maestro);
  o.start(t); o.stop(t + dur + 0.05);
}

/** Un golpe de ruido, para los pasos, las puertas y los chasquidos. */
function golpe(dur = 0.12, hzFiltro = 1200, vol = 0.2, tipoFiltro = "bandpass") {
  if (!despertarAudio()) return;
  const c = audio.ctx;
  const t = c.currentTime;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = c.createBufferSource();
  src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = tipoFiltro;
  f.frequency.value = hzFiltro;
  const g = c.createGain();
  g.gain.value = vol;
  src.connect(f).connect(g).connect(audio.maestro);
  src.start(t);
}

/** Una campanita mágica: tres tonos que suben, muy filtrados. */
function magia(base = 660) {
  [0, 4, 7, 12].forEach((s, i) => {
    tono(base * Math.pow(2, s / 12), 1.4 - i * 0.12, "sine", 0.06, i * 0.09);
  });
}

/* Los gemelos de los sonidos de la cabaña. Cada uno devuelve una
   promesa que dura lo que dura el sonido, igual que el archivo. */
const gemelosCabana = {
  async puertaAbre() {
    /* Una puerta que se abre: el chirrido de la bisagra y el pomo. */
    golpe(0.06, 2600, 0.16, "highpass");
    await esperar(120);
    if (despertarAudio()) {
      const c = audio.ctx, t = c.currentTime;
      const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
      f.type = "bandpass"; f.frequency.value = 900; f.Q.value = 4;
      o.type = "sawtooth";
      o.frequency.setValueAtTime(180, t);
      o.frequency.linearRampToValueAtTime(96, t + 0.9);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.05, t + 0.15);
      g.gain.linearRampToValueAtTime(0, t + 1.0);
      o.connect(f).connect(g).connect(audio.maestro);
      o.start(t); o.stop(t + 1.1);
    }
    await esperar(1000);
  },
  async puertaCierra() {
    await esperar(160);
    golpe(0.2, 220, 0.34, "lowpass");
    golpe(0.05, 3000, 0.1, "highpass");
    await esperar(700);
  },
  async escaleras() {
    /* Seis peldaños de madera, cada uno un poco distinto. */
    for (let i = 0; i < 6; i++) {
      golpe(0.1, azar(200, 420), azar(0.16, 0.26), "lowpass");
      golpe(0.04, azar(1800, 3200), 0.05, "highpass");
      await esperar(azar(390, 520));
    }
  },
  async cuarto() {
    /* El silencio de una habitación no es silencio: es un zumbido
       gravísimo y una madera que cruje. */
    tono(58, 2.4, "sine", 0.05);
    await esperar(900);
    golpe(0.18, 300, 0.08, "lowpass");
    await esperar(1300);
  },
  async cama() {
    /* Sábanas: ruido agudo con una envolvente de seno, no de golpe. */
    if (despertarAudio()) {
      const c = audio.ctx, t = c.currentTime;
      const n = Math.floor(c.sampleRate * 1.3);
      const buf = c.createBuffer(1, n, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) {
        const k = i / n;
        d[i] = (Math.random() * 2 - 1) * Math.sin(k * Math.PI) * (0.35 + 0.65 * Math.random());
      }
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = 1600;
      const g = c.createGain(); g.gain.value = 0.13;
      src.connect(f).connect(g).connect(audio.maestro);
      src.start(t);
    }
    await esperar(1500);
    tono(96, 1.6, "sine", 0.05);
    await esperar(900);
  },
};

// ==========================================
// CLIMA — LLUVIA, TORMENTA Y NIEBLA
// ==========================================
//
// ── POR QUÉ ES UN MÓDULO Y NO UN EFECTO SUELTO ───────────────────────
// Porque el tiempo que hace lo cambia TODO: el color del bosque, la
// niebla, cuánto ilumina la fogata, si la fogata sigue viva siquiera, y
// cada cuánto cae un rayo. Si cada cosa mirara por su cuenta si llueve,
// acabarían desincronizadas.
//
// Así que hay un solo estado —`clima`— del que se lee en todas partes.
//
// ── LA LLUVIA APAGA LA FOGATA ────────────────────────────────────────
// No de golpe. La lluvia le va quitando vida al fuego cada segundo, y
// el fuego responde con lo que ya sabe hacer: menos llama, menos luz,
// menos chispas y más humo, porque el humo sale de la leña mojada. Al
// final sólo quedan las brasas, y luego ni eso.
//
// Cuando escampa, revive solo. Más despacio de lo que se apagó, que es
// como pasa de verdad.
//
// ── EL RAYO Y EL TRUENO ──────────────────────────────────────────────
// Van separados, como en el mundo: primero el destello, después el
// trueno, y el retraso depende de la distancia. Un rayo cerca da un
// fogonazo blanco y un golpe seco; uno lejos apenas ilumina las nubes y
// llega como un rumor cinco segundos después.

const clima = {
  /* 0 seco · 1 diluvio. Lo mueve el ambiente de lluvia del panel. */
  lluvia: 0,
  lluviaObj: 0,
  /* Igual con la tormenta. */
  tormenta: 0,
  tormentaObj: 0,
  /* El viento: un valor que se mueve solo y que empuja el humo, las
     llamas, las hojas y la lluvia. Todo lee de aquí. */
  viento: 0,
  /* El destello del relámpago, 0..1, y de qué lado viene. */
  destello: 0,
  destelloX: 0.5,
  pulsos: 0,
  relojRayo: azar(4, 10),
  /* Los truenos pendientes: {cuando, distancia}. */
  truenos: [],
  /* La niebla, que sube cuando llueve. */
  brumaBandas: [],
};

function construirBruma() {
  clima.brumaBandas = [];
  for (let i = 0; i < CONF.niebla.bandas; i++) {
    const t = i / Math.max(1, CONF.niebla.bandas - 1);
    clima.brumaBandas.push({
      /* De la línea del horizonte hacia abajo: las de arriba más
         delgadas y más lejos, las de abajo más gordas. */
      y: mez(sitio.horizonte - U * 2, sitio.suelo + U * 3, t),
      alto: U * mez(5, 13, t),
      v: azar(0.004, 0.016) * (rnd() < 0.5 ? -1 : 1),
      x: rnd(),
      op: mez(0.5, 1, t),
      f: rnd() * 6.283,
    });
  }
}

/** Dispara un relámpago a una distancia dada (en segundos de retraso). */
function lanzarRayo(segundos) {
  const d = segundos ?? azar(CONF.tormenta.distancia[0], CONF.tormenta.distancia[1]);
  /* Lo cerca que está decide lo fuerte que se ve. Uno a siete segundos
     apenas es un parpadeo en las nubes; uno a uno te ciega. */
  const cerca = clamp01(1 - (d - CONF.tormenta.distancia[0]) /
    (CONF.tormenta.distancia[1] - CONF.tormenta.distancia[0]));
  clima.destello = 0.25 + cerca * 0.75;
  clima.destelloX = azar(0.1, 0.9);
  clima.pulsos = Math.round(azar(CONF.tormenta.pulsos[0], CONF.tormenta.pulsos[1]));
  /* El trueno se apunta para más tarde. Ésa es toda la magia. */
  clima.truenos.push({ cuando: reloj + d, cerca });
  if (cerca > 0.62) sacudir(cerca * 0.5);
}

function moverClima(dt) {
  /* ---- El viento ----
     Tres senos con frecuencias que no encajan: rachas que no se repiten.
     Es el mismo truco que el fuego, y por eso los dos se mueven juntos
     sin estar sincronizados. */
  clima.viento =
    Math.sin(reloj * 0.17) * 0.55 +
    Math.sin(reloj * 0.43 + 1.3) * 0.3 +
    Math.sin(reloj * 0.91 + 2.6) * 0.15;
  /* Con lluvia y tormenta hace más aire. */
  clima.viento *= 1 + clima.lluvia * 0.8 + clima.tormenta * 0.5;

  clima.lluvia = damp(clima.lluvia, clima.lluviaObj, 1 / CONF.lluvia.sube * 6, dt);
  clima.tormenta = damp(clima.tormenta, clima.tormentaObj, 0.35, dt);

  /* ---- Los rayos ---- */
  if (clima.tormenta > 0.08) {
    clima.relojRayo -= dt * clima.tormenta;
    if (clima.relojRayo <= 0) {
      clima.relojRayo = azar(CONF.tormenta.cada[0], CONF.tormenta.cada[1]);
      lanzarRayo();
    }
  }
  /* El destello parpadea un par de veces y se va: un relámpago no es un
     fogonazo plano, son dos o tres golpes seguidos. */
  if (clima.destello > 0.001) {
    clima.destello -= dt * (clima.pulsos > 0 ? 9 : 3.4);
    if (clima.destello <= 0.06 && clima.pulsos > 0) {
      clima.pulsos--;
      if (clima.pulsos > 0) clima.destello = azar(0.3, 0.85);
    }
    clima.destello = Math.max(0, clima.destello);
  }

  /* ---- Los truenos que tocan ---- */
  for (let i = clima.truenos.length - 1; i >= 0; i--) {
    if (reloj < clima.truenos[i].cuando) continue;
    const t = clima.truenos.splice(i, 1)[0];
    if (audio.ctx) truenoSintetizado(audio.maestro, 0.3 + t.cerca * 0.7);
    if (t.cerca > 0.7) sacudir(t.cerca * 0.35);
  }

  /* ---- La lluvia apaga la fogata ----
     Las dos cifras son POR SEGUNDO, y esto importa más de lo que
     parece: con la resta multiplicada por `dt * 60` —o sea, por
     fotograma— la fogata pasaba de entera a apagada en segundo y medio
     y no se veía ni uno de los seis escalones. Apagarse tiene que
     durar lo bastante para poder mirarlo.

     Y revivir tarda el triple que apagarse, que es lo que pasa de
     verdad: mojar es instantáneo y secar no. */
  if (clima.lluvia > 0.06 && escena === "bosque") {
    fuego.vidaObj = Math.max(0, fuego.vidaObj - CONF.lluvia.apagaFuego * clima.lluvia * dt);
    fuego.mojado = clima.lluvia;
  } else {
    fuego.mojado = damp(fuego.mojado || 0, 0, 0.6, dt);
    /* Cuando escampa, revive. Y linealmente, no con una exponencial:
       una exponencial arranca deprisa y luego no acaba nunca, y lo que
       se quiere es justo lo contrario. */
    if (fuego.vidaObj < 1) {
      fuego.vidaObj = Math.min(1, fuego.vidaObj + CONF.lluvia.revive * dt);
    }
  }

  moverGotas(dt);
}

/* ---- Las gotas, en tres planos ------------------------------------------
   Lejos: finas, lentas y casi transparentes. Cerca: gordas, rápidas y
   con salpicadura al llegar al suelo. Sin los tres planos la lluvia se
   ve como una cortina plana pegada a la pantalla.                      */

const LLUVIA_PLANOS = 3;
let gotaX = null, gotaY, gotaV, gotaL, gotaP;
let nGotas = 0;

function construirLluvia() {
  const c = CONF.lluvia;
  nGotas = flojo
    ? Math.round((c.gotasCerca + c.gotasMedio + c.gotasLejos) * 0.42)
    : c.gotasCerca + c.gotasMedio + c.gotasLejos;
  gotaX = new Float32Array(nGotas);
  gotaY = new Float32Array(nGotas);
  gotaV = new Float32Array(nGotas);
  gotaL = new Float32Array(nGotas);
  gotaP = new Int8Array(nGotas);
  for (let i = 0; i < nGotas; i++) {
    /* El plano se reparte por tercios. */
    const p = Math.floor((i / nGotas) * LLUVIA_PLANOS);
    gotaP[i] = p;
    gotaX[i] = azar(-A * 0.2, A * 1.2);
    gotaY[i] = azar(-H, H);
    gotaV[i] = azar(420, 720) * (0.45 + p * 0.38);
    gotaL[i] = azar(6, 14) * (0.5 + p * 0.5);
  }
}

const salpicaduras = [];

function moverGotas(dt) {
  if (!gotaX || clima.lluvia < 0.01) return;
  const empuje = clima.viento * 90;
  /* Cuántas gotas están vivas ahora mismo: con poca lluvia caen pocas,
     y así la intensidad se nota de verdad en vez de ser sólo opacidad. */
  const vivas = Math.round(nGotas * clima.lluvia);
  for (let i = 0; i < vivas; i++) {
    gotaY[i] += gotaV[i] * dt;
    gotaX[i] += empuje * (0.4 + gotaP[i] * 0.4) * dt;
    if (gotaY[i] > H) {
      /* Salpicadura, sólo las del plano de delante: las de lejos no se
         verían y costarían lo mismo. */
      if (gotaP[i] === LLUVIA_PLANOS - 1 && salpicaduras.length < 40) {
        salpicaduras.push({ x: gotaX[i], y: H - azar(0, U * 6), t: 0, r: azar(U * 0.8, U * 2) });
      }
      gotaY[i] = azar(-H * 0.4, -10);
      gotaX[i] = azar(-A * 0.2, A * 1.2);
    }
    if (gotaX[i] > A * 1.25) gotaX[i] = -A * 0.2;
    if (gotaX[i] < -A * 0.25) gotaX[i] = A * 1.2;
  }
  for (let i = salpicaduras.length - 1; i >= 0; i--) {
    salpicaduras[i].t += dt * 3.4;
    if (salpicaduras[i].t >= 1) salpicaduras.splice(i, 1);
  }
}

function dibujarLluvia() {
  if (!gotaX || clima.lluvia < 0.01) return;
  const vivas = Math.round(nGotas * clima.lluvia);
  const empuje = clima.viento * 0.16;
  ctx.lineCap = "round";
  for (let p = 0; p < LLUVIA_PLANOS; p++) {
    /* Un trazo por plano: cambiar de color y de grosor una vez cada
       plano en vez de una vez por gota. */
    const a = (0.12 + p * 0.13) * clamp01(clima.lluvia * 1.4);
    ctx.strokeStyle = `rgba(176,206,240,${a})`;
    ctx.lineWidth = 0.7 + p * 0.7;
    ctx.beginPath();
    for (let i = 0; i < vivas; i++) {
      if (gotaP[i] !== p) continue;
      const l = gotaL[i];
      ctx.moveTo(gotaX[i], gotaY[i]);
      ctx.lineTo(gotaX[i] - l * empuje, gotaY[i] - l);
    }
    ctx.stroke();
  }
  /* Las salpicaduras: un arito que se abre y se apaga. */
  for (const s of salpicaduras) {
    ctx.strokeStyle = `rgba(190,215,245,${(1 - s.t) * 0.34})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.r * (0.4 + s.t * 1.6), s.r * (0.2 + s.t * 0.6), 0, 0, 6.283);
    ctx.stroke();
  }
}

/** La bruma entre los árboles. Va por capas y se mueve muy despacio. */
function dibujarBruma(desde, hasta) {
  const fuerza = CONF.niebla.base + clima.lluvia * (CONF.niebla.conLluvia - CONF.niebla.base);
  for (const b of clima.brumaBandas) {
    if (b.y < desde || b.y > hasta) continue;
    b.x += b.v * 0.02;
    if (b.x > 1.4) b.x = -0.4;
    if (b.x < -0.4) b.x = 1.4;
    const y = b.y + Math.sin(reloj * 0.24 + b.f) * U * 0.8;
    const g = ctx.createLinearGradient(0, y - b.alto, 0, y + b.alto);
    /* Fría con lluvia, algo cálida sin ella: la niebla coge el color de
       lo que la ilumina, y de noche eso es la luna. */
    const r0 = Math.round(mez(120, 96, clima.lluvia));
    const g0 = Math.round(mez(132, 112, clima.lluvia));
    const b0 = Math.round(mez(158, 150, clima.lluvia));
    g.addColorStop(0, `rgba(${r0},${g0},${b0},0)`);
    g.addColorStop(0.5, `rgba(${r0},${g0},${b0},${0.16 * fuerza * b.op})`);
    g.addColorStop(1, `rgba(${r0},${g0},${b0},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(-20, y - b.alto, A + 40, b.alto * 2);
  }
}

// ==========================================
// SISTEMA DE PARTÍCULAS
// ==========================================
//
// Un solo grupo para todo: chispas, humo, polvo, brillos, lluvia y
// destellos. Está en arrays planos de `Float32Array` con un cursor que
// busca hueco, así que mientras la escena corre NO se crea ni se tira ni
// un objeto. Eso es lo que evita que el recolector de basura salte justo
// en mitad de una animación, que es el tirón que se nota en los móviles.

const TIPO = { CHISPA: 0, HUMO: 1, BRILLO: 2, POLVO: 3, GOTA: 4, CENIZA: 5, HOJA: 6 };

/**
 * El sprite del humo: una bola difuminada, dibujada UNA VEZ.
 *
 * El primer intento pintaba cada voluta con `arc()` y relleno plano, y
 * lo que se veía eran círculos duros flotando, no humo. La solución
 * obvia —un degradado radial por partícula— arregla el aspecto y crea
 * un objeto de gradiente por voluta y por fotograma: con treinta
 * volutas vivas son mil ochocientos gradientes por segundo.
 *
 * Así que se dibuja una sola bola difuminada en un lienzo aparte al
 * arrancar, y cada voluta es un `drawImage` de esa bola, estirado al
 * tamaño que toque. Sale suave Y sale barato.
 */
function crearBolaHumo(r, g2, b) {
  const S = 128;
  const cv = document.createElement("canvas");
  cv.width = cv.height = S;
  const c = cv.getContext("2d");
  const g = c.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  /* La curva importa: si cae recta se ve el canto del círculo. Con el
     tramo largo a media opacidad y el final muy largo, se deshace. */
  g.addColorStop(0.00, `rgba(${r},${g2},${b},0.55)`);
  g.addColorStop(0.35, `rgba(${r},${g2},${b},0.30)`);
  g.addColorStop(0.70, `rgba(${r},${g2},${b},0.09)`);
  g.addColorStop(1.00, `rgba(${r},${g2},${b},0)`);
  c.fillStyle = g;
  c.fillRect(0, 0, S, S);
  return cv;
}

/* Tres, ya teñidas: la clara para la fogata, la gris para la chimenea
   de la cabaña y una casi blanca para el VAPOR, que es lo que sale de
   la leña mojada cuando llueve —y que no es humo: el humo tapa y el
   vapor brilla—. Teñir en el momento no vale —`source-atop` pinta sobre
   el lienzo entero, no sobre el sprite—, y tres canvas de 128 px son
   cuarenta y cinco kilobytes de memoria en total. */
const bolaHumoClara = crearBolaHumo(150, 148, 158);
const bolaHumoOscura = crearBolaHumo(74, 72, 82);
const bolaVapor = crearBolaHumo(212, 222, 234);

let P = CONF.perf.particulas;
let px, py, pvx, pvy, pvida, pmax, ptam, ptipo, pgiro, pgiroV, pton;
let cursorP = 0;

function crearParticulas(n) {
  P = n;
  px = new Float32Array(P); py = new Float32Array(P);
  pvx = new Float32Array(P); pvy = new Float32Array(P);
  pvida = new Float32Array(P); pmax = new Float32Array(P);
  ptam = new Float32Array(P); ptipo = new Int16Array(P);
  pgiro = new Float32Array(P); pgiroV = new Float32Array(P);
  pton = new Float32Array(P);
  cursorP = 0;
}
crearParticulas(P);

/**
 * Suelta una partícula. Si no hay hueco, no pasa nada: se pierde.
 *
 * Perder una chispa es invisible; pararse a hacer sitio, no. Por eso
 * esto nunca crece el grupo ni expulsa a nadie.
 */
function soltar(x, y, op) {
  let k = -1;
  for (let j = 0; j < P; j++) {
    const c = (cursorP + j) % P;
    if (pvida[c] <= 0) { k = c; cursorP = (c + 1) % P; break; }
  }
  if (k < 0) return;
  px[k] = x; py[k] = y;
  pvx[k] = op.vx || 0; pvy[k] = op.vy || 0;
  pmax[k] = pvida[k] = op.vida || 1;
  ptam[k] = op.tam || 2;
  ptipo[k] = op.tipo || 0;
  pgiro[k] = op.giro || 0;
  pgiroV[k] = op.giroV || 0;
  pton[k] = op.tono === undefined ? Math.random() : op.tono;
}

function moverParticulas(dt) {
  const viento = Math.sin(reloj * 0.31) * 8 + Math.sin(reloj * 0.87) * 4;
  for (let i = 0; i < P; i++) {
    if (pvida[i] <= 0) continue;
    pvida[i] -= dt;
    if (pvida[i] <= 0) continue;

    const t = ptipo[i];
    if (t === TIPO.CHISPA) {
      /* Las chispas suben, pierden fuerza y al final caen: eso es lo
         que hace que una chispa parezca una brasa y no un punto. */
      pvy[i] += 34 * dt;
      pvx[i] += viento * 0.35 * dt;
      pvx[i] *= Math.exp(-1.1 * dt);
    } else if (t === TIPO.HUMO) {
      /* El humo sube cada vez más despacio y se va abriendo. */
      pvy[i] *= Math.exp(-0.55 * dt);
      pvx[i] += viento * 0.9 * dt;
      ptam[i] += 16 * dt;
    } else if (t === TIPO.GOTA) {
      pvy[i] += 340 * dt;
    } else if (t === TIPO.CENIZA) {
      pvy[i] += 10 * dt;
      pvx[i] += (viento * 1.2 + Math.sin(reloj * 2 + i) * 9) * dt;
      pvx[i] *= Math.exp(-0.8 * dt);
    } else if (t === TIPO.HOJA) {
      pvy[i] += 22 * dt;
      pvx[i] += Math.sin(reloj * 1.7 + i) * 26 * dt;
      pvx[i] *= Math.exp(-0.9 * dt);
    } else {
      /* Brillos y polvo: flotan y poco más. */
      pvx[i] += Math.sin(reloj * 0.9 + i) * 5 * dt;
      pvy[i] *= Math.exp(-0.35 * dt);
    }

    px[i] += pvx[i] * dt;
    py[i] += pvy[i] * dt;
    pgiro[i] += pgiroV[i] * dt;

    if (py[i] > H + 40 || px[i] < -60 || px[i] > A + 60) pvida[i] = 0;
  }
}

function dibujarParticulas() {
  /* Dos pasadas: primero lo que se suma a la luz (chispas y brillos) y
     luego lo que tapa (humo). Mezclarlas obligaría a cambiar el modo de
     composición decenas de veces por cuadro, que es de lo más caro que
     hay en un lienzo. */
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < P; i++) {
    if (pvida[i] <= 0) continue;
    const t = ptipo[i];
    if (t === TIPO.HUMO || t === TIPO.GOTA || t === TIPO.HOJA) continue;
    const k = pvida[i] / pmax[i];

    if (t === TIPO.CHISPA) {
      /* Una chispa se apaga pasando de amarillo a rojo. */
      const r = 255;
      const g = Math.round(mez(90, 220, k));
      const b = Math.round(mez(20, 120, k * k));
      const a = k * 0.95;
      ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
      const s = ptam[i] * (0.4 + k * 0.6);
      ctx.beginPath();
      ctx.arc(px[i], py[i], s, 0, 6.283);
      ctx.fill();
      /* Y deja una estela: la chispa va rápida y el ojo la ve alargada. */
      if (s > 1.1) {
        ctx.globalAlpha = a * 0.35;
        ctx.beginPath();
        ctx.moveTo(px[i], py[i]);
        ctx.lineTo(px[i] - pvx[i] * 0.03, py[i] - pvy[i] * 0.03);
        ctx.strokeStyle = `rgba(255,${g},${b},${a})`;
        ctx.lineWidth = s * 0.8;
        ctx.lineCap = "round";
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
    } else if (t === TIPO.CENIZA) {
      ctx.fillStyle = `rgba(200,120,70,${k * 0.5})`;
      ctx.beginPath();
      ctx.arc(px[i], py[i], ptam[i] * 0.6, 0, 6.283);
      ctx.fill();
    } else {
      /* Brillos y polvo: un puntito con halo. */
      const col = pton[i] < 0.33 ? "255,220,180"
                : pton[i] < 0.66 ? "190,220,255"
                : "255,190,225";
      ctx.fillStyle = `rgba(${col},${k * 0.8})`;
      ctx.beginPath();
      ctx.arc(px[i], py[i], ptam[i] * (0.5 + k * 0.5), 0, 6.283);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = "source-over";

  /* El humo, la lluvia y las hojas, por encima y sin sumar luz. */
  for (let i = 0; i < P; i++) {
    if (pvida[i] <= 0) continue;
    const t = ptipo[i];
    const k = pvida[i] / pmax[i];
    if (t === TIPO.HUMO) {
      /* El humo entra, se queda y se va: si sólo se desvanece, parece
         que se evapora de golpe nada más salir. */
      const a = Math.sin(clamp01(1 - k) * Math.PI) * 0.34;
      if (a < 0.004) continue;
      const s = ptam[i] * 2;
      /* `pton` elige el sprite: bajo es humo claro (la fogata), medio
         es humo gris (la chimenea, el bombón quemado) y alto es vapor,
         que además se ve MÁS que el humo porque es agua con luz dentro,
         no hollín. */
      const esVapor = pton[i] >= 0.85;
      const sprite = esVapor ? bolaVapor
                   : pton[i] < 0.5 ? bolaHumoClara : bolaHumoOscura;
      ctx.globalAlpha = esVapor ? a * 1.2 : a;
      ctx.drawImage(sprite, px[i] - s / 2, py[i] - s / 2, s, s);
      ctx.globalAlpha = 1;
    } else if (t === TIPO.GOTA) {
      ctx.strokeStyle = `rgba(175,205,240,${k * 0.42})`;
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(px[i], py[i]);
      ctx.lineTo(px[i] - pvx[i] * 0.016, py[i] - pvy[i] * 0.016);
      ctx.stroke();
    } else if (t === TIPO.HOJA) {
      ctx.save();
      ctx.translate(px[i], py[i]);
      ctx.rotate(pgiro[i]);
      ctx.globalAlpha = k * 0.7;
      ctx.fillStyle = pton[i] < 0.5 ? "#3e6b44" : "#5c7a3e";
      ctx.beginPath();
      ctx.ellipse(0, 0, ptam[i], ptam[i] * 0.45, 0, 0, 6.283);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }
}

// ==========================================
// FOGATA
// ==========================================
//
// ── CÓMO ESTÁ HECHO EL FUEGO ─────────────────────────────────────────
//
// No hay ninguna imagen ni ninguna animación grabada. Las llamas son
// LENGUAS: seis u ocho tiras que suben, se estrechan y se retuercen, y
// cada una tiene su propia fase, su propia altura y su propio ritmo.
//
// Lo que hace que no se vea repetitivo es que la altura de cada lengua
// sale de sumar tres senos con frecuencias que no son múltiplos entre
// sí (1.7, 2.9 y 4.3). Tres ondas así no vuelven a coincidir nunca, así
// que el fuego no tiene ciclo: no se repite jamás.
//
// Encima de eso:
//   · el brillo general late con el fuego y baña toda la escena;
//   · las chispas salen de la punta de las lenguas, no del centro;
//   · los troncos se mueven un pelín y se asientan de vez en cuando;
//   · hay brasas debajo que respiran a su ritmo.

const fuego = {
  vida: 1,          // 0 apagándose · 1 fuerte · >1 avivado
  vidaObj: 1,
  brillo: 1,        // lo que ilumina alrededor, suavizado
  lenguas: [],
  troncos: [],
  brasas: [],
  relojChispa: 0,
  relojHumo: 0,
  asentar: 0,       // cuando un tronco se derrumba
  /* Cuánto lleva encendida sin que nadie la toque, para el easter egg
     del fuego azul. */
  quieta: 0,
  azul: 0,

  /* ---- Lo que le hace el tiempo ----
     `mojado` es cuánta agua le está cayendo encima, 0..1.
     `inclina` es cuánto la empuja el viento, CON SU PROPIO RETRASO: el
     aire cambia de golpe y la llama tarda en enterarse. Sin ese retraso
     la llama va pegada al viento y parece una bandera, no fuego.
     `fase` es en qué punto de apagarse está, de 1 (viva) a 6 (apagada). */
  mojado: 0,
  inclina: 0,
  fase: 1,
  relojChisporroteo: 0,
  relojVapor: 0,
  /* Cuánto lleva sin decir nada sobre lo que le está pasando: sin esto
     la fogata se pone a comentar cada dos segundos cuando la lluvia la
     deja justo en el filo entre dos fases. */
  calladaDesde: 0,
};

function construirFogata() {
  const f = sitio.fogata;
  fuego.lenguas = [];
  const n = flojo ? 5 : 7;
  for (let i = 0; i < n; i++) {
    fuego.lenguas.push({
      /* Repartidas a lo ancho de la base, las de fuera más bajas. */
      x: (i / (n - 1) - 0.5) * 1.5,
      fase: rnd() * 6.283,
      vel: azar(0.9, 1.5),
      alto: azar(0.72, 1.12),
      ancho: azar(0.42, 0.72),
    });
  }
  fuego.troncos = [
    { x: -0.9, y: 0.34, a: -0.28, l: 2.1, g: 0.42 },
    { x:  0.8, y: 0.30, a:  0.34, l: 2.0, g: 0.40 },
    { x: -0.1, y: 0.44, a:  0.06, l: 2.4, g: 0.46 },
    { x:  0.3, y: 0.22, a: -0.62, l: 1.6, g: 0.34 },
  ].map((t) => ({ ...t, meneo: rnd() * 6.283 }));
  fuego.brasas = [];
  for (let i = 0; i < 9; i++) {
    fuego.brasas.push({
      x: azar(-1.1, 1.1),
      y: azar(0.24, 0.46),
      r: azar(0.1, 0.22),
      fase: rnd() * 6.283,
      vel: azar(0.6, 1.5),
    });
  }
}

/** Cuánto vale la llama en este instante, de 0 a 1 y pico. */
function alturaLlama(l, t) {
  /* Tres senos con frecuencias que no encajan entre sí: la suma no se
     repite nunca. Eso es toda la variación procedural del fuego. */
  const a = Math.sin(t * 1.7 * l.vel + l.fase);
  const b = Math.sin(t * 2.9 * l.vel + l.fase * 1.7) * 0.6;
  const c = Math.sin(t * 4.3 * l.vel + l.fase * 2.3) * 0.3;
  return clamp01(0.52 + (a + b + c) * 0.24);
}

function moverFogata(dt) {
  fuego.vida = damp(fuego.vida, fuego.vidaObj, 1.6, dt);
  /* La vuelta al reposo, SÓLO hacia abajo: es para que un soplido o un
     dedo en la llama se deshinchen solos. Hacia arriba no puede tirar,
     porque si tira mientras llueve le está devolviendo a la fogata
     justo lo que el agua le quita, y entonces no se apaga nunca. */
  if (fuego.vidaObj > 1) fuego.vidaObj = damp(fuego.vidaObj, 1, 0.22, dt);

  /* Lo que le está haciendo el tiempo, y en qué escalón de apagarse
     está por culpa de ello. */
  moverFuegoClima(dt);
  mirarFaseFuego();

  /* El brillo general: la media de las lenguas, suavizada. Es lo que
     ilumina la cabaña, los troncos y las caras de todo. */
  let media = 0;
  for (const l of fuego.lenguas) media += alturaLlama(l, reloj);
  media /= Math.max(1, fuego.lenguas.length);
  fuego.brillo = damp(fuego.brillo, media * fuego.vida, 9, dt);

  fuego.quieta += dt;
  if (fuego.azul > 0) fuego.azul = Math.min(1, fuego.azul + dt * 0.3);

  const f = sitio.fogata;
  const alto = f.r * 2.4 * fuego.vida;

  /* ---- Chispas ---- */
  fuego.relojChispa -= dt;
  /* Con la leña mojada saltan muchas menos chispas: lo que sube ya no
     es fuego suelto, es agua evaporándose. */
  if (fuego.relojChispa <= 0 && Math.random() > fuego.mojado * 0.8 && fuego.vida > 0.05) {
    fuego.relojChispa = (flojo ? 0.09 : 0.045) / clamp(fuego.vida, 0.3, 2);
    /* Salen de la PUNTA de una lengua, no del centro: una chispa nace
       donde la llama se deshace, y ahí es donde se ve bien. */
    const l = fuego.lenguas[Math.floor(Math.random() * fuego.lenguas.length)];
    const k = alturaLlama(l, reloj);
    soltar(
      f.x + l.x * f.r * 0.5 + azar(-f.r * 0.2, f.r * 0.2),
      f.y - alto * k * 0.9,
      {
        /* El viento se las lleva: una chispa pesa nada. */
        vx: azar(-26, 26) + fuego.inclina * 70,
        vy: azar(-110, -48) * clamp(fuego.vida, 0.4, 2),
        vida: azar(0.9, 2.1),
        tam: azar(1.1, 2.6),
        tipo: TIPO.CHISPA,
      }
    );
  }

  /* ---- Humo ---- */
  fuego.relojHumo -= dt;
  if (fuego.relojHumo <= 0) {
    /* La leña mojada humea el doble: el agua que se evapora arrastra
       el hollín consigo. */
    fuego.relojHumo = (flojo ? 0.34 : 0.17) / (1 + fuego.mojado * 1.2);
    soltar(f.x + azar(-f.r * 0.4, f.r * 0.4), f.y - alto * 0.85, {
      vx: azar(-8, 8) + fuego.inclina * 34,
      vy: azar(-34, -18),
      vida: azar(3.2, 5.4),
      tam: azar(f.r * 0.22, f.r * 0.42),
      tipo: TIPO.HUMO,
      /* Hasta 0.85 y no hasta 1: de 0.85 para arriba es vapor, y el
         humo de una fogata seca no es vapor. */
      tono: Math.random() * 0.84,
    });
  }

  /* ---- Un tronco se asienta de vez en cuando ---- */
  if (Math.random() < dt * 0.06 * clamp(fuego.vida, 0, 1)) {
    fuego.asentar = 1;
    golpe(0.16, azar(160, 320), 0.12, "lowpass");
    for (let i = 0; i < 14; i++) {
      soltar(f.x + azar(-f.r * 0.6, f.r * 0.6), f.y - f.r * 0.3, {
        vx: azar(-70, 70), vy: azar(-150, -60),
        vida: azar(0.7, 1.6), tam: azar(1, 2.4), tipo: TIPO.CHISPA,
      });
    }
  }
  fuego.asentar = Math.max(0, fuego.asentar - dt * 2.4);
}

/* ---- LA FOGATA CONTRA EL TIEMPO ----------------------------------------
   Apagarse no es que el número `vida` baje. Una fogata bajo la lluvia
   pasa por estados, y cada uno se ve y se oye distinto:

     1. VIVA          llamas altas, chispas, humo fino
     2. CHISPORROTEA  la primera agua toca las brasas: siseo y vapor
     3. BAJA          las llamas encogen, el humo se dobla
     4. LUCHA         se apaga y vuelve, se apaga y vuelve
     5. BRASAS        ya no hay llama: rojo debajo y mucho vapor
     6. APAGADA       leña negra y un hilo de vapor que se va

   Y al revés cuando escampa, subiendo los mismos seis escalones. Por
   eso son escalones y no una rampa: una rampa de 1 a 0 se ve como un
   `globalAlpha` bajando, y esto se tiene que ver como una fogata
   peleando.                                                          */

/* Los cinco cortes entre las seis fases. */
const ESCALONES_FUEGO = [0.74, 0.54, 0.34, 0.17, 0.045];

function mirarFaseFuego() {
  const v = fuego.vida;
  let nueva = 6;
  for (let i = 0; i < ESCALONES_FUEGO.length; i++) {
    /* El corte se mueve un pelín según de dónde venimos. Sin esta
       holgura, con la lluvia dejando el fuego justo en el filo, la
       fogata se pasaba el rato entrando y saliendo de la misma fase —y
       cada entrada sisea, suelta vapor y a veces dice algo—. */
    const margen = fuego.fase > i + 1 ? 0.05 : 0;
    if (v > ESCALONES_FUEGO[i] + margen) { nueva = i + 1; break; }
  }
  if (nueva === fuego.fase) return;
  const subiendo = nueva < fuego.fase;
  fuego.fase = nueva;
  alCambiarFase(nueva, subiendo);
}

function alCambiarFase(n, subiendo) {
  const f = sitio.fogata;

  if (subiendo) {
    /* Revivir: un chasquido de leña seca y un puñado de chispas. */
    golpe(0.1, azar(420, 900), 0.12, "bandpass");
    for (let i = 0; i < 10 + n * 2; i++) {
      soltar(f.x + azar(-f.r * 0.5, f.r * 0.5), f.y - f.r * 0.4, {
        vx: azar(-50, 50), vy: azar(-140, -50),
        vida: azar(0.6, 1.5), tam: azar(1, 2.3), tipo: TIPO.CHISPA,
      });
    }
  } else {
    /* Apagarse: siseo y una bocanada de vapor. Cuanto más abajo, más. */
    sisear(0.5 + (n - 1) * 0.12);
    vaharada(6 + n * 4);
    if (n >= 4) sacudir(0.06);
  }

  /* Y alguien lo comenta, pero no siempre: con la lluvia al filo entre
     dos fases, comentarlo cada vez convierte una fogata en un locutor. */
  const frases = CONF.fuegoLluvia[subiendo ? "sube" : "baja"][n];
  if (frases && reloj - fuego.calladaDesde > 6 && Math.random() < 0.8) {
    fuego.calladaDesde = reloj;
    decir(f.x, f.y - f.r * 4.5, frases[Math.floor(Math.random() * frases.length)],
      { dur: 4, importante: n >= 5 });
  }
}

/** Una bocanada de vapor: agua, no humo. Sale ancha y sube despacio. */
function vaharada(n) {
  const f = sitio.fogata;
  for (let i = 0; i < n; i++) {
    soltar(f.x + azar(-f.r * 0.9, f.r * 0.9), f.y - f.r * azar(0, 0.5), {
      vx: azar(-16, 16) + clima.viento * 26,
      vy: azar(-30, -12),
      vida: azar(1.8, 3.6),
      tam: azar(f.r * 0.2, f.r * 0.5),
      tipo: TIPO.HUMO,
      /* De 0.85 para arriba, el dibujo lo pinta como vapor. */
      tono: 0.9,
    });
  }
}

/**
 * El siseo: agua sobre brasa.
 *
 * Ruido blanco muy agudo con un filtro que se CIERRA mientras suena.
 * Eso es lo que distingue un siseo de una estática: la estática no va a
 * ninguna parte, y el siseo empieza arriba y se apaga hacia abajo,
 * porque la gota se acaba.
 */
function sisear(fuerza) {
  if (!despertarAudio()) return;
  const c = audio.ctx, t = c.currentTime;
  const dur = 0.12 + fuerza * 0.5;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) {
    const k = i / n;
    /* La envolvente: golpe inmediato y caída larga, como la gota. */
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 1.7);
  }
  const src = c.createBufferSource(); src.buffer = buf;
  const fl = c.createBiquadFilter();
  fl.type = "bandpass"; fl.Q.value = 0.8;
  fl.frequency.setValueAtTime(azar(4200, 6200), t);
  fl.frequency.exponentialRampToValueAtTime(azar(900, 1500), t + dur);
  const g = c.createGain();
  g.gain.value = 0.045 + fuerza * 0.07;
  src.connect(fl).connect(g).connect(audio.maestro);
  src.start(t);
}

/**
 * Lo que la lluvia y el viento le hacen a la fogata, cada fotograma.
 *
 * Va aparte de `moverFogata` a propósito: `moverFogata` es la fogata
 * consigo misma —sus lenguas, sus chispas, sus troncos— y esto es la
 * fogata contra el mundo. Mezclarlos deja un `moverFogata` donde no se
 * distingue lo que es el fuego de lo que le están haciendo.
 */
function moverFuegoClima(dt) {
  /* El viento, con retraso. */
  const empuje = clima.viento * (0.62 + clima.lluvia * 0.7);
  fuego.inclina = damp(fuego.inclina, empuje, 3.2, dt);

  const mojado = fuego.mojado;
  if (mojado > 0.04) {
    /* ---- El chisporroteo ----
       Gotas sueltas cayendo sobre la brasa. Cuantas más gotas y más
       brasa queda, más seguidos van: una fogata casi apagada ya no
       tiene con qué sisear. */
    fuego.relojChisporroteo -= dt;
