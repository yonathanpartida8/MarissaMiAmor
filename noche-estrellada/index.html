    if (fuego.relojChisporroteo <= 0) {
      fuego.relojChisporroteo = azar(0.1, 0.55) / (mojado * clamp(fuego.vida, 0.15, 1.2) + 0.15);
      sisear(azar(0.15, 0.5) * mojado);
      vaharada(Math.random() < 0.55 ? 1 : 2);
    }

    /* ---- El vapor de fondo ----
       Además de las bocanadas sueltas, la leña mojada echa vapor de
       continuo mientras le quede calor. */
    fuego.relojVapor -= dt;
    if (fuego.relojVapor <= 0) {
      /* El vapor sale del CALOR que le queda, no del agua: una fogata
         apagada del todo y fría ya no echa nada. Sin este factor, la
         escena se quedaba para siempre con una nube blanca encima de
         cuatro leños negros. */
      const calor = clamp(fuego.vida + 0.12, 0.12, 1.2);
      fuego.relojVapor = (flojo ? 0.4 : 0.2) / (clamp(mojado, 0.2, 1) * calor);
      vaharada(1);
    }
  }
}

function dibujarFogata() {
  const f = sitio.fogata;
  const d = desplazar(1.6);
  const x = f.x + d.x, y = f.y + d.y;
  const alto = f.r * 2.4 * fuego.vida;

  /* ---- El halo de luz en el suelo ---- */
  const luz = fuego.brillo;
  const calor = fuego.azul > 0.1
    ? `${Math.round(mez(255, 140, fuego.azul))},${Math.round(mez(170, 210, fuego.azul))},${Math.round(mez(80, 255, fuego.azul))}`
    : "255,170,80";
  haloOvalado(x, y + f.r * 0.2, f.r * 9, f.r * 4.4, [
    [0,    `rgba(${calor},${0.30 * luz})`],
    [0.35, `rgba(${calor},${0.13 * luz})`],
    [1,    `rgba(${calor},0)`],
  ]);

  /* ---- Las brasas de debajo ----
     Cuando la llama se va, las brasas son lo ÚNICO que queda, así que
     en las fases bajas se respetan enteras en vez de apagarse con el
     resto: una fogata apagada por la lluvia no se queda negra de golpe,
     se queda roja un buen rato. */
  const vivezaBrasa = fuego.fase >= 5 ? mez(0.55, 1, clamp01(fuego.vida * 12))
                    : clamp(fuego.vida, 0.35, 1.2);
  for (const b of fuego.brasas) {
    /* Y respiran más deprisa cuando les cae agua encima. */
    const k = 0.5 + 0.5 * Math.sin(reloj * b.vel * (1 + fuego.mojado * 1.4) + b.fase);
    const bx = x + b.x * f.r, by = y + b.y * f.r * 0.4;
    /* Mojada tira a rojo oscuro; seca, a naranja. */
    const verde = Math.round(mez(mez(70, 150, k), mez(30, 70, k), fuego.mojado));
    ctx.fillStyle = `rgba(255,${verde},40,${(0.4 + k * 0.5) * vivezaBrasa})`;
    ctx.beginPath();
    ctx.ellipse(bx, by, b.r * f.r, b.r * f.r * 0.5, 0, 0, 6.283);
    ctx.fill();
  }

  /* ---- El rescoldo ----
     Cuando ya no hay llama, las brasas solas no se ven: quedan medio
     tapadas por los troncos de delante y lo único que se lee en la
     pantalla es la nube de vapor. Así que en las fases bajas se les
     pone un resplandor rojo encima, sumando luz. Es lo que hace que una
     fogata apagada siga pareciendo una fogata y no cuatro palos
     mojados. */
  if (fuego.fase >= 4 && fuego.vida > 0.004) {
    const cuanto = clamp01(fuego.vida * 5);
    ctx.globalCompositeOperation = "lighter";
    haloOvalado(x, y, f.r * 2.2, f.r * 1.1, [
      [0,    `rgba(255,120,40,${0.5 * cuanto})`],
      [0.4,  `rgba(230,60,18,${0.2 * cuanto})`],
      [1,    "rgba(180,30,10,0)"],
    ]);
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---- Los troncos, por detrás de la llama ---- */
  dibujarTroncos(x, y, f.r, -1);

  /* ---- LAS LENGUAS ----
     En la fase 5 y la 6 ya no hay: sólo brasas. Dibujarlas con un alfa
     muy bajo dejaba un resplandor naranja fantasma sobre la leña
     mojada, que es exactamente lo que una fogata apagada no tiene. */
  ctx.globalCompositeOperation = "lighter";
  if (fuego.fase <= 4) for (const l of fuego.lenguas) {
    let k = alturaLlama(l, reloj);
    /* ---- La agonía ----
       En la fase 4 la llama no baja: PARPADEA. Cada lengua se apaga y
       vuelve a su ritmo, con un seno rápido y un corte duro. Es lo que
       hace que se lea como «está peleando» y no como «está bajando el
       volumen». */
    if (fuego.fase === 4) {
      const late = Math.sin(reloj * 6.1 * l.vel + l.fase * 3.1);
      k *= late > -0.15 ? 1 : 0.12;
    }
    const h = alto * k * l.alto;
    const lx = x + l.x * f.r * 0.5;
    /* La lengua se tuerce mientras sube: la punta va a un lado y el
       cuerpo al otro. Una llama recta no parece fuego.
       Y encima de esa torsión propia, el VIENTO la ladea entera: la
       punta se va mucho más que la base, que es lo que pasa de verdad
       —abajo la llama está sujeta por la leña—. */
    const torsion = Math.sin(reloj * 2.1 * l.vel + l.fase) * f.r * 0.34
                  + fuego.inclina * f.r * 2.4 * (0.3 + k * 0.7);
    /* Con viento fuerte la llama además se estira y se afina. */
    const estira = 1 + Math.abs(fuego.inclina) * 0.35;
    const w = f.r * l.ancho * (0.6 + k * 0.5) / estira;

    const g = ctx.createLinearGradient(lx, y, lx + torsion, y - h);
    if (fuego.azul > 0.1) {
      const a = fuego.azul;
      g.addColorStop(0,    `rgba(${Math.round(mez(255,120,a))},${Math.round(mez(240,220,a))},${Math.round(mez(190,255,a))},0.95)`);
      g.addColorStop(0.35, `rgba(${Math.round(mez(255,60,a))},${Math.round(mez(170,190,a))},${Math.round(mez(60,255,a))},0.7)`);
      g.addColorStop(1,    `rgba(${Math.round(mez(220,20,a))},${Math.round(mez(60,80,a))},${Math.round(mez(20,180,a))},0)`);
    } else {
      g.addColorStop(0,    "rgba(255,246,200,0.95)");
      g.addColorStop(0.28, "rgba(255,190,70,0.78)");
      g.addColorStop(0.62, "rgba(240,110,30,0.42)");
      g.addColorStop(1,    "rgba(190,40,10,0)");
    }
    ctx.fillStyle = g;

    /* La forma: una gota alargada. Base ancha, punta fina y curvada. */
    ctx.beginPath();
    ctx.moveTo(lx - w, y);
    ctx.bezierCurveTo(
      lx - w * 0.9, y - h * 0.42,
      lx + torsion - w * 0.28, y - h * 0.76,
      lx + torsion, y - h
    );
    ctx.bezierCurveTo(
      lx + torsion + w * 0.28, y - h * 0.76,
      lx + w * 0.9, y - h * 0.42,
      lx + w, y
    );
    ctx.closePath();
    ctx.fill();
  }

  /* El corazón: lo más blanco, abajo del todo. Se ladea con el viento
     como las lenguas, si no se quedaba el núcleo quieto en el centro
     mientras el resto del fuego se iba de lado. */
  const cx = x + fuego.inclina * f.r * 0.3;
  const gc = ctx.createRadialGradient(cx, y - f.r * 0.3, 0, cx, y - f.r * 0.3, f.r * 1.3);
  gc.addColorStop(0, `rgba(255,252,236,${0.85 * fuego.vida})`);
  gc.addColorStop(0.5, `rgba(255,200,110,${0.4 * fuego.vida})`);
  gc.addColorStop(1, "rgba(255,150,60,0)");
  ctx.fillStyle = gc;
  ctx.beginPath();
  ctx.arc(cx, y - f.r * 0.3, f.r * 1.3, 0, 6.283);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";

  /* ---- Y los troncos de delante ---- */
  dibujarTroncos(x, y, f.r, 1);

  /* Las piedras del círculo. */
  ctx.fillStyle = "#2a2622";
  for (let i = 0; i < 9; i++) {
    const a = (i / 9) * 6.283 + 0.3;
    const rx = x + Math.cos(a) * f.r * 1.7;
    const ry = y + f.r * 0.34 + Math.sin(a) * f.r * 0.62;
    if (Math.sin(a) < -0.3) continue;              // ésas están detrás
    const s = f.r * (0.22 + ((i * 7) % 5) * 0.03);
    /* Iluminadas por el fuego: las de cerca más. */
    const ilum = clamp01(1 - Math.abs(Math.cos(a)) * 0.5) * luz;
    ctx.fillStyle = `rgb(${Math.round(mez(34, 120, ilum))},${Math.round(mez(30, 84, ilum))},${Math.round(mez(28, 62, ilum))})`;
    ctx.beginPath();
    ctx.ellipse(rx, ry, s, s * 0.72, a * 0.3, 0, 6.283);
    ctx.fill();
  }
}

function dibujarTroncos(x, y, r, lado) {
  for (const t of fuego.troncos) {
    if (Math.sign(t.y - 0.33) !== lado && lado === 1) continue;
    if (Math.sign(t.y - 0.33) === 1 && lado === -1) continue;
    const meneoT = Math.sin(reloj * 0.7 + t.meneo) * 0.012 + fuego.asentar * 0.05;
    const tx = x + t.x * r * 0.9;
    const ty = y + t.y * r * 0.5;
    ctx.save();
    ctx.translate(tx, ty);
    ctx.rotate(t.a + meneoT);
    const largo = r * t.l, grueso = r * t.g;
    /* El tronco: oscuro arriba y encendido por abajo, que es por donde
       le da el fuego. */
    /* La leña mojada es más oscura: el agua le rellena los poros y
       deja de rebotar la luz. Es el mismo motivo por el que una piedra
       mojada parece de otro color. */
    const seco = 1 - fuego.mojado * 0.45;
    const g = ctx.createLinearGradient(0, -grueso, 0, grueso);
    g.addColorStop(0, fuego.mojado > 0.2 ? "#181310" : "#241c16");
    g.addColorStop(0.55, `rgb(${Math.round(mez(58, 150, fuego.brillo) * seco)},${Math.round(mez(40, 86, fuego.brillo) * seco)},${Math.round(mez(30, 52, fuego.brillo) * seco)})`);
    g.addColorStop(1, `rgb(${Math.round(mez(90, 220, fuego.brillo) * seco)},${Math.round(mez(48, 110, fuego.brillo) * seco)},${Math.round(mez(26, 40, fuego.brillo) * seco)})`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect
      ? ctx.roundRect(-largo / 2, -grueso / 2, largo, grueso, grueso * 0.45)
      : ctx.rect(-largo / 2, -grueso / 2, largo, grueso);
    ctx.fill();
    /* Las vetas: tres rayas oscuras. */
    ctx.strokeStyle = "rgba(20,14,10,0.4)";
    ctx.lineWidth = Math.max(1, grueso * 0.07);
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(-largo * 0.42, k * grueso * 0.22);
      ctx.lineTo(largo * 0.42, k * grueso * 0.22 + grueso * 0.05);
      ctx.stroke();
    }
    /* Y si está mojada, un filo de agua por el canto de arriba: la
       raya de luz que deja una superficie húmeda. Es lo que hace que se
       LEA como mojada en vez de simplemente más oscura. */
    if (fuego.mojado > 0.15) {
      ctx.strokeStyle = `rgba(190,210,235,${0.18 * fuego.mojado})`;
      ctx.lineWidth = Math.max(0.7, grueso * 0.1);
      ctx.beginPath();
      ctx.moveTo(-largo * 0.4, -grueso * 0.3);
      ctx.lineTo(largo * 0.4, -grueso * 0.3);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ==========================================
// SISTEMA DE BOMBONES
// ==========================================
//
// Un palo con un bombón en la punta. Se arrastra el bombón y, cuanto
// más cerca del fuego, más deprisa se tuesta.
//
// ── DE QUÉ DEPENDE EL TUESTE ─────────────────────────────────────────
// De UN número, `tueste`, de 0 en adelante. De ahí sale el color, el
// humo, si se prende, qué se dice al comerlo y cuánto se hincha. Con un
// número para todo no hay manera de que el dibujo diga una cosa y el
// texto otra.
//
// Sube según lo cerca que esté de la llama, con una caída cuadrática:
// pegado al fuego va rapidísimo y a dos palmos casi no sube. Es lo que
// obliga a estar pendiente en vez de dejarlo puesto.
//
// ── EL PALO ──────────────────────────────────────────────────────────
// No se arrastra el bombón suelto: se arrastra la PUNTA de un palo que
// está clavado en el suelo. El palo se dobla un poco, así que el bombón
// no va exactamente donde está el dedo, va donde el palo le deja. Eso
// es lo que hace que se sienta un objeto y no un cursor.

const bombon = {
  /* ---- EL PALO ----
     No es una línea del mango al dedo: es una varilla con inercia. Se
     guarda su ÁNGULO y su LARGO, y la punta sale de los dos. Así el
     palo puede ir con retraso, pasarse de largo y volver, que es lo que
     hace un palo de verdad en la mano de alguien. */
  ang: 0, angV: 0, angObj: 0,
  largo: 0, largoV: 0, largoObj: 0,
  /* Dónde ha acabado la punta, y con qué velocidad. El bombón lee esto
     y nada más: por eso hereda el impulso del palo sin que nadie se lo
     pase. */
  px: 0, py: 0, pvx: 0, pvy: 0,
  /* El mango del palo, clavado en el suelo. */
  mangoX: 0, mangoY: 0,
  /* A dónde lleva el dedo la punta. */
  destX: 0, destY: 0,
  agarrado: false,
  dedoId: null,

  /* ---- EL BOMBÓN ----
     No está clavado en la punta: cuelga de ella con un muelle corto y
     un tope duro. Tiene su propia posición y su propia velocidad, y de
     la diferencia entre dónde está y dónde debería salen solos el
     balanceo, la inercia y la rotación. */
  x: 0, y: 0, vx: 0, vy: 0,
  giro: 0,

  /* ---- EL CALOR ----
     `calor` es la temperatura de dentro, con inercia: sube despacio
     junto al fuego y BAJA DESPACIO al sacarlo, así que sigue tostándose
     un rato después. `lados` es cuánto se ha tostado cada cara, y por
     eso hay que girarlo. `tueste` es la media, que es lo que mira todo
     lo demás. */
  calor: 0,
  lados: null,
  tueste: 0,
  blando: 0,            // cuánto se ha reblandecido: se hunde y se estira
  burbujas: [],
  relojBurbuja: 0,
  relojGota: 0,

  ardiendo: 0,          // 0..1, si se ha prendido
  hinchado: 0,
  comido: 0,            // animación de comérselo
  relojHumo: 0,
  seguidosQuemados: 0,
  vivo: true,
  /* Sobrante del paso fijo: la física va a 120 Hz pase lo que pase. */
  sobra: 0,
};

const diceComer = {};
for (const k of Object.keys(CONF.alComer)) diceComer[k] = barajador(CONF.alComer[k]);
const diceQuemarse = barajador(CONF.alQuemarse);

function colocarBombon(reiniciar) {
  const f = sitio.fogata;
  bombon.mangoX = f.x + U * (apaisado ? 20 : 23);
  bombon.mangoY = f.y + U * 5;
  /* El sitio de reposo del palo: apuntando al fuego y un poco hacia
     arriba, como si estuviera apoyado esperando. */
  bombon.largoObj = U * (apaisado ? 16 : 19);
  bombon.angObj = Math.atan2(-U * 7, -bombon.largoObj * 0.8);

  if (reiniciar || !bombon.vivo || !bombon.estrenado) {
    bombon.estrenado = true;
    bombon.ang = bombon.angObj;
    bombon.angV = 0;
    bombon.largo = bombon.largoObj;
    bombon.largoV = 0;
    recolocarPunta();
    bombon.x = bombon.px; bombon.y = bombon.py + U * 1.2;
    bombon.vx = bombon.vy = 0;
    bombon.giro = 0;
    bombon.calor = 0;
    bombon.tueste = 0;
    bombon.lados = new Float32Array(CONF.bombon.lados);
    bombon.blando = 0;
    bombon.burbujas = [];
    bombon.ardiendo = 0;
    bombon.hinchado = 0;
    bombon.comido = 0;
    bombon.vivo = true;
  } else {
    /* Al remedir la pantalla no se reinicia nada: sólo se vuelve a
       colgar de donde toca ahora. */
    recolocarPunta();
  }
  if (!bombon.lados) bombon.lados = new Float32Array(CONF.bombon.lados);
}

function recolocarPunta() {
  bombon.px = bombon.mangoX + Math.cos(bombon.ang) * bombon.largo;
  bombon.py = bombon.mangoY + Math.sin(bombon.ang) * bombon.largo;
}

/** En qué estado está, según el tueste. */
function estadoBombon() {
  const t = bombon.tueste;
  for (const e of CONF.bombon.estados) if (t < e.hasta) return e;
  return CONF.bombon.estados[CONF.bombon.estados.length - 1];
}

/* ---- EL PASO FIJO -------------------------------------------------------
   Los muelles se integran a 120 Hz SIEMPRE, pase lo que pase con los
   fotogramas. No es manía: un muelle rígido integrado con un `dt` que
   sube de golpe —una pestaña que vuelve, un móvil que se atasca— no se
   pasa de la raya, EXPLOTA, y el bombón sale disparado fuera de la
   pantalla para no volver. Con paso fijo eso no puede pasar ni aunque
   el navegador se pare un segundo entero.                             */

const PASO_BOMBON = 1 / 120;
const MAX_PASOS_BOMBON = 8;

function moverBombon(dt) {
  if (!bombon.vivo) {
    /* Se lo ha comido: la animación y, cuando acaba, otro bombón. */
    bombon.comido += dt;
    if (bombon.comido > 1.4) colocarBombon(true);
    return;
  }

  bombon.sobra += dt;
  let pasos = 0;
  while (bombon.sobra >= PASO_BOMBON && pasos < MAX_PASOS_BOMBON) {
    bombon.sobra -= PASO_BOMBON;
    pasos++;
    pasoFisicaBombon(PASO_BOMBON);
  }
  /* Si se ha ido tantísimo tiempo que no caben los pasos, se tira lo
     que sobra en vez de acumularlo: acumularlo sólo garantiza que el
     siguiente fotograma tampoco llegue. */
  if (pasos >= MAX_PASOS_BOMBON) bombon.sobra = 0;

  cocerBombon(dt);
}

function pasoFisicaBombon(h) {
  const F = CONF.bombon.fisica;

  /* ---- 1. A dónde quiere ir el palo ----
     Si lo llevas cogido, apunta al dedo. Si no, vuelve a su sitio. El
     largo se limita aquí y no en el dedo: así, cuando estiras más allá
     del alcance, el palo se queda tirante y se nota que TIENE un
     alcance en vez de seguirte a cualquier parte. */
  if (bombon.agarrado) {
    const dx = bombon.destX - bombon.mangoX;
    const dy = bombon.destY - bombon.mangoY;
    bombon.angObj = Math.atan2(dy, dx);
    bombon.largoObj = clamp(Math.hypot(dx, dy), U * 9, U * (apaisado ? 30 : 34));
  }

  /* ---- 2. El palo, como muelle angular ----
     Y con la gravedad venciéndolo: un palo sujeto por un extremo pesa
     más cuanto más en cruz esté, que es por lo que cuesta mantenerlo
     horizontal y no cuesta nada tenerlo vertical. El coseno del ángulo
     es exactamente ese brazo de palanca. */
  let angA = (bombon.angObj - bombon.ang) * F.muellePalo - bombon.angV * F.frenoPalo;
  angA += Math.cos(bombon.ang) * F.pesoPalo * (bombon.largo / (U * 20));
  bombon.angV += angA * h;
  bombon.ang += bombon.angV * h;

  let larA = (bombon.largoObj - bombon.largo) * F.muelleLargo - bombon.largoV * F.frenoLargo;
  bombon.largoV += larA * h;
  bombon.largo += bombon.largoV * h;

  /* ---- 3. La punta, y con qué velocidad se mueve ---- */
  const pxAntes = bombon.px, pyAntes = bombon.py;
  recolocarPunta();
  bombon.pvx = (bombon.px - pxAntes) / h;
  bombon.pvy = (bombon.py - pyAntes) / h;

  /* ---- 4. El bombón colgando de la punta ----
     Muelle hacia el punto de reposo —un poco por debajo de la punta—,
     gravedad, y rozamiento. De aquí salen el balanceo y la inercia sin
     escribir ni una línea de «si se mueve, inclínalo». */
  const r = radioBombon();
  const repY = bombon.py + r * F.cuelga;
  let fx = (bombon.px - bombon.x) * F.muelleBombon - bombon.vx * F.frenoBombon;
  let fy = (repY - bombon.y) * F.muelleBombon - bombon.vy * F.frenoBombon + F.gravedad;
  /* Derretido pesa más y se frena menos: se bambolea como un flan. */
  const flan = 1 + bombon.blando * 0.8;
  bombon.vx += (fx / flan) * h;
  bombon.vy += (fy / flan) * h;
  bombon.x += bombon.vx * h;
  bombon.y += bombon.vy * h;

  /* ---- 5. El tope duro ----
     El palo está CLAVADO en el bombón: por muy deprisa que muevas la
     mano, no se puede separar más de un radio y pico. Un muelle solo no
     basta —con un tirón fuerte se estira sin límite y se ve el bombón
     flotando lejos del palo—, así que se corta en seco Y se le quita la
     parte de la velocidad que iba en esa dirección. Sin quitarla, se
     queda rebotando contra el tope para siempre. */
  const dx2 = bombon.x - bombon.px, dy2 = bombon.y - bombon.py;
  const dist = Math.hypot(dx2, dy2);
  const tope = r * F.maxSeparacion;
  if (dist > tope && dist > 0.0001) {
    const nx = dx2 / dist, ny = dy2 / dist;
    bombon.x = bombon.px + nx * tope;
    bombon.y = bombon.py + ny * tope;
    const radial = bombon.vx * nx + bombon.vy * ny;
    if (radial > 0) { bombon.vx -= nx * radial; bombon.vy -= ny * radial; }
  }

  /* ---- 6. El giro ----
     El bombón se inclina hacia donde cuelga. No hay ángulo que simular:
     ES la dirección en la que está tirando, y por eso al frenar de
     golpe se ladea solo. */
  bombon.giro = Math.atan2(bombon.y - bombon.py, bombon.x - bombon.px) - Math.PI / 2;
}

/** El radio del bombón ahora mismo, con lo hinchado y lo blando. */
function radioBombon() {
  return U * (2.6 + bombon.hinchado * 0.9);
}

/* ---- COCER EL BOMBÓN ----------------------------------------------------

   ── POR QUÉ NO ES `if (cercaDelFuego) quemar()` ──────────────────────
   Porque así no se tuesta nada. Se enciende y se apaga, y lo único que
   se puede hacer es acercarlo y esperar.

   Aquí hay tres cosas encadenadas, y cada una tarda lo suyo:

     1. el SITIO donde está tiene una temperatura (cae con el cuadrado
        de la distancia al fuego, y depende de cómo esté el fuego);
     2. el bombón coge esa temperatura DESPACIO, porque tiene masa. Por
        eso sigue tostándose un rato después de sacarlo, y por eso
        pasarlo un segundo por la llama no hace nada;
     3. y sólo por encima de cierta temperatura empieza a dorarse. El
        azúcar necesita un mínimo; por debajo, se calienta y ya.

   ── Y SE TUESTA POR LADOS ────────────────────────────────────────────
   Seis caras, cada una con su tueste. Cada una recibe calor según
   CUÁNTO MIRA AL FUEGO, así que el lado de abajo se quema mientras el
   de arriba sigue blanco, y hay que GIRARLO. Que es lo que se hace con
   un malvavisco de verdad.

   El calor se reparte un poco entre caras vecinas, porque el azúcar
   conduce. Sin eso salían seis gajos de colores planos y parecía una
   pelota de playa.                                                    */

function cocerBombon(dt) {
  const f = sitio.fogata;
  const C = CONF.bombon;
  const r = radioBombon();

  /* ---- 1. La temperatura del sitio ---- */
  const d = Math.hypot(bombon.x - f.x, (bombon.y - (f.y - f.r)) * 1.25);
  const alcance = f.r * 4.2 * C.radioCalor;
  const cerca = clamp01(1 - d / alcance);
  /* El cuadrado: pegado quema y a dos palmos casi no hace nada. Esa
     curva es todo el juego. */
  const ambiente = cerca * cerca * clamp(fuego.vida, 0, 1.6)
                 + bombon.ardiendo * 0.9;

  /* ---- 2. El bombón coge esa temperatura, pero con inercia ---- */
  bombon.calor = damp(bombon.calor, ambiente, 1 / C.masa, dt);

  /* ---- 3. Cada cara se tuesta según lo que mire al fuego ---- */
  const n = C.lados;
  if (!bombon.lados || bombon.lados.length !== n) bombon.lados = new Float32Array(n);
  const haciaFuego = Math.atan2((f.y - f.r) - bombon.y, f.x - bombon.x);
  const paso = 6.283185 / n;
  let suma = 0;

  for (let i = 0; i < n; i++) {
    /* Hacia dónde mira esta cara, contando el giro del bombón. */
    const mira = bombon.giro + i * paso;
    /* Cuánto le da el fuego: 1 de frente, 0 de canto, nada de espaldas.
       El +0.18 es el calor que le llega por el aire aunque esté del
       otro lado; sin él, la cara de arriba no se tostaba NUNCA por
       mucho que giraras, porque siempre había alguna cara tapándola. */
    const encara = Math.max(0, Math.cos(mira - haciaFuego)) * 0.82 + 0.18;
    const recibe = bombon.calor * encara;

    if (recibe > C.umbral) {
      bombon.lados[i] += C.calienta * (recibe - C.umbral) * dt;
    } else {
      bombon.lados[i] = Math.max(0, bombon.lados[i] - C.enfria * dt * 0.5);
    }
    bombon.lados[i] = Math.min(bombon.lados[i], 1.15);
    suma += bombon.lados[i];
  }

  /* ---- 4. El azúcar conduce: las caras se igualan un poco ----
     Se hace con una copia, si no cada cara leería el valor ya
     modificado de su vecina y el calor viajaría en una dirección. */
  const k = clamp01(C.conduce * dt);
  if (k > 0) {
    const copia = bombon.lados.slice();
    for (let i = 0; i < n; i++) {
      const izq = copia[(i + n - 1) % n], der = copia[(i + 1) % n];
      bombon.lados[i] += ((izq + der) * 0.5 - copia[i]) * k;
    }
  }

  bombon.tueste = suma / n;

  /* ---- 5. Lo blando y lo hinchado ----
     Se hincha con el calor y se ablanda con el tueste. Lo blando es lo
     que luego le hace colgar la barriga y gotear. */
  bombon.hinchado = damp(bombon.hinchado, clamp01(bombon.calor * 1.25), 2.2, dt);
  /* Reblandecerse pide calor DE VERDAD, no cualquier tibieza: con
     `calor * 1.6` se derretía entero sólo por estar cerca, y un bombón
     que gotea antes de dorarse no es un bombón. Y al tostarse vuelve a
     endurecerse por fuera, que es la costra. */
  bombon.blando = damp(bombon.blando,
    clamp01((bombon.calor - 0.3) * 1.1) * clamp01(1 - bombon.tueste * 0.55), 1.4, dt);

  /* ---- 6. Las burbujas ----
     El azúcar derretido burbujea. Nacen en un punto de la superficie,
     crecen y revientan. Es lo que hace que se vea COCIÉNDOSE y no
     simplemente cambiando de color. */
  for (let i = bombon.burbujas.length - 1; i >= 0; i--) {
    const b = bombon.burbujas[i];
    b.t += dt;
    if (b.t >= b.dur) {
      bombon.burbujas.splice(i, 1);
      /* Al reventar deja una marquita más tostada en su cara. */
      const cara = Math.round(b.a / paso) % n;
      bombon.lados[(cara + n) % n] = Math.min(1.15, bombon.lados[(cara + n) % n] + 0.012);
    }
  }
  if (bombon.calor > 0.3 && bombon.burbujas.length < 7) {
    bombon.relojBurbuja -= dt;
    if (bombon.relojBurbuja <= 0) {
      bombon.relojBurbuja = azar(0.12, 0.5) / clamp(bombon.calor, 0.3, 1.5);
      /* Nacen donde más calor hay, que es donde el fuego pega. */
      const sesgo = haciaFuego - bombon.giro + azar(-1.1, 1.1);
      bombon.burbujas.push({
        a: sesgo, rr: azar(0.16, 0.34),
        t: 0, dur: azar(0.5, 1.5),
      });
    }
  }

  /* ---- 7. Las gotas ----
     Cuando está muy blando, se le cae azúcar derretido. Y si cae sobre
     la fogata, chisporrotea. */
  if (bombon.blando > 0.45) {
    bombon.relojGota -= dt;
    if (bombon.relojGota <= 0) {
      bombon.relojGota = azar(0.5, 2.4) / bombon.blando;
      const e = estadoBombon();
      soltar(bombon.x + azar(-r * 0.5, r * 0.5), bombon.y + r * 0.8, {
        vx: bombon.vx * 0.25 + azar(-6, 6),
        vy: azar(4, 22),
        vida: azar(0.7, 1.4),
        tam: U * azar(0.28, 0.5),
        tipo: TIPO.CENIZA,
      });
      void e;
      /* Si cae cerca del fuego, se oye. */
      if (Math.abs(bombon.x - f.x) < f.r * 2.2 && bombon.y < f.y) {
        setTimeout(() => sisear(0.18), 220);
      }
    }
  }

  /* ---- 8. La sorpresa ----
     Cuando ya está muy caliente, puede prenderse de golpe. Es lo que
     hace que ninguna tostada se parezca a la anterior. */
  if (!bombon.ardiendo && bombon.tueste > 0.55 && bombon.calor > 0.45) {
    if (Math.random() < C.sorpresa * bombon.calor * dt) prenderBombon();
  }
  /* Y si alguna cara se pasa del todo, arde seguro. */
  if (!bombon.ardiendo) {
    for (let i = 0; i < n; i++) if (bombon.lados[i] > 0.95) { prenderBombon(); break; }
  }

  /* ---- 9. Ardiendo ---- */
  if (bombon.ardiendo > 0) {
    bombon.ardiendo = Math.min(1, bombon.ardiendo + dt * 0.9);
    /* Arder tuesta TODAS las caras, no sólo la que mira al fuego. */
    for (let i = 0; i < n; i++) bombon.lados[i] = Math.min(1.15, bombon.lados[i] + 0.3 * dt);
    /* Se apaga solo si lo sacas del fuego, pero tarda. Y si lo agitas
       de lado, se apaga antes: eso es soplarlo con el movimiento. */
    const agita = Math.hypot(bombon.vx, bombon.vy) / (U * 60);
    if (ambiente < 0.12) bombon.ardiendo -= dt * (0.22 + agita * 0.5);
    if (bombon.ardiendo <= 0) bombon.ardiendo = 0;

    if (Math.random() < dt * 22) {
      soltar(bombon.x + azar(-U, U), bombon.y - U * 0.6, {
        vx: azar(-20, 20) + fuego.inclina * 30, vy: azar(-80, -30),
        vida: azar(0.5, 1.2), tam: azar(0.9, 2), tipo: TIPO.CHISPA,
      });
    }
  }

  /* ---- 10. El humo del bombón ---- */
  if (bombon.tueste > 0.58) {
    bombon.relojHumo -= dt;
    if (bombon.relojHumo <= 0) {
      bombon.relojHumo = mez(0.42, 0.1, clamp01((bombon.tueste - 0.58) / 0.4));
      soltar(bombon.x + azar(-U * 0.6, U * 0.6), bombon.y - U * 1.2, {
        vx: azar(-6, 6) + fuego.inclina * 18, vy: azar(-30, -14),
        vida: azar(2.2, 3.6), tam: azar(U * 0.6, U * 1.2),
        tipo: TIPO.HUMO, tono: 0.8,
      });
    }
  }
}

function prenderBombon() {
  if (bombon.ardiendo > 0) return;
  bombon.ardiendo = 0.001;
  tono(azar(180, 260), 0.3, "sawtooth", 0.05);
  golpe(0.1, 1800, 0.12, "highpass");
  for (let i = 0; i < 16; i++) {
    soltar(bombon.x + azar(-U, U), bombon.y + azar(-U, U), {
      vx: azar(-60, 60), vy: azar(-120, -20),
      vida: azar(0.6, 1.4), tam: azar(1.2, 2.6), tipo: TIPO.CHISPA,
    });
  }
}

/** Comerse el bombón. */
function comerBombon() {
  if (!bombon.vivo) return;
  const e = estadoBombon();
  bombon.vivo = false;
  bombon.comido = 0;

  /* Un mordisco: un golpe blando y un tono corto. */
  golpe(0.09, 420, 0.16, "lowpass");
  tono(azar(300, 420), 0.18, "sine", 0.07, 0.05);
  tono(azar(520, 660), 0.22, "triangle", 0.05, 0.12);

  for (let i = 0; i < 18; i++) {
    soltar(bombon.x + azar(-U, U), bombon.y + azar(-U, U), {
      vx: azar(-90, 90), vy: azar(-110, -10),
      vida: azar(0.5, 1.3), tam: azar(1.4, 3),
      tipo: TIPO.BRILLO, tono: e.id === "quemado" ? 0.1 : 0.8,
    });
  }

  decir(bombon.x, bombon.y, diceComer[e.id](), { mimo: true, importante: true });

  /* ---- Easter egg: tres quemados seguidos ---- */
  if (e.id === "quemado" || e.id === "quemandose") {
    bombon.seguidosQuemados++;
    if (bombon.seguidosQuemados === 3) {
      setTimeout(() => decir(sitio.fogata.x, sitio.fogata.y - U * 22,
        "Tres seguidos. Voy a tener que tostarlos yo. 😭", { mimo: true, importante: true }), 2200);
      magia(330);
    }
  } else {
    if (bombon.seguidosQuemados >= 2) {
      setTimeout(() => decir(bombon.x, bombon.y - U * 10,
        "Ahí está. Sabía que le cogías el punto.", { mimo: true }), 1800);
    }
    bombon.seguidosQuemados = 0;
  }
  contarLogro("bombon");
}

/**
 * El color de una cara, según lo tostada que esté.
 *
 * El último estado tiene `hasta: 99` para que nada se salga de la
 * lista, y eso escondía un fallo: al interpolar dentro de él, con un
 * tramo de 98 de ancho y un tueste que como mucho llega a 1.15, el
 * factor salía 0.002 y el negro del quemado no se veía JAMÁS. Un bombón
 * carbonizado se quedaba marrón claro. Así que el tramo del último se
 * recorta al tueste máximo de verdad.
 */
const TUESTE_MAX = 1.15;

function colorTueste(t, hondo) {
  const est = CONF.bombon.estados;
  let i = 0;
  while (i < est.length - 1 && t >= est[i].hasta) i++;
  const antes = est[Math.max(0, i - 1)];
  const desde = i === 0 ? 0 : antes.hasta;
  const hasta = Math.min(est[i].hasta, TUESTE_MAX);
  const k = clamp01((t - desde) / Math.max(0.01, hasta - desde));
  return mezColor(antes.color[hondo ? 1 : 0], est[i].color[hondo ? 1 : 0], k);
}

function dibujarBombon() {
  const d = desplazar(1.9);
  const bx = bombon.x + d.x, by = bombon.y + d.y;
  const px = bombon.px + d.x, py = bombon.py + d.y;
  const mx = bombon.mangoX + d.x, my = bombon.mangoY + d.y;

  /* ---- El palo ----
     Una curva, no una recta: un palo de verdad se dobla con el peso. Y
     la comba no es fija: sale de lo LEJOS que esté la punta de donde
     debería estar si el palo fuera rígido. Cuando lo mueves deprisa el
     palo va por detrás, y entonces se dobla de verdad. */
  const largo = Math.hypot(px - mx, py - my);
  const retraso = bombon.angV * largo * 0.06;
  const comba = clamp(largo * 0.07 + retraso, -U * 6, U * 6);
  const nx = -(py - my) / Math.max(1, largo), ny = (px - mx) / Math.max(1, largo);
  const cxP = (mx + px) / 2 + nx * comba;
  const cyP = (my + py) / 2 + ny * comba + largo * 0.05;

  const g = ctx.createLinearGradient(mx, my, px, py);
  g.addColorStop(0, `rgb(${Math.round(mez(58, 130, fuego.brillo))},${Math.round(mez(42, 86, fuego.brillo))},${Math.round(mez(30, 54, fuego.brillo))})`);
  g.addColorStop(1, `rgb(${Math.round(mez(78, 170, fuego.brillo))},${Math.round(mez(56, 112, fuego.brillo))},${Math.round(mez(38, 68, fuego.brillo))})`);
  ctx.strokeStyle = g;
  ctx.lineWidth = U * 0.62;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(mx, my);
  ctx.quadraticCurveTo(cxP, cyP, px, py);
  ctx.stroke();

  if (!bombon.vivo) {
    /* Se lo está comiendo: el palo se queda solo un momento. */
    return;
  }

  /* ---- El bombón ---- */
  const r = radioBombon();
  /* ---- La forma ----
     De frío es un CILINDRO de pie: más alto que ancho. Al calentarse se
     hincha y al derretirse se hunde —se ensancha y se aplasta—, hasta
     quedarse casi redondo. Antes empezaba ya casi circular y no se
     notaba ningún cambio: era la misma bola siempre, sólo que de otro
     color. */
  const ancho = r * (0.9 + bombon.blando * 0.26 + bombon.hinchado * 0.1);
  const alto  = r * (1.3 - bombon.blando * 0.22 - bombon.hinchado * 0.05);

  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(bombon.giro);

  /* ---- El cuerpo, cara a cara ----
     Seis gajos, cada uno con el color de lo tostada que está esa cara.
     Con un degradado cónico si el navegador lo tiene —que es lo suyo,
     porque el tueste da la vuelta al bombón— y con gajos recortados si
     no. En los dos casos el tueste se ve GIRAR cuando giras el palo,
     que es lo que hace que valga la pena girarlo. */
  const n = CONF.bombon.lados;
  const paso6 = 6.283185 / n;
  ctx.beginPath();
  /* Un malvavisco es un CILINDRO, no una bola: cantos casi rectos y las
     dos tapas redondeadas. Con el radio a la mitad parecía un caramelo
     cuadrado; con 0.78 del ancho queda la cápsula de siempre. */
  if (ctx.roundRect) ctx.roundRect(-ancho, -alto, ancho * 2, alto * 2, ancho * 0.62);
  else ctx.rect(-ancho, -alto, ancho * 2, alto * 2);

  /* ---- El tueste, cara a cara ----
     El primer intento fue un degradado CÓNICO con una parada por cara.
     Técnicamente correcto y visualmente falso: un cónico reparte el
     color en gajos que salen del centro, así que el bombón salía como
     un gráfico de quesitos. Un malvavisco no se tuesta en quesitos: se
     tuesta A MANCHAS, por fuera, donde le ha dado la llama.

     Así que se pinta el cuerpo del color de la cara MENOS tostada —el
     fondo— y encima, recortada a la silueta, una mancha difuminada por
     cara, pegada al borde en su dirección y con la opacidad de lo que
     esa cara se haya tostado de más. Las manchas se solapan y se
     funden solas, que es exactamente lo que hacen las de verdad. */
  let minT = Infinity, maxT = -Infinity;
  for (let i = 0; i < n; i++) {
    if (bombon.lados[i] < minT) minT = bombon.lados[i];
    if (bombon.lados[i] > maxT) maxT = bombon.lados[i];
  }
  const gb = ctx.createLinearGradient(0, -alto, 0, alto);
  gb.addColorStop(0, colorTueste(minT, false));
  gb.addColorStop(1, colorTueste(minT, true));
  ctx.fillStyle = gb;
  ctx.fill();

  if (maxT - minT > 0.01) {
    ctx.save();
    ctx.clip();
    for (let i = 0; i < n; i++) {
      /* La opacidad sale de la diferencia DE VERDAD con la cara menos
         tostada, no de dónde queda entre la mínima y la máxima. Con la
         proporción, un bombón con todas las caras casi crudas pintaba
         la menos cruda a tope y parecía medio hecho. */
      const extra = clamp01((bombon.lados[i] - minT) * 3.2);
      if (extra < 0.05) continue;
      const a = i * paso6;
      const mx2 = Math.cos(a) * ancho * 0.72;
      const my2 = Math.sin(a) * alto * 0.72;
      const rr = Math.max(ancho, alto) * 0.95;
      const gm = ctx.createRadialGradient(mx2, my2, 0, mx2, my2, rr);
      const col = colorTueste(bombon.lados[i], false);
      gm.addColorStop(0, col);
      gm.addColorStop(0.55, col.replace("rgb(", "rgba(").replace(")", ",0.45)"));
      gm.addColorStop(1, col.replace("rgb(", "rgba(").replace(")", ",0)"));
      ctx.globalAlpha = clamp01(extra);
      ctx.fillStyle = gm;
      ctx.fillRect(-ancho * 1.2, -alto * 1.2, ancho * 2.4, alto * 2.4);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-ancho, -alto, ancho * 2, alto * 2, ancho * 0.62);
    else ctx.rect(-ancho, -alto, ancho * 2, alto * 2);
  }

  /* Y una sombra propia de arriba abajo, que si no queda plano. */
  const gs = ctx.createLinearGradient(0, -alto, 0, alto);
  gs.addColorStop(0, "rgba(255,255,255,0.09)");
  gs.addColorStop(0.55, "rgba(0,0,0,0)");
  gs.addColorStop(1, "rgba(60,30,10,0.22)");
  ctx.fillStyle = gs;
  ctx.fill();

  /* El brillo del fuego en el canto de abajo. */
  const gi = ctx.createLinearGradient(0, alto * 0.2, 0, alto);
  gi.addColorStop(0, "rgba(255,170,80,0)");
  gi.addColorStop(1, `rgba(255,170,80,${0.34 * fuego.brillo})`);
  ctx.fillStyle = gi;
  ctx.fill();

  /* La costura: la raya de en medio que tiene todo malvavisco. Es una
     tontería de dos píxeles y es lo que hace que se lea como un
     malvavisco y no como una goma de borrar. */
  ctx.strokeStyle = "rgba(90,60,35,0.16)";
  ctx.lineWidth = Math.max(0.6, ancho * 0.07);
  ctx.beginPath();
  ctx.moveTo(-ancho * 0.92, 0);
  ctx.lineTo(ancho * 0.92, 0);
  ctx.stroke();

  /* El barniz: cuando se derrite, brilla. Una mancha clara arriba a la
     izquierda, que es de donde vendría la luz. */
  if (bombon.blando > 0.1) {
    ctx.globalAlpha = bombon.blando * 0.4;
    ctx.fillStyle = "rgba(255,248,230,0.7)";
    ctx.beginPath();
    ctx.ellipse(-ancho * 0.34, -alto * 0.42, ancho * 0.3, alto * 0.18, -0.4, 0, 6.283);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* ---- Las burbujas ----
     Cada una crece y revienta. El seno de su vida da las dos cosas de
     una vez: sale de la nada, se hincha y desaparece. */
  for (const b of bombon.burbujas) {
    const k = clamp01(b.t / b.dur);
    const s = Math.sin(k * Math.PI) * b.rr * ancho;
    if (s < 0.3) continue;
    const ax = Math.cos(b.a) * ancho * 0.62;
    const ay = Math.sin(b.a) * alto * 0.62;
    ctx.fillStyle = `rgba(255,244,214,${0.5 * Math.sin(k * Math.PI)})`;
    ctx.beginPath();
    ctx.arc(ax, ay, s, 0, 6.283);
    ctx.fill();
    /* El puntito de luz encima: sin él son manchas, con él son pompas. */
    ctx.fillStyle = `rgba(255,255,255,${0.55 * Math.sin(k * Math.PI)})`;
    ctx.beginPath();
    ctx.arc(ax - s * 0.3, ay - s * 0.3, s * 0.3, 0, 6.283);
    ctx.fill();
  }

  /* ---- El goterón ----
     Cuando está muy blando, le cuelga azúcar por abajo antes de caer.
     Es el mismo dato que dispara las gotas, pero visto. */
  if (bombon.blando > 0.55) {
    /* Cuelga POR DEBAJO del bombón, no desde dentro: partiendo de la
       mitad del cuerpo se veía un pico de otro color metido en la
       barriga, como si estuviera roto. */
    const cuelga = (bombon.blando - 0.55) * alto * 2.2;
    ctx.fillStyle = colorTueste(bombon.tueste, true);
    ctx.beginPath();
    ctx.moveTo(-ancho * 0.26, alto * 0.94);
    ctx.quadraticCurveTo(-ancho * 0.16, alto + cuelga, 0, alto + cuelga);
    ctx.quadraticCurveTo(ancho * 0.16, alto + cuelga, ancho * 0.26, alto * 0.94);
    ctx.closePath();
    ctx.fill();
  }

  /* Si está ardiendo, su propia llamita. */
  if (bombon.ardiendo > 0) {
    ctx.globalCompositeOperation = "lighter";
    const hL = r * 3.4 * bombon.ardiendo * (0.7 + 0.3 * Math.sin(reloj * 9));
    /* La llama sube DERECHA aunque el bombón esté ladeado: el fuego no
       sabe cómo tengas tú el palo. Por eso se deshace el giro. */
    ctx.rotate(-bombon.giro);
    /* Un halo redondo detrás, que es lo que le quita el canto duro de
       triángulo recortado y hace que la llama ILUMINE en vez de estar
       pegada encima. */
    const gh = ctx.createRadialGradient(0, -alto - hL * 0.35, 0, 0, -alto - hL * 0.35, hL * 1.2);
    gh.addColorStop(0, `rgba(255,190,90,${0.35 * bombon.ardiendo})`);
    gh.addColorStop(1, "rgba(255,150,60,0)");
    ctx.fillStyle = gh;
    ctx.beginPath();
    ctx.arc(0, -alto - hL * 0.35, hL * 1.2, 0, 6.283);
    ctx.fill();

    /* El degradado arranca DENTRO del bombón y con poca opacidad: con
       el blanco a tope justo en el borde de arriba, lo que se veía era
       una mancha blanca posada encima, no una llama saliendo de él. */
    const gf = ctx.createLinearGradient(0, -alto * 0.2, 0, -alto - hL);
    gf.addColorStop(0, "rgba(255,210,120,0.35)");
    gf.addColorStop(0.35, "rgba(255,235,170,0.8)");
    gf.addColorStop(0.62, "rgba(255,150,50,0.55)");
    gf.addColorStop(1, "rgba(220,60,20,0)");
    ctx.fillStyle = gf;
    /* Dos lenguas y no una: la grande y una pequeña a un lado, cada una
       con su ritmo. Una sola se lee como una forma; dos se leen como
       fuego. */
    for (const [esc, desf] of [[1, 0], [0.55, 2.1]]) {
      const ld = Math.sin(reloj * 6 + desf) * r * 0.5 + fuego.inclina * r * 0.6;
      const h2 = hL * esc;
      const w2 = r * 0.8 * esc;
      ctx.beginPath();
      ctx.moveTo(-w2, -alto * 0.6);
      ctx.bezierCurveTo(-w2 * 0.9, -alto - h2 * 0.5, ld - w2 * 0.3, -alto - h2 * 0.8,
                        ld * 1.2, -alto - h2);
      ctx.bezierCurveTo(ld + w2 * 0.3, -alto - h2 * 0.8, w2 * 0.9, -alto - h2 * 0.5,
                        w2, -alto * 0.6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  ctx.restore();

  /* Y un aro finísimo cuando se puede coger, para que se note que es
     tocable sin poner un cartel. */
  if (!bombon.agarrado) {
    const pulso = 0.12 + 0.08 * Math.sin(reloj * 2.2);
    ctx.strokeStyle = `rgba(255,235,210,${pulso})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(bx, by, r * 2.2, 0, 6.283);
    ctx.stroke();
  }
}

// ==========================================
// PANEL DE AMBIENTES
// ==========================================
//
// No es un menú: son PIEDRAS puestas en semicírculo delante de la
// fogata, como las que uno alinea sin darse cuenta mientras habla.
//
// Cada piedra lleva su símbolo grabado y se enciende cuando su ambiente
// suena. El volumen es el arco de luz que la rodea: se arrastra de lado
// sobre la piedra para subirlo o bajarlo.
//
//   · tocar          → enciende o apaga (con fundido)
//   · arrastrar      → volumen
//
// Se dibuja en el lienzo, no en HTML, porque tiene que recibir la luz
// del fuego igual que todo lo demás. Un panel HTML encima se vería
// pegado, no puesto.

const panel = {
  piedras: [],
  arrastrando: null,
  usado: false,
};

function construirPanel() {
  panel.piedras = [];
  const n = CONF.ambientes.length;
  const f = sitio.fogata;
  /* En arco por delante de la fogata, mirando a quien mira. */
  const radio = f.r * (apaisado ? 3.1 : 3.4);
  /* El arco no puede llegar a las esquinas: si esta página va dentro del
     librito, ahí están sus flechas de pasar página, y las dos piedras de
     los extremos quedaban justo debajo y no se podían tocar. Se limita
     el semiancho a un tercio de la hoja y el problema desaparece en
     cualquier pantalla, dentro del libro o fuera. */
  const semiancho = Math.min(radio * 1.42, A * 0.33);
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.5 : i / (n - 1);
    const a = mez(Math.PI * 0.86, Math.PI * 0.14, t);
    panel.piedras.push({
      conf: CONF.ambientes[i],
      x: f.x + Math.cos(a) * semiancho,
      y: f.y + f.r * 1.05 + Math.sin(a) * radio * 0.26,
      r: U * (apaisado ? 3.1 : 3.4),
      on: CONF.ambientes[i].on,
      vol: CONF.ambientes[i].vol,
      luz: CONF.ambientes[i].on ? 1 : 0,
      pulso: 0,
    });
  }
}

function moverPanel(dt) {
  for (const p of panel.piedras) {
    p.luz = damp(p.luz, p.on ? 1 : 0, 3, dt);
    p.pulso = Math.max(0, p.pulso - dt * 2.2);
  }
}

function dibujarPanel() {
  const d = desplazar(2.1);
  for (const p of panel.piedras) {
    const x = p.x + d.x, y = p.y + d.y;
    const col = p.conf.color;

    /* El halo del ambiente encendido, que además hace de medidor: cuanto
       más volumen, más se abre. */
    if (p.luz > 0.02) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, p.r * (2.2 + p.vol * 2.4));
      g.addColorStop(0, hexA(col, 0.34 * p.luz));
      g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, p.r * (2.2 + p.vol * 2.4), 0, 6.283);
      ctx.fill();
    }

    /* La piedra. Iluminada por el fuego por el lado que mira a la
       fogata, como todo lo demás de la escena. */
    const haciaFuego = Math.sign(sitio.fogata.x - p.x);
    const gp = ctx.createLinearGradient(x - p.r, y - p.r, x + p.r * haciaFuego, y + p.r);
    const il = fuego.brillo * 0.7;
    gp.addColorStop(0, `rgb(${Math.round(mez(40, 92, il))},${Math.round(mez(38, 68, il))},${Math.round(mez(40, 56, il))})`);
    gp.addColorStop(1, `rgb(${Math.round(mez(22, 52, il))},${Math.round(mez(21, 40, il))},${Math.round(mez(24, 34, il))})`);
    ctx.fillStyle = gp;
    ctx.beginPath();
    ctx.ellipse(x, y, p.r, p.r * 0.86, 0, 0, 6.283);
    ctx.fill();

    /* El arco de volumen, grabado en el canto. */
    if (p.luz > 0.05) {
      ctx.strokeStyle = hexA(col, 0.75 * p.luz);
      ctx.lineWidth = Math.max(1.6, p.r * 0.13);
      ctx.lineCap = "round";
      ctx.beginPath();
      /* Empieza abajo a la izquierda y da la vuelta según el volumen. */
      ctx.arc(x, y, p.r * 1.24, Math.PI * 0.78, Math.PI * 0.78 + Math.PI * 1.44 * p.vol);
      ctx.stroke();
      /* Y el resto del arco, apagado, para que se vea cuánto queda. */
      ctx.strokeStyle = hexA(col, 0.12 * p.luz);
      ctx.beginPath();
      ctx.arc(x, y, p.r * 1.24, Math.PI * 0.78 + Math.PI * 1.44 * p.vol, Math.PI * 2.22);
      ctx.stroke();
    }

    /* El símbolo. */
    ctx.save();
    ctx.globalAlpha = 0.35 + p.luz * 0.65;
    ctx.font = `${Math.round(p.r * 1.05)}px ui-sans-serif, "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(p.conf.icono, x, y + p.r * 0.04);
    ctx.restore();

    /* Y un destello al tocarla. */
    if (p.pulso > 0.01) {
      ctx.strokeStyle = hexA(col, p.pulso * 0.7);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, p.r * (1.3 + (1 - p.pulso) * 1.6), 0, 6.283);
      ctx.stroke();
    }
  }
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function alternarPiedra(p) {
  p.on = !p.on;
  p.pulso = 1;
  ambiente(p.conf.id, p.on, p.vol);
  /* Dos de las piedras no encienden sólo un sonido: cambian el TIEMPO
     que hace. Lo que pasa después —la niebla, el color del bosque, la
     fogata apagándose— lo lleva el módulo del clima, que es el único
     que sabe de eso. */
  sincronizarClima();
  tono(p.on ? 520 : 330, 0.4, "sine", 0.05);
  marcarPanelUsado();
  decir(p.x, p.y - U * 5, `${p.conf.icono} ${p.conf.nombre}${p.on ? "" : " · apagado"}`, { dur: 1.9 });
}

/**
 * Lleva el estado del panel al estado del clima.
 *
 * Es el único puente entre los dos, a propósito: el panel no sabe qué
 * es la niebla ni cómo se apaga una fogata, y el clima no sabe que hay
 * unas piedras. Se hablan por aquí y por ningún otro sitio.
 */
function sincronizarClima() {
  for (const piedra of panel.piedras) {
    const v = piedra.on ? piedra.vol : 0;
    if (piedra.conf.id === "lluvia") clima.lluviaObj = v;
    if (piedra.conf.id === "relampagos") clima.tormentaObj = v;
  }
}

function marcarPanelUsado() {
  if (panel.usado) return;
  panel.usado = true;
  raiz.classList.add("is-panel-usado");
}

// ==========================================
// CAJITA MUSICAL
// ==========================================
//
// Una cajita de madera apoyada en una piedra, al lado de la fogata. Se
// toca y se abre; se vuelve a tocar y se cierra.
//
// Suena `musica.mp3`, con fundido de entrada y de salida. Si el archivo
// no está, suena una nana sintetizada en bucle —la misma melodía— para
// que la cajita nunca se quede muda.

const cajita = {
  abierta: false,
  tapa: 0,            // 0 cerrada · 1 abierta
  nota: 0,            // el brillo de la última nota
  fuente: null,
  gain: null,
  sinteticaReloj: null,
  girando: 0,
};

/* La nana sintetizada, por si no hay archivo. Es una caja de música: el
   sonido de una púa metálica, que es el fundamental más dos armónicos
   INARMÓNICOS —2.76 y 5.4—, porque una lámina de metal no vibra en
   múltiplos exactos. Eso es lo que la hace sonar a metal y no a flauta. */
const NANA = [
  ["E5",1],["G5",0.5],["A5",1.5],["G5",0.5],["E5",1],["D5",1],["E5",2],
  ["C5",1],["E5",0.5],["G5",1.5],["E5",0.5],["D5",1],["C5",2],
];
const SEMI = { C:0, Cs:1, D:2, Ds:3, E:4, F:5, Fs:6, G:7, Gs:8, A:9, As:10, B:11 };
function hz(n) {
  const m = /^([A-G]s?)(-?\d)$/.exec(n);
  if (!m) return 440;
  const k = SEMI[m[1]] + (Number(m[2]) + 1) * 12;
  return 440 * Math.pow(2, (k - 69) / 12);
}

function puaCajita(frecuencia, cuando, destino) {
  const c = audio.ctx;
  for (const [mult, amp] of [[1, 1], [2.76, 0.3], [5.4, 0.12]]) {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(frecuencia * mult, cuando);
    /* Los armónicos se apagan antes que el fundamental: por eso suena
       metálico al principio y dulce al final. */
    const largo = 2.3 / mult;
    g.gain.setValueAtTime(0, cuando);
    g.gain.linearRampToValueAtTime(0.14 * amp, cuando + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, cuando + largo);
    o.connect(g).connect(destino);
    o.start(cuando); o.stop(cuando + largo + 0.05);
  }
}

async function abrirCajita() {
  if (!despertarAudio()) return;
  cajita.abierta = true;
  golpe(0.07, 1500, 0.14, "bandpass");

  cajita.gain = audio.ctx.createGain();
  cajita.gain.gain.value = 0;
  cajita.gain.connect(audio.maestro);
  cajita.gain.gain.linearRampToValueAtTime(0.75, audio.ctx.currentTime + 1.4);

  /* Se prueban las rutas en orden y se coge la primera que exista. */
  let buf = null;
  for (const ruta of [CONF.rutas.musica, ...(CONF.rutas.musicaTambien || [])]) {
    buf = await traerBuffer(ruta);
    if (buf) break;
    if (!cajita.abierta) return;
  }
  if (!cajita.abierta) return;                 // la cerró mientras cargaba

  if (buf) {
    const src = audio.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(cajita.gain);
    src.start();
    cajita.fuente = src;
  } else {
    /* La nana, en bucle, programada por compases. */
    const negra = 60 / 82;
    let t = audio.ctx.currentTime + 0.2;
    const tocarVuelta = () => {
      if (!cajita.abierta || !audio.ctx) return;
      let total = 0;
      for (const [nota, dur] of NANA) {
        puaCajita(hz(nota), t + total, cajita.gain);
        puaCajita(hz(nota) / 2, t + total + 0.01, cajita.gain);
        total += dur * negra;
      }
      t += total;
      cajita.sinteticaReloj = setTimeout(tocarVuelta, (total - 0.4) * 1000);
    };
    tocarVuelta();
  }
  decir(sitio.cajita.x, sitio.cajita.y - U * 7, "🎵", { dur: 2 });
}

function cerrarCajita() {
  cajita.abierta = false;
  golpe(0.08, 700, 0.16, "lowpass");
  clearTimeout(cajita.sinteticaReloj);
  if (cajita.gain) {
    const g = cajita.gain, src = cajita.fuente;
    const t = audio.ctx.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 1.2);
    setTimeout(() => {
      try { src?.stop(); } catch {}
      try { g.disconnect(); } catch {}
    }, 1400);
  }
  cajita.fuente = null;
  cajita.gain = null;
}

function moverCajita(dt) {
  cajita.tapa = damp(cajita.tapa, cajita.abierta ? 1 : 0, 4.5, dt);
  if (cajita.abierta) {
    cajita.girando += dt * 2.4;
    /* Una nota de luz cada tanto, al ritmo de la música. */
    cajita.nota = Math.max(0, cajita.nota - dt * 1.6);
    if (Math.random() < dt * 1.6) {
      cajita.nota = 1;
      soltar(sitio.cajita.x + azar(-U, U), sitio.cajita.y - U * 3, {
        vx: azar(-14, 14), vy: azar(-34, -16),
        vida: azar(1.6, 2.8), tam: azar(1.2, 2.4),
        tipo: TIPO.BRILLO, tono: 0.85,
      });
    }
  } else {
    cajita.nota = Math.max(0, cajita.nota - dt * 2);
  }
}

function dibujarCajita() {
  const d = desplazar(2.0);
  const c = sitio.cajita;
  const x = c.x + d.x, y = c.y + d.y;
  const w = c.r * 1.5, h = c.r * 0.9;

  /* La piedra sobre la que está. */
  ctx.fillStyle = `rgb(${Math.round(mez(30, 70, fuego.brillo * 0.6))},${Math.round(mez(28, 52, fuego.brillo * 0.6))},${Math.round(mez(30, 44, fuego.brillo * 0.6))})`;
  ctx.beginPath();
  ctx.ellipse(x, y + h * 0.75, w * 1.1, h * 0.5, 0, 0, 6.283);
  ctx.fill();

  /* La luz que sale de dentro cuando está abierta. */
  if (cajita.tapa > 0.05) {
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(x, y - h * 0.2, 0, x, y - h * 0.2, w * 3);
    g.addColorStop(0, `rgba(255,214,150,${0.3 * cajita.tapa})`);
    g.addColorStop(1, "rgba(255,214,150,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y - h * 0.2, w * 3, 0, 6.283);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }

  /* La tapa, que se abre girando sobre su bisagra de atrás. Se finge el
     giro estrechándola: una tapa plana rotando de verdad se ve de canto
     y desaparece a los 90 grados. */
  const abre = cajita.tapa;
  ctx.save();
  ctx.translate(x, y - h * 0.5);
  const gt = ctx.createLinearGradient(-w, -h * 0.4, w, h * 0.2);
  const il = fuego.brillo;
  gt.addColorStop(0, `rgb(${Math.round(mez(96, 180, il))},${Math.round(mez(62, 112, il))},${Math.round(mez(38, 62, il))})`);
  gt.addColorStop(1, `rgb(${Math.round(mez(58, 120, il))},${Math.round(mez(36, 72, il))},${Math.round(mez(22, 40, il))})`);
  ctx.fillStyle = gt;
  ctx.save();
  ctx.translate(0, -h * 0.1);
  ctx.scale(1, 1 - abre * 0.82);
  ctx.translate(0, -h * 0.22 * (1 - abre));
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-w, -h * 0.34, w * 2, h * 0.5, h * 0.12);
  else ctx.rect(-w, -h * 0.34, w * 2, h * 0.5);
  ctx.fill();
  ctx.restore();
  ctx.restore();

  /* El cuerpo. */
  const gc = ctx.createLinearGradient(x - w, y, x + w, y + h);
  gc.addColorStop(0, `rgb(${Math.round(mez(84, 164, fuego.brillo))},${Math.round(mez(54, 100, fuego.brillo))},${Math.round(mez(32, 56, fuego.brillo))})`);
  gc.addColorStop(1, `rgb(${Math.round(mez(48, 104, fuego.brillo))},${Math.round(mez(30, 62, fuego.brillo))},${Math.round(mez(18, 34, fuego.brillo))})`);
  ctx.fillStyle = gc;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - w, y - h * 0.5, w * 2, h, h * 0.16);
  else ctx.rect(x - w, y - h * 0.5, w * 2, h);
  ctx.fill();

  /* El filete dorado. */
  ctx.strokeStyle = `rgba(214,168,86,${0.4 + fuego.brillo * 0.4})`;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - w * 0.88, y - h * 0.34, w * 1.76, h * 0.72, h * 0.12);
  else ctx.rect(x - w * 0.88, y - h * 0.34, w * 1.76, h * 0.72);
  ctx.stroke();

  /* La bailarina de dentro, que sólo se ve con la tapa abierta. */
  if (abre > 0.3) {
    ctx.save();
    ctx.globalAlpha = clamp01((abre - 0.3) / 0.5);
    ctx.translate(x, y - h * 0.5);
    /* Gira estrechándose, sin bajar nunca del 25%: una silueta plana
       rotando de verdad desaparece dos veces por vuelta. */
    const s = Math.cos(cajita.girando);
    ctx.scale(Math.max(0.25, Math.abs(s)) * Math.sign(s || 1), 1);
    ctx.fillStyle = "#ffd0e4";
    ctx.beginPath();
    ctx.ellipse(0, -h * 0.12, w * 0.24, h * 0.2, 0, 0, 6.283);
    ctx.fill();
    ctx.fillStyle = "#ffe8f2";
    ctx.beginPath();
    ctx.arc(0, -h * 0.42, w * 0.1, 0, 6.283);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* La manivela del costado, que gira mientras suena. */
  ctx.save();
  ctx.translate(x + w * 1.08, y);
  ctx.rotate(cajita.abierta ? cajita.girando * 1.2 : 0);
  ctx.strokeStyle = "#c9a45c";
  ctx.lineWidth = Math.max(1.4, w * 0.07);
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(w * 0.24, 0);
  ctx.stroke();
  ctx.fillStyle = "#e0bd72";
  ctx.beginPath();
  ctx.arc(w * 0.26, 0, w * 0.09, 0, 6.283);
  ctx.fill();
  ctx.restore();
}

// ==========================================
// CABAÑA
// ==========================================
//
// Al otro lado de la fogata, con la luz puesta. Es lo más acogedor de
// la escena y por eso está entera dibujada: tablones con su veta,
// ventanas con su cruz, chimenea con su humo, farol en la puerta,
// matas alrededor y un caminito de piedras hasta la entrada.
//
// Se toca y empieza la cinemática.

const cabana = {
  brillo: 1,          // el parpadeo de las ventanas
  humo: 0,
  puerta: 0,          // 0 cerrada · 1 abierta (durante la cinemática)
  resalte: 0,         // cuando el dedo pasa por encima
  farol: 0,
};

function moverCabana(dt) {
  cabana.brillo = 0.86 + 0.14 * Math.sin(reloj * 0.9) + 0.04 * Math.sin(reloj * 3.7);
  cabana.farol = 0.8 + 0.2 * Math.sin(reloj * 2.3 + 1.1);
  cabana.resalte = damp(cabana.resalte, 0, 2.6, dt);

  cabana.humo -= dt;
  if (cabana.humo <= 0) {
    cabana.humo = flojo ? 0.7 : 0.38;
    const c = sitio.cabana;
    soltar(c.x + c.w * 0.3 + azar(-2, 2), c.y - c.h * 1.24, {
      vx: azar(-4, 10), vy: azar(-26, -14),
      vida: azar(3.4, 5.6), tam: azar(U * 0.5, U * 1.1),
      tipo: TIPO.HUMO, tono: 0.2,
    });
  }
}

function dibujarCabana() {
  const d = desplazar(1.25);
  const c = sitio.cabana;
  const x = c.x + d.x, y = c.y + d.y;
  const w = c.w, h = c.h;

  /* Cuánta luz le llega de la fogata: cae con la distancia, así que la
     cabaña está más apagada que la hoguera aunque las dos se dibujen
     igual. Es lo que da sensación de que hay espacio entre ellas. */
  const distF = Math.abs(x - sitio.fogata.x) / A;
  const ilum = fuego.brillo * clamp01(1 - distF * 1.3) * 0.7;

  /* ---- El caminito de piedras ---- */
  for (let i = 0; i < 7; i++) {
    const t = i / 6;
    const pxc = mez(x - w * 0.1, sitio.fogata.x + U * 10, t);
    const pyc = mez(y + h * 0.04, sitio.fogata.y + U * 5, t) + Math.sin(i * 2.1) * U * 0.8;
    const s = U * mez(1.5, 2.2, t);
    ctx.fillStyle = `rgb(${Math.round(mez(30, 92, fuego.brillo * (0.3 + t * 0.7)))},${Math.round(mez(29, 78, fuego.brillo * (0.3 + t * 0.7)))},${Math.round(mez(30, 68, fuego.brillo * (0.3 + t * 0.7)))})`;
    ctx.beginPath();
    ctx.ellipse(pxc, pyc, s, s * 0.5, 0, 0, 6.283);
    ctx.fill();
  }

  /* ---- La sombra en el suelo ---- */
  ctx.fillStyle = "rgba(4,6,12,0.5)";
  ctx.beginPath();
  ctx.ellipse(x, y + h * 0.03, w * 0.72, h * 0.09, 0, 0, 6.283);
  ctx.fill();

  /* ---- El resplandor de las ventanas, sobre la hierba ---- */
  ctx.globalCompositeOperation = "lighter";
  haloOvalado(x, y - h * 0.3, w * 2.2, h * 0.9, [
    [0, `rgba(255,190,110,${0.16 * cabana.brillo})`],
    [1, "rgba(255,190,110,0)"],
  ], y);
  ctx.globalCompositeOperation = "source-over";

  /* ---- El cuerpo: tablones horizontales ---- */
  const nT = 9;
  for (let i = 0; i < nT; i++) {
    const ty = y - h + (i / nT) * h;
    const th = h / nT + 0.6;
    const tono0 = ((i * 37) % 5) / 5;
    const base = mez(30, 40, tono0);
    ctx.fillStyle = `rgb(${Math.round(mez(base, base + 96, ilum))},${Math.round(mez(base - 6, base + 52, ilum))},${Math.round(mez(base - 10, base + 26, ilum))})`;
    ctx.fillRect(x - w / 2, ty, w, th);
    /* La junta entre tablones. */
    ctx.fillStyle = "rgba(8,6,10,0.34)";
    ctx.fillRect(x - w / 2, ty + th - 1.2, w, 1.2);
  }

  /* ---- El tejado, a dos aguas y sobresaliendo ---- */
  const alaR = w * 0.62;
  const gtj = ctx.createLinearGradient(x, y - h * 1.5, x, y - h);
  gtj.addColorStop(0, `rgb(${Math.round(mez(26, 78, ilum))},${Math.round(mez(24, 52, ilum))},${Math.round(mez(28, 44, ilum))})`);
  gtj.addColorStop(1, `rgb(${Math.round(mez(18, 54, ilum))},${Math.round(mez(16, 36, ilum))},${Math.round(mez(20, 30, ilum))})`);
  ctx.fillStyle = gtj;
  ctx.beginPath();
  ctx.moveTo(x - alaR, y - h);
  ctx.lineTo(x, y - h * 1.52);
  ctx.lineTo(x + alaR, y - h);
  ctx.closePath();
  ctx.fill();
  /* Las tejas: rayas paralelas al alero. */
  ctx.strokeStyle = "rgba(10,8,12,0.28)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 6; i++) {
    const t = i / 6;
    ctx.beginPath();
    ctx.moveTo(mez(x - alaR, x, t), mez(y - h, y - h * 1.52, t));
    ctx.lineTo(mez(x + alaR, x, t), mez(y - h, y - h * 1.52, t));
    ctx.stroke();
  }

  /* ---- La chimenea ---- */
  ctx.fillStyle = `rgb(${Math.round(mez(30, 74, ilum))},${Math.round(mez(26, 50, ilum))},${Math.round(mez(28, 42, ilum))})`;
  ctx.fillRect(x + w * 0.22, y - h * 1.38, w * 0.16, h * 0.42);
  ctx.fillStyle = `rgb(${Math.round(mez(38, 88, ilum))},${Math.round(mez(34, 60, ilum))},${Math.round(mez(36, 50, ilum))})`;
  ctx.fillRect(x + w * 0.2, y - h * 1.42, w * 0.2, h * 0.07);

  /* ---- Las ventanas ---- */
  const luzV = cabana.brillo;
  dibujarVentanaCabana(x - w * 0.26, y - h * 0.62, w * 0.24, h * 0.3, luzV);
  dibujarVentanaCabana(x + w * 0.26, y - h * 0.62, w * 0.24, h * 0.3, luzV * 0.9);

  /* ---- La puerta ---- */
  const pw = w * 0.22, ph = h * 0.46;
  ctx.fillStyle = `rgb(${Math.round(mez(26, 96, ilum))},${Math.round(mez(20, 58, ilum))},${Math.round(mez(16, 34, ilum))})`;
  ctx.beginPath();
  ctx.moveTo(x - pw / 2, y);
  ctx.lineTo(x - pw / 2, y - ph * 0.82);
  ctx.quadraticCurveTo(x, y - ph * 1.12, x + pw / 2, y - ph * 0.82);
  ctx.lineTo(x + pw / 2, y);
  ctx.closePath();
  ctx.fill();
  /* Si está abierta —durante la cinemática—, se ve el hueco caliente. */
  if (cabana.puerta > 0.01) {
    ctx.save();
    ctx.globalAlpha = cabana.puerta;
    const gp = ctx.createLinearGradient(x - pw / 2, y, x + pw / 2, y - ph);
    gp.addColorStop(0, "rgba(255,180,90,0.9)");
    gp.addColorStop(1, "rgba(255,140,60,0.5)");
    ctx.fillStyle = gp;
    ctx.beginPath();
    ctx.moveTo(x - pw / 2, y);
    ctx.lineTo(x - pw / 2, y - ph * 0.82);
    ctx.quadraticCurveTo(x, y - ph * 1.12, x + pw * (0.5 - cabana.puerta * 0.8), y - ph * 0.82);
    ctx.lineTo(x + pw * (0.5 - cabana.puerta * 0.8), y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  /* El pomo. */
  ctx.fillStyle = `rgba(220,180,110,${0.4 + ilum * 0.5})`;
  ctx.beginPath();
  ctx.arc(x + pw * 0.28, y - ph * 0.42, Math.max(1.4, w * 0.014), 0, 6.283);
  ctx.fill();

  /* ---- El farol de la puerta ---- */
  const fx = x + pw * 0.86, fy = y - ph * 0.92;
  ctx.globalCompositeOperation = "lighter";
  const gf = ctx.createRadialGradient(fx, fy, 0, fx, fy, w * 0.5);
  gf.addColorStop(0, `rgba(255,200,120,${0.4 * cabana.farol})`);
  gf.addColorStop(1, "rgba(255,200,120,0)");
  ctx.fillStyle = gf;
  ctx.beginPath(); ctx.arc(fx, fy, w * 0.5, 0, 6.283); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#1a1512";
  ctx.fillRect(fx - w * 0.026, fy - w * 0.04, w * 0.052, w * 0.08);
  ctx.fillStyle = `rgba(255,214,140,${cabana.farol})`;
  ctx.fillRect(fx - w * 0.018, fy - w * 0.032, w * 0.036, w * 0.064);

  /* ---- Las matas de alrededor ---- */
  for (let i = 0; i < 6; i++) {
    const t = (i / 5 - 0.5) * 1.9;
    const mx = x + t * w * 0.66;
    const my = y + Math.abs(t) * h * 0.02;
    if (Math.abs(t) < 0.28) continue;         // deja libre la puerta
    const s = U * (1.6 + ((i * 13) % 4) * 0.5);
    const il2 = ilum * 0.7;
    ctx.fillStyle = `rgb(${Math.round(mez(16, 62, il2))},${Math.round(mez(26, 82, il2))},${Math.round(mez(18, 48, il2))})`;
    ctx.beginPath();
    ctx.ellipse(mx, my, s, s * 0.72, 0, 0, 6.283);
    ctx.fill();
  }

  /* ---- El aro de «tócame» ----
     Era un óvalo continuo de canto a canto, y en pantalla no se leía
     como «esto se puede tocar»: se leía como un aro geométrico flotando
     alrededor de la casa, una figura que no pinta nada en un bosque.

     Ahora es de TRAZOS, cortos y separados, y además se desvanece por
     arriba: la parte de abajo —la del suelo y la puerta, que es a donde
     mira quien quiere entrar— se ve, y la de arriba se disuelve. Un
     trazo discontinuo se lee como una indicación; una línea entera se
     lee como un objeto. */
  if (escena === "bosque" && !bloqueado) {
    const pulso = 0.09 + 0.05 * Math.sin(reloj * 1.6) + cabana.resalte * 0.34;
    const rx = w * 0.78, ry = h * 0.86;
    const cy2 = y - h * 0.6;
    ctx.lineWidth = 1.4;
    ctx.lineCap = "round";
    const N = 26;
    for (let i = 0; i < N; i++) {
      const a0 = (i / N) * 6.283 + reloj * 0.12;
      const a1 = a0 + 6.283 / N * 0.46;
      /* Más fuerte abajo que arriba: `sin(a)` vale 1 abajo del óvalo. */
      const abajo = clamp01(0.25 + Math.sin(a0) * 0.75);
      ctx.strokeStyle = `rgba(255,214,150,${pulso * abajo})`;
      ctx.beginPath();
      ctx.ellipse(x, cy2, rx, ry, 0, a0, a1);
      ctx.stroke();
    }
  }
}

function dibujarVentanaCabana(vx, vy, vw, vh, luz) {
  /* El resplandor. */
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(vx, vy, 0, vx, vy, vw * 2.6);
  g.addColorStop(0, `rgba(255,196,110,${0.34 * luz})`);
  g.addColorStop(1, "rgba(255,196,110,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(vx, vy, vw * 2.6, 0, 6.283); ctx.fill();
  ctx.globalCompositeOperation = "source-over";

  /* El cristal. */
  const gc = ctx.createLinearGradient(vx, vy - vh / 2, vx, vy + vh / 2);
  gc.addColorStop(0, `rgba(255,222,160,${luz})`);
  gc.addColorStop(1, `rgba(255,170,80,${luz * 0.9})`);
  ctx.fillStyle = gc;
  ctx.fillRect(vx - vw / 2, vy - vh / 2, vw, vh);

  /* La cruz del marco. */
  ctx.strokeStyle = "rgba(24,16,10,0.75)";
  ctx.lineWidth = Math.max(1.2, vw * 0.07);
  ctx.beginPath();
  ctx.moveTo(vx, vy - vh / 2); ctx.lineTo(vx, vy + vh / 2);
  ctx.moveTo(vx - vw / 2, vy); ctx.lineTo(vx + vw / 2, vy);
  ctx.stroke();
  ctx.strokeRect(vx - vw / 2, vy - vh / 2, vw, vh);
}

// ==========================================
// CINEMÁTICA
// ==========================================
//
// De la fogata a la cama, sin cortes.
//
// ── LO IMPORTANTE: LOS SONIDOS VAN UNO DETRÁS DE OTRO ────────────────
// Cada `await` espera a que el archivo TERMINE de verdad —`tocarUnaVez`
// se resuelve en el `onended` de la fuente, no con un temporizador a
// ojo—, así que ninguno corta al anterior por mucho que dure. Si un
// archivo no está, su gemelo sintetizado dura lo suyo y la secuencia
// sigue igual de bien.
//
// Mientras tanto la cámara empuja hacia la cabaña y el velo se va a
// negro; los ambientes se agachan pero no se callan, porque el bosque
// sigue ahí fuera.

const cine = { velo: 0, texto: "" };

async function entrarEnLaCabana() {
  if (bloqueado || escena !== "bosque") return;
  bloqueado = true;
  contarLogro("cabana");

  const c = sitio.cabana;

  /* 1. La cámara empuja hacia la puerta. */
  cam.oz = 2.4;
  cam.ox = (A / 2 - c.x) * 2.4;
  cam.oy = (H * 0.56 - (c.y - c.h * 0.5)) * 2.4;
  agacharAmbientes(0.45, 1.6);

  await esperar(suaveMovimiento ? 100 : 1500);

  /* 2. La puerta se abre, y suena. */
  cabana.puerta = 0.001;
  const abrir = tocarUnaVez(CONF.rutas.cabana.puertaAbre, gemelosCabana.puertaAbre, 0.9);
  animar((k) => { cabana.puerta = k; }, 900);
  await abrir;

  /* 3. Se entra: a negro. */
  cine.velo = 0.001;
  animar((k) => { cine.velo = k; }, 1100);
  await esperar(suaveMovimiento ? 60 : 900);
  cabana.puerta = 0;

  /* 4. Y se cierra por dentro. */
  await tocarUnaVez(CONF.rutas.cabana.puertaCierra, gemelosCabana.puertaCierra, 0.9);

  /* 5. Las escaleras. */
  cine.texto = "subiendo";
  await tocarUnaVez(CONF.rutas.cabana.escaleras, gemelosCabana.escaleras, 0.85);

  /* 6. El cuarto. */
  cine.texto = "el cuarto";
  await tocarUnaVez(CONF.rutas.cabana.cuarto, gemelosCabana.cuarto, 0.85);

  /* 7. La cama. */
  cine.texto = "";
  const cama = tocarUnaVez(CONF.rutas.cabana.cama, gemelosCabana.cama, 0.85);

  /* Mientras suena la cama, se monta la habitación por detrás y se
     levanta el velo: así el primer fotograma de la habitación llega con
     el sonido de las sábanas, no después. */
  escena = "habitacion";
  raiz.classList.add("is-habitacion");
  construirHabitacion();
  cam.oz = 1; cam.ox = 0; cam.oy = 0;
  cam.z = 1; cam.x = 0; cam.y = 0;
  animar((k) => { cine.velo = 1 - k; }, 1800);
  agacharAmbientes(0.32, 2);

  await cama;
  bloqueado = false;

  setTimeout(() => {
    if (escena !== "habitacion") return;
    decir(A * 0.5, H * 0.3, "Desde aquí se ve la luna. Tócala.", { dur: 4.6 });
  }, 1800);
}

/** Una animación de 0 a 1 en `ms`, con suavizado. */
function animar(paso, ms, alAcabar) {
  if (suaveMovimiento) { paso(1); alAcabar?.(); return; }
  const t0 = performance.now();
  const tic = (ahora) => {
    const k = clamp01((ahora - t0) / ms);
    paso(suave3(k));
    if (k < 1) requestAnimationFrame(tic);
    else alAcabar?.();
  };
  requestAnimationFrame(tic);
}

function volverAlBosque() {
  if (bloqueado) return;
  bloqueado = true;
  cine.velo = 0.001;
  animar((k) => { cine.velo = k; }, 700, () => {
    escena = "bosque";
    raiz.classList.remove("is-habitacion", "is-durmiendo");
    hab.dormida = 0;
    agacharAmbientes(1, 1.4);
    animar((k) => { cine.velo = 1 - k; }, 900, () => { bloqueado = false; });
  });
}

// ==========================================
// HABITACIÓN
// ==========================================
//
// La vista desde la cama: la manta y las rodillas en primer plano, la
// habitación alrededor, y la ventana con el bosque y la luna.
//
// La perspectiva es la de estar tumbado mirando hacia los pies: la
// ventana arriba y lejos, la manta abajo y cerca, y el suelo con el
// rectángulo de luz de luna que entra por el cristal.

const hab = {
  respira: 0,
  dormida: 0,       // 0 despierta · 1 dormida del todo
  polvo: 0,
  lamparaOn: true,
  lampara: 1,
  cuadro: 0,        // el cuadrito de la pared, tocable
};

function construirHabitacion() {
  hab.respira = 0;
  hab.polvo = 0;
}

/** Dónde está la ventana de la habitación, en píxeles. */
function ventanaHab() {
  const w = Math.min(A * 0.5, U * 46);
  const h = w * 1.05;
  return { x: A * 0.5, y: H * (apaisado ? 0.36 : 0.33), w, h };
}

function moverHabitacion(dt) {
  /* La respiración: un vaivén lentísimo que mueve toda la vista. Es lo
     que hace que se sienta que hay alguien tumbado y no una foto. */
  hab.respira += dt * (hab.dormida > 0.5 ? 0.55 : 0.78);
  hab.lampara = damp(hab.lampara, hab.lamparaOn ? 1 : 0, 3, dt);
  hab.cuadro = Math.max(0, hab.cuadro - dt * 1.4);

  /* Polvo flotando en el rayo de luna. */
  hab.polvo -= dt;
  if (hab.polvo <= 0) {
    hab.polvo = flojo ? 0.5 : 0.22;
    const v = ventanaHab();
    soltar(v.x + azar(-v.w * 0.5, v.w * 0.5), v.y + azar(0, H * 0.3), {
      vx: azar(-5, 5), vy: azar(-7, 3),
      vida: azar(3, 6), tam: azar(0.7, 1.8),
      tipo: TIPO.POLVO, tono: 0.5,
    });
  }
}

function dibujarHabitacion() {
  const d = desplazar(0.9);
  const v = ventanaHab();
  const vx = v.x + d.x * 0.6, vy = v.y + d.y * 0.6;
  const resp = Math.sin(hab.respira) * U * 0.7;

  /* ---- La pared ---- */
  const gp = ctx.createLinearGradient(0, 0, 0, H);
  gp.addColorStop(0, "#14131f");
  gp.addColorStop(0.55, "#1c1a26");
  gp.addColorStop(1, "#100e18");
  ctx.fillStyle = gp;
  ctx.fillRect(0, 0, A, H);

  /* Los tablones de la pared, insinuados. */
  ctx.strokeStyle = "rgba(255,240,220,0.028)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 14; i++) {
    const y = (i / 14) * H * 0.78;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(A, y); ctx.stroke();
  }

  /* ---- El rectángulo de luna en la pared y el suelo ----
     Es lo que de verdad ilumina la habitación, así que se dibuja antes
     que los muebles: todo lo demás se ve gracias a él. */
  ctx.globalCompositeOperation = "lighter";
  const gl = ctx.createLinearGradient(vx, vy, vx + U * 14, H);
  gl.addColorStop(0, "rgba(150,180,255,0.14)");
  gl.addColorStop(1, "rgba(150,180,255,0)");
  ctx.fillStyle = gl;
  ctx.beginPath();
  ctx.moveTo(vx - v.w * 0.5, vy + v.h * 0.5);
  ctx.lineTo(vx + v.w * 0.5, vy + v.h * 0.5);
  ctx.lineTo(vx + v.w * 1.1, H);
  ctx.lineTo(vx - v.w * 0.2, H);
  ctx.closePath();
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";

  /* ---- La ventana ---- */
  dibujarVentanaHabitacion(vx, vy + resp * 0.2, v.w, v.h);

  /* ---- El cuadrito de la pared (tocable) ---- */
  const qx = vx - v.w * 0.92, qy = vy + U * 2;
  const qw = U * 9, qh = U * 11;
  ctx.fillStyle = `rgba(120,96,64,${0.5 + hab.cuadro * 0.4})`;
  ctx.fillRect(qx - qw / 2, qy - qh / 2, qw, qh);
  ctx.fillStyle = "rgba(220,200,180,0.16)";
  ctx.fillRect(qx - qw / 2 + 3, qy - qh / 2 + 3, qw - 6, qh - 6);
  /* Lo que hay pintado: dos siluetas juntas, pequeñísimas. */
  ctx.fillStyle = `rgba(200,180,210,${0.24 + hab.cuadro * 0.5})`;
  ctx.beginPath();
  ctx.arc(qx - qw * 0.12, qy + qh * 0.06, qw * 0.09, 0, 6.283);
  ctx.arc(qx + qw * 0.12, qy + qh * 0.06, qw * 0.09, 0, 6.283);
  ctx.fill();
  ctx.fillRect(qx - qw * 0.2, qy + qh * 0.14, qw * 0.16, qh * 0.2);
  ctx.fillRect(qx + qw * 0.04, qy + qh * 0.14, qw * 0.16, qh * 0.2);

  /* ---- La lámpara de la mesilla ---- */
  const lx = vx + v.w * 0.92, ly = H * 0.62;
  if (hab.lampara > 0.02) {
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, U * 26);
    g.addColorStop(0, `rgba(255,190,110,${0.22 * hab.lampara})`);
    g.addColorStop(1, "rgba(255,190,110,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(lx, ly, U * 26, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }
  /* La mesilla. */
  ctx.fillStyle = "rgba(48,38,32,0.9)";
  ctx.fillRect(lx - U * 7, ly + U * 3, U * 14, U * 12);
  /* La pantalla de la lámpara. */
  ctx.fillStyle = `rgb(${Math.round(mez(52, 220, hab.lampara))},${Math.round(mez(44, 170, hab.lampara))},${Math.round(mez(40, 110, hab.lampara))})`;
  ctx.beginPath();
  ctx.moveTo(lx - U * 4, ly + U * 2);
  ctx.lineTo(lx - U * 2.6, ly - U * 3.4);
  ctx.lineTo(lx + U * 2.6, ly - U * 3.4);
  ctx.lineTo(lx + U * 4, ly + U * 2);
  ctx.closePath();
  ctx.fill();

  /* ---- La cama, en primer plano ---- */
  const camaY = H * (apaisado ? 0.74 : 0.70) + resp;

  /* La manta: una curva grande que cruza toda la pantalla, con dos
     bultos donde están las rodillas. Es lo que pone al espectador
     DENTRO de la cama en vez de mirándola. */
  const gm = ctx.createLinearGradient(0, camaY - U * 6, 0, H);
  gm.addColorStop(0, "#3a2c42");
  gm.addColorStop(0.4, "#2c2134");
  gm.addColorStop(1, "#181222");
  ctx.fillStyle = gm;
  ctx.beginPath();
  ctx.moveTo(-10, H + 10);
  ctx.lineTo(-10, camaY + U * 8);
  ctx.quadraticCurveTo(A * 0.16, camaY + U * 2, A * 0.3, camaY + U * 5);
  /* Las rodillas. */
  ctx.quadraticCurveTo(A * 0.38, camaY - U * 9, A * 0.46, camaY + U * 3);
  ctx.quadraticCurveTo(A * 0.54, camaY - U * 8, A * 0.62, camaY + U * 4);
  ctx.quadraticCurveTo(A * 0.82, camaY + U * 1, A + 10, camaY + U * 9);
  ctx.lineTo(A + 10, H + 10);
  ctx.closePath();
  ctx.fill();

  /* La luz de la luna rozando la manta por el canto de arriba: sin ese
     filo, la manta es una mancha oscura y no se lee como volumen. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = "rgba(150,180,255,0.16)";
  ctx.lineWidth = U * 1.1;
  ctx.beginPath();
  ctx.moveTo(-10, camaY + U * 8);
  ctx.quadraticCurveTo(A * 0.16, camaY + U * 2, A * 0.3, camaY + U * 5);
  ctx.quadraticCurveTo(A * 0.38, camaY - U * 9, A * 0.46, camaY + U * 3);
  ctx.quadraticCurveTo(A * 0.54, camaY - U * 8, A * 0.62, camaY + U * 4);
  ctx.quadraticCurveTo(A * 0.82, camaY + U * 1, A + 10, camaY + U * 9);
  ctx.stroke();
  ctx.restore();

  /* Los pliegues. */
  ctx.strokeStyle = "rgba(8,6,14,0.34)";
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 5; i++) {
    const t = (i + 1) / 6;
    ctx.beginPath();
    ctx.moveTo(A * t, camaY + U * mez(6, 10, Math.abs(t - 0.5) * 2));
    ctx.quadraticCurveTo(A * t + U * 3, H * 0.9, A * t - U * 2, H + 10);
    ctx.stroke();
  }

  /* ---- Las partículas van por encima de todo ---- */
  dibujarParticulas();

  /* ---- Cuando se apaga todo ----
     El susto de la ventana baja las luces de la habitación pero NO las
     de fuera: la ventana se queda siendo lo único que se ve, y por eso
     acabas mirándola. El recorte deja el cristal fuera del velo. */
  if (susto.oscuro > 0.01) {
    const v = ventanaHab();
    const dv = desplazar(0.9);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, A, H);
    ctx.rect(v.x + dv.x * 0.6 - v.w / 2, v.y + dv.y * 0.6 - v.h / 2, v.w, v.h);
    /* `evenodd`: el rectángulo de dentro agujerea al de fuera, así que
       el recorte es «toda la pantalla MENOS la ventana». */
    ctx.clip("evenodd");
    ctx.fillStyle = `rgba(2,3,9,${susto.oscuro * 0.86})`;
    ctx.fillRect(0, 0, A, H);
    ctx.restore();
  }

  /* ---- El velo de dormirse ---- */
  if (hab.dormida > 0.01) {
    ctx.fillStyle = `rgba(4,6,14,${hab.dormida * 0.72})`;
    ctx.fillRect(0, 0, A, H);
  }
}

function dibujarVentanaHabitacion(x, y, w, h) {
  /* El cielo de fuera. */
  const g = ctx.createLinearGradient(x, y - h / 2, x, y + h / 2);
  g.addColorStop(0, "#0a1030");
  g.addColorStop(0.55, "#131b42");
  g.addColorStop(1, "#1b2440");
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - w / 2, y - h / 2, w, h);
  ctx.clip();
  ctx.fillStyle = g;
  ctx.fillRect(x - w / 2, y - h / 2, w, h);

  /* Las estrellas de fuera: las mismas de siempre, recolocadas dentro
     del marco. Así el cielo de la ventana es el cielo del bosque. */
  for (let i = 0; i < 46; i++) {
    const sx = x - w / 2 + ((i * 61) % 100) / 100 * w;
    const sy = y - h / 2 + ((i * 37) % 100) / 100 * h * 0.66;
    const b = 0.3 + 0.5 * Math.sin(reloj * 1.4 + i);
    ctx.fillStyle = `rgba(226,232,255,${b})`;
    ctx.beginPath();
    ctx.arc(sx, sy, 0.7 + (i % 3) * 0.4, 0, 6.283);
    ctx.fill();
  }

  /* La luna, tocable también desde aquí. */
  const lx = x + w * 0.24, ly = y - h * 0.26;
  const lr = w * 0.16;
  dibujarLuna(lx, ly, lr);
  sitio.luna.vx = lx; sitio.luna.vy = ly; sitio.luna.vr = lr;

  /* Los árboles de fuera, en silueta. */
  ctx.fillStyle = "#070a16";
  for (let i = 0; i < 9; i++) {
    const tx = x - w / 2 + (i / 8) * w;
    const th = h * (0.2 + ((i * 29) % 5) * 0.045);
    const tw = w * 0.07;
    ctx.beginPath();
    ctx.moveTo(tx, y + h / 2);
    ctx.lineTo(tx - tw, y + h / 2 - th * 0.55);
    ctx.lineTo(tx - tw * 0.5, y + h / 2 - th * 0.6);
    ctx.lineTo(tx - tw * 0.8, y + h / 2 - th * 0.85);
    ctx.lineTo(tx, y + h / 2 - th);
    ctx.lineTo(tx + tw * 0.8, y + h / 2 - th * 0.85);
    ctx.lineTo(tx + tw * 0.5, y + h / 2 - th * 0.6);
    ctx.lineTo(tx + tw, y + h / 2 - th * 0.55);
    ctx.closePath();
    ctx.fill();
  }

  /* Y lo que a veces hay al otro lado del cristal. Va DENTRO del
     recorte: lo que se sale del marco no se ve, y eso es lo que hace
     que parezca que está fuera y no pegado encima. */
  dibujarSustoVentana(x, y, w, h);
  ctx.restore();

  /* El marco. */
  ctx.strokeStyle = "#2a2230";
  ctx.lineWidth = U * 1.3;
  ctx.strokeRect(x - w / 2, y - h / 2, w, h);
  ctx.lineWidth = U * 0.7;
  ctx.beginPath();
  ctx.moveTo(x, y - h / 2); ctx.lineTo(x, y + h / 2);
  ctx.moveTo(x - w / 2, y); ctx.lineTo(x + w / 2, y);
  ctx.stroke();

  /* El alféizar. */
  ctx.fillStyle = "#241d2c";
  ctx.fillRect(x - w * 0.56, y + h / 2, w * 1.12, U * 2);

  /* Y una vela encendida en el alféizar, que es el detalle que hace la
     habitación. */
  const cx2 = x - w * 0.36, cy2 = y + h / 2;
  ctx.fillStyle = "#e8e0d0";
  ctx.fillRect(cx2 - U * 0.7, cy2 - U * 4, U * 1.4, U * 4);
  ctx.globalCompositeOperation = "lighter";
  const gv2 = ctx.createRadialGradient(cx2, cy2 - U * 5, 0, cx2, cy2 - U * 5, U * 9);
  gv2.addColorStop(0, "rgba(255,200,120,0.5)");
  gv2.addColorStop(1, "rgba(255,200,120,0)");
  ctx.fillStyle = gv2;
  ctx.beginPath(); ctx.arc(cx2, cy2 - U * 5, U * 9, 0, 6.283); ctx.fill();
  ctx.fillStyle = "rgba(255,230,170,0.95)";
  ctx.beginPath();
  ctx.ellipse(cx2 + Math.sin(reloj * 4) * U * 0.14, cy2 - U * 5,
              U * 0.5, U * 1.1 * (0.85 + 0.15 * Math.sin(reloj * 7)), 0, 0, 6.283);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";
}

// ==========================================
// LUNA
// ==========================================
//
// Se puede tocar desde el bosque y desde la ventana de la habitación.
// Cada vez dice algo distinto, sin repetir hasta agotarlas, y suelta un
// puñado de brillos que caen despacio.

/* ==========================================
   LA LUNA, Y LO QUE PASA A LOS DIEZ TOQUES
   ==========================================

   A la quinta guiña. A la décima deja de ser la luna.

   ── LA TRANSFORMACIÓN, PASO A PASO ──────────────────────────────────
   No es un cambio de dibujo. Son cinco momentos encadenados, y cada
   uno tiene su ruido y su movimiento:

     0.0 – 0.8   GLITCH    se descoloca en bandas, vibra y chirría
     0.8 – 1.4   ZUMBIDO   se encoge y el tono sube
     1.4 – 1.8   ESTALLIDO se abre en pedazos con un fogonazo
     1.8 – 2.8   REUNIÓN   los pedazos vuelven y se ordenan en otra cosa
     2.8 – …     DONA      y lo que queda arriba es una dona de chocolate

   Vuelve sola al cabo de un rato, con la misma escalera al revés. Lo
   que la hace graciosa es justo eso: que no se queda. Si se quedara
   sería un cambio de tema; volviendo, es un chiste.                  */

const luna = {
  pulso: 0,
  guino: 0,
  tocadas: 0,
  /* 0 luna · 1 dona. Y `fase`, dónde va la transformación en segundos. */
  dona: 0,
  fase: -1,           // -1 = quieta
  volviendo: false,
  reloj: 0,
  trozos: [],
  vibra: 0,
};
const diceLuna = barajador(CONF.alTocarLuna);
