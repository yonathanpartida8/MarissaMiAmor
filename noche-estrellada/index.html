  /* Y una sombra propia de arriba abajo, que si no queda plano. */
  const gs = ctx.createLinearGradient(0, -alto, 0, alto);
  gs.addColorStop(0, "rgba(255,255,255,0.11)");
  gs.addColorStop(0.5, "rgba(0,0,0,0)");
  gs.addColorStop(1, "rgba(60,30,10,0.26)");
  ctx.fillStyle = gs;
  ctx.fill();

  /* Y OTRA de lado a lado, que es la que de verdad lo redondea.
     Un malvavisco es un cilindro visto de canto: lo que dice que es
     redondo no es la sombra de abajo —eso lo tiene también un ladrillo—
     sino que los dos costados se apaguen y el centro no. Sin esto era
     una goma de borrar blanca. */
  const gl2 = ctx.createLinearGradient(-ancho, 0, ancho, 0);
  gl2.addColorStop(0, "rgba(58,34,18,0.26)");
  gl2.addColorStop(0.2, "rgba(58,34,18,0.05)");
  gl2.addColorStop(0.42, "rgba(255,252,242,0.1)");
  gl2.addColorStop(0.72, "rgba(58,34,18,0.04)");
  gl2.addColorStop(1, "rgba(58,34,18,0.24)");
  ctx.fillStyle = gl2;
  ctx.fill();

  /* El brillo del fuego en el canto de abajo. */
  const gi = ctx.createLinearGradient(0, alto * 0.2, 0, alto);
  gi.addColorStop(0, "rgba(255,170,80,0)");
  gi.addColorStop(1, `rgba(255,170,80,${0.34 * fuego.brillo})`);
  ctx.fillStyle = gi;
  ctx.fill();

  /* La costura: la raya de en medio que tiene todo malvavisco. Es una
     tontería de dos píxeles y es lo que hace que se lea como un
     malvavisco y no como una goma de borrar. */
  ctx.strokeStyle = "rgba(90,60,35,0.16)";
  ctx.lineWidth = Math.max(0.6, ancho * 0.07);
  ctx.beginPath();
  ctx.moveTo(-ancho * 0.92, 0);
  ctx.lineTo(ancho * 0.92, 0);
  ctx.stroke();

  /* El barniz: cuando se derrite, brilla. Una mancha clara arriba a la
     izquierda, que es de donde vendría la luz. */
  if (bombon.blando > 0.1) {
    ctx.globalAlpha = bombon.blando * 0.4;
    ctx.fillStyle = "rgba(255,248,230,0.7)";
    ctx.beginPath();
    ctx.ellipse(-ancho * 0.34, -alto * 0.42, ancho * 0.3, alto * 0.18, -0.4, 0, 6.283);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* ---- Las burbujas ----
     Cada una crece y revienta. El seno de su vida da las dos cosas de
     una vez: sale de la nada, se hincha y desaparece. */
  for (const b of bombon.burbujas) {
    const k = clamp01(b.t / b.dur);
    const s = Math.sin(k * Math.PI) * b.rr * ancho;
    if (s < 0.3) continue;
    const ax = Math.cos(b.a) * ancho * 0.62;
    const ay = Math.sin(b.a) * alto * 0.62;
    ctx.fillStyle = `rgba(255,244,214,${0.5 * Math.sin(k * Math.PI)})`;
    ctx.beginPath();
    ctx.arc(ax, ay, s, 0, 6.283);
    ctx.fill();
    /* El puntito de luz encima: sin él son manchas, con él son pompas. */
    ctx.fillStyle = `rgba(255,255,255,${0.55 * Math.sin(k * Math.PI)})`;
    ctx.beginPath();
    ctx.arc(ax - s * 0.3, ay - s * 0.3, s * 0.3, 0, 6.283);
    ctx.fill();
  }

  /* ---- El goterón ----
     Cuando está muy blando, le cuelga azúcar por abajo antes de caer.
     Es el mismo dato que dispara las gotas, pero visto. */
  if (bombon.blando > 0.55) {
    /* Cuelga POR DEBAJO del bombón, no desde dentro: partiendo de la
       mitad del cuerpo se veía un pico de otro color metido en la
       barriga, como si estuviera roto. */
    const cuelga = (bombon.blando - 0.55) * alto * 2.2;
    ctx.fillStyle = colorTueste(bombon.tueste, true);
    ctx.beginPath();
    ctx.moveTo(-ancho * 0.26, alto * 0.94);
    ctx.quadraticCurveTo(-ancho * 0.16, alto + cuelga, 0, alto + cuelga);
    ctx.quadraticCurveTo(ancho * 0.16, alto + cuelga, ancho * 0.26, alto * 0.94);
    ctx.closePath();
    ctx.fill();
  }

  /* Si está ardiendo, su propia llamita. */
  if (bombon.ardiendo > 0) {
    ctx.globalCompositeOperation = "lighter";
    const hL = r * 3.4 * bombon.ardiendo * (0.7 + 0.3 * Math.sin(reloj * 9));
    /* La llama sube DERECHA aunque el bombón esté ladeado: el fuego no
       sabe cómo tengas tú el palo. Por eso se deshace el giro. */
    ctx.rotate(-bombon.giro);
    /* Un halo redondo detrás, que es lo que le quita el canto duro de
       triángulo recortado y hace que la llama ILUMINE en vez de estar
       pegada encima. */
    const gh = ctx.createRadialGradient(0, -alto - hL * 0.35, 0, 0, -alto - hL * 0.35, hL * 1.2);
    gh.addColorStop(0, `rgba(255,190,90,${0.35 * bombon.ardiendo})`);
    gh.addColorStop(1, "rgba(255,150,60,0)");
    ctx.fillStyle = gh;
    ctx.beginPath();
    ctx.arc(0, -alto - hL * 0.35, hL * 1.2, 0, 6.283);
    ctx.fill();

    /* El degradado arranca DENTRO del bombón y con poca opacidad: con
       el blanco a tope justo en el borde de arriba, lo que se veía era
       una mancha blanca posada encima, no una llama saliendo de él. */
    const gf = ctx.createLinearGradient(0, -alto * 0.2, 0, -alto - hL);
    gf.addColorStop(0, "rgba(255,210,120,0.35)");
    gf.addColorStop(0.35, "rgba(255,235,170,0.8)");
    gf.addColorStop(0.62, "rgba(255,150,50,0.55)");
    gf.addColorStop(1, "rgba(220,60,20,0)");
    ctx.fillStyle = gf;
    /* Dos lenguas y no una: la grande y una pequeña a un lado, cada una
       con su ritmo. Una sola se lee como una forma; dos se leen como
       fuego. */
    for (const [esc, desf] of [[1, 0], [0.55, 2.1]]) {
      const ld = Math.sin(reloj * 6 + desf) * r * 0.5 + fuego.inclina * r * 0.6;
      const h2 = hL * esc;
      const w2 = r * 0.8 * esc;
      ctx.beginPath();
      ctx.moveTo(-w2, -alto * 0.6);
      ctx.bezierCurveTo(-w2 * 0.9, -alto - h2 * 0.5, ld - w2 * 0.3, -alto - h2 * 0.8,
                        ld * 1.2, -alto - h2);
      ctx.bezierCurveTo(ld + w2 * 0.3, -alto - h2 * 0.8, w2 * 0.9, -alto - h2 * 0.5,
                        w2, -alto * 0.6);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  ctx.restore();

  /* Y un aro cuando se puede coger, para que se note que es tocable sin
     poner un cartel.

     A trazos y girando despacio, no entero: un círculo fino y continuo
     sobre la escena se lee como un fallo de dibujo —un borde que no
     cierra nada— y no como algo que invita a tocar. A trazos y en
     movimiento se entiende al instante. */
  if (!bombon.agarrado) {
    const pulso = 0.16 + 0.1 * Math.sin(reloj * 2.2);
    const rr = r * (2.15 + 0.05 * Math.sin(reloj * 2.2));
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(reloj * 0.28);
    ctx.strokeStyle = `rgba(255,235,210,${pulso})`;
    ctx.lineWidth = Math.max(1, U * 0.24);
    ctx.lineCap = "round";
    ctx.setLineDash([rr * 0.3, rr * 0.52]);
    ctx.beginPath();
    ctx.arc(0, 0, rr, 0, 6.283);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }
}

// ==========================================
// PANEL DE AMBIENTES
// ==========================================
//
// No es un menú: son PIEDRAS puestas en semicírculo delante de la
// fogata, como las que uno alinea sin darse cuenta mientras habla.
//
// Cada piedra lleva su símbolo grabado y se enciende cuando su ambiente
// suena. El volumen es el arco de luz que la rodea: se arrastra de lado
// sobre la piedra para subirlo o bajarlo.
//
//   · tocar          → enciende o apaga (con fundido)
//   · arrastrar      → volumen
//
// Se dibuja en el lienzo, no en HTML, porque tiene que recibir la luz
// del fuego igual que todo lo demás. Un panel HTML encima se vería
// pegado, no puesto.

const panel = {
  piedras: [],
  arrastrando: null,
  usado: false,
};

/**
 * Las medidas de la fila de ambientes, sin construirla todavía.
 *
 * ── POR QUÉ ESTÁ SEPARADA DE `construirPanel` ────────────────────────
 * Porque hacen falta ANTES de colocar la fogata. La hoguera se pone
 * donde queda sitio, y el sitio lo marca esta fila, que va centrada
 * abajo y no se puede mover. Calcularlo dos veces —una aquí y otra
 * allí— sería el mismo error de siempre con otro nombre.
 *
 * ── LA FILA ──────────────────────────────────────────────────────────
 * Compacta y centrada, no un arco de canto a canto. El arco quedaba
 * bonito y ocupaba media pantalla: en un móvil, la mitad de lo que se
 * ve es el bosque, y el bosque es lo que se ha venido a mirar. Además
 * las dos pastillas de los extremos caían justo bajo las flechas de
 * pasar página del librito.
 *
 * El ancho se calcula ANTES de repartir: si la fila no cabe, encogen
 * todas a la vez en vez de salirse las de fuera.
 *
 * Y la altura: alto y medio de aire por debajo, más lo que pida la
 * barra del librito. Con uno y cuarto, en un móvil con la barra del
 * navegador puesta, la fila se quedaba cortada por el canto de abajo y
 * se veía media pastilla.
 */
function medidaDeLaFila() {
  const n = CONF.ambientes.length;
  const hueco = huecoAbajo();
  const maxFila = Math.min(A * 0.9, U * 62);
  const sep = 1.18;                     // separación, en anchos de pastilla
  const w = Math.min(U * 8.6, maxFila / (n * sep));
  const h = w * 0.86;
  const paso = w * sep;
  const medio = paso * (n - 1) * 0.5;
  return {
    n, w, h, paso,
    y: H - hueco - h * 1.55 - U * 3,
    primera: A * 0.5 - medio,
    x0: A * 0.5 - medio - w * 0.5,
    x1: A * 0.5 + medio + w * 0.5,
  };
}

function construirPanel() {
  panel.piedras = [];
  const { n, w, h, paso, y, primera } = medidaDeLaFila();
  const x0 = primera;
  /* Se le dice al CSS lo alto que ha quedado la fila, para que el
     rótulo de abajo se coloque ENCIMA y no encima de las pastillas. */
  raiz.style.setProperty("--fila-alto", `${Math.round(h * 2.3 + U * 3)}px`);

  for (let i = 0; i < n; i++) {
    panel.piedras.push({
      conf: CONF.ambientes[i],
      x: x0 + i * paso,
      y,
      w, h,
      /* Se conserva `r` porque hay código viejo que lo mira para
         colocar frases: es la media del lado, que es lo que se quiere
         decir con «lo grande que es esto». */
      r: (w + h) * 0.25,
      on: CONF.ambientes[i].on,
      vol: CONF.ambientes[i].vol,
      luz: CONF.ambientes[i].on ? 1 : 0,
      pulso: 0,
      /* Cuánto está apretada ahora mismo: se hunde al tocarla. */
      hundida: 0,
      fase: rnd() * 6.283,
    });
  }
}

function moverPanel(dt) {
  for (const p of panel.piedras) {
    p.luz = damp(p.luz, p.on ? 1 : 0, 3, dt);
    p.pulso = Math.max(0, p.pulso - dt * 2.2);
    const apretada = arrastrePanel && arrastrePanel.piedra === p;
    p.hundida = damp(p.hundida, apretada ? 1 : 0, 14, dt);
  }
}

/* ---- LOS ICONOS ---------------------------------------------------------
   Dibujados a mano, no emoji. Un emoji trae su propio color, su propio
   estilo y su propio brillo, y en una escena que es toda azules y
   naranjas de fogata, seis emoji a todo color se leen como seis
   pegatinas. Estos son trazos, del color que les toque, y se apagan y
   se encienden con el resto de la escena.

   Todos se dibujan dentro de un cuadrado de lado 1 centrado en el
   origen, así que quien los llama sólo tiene que trasladar y escalar. */

function icono(id, s, col, alfa) {
  ctx.save();
  ctx.scale(s, s);
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.globalAlpha = alfa;
  ctx.lineWidth = 0.09;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if (id === "fogata") {
    /* Una llama: la gota de siempre, con el corazón dentro. */
    ctx.beginPath();
    ctx.moveTo(0, 0.42);
    ctx.bezierCurveTo(-0.42, 0.18, -0.3, -0.16, -0.06, -0.44);
    ctx.bezierCurveTo(-0.04, -0.2, 0.12, -0.2, 0.1, -0.34);
    ctx.bezierCurveTo(0.38, -0.08, 0.36, 0.2, 0, 0.42);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = alfa * 0.5;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.ellipse(0, 0.2, 0.12, 0.17, 0, 0, 6.283);
    ctx.fill();

  } else if (id === "grillos") {
    /* Un grillo de perfil: cuerpo, ala, dos antenas y la pata de
       atrás doblada, que es lo único que hace falta para que se lea. */
    ctx.beginPath();
    ctx.ellipse(0.02, 0.06, 0.28, 0.15, -0.2, 0, 6.283);
    ctx.fill();
    ctx.globalAlpha = alfa * 0.55;
    ctx.beginPath();
    ctx.ellipse(0.06, 0.0, 0.22, 0.09, -0.3, 0, 6.283);
    ctx.fill();
    ctx.globalAlpha = alfa;
    ctx.beginPath();
    ctx.moveTo(-0.22, -0.02);
    ctx.quadraticCurveTo(-0.38, -0.2, -0.3, -0.4);
    ctx.moveTo(-0.2, 0.02);
    ctx.quadraticCurveTo(-0.42, -0.06, -0.44, -0.24);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0.14, 0.12);
    ctx.lineTo(0.3, -0.12);
    ctx.lineTo(0.36, 0.3);
    ctx.stroke();

  } else if (id === "aire") {
    /* Tres rachas con el rizo al final. El rizo es lo que convierte
       tres rayas en viento. */
    for (let i = 0; i < 3; i++) {
      const y = -0.22 + i * 0.22;
      const largo = i === 1 ? 0.34 : 0.22;
      ctx.beginPath();
      ctx.moveTo(-0.42, y);
      ctx.lineTo(largo, y);
      ctx.arc(largo, y - 0.1, 0.1, 1.57, -1.0);
      ctx.stroke();
    }

  } else if (id === "bosque") {
    /* Tres abetos de alturas distintas. */
    for (const [cx, e] of [[-0.28, 0.72], [0.02, 1], [0.3, 0.62]]) {
      ctx.beginPath();
      for (let p2 = 0; p2 < 3; p2++) {
        const y0 = -0.36 * e + p2 * 0.2 * e;
        const an = (0.1 + p2 * 0.07) * e;
        ctx.moveTo(cx, y0);
        ctx.lineTo(cx - an, y0 + 0.22 * e);
        ctx.lineTo(cx + an, y0 + 0.22 * e);
        ctx.closePath();
      }
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx, 0.24 * e);
      ctx.lineTo(cx, 0.4);
      ctx.stroke();
    }

  } else if (id === "lluvia") {
    /* Una nube con tres gotas. La nube son tres arcos, no un óvalo:
       un óvalo se lee como una piedra flotando. */
    ctx.beginPath();
    ctx.arc(-0.16, -0.1, 0.15, Math.PI, 0);
    ctx.arc(0.06, -0.16, 0.2, Math.PI, 0);
    ctx.arc(0.26, -0.08, 0.13, Math.PI, 0.4);
    ctx.closePath();
    ctx.fill();
    for (let i = 0; i < 3; i++) {
      const x = -0.22 + i * 0.22;
      ctx.beginPath();
      ctx.moveTo(x, 0.1 + (i % 2) * 0.06);
      ctx.lineTo(x - 0.07, 0.34 + (i % 2) * 0.06);
      ctx.stroke();
    }

  } else if (id === "relampagos") {
    /* El rayo de siempre, pero con la nube detrás para que no parezca
       un signo de peligro. */
    ctx.globalAlpha = alfa * 0.45;
    ctx.beginPath();
    ctx.arc(-0.14, -0.16, 0.14, Math.PI, 0);
    ctx.arc(0.08, -0.22, 0.18, Math.PI, 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = alfa;
    ctx.beginPath();
    ctx.moveTo(0.06, -0.06);
    ctx.lineTo(-0.14, 0.14);
    ctx.lineTo(0.0, 0.14);
    ctx.lineTo(-0.1, 0.42);
    ctx.lineTo(0.18, 0.06);
    ctx.lineTo(0.03, 0.06);
    ctx.lineTo(0.18, -0.12);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

/* ---- EL PANEL -----------------------------------------------------------
   ── POR QUÉ PASTILLAS Y NO PIEDRAS SUELTAS ───────────────────────────
   Porque seis piedras repartidas en arco por delante de la fogata no se
   leen como «los controles»: se leen como seis piedras. Y para saber si
   un ambiente está puesto había que mirar seis sitios distintos.

   Una fila junta, con el mismo alto y la misma separación, se lee de
   una vez. Sigue siendo materia del sitio —piedra oscura con su filo de
   luz, no un botón de aplicación—, pero se entiende sin explicarlo.

   ── LA BARRA ────────────────────────────────────────────────────────
   El volumen va en una barra fina en la base de la pastilla, no en un
   aro alrededor. Un aro obliga a mirar dónde acaba; una barra se lee de
   reojo, y todas juntas se comparan entre sí de un vistazo. */

function dibujarPanel() {
  const d = desplazar(2.1);

  for (const p of panel.piedras) {
    const x = p.x + d.x, y = p.y + d.y;
    const col = p.conf.color;
    const luz = p.luz * (0.9 + 0.1 * Math.sin(reloj * 1.3 + p.fase));
    const w = p.w, h = p.h;
    /* Al apretarla se hunde y se encoge un pelín. Es el único aviso de
       que el dedo ha entrado, y sin él los toques se sienten muertos. */
    const k = 1 - p.hundida * 0.06;
    const hy = y + p.hundida * U * 0.5;

    ctx.save();
    ctx.translate(x, hy);
    ctx.scale(k, k);

    /* ---- El resplandor de debajo ----
       Cae sobre el suelo, aplastado. Es lo que hace que la fila esté
       APOYADA en la tierra y no pegada sobre la pantalla. */
    if (luz > 0.02) {
      haloOvalado(0, h * 0.52, w * (1.1 + p.vol * 0.7), h * (0.5 + p.vol * 0.3), [
        [0, hexA(col, 0.34 * luz)],
        [0.5, hexA(col, 0.1 * luz)],
        [1, hexA(col, 0)],
      ]);
    }

    /* ---- La sombra ---- */
    ctx.fillStyle = "rgba(3,4,9,0.5)";
    ctx.beginPath();
    ctx.ellipse(0, h * 0.5, w * 0.46, h * 0.12, 0, 0, 6.283);
    ctx.fill();

    /* ---- La pastilla ----
       Piedra pulida: más clara por arriba, donde le da la luna, y casi
       negra por abajo. El filo de arriba es un trazo aparte, porque un
       degradado solo no da canto y sin canto no hay bulto. */
    const il = fuego.brillo * 0.6;
    const gp = ctx.createLinearGradient(0, -h * 0.5, 0, h * 0.5);
    gp.addColorStop(0, `rgba(${Math.round(mez(74, 118, il))},${Math.round(mez(80, 94, il))},${Math.round(mez(96, 80, il))},0.92)`);
    gp.addColorStop(0.55, `rgba(${Math.round(mez(38, 66, il))},${Math.round(mez(41, 50, il))},${Math.round(mez(52, 42, il))},0.92)`);
    gp.addColorStop(1, `rgba(${Math.round(mez(20, 38, il))},${Math.round(mez(22, 28, il))},${Math.round(mez(29, 24, il))},0.94)`);
    ctx.fillStyle = gp;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-w * 0.5, -h * 0.5, w, h, h * 0.3);
    else ctx.rect(-w * 0.5, -h * 0.5, w, h);
    ctx.fill();

    /* El canto encendido: blanco frío de la luna arriba, y del color
       del ambiente cuando está puesto. */
    ctx.strokeStyle = luz > 0.05
      ? hexA(col, 0.2 + luz * 0.5)
      : "rgba(168,186,228,0.16)";
    ctx.lineWidth = Math.max(1, h * 0.035);
    ctx.stroke();

    /* ---- El icono ----
       Hundido: una sombra un pelín desplazada debajo y el trazo
       encima. Apagado es gris de piedra; encendido, de su color. */
    const ic = luz > 0.05 ? col : "#aab4cc";
    ctx.save();
    ctx.translate(0, -h * 0.08);
    ctx.save();
    ctx.translate(h * 0.03, h * 0.04);
    icono(p.conf.id, h * 0.6, "#05070c", 0.5);
    ctx.restore();
    icono(p.conf.id, h * 0.6, ic, 0.4 + luz * 0.6);
    ctx.restore();

    /* ---- La barra del volumen ----
       Siempre visible el carril, sólo se llena si está puesto: así se
       sabe que se puede arrastrar antes de haberlo hecho nunca. */
    const bw = w * 0.62, by = h * 0.3, bh = Math.max(1.6, h * 0.055);
    ctx.fillStyle = "rgba(210,222,255,0.12)";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-bw * 0.5, by, bw, bh, bh);
    else ctx.rect(-bw * 0.5, by, bw, bh);
    ctx.fill();
    if (luz > 0.03) {
      ctx.fillStyle = hexA(col, 0.35 + luz * 0.55);
      ctx.beginPath();
      const llena = Math.max(bh, bw * p.vol);
      if (ctx.roundRect) ctx.roundRect(-bw * 0.5, by, llena, bh, bh);
      else ctx.rect(-bw * 0.5, by, llena, bh);
      ctx.fill();
      /* La cuenta de la punta: dice dónde poner el dedo. */
      ctx.beginPath();
      ctx.arc(-bw * 0.5 + llena, by + bh * 0.5, bh * 1.3, 0, 6.283);
      ctx.fill();
    }

    /* ---- El destello al tocarla ----
       Dos aros a distinta velocidad: con uno solo parece un eco de
       radar, con dos parece que la pastilla ha SONADO. */
    if (p.pulso > 0.01) {
      for (const [vel, gr] of [[1, 2], [1.7, 1.2]]) {
        const kk = clamp01(1 - p.pulso);
        ctx.strokeStyle = hexA(col, p.pulso * 0.55 / vel);
        ctx.lineWidth = gr;
        ctx.beginPath();
        const ew = w * (0.5 + kk * 0.5 * vel), eh = h * (0.5 + kk * 0.6 * vel);
        if (ctx.roundRect) ctx.roundRect(-ew, -eh, ew * 2, eh * 2, eh * 0.5);
        else ctx.rect(-ew, -eh, ew * 2, eh * 2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* ---- Las briznas de delante ----
     Cuatro hierbas cruzando la fila por abajo. Es lo que la mete en el
     suelo en vez de dejarla flotando sobre la tierra. */
  const p0 = panel.piedras[0];
  if (!p0) return;
  const ancho = panel.piedras[panel.piedras.length - 1].x - p0.x + p0.w;
  ctx.strokeStyle = `rgba(${Math.round(mez(16, 96, fuego.brillo * 0.5))},${Math.round(mez(26, 78, fuego.brillo * 0.5))},${Math.round(mez(18, 48, fuego.brillo * 0.5))},0.8)`;
  ctx.lineCap = "round";
  for (let i = 0; i < 9; i++) {
    const t = i / 8;
    const bx = p0.x - p0.w * 0.5 + ancho * t + d.x + Math.sin(i * 41) * U;
    const by = p0.y + p0.h * 0.5 + d.y + U * 0.4;
    const alto = U * (1.4 + ((i * 7) % 4) * 0.6);
    const mece = Math.sin(reloj * 1.1 + i) * U * (0.3 + clima.viento * 0.5);
    ctx.lineWidth = 1 + (i % 3) * 0.3;
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx + mece * 0.5, by - alto * 0.6, bx + mece, by - alto);
    ctx.stroke();
  }
}

function hexA(hex, a) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${a})`;
}

function alternarPiedra(p) {
  p.on = !p.on;
  p.pulso = 1;
  ambiente(p.conf.id, p.on, p.vol);
  /* Dos de las piedras no encienden sólo un sonido: cambian el TIEMPO
     que hace. Lo que pasa después —la niebla, el color del bosque, la
     fogata apagándose— lo lleva el módulo del clima, que es el único
     que sabe de eso. */
  sincronizarClima();
  tono(p.on ? 520 : 330, 0.4, "sine", 0.05);
  marcarPanelUsado();
  /* Sin el emoji delante: ahora el icono está dibujado en la pastilla,
     y repetirlo en la frase era decir dos veces lo mismo. */
  decir(p.x, p.y - p.h * 0.9, `${p.conf.nombre}${p.on ? "" : " · apagado"}`, { dur: 1.8 });
}

/**
 * Lleva el estado del panel al estado del clima.
 *
 * Es el único puente entre los dos, a propósito: el panel no sabe qué
 * es la niebla ni cómo se apaga una fogata, y el clima no sabe que hay
 * unas piedras. Se hablan por aquí y por ningún otro sitio.
 */
function sincronizarClima() {
  /* Encendida quiere decir que llueve, y llueve de verdad: no al 20%
     porque la barra esté baja. Lo que hay en la barra es cuánto se oye.

     Se deja un pelín por debajo de uno para que el aguacero de la
     cacería —que sube `lluviaObj` a tope por su cuenta— siga siendo
     claramente más que la lluvia que se pone a mano. */
  for (const piedra of panel.piedras) {
    if (piedra.conf.id === "lluvia") clima.lluviaObj = piedra.on ? 0.8 : 0;
    if (piedra.conf.id === "relampagos") clima.tormentaObj = piedra.on ? 0.8 : 0;
  }
}

function marcarPanelUsado() {
  if (panel.usado) return;
  panel.usado = true;
  raiz.classList.add("is-panel-usado");
}

// ==========================================
// CAJITA MUSICAL
// ==========================================
//
// Una cajita de madera apoyada en una piedra, al lado de la fogata. Se
// toca y se abre; se vuelve a tocar y se cierra.
//
// Suena `musica.mp3`, con fundido de entrada y de salida. Si el archivo
// no está, suena una nana sintetizada en bucle —la misma melodía— para
// que la cajita nunca se quede muda.

const cajita = {
  abierta: false,
  tapa: 0,            // 0 cerrada · 1 abierta
  nota: 0,            // el brillo de la última nota
  lamina: 0,          // qué lámina del peine acaba de sonar
  fuente: null,
  gain: null,
  sinteticaReloj: null,
  girando: 0,
  /* La manivela va aparte del rodillo: tiene inercia propia y al cerrar
     la caja no se para en seco, se va parando. */
  manivela: 0,
  manivelaV: 0,
  /* Cuántas veces se ha abierto, para el secreto de la caja. */
  veces: 0,
};

/* La nana sintetizada, por si no hay archivo. Es una caja de música: el
   sonido de una púa metálica, que es el fundamental más dos armónicos
   INARMÓNICOS —2.76 y 5.4—, porque una lámina de metal no vibra en
   múltiplos exactos. Eso es lo que la hace sonar a metal y no a flauta. */
const NANA = [
  ["E5",1],["G5",0.5],["A5",1.5],["G5",0.5],["E5",1],["D5",1],["E5",2],
  ["C5",1],["E5",0.5],["G5",1.5],["E5",0.5],["D5",1],["C5",2],
];
const SEMI = { C:0, Cs:1, D:2, Ds:3, E:4, F:5, Fs:6, G:7, Gs:8, A:9, As:10, B:11 };
function hz(n) {
  const m = /^([A-G]s?)(-?\d)$/.exec(n);
  if (!m) return 440;
  const k = SEMI[m[1]] + (Number(m[2]) + 1) * 12;
  return 440 * Math.pow(2, (k - 69) / 12);
}

function puaCajita(frecuencia, cuando, destino) {
  const c = audio.ctx;
  for (const [mult, amp] of [[1, 1], [2.76, 0.3], [5.4, 0.12]]) {
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(frecuencia * mult, cuando);
    /* Los armónicos se apagan antes que el fundamental: por eso suena
       metálico al principio y dulce al final. */
    const largo = 2.3 / mult;
    g.gain.setValueAtTime(0, cuando);
    g.gain.linearRampToValueAtTime(0.14 * amp, cuando + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, cuando + largo);
    o.connect(g).connect(destino);
    o.start(cuando); o.stop(cuando + largo + 0.05);
  }
}

async function abrirCajita() {
  if (!despertarAudio()) return;
  cajita.abierta = true;
  golpe(0.07, 1500, 0.14, "bandpass");

  cajita.gain = audio.ctx.createGain();
  cajita.gain.gain.value = 0;
  cajita.gain.connect(audio.maestro);
  cajita.gain.gain.linearRampToValueAtTime(0.75, audio.ctx.currentTime + 1.4);

  /* Se prueban las rutas en orden y se coge la primera que exista. */
  let buf = null;
  for (const ruta of [CONF.rutas.musica, ...(CONF.rutas.musicaTambien || [])]) {
    buf = await traerBuffer(ruta);
    if (buf) break;
    if (!cajita.abierta) return;
  }
  if (!cajita.abierta) return;                 // la cerró mientras cargaba

  if (buf) {
    const src = audio.ctx.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    src.connect(cajita.gain);
    src.start();
    cajita.fuente = src;
  } else {
    /* La nana, en bucle, programada por compases. */
    const negra = 60 / 82;
    let t = audio.ctx.currentTime + 0.2;
    const tocarVuelta = () => {
      if (!cajita.abierta || !audio.ctx) return;
      let total = 0;
      for (const [nota, dur] of NANA) {
        puaCajita(hz(nota), t + total, cajita.gain);
        puaCajita(hz(nota) / 2, t + total + 0.01, cajita.gain);
        total += dur * negra;
      }
      t += total;
      cajita.sinteticaReloj = setTimeout(tocarVuelta, (total - 0.4) * 1000);
    };
    tocarVuelta();
  }
  decir(sitio.cajita.x, sitio.cajita.y - U * 7, "🎵", { dur: 2 });
  secretoDeLaCajita();
}

/**
 * Lo que la cajita sabe.
 *
 * ── LA MÚSICA BAJO LA LLUVIA ─────────────────────────────────────────
 * Abrirla mientras llueve no es lo mismo que abrirla con la noche
 * despejada, y la escena se da por enterada: baja el resto de
 * ambientes para que la música se quede sola contra el agua, y lo dice.
 * Es el secreto que más cuesta encontrar porque hay que hacer dos cosas
 * a la vez, y por eso es el que mejor sienta.
 *
 * ── Y LA CUENTA ──────────────────────────────────────────────────────
 * La séptima vez que se abre —hoy o cualquier otra noche— la caja
 * contesta. No hace nada más: sólo demuestra que llevaba la cuenta.
 */
function secretoDeLaCajita() {
  cajita.veces = recuerdo.sumar("cajita");
  const c = sitio.cajita;

  if (clima.lluvia > 0.35) {
    contarLogro("cajitaLluvia");
    /* Los ambientes se apartan para dejarla sonar sola. */
    agacharAmbientes(0.35, 2);
    setTimeout(() => agacharAmbientes(1, 3), 12000);
    setTimeout(() => decir(c.x, c.y - U * 9,
      CONF.cajita.bajoLaLluvia[Math.floor(Math.random() * CONF.cajita.bajoLaLluvia.length)],
      { mimo: true, importante: true, dur: 6 }), 1800);
    return;
  }

  if (cajita.veces === CONF.cajita.cuenta) {
    setTimeout(() => decir(c.x, c.y - U * 9, CONF.cajita.alaSeptima,
      { mimo: true, importante: true, dur: 6 }), 2400);
    magia(523);
    contarLogro("cajitaCuenta");
  }
}

function cerrarCajita() {
  cajita.abierta = false;
  golpe(0.08, 700, 0.16, "lowpass");
  clearTimeout(cajita.sinteticaReloj);
  if (cajita.gain) {
    const g = cajita.gain, src = cajita.fuente;
    const t = audio.ctx.currentTime;
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 1.2);
    setTimeout(() => {
      try { src?.stop(); } catch {}
      try { g.disconnect(); } catch {}
    }, 1400);
  }
  cajita.fuente = null;
  cajita.gain = null;
}

function moverCajita(dt) {
  cajita.tapa = damp(cajita.tapa, cajita.abierta ? 1 : 0, 4.5, dt);

  /* La manivela, con inercia: acelera al abrir y se va parando al
     cerrar. Que no se detenga en seco es lo que la hace parecer una
     pieza de metal con peso y no una aguja de reloj. */
  const quiere = cajita.abierta ? 2.9 : 0;
  cajita.manivelaV = damp(cajita.manivelaV, quiere, cajita.abierta ? 2.2 : 0.9, dt);
  cajita.manivela += cajita.manivelaV * dt;

  if (cajita.abierta) {
    cajita.girando += dt * 2.4;
    /* Una nota de luz cada tanto, al ritmo de la música. */
    cajita.nota = Math.max(0, cajita.nota - dt * 1.6);
    if (Math.random() < dt * 1.6) {
      cajita.nota = 1;
      cajita.lamina = Math.floor(Math.random() * 7);
      soltar(sitio.cajita.x + azar(-U, U), sitio.cajita.y - U * 3, {
        vx: azar(-14, 14) + clima.viento * 10, vy: azar(-34, -16),
        vida: azar(1.6, 2.8), tam: azar(1.2, 2.4),
        tipo: TIPO.BRILLO, tono: 0.85,
      });
    }
  } else {
    cajita.nota = Math.max(0, cajita.nota - dt * 2);
  }
}

function dibujarCajita() {
  const d = desplazar(2.0);
  const c = sitio.cajita;
  const x = c.x + d.x, y = c.y + d.y;
  /* Un poco más alta que antes: con `0.9` el cuerpo medía menos que la
     tapa y la caja entera se leía como dos tablas apiladas. */
  const w = c.r * 1.42, h = c.r * 1.06;
  const abre = cajita.tapa;
  const il = fuego.brillo;

  /* La piedra sobre la que está. */
  ctx.fillStyle = `rgb(${Math.round(mez(30, 70, il * 0.6))},${Math.round(mez(28, 52, il * 0.6))},${Math.round(mez(30, 44, il * 0.6))})`;
  ctx.beginPath();
  ctx.ellipse(x, y + h * 0.75, w * 1.1, h * 0.5, 0, 0, 6.283);
  ctx.fill();
  /* Y su sombra, que la pega al suelo. */
  ctx.fillStyle = "rgba(4,4,10,0.4)";
  ctx.beginPath();
  ctx.ellipse(x, y + h * 0.66, w * 1.02, h * 0.28, 0, 0, 6.283);
  ctx.fill();

  /* La luz que sale de dentro cuando está abierta. */
  if (abre > 0.05) {
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(x, y - h * 0.2, 0, x, y - h * 0.2, w * 3);
    g.addColorStop(0, `rgba(255,214,150,${0.3 * abre})`);
    g.addColorStop(1, "rgba(255,214,150,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y - h * 0.2, w * 3, 0, 6.283);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }

  /* =====================================================================
     EL INTERIOR
     =====================================================================
     Se pinta ANTES que el cuerpo y que la tapa, y recortado a la boca de
     la caja. Así, cuando la tapa sube, lo de dentro aparece por detrás
     del canto en vez de crecer encima de él, que es la diferencia entre
     «se abre una caja» y «aparece un dibujo».                        */
  /* La boca de la caja y cuánto se ha abierto. Todo lo de dentro se
     mide desde aquí: el interior CRECE hacia arriba desde el canto del
     cuerpo según sube la tapa, que es lo que hace que se vea aparecer
     por detrás en vez de crecer encima. */
  const boca = y - h * 0.5;
  const dentro = h * 1.25 * abre;

  if (abre > 0.04) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(x - w * 0.94, boca - dentro, w * 1.88, dentro);
    ctx.clip();

    /* El fondo de terciopelo. */
    const gf = ctx.createLinearGradient(0, boca - dentro, 0, boca);
    gf.addColorStop(0, "#2b1018");
    gf.addColorStop(1, "#4a1c28");
    ctx.fillStyle = gf;
    ctx.fillRect(x - w * 0.94, boca - dentro, w * 1.88, dentro);

    /* ---- EL MECANISMO ----
       El cilindro con sus púas y el peine de láminas. Es lo que hace
       que se vea que la música SALE de algo, y no que suena de fondo. */
    /* El rodillo va a un tercio de alto de la boca: más abajo y el
       peine que cuelga de él se salía del recorte y no se veía. */
    const my2 = boca - dentro * 0.34;
    const cw = w * 0.62, ch = h * 0.16;
    /* El rodillo, dorado, con sus anillos. */
    const gr = ctx.createLinearGradient(0, my2 - ch, 0, my2 + ch);
    gr.addColorStop(0, "#e8c478");
    gr.addColorStop(0.5, "#b8862f");
    gr.addColorStop(1, "#6d4c17");
    ctx.fillStyle = gr;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x - cw / 2, my2 - ch, cw, ch * 2, ch * 0.5);
    else ctx.rect(x - cw / 2, my2 - ch, cw, ch * 2);
    ctx.fill();
    /* Las púas: rayitas que se MUEVEN con el giro. Son ocho líneas y
       son la mitad del encanto de la pieza. */
    ctx.strokeStyle = "rgba(60,40,12,0.55)";
    ctx.lineWidth = 1;
    for (let i = 0; i < 9; i++) {
      const t = ((i / 9) + (cajita.girando * 0.11) % 1) % 1;
      const px2 = x - cw / 2 + t * cw;
      ctx.beginPath();
      ctx.moveTo(px2, my2 - ch * 0.8);
      ctx.lineTo(px2, my2 + ch * 0.8);
      ctx.stroke();
    }
    /* El peine: las láminas que suenan. La que acaba de sonar vibra. */
    for (let i = 0; i < 7; i++) {
      const lx = x - cw * 0.44 + (i / 6) * cw * 0.88;
      const vibra = cajita.nota > 0.1 && i === cajita.lamina
        ? Math.sin(reloj * 60) * h * 0.05 * cajita.nota : 0;
      ctx.strokeStyle = `rgba(226,216,190,${0.45 + (i === cajita.lamina ? cajita.nota * 0.5 : 0)})`;
      ctx.lineWidth = Math.max(1, h * 0.045);
      ctx.beginPath();
      ctx.moveTo(lx, my2 + ch * 1.2);
      ctx.lineTo(lx + vibra, my2 + ch * 1.2 + h * (0.14 + i * 0.016));
      ctx.stroke();
    }

    /* ---- La bailarina ----
       Gira estrechándose, sin bajar nunca del 22%: una silueta plana
       rotando de verdad desaparece dos veces por vuelta. */
    ctx.save();
    ctx.globalAlpha = clamp01((abre - 0.25) / 0.5);
    /* De pie sobre el mecanismo, mirando al frente. */
    ctx.translate(x, my2 - h * 0.34);
    const sg = Math.cos(cajita.girando);
    ctx.scale(Math.max(0.22, Math.abs(sg)) * Math.sign(sg || 1), 1);
    /* El tutú, la cintura, la cabeza y los brazos en alto. */
    /* El tutú: dos capas, la de abajo más ancha y más floja. Con una
       sola raya rosa la bailarina parecía un alfiler. */
    for (const [anchoT, altoT, alfa] of [[0.26, 0.14, 0.55], [0.19, 0.1, 0.95]]) {
      ctx.fillStyle = `rgba(247,185,212,${alfa})`;
      ctx.beginPath();
      ctx.moveTo(-w * anchoT, h * 0.12);
      ctx.quadraticCurveTo(0, h * 0.12 - h * altoT, w * anchoT, h * 0.12);
      ctx.quadraticCurveTo(0, h * 0.12 + h * altoT * 1.3, -w * anchoT, h * 0.12);
      ctx.fill();
    }
    ctx.fillStyle = "#ffd6e6";
    ctx.beginPath();
    ctx.ellipse(0, -h * 0.06, w * 0.055, h * 0.2, 0, 0, 6.283);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, -h * 0.33, w * 0.075, 0, 6.283);
    ctx.fill();
    ctx.strokeStyle = "#ffd6e6";
    ctx.lineWidth = Math.max(1, w * 0.035);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-w * 0.04, -h * 0.18);
    ctx.quadraticCurveTo(-w * 0.14, -h * 0.4, 0, -h * 0.52);
    ctx.moveTo(w * 0.04, -h * 0.18);
    ctx.quadraticCurveTo(w * 0.14, -h * 0.4, 0, -h * 0.52);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;

    /* El espejito del fondo de la tapa, que devuelve un reflejo
       borroso. Es el detalle que hace que la caja tenga PROFUNDIDAD. */
    ctx.globalAlpha = clamp01((abre - 0.6) / 0.4) * 0.1;
    ctx.fillStyle = "#cfd8ee";
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x - w * 0.6, boca - dentro * 0.99, w * 1.2, dentro * 0.4, h * 0.06);
    else ctx.rect(x - w * 0.6, boca - dentro * 0.99, w * 1.2, dentro * 0.4);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  /* =====================================================================
     LA TAPA
     ===================================================================== */
  ctx.save();
  /* La tapa SUBE con el interior: se queda apoyada en el canto de
     arriba de la boca. Antes se quedaba abajo, encima del mecanismo,
     y la caja parecía abierta y cerrada a la vez. */
  ctx.translate(x, boca - dentro);
  ctx.save();
  /* Cerrada, la tapa se APOYA en el cuerpo. Con el hueco fijo de antes
     quedaba un dedo de aire entre las dos y la caja se veía partida por
     la mitad. El hueco sólo aparece según se abre. */
  ctx.translate(0, mez(-h * 0.015, -h * 0.12, abre));
  /* Se finge el giro estrechándola: una tapa plana rotando de verdad se
     ve de canto y desaparece a los noventa grados. */
  ctx.scale(1, 1 - abre * 0.72);
  ctx.translate(0, -h * 0.22 * (1 - abre));

  const gt = ctx.createLinearGradient(-w, -h * 0.4, w, h * 0.2);
  gt.addColorStop(0, `rgb(${Math.round(mez(104, 190, il))},${Math.round(mez(68, 120, il))},${Math.round(mez(42, 68, il))})`);
  gt.addColorStop(0.5, `rgb(${Math.round(mez(78, 150, il))},${Math.round(mez(50, 94, il))},${Math.round(mez(30, 52, il))})`);
  gt.addColorStop(1, `rgb(${Math.round(mez(58, 120, il))},${Math.round(mez(36, 72, il))},${Math.round(mez(22, 40, il))})`);
  ctx.fillStyle = gt;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-w, -h * 0.34, w * 2, h * 0.5, h * 0.12);
  else ctx.rect(-w, -h * 0.34, w * 2, h * 0.5);
  ctx.fill();

  /* La VETA de la madera: tres líneas curvas que siguen el mismo
     recorrido con una fase distinta. Sin veta, la madera es un
     rectángulo marrón. */
  ctx.strokeStyle = `rgba(40,22,10,${0.16 + il * 0.1})`;
  ctx.lineWidth = 1;
  for (let i = 0; i < 3; i++) {
    const yy = -h * 0.26 + i * h * 0.15;
    ctx.beginPath();
    ctx.moveTo(-w * 0.94, yy);
    ctx.bezierCurveTo(-w * 0.3, yy + h * 0.04 * (i % 2 ? 1 : -1),
                      w * 0.3, yy - h * 0.04 * (i % 2 ? 1 : -1), w * 0.94, yy);
    ctx.stroke();
  }

  /* El grabado de la tapa: dos iniciales y un corazón entre ellas.
     Es el detalle que la convierte en SU caja y no en una caja. */
  ctx.save();
  ctx.globalAlpha = 0.5 + il * 0.4;
  ctx.fillStyle = `rgb(${Math.round(mez(150, 232, il))},${Math.round(mez(116, 190, il))},${Math.round(mez(62, 110, il))})`;
  ctx.font = `${Math.round(h * 0.3)}px ui-serif, Georgia, serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("y · m", 0, -h * 0.06);
  ctx.restore();

  /* El filete dorado de la tapa, y sólo cuando está ABIERTA: cerrada,
     dos rectángulos con su marco dorado cada uno se leen como dos
     cajas, no como una caja con tapa. */
  if (abre > 0.06) {
    ctx.strokeStyle = `rgba(214,168,86,${(0.34 + il * 0.4) * clamp01(abre * 2)})`;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-w * 0.9, -h * 0.26, w * 1.8, h * 0.34, h * 0.09);
    else ctx.rect(-w * 0.9, -h * 0.26, w * 1.8, h * 0.34);
    ctx.stroke();
  }
  /* Y la sombra que la tapa echa sobre el cuerpo: es LO que las une.
     Dos piezas que se tocan sin sombra entre medias parecen dibujadas
     una al lado de la otra; con la sombra, una descansa sobre la otra. */
  ctx.fillStyle = `rgba(6,4,10,${0.45 * (1 - abre * 0.7)})`;
  ctx.fillRect(-w * 0.98, h * 0.14, w * 1.96, h * 0.09);
  ctx.restore();

  /* La bisagra: dos cilindros de latón donde la tapa se dobla. */
  ctx.fillStyle = `rgb(${Math.round(mez(120, 214, il))},${Math.round(mez(92, 168, il))},${Math.round(mez(44, 86, il))})`;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.ellipse(s * w * 0.6, h * 0.08, w * 0.07, h * 0.06, 0, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();

  /* =====================================================================
     EL CUERPO
     ===================================================================== */
  const gc = ctx.createLinearGradient(x - w, y, x + w, y + h);
  gc.addColorStop(0, `rgb(${Math.round(mez(84, 164, il))},${Math.round(mez(54, 100, il))},${Math.round(mez(32, 56, il))})`);
  gc.addColorStop(0.55, `rgb(${Math.round(mez(66, 138, il))},${Math.round(mez(42, 84, il))},${Math.round(mez(25, 46, il))})`);
  gc.addColorStop(1, `rgb(${Math.round(mez(48, 104, il))},${Math.round(mez(30, 62, il))},${Math.round(mez(18, 34, il))})`);
  ctx.fillStyle = gc;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - w, y - h * 0.5, w * 2, h, h * 0.16);
  else ctx.rect(x - w, y - h * 0.5, w * 2, h);
  ctx.fill();

  /* Los tablones del costado y su veta. */
  ctx.strokeStyle = `rgba(30,16,8,${0.2 + il * 0.12})`;
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const yy = y - h * 0.5 + (i / 4) * h;
    ctx.beginPath();
    ctx.moveTo(x - w * 0.96, yy);
    ctx.quadraticCurveTo(x, yy + (i % 2 ? h * 0.03 : -h * 0.03), x + w * 0.96, yy);
    ctx.stroke();
  }

  /* Las cantoneras de latón de las cuatro esquinas. */
  ctx.fillStyle = `rgba(${Math.round(mez(130, 226, il))},${Math.round(mez(100, 180, il))},${Math.round(mez(50, 96, il))},0.85)`;
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
    const cx2 = x + sx * w * 0.9, cy3 = y + sy * h * 0.38;
    ctx.beginPath();
    ctx.moveTo(cx2, cy3 - sy * h * 0.12);
    ctx.lineTo(cx2, cy3);
    ctx.lineTo(cx2 - sx * w * 0.12, cy3);
    ctx.closePath();
    ctx.fill();
  }

  /* El filete dorado del cuerpo. */
  ctx.strokeStyle = `rgba(214,168,86,${0.4 + il * 0.4})`;
  ctx.lineWidth = 1.3;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - w * 0.88, y - h * 0.34, w * 1.76, h * 0.72, h * 0.12);
  else ctx.rect(x - w * 0.88, y - h * 0.34, w * 1.76, h * 0.72);
  ctx.stroke();

  /* El cierre de delante: una lengüeta de latón. */
  ctx.fillStyle = `rgba(${Math.round(mez(140, 236, il))},${Math.round(mez(108, 190, il))},${Math.round(mez(56, 104, il))},0.9)`;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - w * 0.09, y - h * 0.5, w * 0.18, h * 0.26, h * 0.05);
  else ctx.rect(x - w * 0.09, y - h * 0.5, w * 0.18, h * 0.26);
  ctx.fill();
  /* Y su ojo de cerradura. */
  ctx.fillStyle = "rgba(24,16,8,0.7)";
  ctx.beginPath();
  ctx.arc(x, y - h * 0.4, w * 0.022, 0, 6.283);
  ctx.fill();

  /* =====================================================================
     LA MANIVELA
     =====================================================================
     Gira mientras suena, y tiene su propia inercia: al cerrar la caja
     no se para en seco, se va parando. */
  ctx.save();
  ctx.translate(x + w * 1.08, y);
  ctx.rotate(cajita.manivela);
  /* El eje. */
  ctx.fillStyle = `rgba(${Math.round(mez(120, 214, il))},${Math.round(mez(92, 168, il))},${Math.round(mez(44, 86, il))},0.9)`;
  ctx.beginPath(); ctx.arc(0, 0, w * 0.06, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "#c9a45c";
  ctx.lineWidth = Math.max(1.4, w * 0.07);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  /* La manivela de verdad tiene un codo, no es un palo recto. */
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(w * 0.2, 0);
  ctx.lineTo(w * 0.2, -w * 0.1);
  ctx.stroke();
  ctx.fillStyle = "#e0bd72";
  ctx.beginPath();
  ctx.ellipse(w * 0.2, -w * 0.15, w * 0.055, w * 0.1, 0, 0, 6.283);
  ctx.fill();
  ctx.restore();
}

// ==========================================
// CABAÑA
// ==========================================
//
// Al otro lado de la fogata, con la luz puesta. Es lo más acogedor de
// la escena y por eso está entera dibujada: tablones con su veta,
// ventanas con su cruz, chimenea con su humo, farol en la puerta,
// matas alrededor y un caminito de piedras hasta la entrada.
//
// Se toca y empieza la cinemática.

const cabana = {
  brillo: 1,          // el parpadeo de las ventanas
  humo: 0,
  puerta: 0,          // 0 cerrada · 1 abierta (durante la cinemática)
  resalte: 0,         // cuando el dedo pasa por encima
  farol: 0,
  mece: 0,            // cuánto se balancea el farol colgado
  apagon: 0,          // y cuándo le entra aire y casi se apaga
  /* Cuánto falta para el corazón de humo. Empieza largo: que no salga
     en los primeros segundos, cuando todavía no se está mirando. */
  corazon: 45,
  /* Alguien cruza por detrás de una ventana: vale -1 casi siempre, y de
     0 a 1 mientras dura el paso. */
  cruza: -1,
  cruzaVentana: 0,
  faltaCruce: 26,
  /* Y, mucho más de tarde en tarde, algo se asoma a la lumbrera. */
  desvan: 0,
  faltaDesvan: 80,
};

function moverCabana(dt) {
  cabana.brillo = 0.86 + 0.14 * Math.sin(reloj * 0.9) + 0.04 * Math.sin(reloj * 3.7);
  cabana.resalte = damp(cabana.resalte, 0, 2.6, dt);

  /* ---- EL FAROL ----
     Se mece con el viento DE VERDAD: el mismo `clima.viento` que dobla
     la hierba y tumba la llama de la fogata. Y cada tanto le entra una
     racha por la rendija y se queda a nada de apagarse. Dura medio
     segundo y no se repite nunca igual, porque no hay ningún reloj
     detrás: hay viento. */
  cabana.mece = Math.sin(reloj * 1.7) * (0.05 + clima.viento * 0.3)
              + Math.sin(reloj * 0.63 + 2.1) * 0.035;
  cabana.apagon = Math.max(0, cabana.apagon - dt * 2.2);
  if (cabana.apagon <= 0 && Math.random() < dt * clima.viento * 0.22) cabana.apagon = 1;
  cabana.farol = (0.8 + 0.2 * Math.sin(reloj * 2.3 + 1.1))
               * (1 - Math.sin(Math.PI * clamp01(cabana.apagon)) * 0.72);

  /* ---- ALGUIEN SE MUEVE AHÍ DENTRO ----
     Cada tanto una sombra cruza una de las ventanas, y una vez cada
     mucho más algo se asoma a la lumbrera del desván. No se pueden
     tocar, no dan nada, no se cuentan en ningún sitio y no se explican
     jamás. Están para que la cabaña tenga a alguien dentro justo cuando
     no está pasando absolutamente nada. */
  if (cabana.cruza >= 0) {
    cabana.cruza += dt / 2.4;
    if (cabana.cruza > 1) cabana.cruza = -1;
  } else {
    cabana.faltaCruce -= dt;
    if (cabana.faltaCruce <= 0) {
      cabana.faltaCruce = azar(34, 88);
      cabana.cruza = 0;
      cabana.cruzaVentana = Math.random() < 0.5 ? 0 : 1;
    }
  }
  cabana.faltaDesvan -= dt;
  if (cabana.faltaDesvan <= 0) {
    cabana.faltaDesvan = azar(95, 190);
    cabana.desvan = 1;
  }
  cabana.desvan = Math.max(0, cabana.desvan - dt * 0.42);

  cabana.humo -= dt;
  if (cabana.humo <= 0) {
    cabana.humo = flojo ? 0.7 : 0.38;
    /* La boca de la chimenea no va puesta a mano: la da el mismo sitio
       que la dibuja. Cuando se rehízo el tejado, el humo escrito a mano
       se quedó saliendo de las tejas. */
    const b = bocaDeLaChimenea();
    soltar(b.x + azar(-2, 2), b.y, {
      vx: azar(-4, 10), vy: azar(-26, -14),
      vida: azar(3.4, 5.6), tam: azar(U * 0.5, U * 1.1),
      tipo: TIPO.HUMO, tono: 0.2,
    });
  }

  /* ---- Y una de cada muchas, la chimenea echa un corazón ----------

     Una vez cada minuto y pico, y no avisa. No se puede tocar, no da
     nada y no se cuenta en ningún sitio: o lo ves o no lo ves.

     Es el secreto más escondido de todo el claro, precisamente porque
     no hay manera de provocarlo. La única forma de encontrarlo es
     quedarse mirando la cabaña sin hacer nada, que es justo lo que
     casi nadie hace. */
  cabana.corazon -= dt;
  if (cabana.corazon <= 0) {
    cabana.corazon = azar(70, 130);
    soltarCorazonDeHumo();
  }
  if (humoCorazon.t >= 0) {
    humoCorazon.t += dt;
    if (humoCorazon.t > HUMO_DURA) humoCorazon.t = -1;
  }
}

/* El corazón de humo NO se hace con partículas.
   Se intentó, y no funciona: cada bocanada de humo crece dieciséis
   píxeles por segundo, así que a los dos segundos las veintidós se han
   comido unas a otras y lo que queda es una nube gris del tamaño de
   media pantalla. Para que se leyera el contorno había que hacer el
   corazón tan grande que ocupaba todo el cielo.

   Así que es una cosa suya, con su propio reloj: veintidós bocanadas
   que suben JUNTAS, se abren despacio y se desvanecen. Pintarlo a mano
   cuesta veintidós `drawImage` durante cuatro segundos, una vez cada
   minuto y pico. */

const HUMO_DURA = 4.6;
const humoCorazon = { t: -1 };

function soltarCorazonDeHumo() {
  if (flojo || humoCorazon.t >= 0) return;
  humoCorazon.t = 0;
}

function dibujarCorazonDeHumo() {
  if (humoCorazon.t < 0) return;
  const k = clamp01(humoCorazon.t / HUMO_DURA);
  const c = sitio.cabana;
  const d = desplazar(1.25);
  /* Se abre al subir, como se abre el humo. */
  const esc = U * 0.55 * (1 + k * 0.5);
  /* Y se queda DENTRO de la pantalla. La cabaña está pegada al canto
     derecho, así que un corazón centrado en su chimenea se sale por
     ahí y sólo se ve la mitad izquierda, que no parece un corazón: el
     humo se puede inclinar un poco al subir y nadie lo nota. */
  const bx = clamp(bocaDeLaChimenea().x + d.x + k * U * 5,
    17 * esc + U * 4, A - 17 * esc - U * 5);
  /* Bien alto: a la altura de la chimenea lo tapan el tejado, el humo
     normal y cualquier tronco de los de delante. Tiene que subir hasta
     el cielo abierto para que se vea entero. */
  const by = c.y - c.h * 2.05 + d.y - k * U * 24;
  /* Y entra y sale: si sólo se desvaneciera, aparecería de golpe ya
     hecho, que es lo que delataría que está puesto a mano. */
  const alfa = Math.sin(Math.PI * k) * 0.44;
  if (alfa < 0.004) return;
  /* Treinta bocanadas y no veintidós: la curva de corazón no reparte
     los puntos a distancias iguales —se amontonan en la punta de abajo
     y se separan en los lóbulos—, y con pocas se abren huecos arriba
     que rompen el contorno. Y cada una un pelín más grande que la
     separación, para que el anillo salga continuo. */
  const s = U * (1.6 + k * 3.2);
  const N = 30;

  ctx.save();
  ctx.globalAlpha = alfa;
  for (let i = 0; i < N; i++) {
    const t = (i / N) * 6.283;
    /* La misma curva de corazón que las estrellas de la pared. */
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t)
               - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    /* Cada bocanada se mueve un poco por su cuenta, pero MUY poco: lo
       justo para que no se vea que están puestas en una fórmula. */
    const tx = bx + hx * esc + Math.sin(i * 2.3 + reloj * 0.6) * U * 1.1 * k;
    const ty = by + hy * esc + Math.cos(i * 1.7 + reloj * 0.5) * U * 0.7 * k;
    /* La bola CLARA, no la gris de la chimenea. La gris tiene casi el
       mismo color que el cielo de noche: a la opacidad a la que hay
       que pintarla para que no cante, no se distingue del fondo y el
       corazón no se ve. La clara sí recorta contra el cielo. */
    ctx.drawImage(bolaHumoClara, tx - s / 2, ty - s / 2, s, s);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---- LOS DOS MATERIALES DE LA CABAÑA ----
   Toda la madera de la escena —la pared, el porche, la leña, el tajo de
   partir— sale de esta función, y toda la piedra de la otra. Es lo que
   hace que la cabaña se lea como UNA cosa construida con dos materiales
   y no como ocho marrones distintos que por casualidad pegan.

   `veta` es el tono propio de cada pieza (0..1), `luz` cuánta fogata le
   llega y `sombra` cuánto la tapa el tejado, el costado o lo que sea. */
function tonoMadera(veta, luz, sombra) {
  const b = mez(19, 32, veta) * (1 - (sombra || 0) * 0.62);
  return `rgb(${Math.round(mez(b, b + 96, luz))},${Math.round(mez(b - 4, b + 49, luz))},${Math.round(mez(b - 8, b + 23, luz))})`;
}
function tonoPiedra(veta, luz, sombra) {
  const b = mez(21, 34, veta) * (1 - (sombra || 0) * 0.62);
  return `rgb(${Math.round(mez(b, b + 56, luz))},${Math.round(mez(b, b + 50, luz))},${Math.round(mez(b + 4, b + 48, luz))})`;
}

/**
 * Azar repetible y SIN ESTADO: el mismo `n` da siempre el mismo 0..1.
 *
 * Hace falta porque los nudos de la madera, el escalonado de las tejas y
 * el canto de cada piedra tienen que estar siempre en el mismo sitio.
 * Con `rnd()` dentro del bucle de dibujo se moverían en cada cuadro y la
 * cabaña herviría; con una tabla guardada habría que reconstruirla al
 * girar el teléfono. Así no hay nada que guardar ni que reconstruir.
 */
function ruidito(n) {
  const s = Math.sin(n * 127.1 + 43.37) * 43758.5453;
  return s - Math.floor(s);
}

/**
 * Dónde está la boca de la chimenea.
 *
 * Lo usan tres sitios —el humo normal, el corazón de humo y el dibujo—,
 * y estaba puesto a mano en cada uno. El día que se movió el tejado, el
 * humo se quedó saliendo de las tejas.
 */
function bocaDeLaChimenea() {
  const c = sitio.cabana;
  const lado = c.x > A * 0.5 ? -1 : 1;
  return { x: c.x + lado * c.w * 0.2, y: c.y - c.h * 1.66, lado };
}

/**
 * La cabaña.
 *
 * ── POR QUÉ TIENE COSTADO ────────────────────────────────────────────
 * Antes era un rectángulo con un triángulo encima: una fachada, no una
 * casa. Lo que convierte una fachada en un volumen no es el sombreado,
 * es que se le vea OTRA CARA. La cámara está en el centro de la
 * pantalla, así que a una cabaña plantada a la derecha se le ve el
 * costado izquierdo; de ahí sale todo lo demás: hacia dónde recede el
 * tejado, dónde cae la chimenea, de qué lado quedan los rincones
 * oscuros y hacia dónde mira la leña.
 *
 * ── POR QUÉ HAY TRASTOS ──────────────────────────────────────────────
 * Una cabaña limpia es una maqueta. La leña apilada, el tajo con el
 * hacha clavada, el barril bajo el alero y las botas en el escalón no
 * hacen nada y no se tocan: están para que se note que alguien vive
 * ahí, y para que la cabaña tenga algo que contar cuando no pasa nada.
 */
function dibujarCabana() {
  const d = desplazar(1.25);
  const c = sitio.cabana;
  const x = c.x + d.x, y = c.y + d.y;
  const w = c.w, h = c.h;

  /* Cuánta luz le llega de la fogata: cae con la distancia, así que la
     cabaña está más apagada que la hoguera aunque las dos se dibujen
     igual. Es lo que da sensación de que hay espacio entre ellas. */
  const distF = Math.abs(x - sitio.fogata.x) / A;
  const ilum = fuego.brillo * clamp01(1 - distF * 1.3) * 0.7;
  const luzV = cabana.brillo;

  /* De qué lado se le ve el costado, y cuánto. */
  const lado = x > A * 0.5 ? -1 : 1;
  const hondo = w * 0.26;              // lo que se mete el costado
  const sube  = h * 0.055;             // y lo que sube: se mira desde abajo
  /* Y de qué lado le da la fogata. NO se deduce de `lado`: se mira dónde
     está la hoguera y ya está. Deducirlo salió mal una vez —la leña
     acabó apilada en la cara iluminada y la sombra en la del fuego— y
     el fallo no se ve en el código, se ve en la pantalla. */
  const haciaFuego = sitio.fogata.x < x ? -1 : 1;

  /* La geometría del tejado, de una vez y para todos: el hastial y las
     tejas tienen que salir de los MISMOS números o se abre una rendija
     de cielo entre la pared y el alero. */
  const cumbre = y - h * 1.36;                    // la punta de la pared
  const pend   = (cumbre - (y - h)) / (w * 0.5);  // lo que baja por unidad de ancho
  const alaX   = w * 0.66;                        // hasta dónde vuela el alero
  const grosT  = h * 0.075;                       // el canto del tejado
  const aleY   = cumbre - pend * alaX;            // la altura del alero (bajo canto)

  /* ---- 1. EL CAMINITO ----
     Piedras medio enterradas: cada una tiene su cara de arriba —la que
     ve la luna y la fogata— y su canto en sombra. Una elipse plana sola
     se lee como una mancha; con el canto se lee como una piedra. */
  for (let i = 0; i < 9; i++) {
    const t = i / 8;
    const n0 = ruidito(i * 3.1), n1 = ruidito(i * 7.7 + 5);
    const pxc = mez(x - w * 0.34, sitio.fogata.x + U * 9, t) + (n0 - 0.5) * U * 3;
    const pyc = mez(y + h * 0.05, sitio.fogata.y + U * 4.6, t) + (n1 - 0.5) * U * 2.2;
    const s = U * mez(1.7, 2.6, t) * (0.8 + n0 * 0.4);
    const li = ilum * (0.35 + t * 0.75);
    /* El canto, primero y más oscuro. */
    ctx.fillStyle = tonoPiedra(n1, li * 0.45, 0.35);
    ctx.beginPath();
    ctx.ellipse(pxc, pyc + s * 0.16, s, s * 0.46, (n0 - 0.5) * 0.6, 0, 6.283);
    ctx.fill();
    /* Y la cara de arriba. */
    ctx.fillStyle = tonoPiedra(n0, li);
    ctx.beginPath();
    ctx.ellipse(pxc, pyc, s * 0.92, s * 0.4, (n0 - 0.5) * 0.6, 0, 6.283);
    ctx.fill();
  }

  /* ---- 2. LO QUE APOYA EN EL SUELO ----
     Dos sombras y no una: la de contacto, corta y oscura, que es la que
     pega la casa al suelo, y la larga y difusa, que es la que dice que
     hay una luna. Con una sola, o la casa flota o parece recortada. */
  ctx.fillStyle = "rgba(3,5,10,0.42)";
  ctx.beginPath();
  ctx.ellipse(x - lado * w * 0.06, y + h * 0.035, w * 0.86, h * 0.115, 0, 0, 6.283);
  ctx.fill();
  ctx.fillStyle = "rgba(2,4,9,0.55)";
  ctx.beginPath();
  ctx.ellipse(x, y + h * 0.012, w * 0.6, h * 0.05, 0, 0, 6.283);
  ctx.fill();

  /* ---- 3. LA LUZ QUE SALE POR LAS VENTANAS, EN EL SUELO ----
     Va ANTES que la cabaña: es luz tirada en la hierba, y si fuera
     después le pintaría encima de la pared. Dos manchas y no una, una
     por ventana, porque dos ventanas encendidas hacen dos manchas. */
  ctx.globalCompositeOperation = "lighter";
  for (const s of [-1, 1]) {
    const vx = x + s * w * 0.27;
    haloOvalado(vx, y + h * 0.05, w * 0.42, h * 0.1, [
      [0, `rgba(255,186,104,${0.2 * luzV})`],
      [1, "rgba(255,186,104,0)"],
    ], y + h * 0.05);
  }
  haloOvalado(x, y - h * 0.22, w * 2.1, h * 0.86, [
    [0, `rgba(255,190,110,${0.12 * luzV})`],
    [1, "rgba(255,190,110,0)"],
  ], y);
  ctx.globalCompositeOperation = "source-over";

  /* ---- 4. EL COSTADO ----
     Le da la espalda a la fogata, así que es donde vive la sombra de la
     cabaña. Los tablones van en la misma tanda que los de delante pero
     recortados y más apagados: es la misma pared doblando la esquina. */
  const xA = x + lado * w * 0.5;                  // la esquina de delante
  const xB = xA + lado * hondo;                   // y la de atrás
  /* Los troncos del costado van SESGADOS, no escalonados. Se dibujaron
     primero como rectángulos bajados un poco cada uno, y lo que salía
     era una escalera: la línea de las juntas hacía peldaños en vez de
     irse al punto de fuga. Un paralelogramo es la misma cuenta y sí
     recede. */
  const nT = 8;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(xA, y - h);
  ctx.lineTo(xB, y - h - sube);
  ctx.lineTo(xB, y - sube);
  ctx.lineTo(xA, y);
  ctx.closePath();
  ctx.clip();
  for (let i = 0; i < nT; i++) {
    const ty = y - h + (i / nT) * h;
    const th = h / nT + 0.8;
    /* Le da la fogata de refilón: no está a oscuras, está RASANTE, que
       es más bonito y además es lo que pasa de verdad. */
    ctx.fillStyle = tonoMadera(ruidito(i * 5.3 + 70), ilum * 0.34, 0.34);
    ctx.beginPath();
    ctx.moveTo(xA, ty);
    ctx.lineTo(xB, ty - sube);
    ctx.lineTo(xB, ty - sube + th);
    ctx.lineTo(xA, ty + th);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(6,4,8,0.45)";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(xA, ty + th);
    ctx.lineTo(xB, ty - sube + th);
    ctx.stroke();
  }
  /* La ventanuca del costado: escorzada de verdad —un paralelogramo con
     el mismo sesgo que la pared—, más apagada y sin cruz. Es la pieza
     que dice que la casa sigue hacia dentro. */
  const lv0 = xA + lado * hondo * 0.3, lv1 = xA + lado * hondo * 0.66;
  const lvy = y - h * 0.6 - sube * 0.48;
  ctx.beginPath();
  ctx.moveTo(lv0, lvy - h * 0.09);
  ctx.lineTo(lv1, lvy - h * 0.09 - sube * 0.36);
  ctx.lineTo(lv1, lvy + h * 0.09 - sube * 0.36);
  ctx.lineTo(lv0, lvy + h * 0.09);
  ctx.closePath();
  ctx.fillStyle = `rgba(226,142,66,${0.38 * luzV})`;
  ctx.fill();
  ctx.strokeStyle = "rgba(14,9,6,0.9)";
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.restore();

  /* ---- 5. LA PARED DE DELANTE: TRONCOS, NO TABLONES ----
     Cada tronco lleva su propio degradado de arriba abajo, y eso es lo
     que lo hace cilíndrico: claro donde la luz le pega de canto, oscuro
     donde ya se va. Un rectángulo de color plano es un tablón pintado;
     un rectángulo con ese degradado es un tronco. */
  const izq = x - w * 0.5, der = x + w * 0.5;
  /* La sombra que echa el montón de leña sobre la pared, ANTES de los
     troncos y difuminada. Iba después y como rectángulo con canto, y en
     pantalla se leía como un panel gris atornillado a la fachada. */
  const lenaX = x - haciaFuego * w * 0.44;
  for (let i = 0; i < nT; i++) {
    const ty = y - h + (i / nT) * h;
    const th = h / nT + 0.8;
    const veta = ruidito(i * 5.3);
    const gt = ctx.createLinearGradient(0, ty, 0, ty + th);
    gt.addColorStop(0, tonoMadera(veta, ilum * 0.72, 0.18));
    gt.addColorStop(0.34, tonoMadera(veta, ilum));
    gt.addColorStop(1, tonoMadera(veta, ilum * 0.4, 0.3));
    ctx.fillStyle = gt;
    ctx.fillRect(izq, ty, w, th);
    /* El barro de entre tronco y tronco. */
    ctx.fillStyle = "rgba(9,7,11,0.44)";
    ctx.fillRect(izq, ty + th - 1.5, w, 1.5);

    /* La veta y los nudos, sólo si el teléfono da para ello: son
       cuarenta trazos de un píxel que no se ven de lejos. */
    if (!flojo) {
      ctx.strokeStyle = `rgba(26,17,12,${0.13 + ilum * 0.12})`;
      ctx.lineWidth = 1;
      for (let k = 0; k < 3; k++) {
        const n = ruidito(i * 11 + k * 3.7);
        const gy = ty + th * (0.25 + n * 0.5);
        ctx.beginPath();
        ctx.moveTo(izq + w * (0.06 + n * 0.2), gy);
        ctx.lineTo(izq + w * (0.4 + ruidito(i * 13 + k) * 0.5), gy);
        ctx.stroke();
      }
      if (ruidito(i * 17) > 0.62) {
        const nx = izq + w * (0.12 + ruidito(i * 19) * 0.74);
        ctx.fillStyle = `rgba(22,14,10,${0.3 + ilum * 0.2})`;
        ctx.beginPath();
        ctx.ellipse(nx, ty + th * 0.5, th * 0.19, th * 0.13, 0, 0, 6.283);
        ctx.fill();
      }
    }

    /* La testa del tronco en la esquina de delante: el trozo que
       sobresale del entramado. Es el detalle que dice «cabaña de
       troncos» y no «caseta de tablas». */
    for (const s of [-1, 1]) {
      const ex = x + s * w * 0.5;
      const salido = w * 0.032 * (0.7 + ruidito(i * 23 + s) * 0.6);
      const cara = s === haciaFuego;
      ctx.fillStyle = tonoMadera(veta, cara ? ilum * 1.15 : ilum * 0.35, cara ? 0 : 0.4);
      ctx.beginPath();
      ctx.ellipse(ex + s * salido * 0.5, ty + th * 0.5, salido, th * 0.46, 0, 0, 6.283);
      ctx.fill();
      ctx.strokeStyle = `rgba(16,10,8,${0.4 + ilum * 0.2})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(ex + s * salido * 0.5, ty + th * 0.5, salido * 0.5, th * 0.24, 0, 0, 6.283);
      ctx.stroke();
    }
  }

  /* La sombra que echa el montón de leña sobre la pared. Se pintó
     primero como un rectángulo con su canto, y en pantalla se leía como
     un panel gris atornillado a la fachada. Difuminada se lee como lo
     que es: un rincón donde no llega la luz. */
  const gL = ctx.createRadialGradient(lenaX, y - h * 0.16, 0, lenaX, y - h * 0.16, w * 0.32);
  gL.addColorStop(0, "rgba(2,3,8,0.52)");
  gL.addColorStop(1, "rgba(2,3,8,0)");
  ctx.fillStyle = gL;
  ctx.fillRect(izq, y - h * 0.62, w, h * 0.62);

  /* ---- 6. DE DÓNDE VIENE LA LUZ, EN UNA SOLA PASADA ----
     Un degradado a lo ancho de la pared: caliente por el lado de la
     fogata y negro por el otro. Hace a la vez la luz dinámica y el
     rincón oscuro, que son la misma cosa vista por los dos cabos. */
  const gl = ctx.createLinearGradient(haciaFuego < 0 ? izq : der, 0, haciaFuego < 0 ? der : izq, 0);
  gl.addColorStop(0, `rgba(255,170,90,${0.045 + ilum * 0.1})`);
  gl.addColorStop(0.42, "rgba(120,70,30,0)");
  gl.addColorStop(1, "rgba(0,0,0,0.42)");
  ctx.fillStyle = gl;
  ctx.fillRect(izq, y - h, w, h);

  /* Y la sombra del alero, que cae sobre lo alto de la pared. Sin ella
     el tejado parece pegado con cola encima de una caja. */
  const gA = ctx.createLinearGradient(0, y - h, 0, y - h * 0.76);
  gA.addColorStop(0, "rgba(2,3,8,0.62)");
  gA.addColorStop(1, "rgba(2,3,8,0)");
  ctx.fillStyle = gA;
  ctx.fillRect(izq, y - h, w, h * 0.24);

  /* ---- 7. EL HASTIAL ----
     Tabla vertical, que es como se cierra de verdad el triángulo de una
     cabaña de troncos, y una lumbrera redonda en medio. La lumbrera es
     NEGRA: es el único hueco de la casa que no está iluminado, y ese
     agujero oscuro en lo alto es la mitad del misterio que tiene. */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(izq, y - h);
  ctx.lineTo(x, cumbre);
  ctx.lineTo(der, y - h);
  ctx.closePath();
  ctx.clip();
  const nV = 9;
  for (let i = 0; i < nV; i++) {
    const vx2 = izq + (i / nV) * w;
    ctx.fillStyle = tonoMadera(ruidito(i * 9.1 + 40), ilum * 0.46, 0.22);
    ctx.fillRect(vx2, cumbre - 2, w / nV + 0.7, h * 0.42);
    ctx.fillStyle = "rgba(8,6,10,0.34)";
    ctx.fillRect(vx2 + w / nV - 1, cumbre - 2, 1, h * 0.42);
  }
  ctx.restore();
  /* La lumbrera. */
  const luy = y - h * 1.12;
  ctx.fillStyle = "rgba(4,4,8,0.95)";
  ctx.beginPath();
  ctx.ellipse(x, luy, w * 0.052, w * 0.052, 0, 0, 6.283);
  ctx.fill();
  ctx.strokeStyle = tonoMadera(0.8, ilum * 0.7);
  ctx.lineWidth = Math.max(1.2, w * 0.014);
  ctx.beginPath();
  ctx.ellipse(x, luy, w * 0.052, w * 0.052, 0, 0, 6.283);
  ctx.stroke();
  /* Y, una de cada muchas, algo se mueve dentro de la lumbrera. No hay
     nada que tocar y no se cuenta en ningún sitio. */
  if (cabana.desvan > 0.01) {
    ctx.fillStyle = `rgba(255,150,60,${cabana.desvan * 0.5})`;
    ctx.beginPath();
    ctx.ellipse(x + w * 0.014, luy, w * 0.014, w * 0.02, 0, 0, 6.283);
    ctx.fill();
  }

  /* ---- 8. EL TEJADO ----
     Dos piezas: la faja de canto que se ve de frente —el borde de las
     tejas, que es lo que da el grosor— y el faldón que se va hacia
     dentro, que es donde van las hileras. Sin el faldón el tejado es
     una raya; con él la casa tiene fondo. */
  const pPico = [x, cumbre - grosT];
  const pIzq  = [x - alaX, aleY - grosT];
  const pDer  = [x + alaX, aleY - grosT];
  /* El faldón que se ve, hacia donde recede la casa. */
  const rEave = [pIzq[0] + (lado < 0 ? 0 : 2 * alaX), pIzq[1]];
  const fEave = [rEave[0] + lado * hondo * 1.1, rEave[1] - sube * 1.1];
  const fPico = [pPico[0] + lado * hondo * 1.1, pPico[1] - sube * 1.1];
  const gF = ctx.createLinearGradient(rEave[0], rEave[1], fPico[0], fPico[1]);
  gF.addColorStop(0, tonoPiedra(0.2, ilum * 0.34, 0.3));
  gF.addColorStop(1, tonoPiedra(0.5, ilum * 0.12, 0.5));
  ctx.fillStyle = gF;
  ctx.beginPath();
  ctx.moveTo(rEave[0], rEave[1]);
  ctx.lineTo(pPico[0], pPico[1]);
  ctx.lineTo(fPico[0], fPico[1]);
  ctx.lineTo(fEave[0], fEave[1]);
  ctx.closePath();
  ctx.fill();
  /* Las hileras de tejas del faldón, y el escalonado: una hilera de
     rayas paralelas se lee como una persiana; con los cortes cambiados
     de sitio en cada hilera se lee como un tejado. */
  if (!flojo) {
    ctx.strokeStyle = "rgba(6,6,12,0.4)";
    ctx.lineWidth = 1;
    const nH = 7;
    for (let i = 1; i < nH; i++) {
      const t = i / nH;
      const a0 = [mez(rEave[0], pPico[0], t), mez(rEave[1], pPico[1], t)];
      const a1 = [mez(fEave[0], fPico[0], t), mez(fEave[1], fPico[1], t)];
      ctx.beginPath();
      ctx.moveTo(a0[0], a0[1]);
      ctx.lineTo(a1[0], a1[1]);
      ctx.stroke();
      /* El escalonado: los CORTES entre teja y teja, cambiados de sitio
         en cada hilera. Tienen que ser trocitos, no segmentos enteros
         de hilera a hilera: la primera versión los llevaba de punta a
         punta y lo que salía en pantalla era una red de pescar. */
      const paso = (i + 1) / nH;
      const c0 = [mez(rEave[0], pPico[0], paso), mez(rEave[1], pPico[1], paso)];
      const c1 = [mez(fEave[0], fPico[0], paso), mez(fEave[1], fPico[1], paso)];
      for (let k = 0; k < 5; k++) {
        const u = (k + 0.5 + (i % 2) * 0.5) / 5.5;
        const b0 = [mez(a0[0], a1[0], u), mez(a0[1], a1[1], u)];
        const b1 = [mez(c0[0], c1[0], u), mez(c0[1], c1[1], u)];
        ctx.beginPath();
        ctx.moveTo(b0[0], b0[1]);
        ctx.lineTo(mez(b0[0], b1[0], 0.45), mez(b0[1], b1[1], 0.45));
        ctx.stroke();
      }
    }
    /* Y manchas de musgo en el faldón: un tejado impecable es un tejado
       recién puesto, y esta cabaña lleva ahí toda la vida. */
    for (let i = 0; i < 5; i++) {
      const t = 0.15 + ruidito(i * 31) * 0.7, u = 0.2 + ruidito(i * 37) * 0.6;
      const mx = mez(mez(rEave[0], pPico[0], t), mez(fEave[0], fPico[0], t), u);
      const my = mez(mez(rEave[1], pPico[1], t), mez(fEave[1], fPico[1], t), u);
      ctx.fillStyle = `rgba(${Math.round(mez(24, 58, ilum))},${Math.round(mez(32, 70, ilum))},${Math.round(mez(24, 40, ilum))},0.26)`;
      ctx.beginPath();
      ctx.ellipse(mx, my, w * (0.03 + ruidito(i * 41) * 0.04), w * 0.018, 0, 0, 6.283);
      ctx.fill();
    }
  }

  /* La faja de canto, de alero a alero por encima del hastial. */
  ctx.beginPath();
  ctx.moveTo(pIzq[0], pIzq[1]);
  ctx.lineTo(pPico[0], pPico[1]);
  ctx.lineTo(pDer[0], pDer[1]);
  ctx.lineTo(pDer[0], pDer[1] + grosT);
  ctx.lineTo(pPico[0], pPico[1] + grosT);
  ctx.lineTo(pIzq[0], pIzq[1] + grosT);
  ctx.closePath();
  const gC = ctx.createLinearGradient(0, cumbre - grosT, 0, aleY + grosT);
  gC.addColorStop(0, tonoPiedra(0.7, ilum * 0.5));
  gC.addColorStop(1, tonoPiedra(0.25, ilum * 0.26, 0.28));
  ctx.fillStyle = gC;
  ctx.fill();
  /* El caballete, que remata la cumbrera. */
  ctx.fillStyle = tonoMadera(0.9, ilum * 0.55, 0.1);
  ctx.beginPath();
  ctx.moveTo(x - w * 0.05, cumbre - grosT * 0.8);
  ctx.lineTo(x + lado * hondo * 1.12 + w * 0.02, cumbre - grosT * 0.8 - sube * 1.12);
  ctx.lineTo(x + lado * hondo * 1.12 - w * 0.02, cumbre - grosT * 0.2 - sube * 1.12);
  ctx.lineTo(x + w * 0.05, cumbre - grosT * 0.2);
  ctx.closePath();
  ctx.fill();

  /* El sofito: el bajo del vuelo del alero, que queda a oscuras. Es una
     cuña negra pequeñita en cada punta y se nota muchísimo cuando no
     está, porque sin ella el tejado no vuela, se posa. */
  for (const s of [-1, 1]) {
    ctx.fillStyle = "rgba(2,3,7,0.72)";
    ctx.beginPath();
    ctx.moveTo(x + s * alaX, aleY + grosT * 0.2);
    ctx.lineTo(x + s * w * 0.5, y - h);
    ctx.lineTo(x + s * w * 0.5, y - h * 0.94);
    ctx.lineTo(x + s * alaX, aleY + grosT * 0.9);
    ctx.closePath();
    ctx.fill();
  }

  /* ---- 9. LA CHIMENEA ----
     Va DESPUÉS del tejado porque sale de él, no de detrás. Piedra a
     piedra, con las juntas cambiadas de hilada, y con su sombra sobre
     las tejas: eso último es lo que la planta en el faldón. */
  const b0ch = bocaDeLaChimenea();
  const chx = b0ch.x + d.x;
  const chAncho = w * 0.14;
  const chPie = cumbre - pend * Math.abs(w * 0.2) - sube * 0.5;
  const chCima = b0ch.y + d.y;
  const chAlto = chPie - chCima;
  /* El collarín, donde la chimenea entra en las tejas. Es la pieza que
     la PLANTA en el tejado: sin ella se lee como una torre apoyada
     encima. Va hacia `lado`, que es hacia donde recede el faldón que se
     ve; puesto al otro lado —que fue el primer intento— se dibujaba
     sobre el hastial y salía un triángulo negro en medio de la casa. */
  ctx.fillStyle = "rgba(3,4,10,0.6)";
  ctx.beginPath();
  ctx.moveTo(chx - chAncho * 0.62, chPie - chAncho * 0.16);
  ctx.lineTo(chx - chAncho * 0.62 + lado * chAncho * 0.66, chPie - chAncho * 0.5);
  ctx.lineTo(chx + chAncho * 0.62 + lado * chAncho * 0.66, chPie - chAncho * 0.5);
  ctx.lineTo(chx + chAncho * 0.62, chPie - chAncho * 0.16);
  ctx.closePath();
  ctx.fill();
  /* La piedra: seis hiladas con las juntas cambiadas, y todo bastante
     más apagado que la madera. Una chimenea clara se lee como una torre
     de hormigón; ésta tiene que ser un bulto oscuro con canto de luna. */
  ctx.save();
  ctx.beginPath();
  ctx.rect(chx - chAncho * 0.5, chCima, chAncho, chAlto);
  ctx.clip();
  for (let i = 0; i < 6; i++) {
    const py2 = chPie - (i / 6) * chAlto;
    const ph2 = chAlto / 6 + 0.9;
    for (let k = -1; k < 3; k++) {
      const bx = chx - chAncho * 0.5 + (k + (i % 2) * 0.5) * chAncho * 0.5;
      ctx.fillStyle = tonoPiedra(ruidito(i * 7 + k * 3 + 90), ilum * 0.2, 0.42);
      ctx.fillRect(bx, py2 - ph2, chAncho * 0.5 - 1, ph2 - 1);
    }
  }
  ctx.restore();
  /* El canto que le pone la luna por el lado de fuera. */
  ctx.strokeStyle = `rgba(150,166,210,${0.12 * (1 - clima.lluvia * 0.7)})`;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(chx - lado * chAncho * 0.5, chPie);
  ctx.lineTo(chx - lado * chAncho * 0.5, chCima);
  ctx.stroke();
  /* El remate, que sobresale. */
  ctx.fillStyle = tonoPiedra(0.6, ilum * 0.22, 0.34);
  ctx.fillRect(chx - chAncho * 0.66, chCima - chAncho * 0.1, chAncho * 1.32, chAncho * 0.16);
  /* La boca, negra, con la brasa de dentro asomando: es la razón de que
     el humo salga de ahí y no de un punto cualquiera. */
  ctx.fillStyle = "rgba(2,2,5,0.96)";
  ctx.fillRect(chx - chAncho * 0.3, chCima - chAncho * 0.04, chAncho * 0.6, chAncho * 0.14);
  ctx.globalCompositeOperation = "lighter";
  haloOvalado(chx, chCima, chAncho * 1.3, chAncho * 0.8, [
    [0, `rgba(255,124,44,${0.16 + fuego.brillo * 0.08})`],
    [1, "rgba(255,120,40,0)"],
  ], chCima);
  ctx.globalCompositeOperation = "source-over";

  /* ---- 10. LAS VENTANAS ---- */
  const vy = y - h * 0.63, vw = w * 0.23, vh = h * 0.29;
  dibujarVentanaCabana(x - w * 0.3, vy, vw, vh, luzV, ilum,
    cabana.cruzaVentana === 0 ? cabana.cruza : -1);
  dibujarVentanaCabana(x + w * 0.3, vy, vw, vh, luzV * 0.92, ilum,
    cabana.cruzaVentana === 1 ? cabana.cruza : -1);

  /* ---- 11. LA PUERTA ----
     Con su marco, su dintel y su umbral. Una puerta sin marco es una
     mancha con forma de puerta pegada en la pared. */
  const pw = w * 0.23, ph = h * 0.48;
  ctx.fillStyle = tonoMadera(0.95, ilum * 0.9, 0.05);
  ctx.beginPath();
  ctx.moveTo(x - pw * 0.66, y);
  ctx.lineTo(x - pw * 0.66, y - ph * 0.86);
  ctx.quadraticCurveTo(x, y - ph * 1.2, x + pw * 0.66, y - ph * 0.86);
  ctx.lineTo(x + pw * 0.66, y);
  ctx.closePath();
  ctx.fill();
  /* La hoja, más oscura que el marco y con sus tablas. */
  const gpu = ctx.createLinearGradient(x - pw / 2, 0, x + pw / 2, 0);
  gpu.addColorStop(0, tonoMadera(0.3, ilum * (haciaFuego < 0 ? 0.8 : 0.3), 0.3));
  gpu.addColorStop(1, tonoMadera(0.3, ilum * (haciaFuego < 0 ? 0.3 : 0.8), 0.3));
  ctx.fillStyle = gpu;
  ctx.beginPath();
  ctx.moveTo(x - pw / 2, y);
  ctx.lineTo(x - pw / 2, y - ph * 0.82);
  ctx.quadraticCurveTo(x, y - ph * 1.12, x + pw / 2, y - ph * 0.82);
  ctx.lineTo(x + pw / 2, y);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = "rgba(10,7,6,0.5)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const tx2 = x - pw / 2 + (i / 4) * pw;
    ctx.beginPath();
    ctx.moveTo(tx2, y - ph * 0.04);
    ctx.lineTo(tx2, y - ph * (0.86 - Math.abs(i / 4 - 0.5) * 0.36));
    ctx.stroke();
  }
  /* Los herrajes: dos bandas de hierro cruzando la hoja. */
  ctx.strokeStyle = `rgba(${Math.round(mez(26, 96, ilum))},${Math.round(mez(24, 84, ilum))},${Math.round(mez(26, 76, ilum))},0.8)`;
  ctx.lineWidth = Math.max(1.3, w * 0.013);
  for (const fy2 of [0.24, 0.66]) {
    ctx.beginPath();
    ctx.moveTo(x - pw * 0.46, y - ph * fy2);
    ctx.lineTo(x + pw * 0.46, y - ph * fy2);
    ctx.stroke();
  }

  /* Si está abierta —durante la cinemática—, se ve el hueco caliente. */
  if (cabana.puerta > 0.01) {
    ctx.save();
    ctx.globalAlpha = cabana.puerta;
    const gp = ctx.createLinearGradient(x - pw / 2, y, x + pw / 2, y - ph);
    gp.addColorStop(0, "rgba(255,180,90,0.9)");
    gp.addColorStop(1, "rgba(255,140,60,0.5)");
    ctx.fillStyle = gp;
    ctx.beginPath();
    ctx.moveTo(x - pw / 2, y);
    ctx.lineTo(x - pw / 2, y - ph * 0.82);
    ctx.quadraticCurveTo(x, y - ph * 1.12, x + pw * (0.5 - cabana.puerta * 0.8), y - ph * 0.82);
    ctx.lineTo(x + pw * (0.5 - cabana.puerta * 0.8), y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  /* El pomo, de hierro, con su brillito. */
  ctx.fillStyle = `rgba(${Math.round(mez(40, 210, ilum))},${Math.round(mez(36, 172, ilum))},${Math.round(mez(34, 110, ilum))},0.95)`;
  ctx.beginPath();
  ctx.arc(x + pw * 0.3, y - ph * 0.44, Math.max(1.5, w * 0.016), 0, 6.283);
  ctx.fill();

  /* ---- 12. EL ESCALÓN ----
     Una losa y dos maderos, con su hueco negro debajo. Antes la puerta
     salía directamente de la hierba. */
  ctx.fillStyle = "rgba(2,3,7,0.7)";
  ctx.fillRect(x - pw * 0.95, y + h * 0.008, pw * 1.9, h * 0.035);
  ctx.fillStyle = tonoMadera(0.5, ilum * 0.8, 0.1);
  ctx.fillRect(x - pw * 0.95, y - h * 0.018, pw * 1.9, h * 0.03);
  ctx.fillStyle = tonoMadera(0.8, ilum * 1.05);
  ctx.fillRect(x - pw * 0.95, y - h * 0.018, pw * 1.9, h * 0.008);

  /* ---- 13. EL FAROL ----
     Colgado del alero, en la esquina que da a la fogata, y se mece con
     el viento de verdad: el mismo `clima.viento` que dobla la hierba y
     tumba la llama.

     Estuvo primero clavado a la pared, al lado de la puerta, y ahí se
     metía dentro de la ventana: la escarpia cruzaba el alféizar y el
     farol quedaba pegado al cristal, que es exactamente lo que no se
     quiere cuando lo que se busca es que las cosas tengan su sitio.
     Colgado de la punta del alero no estorba a nada, alumbra el
     caminito y además vuela, que es lo que hace un farol. */
  const fx0 = x + haciaFuego * alaX * 0.84, fy0 = aleY + grosT * 0.4;
  const cuerda = w * 0.1;
  const mece = cabana.mece;
  const fx = fx0 + Math.sin(mece) * cuerda, fy = fy0 + Math.cos(mece) * cuerda;
  /* La escarpia, metida bajo el alero. */
  ctx.strokeStyle = tonoMadera(0.2, ilum * 0.5, 0.2);
  ctx.lineWidth = Math.max(1.3, w * 0.016);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(fx0 - haciaFuego * w * 0.05, fy0 - w * 0.012);
  ctx.lineTo(fx0, fy0);
  ctx.stroke();
  ctx.strokeStyle = "rgba(30,26,24,0.9)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(fx0, fy0);
  ctx.lineTo(fx, fy);
  ctx.stroke();
  /* El halo, que es lo que de verdad se ve del farol de lejos. */
  ctx.globalCompositeOperation = "lighter";
  haloOvalado(fx, fy, w * 0.55, w * 0.55, [
    [0, `rgba(255,206,128,${0.46 * cabana.farol})`],
    [0.4, `rgba(255,186,104,${0.14 * cabana.farol})`],
    [1, "rgba(255,186,104,0)"],
  ], fy);
  ctx.globalCompositeOperation = "source-over";
  /* Y el farol: caja de hierro, cristal y llama. */
  const fw = w * 0.06, fh = w * 0.086;
  ctx.fillStyle = "#171310";
  ctx.beginPath();
  ctx.moveTo(fx - fw * 0.7, fy - fh * 0.5);
  ctx.lineTo(fx + fw * 0.7, fy - fh * 0.5);
  ctx.lineTo(fx + fw * 0.55, fy + fh * 0.6);
  ctx.lineTo(fx - fw * 0.55, fy + fh * 0.6);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = `rgba(255,214,140,${cabana.farol})`;
  ctx.fillRect(fx - fw * 0.36, fy - fh * 0.34, fw * 0.72, fh * 0.76);
  ctx.fillStyle = `rgba(255,248,214,${cabana.farol})`;
  ctx.beginPath();
  ctx.ellipse(fx, fy + fh * 0.06, fw * 0.16, fh * 0.24, 0, 0, 6.283);
  ctx.fill();
  ctx.fillStyle = "#0f0c0a";
  ctx.fillRect(fx - fw * 0.75, fy - fh * 0.62, fw * 1.5, fh * 0.16);

  /* ---- 14. LOS TRASTOS ----
     Nada de esto se toca ni da nada. Está para que la cabaña tenga
     biografía: alguien partió esa leña, alguien dejó ahí el hacha.

     Y todos van al lado de FUERA, el que no da a la fogata. No es una
     decisión de composición: entre la pared de la cabaña y el corro de
     piedras de la hoguera hay treinta y siete píxeles, así que
     cualquier cosa puesta de ese lado se mete dentro del fuego. Ese
     lado tiene que quedarse vacío, y de paso queda bien: delante de una
     hoguera no se apila leña. */
  dibujarLenaCabana(lenaX, y, w, h, ilum, haciaFuego);
  dibujarTajoCabana(x - haciaFuego * w * 0.14, y + h * 0.07, w, ilum, haciaFuego);
  dibujarBarrilCabana(x - haciaFuego * w * 0.64, y + h * 0.02, w, ilum);
  /* Las botas, en el escalón, apuntando hacia dentro. */
  for (const s of [0, 1]) {
    const bx2 = x - pw * 0.72 + s * w * 0.045;
    ctx.fillStyle = tonoMadera(0.1, ilum * 0.5, 0.4);
    ctx.beginPath();
    ctx.ellipse(bx2, y - h * 0.032, w * 0.019, w * 0.012, 0, 0, 6.283);
    ctx.fill();
    ctx.fillRect(bx2 - w * 0.013, y - h * 0.064, w * 0.026, h * 0.034);
  }

  /* ---- 15. LO QUE CRECE PEGADO A LA PARED ----
     Matas de hojas, no elipses: cada una son cuatro o cinco bultos
     pequeños, y ésa es toda la diferencia entre una planta y un borrón
     verde. Y ninguna delante de la puerta. */
  for (let i = 0; i < 9; i++) {
    const t = (i / 8 - 0.5) * 2.1;
    if (Math.abs(t) < 0.3) continue;
    const mx = x + t * w * 0.62;
    const my = y + Math.abs(t) * h * 0.028 + h * 0.012;
    const s = U * (1.5 + ruidito(i * 29) * 1.5);
    const il2 = ilum * (0.35 + 0.5 * clamp01(1 - Math.abs(t)));
    for (let k = 0; k < 5; k++) {
      const a = (k / 5) * 6.283 + ruidito(i * 31 + k) * 1.2;
