    /* Avisa. Un ataque sin aviso no se puede esquivar, y un ataque que
       no se puede esquivar no es una pelea: es un impuesto. */
    if (jefe.t > 1.1) {
      jefe.modo = "escupe";
      jefe.t = 0;
      jefe.quedan = Math.round(mez(3, 6, 1 - jefe.vida / jefe.vidaMax));
      jefe.relojBola = 0;
      tono(azar(90, 130), 0.6, "sawtooth", 0.06);
    }
  } else if (jefe.modo === "escupe") {
    jefe.relojBola -= dt;
    if (jefe.relojBola <= 0 && jefe.quedan > 0) {
      jefe.quedan--;
      jefe.relojBola = azar(0.24, 0.42);
      escupirFuego(J);
    }
    if (jefe.quedan <= 0 && jefe.t > 0.6) { jefe.modo = "descansa"; jefe.t = 0; }
  }

  /* ---- Las bolas de fuego ---- */
  for (let i = jefe.bolas.length - 1; i >= 0; i--) {
    const b = jefe.bolas[i];
    /* Lo mismo que en el bucle de los búhos: `quemarAlJugador` puede
       acabar la partida y vaciar la lista de bolas de un golpe, y el
       índice pendiente se queda apuntando a nada. */
    if (!b) break;
    b.t += dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vy += 120 * dt;

    /* Rastro. */
    if (Math.random() < dt * 40) {
      soltar(b.x + azar(-U, U), b.y + azar(-U, U), {
        vx: azar(-16, 16), vy: azar(-26, 4),
        vida: azar(0.3, 0.8), tam: azar(1.4, 3.2),
        tipo: TIPO.CHISPA, tono: 0.08,
      });
    }

    /* ---- Chocar con la roca ----
       De verdad: la bola se apaga contra la piedra, con su reventón.
       No es una zona segura invisible. */
    const R = sitioRoca();
    if (R && Math.abs(b.x - R.x) < R.r * 1.05
        && b.y > R.y - R.r * 0.95 && b.y < R.y + R.r * 0.4) {
      reventarBola(b, true);
      jefe.bolas.splice(i, 1);
      continue;
    }

    /* Llegar al jugador. */
    if (b.y > J.y - U * 3 && Math.abs(b.x - J.x) < U * 9) {
      reventarBola(b, false);
      jefe.bolas.splice(i, 1);
      quemarAlJugador();
      if (caza.fase !== "oleada") return;
      continue;
    }
    if (b.y > H + U * 6 || b.t > 6) {
      reventarBola(b, false);
      jefe.bolas.splice(i, 1);
    }
  }
}

function escupirFuego(J) {
  /* Apunta a donde ESTÁS, no a donde estarás: así correr funciona. */
  const dx = J.x - jefe.x, dy = J.y - jefe.y;
  const d = Math.max(1, Math.hypot(dx, dy));
  const v = A * 0.62;
  jefe.bolas.push({
    x: jefe.x, y: jefe.y + U * 4,
    vx: (dx / d) * v + azar(-A * 0.05, A * 0.05),
    vy: (dy / d) * v * 0.7,
    t: 0, r: U * azar(2.4, 3.6), f: azar(0, 6.283),
  });
  golpe(0.12, 320, 0.2, "lowpass");
  tono(azar(140, 200), 0.3, "sawtooth", 0.04);
}

function reventarBola(b, contraRoca) {
  golpe(0.1, contraRoca ? 240 : 400, 0.18, "lowpass");
  const n = flojo ? 6 : 14;
  for (let i = 0; i < n; i++) {
    const a = azar(0, 6.283);
    soltar(b.x, b.y, {
      vx: Math.cos(a) * azar(40, 190), vy: Math.sin(a) * azar(40, 190) - 30,
      vida: azar(0.4, 1.1), tam: azar(1.2, 3),
      tipo: TIPO.CHISPA, tono: 0.08,
    });
  }
  for (let i = 0; i < (flojo ? 2 : 4); i++) {
    soltar(b.x, b.y, {
      vx: azar(-24, 24), vy: azar(-40, -8),
      vida: azar(1, 2), tam: azar(U * 0.5, U * 1.1),
      tipo: TIPO.HUMO, tono: 0.2,
    });
  }
}

/** Una bola que llega: quema. */
function quemarAlJugador() {
  caza.vidas = Math.max(0, caza.vidas - 1);
  refrescarVidas();
  sacudir(1.4);
  elFlash.style.transition = "none";
  elFlash.style.background = "rgba(255,120,40,0.6)";
  elFlash.style.opacity = "0.85";
  requestAnimationFrame(() => {
    elFlash.style.transition = "opacity 560ms cubic-bezier(0.22,1,0.36,1)";
    elFlash.style.opacity = "0";
  });
  golpe(0.2, 150, 0.34, "lowpass");
  if (caza.vidas <= 0) { perderCaceria(); return; }
  decir(A * 0.5, H * 0.46, CONF.caza.quemado, { importante: true, dur: 2.4 });
}

/** Un tiro que le da al jefe. */
function herirJefe() {
  jefe.vida--;
  jefe.dolor = 1;
  sacudir(0.5);
  magia(azar(320, 420));
  golpe(0.1, 240, 0.2, "lowpass");
  for (let i = 0; i < (flojo ? 6 : 16); i++) {
    const a = azar(0, 6.283);
    soltar(jefe.x, jefe.y, {
      vx: Math.cos(a) * azar(50, 210), vy: Math.sin(a) * azar(50, 210),
      vida: azar(0.4, 1.2), tam: azar(1.2, 2.8),
      tipo: TIPO.BRILLO, tono: 0.05,
    });
  }
  /* A media vida se enfada y suelta búhos. */
  if (jefe.vida === Math.round(jefe.vidaMax * 0.55)) {
    decir(A * 0.5, H * 0.36, CONF.caza.jefeEnfada, { misterio: true, importante: true, dur: 2.8 });
    for (let i = 0; i < 4; i++) setTimeout(() => { if (jefe.vivo) soltarBuhoCaza(); }, i * 450);
  }
  if (jefe.vida <= 0) matarJefe();
}

function matarJefe() {
  jefe.vivo = false;
  jefe.bolas.length = 0;
  sacudir(2);
  magia(659);
  golpe(0.3, 120, 0.5, "lowpass");
  /* Revienta en grande: el mismo lenguaje que los búhos, a lo bestia. */
  for (let k = 0; k < 3; k++) {
    setTimeout(() => {
      caza.anillos.push({ x: jefe.x, y: jefe.y, r0: U * (8 + k * 5), t: 0, dur: 0.8 });
      for (let i = 0; i < (flojo ? 10 : 26); i++) {
        const a = azar(0, 6.283);
        soltar(jefe.x, jefe.y, {
          vx: Math.cos(a) * azar(60, 330), vy: Math.sin(a) * azar(60, 330),
          vida: azar(0.8, 2), tam: azar(1.4, 3.6),
          tipo: TIPO.BRILLO, tono: 0.45,
        });
      }
    }, k * 220);
  }
  /* Y los búhos que quedaran se van con él. */
  for (const o of caza.buhos) if (o.muerte < 0) reventarBuho(o);
  decir(A * 0.5, H * 0.38, CONF.caza.jefeMuere,
    { misterio: true, importante: true, dur: 3.4 });
  setTimeout(() => { if (caza.fase === "oleada") { caza.fase = "pausa"; caza.t = 2.4; } }, 2200);
}

/* ---- Dibujar el jefe ---------------------------------------------------- */

function dibujarJefe() {
  /* Las bolas van siempre, aunque el jefe ya no esté: las que estén en
     el aire tienen que acabar su viaje. */
  for (const b of jefe.bolas) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const late = 1 + Math.sin(b.t * 22 + b.f) * 0.12;
    haloOvalado(b.x, b.y, b.r * 4.2 * late, b.r * 4.2 * late, [
      [0, "rgba(255,226,170,0.5)"],
      [0.3, "rgba(255,140,50,0.26)"],
      [1, "rgba(220,60,20,0)"],
    ]);
    /* La cola: dos bolas más chicas por detrás, en la dirección de la
       que viene. Sin cola, una bola de fuego es una lámpara. */
    const d = Math.max(1, Math.hypot(b.vx, b.vy));
    for (let k = 1; k <= 2; k++) {
      const t = k * 0.055;
      haloOvalado(b.x - (b.vx / d) * b.r * k * 2.2, b.y - (b.vy / d) * b.r * k * 2.2,
        b.r * (1.8 - k * 0.5), b.r * (1.8 - k * 0.5), [
        [0, `rgba(255,${180 - k * 40},60,${0.4 - k * 0.12})`],
        [1, "rgba(220,70,20,0)"],
      ]);
      void t;
    }
    /* El corazón: naranja por fuera y casi blanco por dentro, que es
       como se ve algo ardiendo de verdad. */
    const gb = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * late);
    gb.addColorStop(0, "rgba(255,250,232,0.98)");
    gb.addColorStop(0.45, "rgba(255,206,110,0.95)");
    gb.addColorStop(1, "rgba(240,120,30,0.85)");
    ctx.fillStyle = gb;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * late, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }

  if (!jefe.vivo) return;
  const r = U * 11 * jefe.entrada;
  const x = jefe.x, y = jefe.y;
  const carga = jefe.modo === "carga" ? clamp01(jefe.t / 1.1) : 0;
  const esc = jefe.modo === "escupe" ? 1 : 0;

  ctx.save();
  ctx.translate(x, y);

  /* El aura. Roja siempre; al cargar se pone naranja y crece, que es
     todo el aviso que hay y es suficiente. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  haloOvalado(0, 0, r * (4 + carga * 2.4), r * (3.2 + carga * 2), [
    [0, `rgba(${Math.round(mez(180, 255, carga))},${Math.round(mez(30, 150, carga))},30,${0.16 + carga * 0.28 + jefe.dolor * 0.2})`],
    [1, "rgba(160,20,10,0)"],
  ]);
  ctx.restore();

  /* Las alas: enormes y membranosas, no de plumas. */
  const bat = Math.sin(jefe.ala) * 0.85;
  ctx.fillStyle = `rgba(${Math.round(mez(10, 70, jefe.dolor))},8,12,0.95)`;
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.3);
    ctx.quadraticCurveTo(s * r * 1.6, -r * (1 + bat * 1.1), s * r * 3.1, -r * (0.2 + bat * 0.7));
    ctx.quadraticCurveTo(s * r * 2.4, r * 0.5, s * r * 1.5, r * 0.5);
    ctx.quadraticCurveTo(s * r * 0.7, r * 0.8, 0, r * 0.6);
    ctx.closePath();
    ctx.fill();
    /* Las varillas del ala. */
    ctx.strokeStyle = "rgba(3,3,5,0.85)";
    ctx.lineWidth = Math.max(1, r * 0.08);
    for (let i = 1; i <= 3; i++) {
      const t = i / 4;
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.2);
      ctx.lineTo(s * r * mez(1.4, 2.9, t), -r * mez(0.9, 0.1, t) - bat * r * 0.6 * (1 - t));
      ctx.stroke();
    }
  }

  /* El cuerpo. */
  const gc = ctx.createLinearGradient(0, -r * 1.4, 0, r * 1.4);
  gc.addColorStop(0, `rgb(${Math.round(mez(16, 90, jefe.dolor))},12,16)`);
  gc.addColorStop(1, "rgb(6,5,8)");
  ctx.fillStyle = gc;
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 1.2, 0, 0, 6.283);
  ctx.fill();
  /* Los cuernos: largos y torcidos. */
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * r * 0.34, -r * 0.82);
    ctx.quadraticCurveTo(s * r * 1.15, -r * 1.5, s * r * 0.82, -r * 2.15);
    ctx.quadraticCurveTo(s * r * 0.86, -r * 1.4, s * r * 0.72, -r * 0.62);
    ctx.closePath();
    ctx.fill();
  }

  /* La boca, que se abre al escupir. */
  if (carga > 0.1 || esc) {
    const abre = Math.max(carga, esc);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    haloOvalado(0, r * 0.46, r * 0.8 * abre, r * 0.6 * abre, [
      [0, `rgba(255,236,190,${0.85 * abre})`],
      [0.4, `rgba(255,140,40,${0.5 * abre})`],
      [1, "rgba(220,60,10,0)"],
    ]);
    ctx.restore();
  }

  /* Y los ojos: dos brasas. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const s of [-1, 1]) {
    const ex = s * r * 0.4, ey = -r * 0.24;
    haloOvalado(ex, ey, r * 1.1, r * 1.1, [
      [0, `rgba(255,90,60,${0.6 + jefe.dolor * 0.3})`],
      [0.35, "rgba(230,40,30,0.24)"],
      [1, "rgba(200,20,20,0)"],
    ]);
    ctx.fillStyle = "rgba(255,190,160,0.95)";
    ctx.beginPath();
    ctx.ellipse(ex, ey, r * 0.2, r * 0.26, 0, 0, 6.283);
    ctx.fill();
    ctx.fillStyle = "rgba(60,4,2,0.9)";
    ctx.beginPath();
    ctx.ellipse(ex, ey, r * 0.07, r * 0.2, 0, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();
  ctx.restore();

  /* La barra de vida: una raya fina debajo de él, y nada más. */
  const k = clamp01(jefe.vida / jefe.vidaMax);
  const w = U * 22;
  ctx.save();
  ctx.globalAlpha = 0.72;
  ctx.fillStyle = "rgba(8,6,10,0.55)";
  ctx.fillRect(x - w / 2, y + r * 1.9, w, U * 0.55);
  const gv = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
  gv.addColorStop(0, "#7a1a16");
  gv.addColorStop(1, "#c94f26");
  ctx.fillStyle = gv;
  ctx.fillRect(x - w / 2, y + r * 1.9, w * k, U * 0.55);
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---- Recibir un golpe --------------------------------------------------- */

function golpearAlJugador(o) {
  caza.vidas = Math.max(0, caza.vidas - 1);
  refrescarVidas();
  sacudir(1.2);
  /* Un fogonazo rojo corto. El mismo elemento que usa el fuego, con
     otro color: un golpe tiene que verse sin mirar dónde. */
  elFlash.style.transition = "none";
  elFlash.style.background = "rgba(200,40,50,0.55)";
  elFlash.style.opacity = "0.8";
  requestAnimationFrame(() => {
    elFlash.style.transition = "opacity 520ms cubic-bezier(0.22,1,0.36,1)";
    elFlash.style.opacity = "0";
  });
  golpe(0.16, 120, 0.3, "lowpass");
  tono(azar(90, 130), 0.4, "sawtooth", 0.05);

  /* Un manotazo de plumas negras. */
  for (let i = 0; i < 10; i++) {
    soltar(o.x + azar(-U * 4, U * 4), o.y + azar(-U * 4, U * 4), {
      vx: azar(-90, 90), vy: azar(-60, 40),
      vida: azar(0.9, 2), tam: U * azar(0.5, 1.1),
      tipo: TIPO.HOJA, giro: azar(0, 6.283), giroV: azar(-4, 4),
      tono: 0.1,
    });
  }

  if (caza.vidas <= 0) { perderCaceria(); return; }
  decir(A * 0.5, H * 0.46, diceGolpe(), { importante: true, dur: 2.6 });
}

function perderCaceria() {
  caza.fase = "perdida";
  caza.buhos.length = 0;
  decir(A * 0.5, H * 0.44, CONF.caza.caida, { misterio: true, importante: true, dur: 3 });
  /* Y se cae redonda. Se reaprovecha entero el desmayo que ya existía:
     el velo, la cámara que pierde el equilibrio y el despertar a las
     tres en la cabaña. Un segundo final distinto para lo mismo sería
     dos finales que no se parecen. */
  setTimeout(() => {
    limpiarCaceria(false);
    arrancarAtaque();
  }, 1800);
}

/* ---- El final ----------------------------------------------------------- */

function terminarCaceria() {
  caza.fase = "final";
  caza.t = 0;
  caza.buhos.length = 0;
  /* Deja de llover poco a poco: el bosque se calma antes de que hable. */
  clima.lluviaObj = mez(caza.lluviaAntes, 0.25, 0.5);
  clima.tormentaObj = 0.2;
  caza.oscuroObj = 0.45;

  /* Y aparece él. Centrado, rojo y mirando de frente. */
  buhoEsp.centrado = 0;
  buhoEsp.sal = 1; buhoEsp.salObj = 1;
  buhoEsp.rojoObj = 1;
  buhoEsp.visto = 1;
  buhoEsp.yendo = -1;
  espesura.x = clamp(buhoEsp.x - A * 0.5, 0, espesura.tope);
  espesura.vx = 0;
  agacharAmbientes(0.3, 1.2);
}

function moverFinalCaceria(dt) {
  const t = caza.t;
  /* 1. Se centra. */
  buhoEsp.centrado = damp(buhoEsp.centrado || 0, 1, 2.2, dt);
  buhoEsp.escala = damp(buhoEsp.escala, 2.1, 1.6, dt);

  /* 2. Habla. */
  if (t > 1.2 && !caza.dicho) {
    caza.dicho = true;
    sonarMisterio(0.7);
    decir(A * 0.5, H * 0.34, CONF.caza.final,
      { misterio: true, importante: true, dur: 5 });
  }

  /* 3. Y se va. Pero no se borra: se deshace con la misma animación de
     siempre —junta energía, se para y revienta— y vuelve al rato. Lo
     que cambia es DÓNDE vuelve: ver `moverIrse`. */
  if (t > 5 && !caza.hecha) {
    caza.hecha = true;
    historia.marcar("caceria");
    recuerdo.poner("caceria", 1);
    contarLogro("caceria");
    buhoEsp.centrado = 0;
    buhoEsp.escala = 1;
    irseElBuho("verde");
    decir(A * 0.5, H * 0.44, CONF.caza.despues, { misterio: true, dur: 5 });
  }

  if (t > 8) limpiarCaceria(true);
}

/** Devuelve el bosque a como estaba. */
function limpiarCaceria(suave) {
  caza.fase = "no";
  jefe.vivo = false;
  jefe.bolas.length = 0;
  caza.dicho = false;
  caza.buhos.length = 0;
  caza.porSalir = 0;
  caza.oscuroObj = 0;
  clima.lluviaObj = caza.lluviaAntes;
  clima.tormentaObj = caza.tormentaAntes;
  buhoEsp.escala = 1;
  buhoEsp.centrado = 0;
  refrescarVidas(false);
  if (suave) agacharAmbientes(1, 2.4);
}

/**
 * Posa al búho en una rama lejana.
 *
 * ── POR QUÉ NO SE QUEDA DONDE ESTABA ─────────────────────────────────
 * Porque «sigue ahí» y «sigue en el mismo sitio» no son lo mismo. Si
 * volviera a su árbol de siempre, lo que quedaría después de la cacería
 * es que no pasó nada. Cambiándolo de rama cada vez que se entra en el
 * bosque, encontrarlo vuelve a ser encontrarlo: está, pero hay que dar
 * con él, y nunca está donde estaba ayer.
 */
function posarBuhoLejos() {
  if (!historia.hecho("caceria")) return;
  /* Una rama de la banda de en medio, lejos de donde esté la cámara. */
  const candidatos = espesura.arboles.filter((t) => t.banda === 2);
  if (!candidatos.length) return;
  const centro = espesura.x + A * 0.5;
  const lejos = candidatos.filter((t) => Math.abs(t.x - centro) > A * 0.6);
  const lista = lejos.length ? lejos : candidatos;
  const t = lista[Math.floor(Math.random() * lista.length)];
  buhoEsp.x = t.x;
  buhoEsp.y = t.base - t.alto * azar(0.5, 0.72);
  buhoEsp.modo = "lejano";
  buhoEsp.rojoObj = 1;
  buhoEsp.sal = 0.001;
  buhoEsp.salObj = 1;
  buhoEsp.dichas.clear();
  /* Rama nueva, hallazgo nuevo: se vuelve a poder decir lo de «ahí
     está». Si no se borrara, sólo se diría la primera vez de todas. */
  buhoEsp.saludado = false;
}

/* ---- Las vidas, en la interfaz ------------------------------------------ */

function refrescarVidas(encender) {
  if (encender === false) {
    elVidas.classList.remove("is-on");
    elVidas.setAttribute("aria-hidden", "true");
    return;
  }
  if (encender === true || !elVidas.children.length) {
    elVidas.textContent = "";
    for (let i = 0; i < VIDAS; i++) {
      const s = document.createElement("i");
      s.className = "ne-vida";
      elVidas.append(s);
    }
    elVidas.classList.add("is-on");
    elVidas.setAttribute("aria-hidden", "false");
  }
  const hijos = elVidas.children;
  for (let i = 0; i < hijos.length; i++) {
    const ida = i >= caza.vidas;
    const el = hijos[i];
    if (ida && !el.classList.contains("is-ida")) {
      el.classList.add("is-ida", "is-golpe");
      setTimeout(() => el.classList.remove("is-golpe"), 500);
    } else if (!ida) {
      el.classList.remove("is-ida", "is-golpe");
    }
  }
}

/* ---- Dibujar ------------------------------------------------------------ */

function dibujarCaceria() {
  /* ---- El bosque mojado ----
     Dos capas y no una. La primera MULTIPLICA un azul frío: eso no
     oscurece, APAGA —baja los verdes, sube el contraste del agua— y es
     lo que hace que el sitio parezca húmedo. La segunda oscurece de
     verdad. Con sólo la segunda, el bosque se veía exactamente igual
     pero con menos luz, que es lo que hace un atardecer, no una
     tormenta.

     Y va DEBAJO de los búhos: lo que se te echa encima no puede estar
     detrás de la penumbra. */
  if (caza.oscuro > 0.01) {
    ctx.save();
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = `rgba(104,132,176,${caza.oscuro * 0.6})`;
    ctx.fillRect(0, 0, A, H);
    ctx.restore();
    ctx.fillStyle = `rgba(3,6,12,${caza.oscuro * 0.3})`;
    ctx.fillRect(0, 0, A, H);
  }

  for (const o of caza.buhos) dibujarBuhoCaza(o);

  /* Y el jefe, por detrás de los búhos normales: es más grande y está
     más lejos, así que los pequeños le pasan por delante. */
  dibujarJefe();

  /* El arma, por delante de los búhos: la tienes tú en las manos. */
  dibujarEscopetaEnMano();

  /* Los anillos de las explosiones, por encima de todo. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const a of caza.anillos) {
    const k = a.t / a.dur;
    const r = a.r0 * (1 + k * 4.2);
    const alfa = (1 - k) * (1 - k) * 0.6;
    ctx.strokeStyle = `rgba(170,255,205,${alfa})`;
    ctx.lineWidth = Math.max(1, a.r0 * 0.5 * (1 - k));
    ctx.beginPath();
    ctx.arc(a.x, a.y, r, 0, 6.283);
    ctx.stroke();
    haloOvalado(a.x, a.y, r * 0.8, r * 0.8, [
      [0, `rgba(210,255,228,${alfa * 0.5})`],
      [1, "rgba(120,240,170,0)"],
    ]);
  }
  ctx.restore();

  /* Y la luz que el disparo echa sobre el bosque. Esto sí es un halo
     grande, pero va aparte del fogonazo del cañón: uno es la llama y
     el otro es lo que ILUMINA esa llama. Juntos en uno solo, o el
     cañón no se veía o el bosque no se encendía. */
  if (caza.fogonazo > 0.02) {
    const boca = bocaDelCanon();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    haloOvalado(boca.x, boca.y, A * 0.6, H * 0.45, [
      [0, `rgba(255,224,170,${0.24 * caza.fogonazo})`],
      [0.5, `rgba(255,170,90,${0.08 * caza.fogonazo})`],
      [1, "rgba(255,150,70,0)"],
    ]);
    ctx.restore();
  }
}

/** Dónde acaba el cañón ahora mismo, en coordenadas de pantalla. */
function bocaDelCanon() {
  const J = sitioJugador();
  const L = U * 30 - caza.culatazo * U * 4;
  return {
    x: J.x + Math.cos(caza.apunta) * L,
    y: J.y + Math.sin(caza.apunta) * L,
  };
}

/**
 * LA ESCOPETA, EN LA MANO.
 *
 * ── POR QUÉ SE VE EL ARMA Y NO SÓLO SUS EFECTOS ──────────────────────
 * Porque antes no se veía: había un fogonazo naranja saliendo del borde
 * de abajo de la pantalla y ya. Se sabía que algo había disparado, pero
 * no QUÉ, ni desde dónde, ni hacia dónde. Con el arma dibujada, el
 * cañón apunta a lo que se tocó, el fogonazo sale de la boca y el
 * retroceso se ve en el arma: los tres dicen lo mismo y se refuerzan.
 *
 * ── CÓMO SE SOSTIENE ─────────────────────────────────────────────────
 * Desde abajo del todo, en diagonal, como se ve la propia arma cuando
 * la llevas tú: escorzada, entrando por el canto inferior. No es una
 * escopeta de perfil pegada encima, es la que tienes en las manos.
 */
function dibujarEscopetaEnMano() {
  if (caza.fase === "no" && caza.culatazo < 0.02) return;
  const J = sitioJugador();
  const culat = caza.culatazo;
  /* El retroceso: el arma se va hacia atrás y se le levanta la boca. */
  const atras = culat * U * 5;
  const ang = caza.apunta - culat * 0.16;

  ctx.save();
  ctx.translate(J.x - Math.cos(ang) * atras, J.y - Math.sin(ang) * atras + U * 2);
  ctx.rotate(ang);

  /* Grande. Un arma en primera persona ocupa pantalla: a diecisiete
     unidades de largo y una y media de ancho salía una cerilla. */
  const L = U * 30, w = U * 3.4;

  /* La culata, entrando por abajo. */
  ctx.fillStyle = "#4a2f18";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-L * 0.42, -w * 0.55, L * 0.4, w * 1.25, w * 0.4);
  else ctx.rect(-L * 0.42, -w * 0.55, L * 0.4, w * 1.25);
  ctx.fill();
  /* La caja de mecanismos. */
  ctx.fillStyle = "#3e434b";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-L * 0.06, -w * 0.62, L * 0.2, w * 1.3, w * 0.18);
  else ctx.rect(-L * 0.06, -w * 0.62, L * 0.2, w * 1.3);
  ctx.fill();
  /* Los dos cañones. */
  for (const dy of [-w * 0.34, w * 0.34]) {
    const g = ctx.createLinearGradient(0, dy - w * 0.32, 0, dy + w * 0.32);
    g.addColorStop(0, "#79818d");
    g.addColorStop(0.45, "#3a414a");
    g.addColorStop(1, "#171b21");
    ctx.fillStyle = g;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(L * 0.12, dy - w * 0.32, L * 0.88, w * 0.64, w * 0.24);
    else ctx.rect(L * 0.12, dy - w * 0.32, L * 0.88, w * 0.64);
    ctx.fill();
  }
  /* El guardamanos. */
  ctx.fillStyle = "#573418";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(L * 0.16, w * 0.1, L * 0.3, w * 0.7, w * 0.22);
  else ctx.rect(L * 0.16, w * 0.1, L * 0.3, w * 0.7);
  ctx.fill();
  /* Y el punto de mira. */
  ctx.fillStyle = "rgba(230,200,124,0.9)";
  ctx.beginPath();
  ctx.arc(L * 0.94, -w * 0.62, w * 0.16, 0, 6.283);
  ctx.fill();

  /* ---- El fogonazo, en la BOCA ----
     Una estrella corta y muy blanca por dentro, no un halo naranja. Lo
     que se ve al disparar es el gas ardiendo saliendo del cañón, y eso
     dura dos centésimas y es blanco. */
  if (caza.fogonazo > 0.02) {
    const f = caza.fogonazo;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.translate(L, 0);
    haloOvalado(0, 0, U * 17 * f, U * 12 * f, [
      [0, `rgba(255,244,214,${0.8 * f})`],
      [0.3, `rgba(255,186,96,${0.34 * f})`],
      [1, "rgba(255,140,60,0)"],
    ]);
    /* Las cuatro puntas de la llamarada. */
    ctx.fillStyle = `rgba(255,236,190,${0.85 * f})`;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a2 = (i / 8) * 6.283;
      const rr = U * (i % 2 ? 2.4 : 10) * f;
      const px2 = Math.cos(a2) * rr, py2 = Math.sin(a2) * rr * 0.7;
      if (i === 0) ctx.moveTo(px2, py2); else ctx.lineTo(px2, py2);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  /* Los casquillos, ya fuera del arma. */
  ctx.save();
  for (const c of caza.casquillos) {
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.giro);
    ctx.globalAlpha = clamp01((2.6 - c.t) * 1.4);
    ctx.fillStyle = "#b4302c";
    ctx.fillRect(-U * 0.9, -U * 0.32, U * 1.8, U * 0.64);
    ctx.fillStyle = "#c8a44e";
    ctx.fillRect(-U * 0.9, -U * 0.32, U * 0.6, U * 0.64);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/**
 * UN BÚHO DE LOS QUE ATACAN.
 *
 * Silueta negra y dos ojos rojos, y nada más. No hacen falta plumas:
 * lo que se ve de un pájaro que viene de frente en una noche de lluvia
 * son los ojos y la forma de las alas, y eso es exactamente lo que da
 * miedo de ellos.
 */
function dibujarBuhoCaza(o) {
  const r = radioBuhoCaza(o);
  const muerto = o.muerte >= 0;
  /* Al reventar se hincha y se apaga en menos de medio segundo. */
  const k = muerto ? clamp01(o.muerte / 0.45) : 0;
  const esc = 1 + k * 0.7;
  const alfa = 1 - k;
  if (alfa < 0.02) return;

  ctx.save();
  ctx.translate(o.x, o.y);
  ctx.scale(esc, esc);
  ctx.globalAlpha = alfa;

  /* Un resplandor rojo flojo por detrás de todo. No es un adorno: es
     lo que SEPARA al bicho del bosque. Sin él, una silueta negra sobre
     unos árboles negros no se ve, y lo único que llegaba a la pantalla
     eran dos ojos flotando. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  haloOvalado(0, 0, r * 4.4, r * 3.4, [
    [0, `rgba(180,40,44,${0.12 * alfa})`],
    [1, "rgba(160,30,34,0)"],
  ]);
  ctx.restore();

  /* Las alas: dos arcos que suben y bajan. Se dibujan ANTES que el
     cuerpo para que salgan de detrás. Anchas: con dos arcos finos
     parecían bigotes. */
  const bat = Math.sin(o.ala) * 0.9;
  ctx.fillStyle = "rgba(8,7,12,0.94)";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.3);
    ctx.quadraticCurveTo(s * r * 1.3, -r * (0.8 + bat * 1.3),
                         s * r * 2.25, -r * (0.1 + bat * 0.75));
    ctx.quadraticCurveTo(s * r * 1.9, r * (0.45 - bat * 0.3),
                         s * r * 1.1, r * 0.66);
    ctx.quadraticCurveTo(s * r * 0.55, r * 0.82, 0, r * 0.6);
    ctx.closePath();
    ctx.fill();
    /* Las plumas de la punta: tres muescas. Es lo que convierte una
       mancha con forma de ala en un ala. */
    ctx.strokeStyle = "rgba(2,2,4,0.9)";
    ctx.lineWidth = Math.max(1, r * 0.1);
    for (let i = 1; i <= 3; i++) {
      const t = i / 4;
      ctx.beginPath();
      ctx.moveTo(s * r * mez(1.5, 2.2, t), r * mez(-0.5 - bat * 0.8, 0.1 - bat * 0.5, t));
      ctx.lineTo(s * r * mez(1.0, 1.5, t), r * mez(0.05, 0.5, t));
      ctx.stroke();
    }
  }

  /* El cuerpo. */
  ctx.fillStyle = "rgba(14,12,19,0.97)";
  ctx.beginPath();
  ctx.ellipse(0, 0, r, r * 1.08, 0, 0, 6.283);
  ctx.fill();
  /* Los cuernecitos. */
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * r * 0.3, -r * 0.8);
    ctx.lineTo(s * r * 0.74, -r * 1.5);
    ctx.lineTo(s * r * 0.78, -r * 0.6);
    ctx.closePath();
    ctx.fill();
  }

  /* Y el filo de luz de arriba: la lluvia y los relámpagos vienen del
     cielo, así que lo que se ve de un bicho negro de noche es el canto
     mojado de la cabeza. Es media línea y es lo que hace que tenga
     volumen en vez de ser un agujero. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = `rgba(150,178,222,${0.4 * alfa})`;
  ctx.lineWidth = Math.max(1, r * 0.13);
  ctx.beginPath();
  ctx.ellipse(0, 0, r * 0.97, r * 1.05, 0, -2.5, -0.64);
  ctx.stroke();
  ctx.restore();

  /* Y los ojos, que es lo único que tiene color. */
  ctx.globalCompositeOperation = "lighter";
  for (const s of [-1, 1]) {
    const ex = s * r * 0.42, ey = -r * 0.12;
    const er = r * 0.3;
    haloOvalado(ex, ey, er * 4, er * 4, [
      [0, `rgba(255,80,60,${0.5 * alfa})`],
      [0.4, `rgba(220,30,30,${0.16 * alfa})`],
      [1, "rgba(200,20,20,0)"],
    ]);
    ctx.fillStyle = `rgba(255,150,120,${0.95 * alfa})`;
    ctx.beginPath(); ctx.arc(ex, ey, er * 0.62, 0, 6.283); ctx.fill();
    ctx.fillStyle = `rgba(255,236,226,${0.9 * alfa})`;
    ctx.beginPath(); ctx.arc(ex - er * 0.2, ey - er * 0.2, er * 0.22, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---- LO QUE HAY EN EL CUARTO -------------------------------------------
   Cinco cosas más, y todas se pueden tocar. No están para decorar: cada
   una contesta algo, y una de ellas guarda un secreto.

   ── POR QUÉ SE DIBUJAN A LA IZQUIERDA ────────────────────────────────
   Porque la mesilla, el reloj y la lámpara están a la derecha, y la
   ventana en medio. La pared de la izquierda estaba vacía, y una pared
   vacía en una habitación pequeña se lee como que falta algo.        */

const cosas = {
  /* La repisa con sus tres cachivaches. */
  radio: { on: false, luz: 0, pulso: 0, banda: 0 },
  planta: { meneo: 0, regada: 0 },
  guitarra: { cuerda: -1, vibra: 0, veces: 0 },
  tapete: { pulso: 0 },
  interruptor: { pulso: 0 },
  /* El frasco de luciérnagas: el secreto de la habitación. Empieza
     vacío y sólo se llena si has estado en el bosque. */
  frasco: { luces: [], pulso: 0, abierto: 0 },
  /* Las estrellitas que brillan en la oscuridad, pegadas en la pared
     de arriba. Ver más abajo: son el secreto grande del cuarto. */
  cielo: { lista: [], trazo: 0, hecha: false, avisada: false },
};

function construirCosas() {
  cosas.frasco.luces = [];
  const n = historia.hecho("espesura") ? (flojo ? 4 : 7) : 0;
  for (let i = 0; i < n; i++) {
    cosas.frasco.luces.push({
      a: rnd() * 6.283, r: azar(0.15, 0.7),
      vel: azar(0.5, 1.6), f: rnd() * 6.283,
      ritmo: azar(0.6, 1.8),
    });
  }
  construirCielo();
}

/* ---- LAS ESTRELLITAS DE LA PARED ---------------------------------------

   Once estrellas de esas que brillan en la oscuridad, pegadas arriba.
   Fáciles de ver: están ahí desde el primer momento y se pueden tocar
   una por una. Lo que NO es fácil de ver es que no están puestas al
   azar.

   ── DÓNDE ESTÁ EL SECRETO ────────────────────────────────────────────
   Están colocadas sobre una curva de corazón, pero con un temblorcito
   encima que la deshace: mirándolas, son once estrellas desordenadas.
   Cuando se tocan LAS ONCE, se dibuja la línea que las une en orden y
   el corazón aparece. Ese es el premio.

   ── Y UN DETALLE QUE VALE POR TODO EL RESTO ──────────────────────────
   Brillan MENOS con la lámpara encendida y MÁS a oscuras, porque eso
   es lo que hacen las de verdad: cargan luz y la sueltan. Apagar la
   lámpara y ver cómo se encienden solas es de las cosas más bonitas
   que hace este cuarto, y no hay que tocar nada para que pase.       */

const CIELO_N = 11;
const diceEstrellasYa = barajador(CONF.cuarto.estrellasYa);

function construirCielo() {
  const c = cosas.cielo;
  c.lista = [];
  c.hecha = !!recuerdo.leer("constel", 0);
  c.trazo = c.hecha ? 1 : 0;
  for (let i = 0; i < CIELO_N; i++) {
    const t = (i / CIELO_N) * 6.283;
    /* La curva de corazón de toda la vida. */
    const hx = 16 * Math.pow(Math.sin(t), 3);
    const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t)
               - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    c.lista.push({
      /* En unidades de la curva, de -17 a 17. El temblor es lo que
         impide que se lea el corazón antes de tiempo. */
      hx: hx + azar(-2.1, 2.1),
      hy: hy + azar(-2.1, 2.1),
      tam: azar(0.72, 1.25),
      giro: azar(-0.5, 0.5),
      f: rnd() * 6.283,
      on: !!recuerdo.leer("est:" + i, 0) || c.hecha,
      brote: 0,
    });
  }
}

/** El sitio y el tamaño del corazón entero, según quepa. */
function sitioCielo() {
  const v = ventanaHab();
  const d = desplazar(0.9);
  if (apaisado) {
    /* En apaisado no hay pared encima de la ventana: se van al hueco
       grande de la derecha, que es el único sitio vacío que queda. */
    const cx = mez(v.x + v.w * 0.5, A, 0.56);
    return { cx: cx + d.x * 0.6, cy: H * 0.3 + d.y * 0.6,
             esc: Math.min(A * 0.085, H * 0.014) };
  }
  const techo = v.y - v.h / 2;
  return { cx: A * 0.5 + d.x * 0.6, cy: techo * 0.47 + d.y * 0.6,
           esc: Math.min(A * 0.0125, techo * 0.0245) };
}

/** Cuánto brillan ahora mismo: mucho a oscuras, poco con la luz. */
function cargaCielo() {
  return mez(1, 0.34, hab.lampara);
}

function moverCielo(dt) {
  const c = cosas.cielo;
  for (const e of c.lista) e.brote = Math.max(0, e.brote - dt * 1.5);
  if (c.hecha) c.trazo = Math.min(1, c.trazo + dt * 0.55);
}

function dibujarCielo() {
  const c = cosas.cielo;
  if (!c.lista.length) return;
  const S = sitioCielo();
  const carga = cargaCielo();

  /* La línea del corazón, si ya está. Se dibuja DEBAJO de las
     estrellas: la línea une, no tapa. */
  if (c.trazo > 0.001) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = `rgba(150,255,190,${0.3 * carga})`;
    ctx.lineWidth = Math.max(1, U * 0.34);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    const total = CIELO_N;
    const hasta = c.trazo * total;
    ctx.beginPath();
    for (let i = 0; i <= Math.floor(hasta); i++) {
      const a = c.lista[i % total], b = c.lista[(i + 1) % total];
      const ax = S.cx + a.hx * S.esc, ay = S.cy + a.hy * S.esc;
      const bx = S.cx + b.hx * S.esc, by = S.cy + b.hy * S.esc;
      /* El último tramo se va dibujando a medias, para que la línea
         recorra el corazón en vez de aparecer entera de golpe. */
      const k = Math.min(1, hasta - i);
      if (i === 0) ctx.moveTo(ax, ay);
      ctx.lineTo(mez(ax, bx, k), mez(ay, by, k));
    }
    ctx.stroke();
    ctx.restore();
  }

  for (const e of c.lista) {
    const x = S.cx + e.hx * S.esc, y = S.cy + e.hy * S.esc;
    const r = S.esc * 1.35 * e.tam;
    /* Late despacio y cada una por su lado: once estrellas latiendo a
       la vez es un parpadeo, y eso no lo hace ninguna pegatina. */
    const vivo = (e.on ? 1 : 0.42) * carga
               * (0.86 + 0.14 * Math.sin(reloj * 0.9 + e.f))
               + e.brote * 0.8;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    haloOvalado(x, y, r * 4.2, r * 4.2, [
      [0, `rgba(146,255,186,${0.1 * vivo})`],
      [0.5, `rgba(120,240,170,${0.035 * vivo})`],
      [1, "rgba(120,240,170,0)"],
    ]);
    ctx.translate(x, y);
    ctx.rotate(e.giro + Math.sin(reloj * 0.2 + e.f) * 0.04);
    ctx.fillStyle = `rgba(196,255,214,${0.34 + 0.5 * vivo})`;
    estrellaCinco(r * (1 + e.brote * 0.3));
    ctx.fill();
    ctx.restore();
  }

  /* Y la fugaz del deseo, si va cruzando. */
  dibujarDeseo();
}

/** Una estrella de cinco puntas, centrada en el origen. */
function estrellaCinco(r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * 6.283 - 1.5708;
    const rr = i % 2 ? r * 0.42 : r;
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

/** Tocar una estrellita. Devuelve true si se tocó alguna. */
function tocarCielo(p) {
  const c = cosas.cielo;
  if (!c.lista.length) return false;
  const S = sitioCielo();
  /* La MÁS CERCANA, no la primera que pille. Las once no están
     repartidas a distancias iguales —siguen una curva—, y por el
     escote del corazón se juntan tanto que sus zonas de toque se
     solapan. Cogiendo la primera, esas dos o tres nunca se podían
     encender, y el secreto se quedaba imposible sin que se notara
     por qué. */
  let i = -1, mejor = S.esc * 3.8;
  for (let j = 0; j < c.lista.length; j++) {
    const e = c.lista[j];
    const d = Math.hypot(p.x - (S.cx + e.hx * S.esc), p.y - (S.cy + e.hy * S.esc));
    if (d < mejor) { mejor = d; i = j; }
  }
  /* El hueco de en medio del corazón, una vez está hecho. Es el
     secreto más escondido del cuarto: hay que tocar donde NO hay nada,
     y además con la lámpara apagada. */
  if (i < 0 && c.hecha && secretos.deseo.t < 0
      && dentroDe(p.x, p.y, S.cx, S.cy + S.esc * 2, S.esc * 6)) {
    pedirDeseo(S);
    return true;
  }

  if (i >= 0) {
    const e = c.lista[i];
    const x = S.cx + e.hx * S.esc, y = S.cy + e.hy * S.esc;

    e.brote = 1;
    if (!e.on) {
      e.on = true;
      recuerdo.poner("est:" + i, 1);
      /* Una nota más aguda por cada una que falta menos: la escala
         sube sola conforme se van encendiendo. */
      const quedan = c.lista.filter((z) => !z.on).length;
      tono(440 * Math.pow(2, (CIELO_N - quedan - 1) / 12), 0.7, "sine", 0.05);
      soltarBrillos(x, y, 4, 0.36);
      if (quedan === 0) completarCielo(S);
      else if (!c.avisada && CIELO_N - quedan === 3) {
        c.avisada = true;
        decir(x, y + U * 6, CONF.cuarto.estrellasPista, { dur: 4.5 });
      }
    } else {
      tono(azar(900, 1400), 0.35, "sine", 0.03);
      if (c.hecha) decir(x, y + U * 6, diceEstrellasYa(), { dur: 3 });
    }
    return true;
  }
  return false;
}

function completarCielo(S) {
  const c = cosas.cielo;
  c.hecha = true;
  c.trazo = 0;
  recuerdo.poner("constel", 1);
  historia.marcar("constelacion");
  magia(587);
  for (let i = 0; i < c.lista.length; i++) {
    const e = c.lista[i];
    setTimeout(() => {
      soltarBrillos(S.cx + e.hx * S.esc, S.cy + e.hy * S.esc, 5, 0.36);
    }, i * 170);
  }
  setTimeout(() => {
    decir(S.cx, S.cy + S.esc * 20, CONF.cuarto.estrellasCorazon,
      { mimo: true, importante: true, dur: 7 });
  }, 2100);
  contarLogro("estrellas");
}

/** Dónde está cada cosa. Se calcula aquí para que dibujar y tocar no
    puedan discrepar nunca. */
function sitiosCosas() {
  const v = ventanaHab();
  const d = desplazar(0.9);
  const dx = d.x * 0.6, dy = d.y * 0.6;
  const sy = sueloHab();
  /* La repisa, lo más a la izquierda que se pueda sin salirse. El tope
     de U*14 no es capricho: con menos, en vertical el radio se quedaba
     medio fuera de la pantalla por el canto izquierdo. */
  const izq = Math.max(v.x - v.w * 0.92, U * 14);
  const ry = v.y + v.h * 0.2;
  /* La guitarra se apoya en el suelo, así que su sitio depende del
     suelo y no de la altura de la pantalla: si no, en apaisado se
     hundía media guitarra debajo de la cama.

     Y se encoge si no cabe: en apaisado, entre la repisa y el suelo
     hay poquísimo, y a tamaño fijo el mástil salía por encima de la
     repisa y atravesaba el radio. */
  const gr = clamp((sy - ry) * 0.42, U * 6, U * 11);
  const gy = sy - gr * 0.96;
  return {
    repisa:   { x: izq + dx, y: ry + dy, w: U * 18, h: U * 1.2 },
    radio:    { x: izq - U * 5.2 + dx, y: ry - U * 2.6 + dy, r: U * 4 },
    frasco:   { x: izq + U * 0.6 + dx, y: ry - U * 2.4 + dy, r: U * 2.6 },
    planta:   { x: izq + U * 5.6 + dx, y: ry - U * 2 + dy, r: U * 3.4 },
    guitarra: { x: izq - U * 1 + dx, y: gy + dy, r: gr },
    tapete:   { x: v.x + dx, y: mez(sy, H * (apaisado ? 0.74 : 0.70), 0.52) + dy, r: U * 15 },
    interruptor: { x: Math.min(v.x + v.w * 1.0, A - U * 4.5) + dx, y: v.y + v.h * 0.12 + dy, r: U * 2.6 },
  };
}

function moverCosas(dt) {
  cosas.radio.luz = damp(cosas.radio.luz, cosas.radio.on ? 1 : 0, 4, dt);
  cosas.radio.pulso = Math.max(0, cosas.radio.pulso - dt * 2);
  if (cosas.radio.on) cosas.radio.banda += dt * 1.6;
  cosas.planta.meneo = damp(cosas.planta.meneo, 0, 3.2, dt);
  cosas.planta.regada = Math.max(0, cosas.planta.regada - dt * 0.25);
  cosas.guitarra.vibra = Math.max(0, cosas.guitarra.vibra - dt * 2.6);
  cosas.tapete.pulso = Math.max(0, cosas.tapete.pulso - dt * 1.6);
  cosas.interruptor.pulso = Math.max(0, cosas.interruptor.pulso - dt * 3);
  cosas.frasco.pulso = Math.max(0, cosas.frasco.pulso - dt * 1.2);
  cosas.frasco.abierto = Math.max(0, cosas.frasco.abierto - dt * 0.4);
  moverCielo(dt);
}

function dibujarCosas() {
  const S = sitiosCosas();

  /* ---- La repisa ---- */
  ctx.fillStyle = "rgba(56,44,36,0.95)";
  ctx.fillRect(S.repisa.x - S.repisa.w / 2, S.repisa.y, S.repisa.w, S.repisa.h);
  ctx.fillStyle = "rgba(26,20,16,0.8)";
  ctx.fillRect(S.repisa.x - S.repisa.w / 2, S.repisa.y + S.repisa.h, S.repisa.w, U * 0.5);
  /* Las escuadras de debajo. */
  ctx.strokeStyle = "rgba(40,32,26,0.9)";
  ctx.lineWidth = Math.max(1, U * 0.3);
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(S.repisa.x + s * S.repisa.w * 0.38, S.repisa.y + S.repisa.h);
    ctx.lineTo(S.repisa.x + s * S.repisa.w * 0.26, S.repisa.y + S.repisa.h + U * 2.4);
    ctx.stroke();
  }

  dibujarRadio(S.radio);
  dibujarFrasco(S.frasco);
  dibujarPlanta(S.planta);
  dibujarGuitarra(S.guitarra);
  dibujarInterruptor(S.interruptor);
}

/** El tapete. Va debajo de todo, así que se pinta aparte y antes. */
function dibujarTapete() {
  const S = sitiosCosas();
  const t = S.tapete;
  const k = t.y < H * 0.95 ? 1 : 0;
  if (!k) return;
  /* La sombra de contacto. Sin ella el tapete se ve pegado con cinta:
     es lo que dice que hay un objeto con grosor apoyado en el piso. */
  haloOvalado(t.x, t.y + U * 0.6, t.r * 1.12, t.r * 0.4, [
    [0.55, "rgba(0,0,0,0.34)"],
    [1, "rgba(0,0,0,0)"],
  ]);

  const late = 1 + cosas.tapete.pulso * 0.035;
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.scale(1, 0.3);

  /* Anillos de trapo trenzado. Uno de trapo de verdad no tiene tres
     franjas de tres colores: tiene muchas vueltas, cada una un poco
     distinta, porque se hizo con lo que había. */
  const N = flojo ? 6 : 10;
  for (let i = N; i >= 1; i--) {
    const u = i / N;
    /* Dos moradas y una rosa vieja alternándose, cada vuelta un pelín
       más clara hacia el centro. */
    const c = i % 3 === 0 ? "#5c4466" : (i % 3 === 1 ? "#3d2c4a" : "#4a3350");
    ctx.fillStyle = mezColor(c, "#6b5070", (1 - u) * 0.35);
    ctx.globalAlpha = 0.93;
    ctx.beginPath();
    /* Las vueltas no son círculos perfectos: cada una se sale un poco
       por un lado distinto. */
    ctx.arc(Math.cos(i * 2.2) * t.r * 0.012, Math.sin(i * 1.7) * t.r * 0.012,
      t.r * u * late, 0, 6.283);
    ctx.fill();
  }

  /* El trenzado: rayitas cortas cruzando las vueltas, que es lo que
     convierte unos anillos de color en tela. */
  if (!flojo) {
    ctx.globalAlpha = 0.16;
    ctx.strokeStyle = "#1b1424";
    ctx.lineWidth = Math.max(1, U * 0.34);
    for (let i = 0; i < 64; i++) {
      const a = (i / 64) * 6.283;
      const r0 = t.r * (0.16 + (i % 5) * 0.16), r1 = r0 + t.r * 0.12;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
      ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.stroke();
    }
  }

  /* El fleco del borde. */
  ctx.globalAlpha = 0.42;
  ctx.strokeStyle = "rgba(214,196,224,0.42)";
  ctx.lineWidth = Math.max(1, U * 0.3);
  ctx.setLineDash([U * 1.1, U * 1.3]);
  ctx.beginPath();
  ctx.arc(0, 0, t.r * 0.965, 0, 6.283);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
  ctx.restore();

  /* Y la luna encima: el tapete está justo debajo de la ventana, así
     que le da el rayo. Si no se le ve la luz, parece un agujero. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.beginPath();
  ctx.ellipse(t.x, t.y, t.r * late, t.r * 0.3 * late, 0, 0, 6.283);
  ctx.clip();
  haloOvalado(t.x + U * 1.4, t.y - U * 1.2, t.r * 0.8, t.r * 0.3, [
    [0, "rgba(176,200,255,0.16)"],
    [1, "rgba(176,200,255,0)"],
  ]);
  ctx.restore();
}

/** Un radio viejo, con su dial y su ojo mágico. */
function dibujarRadio(S) {
  const r = S.r, luz = cosas.radio.luz;
  ctx.save();
  ctx.translate(S.x, S.y);

  if (luz > 0.02) {
    ctx.globalCompositeOperation = "lighter";
    haloOvalado(0, 0, r * 4, r * 3.4, [
      [0, `rgba(255,190,110,${0.14 * luz})`],
      [1, "rgba(255,170,90,0)"],
    ]);
    ctx.globalCompositeOperation = "source-over";
  }

  /* La caja de madera. */
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, "rgb(84,58,38)");
  g.addColorStop(1, "rgb(46,31,20)");
  ctx.fillStyle = g;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r, -r * 0.9, r * 2, r * 1.8, r * 0.18);
  else ctx.rect(-r, -r * 0.9, r * 2, r * 1.8);
  ctx.fill();

  /* La rejilla del altavoz: líneas, no un rectángulo. */
  ctx.strokeStyle = "rgba(20,14,10,0.55)";
  ctx.lineWidth = Math.max(0.8, r * 0.07);
  for (let i = 0; i < 5; i++) {
    const y = -r * 0.55 + i * r * 0.24;
    ctx.beginPath();
    ctx.moveTo(-r * 0.82, y);
    ctx.lineTo(-r * 0.12, y);
    ctx.stroke();
  }

  /* El dial, con la aguja moviéndose si está prendido. */
  ctx.fillStyle = `rgba(${Math.round(mez(40, 240, luz))},${Math.round(mez(34, 210, luz))},${Math.round(mez(26, 150, luz))},0.9)`;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(r * 0.05, -r * 0.6, r * 0.82, r * 0.7, r * 0.06);
  else ctx.rect(r * 0.05, -r * 0.6, r * 0.82, r * 0.7);
  ctx.fill();
  if (luz > 0.1) {
    ctx.strokeStyle = `rgba(140,30,20,${luz})`;
    ctx.lineWidth = Math.max(1, r * 0.06);
    const ax = r * 0.46 + Math.sin(cosas.radio.banda) * r * 0.32;
    ctx.beginPath();
    ctx.moveTo(ax, -r * 0.58);
    ctx.lineTo(ax, -r * 0.02);
    ctx.stroke();
  }

  /* Las dos perillas. */
  ctx.fillStyle = "rgb(30,22,16)";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(s * r * 0.45, r * 0.52, r * 0.18, 0, 6.283);
    ctx.fill();
  }

  /* Y las notas que salen cuando toca. */
  if (luz > 0.5 && Math.random() < 0.02) {
    soltar(S.x + azar(-r * 0.5, r * 0.5), S.y - r, {
      vx: azar(-6, 6), vy: azar(-22, -10),
      vida: azar(1.6, 3), tam: azar(1, 2),
      tipo: TIPO.BRILLO, tono: 0.8,
    });
  }
  ctx.restore();
}

/** El frasco de luciérnagas. Sólo tiene algo dentro si has ido al bosque. */
function dibujarFrasco(S) {
  const r = S.r;
  const hay = cosas.frasco.luces.length > 0;
  ctx.save();
  ctx.translate(S.x, S.y);

  if (hay) {
    ctx.globalCompositeOperation = "lighter";
    haloOvalado(0, 0, r * 4.5, r * 4.5, [
      [0, `rgba(120,255,170,${0.13 + cosas.frasco.pulso * 0.2})`],
      [1, "rgba(60,220,140,0)"],
    ]);
    ctx.globalCompositeOperation = "source-over";
  }

  /* El vidrio: dos trazos y un brillo. */
  ctx.fillStyle = "rgba(150,190,200,0.1)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r * 0.62, -r * 0.8, r * 1.24, r * 1.7, r * 0.26);
  else ctx.rect(-r * 0.62, -r * 0.8, r * 1.24, r * 1.7);
  ctx.fill();
  ctx.strokeStyle = "rgba(180,220,235,0.3)";
  ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.stroke();
  /* La tapa, con sus agujeritos. */
  ctx.fillStyle = "rgb(120,104,72)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r * 0.7, -r * 1.05, r * 1.4, r * 0.32, r * 0.08);
  else ctx.rect(-r * 0.7, -r * 1.05, r * 1.4, r * 0.32);
  ctx.fill();
  ctx.fillStyle = "rgba(30,24,16,0.8)";
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.arc(-r * 0.42 + i * r * 0.28, -r * 0.89, r * 0.05, 0, 6.283);
    ctx.fill();
  }
  /* Un brillo en el vidrio. */
  ctx.strokeStyle = "rgba(230,245,255,0.25)";
  ctx.lineWidth = Math.max(1, r * 0.09);
  ctx.beginPath();
  ctx.moveTo(-r * 0.4, -r * 0.5);
  ctx.lineTo(-r * 0.4, r * 0.4);
  ctx.stroke();

  /* Y las luciérnagas de dentro, dando vueltas. */
  ctx.globalCompositeOperation = "lighter";
  for (const l of cosas.frasco.luces) {
    const a = l.a + reloj * l.vel * (0.3 + cosas.frasco.abierto);
    const lx = Math.cos(a) * r * 0.42 * l.r;
    const ly = Math.sin(a * 1.3 + l.f) * r * 0.62 * l.r;
    const k = Math.pow(clamp01(0.5 + 0.5 * Math.sin(reloj * l.ritmo + l.f)), 2);
    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, r * 0.5);
    g.addColorStop(0, `rgba(210,255,170,${0.7 * k})`);
    g.addColorStop(1, "rgba(60,220,130,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(lx, ly, r * 0.5, 0, 6.283); ctx.fill();
    ctx.fillStyle = `rgba(232,255,206,${0.9 * k})`;
    ctx.beginPath(); ctx.arc(lx, ly, r * 0.08, 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.restore();
}

/** Una plantita en su maceta. Se menea si la tocas. */
function dibujarPlanta(S) {
  const r = S.r;
  const m = cosas.planta.meneo;
  const viva = cosas.planta.regada;
  ctx.save();
  ctx.translate(S.x, S.y + r * 0.6);

  /* Las hojas: cinco, saliendo del centro, cada una con su curva. */
  ctx.strokeStyle = `rgb(${Math.round(mez(52, 70, viva))},${Math.round(mez(104, 168, viva))},${Math.round(mez(62, 88, viva))})`;
  ctx.lineCap = "round";
  for (let i = 0; i < 5; i++) {
    const base = -1.57 + (i - 2) * 0.42;
    const a = base + Math.sin(reloj * 1.4 + i) * 0.04 + m * 0.3 * (i % 2 ? 1 : -1);
    const largo = r * (0.9 + (i % 2) * 0.3);
    ctx.lineWidth = Math.max(1.4, r * 0.16);
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.3);
    ctx.quadraticCurveTo(Math.cos(a) * largo * 0.5, -r * 0.3 + Math.sin(a) * largo * 0.7,
                         Math.cos(a) * largo, -r * 0.3 + Math.sin(a) * largo);
    ctx.stroke();
  }
  /* La maceta: un trapecio con su reborde. */
  const g = ctx.createLinearGradient(-r * 0.6, 0, r * 0.6, 0);
  g.addColorStop(0, "rgb(120,74,56)");
  g.addColorStop(0.5, "rgb(156,98,72)");
  g.addColorStop(1, "rgb(96,58,42)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-r * 0.56, -r * 0.28);
  ctx.lineTo(r * 0.56, -r * 0.28);
  ctx.lineTo(r * 0.42, r * 0.56);
  ctx.lineTo(-r * 0.42, r * 0.56);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "rgb(168,108,80)";
  ctx.fillRect(-r * 0.62, -r * 0.38, r * 1.24, r * 0.16);
  ctx.restore();
}

/** Una guitarra recargada en la pared. Tiene seis cuerdas y suenan. */
function dibujarGuitarra(S) {
  const r = S.r;

  /* La sombra en el suelo, donde se apoya. Va fuera del giro: una
     sombra proyectada en el piso no se ladea con el objeto. */
  haloOvalado(S.x + U * 0.8, S.y + r * 0.96, r * 0.62, r * 0.2, [
    [0.4, "rgba(0,0,0,0.42)"],
    [1, "rgba(0,0,0,0)"],
  ]);

  ctx.save();
  ctx.translate(S.x, S.y);
  ctx.rotate(-0.16);

  /* Y la de la pared, que es la que le da grosor. */
  ctx.fillStyle = "rgba(2,3,8,0.4)";
  ctx.beginPath();
  ctx.ellipse(U * 1.4, r * 0.5, r * 0.52, r * 0.44, 0.2, 0, 6.283);
  ctx.fill();

  /* El mástil. */
  ctx.fillStyle = "rgb(54,36,24)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r * 0.08, -r * 1.05, r * 0.16, r * 1.1, r * 0.03);
  else ctx.rect(-r * 0.08, -r * 1.05, r * 0.16, r * 1.1);
  ctx.fill();
  /* La pala, con sus clavijas. */
  ctx.fillStyle = "rgb(44,29,19)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r * 0.13, -r * 1.24, r * 0.26, r * 0.24, r * 0.04);
  else ctx.rect(-r * 0.13, -r * 1.24, r * 0.26, r * 0.24);
  ctx.fill();
  ctx.fillStyle = "rgb(170,150,110)";
  for (let i = 0; i < 3; i++) for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(s * r * 0.17, -r * 1.2 + i * r * 0.08, r * 0.025, 0, 6.283);
    ctx.fill();
  }

  /* El cuerpo: dos círculos que se solapan, que es la forma de siempre. */
  const gc = ctx.createLinearGradient(-r * 0.5, 0, r * 0.5, r * 0.5);
  gc.addColorStop(0, "rgb(150,94,44)");
  gc.addColorStop(0.55, "rgb(112,66,30)");
  gc.addColorStop(1, "rgb(70,40,18)");
  ctx.fillStyle = gc;
  ctx.beginPath();
  ctx.ellipse(0, r * 0.14, r * 0.34, r * 0.3, 0, 0, 6.283);
  ctx.ellipse(0, r * 0.55, r * 0.45, r * 0.4, 0, 0, 6.283);
  ctx.fill();
  /* La boca. */
  ctx.fillStyle = "rgb(16,10,6)";
  ctx.beginPath();
  ctx.ellipse(0, r * 0.38, r * 0.16, r * 0.15, 0, 0, 6.283);
  ctx.fill();
  ctx.strokeStyle = "rgba(210,170,110,0.4)";
  ctx.lineWidth = Math.max(1, r * 0.02);
  ctx.beginPath();
  ctx.ellipse(0, r * 0.38, r * 0.2, r * 0.19, 0, 0, 6.283);
  ctx.stroke();

  /* Las seis cuerdas. La que se ha tocado vibra. */
  for (let i = 0; i < 6; i++) {
    const x = (i - 2.5) * r * 0.05;
    const vib = (cosas.guitarra.cuerda === i)
      ? Math.sin(reloj * 70 + i) * cosas.guitarra.vibra * r * 0.02 : 0;
    ctx.strokeStyle = `rgba(226,220,196,${0.35 + (cosas.guitarra.cuerda === i ? cosas.guitarra.vibra * 0.5 : 0)})`;
    ctx.lineWidth = Math.max(0.6, r * (0.008 + i * 0.002));
    ctx.beginPath();
    ctx.moveTo(x, -r * 1.16);
    ctx.quadraticCurveTo(x + vib, r * 0.1, x, r * 0.72);
    ctx.stroke();
  }
  /* El puente. */
  ctx.fillStyle = "rgb(38,24,14)";
  ctx.fillRect(-r * 0.2, r * 0.68, r * 0.4, r * 0.07);
  ctx.restore();
}

/** El apagador de la pared. Sube y baja. */
function dibujarInterruptor(S) {
  const r = S.r;
  const arriba = hab.lampara;
  ctx.save();
  ctx.translate(S.x, S.y);

  /* La sombra de la placa contra la pared. Sin ella el interruptor es
     un rectángulo claro pegado a la pared, no una pieza con canto. */
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r * 0.48, -r * 0.68, r, r * 1.5, r * 0.16);
  else ctx.rect(-r * 0.48, -r * 0.68, r, r * 1.5);
  ctx.fill();

  /* La placa, con su degradado de arriba abajo: la luz de la ventana
     le da por arriba. */
  const g = ctx.createLinearGradient(0, -r * 0.75, 0, r * 0.75);
  g.addColorStop(0, "rgba(212,206,198,0.4)");
  g.addColorStop(1, "rgba(150,144,140,0.26)");
  ctx.fillStyle = g;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r * 0.56, -r * 0.78, r * 1.12, r * 1.56, r * 0.16);
  else ctx.rect(-r * 0.56, -r * 0.78, r * 1.12, r * 1.56);
  ctx.fill();
  ctx.strokeStyle = "rgba(244,242,238,0.24)";
  ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.stroke();

  /* Los dos tornillos. */
  ctx.fillStyle = "rgba(60,56,52,0.5)";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.arc(0, s * r * 0.62, r * 0.07, 0, 6.283);
    ctx.fill();
  }

  /* El hueco donde va la palanca. */
  ctx.fillStyle = "rgba(24,20,24,0.45)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r * 0.27, -r * 0.44, r * 0.54, r * 0.92, r * 0.07);
  else ctx.rect(-r * 0.27, -r * 0.44, r * 0.54, r * 0.92);
  ctx.fill();

  /* La palanca: arriba si la lámpara está prendida. */
  const py = mez(r * 0.0, -r * 0.44, arriba);
  ctx.fillStyle = `rgba(250,248,244,${0.42 + cosas.interruptor.pulso * 0.4})`;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r * 0.22, py, r * 0.44, r * 0.46, r * 0.07);
  else ctx.rect(-r * 0.22, py, r * 0.44, r * 0.46);
  ctx.fill();
  /* El filo de arriba de la palanca, que es lo que le da el relieve. */
  ctx.fillStyle = "rgba(255,254,250,0.3)";
  ctx.fillRect(-r * 0.22, py, r * 0.44, Math.max(1, r * 0.07));
  ctx.restore();
}

/* ---- Tocar las cosas del cuarto ---------------------------------------- */

function tocarCosas(p) {
  const S = sitiosCosas();

  if (dentroDe(p.x, p.y, S.radio.x, S.radio.y, S.radio.r * 1.5)) {
    cosas.radio.on = !cosas.radio.on;
    cosas.radio.pulso = 1;
    golpe(0.03, 1400, 0.12, "bandpass");
    if (cosas.radio.on) sonarRadio();
    decir(S.radio.x, S.radio.y - U * 7,
      cosas.radio.on ? CONF.cuarto.radioOn : CONF.cuarto.radioOff,
      { dur: 3 });
    contarLogro("radio");
    return true;
  }

  if (dentroDe(p.x, p.y, S.frasco.x, S.frasco.y, S.frasco.r * 1.6)) {
    cosas.frasco.pulso = 1;
    cosas.frasco.abierto = 1;
    const hay = cosas.frasco.luces.length > 0;
    tono(hay ? azar(900, 1300) : azar(400, 500), 0.4, "sine", 0.04);
    if (hay) {
      soltarBrillos(S.frasco.x, S.frasco.y, 8, 0.45);
      recuerdo.sumar("frasco");
      decir(S.frasco.x, S.frasco.y - U * 8, CONF.cuarto.frascoLleno,
        { misterio: true, importante: true, dur: 5 });
      contarLogro("frasco");
    } else {
      decir(S.frasco.x, S.frasco.y - U * 8, CONF.cuarto.frascoVacio, { dur: 3.4 });
    }
    return true;
  }

  if (dentroDe(p.x, p.y, S.planta.x, S.planta.y, S.planta.r * 1.5)) {
    cosas.planta.meneo = 1;
    cosas.planta.regada = Math.min(1, cosas.planta.regada + 0.4);
    golpe(0.06, 3000, 0.05, "highpass");
    const veces = recuerdo.sumar("planta");
    decir(S.planta.x, S.planta.y - U * 8,
      CONF.cuarto.planta[Math.min(veces - 1, CONF.cuarto.planta.length - 1)],
      { dur: 3.2 });
    if (veces >= 5) contarLogro("planta");
    return true;
  }

  if (dentroDe(p.x, p.y, S.guitarra.x, S.guitarra.y, S.guitarra.r * 0.9)) {
    /* Qué cuerda, según dónde se toque: de izquierda a derecha.
       El reparto se hace sobre TODO el ancho de la guitarra y no sobre
       el de las cuerdas de verdad. Seis cuerdas reales ocupan diecisiete
       píxeles en un teléfono: con un dedo encima no se puede elegir
       ninguna. Así cada una se lleva su franja y se pueden recorrer. */
    const ancho = S.guitarra.r * 1.5;
    const i = clamp(Math.floor((p.x - (S.guitarra.x - ancho / 2)) / ancho * 6), 0, 5);
    cosas.guitarra.cuerda = i;
    cosas.guitarra.vibra = 1;
    cosas.guitarra.veces++;
    /* Mi menor al aire, que es el acorde que sale solo en cualquier
       guitarra que alguien deja recargada en una pared. */
    const notas = [82.4, 123.5, 164.8, 196.0, 246.9, 329.6];
    pulsarCuerda(notas[i]);
    if (cosas.guitarra.veces === 6) {
      contarLogro("guitarra");
      setTimeout(() => decir(S.guitarra.x, S.guitarra.y - U * 12,
        CONF.cuarto.guitarra, { mimo: true, importante: true, dur: 4.5 }), 600);
    }
    return true;
  }

  if (dentroDe(p.x, p.y, S.interruptor.x, S.interruptor.y, S.interruptor.r * 1.6)) {
    hab.lamparaOn = !hab.lamparaOn;
    cosas.interruptor.pulso = 1;
    golpe(0.02, 2600, 0.16, "bandpass");
    return true;
  }

  if (dentroDe(p.x, p.y, S.tapete.x, S.tapete.y, S.tapete.r * 0.9)) {
    cosas.tapete.pulso = 1;
    golpe(0.1, 300, 0.07, "lowpass");
    const veces = recuerdo.sumar("tapete");
    /* El tapete guarda algo debajo. A la tercera. */
    if (veces === 3 && !historia.hecho("bajoTapete")) {
      historia.marcar("bajoTapete");
      magia(523);
      soltarBrillos(S.tapete.x, S.tapete.y, 14, 0.8);
      decir(S.tapete.x, S.tapete.y - U * 10, CONF.cuarto.tapeteSecreto,
        { mimo: true, importante: true, dur: 6 });
      contarLogro("tapete");
    } else {
      decir(S.tapete.x, S.tapete.y - U * 8, CONF.cuarto.tapete, { dur: 2.8 });
    }
    return true;
  }
  return false;
}

/* ---- LOS SECRETOS CHIQUITOS DEL CUARTO ---------------------------------

   Cinco cosas más. Tres están a la vista —los libros, la taza, la
   vela— y dos hay que dar con ellas: un nudo en una tabla del suelo y
   el hueco que queda en medio del corazón de estrellas.

   ── LA REGLA QUE SIGUEN TODAS ────────────────────────────────────────
   Ninguna hace falta para nada. No abren puertas, no desbloquean
   escenas y en ningún momento se avisa de que existen. Quien las
   encuentre las encontró porque le dio por tocar, y eso es justo lo
   que hace que valga la pena encontrarlas.                          */

const secretos = {
  libros: { pulso: 0, leidos: 0, flor: false },
  taza: { pulso: 0 },
  vela: { veces: 0, apagada: 0, pulso: 0 },
  nudo: { veces: 0, pulso: 0, hallado: false },
  /* La estrella fugaz de la pared: t < 0 es que no hay ninguna. */
  deseo: { t: -1, y0: 0, y1: 0 },
  /* El cajón de la mesilla, y lo que guarda. */
  cajon: { abierto: 0, abiertoObj: 0, hallada: false, leida: false, pulso: 0 },
  /* Las cortinas, que se corren a mano. Cada una por su lado. */
  cortina: { izq: 0, der: 0, izqObj: 0, derObj: 0, hallado: false, veces: 0 },
  /* La manta de la cama: subida hasta la barbilla o no. */
  manta: { sube: 0, subeObj: 0, veces: 0 },
};

const diceTaza = barajador(CONF.cuarto.taza);
const diceDeseo = barajador(CONF.cuarto.deseo);
const diceBotella = barajador(CONF.cuarto.botella);

function arrancarSecretos() {
  secretos.libros.leidos = recuerdo.leer("libros", 0);
  secretos.libros.flor = secretos.libros.leidos >= CONF.cuarto.libros.length;
  secretos.nudo.hallado = !!recuerdo.leer("nudo", 0);
  secretos.vela.veces = 0;
  secretos.vela.apagada = 0;
  secretos.deseo.t = -1;
  /* El cajón se cierra al volver, pero lo que se encontró dentro no se
     desencuentra. */
  secretos.cajon.abierto = 0;
  secretos.cajon.abiertoObj = 0;
  secretos.cajon.hallada = !!recuerdo.leer("botella", 0);
  secretos.cajon.leida = !!recuerdo.leer("botellaLeida", 0);
  secretos.cortina.izq = secretos.cortina.izqObj = 0;
  secretos.cortina.der = secretos.cortina.derObj = 0;
  secretos.cortina.hallado = !!recuerdo.leer("rayas", 0);
  secretos.cortina.veces = 0;
  secretos.manta.sube = secretos.manta.subeObj = 0;
  secretos.manta.veces = 0;
}

/** La mesilla y lo que tiene encima. Un solo sitio para dibujar y para
    tocar: antes el mueble se pintaba en un sitio y se tocaba en otro,
    medio ancho de ventana más a la derecha. */
function sitioMesilla() {
  const v = ventanaHab();
  const d = desplazar(0.9);
  const vx = v.x + d.x * 0.6;
  const lx = Math.min(vx + v.w * 0.85, A - U * 9);
  const ly = H * 0.62 + d.y * 0.6;
  /* Las tres cosas viven encima de una mesilla de quince U de ancho y
     se estorban entre ellas, así que las zonas de toque van a mano y
     no salen de un radio: la pantalla de la lámpara se lleva la parte
     de arriba, los libros la de abajo a la izquierda y la taza la
     derecha. Se comprueban en ese orden, de más chica a más grande. */
  return {
    lx, ly,
    lampara: { x: lx, y: ly - U * 2.2, ax: U * 4.4, ay: U * 2.8 },
    libros:  { x: lx - U * 5, y: ly + U * 1.2, ax: U * 3.2, ay: U * 1.6 },
    taza:    { x: lx + U * 4.6, y: ly + U * 0.7, r: U * 2.6 },
    /* El cajón: el frente, con el tirador en medio. Se mide desde la
       misma cuenta con la que se dibuja el mueble. */
    cajon:   { x: lx, y: ly + U * 7.7 + secretos.cajon.abierto * U * 3.2,
               ax: U * 6.5, ay: U * 2.8 },
    /* Y lo que hay dentro, cuando está abierto. La Y sale de la misma
       cuenta con la que la dibuja el cajón: `y0 + alto * 0.45`, con
       `y0 = ly + 5U` y `alto = 14U * 0.38`. */
    botella: { x: lx - U * 2, y: ly + U * 7.4, r: U * 2.6 },
  };
}

/** El nudo de la tabla. En el suelo, a la izquierda, lejos del tapete. */
function sitioNudo() {
  const v = ventanaHab();
  const d = desplazar(0.9);
  const sy = sueloHab();
  const camaY = H * (apaisado ? 0.74 : 0.70);
  return {
    x: mez(U * 6, v.x - v.w * 0.5, 0.42) + d.x * 0.6,
    y: mez(sy, camaY, 0.46) + d.y * 0.6,
    r: U * 2.6,
  };
}

function moverSecretos(dt) {
  secretos.libros.pulso = Math.max(0, secretos.libros.pulso - dt * 2);
  secretos.taza.pulso = Math.max(0, secretos.taza.pulso - dt * 2);
  secretos.nudo.pulso = Math.max(0, secretos.nudo.pulso - dt * 1.6);
  secretos.vela.pulso = Math.max(0, secretos.vela.pulso - dt * 2);
  secretos.vela.apagada = damp(secretos.vela.apagada,
    secretos.vela.veces >= 3 ? 1 : 0, 3.5, dt);
  secretos.cajon.pulso = Math.max(0, secretos.cajon.pulso - dt * 2);
  /* El cajón va despacio a propósito: un cajón que se abre de golpe es
     una animación, y uno que se abre con su peso es un cajón. */
  secretos.cajon.abierto = damp(secretos.cajon.abierto, secretos.cajon.abiertoObj, 6, dt);
  secretos.cortina.izq = damp(secretos.cortina.izq, secretos.cortina.izqObj, 7, dt);
  secretos.cortina.der = damp(secretos.cortina.der, secretos.cortina.derObj, 7, dt);
  secretos.manta.sube = damp(secretos.manta.sube, secretos.manta.subeObj, 4.5, dt);
  if (secretos.deseo.t >= 0) {
    secretos.deseo.t += dt;
    if (secretos.deseo.t > 2.4) secretos.deseo.t = -1;
  }
}

/** El nudo, y lo que hay grabado debajo. */
function dibujarNudo() {
  const n = sitioNudo();
  const r = n.r;
  ctx.save();
  ctx.translate(n.x, n.y);
  ctx.scale(1, 0.46);

  /* Tres óvalos concéntricos, que es exactamente como se ve un nudo en
     una tabla: la veta dando vueltas alrededor de donde había una rama. */
  for (let i = 3; i >= 1; i--) {
    /* Un pelín más CLARO que la tabla, no más oscuro: un nudo es
       madera apretada, y la madera apretada refleja. Oscuro parecía
       una mancha de algo. */
    ctx.strokeStyle = `rgba(112,92,104,${0.1 + i * 0.035})`;
    ctx.lineWidth = Math.max(1, U * 0.26);
    ctx.beginPath();
    ctx.arc(0, 0, r * (i / 3) * 0.82, 0, 6.283);
    ctx.stroke();
  }
  ctx.fillStyle = "rgba(14,10,18,0.55)";
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.22, 0, 6.283);
  ctx.fill();
  ctx.restore();

  /* Y lo grabado, si ya se encontró. Queda para siempre. */
  if (secretos.nudo.hallado || secretos.nudo.pulso > 0.02) {
    const vivo = secretos.nudo.hallado ? 1 : secretos.nudo.pulso;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.translate(n.x, n.y + r * 0.1);
    /* Un corazoncito rayado, con las dos letras dentro. */
    const k = r * 1.85;
    ctx.strokeStyle = `rgba(226,176,196,${0.3 * vivo
      * (0.8 + 0.2 * Math.sin(reloj * 1.6))})`;
    ctx.lineWidth = Math.max(1, U * 0.24);
    ctx.beginPath();
    ctx.moveTo(0, k * 0.5);
    ctx.bezierCurveTo(-k, -k * 0.2, -k * 0.5, -k * 0.8, 0, -k * 0.28);
    ctx.bezierCurveTo(k * 0.5, -k * 0.8, k, -k * 0.2, 0, k * 0.5);
    ctx.stroke();
    ctx.fillStyle = `rgba(240,206,220,${0.34 * vivo})`;
    ctx.font = `${Math.max(7, Math.round(U * 1.5))}px ui-sans-serif, system-ui, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("y + m", 0, -k * 0.06);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.restore();
  }
}

/** La estrella fugaz que cruza la pared cuando se pide un deseo. */
function dibujarDeseo() {
  const d = secretos.deseo;
  if (d.t < 0) return;
  const k = clamp01(d.t / 2.4);
  /* Entra por arriba a la izquierda y sale abajo a la derecha, en
     diagonal. Se apaga antes de llegar al final: una fugaz no termina
     el recorrido, se acaba a media caída. */
  const x = mez(-A * 0.1, A * 1.1, suave3(k));
  const y = mez(d.y0, d.y1, suave3(k));
  const vivo = Math.sin(Math.PI * clamp01(k * 1.25));
  const largo = A * 0.16;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createLinearGradient(x - largo, y - largo * 0.34, x, y);
  g.addColorStop(0, "rgba(180,210,255,0)");
  g.addColorStop(1, `rgba(214,232,255,${0.5 * vivo})`);
  ctx.strokeStyle = g;
  ctx.lineWidth = Math.max(1, U * 0.5);
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x - largo, y - largo * 0.34);
  ctx.lineTo(x, y);
  ctx.stroke();
  haloOvalado(x, y, U * 4, U * 4, [
    [0, `rgba(226,240,255,${0.5 * vivo})`],
    [1, "rgba(226,240,255,0)"],
  ]);
  ctx.restore();
}

/** Tocar los libros, la taza, la vela o el nudo. */
function tocarSecretos(p) {
  const M = sitioMesilla();

  /* Los libros. Uno cada vez, en orden. */
  if (Math.abs(p.x - M.libros.x) < M.libros.ax
      && Math.abs(p.y - M.libros.y) < M.libros.ay) {
    secretos.libros.pulso = 1;
    golpe(0.05, 700, 0.08, "lowpass");
    const L = CONF.cuarto.libros;
    const i = Math.min(secretos.libros.leidos, L.length - 1);
    decir(M.libros.x, M.libros.y - U * 7, L[i], { dur: 4 });
    if (secretos.libros.leidos < L.length) {
      secretos.libros.leidos++;
      recuerdo.poner("libros", secretos.libros.leidos);
      if (secretos.libros.leidos === L.length) {
        secretos.libros.flor = true;
        magia(494);
        soltarBrillos(M.libros.x, M.libros.y, 10, 0.12);
        setTimeout(() => decir(M.libros.x, M.libros.y - U * 11,
          CONF.cuarto.librosFlor, { mimo: true, importante: true, dur: 6 }), 1400);
        contarLogro("libros");
      }
    }
    return true;
  }

  /* La taza. */
  if (dentroDe(p.x, p.y, M.taza.x, M.taza.y, M.taza.r * 1.6)) {
    secretos.taza.pulso = 1;
    tono(azar(1100, 1500), 0.3, "sine", 0.03);
    decir(M.taza.x, M.taza.y - U * 6, diceTaza(), { dur: 3.2 });
    contarLogro("taza");
    return true;
  }

  /* El cajón: el tirador y el frente. */
  if (Math.abs(p.x - M.cajon.x) < M.cajon.ax
      && Math.abs(p.y - M.cajon.y) < M.cajon.ay) {
    /* Si está abierto y se toca lo de DENTRO, es la botella y no el
       cajón: lo pequeño gana a lo grande, también aquí. */
    if (secretos.cajon.abierto > 0.5
        && dentroDe(p.x, p.y, M.botella.x, M.botella.y, M.botella.r)) {
      tocarBotella(M.botella);
      return true;
    }
    secretos.cajon.pulso = 1;
    secretos.cajon.abiertoObj = secretos.cajon.abiertoObj > 0.5 ? 0 : 1;
    /* Madera contra madera: un golpe grave y arrastrado. */
    golpe(0.16, 260, 0.1, "lowpass");
    if (secretos.cajon.abiertoObj > 0.5 && !secretos.cajon.hallada) {
      secretos.cajon.hallada = true;
      recuerdo.poner("botella", 1);
      setTimeout(() => decir(M.botella.x, M.botella.y - U * 8,
        CONF.cuarto.cajonBotella, { misterio: true, importante: true, dur: 5 }), 700);
      contarLogro("botella");
    } else if (secretos.cajon.abiertoObj < 0.5) {
      decir(M.cajon.x, M.cajon.y - U * 6, CONF.cuarto.cajonCierra, { dur: 2.6 });
    }
    return true;
  }
  if (secretos.cajon.abierto > 0.5
      && dentroDe(p.x, p.y, M.botella.x, M.botella.y, M.botella.r)) {
    tocarBotella(M.botella);
    return true;
  }

  /* El nudo del suelo. */
  const n = sitioNudo();
  if (dentroDe(p.x, p.y, n.x, n.y, n.r * 2.2)) {
    secretos.nudo.pulso = 1;
    golpe(0.08, 240, 0.08, "lowpass");
    if (!secretos.nudo.hallado) {
      secretos.nudo.veces++;
      if (secretos.nudo.veces >= 3) {
        secretos.nudo.hallado = true;
        recuerdo.poner("nudo", 1);
        magia(587);
        soltarBrillos(n.x, n.y, 12, 0.94);
        decir(n.x, n.y - U * 8, CONF.cuarto.nudoHallado,
          { mimo: true, importante: true, dur: 6 });
        contarLogro("nudo");
      } else {
        decir(n.x, n.y - U * 6,
          CONF.cuarto.nudo[Math.min(secretos.nudo.veces - 1, 1)], { dur: 3 });
      }
    }
    return true;
  }
  return false;
}

/** La botella del cajón, y el papel que lleva dentro. */
function tocarBotella(B) {
  tono(azar(1300, 1700), 0.5, "sine", 0.035);
  soltarBrillos(B.x, B.y, 5, 0.32);
  if (!secretos.cajon.leida) {
    secretos.cajon.leida = true;
    recuerdo.poner("botellaLeida", 1);
    magia(523);
    setTimeout(() => decir(B.x, B.y - U * 9, CONF.cuarto.botellaPapel,
      { mimo: true, importante: true, dur: 7 }), 500);
    contarLogro("papelBotella");
  } else {
    decir(B.x, B.y - U * 8, diceBotella(), { dur: 3.4 });
  }
}

/** Correr una cortina. Devuelve el lado tocado, o null. */
function ladoCortina(p) {
  const v = ventanaHab();
  const d = desplazar(0.9);
  const vx = v.x + d.x * 0.6, vy = v.y + d.y * 0.6;
  if (p.y < vy - v.h * 0.6 || p.y > vy + v.h * 0.62) return null;
  for (const lado of [-1, 1]) {
    const corr = lado < 0 ? secretos.cortina.izq : secretos.cortina.der;
    const bx = vx + lado * v.w * (0.5 + corr * 0.4);
    /* La cortina cuelga desde `bx` hacia fuera y muerde hacia dentro
       un trozo de ventana. Ese trozo es lo que se puede agarrar. */
    const dentro = bx - lado * v.w * 0.14;
    const fuera = bx + lado * v.w * 0.24;
    if ((p.x - Math.min(dentro, fuera)) * (Math.max(dentro, fuera) - p.x) > 0) return lado;
  }
  return null;
}

/**
 * Agarrar una cortina.
 *
 * ── POR QUÉ NO SE DECIDE AQUÍ SI ES TOQUE O ARRASTRE ─────────────────
 * Porque al bajar el dedo todavía no se sabe. Si al tocar se corriera
 * entera, arrastrarla sería imposible —ya estaría descorrida antes de
 * mover el dedo—, y si sólo se pudiera arrastrar, un toque no haría
 * nada y parecería que la cortina no es tocable.
 *
 * Así que aquí sólo se apunta de dónde se agarró, el movimiento la va
 * corriendo, y al soltar se mira cuánto corrió: poco es un toque y se
 * va del todo a un lado, mucho es un arrastre y se queda donde la
 * dejaron. Es el mismo trato que tiene andar por la espesura.
 */
let arrastreCortina = null;

function agarrarCortina(lado, p, e) {
  const v = ventanaHab();
  arrastreCortina = {
    id: e && e.pointerId !== undefined ? e.pointerId : -1,
    lado,
    x0: p.x,
    base: lado < 0 ? secretos.cortina.izqObj : secretos.cortina.derObj,
    /* El recorrido completo de la cortina, en píxeles. */
    largo: Math.max(1, v.w * 0.4),
    corrido: 0,
  };
}

/** Lo que hace el dedo mientras arrastra una cortina. */
function moverCortina(p) {
  const a = arrastreCortina;
  if (!a) return;
  const dx = (p.x - a.x0) * a.lado;   // positivo = hacia su lado = abrir
  a.corrido = Math.max(a.corrido, Math.abs(p.x - a.x0));
  const k = clamp01(a.base + dx / a.largo);
  if (a.lado < 0) { secretos.cortina.izqObj = k; secretos.cortina.izq = k; }
  else { secretos.cortina.derObj = k; secretos.cortina.der = k; }
  if (a.lado < 0 && k > 0.55) descubrirRayas();
}

/** Y al soltar. */
function soltarCortina() {
  const a = arrastreCortina;
  arrastreCortina = null;
  if (!a) return;
  /* Menos de seis píxeles no es un arrastre: es un toque. */
  if (a.corrido < 6) { tocarCortina(a.lado); return; }
  /* Y si se arrastró, se queda donde esté pero se redondea a los
     extremos si quedó muy cerca: una cortina a un 4% abierta no la
     dejó nadie ahí queriendo. */
  const k = a.lado < 0 ? "izqObj" : "derObj";
  const v = secretos.cortina[k];
  if (v < 0.12) secretos.cortina[k] = 0;
  else if (v > 0.88) secretos.cortina[k] = 1;
  if (a.lado < 0 && secretos.cortina[k] > 0.5) descubrirRayas();
}

/** Tocar una cortina sin arrastrarla: se corre entera de un lado a otro. */
function tocarCortina(lado) {
  const k = lado < 0 ? "izqObj" : "derObj";
  secretos.cortina[k] = secretos.cortina[k] > 0.5 ? 0 : 1;
  /* Anillas de metal contra la barra. */
  for (let i = 0; i < 4; i++) {
    setTimeout(() => golpe(0.03, azar(2200, 3400), 0.05, "bandpass"), i * 55);
  }
  if (lado < 0 && secretos.cortina[k] > 0.5) descubrirRayas();
}

/** Lo que pasa la primera vez que se destapan las rayas del marco. */
function descubrirRayas() {
  if (secretos.cortina.hallado) return;
  secretos.cortina.hallado = true;
  recuerdo.poner("rayas", 1);
  const v = ventanaHab();
  const n = Math.max(1, recuerdo.leer("visitas", 1));
  setTimeout(() => {
    sonarMisterio(0.4);
    decir(v.x - v.w * 0.62, v.y - v.h * 0.3,
      n === 1 ? CONF.cuarto.rayasUna : CONF.cuarto.rayas.replace("{n}", n),
      { misterio: true, importante: true, dur: 7 });
  }, 900);
  contarLogro("rayas");
}

/** La manta: se sube hasta la barbilla, o se baja. */
function tocarManta(p) {
  secretos.manta.subeObj = secretos.manta.subeObj > 0.5 ? 0 : 1;
  secretos.manta.veces++;
  /* Tela: un siseo corto y grave. */
  golpe(0.22, 620, 0.05, "lowpass");
  const sube = secretos.manta.subeObj > 0.5;
  const lista = sube ? CONF.cuarto.mantaSube : CONF.cuarto.mantaBaja;
  decir(p.x, cimaCama() - U * 6, lista[Math.min(secretos.manta.veces >> 1, lista.length - 1)],
    { dur: 3.4 });
  if (secretos.manta.veces >= 4) contarLogro("manta");
}

/** La vela del alféizar: se apaga a la tercera y se vuelve a prender
    ella sola a los pocos segundos. */
function tocarVela(x, y) {
  secretos.vela.pulso = 1;
  if (secretos.vela.veces >= 3) {
    decir(x, y - U * 6, CONF.cuarto.velaVuelve, { dur: 3.4 });
    return;
  }
  secretos.vela.veces++;
  if (secretos.vela.veces >= 3) {
    golpe(0.12, 400, 0.1, "lowpass");
    decir(x, y - U * 6, CONF.cuarto.velaApagada, { mimo: true, dur: 3.6 });
    contarLogro("vela");
    /* Y se vuelve a prender sola. Lo bonito no es apagarla: es que
       vuelva. */
    setTimeout(() => {
      secretos.vela.veces = 0;
      tono(880, 0.5, "sine", 0.04);
      decir(x, y - U * 6, CONF.cuarto.velaVuelve, { mimo: true, dur: 4 });
    }, 5200);
  } else {
    golpe(0.04, 2400, 0.06, "highpass");
    decir(x, y - U * 6,
      CONF.cuarto.vela[secretos.vela.veces - 1], { dur: 3 });
  }
}

/** Pedir un deseo en el hueco del corazón. */
function pedirDeseo(S) {
  if (hab.lampara > 0.4) {
    decir(S.cx, S.cy, CONF.cuarto.deseoLuz, { dur: 3.6 });
    return;
  }
  secretos.deseo.t = 0;
  secretos.deseo.y0 = azar(H * 0.03, H * 0.1);
  secretos.deseo.y1 = secretos.deseo.y0 + H * azar(0.14, 0.26);
  tono(1318, 1.1, "sine", 0.035);
  decir(S.cx, S.cy + S.esc * 16, diceDeseo(), { misterio: true, dur: 4.5 });
  contarLogro("deseo");
}

/** Una cuerda de guitarra: cuerpo con armónicos y caída larga. */
function pulsarCuerda(hz0) {
  if (!despertarAudio()) return;
  const c = audio.ctx, t = c.currentTime;
  /* El pellizco: un chasquido cortísimo antes de la nota. Sin él suena
     a sintetizador; con él suena a dedo. */
  golpe(0.02, hz0 * 12, 0.05, "bandpass");
  for (const [mult, amp, dur] of [[1, 1, 2.4], [2, 0.42, 1.6], [3, 0.2, 1.1], [4.2, 0.1, 0.7]]) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "triangle";
    o.frequency.value = hz0 * mult;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.055 * amp, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audio.maestro);
    o.start(t); o.stop(t + dur + 0.05);
  }
}

/** El radio: una emisora lejana. Ruido con un poco de melodía dentro. */
function sonarRadio() {
  if (!despertarAudio()) return;
  const c = audio.ctx;
  /* La estática de fondo, que se queda mientras esté prendido. */
  const src = c.createBufferSource();
  src.buffer = bufferRosa(4);
  src.loop = true;
  const f = c.createBiquadFilter();
  f.type = "bandpass"; f.frequency.value = 1400; f.Q.value = 1.2;
  const g = c.createGain(); g.gain.value = 0;
  g.gain.linearRampToValueAtTime(0.03, c.currentTime + 0.4);
  src.connect(f).connect(g).connect(audio.maestro);
  src.start();
  cosas.radio.fuente = src;
  cosas.radio.gain = g;

  /* Y una melodía muy floja que se cuela entre la estática. */
  const mel = [392, 440, 494, 440, 392, 330, 392];
  let i = 0;
  const tocar = () => {
    if (!cosas.radio.on) {
      if (cosas.radio.gain) cosas.radio.gain.gain.linearRampToValueAtTime(0, c.currentTime + 0.3);
      if (cosas.radio.fuente) { try { cosas.radio.fuente.stop(c.currentTime + 0.4); } catch { /* ya */ } }
      cosas.radio.fuente = null;
      return;
    }
    tono(mel[i % mel.length], 0.5, "sine", 0.022);
    i++;
    cosas.radio.reloj = setTimeout(tocar, 520);
  };
  tocar();
}

/* ---- DESPERTAR EN LA CABAÑA ---------------------------------------------
   Lo último. Se abre los ojos en la cama, con la habitación puesta y
   algo verde donde antes no había nada.

   ── POR QUÉ LOS OJOS SE ABREN DESPACIO ───────────────────────────────
   Porque el velo no se levanta entero: se levanta, se vuelve a cerrar
   un poco y se levanta del todo. Eso es un parpadeo, y un parpadeo es
   la diferencia entre «ha cambiado la escena» y «he despertado». */

function despertarEnLaCabana() {
  escena = "habitacion";
  raiz.classList.remove("is-espesura");
  raiz.classList.add("is-habitacion");
  limpiarParticulas();
  construirHabitacion();
  hab.dormida = 0;
  hab.lamparaOn = false;             // se despierta a oscuras
  reloj3.encendido = true;
  historia.marcar("despertar");
  recuerdo.poner("tresDeLaManana", 1);

  cam.oz = 1; cam.ox = 0; cam.oy = 0;
  cam.z = 1; cam.x = 0; cam.y = 0;
  buhoEsp.ataque = -1;
  buhoEsp.desmayado = false;
  buhoEsp.golpeado = false;
  buhoEsp.chillo = false;
  buhoEsp.dijo1 = false; buhoEsp.dijo2 = false;
  buhoEsp.escala = 1; buhoEsp.volando = 0; buhoEsp.centrado = 0;
  buhoEsp.rojoObj = 0;
  ojosEsp.evento = -1; ojosEsp.hecho = false; ojosEsp.acabado = false;
  ojosEsp.enjambre.length = 0;
  ojosEsp.lista.length = 0;

  /* El parpadeo: abre, se cierra un poco, y abre del todo. */
  const abrir = [
    [700, 0.55], [1100, 0.85], [1500, 0.2], [2100, 0.0],
  ];
  for (const [ms, v] of abrir) setTimeout(() => { cine.velo = v; }, ms);

  setTimeout(() => { agacharAmbientes(0.35, 3); }, 600);
  setTimeout(() => {
    bloqueado = false;
    decir(A * 0.5, H * 0.56, CONF.tres.sueno, { mimo: true, importante: true, dur: 4 });
  }, 2400);
  setTimeout(() => {
    decir(A * 0.5, H * 0.56, CONF.tres.hora, { mimo: true, importante: true, dur: 4 });
  }, 6200);
  /* Y a los pocos segundos, la mirada va sola al reloj. */
  setTimeout(() => { reloj3.llama = 1; }, 8000);
}

/* ---- EL RELOJ ------------------------------------------------------------
   En la mesilla, con números verdes. Marca las tres y no se mueve.

   ── POR QUÉ NO AVANZA ───────────────────────────────────────────────
   Porque un reloj que avanza es un reloj. Éste no está ahí para dar la
   hora: está ahí para decir QUÉ hora es, y esa hora no cambia. */

const reloj3 = {
  encendido: false,
  llama: 0,        // cuánto pide que lo miren
  pulso: 0,
  tocado: 0,
};

function moverReloj3(dt) {
  if (!reloj3.encendido) return;
  reloj3.llama = Math.max(0, reloj3.llama - dt * 0.22);
  reloj3.pulso = Math.max(0, reloj3.pulso - dt * 1.4);
}

/** Dónde está, para dibujarlo y para tocarlo. */
function sitioReloj3() {
  const v = ventanaHab();
  const d = desplazar(0.9);
  const lx = Math.min(v.x + v.w * 0.85, A - U * 9) + d.x * 0.6;
  return { x: lx - U * 4.6, y: H * 0.62 + U * 1.2, w: U * 7.6, h: U * 4 };
}

function dibujarReloj3() {
  if (!reloj3.encendido) return;
  const r = sitioReloj3();
  const late = 0.75 + 0.25 * Math.sin(reloj * 1.1) + reloj3.pulso * 0.8 + reloj3.llama * 0.5;

  /* La luz que echa sobre la mesilla y la pared. Es lo que hace que el
     reloj forme parte de la habitación en vez de estar pegado encima. */
  ctx.globalCompositeOperation = "lighter";
  haloOvalado(r.x, r.y, r.w * 2.6, r.h * 2.6, [
    [0, `rgba(80,255,170,${0.13 * late})`],
    [0.45, `rgba(50,220,140,${0.05 * late})`],
    [1, "rgba(40,200,120,0)"],
  ]);
  ctx.globalCompositeOperation = "source-over";

  /* La caja: plástico negro, mate. */
  ctx.fillStyle = "rgb(16,17,20)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(r.x - r.w / 2, r.y - r.h / 2, r.w, r.h, r.h * 0.18);
