<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Una noche en el bosque, junto a una fogata.">
<title>Noche estrellada</title>

<style>
/* ══════════════════════════════════════════════════════════════════════
   NOCHE ESTRELLADA — estilos

   Todo cuelga de `.noche` y lleva el prefijo `ne-`. Ni una etiqueta a
   secas: esta página funciona suelta, pero también se incrusta dentro
   del librito, y ahí no puede tocarle nada a nadie.
   ══════════════════════════════════════════════════════════════════════ */

html, body {
  margin: 0;
  height: 100%;
  background: #05070f;
  overscroll-behavior: none;
}

.noche {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  contain: layout paint;
  background: #05070f;
  color: #dfe6f5;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  cursor: default;

  /* Los márgenes seguros del móvil. Si esta página va dentro del librito,
     él ya los presta con estos nombres; si va suelta, salen de `env()`. */
  --seguro-t: var(--seguro-arriba, env(safe-area-inset-top, 0px));
  --seguro-b: var(--seguro-abajo, env(safe-area-inset-bottom, 0px));
  --seguro-l: var(--seguro-lado, env(safe-area-inset-left, 0px));
  --seguro-r: var(--seguro-lado, env(safe-area-inset-right, 0px));
  --barra: var(--hueco-barra, 0rem);

  --e-suave: cubic-bezier(0.22, 1, 0.36, 1);
  /* Con rebote, para lo que aparece de golpe: un aviso que entra sin
     pasarse un poco de largo se lee como un cartel, y pasándose se lee
     como algo que acaba de caer ahí. */
  --e-salto: cubic-bezier(0.34, 1.56, 0.64, 1);
  --e-cine: cubic-bezier(0.65, 0, 0.35, 1);

  --tipo-titulo: var(--tipo-titulo, Georgia, "Times New Roman", serif);
  --tipo-mano: var(--tipo-mano, "Segoe Script", "Bradley Hand", cursive);
}

/* El lienzo donde se pinta el mundo entero. */
.noche .ne-lienzo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  /* Los toques los recoge `.ne-toque`, que va justo encima. Así hay un
     solo sitio del que salen los gestos. */
  pointer-events: none;
}

/* La capa del brillo. Cuando está puesta, TAPA a la de abajo: no suma
   encima, la sustituye entera con el brillo ya metido. Por eso la de
   abajo se esconde en vez de quedarse debajo asomando por los cantos. */
.noche .ne-brillo { z-index: 1; }
.noche.is-brillo .ne-lienzo:not(.ne-brillo) { visibility: hidden; }

/* La capa que recibe los dedos. Ocupa la escena entera.

   Si esta página va dentro del librito, él sólo se queda el barrido que
   EMPIEZA en sus 24-44 px de borde, así que aquí se puede arrastrar de
   lado a lado sin que se pase de hoja. */
.noche .ne-toque {
  position: absolute;
  inset: 0;
  touch-action: none;
  z-index: 2;
}

/* ── El rótulo de bienvenida ─────────────────────────────────────────── */

.noche .ne-entrada {
  position: absolute;
  inset: 0;
  z-index: 40;
  display: grid;
  place-items: center;
  background:
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(10, 14, 28, 0.55), rgba(3, 5, 12, 0.92));
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  transition: opacity 900ms var(--e-suave), visibility 900ms;
  cursor: pointer;
  text-align: center;
  padding: 0 28px;
  box-sizing: border-box;
}
.noche.is-dentro .ne-entrada {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.noche .ne-entrada h1 {
  margin: 0 0 0.5em;
  font-family: var(--tipo-titulo);
  font-weight: 400;
  font-size: clamp(1.5rem, 7vw, 2.4rem);
  letter-spacing: 0.16em;
  color: #f2ecff;
  text-shadow: 0 0 40px rgba(170, 190, 255, 0.45);
}
.noche .ne-entrada p {
  margin: 0;
  font-size: clamp(0.82rem, 3.6vw, 1rem);
  line-height: 1.7;
  color: #b8c4e0;
  max-width: 22em;
}
.noche .ne-entrada .ne-pulso {
  display: inline-block;
  margin-top: 1.6em;
  padding: 0.7em 1.8em;
  border: 1px solid rgba(190, 205, 255, 0.34);
  border-radius: 999px;
  font-size: 0.82rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #dfe6ff;
  animation: ne-respira 3.4s ease-in-out infinite;
}
@keyframes ne-respira {
  0%, 100% { opacity: 0.55; transform: scale(1); }
  50%      { opacity: 1;    transform: scale(1.035); }
}

/* ── La interfaz de la espesura ──────────────────────────────────────── */

/* Todo por los cantos y del tamaño justo. Un panel grande en medio de
   un bosque que se explora es un panel tapando el bosque. */
.noche .ne-hud {
  position: absolute;
  inset: 0;
  z-index: 22;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 500ms var(--e-suave), visibility 0s linear 500ms;
}
.noche.is-espesura .ne-hud {
  opacity: 1;
  visibility: visible;
  transition-delay: 0s;
}

/* El botón de volver: flecha y dos palabras, con el fondo de cristal de
   las burbujas para que sea la misma materia que todo lo demás. */
.noche .ne-hud-salir {
  position: absolute;
  left: calc(var(--seguro-l) + 10px);
  top: calc(var(--seguro-t) + 46px);
  display: flex;
  align-items: center;
  gap: 0.35em;
  padding: 0.42em 0.8em 0.42em 0.6em;
  border-radius: 999px;
  border: 1px solid rgba(180, 220, 200, 0.22);
  background: linear-gradient(to bottom, rgba(22, 38, 32, 0.72), rgba(8, 16, 14, 0.78));
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  color: #cfe8db;
  font-size: 0.72rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  pointer-events: auto;
  cursor: pointer;
  transition: transform 180ms var(--e-suave), background 260ms var(--e-suave);
}
.noche .ne-hud-salir:active { transform: scale(0.94); background: rgba(40, 70, 58, 0.8); }
.noche .ne-hud-flecha { font-size: 1.1rem; line-height: 0.8; opacity: 0.8; }

/* El contador de lo hallado: un número y una palabra minúscula. */
.noche .ne-hud-hallado {
  position: absolute;
  right: calc(var(--seguro-r) + 12px);
  top: calc(var(--seguro-t) + 12px);   /* lo mueve la regla de más abajo */
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1;
  color: rgba(190, 236, 214, 0.78);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
}
.noche .ne-hud-hallado b {
  font-size: 1.15rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.noche .ne-hud-hallado i {
  font-style: normal;
  font-size: 0.52rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-top: 0.25em;
}

/* ── Las vidas de la cacería ────────────────────────────────────────────
   Arriba y por el centro: es lo único que hay que poder mirar de reojo
   sin dejar de disparar, y por el centro no lo tapa nada. */
.noche .ne-vidas {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: calc(var(--seguro-t) + 12px);
  display: flex;
  gap: 7px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 400ms var(--e-suave);
}
.noche .ne-vidas.is-on { opacity: 1; }
.noche .ne-vida {
  width: 13px;
  height: 13px;
  border-radius: 999px;
  background: radial-gradient(circle at 34% 30%, #ffd9e2, #e0506e 62%, #7a1f30);
  box-shadow: 0 0 10px rgba(255, 90, 120, 0.5);
  transition: transform 300ms var(--e-suave), opacity 300ms var(--e-suave),
              box-shadow 300ms var(--e-suave), background 300ms var(--e-suave);
}
/* Una vida perdida NO se borra: se queda apagada en su sitio. Si
   desapareciera, las que quedan se moverían y no se sabría cuántas
   había ni cuántas se han ido. */
.noche .ne-vida.is-ida {
  background: rgba(120, 130, 140, 0.24);
  box-shadow: none;
  transform: scale(0.62);
}
@keyframes ne-golpe {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.9); }
  100% { transform: scale(0.62); }
}
.noche .ne-vida.is-golpe { animation: ne-golpe 460ms var(--e-out); }

/* La bolsa: una fila de huecos abajo a la izquierda. Vacía no se ve. */
.noche .ne-bolsa {
  position: absolute;
  left: calc(var(--seguro-l) + 10px);
  bottom: calc(var(--seguro-b) + var(--barra) + 10px);
  display: flex;
  gap: 8px;
  pointer-events: auto;
}
.noche .ne-hueco {
  width: 46px; height: 46px;
  border-radius: 12px;
  border: 1px solid rgba(180, 220, 200, 0.2);
  background: linear-gradient(to bottom, rgba(20, 34, 30, 0.6), rgba(6, 14, 12, 0.7));
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform 180ms var(--e-suave), border-color 260ms var(--e-suave),
              box-shadow 260ms var(--e-suave);
}
.noche .ne-hueco:active { transform: scale(0.92); }
/* En la mano: se enciende y se levanta un pelín. */
.noche .ne-hueco.is-mano {
  border-color: rgba(150, 255, 200, 0.55);
  box-shadow: 0 0 0 1px rgba(150, 255, 200, 0.18), 0 0 18px rgba(80, 230, 150, 0.3);
  transform: translateY(-3px);
}
.noche .ne-hueco canvas { width: 34px; height: 34px; display: block; }

/* ── El aviso de objeto conseguido ───────────────────────────────────
   Aparece en medio, un segundo y medio, y se va. No pide nada ni tapa
   nada: sólo dice lo que acaba de pasar. */
.noche .ne-aviso {
  position: absolute;
  left: 50%;
  top: 38%;
  z-index: 28;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5em;
  padding: 0.9em 1.5em;
  border-radius: 18px;
  border: 1px solid rgba(180, 255, 214, 0.26);
  background: linear-gradient(to bottom, rgba(18, 44, 36, 0.78), rgba(6, 18, 14, 0.84));
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 0 34px rgba(60, 220, 150, 0.22), 0 10px 40px rgba(0, 0, 0, 0.5);
  color: #d8ffe9;
  font-size: 0.72rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -50%) scale(0.8);
  transition: opacity 320ms var(--e-suave), transform 420ms var(--e-salto);
}
.noche .ne-aviso.is-ver {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
.noche .ne-aviso-ico { width: 44px; height: 44px; }

/* ── Los textos flotantes ────────────────────────────────────────────── */

/* Cada frase sale donde ha pasado algo y sube desvaneciéndose. Se crean
   una vez y se reciclan: en una escena que puede soltar varias por
   segundo, crear y tirar nodos es lo que hace que salte el recolector
   justo encima de una animación. */
.noche .ne-dichos {
  position: absolute;
  inset: 0;
  z-index: 25;
  pointer-events: none;
}
.noche .ne-dicho {
  position: absolute;
  left: 0; top: 0;
  /* ---- EL TAMAÑO ----
     Medía diecisiete emes de ancho y ocupaba tres cuartos de la
     pantalla: una frase larga se comía la escena entera y tapaba justo
     lo que acababas de encontrar. Trece emes y algo más de la mitad de
     la pantalla siguen leyéndose de sobra y dejan ver lo de detrás. */
  max-width: min(13em, 58vw);
  padding: 0.46em 0.8em;
  border-radius: 13px;
  /* Tres capas y no un color plano: un cristal ahumado con un poco de
     luz recogida arriba —de donde viene la luna— y el fondo cerrándose
     abajo. Un rectángulo de un solo color se lee como un bocadillo de
     cómic; esto se lee como algo que flota en la noche. */
  background:
    linear-gradient(to bottom,
      rgba(36, 44, 74, 0.72) 0%,
      rgba(16, 20, 38, 0.74) 55%,
      rgba(10, 13, 26, 0.78) 100%);
  border: 1px solid rgba(180, 196, 255, 0.2);
  box-shadow:
    inset 0 1px 0 rgba(214, 228, 255, 0.14),
    0 6px 28px rgba(2, 4, 12, 0.55);
  backdrop-filter: blur(7px) saturate(1.2);
  -webkit-backdrop-filter: blur(7px) saturate(1.2);
  font-size: clamp(0.7rem, 2.85vw, 0.82rem);
  line-height: 1.45;
  text-align: center;
  color: #eaf0ff;
  text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
  opacity: 0;
  will-change: transform, opacity, filter;
}

/* La puntita, que la ancla a lo que ha hablado. Es un cuadrado girado
   cuarenta y cinco grados con sólo dos de sus cuatro lados pintados:
   así hereda el mismo borde que la caja y no hay que dibujar nada. */
.noche .ne-dicho::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -5px;
  width: 10px; height: 10px;
  transform: translateX(-50%) rotate(45deg);
  background: rgba(10, 13, 26, 0.78);
  border-right: 1px solid rgba(180, 196, 255, 0.2);
  border-bottom: 1px solid rgba(180, 196, 255, 0.2);
}

.noche .ne-dicho.ne-mimo {
  font-family: var(--tipo-mano);
  font-size: clamp(0.94rem, 4.1vw, 1.14rem);
  color: #ffdcea;
  border-color: rgba(255, 180, 210, 0.3);
  background:
    linear-gradient(to bottom,
      rgba(58, 34, 56, 0.72) 0%,
      rgba(28, 16, 32, 0.76) 55%,
      rgba(16, 9, 20, 0.8) 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 214, 234, 0.16),
    0 6px 30px rgba(40, 4, 24, 0.5);
}
.noche .ne-dicho.ne-mimo::after {
  background: rgba(16, 9, 20, 0.8);
  border-color: rgba(255, 180, 210, 0.3);
}

/* ── La burbuja del misterio ──────────────────────────────────────────
   Para lo que dice el bosque, no lo que dice alguien. Verde, con letra
   de libro viejo, más espaciada y con un resplandor propio. El texto
   sale LETRA A LETRA: es lo único que hace que una frase se lea como
   algo que está pasando y no como un cartel que aparece. */
.noche .ne-dicho.ne-misterio {
  font-family: var(--tipo-titulo, ui-serif, Georgia, serif);
  font-size: clamp(0.9rem, 4vw, 1.1rem);
  letter-spacing: 0.04em;
  color: #d6ffe6;
  border-color: rgba(120, 255, 190, 0.26);
  background:
    linear-gradient(to bottom,
      rgba(16, 50, 40, 0.74) 0%,
      rgba(8, 26, 22, 0.78) 55%,
      rgba(4, 16, 14, 0.82) 100%);
  box-shadow:
    inset 0 1px 0 rgba(170, 255, 214, 0.18),
    0 0 26px rgba(40, 200, 130, 0.22),
    0 6px 30px rgba(0, 12, 8, 0.6);
  text-shadow: 0 0 14px rgba(90, 255, 180, 0.45), 0 1px 10px rgba(0, 0, 0, 0.8);
}
.noche .ne-dicho.ne-misterio::after {
  background: rgba(4, 16, 14, 0.82);
  border-color: rgba(120, 255, 190, 0.26);
}

/* El cursor mientras se escribe. Parpadea con CSS y no con JavaScript:
   un parpadeo que depende del bucle se para cuando el bucle se para. */
.noche .ne-dicho .ne-cursor {
  display: inline-block;
  width: 0.5em;
  opacity: 0.8;
  animation: ne-parpadeo 900ms steps(2, end) infinite;
}
/* `display: inline-block` de arriba GANA al `display: none` que el
   navegador le pone a `[hidden]`, porque una clase pesa más que un
   atributo. Sin esta línea, el cursor salía en todas las frases, hasta
   en las que no se escriben. */
.noche .ne-dicho .ne-cursor[hidden] { display: none; }
@keyframes ne-parpadeo { 50% { opacity: 0; } }

/* ── El panel de ambientes ───────────────────────────────────────────── */

/* Va dibujado con piedras en el lienzo, no con HTML: forma parte del
   mundo. Esto de aquí es sólo la etiqueta que explica lo que se toca,
   y se esconde en cuanto se usa una vez. */
.noche .ne-pista-panel {
  position: absolute;
  left: 50%;
  /* Por encima de la fila de sonidos, que le dice lo alta que es. El
     valor de reserva es para el primer cuadro, antes de que el panel se
     haya medido. */
  bottom: calc(var(--seguro-b) + var(--barra) + var(--fila-alto, 76px) + 6px);
  transform: translateX(-50%);
  z-index: 20;
  font-size: 0.56rem;
  /* Apretada a propósito. Esta página también se lee DENTRO del librito,
     y ahí las flechas de pasar hoja se sientan en los dos cantos a esta
     misma altura: una línea que llegue hasta los bordes se queda con
     las puntas escondidas debajo. */
  letter-spacing: 0.1em;
  text-transform: uppercase;
  /* En una línea siempre: partido en tres se comía media escena y
     tapaba la fogata, que es justo lo que no puede tapar. */
  white-space: nowrap;
  color: rgba(190, 204, 240, 0.42);
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.9);
  pointer-events: none;
  transition: opacity 700ms var(--e-suave);
}
/* Se va en cuanto se usa una piedra… y también en cuanto se sale del
   bosque: dentro de la cabaña no hay piedras que tocar, y el rótulo se
   quedaba ahí explicando algo que no está. */
.noche.is-panel-usado .ne-pista-panel,
.noche.is-espesura .ne-pista-panel,
.noche.is-habitacion .ne-pista-panel,
.noche.is-durmiendo .ne-pista-panel { opacity: 0; }

/* ── El contador del bosque ───────────────────────────────────────────
   Más abajo del canto de arriba de lo que pediría el buen gusto, y a
   propósito: los navegadores de móvil ponen ahí sus propios botones
   flotantes —el de la barra, el del asistente— y el número quedaba
   justo debajo de uno de ellos, tapado. */
.noche .ne-hud-hallado { top: calc(var(--seguro-t) + 52px); }

/* ── La carta del bosque ─────────────────────────────────────────────── */

.noche .ne-velo {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: calc(var(--seguro-t) + 20px) 20px calc(var(--seguro-b) + var(--barra) + 20px);
  box-sizing: border-box;
  background: radial-gradient(ellipse 90% 70% at 50% 50%, rgba(6, 14, 12, 0.72), rgba(2, 5, 8, 0.94));
  opacity: 0;
  visibility: hidden;
  /* `pointer-events` aparte y SIN transición: `visibility` tarda sus 900
     ms en llegar a `hidden`, y mientras tanto el velo ocupa la pantalla
     entera por encima de todo. Al cerrar la carta había casi un segundo
     en el que tocar el bosque no hacía nada. */
  pointer-events: none;
  transition: opacity 900ms var(--e-suave), visibility 900ms;
}
.noche .ne-velo.is-abierto {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.noche .ne-carta {
  position: relative;
  width: min(92vw, 380px);
  max-height: 100%;
  overflow: auto;
  padding: 30px 26px 26px;
  box-sizing: border-box;
  border-radius: 3px;
  /* Papel viejo: tres tramas finísimas y un degradado. Sin descargar
     nada, y nítido a cualquier tamaño. */
  background-image:
    repeating-linear-gradient(92deg, rgba(150, 125, 90, 0.05) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(2deg, rgba(150, 125, 90, 0.04) 0 1px, transparent 1px 5px),
    linear-gradient(166deg, #fdf8ec 0%, #f4ebd6 58%, #e4d7bc 100%);
  color: #3c3126;
  box-shadow:
    0 2px 4px rgba(20, 30, 20, 0.4),
    0 26px 60px rgba(0, 0, 0, 0.6),
    0 0 90px rgba(120, 255, 190, 0.14);
  transform: translateY(26px) scale(0.94) rotate(-1.2deg);
  opacity: 0;
  transition:
    transform 1100ms var(--e-suave) 160ms,
    opacity 800ms var(--e-suave) 160ms;
  scrollbar-width: none;
}
.noche .ne-carta::-webkit-scrollbar { display: none; }
.noche .ne-velo.is-abierto .ne-carta {
  transform: none;
  opacity: 1;
}

.noche .ne-carta p {
  margin: 0 0 0.9em;
  font-family: var(--tipo-mano);
  font-size: clamp(1rem, 4.4vw, 1.2rem);
  line-height: 1.75;
}
.noche .ne-carta p:last-of-type { margin-bottom: 0; }
.noche .ne-carta .ne-firma {
  margin-top: 1.3em;
  text-align: right;
  font-size: clamp(1.05rem, 4.8vw, 1.3rem);
  color: #8a3f52;
}
.noche .ne-carta .ne-sello {
  position: absolute;
  right: 18px;
  bottom: -18px;
  width: 52px; height: 52px;
  border-radius: 48% 52% 50% 46% / 50% 46% 54% 50%;
  background: radial-gradient(circle at 36% 30%, #4fd6a0, #1f9c6e 52%, #0d5c40 100%);
  box-shadow: 0 3px 10px rgba(6, 40, 28, 0.6), inset 0 -3px 8px rgba(6, 40, 28, 0.5);
  display: grid;
  place-items: center;
  font-family: var(--tipo-titulo);
  font-size: 0.95rem;
  color: rgba(8, 48, 34, 0.7);
  text-shadow: 0 1px 0 rgba(160, 255, 215, 0.4);
}

.noche .ne-cerrar {
  display: block;
  margin: 22px auto 0;
  padding: 0.62em 1.7em;
  border: 1px solid rgba(190, 205, 255, 0.3);
  border-radius: 999px;
  background: rgba(14, 20, 30, 0.5);
  color: #dfe6ff;
  font: inherit;
  font-size: 0.76rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 260ms var(--e-suave), border-color 260ms var(--e-suave);
}
.noche .ne-cerrar:hover { background: rgba(30, 40, 60, 0.6); border-color: rgba(190, 205, 255, 0.5); }
.noche .ne-cerrar:focus-visible { outline: 2px solid #9fb8ff; outline-offset: 3px; }

/* ── El botón de dormir, en la habitación ────────────────────────────── */

.noche .ne-dormir {
  position: absolute;
  left: 50%;
  bottom: calc(var(--seguro-b) + var(--barra) + 26px);
  transform: translateX(-50%) translateY(18px);
  z-index: 22;
  padding: 0.78em 2.1em;
  border: 1px solid rgba(190, 205, 255, 0.26);
  border-radius: 999px;
  background: rgba(12, 16, 30, 0.48);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #e2e8ff;
  font: inherit;
  font-size: 0.78rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transition:
    opacity 900ms var(--e-suave),
    transform 900ms var(--e-suave),
    visibility 900ms,
    background 300ms var(--e-suave);
}
.noche.is-habitacion .ne-dormir {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%);
}
.noche .ne-dormir:hover { background: rgba(28, 36, 62, 0.62); }
.noche .ne-dormir:focus-visible { outline: 2px solid #9fb8ff; outline-offset: 3px; }

/* ── Regresar al bosque ────────────────────────────────────────────────── */

.noche .ne-volver {
  position: absolute;
  left: calc(var(--seguro-l) + 14px);
  top: calc(var(--seguro-t) + 14px);
  z-index: 22;
  width: 40px; height: 40px;
  border: 1px solid rgba(190, 205, 255, 0.2);
  border-radius: 50%;
  background: rgba(12, 16, 30, 0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #dfe6ff;
  font-size: 1.1rem;
  line-height: 1;
  cursor: pointer;
  opacity: 0;
  visibility: hidden;
  transition: opacity 700ms var(--e-suave), visibility 700ms;
}
.noche.is-habitacion .ne-volver,
.noche.is-durmiendo .ne-volver { opacity: 1; visibility: visible; }
.noche .ne-volver:focus-visible { outline: 2px solid #9fb8ff; outline-offset: 3px; }

/* ── Los párpados (la transición de dormirse) ────────────────────────── */

/* Dos telones que bajan y suben. Con opacidad sola no se siente cerrar
   los ojos; con dos mitades que se juntan, sí. */
.noche .ne-parpados {
  position: absolute;
  inset: 0;
  z-index: 45;
  pointer-events: none;
}
.noche .ne-parpados i {
  position: absolute;
  left: -2%;
  width: 104%;
  height: 52%;
  background: #04060d;
  transition: transform 2600ms var(--e-cine);
}
.noche .ne-parpados .ne-arriba { top: 0;    transform: translateY(-100%); border-radius: 0 0 46% 46% / 0 0 18% 18%; }
.noche .ne-parpados .ne-abajo  { bottom: 0; transform: translateY(100%);  border-radius: 46% 46% 0 0 / 18% 18% 0 0; }
.noche.is-durmiendo .ne-parpados .ne-arriba,
.noche.is-durmiendo .ne-parpados .ne-abajo { transform: translateY(0); }

/* El texto del sueño, cuando ya está todo oscuro. */
.noche .ne-sueno {
  position: absolute;
  inset: 0;
  z-index: 46;
  display: grid;
  place-items: center;
  padding: 0 32px;
  box-sizing: border-box;
  text-align: center;
  font-family: var(--tipo-mano);
  font-size: clamp(1.05rem, 4.6vw, 1.36rem);
  line-height: 1.8;
  color: #cfd8f2;
  text-shadow: 0 0 30px rgba(140, 170, 255, 0.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1800ms var(--e-suave) 1600ms;
}
.noche.is-durmiendo .ne-sueno { opacity: 0.92; }

/* ── El fogonazo de quemarse ─────────────────────────────────────────── */

.noche .ne-flash {
  position: absolute;
  inset: 0;
  z-index: 44;
  pointer-events: none;
  background: radial-gradient(ellipse 70% 60% at 50% 70%, rgba(255, 150, 60, 0.5), rgba(255, 90, 30, 0));
  opacity: 0;
}

/* ── Accesibilidad y rendimiento ─────────────────────────────────────── */

@media (prefers-reduced-motion: reduce) {
  .noche *,
  .noche *::before,
  .noche *::after {
    transition-duration: 1ms !important;
    animation-duration: 1ms !important;
    animation-iteration-count: 1 !important;
  }
}

/* Sólo lectores de pantalla. */
.noche .ne-sr {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
</style>
</head>
<body>

<div class="noche" id="noche">

  <!-- El mundo entero se pinta aquí. -->
  <canvas class="ne-lienzo" id="lienzo" aria-hidden="true"></canvas>

  <!-- Y aquí se vuelve a pintar con el brillo puesto, si hay WebGL2.
       Si no lo hay, ésta se queda escondida y se ve la de arriba, que
       ya está entera y bien. -->
  <canvas class="ne-lienzo ne-brillo" id="brillo" aria-hidden="true" hidden></canvas>

  <!-- Y los dedos se recogen aquí, por encima. -->
  <div class="ne-toque" id="toque" aria-hidden="true"></div>

  <!-- Las frases que van saliendo. -->
  <div class="ne-dichos" id="dichos" aria-hidden="true"></div>

  <!-- Lo que se lee de verdad, para quien use lector de pantalla. -->
  <p class="ne-sr" id="vivo" role="status" aria-live="polite"></p>

  <p class="ne-pista-panel" id="pistaPanel">toca para prender · arrastra el volumen</p>

  <button class="ne-volver" id="volver" type="button" aria-label="Regresar al bosque">‹</button>

  <!-- ── La interfaz de la espesura ─────────────────────────────────
       Sólo existe dentro del bosque. Compacta y por los cantos: lo de
       en medio es el bosque, y el bosque es lo que se ha venido a
       mirar. -->
  <div class="ne-hud" id="hud" aria-hidden="true">
    <button class="ne-hud-salir" id="hudSalir" type="button" aria-label="Regresar al claro">
      <span class="ne-hud-flecha">‹</span><span class="ne-hud-txt">el claro</span>
    </button>
    <div class="ne-hud-hallado" id="hudHallado"><b>0</b><i>secretos</i></div>
    <div class="ne-bolsa" id="bolsaUI"></div>
    <!-- Las vidas, durante la cacería. -->
    <div class="ne-vidas" id="vidasUI" aria-hidden="true"></div>
  </div>

  <!-- El aviso de objeto conseguido. -->
  <div class="ne-aviso" id="aviso" aria-hidden="true">
    <canvas class="ne-aviso-ico" id="avisoIco" width="72" height="72"></canvas>
    <span class="ne-aviso-txt" id="avisoTxt"></span>
  </div>
  <button class="ne-dormir" id="dormir" type="button">Dormir</button>

  <div class="ne-flash" id="flash" aria-hidden="true"></div>

  <div class="ne-parpados" aria-hidden="true">
    <i class="ne-arriba"></i><i class="ne-abajo"></i>
  </div>
  <p class="ne-sueno" id="sueno" aria-hidden="true"></p>

  <!-- La carta escondida en el bosque. -->
  <div class="ne-velo" id="velo" role="dialog" aria-modal="true" aria-labelledby="cartaTexto" aria-hidden="true">
    <div>
      <article class="ne-carta" id="carta">
        <div id="cartaTexto"></div>
        <span class="ne-sello" aria-hidden="true">y.m</span>
      </article>
      <button class="ne-cerrar" id="cerrarCarta" type="button">Guardarla</button>
    </div>
  </div>

  <!-- La puerta de entrada: hace falta un toque para que el navegador
       deje sonar el audio, así que se aprovecha para presentar la noche. -->
  <div class="ne-entrada" id="entrada" role="button" tabindex="0" aria-label="Entrar en la noche">
    <div>
      <h1>Noche estrellada</h1>
      <p>Una fogata, una cabaña y el cielo entero.<br>Quédate el rato que quieras.</p>
      <span class="ne-pulso">tocar para entrar</span>
    </div>
  </div>

</div>

<script>
/* ══════════════════════════════════════════════════════════════════════

   NOCHE ESTRELLADA

   Una noche en el bosque, junto a una fogata, cerca de una cabaña.

   Todo está aquí dentro: no descarga ninguna librería, ninguna imagen y
   ninguna fuente. Los únicos archivos de fuera son los de sonido, y si
   no están, se sintetizan (ver el SISTEMA DE AUDIO).

   El código va por módulos, en este orden:

       CONFIGURACIÓN
       UTILIDADES
       ESCENA Y MEDIDAS          (el lienzo, el parallax, la cámara)
       SISTEMA DE AUDIO
       SISTEMA DE PARTÍCULAS
       FOGATA
       SISTEMA DE BOMBONES
       PANEL DE AMBIENTES
       CAJITA MUSICAL
       CABAÑA
       CINEMÁTICA
       HABITACIÓN
       LUNA
       EASTER EGGS
       CARTA
       SISTEMA DE INTERACCIÓN
       DIBUJO DEL BOSQUE
       RESPONSIVE
       OPTIMIZACIÓN
       BUCLE Y ARRANQUE

   ══════════════════════════════════════════════════════════════════════ */

(() => {
"use strict";

// ==========================================
// CONFIGURACIÓN
// ==========================================
//
// Todo lo que se puede cambiar sin entender nada de lo demás: las frases,
// los colores, los números y las rutas de los sonidos.

const CONF = {

  /* ---- LAS RUTAS DE LOS SONIDOS ---------------------------------------
     Son EXACTAMENTE las que pediste. No las cambies de sitio: el código
     busca aquí y nada más.

     Si un archivo no está, no pasa nada: ese sonido se sintetiza con la
     Web Audio API y la experiencia funciona igual. Cuando dejes el mp3
     en su carpeta, se usa el tuyo sin tocar una línea.                  */
  rutas: {
    musica: "musica.mp3",
    /* Y si ahí no está, se mira en estos otros sitios antes de rendirse
       y tocar la nana sintetizada. El primero sigue mandando siempre:
       esto es sólo para que una canción que ya esté en el proyecto suene
       sin tener que copiarla dos veces. */
    musicaTambien: [
      "../assets/audio/musica.mp3",
      "../assets/audio/Musica.mp3",
    ],
    /* El sonido del búho. Va en la carpeta principal, al lado de
       `musica.mp3`. Si no está, se sintetiza uno. */
    misterio: "misterio.mp3",
    /* El sonido que se oye cuando el búho dice que oye algo. Va en la
       carpeta principal, al lado de `misterio.mp3`. */
    rag: "rag.mp3",
    cabana: {
      puertaAbre:  "Cabaña/door.open.mp3",
      puertaCierra:"Cabaña/door.close.mp3",
      escaleras:   "Cabaña/escaleras.mp3",
      cuarto:      "Cabaña/cuarto.mp3",
      cama:        "Cabaña/cama.mp3",
    },
    ambientes: {
      fogata:     "audio/fogata.mp3",
      grillos:    "audio/grillos.mp3",
      aire:       "audio/aire.mp3",
      lluvia:     "audio/lluvia.mp3",
      relampagos: "audio/relampagos.mp3",
      bosque:     "audio/bosque.mp3",
    },

    /* ---- SONIDOS SUELTOS ------------------------------------------
       Éstos NO van en bucle: suenan una vez, cuando pasa lo que tiene
       que pasar. Déjalos en `audio/` con estos nombres y se usan; si
       no están, se sintetizan como todo lo demás.

       Los truenos son una LISTA a propósito: con un solo archivo, la
       tormenta se convierte en el mismo ruido repetido cada veinte
       segundos, y eso se oye a la segunda vez. Con tres o cuatro
       distintos, y eligiendo al azar sin repetir el anterior, parece
       una tormenta. Pon los que quieras: la lista se lee entera.     */
    sueltos: {
      truenos: [
        "audio/trueno1.mp3",
        "audio/trueno2.mp3",
        "audio/trueno3.mp3",
      ],
      disparo:  "audio/disparo.mp3",
      recarga:  "audio/recarga.mp3",
      pasos:    "audio/pasos.mp3",
      buho:     "audio/buho.mp3",
      puerta:   "audio/puerta.mp3",
    },
  },

  /* ---- LOS AMBIENTES DEL PANEL ----------------------------------------
     El orden de aquí es el orden de las piedras alrededor de la fogata.
     `on` dice cuáles empiezan sonando, y `vol` con cuánto volumen.     */
  ambientes: [
    { id: "fogata",     icono: "🔥", nombre: "Fogata",   on: true,  vol: 0.55, color: "#ff9a4a" },
    { id: "grillos",    icono: "🦗", nombre: "Grillos",  on: true,  vol: 0.40, color: "#9fe08a" },
    { id: "aire",       icono: "🌬️", nombre: "Aire",     on: true,  vol: 0.30, color: "#a8c8f0" },
    { id: "bosque",     icono: "🌲", nombre: "Bosque",   on: false, vol: 0.35, color: "#6fb88a" },
    { id: "lluvia",     icono: "🌧️", nombre: "Lluvia",   on: false, vol: 0.40, color: "#8fb4e0" },
    { id: "relampagos", icono: "⚡", nombre: "Tormenta", on: false, vol: 0.45, color: "#e0d08a" },
  ],

  /* Cuánto tardan los volúmenes en subir y bajar. Nunca de golpe: un
     ambiente que entra a saco se oye como un fallo, no como un ambiente. */
  fundidoAudio: 1.1,        // segundos

  /* ---- EL BOMBÓN ------------------------------------------------------
     Los estados van por temperatura, de 0 a 1 y un poco más allá. Cada
     uno tiene su color y lo que se dice al comérselo.                  */
  bombon: {
    /* Cuánto se tuesta por segundo una cara puesta de lleno en la
       llama.

       Estaba en 0.22 y el bombón no se hacía: había que tenerlo dentro
       del fuego quince o veinte segundos para que se dorara, y como el
       palo además volvía solo a la hoguera, lo que pasaba de verdad es
       que se tostaba a medias sin que nadie hiciera nada y no había
       manera de acabar de hacerlo a propósito. Con 0.42, metido de
       lleno en la llama se dora en unos tres segundos y se quema en
       seis: da tiempo a girarlo y hay que estar pendiente. */
    calienta: 0.42,
    enfria: 0.055,          // cuánto baja por segundo lejos del fuego
    /* El alcance del calor, en radios de hoguera. Tiene que dejar
       FUERA el sitio de reposo del palo —si no, el bombón se cuece solo
       sin que nadie lo acerque— y DENTRO, con fuerza, la llama. Con el
       palo descansando a unos 170 píxeles de la hoguera, 4.6 radios
       (unos 150) deja las dos cosas. */
    radioCalor: 1.0,

    /* ---- LA FÍSICA ----
       El palo es una varilla con inercia colgada del mango, y el bombón
       cuelga de su punta con un muelle corto. Estos números son todo lo
       que hay que tocar para que se sienta más pesado o más ágil. */
    fisica: {
      /* Cogido, el palo no tiene muelle: PERSIGUE al dedo. Éste es lo
         rápido que lo alcanza; cuanto más alto, más pegado va. */
      sigueDedo: 30,
      /* Y suelto, lo que tarda en pararse lo que llevara de impulso. */
      frenoSuelto: 6,
      muellePalo: 130,      // sólo para recolocar al girar el teléfono
      frenoPalo: 15,        // y cuánto se frena. Bajo = más bamboleo
      pesoPalo: 2.6,        // cuánto lo vence la gravedad estando en cruz
      muelleLargo: 150,     // lo mismo para estirarlo y encogerlo
      frenoLargo: 17,
      muelleBombon: 320,    // el muelle del bombón a la punta
      frenoBombon: 13,
      gravedad: 190,        // px/s² sobre el bombón. No es 9.8: es dibujo
      cuelga: 0.42,         // cuánto cuelga por debajo de la punta, en radios
      maxSeparacion: 1.3,   // hasta dónde puede irse de la punta, en radios
    },

    /* ---- EL CALOR ----
       `masa` es la inercia térmica: cuánto tarda en coger la temperatura
       del sitio donde está. Es LA cifra importante, porque es la que
       hace que siga tostándose un rato después de sacarlo del fuego. */
    masa: 0.8,
    /* Por debajo de esto no se tuesta nada: el azúcar necesita un
       mínimo para empezar a dorarse. Es lo que hace que acercarlo un
       poco no sirva de nada y haya que meterlo de verdad. */
    umbral: 0.16,
    /* Cuántos lados se tuestan por separado. Con seis, girarlo se nota
       y no cuesta nada. */
    lados: 6,
    /* Cuánto calor se reparte entre lados vecinos por segundo: el
       azúcar conduce, así que un lado muy tostado calienta a los de al
       lado. Sin esto salían seis gajos de colores y parecía una pelota
       de playa. */
    conduce: 0.55,
    /* La probabilidad, por segundo, de que se prenda de golpe cuando ya
       está muy caliente. Es lo que hace que ninguna tostada sea igual. */
    sorpresa: 0.10,
    estados: [
      /* Crema y no blanco puro: con `#fffaf0` el bombón crudo entraba
         de lleno en el brillo del postprocesado y se convertía en una
         mancha blanca del tamaño de la hoguera. Sigue leyéndose como
         un bombón sin tostar, pero ya no deslumbra. */
      { hasta: 0.14, id: "crudo",      nombre: "crudo",       color: ["#f7eedd", "#e2d3ba"] },
      { hasta: 0.34, id: "calentando", nombre: "calentando",  color: ["#fbe7bd", "#ecd08e"] },
      { hasta: 0.56, id: "dorado",     nombre: "dorado",      color: ["#e8b468", "#c2822f"] },
      { hasta: 0.76, id: "tostado",    nombre: "tostado",     color: ["#b8702f", "#7d4418"] },
      { hasta: 0.92, id: "quemandose", nombre: "quemándose",  color: ["#7a4420", "#3e1e0c"] },
      { hasta: 99,   id: "quemado",    nombre: "quemado",     color: ["#2e2420", "#100c0a"] },
    ],
  },

  /* ---- LO QUE SE DICE AL COMÉRSELO ------------------------------------
     Una lista por estado. Se saca una al azar, sin repetir hasta que se
     acaben.                                                            */
  alComer: {
    crudo: [
      "Está crudito, ¿eh? 😅",
      "Este malvavisco tiene frío.",
      "Ni lo acercaste al fuego, mi vida.",
      "Bueno. Cuenta como botana.",
    ],
    calentando: [
      "Casi. Le faltaba un poquito.",
      "Tibiecito. Como el café que se te olvida.",
      "Un ratito más y era el bueno.",
      "Le faltaban diez segundos. Diez.",
    ],
    dorado: [
      "Mmm… quedó perfecto 🤍",
      "Dorado justo. Oye, qué mano tienes.",
      "Ese era. Justo ese era el que yo quería.",
      "Crujiente por fuera y derretido por dentro. Perfecto.",
      "Te quedó de revista.",
    ],
    tostado: [
      "Uy… está calientito 🫦",
      "Uf, ese venía con carácter.",
      "Sopla, sopla, que te quemas.",
      "Un poco pasadito, pero de los buenos.",
    ],
    quemandose: [
      "Creo que me pasé de fuego…",
      "Le soplé, pero poquito.",
      "Bueno… por fuera se ve interesante.",
      "Se me pasó la mano un poquito.",
    ],
    quemado: [
      "JAJAJA lo quemé 😭",
      "Carbón. Delicioso carbón.",
      "Esto ya no es un malvavisco, es arqueología.",
      "Ya. El siguiente sale mejor. Seguro. Casi seguro.",
      "Lo convertí en un mineral.",
    ],
  },

  /* ---- TOCAR LA LLAMA -------------------------------------------------- */
  alQuemarse: [
    "Espérate… está caliente…",
    "¡Auch! 🔥",
    "Te dije que no tocaras el fuego 😭",
    "Ya, ya, ya no lo toco.",
    "Es fuego. FUEGO. Literalmente fuego.",
    "Mi dedo y yo aprendimos algo hoy.",
  ],

  /* ---- LA LUNA --------------------------------------------------------- */
  alTocarLuna: [
    "¿Estás viendo la luna ahorita?",
    "Te extraño tanto :c",
    "Qué bonito sería verla contigo.",
    "Raionetas… ¿tú también estarás viendo la luna? 🤍",
    "Aunque estemos lejos, es el mismo cielo.",
    "Dicen que la luna guarda lo que le cuentas. Yo ya le conté bastantes cosas.",
    "Si la vemos al mismo tiempo, casi es como estar juntos.",
    "Está igual de lejos de los dos. Eso me gusta :>",
    "Le pedí que te diera las buenas noches de mi parte.",
    "Un día te llevo a un lugar donde se vea así de grande.",
  ],
  /* Y si ya han pasado cosas, cambia de tema. Ver EASTER EGGS. */
  lunaDespues: [
    "Ahora que leíste la carta… ya sabes lo que pienso.",
    "El búho me dijo que ya te vio. Te anda cuidando.",
    "Con la fogata apagada se ve mejor, ¿verdad?",
  ],

  /* ---- LA LUZ VERDE DEL BOSQUE ----------------------------------------- */
  bosqueSecreto: {
    /* Dónde está, en partes de la pantalla. Muy metida en el fondo, y al
       lado CONTRARIO de la cabaña: puesta del mismo lado, el área
       táctil de la cabaña —que es grande, porque una casa es grande— se
       tragaba el toque y la luz no se podía coger nunca. */
    x: 0.285, y: 0.545,
    antes: [
      "Te extraño, mi vida.",
      "Ojalá pudiera estar contigo ahorita.",
    ],
    /* Y la carta. Cada línea, un párrafo. */
    carta: [
      "Encontraste esto en lo más hondo del bosque, que es justo donde lo dejé.",
      "No sé escribir cartas bonitas, pero llevo días queriendo decirte esto y por teléfono se me olvida.",
      "Nunca dejaré de amarte. Estamos unidos por la eternidad, aunque nos separen los kilómetros, las horas o lo que sea que se le ocurra al mundo.",
      "Si alguna vez tienes una noche fea, vuelve aquí. La fogata sigue encendida y yo sigo aquí.",
    ],
    firma: "Con amor,\nYonathan\npara ti, mi vida 🤍",
  },

  /* ---- LO QUE SE LEE AL DORMIR ------------------------------------------ */
  alDormir: [
    "Buenas noches, mi vida.",
    "Que sueñes con algo tonto y bonito.",

const clamp  = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = (v) => clamp(v, 0, 1);
const mez    = (a, b, t) => a + (b - a) * t;
const suave3 = (t) => { t = clamp01(t); return t * t * (3 - 2 * t); };

/**
 * Amortiguación independiente de los fotogramas.
 *
 * `actual += (objetivo - actual) * 0.1` es la forma de siempre y está
 * MAL: a 120 Hz llega al doble de rápido que a 60. Con la exponencial,
 * el mismo recorrido en el mismo tiempo en cualquier pantalla.
 */
const damp = (actual, objetivo, k, dt) => objetivo + (actual - objetivo) * Math.exp(-k * dt);

/**
 * Lee un color y devuelve sus tres canales.
 *
 * Entiende `#rrggbb` Y `rgb(r,g,b)`, y esto último no es un capricho:
 * `mezColor` devuelve `rgb(...)`, así que en cuanto se mezcla el
 * resultado de otra mezcla —que es justo lo que hace el bombón al
 * interpolar dentro de su estado— hay que saber volver a leerlo. Con un
 * lector que sólo entendía hexadecimal, salía `rgb(NaN,NaN,…)`.
 */
function leerColor(c) {
  if (c[0] === "#") {
    return [
      parseInt(c.slice(1, 3), 16),
      parseInt(c.slice(3, 5), 16),
      parseInt(c.slice(5, 7), 16),
    ];
  }
  const n = c.match(/[\d.]+/g);
  return n ? [Number(n[0]), Number(n[1]), Number(n[2])] : [0, 0, 0];
}

/**
 * Un halo OVALADO, con el degradado ovalado también.
 *
 * ── EL FALLO QUE ARREGLA ─────────────────────────────────────────────
 * Lo natural es pedir un degradado radial y rellenar con él una elipse
 * aplastada. Pero un degradado radial es un CÍRCULO: si su radio es 275
 * y la elipse sólo mide 92 de alto, arriba y abajo la elipse se acaba
 * cuando el degradado va por su tercera parte —todavía casi opaco— y lo
 * que se ve es el CANTO de la elipse recortado en seco. En la escena
 * salía un arco gris enorme colgando de la cabaña, como un aro.
 *
 * La solución es no aplastar el relleno sino el LIENZO: se escala el
 * eje Y, se pinta un círculo de verdad y se deshace la escala. Así el
 * degradado se aplasta con la forma y se apaga justo en el borde.
 */
function haloOvalado(x, y, rx, ry, paradas, cy = y) {
  /* ---- El portero ----
     Con `rx` o `ry` a cero, la escala de abajo divide entre cero y el
     centro del degradado sale NaN: `createRadialGradient` lanza y se
     lleva por delante el fotograma entero. Pasa de verdad —un bicho que
     entra desde escala cero, un halo que se apaga del todo— y cuesta
     una línea evitarlo. */
  if (!(rx > 0.01) || !(ry > 0.01) || !Number.isFinite(x) || !Number.isFinite(y)) return;
  ctx.save();
  ctx.translate(x, cy);
  ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, (y - cy) * (rx / ry), 0, 0, (y - cy) * (rx / ry), rx);
  for (const [t, col] of paradas) g.addColorStop(t, col);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, rx, 0, 6.283);
  ctx.fill();
  ctx.restore();
}

/** Mezcla dos colores. Vale hexadecimal, `rgb(…)` o una mezcla de ambos. */
function mezColor(c1, c2, t) {
  const [r1, g1, b1] = leerColor(c1), [r2, g2, b2] = leerColor(c2);
  return `rgb(${Math.round(mez(r1, r2, t))},${Math.round(mez(g1, g2, t))},${Math.round(mez(b1, b2, t))})`;
}

/** Un azar REPETIBLE: el mismo bosque cada vez que se mide la pantalla. */
let semilla = 20240214;
function rnd() {
  semilla = (semilla * 1664525 + 1013904223) % 4294967296;
  return semilla / 4294967296;
}
const sembrar = (s) => { semilla = s; };

/**
 * Saca uno de una lista SIN repetir hasta agotarla.
 *
 * Con `Math.random()` a secas salían dos veces seguidas la misma frase
 * cada dos por tres, y una frase repetida mata el encanto al instante.
 */
function barajador(lista) {
  let bolsa = [];
  return () => {
    if (!bolsa.length) bolsa = lista.slice();
    const i = Math.floor(Math.random() * bolsa.length);
    return bolsa.splice(i, 1)[0];
  };
}

/** Una promesa que se resuelve sola a los tantos milisegundos. */
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));

const suaveMovimiento = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ==========================================
// ESCENA Y MEDIDAS
// ==========================================
//
// El lienzo, el tamaño, el parallax y la cámara. Todo lo que se dibuja
// se mide contra `U`, que es la centésima parte del lado corto: así la
// escena entera se adapta a cualquier pantalla sin un solo número
// escrito a mano en píxeles.

const raiz   = document.getElementById("noche");
const lienzo = document.getElementById("lienzo");
const zona   = document.getElementById("toque");
const ctx    = lienzo.getContext("2d", { alpha: false });

let A = 0, H = 0, dpr = 1, U = 1;
let apaisado = false;
let flojo = false;                 // el móvil no da: ver OPTIMIZACIÓN

/* El parallax: hacia dónde mira la escena, de -1 a 1. */
const par = { x: 0, y: 0, ox: 0, oy: 0 };

/* La cámara de las cinemáticas: escala y desplazamiento. */
const cam = { z: 1, x: 0, y: 0, oz: 1, ox: 0, oy: 0 };

/* La sacudida (al quemarse, al caer un rayo). */
const meneo = { fuerza: 0, t: 0 };

/* En qué escena estamos. */
let escena = "bosque";             // bosque · habitacion · durmiendo
let bloqueado = false;             // durante una cinemática no se toca nada

/* ---- EL SITIO QUE SE QUEDA EL LIBRITO -----------------------------------

   Esta página se puede abrir sola o ir dentro del librito. Dentro, el
   librito pone DOS BOTONES REDONDOS de pasar hoja por encima de todo:
   abajo pegados a los cantos en vertical, y a media altura en apaisado.
   Lo que quede debajo de uno de ellos no se puede tocar nunca, porque
   el toque ni siquiera llega a esta página.

   Así que aquí se calcula dónde caen y se les deja el sitio. No es una
   suposición sobre el librito: es el mismo número que usa él, y si un
   día cambia, lo peor que pasa es que se reserve un poco de más.

   Sola, esta página no reserva nada: no hay botones que esquivar.    */

const dentroDelLibro = (() => {
  try { return window.self !== window.top; } catch { return true; }
})();

/**
 * Dónde está esta página dentro de la ventana del librito.
 *
 * Hace falta porque los botones de pasar hoja van pegados a los cantos
 * de LA VENTANA, no a los de la página. En vertical la página ocupa
 * todo el ancho y da igual, pero en apaisado la hoja se queda centrada
 * y más estrecha, y entonces los dos botones caen FUERA: reservarles
 * sitio ahí sería apartar cosas de un botón que no está.
 *
 * Devuelve `null` si no se puede mirar —otro dominio, sin marco— y
 * entonces se supone lo peor: que la página llena la ventana.
 */
function marcoDelLibro() {
  if (!dentroDelLibro) return null;
  try {
    const fe = window.frameElement;
    if (!fe) return null;
    const r = fe.getBoundingClientRect();
    const W = window.parent.innerWidth, Hh = window.parent.innerHeight;
    if (!W || !Hh) return null;
    return { W, H: Hh, ox: r.left, oy: r.top };
  } catch {
    return null;
  }
}

/** Los círculos que hay que dejar libres, en coordenadas de la escena. */
function zonasDelLibro() {
  if (!dentroDelLibro) return [];
  /* 3.15rem de botón y 8 px de margen, que es lo que pone su hoja de
     estilos. El radio se infla un poco: un botón que se puede tocar por
     el canto necesita más sitio del que ocupa. */
  const r = 25.2, m = 8, rr = r * 1.45;
  const marco = marcoDelLibro();
  const W = marco ? marco.W : A, Hh = marco ? marco.H : H;
  const ox = marco ? marco.ox : 0, oy = marco ? marco.oy : 0;
  /* Él decide por la forma de LA VENTANA, no por la de la hoja. */
  const apaisadoLibro = W > Hh * 1.15;
  /* En vertical van a 4.5rem del suelo; en apaisado, a media altura. */
  const cy = apaisadoLibro ? Hh * 0.5 : Hh - 72 - r;
  const fuera = [];
  for (const cx of [m + r, W - m - r]) {
    /* De coordenadas de la ventana a las de esta página. */
    const x = cx - ox, y = cy - oy;
    /* Y si cae del todo fuera de la hoja, no estorba a nadie. */
    if (x + rr < 0 || x - rr > A || y + rr < 0 || y - rr > H) continue;
    fuera.push({ x, y, r: rr });
  }
  return fuera;
}

/** ¿Este punto de la pantalla lo tapa un botón de pasar hoja? */
function tapadoPorElLibro(x, y) {
  for (const z of zonasDelLibro()) {
    if (Math.hypot(x - z.x, y - z.y) < z.r) return true;
  }
  return false;
}

/**
 * Aparta un punto de la pantalla de los botones de pasar hoja.
 *
 * Devuelve el MISMO punto si ya estaba libre, y si no, el más cercano
 * que lo esté. Se usa para colocar las cosas fijas de la escena —un
 * reloj recargado en un árbol, una escopeta en el suelo— que si no se
 * pueden quedar debajo de un botón para siempre.
 */
function apartarDelLibro(x, y) {
  for (const z of zonasDelLibro()) {
    const d = Math.hypot(x - z.x, y - z.y);
    if (d >= z.r) continue;
    if (d < 0.001) return { x: z.x + z.r, y };
    const k = z.r / d;
    return { x: z.x + (x - z.x) * k, y: z.y + (y - z.y) * k };
  }
  return { x, y };
}

function medir() {
  const r = raiz.getBoundingClientRect();
  if (!r.width || !r.height) return;
  A = r.width; H = r.height;
  apaisado = A > H * 1.15;
  U = Math.min(A, H) / 100;
  dpr = Math.min(window.devicePixelRatio || 1, flojo ? CONF.perf.dprMaxFlojo : CONF.perf.dprMax);
  lienzo.width  = Math.round(A * dpr);
  lienzo.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  /* `typeof` y no una comprobación normal: `medir()` se llama desde el
     ResizeObserver, que puede dispararse antes de que el módulo del
     brillo se haya declarado. */
  if (typeof medirBrillo === "function") medirBrillo();
  construirMundo();
}

/* Se mide el CONTENEDOR, no la ventana: esta página puede vivir dentro
   de la hoja de un libro, y una hoja no es la pantalla. */
new ResizeObserver(medir).observe(raiz);

/* ---- Dónde está cada cosa ---------------------------------------------
   Se calcula una vez por medida y se guarda. Son los puntos de anclaje
   de toda la escena: el resto se coloca en relación a ellos.          */

const sitio = {
  fogata:  { x: 0, y: 0, r: 0 },
  cabana:  { x: 0, y: 0, w: 0, h: 0 },
  luna:    { x: 0, y: 0, r: 0 },
  cajita:  { x: 0, y: 0, r: 0 },
  secreto: { x: 0, y: 0, r: 0 },
  horizonte: 0,
  suelo: 0,
};

/**
 * Cuánto hay que dejar libre abajo.
 *
 * Si esta página va suelta, es el margen seguro del móvil (la barra de
 * gestos). Si va dentro del librito, él además presta `--hueco-barra`
 * con lo que ocupa su barra flotante y sus flechas de pasar página.
 *
 * Sin esto, las piedras de los ambientes caían justo debajo de las
 * flechas del libro y no se podían tocar.
 */
function huecoAbajo() {
  const cs = getComputedStyle(raiz);
  const leer = (n) => {
    const v = cs.getPropertyValue(n).trim();
    if (!v) return 0;
    if (v.endsWith("rem")) return parseFloat(v) * 16;
    return parseFloat(v) || 0;
  };
  return leer("--seguro-b") + leer("--barra");
}

function colocarSitios() {
  const abajo = huecoAbajo();
  sitio.horizonte = H * (apaisado ? 0.56 : 0.60);
  sitio.suelo     = H * (apaisado ? 0.74 : 0.78) - abajo * 0.5;

  /* ---- LA CABAÑA ----
     Va primero porque es el ancla: está plantada en el suelo, a un lado
     fijo, y no se mueve. Todo lo demás se coloca esquivándola. */
  const ladoCabana = apaisado ? 0.80 : 0.755;
  sitio.cabana.w = U * (apaisado ? 26 : 32);
  sitio.cabana.h = sitio.cabana.w * 0.82;
  sitio.cabana.x = A * ladoCabana;
  sitio.cabana.y = sitio.suelo - U * 2;

  /* ---- EL CAMPAMENTO, ENCAJADO ----
     La fogata no va en un sitio fijo: va DONDE CABE. Estaba escrita a
     mano —`H * 0.845`— y funcionaba en un móvil de pie y en ningún
     sitio más: en una tableta la fila de pastillas de sonido caía justo
     encima del corro de piedras, y tumbado la hoguera se comía media
     fila.

     Tiene que dejar aire con tres cosas, y las tres mandan más que
     ella: la fila de ambientes —que va centrada abajo y no se puede
     mover—, el rótulo que va encima de la fila, y la cabaña.

     Primero se intenta BAJARLA hasta donde la fila le deje. Si para eso
     hubiera que subirla tanto que se despegara del suelo, no sube: se
     APARTA de lado. Y si apartándose se le echa encima la cabaña, se
     aparta más. El que se mueve siempre es el campamento, porque es el
     único que puede. */
  const fila = medidaDeLaFila();
  sitio.fogata.r = U * (apaisado ? 7.4 : 8.4);
  const rF = sitio.fogata.r;
  /* La fogata sube lo que ocupe la barra del libro: con ella y el arco
     de piedras pegados al canto, las flechas de pasar página caían
     justo encima y no se podía tocar ninguna. */
  const suyo = H * (apaisado ? 0.775 : 0.845) - abajo * 0.9;
  /* `U * 6` de aire y no `U * 2`: entre la fila y la hoguera va además
     el rótulo de «toca para prender», que no se toca pero sí se ve, y
     ocupa su línea de texto más su respiro. Con `U * 4` le pasaba el
     corro de piedras por encima de las letras por cinco píxeles. */
  const tope = fila.y - fila.h * 0.62 - U * 6 - rF * 1.45;
  /* El suelo no es una frontera dura —la hierba sigue por debajo—, así
     que la hoguera puede subir un poco por encima de la línea sin que
     se note. Hasta `U * 3` no lo nota nadie; hasta `U * 9` se aguanta
     si no queda otra; más arriba se planta en mitad de la pantalla y
     deja de estar en el suelo. */
  const holgado = sitio.suelo - U * 3;
  const forzado = sitio.suelo - U * 9;

  let fx = A * (apaisado ? 0.44 : 0.50);
  if (tope >= holgado) {
    sitio.fogata.y = Math.min(suyo, tope);
  } else {
    /* No cabe abajo. Primero se prueba a APARTARLA de lado, que no se
       nota nada; de lado sólo cabe si la cajita musical, que va a su
       izquierda, no se sale por el canto. Y si de lado tampoco hay
       sitio, entonces sí se sube, aunque se despegue un poco. */
    const sitioIzq = fila.x0 - U * 2 - rF * 1.7;
    const minimo = U * (apaisado ? 27 : 30);
    if (sitioIzq >= minimo) {
      sitio.fogata.y = suyo;
      fx = Math.min(fx, sitioIzq);
    } else {
      sitio.fogata.y = Math.min(suyo, Math.max(tope, forzado));
    }
  }

  /* Y ahora a lo ancho, contra la cabaña. Lo que se comparan son las
     bandas donde cada uno TOCA EL SUELO, no sus siluetas: si la hoguera
     queda por debajo de la cabaña está delante de ella y las llamas
     pueden subirle por la fachada todo lo que quieran, que es de hecho
     lo bonito. Comparando siluetas, en un móvil de pie la hoguera salía
     huyendo al canto izquierdo por once píxeles de llama. */
  const altoF = [sitio.fogata.y - rF * 0.75, sitio.fogata.y + rF];
  const altoC = [sitio.cabana.y - sitio.cabana.h * 0.12, sitio.cabana.y + sitio.cabana.h * 0.12];
  if (altoF[0] < altoC[1] && altoF[1] > altoC[0]) {
    fx = Math.min(fx, sitio.cabana.x - sitio.cabana.w * 0.72 - U * 2 - rF * 1.7);
  }
  /* Sin pasarse: la cajita musical va a su izquierda y tiene que caber. */
  sitio.fogata.x = Math.max(fx, U * (apaisado ? 27 : 30));

  /* La luna, arriba y al otro lado, para que no compita con la cabaña. */
  sitio.luna.x = A * 0.21;
  sitio.luna.y = H * (apaisado ? 0.17 : 0.155);
  sitio.luna.r = U * (apaisado ? 6.6 : 7.2);

  /* La cajita musical, en una piedra al lado de la fogata. Y sin
     salirse por el canto: si la hoguera se ha tenido que apartar, la
     cajita se le va detrás y en una pantalla estrecha se quedaba con
     media caja fuera. */
  sitio.cajita.x = Math.max(U * 7, sitio.fogata.x - U * (apaisado ? 19 : 22));
  sitio.cajita.y = sitio.fogata.y + U * 2.6;
  sitio.cajita.r = U * 5.4;

  /* Y la luz verde, metida en el bosque. */
  colocarSendero();
  sitio.secreto.x = A * CONF.bosqueSecreto.x;
  sitio.secreto.y = mez(sitio.horizonte, sitio.suelo, 0.42);
  sitio.secreto.r = U * 5;
}

/* ---- El parallax ------------------------------------------------------
   Todas las capas se desplazan con `par`, cada una con su factor: las
   de atrás casi nada, las de delante mucho. Eso es TODA la profundidad
   de esta escena, y no cuesta nada.                                    */

function desplazar(factor) {
  return {
    x: par.x * U * factor,
    y: par.y * U * factor * 0.42,
  };
}

/* ---- La sacudida ------------------------------------------------------ */

function sacudir(fuerza) {
  meneo.fuerza = Math.max(meneo.fuerza, fuerza);
  meneo.t = 0;
}

/* ---- Frases flotantes -------------------------------------------------
   Se crean unas cuantas cajas y se reciclan. En una escena que puede
   soltar varias por segundo, crear y tirar nodos hace saltar el
   recolector justo encima de una animación.                            */

const capaDichos = document.getElementById("dichos");
const elVivo     = document.getElementById("vivo");
const librasDichos = [];
const dichosVivos  = [];

for (let i = 0; i < 9; i++) {
  const el = document.createElement("div");
  el.className = "ne-dicho";
  /* Cada caja lleva dentro un nodo de texto y un cursor. Separados, para
     poder escribir letra a letra sin tirar el cursor en cada cuadro. */
  el.append(document.createTextNode(""));
  const cur = document.createElement("span");
  cur.className = "ne-cursor";
  cur.textContent = "|";
  cur.hidden = true;
  el.append(cur);
  capaDichos.append(el);
  librasDichos.push(el);
}

/** Pone el texto de una caja sin tocar su cursor. */
function ponerTexto(el, txt) { el.firstChild.nodeValue = txt; }

/**
 * Suelta una frase en (x, y).
 *
 * @param {number} x  dónde, en píxeles
 * @param {number} y  dónde, en píxeles
 * @param {string} texto
 * @param {{mimo?:boolean, dur?:number, importante?:boolean}} [op]
 */
/* ---- CUÁNTAS SE VEN A LA VEZ, Y CUÁNTO ---------------------------------

   ── EL PROBLEMA QUE HABÍA ────────────────────────────────────────────
   El sistema aguantaba NUEVE burbujas a la vez y las colocaba sin
   pisarse. Colocarlas bien no era el problema: el problema es que nueve
   frases en pantalla son un muro de texto encima del bosque, y quien
   juega deja de leerlas a la tercera.

   ── LA REGLA DE AHORA ────────────────────────────────────────────────
   DOS. Como mucho dos a la vez, y punto. Cuando llega una tercera, la
   más vieja no se borra de golpe: se le manda salir —le quedan dos
   décimas de desvanecido— y la nueva entra mientras aquélla se va. Eso
   es lo que hace que la pantalla no se llene nunca y que aun así no se
   vea a nadie desaparecer de repente.

   ── Y DURAN UN SEGUNDO ───────────────────────────────────────────────
   Aproximadamente. Un segundo clavado para todas sería ilegible en las
   largas, así que la duración sale del LARGO del texto: una frase corta
   dura poco más de un segundo y una larga llega a algo más de dos. Lo
   que no hace ninguna es quedarse.                                    */

const MAX_DICHOS = 2;
let ultimoDicho = -99;
let ultimoTexto = "";
const HUECO_DICHO = 0.35;         // segundos entre frases corrientes

/** Cuánto vive una frase, según lo que hay que leer. */
function duraDicho(texto, importante) {
  const base = 0.95 + texto.length * 0.021;
  return clamp(base, 1, importante ? 2.6 : 2.1);
}

/** Manda salir a una frase: no la borra, la despide. */
function despedirDicho(d) {
  if (d.saliendo) return;
  d.saliendo = true;
  /* Se le reescribe la vida para que le queden justo las dos décimas
     del desvanecido y ni una más. */
  d.dur = d.t + 0.22;
  d.salida = 0.22;
}

function decir(x, y, texto, op = {}) {
  if (!op.importante) {
    if (texto === ultimoTexto && reloj - ultimoDicho < 4) return;
    if (reloj - ultimoDicho < HUECO_DICHO) return;
  }
  ultimoDicho = reloj;
  ultimoTexto = texto;
  elVivo.textContent = texto;

  /* ---- Hacer sitio ----
     Si ya hay dos que no se están yendo, se despide a la más vieja. Se
     cuentan sólo las que NO se están yendo: las que ya están de salida
     no ocupan sitio, están desapareciendo. */
  let enPie = dichosVivos.filter((d) => !d.saliendo);
  while (enPie.length >= MAX_DICHOS) {
    let viejo = enPie[0];
    for (const d of enPie) if (d.t > viejo.t) viejo = d;
    despedirDicho(viejo);
    enPie = enPie.filter((d) => d !== viejo);
  }

  let el = librasDichos.pop();

  /* Y si aun así no queda caja libre —porque las que se van todavía la
     están usando—, se le quita el sitio a la más vieja de todas. Una
     frase que se dispara y no se ve no es una frase, es un fallo. */
  if (!el) {
    let viejo = -1, masT = -1;
    for (let i = 0; i < dichosVivos.length; i++) {
      if (dichosVivos[i].t > masT) { masT = dichosVivos[i].t; viejo = i; }
    }
    if (viejo >= 0) { el = dichosVivos[viejo].el; dichosVivos.splice(viejo, 1); }
  }
  if (!el) return;

  /* Para medir la caja hace falta que tenga YA su texto entero: si se
     mide vacía —como haría falta para escribirla letra a letra— sale un
     ancho de cero y la frase se coloca en el sitio equivocado. Así que
     se pone completa, se mide, y luego se recorta. */
  ponerTexto(el, texto);
  el.classList.toggle("ne-mimo", !!op.mimo);
  el.classList.toggle("ne-misterio", !!op.misterio);
  el.querySelector(".ne-cursor").hidden = !op.misterio;
  el.style.opacity = "0";
  el.style.filter = "";

  /* El margen sale del ANCHO REAL de la caja, medido ya con su texto:
     una frase larga centrada se sale por el canto si se usa un margen
     fijo, porque lo que hay que dejar libre es media caja. */
  const medio = el.offsetWidth / 2 + 10;
  const alto  = el.offsetHeight || 36;

  /* ---- DÓNDE SE PONE, QUE ES LO QUE MÁS IMPORTA ----
     Antes sólo subía en línea recta buscando fila libre de otras
     frases. Eso deja dos agujeros grandes:

       · TAPA LO QUE ACABAS DE TOCAR. Atrapas una estrella fugaz y la
         frase sale justo encima, así que lo único que no ves es la
         estrella. Lo mismo con cada easter egg: la recompensa de
         encontrarlo es un cartel tapándolo.
       · TAPA EL DEDO. Con el dedo apoyado, la frase sale debajo de la
         mano y no se lee.

     Ahora se prueban sitios ALREDEDOR —arriba, arriba a los lados, los
     lados, y abajo si no queda otra— y gana el primero que no pise: ni
     lo que se acaba de tocar, ni el dedo, ni otra frase, ni las flechas
     de pasar página del librito. Sólo si no hay ninguno libre se pone
     arriba a lo bruto, que es mejor que no decir nada. */
  const guarda = Math.max(U * 9, (op.guarda ?? 0));
  const sitios = [
    [0, -U * 8], [0, -U * 8 - alto - 12], [0, -U * 8 - (alto + 12) * 2],
    [-(medio + guarda * 0.8), -U * 5], [medio + guarda * 0.8, -U * 5],
    [-(medio + guarda * 0.8), -U * 10], [medio + guarda * 0.8, -U * 10],
    [0, U * 9 + alto * 0.5], [0, -U * 8 - (alto + 12) * 3],
  ];

  let px = clamp(x, medio, Math.max(medio, A - medio));
  let py = null;
  for (const [ox, oy] of sitios) {
    const cx = clamp(x + ox, medio, Math.max(medio, A - medio));
    const cy = clamp(y + oy, U * 9 + alto * 0.5, H - U * 12);

    /* ¿Tapa lo que se acaba de tocar? Se mide caja contra círculo. */
    if (Math.abs(cx - x) < medio + guarda && Math.abs(cy - y) < alto * 0.5 + guarda) continue;
    /* ¿Y el dedo, si está apoyado? */
    if (dedo.dentro
        && Math.abs(cx - dedo.x) < medio + U * 6
        && Math.abs(cy - dedo.y) < alto * 0.5 + U * 6) continue;
    /* ¿Otra frase? */
    let libre = true;
    for (const v of dichosVivos) {
      if (Math.abs(cx - v.x) < medio + v.medio && Math.abs(cy - v.y) < (alto + v.alto) * 0.5 + 20) {
        libre = false; break;
      }
    }
    if (!libre) continue;
    /* ¿Las flechas del librito? */
    if (tapadoPorElLibro(cx, cy) || tapadoPorElLibro(cx - medio, cy)
        || tapadoPorElLibro(cx + medio, cy)) continue;

    px = cx; py = cy; break;
  }
  if (py === null) py = clamp(y - U * 8, U * 9 + alto * 0.5, H - U * 12);

  /* Las del misterio se escriben. El tiempo de escritura sale del largo
     del texto, no de un número fijo: una frase corta escrita despacio se
     hace eterna y una larga escrita deprisa no se lee. */
  /* Y se escribe en como mucho la mitad de lo que dura: si tardara más
     en escribirse que en vivir, la frase se iría sin llegar a estar
     entera nunca. */
  const dur = clamp(op.dur ?? duraDicho(texto, op.importante),
    1, op.importante ? 3.4 : 2.4);
  const escribe = op.misterio ? Math.min(clamp(texto.length * 0.03, 0.4, 1.2), dur * 0.45) : 0;
  if (escribe) ponerTexto(el, "");

  dichosVivos.push({
    el, x: px, y: py, medio, alto,
    t: 0, dur,
    saliendo: false, salida: 0.24,
    deriva: azar(-8, 8),
    importante: !!op.importante,
    texto, escribe, escritas: -1,
    /* Cuánto se inclina al entrar: un pelín, y a un lado u otro. Que no
       todas entren rectas es lo que hace que no parezcan un sistema. */
    giro: azar(-2.2, 2.2),
  });
}

function moverDichos(dt) {
  for (let i = dichosVivos.length - 1; i >= 0; i--) {
    const d = dichosVivos[i];
    d.t += dt;
    const k = d.t / d.dur;
    if (k >= 1) {
      d.el.style.opacity = "0";
      d.el.style.filter = "";
      librasDichos.push(d.el);
      dichosVivos.splice(i, 1);
      continue;
    }

    /* ---- Escribir a máquina ----
       Se recorta el texto sólo cuando cambia el número de letras. Tocar
       el DOM en cada cuadro para escribir la misma cadena obliga al
       navegador a rehacer el trazado de la caja sesenta veces por
       segundo para nada. */
    if (d.escribe) {
      const n = Math.min(d.texto.length,
        Math.floor(clamp01(d.t / d.escribe) * d.texto.length + 0.0001));
      if (n !== d.escritas) {
        d.escritas = n;
        ponerTexto(d.el, d.texto.slice(0, n));
        if (n >= d.texto.length) d.el.querySelector(".ne-cursor").hidden = true;
      }
    }

    /* ---- La entrada ----
       Un muelle que se pasa un poco y vuelve, no una rampa. La
       diferencia entre que la frase «aparezca» y que la frase «llegue»
       son exactamente estos tres términos. */
    /* Con frases de un segundo, la entrada tiene que ser MÁS RÁPIDA en
       proporción: si ocupara el 16% como antes, una frase de un segundo
       se pasaría dos décimas enteras apareciendo. Se mide en segundos
       de verdad y no en porcentaje de la vida. */
    const ke = clamp01(d.t / 0.14);
    const muelle = 1 - Math.pow(1 - ke, 3) * Math.cos(ke * 7.2) ;
    const entra = suave3(d.t / 0.1);
    /* Y la salida arranca a falta de `d.salida` segundos para el final,
       sea la frase larga o corta. Despedir a una frase a mitad de vida
       —porque ha llegado una tercera— es exactamente cambiarle `dur`:
       la salida se recoloca sola. */
    const queda = d.dur - d.t;
    const sale  = clamp01(queda / d.salida);
    const sube  = (1 - Math.pow(1 - clamp01(k / 0.85), 3)) * 24;
    const bal   = Math.sin(d.t * 1.4) * 3;
    /* Al irse se desenfoca un pelín: es lo que hace que se deshaga en el
       aire en vez de apagarse como una bombilla. */
    const borrosa = (1 - sale) * 2.4;

    d.el.style.opacity = String(entra * sale);
    d.el.style.filter = borrosa > 0.05 ? `blur(${borrosa.toFixed(2)}px)` : "";
    d.el.style.transform =
      `translate3d(${(d.x + d.deriva * k + bal).toFixed(1)}px, ${(d.y - sube).toFixed(1)}px, 0)` +
      ` translate(-50%, -50%)` +
      ` rotate(${(d.giro * (1 - ke)).toFixed(2)}deg)` +
      ` scale(${(0.86 + muelle * 0.14).toFixed(3)})`;
  }
}

// ==========================================
// SISTEMA DE AUDIO
// ==========================================
//
// ── POR QUÉ CADA SONIDO TIENE UN GEMELO SINTETIZADO ──────────────────
//
// Las rutas de los mp3 son las que pediste y no se tocan. Pero un mp3
// puede no estar todavía, puede fallar la red o puede que el navegador
// no sepa descodificarlo. Si eso deja la noche en silencio, la mitad de
// la experiencia se cae por un archivo que falta.
//
// Así que cada ambiente y cada efecto tiene DOS formas de sonar:
//
//   1. el archivo, que es la buena y la que manda;
//   2. un gemelo hecho con la Web Audio API, que entra si el archivo no
//      está.
//
// El resto del código no sabe cuál está sonando: pide «fogata» y suena
// fogata. Cuando dejes tus mp3 en su carpeta, se usan los tuyos sin
// cambiar una línea.
//
// ── CÓMO SUENA CADA AMBIENTE SINTETIZADO ─────────────────────────────
// Ninguno es un tono: son ruidos filtrados, que es de lo que están
// hechos los sonidos de la naturaleza.
//
//   · fogata     ruido rosa grave + chasquidos sueltos
//   · grillos    pulsos agudos muy cortos, en grupos
//   · aire       ruido rosa con un filtro que se abre y se cierra
//   · bosque     aire flojito + hojas + algún pájaro lejano
//   · lluvia     ruido blanco filtrado, denso
//   · relámpagos ruido muy grave con envolvente de tres picos

const audio = {
  ctx: null,
  maestro: null,
  listo: false,
  buffers: new Map(),      // ruta → AudioBuffer (o null si no se pudo)
  canales: new Map(),      // id → { gain, fuente, vol, on }
};

function despertarAudio() {
  if (audio.ctx) {
    if (audio.ctx.state === "suspended") audio.ctx.resume();
    return audio.ctx;
  }
  try {
    audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    audio.maestro = audio.ctx.createGain();
    audio.maestro.gain.value = 0.9;
    audio.maestro.connect(audio.ctx.destination);
    audio.listo = true;
  } catch {
    audio.ctx = null;
  }
  return audio.ctx;
}

/**
 * Trae un archivo y lo descodifica. Si falla, devuelve null y el que
 * llama usa el gemelo sintetizado. Nunca lanza.
 */
async function traerBuffer(ruta) {
  if (audio.buffers.has(ruta)) return audio.buffers.get(ruta);
  if (!despertarAudio()) return null;
  try {
    const r = await fetch(ruta);
    if (!r.ok) throw new Error(String(r.status));
    const datos = await r.arrayBuffer();
    /* Algunos navegadores viejos sólo tienen la forma con callbacks. */
    const buf = await new Promise((res, rej) => {
      const p = audio.ctx.decodeAudioData(datos, res, rej);
      if (p && p.then) p.then(res, rej);
    });
    audio.buffers.set(ruta, buf);
    return buf;
  } catch {
    audio.buffers.set(ruta, null);
    return null;
  }
}

/* ---- SONIDOS SUELTOS DEL JUGADOR ---------------------------------------

   Un solo sitio por donde pasa todo lo que suena una vez. Busca el
   archivo; si está, lo toca con la ganancia que se le pida y se acabó;
   si no está, devuelve `false` y quien lo llamó se apaña con su gemelo
   sintetizado.

   ── POR QUÉ CON FUNDIDOS ─────────────────────────────────────────────
   Porque un trueno que arranca a volumen pleno en la primera muestra
   hace «clac» antes de retumbar, y uno que se corta en seco al acabar
   hace otro. Dos milisegundos de rampa a cada lado y desaparecen los
   dos, y no se pierde nada de lo que hay que oír.                   */

async function sonarSuelto(ruta, vol = 0.8, seg = 0) {
  if (!ruta || !despertarAudio()) return false;
  const buf = await traerBuffer(ruta);
  if (!buf) return false;
  const c = audio.ctx;
  const t = c.currentTime + Math.max(0, seg);
  const src = c.createBufferSource();
  src.buffer = buf;
  const g = c.createGain();
  /* Entra y sale con rampas cortas: nada de chasquidos. */
  const dur = buf.duration;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.setValueAtTime(vol, t + Math.max(0.05, dur - 0.14));
  g.gain.linearRampToValueAtTime(0, t + dur);
  src.connect(g).connect(audio.maestro);
  src.start(t);
  src.stop(t + dur + 0.05);
  return true;
}

/* Cuál sonó la última vez, para no repetirlo dos veces seguidas. */
const ultimoSuelto = new Map();

/** Uno de una lista, sin repetir el anterior. */
async function sonarDeLista(clave, lista, vol = 0.8) {
  if (!lista || !lista.length) return false;
  let i = Math.floor(Math.random() * lista.length);
  if (lista.length > 1 && i === ultimoSuelto.get(clave)) i = (i + 1) % lista.length;
  ultimoSuelto.set(clave, i);
  return sonarSuelto(lista[i], vol);
}

/* ---- Los generadores de ruido -----------------------------------------
   Se hacen una vez y se guardan: crear tres segundos de ruido cuesta
   unos milisegundos, y hacerlo en mitad de una animación se nota.    */

const ruidos = new Map();

/** Ruido blanco: todas las frecuencias por igual. Suena a estática. */
function bufferBlanco(seg) {
  const clave = `b${seg}`;
  if (ruidos.has(clave)) return ruidos.get(clave);
  const n = Math.floor(audio.ctx.sampleRate * seg);
  const buf = audio.ctx.createBuffer(1, n, audio.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  ruidos.set(clave, buf);
  return buf;
}

/**
 * Ruido rosa de pobre: blanco pasado por un filtro de un polo.
 *
 * Suena muchísimo más a naturaleza que el blanco —viento, fuego, mar—
 * porque tiene más energía en los graves, igual que el mundo real.
 */
function bufferRosa(seg, k = 0.96) {
  const clave = `r${seg}_${k}`;
  if (ruidos.has(clave)) return ruidos.get(clave);
  const n = Math.floor(audio.ctx.sampleRate * seg);
  const buf = audio.ctx.createBuffer(1, n, audio.ctx.sampleRate);
  const d = buf.getChannelData(0);
  let ult = 0;
  for (let i = 0; i < n; i++) {
    const blanco = Math.random() * 2 - 1;
    ult = k * ult + (1 - k) * blanco;
    d[i] = ult * (1 / (1 - k)) * 0.12;
  }
  ruidos.set(clave, buf);
  return buf;
}

/**
 * Los gemelos sintetizados de cada ambiente.
 *
 * Cada uno devuelve un nodo que ya está sonando en bucle; el llamante
 * sólo tiene que conectarlo a su ganancia.
 */
const sintetizar = {

  fogata() {
    const c = audio.ctx;
    const salida = c.createGain();
    /* El cuerpo: ruido rosa grave, que es el rumor de la leña. */
    const src = c.createBufferSource();
    src.buffer = bufferRosa(4, 0.97);
    src.loop = true;
    const f = c.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = 620;
    src.connect(f).connect(salida);
    src.start();
    /* Y los chasquidos, que son lo que la hace fuego y no viento. Van
       por su cuenta, a ratos, y se paran con el canal. */
    const reloj = setInterval(() => {
      if (!audio.ctx) return;
      const t = c.currentTime;
      const n = Math.floor(c.sampleRate * 0.05);
      const b = c.createBuffer(1, n, c.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6);
      const s = c.createBufferSource(); s.buffer = b;
      const bf = c.createBiquadFilter();
      bf.type = "bandpass"; bf.frequency.value = azar(900, 2600); bf.Q.value = 1.2;
      const g = c.createGain(); g.gain.value = azar(0.05, 0.22);
      s.connect(bf).connect(g).connect(salida);
      s.start(t);
    }, 420);
    salida._parar = () => { clearInterval(reloj); try { src.stop(); } catch {} };
    return salida;
  },

  grillos() {
    const c = audio.ctx;
    const salida = c.createGain();
    /* Un grillo es un pulso agudísimo repetido en grupos de tres o
       cuatro. Varios grillos desfasados hacen el campo entero. */
    const reloj = setInterval(() => {
      if (!audio.ctx) return;
      const base = c.currentTime + azar(0, 0.4);
      const cuantos = 3 + Math.floor(Math.random() * 3);
      const hz = azar(3800, 5200);
      for (let k = 0; k < cuantos; k++) {
        const t = base + k * 0.062;
        const o = c.createOscillator();
        const g = c.createGain();
        o.type = "triangle";
        o.frequency.setValueAtTime(hz, t);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(azar(0.03, 0.07), t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.035);
        o.connect(g).connect(salida);
        o.start(t); o.stop(t + 0.05);
      }
    }, 640);
    salida._parar = () => clearInterval(reloj);
    return salida;
  },

  aire() {
    const c = audio.ctx;
    const salida = c.createGain();
    const src = c.createBufferSource();
    src.buffer = bufferRosa(5, 0.95);
    src.loop = true;
    const f = c.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 480;
    f.Q.value = 0.55;
    /* El filtro se abre y se cierra muy despacio: eso son las rachas.
       Sin ese vaivén el viento suena a ventilador. */
    const lfo = c.createOscillator();
    const lfoG = c.createGain();
    lfo.frequency.value = 0.07;
    lfoG.gain.value = 300;
    lfo.connect(lfoG).connect(f.frequency);
    lfo.start();
    src.connect(f).connect(salida);
    src.start();
    salida._parar = () => { try { src.stop(); lfo.stop(); } catch {} };
    return salida;
  },

  bosque() {
    const c = audio.ctx;
    const salida = c.createGain();
    /* Hojas: ruido agudo y muy flojito, con su propio vaivén. */
    const src = c.createBufferSource();
    src.buffer = bufferRosa(5, 0.88);
    src.loop = true;
    const f = c.createBiquadFilter();
    f.type = "highpass";
    f.frequency.value = 1800;
    const g = c.createGain();
    g.gain.value = 0.5;
    src.connect(f).connect(g).connect(salida);
    src.start();
    /* Y algún pájaro lejano de vez en cuando: dos notas que bajan. */
    const reloj = setInterval(() => {
      if (!audio.ctx || Math.random() > 0.35) return;
      const t = c.currentTime;
      const hz = azar(1400, 2400);
      for (let k = 0; k < 2; k++) {
        const o = c.createOscillator();
        const gg = c.createGain();
        const ft = c.createBiquadFilter();
        ft.type = "lowpass"; ft.frequency.value = 3000;
        o.type = "sine";
        o.frequency.setValueAtTime(hz * (k ? 0.78 : 1), t + k * 0.18);
        o.frequency.exponentialRampToValueAtTime(hz * (k ? 0.68 : 0.88), t + k * 0.18 + 0.12);
        gg.gain.setValueAtTime(0, t + k * 0.18);
        gg.gain.linearRampToValueAtTime(0.035, t + k * 0.18 + 0.02);
        gg.gain.exponentialRampToValueAtTime(0.0001, t + k * 0.18 + 0.2);
        o.connect(ft).connect(gg).connect(salida);
        o.start(t + k * 0.18); o.stop(t + k * 0.18 + 0.25);
      }
    }, 3400);
    salida._parar = () => { clearInterval(reloj); try { src.stop(); } catch {} };
    return salida;
  },

  lluvia() {
    const c = audio.ctx;
    const salida = c.createGain();
    const src = c.createBufferSource();
    src.buffer = bufferBlanco(4);
    src.loop = true;
    /* Pasa-banda ancho arriba: la lluvia es casi todo agudo, y lo grave
       que tiene es el rebote en el suelo. */
    const f = c.createBiquadFilter();
    f.type = "bandpass";
    f.frequency.value = 2400;
    f.Q.value = 0.4;
    const g = c.createGain();
    g.gain.value = 0.55;
    src.connect(f).connect(g).connect(salida);
    src.start();
    salida._parar = () => { try { src.stop(); } catch {} };
    return salida;
  },

  relampagos() {
    const c = audio.ctx;
    const salida = c.createGain();
    /* Truenos sueltos. Cada uno avisa a la escena para que dé el
       fogonazo a la vez: el rayo y el trueno van juntos aquí porque
       la tormenta está encima. */
    const reloj = setInterval(() => {
      if (!audio.ctx || Math.random() > 0.3) return;
      /* El ambiente de tormenta ya no pinta nada por su cuenta: avisa
         al clima y él decide a qué distancia cae el rayo, cuándo llega
         el trueno y cómo se ilumina el bosque. */
      lanzarRayo();
    }, 5200);
    salida._parar = () => clearInterval(reloj);
    return salida;
  },
};

/**
 * Un trueno. No es un golpe: es ruido muy grave que RUEDA, con una
 * envolvente de tres picos —el golpe y los dos rebotes en las nubes—.
 */
function truenoSintetizado(destino, fuerza) {
  const c = audio.ctx;
  const t = c.currentTime;
  const dur = 2.2;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  let u1 = 0, u2 = 0;
  for (let i = 0; i < n; i++) {
    const k = i / n;
    const blanco = Math.random() * 2 - 1;
    u1 = 0.96 * u1 + 0.04 * blanco;
    u2 = 0.9 * u2 + 0.1 * u1;
    const golpe  = Math.exp(-k * 13);
    const rueda  = Math.exp(-k * 2.1) * (0.6 + 0.4 * Math.sin(k * 20));
    const rueda2 = Math.exp(-k * 1.0) * 0.45 * (0.5 + 0.5 * Math.sin(k * 8));
    d[i] = u2 * 13 * (golpe + rueda + rueda2);
  }
  const src = c.createBufferSource();
  src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.value = 520;
  const g = c.createGain();
  g.gain.value = 0.85 * fuerza;
  src.connect(f).connect(g).connect(destino || audio.maestro);
  src.start(t);
}
