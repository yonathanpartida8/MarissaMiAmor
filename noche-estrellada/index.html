      ctx.fillStyle = `rgb(${Math.round(mez(14, 66, il2))},${Math.round(mez(26, 88, il2))},${Math.round(mez(18, 46, il2))})`;
      ctx.beginPath();
      ctx.ellipse(mx + Math.cos(a) * s * 0.6, my - s * 0.45 + Math.sin(a) * s * 0.34,
                  s * 0.56, s * 0.38, a * 0.5, 0, 6.283);
      ctx.fill();
    }
  }

  /* ---- 16. EL FILO CALIENTE ----
     Una línea de luz por el canto que da a la fogata. Es lo último que
     se pinta de la casa y lo que la despega del bosque de detrás. */
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = `rgba(255,160,80,${0.1 + ilum * 0.3})`;
  ctx.lineWidth = Math.max(1.4, w * 0.016);
  ctx.beginPath();
  ctx.moveTo(x + haciaFuego * w * 0.5, y - h * 0.02);
  ctx.lineTo(x + haciaFuego * w * 0.5, y - h * 0.96);
  ctx.lineTo(x + haciaFuego * alaX, aleY - grosT * 0.2);
  ctx.stroke();
  ctx.globalCompositeOperation = "source-over";

  /* ---- El aro de «tócame» ----
     Era un óvalo continuo de canto a canto, y en pantalla no se leía
     como «esto se puede tocar»: se leía como un aro geométrico flotando
     alrededor de la casa, una figura que no pinta nada en un bosque.

     Ahora es de TRAZOS, cortos y separados, y además se desvanece por
     arriba: la parte de abajo —la del suelo y la puerta, que es a donde
     mira quien quiere entrar— se ve, y la de arriba se disuelve. Un
     trazo discontinuo se lee como una indicación; una línea entera se
     lee como un objeto. */
  if (escena === "bosque" && !bloqueado) {
    const pulso = 0.09 + 0.05 * Math.sin(reloj * 1.6) + cabana.resalte * 0.34;
    const rx = w * 0.78, ry = h * 0.86;
    const cy2 = y - h * 0.6;
    ctx.lineWidth = 1.4;
    ctx.lineCap = "round";
    const N = 26;
    for (let i = 0; i < N; i++) {
      const a0 = (i / N) * 6.283 + reloj * 0.12;
      const a1 = a0 + 6.283 / N * 0.46;
      /* Más fuerte abajo que arriba: `sin(a)` vale 1 abajo del óvalo. */
      const abajo = clamp01(0.25 + Math.sin(a0) * 0.75);
      ctx.strokeStyle = `rgba(255,214,150,${pulso * abajo})`;
      ctx.beginPath();
      ctx.ellipse(x, cy2, rx, ry, 0, a0, a1);
      ctx.stroke();
    }
  }

  /* Y lo que echa la chimenea una vez cada minuto y pico. */
  dibujarCorazonDeHumo();
}

/**
 * La leña apilada contra la pared.
 *
 * Se ven las TESTAS, no los costados: un montón de leña visto de frente
 * es una pared de círculos de distinto tamaño, y ese patrón es
 * inconfundible. Apilada de costado son palos, y parecen otra cosa.
 */
function dibujarLenaCabana(lx, ly, w, h, ilum, haciaFuego) {
  const anchoP = w * 0.2, altoP = h * 0.3;
  /* La sombra contra la pared NO se pinta aquí: se pinta antes, entre
     los troncos y la luz, y difuminada. Aquí era un rectángulo opaco
     con sus cuatro cantos y en pantalla se leía como un panel gris
     atornillado a la fachada, no como un rincón sin luz. */
  const filas = 5, porFila = 4;
  for (let f = 0; f < filas; f++) {
    for (let i = 0; i < porFila; i++) {
      const n = ruidito(f * 13 + i * 7 + 200);
      const r = anchoP / porFila * (0.42 + n * 0.16);
      const cx2 = lx - anchoP * 0.5 + (i + 0.5) * (anchoP / porFila) + (n - 0.5) * r * 0.5;
      const cy3 = ly - (f + 0.5) * (altoP / filas);
      /* Las de arriba del todo, menos: un montón perfecto es un muro. */
      if (f === filas - 1 && n > 0.55) continue;
      ctx.fillStyle = tonoMadera(n, ilum * 0.34, 0.3);
      ctx.beginPath();
      ctx.arc(cx2, cy3, r, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = tonoMadera(1 - n, ilum * 0.75, 0.05);
      ctx.beginPath();
      ctx.arc(cx2 - haciaFuego * r * 0.12, cy3 - r * 0.1, r * 0.76, 0, 6.283);
      ctx.fill();
      /* Los anillos, que es lo que la hace leña y no guijarros. */
      ctx.strokeStyle = `rgba(20,13,9,${0.3 + ilum * 0.2})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx2 - haciaFuego * r * 0.12, cy3 - r * 0.1, r * 0.4, 0, 6.283);
      ctx.stroke();
    }
  }
  /* Y dos que se han caído, tiradas delante. Un montón sin nada caído
     está colocado; con dos en el suelo, lleva ahí un invierno. */
  for (let i = 0; i < 2; i++) {
    const n = ruidito(i * 53 + 300);
    const cx2 = lx + (n - 0.5) * anchoP * 1.6;
    ctx.save();
    ctx.translate(cx2, ly + h * 0.015);
    ctx.rotate((n - 0.5) * 0.7);
    ctx.fillStyle = tonoMadera(n, ilum * 0.5, 0.2);
    ctx.beginPath();
    ctx.ellipse(0, 0, w * 0.055, w * 0.018, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }
}

/** El tajo de partir, con el hacha clavada donde la dejaron. */
function dibujarTajoCabana(tx, ty, w, ilum, haciaFuego) {
  const r = w * 0.055;
  ctx.fillStyle = "rgba(2,3,7,0.55)";
  ctx.beginPath();
  ctx.ellipse(tx, ty + r * 0.1, r * 1.5, r * 0.42, 0, 0, 6.283);
  ctx.fill();
  /* El costado del tocón. */
  ctx.fillStyle = tonoMadera(0.25, ilum * 0.38, 0.3);
  ctx.fillRect(tx - r, ty - r * 1.5, r * 2, r * 1.5);
  ctx.beginPath();
  ctx.ellipse(tx, ty, r, r * 0.34, 0, 0, 6.283);
  ctx.fill();
  /* La cara de arriba, con sus anillos y el tajo del hacha. */
  ctx.fillStyle = tonoMadera(0.8, ilum * 0.8);
  ctx.beginPath();
  ctx.ellipse(tx, ty - r * 1.5, r, r * 0.34, 0, 0, 6.283);
  ctx.fill();
  ctx.strokeStyle = `rgba(22,15,10,${0.3 + ilum * 0.25})`;
  ctx.lineWidth = 1;
  for (const k of [0.38, 0.68]) {
    ctx.beginPath();
    ctx.ellipse(tx, ty - r * 1.5, r * k, r * 0.34 * k, 0, 0, 6.283);
    ctx.stroke();
  }
  /* El hacha: mango inclinado y cabeza clavada. */
  ctx.strokeStyle = tonoMadera(0.95, ilum * 0.9);
  ctx.lineWidth = Math.max(1.6, w * 0.017);
  ctx.lineCap = "round";
  const m = -haciaFuego;                 // el mango se va hacia fuera
  ctx.beginPath();
  ctx.moveTo(tx + m * r * 0.2, ty - r * 1.6);
  ctx.lineTo(tx + m * r * 1.5, ty - r * 3.1);
  ctx.stroke();
  ctx.fillStyle = `rgba(${Math.round(mez(52, 176, ilum))},${Math.round(mez(54, 180, ilum))},${Math.round(mez(58, 188, ilum))},0.95)`;
  ctx.beginPath();
  ctx.moveTo(tx + m * r * 0.05, ty - r * 1.5);
  ctx.lineTo(tx + m * r * 0.6, ty - r * 2.1);
  ctx.lineTo(tx + m * r * 0.36, ty - r * 2.5);
  ctx.lineTo(tx - m * r * 0.28, ty - r * 1.82);
  ctx.closePath();
  ctx.fill();
}

/** El barril bajo el alero. Cuando llueve se le junta agua y tiembla. */
function dibujarBarrilCabana(bx, by, w, ilum) {
  const r = w * 0.052, alt = w * 0.12;
  ctx.fillStyle = "rgba(2,3,7,0.55)";
  ctx.beginPath();
  ctx.ellipse(bx, by + r * 0.14, r * 1.4, r * 0.4, 0, 0, 6.283);
  ctx.fill();
  const gb = ctx.createLinearGradient(bx - r, 0, bx + r, 0);
  gb.addColorStop(0, tonoMadera(0.2, ilum * 0.25, 0.35));
  gb.addColorStop(0.42, tonoMadera(0.6, ilum * 0.7, 0.05));
  gb.addColorStop(1, tonoMadera(0.2, ilum * 0.2, 0.4));
  ctx.fillStyle = gb;
  ctx.beginPath();
  ctx.moveTo(bx - r * 0.86, by);
  ctx.quadraticCurveTo(bx - r * 1.1, by - alt * 0.5, bx - r * 0.86, by - alt);
  ctx.lineTo(bx + r * 0.86, by - alt);
  ctx.quadraticCurveTo(bx + r * 1.1, by - alt * 0.5, bx + r * 0.86, by);
  ctx.closePath();
  ctx.fill();
  /* Los aros de hierro. */
  ctx.strokeStyle = `rgba(${Math.round(mez(34, 124, ilum))},${Math.round(mez(32, 116, ilum))},${Math.round(mez(34, 108, ilum))},0.85)`;
  ctx.lineWidth = Math.max(1.2, w * 0.011);
  for (const k of [0.24, 0.76]) {
    ctx.beginPath();
    ctx.moveTo(bx - r * (0.88 + k * 0.2 * (1 - Math.abs(k - 0.5) * 2)), by - alt * k);
    ctx.lineTo(bx + r * (0.88 + k * 0.2 * (1 - Math.abs(k - 0.5) * 2)), by - alt * k);
    ctx.stroke();
  }
  /* El agua de dentro: sólo si ha llovido, y con sus ondas. */
  const agua = clamp01(clima.lluvia * 1.4);
  ctx.fillStyle = agua > 0.02
    ? `rgba(${Math.round(mez(16, 40, ilum))},${Math.round(mez(22, 52, ilum))},${Math.round(mez(30, 60, ilum))},1)`
    : "rgba(6,5,8,0.95)";
  ctx.beginPath();
  ctx.ellipse(bx, by - alt, r * 0.86, r * 0.3, 0, 0, 6.283);
  ctx.fill();
  if (agua > 0.02) {
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(bx, by - alt, r * 0.86, r * 0.3, 0, 0, 6.283);
    ctx.clip();
    ctx.strokeStyle = `rgba(190,210,255,${0.16 * agua})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const rr = ((reloj * 0.6 + i * 0.33) % 1) * r * 0.9;
      ctx.beginPath();
      ctx.ellipse(bx, by - alt, rr, rr * 0.35, 0, 0, 6.283);
      ctx.stroke();
    }
    /* Y el reflejo de la luna, que es el detalle por el que está ahí. */
    ctx.fillStyle = `rgba(200,214,255,${0.2 * agua})`;
    ctx.beginPath();
    ctx.ellipse(bx - r * 0.2, by - alt - r * 0.04, r * 0.16, r * 0.06, 0, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }
}

/**
 * Una ventana de la cabaña.
 *
 * El cristal no es un rectángulo naranja: es un degradado que va de
 * claro arriba a ámbar abajo, porque la luz de dentro viene de una
 * lumbre que está en el suelo. Y lleva su alféizar, su contra y sus
 * cuatro cuarterones.
 *
 * `cruza` va de 0 a 1 mientras algo pasa por detrás del cristal, y vale
 * -1 el resto del tiempo, que es casi siempre.
 */
function dibujarVentanaCabana(vx, vy, vw, vh, luz, ilum, cruza) {
  /* El resplandor. */
  ctx.globalCompositeOperation = "lighter";
  /* El halo, CORTO. Llegó a medir dos veces y media la ventana y con
     `lighter` los dos se cruzaban en medio de la pared: la fachada
     entera se iba a crema y la cabaña dejaba de ser de madera de noche
     para ser una casa de día. Una ventana encendida tiñe un palmo de
     pared, no la pared. */
  haloOvalado(vx, vy, vw * 1.75, vh * 1.6, [
    [0, `rgba(255,196,110,${0.19 * luz})`],
    [0.45, `rgba(255,176,96,${0.05 * luz})`],
    [1, "rgba(255,196,110,0)"],
  ], vy);
  ctx.globalCompositeOperation = "source-over";

  /* El hueco, que es más grande que el cristal: la pared tiene grosor. */
  ctx.fillStyle = "rgba(4,4,8,0.8)";
  ctx.fillRect(vx - vw * 0.58, vy - vh * 0.58, vw * 1.16, vh * 1.16);

  /* El cristal. */
  const gc = ctx.createLinearGradient(vx, vy - vh / 2, vx, vy + vh / 2);
  gc.addColorStop(0, `rgba(255,228,172,${luz})`);
  gc.addColorStop(0.55, `rgba(255,192,110,${luz})`);
  gc.addColorStop(1, `rgba(248,152,64,${luz * 0.92})`);
  ctx.fillStyle = gc;
  ctx.fillRect(vx - vw / 2, vy - vh / 2, vw, vh);

  /* La cortina: un paño recogido a un lado, en contraluz. Lo que
     convierte un cuadrado de luz en una ventana de una casa habitada. */
  ctx.fillStyle = `rgba(92,52,26,${0.42 * luz})`;
  ctx.beginPath();
  ctx.moveTo(vx - vw / 2, vy - vh / 2);
  ctx.lineTo(vx - vw * 0.18, vy - vh / 2);
  ctx.quadraticCurveTo(vx - vw * 0.34, vy, vx - vw * 0.1, vy + vh / 2);
  ctx.lineTo(vx - vw / 2, vy + vh / 2);
  ctx.closePath();
  ctx.fill();

  /* ---- ALGUIEN PASA ----
     Una sombra que cruza el cristal. No se puede tocar, no da nada, no
     se cuenta y no se explica nunca. Es lo que hace que la cabaña tenga
     a alguien dentro aunque no pase absolutamente nada más. */
  if (cruza >= 0) {
    const t = clamp01(cruza);
    /* Entra y sale por los cantos, y se ve más fuerte en medio. */
    const sx = mez(vx - vw * 0.75, vx + vw * 0.75, t);
    const fuerza = Math.sin(Math.PI * t);
    ctx.save();
    ctx.beginPath();
    ctx.rect(vx - vw / 2, vy - vh / 2, vw, vh);
    ctx.clip();
    const gs2 = ctx.createRadialGradient(sx, vy, 0, sx, vy, vw * 0.5);
    gs2.addColorStop(0, `rgba(40,20,8,${0.72 * fuerza})`);
    gs2.addColorStop(1, "rgba(40,20,8,0)");
    ctx.fillStyle = gs2;
    ctx.fillRect(vx - vw / 2, vy - vh / 2, vw, vh);
    ctx.restore();
  }

  /* La cruz del marco y el marco. */
  ctx.strokeStyle = "rgba(22,15,9,0.82)";
  ctx.lineWidth = Math.max(1.2, vw * 0.07);
  ctx.beginPath();
  ctx.moveTo(vx, vy - vh / 2); ctx.lineTo(vx, vy + vh / 2);
  ctx.moveTo(vx - vw / 2, vy); ctx.lineTo(vx + vw / 2, vy);
  ctx.stroke();
  ctx.strokeRect(vx - vw / 2, vy - vh / 2, vw, vh);

  /* El alféizar, con su cara de arriba iluminada. */
  ctx.fillStyle = tonoMadera(0.3, ilum * 0.45, 0.25);
  ctx.fillRect(vx - vw * 0.66, vy + vh * 0.58, vw * 1.32, vh * 0.1);
  ctx.fillStyle = tonoMadera(0.85, ilum * 0.9 + 0.12 * luz);
  ctx.fillRect(vx - vw * 0.66, vy + vh * 0.58, vw * 1.32, vh * 0.035);
}

// ==========================================
// CINEMÁTICA
// ==========================================
//
// De la fogata a la cama, sin cortes.
//
// ── LO IMPORTANTE: LOS SONIDOS VAN UNO DETRÁS DE OTRO ────────────────
// Cada `await` espera a que el archivo TERMINE de verdad —`tocarUnaVez`
// se resuelve en el `onended` de la fuente, no con un temporizador a
// ojo—, así que ninguno corta al anterior por mucho que dure. Si un
// archivo no está, su gemelo sintetizado dura lo suyo y la secuencia
// sigue igual de bien.
//
// Mientras tanto la cámara empuja hacia la cabaña y el velo se va a
// negro; los ambientes se agachan pero no se callan, porque el bosque
// sigue ahí fuera.

const cine = { velo: 0, texto: "" };

async function entrarEnLaCabana() {
  if (bloqueado || escena !== "bosque") return;
  bloqueado = true;
  contarLogro("cabana");

  const c = sitio.cabana;

  /* 1. La cámara empuja hacia la puerta. */
  cam.oz = 2.4;
  cam.ox = (A / 2 - c.x) * 2.4;
  cam.oy = (H * 0.56 - (c.y - c.h * 0.5)) * 2.4;
  agacharAmbientes(0.45, 1.6);

  await esperar(suaveMovimiento ? 100 : 1500);

  /* 2. La puerta se abre, y suena. */
  cabana.puerta = 0.001;
  const abrir = tocarUnaVez(CONF.rutas.cabana.puertaAbre, gemelosCabana.puertaAbre, 0.9);
  animar((k) => { cabana.puerta = k; }, 900);
  await abrir;

  /* 3. Se entra: a negro. */
  cine.velo = 0.001;
  animar((k) => { cine.velo = k; }, 1100);
  await esperar(suaveMovimiento ? 60 : 900);
  cabana.puerta = 0;

  /* 4. Y se cierra por dentro. */
  await tocarUnaVez(CONF.rutas.cabana.puertaCierra, gemelosCabana.puertaCierra, 0.9);

  /* 5. Las escaleras. */
  cine.texto = "subiendo";
  await tocarUnaVez(CONF.rutas.cabana.escaleras, gemelosCabana.escaleras, 0.85);

  /* 6. El cuarto. */
  cine.texto = "el cuarto";
  await tocarUnaVez(CONF.rutas.cabana.cuarto, gemelosCabana.cuarto, 0.85);

  /* 7. La cama. */
  cine.texto = "";
  const cama = tocarUnaVez(CONF.rutas.cabana.cama, gemelosCabana.cama, 0.85);

  /* Mientras suena la cama, se monta la habitación por detrás y se
     levanta el velo: así el primer fotograma de la habitación llega con
     el sonido de las sábanas, no después. */
  escena = "habitacion";
  raiz.classList.add("is-habitacion");
  limpiarParticulas();
  construirHabitacion();
  cam.oz = 1; cam.ox = 0; cam.oy = 0;
  cam.z = 1; cam.x = 0; cam.y = 0;
  animar((k) => { cine.velo = 1 - k; }, 1800);
  agacharAmbientes(0.32, 2);

  await cama;
  bloqueado = false;

  setTimeout(() => {
    if (escena !== "habitacion") return;
    decir(A * 0.5, H * 0.3, "Desde acá se ve la luna. Tócala.", { dur: 4.6 });
  }, 1800);
}

/** Una animación de 0 a 1 en `ms`, con suavizado. */
function animar(paso, ms, alAcabar) {
  if (suaveMovimiento) { paso(1); alAcabar?.(); return; }
  const t0 = performance.now();
  const tic = (ahora) => {
    const k = clamp01((ahora - t0) / ms);
    paso(suave3(k));
    if (k < 1) requestAnimationFrame(tic);
    else alAcabar?.();
  };
  requestAnimationFrame(tic);
}

function volverAlBosque() {
  if (bloqueado) return;
  bloqueado = true;
  cine.velo = 0.001;
  animar((k) => { cine.velo = k; }, 700, () => {
    escena = "bosque";
    raiz.classList.remove("is-habitacion", "is-durmiendo");
    limpiarParticulas();
    hab.dormida = 0;
    agacharAmbientes(1, 1.4);
    animar((k) => { cine.velo = 1 - k; }, 900, () => { bloqueado = false; });
  });
}

// ==========================================
// HABITACIÓN
// ==========================================
//
// La vista desde la cama: la manta y las rodillas en primer plano, la
// habitación alrededor, y la ventana con el bosque y la luna.
//
// La perspectiva es la de estar tumbado mirando hacia los pies: la
// ventana arriba y lejos, la manta abajo y cerca, y el suelo con el
// rectángulo de luz de luna que entra por el cristal.

const hab = {
  respira: 0,
  dormida: 0,       // 0 despierta · 1 dormida del todo
  polvo: 0,
  lamparaOn: true,
  lampara: 1,
  cuadro: 0,        // el cuadrito de la pared, tocable
  /* Lo que hay puesto: se siembra una vez y no cambia. */
  fotos: [],
  libros: [],
  ramas: [],
};

/* ---- LO QUE HAY EN LA HABITACIÓN ----------------------------------------
   Se siembra una vez por medida y se guarda. Son cosas quietas: las
   fotos de la cuerda, los libros de la mesilla, las motas del suelo. No
   tiene sentido decidir dónde va cada una sesenta veces por segundo, y
   con el azar repetible salen SIEMPRE en el mismo sitio, que es lo que
   hace que parezca una habitación de alguien y no un generador.      */

function construirHabitacion() {
  hab.respira = 0;
  hab.polvo = 0;
  sembrar(19980214);

  /* Las fotos colgadas de una cuerda, de lado a lado de la ventana. */
  hab.fotos = [];
  for (let i = 0; i < 5; i++) {
    hab.fotos.push({
      t: (i + 0.5) / 5,
      incl: azar(-0.16, 0.16),
      alto: azar(0.86, 1.14),
      /* Qué se ve en cada una. No se dibuja nada reconocible: son dos
         manchas juntas, y con eso basta para que se lean como fotos de
         dos personas. */
      tono: rnd(),
      balanceo: rnd() * 6.283,
    });
  }

  /* Los libros de la mesilla, apilados con desorden. */
  hab.libros = [];
  for (let i = 0; i < 3; i++) {
    hab.libros.push({
      ancho: azar(0.78, 1),
      alto: azar(0.6, 1),
      dx: azar(-0.14, 0.14),
      color: ["#6a3a42", "#3a4a62", "#5a5236"][i % 3],
    });
  }

  /* Y las ramas que se ven por la ventana, que son las que proyectan
     sombra en la pared. Se guardan aparte de los árboles del bosque:
     éstas son las de JUSTO delante del cristal. */
  hab.ramas = [];
  for (let i = 0; i < 5; i++) {
    hab.ramas.push({
      x: azar(-0.6, 0.6),
      y: azar(-0.5, 0.25),
      largo: azar(0.3, 0.7),
      /* Bastante tumbadas: una rama proyectada por una luz que entra en
         diagonal se ve casi horizontal en la pared. Verticales parecían
         grietas. */
      ang: azar(-2.6, -1.9),
      grueso: azar(0.6, 1.8),
      f: rnd() * 6.283,
      hijas: Array.from({ length: 3 }, () => ({
        t: azar(0.3, 0.9), ang: azar(-0.9, 0.9), largo: azar(0.2, 0.5),
      })),
    });
  }

  /* Y lo que hay en la pared de la izquierda: la repisa con el radio,
     el frasco y la planta, la guitarra recargada y el tapete. */
  construirCosas();
  arrancarSecretos();
}

/**
 * El rayo de luna que entra por la ventana.
 *
 * ── POR QUÉ NO ES UN POLÍGONO CON DEGRADADO ──────────────────────────
 * Porque un polígono recortado tiene CANTO, y la luz no tiene canto.
 * Antes esto era un trapecio recortado con `clip()` y relleno con dos
 * degradados: se veía exactamente como lo que era, una cartulina gris
 * pegada en la pared, con dos aristas rectas de arriba abajo.
 *
 * Lo que se pinta ahora es una IMAGEN del rayo, hecha una sola vez en
 * un lienzo pequeño aparte: un degradado de arriba abajo al que se le
 * recorta el alfa con otro degradado de lado a lado usando
 * `destination-in`. Eso multiplica las dos caídas, que es exactamente
 * lo que hace la luz de verdad, y sale sin un solo canto.
 *
 * Luego esa imagen se estampa en diez rebanadas horizontales, cada una
 * un poco más ancha que la de arriba: así el rayo se abre al caer sin
 * necesidad de recortar nada. Las rebanadas no se notan porque sus
 * bordes laterales ya son transparentes.
 *
 * (El intento anterior eran catorce trapecios superpuestos en modo
 * `lighter`. Funcionaba, pero se veían las catorce franjas.)
 */
const rayo = { lienzo: null };

function construirRayo() {
  const w = 128, h = 256;
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");

  /* La caída con la distancia. */
  const gv = g.createLinearGradient(0, 0, 0, h);
  gv.addColorStop(0, "rgba(162,192,255,1)");
  gv.addColorStop(0.45, "rgba(142,172,252,0.7)");
  gv.addColorStop(1, "rgba(120,150,235,0)");
  g.fillStyle = gv;
  g.fillRect(0, 0, w, h);

  /* Y la penumbra de los lados, mordiendo el alfa. */
  g.globalCompositeOperation = "destination-in";
  const gh = g.createLinearGradient(0, 0, w, 0);
  gh.addColorStop(0.00, "rgba(0,0,0,0)");
  gh.addColorStop(0.13, "rgba(0,0,0,0.42)");
  gh.addColorStop(0.33, "rgba(0,0,0,0.9)");
  gh.addColorStop(0.50, "rgba(0,0,0,1)");
  gh.addColorStop(0.67, "rgba(0,0,0,0.9)");
  gh.addColorStop(0.87, "rgba(0,0,0,0.42)");
  gh.addColorStop(1.00, "rgba(0,0,0,0)");
  g.fillStyle = gh;
  g.fillRect(0, 0, w, h);

  rayo.lienzo = c;
}

function dibujarRayoDeLuna(vx, vy, v, sy) {
  if (!rayo.lienzo) construirRayo();
  const im = rayo.lienzo;
  /* El trapecio de fuera: sale del alféizar y se abre al caer. */
  const yA = vy + v.h * 0.5;
  const x0A = vx - v.w * 0.5, x1A = vx + v.w * 0.5;
  const x0B = vx - v.w * 0.24, x1B = vx + v.w * 1.16;
  const abajo = H + 10;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.globalAlpha = 0.5;
  /* Muchas rebanadas y no pocas: con diez se veía la escalerita en el
     borde del rayo, porque cada una salta de golpe al ancho siguiente. */
  const N = flojo ? 14 : 28;
  for (let k = 0; k < N; k++) {
    const t0 = k / N, t1 = (k + 1) / N, tm = (t0 + t1) * 0.5;
    /* Los bordes de la rebanada, redondeados: con decimales, el
       navegador interpola y deja una costura clarita entre una y la
       siguiente al sumarse en modo `lighter`. */
    const y0 = Math.round(mez(yA, abajo, t0));
    const y1 = Math.round(mez(yA, abajo, t1));
    if (y1 <= y0) continue;
    const xl = mez(x0A, x0B, tm), xr = mez(x1A, x1B, tm);
    ctx.drawImage(im, 0, t0 * im.height, im.width, (t1 - t0) * im.height,
      xl, y0, xr - xl, y1 - y0);
  }
  ctx.globalAlpha = 1;

  /* El charco de luz en el suelo, justo donde el rayo lo toca. Un rayo
     que atraviesa la pared y el piso con la misma fuerza se lee como
     una mancha; el charco es lo que dice DÓNDE cae la luz. */
  if (sy < H) {
    const cy = sy + (H - sy) * 0.34;
    haloOvalado(vx + v.w * 0.16, cy, v.w * 0.72, (H - sy) * 0.55, [
      [0, "rgba(168,196,255,0.10)"],
      [0.55, "rgba(150,178,250,0.045)"],
      [1, "rgba(130,160,240,0)"],
    ]);
  }

  /* Y el resplandor del alféizar: donde la luz entra siempre hay un
     halo, porque el marco la difracta. */
  haloOvalado(vx, yA, v.w * 0.62, v.h * 0.2, [
    [0, "rgba(180,205,255,0.09)"],
    [1, "rgba(180,205,255,0)"],
  ]);
  ctx.restore();
}

/**
 * El suelo de madera, con su rodapié y sus tablas en fuga.
 *
 * ── POR QUÉ LAS TABLAS CONVERGEN ─────────────────────────────────────
 * Porque un suelo de tablas paralelas visto desde una cama es un suelo
 * visto desde arriba, y eso aplana el cuarto entero. Convergiendo hacia
 * un punto de fuga que está justo debajo de la ventana, el suelo se
 * mete hacia dentro y la habitación deja de ser un telón.
 *
 * El punto de fuga se pone ARRIBA de la línea de suelo, no abajo: el
 * ojo está por encima del piso, así que las tablas se juntan al fondo,
 * que en pantalla es hacia arriba.
 */
function dibujarSuelo(sy, vx) {
  /* La madera, más clara cerca y más oscura al fondo. */
  const g = ctx.createLinearGradient(0, sy, 0, H);
  g.addColorStop(0, "#241c24");
  g.addColorStop(0.45, "#302430");
  g.addColorStop(1, "#1b1524");
  ctx.fillStyle = g;
  ctx.fillRect(0, sy, A, H - sy);

  /* Y los rincones, más oscuros. Un suelo con la misma luz de lado a
     lado es una cartulina; lo que hace que se lea como un cuarto es
     que las esquinas se apaguen. */
  const gv = ctx.createLinearGradient(0, 0, A, 0);
  gv.addColorStop(0, "rgba(8,6,14,0.5)");
  gv.addColorStop(0.3, "rgba(8,6,14,0)");
  gv.addColorStop(0.7, "rgba(8,6,14,0)");
  gv.addColorStop(1, "rgba(8,6,14,0.5)");
  ctx.fillStyle = gv;
  ctx.fillRect(0, sy, A, H - sy);

  /* Las juntas entre tablas. */
  ctx.save();
  ctx.beginPath(); ctx.rect(0, sy, A, H - sy); ctx.clip();
  ctx.strokeStyle = "rgba(10,8,14,0.45)";
  ctx.lineWidth = Math.max(1, U * 0.16);
  /* La fuga es suave a propósito. Con las tablas muy abiertas parecían
     rayos de sol saliendo de debajo de la ventana, no un piso. */
  for (let i = -9; i <= 9; i++) {
    const dx = i * U * 8;
    ctx.beginPath();
    ctx.moveTo(vx + dx * 0.62, sy);
    ctx.lineTo(vx + dx * 1.5, H + 10);
    ctx.stroke();
  }
  /* Y dos juntas transversales, para que las tablas tengan largo. */
  ctx.strokeStyle = "rgba(10,8,14,0.22)";
  for (const t of [0.3, 0.7]) {
    const y = mez(sy, H, t);
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(A, y); ctx.stroke();
  }
  ctx.restore();

  /* El rodapié: una tira de madera, con su filo de luz arriba. Es lo
     que de verdad cierra la pared contra el suelo.

     El filo va muy bajito de opacidad y con el color de la madera, no
     blanco: con un blanco al 8% ya se leía como un tubo de neón
     cruzando el cuarto de lado a lado. */
  const alto = U * 2.2;
  const gr = ctx.createLinearGradient(0, sy - alto, 0, sy);
  gr.addColorStop(0, "#2e2430");
  gr.addColorStop(1, "#231b26");
  ctx.fillStyle = gr;
  ctx.fillRect(0, sy - alto, A, alto);
  /* El filo sólo brilla donde le da la luna. Una línea clara de lado a
     lado del cuarto, con la misma fuerza en el rincón oscuro que
     debajo de la ventana, se lee como un tubo de neón. */
  const gf = ctx.createLinearGradient(vx - U * 34, 0, vx + U * 40, 0);
  gf.addColorStop(0, "rgba(196,176,206,0.012)");
  gf.addColorStop(0.5, "rgba(206,190,222,0.09)");
  gf.addColorStop(1, "rgba(196,176,206,0.012)");
  ctx.fillStyle = gf;
  ctx.fillRect(0, sy - alto, A, Math.max(1, U * 0.24));
  ctx.fillStyle = "rgba(6,4,10,0.5)";
  ctx.fillRect(0, sy - Math.max(1, U * 0.26), A, Math.max(1, U * 0.26));
}

/**
 * Las sombras de las ramas sobre la pared.
 *
 * ── POR QUÉ ESTO Y NO UNA TEXTURA ────────────────────────────────────
 * Porque se tienen que MOVER, y moverse con el mismo viento que mueve
 * todo lo demás. Una sombra quieta en una pared es un dibujo; una
 * sombra que se mece cuando fuera hace aire es una ventana abierta a
 * algún sitio.
 *
 * Se dibujan con `multiply` para que oscurezcan lo que haya debajo en
 * vez de pintar encima: así respetan el rectángulo de luna y sólo se
 * ven DENTRO de él, que es donde tiene sentido que haya sombras.
 */
function dibujarSombrasRamas(vx, vy, v) {
  if (!hab.ramas || !hab.ramas.length) return;
  const viento = clima.viento * (0.4 + clima.lluvia * 0.6);

  ctx.save();
  /* Recortado al rayo, con un poco de holgura: fuera de él no hay luz,
     así que no puede haber sombra. La holgura es porque el rayo ya no
     tiene borde duro, y un recorte justo dejaba las sombras cortadas
     en seco por una raya vertical que no se correspondía con nada. */
  ctx.beginPath();
  ctx.moveTo(vx - v.w * 0.62, vy + v.h * 0.5);
  ctx.lineTo(vx + v.w * 0.62, vy + v.h * 0.5);
  ctx.lineTo(vx + v.w * 1.3, H);
  ctx.lineTo(vx - v.w * 0.36, H);
  ctx.closePath();
  ctx.clip();

  ctx.globalCompositeOperation = "multiply";
  ctx.lineCap = "round";

  /* Tres pasadas y no una: ancha y casi transparente, media, y fina.
     Sumadas hacen una sombra con penumbra, que es lo que tiene una
     sombra de verdad. Con una sola pasada de borde limpio, las ramas
     se veían como palos grises pintados encima del rayo.

     Y floja a propósito: una sombra a contraluz no es negra, es un
     azul apenas más oscuro que la pared. */
  for (const [gordo, alfa] of [[2.6, 0.12], [1.6, 0.16], [1, 0.24]]) {
    for (const r of hab.ramas) {
      /* La sombra se proyecta ESTIRADA hacia abajo, que es lo que hace un
         rayo que entra en diagonal. Un simple factor en la Y. */
      const bx = vx + r.x * v.w * 1.1;
      const by = vy + v.h * 0.5 + (r.y + 0.6) * v.h * 0.9;
      const mece = Math.sin(reloj * 0.8 + r.f) * 0.08 + viento * 0.16;
      const ang = r.ang + mece;
      const L = r.largo * v.h * 1.1;
      const ex = bx + Math.cos(ang) * L;
      const ey = by + Math.sin(ang) * L * 1.5;

      /* Cuánta luz le llega a ESTA rama: la del centro del rayo se ve
         entera, y las de los lados se van borrando. El recorte sigue
         ahí por si acaso, pero ya no es lo que las corta: si lo fuera,
         se vería la raya recta del recorte. */
      const mx = (bx + ex) / 2;
      const u = clamp01(Math.abs(mx - vx) / (v.w * 0.72));
      const enLuz = 1 - u * u;
      if (enLuz < 0.03) continue;
      ctx.strokeStyle = `rgba(88,98,140,${alfa * enLuz})`;

      ctx.lineWidth = r.grueso * U * 1.1 * gordo;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      /* Curvada de verdad, y no casi recta: una rama recta proyecta
         una raya, y una raya sobre una pared es un arañazo. */
      ctx.quadraticCurveTo(
        (bx + ex) / 2 - Math.cos(ang) * L * 0.18 + Math.sin(reloj * 1.1 + r.f) * U * 1.4,
        (by + ey) / 2 + L * 0.2,
        ex, ey);
      ctx.stroke();

      /* Las ramitas. Sin ellas son palos, y con ellas son un árbol. */
      ctx.lineWidth = r.grueso * U * 0.46 * gordo;
      for (const h of r.hijas) {
        const hx = mez(bx, ex, h.t), hy = mez(by, ey, h.t);
        const ha = ang + h.ang + mece * 1.6;
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx + Math.cos(ha) * L * h.largo, hy + Math.sin(ha) * L * h.largo * 1.3);
        ctx.stroke();
      }
    }
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.restore();
}

/**
 * LAS RAYAS DEL MARCO — lo que hay detrás de la cortina izquierda.
 *
 * Alguien ha estado llevando la cuenta de las noches a cuchillo sobre
 * la madera del marco: grupos de cuatro rayas cruzadas por una quinta.
 *
 * ── POR QUÉ ESTO Y NO UN DIBUJO ──────────────────────────────────────
 * Porque el número no es inventado: son las veces que se ha abierto
 * esta página. Quien la abra por sexta vez encontrará seis rayas, y ahí
 * es donde deja de ser una decoración y pasa a dar un poco de frío.
 *
 * Y por eso está detrás de una cortina: si estuviera a la vista se leería
 * como un adorno de cabaña. Hay que correrla para encontrarlas.
 */
function dibujarRayas(vx, vy, v) {
  const k = clamp01((secretos.cortina.izq - 0.25) / 0.45);
  if (k < 0.02) return;
  const n = Math.min(60, Math.max(1, recuerdo.leer("visitas", 1)));
  const x0 = vx - v.w * 0.62;
  const y0 = vy - v.h * 0.16;
  const paso = U * 1.25;          // entre rayas
  const grupo = U * 7.4;          // entre grupos de cinco
  const alto = U * 3.4;

  ctx.save();
  ctx.globalAlpha = k;
  /* Talladas: una raya oscura con un filo claro pegado. Eso es lo que
     hace que se lean como un corte en la madera y no como tinta. */
  ctx.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const g = Math.floor(i / 5), j = i % 5;
    const fila = Math.floor(g / 3), col = g % 3;
    const bx = x0 + col * grupo;
    const by = y0 + fila * (alto + U * 2.6);
    /* Las cuatro primeras rectas; la quinta cruzada por encima. */
    const incl = azarFijo(i) * 0.14 - 0.07;
    let ax, ay, bx2, by2;
    if (j < 4) {
      ax = bx + j * paso; ay = by;
      bx2 = ax + Math.sin(incl) * alto; by2 = by + alto;
    } else {
      ax = bx - paso * 0.5; ay = by + alto * 0.78;
      bx2 = bx + paso * 3.6; by2 = by + alto * 0.2;
    }
    for (const [dx, dy, col2, gr] of [
      [1, 1, "rgba(196,178,152,0.46)", 1],
      [0, 0, "rgba(10,7,9,0.78)", 1.35],
    ]) {
      ctx.strokeStyle = col2;
      ctx.lineWidth = Math.max(1.2, U * 0.28 * gr);
      ctx.beginPath();
      ctx.moveTo(ax + dx, ay + dy);
      ctx.lineTo(bx2 + dx, by2 + dy);
      ctx.stroke();
    }
  }

  /* Y un verde muy flojo encima, que sólo se ve si te fijas. Es el
     mismo verde de lo que había enterrado en el bosque. */
  ctx.globalCompositeOperation = "lighter";
  haloOvalado(x0 + grupo, y0 + alto * 0.5, grupo * 1.9, alto * 2.2, [
    [0, `rgba(120,255,180,${0.05 * k * (0.6 + 0.4 * Math.sin(reloj * 0.8))})`],
    [1, "rgba(120,255,180,0)"],
  ]);
  ctx.restore();
}

/** Un azar fijo por índice: el mismo temblor en la misma raya siempre. */
function azarFijo(i) {
  const s = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return s - Math.floor(s);
}

/** Las cortinas, a los dos lados de la ventana. Se mueven con el aire. */
function dibujarCortinas(vx, vy, v) {
  const viento = clima.viento;
  /* Que respiren aunque no haga viento: una cortina totalmente quieta
     dentro de una habitación con la ventana abierta no es una cortina,
     es una pared de tela. */
  const base = Math.sin(reloj * 0.55) * 0.35;

  /* Lo que hay detrás de la cortina de la izquierda se pinta ANTES que
     ella: la cortina lo tapa, y destaparlo es justo el secreto. */
  dibujarRayas(vx, vy, v);

  for (const lado of [-1, 1]) {
    /* Cuánto se ha corrido esta cortina, de 0 a 1. Se va hacia SU lado,
       que es donde se amontona una cortina cuando se abre. */
    const corr = (lado < 0 ? secretos.cortina.izq : secretos.cortina.der);
    const bx = vx + lado * v.w * (0.5 + corr * 0.4);
    const arriba = vy - v.h * 0.56;
    const abajo = vy + v.h * 0.62;
    /* El vuelo: el viento las empuja HACIA DENTRO, o sea hacia el lado
       contrario al que están. Y abajo se mueven mucho más que arriba,
       porque arriba están colgadas. */
    const vuela = (base + viento) * -lado * U * 4.5;

    const g = ctx.createLinearGradient(bx, arriba, bx - lado * v.w * 0.3, abajo);
    g.addColorStop(0, "rgba(58,50,66,0.95)");
    g.addColorStop(0.55, "rgba(44,38,54,0.92)");
    g.addColorStop(1, "rgba(28,24,38,0.95)");
    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.moveTo(bx + lado * v.w * 0.2, arriba);
    ctx.lineTo(bx - lado * v.w * 0.13, arriba);
    ctx.quadraticCurveTo(
      bx - lado * v.w * 0.19 + vuela * 0.5, mez(arriba, abajo, 0.55),
      bx - lado * v.w * 0.1 + vuela, abajo);
    ctx.lineTo(bx + lado * v.w * 0.22 + vuela * 0.4, abajo);
    ctx.closePath();
    ctx.fill();

    /* Los pliegues: tres curvas que siguen el mismo vuelo, cada una un
       poco retrasada. Ese retraso es lo que da la sensación de tela. */
    ctx.strokeStyle = "rgba(12,10,18,0.4)";
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 3; i++) {
      const t = (i + 1) / 4;
      const px2 = bx - lado * v.w * 0.13 * t;
      const desf = Math.sin(reloj * 0.55 + i * 0.7) * U * 0.8;
      ctx.beginPath();
      ctx.moveTo(px2 + lado * v.w * 0.02, arriba + U * 1);
      ctx.quadraticCurveTo(
        px2 + vuela * 0.5 * t + desf, mez(arriba, abajo, 0.6),
        px2 + vuela * t + desf * 0.5, abajo - U * 1);
      ctx.stroke();
    }

    /* Y un filo de luna por el canto de dentro. */
    ctx.strokeStyle = `rgba(150,180,255,${0.1 + Math.abs(viento) * 0.05})`;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(bx - lado * v.w * 0.13, arriba);
    ctx.quadraticCurveTo(
      bx - lado * v.w * 0.19 + vuela * 0.5, mez(arriba, abajo, 0.55),
      bx - lado * v.w * 0.1 + vuela, abajo);
    ctx.stroke();
  }

  /* La barra de la que cuelgan. */
  ctx.strokeStyle = "rgba(70,58,50,0.9)";
  ctx.lineWidth = U * 0.7;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(vx - v.w * 0.72, vy - v.h * 0.56);
  ctx.lineTo(vx + v.w * 0.72, vy - v.h * 0.56);
  ctx.stroke();
}

/** La cuerda de fotos, colgada de lado a lado por encima de la cama. */
function dibujarFotos(vx, vy, v) {
  if (!hab.fotos || !hab.fotos.length) return;
  /* La cuerda va atada al marco, DENTRO de la ventana, y las fotos
     cuelgan delante del cristal.
     Antes cruzaba la pared por debajo del alféizar, y ahí las fotos
     no colgaban de nada: eran cinco papeles flotando en mitad del
     rayo de luna. Delante del cristal se entiende sola —está atada al
     marco— y además las fotos salen a contraluz, que es justo como se
     ven unas fotos colgadas en una ventana de noche. */
  const x0 = vx - v.w * 0.54, x1 = vx + v.w * 0.54;
  /* Por la mitad de abajo: arriba está la luna, y taparla sería tapar
     lo único que hay que mirar. */
  const y0 = vy + v.h * (apaisado ? 0.06 : 0.1), y1 = y0 + U * 1.2;
  /* La cuerda cuelga: una parábola, no una recta. */
  const pandeo = U * 3;

  ctx.strokeStyle = "rgba(180,170,150,0.28)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.quadraticCurveTo((x0 + x1) / 2, y1 + pandeo * 2, x1, y1);
  ctx.stroke();

  for (const f of hab.fotos) {
    const t = f.t;
    /* El punto de la parábola donde va colgada. */
    const px2 = mez(x0, x1, t);
    const py2 = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * (y1 + pandeo * 2) + t * t * y1;
    const balanceo = Math.sin(reloj * 0.7 + f.balanceo) * 0.05;
    const w = U * 5.4, h = U * 6.2 * f.alto;

    ctx.save();
    ctx.translate(px2, py2);
    ctx.rotate(f.incl + balanceo);

    /* La pinza. */
    ctx.fillStyle = "rgba(150,132,104,0.5)";
    ctx.fillRect(-U * 0.5, -U * 0.8, U, U * 1.8);

    /* El papel, con su borde blanco de polaroid. */
    ctx.fillStyle = "rgba(226,220,206,0.5)";
    ctx.fillRect(-w / 2, U * 0.8, w, h);
    /* La foto: dos manchas juntas. No hace falta más para que se lea
       como dos personas, y cualquier cosa más definida a este tamaño
       se convierte en una mancha fea. */
    const tono = f.tono < 0.5 ? "120,140,170" : "150,130,140";
    ctx.fillStyle = `rgba(${tono},0.55)`;
    ctx.fillRect(-w / 2 + U * 0.6, U * 1.4, w - U * 1.2, h - U * 2.8);
    ctx.fillStyle = "rgba(230,224,210,0.3)";
    ctx.beginPath();
    ctx.arc(-w * 0.13, U * 1.4 + h * 0.4, w * 0.11, 0, 6.283);
    ctx.arc(w * 0.13, U * 1.4 + h * 0.4, w * 0.11, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }
}

/** La mesilla: cajón, tirador, libros, taza y la lámpara encima. */
function dibujarMesilla(lx, ly) {
  /* El mueble. */
  const mw = U * 15, mh = U * 14;
  const g = ctx.createLinearGradient(lx, ly + U * 3, lx, ly + U * 3 + mh);
  g.addColorStop(0, "rgba(62,48,40,0.95)");
  g.addColorStop(1, "rgba(34,26,22,0.95)");
  ctx.fillStyle = g;
  ctx.fillRect(lx - mw / 2, ly + U * 3, mw, mh);
  /* La tapa, un pelín más clara y sobresaliendo. */
  ctx.fillStyle = "rgba(78,60,48,0.95)";
  ctx.fillRect(lx - mw / 2 - U * 0.6, ly + U * 2.2, mw + U * 1.2, U * 1.1);
  /* ---- El cajón ----
     Se abre de verdad. Antes era un rectángulo dibujado en el frente
     del mueble, que es lo que menos invita a abrir nada. */
  dibujarCajon(lx, ly, mw, mh);

  /* Los libros, apilados. */
  let py2 = ly + U * 2.2;
  const salta = secretos.libros.pulso;
  for (const lb of hab.libros || []) {
    const w = U * 9 * lb.ancho, h = U * 1.5 * lb.alto;
    py2 -= h;
    const bx = lx - w / 2 + lb.dx * U * 6 - U * 5;
    /* Al tocarlos, la pila se asienta: un saltito y ya. */
    const by = py2 - salta * U * 0.5;
    ctx.fillStyle = lb.color;
    ctx.globalAlpha = 0.72;
    ctx.fillRect(bx, by, w, h);
    /* El canto de las hojas. */
    ctx.fillStyle = "rgba(226,216,192,0.5)";
    ctx.fillRect(bx + w * 0.06, by + h * 0.18, w * 0.88, h * 0.5);
    ctx.globalAlpha = 1;
  }

  /* La flor seca que se cayó del último libro, si ya se leyeron los
     tres. Se queda ahí para siempre, apoyada contra la pila. */
  if (secretos.libros.flor) {
    const fx = lx - U * 7.4, fy = ly + U * 2;
    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(-0.5);
    ctx.strokeStyle = "rgba(120,140,96,0.5)";
    ctx.lineWidth = Math.max(1, U * 0.2);
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(0, -U * 2.4);
    ctx.stroke();
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * 6.283;
      ctx.fillStyle = `rgba(${216 - i * 6},${164 + i * 4},${186},0.5)`;
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * U * 0.55, -U * 2.4 + Math.sin(a) * U * 0.55,
        U * 0.52, U * 0.34, a, 0, 6.283);
      ctx.fill();
    }
    ctx.fillStyle = "rgba(240,214,150,0.55)";
    ctx.beginPath();
    ctx.arc(0, -U * 2.4, U * 0.28, 0, 6.283);
    ctx.fill();
    ctx.restore();
  }

  /* La taza, con su asa. */
  const tx = lx + U * 4.6, ty = ly + U * 2.2 - secretos.taza.pulso * U * 0.5;
  ctx.fillStyle = `rgba(${Math.round(mez(200, 240, secretos.taza.pulso))},190,180,0.55)`;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(tx - U * 1.6, ty - U * 3, U * 3.2, U * 3, U * 0.4);
  else ctx.rect(tx - U * 1.6, ty - U * 3, U * 3.2, U * 3);
  ctx.fill();
  ctx.strokeStyle = "rgba(200,190,180,0.55)";
  ctx.lineWidth = U * 0.45;
  ctx.beginPath();
  ctx.arc(tx + U * 2, ty - U * 1.7, U * 0.9, -1.2, 1.2);
  ctx.stroke();
  /* Y un hilillo de vapor, si la lámpara está encendida: si está todo
     apagado se supone que ya es de madrugada y el té está frío. */
  if (hab.lampara > 0.5) {
    ctx.strokeStyle = `rgba(220,225,235,${0.1 * hab.lampara})`;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(tx, ty - U * 3.2);
    ctx.quadraticCurveTo(tx + Math.sin(reloj * 1.4) * U * 1.2, ty - U * 5.2,
                         tx + Math.sin(reloj * 0.9) * U * 0.8, ty - U * 7);
    ctx.stroke();
  }
}

/**
 * El cajón de la mesilla, abierto o cerrado.
 *
 * ── CÓMO SE ABRE UN CAJÓN VISTO DESDE LA CAMA ────────────────────────
 * Se mira desde arriba y un poco de lado, así que un cajón que sale no
 * se mueve «hacia ti»: baja por la pantalla y se ve un poco más grande.
 * Por eso el frente baja y ensancha a la vez, y por encima aparece el
 * hueco negro de dentro del mueble. Sólo con bajarlo parecía que se
 * caía; sólo con ensancharlo, que crecía.
 *
 * Y lo que hay dentro se dibuja ANTES que el frente, porque el frente
 * lo tapa a medida que se cierra. Eso es lo que hace que cerrar el
 * cajón se sienta como esconder algo.
 */
function dibujarCajon(lx, ly, mw, mh) {
  const k = secretos.cajon.abierto;
  const ancho = mw - U * 2;
  const alto = mh * 0.38;
  const y0 = ly + U * 5;

  /* El hueco de dentro, que se ve conforme el frente baja. Un pelín más
     alto que lo que baja el frente: si midiera exactamente lo mismo,
     lo que hay dentro quedaría siempre justo detrás del frente y no se
     vería nunca. */
  if (k > 0.01) {
    const hAbre = alto * k * 1.25;
    const gh = ctx.createLinearGradient(0, y0, 0, y0 + hAbre);
    gh.addColorStop(0, "rgba(6,4,6,0.96)");
    gh.addColorStop(1, "rgba(20,15,16,0.92)");
    ctx.fillStyle = gh;
    ctx.fillRect(lx - ancho / 2, y0, ancho, hAbre);

    /* Y el fondo del cajón, apenas insinuado. */
    ctx.fillStyle = "rgba(48,36,28,0.45)";
    ctx.fillRect(lx - ancho / 2 + U * 0.4, y0 + hAbre * 0.62,
                 ancho - U * 0.8, hAbre * 0.38);

    dibujarBotella(lx - U * 2, y0 + alto * 0.45, k);
  }

  /* El frente. */
  const sale = k * U * 3.2;
  const crece = 1 + k * 0.07;
  const fx = lx - (ancho * crece) / 2;
  const fy = y0 + sale;
  /* Su sombra contra el mueble, que es lo que le da el grosor. */
  if (k > 0.01) {
    ctx.fillStyle = `rgba(0,0,0,${0.4 * k})`;
    ctx.fillRect(fx - U * 0.4, fy - U * 0.5, ancho * crece + U * 0.8, U * 1);
  }
  const gf = ctx.createLinearGradient(0, fy, 0, fy + alto);
  gf.addColorStop(0, "rgba(84,64,50,0.95)");
  gf.addColorStop(1, "rgba(46,34,28,0.95)");
  ctx.fillStyle = gf;
  ctx.fillRect(fx, fy, ancho * crece, alto);
  ctx.strokeStyle = "rgba(20,14,12,0.6)";
  ctx.lineWidth = 1;
  ctx.strokeRect(fx, fy, ancho * crece, alto);
  /* El filo de luz de arriba: sin él el frente es una mancha plana. */
  ctx.fillStyle = "rgba(226,206,178,0.1)";
  ctx.fillRect(fx, fy, ancho * crece, Math.max(1, U * 0.2));

  /* El tirador. */
  ctx.fillStyle = `rgba(${150 + secretos.cajon.pulso * 90},${126 + secretos.cajon.pulso * 70},90,0.65)`;
  ctx.beginPath();
  ctx.arc(lx, fy + alto * 0.5, U * 0.7, 0, 6.283);
  ctx.fill();
}

/**
 * La botella del cajón. Dentro lleva un papel enrollado.
 *
 * Se dibuja tumbada, que es como queda una botella en un cajón, y con
 * un brillo largo por el lomo: es lo único que hay ahí dentro que
 * refleje, y por eso es lo que se ve primero al abrir.
 */
function dibujarBotella(x, y, k) {
  const L = U * 7, r = U * 1.5;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-0.08);
  ctx.globalAlpha = clamp01(k * 1.6);

  /* El cuerpo: vidrio verde oscuro. */
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, "rgba(96,140,104,0.85)");
  g.addColorStop(0.45, "rgba(44,78,54,0.9)");
  g.addColorStop(1, "rgba(20,38,26,0.92)");
  ctx.fillStyle = g;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-L * 0.5, -r, L * 0.78, r * 2, r * 0.7);
  else ctx.rect(-L * 0.5, -r, L * 0.78, r * 2);
  ctx.fill();
  /* El cuello y el corcho. */
  ctx.fillStyle = "rgba(44,78,54,0.9)";
  ctx.fillRect(L * 0.28, -r * 0.42, L * 0.16, r * 0.84);
  ctx.fillStyle = "rgba(186,146,96,0.9)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(L * 0.42, -r * 0.46, L * 0.1, r * 0.92, r * 0.18);
  else ctx.rect(L * 0.42, -r * 0.46, L * 0.1, r * 0.92);
  ctx.fill();

  /* El papel de dentro: un rollito claro que se adivina a través del
     vidrio. Es la razón de que la botella esté ahí. */
  ctx.fillStyle = "rgba(232,222,196,0.5)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-L * 0.36, -r * 0.42, L * 0.52, r * 0.84, r * 0.4);
  else ctx.rect(-L * 0.36, -r * 0.42, L * 0.52, r * 0.84);
  ctx.fill();

  /* Y el lomo de luz. */
  ctx.fillStyle = "rgba(226,246,230,0.34)";
  ctx.beginPath();
  ctx.ellipse(-L * 0.08, -r * 0.55, L * 0.3, r * 0.17, -0.05, 0, 6.283);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

/**
 * LA CAMA — dónde empieza y cómo se dibuja.
 *
 * ── POR QUÉ HAY DOS FUNCIONES Y NO UNA ───────────────────────────────
 * El canto de la manta se pinta CUATRO veces: el relleno, el filo de
 * luna, el dobladillo y el recorte del rayo que cae encima. Esas cuatro
 * tienen que coincidir al píxel, porque un filo de luz que no siga
 * exactamente al canto de la tela se ve como una raya suelta. Antes la
 * curva estaba copiada tres veces a mano, y subir la manta habría
 * significado acordarse de cambiar las tres.
 *
 * `cantoManta` traza sólo el canto de arriba —para lo que se estira—,
 * y `caminoManta` lo cierra por abajo —para lo que se rellena—.
 */
function cimaCama() {
  /* Al subirse la manta, la cama entera sube: se tapa hasta la
     barbilla y se ve menos cuarto, que es exactamente la sensación. */
  return H * (apaisado ? 0.74 : 0.70) - secretos.manta.sube * U * 7;
}

function cantoManta(y) {
  ctx.beginPath();
  ctx.moveTo(-10, y + U * 8);
  ctx.quadraticCurveTo(A * 0.16, y + U * 2, A * 0.3, y + U * 5);
  /* Las rodillas. */
  ctx.quadraticCurveTo(A * 0.38, y - U * 9, A * 0.46, y + U * 3);
  ctx.quadraticCurveTo(A * 0.54, y - U * 8, A * 0.62, y + U * 4);
  ctx.quadraticCurveTo(A * 0.82, y + U * 1, A + 10, y + U * 9);
}

function caminoManta(y) {
  cantoManta(y);
  ctx.lineTo(A + 10, H + 10);
  ctx.lineTo(-10, H + 10);
  ctx.closePath();
}

/** Dónde está la ventana de la habitación, en píxeles. */
function ventanaHab() {
  const w = Math.min(A * 0.5, U * 46);
  const h = w * 1.05;
  return { x: A * 0.5, y: H * (apaisado ? 0.36 : 0.33), w, h };
}

/** Dónde acaba la pared y empieza el suelo.
 *
 *  ── POR QUÉ HACÍA FALTA UNA LÍNEA DE SUELO ──────────────────────────
 *  Porque antes no había: el degradado de la pared llegaba hasta abajo
 *  y la manta de la cama lo tapaba. Eso funciona mientras no pongas
 *  nada en el piso, pero en cuanto hay un tapete o una guitarra
 *  recargada, se nota que están flotando sobre un fondo y no apoyados
 *  en un cuarto. Una sola línea, y de repente hay profundidad. */
function sueloHab() {
  const v = ventanaHab();
  const camaY = H * (apaisado ? 0.74 : 0.70);
  return clamp(camaY - U * 15, v.y + v.h * 0.56, camaY - U * 3);
}

function moverHabitacion(dt) {
  /* La respiración: un vaivén lentísimo que mueve toda la vista. Es lo
     que hace que se sienta que hay alguien tumbado y no una foto. */
  hab.respira += dt * (hab.dormida > 0.5 ? 0.55 : 0.78);
  hab.lampara = damp(hab.lampara, hab.lamparaOn ? 1 : 0, 3, dt);
  hab.cuadro = Math.max(0, hab.cuadro - dt * 1.4);

  /* Polvo flotando en el rayo de luna. */
  hab.polvo -= dt;
  if (hab.polvo <= 0) {
    hab.polvo = flojo ? 0.5 : 0.22;
    const v = ventanaHab();
    soltar(v.x + azar(-v.w * 0.5, v.w * 0.5), v.y + azar(0, H * 0.3), {
      vx: azar(-5, 5), vy: azar(-7, 3),
      vida: azar(3, 6), tam: azar(0.7, 1.8),
      tipo: TIPO.POLVO, tono: 0.5,
    });
  }

  /* Y lo que hay en la pared de la izquierda, que también se mueve. */
  moverCosas(dt);
  moverSecretos(dt);
}

function dibujarHabitacion() {
  const d = desplazar(0.9);
  const v = ventanaHab();
  const vx = v.x + d.x * 0.6, vy = v.y + d.y * 0.6;
  const resp = Math.sin(hab.respira) * U * 0.7;

  /* ---- La pared ---- */
  const gp = ctx.createLinearGradient(0, 0, 0, H);
  gp.addColorStop(0, "#14131f");
  gp.addColorStop(0.55, "#1c1a26");
  gp.addColorStop(1, "#100e18");
  ctx.fillStyle = gp;
  ctx.fillRect(0, 0, A, H);

  /* Los tablones de la pared, insinuados. */
  const sy = sueloHab();
  ctx.strokeStyle = "rgba(255,240,220,0.028)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 12; i++) {
    const y = (i / 12) * sy;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(A, y); ctx.stroke();
  }

  /* ---- El suelo ---- */
  dibujarSuelo(sy, vx);

  /* ---- El rectángulo de luna en la pared y el suelo ----
     Es lo que de verdad ilumina la habitación, así que se dibuja antes
     que los muebles: todo lo demás se ve gracias a él. */
  dibujarRayoDeLuna(vx, vy, v, sy);

  /* ---- Las sombras de las ramas, DENTRO del rectángulo de luna ----
     Van aquí y no después: son sombras, así que tienen que estar sobre
     la pared y por DEBAJO de todo lo que hay colgado y puesto encima. */
  dibujarSombrasRamas(vx, vy, v);

  /* ---- Las estrellitas de la pared de arriba ----
     Van sobre la pared y debajo de todo lo demás, que es donde está
     una pegatina. */
  dibujarCielo();

  /* ---- El tapete ----
     Va aquí porque está en el suelo: todo lo demás del cuarto se apoya
     encima o cuelga por delante. */
  dibujarTapete();

  /* Y el nudo de la tabla, que está en el suelo y no encima de él. */
  dibujarNudo();

  /* ---- La ventana ---- */
  dibujarVentanaHabitacion(vx, vy + resp * 0.2, v.w, v.h);

  /* ---- Las cortinas, a los lados ---- */
  dibujarCortinas(vx, vy + resp * 0.2, v);

  /* ---- El cuadrito de la pared (tocable) ---- */
  const qx = vx - v.w * 0.92, qy = vy + U * 2;
  const qw = U * 9, qh = U * 11;
  ctx.fillStyle = `rgba(120,96,64,${0.5 + hab.cuadro * 0.4})`;
  ctx.fillRect(qx - qw / 2, qy - qh / 2, qw, qh);
  ctx.fillStyle = "rgba(220,200,180,0.16)";
  ctx.fillRect(qx - qw / 2 + 3, qy - qh / 2 + 3, qw - 6, qh - 6);
  /* Lo que hay pintado: dos siluetas juntas, pequeñísimas. */
  ctx.fillStyle = `rgba(200,180,210,${0.24 + hab.cuadro * 0.5})`;
  ctx.beginPath();
  ctx.arc(qx - qw * 0.12, qy + qh * 0.06, qw * 0.09, 0, 6.283);
  ctx.arc(qx + qw * 0.12, qy + qh * 0.06, qw * 0.09, 0, 6.283);
  ctx.fill();
  ctx.fillRect(qx - qw * 0.2, qy + qh * 0.14, qw * 0.16, qh * 0.2);
  ctx.fillRect(qx + qw * 0.04, qy + qh * 0.14, qw * 0.16, qh * 0.2);

  /* ---- La cuerda de fotos ---- */
  dibujarFotos(vx, vy + resp * 0.2, v);

  /* ---- La repisa, el radio, el frasco, la planta, la guitarra ---- */
  dibujarCosas();

  /* ---- La lámpara de la mesilla ---- */
  /* Metida hacia dentro: a 0.92 del ancho de la ventana se le salía
     media mesilla por el canto de la pantalla en vertical. */
  const lx = Math.min(vx + v.w * 0.85, A - U * 9), ly = H * 0.62;
  if (hab.lampara > 0.02) {
    ctx.globalCompositeOperation = "lighter";
    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, U * 26);
    g.addColorStop(0, `rgba(255,190,110,${0.22 * hab.lampara})`);
    g.addColorStop(1, "rgba(255,190,110,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(lx, ly, U * 26, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }
  /* La mesilla, con lo que tiene encima. */
  dibujarMesilla(lx, ly);
  /* El pie y la pantalla de la lámpara. */
  ctx.fillStyle = "rgba(40,32,28,0.95)";
  ctx.fillRect(lx - U * 0.5, ly - U * 3, U, U * 5.4);
  ctx.beginPath();
  ctx.ellipse(lx, ly + U * 2.4, U * 2.2, U * 0.7, 0, 0, 6.283);
  ctx.fill();
  ctx.fillStyle = `rgb(${Math.round(mez(52, 220, hab.lampara))},${Math.round(mez(44, 170, hab.lampara))},${Math.round(mez(40, 110, hab.lampara))})`;
  ctx.beginPath();
  ctx.moveTo(lx - U * 4, ly + U * 2);
  ctx.lineTo(lx - U * 2.6, ly - U * 3.4);
  ctx.lineTo(lx + U * 2.6, ly - U * 3.4);
  ctx.lineTo(lx + U * 4, ly + U * 2);
  ctx.closePath();
  ctx.fill();

  /* ---- La cama, en primer plano ---- */
  const camaY = cimaCama() + resp;

  /* La sábana, asomando por debajo del canto de la manta. Es el detalle
     que convierte «una tela morada» en «una cama hecha»: una manta
     sola se lee como un telón, y dos capas distintas no. */
  ctx.fillStyle = "#4a4258";
  caminoManta(camaY + U * 2.2);
  ctx.fill();

  /* La manta: una curva grande que cruza toda la pantalla, con dos
     bultos donde están las rodillas. Es lo que pone al espectador
     DENTRO de la cama en vez de mirándola. */
  const gm = ctx.createLinearGradient(0, camaY - U * 6, 0, H);
  gm.addColorStop(0, "#3a2c42");
  gm.addColorStop(0.4, "#2c2134");
  gm.addColorStop(1, "#181222");
  ctx.fillStyle = gm;
  caminoManta(camaY);
  ctx.fill();

  /* El dobladillo: una franja un poco más clara pegada al canto, con su
     pespunte. Una manta que acaba en una línea limpia no tiene canto;
     con el dobladillo, sí. */
  ctx.save();
  caminoManta(camaY);
  ctx.clip();
  ctx.fillStyle = "rgba(96,84,116,0.42)";
  caminoManta(camaY - U * 1.8);
  ctx.fill();
  ctx.restore();

  /* La luz de la luna rozando la manta por el canto de arriba: sin ese
     filo, la manta es una mancha oscura y no se lee como volumen. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = "rgba(150,180,255,0.16)";
  ctx.lineWidth = U * 1.1;
  cantoManta(camaY);
  ctx.stroke();
  ctx.restore();

  /* El pespunte del dobladillo. */
  ctx.save();
  ctx.strokeStyle = "rgba(190,176,214,0.16)";
  ctx.lineWidth = Math.max(1, U * 0.2);
  ctx.setLineDash([U * 0.9, U * 0.9]);
  cantoManta(camaY + U * 1.5);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  /* ---- La luna sobre la manta ----
     El rayo que entra por la ventana CAE encima de las piernas, así
     que tiene que verse ahí también. Sin esto, la manta se quedaba
     siendo una mancha morada plana debajo de una habitación iluminada,
     y se notaba que era un telón y no una cama. */
  ctx.save();
  caminoManta(camaY);
  ctx.clip();
  ctx.globalCompositeOperation = "lighter";
  const gml = ctx.createLinearGradient(vx - v.w * 0.5, 0, vx + v.w * 1.1, 0);
  gml.addColorStop(0, "rgba(0,0,0,0)");
  gml.addColorStop(0.3, "rgba(120,150,230,0.07)");
  gml.addColorStop(0.7, "rgba(120,150,230,0.07)");
  gml.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = gml;
  ctx.fillRect(0, camaY - U * 12, A, H);
  ctx.restore();

  /* Los pliegues. Los de dentro del rayo se ven; los de fuera, casi
     nada. Un pliegue es una sombra, y donde no hay luz no hay sombra. */
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 7; i++) {
    const t = (i + 0.5) / 7;
    const enLaLuz = clamp01(1 - Math.abs(A * t - vx) / (v.w * 0.9));
    ctx.strokeStyle = `rgba(8,6,14,${0.2 + enLaLuz * 0.34})`;
    ctx.beginPath();
    ctx.moveTo(A * t, camaY + U * mez(6, 10, Math.abs(t - 0.5) * 2));
    ctx.quadraticCurveTo(A * t + U * 3, H * 0.9, A * t - U * 2, H + 10);
    ctx.stroke();
  }

  /* ---- Las partículas van por encima de todo ---- */
  dibujarParticulas();

  /* ---- El reloj de la mesilla, si ya ha pasado lo que tenía que pasar ---- */
  dibujarReloj3();

  /* ---- Cuando se apaga todo ----
     El susto de la ventana baja las luces de la habitación pero NO las
     de fuera: la ventana se queda siendo lo único que se ve, y por eso
     acabas mirándola. El recorte deja el cristal fuera del velo. */
  if (susto.oscuro > 0.01) {
    const v = ventanaHab();
    const dv = desplazar(0.9);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, A, H);
    ctx.rect(v.x + dv.x * 0.6 - v.w / 2, v.y + dv.y * 0.6 - v.h / 2, v.w, v.h);
    /* `evenodd`: el rectángulo de dentro agujerea al de fuera, así que
       el recorte es «toda la pantalla MENOS la ventana». */
    ctx.clip("evenodd");
    ctx.fillStyle = `rgba(2,3,9,${susto.oscuro * 0.86})`;
    ctx.fillRect(0, 0, A, H);
    ctx.restore();
  }

  /* ---- El velo de dormirse ---- */
  if (hab.dormida > 0.01) {
    ctx.fillStyle = `rgba(4,6,14,${hab.dormida * 0.72})`;
    ctx.fillRect(0, 0, A, H);
  }
}

function dibujarVentanaHabitacion(x, y, w, h) {
  /* El cielo de fuera. */
  const g = ctx.createLinearGradient(x, y - h / 2, x, y + h / 2);
  g.addColorStop(0, "#0a1030");
  g.addColorStop(0.55, "#131b42");
  g.addColorStop(1, "#1b2440");
  ctx.save();
  ctx.beginPath();
  ctx.rect(x - w / 2, y - h / 2, w, h);
  ctx.clip();
  ctx.fillStyle = g;
  ctx.fillRect(x - w / 2, y - h / 2, w, h);

  /* Las estrellas de fuera: las mismas de siempre, recolocadas dentro
     del marco. Así el cielo de la ventana es el cielo del bosque. */
  for (let i = 0; i < 46; i++) {
    const sx = x - w / 2 + ((i * 61) % 100) / 100 * w;
    const sy = y - h / 2 + ((i * 37) % 100) / 100 * h * 0.66;
    const b = 0.3 + 0.5 * Math.sin(reloj * 1.4 + i);
    ctx.fillStyle = `rgba(226,232,255,${b})`;
    ctx.beginPath();
    ctx.arc(sx, sy, 0.7 + (i % 3) * 0.4, 0, 6.283);
    ctx.fill();
  }

  /* La luna, tocable también desde aquí. */
  const lx = x + w * 0.24, ly = y - h * 0.26;
  const lr = w * 0.16;
  dibujarLuna(lx, ly, lr);
  sitio.luna.vx = lx; sitio.luna.vy = ly; sitio.luna.vr = lr;

  /* Los árboles de fuera, en silueta. */
  ctx.fillStyle = "#070a16";
  for (let i = 0; i < 9; i++) {
    const tx = x - w / 2 + (i / 8) * w;
    const th = h * (0.2 + ((i * 29) % 5) * 0.045);
    const tw = w * 0.07;
    ctx.beginPath();
    ctx.moveTo(tx, y + h / 2);
    ctx.lineTo(tx - tw, y + h / 2 - th * 0.55);
    ctx.lineTo(tx - tw * 0.5, y + h / 2 - th * 0.6);
    ctx.lineTo(tx - tw * 0.8, y + h / 2 - th * 0.85);
    ctx.lineTo(tx, y + h / 2 - th);
    ctx.lineTo(tx + tw * 0.8, y + h / 2 - th * 0.85);
    ctx.lineTo(tx + tw * 0.5, y + h / 2 - th * 0.6);
    ctx.lineTo(tx + tw, y + h / 2 - th * 0.55);
    ctx.closePath();
    ctx.fill();
  }

  /* Y lo que a veces hay al otro lado del cristal. Va DENTRO del
     recorte: lo que se sale del marco no se ve, y eso es lo que hace
     que parezca que está fuera y no pegado encima. */
  dibujarSustoVentana(x, y, w, h);
  ctx.restore();

  /* El marco. */
  ctx.strokeStyle = "#2a2230";
  ctx.lineWidth = U * 1.3;
  ctx.strokeRect(x - w / 2, y - h / 2, w, h);
  ctx.lineWidth = U * 0.7;
  ctx.beginPath();
  ctx.moveTo(x, y - h / 2); ctx.lineTo(x, y + h / 2);
  ctx.moveTo(x - w / 2, y); ctx.lineTo(x + w / 2, y);
  ctx.stroke();

  /* El alféizar. */
  ctx.fillStyle = "#241d2c";
  ctx.fillRect(x - w * 0.56, y + h / 2, w * 1.12, U * 2);

  /* Y una vela encendida en el alféizar, que es el detalle que hace la
     habitación. Se puede apagar tocándola tres veces; se vuelve a
     prender sola a los pocos segundos. */
  const cx2 = x - w * 0.36, cy2 = y + h / 2;
  const llama = 1 - secretos.vela.apagada;
  ctx.fillStyle = "#e8e0d0";
  ctx.fillRect(cx2 - U * 0.7, cy2 - U * 4, U * 1.4, U * 4);
  /* El pabilo. Cuando la vela está apagada es lo único que queda, y
     por eso se dibuja siempre. */
  ctx.fillStyle = `rgb(${Math.round(mez(30, 90, llama))},${Math.round(mez(26, 70, llama))},24)`;
  ctx.fillRect(cx2 - U * 0.12, cy2 - U * 4.9, U * 0.24, U * 1);

  if (llama > 0.02) {
    ctx.globalCompositeOperation = "lighter";
    const gv2 = ctx.createRadialGradient(cx2, cy2 - U * 5, 0, cx2, cy2 - U * 5, U * 9);
    gv2.addColorStop(0, `rgba(255,200,120,${0.5 * llama})`);
    gv2.addColorStop(1, "rgba(255,200,120,0)");
    ctx.fillStyle = gv2;
    ctx.beginPath(); ctx.arc(cx2, cy2 - U * 5, U * 9, 0, 6.283); ctx.fill();
    ctx.fillStyle = `rgba(255,230,170,${0.95 * llama})`;
    ctx.beginPath();
    ctx.ellipse(cx2 + Math.sin(reloj * 4) * U * 0.14, cy2 - U * 5,
                U * 0.5 * llama,
                U * 1.1 * llama * (0.85 + 0.15 * Math.sin(reloj * 7)), 0, 0, 6.283);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  } else {
    /* Y el hilillo de humo de haberla apagado hace un momento. */
    ctx.strokeStyle = "rgba(200,196,206,0.16)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(cx2, cy2 - U * 4.9);
    ctx.quadraticCurveTo(cx2 + Math.sin(reloj * 1.3) * U * 1.4, cy2 - U * 7,
                         cx2 + Math.sin(reloj * 0.8) * U, cy2 - U * 9);
    ctx.stroke();
  }
}


/* ══════════════════════════════════════════════════════════════════════
   EL MENSAJE DEL CIELO

   Una vez, cuando ya has encontrado bastante, el cielo se pone a
   escribir. No aparece un cartel: se ENCIENDEN ESTRELLAS, una detrás
   de otra, hasta que lo que estaba ahí arriba desde el principio dice
   una cosa.

   ── CÓMO SE SACAN LAS ESTRELLAS DE UNA FRASE ─────────────────────────
   No a mano. Se escribe la frase en un lienzo pequeño que nadie ve, se
   recorren sus píxeles en una rejilla, y donde hay tinta se pone una
   estrella. Eso tiene tres ventajas sobre dibujar las letras a mano:
   sale con la tipografía de verdad, se puede cambiar el texto sin tocar
   una línea de código, y las estrellas quedan repartidas de una manera
   que no es regular —porque la letra no lo es— y por eso parecen
   estrellas y no puntos de una matriz.

   ── POR QUÉ NO SE PUEDE PROVOCAR LA PRIMERA VEZ ──────────────────────
   Porque lo que hace que valga algo es que no lo estabas esperando.
   Sale sola, una vez, cuando llevas encontrados unos cuantos secretos y
   llevas un rato quieta en el claro. Después de esa primera vez sí se
   puede volver a ver, tocando la luna: para poder enseñárselo a alguien.
   ══════════════════════════════════════════════════════════════════════ */

const escrito = {
  puntos: [],
  /* -1 quieto; si no, segundos desde que empezó. */
  t: -1,
  dur: 15,
  vista: false, leido: false,
  /* Cuánto falta para mirar si toca. */
  reloj: 40,
  quieta: 0,
};

/** Convierte una frase en una nube de puntos, leyéndola de un lienzo. */
function puntosDeTexto(texto, ancho) {
  const lineas = Array.isArray(texto) ? texto : [texto];
  const cv = document.createElement("canvas");
  const alto = Math.round(ancho * (0.3 + lineas.length * 0.21));
  cv.width = ancho; cv.height = alto;
  const c = cv.getContext("2d", { willReadFrequently: true });
  c.fillStyle = "#000";
  c.fillRect(0, 0, ancho, alto);
  c.fillStyle = "#fff";
  c.textAlign = "center";
  c.textBaseline = "middle";
  /* Se prueba a lo grande y se va bajando hasta que quepa el renglón
     más largo. Medir y ajustar es más fiable que adivinar un tamaño. */
  let tam = Math.round(alto / lineas.length * 0.78);
  for (; tam > 6; tam--) {
    /* Palo seco y gorda. La rejilla sólo puede encontrar la letra si
       el trazo es MÁS ANCHO que el paso de la rejilla, y una romana
       fina tiene trazos de doce píxeles donde una gorda tiene veinte:
       con la fina, media letra se cae por los huecos. */
    c.font = `700 ${tam}px ui-sans-serif, system-ui, "Segoe UI", sans-serif`;
    let cabe = true;
    for (const l of lineas) if (c.measureText(l).width > ancho * 0.9) cabe = false;
    if (cabe) break;
  }
  const hueco = alto / (lineas.length + 0.35);
  lineas.forEach((l, i) => {
    c.fillText(l, ancho / 2, hueco * (i + 0.68));
  });

  const d = c.getImageData(0, 0, ancho, alto).data;
  /* El paso tiene que ser MENOR que el grosor del trazo. Con el paso
     gordo quedaban pocas estrellas y muy bonitas, pero se saltaban los
     trazos y las letras se deshacían en puntos sueltos: bonito, sí, y
     ilegible. Con trazo de palo seco al 700, el grosor anda por el 14%
     del tamaño, así que el 8,5% cae dentro con margen. */
  const paso = Math.max(3, Math.round(tam * 0.085));
  const fuera = [];
  for (let y = 0; y < alto; y += paso) {
    for (let x = 0; x < ancho; x += paso) {
      /* Se mira el píxel del centro de la casilla, no la esquina: en
         los trazos finos la esquina se sale de la letra. */
      const i = (y * ancho + x) * 4;
      if (d[i] < 120) continue;
      fuera.push({
        /* Normalizado a [-0.5, 0.5], y con un temblorcito: una rejilla
           perfecta se ve como una rejilla. */
        x: (x / ancho - 0.5) + (Math.random() - 0.5) * (paso / ancho) * 0.9,
        y: (y / alto - 0.5) + (Math.random() - 0.5) * (paso / alto) * 0.9,
        f: Math.random() * 6.283,
        /* Cuándo le toca encenderse: de izquierda a derecha, como se
           escribe. Con todas a la vez sería un cartel. */
        cuando: x / ancho,
        tam: 0.6 + Math.random() * 0.8,
      });
    }
  }
  return fuera;
}

/* Lo de si ya se vio se lee la PRIMERA vez que hace falta, no al
   cargar: aquí arriba, `recuerdo` todavía no existe —se declara más
   abajo— y leerlo reventaba el arranque entero con un ReferenceError,
   que en un módulo de una sola pieza significa que no arranca nada. */
function recordarSiYaSeVio() {
  if (escrito.leido) return;
  escrito.leido = true;
  escrito.vista = !!recuerdo.leer("cielo", 0);
}

function arrancarMensajeCielo(forzado) {
  recordarSiYaSeVio();
  if (escrito.t >= 0) return false;
  if (!escrito.puntos.length) {
    escrito.puntos = puntosDeTexto(CONF.cieloMensaje.texto, 460);
  }
  if (!escrito.puntos.length) return false;
  escrito.t = 0;
  if (!escrito.vista) {
    escrito.vista = true;
    recuerdo.poner("cielo", 1);
    contarLogro("cielo");
  }
  /* Un acorde larguísimo y muy bajito. No es una fanfarria: es que el
     aire cambie. */
  tono(261.6, 6, "sine", 0.03);
  tono(329.6, 6, "sine", 0.022, 0.4);
  tono(392.0, 6, "sine", 0.018, 0.8);
  if (forzado) return true;
  return true;
}

function moverMensajeCielo(dt) {
  if (escrito.t >= 0) {
    escrito.t += dt;
    if (escrito.t > escrito.dur) escrito.t = -1;
    return;
  }
  recordarSiYaSeVio();
  if (escena !== "bosque" || bloqueado) { escrito.quieta = 0; return; }
  /* Sólo sale si llevas un rato sin tocar nada: es un momento, y un
     momento no puede interrumpir lo que estabas haciendo. */
  escrito.quieta += dt;
  if (dedo.dentro) escrito.quieta = 0;
  escrito.reloj -= dt;
  if (escrito.reloj > 0) return;
  escrito.reloj = 30;
  if (escrito.vista) return;
  if (escrito.quieta < 12) return;
  if (logros.size < CONF.cieloMensaje.hacenFalta) return;
  arrancarMensajeCielo(false);
}

function dibujarMensajeCielo() {
  if (escrito.t < 0 || !escrito.puntos.length) return;
  const k = escrito.t / escrito.dur;
  /* Entra escribiéndose, se queda un rato entero, y se va todo a la
     vez y despacio. */
  const escribe = clamp01(escrito.t / 5.5);
  const salida = 1 - clamp01((k - 0.78) / 0.22);
  if (salida <= 0.01) return;

  const cx = A * 0.5;
  const cy = H * (apaisado ? 0.26 : 0.2);
  const anchoM = Math.min(A * 0.9, U * 84);
  const altoM = anchoM * 0.72;

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  /* ---- La luz de detrás ----
     Una aurora muy floja que cruza por detrás de la frase. Es lo que
     hace que el cielo parezca estar haciendo algo, y no que le hayan
     pegado unas estrellas encima. */
  const aurora = Math.sin(Math.PI * clamp01(k * 1.15)) * salida;
  haloOvalado(cx, cy, anchoM * 0.75, altoM * 2.2, [
    [0, `rgba(150,205,255,${0.07 * aurora})`],
    [0.5, `rgba(180,150,255,${0.03 * aurora})`],
    [1, "rgba(150,205,255,0)"],
  ]);

  /* ---- Las estrellas ---- */
  for (const p of escrito.puntos) {
    /* Cada una espera su turno: de izquierda a derecha, como se lee. */
    const enciende = clamp01((escribe - p.cuando * 0.78) / 0.22);
    if (enciende <= 0.01) continue;
    const x = cx + p.x * anchoM;
    const y = cy + p.y * altoM;
    /* Titilan, cada una a su ritmo. Sin titileo son puntos. */
    const vivo = enciende * salida * (0.72 + 0.28 * Math.sin(reloj * 2.1 + p.f));
    const r = U * 0.4 * p.tam;

    haloOvalado(x, y, r * 7, r * 7, [
      [0, `rgba(214,236,255,${0.3 * vivo})`],
      [0.4, `rgba(170,206,255,${0.1 * vivo})`],
      [1, "rgba(150,190,255,0)"],
    ]);
    ctx.fillStyle = `rgba(240,248,255,${0.95 * vivo})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.283);
    ctx.fill();
    /* Y la cruz de destello de las que acaban de encenderse. */
    if (enciende < 1) {
      const d = (1 - enciende) * r * 9;
      ctx.strokeStyle = `rgba(226,242,255,${0.5 * vivo})`;
      ctx.lineWidth = Math.max(1, r * 0.4);
      ctx.beginPath();
      ctx.moveTo(x - d, y); ctx.lineTo(x + d, y);
      ctx.moveTo(x, y - d); ctx.lineTo(x, y + d);
      ctx.stroke();
    }
  }
  ctx.restore();

  /* Y unas motas subiendo, poquísimas, que le dan aire. */
  if (Math.random() < 0.5 && !flojo) {
    soltar(cx + azar(-anchoM * 0.5, anchoM * 0.5), cy + azar(-altoM, altoM), {
      vx: azar(-6, 6), vy: azar(-14, -4),
      vida: azar(2, 4), tam: azar(0.8, 1.7),
      tipo: TIPO.BRILLO, tono: 0.62,
    });
  }
}

// ==========================================
// LUNA
// ==========================================
//
// Se puede tocar desde el bosque y desde la ventana de la habitación.
// Cada vez dice algo distinto, sin repetir hasta agotarlas, y suelta un
// puñado de brillos que caen despacio.

/* ==========================================
   LA LUNA, Y LO QUE PASA A LOS DIEZ TOQUES
   ==========================================

   A la quinta guiña. A la décima deja de ser la luna.

   ── LA TRANSFORMACIÓN, PASO A PASO ──────────────────────────────────
   No es un cambio de dibujo. Son cinco momentos encadenados, y cada
   uno tiene su ruido y su movimiento:

     0.0 – 0.8   GLITCH    se descoloca en bandas, vibra y chirría
     0.8 – 1.4   ZUMBIDO   se encoge y el tono sube
     1.4 – 1.8   ESTALLIDO se abre en pedazos con un fogonazo
     1.8 – 2.8   REUNIÓN   los pedazos vuelven y se ordenan en otra cosa
     2.8 – …     DONA      y lo que queda arriba es una dona de chocolate

   Vuelve sola al cabo de un rato, con la misma escalera al revés. Lo
   que la hace graciosa es justo eso: que no se queda. Si se quedara
   sería un cambio de tema; volviendo, es un chiste.                  */

const luna = {
  pulso: 0,
  guino: 0,
  tocadas: 0,
  /* 0 luna · 1 dona. Y `fase`, dónde va la transformación en segundos. */
  dona: 0,
  fase: -1,           // -1 = quieta
  volviendo: false,
  reloj: 0,
  trozos: [],
  vibra: 0,
};
const diceLuna = barajador(CONF.alTocarLuna);
const diceDona = barajador(CONF.dona.dice);

function empezarDona(volver) {
  luna.fase = 0;
  luna.volviendo = !!volver;
  luna.reloj = 0;
  /* Los pedazos: nacen ordenados y salen despedidos. Cada uno con su
     ángulo, su velocidad y su giro, para que ninguno haga lo mismo. */
  luna.trozos = [];
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * 6.283 + azar(-0.2, 0.2);
    luna.trozos.push({
      a, d: azar(0.15, 0.95),
      vel: azar(1.6, 3.4),
      giro: azar(0, 6.283), giroV: azar(-5, 5),
      tam: azar(0.1, 0.26),
    });
  }
  if (!volver) recuerdo.poner("dona", 1);
}

/** Una fugaz nueva, cruzando el cielo de izquierda a derecha. */
function nuevaFugaz() {
  return {
    x: azar(-40, A * 0.55),
    y: azar(0, sitio.horizonte * 0.4),
    vx: azar(260, 420), vy: azar(80, 160),
    v: 1,
    rastro: [],
  };
}

/**
 * Lo que pasa al pillar una. Y lo que dice depende de CUÁNTAS lleves,
 * hoy y cualquier otra noche: la primera te deja pedir un deseo, y a la
 * quinta el cielo ya te debe algo.
 */
function cazarFugaz(f, p) {
  cielo.cazadas = recuerdo.sumar("fugaces");
  magia(880);
  soltarBrillos(f.x, f.y, 16, 0.45);
  /* Y los trocitos salen en la dirección en la que iba, no en todas:
     lo que se ha roto llevaba una inercia. */
  for (let i = 0; i < 10; i++) {
    soltar(f.x, f.y, {
      vx: f.vx * azar(0.1, 0.45) + azar(-40, 40),
      vy: f.vy * azar(0.1, 0.45) + azar(-40, 40),
      vida: azar(0.8, 2), tam: azar(1, 2.4),
      tipo: TIPO.BRILLO, tono: 0.2,
    });
  }
  const d = CONF.fugaces.deseos;
  const frase = d[Math.min(cielo.cazadas - 1, d.length - 1)];
  decir(p.x, p.y + U * 6, frase, { mimo: true, importante: true, dur: 5 });
  contarLogro("fugaz");
}

function moverLuna(dt) {
  luna.pulso = damp(luna.pulso, 0, 2.2, dt);
  luna.vibra = damp(luna.vibra, 0, 6, dt);

  if (luna.fase < 0) {
    /* Quieta. Si lleva mucho rato siendo dona, se le pasa. */
    if (luna.dona > 0.99) {
      luna.reloj += dt;
      if (luna.reloj > CONF.dona.dura) {
        empezarDona(true);
        decir(sitio.luna.x, sitio.luna.y + sitio.luna.r * 2.4,
          CONF.dona.alVolver, { mimo: true, dur: 4.5 });
      }
    }
    return;
  }

  const t = luna.fase += dt;
  const haciaDona = luna.volviendo ? 0 : 1;

  if (t < 0.8) {
    /* ---- GLITCH ----
       Vibra y se descoloca. El ruido va subiendo con ella. */
    luna.vibra = (t / 0.8) * 1.2;
    if (Math.random() < dt * 14) chirrido(0.3 + t);
  } else if (t < 1.4) {
    /* ---- ZUMBIDO ---- */
    luna.vibra = 1.2 + (t - 0.8) * 1.5;
    if (Math.random() < dt * 7) chirrido(1.1 + (t - 0.8) * 2);
  } else if (t < 1.8) {
    /* ---- ESTALLIDO ---- */
    if (!luna.estallada) {
      luna.estallada = true;
      luna.vibra = 0;
      estallidoLuna();
    }
  } else if (t < 2.8) {
    /* ---- REUNIÓN ----
       Los pedazos vuelven. Y a mitad de camino, el cambio de forma. */
    const k = suave3((t - 1.8) / 1);
    luna.dona = luna.volviendo ? 1 - k : k;
  } else {
    /* ---- YA ESTÁ ---- */
    luna.dona = haciaDona;
    luna.fase = -1;
    luna.estallada = false;
    luna.reloj = 0;
    luna.trozos = [];
    if (!luna.volviendo) {
      magia(392);
      decir(sitio.luna.x, sitio.luna.y + sitio.luna.r * 2.6,
        diceDona(), { mimo: true, importante: true, dur: 5 });
    }
  }
}

/** El chirrido del glitch: ruido cortado con un filtro muy estrecho. */
function chirrido(altura) {
  if (!despertarAudio()) return;
  const c = audio.ctx, t = c.currentTime;
  const dur = azar(0.03, 0.09);
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = "square";
  o.frequency.value = azar(200, 900) * clamp(altura, 0.4, 3);
  f.type = "bandpass"; f.frequency.value = o.frequency.value * 2; f.Q.value = 9;
  g.gain.setValueAtTime(0.035, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f).connect(g).connect(audio.maestro);
  o.start(t); o.stop(t + dur);
}

function estallidoLuna() {
  const L = sitio.luna;
  sacudir(0.8);
  /* Un golpe grave y un fogonazo agudo a la vez: el peso y el destello. */
  golpe(0.3, 90, 0.3, "lowpass");
  golpe(0.08, 5200, 0.14, "highpass");
  magia(587);
  for (let i = 0; i < 40; i++) {
    const a = azar(0, 6.283), v = azar(40, 190);
    soltar(L.x + Math.cos(a) * L.r * 0.5, L.y + Math.sin(a) * L.r * 0.5, {
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      vida: azar(0.8, 2.2), tam: azar(1, 3),
      tipo: TIPO.BRILLO, tono: 0.45,
    });
  }
  /* Y un destello de verdad en todo el cielo, que es lo que hace que
     parezca que ha pasado algo gordo y no que ha cambiado un dibujo. */
  clima.destello = Math.max(clima.destello, 0.7);
  clima.destelloX = L.x / A;
}

function dibujarLuna(x, y, r) {
  /* La vibración del glitch: se aplica a TODO, incluido el halo. */
  if (luna.vibra > 0.01) {
    x += azar(-1, 1) * luna.vibra * r * 0.09;
    y += azar(-1, 1) * luna.vibra * r * 0.06;
  }

  /* Durante el estallido no hay disco: hay pedazos. */
  const estallando = luna.fase >= 1.4 && luna.fase < 2.4;

  /* El halo, en tres capas: cerca fuerte, lejos muy abierto. Una sola
     capa se ve como un círculo borroso pegado; tres se ven como luz.
     De dona, el halo tira a caramelo. */
  const halo = luna.dona > 0.02
    ? `${Math.round(mez(198, 255, luna.dona))},${Math.round(mez(214, 176, luna.dona))},${Math.round(mez(255, 120, luna.dona))}`
    : "198,214,255";
  ctx.globalCompositeOperation = "lighter";
  for (const [k, a] of [[2.2, 0.20], [4.4, 0.10], [9, 0.05]]) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * k);
    g.addColorStop(0, `rgba(${halo},${a * (1 + luna.pulso) * (estallando ? 1.8 : 1)})`);
    g.addColorStop(1, `rgba(${halo},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * k, 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";

  if (estallando) {
    /* ---- Los pedazos ----
       Salen y vuelven con el mismo número: `k` va de 0 a 1 y de 1 a 0
       con un seno, así que no hace falta ni una condición. */
    const k = Math.sin(clamp01((luna.fase - 1.4) / 1) * Math.PI);
    for (const p of luna.trozos) {
      const dd = r * (0.2 + p.d * 3.2 * k * p.vel * 0.4);
      const px2 = x + Math.cos(p.a) * dd;
      const py2 = y + Math.sin(p.a) * dd;
      ctx.save();
      ctx.translate(px2, py2);
      ctx.rotate(p.giro + p.giroV * luna.fase);
      ctx.fillStyle = `rgba(232,236,252,${1 - k * 0.5})`;
      ctx.beginPath();
      ctx.moveTo(-r * p.tam, -r * p.tam * 0.7);
      ctx.lineTo(r * p.tam, -r * p.tam);
      ctx.lineTo(r * p.tam * 0.7, r * p.tam);
      ctx.lineTo(-r * p.tam * 0.8, r * p.tam * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    return;
  }

  /* ---- El cuerpo ----
     Se pinta la luna y, si toca, la dona ENCIMA con su propia
     opacidad. Interpolar entre las dos formas píxel a píxel no vale la
     pena: durante el medio segundo que dura, lo que se ve es un
     fundido, y un fundido después de un estallido se lee perfectamente
     como «se ha convertido en». */
  if (luna.dona < 0.995) {
    ctx.globalAlpha = 1 - luna.dona;
    const gd = ctx.createRadialGradient(x - r * 0.28, y - r * 0.3, r * 0.08, x, y, r);
    gd.addColorStop(0, "#fdfcff");
    gd.addColorStop(0.62, "#e6e9fa");
    gd.addColorStop(1, "#bcc2dd");
    ctx.fillStyle = gd;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();

    /* Los mares: cuatro manchas fijas. Sin ellas la luna es un círculo
       blanco y se lee como un foco. */
    ctx.fillStyle = "rgba(150,158,190,0.34)";
    const mares = [[-0.26, -0.2, 0.3], [0.22, 0.12, 0.24], [-0.06, 0.34, 0.17], [0.34, -0.3, 0.13]];
    for (const [mx, my, mr] of mares) {
      ctx.beginPath();
      ctx.arc(x + mx * r, y + my * r, mr * r, 0, 6.283);
      ctx.fill();
    }

    /* El guiño del easter egg: un arco que se cierra. */
    if (luna.guino > 0.02) {
      ctx.strokeStyle = `rgba(90,96,130,${luna.guino * 0.8})`;
      ctx.lineWidth = r * 0.1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(x - r * 0.22, y - r * 0.12, r * 0.2, 0.2, Math.PI - 0.2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  if (luna.dona > 0.005) dibujarDona(x, y, r, luna.dona);
}

/** Una dona de chocolate donde estaba la luna. Con chispitas. */
function dibujarDona(x, y, r, op) {
  ctx.save();
  ctx.globalAlpha = op;
  /* Un poco ladeada: una dona perfectamente de frente parece un icono. */
  ctx.translate(x, y);
  ctx.rotate(-0.18);
  ctx.scale(1, 0.92);

  /* La masa. */
  const gm = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  gm.addColorStop(0, "#f0c98a");
  gm.addColorStop(0.7, "#dba95f");
  gm.addColorStop(1, "#b9803e");
  ctx.fillStyle = gm;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, 6.283);
  ctx.fill();

  /* El chocolate: no es un círculo, es una mancha con goterones. Es lo
     que hace que parezca glaseado y no una arandela pintada. */
  const gc = ctx.createRadialGradient(-r * 0.28, -r * 0.34, r * 0.08, 0, 0, r * 0.96);
  gc.addColorStop(0, "#6b3c22");
  gc.addColorStop(0.6, "#4a2413");
  gc.addColorStop(1, "#33170c");
  ctx.fillStyle = gc;
  ctx.beginPath();
  const lobulos = 11;
  for (let i = 0; i <= lobulos; i++) {
    const a = (i / lobulos) * 6.283;
    /* El borde ondula, y unos pocos puntos bajan mucho más: los
       goterones. El seno de tres vueltas los reparte sin listas. */
    const gota = Math.max(0, Math.sin(a * 3 + 0.7)) * 0.1;
    const rr = r * (0.9 + Math.sin(a * 5 + 1.3) * 0.035 + gota);
    const px2 = Math.cos(a) * rr, py2 = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px2, py2);
    else ctx.lineTo(px2, py2);
  }
  ctx.closePath();
  ctx.fill();

  /* El agujero, con el cielo asomando. Se recorta de verdad: pintarlo
     del color del cielo sólo funciona si el cielo es liso, y aquí
     detrás hay estrellas. */
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
