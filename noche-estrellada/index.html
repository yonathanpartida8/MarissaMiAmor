  ctx.strokeStyle = `rgba(150,255,195,${0.3 + 0.3 * vivo})`;
  ctx.lineWidth = Math.max(1, U * 0.16);
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * 6.283;
    const largo = i % 3 === 0 ? 0.26 : 0.14;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * er * 0.82, ey + Math.sin(a) * er * 0.82);
    ctx.lineTo(Math.cos(a) * er * (0.82 - largo), ey + Math.sin(a) * er * (0.82 - largo));
    ctx.stroke();
  }
  /* Las manecillas: las tres en punto, clavadas. */
  ctx.lineCap = "round";
  const manecilla = (ang, largo, gordo) => {
    ctx.lineWidth = Math.max(1, U * gordo);
    ctx.beginPath();
    ctx.moveTo(0, ey);
    ctx.lineTo(Math.cos(ang) * er * largo, ey + Math.sin(ang) * er * largo);
    ctx.stroke();
  };
  ctx.strokeStyle = `rgba(190,255,215,${0.5 + 0.4 * vivo})`;
  /* Las tres en punto: la horaria al 3 —a la derecha— y el minutero al
     12 —arriba—. La horaria es la corta y la gorda. */
  manecilla(0, 0.44, 0.34);
  manecilla(-1.5708, 0.66, 0.26);
  /* El segundero: da el tic y vuelve. El salto es un pelín adelante y
     el resto del segundo, quieto en el cero. */
  const salto = p.tic < 0.12 ? (p.tic / 0.12) * 0.1 : 0;
  ctx.strokeStyle = `rgba(255,140,140,${0.34 + 0.3 * vivo})`;
  manecilla(-1.5708 + salto, 0.72, 0.16);
  ctx.fillStyle = `rgba(200,255,220,${0.6 * vivo})`;
  ctx.beginPath(); ctx.arc(0, ey, er * 0.08, 0, 6.283); ctx.fill();
  ctx.restore();

  /* ---- Lo que le ha crecido encima ----
     Lleva ahí lo bastante como para tener musgo. Eso es lo que dice
     cuánto tiempo lleva, sin escribirlo en ningún lado. */
  for (let i = 0; i < 11; i++) {
    /* Repartido por los dos cantos y de tamaños distintos. En una sola
       columna a la izquierda se leía como una costura, no como musgo. */
    const lado = i % 2 ? 1 : -1;
    const t = azarFijo(i * 3.1);
    ctx.fillStyle = i % 3 === 0 ? "rgba(74,104,62,0.42)" : "rgba(52,84,54,0.5)";
    ctx.beginPath();
    ctx.ellipse(lado * ancho * (0.3 + azarFijo(i * 7.3) * 0.22),
      alto * (0.12 + azarFijo(i * 5.7) * 0.82),
      ancho * (0.07 + t * 0.16), alto * (0.008 + t * 0.016),
      azarFijo(i * 2.3) * 0.5 - 0.25, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();

  /* Y el destello del cristal cuando le da el fogonazo. */
  if (p.fogonazo > 0.02) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    haloOvalado(x, y - alto * 0.42, ancho * 2.4, alto * 0.5, [
      [0, `rgba(190,255,215,${0.2 * p.fogonazo})`],
      [1, "rgba(150,255,190,0)"],
    ]);
    ctx.restore();
  }
}

/**
 * LA ESCOPETA, TIRADA ENTRE LAS HOJAS.
 *
 * ── CÓMO SE ESCONDE ALGO QUE TIENE QUE ENCONTRARSE ───────────────────
 * No tapándolo: poniéndolo lejos y haciendo que llame la atención un
 * momento cada tantos segundos. Un objeto que brilla todo el rato es un
 * cartel; uno que brilla una vez cada cuatro segundos hace que quien lo
 * vio de reojo se pregunte si lo vio de verdad, y vuelva a mirar.
 *
 * El destello no es un halo: es una franja estrecha que RECORRE el
 * cañón, que es lo que hace el metal pulido cuando le pasa por encima
 * una luz. Un halo diría «objeto mágico»; esto dice «metal».
 */
function dibujarEscopetaSuelo(x, y, p) {
  const L = U * 15;
  const k = 1 - p.cogida;
  if (k < 0.02) return;

  ctx.save();
  ctx.translate(x, y - p.cogida * U * 8);
  ctx.rotate(-0.14 + p.cogida * 0.8);
  ctx.globalAlpha = k;

  /* La sombra, para que se apoye en el suelo y no flote. */
  haloOvalado(U * 0.6, U * 1.4, L * 0.52, U * 1.2, [
    [0.3, "rgba(0,0,0,0.42)"],
    [1, "rgba(0,0,0,0)"],
  ]);

  /* ---- La culata: madera, ancha atrás y estrechando hacia delante ---- */
  const gm = ctx.createLinearGradient(0, -U * 1.4, 0, U * 1.4);
  gm.addColorStop(0, "#7a4f2c");
  gm.addColorStop(0.45, "#5b391f");
  gm.addColorStop(1, "#33200f");
  ctx.fillStyle = gm;
  ctx.beginPath();
  ctx.moveTo(-L * 0.5, -U * 0.5);
  ctx.quadraticCurveTo(-L * 0.52, U * 1.5, -L * 0.42, U * 1.5);
  ctx.lineTo(-L * 0.1, U * 0.85);
  ctx.lineTo(-L * 0.1, -U * 0.6);
  ctx.closePath();
  ctx.fill();
  /* La veta. */
  ctx.strokeStyle = "rgba(20,12,6,0.3)";
  ctx.lineWidth = Math.max(1, U * 0.14);
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(-L * 0.48, -U * 0.2 + i * U * 0.5);
    ctx.quadraticCurveTo(-L * 0.3, U * 0.1 + i * U * 0.45, -L * 0.12, -U * 0.1 + i * U * 0.4);
    ctx.stroke();
  }

  /* ---- La caja de mecanismos ---- */
  ctx.fillStyle = "#4a4e55";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-L * 0.13, -U * 0.75, L * 0.2, U * 1.6, U * 0.18);
  else ctx.rect(-L * 0.13, -U * 0.75, L * 0.2, U * 1.6);
  ctx.fill();
  /* El guardamonte y el gatillo. */
  ctx.strokeStyle = "#3a3e45";
  ctx.lineWidth = Math.max(1, U * 0.3);
  ctx.beginPath();
  ctx.arc(-L * 0.04, U * 1.15, U * 0.8, -0.2, Math.PI + 0.2);
  ctx.stroke();
  ctx.fillStyle = "#2c3036";
  ctx.fillRect(-L * 0.055, U * 0.5, U * 0.26, U * 0.9);

  /* ---- Los dos cañones ----
     Uno encima del otro, que es lo que hace que se lea como escopeta y
     no como rifle. */
  for (const dy of [-U * 0.42, U * 0.42]) {
    const gc = ctx.createLinearGradient(0, dy - U * 0.4, 0, dy + U * 0.4);
    gc.addColorStop(0, "#6e7681");
    gc.addColorStop(0.4, "#3c434c");
    gc.addColorStop(1, "#1d2127");
    ctx.fillStyle = gc;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(L * 0.06, dy - U * 0.4, L * 0.46, U * 0.8, U * 0.28);
    else ctx.rect(L * 0.06, dy - U * 0.4, L * 0.46, U * 0.8);
    ctx.fill();
  }
  /* Las bocas. */
  ctx.fillStyle = "#0b0d10";
  for (const dy of [-U * 0.42, U * 0.42]) {
    ctx.beginPath();
    ctx.ellipse(L * 0.515, dy, U * 0.16, U * 0.34, 0, 0, 6.283);
    ctx.fill();
  }
  /* Y el guardamanos de madera bajo los cañones. */
  ctx.fillStyle = "#5b391f";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(L * 0.08, U * 0.1, L * 0.24, U * 0.95, U * 0.25);
  else ctx.rect(L * 0.08, U * 0.1, L * 0.24, U * 0.95);
  ctx.fill();
  /* El punto de mira: un grano de latón. */
  ctx.fillStyle = "rgba(226,196,120,0.8)";
  ctx.beginPath();
  ctx.arc(L * 0.48, -U * 0.8, U * 0.16, 0, 6.283);
  ctx.fill();

  /* ---- El destello que recorre el cañón ---- */
  if (p.destello > 0.02) {
    const t = 1 - p.destello;
    const bx = mez(L * 0.04, L * 0.56, t);
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    const gd = ctx.createLinearGradient(bx - L * 0.09, 0, bx + L * 0.09, 0);
    gd.addColorStop(0, "rgba(220,240,255,0)");
    gd.addColorStop(0.5, `rgba(226,244,255,${0.75 * Math.sin(p.destello * Math.PI)})`);
    gd.addColorStop(1, "rgba(220,240,255,0)");
    ctx.fillStyle = gd;
    ctx.fillRect(bx - L * 0.09, -U * 0.95, L * 0.18, U * 1.9);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* Unas hojas por encima, tapándola a medias. Lo que la hace un
     hallazgo y no un objeto puesto en el suelo. */
  if (k > 0.5) {
    ctx.save();
    ctx.globalAlpha = (k - 0.5) * 2;
    for (let i = 0; i < 5; i++) {
      const a = azarFijo(i * 7) * 6.283;
      ctx.fillStyle = i % 2 ? "rgba(52,74,42,0.75)" : "rgba(70,60,34,0.72)";
      ctx.beginPath();
      ctx.ellipse(x + Math.cos(a) * L * 0.32, y + Math.sin(a) * U * 1.3 + U * 0.4,
        U * (0.9 + azarFijo(i * 11) * 0.7), U * 0.42, a, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

/** El hueco por donde se vuelve: luz de fogata colándose entre troncos. */
function dibujarSalida(x, y, p) {
  const k = 0.75 + 0.25 * Math.sin(reloj * 0.8);
  ctx.globalCompositeOperation = "lighter";
  haloOvalado(x, y, p.r * 1.7, p.r * 2.3, [
    [0, `rgba(255,178,96,${0.16 * k})`],
    [0.45, `rgba(255,150,70,${0.06 * k})`],
    [1, "rgba(255,140,60,0)"],
  ]);
  ctx.globalCompositeOperation = "source-over";

  /* El sendero: dos hileras de piedras que se van juntando al fondo.
     Es lo que dice «por aquí se va» sin escribirlo. */
  ctx.fillStyle = `rgba(${Math.round(mez(40, 92, k * 0.5))},${Math.round(mez(38, 78, k * 0.5))},${Math.round(mez(36, 62, k * 0.5))},0.85)`;
  for (let i = 0; i < 6; i++) {
    const t = i / 5;
    const px = x + mez(0, -p.r * 0.5, t);
    const py = y + p.r * mez(1.5, 0.3, t);
    const s = U * mez(2, 0.7, t);
    for (const lado of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(px + lado * p.r * mez(0.9, 0.2, t), py, s, s * 0.5, 0, 0, 6.283);
      ctx.fill();
    }
  }
}

/** La marca del suelo. Empieza tapada de hojas. */
function dibujarEquis(x, y, p) {
  const tap = p.hojas;
  const hoyo = p.hoyo;
  const tmb = p.temblor;
  ctx.save();
  ctx.translate(x + azar(-tmb, tmb) * U, y + azar(-tmb, tmb) * U * 0.5);

  /* ---- El hoyo ----
     Crece con las paladas. Es una elipse oscura con el borde de tierra
     levantada alrededor: sin ese borde parece una mancha, y con él
     parece un agujero. */
  if (hoyo > 0.01) {
    ctx.fillStyle = `rgba(${Math.round(mez(34, 20, hoyo))},${Math.round(mez(30, 16, hoyo))},${Math.round(mez(24, 12, hoyo))},0.95)`;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * (0.5 + hoyo * 0.6), p.r * (0.22 + hoyo * 0.3), 0, 0, 6.283);
    ctx.fill();
    /* La tierra levantada. */
    ctx.fillStyle = "rgba(52,44,32,0.9)";
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * 6.283 + 0.4;
      const rr = p.r * (0.62 + hoyo * 0.6);
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * rr, Math.sin(a) * rr * 0.45,
                  p.r * 0.2 * (1 + hoyo), p.r * 0.1 * (1 + hoyo), a, 0, 6.283);
      ctx.fill();
    }
    /* Y el fondo, más oscuro cuanto más hondo. */
    const gh = ctx.createRadialGradient(0, 0, 0, 0, 0, p.r * (0.5 + hoyo * 0.6));
    gh.addColorStop(0, `rgba(0,0,0,${0.5 + hoyo * 0.45})`);
    gh.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gh;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * (0.5 + hoyo * 0.6), p.r * (0.22 + hoyo * 0.3), 0, 0, 6.283);
    ctx.fill();
  }

  /* ---- La X ----
     Dos palos cruzados, clavados y medio hundidos. Se desvanece según
     se cava: lo que había debajo se la va comiendo. */
  const vis = (1 - tap * 0.82) * (1 - hoyo * 0.9);
  if (vis > 0.02) {
    ctx.strokeStyle = `rgba(62,48,34,${0.95 * vis})`;
    ctx.lineWidth = Math.max(1.6, p.r * 0.13);
    ctx.lineCap = "round";
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(-p.r * 0.55 * s, -p.r * 0.26);
      ctx.lineTo(p.r * 0.55 * s, p.r * 0.26);
      ctx.stroke();
    }
    /* Un filo claro por arriba, que es lo que la saca de la tierra. */
    ctx.strokeStyle = `rgba(150,140,110,${0.28 * vis})`;
    ctx.lineWidth = Math.max(0.8, p.r * 0.05);
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(-p.r * 0.55 * s, -p.r * 0.3);
      ctx.lineTo(p.r * 0.55 * s, p.r * 0.22);
      ctx.stroke();
    }
  }

  /* ---- Las hojas que la tapan ----
     Se apartan al primer toque. Mientras están, lo que se ve es un
     montoncito cualquiera del suelo del bosque. */
  if (tap > 0.02) {
    ctx.globalAlpha = tap;
    for (let i = 0; i < 11; i++) {
      const a = (i / 11) * 6.283 + 1.1;
      const rr = p.r * (0.2 + ((i * 7) % 5) * 0.16);
      ctx.save();
      ctx.translate(Math.cos(a) * rr, Math.sin(a) * rr * 0.5);
      ctx.rotate(a * 1.7);
      ctx.fillStyle = i % 3 === 0 ? "#3e3420" : (i % 3 === 1 ? "#4a3c24" : "#33301c");
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r * 0.26, p.r * 0.13, 0, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/** La pala, apoyada en un tocón. */
function dibujarPala(x, y, p) {
  const k = clamp01(p.cogida);
  if (k >= 1) return;
  const r = p.r;

  /* ---- El tocón ---- */
  ctx.fillStyle = "rgb(30,25,19)";
  ctx.beginPath();
  ctx.ellipse(x + r * 0.5, y, r * 0.55, r * 0.22, 0, 0, 6.283);
  ctx.fill();
  ctx.fillStyle = "rgb(42,34,24)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x + r * 0.5 - r * 0.5, y - r * 0.6, r, r * 0.6, r * 0.1);
  else ctx.rect(x + r * 0.5 - r * 0.5, y - r * 0.6, r, r * 0.6);
  ctx.fill();
  ctx.fillStyle = "rgb(58,47,33)";
  ctx.beginPath();
  ctx.ellipse(x + r * 0.5, y - r * 0.6, r * 0.5, r * 0.2, 0, 0, 6.283);
  ctx.fill();
  /* Los anillos del corte. */
  ctx.strokeStyle = "rgba(24,18,12,0.6)";
  ctx.lineWidth = 1;
  for (let i = 1; i <= 2; i++) {
    ctx.beginPath();
    ctx.ellipse(x + r * 0.5, y - r * 0.6, r * 0.5 * (i / 3), r * 0.2 * (i / 3), 0, 0, 6.283);
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(x, y);
  /* Al cogerla sube, gira y se encoge. Es el único aviso de que se la
     ha quedado, y sin él un objeto que desaparece se lee como un fallo. */
  if (k > 0) {
    ctx.translate(0, -k * H * 0.12);
    ctx.rotate(k * 2.4);
    ctx.scale(1 - k * 0.7, 1 - k * 0.7);
    ctx.globalAlpha = 1 - k;
  }
  /* Inclinada contra el tocón. */
  ctx.rotate(-0.42 + Math.sin(reloj * 0.6) * 0.012);

  /* La sombra en el suelo, aparte del giro para que no se vaya con él. */
  ctx.save();
  ctx.rotate(0.42);
  ctx.fillStyle = "rgba(2,4,3,0.5)";
  ctx.beginPath();
  ctx.ellipse(r * 0.1, r * 0.08, r * 0.7, r * 0.14, 0, 0, 6.283);
  ctx.fill();
  ctx.restore();

  /* El mango: madera con veta y un remate arriba. */
  const gm = ctx.createLinearGradient(-r * 0.1, 0, r * 0.1, 0);
  gm.addColorStop(0, "rgb(96,68,40)");
  gm.addColorStop(0.5, "rgb(132,96,58)");
  gm.addColorStop(1, "rgb(74,52,30)");
  ctx.fillStyle = gm;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r * 0.085, -r * 1.5, r * 0.17, r * 1.6, r * 0.08);
  else ctx.rect(-r * 0.085, -r * 1.5, r * 0.17, r * 1.6);
  ctx.fill();
  /* El agarre de arriba, en forma de D. */
  ctx.strokeStyle = "rgb(116,84,50)";
  ctx.lineWidth = r * 0.12;
  ctx.beginPath();
  ctx.arc(0, -r * 1.55, r * 0.2, Math.PI * 0.9, Math.PI * 0.1);
  ctx.stroke();

  /* La hoja: metal, con el filo brillante y la parte de abajo gastada. */
  const gh = ctx.createLinearGradient(-r * 0.3, 0, r * 0.3, r * 0.5);
  gh.addColorStop(0, "rgb(126,134,146)");
  gh.addColorStop(0.45, "rgb(88,96,108)");
  gh.addColorStop(1, "rgb(52,56,64)");
  ctx.fillStyle = gh;
  ctx.beginPath();
  ctx.moveTo(-r * 0.3, 0);
  ctx.lineTo(r * 0.3, 0);
  ctx.lineTo(r * 0.24, r * 0.4);
  ctx.quadraticCurveTo(0, r * 0.62, -r * 0.24, r * 0.4);
  ctx.closePath();
  ctx.fill();
  /* El filo. */
  ctx.strokeStyle = "rgba(210,222,240,0.5)";
  ctx.lineWidth = Math.max(1, r * 0.04);
  ctx.beginPath();
  ctx.moveTo(-r * 0.24, r * 0.4);
  ctx.quadraticCurveTo(0, r * 0.62, r * 0.24, r * 0.4);
  ctx.stroke();
  /* El cuello que une hoja y mango. */
  ctx.fillStyle = "rgb(70,76,86)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-r * 0.1, -r * 0.2, r * 0.2, r * 0.26, r * 0.04);
  else ctx.rect(-r * 0.1, -r * 0.2, r * 0.2, r * 0.26);
  ctx.fill();

  /* ---- El brillo de «esto se toca» ----
     Muy flojo y respirando. Lo justo para que el ojo se pare ahí al
     pasar, no para que grite. */
  if (k === 0) {
    ctx.globalCompositeOperation = "lighter";
    const b = 0.1 + p.brillo * 0.12;
    const gg = ctx.createRadialGradient(0, -r * 0.4, 0, 0, -r * 0.4, r * 1.6);
    gg.addColorStop(0, `rgba(190,215,255,${b})`);
    gg.addColorStop(1, "rgba(160,200,255,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, -r * 0.4, r * 1.6, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  /* Y un par de chispitas que suben, muy de vez en cuando. */
  if (k === 0 && Math.random() < 0.02) {
    soltar(x + azar(-r * 0.4, r * 0.4), y - azar(0, r), {
      vx: azar(-5, 5), vy: azar(-18, -7),
      vida: azar(1.2, 2.4), tam: azar(0.8, 1.6),
      tipo: TIPO.BRILLO, tono: 0.5,
    });
  }
}

/** Lo que estaba enterrado: un relicario de piedra con una luz dentro. */
function dibujarReliquia(x, y, p) {
  const sal = suave3(p.salida);
  if (sal < 0.01) return;
  const r = p.r * mez(0.5, 1, sal);
  const pulso = p.pulso;
  const late = 0.6 + 0.4 * Math.sin(reloj * 1.6) + pulso * 1.4;

  ctx.save();
  ctx.translate(x, y - r * 0.35 * sal);

  /* ---- La luz que echa ----
     Antes que nada, porque es lo primero que se ve de ella y porque
     tiene que iluminar la tierra de alrededor. */
  ctx.globalCompositeOperation = "lighter";
  haloOvalado(0, r * 0.4, r * (3 + pulso * 5), r * (1.5 + pulso * 3), [
    [0, `rgba(120,255,190,${0.3 * late})`],
    [0.4, `rgba(60,220,140,${0.1 * late})`],
    [1, "rgba(40,200,120,0)"],
  ]);
  ctx.globalCompositeOperation = "source-over";

  /* ---- La tierra que todavía la cubre ----
     Sale medio enterrada. Que no aparezca limpia es lo que hace que se
     lea como desenterrada y no como colocada. */
  ctx.fillStyle = "rgba(44,38,26,0.92)";
  ctx.beginPath();
  ctx.ellipse(0, r * 0.45, r * 1.1, r * 0.32, 0, 0, 6.283);
  ctx.fill();

  /* ---- El cuerpo: un prisma de piedra con caras ---- */
  ctx.save();
  ctx.rotate(Math.sin(p.giro) * 0.05);
  const gp = ctx.createLinearGradient(-r * 0.6, -r, r * 0.6, r * 0.6);
  gp.addColorStop(0, "rgb(46,58,54)");
  gp.addColorStop(0.5, "rgb(28,38,36)");
  gp.addColorStop(1, "rgb(16,24,22)");
  ctx.fillStyle = gp;
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.95);
  ctx.lineTo(r * 0.55, -r * 0.35);
  ctx.lineTo(r * 0.42, r * 0.5);
  ctx.lineTo(-r * 0.42, r * 0.5);
  ctx.lineTo(-r * 0.55, -r * 0.35);
  ctx.closePath();
  ctx.fill();

  /* Las grietas por donde se escapa la luz. Son LO importante: sin
     ellas es una piedra, y con ellas es una piedra con algo dentro. */
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = `rgba(150,255,205,${0.5 + late * 0.4})`;
  ctx.lineWidth = Math.max(1, r * 0.07);
  ctx.lineCap = "round";
  const grietas = [
    [[-0.28, -0.5], [-0.06, -0.1], [-0.2, 0.3]],
    [[0.3, -0.42], [0.1, 0.0], [0.24, 0.42]],
    [[-0.1, -0.7], [0.04, -0.34]],
  ];
  for (const gr of grietas) {
    ctx.beginPath();
    ctx.moveTo(gr[0][0] * r, gr[0][1] * r);
    for (let i = 1; i < gr.length; i++) ctx.lineTo(gr[i][0] * r, gr[i][1] * r);
    ctx.stroke();
  }

  /* El corazón: un rombo de luz en el centro. */
  const gc = ctx.createRadialGradient(0, -r * 0.1, 0, 0, -r * 0.1, r * 0.55);
  gc.addColorStop(0, `rgba(220,255,236,${0.75 * late})`);
  gc.addColorStop(0.35, `rgba(110,255,190,${0.4 * late})`);
  gc.addColorStop(1, "rgba(60,220,150,0)");
  ctx.fillStyle = gc;
  ctx.beginPath();
  ctx.arc(0, -r * 0.1, r * 0.55, 0, 6.283);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  ctx.restore();

  /* ---- Los símbolos que flotan alrededor ----
     Sólo después de tocarla. Giran despacio y no dicen nada: no son un
     idioma, son la sensación de que ahí hay un idioma. */
  if (historia.hecho("revelado")) {
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < 5; i++) {
      const a = p.giro * (i % 2 ? -1 : 1) + (i / 5) * 6.283;
      const rr = r * (1.5 + Math.sin(reloj * 0.7 + i) * 0.2);
      const sx = Math.cos(a) * rr, sy = -r * 0.2 + Math.sin(a) * rr * 0.45;
      const op = 0.25 + 0.25 * Math.sin(reloj * 1.1 + i * 2);
      ctx.strokeStyle = `rgba(160,255,210,${op})`;
      ctx.lineWidth = Math.max(1, r * 0.05);
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(a);
      ctx.beginPath();
      /* Cinco marcas distintas, todas del mismo aire: trazos rectos que
         se cruzan. Se eligen por el índice, así cada una es siempre la
         misma y el conjunto parece un alfabeto. */
      if (i === 0) { ctx.moveTo(-r * 0.15, 0); ctx.lineTo(r * 0.15, 0); ctx.moveTo(0, -r * 0.15); ctx.lineTo(0, r * 0.15); }
      else if (i === 1) { ctx.moveTo(-r * 0.14, -r * 0.12); ctx.lineTo(r * 0.14, r * 0.12); ctx.moveTo(r * 0.14, -r * 0.12); ctx.lineTo(-r * 0.14, r * 0.12); }
      else if (i === 2) { ctx.arc(0, 0, r * 0.13, 0.4, 5.2); }
      else if (i === 3) { ctx.moveTo(-r * 0.14, r * 0.1); ctx.lineTo(0, -r * 0.14); ctx.lineTo(r * 0.14, r * 0.1); }
      else { ctx.moveTo(-r * 0.12, -r * 0.12); ctx.lineTo(-r * 0.12, r * 0.12); ctx.lineTo(r * 0.12, r * 0.12); }
      ctx.stroke();
      ctx.restore();
    }
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.restore();
}

/* ==========================================
   LO QUE VIVE EN LA ESPESURA
   ==========================================

   Un búho que habla y unos ojos que no. Van juntos en el mismo sitio
   porque van juntos en la historia: el búho es lo que te acompaña y los
   ojos son lo que te mira, y al final resulta que son lo mismo.

   ── EL BÚHO TIENE OPINIONES ──────────────────────────────────────────
   No suelta frases al azar: dice cosas distintas según dónde estés y
   qué hayas hecho. Antes de desenterrar nada es un bicho simpático que
   te ve pasar; después, ya no.

   ── Y LOS OJOS SON MUCHOS ────────────────────────────────────────────
   Cada par está a una profundidad distinta y sólo sale en las zonas
   oscuras. Se van si te acercas. Uno de ellos —siempre el mismo, pero
   no hay manera de saber cuál— aguanta tres toques, y entonces pasa
   algo.                                                              */

const buhoEsp = {
  x: 0, y: 0, r: 0,
  /* Cuánto se ve, 0..1. */
  sal: 0, salObj: 1,
  parpadeo: 0, relojParpadeo: 0,
  giro: 0, giroObj: 0,
  ala: 0, aleteo: 0,
  /* 0 verde · 1 rojo. Se pone rojo solo, de vez en cuando. */
  rojo: 0, rojoObj: 0, relojRojo: 0,
  /* El brillo de los ojos cuando se le toca. */
  visto: 0,
  /* Lo que ha dicho ya, para no repetirse. */
  dichas: new Set(),
  relojDice: 0,
  /* La respiración y el erizarse de plumas: lo que hace que un bicho
     quieto siga estando vivo. */
  respira: 0, pluma: 0, relojPluma: 3,
  /* La desaparición y el ataque. */
  yendo: -1,        // segundos desde que empezó a irse
  modo: "normal",   // normal · verde · minis · ataque
  ataque: -1,
  escala: 1,
};

const minis = [];

function colocarBuhoEsp() {
  const p = puntos.lista.find((q) => q.id === "buho");
  if (!p) return;
  buhoEsp.x = p.x; buhoEsp.y = p.y;
  buhoEsp.r = U * (apaisado ? 3.4 : 4.2);
  /* Si ya hubo cacería, no está en su árbol: está en otro, y en otro
     distinto cada vez que se entra al bosque. */
  if (historia.hecho("caceria")) posarBuhoLejos();
  buhoEsp.relojParpadeo = azar(1.5, 5);
  buhoEsp.relojRojo = azar(14, 40);
  buhoEsp.relojDice = azar(6, 14);
}

function moverBuhoEsp(dt) {
  const b = buhoEsp;

  /* ---- El ataque manda sobre todo lo demás ---- */
  if (b.ataque >= 0) { moverAtaque(dt); return; }

  /* ---- Irse ---- */
  if (b.yendo >= 0) { moverIrse(dt); return; }

  b.sal = damp(b.sal, b.salObj, 2, dt);
  b.visto = Math.max(0, b.visto - dt * 0.4);
  b.aleteo = Math.max(0, b.aleteo - dt * 2.2);
  b.ala += dt * (3 + b.aleteo * 14);

  /* Parpadeo. */
  b.relojParpadeo -= dt;
  if (b.relojParpadeo <= 0) { b.relojParpadeo = azar(1.8, 6); b.parpadeo = 1; }
  b.parpadeo = Math.max(0, b.parpadeo - dt * 5.2);

  /* ---- Los ojos rojos de golpe ----
     Muy de vez en cuando y sin motivo. Lo que da miedo no es que estén
     rojos: es que estaban verdes hace un segundo. */
  b.relojRojo -= dt;
  if (b.relojRojo <= 0) {
    b.relojRojo = azar(18, 50);
    if (Math.random() < (historia.hecho("revelado") ? 0.85 : 0.4)) {
      b.rojoObj = 1;
      setTimeout(() => { b.rojoObj = 0; }, azar(700, 2200));
      tono(azar(52, 70), 1.4, "sine", 0.05);
    }
  }
  b.rojo = damp(b.rojo, b.rojoObj, b.rojoObj > 0.5 ? 14 : 2.2, dt);

  /* La cabeza sigue al dedo si anda cerca. */
  const sx = enPantalla(b.x, 0.52);
  const cerca = dedo.dentro && Math.hypot(dedo.x - sx, dedo.y - b.y) < U * 34;
  if (cerca) b.giroObj = clamp((dedo.x - sx) / (U * 16), -1, 1);
  else if (Math.random() < dt * 0.4) b.giroObj = Math.random() < 0.4 ? 0 : azar(-0.8, 0.8);
  b.giro = damp(b.giro, b.giroObj, 5.5, dt);

  /* ---- Lo que dice por su cuenta ----
     Sólo si está en pantalla: un búho que habla desde fuera del campo
     de visión es una voz en off, y aquí no hay voces en off. */
  /* ---- Lo que hace estando quieto ----
     Respira, y cada tantos segundos se eriza y se vuelve a alisar. Son
     dos números y son la diferencia entre un bicho posado y un dibujo
     de un bicho posado. */
  b.respira += dt * 1.05;
  b.pluma = Math.max(0, b.pluma - dt * 1.6);
  b.relojPluma -= dt;
  if (b.relojPluma <= 0) {
    b.relojPluma = azar(4, 13);
    b.pluma = 1;
  }

  b.relojDice -= dt;
  if (b.relojDice <= 0 && sx > A * 0.1 && sx < A * 0.9 && !bloqueado) {
    b.relojDice = azar(11, 26);
    hablarElBuho();
  }

  /* ---- Volver a dar con él después de la cacería ----
     La primera vez que se le encuentra en su rama nueva, lo dice. Una
     vez por rama, no una vez por partida: cada vez que cambia de sitio
     vuelve a ser un hallazgo. */
  if (historia.hecho("caceria") && b.sal > 0.5 && !b.saludado
      && sx > A * 0.15 && sx < A * 0.85 && !bloqueado && caza.fase === "no") {
    b.saludado = true;
    decir(sx, b.y - b.r * 3, diceVerlo(), { misterio: true, dur: 4.5 });
  }

  /* Los mini búhos, si los hay. */
  moverMinis(dt);
}

/** Una frase, elegida por lo que haya pasado ya. */
function hablarElBuho(forzada) {
  const b = buhoEsp;
  const sx = enPantalla(b.x, 0.52);
  const lista = forzada ? [forzada]
    : (historia.hecho("revelado") ? CONF.buhoEsp.despues : CONF.buhoEsp.antes)
        .filter((f) => !b.dichas.has(f));
  if (!lista.length) { b.dichas.clear(); return; }
  const frase = lista[Math.floor(Math.random() * lista.length)];
  b.dichas.add(frase);

  /* «Shhh… ¿oyes eso?» no es una frase más: es la que trae el sonido.
     Se reconoce por la marca, no por el texto, para poder cambiar el
     texto sin romper nada. */
  const esElRuido = frase === CONF.buhoEsp.elRuido;
  decir(clamp(sx, A * 0.2, A * 0.8), b.y - U * 7, frase,
    { misterio: esElRuido || historia.hecho("revelado"), importante: esElRuido, dur: esElRuido ? 4 : 3.6 });

  if (esElRuido) {
    b.giroObj = 0;
    setTimeout(() => sonarRag(), 1500);
  } else {
    tono(azar(300, 420), 0.4, "sine", 0.035);
  }
  historia.marcar("buho");
}

/**
 * `rag.mp3`, y su gemelo por si no está.
 *
 * El gemelo no intenta imitar nada: hace lo que tiene que hacer un
 * sonido que sale del fondo de un bosque a las tres de la mañana. Un
 * grave que sube muy despacio, un ruido de banda estrecha barriendo por
 * encima, y un corte seco. Lo que inquieta es el barrido: una
 * frecuencia que se mueve sola no se parece a nada del bosque.
 */
let sonandoRag = false;
async function sonarRag(vol = 0.6) {
  if (sonandoRag) return;
  sonandoRag = true;
  setTimeout(() => { sonandoRag = false; }, 4000);

  /* El bosque se calla para dejarlo sonar. Que el resto baje es la
     mitad de lo que hace que se oiga. */
  agacharAmbientes(0.18, 0.9);
  setTimeout(() => agacharAmbientes(1, 2.4), 3400);

  const c = despertarAudio();
  if (!c) return;
  const buf = await traerBuffer(CONF.rutas.rag);
  if (buf) {
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(g).connect(audio.maestro);
    src.start();
    return;
  }

  const t0 = c.currentTime, dur = 2.6;
  /* El grave que sube. */
  const o = c.createOscillator(), og = c.createGain();
  o.type = "sawtooth";
  o.frequency.setValueAtTime(34, t0);
  o.frequency.exponentialRampToValueAtTime(78, t0 + dur * 0.8);
  const fo = c.createBiquadFilter();
  fo.type = "lowpass"; fo.frequency.value = 220;
  og.gain.setValueAtTime(0, t0);
  og.gain.linearRampToValueAtTime(vol * 0.2, t0 + 0.6);
  og.gain.setValueAtTime(vol * 0.2, t0 + dur * 0.75);
  og.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(fo).connect(og).connect(audio.maestro);
  o.start(t0); o.stop(t0 + dur + 0.1);

  /* El barrido de banda estrecha por encima. */
  const src = c.createBufferSource(); src.buffer = bufferRosa(3);
  const f = c.createBiquadFilter();
  f.type = "bandpass"; f.Q.value = 14;
  f.frequency.setValueAtTime(380, t0);
  f.frequency.exponentialRampToValueAtTime(1900, t0 + dur * 0.7);
  f.frequency.exponentialRampToValueAtTime(240, t0 + dur);
  const ng = c.createGain();
  ng.gain.setValueAtTime(0, t0);
  ng.gain.linearRampToValueAtTime(vol * 0.16, t0 + 0.4);
  ng.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(ng).connect(audio.maestro);
  src.start(t0); src.stop(t0 + dur + 0.1);
}

/** Lo que pasa al tocarlo. */
function tocarBuhoEspesura(p) {
  const b = buhoEsp;
  if (b.sal < 0.2 || b.yendo >= 0 || b.ataque >= 0) return false;
  const cen = b.centrado || 0;
  const sx = mez(enPantalla(b.x, 0.52), A * 0.5, cen);
  const sy = mez(b.y, H * 0.5, cen);
  if (Math.hypot(p.x - sx, p.y - sy) > b.r * 3) return false;

  b.visto = 1;
  b.parpadeo = 1;
  b.aleteo = 1;
  b.giroObj = 0;
  sonarMisterio(0.5);

  /* Partículas verdes saliendo de él. */
  for (let i = 0; i < 16; i++) {
    const a = azar(0, 6.283);
    soltar(sx, b.y, {
      vx: Math.cos(a) * azar(14, 60), vy: Math.sin(a) * azar(14, 50) - 12,
      vida: azar(1.4, 3), tam: azar(1, 2.4),
      tipo: TIPO.BRILLO, tono: 0.45,
    });
  }

  const veces = recuerdo.sumar("buhoEsp");
  /* Al tercer toque y de ahí en adelante, se va. Y cómo se va depende
     de si el bosque ya está despierto. */
  if (veces % 3 === 0) {
    setTimeout(() => irseElBuho(historia.hecho("revelado") ? "minis" : "verde"), 900);
  }
  hablarElBuho(veces === 1 ? CONF.buhoEsp.primera : undefined);
  return true;
}

/* ---- Irse ---------------------------------------------------------------
   No desaparece: se deshace. Junta energía, se para un momento —esa
   pausa es LO que hace que funcione— y revienta.                      */

function irseElBuho(modo) {
  const b = buhoEsp;
  if (b.yendo >= 0) return;
  b.yendo = 0;
  b.modo = modo;
  tono(azar(180, 240), 1.6, "sine", 0.05);
}

function moverIrse(dt) {
  const b = buhoEsp;
  const t = b.yendo += dt;
  const sx = enPantalla(b.x, 0.52);

  /* 0 – 1.1  junta energía y crece un pelín. */
  if (t < 1.1) {
    b.visto = Math.min(1.6, b.visto + dt * 1.5);
    b.escala = 1 + t * 0.14;
    if (Math.random() < dt * 30) {
      const a = azar(0, 6.283), rr = b.r * azar(2, 4.5);
      soltar(sx + Math.cos(a) * rr, b.y + Math.sin(a) * rr, {
        /* Van HACIA él, no desde él: se está tragando el bosque. */
        vx: -Math.cos(a) * rr * 1.6, vy: -Math.sin(a) * rr * 1.6,
        vida: 0.6, tam: azar(1, 2.2),
        tipo: TIPO.BRILLO, tono: 0.45,
      });
    }
  }
  /* 1.1 – 1.45  la pausa. Quieto, brillando, sin nada. */
  else if (t < 1.45) {
    b.escala = 1.15;
  }
  /* 1.45  revienta. */
  else if (!b.reventado) {
    b.reventado = true;
    reventarElBuho(sx, b.y, b.modo);
    b.sal = 0; b.salObj = 0;
  }
  /* Y vuelve al cabo de un rato, en su sitio. */
  else if (t > 9) {
    b.yendo = -1;
    b.reventado = false;
    b.escala = 1;
    b.salObj = 1;
    b.modo = "normal";
    b.visto = 0;
    /* Después de la cacería NO vuelve a su árbol: vuelve a OTRO, lejos
       de donde estés mirando. «Sigue ahí» y «sigue en el mismo sitio»
       no son lo mismo; si volviera a su rama de siempre, lo que
       quedaría de todo aquello es que no pasó nada. */
    if (historia.hecho("caceria")) posarBuhoLejos();
  }
}

function reventarElBuho(x, y, modo) {
  sacudir(0.7);
  magia(523);
  golpe(0.18, 700, 0.2, "bandpass");

  /* La nube de partículas verdes. Unas se van lejos y otras se quedan
     dando vueltas: es lo que hace que quede algo flotando después. */
  for (let i = 0; i < 70; i++) {
    const a = azar(0, 6.283);
    const lejos = Math.random() < 0.35;
    const v = lejos ? azar(120, 300) : azar(20, 90);
    soltar(x, y, {
      vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.75 - 20,
      vida: lejos ? azar(1, 2.2) : azar(2.6, 5.5),
      tam: azar(1, 3),
      tipo: TIPO.BRILLO, tono: 0.45,
    });
  }
  espesura.onda = 0.8;
  espesura.ondaX = buhoEsp.x;

  if (modo === "minis") nacerMinis(x, y);
}

/* ---- Los mini búhos ------------------------------------------------------
   Seis, del tamaño de una nuez, cruzando en todas direcciones. Unos se
   pierden detrás de los árboles y otro pasa rozando la cámara.      */

function nacerMinis(x, y) {
  minis.length = 0;
  for (let i = 0; i < 6; i++) {
    const cerca = i === 2;              // el que pasa rozando
    const a = (i / 6) * 6.283 + azar(-0.3, 0.3);
    minis.push({
      x, y,
      vx: Math.cos(a) * azar(90, 230) * (cerca ? 1.6 : 1),
      vy: Math.sin(a) * azar(50, 130) - 30,
      r: U * (cerca ? 2.6 : azar(0.8, 1.6)),
      z: cerca ? 2.4 : azar(0.5, 1.2),
      ala: rnd() * 6.283,
      vida: cerca ? 1.6 : azar(2.2, 4),
      t: 0,
      chilla: azar(0.2, 1.2),
    });
  }
  /* Seis chillidos cortos y agudos, escalonados. */
  for (let i = 0; i < 6; i++) {
    setTimeout(() => tono(azar(900, 1700), 0.12, "triangle", 0.05), i * azar(60, 220));
  }
}

function moverMinis(dt) {
  for (let i = minis.length - 1; i >= 0; i--) {
    const m = minis[i];
    m.t += dt;
    /* Suben un poco y se frenan: un pájaro pequeño no va recto. */
    m.vy += (-18 - m.vy * 0.4) * dt;
    m.vx *= Math.exp(-0.5 * dt);
    m.x += m.vx * dt;
    m.y += m.vy * dt + Math.sin(m.t * 9 + m.ala) * dt * 30;
    m.ala += dt * 16;
    m.chilla -= dt;
    if (m.chilla <= 0) { m.chilla = azar(0.8, 2.4); tono(azar(1100, 1900), 0.09, "triangle", 0.03); }
    if (m.t > m.vida) minis.splice(i, 1);
  }
}

function dibujarMinis() {
  for (const m of minis) {
    const x = enPantalla(m.x, m.z);
    if (x < -50 || x > A + 50) continue;
    const k = clamp01(1 - m.t / m.vida);
    const r = m.r;
    ctx.save();
    ctx.translate(x, m.y);
    ctx.globalAlpha = Math.min(1, k * 2.5);
    /* Las alas, que son casi todo lo que se ve de algo que vuela. */
    const abre = Math.sin(m.ala) * 0.9;
    ctx.fillStyle = "rgba(10,14,12,0.92)";
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.rotate(s * (0.4 + abre));
      ctx.beginPath();
      ctx.ellipse(s * r * 0.7, 0, r * 0.75, r * 0.3, 0, 0, 6.283);
      ctx.fill();
      ctx.restore();
    }
    ctx.beginPath();
    ctx.ellipse(0, 0, r * 0.7, r * 0.8, 0, 0, 6.283);
    ctx.fill();
    /* Y los dos puntitos verdes. */
    ctx.globalCompositeOperation = "lighter";
    for (const s of [-1, 1]) {
      const gg = ctx.createRadialGradient(s * r * 0.3, -r * 0.2, 0, s * r * 0.3, -r * 0.2, r * 0.6);
      gg.addColorStop(0, "rgba(180,255,210,0.9)");
      gg.addColorStop(1, "rgba(60,220,140,0)");
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(s * r * 0.3, -r * 0.2, r * 0.6, 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

/* ---- Dibujar el búho ---------------------------------------------------- */

/**
 * LA RAMA EN LA QUE ESTÁ POSADO.
 *
 * ── POR QUÉ SALE HACIA UN LADO Y NO ES SIMÉTRICA ─────────────────────
 * Porque una rama nace de un tronco. La de antes era un huso con la
 * misma punta a los dos lados, o sea un palo flotando: no venía de
 * ninguna parte. Ésta es gorda por donde se agarra al árbol —que queda
 * fuera de pantalla, o detrás de la niebla— y se va afinando hasta la
 * punta, con dos ramitas saliendo por arriba.
 *
 * ── Y SE COMBA ───────────────────────────────────────────────────────
 * Una rama que no cede bajo un bicho de dos kilos no está aguantando
 * nada. `pesa` la hunde por donde está el búho y la deja subir en la
 * punta, y respira despacio con él: lo justo para que se vea que hay
 * peso encima.
 */
function dibujarRamaDelBuho(b, r, sal) {
  /* A qué lado está el árbol. Es fijo por búho: se saca de su sitio en
     el mundo, así que al cambiar de rama puede cambiar de lado, pero
     mientras esté en una no baila. */
  const lado = Math.sin(b.x * 0.013) < 0 ? -1 : 1;
  const largo = r * 5.2;
  const pesa = r * (0.16 + Math.sin(b.respira || 0) * 0.03);
  const y0 = r * 1.16;

  ctx.save();
  ctx.fillStyle = `rgba(6,10,9,${0.94 * sal})`;
  ctx.beginPath();
  /* El canto de arriba: del tronco hasta la punta, hundiéndose donde
     se apoya el búho. */
  ctx.moveTo(-lado * largo, y0 - r * 0.34);
  ctx.quadraticCurveTo(-lado * largo * 0.3, y0 + pesa * 0.8,
                       lado * largo * 0.55, y0 + pesa);
  ctx.lineTo(lado * largo * 0.72, y0 + pesa * 0.72);
  /* Y el de abajo, de vuelta: más separado junto al tronco. */
  ctx.quadraticCurveTo(-lado * largo * 0.28, y0 + pesa + r * 0.3,
                       -lado * largo, y0 + r * 0.22);
  ctx.closePath();
  ctx.fill();

  /* Dos ramitas hacia arriba, para que la rama tenga de dónde. */
  ctx.strokeStyle = `rgba(6,10,9,${0.9 * sal})`;
  ctx.lineCap = "round";
  for (let i = 0; i < 2; i++) {
    const t = 0.25 + i * 0.42;
    const bx = mez(-lado * largo, lado * largo * 0.6, t);
    const by = y0 + pesa * t;
    ctx.lineWidth = Math.max(1, r * (0.16 - i * 0.05));
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.quadraticCurveTo(bx + lado * r * 0.5, by - r * 0.5,
                         bx + lado * r * 0.95, by - r * (0.75 + i * 0.3));
    ctx.stroke();
  }

  /* El filo de luna por el canto de arriba. */
  ctx.strokeStyle = `rgba(150,186,246,${0.14 * sal})`;
  ctx.lineWidth = Math.max(1, r * 0.08);
  ctx.beginPath();
  ctx.moveTo(-lado * largo, y0 - r * 0.34);
  ctx.quadraticCurveTo(-lado * largo * 0.3, y0 + pesa * 0.8,
                       lado * largo * 0.55, y0 + pesa);
  ctx.stroke();
  ctx.restore();
}

/**
 * LAS PATAS, agarrando.
 *
 * Tres dedos: dos hacia delante y uno hacia atrás, que es como agarra
 * un búho. Y no están apoyadas encima de la rama: la RODEAN, con las
 * puntas metiéndose por debajo del canto. Eso es agarrar; lo otro es
 * estar de pie.
 */
function dibujarPatasDelBuho(b, r, sal) {
  const pesa = r * (0.16 + Math.sin(b.respira || 0) * 0.03);
  const y0 = r * 1.16 + pesa;
  /* Al estar alerta aprieta: los dedos se cierran un poco. */
  const aprieta = 0.8 + clamp01(b.visto) * 0.25;

  ctx.save();
  ctx.strokeStyle = `rgba(172,140,84,${0.8 * sal})`;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  for (const s of [-1, 1]) {
    const px = s * r * 0.3;
    /* La pata: del vientre a la rama. Cortísima, que es lo que se ve de
       un búho posado: casi nada de pierna. */
    ctx.lineWidth = Math.max(1, r * 0.13);
    ctx.beginPath();
    ctx.moveTo(px, r * 0.92);
    ctx.lineTo(px, y0 - r * 0.02);
    ctx.stroke();
    /* Los tres dedos. */
    ctx.lineWidth = Math.max(1, r * 0.09);
    for (const [dir, largo] of [[-1, 0.3], [1, 0.34], [0.35, 0.22]]) {
      ctx.beginPath();
      ctx.moveTo(px, y0 - r * 0.04);
      ctx.quadraticCurveTo(px + dir * r * largo, y0 + r * 0.02,
                           px + dir * r * largo * aprieta, y0 + r * 0.2);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function dibujarBuhoEsp() {
  const b = buhoEsp;
  if (b.sal < 0.015 && b.ataque < 0) { dibujarMinis(); return; }

  /* Durante el ataque se centra; el resto del tiempo está donde está. */
  const cen = b.centrado || 0;
  const x = mez(enPantalla(b.x, 0.52), A * 0.5, cen);
  const y = mez(b.y, H * 0.5, cen);
  const r = b.r * b.escala;
  const sal = clamp01(b.sal);
  const cerrado = Math.sin(clamp01(b.parpadeo) * Math.PI);
  const abierto = clamp01(1 - cerrado);

  /* El color de los ojos: verde o rojo, mezclado. */
  const rr = Math.round(mez(170, 255, b.rojo));
  const gg2 = Math.round(mez(255, 60, b.rojo));
  const bb = Math.round(mez(205, 50, b.rojo));

  ctx.save();
  ctx.translate(x, y);
  ctx.globalAlpha = mez(0.35, 1, sal);

  /* ---- LA RAMA, y por qué va DEBAJO ------------------------------
     Antes se pintaba al final, después del búho, y era un huso
     simétrico flotando debajo de él: una rama que no venía de ningún
     árbol y que además tapaba las patas, porque no había patas.

     Ahora va primero —el que se posa está ENCIMA de la rama, no al
     revés—, sale hacia un lado buscando el tronco del que nace, y se
     afina hacia la punta. Y se comba con el peso: `pesa` es cuánto la
     hunde el búho, y sube y baja despacito con la respiración. Una
     rama que no cede no está aguantando nada. */
  if (b.ataque < 0) dibujarRamaDelBuho(b, r, sal);

  /* Las alas. */
  const abre = 0.12 + b.aleteo * (0.5 + Math.sin(b.ala) * 0.5) * 1.2;
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * r * 0.62, -r * 0.1);
    ctx.rotate(s * (0.35 + abre));
    ctx.beginPath();
    ctx.ellipse(0, r * 0.35, r * 0.44, r * 0.98, 0, 0, 6.283);
    ctx.fillStyle = "rgba(8,12,11,0.95)";
    ctx.fill();
    ctx.strokeStyle = `rgba(${rr},${gg2},${bb},${0.1 + b.aleteo * 0.2})`;
    ctx.lineWidth = Math.max(0.8, r * 0.08);
    ctx.stroke();
    ctx.restore();
  }

  /* El cuerpo: negro, con un filo verde por el lado de la luz. */
  const gc = ctx.createLinearGradient(0, -r * 1.2, 0, r * 1.2);
  gc.addColorStop(0, "rgb(7,11,10)");
  gc.addColorStop(1, "rgb(14,20,18)");
  ctx.fillStyle = gc;
  /* Respira: se ensancha un pelín y se acorta otro pelín, que es lo
     que hace un pecho al llenarse. Y al erizarse se hincha de golpe y
     se desinfla despacio. */
  const aire = Math.sin(b.respira) * 0.018 + b.pluma * 0.06;
  ctx.beginPath();
  ctx.ellipse(0, r * aire * 0.5, r * (1 + aire), r * 1.22 * (1 - aire * 0.35),
    0, 0, 6.283);
  ctx.fill();
  /* Y las puntas de las plumas erizadas, sólo cuando se eriza. */
  if (b.pluma > 0.04) {
    ctx.save();
    ctx.strokeStyle = `rgba(18,26,24,${b.pluma * 0.9})`;
    ctx.lineWidth = Math.max(1, r * 0.07);
    ctx.lineCap = "round";
    for (let i = 0; i < 9; i++) {
      const a2 = 0.5 + (i / 8) * 2.14;
      const rr2 = r * (1 + aire);
      ctx.beginPath();
      ctx.moveTo(Math.cos(a2) * rr2 * 0.94, Math.sin(a2) * r * 1.16);
      ctx.lineTo(Math.cos(a2) * rr2 * (1.1 + b.pluma * 0.14),
                 Math.sin(a2) * r * (1.28 + b.pluma * 0.1));
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.strokeStyle = `rgba(${rr},${gg2},${bb},${(0.1 + b.visto * 0.25) * sal})`;
  ctx.lineWidth = Math.max(1, r * 0.1);
  ctx.stroke();

  /* La cabeza, que gira. */
  ctx.save();
  ctx.translate(b.giro * r * 0.16, -r * 0.62);
  /* Las orejas. */
  ctx.fillStyle = "rgb(6,10,9)";
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * r * 0.24, -r * 0.34);
    ctx.lineTo(s * r * (0.62 + b.giro * s * 0.12), -r * 0.95);
    ctx.lineTo(s * r * 0.72, -r * 0.24);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = "rgb(11,16,15)";
  ctx.beginPath();
  ctx.ellipse(b.giro * r * 0.1, 0, r * 0.88, r * 0.74, 0, 0, 6.283);
  ctx.fill();

  /* LOS OJOS. */
  const cx = b.giro * r * 0.26;
  const brillo = (0.6 + Math.sin(reloj * 1.7) * 0.12 + b.visto * 0.6) * mez(0.4, 1, sal);
  ctx.globalCompositeOperation = "lighter";
  for (const s of [-1, 1]) {
    const ex = cx + s * r * 0.36, ey = -r * 0.04;
    if (abierto > 0.02) {
      const halo = r * (0.72 + b.visto * 0.5);
      const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, halo);
      g.addColorStop(0, `rgba(${Math.min(255, rr + 40)},${Math.min(255, gg2 + 30)},${Math.min(255, bb + 30)},${0.55 * abierto * brillo})`);
      g.addColorStop(0.34, `rgba(${rr},${gg2},${bb},${0.24 * abierto * brillo})`);
      g.addColorStop(1, `rgba(${rr},${gg2},${bb},0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ex, ey, halo, 0, 6.283); ctx.fill();
      ctx.fillStyle = `rgba(${Math.min(255, rr + 50)},${Math.min(255, gg2 + 20)},${Math.min(255, bb + 30)},${0.95 * abierto})`;
      ctx.beginPath();
      ctx.ellipse(ex, ey, r * 0.23, r * 0.23 * abierto, 0, 0, 6.283);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = `rgba(3,7,5,${0.9 * abierto})`;
      ctx.beginPath();
      ctx.ellipse(ex + b.giro * r * 0.05, ey, r * 0.1, r * 0.12 * abierto, 0, 0, 6.283);
      ctx.fill();
      ctx.globalCompositeOperation = "lighter";
    } else {
      ctx.strokeStyle = `rgba(${rr},${gg2},${bb},${0.3 * brillo})`;
      ctx.lineWidth = Math.max(0.7, r * 0.07);
      ctx.beginPath();
      ctx.moveTo(ex - r * 0.2, ey); ctx.lineTo(ex + r * 0.2, ey);
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = "source-over";

  /* El pico. */
  ctx.fillStyle = `rgba(190,150,80,${mez(0.3, 0.8, sal)})`;
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.1, r * 0.16);
  ctx.lineTo(cx + r * 0.1, r * 0.16);
  ctx.lineTo(cx + b.giro * r * 0.06, r * 0.42);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  /* ---- LAS PATAS ----
     Van al final de todo: agarran la rama POR ENCIMA, que es lo que
     hace una garra. Dibujadas antes quedarían debajo de la corteza y
     el búho volvería a estar apoyado en el aire.

     Tres dedos por pata: dos hacia delante y uno hacia atrás, que es
     como agarra un búho de verdad. Y se cierran un poco más cuando
     está alerta, porque al tensarse aprieta. */
  if (b.ataque < 0) dibujarPatasDelBuho(b, r, sal);

  ctx.restore();
  ctx.globalAlpha = 1;

  dibujarMinis();
}

/* ---- LOS OJOS DE LA ESPESURA --------------------------------------------

   Pares de ojos rojos en las zonas oscuras. Cada uno a su profundidad,
   medio tapados por los troncos, y se van si te acercas.

   ── POR QUÉ HAY QUE DUDAR DE HABERLOS VISTO ──────────────────────────
   Porque si están siempre, son decoración. Aparecen pocos, duran poco y
   se van cuando los miras de frente. La sensación que se busca no es
   «hay ojos en el bosque»: es «¿eso de ahí era algo?».

   ── EL QUE AGUANTA ──────────────────────────────────────────────────
   Uno de cada tantos no huye. Se deja tocar tres veces, y a la tercera
   pasa lo que pasa. No hay manera de saber cuál es hasta que uno se
   queda quieto, y eso es justo lo que hace que se siga intentando. */

const ojosEsp = {
  lista: [],
  reloj: azar(4, 10),
  /* El evento: -1 quieto, si no, segundos desde que arrancó. */
  evento: -1,
  enjambre: [],
};

function asomarOjo(valiente) {
  const suelo = espesura.sueloY;
  /* En la zona que se está mirando, pero no en el centro: a los lados,
     que es donde el ojo no está puesto. */
  const centro = espesura.x + A * 0.5;
  const lado = Math.random() < 0.5 ? -1 : 1;
  const x = clamp(centro + lado * azar(A * 0.2, A * 0.55), U * 4, espesura.W - U * 4);
  const z = azar(0.2, 0.55);
  ojosEsp.lista.push({
    x, z,
    y: mez(espesura.copasY + H * 0.14, suelo - H * 0.02, azar(0.2, 0.95)),
    r: U * mez(1.15, 0.5, z),
    alfa: 0, alfaObj: azar(0.55, 0.95),
    dura: valiente ? 999 : azar(2.5, 7),
    parpadeo: 0, relojParpadeo: azar(0.8, 2.6),
    huyendo: 0, vx: 0,
    /* Hacia dónde mira y con qué ritmo late. Un par que mira de frente
       inquieta el triple que uno que mira de lado. */
    mira: Math.random() < 0.45 ? 0 : azar(-0.5, 0.5),
    fase: Math.random() * 6.283,
    valiente: !!valiente,
    toques: 0,
    vibra: 0,
  });
}

function moverOjosEsp(dt) {
  if (ojosEsp.evento >= 0) { moverEnjambre(dt); return; }

  /* Van saliendo solos, y más a menudo después del misterio. */
  ojosEsp.reloj -= dt;
  if (ojosEsp.reloj <= 0) {
    const listo = historia.hecho("revelado");
    ojosEsp.reloj = listo ? azar(3, 9) : azar(9, 22);
    if (ojosEsp.lista.length < (listo ? 5 : 2)) {
      /* Uno de cada cinco no huye. Y sólo cuando el bosque ya está
         despierto: antes de eso, todos se van. */
      asomarOjo(listo && Math.random() < 0.22);
    }
  }

  const centro = A * 0.5;
  for (let i = ojosEsp.lista.length - 1; i >= 0; i--) {
    const o = ojosEsp.lista[i];
    o.alfa = damp(o.alfa, o.alfaObj, o.huyendo ? 7 : 1.7, dt);
    o.x += o.vx * dt;
    o.vx *= Math.exp(-2.2 * dt);
    o.vibra = Math.max(0, o.vibra - dt * 2.4);

    o.relojParpadeo -= dt;
    if (o.relojParpadeo <= 0) { o.relojParpadeo = azar(1, 3.4); o.parpadeo = 1; }
    o.parpadeo = Math.max(0, o.parpadeo - dt * 3);

    /* Huir: si el sitio que miras se les echa encima. Los valientes no. */
    if (!o.huyendo && !o.valiente) {
      const sx = enPantalla(o.x, o.z);
      if (Math.abs(sx - centro) < A * 0.16) {
        o.huyendo = 1;
        o.alfaObj = 0;
        o.vx = (sx < centro ? -1 : 1) * U * azar(10, 22);
        o.dura = 0.6;
        historia.marcar("ojos");
      }
    }

    o.dura -= dt;
    if (o.dura <= 0) {
      if (!o.huyendo) { o.huyendo = 1; o.alfaObj = 0; o.dura = 0.9; }
      else ojosEsp.lista.splice(i, 1);
    }
  }
}

function tocarOjosEspesura(p) {
  if (ojosEsp.evento >= 0) return false;
  for (const o of ojosEsp.lista) {
    const sx = enPantalla(o.x, o.z);
    const sep = o.r * 5.2;
    if (Math.hypot(p.x - sx, p.y - o.y) > sep * 1.4) continue;

    historia.marcar("ojos");
    if (!o.valiente) {
      /* Se va, y encima se lleva un susto. */
      o.huyendo = 1; o.alfaObj = 0; o.dura = 0.3;
      o.vx = (sx < p.x ? -1 : 1) * U * 26;
      golpe(0.04, 2600, 0.06, "highpass");
      return true;
    }

    /* El valiente. */
    o.toques++;
    o.vibra = 1;
    o.alfaObj = Math.min(1.4, o.alfaObj + 0.25);
    tono(azar(70, 110), 0.5, "sawtooth", 0.05);
    if (o.toques >= 3) arrancarEnjambre(o);
    else decir(sx, o.y - U * 5,
      o.toques === 1 ? "…este no se fue." : "Sigue ahí. Viéndome.",
      { misterio: true, dur: 3.4 });
    return true;
  }
  return false;
}

/* ---- El enjambre --------------------------------------------------------
   El secreto del bosque. Los ojos que aguantaron revientan y, donde
   había uno, hay cuarenta.                                          */

function arrancarEnjambre(o) {
  ojosEsp.evento = 0;
  ojosEsp.origen = o;
  bloqueado = true;
  historia.marcar("enjambre");
  agacharAmbientes(0.1, 1.2);
}

function moverEnjambre(dt) {
  const t = ojosEsp.evento += dt;
  const o = ojosEsp.origen;

  /* 0 – 1.2  vibra y crece. */
  if (t < 1.2) {
    o.vibra = 1 + t;
    o.alfaObj = 1 + t * 0.5;
    o.alfa = o.alfaObj;
    if (Math.random() < dt * 20) tono(azar(60, 140), 0.12, "square", 0.03);
  }
  /* 1.2 – 1.6  la pausa. Nada. Silencio. */
  else if (t < 1.6) {
    o.vibra = 0;
  }
  /* 1.6  revienta, y aparecen todos. */
  else if (!ojosEsp.hecho) {
    ojosEsp.hecho = true;
    reventarLosOjos(o);
  }
  /* Y se quedan un rato mirando. */
  else if (t > 6.5 && !ojosEsp.acabado) {
    ojosEsp.acabado = true;
    /* Y entonces el búho deja de ser simpático. */
    setTimeout(() => arrancarAtaque(), 900);
  }

  /* El enjambre, mientras tanto: parpadean a destiempo y algunos se
     mueven un poco. */
  for (const e of ojosEsp.enjambre) {
    e.t += dt;
    e.alfa = damp(e.alfa, e.alfaObj, 2.4, dt);
    e.relojParpadeo -= dt;
    if (e.relojParpadeo <= 0) { e.relojParpadeo = azar(0.8, 4); e.parpadeo = 1; }
    e.parpadeo = Math.max(0, e.parpadeo - dt * 3);
    e.x += Math.sin(e.t * 0.6 + e.f) * dt * U * 0.8;
  }
}

function reventarLosOjos(o) {
  sacudir(1.3);
  golpe(0.3, 90, 0.34, "lowpass");
  golpe(0.1, 4200, 0.16, "highpass");
  o.alfa = 0; o.alfaObj = 0; o.dura = -1;
  ojosEsp.lista.length = 0;

  const sx = enPantalla(o.x, o.z);
  for (let i = 0; i < 50; i++) {
    const a = azar(0, 6.283), v = azar(60, 240);
    soltar(sx, o.y, {
      vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.7,
      vida: azar(0.6, 1.6), tam: azar(1, 2.6),
      tipo: TIPO.CHISPA,
    });
  }

  /* Y ahora sí: cuarenta pares por todo el bosque, a todas las
     profundidades. Los de delante grandes y brillantes, los del fondo
     dos puntos casi invisibles. Unos cuantos miran de frente. */
  ojosEsp.enjambre.length = 0;
  const suelo = espesura.sueloY;
  for (let i = 0; i < (flojo ? 22 : 44); i++) {
    const z = azar(0.12, 0.85);
    ojosEsp.enjambre.push({
      x: espesura.x + azar(-A * 0.2, A * 1.2),
      y: mez(espesura.copasY + H * 0.08, suelo, azar(0.1, 1)),
      z,
      r: U * mez(1.3, 0.42, z),
      alfa: 0, alfaObj: azar(0.4, 1) * mez(1, 0.5, z),
      parpadeo: 0, relojParpadeo: azar(0.4, 3),
      /* Los que miran de frente tienen la pupila centrada; los demás,
         corrida. Ese detalle es todo lo que hace que unos te miren. */
      mira: Math.random() < 0.3 ? 0 : azar(-0.5, 0.5),
      t: 0, f: rnd() * 6.283,
    });
  }

  setTimeout(() => decir(A * 0.5, H * 0.3, "…no estábamos solos.",
    { misterio: true, importante: true, dur: 5 }), 900);
}

/**
 * Un par de ojos, donde sea.
 *
 * ── POR QUÉ ESTÁN HECHOS DE CINCO CAPAS ──────────────────────────────
 * Porque un punto rojo con un degradado alrededor no es un ojo
 * encendido: es un punto rojo. Lo que hace que se claven en la pantalla
 * es que cada capa hace UNA cosa y ninguna hace dos:
 *
 *   1. el resplandor ancho, que tiñe el bosque de alrededor;
 *   2. el resplandor corto y saturado, que le da el color de verdad;
 *   3. el IRIS, un anillo brillante con su hueco dentro —sin hueco, un
 *      ojo es una bola—;
 *   4. la pupila negra, corrida hacia donde mira;
 *   5. y la chispa blanca, un punto diminuto arriba a un lado. Ese
 *      punto es el que convierte una luz en una MIRADA: es el reflejo
 *      de algo, y si hay reflejo hay superficie, y si hay superficie
 *      hay un ojo de verdad.
 *
 * Encima de todo eso late: el latido no es un cambio de opacidad sino
 * de TAMAÑO del resplandor, que es lo que hace que parezca que se
 * enciende por dentro en vez de que alguien le sube el brillo.
 */
function dibujarUnOjo(x, y, r, alfa, parpadeo, mira, vibra, fase) {
  const ab = 1 - Math.sin(clamp01(parpadeo) * Math.PI) * 0.94;
  const a = alfa * ab;
  if (a < 0.01) return;
  const vx = vibra ? azar(-vibra, vibra) * r : 0;
  const vy = vibra ? azar(-vibra, vibra) * r * 0.6 : 0;
  const sep = r * 5.2;
  /* El latido: cada par con su propio desfase, para que no respiren
     todos a la vez como un semáforo. */
  const late = 0.82 + 0.18 * Math.sin(reloj * 2.3 + (fase || 0));
  const halo = r * 4.6 * late;

  ctx.globalCompositeOperation = "lighter";
  for (const s of [-1, 1]) {
    const ex = x + vx + s * sep * 0.5;
    const ey = y + vy;

    /* 1. El resplandor ancho. Rojo oscuro, muy abierto: es la luz que
          moja los árboles de alrededor. */
    const g1 = ctx.createRadialGradient(ex, ey, 0, ex, ey, halo);
    g1.addColorStop(0, `rgba(255,60,40,${0.4 * a})`);
    g1.addColorStop(0.25, `rgba(230,24,18,${0.16 * a})`);
    g1.addColorStop(1, "rgba(160,8,6,0)");
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(ex, ey, halo, 0, 6.283); ctx.fill();

    /* 2. El resplandor corto y saturado. Aquí está el color. */
    const g2 = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 1.9 * late);
    g2.addColorStop(0, `rgba(255,170,130,${0.95 * a})`);
    g2.addColorStop(0.32, `rgba(255,60,40,${0.7 * a})`);
    g2.addColorStop(1, "rgba(220,20,16,0)");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(ex, ey, r * 1.9 * late, 0, 6.283); ctx.fill();

    /* 3. El iris: un anillo, no un disco. */
    ctx.strokeStyle = `rgba(255,120,90,${0.9 * a})`;
    ctx.lineWidth = Math.max(0.8, r * 0.3);
    ctx.beginPath();
    ctx.ellipse(ex, ey, r * 0.7, r * 0.7 * ab, 0, 0, 6.283);
    ctx.stroke();
    /* El relleno del iris tira a naranja, no a blanco: en blanco los
       ojos se leían como dos focos, y en naranja se leen como algo que
       tiene sangre detrás. */
    ctx.fillStyle = `rgba(255,140,96,${0.8 * a})`;
    ctx.beginPath();
    ctx.ellipse(ex, ey, r * 0.55, r * 0.55 * ab, 0, 0, 6.283);
    ctx.fill();

    /* 4. La pupila. Negra de verdad, así que fuera del modo de sumar. */
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(6,0,0,${0.96 * a})`;
    ctx.beginPath();
    ctx.ellipse(ex + mira * r * 0.28, ey, r * 0.24, r * 0.34 * ab, 0, 0, 6.283);
    ctx.fill();

    /* 5. Y la chispa. Diminuta, arriba a un lado, y SIEMPRE al mismo
          lado en los dos ojos: la luz que la produce está en un sitio. */
    ctx.globalCompositeOperation = "lighter";
    if (ab > 0.4) {
      ctx.fillStyle = `rgba(255,248,240,${0.85 * a})`;
      ctx.beginPath();
      ctx.arc(ex - r * 0.26, ey - r * 0.28, r * 0.15, 0, 6.283);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = "source-over";
}

function dibujarOjosEsp() {
  for (const o of ojosEsp.lista) {
    const x = enPantalla(o.x, o.z);
    if (x < -90 || x > A + 90) continue;
    dibujarUnOjo(x, o.y, o.r, o.alfa, o.parpadeo, o.mira || 0, o.vibra * 0.5, o.fase || 0);
  }
  for (const e of ojosEsp.enjambre) {
    const x = enPantalla(e.x, e.z);
    if (x < -90 || x > A + 90) continue;
    dibujarUnOjo(x, e.y, e.r, e.alfa, e.parpadeo, e.mira, 0, e.f);
  }
}

/** Que salgan unos cuantos de golpe, al desenterrar el misterio. */
function despertarLosOjos() {
  for (let i = 0; i < 3; i++) setTimeout(() => asomarOjo(false), i * 500);
}

/** Y que el búho se entere. */
function reaccionaElBuho() {
  buhoEsp.rojoObj = 1;
  buhoEsp.visto = 1.2;
  setTimeout(() => { buhoEsp.rojoObj = 0; }, 2600);
  hablarElBuho(CONF.buhoEsp.alRevelar);
}

/* ---- EL ATAQUE ----------------------------------------------------------
   Lo que pasa cuando el bosque decide que ya has visto bastante.    */

function arrancarAtaque() {
  if (buhoEsp.ataque >= 0) return;
  buhoEsp.ataque = 0;
  buhoEsp.centrado = 0;
  /* La cámara se planta delante de él. Si el jugador estaba mirando a
     otra parte del bosque, el búho crecía y se echaba encima FUERA de
     la pantalla, y lo único que se veía era el golpe final salido de
     la nada. Un ataque que no se ve venir no es un ataque, es un
     fundido a negro con ruido. */
  espesura.x = clamp(buhoEsp.x - A * 0.5, 0, espesura.tope);
  espesura.vx = 0;
  buhoEsp.yendo = -1;
  buhoEsp.reventado = false;
  buhoEsp.sal = 1; buhoEsp.salObj = 1;
  buhoEsp.rojoObj = 1;
  bloqueado = true;
  historia.marcar("ataque");
  agacharAmbientes(0.06, 0.8);
}

function moverAtaque(dt) {
  const b = buhoEsp;
  const t = b.ataque += dt;
  b.rojo = damp(b.rojo, 1, 8, dt);

  /* Se va poniendo en medio de la pantalla mientras crece: si se
     quedara pegado a su árbol, al hacerse enorme se saldría por un
     canto y el golpe vendría de fuera. */
  b.centrado = suave3(clamp01(t / 1.4));

  /* 0 – 1.4  crece. Mucho. Y abre las alas. */
  if (t < 1.4) {
    b.escala = 1 + suave3(t / 1.4) * 3.2;
    b.aleteo = suave3(t / 1.4);
    b.visto = 1.5;
    b.ala += dt * 9;
    if (!b.dijo1 && t > 0.4) { b.dijo1 = true; decirJugador("…¿qué le pasa?"); }
    if (Math.random() < dt * 18) tono(azar(40, 90), 0.3, "sawtooth", 0.04);
  }
  /* 1.4 – 2.0  se queda quieto, enorme, mirando. La pausa antes. */
  else if (t < 2.0) {
    b.escala = 4.2;
    b.ala += dt * 3;
    if (!b.dijo2) { b.dijo2 = true; decirJugador("No, no, no —"); }
  }
  /* 2.0 – 2.9  vuela HACIA la cámara: crece a lo bestia y se centra. */
  else if (t < 2.9) {
    const k = suave3((t - 2.0) / 0.9);
    b.escala = mez(4.2, 30, k * k);
    b.ala += dt * 22;
    b.volando = k;
    if (!b.chillo) { b.chillo = true; chillidoAtaque(); }
    sacudir(k * 0.8);
  }
  /* 2.9  el golpe. */
  else if (!b.golpeado) {
    b.golpeado = true;
    golpeDelAtaque();
  }
  /* Y a partir de ahí, el desmayo. */
  else if (t > 3.1) {
    moverDesmayo(dt, t - 3.1);
  }
}

function chillidoAtaque() {
  if (!despertarAudio()) return;
  const c = audio.ctx, t = c.currentTime;
  /* Un chillido que BAJA, no que sube: lo que se acerca a toda
     velocidad baja de tono, y el oído lo sabe aunque no lo piense. */
  for (const [hz0, hz1, dur, vol] of [[1400, 380, 0.7, 0.1], [700, 190, 0.8, 0.08]]) {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sawtooth";
    o.frequency.setValueAtTime(hz0, t);
    o.frequency.exponentialRampToValueAtTime(hz1, t + dur);
    const f = c.createBiquadFilter();
    f.type = "bandpass"; f.Q.value = 3; f.frequency.value = 900;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f).connect(g).connect(audio.maestro);
    o.start(t); o.stop(t + dur + 0.05);
  }
  const src = c.createBufferSource(); src.buffer = bufferBlanco(1);
  const f2 = c.createBiquadFilter(); f2.type = "highpass"; f2.frequency.value = 1800;
  const g2 = c.createGain();
  g2.gain.setValueAtTime(0, t);
  g2.gain.linearRampToValueAtTime(0.1, t + 0.3);
  g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
  src.connect(f2).connect(g2).connect(audio.maestro);
  src.start(t);
}

function golpeDelAtaque() {
  sacudir(2);
  golpe(0.35, 70, 0.4, "lowpass");
  golpe(0.08, 3000, 0.2, "highpass");
  /* El destello se maneja por estilo y no por clase, igual que en el
     resto del archivo: la clase `is-ver` es del aviso de objeto. */
  elFlash.style.transition = "none";
  elFlash.style.opacity = "0.9";
  requestAnimationFrame(() => {
    elFlash.style.transition = "opacity 420ms cubic-bezier(0.22,1,0.36,1)";
    elFlash.style.opacity = "0";
  });
  for (let i = 0; i < 40; i++) {
    const a = azar(0, 6.283);
    soltar(A * 0.5, H * 0.5, {
      vx: Math.cos(a) * azar(120, 420), vy: Math.sin(a) * azar(120, 380),
      vida: azar(0.4, 1.1), tam: azar(1, 3),
      tipo: TIPO.CHISPA,
    });
  }
  decirJugador("¡Ah—!");
}

/** Lo que dice el jugador durante el ataque. Corto y seguido. */
function decirJugador(txt) {
  decir(A * 0.5, H * 0.66, txt, { mimo: true, importante: true, dur: 2.2 });
}

/* ---- El desmayo ---------------------------------------------------------
   Se apaga todo: la imagen, el sonido y el pulso de la cámara. Y lo
   que queda al final es negro y nada más.                           */

function moverDesmayo(dt, t) {
  void dt;
  const k = clamp01(t / 2.6);
  cine.velo = suave3(k);
  /* La cámara pierde el equilibrio: se ladea y se va yendo. */
  cam.oz = mez(1, 1.25, k);
  cam.ox = Math.sin(t * 1.7) * A * 0.06 * (1 - k * 0.4);
  cam.oy = mez(0, H * 0.1, k);
  if (k > 0.25 && k < 0.9 && Math.random() < 0.06) {
    soltar(azar(0, A), azar(0, H), {
      vx: azar(-10, 10), vy: azar(-20, 6),
      vida: azar(1, 2.4), tam: azar(1, 2.6),
      tipo: TIPO.BRILLO, tono: 0.45,
    });
  }
  if (k >= 1 && !buhoEsp.desmayado) {
    buhoEsp.desmayado = true;
    despertarEnLaCabana();
  }
}

/* ══════════════════════════════════════════════════════════════════════
   LA CACERÍA

   Lo que pasa cuando se recoge la escopeta del final del bosque.

   ── POR QUÉ ESTO NO ES UN MINIJUEGO PEGADO ───────────────────────────
   Porque no cambia de pantalla, no para el mundo y no pide nada. El
   bosque sigue siendo el mismo bosque: los mismos árboles, el mismo
   suelo, las mismas luciérnagas. Lo que cambia es el CLIMA —empieza a
   llover, baja la luz, caen rayos— y lo que sale de entre los árboles.
   Se puede seguir andando con los mismos botones de siempre.

   ── LAS REGLAS, EN TRES LÍNEAS ───────────────────────────────────────
   Cinco oleadas, cada una más grande. Cinco vidas. Los búhos vienen
   hacia ti creciendo, y hay que tocarlos antes de que lleguen. Al que
   se toca no se le mata: revienta en luz, que es otra cosa.

   ── POR QUÉ LOS BÚHOS VIVEN EN COORDENADAS DE PANTALLA ───────────────
   Todo lo demás de la espesura vive en coordenadas de MUNDO y se
   proyecta según dónde esté la cámara. Éstos no: éstos van a por ti.
   Si vivieran en el mundo, andar dos pasos los dejaría atrás y el
   ataque se esquivaría caminando, que es justo lo que no puede pasar.
   ══════════════════════════════════════════════════════════════════════ */

/* Cuántos búhos trae cada oleada. Cinco números y se acabó: subir la
   dificultad es cambiar esta línea. */
/* Diez oleadas. Las cinco primeras son las de siempre; de la sexta a la
   novena aprieta, y la décima no es una oleada: es EL JEFE. */
const OLEADAS = [3, 5, 7, 10, 14, 12, 16, 18, 22, 0];
const OLEADA_JEFE = 10;
const VIDAS = 5;

/* ══════════════════════════════════════════════════════════════════════
   EL JEFE DE LA DÉCIMA, Y LA ROCA

   ── POR QUÉ NO ES «UN BÚHO CON MÁS VIDA» ─────────────────────────────
   Porque un enemigo con más vida no cambia nada: se hace lo mismo más
   rato. Lo que convierte esto en una pelea es que el jefe hace algo que
   no se puede resolver disparando —escupe fuego— y que hay UN SITIO en
   el escenario donde ese fuego no llega.

   De ahí sale el bucle que hace que sea un combate y no una diana:
   esconderse cuando escupe, salir cuando para, disparar, y volver. El
   que se queda fuera se quema; el que se queda dentro no gana nunca.

   ── LA ROCA ──────────────────────────────────────────────────────────
   Está en el mundo, no en la pantalla: es un peñasco que lleva ahí
   desde siempre, en un sitio fijo del bosque. Hay que ANDAR hasta él.
   Por eso el jefe aparece donde aparece —cerca— y por eso la cacería
   deja andar mientras se dispara.

   Y para en serio: el fuego que la cruza se apaga contra ella. No es
   una zona segura invisible, es que la bola choca con la piedra.
   ══════════════════════════════════════════════════════════════════════ */

const jefe = {
  vivo: false,
  vida: 0, vidaMax: 30,
  x: 0, y: 0,            // pantalla
  f: 0,
  ala: 0,
  /* El ciclo: carga · escupe · descansa. */
  modo: "entrando",
  t: 0,
  dolor: 0,
  bolas: [],
  entrada: 0,
};

const caza = {
  /* no · aviso · oleada · pausa · final · perdida */
  fase: "no",
  oleada: 0,
  vidas: VIDAS,
  t: 0,
  /* Cuántos faltan por salir en esta oleada, y cuándo sale el próximo. */
  porSalir: 0,
  relojSalida: 0,
  buhos: [],
  anillos: [],
  /* El fogonazo del cañón y el enfriamiento entre disparos. */
  disparo: 0,
  fogonazo: 0,
  /* El arma en la mano: hacia dónde apunta, cuánto retrocede y los
     casquillos que va soltando. */
  apunta: -1.15, apuntaObj: -1.15,
  culatazo: 0,
  casquillos: [],
  /* Cuánto se ha oscurecido el bosque. */
  oscuro: 0, oscuroObj: 0,
  /* Lo que había antes, para devolverlo al acabar. */
  lluviaAntes: 0, tormentaAntes: 0,
  hecha: false,
  avisadaAyuda: false,
};

/** ¿Se está peleando ahora mismo? */
function enCombate() {
  return caza.fase === "oleada" || caza.fase === "pausa" || caza.fase === "aviso";
}

/** Dónde está el jugador, en coordenadas de pantalla. */
function sitioJugador() {
  return { x: A * 0.5, y: H * 0.88 };
}

function arrancarCaceria() {
  if (caza.fase !== "no" || escena !== "espesura") return;
  caza.fase = "aviso";
  caza.t = 0;
  caza.oleada = 0;
  caza.vidas = VIDAS;
  caza.buhos.length = 0;
  caza.anillos.length = 0;
  caza.casquillos.length = 0;
  caza.culatazo = 0;
  caza.apunta = caza.apuntaObj = -1.15;
  caza.avisadaAyuda = false;
  caza.dicho = false;
  /* `hecha` es «esta partida ya llegó al final», no «ya la jugaste
     alguna vez». Lo segundo lo guarda el hito, que no se toca. */
  caza.hecha = false;
  caza.lluviaAntes = clima.lluviaObj;
  caza.tormentaAntes = clima.tormentaObj;
  /* Que llueva. No de golpe: `lluviaObj` es un objetivo y el clima va
     hacia él con su propia inercia, así que el agua ARRANCA. */
  clima.lluviaObj = 1;
  clima.tormentaObj = 0.8;
  caza.oscuroObj = 1;
  refrescarVidas(true);
  decir(A * 0.5, H * 0.4, CONF.caza.arranque, { misterio: true, importante: true, dur: 4 });
}

function siguienteOleada() {
  caza.oleada++;
  if (caza.oleada > OLEADAS.length) { terminarCaceria(); return; }
  caza.fase = "oleada";
  caza.t = 0;
  caza.porSalir = OLEADAS[caza.oleada - 1];
  caza.relojSalida = 0.35;
  decir(A * 0.5, H * 0.34, CONF.caza.oleadas[caza.oleada - 1],
    { misterio: true, importante: true, dur: 3.2 });
  /* La décima no trae búhos: trae al jefe. */
  if (caza.oleada === OLEADA_JEFE) { arrancarJefe(); return; }
  /* Un trueno por oleada, y cada vez más cerca. */
  lanzarRayo(mez(2.2, 0.25, (caza.oleada - 1) / (OLEADAS.length - 1)));
}

/** Saca un búho por un canto de la pantalla. */
function soltarBuhoCaza() {
  const J = sitioJugador();
  /* Salen de arriba y de los lados, nunca de abajo: abajo estás tú. */
  const desde = Math.random();
  let x, y;
  if (desde < 0.34) { x = azar(-A * 0.1, A * 1.1); y = -H * 0.05; }
  else if (desde < 0.67) { x = -A * 0.08; y = azar(H * 0.05, H * 0.6); }
  else { x = A * 1.08; y = azar(H * 0.05, H * 0.6); }

  caza.buhos.push({
    x0: x, y0: y,
    x, y,
    d: 1,
    /* Cada uno a lo suyo: si todos tardaran lo mismo, llegarían en
       bloque y se convertiría en un ritmo, no en un ataque. */
    vel: azar(0.1, 0.17) * (1 + (caza.oleada - 1) * 0.06),
    f: azar(0, 6.283),
    vaiven: azar(0.6, 1.5) * (Math.random() < 0.5 ? -1 : 1),
    ala: 0,
    muerte: -1,
    J,
  });
}

function moverCaceria(dt) {
  /* Los anillos de las explosiones viven aunque no haya cacería: si se
     apagaran con la última oleada, el último búho reventaría a medias. */
  for (let i = caza.anillos.length - 1; i >= 0; i--) {
    const a = caza.anillos[i];
    a.t += dt;
    if (a.t > a.dur) caza.anillos.splice(i, 1);
  }
  caza.disparo = Math.max(0, caza.disparo - dt);
  caza.fogonazo = Math.max(0, caza.fogonazo - dt * 6);
  caza.oscuro = damp(caza.oscuro, caza.oscuroObj, 1.1, dt);
  /* El arma vuelve sola al apoyo y el culatazo se le pasa. */
  caza.apunta = damp(caza.apunta, caza.apuntaObj, 11, dt);
  caza.culatazo = Math.max(0, caza.culatazo - dt * 4.5);
  if (caza.fase === "no" && !caza.casquillos.length) {
    caza.apuntaObj = damp(caza.apuntaObj, -1.15, 2, dt);
  }
  /* Los casquillos caen, rebotan una vez y se apagan. */
  for (let i = caza.casquillos.length - 1; i >= 0; i--) {
    const c = caza.casquillos[i];
    c.t += dt;
    c.vy += 780 * dt;
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.giro += c.giroV * dt;
    if (c.y > H - U * 2 && c.vy > 0) { c.y = H - U * 2; c.vy *= -0.32; c.vx *= 0.6; c.giroV *= 0.5; }
    if (c.t > 2.6) caza.casquillos.splice(i, 1);
  }

  if (caza.fase === "no") return;
  caza.t += dt;

  if (caza.fase === "aviso") {
    if (caza.t > 3.2) siguienteOleada();
    return;
  }

  if (caza.fase === "pausa") {
    if (caza.t > 2.8) siguienteOleada();
    return;
  }

  if (caza.fase === "final") {
    moverFinalCaceria(dt);
    return;
  }

  if (caza.fase !== "oleada") return;

  moverJefe(dt);

  /* ---- Sacar los que falten ---- */
  if (caza.porSalir > 0) {
    caza.relojSalida -= dt;
    if (caza.relojSalida <= 0) {
      /* Cuanto más avanzada la oleada, más juntos salen. */
      caza.relojSalida = azar(0.5, 1.1) / (1 + (caza.oleada - 1) * 0.22);
      caza.porSalir--;
      soltarBuhoCaza();
    }
  }

  /* ---- Moverlos ---- */
  const J = sitioJugador();
  for (let i = caza.buhos.length - 1; i >= 0; i--) {
    const o = caza.buhos[i];
    /* El bucle va hacia atrás, que es lo que hace falta para poder
       quitar bichos de la lista sin saltarse ninguno. Pero eso sólo
       cubre los que se quita ESTE bucle: `golpearAlJugador`, ahí abajo,
       puede terminar la partida, y al terminarla VACÍA la lista entera.
       El índice que quedaba pendiente ya no apunta a nada.

       Pasaba justo al perder la última vida —el peor momento posible
       para que reviente el bucle de dibujo— y se llevaba por delante la
       pantalla de derrota. */
    if (!o) break;
    o.ala += dt * mez(7, 13, 1 - o.d);

    if (o.muerte >= 0) {
      o.muerte += dt;
      if (o.muerte > 0.45) caza.buhos.splice(i, 1);
      continue;
    }

    o.d -= o.vel * dt;
    /* La posición sale de interpolar entre de dónde salió y dónde
       estás tú, con un vaivén encima. El vaivén se APAGA al acercarse:
       un búho que serpentea hasta el último palmo es imposible de
       tocar, y eso no es difícil, es injusto. */
    const k = 1 - clamp01(o.d);
    const suave = suave3(k);
    const bal = Math.sin(o.f + reloj * 2.2 * o.vaiven) * A * 0.13 * (1 - suave);
    o.x = mez(o.x0, J.x, suave) + bal;
    o.y = mez(o.y0, J.y, suave) - Math.sin(suave * Math.PI) * H * 0.08;

    if (o.d <= 0) {
      caza.buhos.splice(i, 1);
      golpearAlJugador(o);
      /* Y si con ese golpe se acabó la partida, aquí ya no queda nada
         que mover. */
      if (caza.fase !== "oleada") return;
    }
  }

  /* ---- ¿Se acabó la oleada? ---- */
  if (caza.porSalir === 0 && !caza.buhos.some((o) => o.muerte < 0) && !jefe.vivo) {
    caza.fase = "pausa";
    caza.t = 0;
    if (caza.oleada < OLEADAS.length) {
      decir(A * 0.5, H * 0.38, CONF.caza.entreOleadas, { dur: 2.4 });
    }
  }
}

/** El radio en pantalla de un búho, según lo cerca que esté. */
function radioBuhoCaza(o) {
  return U * mez(1.4, 10, Math.pow(1 - clamp01(o.d), 1.7));
}

/* ---- Disparar ----------------------------------------------------------- */

function dispararEscopeta(p) {
  if (caza.disparo > 0) return true;
  caza.disparo = 0.42;
  caza.fogonazo = 1;
  caza.culatazo = 1;
  sacudir(0.45);

  /* El arma apunta a donde se tocó. El ángulo se guarda como OBJETIVO y
     el cañón llega solo: un arma que se teletransporta al sitio nuevo
     en un cuadro no pesa nada. */
  const J = sitioJugador();
  caza.apuntaObj = Math.atan2(p.y - J.y, p.x - J.x);

  /* El humo del cañón, en la boca y no en el centro de la pantalla. */
  const boca = bocaDelCanon();
  for (let i = 0; i < (flojo ? 3 : 7); i++) {
    soltar(boca.x + azar(-U, U), boca.y + azar(-U, U), {
      vx: Math.cos(caza.apunta) * azar(30, 90) + azar(-20, 20),
      vy: Math.sin(caza.apunta) * azar(30, 90) + azar(-30, 0),
      vida: azar(0.7, 1.6), tam: azar(U * 0.4, U * 1),
      tipo: TIPO.HUMO, tono: 0.2,
    });
  }
  /* Y unas chispas de pólvora. */
  for (let i = 0; i < (flojo ? 3 : 8); i++) {
    const a2 = caza.apunta + azar(-0.4, 0.4);
    soltar(boca.x, boca.y, {
      vx: Math.cos(a2) * azar(120, 320), vy: Math.sin(a2) * azar(120, 320),
      vida: azar(0.2, 0.5), tam: azar(0.8, 1.8),
      tipo: TIPO.CHISPA, tono: 0.1,
    });
  }
  /* El casquillo, saltando hacia un lado. */
  caza.casquillos.push({
    x: J.x + Math.cos(caza.apunta) * U * 9,
    y: J.y + Math.sin(caza.apunta) * U * 9 - U * 2,
    vx: azar(50, 130), vy: azar(-190, -120),
    giro: azar(0, 6.283), giroV: azar(-14, 14), t: 0,
  });
  if (caza.casquillos.length > 14) caza.casquillos.shift();

  /* El estampido. Si has dejado tu `audio/disparo.mp3`, suena ése; si
     no, el sintetizado de siempre: un golpe de ruido grave y ancho, y
     encima el chasquido del cerrojo un pelín después. Los dos, o suena
     a globo. */
  sonarSuelto(CONF.rutas.sueltos.disparo, 0.85).then((ok) => {
    if (ok) return;
    golpe(0.2, 160, 0.42, "lowpass");
    golpe(0.06, 900, 0.3, "bandpass");
  });
  sonarSuelto(CONF.rutas.sueltos.recarga, 0.5, 0.26).then((ok) => {
    if (!ok) setTimeout(() => golpe(0.03, 2200, 0.12, "bandpass"), 260);
  });

  /* ---- A qué le ha dado ----
     Al MÁS CERCANO de los que caen dentro del tiro, no al primero de la
     lista: con una escopeta apuntas a un sitio, no a un objeto. El
     margen es generoso a propósito —es una escopeta, no un rifle— y
     crece con lo cerca que esté el bicho. */
  let mejor = null, mejorD = Infinity;
  for (const o of caza.buhos) {
    if (o.muerte >= 0) continue;
    const r = radioBuhoCaza(o);
    const d = Math.hypot(p.x - o.x, p.y - o.y);
    if (d > r * 1.7 + U * 4) continue;
    if (d < mejorD) { mejorD = d; mejor = o; }
  }
  if (mejor) { reventarBuho(mejor); return true; }

  /* ¿Y al jefe? Va después de los búhos: si hay uno pequeño encima de
     él, se le da al pequeño. Es lo que haría cualquiera. */
  if (jefe.vivo && jefe.entrada > 0.5
      && Math.hypot(p.x - jefe.x, p.y - jefe.y) < U * 13) {
    herirJefe();
    return true;
  }

  humoDeFallo(p);
  return true;
}

/** Cuando no le da a nada: un poco de humo y hojas, para que se note. */
function humoDeFallo(p) {
  for (let i = 0; i < 4; i++) {
    soltar(p.x + azar(-U * 3, U * 3), p.y + azar(-U * 3, U * 3), {
      vx: azar(-20, 20), vy: azar(-30, -6),
      vida: azar(0.8, 1.6), tam: azar(U * 0.4, U * 0.9),
      tipo: TIPO.HUMO, tono: 0.2,
    });
  }
}

/**
 * REVENTAR UN BÚHO.
 *
 * ── POR QUÉ NO SE MUERE, REVIENTA EN LUZ ─────────────────────────────
 * Porque esto es un bosque encantado y porque la novia de quien esto
 * escribe no tiene por qué ver morir a nada. Lo que se dispara no es
 * un animal: es lo que sea que lo está ocupando, y al darle se deshace
 * en lo que estaba hecho.
 *
 * Son cuatro cosas a la vez, y hacen falta las cuatro para que se lea
 * como magia y no como una explosión: el ANILLO que se abre, las
 * ESQUIRLAS de luz que salen disparadas, el HUMO que queda flotando y
 * las CHISPAS que caen después, más despacio que todo lo demás.
 */
function reventarBuho(o) {
  o.muerte = 0;
  const r = radioBuhoCaza(o);

  caza.anillos.push({ x: o.x, y: o.y, r0: r, t: 0, dur: 0.55 });

  /* Las esquirlas: verdes, que es el color de lo que hay enterrado en
     este bosque. */
  const n = flojo ? 10 : 22;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 6.283 + azar(-0.2, 0.2);
    const v = azar(60, 220);
    soltar(o.x, o.y, {
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 20,
      vida: azar(0.6, 1.5), tam: azar(1.2, 3),
      tipo: TIPO.BRILLO, tono: 0.45,
    });
  }
  /* El humo, que se queda. */
  for (let i = 0; i < (flojo ? 2 : 5); i++) {
    soltar(o.x + azar(-r * 0.4, r * 0.4), o.y + azar(-r * 0.4, r * 0.4), {
      vx: azar(-16, 16), vy: azar(-26, -6),
      vida: azar(1.4, 2.6), tam: azar(U * 0.5, U * 1.2),
      tipo: TIPO.HUMO, tono: 0.2,
    });
  }
  /* Y las chispas, que caen. */
  for (let i = 0; i < (flojo ? 4 : 9); i++) {
    soltar(o.x, o.y, {
      vx: azar(-70, 70), vy: azar(-90, -20),
      vida: azar(0.8, 1.8), tam: azar(0.8, 1.8),
      tipo: TIPO.CHISPA, tono: 0.3,
    });
  }

  magia(azar(520, 700));
  golpe(0.1, 300, 0.2, "lowpass");
}


/* ---- ESTAR A CUBIERTO ---------------------------------------------------

   La roca para el fuego si está ENTRE tú y el jefe. Eso no es una zona
   marcada en el suelo: es geometría. Se mira dónde cae la roca en la
   pantalla y si el jugador está lo bastante cerca de ella como para
   tenerla delante.

   ── POR QUÉ NO ES UN RECTÁNGULO EN EL SUELO ──────────────────────────
   Porque un rectángulo se aprende y deja de ser una roca: se mira el
   suelo en vez de mirar la roca. Con la distancia a la piedra de
   verdad, lo que hay que hacer es acercarse a ella, que es lo que hace
   cualquiera con una piedra y algo escupiéndole fuego.            */

function sitioRoca() {
  const q = puntos.lista.find((z) => z.id === "roca");
  if (!q) return null;
  return { x: enPantalla(q.x, q.z), y: q.y, r: q.r };
}

/** ¿El jugador está detrás de la roca? */
function aCubierto() {
  const R = sitioRoca();
  if (!R) return false;
  const J = sitioJugador();
  return Math.abs(J.x - R.x) < R.r * 1.15;
}

/* ---- EL JEFE ------------------------------------------------------------ */

function arrancarJefe() {
  jefe.vivo = true;
  jefe.vida = jefe.vidaMax;
  jefe.modo = "entrando";
  jefe.t = 0;
  jefe.dolor = 0;
  jefe.bolas.length = 0;
  jefe.entrada = 0;
  jefe.f = 0;
  jefe.ala = 0;
  /* Sale por arriba, en el tercio contrario a la roca: así lo primero
     que se hace es correr hacia la piedra. */
  const R = sitioRoca();
  jefe.x = R && R.x > A * 0.5 ? A * 0.26 : A * 0.74;
  jefe.y = -H * 0.2;
  clima.tormentaObj = 1;
  clima.lluviaObj = 1;
  caza.oscuroObj = 1;
  lanzarRayo(0.1);
  decir(A * 0.5, H * 0.3, CONF.caza.jefeLlega,
    { misterio: true, importante: true, dur: 3.2 });
  setTimeout(() => {
    if (jefe.vivo) decir(A * 0.5, H * 0.38, CONF.caza.jefePista, { importante: true, dur: 3 });
  }, 3200);
}

function moverJefe(dt) {
  if (!jefe.vivo) return;
  const J = sitioJugador();
  jefe.t += dt;
  jefe.f += dt;
  jefe.dolor = Math.max(0, jefe.dolor - dt * 2.6);
  jefe.entrada = Math.min(1, jefe.entrada + dt * 0.5);
  jefe.ala += dt * mez(3.4, 6.2, jefe.modo === "escupe" ? 1 : 0);

  /* Se queda arriba, meciéndose, y se desplaza despacio de un lado a
     otro: hay que reapuntar, no clavar el dedo en un sitio. */
  const alturaObj = H * 0.24;
  jefe.y = damp(jefe.y, alturaObj + Math.sin(jefe.f * 0.8) * H * 0.03, 1.6, dt);
  const paseo = A * 0.5 + Math.sin(jefe.f * 0.31) * A * 0.3;
  jefe.x = damp(jefe.x, paseo, 0.7, dt);

  /* ---- El ciclo ---- */
  if (jefe.modo === "entrando") {
    if (jefe.t > 3) { jefe.modo = "descansa"; jefe.t = 0; }
    return;
  }

  if (jefe.modo === "descansa") {
    /* Aquí es cuando se le puede disparar sin quemarse. Dura poco y
       cada vez menos: esa es toda la curva de dificultad. */
    const cuanto = mez(2.6, 1.5, 1 - jefe.vida / jefe.vidaMax);
    if (jefe.t > cuanto) { jefe.modo = "carga"; jefe.t = 0; }
  } else if (jefe.modo === "carga") {
