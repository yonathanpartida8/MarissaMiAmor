// ==========================================
// RESPONSIVE
// ==========================================
//
// No hay dos diseños: hay UNO que se mide contra `U` —la centésima
// parte del lado corto— y contra `apaisado`. Al girar el teléfono, la
// escena se reconstruye entera en `medir()`:
//
//   · la fogata y la cabaña se separan más en apaisado, que hay sitio;
//   · el arco de piedras se abre o se cierra;
//   · el bosque se vuelve a sembrar con la MISMA semilla, así que es el
//     mismo bosque y no otro distinto;
//   · el alcance del palo se recalcula.
//
// Lo único que se conserva entre medidas es el estado: qué ambientes
// están puestos, el tueste del bombón, si la carta está encontrada.

addEventListener("orientationchange", () => setTimeout(medir, 220));

// ==========================================
// OPTIMIZACIÓN
// ==========================================
//
// Se mide el ritmo de verdad durante los primeros segundos. Si no llega
// al mínimo, se baja la calidad UNA VEZ y no se vuelve a tocar: un
// ajuste que sube y baja solo se nota más que ir siempre algo peor.
//
// Lo que se baja: la resolución del lienzo, el número de partículas, el
// de estrellas y la frecuencia con la que salen chispas y humo.

let fpsAcum = 0, fpsCuenta = 0, yaBajado = false;

function vigilarRitmo(dt) {
  if (yaBajado) return;
  fpsAcum += dt;
  fpsCuenta++;
  if (fpsAcum < 2.5) return;
  const fps = fpsCuenta / fpsAcum;
  fpsAcum = 0; fpsCuenta = 0;
  if (fps >= CONF.perf.fpsMinimo) { yaBajado = true; return; }   // va bien
  yaBajado = true;
  flojo = true;
  crearParticulas(CONF.perf.particulasFlojo);
  medir();
  console.info("[noche] calidad reducida: el ritmo no llegaba al mínimo.");
}

/* Cuando la pestaña se va, se para todo: un bucle corriendo de fondo
   gasta batería para nadie. */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    agacharAmbientes(0, 0.4);
  } else {
    t0 = performance.now();      // que no cuente el tiempo que ha estado fuera
    agacharAmbientes(1, 0.8);
  }
});

// ==========================================
// BUCLE Y ARRANQUE
// ==========================================

let t0 = performance.now();
let reloj = 0;

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A || !H) return;
  if (document.hidden) return;

  /* El dt se ACOTA, no se sustituye. Cambiarlo por 1/60 en un salto
     largo hace que todo avance a cámara lenta en un móvil que se
     atasque: la escena entera se queda atrás y no se recupera. */
  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.5) dt = 1 / 60;
  else if (dt > 0.1) dt = 0.1;
  reloj += dt;

  vigilarRitmo(dt);

  /* ---- Parallax y cámara ---- */
  /* Si nadie toca, la escena respira sola: un vaivén lentísimo. Así no
     hay ni un fotograma completamente quieto. */
  if (!dedo.dentro) {
    par.ox = Math.sin(reloj * 0.11) * 0.28;
    par.oy = Math.sin(reloj * 0.08 + 1.2) * 0.2;
  }
  par.x = damp(par.x, par.ox, 2.6, dt);
  par.y = damp(par.y, par.oy, 2.6, dt);

  cam.z = damp(cam.z, cam.oz, 2.2, dt);
  cam.x = damp(cam.x, cam.ox, 2.2, dt);
  cam.y = damp(cam.y, cam.oy, 2.2, dt);

  meneo.t += dt;
  meneo.fuerza = damp(meneo.fuerza, 0, 4.4, dt);

  /* ---- Mover ---- */
  moverParticulas(dt);
  moverDichos(dt);

  if (escena === "bosque") {
    moverClima(dt);
    moverArboles(dt);
    /* El búho va DESPUÉS de los árboles: está agarrado a uno y lee su
       bamboleo, así que si fuera antes iría siempre un fotograma
       retrasado y se le vería despegarse de la rama. */
    moverBuho(dt);
    moverOjos(dt);
    moverNota(dt);
    moverFogata(dt);
    moverBombon(dt);
    moverPanel(dt);
    moverCajita(dt);
    moverCabana(dt);
    moverSecreto(dt);
    moverLuna(dt);
    mirarFogataAzul();
  } else {
    moverHabitacion(dt);
    moverCajita(dt);
    /* La luna también, que se ve por la ventana: si no, una dona se
       quedaría congelada mientras estás dentro y al salir volvería de
       golpe sin que se viera nada. */
    moverLuna(dt);
    moverSusto(dt);
  }

  /* ---- Dibujar ---- */
  ctx.save();

  /* La cámara y la sacudida se aplican a TODO de una vez. */
  const mx = Math.sin(meneo.t * 43) * meneo.fuerza * U * 1.2;
  const my = Math.cos(meneo.t * 37) * meneo.fuerza * U * 1.1;
  ctx.translate(A / 2 + mx, H / 2 + my);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-A / 2 + cam.x / cam.z, -H / 2 + cam.y / cam.z);

  if (escena === "bosque") dibujarBosque(dt);
  else dibujarHabitacion();

  ctx.restore();

  /* El velo de las cinemáticas va POR ENCIMA de la cámara: si entrara
     en la transformación, un zoom lo dejaría sin cubrir los cantos. */
  if (cine.velo > 0.001) {
    ctx.fillStyle = `rgba(2,3,8,${clamp01(cine.velo)})`;
    ctx.fillRect(0, 0, A, H);
    if (cine.texto && cine.velo > 0.8) {
      ctx.fillStyle = "rgba(190,200,230,0.5)";
      ctx.font = `${Math.round(U * 2.6)}px ui-sans-serif, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(cine.texto, A / 2, H / 2);
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }
  }
}

/* ---- Arranque ---------------------------------------------------------- */

medir();
requestAnimationFrame(paso);

/* Si el navegador deja sonar sin tocar nada —pasa en escritorio con el
   sonido ya permitido—, se entra solo a los pocos segundos. Si no, la
   puerta espera el toque, que es lo que hace falta para el audio. */
setTimeout(() => {
  if (audio.ctx && audio.ctx.state === "running" && !raiz.classList.contains("is-dentro")) {
    entrar();
  }
}, 2600);

})();
</script>
