const diceDona = barajador(CONF.dona.dice);

function empezarDona(volver) {
  luna.fase = 0;
  luna.volviendo = !!volver;
  luna.reloj = 0;
  /* Los pedazos: nacen ordenados y salen despedidos. Cada uno con su
     ángulo, su velocidad y su giro, para que ninguno haga lo mismo. */
  luna.trozos = [];
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * 6.283 + azar(-0.2, 0.2);
    luna.trozos.push({
      a, d: azar(0.15, 0.95),
      vel: azar(1.6, 3.4),
      giro: azar(0, 6.283), giroV: azar(-5, 5),
      tam: azar(0.1, 0.26),
    });
  }
  if (!volver) recuerdo.poner("dona", 1);
}

/** Una fugaz nueva, cruzando el cielo de izquierda a derecha. */
function nuevaFugaz() {
  return {
    x: azar(-40, A * 0.55),
    y: azar(0, sitio.horizonte * 0.4),
    vx: azar(260, 420), vy: azar(80, 160),
    v: 1,
    rastro: [],
  };
}

/**
 * Lo que pasa al pillar una. Y lo que dice depende de CUÁNTAS lleves,
 * hoy y cualquier otra noche: la primera te deja pedir un deseo, y a la
 * quinta el cielo ya te debe algo.
 */
function cazarFugaz(f, p) {
  cielo.cazadas = recuerdo.sumar("fugaces");
  magia(880);
  soltarBrillos(f.x, f.y, 16, 0.45);
  /* Y los trocitos salen en la dirección en la que iba, no en todas:
     lo que se ha roto llevaba una inercia. */
  for (let i = 0; i < 10; i++) {
    soltar(f.x, f.y, {
      vx: f.vx * azar(0.1, 0.45) + azar(-40, 40),
      vy: f.vy * azar(0.1, 0.45) + azar(-40, 40),
      vida: azar(0.8, 2), tam: azar(1, 2.4),
      tipo: TIPO.BRILLO, tono: 0.2,
    });
  }
  const d = CONF.fugaces.deseos;
  const frase = d[Math.min(cielo.cazadas - 1, d.length - 1)];
  decir(p.x, p.y + U * 6, frase, { mimo: true, importante: true, dur: 5 });
  contarLogro("fugaz");
}

function moverLuna(dt) {
  luna.pulso = damp(luna.pulso, 0, 2.2, dt);
  luna.vibra = damp(luna.vibra, 0, 6, dt);

  if (luna.fase < 0) {
    /* Quieta. Si lleva mucho rato siendo dona, se le pasa. */
    if (luna.dona > 0.99) {
      luna.reloj += dt;
      if (luna.reloj > CONF.dona.dura) {
        empezarDona(true);
        decir(sitio.luna.x, sitio.luna.y + sitio.luna.r * 2.4,
          CONF.dona.alVolver, { mimo: true, dur: 4.5 });
      }
    }
    return;
  }

  const t = luna.fase += dt;
  const haciaDona = luna.volviendo ? 0 : 1;

  if (t < 0.8) {
    /* ---- GLITCH ----
       Vibra y se descoloca. El ruido va subiendo con ella. */
    luna.vibra = (t / 0.8) * 1.2;
    if (Math.random() < dt * 14) chirrido(0.3 + t);
  } else if (t < 1.4) {
    /* ---- ZUMBIDO ---- */
    luna.vibra = 1.2 + (t - 0.8) * 1.5;
    if (Math.random() < dt * 7) chirrido(1.1 + (t - 0.8) * 2);
  } else if (t < 1.8) {
    /* ---- ESTALLIDO ---- */
    if (!luna.estallada) {
      luna.estallada = true;
      luna.vibra = 0;
      estallidoLuna();
    }
  } else if (t < 2.8) {
    /* ---- REUNIÓN ----
       Los pedazos vuelven. Y a mitad de camino, el cambio de forma. */
    const k = suave3((t - 1.8) / 1);
    luna.dona = luna.volviendo ? 1 - k : k;
  } else {
    /* ---- YA ESTÁ ---- */
    luna.dona = haciaDona;
    luna.fase = -1;
    luna.estallada = false;
    luna.reloj = 0;
    luna.trozos = [];
    if (!luna.volviendo) {
      magia(392);
      decir(sitio.luna.x, sitio.luna.y + sitio.luna.r * 2.6,
        diceDona(), { mimo: true, importante: true, dur: 5 });
    }
  }
}

/** El chirrido del glitch: ruido cortado con un filtro muy estrecho. */
function chirrido(altura) {
  if (!despertarAudio()) return;
  const c = audio.ctx, t = c.currentTime;
  const dur = azar(0.03, 0.09);
  const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
  o.type = "square";
  o.frequency.value = azar(200, 900) * clamp(altura, 0.4, 3);
  f.type = "bandpass"; f.frequency.value = o.frequency.value * 2; f.Q.value = 9;
  g.gain.setValueAtTime(0.035, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f).connect(g).connect(audio.maestro);
  o.start(t); o.stop(t + dur);
}

function estallidoLuna() {
  const L = sitio.luna;
  sacudir(0.8);
  /* Un golpe grave y un fogonazo agudo a la vez: el peso y el destello. */
  golpe(0.3, 90, 0.3, "lowpass");
  golpe(0.08, 5200, 0.14, "highpass");
  magia(587);
  for (let i = 0; i < 40; i++) {
    const a = azar(0, 6.283), v = azar(40, 190);
    soltar(L.x + Math.cos(a) * L.r * 0.5, L.y + Math.sin(a) * L.r * 0.5, {
      vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      vida: azar(0.8, 2.2), tam: azar(1, 3),
      tipo: TIPO.BRILLO, tono: 0.45,
    });
  }
  /* Y un destello de verdad en todo el cielo, que es lo que hace que
     parezca que ha pasado algo gordo y no que ha cambiado un dibujo. */
  clima.destello = Math.max(clima.destello, 0.7);
  clima.destelloX = L.x / A;
}

function dibujarLuna(x, y, r) {
  /* La vibración del glitch: se aplica a TODO, incluido el halo. */
  if (luna.vibra > 0.01) {
    x += azar(-1, 1) * luna.vibra * r * 0.09;
    y += azar(-1, 1) * luna.vibra * r * 0.06;
  }

  /* Durante el estallido no hay disco: hay pedazos. */
  const estallando = luna.fase >= 1.4 && luna.fase < 2.4;

  /* El halo, en tres capas: cerca fuerte, lejos muy abierto. Una sola
     capa se ve como un círculo borroso pegado; tres se ven como luz.
     De dona, el halo tira a caramelo. */
  const halo = luna.dona > 0.02
    ? `${Math.round(mez(198, 255, luna.dona))},${Math.round(mez(214, 176, luna.dona))},${Math.round(mez(255, 120, luna.dona))}`
    : "198,214,255";
  ctx.globalCompositeOperation = "lighter";
  for (const [k, a] of [[2.2, 0.20], [4.4, 0.10], [9, 0.05]]) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * k);
    g.addColorStop(0, `rgba(${halo},${a * (1 + luna.pulso) * (estallando ? 1.8 : 1)})`);
    g.addColorStop(1, `rgba(${halo},0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r * k, 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";

  if (estallando) {
    /* ---- Los pedazos ----
       Salen y vuelven con el mismo número: `k` va de 0 a 1 y de 1 a 0
       con un seno, así que no hace falta ni una condición. */
    const k = Math.sin(clamp01((luna.fase - 1.4) / 1) * Math.PI);
    for (const p of luna.trozos) {
      const dd = r * (0.2 + p.d * 3.2 * k * p.vel * 0.4);
      const px2 = x + Math.cos(p.a) * dd;
      const py2 = y + Math.sin(p.a) * dd;
      ctx.save();
      ctx.translate(px2, py2);
      ctx.rotate(p.giro + p.giroV * luna.fase);
      ctx.fillStyle = `rgba(232,236,252,${1 - k * 0.5})`;
      ctx.beginPath();
      ctx.moveTo(-r * p.tam, -r * p.tam * 0.7);
      ctx.lineTo(r * p.tam, -r * p.tam);
      ctx.lineTo(r * p.tam * 0.7, r * p.tam);
      ctx.lineTo(-r * p.tam * 0.8, r * p.tam * 0.6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    return;
  }

  /* ---- El cuerpo ----
     Se pinta la luna y, si toca, la dona ENCIMA con su propia
     opacidad. Interpolar entre las dos formas píxel a píxel no vale la
     pena: durante el medio segundo que dura, lo que se ve es un
     fundido, y un fundido después de un estallido se lee perfectamente
     como «se ha convertido en». */
  if (luna.dona < 0.995) {
    ctx.globalAlpha = 1 - luna.dona;
    const gd = ctx.createRadialGradient(x - r * 0.28, y - r * 0.3, r * 0.08, x, y, r);
    gd.addColorStop(0, "#fdfcff");
    gd.addColorStop(0.62, "#e6e9fa");
    gd.addColorStop(1, "#bcc2dd");
    ctx.fillStyle = gd;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();

    /* Los mares: cuatro manchas fijas. Sin ellas la luna es un círculo
       blanco y se lee como un foco. */
    ctx.fillStyle = "rgba(150,158,190,0.34)";
    const mares = [[-0.26, -0.2, 0.3], [0.22, 0.12, 0.24], [-0.06, 0.34, 0.17], [0.34, -0.3, 0.13]];
    for (const [mx, my, mr] of mares) {
      ctx.beginPath();
      ctx.arc(x + mx * r, y + my * r, mr * r, 0, 6.283);
      ctx.fill();
    }

    /* El guiño del easter egg: un arco que se cierra. */
    if (luna.guino > 0.02) {
      ctx.strokeStyle = `rgba(90,96,130,${luna.guino * 0.8})`;
      ctx.lineWidth = r * 0.1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(x - r * 0.22, y - r * 0.12, r * 0.2, 0.2, Math.PI - 0.2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  if (luna.dona > 0.005) dibujarDona(x, y, r, luna.dona);
}

/** Una dona de chocolate donde estaba la luna. Con chispitas. */
function dibujarDona(x, y, r, op) {
  ctx.save();
  ctx.globalAlpha = op;
  /* Un poco ladeada: una dona perfectamente de frente parece un icono. */
  ctx.translate(x, y);
  ctx.rotate(-0.18);
  ctx.scale(1, 0.92);

  /* La masa. */
  const gm = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r);
  gm.addColorStop(0, "#f0c98a");
  gm.addColorStop(0.7, "#dba95f");
  gm.addColorStop(1, "#b9803e");
  ctx.fillStyle = gm;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, 6.283);
  ctx.fill();

  /* El chocolate: no es un círculo, es una mancha con goterones. Es lo
     que hace que parezca glaseado y no una arandela pintada. */
  const gc = ctx.createRadialGradient(-r * 0.28, -r * 0.34, r * 0.08, 0, 0, r * 0.96);
  gc.addColorStop(0, "#6b3c22");
  gc.addColorStop(0.6, "#4a2413");
  gc.addColorStop(1, "#33170c");
  ctx.fillStyle = gc;
  ctx.beginPath();
  const lobulos = 11;
  for (let i = 0; i <= lobulos; i++) {
    const a = (i / lobulos) * 6.283;
    /* El borde ondula, y unos pocos puntos bajan mucho más: los
       goterones. El seno de tres vueltas los reparte sin listas. */
    const gota = Math.max(0, Math.sin(a * 3 + 0.7)) * 0.1;
    const rr = r * (0.9 + Math.sin(a * 5 + 1.3) * 0.035 + gota);
    const px2 = Math.cos(a) * rr, py2 = Math.sin(a) * rr;
    if (i === 0) ctx.moveTo(px2, py2);
    else ctx.lineTo(px2, py2);
  }
  ctx.closePath();
  ctx.fill();

  /* El agujero, con el cielo asomando. Se recorta de verdad: pintarlo
     del color del cielo sólo funciona si el cielo es liso, y aquí
     detrás hay estrellas. */
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.3, 0, 6.283);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";

  /* El canto del agujero, para que se vea la masa por dentro. */
  ctx.strokeStyle = "rgba(220,170,110,0.55)";
  ctx.lineWidth = r * 0.05;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.32, 0, 6.283);
  ctx.stroke();

  /* Las chispitas de colores. Fijas: si parpadearan parecerían luces. */
  const colores = ["#ff8fb0", "#8fd4ff", "#ffe27a", "#b0f0a0", "#e2a6ff"];
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * 6.283 + 0.4;
    const rr = r * (0.42 + ((i * 7) % 5) * 0.09);
    ctx.save();
    ctx.translate(Math.cos(a) * rr, Math.sin(a) * rr);
    ctx.rotate(a + i);
    ctx.fillStyle = colores[i % colores.length];
    ctx.fillRect(-r * 0.09, -r * 0.028, r * 0.18, r * 0.056);
    ctx.restore();
  }

  /* Y un brillo en el chocolate, arriba a la izquierda. */
  ctx.fillStyle = "rgba(255,240,220,0.16)";
  ctx.beginPath();
  ctx.ellipse(-r * 0.36, -r * 0.42, r * 0.26, r * 0.13, -0.5, 0, 6.283);
  ctx.fill();

  ctx.restore();
  ctx.globalAlpha = 1;
}

function tocarLuna(x, y) {
  luna.pulso = 1;
  luna.tocadas++;
  magia(luna.tocadas % 3 === 0 ? 784 : 660);

  for (let i = 0; i < 22; i++) {
    const a = azar(0, 6.283);
    const rr = azar(0.4, 1.6);
    soltar(x + Math.cos(a) * sitio.luna.r * rr, y + Math.sin(a) * sitio.luna.r * rr, {
      vx: Math.cos(a) * azar(8, 34), vy: Math.sin(a) * azar(8, 34) + 10,
      vida: azar(1.8, 3.4), tam: azar(1, 2.6),
      tipo: TIPO.BRILLO, tono: 0.45,
    });
  }

  /* ---- A la décima, deja de ser la luna ----
     Va ANTES que el guiño porque manda sobre todo lo demás. Y si ya es
     una dona, tocarla no vuelve a lanzar la transformación: dice otra
     cosa y ya. */
  if (luna.dona > 0.5 || luna.fase >= 0) {
    if (luna.fase < 0) decir(x, y + sitio.luna.r * 2.4, diceDona(), { mimo: true, dur: 4 });
    return;
  }
  if (luna.tocadas >= CONF.dona.toques) {
    luna.tocadas = 0;
    empezarDona(false);
    contarLogro("dona");
    return;
  }

  /* A la quinta, guiña. Es un secreto pequeñito y no se anuncia. */
  if (luna.tocadas === 5) {
    luna.guino = 1;
    setTimeout(() => { luna.guino = 0; }, 1400);
    decir(x, y + sitio.luna.r * 2, "…¿te acaba de guiñar un ojo?", { mimo: true, importante: true });
    contarLogro("guino");
    return;
  }

  /* ---- Lo que dice, según lo que ya haya pasado ----
     La luna es lo único que está ahí arriba viéndolo todo, así que es
     lo único que puede comentarlo. Si ya has encontrado al búho, si se
     te apagó la fogata, si ya abriste la carta: lo sabe. Es el easter
     egg con memoria más barato de hacer y el que más se nota. */
  let frase = null;
  if (luna.tocadas >= 3 && Math.random() < 0.55) {
    const sabe = [];
    if (recuerdo.leer("buho", 0) > 0) sabe.push("Ese búho y yo llevamos toda la noche mirándote.");
    if (fuego.fase >= 5) sabe.push("Se te ha apagado la fogata. Desde aquí arriba se nota.");
    if (recuerdo.leer("notaArbol", 0)) sabe.push("Lo del papel del árbol lo vi. No diré nada.");
    if (recuerdo.leer("ojos", 0) > 0) sabe.push("Eso de los ojos rojos… yo tampoco sé qué es.");
    if (secreto.hallado) sabe.push("Ya encontraste lo del bosque. Sabía que lo harías.");
    if (recuerdo.visitas > 1) sabe.push("Otra noche por aquí. Me gusta que vuelvas.");
    if (sabe.length) frase = sabe[Math.floor(Math.random() * sabe.length)];
  }
  decir(x, y + sitio.luna.r * 2, frase || diceLuna(), { mimo: true, importante: true });
  contarLogro("luna");
}

// ==========================================
// EASTER EGGS
// ==========================================
//
// Ninguno se explica. Están para encontrarlos jugando.
//
//   1. la luz verde del bosque → la carta
//   2. tocar la llama → te quemas
//   3. tocar estrellas → algunas responden
//   4. las estrellas fugaces, si pillas alguna → un deseo, y la quinta
//      ya no dice lo mismo que la primera
//   5. la luna a la quinta vez → guiña
//   6. dejar la fogata en paz mucho rato → se pone azul
//   7. tres bombones quemados seguidos
//   8. el cuadro de la habitación
//   9. el búho del bosque, que parpadea si te fijas
//  10. encontrarlo casi todo → un mensaje que no tiene otro sitio
//  11. la ventana de la habitación, tres veces
//  12. la luna diez veces → deja de ser la luna
//  13. lo que se recuerda de la última vez que estuviste aquí
//
// ── LA MEMORIA ───────────────────────────────────────────────────────
// Un secreto que se comporta igual siempre se gasta a la segunda. Así
// que la escena SE ACUERDA: cuántas veces has encontrado al búho,
// cuántas veces has tocado la luna, si ya abriste la carta, si ya te
// quemaste. Y lo que dice cambia según eso.
//
// Se guarda en `localStorage` con try/catch en todas partes: en una
// ventana privada o con las cookies bloqueadas, leer o escribir LANZA,
// y un secreto bonito no puede ser la razón de que la página se caiga.
// Si no hay dónde guardar, se recuerda sólo durante esta visita, que ya
// es bastante.

const recuerdo = (() => {
  const CLAVE = "noche-estrellada:recuerdos";
  let datos = {};
  try {
    const crudo = localStorage.getItem(CLAVE);
    if (crudo) datos = JSON.parse(crudo) || {};
  } catch { datos = {}; }
  if (typeof datos !== "object" || !datos) datos = {};

  const guardar = () => {
    try { localStorage.setItem(CLAVE, JSON.stringify(datos)); } catch { /* da igual */ }
  };

  return {
    leer: (k, porDefecto = 0) => (k in datos ? datos[k] : porDefecto),
    poner(k, v) { datos[k] = v; guardar(); return v; },
    sumar(k, n = 1) { return this.poner(k, (Number(datos[k]) || 0) + n); },
    /** ¿Es la primera vez de esta visita Y de todas las anteriores? */
    esNuevo: (k) => !datos[k],
    /** Cuántas visitas lleva. Se cuenta una sola vez por carga. */
    visitas: 0,
  };
})();
recuerdo.visitas = recuerdo.sumar("visitas");

const logros = new Set();

function contarLogro(id) {
  if (logros.has(id)) return;
  logros.add(id);
  /* El final de los finales: cuando ya ha encontrado casi todo. */
  if (logros.size === 7 && !logros.has("final")) {
    logros.add("final");
    setTimeout(() => {
      decir(A * 0.5, H * 0.42,
        "Has encontrado casi todo lo que escondí aquí. Queda una cosa, y está en el bosque.",
        { mimo: true, importante: true, dur: 7 });
      magia(523);
    }, 3000);
  }
}

const elFlash = document.getElementById("flash");

  decir(x, y - U * 8, diceQuemarse(), { mimo: true, importante: true });

/* ---- 1. La luz verde del bosque ---------------------------------------- */

const secreto = {
  luz: 0,          // 0..1, lo que se ve
  hallado: false,
  fase: 0,
  zoom: 0,
};
const diceSecretoAntes = barajador(CONF.bosqueSecreto.antes);

function moverSecreto(dt) {
  secreto.fase += dt;
  if (!secreto.hallado) {
    /* Apenas se ve: late muy despacio y muy poco. Hay que fijarse, y
       ésa es toda la gracia. */
    secreto.luz = 0.16 + 0.14 * Math.sin(secreto.fase * 0.55);
    /* Y suelta alguna chispita verde de vez en cuando, que es lo que
       hace que el ojo acabe yendo ahí. */
    if (Math.random() < dt * 0.7) {
      soltar(sitio.secreto.x + azar(-U * 2, U * 2), sitio.secreto.y + azar(-U, U), {
        vx: azar(-6, 6), vy: azar(-16, -6),
        vida: azar(1.6, 3), tam: azar(0.8, 1.8),
        tipo: TIPO.BRILLO, tono: 0.5,
      });
    }
  } else {
    secreto.luz = damp(secreto.luz, 1, 1.2, dt);
    secreto.zoom = damp(secreto.zoom, 0, 0.8, dt);
  }
}

function dibujarSecreto() {
  const d = desplazar(0.7);
  const s = sitio.secreto;
  const x = s.x + d.x, y = s.y + d.y;
  const k = secreto.luz;

  ctx.globalCompositeOperation = "lighter";
  for (const [m, a] of [[1.2, 0.5], [3.4, 0.2], [8, 0.09]]) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, s.r * m * (0.5 + k));
    g.addColorStop(0, `rgba(120,255,190,${a * k})`);
    g.addColorStop(1, "rgba(120,255,190,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, s.r * m * (0.5 + k), 0, 6.283); ctx.fill();
  }
  ctx.fillStyle = `rgba(210,255,230,${0.6 + k * 0.4})`;
  ctx.beginPath();
  ctx.arc(x, y, U * (0.5 + k * 0.7), 0, 6.283);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";
}

async function tocarSecreto(x, y) {
  if (secreto.hallado || bloqueado) return;
  secreto.hallado = true;
  bloqueado = true;
  contarLogro("secreto");

  /* 1. Suena algo que no ha sonado antes. */
  magia(294);
  setTimeout(() => magia(392), 400);

  /* 2. La cámara se acerca un poco. */
  cam.oz = 1.5;
  cam.ox = (A / 2 - x) * 1.5;
  cam.oy = (H * 0.5 - y) * 1.5;

  /* 3. La luz llena esa parte del bosque. */
  for (let i = 0; i < 40; i++) {
    setTimeout(() => {
      const a = azar(0, 6.283);
      soltar(x, y, {
        vx: Math.cos(a) * azar(20, 130), vy: Math.sin(a) * azar(20, 110),
        vida: azar(2, 4), tam: azar(1.2, 3),
        tipo: TIPO.BRILLO, tono: 0.5,
      });
    }, i * 26);
  }

  /* 4. Y lo que dice antes de la carta. */
  await esperar(900);
  decir(x, y, diceSecretoAntes(), { mimo: true, importante: true, dur: 4.4 });

  await esperar(3400);
  cam.oz = 1; cam.ox = 0; cam.oy = 0;
  abrirCarta();
  bloqueado = false;
}
