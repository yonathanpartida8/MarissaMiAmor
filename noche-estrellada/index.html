// ==========================================
// DIBUJO DEL BOSQUE
// ==========================================
//
// Las once capas, de la más lejana a la más cercana. Cada una con su
// factor de parallax: el cielo casi no se mueve y la hierba de delante
// mucho. Ésa es toda la profundidad, y no cuesta nada.
//
//   1 cielo · 2 estrellas · 3 luna · 4 nubes · 5 montañas ·
//   6 bosque lejano · 7 árboles cercanos · 8 cabaña · 9 fogata ·
//   10 suelo · 11 partículas

const cielo = {
  estrellas: [],
  nubes: [],
  /* Las fugaces, en lista: a veces cae una sola y a veces un
     ramillete, y con una sola variable no cabía más que una. */
  fugaces: [],
  cazadas: 0,
  proximaFugaz: azar(14, 34),
};

let arboles = [];
let montanas = [];
let hierbas = [];
let buho = null;

function construirMundo() {
  colocarSitios();
  sembrar(20240214);

  /* ---- Estrellas ---- */
  const nE = flojo ? CONF.perf.estrellasFlojo : CONF.perf.estrellas;
  cielo.estrellas = [];
  for (let i = 0; i < nE; i++) {
    cielo.estrellas.push({
      x: rnd() * A,
      y: rnd() * sitio.horizonte * 1.02,
      r: azar(0.4, 1.7),
      b: azar(0.2, 0.95),
      v: azar(0.4, 2.2),
      f: rnd() * 6.283,
      /* Una de cada doce responde si la tocas. No se sabe cuál. */
      viva: rnd() < 0.085,
      pulso: 0,
    });
  }

  /* ---- Nubes ---- */
  cielo.nubes = [];
  for (let i = 0; i < 5; i++) {
    cielo.nubes.push({
      x: rnd(),
      y: azar(0.08, 0.42),
      esc: azar(0.8, 2.2),
      v: azar(0.0025, 0.008),
      bultos: Array.from({ length: 5 }, (_, k) => ({
        dx: (k - 2) * 0.52 + azar(-0.14, 0.14),
        dy: azar(-0.09, 0.1),
        r: azar(0.5, 1),
      })),
    });
  }

  /* ---- Montañas ---- */
  montanas = [
    { y: sitio.horizonte - U * 6, alto: U * 12, paso: A * 0.42, col: "#0d1226" },
    { y: sitio.horizonte - U * 2, alto: U * 8,  paso: A * 0.28, col: "#0a0e1e" },
  ];

  /* ---- EL BOSQUE, EN TRES BANDAS ----
     Cada banda es una profundidad: lejos, medio y cerca. Lo que las
     separa no es sólo el tamaño —eso lo hace cualquiera— sino CUÁNTA
     NIEBLA se les pone delante y cuánto se mueven con el parallax. Eso
     es lo que hace que se distingan de verdad.

     Los de la banda media y los de cerca se pueden TOCAR: se sacuden
     con un muelle amortiguado, sueltan hojas y suenan. */
  arboles = [];
  CONF.bosque.bandas.forEach((banda, iB) => {
    const n = flojo ? banda.nFlojo : banda.n;
    for (let i = 0; i < n; i++) {
      const t = n === 1 ? 0.5 : i / (n - 1);
      let x, base;

      if (iB === 2) {
        /* Los de cerca ENMARCAN: pegados a los cantos, nunca en medio.
           Son troncos altos y casi negros, y metidos hacia el centro
           taparían la cabaña y la fogata. */
        const lado = i % 2 === 0 ? -1 : 1;
        const orden = Math.floor(i / 2);
        const dentro = U * (1.2 + orden * 6.2);
        x = lado < 0 ? -U * 4 + dentro : A + U * 4 - dentro;
        base = sitio.suelo + U * azar(2, 10);
      } else {
        /* Los demás se reparten a lo ancho con algo de desorden, y su
           altura en pantalla sale de lo lejos que estén. */
        x = (t + azar(-0.018, 0.018)) * A * 1.1 - A * 0.05;
        base = mez(sitio.horizonte + U * 1.5, sitio.suelo - U * 2,
                   iB === 0 ? rnd() * 0.5 : 0.42 + rnd() * 0.58);
      }

      arboles.push({
        banda: iB,
        x, base,
        alto: (iB === 2 ? H * 0.01 : U) * azar(banda.alto[0], banda.alto[1]),
        ancho: U * azar(banda.ancho[0], banda.ancho[1]),
        f: rnd() * 6.283,
        z: banda.z,
        niebla: banda.niebla,
        toca: banda.toca,
        /* La forma: unos son abetos y otros de hoja. Que no sean todos
           iguales es lo que hace que parezca un bosque. */
        abeto: iB === 0 ? rnd() < 0.72 : rnd() < 0.45,
        ramas: Array.from({ length: iB === 2 ? 5 : 3 }, () => ({
          y: azar(0.24, 0.84),
          lado: rnd() < 0.5 ? -1 : 1,
          largo: azar(0.35, 1),
        })),
        /* La sacudida: ángulo, velocidad y cuántas veces lo han tocado.
           Un muelle de verdad, no una animación rígida. */
        sac: 0, sacV: 0, toques: 0,
        /* Uno de los de en medio esconde una carta. Se sabrá tocándolo. */
        carta: false,
      });
    }
  });
  /* De atrás adelante, para que los de delante tapen a los de detrás. */
  arboles.sort((a, b) => (a.banda - b.banda) || (a.base - b.base));

  /* ---- EL ÁRBOL DE LA CARTA ----
     Uno de la banda media, elegido con el azar repetible: siempre el
     mismo mientras no se gire el teléfono, y no se distingue de los
     demás en nada. */
  const medios = arboles.filter((a) => a.banda === 1);
  if (medios.length) medios[Math.floor(rnd() * medios.length)].carta = true;

  /* ---- Hierba de delante ----
     Va por debajo del canto, pegada a la cámara. Cuanto más abajo está
     una brizna más cerca se supone que está, y por eso se mueve más con
     el parallax y se pinta más gruesa. */
  hierbas = [];
  const nHierba = flojo ? 60 : 140;
  for (let i = 0; i < nHierba; i++) {
    hierbas.push({
      x: rnd() * A * 1.06 - A * 0.03,
      y: mez(sitio.suelo + U * 1.5, H + U * 2, Math.pow(rnd(), 0.75)),
      alto: U * azar(1.6, 5.2),
      incl: azar(-0.5, 0.5),
      f: rnd() * 6.283,
    });
  }
  hierbas.sort((a, b) => a.y - b.y);

  /* ---- EL BÚHO ---- */
  construirBuho();

  /* ---- LOS OJOS DEL FONDO ---- */
  construirOjos();

  construirBruma();
  construirLluvia();
  construirFogata();
  construirPanel();
  construirPanelPosiciones();
  /* `false`: al girar el teléfono se remide el mundo entero, y tirar un
     bombón a medio tostar sólo porque has cambiado de postura es de las
     cosas que más rabia dan. Se vuelve a colgar donde toca y ya. */
  colocarBombon(false);
}

/* El panel y la cajita dependen de la fogata, así que se recolocan
   después de ella. */
function construirPanelPosiciones() { /* ya lo hace construirPanel() */ }

function dibujarBosque(dt) {
  /* ---- 1. CIELO ---- */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#050716");
  g.addColorStop(0.32, "#0a1028");
  g.addColorStop(0.58, "#131a38");
  g.addColorStop(0.78, "#0e1226");
  g.addColorStop(1, "#070912");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, A, H);

  /* La vía láctea, en diagonal y muy tenue. */
  const vl = ctx.createLinearGradient(0, sitio.horizonte, A, 0);
  vl.addColorStop(0.00, "rgba(40, 50, 100, 0)");
  vl.addColorStop(0.42, "rgba(66, 66, 128, 0.26)");
  vl.addColorStop(0.58, "rgba(88, 70, 130, 0.2)");
  vl.addColorStop(1.00, "rgba(40, 50, 100, 0)");
  ctx.fillStyle = vl;
  ctx.fillRect(0, 0, A, sitio.horizonte);

  /* ---- 2. ESTRELLAS ---- */
  const dE = desplazar(0.18);
  for (const s of cielo.estrellas) {
    s.pulso = Math.max(0, s.pulso - dt * 1.8);
    const b = s.b * (0.62 + 0.38 * Math.sin(reloj * s.v + s.f)) + s.pulso;
    const x = s.x + dE.x, y = s.y + dE.y;
    if (s.pulso > 0.02) {
      ctx.globalCompositeOperation = "lighter";
      const gp = ctx.createRadialGradient(x, y, 0, x, y, U * 4 * s.pulso);
      gp.addColorStop(0, `rgba(255,240,200,${s.pulso * 0.6})`);
      gp.addColorStop(1, "rgba(255,240,200,0)");
      ctx.fillStyle = gp;
      ctx.beginPath(); ctx.arc(x, y, U * 4 * s.pulso, 0, 6.283); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.fillStyle = `rgba(228,234,255,${clamp01(b)})`;
    ctx.beginPath();
    ctx.arc(x, y, s.r * (1 + s.pulso), 0, 6.283);
    ctx.fill();
  }

  /* ---- Las estrellas fugaces ----
     La estela no es una línea recta con un degradado: es un ARCO que
     recuerda por dónde ha pasado. Una fugaz de verdad no va recta del
     todo, y una estela guardada punto a punto se curva sola sin que
     haya que calcular nada.

     Y la cabeza va aparte, con su halo: sin ella la estela se lee como
     una raya, y con ella se lee como algo que está cayendo. */
  for (let i = cielo.fugaces.length - 1; i >= 0; i--) {
    const f = cielo.fugaces[i];
    f.x += f.vx * dt; f.y += f.vy * dt; f.v -= dt * 0.55;
    /* Se guarda por dónde ha ido, y lo viejo se va tirando. */
    f.rastro.push(f.x, f.y);
    if (f.rastro.length > 24) f.rastro.splice(0, 2);

    const a0 = clamp01(f.v);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    for (let k = 2; k < f.rastro.length; k += 2) {
      const t2 = k / f.rastro.length;
      ctx.strokeStyle = `rgba(255,248,255,${a0 * t2 * t2 * 0.85})`;
      ctx.lineWidth = 0.6 + t2 * 2;
      ctx.beginPath();
      ctx.moveTo(f.rastro[k - 2], f.rastro[k - 1]);
      ctx.lineTo(f.rastro[k], f.rastro[k + 1]);
      ctx.stroke();
    }
    /* La cabeza. */
    ctx.globalCompositeOperation = "lighter";
    const gh = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, U * 2.4);
    gh.addColorStop(0, `rgba(255,252,255,${a0 * 0.9})`);
    gh.addColorStop(0.35, `rgba(200,215,255,${a0 * 0.3})`);
    gh.addColorStop(1, "rgba(180,200,255,0)");
    ctx.fillStyle = gh;
    ctx.beginPath(); ctx.arc(f.x, f.y, U * 2.4, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = "source-over";

    if (f.v <= 0 || f.x > A + 80 || f.y > sitio.horizonte) cielo.fugaces.splice(i, 1);
  }

  if (!cielo.fugaces.length) {
    cielo.proximaFugaz -= dt;
    if (cielo.proximaFugaz <= 0) {
      cielo.proximaFugaz = azar(CONF.fugaces.cada[0], CONF.fugaces.cada[1]);
      /* De vez en cuando no cae una: cae un puñado, separadas en el
         tiempo, como una lluvia de estrellas de verdad. */
      const cuantas = Math.random() < CONF.fugaces.probLluvia ? Math.round(azar(3, 6)) : 1;
      for (let k = 0; k < cuantas; k++) {
        setTimeout(() => {
          if (escena !== "bosque") return;
          cielo.fugaces.push(nuevaFugaz());
        }, k * azar(280, 900));
      }
      if (cuantas > 1) {
        setTimeout(() => decir(A * 0.5, sitio.horizonte * 0.3,
          CONF.fugaces.lluviaDice, { dur: 4 }), 900);
      }
    }
  }

  /* ---- 3. LUNA ---- */
  const dL = desplazar(0.3);
  dibujarLuna(sitio.luna.x + dL.x, sitio.luna.y + dL.y, sitio.luna.r);

  /* ---- 4. NUBES ---- */
  const dN = desplazar(0.5);
  for (const n of cielo.nubes) {
    n.x += n.v * dt;
    if (n.x > 1.3) n.x = -0.3;
    const cx2 = n.x * A + dN.x, cy2 = n.y * sitio.horizonte + dN.y;
    const r = U * 7 * n.esc;
    /* Cada bulto con su propio degradado y APLASTADO: con círculos
       opacos se ven las bolas una a una y parece espuma, no nube. Una
       nube de noche es una mancha que se deshace por los cantos. */
    for (const b of n.bultos) {
      const bx2 = cx2 + b.dx * r * 2.1, by2 = cy2 + b.dy * r;
      const rr = r * b.r;
      const g2 = ctx.createRadialGradient(bx2, by2, 0, bx2, by2, rr);
      g2.addColorStop(0, "rgba(116,126,176,0.07)");
      g2.addColorStop(0.55, "rgba(116,126,176,0.035)");
      g2.addColorStop(1, "rgba(116,126,176,0)");
      ctx.fillStyle = g2;
      ctx.beginPath();
      ctx.ellipse(bx2, by2, rr * 1.5, rr * 0.62, 0, 0, 6.283);
      ctx.fill();
    }
  }

  /* ---- 5. MONTAÑAS ---- */
  const dM = desplazar(0.8);
  for (const m of montanas) {
    ctx.fillStyle = m.col;
    ctx.beginPath();
    ctx.moveTo(-10, H);
    ctx.lineTo(-10, m.y + dM.y);
    for (let x = -10; x <= A + 10; x += 12) {
      const u = (x + dM.x) / m.paso;
      const y = m.y + dM.y
        - (Math.sin(u) * 0.6 + Math.sin(u * 2.3) * 0.28 + Math.sin(u * 0.7) * 0.42) * m.alto;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(A + 10, H);
    ctx.closePath();
    ctx.fill();
  }

  /* ---- 6. EL BOSQUE: BANDAS 0 Y 1 ----
     Se dibujan intercaladas con la niebla: primero los de más lejos,
     luego una tanda de bruma, luego los de en medio. Ésa es la razón de
     que se vean a distinta distancia y no sólo a distinto tamaño. */
  dibujarArboles(0);
  dibujarBruma(sitio.horizonte - U * 6, mez(sitio.horizonte, sitio.suelo, 0.55));

  dibujarArboles(1);

  /* ---- Lo que mira desde el fondo ----
     Va DESPUÉS de los árboles de en medio y ANTES de la niebla de
     delante, y ese hueco de una línea es todo el efecto.

     Detrás de los árboles se probó primero, que era lo bonito sobre el
     papel: unos ojos asomando entre dos troncos. En la práctica los
     troncos de en medio están casi pegados, así que la mitad de las
     veces tapaban un ojo y lo que quedaba era UN punto rojo suelto, que
     no es una mirada, es una mota.

     Delante de ellos se ven los dos siempre, y la niebla que viene
     justo después es la que los deja medio disueltos. Sale mejor:
     misterio de verdad y no misterio por accidente. */
  dibujarOjos(desplazar(1.726));

  /* El búho, si está posado en un árbol de en medio: justo detrás de
     los de cerca, que es donde le toca. */
  dibujarBuho(1);

  /* Y el papelito, si ha caído de alguno. */
  dibujarNota(desplazar(1.726));
  dibujarBruma(mez(sitio.horizonte, sitio.suelo, 0.45), sitio.suelo + U * 6);

  /* ---- La luz verde, metida entre el bosque lejano ---- */
  dibujarSecreto();

  /* ---- 10. SUELO ---- */
  const dS = desplazar(1.4);
  const gs = ctx.createLinearGradient(0, sitio.suelo + dS.y, 0, H);
  gs.addColorStop(0, "#0c1218");
  gs.addColorStop(0.5, "#0a0f14");
  gs.addColorStop(1, "#060a0e");
  ctx.fillStyle = gs;
  ctx.beginPath();
  ctx.moveTo(-10, H + 10);
  ctx.lineTo(-10, sitio.suelo + dS.y);
  for (let x = -10; x <= A + 10; x += 16) {
    ctx.lineTo(x, sitio.suelo + dS.y - Math.sin(x * 0.006) * U * 1.6);
  }
  ctx.lineTo(A + 10, H + 10);
  ctx.closePath();
  ctx.fill();

  /* ---- 8. CABAÑA ---- */
  dibujarCabana();

  /* ---- La cajita musical y el panel ---- */
  dibujarCajita();
  dibujarPanel();

  /* ---- 9. FOGATA ---- */
  dibujarFogata();
  dibujarBombon();

  /* ---- 11. PARTÍCULAS ---- */
  dibujarParticulas();

  /* ---- 7. ÁRBOLES CERCANOS, delante de todo ---- */
  dibujarArboles(2);

  /* El búho, si está en uno de los de cerca —o si va volando, que
     entonces pasa por delante de todo—. */
  dibujarBuho(2);

  /* ---- Hierba de delante ----
     El parallax de la hierba es el mismo que el de los árboles de
     cerca: están a la misma distancia, y si no coincidieran se vería
     la hierba deslizarse por debajo de los troncos. */
  const dC = desplazar(3.4);
  ctx.lineCap = "round";
  for (const h of hierbas) {
    const prof = clamp01((h.y - sitio.suelo) / Math.max(1, H - sitio.suelo));
    const x = h.x + dC.x * (0.5 + prof);
    const y = h.y + dC.y * 0.4;
    const mece = Math.sin(reloj * 1.05 + h.f) * U * (0.3 + prof * 0.5);
    const cercaFuego = clamp01(1 - Math.abs(x - sitio.fogata.x) / (A * 0.42));
    const il = fuego.brillo * cercaFuego * 0.4;
    ctx.strokeStyle = `rgba(${Math.round(mez(12, 110, il))},${Math.round(mez(20, 86, il))},${Math.round(mez(16, 52, il))},0.9)`;
    ctx.lineWidth = 1 + prof * 1.4;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + h.incl * h.alto * 0.5 + mece * 0.5, y - h.alto * 0.6,
                         x + h.incl * h.alto + mece, y - h.alto);
    ctx.stroke();
  }

  /* ---- La lluvia, por delante de todo ---- */
  dibujarLluvia();

  /* ---- EL RELÁMPAGO ----
     No es una pantalla blanca: es un destello que viene DE UN LADO y
     que ilumina más arriba que abajo, porque la luz sale de las nubes.
     Y las nubes se encienden por dentro, que es lo que de verdad se ve
     de un rayo lejano. */
  if (clima.destello > 0.01) {
    const k = clima.destello;
    const gx = A * clima.destelloX;
    const g = ctx.createRadialGradient(gx, -H * 0.15, 0, gx, -H * 0.15, H * 1.5);
    g.addColorStop(0, `rgba(214,228,255,${k * 0.5})`);
    g.addColorStop(0.45, `rgba(190,210,255,${k * 0.2})`);
    g.addColorStop(1, "rgba(180,200,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, A, H);
  }

  /* ---- La viñeta: cierra la escena por los cantos ---- */
  const gv = ctx.createRadialGradient(A * 0.5, H * 0.55, Math.min(A, H) * 0.26,
                                      A * 0.5, H * 0.55, Math.max(A, H) * 0.82);
  gv.addColorStop(0, "rgba(2,4,10,0)");
  gv.addColorStop(1, "rgba(2,4,10,0.62)");
  ctx.fillStyle = gv;
  ctx.fillRect(0, 0, A, H);
}

/**
 * Dibuja una banda entera del bosque.
 *
 * ── DE QUÉ DEPENDE QUE UN ÁRBOL SE VEA CERCA O LEJOS ─────────────────
 * De cuatro cosas a la vez, y hacen falta las cuatro:
 *
 *   1. el tamaño            — obvio, y lo de menos;
 *   2. el PARALLAX          — los de lejos casi no se mueven;
 *   3. la NIEBLA de delante — se les mezcla el color del cielo encima;
 *   4. la LUZ que reciben   — la fogata sólo alcanza a los de cerca.
 *
 * La tercera es la que más hace. Un árbol pequeño y negro se ve como un
 * árbol pequeño; un árbol pequeño y medio disuelto en azul se ve LEJOS.
 */
function dibujarArboles(banda) {
  const conf = CONF.bosque.bandas[banda];
  const d = desplazar(mez(0.3, 3.4, conf.z));

  for (const t of arboles) {
    if (t.banda !== banda) continue;

    const x = t.x + d.x;
    const base = t.base + d.y;

    /* El bamboleo propio: lentísimo y distinto en cada uno, más el
       viento, que los mueve a todos a la vez pero cada uno a su ritmo.
       Y encima, la sacudida si lo han tocado. */
    const brisa = Math.sin(reloj * 0.42 + t.f) * (0.4 + clima.viento * 0.5);
    const meceT = (brisa * 0.012 + t.sac) * (0.4 + conf.z * 0.6);

    /* La luz: la fogata alcanza a los de cerca, la luna baña a todos por
       arriba. Dos fuentes, y se nota cuál manda en cada árbol. */
    const cercaFuego = clamp01(1 - Math.abs(x - sitio.fogata.x) / (A * mez(0.3, 0.6, conf.z)));
    const delFuego = fuego.brillo * cercaFuego * mez(0.2, 0.34, conf.z);
    const deLaLuna = 0.1 * (1 - conf.z * 0.5) * (1 - clima.lluvia * 0.7);
    const il = clamp01(delFuego + deLaLuna + clima.destello * 0.5);

    /* El color base, ya con la niebla mezclada encima: lo que hace que
       los de lejos estén medio disueltos en el cielo. */
    const r = mez(mez(5, 74, il), 22, conf.niebla);
    const g = mez(mez(8, 52, il), 30, conf.niebla);
    const b = mez(mez(13, 34, il), 54, conf.niebla);
    ctx.fillStyle = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;

    if (t.abeto) {
      /* Los abetos se inclinan enteros: son rígidos. */
      ctx.save();
      ctx.translate(x, base);
      ctx.rotate(meceT);
      abeto(0, 0, t.ancho, t.alto);
      ctx.restore();
    } else {
      /* Los de hoja se doblan: la base queda quieta y la copa se va.
         Por eso el tronco es una curva y no una recta. */
      const puntaX = x + meceT * t.alto * 0.85;
      ctx.beginPath();
      ctx.moveTo(x - t.ancho, base);
      ctx.quadraticCurveTo(x - t.ancho * 0.72 + meceT * t.alto * 0.3, base - t.alto * 0.5,
                           puntaX - t.ancho * 0.32, base - t.alto);
      ctx.lineTo(puntaX + t.ancho * 0.32, base - t.alto);
      ctx.quadraticCurveTo(x + t.ancho * 0.72 + meceT * t.alto * 0.3, base - t.alto * 0.5,
                           x + t.ancho, base);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineCap = "round";
      for (const rama of t.ramas) {
        const ry = base - t.alto * rama.y;
        const rx = x + meceT * t.alto * rama.y * 0.85;
        ctx.lineWidth = Math.max(1, t.ancho * 0.42 * (1 - rama.y * 0.4));
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.quadraticCurveTo(
          rx + rama.lado * t.ancho * 3.2 * rama.largo, ry - t.alto * 0.05,
          rx + rama.lado * t.ancho * 5 * rama.largo, ry - t.alto * 0.15);
        ctx.stroke();
      }

      /* La copa de los de cerca: una masa de hojas por encima, que se
         mueve un poco más que el tronco porque pesa menos. */
      if (banda === 2) {
        ctx.globalAlpha = 0.9;
        for (let k = 0; k < 4; k++) {
          const a = (k / 4) * 6.283;
          ctx.beginPath();
          ctx.ellipse(
            puntaX + Math.cos(a) * t.ancho * 1.6 + meceT * t.alto * 0.25,
            base - t.alto + Math.sin(a) * t.ancho * 1.1,
            t.ancho * 2.1, t.ancho * 1.5, a, 0, 6.283);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
    }

    /* Y el filo de luz de luna por el canto de arriba, en los de lejos:
       es lo que los despega del cielo. */
    if (banda === 0 && clima.lluvia < 0.5) {
      ctx.globalAlpha = 0.1 * (1 - clima.lluvia * 2);
      ctx.strokeStyle = "#a8badf";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - t.ancho * 0.5, base - t.alto * 0.86);
      ctx.lineTo(x, base - t.alto);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}

/**
 * La física de la sacudida.
 *
 * Un muelle amortiguado, no una animación. Al tocar un árbol se le mete
 * velocidad angular; el muelle lo devuelve al centro y la amortiguación
 * lo va parando. Por eso se bambolea varias veces y cada vez menos, que
 * es lo que hace un árbol de verdad, en vez de ir y volver una vez con
 * una curva de suavizado.
 *
 * Se integra a PASO FIJO. Con el dt del navegador, un cuadro largo le
 * mete al muelle una patada enorme y el árbol sale disparado.
 */
const PASO_ARBOL = 1 / 120;
let sobraArbol = 0;

function moverArboles(dtReal) {
  sobraArbol = Math.min(sobraArbol + dtReal, 0.2);
  const k = CONF.bosque.muelleK;
  const c = CONF.bosque.muelleAmortigua;
  let vueltas = 0;
  while (sobraArbol >= PASO_ARBOL && vueltas < 24) {
    for (const t of arboles) {
      if (t.sac === 0 && t.sacV === 0) continue;
      t.sacV += (-k * t.sac - c * t.sacV) * PASO_ARBOL;
      t.sac += t.sacV * PASO_ARBOL;
      /* Cuando ya no se nota, se para del todo: si no, el bucle sigue
         calculando cuarenta árboles quietos para siempre. */
      if (Math.abs(t.sac) < 0.0004 && Math.abs(t.sacV) < 0.004) { t.sac = 0; t.sacV = 0; }
    }
    sobraArbol -= PASO_ARBOL;
    vueltas++;
  }
}

/** Sacude un árbol: le mete velocidad y le tira hojas. */
function sacudirArbol(t, fuerza) {
  t.sacV += fuerza * azar(0.8, 1.2) * (t.banda === 2 ? 0.55 : 1);
  t.toques++;

  const x = t.x, base = t.base;
  const n = Math.round(azar(CONF.bosque.hojasPorSacudida[0], CONF.bosque.hojasPorSacudida[1]));
  for (let i = 0; i < n; i++) {
    soltar(x + azar(-t.ancho * 2, t.ancho * 2), base - t.alto * azar(0.5, 1), {
      vx: azar(-24, 24) + clima.viento * 20,
      vy: azar(-12, 18),
      vida: azar(2.4, 5),
      tam: U * azar(0.5, 1.1),
      tipo: TIPO.HOJA,
      giro: azar(0, 6.283), giroV: azar(-2.4, 2.4),
      tono: Math.random(),
    });
  }

  /* El sonido: hojas. Ruido agudo con envolvente de seno, no un golpe:
     un árbol no suena «toc», suena «shhh». */
  if (despertarAudio()) {
    const c = audio.ctx, t0 = c.currentTime;
    const nn = Math.floor(c.sampleRate * 0.45);
    const buf = c.createBuffer(1, nn, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < nn; i++) {
      const kk = i / nn;
      d[i] = (Math.random() * 2 - 1) * Math.sin(kk * Math.PI) * (0.3 + 0.7 * Math.random());
    }
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = azar(2200, 3400);
    const g = c.createGain(); g.gain.value = 0.1 * Math.min(1, Math.abs(fuerza) * 0.3);
    src.connect(f).connect(g).connect(audio.maestro);
    src.start(t0);
  }

  /* Y la cámara acusa el golpe, poquito. */
  sacudir(Math.min(0.3, Math.abs(fuerza) * 0.06));
}

/** Un abeto: tres pisos de triángulos y un tronquito. */
function abeto(x, base, w, h) {
  ctx.beginPath();
  ctx.moveTo(x - w * 0.22, base);
  ctx.lineTo(x - w * 0.22, base - h * 0.16);
  ctx.lineTo(x - w, base - h * 0.16);
  ctx.lineTo(x - w * 0.5, base - h * 0.44);
  ctx.lineTo(x - w * 0.78, base - h * 0.44);
  ctx.lineTo(x - w * 0.38, base - h * 0.74);
  ctx.lineTo(x - w * 0.56, base - h * 0.74);
  ctx.lineTo(x, base - h);
  ctx.lineTo(x + w * 0.56, base - h * 0.74);
  ctx.lineTo(x + w * 0.38, base - h * 0.74);
  ctx.lineTo(x + w * 0.78, base - h * 0.44);
  ctx.lineTo(x + w * 0.5, base - h * 0.44);
  ctx.lineTo(x + w, base - h * 0.16);
  ctx.lineTo(x + w * 0.22, base - h * 0.16);
  ctx.lineTo(x + w * 0.22, base);
  ctx.closePath();
  ctx.fill();
}

/* ==========================================
   EL BÚHO Y LO QUE MIRA DESDE EL FONDO
   ==========================================

   ── POR QUÉ EL BÚHO NO ES UN DIBUJO QUIETO ──────────────────────────
   Antes eran dos óvalos amarillos que parpadeaban con un contador. Se
   encontraba una vez y ya no volvía a pasar nada: siempre en el mismo
   sitio, siempre la misma frase, siempre la misma cara.

   Ahora es un bicho. Se asoma y se vuelve a meter, gira la cabeza para
   seguirte el dedo, guiña un ojo de vez en cuando, y cuando lo pillas
   SE VA VOLANDO a otro árbol. La próxima vez que lo busques no está
   donde lo dejaste, y eso es lo que hace que se siga buscando.

   ── LOS OJOS SON VERDES ─────────────────────────────────────────────
   Verde y no amarillo a propósito: es el mismo verde de la luz que se
   esconde en el bosque. Cuando se ven los dos a la vez, se entiende sin
   que nadie lo explique que son la misma cosa.

   ── SE POSA EN UN ÁRBOL DE VERDAD ───────────────────────────────────
   Los escondites de `CONF` son puntos de pantalla, y una pantalla
   cambia de forma. Así que no se usan tal cual: se busca el árbol
   tocable más cercano a ese punto y el búho se posa EN ÉL, a la altura
   de su copa. Gire el teléfono quien lo gire, el búho sigue en una
   rama y no flotando en el aire.

   Y como está agarrado al árbol, cuando sacudes ese árbol el búho se
   sacude con él. No hay código para eso: sale solo de leer `sac`.
*/

/* Las frases, barajadas: sin esto salía dos veces seguidas la misma
   cada dos por tres, y una frase repetida mata el encanto al instante. */
const diceBuho         = barajador(CONF.buho.dice);
const diceBuhoOtraVez  = barajador(CONF.buho.diceOtraVez);
const diceOjos         = barajador(CONF.ojosRojos.dice);
const diceCruje        = barajador(CONF.arbolNota.cruje);

function construirBuho() {
  /* Se conserva lo vivido: al girar el teléfono se remide el mundo
     entero, y sería feo que el búho se olvidara de cuántas veces lo
     has encontrado sólo porque has cambiado de postura. */
  const antes = buho;
  buho = {
    escondite: antes ? antes.escondite : 0,
    veces: antes ? antes.veces : recuerdo.leer("buho", 0),
    arbol: null,
    x: 0, y: 0, r: U * 2.7,
    /* Cuánto asoma, de 0 (escondido del todo) a 1. */
    salida: 0, salidaObj: 0,
    relojAsomo: azar(3, 9),
    /* El parpadeo. `guino` es cerrar sólo el ojo izquierdo. */
    parpadeo: 0, guino: 0, relojParpadeo: azar(1.5, 5),
    /* El giro de la cabeza: -1 mira a su izquierda, 1 a su derecha. */
    giro: 0, giroObj: 0, relojGiro: azar(2, 6),
    /* El aleteo: fase y amplitud. */
    ala: 0, aleteo: 0,
    /* El respiro del cuerpo y el brillo de los ojos. */
    resp: Math.random() * 6.283,
    /* El susto: cuando salta a la cara, esto se pone a 1. */
    susto: 0,
    /* El vuelo de un escondite a otro. */
    vuelo: null,
    visto: 0,
  };
  buho.perchas = elegirPerchas();
  /* La primera vez empieza en uno cualquiera; al remedir se queda en el
     que estaba, que es lo que se espera al girar el teléfono. */
  if (!antes) buho.escondite = Math.floor(rnd() * Math.max(1, buho.perchas.length));
  colocarBuhoEn(buho.escondite);
  if (antes) { buho.salida = antes.salida; buho.salidaObj = antes.salidaObj; }
}

/**
 * Reparte los escondites entre árboles DISTINTOS.
 *
 * Los de `CONF` son puntos de pantalla, y buscar cada vez «el árbol más
 * cercano a este punto» tenía un fallo tonto: como la cabaña y la
 * fogata dejan fuera media anchura, tres escondites acababan cayendo en
 * el MISMO árbol. Cinco sitios que son uno no son cinco sitios.
 *
 * Así que se reparten de una vez, y cada árbol elegido se retira del
 * saco. Si no cabe alguno, se queda con menos escondites y ya está: es
 * mejor que repetirlos.
 */
function elegirPerchas() {
  const cab = sitio.cabana;
  const vale = (t) => {
    /* Los de lejos no: son demasiado pequeños para que quepa un búho
       encima sin parecer un pájaro gigante. */
    if (t.banda === 0) return false;
    /* Los que caen sobre la cabaña tampoco: quedan tapados por ella, o
       peor, encima del tejado. */
    if (Math.abs(t.x - cab.x) < cab.w * 0.5) return false;
    /* Los de en medio pegados a la fogata, tampoco: ahí hay luz de
       sobra y un búho que se ve a la primera deja de ser un secreto. */
    if (t.banda === 1 && Math.abs(t.x - sitio.fogata.x) < A * 0.1) return false;
    /* Y los de cerca cuyo tronco está fuera de la pantalla: el búho
       quedaría flotando lejos de su propio árbol. */
    if (t.banda === 2 && (t.x < -U * 2 || t.x > A + U * 2)) return false;
    return true;
  };

  const libres = arboles.filter(vale);
  const perchas = [];
  for (const [fx, fy] of CONF.buho.escondites) {
    const px = fx * A;
    let mejor = -1, mejorD = Infinity;
    for (let i = 0; i < libres.length; i++) {
      if (!libres[i]) continue;
      const d = Math.abs(libres[i].x - px);
      if (d < mejorD) { mejorD = d; mejor = i; }
    }
    if (mejor < 0) break;
    perchas.push({ arbol: libres[mejor], fy });
    libres[mejor] = null;
  }
  return perchas;
}

/** Posa el búho en el escondite número `i`. */
function colocarBuhoEn(i) {
  const n = buho.perchas ? buho.perchas.length : 0;
  if (!n) { buho.arbol = null; buho.r = U * 3.1; return; }
  buho.escondite = ((i % n) + n) % n;
  const percha = buho.perchas[buho.escondite];
  const mejor = percha.arbol;
  const cab = sitio.cabana;
  const py = percha.fy * H;
  buho.arbol = mejor;

  if (mejor) {
    const cima = mejor.base - mejor.alto;
    /* ---- A qué lado del tronco ----
       Se prueban los dos y gana el que quede más lejos de la cabaña sin
       salirse de la pantalla. Empujarlo siempre «hacia dentro» tenía un
       fallo: los árboles de la derecha lo mandaban justo encima del
       tejado, que es lo único que se quería evitar. */
    const dentroPantalla = (x) => x > U * 6 && x < A - U * 6;
    const izq = mejor.x - mejor.ancho * 1.6;
    const der = mejor.x + mejor.ancho * 1.6;
    let haciaDentro;
    if (dentroPantalla(izq) && dentroPantalla(der)) {
      haciaDentro = Math.abs(izq - cab.x) >= Math.abs(der - cab.x) ? -1 : 1;
    } else {
      haciaDentro = dentroPantalla(der) ? 1 : -1;
    }
    /* Y en la COPA, no a media altura: en el tercio de arriba del
       árbol, que es donde se posan. A media altura quedaba metido
       entre el ramaje y no se veía ni buscándolo. */
    buho.r = U * (apaisado ? 2.6 : 3.1) * (mejor.banda === 2 ? 1.3 : 1);
    buho.x = clamp(mejor.x + mejor.ancho * 1.6 * haciaDentro, U * 6, A - U * 6);
    buho.y = clamp(
      clamp(py, cima + mejor.alto * 0.08, cima + mejor.alto * 0.5),
      U * 9, sitio.suelo - U * 3,
    );
    /* Se guarda dónde está respecto al árbol para poder seguir sus
       bamboleos sin recalcular nada. */
    buho.relX = buho.x - mejor.x;
    buho.relY = buho.y - mejor.base;
  } else {
    buho.r = U * (apaisado ? 2.6 : 3.1);
    buho.x = A * 0.5; buho.y = py; buho.relX = 0; buho.relY = 0;
  }
}

/** El sonido del búho: `misterio.mp3` si está, y si no su gemelo. */
let sonandoMisterio = false;
async function sonarMisterio(vol = 0.5) {
  if (sonandoMisterio) return;
  sonandoMisterio = true;
  setTimeout(() => { sonandoMisterio = false; }, 1600);

  const c = despertarAudio();
  if (!c) return;
  const buf = await traerBuffer(CONF.rutas.misterio);
  if (buf) {
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = vol;
    src.connect(g).connect(audio.maestro);
    src.start();
    return;
  }

  /* ---- El gemelo: un ulular de verdad ----
     Un búho no hace "pip". Hace dos notas: una corta y una larga que
     baja un poco al final, las dos con un vibrato lento y muy poquito
     armónico. Se monta con dos senos —el tono y su quinta muy floja— y
     una pizca de ruido soplado por encima, que es el aire de la
     garganta. Sin ese ruido suena a flauta, no a bicho. */
  const t0 = c.currentTime;
  const notas = [
    { cuando: 0.00, dur: 0.34, hz: 392, baja: 0 },
    { cuando: 0.46, dur: 0.72, hz: 330, baja: 26 },
  ];
  for (const n of notas) {
    const t = t0 + n.cuando;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol * 0.24, t + 0.07);
    g.gain.setValueAtTime(vol * 0.24, t + n.dur * 0.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + n.dur);
    g.connect(audio.maestro);

    /* El vibrato: un seno lentísimo movido sobre la frecuencia. */
    const vib = c.createOscillator(), vibG = c.createGain();
    vib.frequency.value = 5.2; vibG.gain.value = n.hz * 0.012;
    vib.connect(vibG);

    for (const [mult, amp] of [[1, 1], [1.5, 0.18], [2, 0.08]]) {
      const o = c.createOscillator(), og = c.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(n.hz * mult, t);
      o.frequency.linearRampToValueAtTime((n.hz - n.baja) * mult, t + n.dur);
      og.gain.value = amp;
      vibG.connect(o.frequency);
      o.connect(og).connect(g);
      o.start(t); o.stop(t + n.dur + 0.05);
    }
    vib.start(t); vib.stop(t + n.dur + 0.05);

    /* El aire de la garganta. */
    const src = c.createBufferSource(); src.buffer = bufferRosa(1.2);
    const f = c.createBiquadFilter(); f.type = "bandpass";
    f.frequency.value = n.hz * 2.2; f.Q.value = 1.6;
    const ng = c.createGain();
    ng.gain.setValueAtTime(0, t);
    ng.gain.linearRampToValueAtTime(vol * 0.05, t + 0.09);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + n.dur);
    src.connect(f).connect(ng).connect(audio.maestro);
    src.start(t); src.stop(t + n.dur + 0.05);
  }
}

function moverBuho(dt) {
  if (!buho) return;
  const b = buho;
  b.resp += dt * 1.3;
  b.susto = Math.max(0, b.susto - dt * 1.1);

  /* ---- El vuelo entre escondites ----
     Va por una parábola y no en línea recta, y el aleteo es más fuerte
     al despegar que al llegar. Es todo lo que hace falta para que se
     lea como un bicho volando y no como una imagen deslizándose. */
  if (b.vuelo) {
    const v = b.vuelo;
    v.t += dt;
    const k = clamp01(v.t / v.dur);
    const s = suave3(k);
    b.x = mez(v.x0, v.x1, s);
    b.y = mez(v.y0, v.y1, s) - Math.sin(k * Math.PI) * v.arco;
    b.aleteo = mez(1, 0.35, k);
    b.ala += dt * 17;
    b.giro = mez(b.giro, v.x1 > v.x0 ? 0.6 : -0.6, 0.1);
    b.salida = 1;
    if (k >= 1) {
      b.vuelo = null;
      b.aleteo = 0;
      colocarBuhoEn(v.destino);
      /* Al llegar se mete entre las ramas y tarda un rato en asomar:
         que no esté esperándote ya con los ojos encendidos. */
      b.salida = 0; b.salidaObj = 0;
      b.relojAsomo = azar(8, 18);
    }
    return;
  }

  /* ---- Asomarse y volver a esconderse ---- */
  b.relojAsomo -= dt;
  if (b.relojAsomo <= 0) {
    if (b.salidaObj > 0.5) { b.salidaObj = 0; b.relojAsomo = azar(10, 24); }
    else {
      b.salidaObj = 1;
      b.relojAsomo = azar(9, 20);
      /* Una de cada seis veces que se asoma, además canta. Y sólo si la
         tormenta no está tapándolo todo: un búho no ulula bajo un
         diluvio, y encima no se oiría. */
      if (Math.random() < 0.17 && clima.lluvia < 0.4) sonarMisterio(0.32);
    }
  }
  b.salida = damp(b.salida, b.salidaObj, 1.7, dt);

  /* ---- Parpadeo ---- */
  b.relojParpadeo -= dt;
  if (b.relojParpadeo <= 0) {
    b.relojParpadeo = azar(1.8, 6);
    if (Math.random() < 0.22) b.guino = 1; else b.parpadeo = 1;
  }
  b.parpadeo = Math.max(0, b.parpadeo - dt * 5.2);
  b.guino = Math.max(0, b.guino - dt * 3.4);

  /* ---- El giro de la cabeza ----
     Si el dedo anda cerca, lo sigue. Si no, mira a su aire de vez en
     cuando. Un búho gira la cabeza a saltos, no en continuo, así que
     el objetivo cambia de golpe y lo que se amortigua es el camino. */
  const cerca = dedo.dentro && Math.hypot(dedo.x - b.x, dedo.y - b.y) < U * 34;
  if (cerca) {
    b.giroObj = clamp((dedo.x - b.x) / (U * 16), -1, 1);
    b.relojGiro = azar(1.4, 3);
  } else {
    b.relojGiro -= dt;
    if (b.relojGiro <= 0) {
      b.relojGiro = azar(2.2, 6.5);
      b.giroObj = Math.random() < 0.35 ? 0 : azar(-0.85, 0.85);
    }
  }
  b.giro = damp(b.giro, b.giroObj, 5.5, dt);

  b.visto = Math.max(0, b.visto - dt * 0.35);
  b.aleteo = Math.max(0, b.aleteo - dt * 2.2);
  b.ala += dt * (4 + b.aleteo * 14);

  /* ---- Va montado en su árbol ----
     Si el árbol se bambolea, el búho se bambolea con él. Se rehace su
     posición a partir de la del árbol y su ángulo de sacudida, que es
     exactamente lo que le pasaría a algo agarrado a una rama. */
  const t = b.arbol;
  if (t && !b.vuelo) {
    const alturaRel = clamp01((t.base - (t.base + b.relY)) / Math.max(1, t.alto));
    const giroRama = t.sac * alturaRel;
    const cos = Math.cos(giroRama), sen = Math.sin(giroRama);
    b.x = t.x + b.relX * cos - b.relY * sen;
    b.y = t.base + b.relX * sen + b.relY * cos;
    b.inclina = giroRama;
  } else {
    b.inclina = 0;
  }
}

/**
 * Lo que pasa cuando lo encuentras: te mira, canta y se va volando.
 * Y la próxima vez dice otra cosa, porque se acuerda.
 */
function tocarBuho() {
  const b = buho;
  if (!b || b.vuelo) return false;

  b.veces++;
  recuerdo.poner("buho", b.veces);
  b.visto = 1;
  b.salida = 1; b.salidaObj = 1;
  b.parpadeo = 1;
  b.giroObj = 0; b.giro = 0;
  b.aleteo = 1;

  sonarMisterio(0.55);
  soltarBrillos(b.x, b.y, 8, 140);

  const dice = b.veces <= 1
    ? CONF.buho.dice[0]
    : (b.veces >= 4 ? diceBuhoOtraVez() : diceBuho());
  decir(b.x, b.y - U * 6, dice, { mimo: true, importante: true });
  contarLogro("buho");

  /* Se va a otro escondite. Nunca al mismo, y con preferencia por uno
     lejos: si se quedara al lado, no habría que volver a buscarlo. */
  setTimeout(() => {
    if (!buho || buho.vuelo) return;
    const lista = buho.perchas || [];
    if (lista.length < 2) return;
    /* ---- A cuál se va ----
       No al más lejano: eso lo dejaba yendo y viniendo entre los mismos
       dos árboles para siempre, que es peor que quedarse quieto. Se
       sortea entre todos los demás, pero con el cuadrado de la
       distancia como peso: casi siempre acaba lejos, y de vez en cuando
       aparece a dos palmos, que es cuando más gracia hace. */
    let destino = buho.escondite;
    let total = 0;
    const pesos = lista.map((q, i) => {
      if (i === buho.escondite) return 0;
      const d = Math.abs(q.arbol.x - buho.x) / A;
      const w = 0.12 + d * d * 3;
      total += w;
      return w;
    });
    let tirada = Math.random() * total;
    for (let i = 0; i < pesos.length; i++) {
      if (tirada < pesos[i]) { destino = i; break; }
      tirada -= pesos[i];
    }
    if (destino === buho.escondite) destino = (buho.escondite + 1) % lista.length;
    const px = lista[destino].arbol.x, py = lista[destino].fy * H;
    buho.vuelo = {
      t: 0,
      dur: 1.25 + Math.abs(px - buho.x) / A * 0.9,
      x0: buho.x, y0: buho.y,
      x1: px, y1: py,
      arco: U * azar(9, 16),
      destino,
    };
  }, 900);

  return true;
}

/**
 * Dibuja el búho: cuerpo, orejas, alas y dos ojos que miran.
 *
 * Se llama DOS VECES por fotograma, una por cada banda de árboles que
 * puede estar tapándolo, y sólo pinta en la que le toca. Es la única
 * forma de que un búho posado en un árbol de en medio quede detrás de
 * los troncos de delante y uno posado en los de delante quede encima:
 * el orden de pintado es la profundidad, y aquí la profundidad depende
 * de en qué árbol se haya posado esta vez.
 *
 * Volando pasa por delante de todo, que es lo que hace un bicho que
 * cruza la escena.
 */
function dibujarBuho(banda) {
  if (!buho) return;
  const b = buho;
  /* Escondido del todo y sin volar: no hay nada que pintar. */
  if (b.salida < 0.015 && !b.vuelo) return;

  const miBanda = b.vuelo ? 2 : (b.arbol ? b.arbol.banda : 2);
  if (miBanda !== banda) return;

  /* El mismo parallax que los árboles de su banda: si no coincidiera,
     se le vería despegarse de la rama al mover el dedo. */
  const conf = CONF.bosque.bandas[miBanda];
  const d = desplazar(mez(0.3, 3.4, conf.z));

  const x = b.x + d.x, y = b.y + d.y;
  const r = b.r * (1 + b.susto * 1.6);
  const sal = clamp01(b.salida);

  /* Cuánto tiene los ojos abiertos. El guiño cierra sólo el izquierdo,
     así que se calculan por separado. */
  const cerrado = Math.sin(clamp01(b.parpadeo) * Math.PI);
  const cerradoG = Math.sin(clamp01(b.guino) * Math.PI);
  const abiertoI = clamp01(1 - Math.max(cerrado, cerradoG));
  const abiertoD = clamp01(1 - cerrado);

  /* El respiro: el cuerpo se ensancha un pelín al inspirar. */
  const resp = 1 + Math.sin(b.resp) * 0.035;
  /* Cuando está a medio asomar, lo que se ve es la mitad de arriba. */
  const asoma = mez(0.45, 1, sal);

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((b.inclina || 0) * 0.6 + (b.vuelo ? Math.sin(b.ala) * 0.08 : 0));
  ctx.globalAlpha = mez(0.35, 1, sal);

  /* ---- Las alas, detrás del cuerpo ----
     Dos hojas que se abren y se cierran. En reposo apenas se mueven; al
     volar se abren del todo. */
  const abre = 0.12 + b.aleteo * (0.5 + Math.sin(b.ala) * 0.5) * 1.15;
  for (const s of [-1, 1]) {
    ctx.save();
    ctx.translate(s * r * 0.62, -r * 0.1);
    ctx.rotate(s * (0.35 + abre));
    ctx.beginPath();
    ctx.ellipse(0, r * 0.35, r * 0.42, r * 0.95 * asoma, 0, 0, 6.283);
    ctx.fillStyle = "rgba(20,19,27,0.95)";
    ctx.fill();
    /* Un filo de luna por el canto del ala. Sin esto el aleteo no se
       veía: era negro moviéndose sobre negro. */
    ctx.strokeStyle = `rgba(140,172,225,${mez(0.08, 0.3, sal) * (0.35 + b.aleteo * 0.65)})`;
    ctx.lineWidth = Math.max(0.8, r * 0.1);
    ctx.stroke();
    /* Y tres plumas largas marcadas en el borde de abajo, que es lo que
       convierte un óvalo en un ala. */
    if (b.aleteo > 0.15) {
      ctx.strokeStyle = `rgba(150,180,235,${0.16 * b.aleteo})`;
      ctx.lineWidth = Math.max(0.6, r * 0.05);
      for (let i = 0; i < 3; i++) {
        const ang = -0.5 + i * 0.42;
        ctx.beginPath();
        ctx.moveTo(Math.sin(ang) * r * 0.2, r * (0.5 + i * 0.1));
        ctx.lineTo(Math.sin(ang) * r * 0.42, r * (1.2 * asoma));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* ---- El cuerpo ----
     No es un óvalo liso: lleva un degradado de arriba abajo para que la
     barriga se vea un poco más clara, como si le llegara la luz de la
     fogata de abajo. */
  const gc = ctx.createLinearGradient(0, -r * 1.2, 0, r * 1.2);
  const luzF = fuego.brillo * clamp01(1 - Math.abs(x - sitio.fogata.x) / (A * 0.7)) * 0.5;
  gc.addColorStop(0, "rgb(20,19,27)");
  gc.addColorStop(1, mezColor("rgb(34,30,38)", "rgb(96,64,44)", luzF));
  ctx.fillStyle = gc;
  ctx.beginPath();
  ctx.ellipse(0, 0, r * resp, r * 1.22 * asoma, 0, 0, 6.283);
  ctx.fill();

  /* ---- La luz de borde ----
     Un bulto negro sobre un fondo negro no se ve. Lo que lo saca es un
     filo de luz por el lado de la luna: un arco finísimo, de un azul
     frío, siguiendo el contorno. Es lo que separa al búho del árbol sin
     tener que iluminarlo entero y estropear que esté escondido. */
  const haciaLuna = sitio.luna.x < b.x ? -1 : 1;
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(0, 0, r * resp, r * 1.22 * asoma, 0, 0, 6.283);
  ctx.clip();
  ctx.strokeStyle = `rgba(150,180,235,${mez(0.1, 0.34, sal) * (1 - clima.lluvia * 0.5)})`;
  ctx.lineWidth = Math.max(1, r * 0.16);
  ctx.beginPath();
  ctx.ellipse(haciaLuna * r * 0.1, 0, r * resp, r * 1.22 * asoma, 0, 0, 6.283);
  ctx.stroke();
  ctx.restore();

  /* Las plumas del pecho: tres arcos flojos. Sin esto es una piedra. */
  ctx.strokeStyle = "rgba(255,240,220,0.055)";
  ctx.lineWidth = Math.max(0.6, r * 0.07);
  for (let i = 0; i < 3; i++) {
    const yy = r * (0.12 + i * 0.3) * asoma;
    ctx.beginPath();
    ctx.arc(0, yy - r * 0.9, r * 0.82, 0.55, Math.PI - 0.55);
    ctx.stroke();
  }

  /* ---- La cabeza, que gira ---- */
  ctx.save();
  ctx.translate(b.giro * r * 0.16, -r * 0.62 * asoma);

  /* Las orejas: dos picos que se inclinan con el giro. Llevan su propio
     filo de luna, porque sin él eran negro sobre negro y el búho se
     quedaba con la cabeza redonda, que es media cara de gato. */
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(s * r * 0.24, -r * 0.34);
    ctx.lineTo(s * r * (0.62 + b.giro * s * 0.12), -r * (0.92 + b.aleteo * 0.1));
    ctx.lineTo(s * r * 0.72, -r * 0.24);
    ctx.closePath();
    ctx.fillStyle = "rgb(17,16,23)";
    ctx.fill();
    ctx.strokeStyle = `rgba(140,172,225,${mez(0.06, 0.26, sal)})`;
    ctx.lineWidth = Math.max(0.6, r * 0.07);
    ctx.stroke();
  }

  /* El disco facial: lo que hace que un búho sea un búho. */
  ctx.fillStyle = "rgb(26,24,33)";
  ctx.beginPath();
  ctx.ellipse(b.giro * r * 0.1, 0, r * 0.88, r * 0.74, 0, 0, 6.283);
  ctx.fill();

  /* ---- LOS OJOS, VERDES ----
     El mismo verde que la luz escondida del bosque. Se pintan en
     `lighter` para que brillen de verdad y no sean dos pegatinas. */
  const cx = b.giro * r * 0.26;
  const brillo = (0.55 + Math.sin(b.resp * 1.7) * 0.12 + b.visto * 0.45) * mez(0.35, 1, sal);
  ctx.globalCompositeOperation = "lighter";
  const ojos = [[-1, abiertoI], [1, abiertoD]];
  for (const [s, ab] of ojos) {
    const ex = cx + s * r * 0.36;
    const ey = -r * 0.04;
    if (ab > 0.02) {
      /* El halo es CORTO a propósito. Uno grande le comía la cabeza
         entera y el búho se quedaba en una mancha verde con dos puntos:
         no se le veían ni las orejas ni el pico. Apretado, en cambio,
         parecen dos ojos encendidos dentro de una cara oscura, que es
         justo lo que tiene que parecer. */
      const halo = r * 0.72;
      const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, halo);
      g.addColorStop(0,    `rgba(170,255,200,${(0.5 * ab + b.visto * 0.32) * brillo})`);
      g.addColorStop(0.34, `rgba(60,220,140,${0.22 * ab * brillo})`);
      g.addColorStop(1,    "rgba(40,200,120,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ex, ey, halo, 0, 6.283); ctx.fill();

      /* El iris y, dentro, la pupila negra. La pupila NO brilla: es lo
         que le da profundidad al ojo. */
      ctx.fillStyle = `rgba(190,255,215,${0.95 * ab * mez(0.4, 1, sal)})`;
      ctx.beginPath();
      ctx.ellipse(ex, ey, r * 0.22, r * 0.22 * ab, 0, 0, 6.283);
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = `rgba(4,10,7,${0.9 * ab})`;
      ctx.beginPath();
      ctx.ellipse(ex + b.giro * r * 0.05, ey, r * 0.1, r * 0.12 * ab, 0, 0, 6.283);
      ctx.fill();
      ctx.globalCompositeOperation = "lighter";
    } else {
      /* Cerrado: una rayita clara, el borde del párpado. */
      ctx.strokeStyle = `rgba(90,190,130,${0.3 * brillo})`;
      ctx.lineWidth = Math.max(0.7, r * 0.07);
      ctx.beginPath();
      ctx.moveTo(ex - r * 0.2, ey); ctx.lineTo(ex + r * 0.2, ey);
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = "source-over";

  /* El pico, entre los dos ojos y un poco más abajo. */
  ctx.fillStyle = `rgba(210,160,90,${mez(0.3, 0.85, sal)})`;
  ctx.beginPath();
  ctx.moveTo(cx - r * 0.1, r * 0.16);
  ctx.lineTo(cx + r * 0.1, r * 0.16);
  ctx.lineTo(cx + b.giro * r * 0.06, r * 0.42);
  ctx.closePath();
  ctx.fill();

  ctx.restore();  // cabeza

  /* ---- La rama ----
     Sólo cuando está posado. Es un palito, pero sin él el búho parece
     flotando y con él parece que vive ahí. */
  if (!b.vuelo && sal > 0.25) {
    /* No es un palo recto de canto a canto —eso parecía un cable—: es
       una rama que sale de un lado, se afina y acaba en dos ramitas.
       Se pinta con un relleno y no con un trazo, que es lo único que
       permite que tenga grosor variable. */
    const haciaTronco = (b.relX || 0) < 0 ? 1 : -1;
    const largo = r * 2.2, grueso = r * 0.26;
    ctx.fillStyle = `rgba(16,15,20,${0.9 * sal})`;
    ctx.beginPath();
    ctx.moveTo(haciaTronco * largo, r * 1.1 - grueso * 1.3);
    ctx.quadraticCurveTo(0, r * 1.22 - grueso * 0.6, -haciaTronco * r * 0.85, r * 1.3);
    ctx.quadraticCurveTo(0, r * 1.3 + grueso * 0.5, haciaTronco * largo, r * 1.14 + grueso * 1.2);
    ctx.closePath();
    ctx.fill();
    /* Dos ramitas en la punta. */
    ctx.strokeStyle = `rgba(16,15,20,${0.8 * sal})`;
    ctx.lineWidth = Math.max(0.8, r * 0.09);
    ctx.lineCap = "round";
    for (const [dx, dy] of [[0.5, -0.32], [0.34, 0.2]]) {
      ctx.beginPath();
      ctx.moveTo(-haciaTronco * r * 0.7, r * 1.29);
      ctx.lineTo(-haciaTronco * r * (0.7 + dx), r * (1.29 + dy));
      ctx.stroke();
    }
  }

  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ==========================================
   LA NOTA DEL ÁRBOL
   ==========================================

   Uno de los árboles de en medio guarda un papelito. No se distingue
   de los demás: hay que sacudir árboles a lo tonto hasta dar con él, y
   eso es exactamente lo que se quiere que pase.

   ── EL PAPEL CAE DE VERDAD ──────────────────────────────────────────
   No aparece: se desprende de la copa y BAJA. Y no baja recto, baja
   como baja un papel, que es lo único que lo hace creíble: la
   resistencia del aire lo frena mucho más que a una piedra, y el
   viento lo empuja de lado mientras se balancea sobre sí mismo.

   Se simula con tres cosas y ya está:
     · gravedad floja y un rozamiento fuerte → cae despacio
     · un seno sobre la velocidad horizontal → el vaivén de la hoja
     · el ángulo sigue a la velocidad → se pone de canto al caer deprisa

   ── Y SE ACUERDA ────────────────────────────────────────────────────
   Cae una sola vez. Para siempre, no para esta visita: si mañana se
   vuelve a abrir la página, ese árbol ya no tiene nada y lo dice.   */

const nota = {
  viva: false,
  x: 0, y: 0, vx: 0, vy: 0,
  ang: 0, angV: 0,
  posada: false,
  leida: false,
  brillo: 0,
  t: 0,
};

/**
 * Se llama cada vez que se sacude un árbol. Decide si éste era el
 * árbol, y si lo era, si ya toca soltar el papel.
 */
function mirarArbolCarta(t, p) {
  if (!t || !t.carta) return;

  /* Ya cayó, hoy o cualquier otro día. */
  if (recuerdo.leer("notaArbol", 0)) {
    /* Sólo se dice de vez en cuando: si lo dijera en cada sacudida
       sería un cartel, y esto no es un cartel. */
    if (Math.random() < 0.3) {
      decir(t.x, t.base - t.alto * 0.9, CONF.arbolNota.yaCayo, { dur: 3.2 });
    }
    return;
  }

  const faltan = CONF.arbolNota.toques - t.toques;

  /* Cerca pero todavía no: se oye algo ahí arriba. Es la pista, y es
     lo que convierte «sacudir árboles» en «sacudir ESTE árbol». */
  if (faltan > 0) {
    if (faltan <= 2) {
      decir(t.x, t.base - t.alto * 0.92, diceCruje(), { dur: 3 });
      /* Un crujido de madera, muy corto. */
      golpe(0.09, azar(300, 560), 0.1, "bandpass");
    }
    return;
  }

  /* Y cae. */
  nota.viva = true;
  nota.posada = false;
  nota.leida = false;
  nota.x = t.x + azar(-t.ancho, t.ancho);
  nota.y = t.base - t.alto * azar(0.72, 0.9);
  nota.vx = azar(-6, 6);
  nota.vy = 0;
  nota.ang = azar(-0.6, 0.6);
  nota.angV = azar(-1.4, 1.4);
  nota.t = 0;
  nota.brillo = 0;
  /* El suelo donde se posará: un poco por delante del árbol. */
  nota.suelo = mez(t.base, sitio.suelo + U * 3, 0.55);

  sacudirArbol(t, (p && p.x < t.x ? 1 : -1) * 2.4);
  decir(t.x, t.base - t.alto * 0.9, CONF.arbolNota.alCaer, { dur: 3.4, importante: true });
  magia(392);
  contarLogro("arbolNota");
}

function moverNota(dt) {
  if (!nota.viva) return;
  nota.t += dt;
  nota.brillo = 0.4 + Math.sin(nota.t * 2.1) * 0.25;

  if (nota.posada) return;

  /* La caída de un papel. Gravedad floja, rozamiento fuerte, y un
     vaivén que sale de un seno sobre la velocidad horizontal. */
  nota.vy += U * 26 * dt;
  nota.vy *= Math.exp(-2.6 * dt);
  nota.vx += (Math.sin(nota.t * 3.4) * U * 16 + clima.viento * U * 18) * dt;
  nota.vx *= Math.exp(-1.9 * dt);

  nota.x += nota.vx * dt;
  nota.y += nota.vy * dt;

  /* El ángulo sigue a la velocidad: cuando baja deprisa se pone de
     canto, y cuando planea se pone plana. */
  const objAng = Math.atan2(nota.vx, Math.max(1, nota.vy)) * 0.9;
  nota.angV += (objAng - nota.ang) * 22 * dt;
  nota.angV *= Math.exp(-4.2 * dt);
  nota.ang += nota.angV * dt;

  if (nota.y >= nota.suelo) {
    nota.y = nota.suelo;
    nota.posada = true;
    nota.ang = azar(-0.35, 0.35);
    golpe(0.06, 1800, 0.05, "highpass");
  }
}

/** Leer la nota: las líneas van saliendo una detrás de otra. */
function leerNota() {
  if (!nota.viva || nota.leida) return false;
  nota.leida = true;
  recuerdo.poner("notaArbol", 1);
  magia(523);
  soltarBrillos(nota.x, nota.y, 10, 60);

  CONF.arbolNota.nota.forEach((linea, i) => {
    setTimeout(() => {
      decir(clamp(nota.x, A * 0.22, A * 0.78), nota.y - U * (7 + i * 0.5),
        linea, { mimo: true, importante: i === CONF.arbolNota.nota.length - 1, dur: 4.2 });
    }, i * 2000);
  });

  /* Y se la queda: el papel se va con un puñado de brillos. */
  setTimeout(() => { nota.viva = false; }, CONF.arbolNota.nota.length * 2000 + 1200);
  return true;
}

function dibujarNota(d) {
  if (!nota.viva) return;
  const x = nota.x + d.x, y = nota.y + d.y;
  const w = U * 2.1, h = U * 2.7;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(nota.ang);

  /* Un halo calentito, para que se vea que hay algo ahí sin tener que
     dibujarle una flecha encima. */
  ctx.globalCompositeOperation = "lighter";
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, w * 3.4);
  g.addColorStop(0, `rgba(255,236,190,${0.2 * nota.brillo})`);
  g.addColorStop(1, "rgba(255,210,140,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, w * 3.4, 0, 6.283); ctx.fill();
  ctx.globalCompositeOperation = "source-over";

  /* El papel: doblado por la mitad, con la sombra del doblez. Dos
     cuadriláteros y ya parece un papel. */
  ctx.fillStyle = "rgb(236,228,206)";
  ctx.beginPath();
  ctx.moveTo(-w, -h * 0.5);
  ctx.lineTo(w, -h * 0.42);
  ctx.lineTo(w * 0.92, h * 0.5);
  ctx.lineTo(-w * 0.96, h * 0.44);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "rgba(150,140,118,0.5)";
  ctx.beginPath();
  ctx.moveTo(-w, -h * 0.5);
  ctx.lineTo(w, -h * 0.42);
  ctx.lineTo(w * 0.96, -h * 0.24);
  ctx.lineTo(-w * 0.98, -h * 0.3);
  ctx.closePath();
  ctx.fill();

  /* Dos rayitas de escritura. No se leen, y por eso funcionan: se
     entiende que hay algo escrito. */
  ctx.strokeStyle = "rgba(90,80,70,0.45)";
  ctx.lineWidth = Math.max(0.5, U * 0.14);
  for (let i = 0; i < 3; i++) {
    const yy = -h * 0.06 + i * h * 0.19;
    ctx.beginPath();
    ctx.moveTo(-w * 0.62, yy);
    ctx.lineTo(w * (0.2 + (i % 2) * 0.35), yy + U * 0.1);
    ctx.stroke();
  }

  ctx.restore();
}

/* ==========================================
   LOS OJOS ROJOS DEL FONDO
   ==========================================

   No es nada. No se puede tocar, no da puntos, no cuenta para nada. Se
   asoman muy de vez en cuando entre los árboles de lejos, se quedan un
   rato mirando, y si acercas el dedo se van.

   ── POR QUÉ NO SE PUEDEN ALCANZAR ───────────────────────────────────
   Porque lo que da la sensación de bosque de noche no es lo que ves:
   es lo que crees haber visto. En cuanto se pudieran tocar dejarían de
   ser eso y pasarían a ser un botón.

   Así que huyen SIEMPRE, y a veces sin ni siquiera dejar que te
   acerques. Es la única cosa de toda la escena que no quiere nada
   contigo, y por eso es la que más se recuerda.
*/

const ojos = {
  vivo: false,
  x: 0, y: 0, r: 0,
  alfa: 0, alfaObj: 0,
  reloj: azar(14, 30),
  dura: 0,
  parpadeo: 0, relojParpadeo: 0,
  huyendo: 0,
  vx: 0,
  dichas: 0,
};

function construirOjos() {
  ojos.vivo = false;
  ojos.alfa = 0; ojos.alfaObj = 0;
  ojos.reloj = azar(CONF.ojosRojos.cada[0] * 0.4, CONF.ojosRojos.cada[1] * 0.6);
}

function asomarOjos() {
  /* ---- Dónde caben ----
     Ni delante de la fogata —ahí hay demasiada luz y se verían de más—
     ni detrás de la cabaña, que se dibuja después y los taparía
     enteros. Antes esto era un bucle de «prueba un sitio al azar, y si
     no vale, otro»: con la cabaña y la fogata quitando entre las dos
     dos tercios de la pantalla, se quedaba sin intentos y los ponía
     igual donde no se veían.

     Así que no se sortea un punto: se sortean los HUECOS que quedan
     libres, cada uno con la probabilidad que le toca por lo ancho que
     sea. Siempre sale un sitio donde se ven. */
  const cab = sitio.cabana;
  const prohibido = [
    [sitio.fogata.x - A * 0.14, sitio.fogata.x + A * 0.14],
    [cab.x - cab.w * 0.62, cab.x + cab.w * 0.62],
  ].sort((u, v) => u[0] - v[0]);

  const huecos = [];
  let desde = A * 0.05;
  for (const [a0, a1] of prohibido) {
    if (a0 > desde) huecos.push([desde, Math.min(a0, A * 0.95)]);
    desde = Math.max(desde, a1);
  }
  if (desde < A * 0.95) huecos.push([desde, A * 0.95]);

  const validos = huecos.filter(([a0, a1]) => a1 - a0 > U * 6);
  let x;
  if (validos.length) {
    const total = validos.reduce((n, [a0, a1]) => n + (a1 - a0), 0);
    let tirada = Math.random() * total;
    for (const [a0, a1] of validos) {
      if (tirada < a1 - a0) { x = a0 + tirada; break; }
      tirada -= a1 - a0;
    }
    if (x === undefined) x = validos[0][0];
  } else {
    x = A * 0.08;
  }
  ojos.x = x;
  ojos.y = mez(sitio.horizonte + U * 2, sitio.suelo - U * 3, azar(0.15, 0.8));
  ojos.r = U * azar(0.42, 0.78);
  ojos.vivo = true;
  ojos.alfaObj = azar(0.5, 0.95);
  ojos.dura = azar(CONF.ojosRojos.dura[0], CONF.ojosRojos.dura[1]);
  ojos.huyendo = 0;
  ojos.vx = 0;
  ojos.parpadeo = 0;
  ojos.relojParpadeo = azar(0.8, 2.4);
}

function huirOjos(deGolpe) {
  if (!ojos.vivo || ojos.huyendo) return;
  ojos.huyendo = 1;
  ojos.alfaObj = 0;
  /* Se va hacia el lado contrario al dedo, metiéndose más en el
     bosque. */
  ojos.vx = (ojos.x < dedo.x ? -1 : 1) * U * azar(8, 18);
  ojos.dura = deGolpe ? 0.12 : 0.5;

  /* Y a veces —sólo a veces— alguien lo comenta. Si lo dijera todas
     las veces se convertiría en un aviso, y esto no avisa. */
  if (ojos.dichas < 2 && Math.random() < 0.45) {
    ojos.dichas++;
    const x = ojos.x, y = ojos.y;
    setTimeout(() => decir(clamp(x, A * 0.2, A * 0.8), y - U * 4,
      diceOjos(), { dur: 4.2 }), 500);
  }
  recuerdo.sumar("ojos");
  contarLogro("ojos");
}

function moverOjos(dt) {
  if (escena !== "bosque") { ojos.vivo = false; ojos.alfa = 0; return; }

  if (!ojos.vivo) {
    ojos.alfa = damp(ojos.alfa, 0, 4, dt);
    ojos.reloj -= dt;
    if (ojos.reloj <= 0) {
      ojos.reloj = azar(CONF.ojosRojos.cada[0], CONF.ojosRojos.cada[1]);
      asomarOjos();
    }
    return;
  }

  ojos.alfa = damp(ojos.alfa, ojos.alfaObj, ojos.huyendo ? 7 : 1.8, dt);
  ojos.x += ojos.vx * dt;
  ojos.vx *= Math.exp(-2.2 * dt);

  /* El parpadeo: lento y pesado, nada que ver con el del búho. */
  ojos.relojParpadeo -= dt;
  if (ojos.relojParpadeo <= 0) { ojos.relojParpadeo = azar(1, 3.4); ojos.parpadeo = 1; }
  ojos.parpadeo = Math.max(0, ojos.parpadeo - dt * 3);

  /* ---- Huir ----
     Si el dedo se acerca, se van. Y con algo de probabilidad se van
     antes de que llegue, como si te hubieran oído venir. */
  if (!ojos.huyendo && dedo.dentro) {
    const d = Math.hypot(dedo.x - ojos.x, dedo.y - ojos.y);
    if (d < U * CONF.ojosRojos.huyeA) {
      huirOjos(Math.random() < CONF.ojosRojos.probHuyeYa);
    }
  }

  ojos.dura -= dt;
  if (ojos.dura <= 0) {
    if (!ojos.huyendo) { ojos.huyendo = 1; ojos.alfaObj = 0; ojos.dura = 0.9; }
    else { ojos.vivo = false; ojos.reloj = azar(CONF.ojosRojos.cada[0], CONF.ojosRojos.cada[1]); }
  }
}

function dibujarOjos(d) {
  if (ojos.alfa < 0.01) return;
  const x = ojos.x + d.x, y = ojos.y + d.y;
  const ab = 1 - Math.sin(clamp01(ojos.parpadeo) * Math.PI) * 0.92;
  const a = ojos.alfa * ab;
  /* ---- La separación manda ----
     Con los halos pegados salía UNA mancha roja, que no da ninguna
     sensación. Con los ojos bien separados y el halo corto salen DOS
     puntos, y dos puntos en la oscuridad ya son una cara mirando. */
  const sep = ojos.r * 5.2;
  const halo = ojos.r * 2.8;

  ctx.globalCompositeOperation = "lighter";
  for (const s of [-1, 1]) {
    const ex = x + s * sep * 0.5;
    const g = ctx.createRadialGradient(ex, y, 0, ex, y, halo);
    g.addColorStop(0,    `rgba(255,90,70,${0.85 * a})`);
    g.addColorStop(0.3,  `rgba(220,30,25,${0.28 * a})`);
    g.addColorStop(1,    "rgba(150,12,10,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ex, y, halo, 0, 6.283); ctx.fill();
    /* El punto de dentro, casi blanco: es lo que hace que parezca luz
       reflejada y no una pegatina pintada. */
    ctx.fillStyle = `rgba(255,215,200,${0.9 * a})`;
    ctx.beginPath();
    ctx.ellipse(ex, y, ojos.r * 0.62, ojos.r * 0.62 * ab, 0, 0, 6.283);
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
}

// ==========================================
// SISTEMA DE INTERACCIÓN
// ==========================================
//
// Un solo sitio del que salen todos los gestos: `.ne-toque`, por encima
// del lienzo. Se usa Pointer Events, así que dedo, lápiz y ratón entran
// por la misma puerta y no hay que escribir nada dos veces.
//
// Al tocar se busca QUÉ hay debajo, de lo más cercano a lo más lejano.
// El orden importa: el bombón gana a la fogata, y la fogata gana al
// fondo, porque es lo que está delante.

const dedo = { x: -999, y: -999, dentro: false };
let arrastrePanel = null;

function local(e) {
  const r = raiz.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

/** ¿El punto (x,y) cae dentro del círculo? */
const dentroDe = (x, y, cx2, cy2, r) => Math.hypot(x - cx2, y - cy2) < r;

zona.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  despertarAudio();
  const p = local(e);
  dedo.x = p.x; dedo.y = p.y; dedo.dentro = true;
  try { zona.setPointerCapture(e.pointerId); } catch { /* no siempre se puede */ }

  if (bloqueado) return;

  if (escena === "habitacion") { tocarEnHabitacion(p, e); return; }
  tocarEnBosque(p, e);
});

zona.addEventListener("pointermove", (e) => {
  const p = local(e);
  dedo.x = p.x; dedo.y = p.y; dedo.dentro = true;

  /* El parallax sigue al dedo, o al ratón aunque no apriete. */
  par.ox = clamp((p.x / A - 0.5) * 2, -1, 1);
  par.oy = clamp((p.y / H - 0.5) * 2, -1, 1);

  /* El bombón, si lo lleva cogido. */
  if (bombon.agarrado && bombon.dedoId === e.pointerId) {
    /* Aquí sólo se apunta a DÓNDE está el dedo, sin recortar nada. El
       alcance lo pone la física del palo, que se queda tirante cuando
       te pasas en vez de que el dedo se despegue del palo. */
    bombon.destX = p.x;
    bombon.destY = clamp(p.y, U * 14, H - U * 4);
    if (e.cancelable) e.preventDefault();
  }

  /* El volumen de una piedra del panel. */
  if (arrastrePanel && arrastrePanel.id === e.pointerId) {
    const dx2 = p.x - arrastrePanel.x0;
    if (Math.abs(dx2) > 4) arrastrePanel.movido = true;
    const nv = clamp01(arrastrePanel.vol0 + dx2 / (U * 26));
    arrastrePanel.piedra.vol = nv;
    volumen(arrastrePanel.piedra.conf.id, nv);
    marcarPanelUsado();
    if (e.cancelable) e.preventDefault();
  }

  /* Y el resalte de la cabaña al pasar por encima. */
  if (escena === "bosque") {
    const c = sitio.cabana;
    if (Math.abs(p.x - c.x) < c.w * 0.8 && p.y > c.y - c.h * 1.6 && p.y < c.y + c.h * 0.2) {
      cabana.resalte = 1;
    }
  }
});

function soltarDedo(e) {
  if (bombon.agarrado && bombon.dedoId === e.pointerId) {
    bombon.agarrado = false;
    bombon.dedoId = null;
    /* Al soltarlo, el palo vuelve solo a su sitio, pero CONSERVANDO la
       velocidad que llevaba. Por eso si lo sueltas en pleno movimiento
       se pasa de largo y se balancea antes de pararse. */
    colocarBombon(false);
  }
  if (arrastrePanel && arrastrePanel.id === e.pointerId) {
    /* Si no ha arrastrado, es un toque: enciende o apaga. */
    if (!arrastrePanel.movido) alternarPiedra(arrastrePanel.piedra);
    arrastrePanel = null;
  }
  dedo.dentro = false;
  try { zona.releasePointerCapture(e.pointerId); } catch { /* ya estaba */ }
}
zona.addEventListener("pointerup", soltarDedo);
zona.addEventListener("pointercancel", soltarDedo);
zona.addEventListener("pointerleave", () => { dedo.dentro = false; });

/** Qué hay debajo del dedo en el bosque, de delante hacia atrás. */
function tocarEnBosque(p, e) {
  const f = sitio.fogata;

  /* 1. EL BOMBÓN. Lo primero de todo: está delante y es lo que más se
        usa. Si está fuera del fuego, un toque se lo come; si está
        dentro, se coge para sacarlo. */
  const dBom = desplazar(1.9);
  if (bombon.vivo && dentroDe(p.x, p.y, bombon.x + dBom.x, bombon.y + dBom.y, U * 6.5)) {
    const cerca = Math.hypot(bombon.x - f.x, bombon.y - (f.y - f.r)) < f.r * 2.6;
    if (!cerca && bombon.tueste > 0.04) { comerBombon(); return; }
    bombon.agarrado = true;
    bombon.dedoId = e.pointerId;
    bombon.destX = p.x; bombon.destY = p.y;
    /* Al soltarse de su sitio de reposo, el palo arranca quieto: si no,
       se lleva consigo la velocidad que traía de volver y da un
       latigazo nada más tocarlo. */
    bombon.angV *= 0.3; bombon.largoV *= 0.3;
    tono(520, 0.12, "sine", 0.04);
    if (e.cancelable) e.preventDefault();
    return;
  }

  /* 2. LAS PIEDRAS DEL PANEL. */
  for (const piedra of panel.piedras) {
    if (dentroDe(p.x, p.y, piedra.x, piedra.y, piedra.r * 1.35)) {
      arrastrePanel = { id: e.pointerId, piedra, x0: p.x, vol0: piedra.vol, movido: false };
      if (e.cancelable) e.preventDefault();
      return;
    }
  }

  /* 3. LA CAJITA MUSICAL. */
  if (dentroDe(p.x, p.y, sitio.cajita.x, sitio.cajita.y, sitio.cajita.r * 1.5)) {
    if (cajita.abierta) cerrarCajita(); else abrirCajita();
    contarLogro("cajita");
    return;
  }

  /* 4. LA LLAMA. El easter egg de quemarse. */
  if (dentroDe(p.x, p.y, f.x, f.y - f.r * 0.8, f.r * 1.5)) {
    quemarse(p.x, p.y);
    return;
  }

  /* 5. LA LUZ VERDE DEL BOSQUE.
        Antes que la cabaña a propósito: el área táctil de una casa es
        grande, y lo grande se traga lo pequeño si va primero. */
  if (dentroDe(p.x, p.y, sitio.secreto.x, sitio.secreto.y, U * 7)) {
    if (secreto.hallado) abrirCarta();
    else tocarSecreto(sitio.secreto.x, sitio.secreto.y);
    return;
  }

  /* 6. EL PAPELITO DEL ÁRBOL, si hay uno en el suelo. */
  if (nota.viva && !nota.leida && dentroDe(p.x, p.y, nota.x, nota.y, U * 6)) {
    if (leerNota()) return;
  }

  /* 7. EL BÚHO.
     ANTES QUE LA CABAÑA Y QUE LOS ÁRBOLES, y esto no es un detalle:
     está posado EN un árbol y a veces en uno que cae justo delante de
     la cabaña. Con el orden de antes, el árbol o la casa se llevaban el
     toque y el búho no se podía tocar NUNCA desde esos escondites: se
     asomaba, lo veías, le dabas y no pasaba nada.

     Lo pequeño gana a lo grande. Siempre, y sin excepciones.

     El radio es generoso —tres veces su tamaño— a propósito: es
     pequeño, está medio escondido y casi siempre se busca con el dedo a
     oscuras. Un búho que hay que acertar al píxel no se encuentra. */
  if (buho && buho.salida > 0.2 && !buho.vuelo) {
    const banda = CONF.bosque.bandas[buho.arbol ? buho.arbol.banda : 1];
    const dB = desplazar(mez(0.3, 3.4, banda.z));
    if (dentroDe(p.x, p.y, buho.x + dB.x, buho.y + dB.y, buho.r * 3)) {
      if (tocarBuho()) return;
    }
  }

  /* 8. LA CABAÑA. */
  const c = sitio.cabana;
  if (Math.abs(p.x - c.x) < c.w * 0.78 && p.y > c.y - c.h * 1.6 && p.y < c.y + c.h * 0.12) {
    entrarEnLaCabana();
    return;
  }

  /* 9. LOS ÁRBOLES. Se buscan de delante hacia atrás: el de cerca gana
        al de lejos, que es lo que está viendo el dedo. */
  for (let i = arboles.length - 1; i >= 0; i--) {
    const t = arboles[i];
    if (!t.toca) continue;
    const dx = p.x - (t.x + desplazar(mez(0.3, 3.4, t.z)).x);
    const cima = t.base - t.alto;
    if (Math.abs(dx) > t.ancho * 3.4) continue;
    if (p.y < cima - t.ancho * 2 || p.y > t.base + U * 2) continue;
    /* La fuerza depende de por dónde se toque: arriba se mueve mucho
       más que abajo, porque arriba hace palanca. */
    const altura = clamp01((t.base - p.y) / Math.max(1, t.alto));
    sacudirArbol(t, (dx < 0 ? -1 : 1) * (2.2 + altura * 4.4));
    mirarArbolCarta(t, p);
    contarLogro("arbol");
    return;
  }

  /* 10. LA LUNA. */
  const dL = desplazar(0.3);
  if (dentroDe(p.x, p.y, sitio.luna.x + dL.x, sitio.luna.y + dL.y, sitio.luna.r * 1.9)) {
    tocarLuna(sitio.luna.x + dL.x, sitio.luna.y + dL.y);
    return;
  }

  /* 11. LAS ESTRELLAS FUGACES, si pillas alguna al vuelo.
     El radio es grande —y ADELANTADO a donde va— porque se mueve a
     cuatrocientos píxeles por segundo: apuntando a donde está, para
     cuando el dedo llega ya no está ahí. */
  for (let i = 0; i < cielo.fugaces.length; i++) {
    const f = cielo.fugaces[i];
    const ax = f.x + f.vx * 0.08, ay = f.y + f.vy * 0.08;
    if (dentroDe(p.x, p.y, ax, ay, U * 11) || dentroDe(p.x, p.y, f.x, f.y, U * 11)) {
      cielo.fugaces.splice(i, 1);
      cazarFugaz(f, p);
      return;
    }
  }

  /* 12. LAS ESTRELLAS. Algunas responden. */
  const dE = desplazar(0.18);
  let mejor = null, dMin = U * 5;
  for (const s of cielo.estrellas) {
    const d = Math.hypot(p.x - (s.x + dE.x), p.y - (s.y + dE.y));
    if (d < dMin) { dMin = d; mejor = s; }
  }
  if (mejor) {
    mejor.pulso = 1;
    tono(azar(900, 1700), 0.7, "sine", 0.045);
    if (mejor.viva) {
      soltarBrillos(mejor.x + dE.x, mejor.y + dE.y, 14, 0.45);
      decir(mejor.x + dE.x, mejor.y + dE.y + U * 5,
        "Ésta contesta. No todas lo hacen.", { mimo: true, importante: true });
      contarLogro("estrella");
    }
    return;
  }

  /* 13. Y si no hay nada, se aviva un poco el fuego soplando. */
  if (p.y > sitio.horizonte) {
    fuego.vidaObj = Math.min(1.7, fuego.vidaObj + 0.22);
    fuego.quieta = 0;
  }
}

function tocarEnHabitacion(p, e) {
  const v = ventanaHab();

  /* La luna de la ventana. Primero, porque está DENTRO del cristal: si
     fuera después, el cristal se llevaría todos los toques y la luna no
     se podría tocar desde aquí. */
  if (sitio.luna.vx !== undefined &&
      dentroDe(p.x, p.y, sitio.luna.vx, sitio.luna.vy, sitio.luna.vr * 2.1)) {
    tocarLuna(sitio.luna.vx, sitio.luna.vy);
    return;
  }

  /* El cristal. Tres veces. */
  if (Math.abs(p.x - v.x) < v.w * 0.55 && Math.abs(p.y - v.y) < v.h * 0.55) {
    if (tocarVentanaHab(p.x, p.y)) return;
  }

  /* El cuadro de la pared. */
  const qx = v.x - v.w * 0.92, qy = v.y + U * 2;
  if (Math.abs(p.x - qx) < U * 6 && Math.abs(p.y - qy) < U * 7) {
    hab.cuadro = 1;
    tono(523, 0.8, "triangle", 0.05);
    decir(qx, qy - U * 8, "Somos nosotros. Lo colgué el primer día.", { mimo: true, importante: true });
    contarLogro("cuadro");
    return;
  }

  /* La lámpara de la mesilla. */
  const lx = v.x + v.w * 0.92, ly = H * 0.62;
  if (Math.abs(p.x - lx) < U * 8 && Math.abs(p.y - ly) < U * 10) {
    hab.lamparaOn = !hab.lamparaOn;
    golpe(0.02, 2600, 0.14, "bandpass");
    return;
  }

  /* La vela del alféizar: se apaga soplando... o tocándola. */
  const cvx = v.x - v.w * 0.36, cvy = v.y + v.h / 2 - U * 5;
  if (dentroDe(p.x, p.y, cvx, cvy, U * 6)) {
    decir(cvx, cvy - U * 6, "Déjala encendida, anda.", { dur: 3 });
    return;
  }
}

/* ---- EL SUSTO DE LA VENTANA --------------------------------------------

   Tocar el cristal tres veces. No pasa nada, no pasa nada… y a la
   tercera hay algo al otro lado.

   ── POR QUÉ TRES Y POR QUÉ NADA LAS DOS PRIMERAS ─────────────────────
   Porque el susto no está en el búho: está en haber tocado dos veces
   sin consecuencias. Las dos primeras contestan con una tontería —«no
   se ve nada», «está lloviendo»— y por eso la tercera pilla.

   ── Y POR QUÉ NO ES SÓLO UN DIBUJO QUE APARECE ───────────────────────
   Un dibujo que aparece se ve venir. Esto es una secuencia: primero se
   apaga la lámpara y la habitación se queda a oscuras, luego un golpe
   en el cristal, luego la cámara SE GIRA hacia la ventana —despacio,
   lo justo para que dé tiempo a pensar «no, no, no»— y entonces sí.

   Y se acuerda: la segunda vez que se hace, el búho ya no aparece
   igual. Un susto que se repite igual deja de ser un susto y pasa a
   ser una animación.                                                 */

const susto = {
  toques: 0,
  fase: -1,          // -1 quieto · si no, segundos desde que empezó
  buho: 0,           // cuánto se ve el búho de fuera, 0..1
  oscuro: 0,         // cuánto se ha apagado la habitación
  lamparaAntes: true,
};

function tocarVentanaHab(x, y) {
  if (susto.fase >= 0) return true;
  susto.toques++;

  if (susto.toques < CONF.ventana.toques) {
    /* Las dos primeras: un golpecito en el cristal y una tontería. */
    golpe(0.05, azar(1800, 2600), 0.1, "bandpass");
    golpe(0.03, azar(600, 900), 0.06, "bandpass");
    const antes = [
      "Ahí fuera no se ve nada.",
      "Sólo está el bosque. Y la noche.",
      "Nada. Un árbol, y ya.",
      "¿Qué miras? Si está todo oscuro.",
    ];
    decir(x, y + U * 8, antes[(susto.toques - 1) % antes.length], { dur: 3.2 });
    return true;
  }

  /* La tercera. */
  susto.toques = 0;
  susto.fase = 0;
  susto.lamparaAntes = hab.lamparaOn;
  hab.lamparaOn = false;
  bloqueado = true;
  recuerdo.sumar("susto");
  contarLogro("ventana");
  return true;
}

function moverSusto(dt) {
  if (susto.fase < 0) {
    susto.buho = damp(susto.buho, 0, 2.4, dt);
    susto.oscuro = damp(susto.oscuro, 0, 2, dt);
    return;
  }
  const t = susto.fase += dt;
  const v = ventanaHab();

  /* 0.0 – 0.9  todo se apaga y se queda quieto. */
  if (t < 0.9) {
    susto.oscuro = suave3(t / 0.9);
    agacharAmbientes(0.25, 0.8);
  }
  /* 0.9 – 1.1  un golpe en el cristal. */
  else if (t < 1.1) {
    if (!susto.golpeado) {
      susto.golpeado = true;
      golpe(0.06, 2200, 0.24, "bandpass");
      golpe(0.12, 320, 0.18, "lowpass");
      sacudir(0.25);
    }
  }
  /* 1.1 – 2.1  la cámara se vuelve hacia la ventana. Despacio, que es
     lo que da tiempo a pensar «no, no, no». La ventana está centrada,
     así que girar hacia ella no mueve nada de lado: lo que se hace es
     ACERCARSE y subir un poco, que es lo que haría alguien tumbado que
     se incorpora para mirar. */
  else if (t < 2.1) {
    const k = suave3((t - 1.1) / 1);
    cam.oz = mez(1, 1.3, k);
    cam.oy = (H * 0.5 - v.y) * k * 0.55;
  }
  /* 2.1 – 2.35  y está ahí. */
  else if (t < 2.35) {
    if (!susto.asustado) {
      susto.asustado = true;
      susto.buho = 1;
      sacudir(1.2);
      sonarMisterio(0.85);
      golpe(0.2, 140, 0.3, "lowpass");
      /* La segunda vez y las siguientes, el búho ya no es sorpresa: es
         un conocido que se ha pasado a saludar. */
      const veces = recuerdo.leer("susto", 1);
      const dice = veces <= 1
        ? CONF.ventana.dice[Math.floor(Math.random() * CONF.ventana.dice.length)]
        : (CONF.ventana.otraVez[Math.min(veces - 2, CONF.ventana.otraVez.length - 1)]);
      setTimeout(() => decir(v.x, v.y + v.h * 0.6, dice,
        { mimo: true, importante: true, dur: 5 }), 700);
    }
  }
  /* 2.35 – 4.2  se queda mirando y se va. */
  else if (t < 4.2) {
    susto.buho = 1 - suave3(clamp01((t - 3.2) / 1));
  }
  /* Y se recoge todo. */
  else {
    susto.fase = -1;
    susto.golpeado = false;
    susto.asustado = false;
    susto.buho = 0;
    hab.lamparaOn = susto.lamparaAntes;
    cam.ox = 0; cam.oy = 0; cam.oz = 1;
    bloqueado = false;
    agacharAmbientes(1, 1.4);
  }
}

/**
 * El búho al otro lado del cristal.
 *
 * Se dibuja DENTRO del recorte de la ventana, así que no hace falta
 * comprobar nada: lo que se sale del marco, no se ve. Y eso es lo que
 * hace que parezca que está fuera y no pegado encima.
 */
function dibujarSustoVentana(x, y, w, h) {
  if (susto.buho < 0.01) return;
  const k = clamp01(susto.buho);
  /* Se acerca al cristal según aparece: empieza al fondo y acaba
     pegado. Un búho que aparece ya pegado es un salto; uno que se
     acerca en dos décimas es un susto. */
  const r = w * mez(0.1, 0.3, k);
  const cy = y + h * mez(0.1, 0.02, k);

  ctx.save();
  ctx.globalAlpha = k;

  /* El cuerpo: una silueta negra, sin ningún detalle. Lo que asusta es
     no verle la cara. */
  ctx.fillStyle = "rgba(8,8,12,0.94)";
  ctx.beginPath();
  ctx.ellipse(x, cy, r, r * 1.2, 0, 0, 6.283);
  ctx.fill();
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.24, cy - r * 0.85);
    ctx.lineTo(x + s * r * 0.66, cy - r * 1.6);
    ctx.lineTo(x + s * r * 0.74, cy - r * 0.72);
    ctx.closePath();
    ctx.fill();
  }

  /* Y los ojos. Verdes, enormes, muy juntos al cristal. */
  ctx.globalCompositeOperation = "lighter";
  for (const s of [-1, 1]) {
    const ex = x + s * r * 0.38, ey = cy - r * 0.3;
    /* Apretados: con el halo ancho los dos se juntaban en una bola
       verde y el búho se quedaba sin silueta. Lo que asusta es la
       silueta negra CON dos puntos, no una mancha luminosa. */
    const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 0.46);
    g.addColorStop(0, `rgba(190,255,215,${0.95 * k})`);
    g.addColorStop(0.32, `rgba(60,225,145,${0.4 * k})`);
    g.addColorStop(1, "rgba(40,200,120,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ex, ey, r * 0.46, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(6,14,9,${0.92 * k})`;
    ctx.beginPath(); ctx.arc(ex, ey, r * 0.08, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = "lighter";
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.restore();
}

function soltarBrillos(x, y, n, tono2) {
  for (let i = 0; i < n; i++) {
    const a = azar(0, 6.283);
    soltar(x, y, {
      vx: Math.cos(a) * azar(14, 70), vy: Math.sin(a) * azar(14, 60),
      vida: azar(1.4, 2.8), tam: azar(1, 2.4),
      tipo: TIPO.BRILLO, tono: tono2,
    });
  }
}

const btnDormir = document.getElementById("dormir");

  else volverAlBosque();

function dormirse() {
  if (escena !== "habitacion" || bloqueado) return;
  escena = "durmiendo";
  raiz.classList.add("is-durmiendo");
  btnDormir.disabled = true;

  /* Los ambientes NO se callan: bajan. Dormirse con la fogata y los
     grillos de fondo es justo lo que se quiere sentir aquí. */
  agacharAmbientes(0.55, 3);
  if (cajita.gain) {
    const t = audio.ctx.currentTime;
    cajita.gain.gain.linearRampToValueAtTime(0.35, t + 3);
  }

  elSueno.textContent = diceDormir();
  animar((k) => { hab.dormida = k; }, 2800);
  tono(196, 3.2, "sine", 0.05);
}

function despertarse() {
  escena = "habitacion";
  raiz.classList.remove("is-durmiendo");
  btnDormir.disabled = false;
  agacharAmbientes(0.32, 1.6);
  animar((k) => { hab.dormida = 1 - k; }, 1400);
}

const entrada = document.getElementById("entrada");

function entrar() {

  setTimeout(() => {
