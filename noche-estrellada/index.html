  ctx.arc(0, 0, r * 0.3, 0, 6.283);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";

  /* El canto del agujero, para que se vea la masa por dentro. */
  ctx.strokeStyle = "rgba(220,170,110,0.55)";
  ctx.lineWidth = r * 0.05;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.32, 0, 6.283);
  ctx.stroke();

  /* Las chispitas de colores. Fijas: si parpadearan parecerían luces. */
  const colores = ["#ff8fb0", "#8fd4ff", "#ffe27a", "#b0f0a0", "#e2a6ff"];
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * 6.283 + 0.4;
    const rr = r * (0.42 + ((i * 7) % 5) * 0.09);
    ctx.save();
    ctx.translate(Math.cos(a) * rr, Math.sin(a) * rr);
    ctx.rotate(a + i);
    ctx.fillStyle = colores[i % colores.length];
    ctx.fillRect(-r * 0.09, -r * 0.028, r * 0.18, r * 0.056);
    ctx.restore();
  }

  /* Y un brillo en el chocolate, arriba a la izquierda. */
  ctx.fillStyle = "rgba(255,240,220,0.16)";
  ctx.beginPath();
  ctx.ellipse(-r * 0.36, -r * 0.42, r * 0.26, r * 0.13, -0.5, 0, 6.283);
  ctx.fill();

  ctx.restore();
  ctx.globalAlpha = 1;
}

function tocarLuna(x, y) {
  luna.pulso = 1;
  luna.tocadas++;
  magia(luna.tocadas % 3 === 0 ? 784 : 660);

  /* ---- Volver a ver lo del cielo ----
     Sólo después de haberlo visto salir solo. La primera vez no se
     puede provocar —lo que hace que valga algo es que no lo estuvieras
     esperando—, pero una vez que ha pasado, se puede enseñar. */
  recordarSiYaSeVio();
  if (escrito.vista && escrito.t < 0 && escena === "bosque") {
    arrancarMensajeCielo(true);
    decir(x, y + sitio.luna.r * 2, CONF.cieloMensaje.alVolver, { mimo: true, dur: 2.6 });
    return;
  }

  for (let i = 0; i < 22; i++) {
    const a = azar(0, 6.283);
    const rr = azar(0.4, 1.6);
    soltar(x + Math.cos(a) * sitio.luna.r * rr, y + Math.sin(a) * sitio.luna.r * rr, {
      vx: Math.cos(a) * azar(8, 34), vy: Math.sin(a) * azar(8, 34) + 10,
      vida: azar(1.8, 3.4), tam: azar(1, 2.6),
      tipo: TIPO.BRILLO, tono: 0.45,
    });
  }

  /* ---- A la décima, deja de ser la luna ----
     Va ANTES que el guiño porque manda sobre todo lo demás. Y si ya es
     una dona, tocarla no vuelve a lanzar la transformación: dice otra
     cosa y ya. */
  if (luna.dona > 0.5 || luna.fase >= 0) {
    if (luna.fase < 0) decir(x, y + sitio.luna.r * 2.4, diceDona(), { mimo: true, dur: 4 });
    return;
  }
  if (luna.tocadas >= CONF.dona.toques) {
    luna.tocadas = 0;
    empezarDona(false);
    contarLogro("dona");
    return;
  }

  /* A la quinta, guiña. Es un secreto pequeñito y no se anuncia. */
  if (luna.tocadas === 5) {
    luna.guino = 1;
    setTimeout(() => { luna.guino = 0; }, 1400);
    decir(x, y + sitio.luna.r * 2, "…¿te acaba de guiñar el ojo?", { mimo: true, importante: true });
    contarLogro("guino");
    return;
  }

  /* ---- Lo que dice, según lo que ya haya pasado ----
     La luna es lo único que está ahí arriba viéndolo todo, así que es
     lo único que puede comentarlo. Si ya has encontrado al búho, si se
     te apagó la fogata, si ya abriste la carta: lo sabe. Es el easter
     egg con memoria más barato de hacer y el que más se nota. */
  let frase = null;
  if (luna.tocadas >= 3 && Math.random() < 0.55) {
    const sabe = [];
    if (recuerdo.leer("buho", 0) > 0) sabe.push("Ese búho y yo llevamos toda la noche viéndote.");
    if (fuego.fase >= 5) sabe.push("Se te apagó la fogata. Desde acá arriba se nota.");
    if (recuerdo.leer("notaArbol", 0)) sabe.push("Lo del papelito del árbol lo vi. No digo nada.");
    if (recuerdo.leer("ojos", 0) > 0) sabe.push("Eso de los ojos rojos… yo tampoco sé qué sea.");
    if (secreto.hallado) sabe.push("Ya encontraste lo del bosque. Sabía que sí.");
    if (recuerdo.visitas > 1) sabe.push("Otra noche por acá. Me gusta que vuelvas :>");
    if (sabe.length) frase = sabe[Math.floor(Math.random() * sabe.length)];
  }
  decir(x, y + sitio.luna.r * 2, frase || diceLuna(), { mimo: true, importante: true });
  contarLogro("luna");
}

// ==========================================
// EASTER EGGS
// ==========================================
//
// Ninguno se explica. Están para encontrarlos jugando.
//
//   1. la luz verde del bosque → la carta
//   2. tocar la llama → te quemas
//   3. tocar estrellas → algunas responden
//   4. las estrellas fugaces, si pillas alguna → un deseo, y la quinta
//      ya no dice lo mismo que la primera
//   5. la luna a la quinta vez → guiña
//   6. dejar la fogata en paz mucho rato → se pone azul
//   7. tres bombones quemados seguidos
//   8. el cuadro de la habitación
//   9. el búho del bosque, que parpadea si te fijas
//  10. encontrarlo casi todo → un mensaje que no tiene otro sitio
//  11. la ventana de la habitación, tres veces
//  12. la luna diez veces → deja de ser la luna
//  13. lo que se recuerda de la última vez que estuviste aquí
//
// ── LA MEMORIA ───────────────────────────────────────────────────────
// Un secreto que se comporta igual siempre se gasta a la segunda. Así
// que la escena SE ACUERDA: cuántas veces has encontrado al búho,
// cuántas veces has tocado la luna, si ya abriste la carta, si ya te
// quemaste. Y lo que dice cambia según eso.
//
// Se guarda en `localStorage` con try/catch en todas partes: en una
// ventana privada o con las cookies bloqueadas, leer o escribir LANZA,
// y un secreto bonito no puede ser la razón de que la página se caiga.
// Si no hay dónde guardar, se recuerda sólo durante esta visita, que ya
// es bastante.

const recuerdo = (() => {
  const CLAVE = "noche-estrellada:recuerdos";
  let datos = {};
  try {
    const crudo = localStorage.getItem(CLAVE);
    if (crudo) datos = JSON.parse(crudo) || {};
  } catch { datos = {}; }
  if (typeof datos !== "object" || !datos) datos = {};

  const guardar = () => {
    try { localStorage.setItem(CLAVE, JSON.stringify(datos)); } catch { /* da igual */ }
  };

  return {
    leer: (k, porDefecto = 0) => (k in datos ? datos[k] : porDefecto),
    poner(k, v) { datos[k] = v; guardar(); return v; },
    sumar(k, n = 1) { return this.poner(k, (Number(datos[k]) || 0) + n); },
    /** ¿Es la primera vez de esta visita Y de todas las anteriores? */
    esNuevo: (k) => !datos[k],
    /** Cuántas visitas lleva. Se cuenta una sola vez por carga. */
    visitas: 0,
  };
})();
recuerdo.visitas = recuerdo.sumar("visitas");

/* ==========================================
   LA HISTORIA
   ==========================================

   Todo lo que pasa en el bosque pasa EN UN ORDEN. No es un montón de
   secretos sueltos: es una cosa que lleva a otra.

     claro → sendero → espesura → encontrar la X → descubrir que hace
     falta una pala → encontrar la pala → volver a la X → excavar →
     desenterrar el misterio → tocarlo → el búho → los ojos rojos →
     el enjambre → el ataque → despertar a las tres.

   ── POR QUÉ UNA LISTA Y NO UN MONTÓN DE BANDERAS SUELTAS ─────────────
   Porque con banderas sueltas, cada sitio del código que quiere saber
   «¿ya puede pasar esto?» acaba escribiendo su propia condición, y en
   cuanto hay doce, dos de ellas se contradicen. Aquí hay UN orden, y
   preguntar es mirar si el paso anterior ya está hecho.

   ── Y SE ACUERDA ────────────────────────────────────────────────────
   Los hitos se guardan. Si cierras y vuelves mañana, la pala sigue
   siendo tuya y la X sigue excavada. Lo que NO se guarda es dónde
   estabas: siempre se vuelve al claro, que es el sitio al que se
   vuelve. */

const PASOS = [
  "sendero",     // has visto que hay un camino
  "espesura",    // has llegado al bosque de dentro
  "equis",       // has encontrado la marca del suelo
  "faltaPala",   // y sabes que no puedes cavar con las manos
  "pala",        // la tienes
  "cavado",      // has cavado los cuatro golpes
  "misterio",    // ha salido de la tierra
  "revelado",    // lo has tocado
  "buho",        // el búho te ha hablado
  "ojos",        // has visto los ojos rojos
  "enjambre",    // el evento secreto
  "ataque",      // te ha atacado
  "despertar",   // has despertado a las tres
];

const historia = {
  hitos: new Set(),

  /** ¿Ya ha pasado esto? */
  hecho(id) { return this.hitos.has(id); },

  /**
   * Marca un hito. Devuelve `true` sólo la PRIMERA vez, hoy o cualquier
   * otro día. Con eso, quien lo llama puede poner la frase, el sonido y
   * el destello dentro del `if` y olvidarse de comprobar nada más.
   */
  marcar(id) {
    if (this.hitos.has(id)) return false;
    this.hitos.add(id);
    recuerdo.poner("h:" + id, 1);
    return true;
  },

  /** El último paso alcanzado, como número. Para lo que necesite orden. */
  get paso() {
    let n = -1;
    for (let i = 0; i < PASOS.length; i++) if (this.hitos.has(PASOS[i])) n = i;
    return n;
  },

  /** Empieza de cero. Sólo para probar: no lo llama nadie del juego. */
  olvidar() {
    for (const id of PASOS) { this.hitos.delete(id); recuerdo.poner("h:" + id, 0); }
  },
};
/* Los secretos no son pasos de la historia: no llevan orden y no
   desbloquean nada. Van en su propia lista para que no cuenten en
   `historia.paso`, pero se recuerdan igual de una visita a otra. */
const SECRETOS = [
  "bajoTapete", "constelacion", "relojBosque", "escopeta", "caceria",
  "flecha", "charco",
];

for (const id of PASOS.concat(SECRETOS)) {
  if (recuerdo.leer("h:" + id, 0)) historia.hitos.add(id);
}

/* ---- El inventario ------------------------------------------------------
   De momento sólo hay una cosa que se pueda llevar encima, pero el
   sistema es el mismo para una que para diez: una lista de lo que se
   tiene y cuál está en la mano.                                        */

const bolsa = {

  coger(id) {

    this.tiene.add(id);

  },

  alterna(id) { this.enMano = this.enMano === id ? null : (this.tiene.has(id) ? id : null); },
};

/* ---- LA CUENTA DE LO QUE SE HA ENCONTRADO -------------------------------

   Todo lo escondido llama a `contarLogro` con su nombre. Aquí sólo se
   lleva la cuenta, se recuerda de una visita a otra, y se dice algo
   cuando se llega a un tercio, a dos tercios y al final.

   ── POR QUÉ NO HAY UNA LISTA A LA VISTA ──────────────────────────────
   Porque una lista de logros convierte esto en una tarea: se mira lo
   que falta y se va a por ello. Sin lista, lo que queda es la sensación
   de que hay más cosas y no se sabe cuántas, que es lo que hace que se
   sigan tocando cosas.

   Y por eso la cuenta SÍ se guarda: encontrar algo por segunda vez, en
   otro día, no debería contar como encontrarlo. */

const TODO_LO_ESCONDIDO = [
  /* En el claro */
  "fuego", "azul", "bombon", "luna", "dona", "guino", "fugaz", "estrella",
  "cajita", "cajitaLluvia", "cajitaCuenta", "arbol", "arbolNota", "buho",
  "ojos", "secreto", "cabana",
  /* En el cuarto */
  "cuadro", "ventana", "radio", "frasco", "planta", "guitarra", "tapete",
  "estrellas", "libros", "vela", "taza", "nudo", "deseo",
  "botella", "papelBotella", "rayas", "manta",
  /* En el bosque */
  "relojBosque", "caceria", "setas", "luciernagas", "flecha", "charco",
  /* Y en el cielo */
  "cielo",
];

const logros = new Set();
for (const id of TODO_LO_ESCONDIDO) if (recuerdo.leer("lg:" + id, 0)) logros.add(id);

function contarLogro(id) {
  if (logros.has(id)) return;
  logros.add(id);
  recuerdo.poner("lg:" + id, 1);

  const n = logros.size, T = TODO_LO_ESCONDIDO.length;
  const frase = n === Math.ceil(T / 3) ? CONF.logros.tercio
              : n === Math.ceil(T * 2 / 3) ? CONF.logros.dosTercios
              : n >= T ? CONF.logros.todo
              : null;
  if (!frase) return;
  /* Con retraso: si sale a la vez que lo que se acaba de encontrar, se
     pisan las dos burbujas y no se lee ninguna. */
  setTimeout(() => {
    decir(A * 0.5, H * 0.42, frase, { mimo: true, importante: true, dur: 7 });
    magia(n >= T ? 659 : 523);
  }, 3200);
}

const secreto = {
  luz: 0,          // 0..1, lo que se ve
  hallado: false,
  fase: 0,
  zoom: 0,
};
const diceSecretoAntes = barajador(CONF.bosqueSecreto.antes);

function moverSecreto(dt) {
  secreto.fase += dt;
  if (!secreto.hallado) {
    /* Apenas se ve: late muy despacio y muy poco. Hay que fijarse, y
       ésa es toda la gracia. */
    secreto.luz = 0.16 + 0.14 * Math.sin(secreto.fase * 0.55);
    /* Y suelta alguna chispita verde de vez en cuando, que es lo que
       hace que el ojo acabe yendo ahí. */
    if (Math.random() < dt * 0.7) {
      soltar(sitio.secreto.x + azar(-U * 2, U * 2), sitio.secreto.y + azar(-U, U), {
        vx: azar(-6, 6), vy: azar(-16, -6),
        vida: azar(1.6, 3), tam: azar(0.8, 1.8),
        tipo: TIPO.BRILLO, tono: 0.5,
      });
    }
  } else {
    secreto.luz = damp(secreto.luz, 1, 1.2, dt);
    secreto.zoom = damp(secreto.zoom, 0, 0.8, dt);
  }
}

function dibujarSecreto() {
  const d = desplazar(0.7);
  const s = sitio.secreto;
  const x = s.x + d.x, y = s.y + d.y;
  const k = secreto.luz;

  ctx.globalCompositeOperation = "lighter";
  for (const [m, a] of [[1.2, 0.5], [3.4, 0.2], [8, 0.09]]) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, s.r * m * (0.5 + k));
    g.addColorStop(0, `rgba(120,255,190,${a * k})`);
    g.addColorStop(1, "rgba(120,255,190,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, s.r * m * (0.5 + k), 0, 6.283); ctx.fill();
  }
  ctx.fillStyle = `rgba(210,255,230,${0.6 + k * 0.4})`;
  ctx.beginPath();
  ctx.arc(x, y, U * (0.5 + k * 0.7), 0, 6.283);
  ctx.fill();
  ctx.globalCompositeOperation = "source-over";
}

async function tocarSecreto(x, y) {
  if (secreto.hallado || bloqueado) return;
  secreto.hallado = true;

  /* 1. Suena algo que no ha sonado antes. */

  /* 2. La cámara se acerca un poco. */
  cam.oz = 1.5;

  for (let i = 0; i < 40; i++) {

      soltar(x, y, {
        vx: Math.cos(a) * azar(20, 130), vy: Math.sin(a) * azar(20, 110),
        vida: azar(2, 4), tam: azar(1.2, 3),
        tipo: TIPO.BRILLO, tono: 0.5,

  /* 4. Y lo que dice antes de la carta. */
  await esperar(900);
  decir(x, y, diceSecretoAntes(), { mimo: true, importante: true, dur: 4.4 });

  cam.oz = 1; cam.ox = 0; cam.oy = 0;

  bloqueado = false;
}
