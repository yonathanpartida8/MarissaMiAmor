  else ctx.rect(r.x - r.w / 2, r.y - r.h / 2, r.w, r.h);
  ctx.fill();
  ctx.strokeStyle = "rgba(120,160,140,0.14)";
  ctx.lineWidth = 1;
  ctx.stroke();

  /* Los números. Dibujados con segmentos, como los de verdad: una
     fuente aquí se vería como texto puesto encima de un dibujo. */
  const dig = r.h * 0.52, sep = dig * 0.74;
  const x0 = r.x - sep * 1.55;
  ctx.globalCompositeOperation = "lighter";
  const col = `rgba(120,255,185,${0.75 * late})`;
  siete(x0, r.y, dig, 3, col);
  siete(x0 + sep * 1.5, r.y, dig, 0, col);
  siete(x0 + sep * 2.4, r.y, dig, 0, col);
  /* Los dos puntos, parpadeando. Lo único que se mueve. */
  const dp = 0.35 + 0.65 * Math.pow(clamp01(0.5 + 0.5 * Math.sin(reloj * 3.1)), 3);
  ctx.fillStyle = `rgba(120,255,185,${0.7 * late * dp})`;
  for (const dy of [-dig * 0.22, dig * 0.22]) {
    ctx.beginPath();
    ctx.arc(x0 + sep * 0.85, r.y + dy, dig * 0.07, 0, 6.283);
    ctx.fill();
  }
  /* Y el AM, chiquitito. */
  ctx.fillStyle = `rgba(120,255,185,${0.45 * late})`;
  ctx.font = `${Math.round(dig * 0.34)}px ui-sans-serif, system-ui, sans-serif`;
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText("AM", x0 + sep * 3.1, r.y + dig * 0.2);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.globalCompositeOperation = "source-over";
}

/** Un dígito de siete segmentos. */
const SEGMENTOS = {
  0: [1, 1, 1, 1, 1, 1, 0],
  3: [1, 1, 1, 1, 0, 0, 1],
};
function siete(x, y, alto, n, col) {
  const s = SEGMENTOS[n] || SEGMENTOS[0];
  /* El trazo, fino. Con un décimo del alto, los seis segmentos de un
     cero se tocaban entre sí y lo que se leía era un rectángulo
     relleno. Un siete segmentos necesita ver el hueco de dentro. */
  const w = alto * 0.58, gr = Math.max(1.2, alto * 0.062);
  ctx.strokeStyle = col;
  ctx.lineWidth = gr;
  ctx.lineCap = "round";
  /* Los extremos se recogen un poco: con los segmentos tocándose
     punta con punta, las esquinas se emborronan y el dígito pierde la
     forma. Un reloj de verdad también los deja separados. */
  const m = gr * 0.7;
  const t = y - alto / 2, b = y + alto / 2, l = x - w / 2, rr = x + w / 2;
  const trazos = [
    [l + m, t, rr - m, t],        // arriba
    [rr, t + m, rr, y - m],       // arriba derecha
    [rr, y + m, rr, b - m],       // abajo derecha
    [l + m, b, rr - m, b],        // abajo
    [l, y + m, l, b - m],         // abajo izquierda
    [l, t + m, l, y - m],         // arriba izquierda
    [l + m, y, rr - m, y],        // medio
  ];
  for (let i = 0; i < 7; i++) {
    if (!s[i]) continue;
    ctx.beginPath();
    ctx.moveTo(trazos[i][0], trazos[i][1]);
    ctx.lineTo(trazos[i][2], trazos[i][3]);
    ctx.stroke();
  }
}

function tocarReloj3(p) {
  if (!reloj3.encendido) return false;
  const r = sitioReloj3();
  if (Math.abs(p.x - r.x) > r.w * 0.9 || Math.abs(p.y - r.y) > r.h * 1.1) return false;
  reloj3.pulso = 1;
  reloj3.llama = 0;
  reloj3.tocado++;
  tono(azar(880, 1100), 0.3, "sine", 0.04);
  magia(392);
  for (let i = 0; i < 12; i++) {
    soltar(r.x + azar(-r.w * 0.4, r.w * 0.4), r.y, {
      vx: azar(-18, 18), vy: azar(-30, -8),
      vida: azar(1.4, 2.8), tam: azar(1, 2.2),
      tipo: TIPO.BRILLO, tono: 0.45,
    });
  }
  const dice = CONF.tres.alTocar;
  decir(r.x, r.y - U * 8, dice[Math.min(reloj3.tocado - 1, dice.length - 1)],
    { misterio: true, importante: true, dur: 5 });
  return true;
}

/* ---- TOCAR EN LA ESPESURA -----------------------------------------------
   El mismo orden de siempre: lo pequeño gana a lo grande, y lo que hay
   delante gana a lo que hay detrás.                                   */

function tocarEnEspesura(p, e) {
  void e;
  /* 0. Si hay cacería, el dedo es el gatillo y no hay más que hablar.
     Tocar un árbol en mitad de un ataque para que suelte hojas no es
     una opción que nadie quiera tener. (Por el camino normal esto no
     llega: se dispara al APRETAR, no al soltar. Está aquí para lo que
     entre por otro lado.) */
  if (enCombate()) { dispararEscopeta(p); return; }

  /* 1. Los puntos, del más pequeño al más grande. */
  const cand = puntos.lista
    .filter((q) => q.hay())
    .map((q) => ({ q, s: puntoEnPantalla(q) }))
    .filter(({ q, s }) => Math.hypot(p.x - s.x, (p.y - s.y) * 0.8) < q.r * 1.7)
    .sort((a, b) => a.q.r - b.q.r);
  if (cand.length) { tocarPunto(cand[0].q, cand[0].s); return; }

  /* 2. El búho. */
  if (tocarBuhoEspesura(p)) return;

  /* 3. Los ojos rojos. */
  if (tocarOjosEspesura(p)) return;

  /* 4. Las luciérnagas, que son lo más chico que vuela. */
  if (tocarLuciernaga(p)) return;

  /* 5. Lo que hay en el suelo: setas, piedras, helechos, hierba… y los
        charcos cuando llueve. Todo contesta: eso es lo que separa un
        bosque explorable de un telón con cuatro cosas tocables. */
  if (tocarElSuelo(p)) return;

  /* 6. Los árboles: se sacuden, sueltan hojas y suenan. */
  for (let b = ESP.bandas.length - 1; b >= 0; b--) {
    const conf = ESP.bandas[b];
    if (!conf.toca) continue;
    for (const t of espesura.arboles) {
      if (t.banda !== b) continue;
      const x = enPantalla(t.x, conf.z);
      const cima = t.base - t.alto;
      if (Math.abs(p.x - x) > t.ancho * 3) continue;
      if (p.y < cima - t.ancho * 2 || p.y > t.base + U * 3) continue;
      const altura = clamp01((t.base - p.y) / Math.max(1, t.alto));
      sacudirArbolEsp(t, (p.x < x ? -1 : 1) * (2 + altura * 4.2), x);
      return;
    }
  }

  /* 5. Y si no hay nada, un puñado de hojas que caen de arriba. */
  for (let i = 0; i < 3; i++) {
    soltar(p.x + azar(-U * 4, U * 4), p.y - azar(U * 4, U * 14), {
      vx: azar(-10, 10) + clima.viento * 16, vy: azar(4, 16),
      vida: azar(2, 4), tam: U * azar(0.4, 0.9),
      tipo: TIPO.HOJA, giro: azar(0, 6.283), giroV: azar(-2, 2),
      tono: Math.random(),
    });
  }
}

/**
 * TOCAR EL SUELO DEL BOSQUE.
 *
 * ── POR QUÉ CONTESTA TODO Y NO SÓLO LO IMPORTANTE ────────────────────
 * Porque la diferencia entre un escenario y un sitio no está en cuántas
 * cosas guardan un secreto: está en si lo que tocas se entera. Un
 * helecho que se abre, una piedra que se ladea, una seta que suelta
 * esporas, un charco que hace ondas. Ninguno de los cuatro da nada, y
 * son los cuatro los que hacen que valga la pena tocar el quinto.
 *
 * Y dentro de ese montón de cosas que no dan nada hay dos que sí: la
 * piedra con la flecha —la única pista de que al fondo hay algo— y las
 * setas, que llevan la cuenta.
 */
function tocarElSuelo(p) {
  /* Los charcos primero: son anchos y planos, y están debajo de todo. */
  for (const c of espesura.charcos || []) {
    if (clima.lluvia < 0.06) break;
    const x = enPantalla(c.x, 1);
    const rx = c.rx * clamp01((clima.lluvia - 0.04) / 0.5);
    if (Math.abs(p.x - x) > rx * 1.2 || Math.abs(p.y - c.y) > rx * 0.55) continue;
    c.onda = 1;
    golpe(0.06, azar(600, 1100), 0.07, "bandpass");
    for (let i = 0; i < 6; i++) {
      soltar(x + azar(-rx, rx), c.y, {
        vx: azar(-30, 30), vy: azar(-60, -18),
        vida: azar(0.4, 0.9), tam: azar(0.8, 1.6),
        tipo: TIPO.BRILLO, tono: 0.7,
      });
    }
    if (c.raro && !historia.hecho("charco")) {
      historia.marcar("charco");
      sonarMisterio(0.35);
      decir(x, c.y - U * 8, CONF.espesura.charcoRaro,
        { misterio: true, importante: true, dur: 5.5 });
      contarLogro("charco");
    }
    return true;
  }

  /* Y luego lo que crece. Del más pequeño al más grande, como siempre. */
  let mejor = null, mejorD = Infinity;
  for (const z of espesura.suelo) {
    const x = enPantalla(z.x, 1);
    const alcance = z.s * (z.tipo === "hierba" ? 1.4 : 1.9) + U * 1.5;
    const d = Math.hypot(p.x - x, (p.y - (z.y - z.s * 0.7)) * 0.9);
    if (d > alcance) continue;
    if (z.s < mejorD) { mejorD = z.s; mejor = z; }
  }
  if (!mejor) return false;

  const z = mejor;
  const x = enPantalla(z.x, 1);
  z.pulso = 1;
  z.veces++;

  if (z.tipo === "seta") {
    /* Esporas: motas verdes que suben despacio y se quedan un rato. */
    tono(azar(700, 1100), 0.5, "sine", 0.03);
    for (let i = 0; i < 9; i++) {
      soltar(x + azar(-z.s, z.s), z.y - z.s * 0.8, {
        vx: azar(-10, 10), vy: azar(-22, -6),
        vida: azar(1.6, 3.4), tam: azar(0.8, 1.8),
        tipo: TIPO.BRILLO, tono: 0.45,
      });
    }
    const n = recuerdo.sumar("setas");
    if (n === CONF.espesura.setasCuenta) {
      magia(587);
      decir(x, z.y - U * 8, CONF.espesura.setasTodas,
        { mimo: true, importante: true, dur: 6 });
      contarLogro("setas");
    }
    return true;
  }

  if (z.tipo === "piedra") {
    golpe(0.07, azar(200, 340), 0.09, "lowpass");
    if (z.marcada) {
      /* La flecha. Se dice una vez y ya: repetirla la convertiría en un
         cartel, y una pista que insiste deja de ser una pista. */
      if (historia.marcar("flecha")) {
        sonarMisterio(0.3);
        decir(x, z.y - U * 7, CONF.espesura.piedraFlecha,
          { misterio: true, importante: true, dur: 6 });
        contarLogro("flecha");
      } else {
        decir(x, z.y - U * 6, CONF.espesura.piedraFlechaOtra, { dur: 3.4 });
      }
    }
    return true;
  }

  /* Helechos y hierba: un roce y unas hojas. */
  golpe(0.06, azar(2600, 4200), 0.02, "highpass");
  for (let i = 0; i < 3; i++) {
    soltar(x + azar(-z.s, z.s), z.y - z.s * azar(0.2, 1.2), {
      vx: azar(-24, 24), vy: azar(-22, -4),
      vida: azar(1, 2.2), tam: U * azar(0.3, 0.6),
      tipo: TIPO.HOJA, giro: azar(0, 6.283), giroV: azar(-3, 3),
      tono: Math.random(),
    });
  }
  return true;
}

/**
 * TOCAR UNA LUCIÉRNAGA.
 *
 * Se escapan. No se pueden coger, y ésa es la gracia: lo que hacen es
 * apagarse y volver a encenderse un poco más allá. Llevan la cuenta
 * entre visitas, y a la duodécima pasa algo.
 */
function tocarLuciernaga(p) {
  for (const l of espesura.luces) {
    const x = enPantalla(l.x + Math.sin(reloj * l.vel + l.f) * l.radio, l.z);
    if (Math.hypot(p.x - x, p.y - l.y) > U * 4) continue;
    /* Se va de un salto. */
    l.x += azar(-U * 14, U * 14);
    l.y += azar(-U * 8, U * 8);
    l.f = azar(0, 6.283);
    tono(azar(1400, 2000), 0.28, "sine", 0.025);
    soltarBrillos(x, l.y, 4, 0.45);
    const n = recuerdo.sumar("luciernagas");
    if (n === CONF.espesura.lucesCuenta) {
      magia(659);
      decir(x, l.y - U * 6, CONF.espesura.lucesTodas,
        { mimo: true, importante: true, dur: 6 });
      contarLogro("luciernagas");
    }
    return true;
  }
  return false;
}

function sacudirArbolEsp(t, fuerza, x) {
  t.sacV += fuerza * azar(0.8, 1.2) * (t.banda === 3 ? 0.5 : 1);
  t.toques++;
  const n = Math.round(azar(4, 10));
  for (let i = 0; i < n; i++) {
    soltar(x + azar(-t.ancho * 2, t.ancho * 2), t.base - t.alto * azar(0.5, 1), {
      vx: azar(-22, 22) + clima.viento * 20, vy: azar(-10, 16),
      vida: azar(2.4, 5), tam: U * azar(0.45, 1),
      tipo: TIPO.HOJA, giro: azar(0, 6.283), giroV: azar(-2.4, 2.4),
      tono: Math.random(),
    });
  }
  /* Hojas: ruido agudo con envolvente de seno. Un árbol no suena «toc». */
  if (despertarAudio()) {
    const c = audio.ctx, t0 = c.currentTime;
    const nn = Math.floor(c.sampleRate * 0.45);
    const buf = c.createBuffer(1, nn, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < nn; i++) {
      const kk = i / nn;
      d[i] = (Math.random() * 2 - 1) * Math.sin(kk * Math.PI) * (0.3 + 0.7 * Math.random());
    }
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "highpass"; f.frequency.value = azar(2200, 3400);
    const g = c.createGain(); g.gain.value = 0.09 * Math.min(1, Math.abs(fuerza) * 0.3);
    src.connect(f).connect(g).connect(audio.maestro);
    src.start(t0);
  }
  sacudir(Math.min(0.25, Math.abs(fuerza) * 0.05));
}

/** Qué pasa al tocar cada sitio. */
function tocarPunto(q, s) {
  if (q.id === "salida") { volverAlClaro(); return; }

  if (q.id === "equis") {
    /* Primero, apartar las hojas. */
    if (q.hojas > 0.02) {
      q.hojas = 0;
      historia.marcar("equis");
      golpe(0.14, 3200, 0.1, "highpass");
      for (let i = 0; i < 12; i++) {
        soltar(s.x + azar(-q.r, q.r), s.y + azar(-q.r * 0.4, q.r * 0.4), {
          vx: azar(-40, 40), vy: azar(-30, -6),
          vida: azar(1.4, 3), tam: U * azar(0.4, 0.9),
          tipo: TIPO.HOJA, giro: azar(0, 6.283), giroV: azar(-3, 3),
          tono: Math.random(),
        });
      }
      decir(s.x, s.y - U * 7, CONF.espesura.equisDestapada, { mimo: true, importante: true });
      return;
    }
    /* Ya está cavada del todo. */
    if (q.golpes >= CONF.cavar.golpes) {
      decir(s.x, s.y - U * 7, "Acá ya no queda nada por cavar.", { dur: 3 });
      return;
    }
    /* Y si no hay pala, no hay nada que hacer. Ésta es LA frase que
       manda al jugador a recorrerse el bosque. */
    if (bolsa.enMano !== "pala") {
      if (!bolsa.lleva("pala")) {
        historia.marcar("faltaPala");
        decir(s.x, s.y - U * 7, CONF.espesura.sinPala, { mimo: true, importante: true });
      } else {
        decir(s.x, s.y - U * 7, "Ya la traigo en la mano.", { dur: 3 });
      }
      return;
    }
    cavar(q, s);
    return;
  }

  if (q.id === "pala") { cogerPala(q, s); return; }

  if (q.id === "reliquia") { tocarReliquia(q, s); return; }

  if (q.id === "reloj") { tocarRelojBosque(q, s); return; }

  if (q.id === "escopeta") { cogerEscopeta(q, s); return; }
}

/* ---- El reloj de pie ---------------------------------------------------- */

function tocarRelojBosque(q, s) {
  q.toques++;
  q.fogonazo = 1;
  q.salto = 1;
  /* Una campanada sola, grave y larga. No tres: una. Un reloj que da
     las tres estaría funcionando, y éste no funciona. */
  tono(174.6, 2.8, "sine", 0.05);
  tono(349.2, 1.8, "sine", 0.025);
  soltarBrillos(s.x, s.y - U * 16, 10, 0.4);

  if (historia.marcar("relojBosque")) {
    sonarMisterio(0.5);
    decir(s.x, s.y - U * 22, CONF.relojBosque.frase,
      { misterio: true, importante: true, dur: 7 });
    contarLogro("relojBosque");
    return;
  }
  decir(s.x, s.y - U * 20, diceReloj(), { misterio: true, dur: 4 });
}

/* ---- La escopeta -------------------------------------------------------- */

function cogerEscopeta(q, s) {
  if (q.cogida > 0) return;
  q.cogida = 0.001;
  bolsa.coger("escopeta");
  bolsa.equipar("escopeta");
  historia.marcar("escopeta");

  /* Metal pesado levantado del suelo, y el chasquido del cerrojo. */
  golpe(0.08, 220, 0.2, "lowpass");
  setTimeout(() => golpe(0.04, 1800, 0.14, "bandpass"), 180);
  soltarBrillos(s.x, s.y - U * 2, 10, 0.55);
  avisoObjeto("escopeta", "¡UNA ESCOPETA!");
  decir(s.x, s.y - U * 9, CONF.caza.alCogerla,
    { mimo: true, importante: true, dur: 3.4 });

  /* Y entonces empieza lo otro. No de inmediato: hay un momento de
     «qué hago yo con esto» antes de que el bosque conteste. */
  setTimeout(() => arrancarCaceria(), 2200);
}

/* ---- La pala ------------------------------------------------------------ */

function cogerPala(q, s) {
  if (q.cogida > 0) return;
  q.cogida = 0.001;
  bolsa.coger("pala");
  bolsa.equipar("pala");
  historia.marcar("pala");

  /* Un golpe de madera y metal a la vez: las dos cosas de las que está
     hecha, y las dos se oyen al levantarla del suelo. */
  golpe(0.1, 380, 0.16, "lowpass");
  golpe(0.05, 2400, 0.1, "bandpass");
  magia(523);
  soltarBrillos(s.x, s.y - U * 3, 14, 0.5);
  avisoObjeto("pala", "¡CONSEGUISTE UNA PALA!");
  setTimeout(() => decir(A * 0.5, H * 0.52, CONF.espesura.palaCogida,
    { mimo: true, importante: true, dur: 4.5 }), 700);
}

/* ---- Cavar --------------------------------------------------------------
   Cuatro golpes, y cada uno distinto del anterior: primero tierra,
   luego una grieta, luego algo que suena debajo, y al final lo que
   había. Si los cuatro fueran iguales, el cuarto sobraría.            */

function cavar(q, s) {
  q.golpes++;
  recuerdo.poner("golpes", q.golpes);
  q.temblor = 1;
  const n = q.golpes;
  const ultimo = n >= CONF.cavar.golpes;

  /* La cámara se acerca un poco más con cada palada. Es lo que hace que
     la cosa vaya a alguna parte. */
  cam.oz = 1 + n * 0.05;
  cam.oy = (H * 0.46 - s.y) * n * 0.1;

  sonarPalada(n, ultimo);
  sacudir(0.25 + n * 0.08);

  /* Tierra que salta. Más cuanto más hondo, y hacia el lado contrario
     al que se supone que está la pala. */
  const nT = 14 + n * 6;
  for (let i = 0; i < nT; i++) {
    soltar(s.x + azar(-q.r * 0.6, q.r * 0.6), s.y - azar(0, q.r * 0.3), {
      vx: azar(-70, 70), vy: azar(-140, -35),
      vida: azar(0.5, 1.4), tam: U * azar(0.2, 0.6),
      tipo: TIPO.CENIZA,
    });
  }
  /* Y a partir del segundo golpe, piedrecitas que saltan más lejos. */
  if (n >= 2) {
    for (let i = 0; i < 3 + n; i++) {
      soltar(s.x + azar(-q.r * 0.4, q.r * 0.4), s.y, {
        vx: azar(-120, 120), vy: azar(-190, -80),
        vida: azar(0.6, 1.3), tam: U * azar(0.3, 0.7),
        tipo: TIPO.POLVO, tono: 0.2,
      });
    }
  }
  /* En el tercero se escapa algo de luz por la grieta. */
  if (n === 3) {
    setTimeout(() => {
      soltarBrillos(s.x, s.y, 8, 0.45);
      espesura.onda = 0.5;
      espesura.ondaX = q.x;
    }, 420);
  }

  const frase = CONF.cavar.dice[Math.min(n - 1, CONF.cavar.dice.length - 1)];
  setTimeout(() => decir(s.x, s.y - U * 8, frase,
    { mimo: !ultimo, misterio: ultimo, importante: true, dur: ultimo ? 5 : 3.6 }), 520);

  if (ultimo) {
    historia.marcar("cavado");
    setTimeout(() => salirElMisterio(q), 1400);
  } else {
    /* La cámara vuelve sola al cabo de un momento. */
    setTimeout(() => { cam.oz = 1; cam.oy = 0; }, 1600);
  }
}

/** El sonido de la pala: metal entrando en tierra. */
function sonarPalada(n, ultimo) {
  if (!despertarAudio()) return;
  const c = audio.ctx, t = c.currentTime;

  /* El metal cortando: ruido agudo, cortísimo. */
  golpe(0.05, azar(2600, 4200), 0.14, "highpass");
  /* Y la tierra: ruido grave con una envolvente que cae deprisa. Lo que
     distingue «pala en tierra» de «pala en piedra» es lo rápido que se
     apaga el grave. */
  const dur = 0.24;
  const nn = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, nn, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < nn; i++) {
    const k = i / nn;
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - k, 2.2);
  }
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.setValueAtTime(900 - n * 120, t);
  f.frequency.exponentialRampToValueAtTime(220, t + dur);
  const g = c.createGain(); g.gain.value = 0.2 + n * 0.02;
  src.connect(f).connect(g).connect(audio.maestro);
  src.start(t);

  /* En el tercer golpe, algo suena DEBAJO. Un tono grave que no
     pertenece a ninguna pala. */
  if (n === 3) {
    setTimeout(() => {
      tono(azar(48, 62), 1.6, "sine", 0.09);
      tono(azar(96, 118), 1.2, "sine", 0.04, 0.1);
    }, 380);
  }
  if (ultimo) {
    /* Y en el último, el golpe contra algo duro. */
    setTimeout(() => {
      golpe(0.12, 1400, 0.22, "bandpass");
      tono(azar(180, 240), 0.9, "triangle", 0.06, 0.02);
    }, 180);
  }
}

/* ---- Lo que sale de la tierra ------------------------------------------- */

function salirElMisterio(q) {
  historia.marcar("misterio");
  espesura.verdeObj = 0.35;
  espesura.onda = 1;
  espesura.ondaX = q.x;

  /* El bosque se calla: los ambientes bajan y se quedan bajos. Que se
     haga el silencio es la mitad del momento. */
  agacharAmbientes(0.2, 2.5);
  magia(392);
  setTimeout(() => tono(196, 3, "sine", 0.07), 300);

  const s = puntoEnPantalla(q);
  cam.oz = 1.28;
  cam.oy = (H * 0.46 - s.y) * 0.5;

  const r = puntos.lista.find((x) => x.id === "reliquia");
  if (r) { r.salida = 0; r.pulso = 1; }

  setTimeout(() => decir(A * 0.5, H * 0.42, CONF.misterio.alSalir,
    { misterio: true, importante: true, dur: 6 }), 900);
}

function tocarReliquia(q, s) {
  q.pulso = 1;
  espesura.onda = 1;
  espesura.ondaX = q.x;
  sacudir(0.5);

  /* Las partículas se expanden desde ella. */
  for (let i = 0; i < 46; i++) {
    const a = azar(0, 6.283), v = azar(30, 170);
    soltar(s.x, s.y - U * 2, {
      vx: Math.cos(a) * v, vy: Math.sin(a) * v * 0.6 - 20,
      vida: azar(1.4, 3.6), tam: azar(1, 2.8),
      tipo: TIPO.BRILLO, tono: 0.45,
    });
  }

  if (historia.marcar("revelado")) {
    /* La primera vez: el bosque entero se entera. */
    /* Tiñe, no repinta. Con el verde a tope el bosque entero se ponía
       esmeralda y dejaba de ser un bosque de noche: la gracia es que
       algo verde se ha metido en un sitio azul, no que el sitio se haya
       vuelto verde. */
    espesura.verdeObj = 0.62;
    agacharAmbientes(0.12, 1.5);
    setTimeout(() => agacharAmbientes(0.5, 4), 7000);
    magia(587);
    setTimeout(() => sonarMisterio(0.7), 500);

    const frase = CONF.misterio.alTocar[Math.floor(Math.random() * CONF.misterio.alTocar.length)];
    setTimeout(() => decir(A * 0.5, H * 0.36, frase,
      { misterio: true, importante: true, dur: 7 }), 800);

    /* Y a partir de aquí, el bosque tiene ojos. */
    setTimeout(() => despertarLosOjos(), 2600);
    setTimeout(() => reaccionaElBuho(), 4200);
  } else {
    espesura.verdeObj = Math.min(1, espesura.verdeObj + 0.1);
    decir(s.x, s.y - U * 8,
      CONF.misterio.despues[Math.floor(Math.random() * CONF.misterio.despues.length)],
      { misterio: true, dur: 4.5 });
  }
}

// ==========================================
// SISTEMA DE INTERACCIÓN
// ==========================================
//
// Un solo sitio del que salen todos los gestos: `.ne-toque`, por encima
// del lienzo. Se usa Pointer Events, así que dedo, lápiz y ratón entran
// por la misma puerta y no hay que escribir nada dos veces.
//
// Al tocar se busca QUÉ hay debajo, de lo más cercano a lo más lejano.
// El orden importa: el bombón gana a la fogata, y la fogata gana al
// fondo, porque es lo que está delante.

const dedo = { x: -999, y: -999, dentro: false };
let arrastrePanel = null;

function local(e) {
  const r = raiz.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

/** ¿El punto (x,y) cae dentro del círculo? */
const dentroDe = (x, y, cx2, cy2, r) => Math.hypot(x - cx2, y - cy2) < r;

zona.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  despertarAudio();
  const p = local(e);
  dedo.x = p.x; dedo.y = p.y; dedo.dentro = true;
  try { zona.setPointerCapture(e.pointerId); } catch { /* no siempre se puede */ }

  if (bloqueado) return;

  /* En la espesura, un dedo apoyado puede acabar siendo un paseo o un
     toque. No se decide aquí: se apunta el sitio y se decide al
     soltar, según cuánto haya corrido. Decidirlo al bajar obligaría a
     elegir entre «no se puede andar» y «no se puede tocar». */
  if (escena === "espesura") {
    /* Con la cacería en marcha, el dedo es el gatillo y dispara YA, al
       APRETAR. No se espera a soltar como con los toques normales:
       medio segundo entre apretar y que salga el tiro convierte el
       apuntar en adivinar.

       Y aun así se sigue pudiendo andar, porque el mismo dedo puede
       seguir arrastrando después de haber disparado. Apretar dispara;
       apretar y arrastrar dispara y además te mueve, que es justo lo
       que hace falta para meterse detrás de la roca. */
    if (enCombate()) dispararEscopeta(p);
    espesura.agarre = {
      id: e.pointerId, x: p.x, y: p.y, x0: p.x, t: reloj, corrido: 0,
      /* Ya se disparó al apretar: al soltar no hay que volver a hacerlo. */
      yaDisparo: enCombate(),
    };
    espesura.vx = 0;
    return;
  }

  if (escena === "habitacion") { tocarEnHabitacion(p, e); return; }
  if (escena === "espesura") { tocarEnEspesura(p, e); return; }
  tocarEnBosque(p, e);
});

zona.addEventListener("pointermove", (e) => {
  const p = local(e);
  dedo.x = p.x; dedo.y = p.y; dedo.dentro = true;

  /* El parallax sigue al dedo, o al ratón aunque no apriete. */
  par.ox = clamp((p.x / A - 0.5) * 2, -1, 1);
  par.oy = clamp((p.y / H - 0.5) * 2, -1, 1);

  /* ---- Andar por la espesura ----
     El mundo se mueve al revés que el dedo, que es lo que hace que se
     sienta que lo que se mueve eres tú. Y se guarda la velocidad para
     que al soltar siga un poco. */
  const ag = espesura.agarre;
  if (ag && ag.id === e.pointerId) {
    const dx = p.x - ag.x;
    ag.corrido += Math.abs(dx);
    espesura.x = clamp(espesura.x - dx, 0, espesura.tope);
    const dt2 = Math.max(0.008, reloj - ag.t);
    espesura.vx = clamp(-dx / dt2, -A * 2.2, A * 2.2);
    ag.x = p.x; ag.t = reloj;
    if (e.cancelable) e.preventDefault();
    return;
  }

  /* Una cortina, si la lleva agarrada. */
  if (arrastreCortina && arrastreCortina.id === e.pointerId) {
    moverCortina(p);
    if (e.cancelable) e.preventDefault();
    return;
  }

  /* El bombón, si lo lleva cogido. */
  if (bombon.agarrado && bombon.dedoId === e.pointerId) {
    /* Aquí sólo se apunta a DÓNDE está el dedo, sin recortar nada. El
       alcance lo pone la física del palo, que se queda tirante cuando
       te pasas en vez de que el dedo se despegue del palo. */
    bombon.corrido = (bombon.corrido || 0)
      + Math.hypot(p.x - bombon.destX, p.y - bombon.destY);
    bombon.destX = p.x;
    bombon.destY = clamp(p.y, U * 14, H - U * 4);
    if (e.cancelable) e.preventDefault();
  }

  /* El volumen de una piedra del panel. */
  if (arrastrePanel && arrastrePanel.id === e.pointerId) {
    const dx2 = p.x - arrastrePanel.x0;
    /* Seis píxeles de margen y no cuatro: en un móvil, un toque limpio
       mueve el dedo tres o cuatro, y con el margen justo se colaban
       arrastres de volumen minúsculos en vez de encender el ambiente. */
    if (Math.abs(dx2) > 6) arrastrePanel.movido = true;
    /* El recorrido es el ancho de la pastilla por tres: cabe entero en
       un pulgar sin levantarlo, y no hace falta cruzar la pantalla para
       subir el volumen del todo. */
    const nv = clamp01(arrastrePanel.vol0 + dx2 / (arrastrePanel.piedra.w * 3));
    arrastrePanel.piedra.vol = nv;
    volumen(arrastrePanel.piedra.conf.id, nv);
    marcarPanelUsado();
    if (e.cancelable) e.preventDefault();
  }

  /* Y el resalte de la cabaña al pasar por encima. */
  if (escena === "bosque") {
    const c = sitio.cabana;
    if (Math.abs(p.x - c.x) < c.w * 0.8 && p.y > c.y - c.h * 1.6 && p.y < c.y + c.h * 0.2) {
      cabana.resalte = 1;
    }
  }
});

function soltarDedo(e) {
  /* ---- Soltar en la espesura ----
     Si el dedo ha corrido poco, no era un paseo: era un toque. El
     umbral es generoso —un dedo en un móvil nunca está del todo
     quieto— y se mide el recorrido TOTAL, no la distancia entre el
     principio y el final: ir y volver también es haber andado. */
  const ag = espesura.agarre;
  if (ag && ag.id === e.pointerId) {
    espesura.agarre = null;
    if (ag.corrido < U * 2.6 && !bloqueado && !ag.yaDisparo) {
      tocarEnEspesura({ x: ag.x0, y: ag.y }, e);
      espesura.vx = 0;
    }
    dedo.dentro = false;
    try { zona.releasePointerCapture(e.pointerId); } catch { /* ya estaba */ }
    return;
  }

  /* ---- Soltar una cortina ----
     Mismo trato que el paseo por la espesura: si el dedo corrió poco
     era un toque, y si corrió, se queda donde la dejaron. */
  if (arrastreCortina && arrastreCortina.id === e.pointerId) {
    soltarCortina();
    dedo.dentro = false;
    try { zona.releasePointerCapture(e.pointerId); } catch { /* ya estaba */ }
    return;
  }

  if (bombon.agarrado && bombon.dedoId === e.pointerId) {
    bombon.agarrado = false;
    bombon.dedoId = null;
    /* ¿Fue un toque? Entonces se lo come. Y se lo come esté como esté:
       crudo, hecho o carbonizado. Cada estado tiene sus frases.

       Y si se lo come, NO se recoloca el palo. `colocarBombon(false)`
       mira si el bombón está vivo y, al encontrarlo recién comido,
       entiende que hay que sacar uno nuevo… y lo saca en el acto,
       borrando el mordisco. El bombón nuevo lo pone `moverBombon` a su
       tiempo, cuando acaba la animación de comérselo. */
    if ((bombon.corrido || 0) < U * 2.4) {
      comerBombon();
    } else {
      /* Al soltarlo, el palo vuelve solo a su sitio, pero CONSERVANDO
         la velocidad que llevaba. Por eso si lo sueltas en pleno
         movimiento se pasa de largo y se balancea antes de pararse. */
      colocarBombon(false);
    }
  }
  if (arrastrePanel && arrastrePanel.id === e.pointerId) {
    /* Si no ha arrastrado, es un toque: enciende o apaga. */
    if (!arrastrePanel.movido) alternarPiedra(arrastrePanel.piedra);
    arrastrePanel = null;
  }
  dedo.dentro = false;
  try { zona.releasePointerCapture(e.pointerId); } catch { /* ya estaba */ }
}
zona.addEventListener("pointerup", soltarDedo);
zona.addEventListener("pointercancel", soltarDedo);
zona.addEventListener("pointerleave", () => { dedo.dentro = false; });

/** Qué hay debajo del dedo en el bosque, de delante hacia atrás. */
function tocarEnBosque(p, e) {
  const f = sitio.fogata;

  /* 1. EL BOMBÓN. Lo primero de todo: está delante y es lo que más se
        usa. Si está fuera del fuego, un toque se lo come; si está
        dentro, se coge para sacarlo. */
  const dBom = desplazar(1.9);
  if (bombon.vivo && dentroDe(p.x, p.y, bombon.x + dBom.x, bombon.y + dBom.y, U * 7.5)) {
    /* ---- Coger o comer ----
       No se decide aquí: se coge SIEMPRE, y al soltar se mira cuánto ha
       corrido el dedo. Poco es un toque y se lo come; mucho es que lo
       estabas moviendo y no.

       Antes se decidía al apretar, mirando si estaba lejos del fuego y
       si tenía algo de tueste. Eso tenía dos fallos: uno crudo no se
       podía comer nunca —y hay frases escritas para comérselo crudo—, y
       para sacarlo del fuego había que tocarlo, soltarlo y volver a
       tocarlo. Ahora es lo mismo que todo lo demás del juego: arrastrar
       mueve, tocar hace. */
    bombon.agarrado = true;
    bombon.dedoId = e.pointerId;
    bombon.destX = p.x; bombon.destY = p.y;
    bombon.corrido = 0;
    /* Al soltarse de su sitio de reposo, el palo arranca quieto: si no,
       se lleva consigo la velocidad que traía de volver y da un
       latigazo nada más tocarlo. */
    bombon.angV *= 0.3;
    tono(520, 0.12, "sine", 0.04);
    if (e.cancelable) e.preventDefault();
    return;
  }

  /* 2. LAS PASTILLAS DEL SONIDO.
     El área de toque es un RECTÁNGULO más alto y más ancho que la
     pastilla, no un círculo: son pastillas, y con un círculo las
     esquinas se quedaban fuera. Y se estira hacia abajo, que es por
     donde falla el dedo en un móvil. */
  const dPan = desplazar(2.1);
  for (const piedra of panel.piedras) {
    const dx = p.x - (piedra.x + dPan.x);
    const dy = p.y - (piedra.y + dPan.y);
    if (Math.abs(dx) < piedra.w * 0.58 && dy > -piedra.h * 0.62 && dy < piedra.h * 0.78) {
      arrastrePanel = { id: e.pointerId, piedra, x0: p.x, vol0: piedra.vol, movido: false };
      piedra.hundida = 1;
      if (e.cancelable) e.preventDefault();
      return;
    }
  }

  /* 3. LA CAJITA MUSICAL. */
  if (dentroDe(p.x, p.y, sitio.cajita.x, sitio.cajita.y, sitio.cajita.r * 1.5)) {
    if (cajita.abierta) cerrarCajita(); else abrirCajita();
    contarLogro("cajita");
    return;
  }

  /* 4. LA LLAMA. El easter egg de quemarse. */
  if (dentroDe(p.x, p.y, f.x, f.y - f.r * 0.8, f.r * 1.5)) {
    quemarse(p.x, p.y);
    return;
  }

  /* 4b. EL SENDERO. Antes que la luz verde y que la cabaña: es el
     hueco entre los árboles, y todo lo que hay a su alrededor es más
     grande que él. */
  const dSen = desplazar(1.726);
  if (dentroDe(p.x, p.y, sendero.x + dSen.x, sendero.y + dSen.y, sendero.r * 1.25)) {
    irALaEspesura();
    return;
  }

  /* 5. LA LUZ VERDE DEL BOSQUE.
        Antes que la cabaña a propósito: el área táctil de una casa es
        grande, y lo grande se traga lo pequeño si va primero. */
  if (dentroDe(p.x, p.y, sitio.secreto.x, sitio.secreto.y, U * 7)) {
    if (secreto.hallado) abrirCarta();
    else tocarSecreto(sitio.secreto.x, sitio.secreto.y);
    return;
  }

  /* 6. EL PAPELITO DEL ÁRBOL, si hay uno en el suelo. */
  if (nota.viva && !nota.leida && dentroDe(p.x, p.y, nota.x, nota.y, U * 6)) {
    if (leerNota()) return;
  }

  /* 7. EL BÚHO.
     ANTES QUE LA CABAÑA Y QUE LOS ÁRBOLES, y esto no es un detalle:
     está posado EN un árbol y a veces en uno que cae justo delante de
     la cabaña. Con el orden de antes, el árbol o la casa se llevaban el
     toque y el búho no se podía tocar NUNCA desde esos escondites: se
     asomaba, lo veías, le dabas y no pasaba nada.

     Lo pequeño gana a lo grande. Siempre, y sin excepciones.

     El radio es generoso —tres veces su tamaño— a propósito: es
     pequeño, está medio escondido y casi siempre se busca con el dedo a
     oscuras. Un búho que hay que acertar al píxel no se encuentra. */
  if (buho && buho.salida > 0.2 && !buho.vuelo) {
    const banda = CONF.bosque.bandas[buho.arbol ? buho.arbol.banda : 1];
    const dB = desplazar(mez(0.3, 3.4, banda.z));
    if (dentroDe(p.x, p.y, buho.x + dB.x, buho.y + dB.y, buho.r * 3)) {
      if (tocarBuho()) return;
    }
  }

  /* 8. LA CABAÑA. */
  const c = sitio.cabana;
  if (Math.abs(p.x - c.x) < c.w * 0.78 && p.y > c.y - c.h * 1.6 && p.y < c.y + c.h * 0.12) {
    entrarEnLaCabana();
    return;
  }

  /* 9. LOS ÁRBOLES. Se buscan de delante hacia atrás: el de cerca gana
        al de lejos, que es lo que está viendo el dedo. */
  for (let i = arboles.length - 1; i >= 0; i--) {
    const t = arboles[i];
    if (!t.toca) continue;
    const dx = p.x - (t.x + desplazar(mez(0.3, 3.4, t.z)).x);
    const cima = t.base - t.alto;
    /* Los de cerca son mucho más gordos que los de en medio, así que
       tres veces y media su ancho se comería media pantalla y no se
       podría tocar nada más de ese lado. */
    if (Math.abs(dx) > t.ancho * (t.banda === 2 ? 1.8 : 3.4)) continue;
    if (p.y < cima - t.ancho * 2 || p.y > t.base + U * 2) continue;
    /* La fuerza depende de por dónde se toque: arriba se mueve mucho
       más que abajo, porque arriba hace palanca. */
    const altura = clamp01((t.base - p.y) / Math.max(1, t.alto));
    sacudirArbol(t, (dx < 0 ? -1 : 1) * (2.2 + altura * 4.4));
    mirarArbolCarta(t, p);
    contarLogro("arbol");
    return;
  }

  /* 10. LA LUNA. */
  const dL = desplazar(0.3);
  if (dentroDe(p.x, p.y, sitio.luna.x + dL.x, sitio.luna.y + dL.y, sitio.luna.r * 1.9)) {
    tocarLuna(sitio.luna.x + dL.x, sitio.luna.y + dL.y);
    return;
  }

  /* 11. LAS ESTRELLAS FUGACES, si pillas alguna al vuelo.
     El radio es grande —y ADELANTADO a donde va— porque se mueve a
     cuatrocientos píxeles por segundo: apuntando a donde está, para
     cuando el dedo llega ya no está ahí. */
  for (let i = 0; i < cielo.fugaces.length; i++) {
    const f = cielo.fugaces[i];
    const ax = f.x + f.vx * 0.08, ay = f.y + f.vy * 0.08;
    if (dentroDe(p.x, p.y, ax, ay, U * 11) || dentroDe(p.x, p.y, f.x, f.y, U * 11)) {
      cielo.fugaces.splice(i, 1);
      cazarFugaz(f, p);
      return;
    }
  }

  /* 12. LAS ESTRELLAS. Algunas responden. */
  const dE = desplazar(0.18);
  let mejor = null, dMin = U * 5;
  for (const s of cielo.estrellas) {
    const d = Math.hypot(p.x - (s.x + dE.x), p.y - (s.y + dE.y));
    if (d < dMin) { dMin = d; mejor = s; }
  }
  if (mejor) {
    mejor.pulso = 1;
    tono(azar(900, 1700), 0.7, "sine", 0.045);
    if (mejor.viva) {
      soltarBrillos(mejor.x + dE.x, mejor.y + dE.y, 14, 0.45);
      decir(mejor.x + dE.x, mejor.y + dE.y + U * 5,
        "Esta sí contesta. No todas lo hacen.", { mimo: true, importante: true });
      contarLogro("estrella");
    }
    return;
  }

  /* 13. Y si no hay nada, se aviva un poco el fuego soplando. */
  if (p.y > sitio.horizonte) {
    fuego.vidaObj = Math.min(1.7, fuego.vidaObj + 0.22);
    fuego.quieta = 0;
  }
}

function tocarEnHabitacion(p, e) {
  const v = ventanaHab();

  /* El reloj. Lo primero: es lo más pequeño que hay. */
  if (tocarReloj3(p)) return;

  /* Y las estrellitas, que son lo segundo más pequeño. */
  if (tocarCielo(p)) return;

  /* La luna de la ventana. Primero, porque está DENTRO del cristal: si
     fuera después, el cristal se llevaría todos los toques y la luna no
     se podría tocar desde aquí. */
  if (sitio.luna.vx !== undefined &&
      dentroDe(p.x, p.y, sitio.luna.vx, sitio.luna.vy, sitio.luna.vr * 2.1)) {
    tocarLuna(sitio.luna.vx, sitio.luna.vy);
    return;
  }

  /* El cristal. Tres veces. */
  if (Math.abs(p.x - v.x) < v.w * 0.55 && Math.abs(p.y - v.y) < v.h * 0.55) {
    if (tocarVentanaHab(p.x, p.y)) return;
  }

  /* Las cosas de la repisa, la guitarra y el tapete. Van después del
     cristal porque el interruptor queda pegado al marco, y antes que
     el cuadro y la lámpara porque son más pequeñas que ellos. */
  if (tocarCosas(p)) return;

  /* El cuadro de la pared. */
  const qx = v.x - v.w * 0.92, qy = v.y + U * 2;
  if (Math.abs(p.x - qx) < U * 6 && Math.abs(p.y - qy) < U * 7) {
    hab.cuadro = 1;
    tono(523, 0.8, "triangle", 0.05);
    decir(qx, qy - U * 8, "Somos nosotros. Lo colgué el primer día.", { mimo: true, importante: true });
    contarLogro("cuadro");
    return;
  }

  /* La vela del alféizar. Antes que la mesilla y que el cuadro: es
     chiquita y está pegada al marco. */
  const cvx = v.x - v.w * 0.36, cvy = v.y + v.h / 2 - U * 5;
  if (dentroDe(p.x, p.y, cvx, cvy, U * 6)) {
    tocarVela(cvx, cvy);
    return;
  }

  /* Los libros, la taza y el nudo del suelo. Van antes que la lámpara
     porque están encima de la misma mesilla y su zona de toque es más
     pequeña: lo pequeño gana a lo grande. */
  if (tocarSecretos(p)) return;

  /* La lámpara de la mesilla. */
  const M = sitioMesilla();
  if (Math.abs(p.x - M.lampara.x) < M.lampara.ax
      && Math.abs(p.y - M.lampara.y) < M.lampara.ay) {
    hab.lamparaOn = !hab.lamparaOn;
    golpe(0.02, 2600, 0.14, "bandpass");
    return;
  }

  /* Las cortinas. Van casi al final: son lo más grande que hay en la
     pared, y todo lo que está delante de ellas —la vela, el cuadro,
     las fotos— tiene que poder tocarse primero. */
  const lado = ladoCortina(p);
  if (lado !== null) { agarrarCortina(lado, p, e); return; }

  /* Y la manta, que es todo lo de abajo. Lo último de todo, porque
     ocupa un tercio de la pantalla. */
  if (p.y > cimaCama() - U * 4) { tocarManta(p); return; }
}

/* ---- EL SUSTO DE LA VENTANA --------------------------------------------

   Tocar el cristal tres veces. No pasa nada, no pasa nada… y a la
   tercera hay algo al otro lado.

   ── POR QUÉ TRES Y POR QUÉ NADA LAS DOS PRIMERAS ─────────────────────
   Porque el susto no está en el búho: está en haber tocado dos veces
   sin consecuencias. Las dos primeras contestan con una tontería —«no
   se ve nada», «está lloviendo»— y por eso la tercera pilla.

   ── Y POR QUÉ NO ES SÓLO UN DIBUJO QUE APARECE ───────────────────────
   Un dibujo que aparece se ve venir. Esto es una secuencia: primero se
   apaga la lámpara y la habitación se queda a oscuras, luego un golpe
   en el cristal, luego la cámara SE GIRA hacia la ventana —despacio,
   lo justo para que dé tiempo a pensar «no, no, no»— y entonces sí.

   Y se acuerda: la segunda vez que se hace, el búho ya no aparece
   igual. Un susto que se repite igual deja de ser un susto y pasa a
   ser una animación.                                                 */

const susto = {
  toques: 0,
  fase: -1,          // -1 quieto · si no, segundos desde que empezó
  buho: 0,           // cuánto se ve el búho de fuera, 0..1
  oscuro: 0,         // cuánto se ha apagado la habitación
  lamparaAntes: true,
};

function tocarVentanaHab(x, y) {
  if (susto.fase >= 0) return true;
  susto.toques++;

  if (susto.toques < CONF.ventana.toques) {
    /* Las dos primeras: un golpecito en el cristal y una tontería. */
    golpe(0.05, azar(1800, 2600), 0.1, "bandpass");
    golpe(0.03, azar(600, 900), 0.06, "bandpass");
    const antes = [
      "Allá afuera no se ve nada.",
      "Solo está el bosque. Y la noche.",
      "Nada. Un árbol y ya.",
      "¿Qué tanto ves? Si está todo oscuro.",
    ];
    decir(x, y + U * 8, antes[(susto.toques - 1) % antes.length], { dur: 3.2 });
    return true;
  }

  /* La tercera. */
  susto.toques = 0;
  susto.fase = 0;
  susto.lamparaAntes = hab.lamparaOn;
  hab.lamparaOn = false;
  bloqueado = true;
  recuerdo.sumar("susto");
  contarLogro("ventana");
  return true;
}

function moverSusto(dt) {
  if (susto.fase < 0) {
    susto.buho = damp(susto.buho, 0, 2.4, dt);
    susto.oscuro = damp(susto.oscuro, 0, 2, dt);
    return;
  }
  const t = susto.fase += dt;
  const v = ventanaHab();

  /* 0.0 – 0.9  todo se apaga y se queda quieto. */
  if (t < 0.9) {
    susto.oscuro = suave3(t / 0.9);
    agacharAmbientes(0.25, 0.8);
  }
  /* 0.9 – 1.1  un golpe en el cristal. */
  else if (t < 1.1) {
    if (!susto.golpeado) {
      susto.golpeado = true;
      golpe(0.06, 2200, 0.24, "bandpass");
      golpe(0.12, 320, 0.18, "lowpass");
      sacudir(0.25);
    }
  }
  /* 1.1 – 2.1  la cámara se vuelve hacia la ventana. Despacio, que es
     lo que da tiempo a pensar «no, no, no». La ventana está centrada,
     así que girar hacia ella no mueve nada de lado: lo que se hace es
     ACERCARSE y subir un poco, que es lo que haría alguien tumbado que
     se incorpora para mirar. */
  else if (t < 2.1) {
    const k = suave3((t - 1.1) / 1);
    cam.oz = mez(1, 1.3, k);
    cam.oy = (H * 0.5 - v.y) * k * 0.55;
  }
  /* 2.1 – 2.35  y está ahí. */
  else if (t < 2.35) {
    if (!susto.asustado) {
      susto.asustado = true;
      susto.buho = 1;
      sacudir(1.2);
      sonarMisterio(0.85);
      golpe(0.2, 140, 0.3, "lowpass");
      /* La segunda vez y las siguientes, el búho ya no es sorpresa: es
         un conocido que se ha pasado a saludar. */
      const veces = recuerdo.leer("susto", 1);
      const dice = veces <= 1
        ? CONF.ventana.dice[Math.floor(Math.random() * CONF.ventana.dice.length)]
        : (CONF.ventana.otraVez[Math.min(veces - 2, CONF.ventana.otraVez.length - 1)]);
      setTimeout(() => decir(v.x, v.y + v.h * 0.6, dice,
        { mimo: true, importante: true, dur: 5 }), 700);
    }
  }
  /* 2.35 – 4.2  se queda mirando y se va. */
  else if (t < 4.2) {
    susto.buho = 1 - suave3(clamp01((t - 3.2) / 1));
  }
  /* Y se recoge todo. */
  else {
    susto.fase = -1;
    susto.golpeado = false;
    susto.asustado = false;
    susto.buho = 0;
    hab.lamparaOn = susto.lamparaAntes;
    cam.ox = 0; cam.oy = 0; cam.oz = 1;
    bloqueado = false;
    agacharAmbientes(1, 1.4);
  }
}

/**
 * El búho al otro lado del cristal.
 *
 * Se dibuja DENTRO del recorte de la ventana, así que no hace falta
 * comprobar nada: lo que se sale del marco, no se ve. Y eso es lo que
 * hace que parezca que está fuera y no pegado encima.
 */
function dibujarSustoVentana(x, y, w, h) {
  if (susto.buho < 0.01) return;
  const k = clamp01(susto.buho);
  /* Se acerca al cristal según aparece: empieza al fondo y acaba
     pegado. Un búho que aparece ya pegado es un salto; uno que se
     acerca en dos décimas es un susto. */
  const r = w * mez(0.1, 0.3, k);
  const cy = y + h * mez(0.1, 0.02, k);

  ctx.save();
  ctx.globalAlpha = k;

  /* El cuerpo: una silueta negra, sin ningún detalle. Lo que asusta es
     no verle la cara. */
  ctx.fillStyle = "rgba(8,8,12,0.94)";
  ctx.beginPath();
  ctx.ellipse(x, cy, r, r * 1.2, 0, 0, 6.283);
  ctx.fill();
  for (const s of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(x + s * r * 0.24, cy - r * 0.85);
    ctx.lineTo(x + s * r * 0.66, cy - r * 1.6);
    ctx.lineTo(x + s * r * 0.74, cy - r * 0.72);
    ctx.closePath();
    ctx.fill();
  }

  /* Y los ojos. Verdes, enormes, muy juntos al cristal. */
  ctx.globalCompositeOperation = "lighter";
  for (const s of [-1, 1]) {
    const ex = x + s * r * 0.38, ey = cy - r * 0.3;
    /* Apretados: con el halo ancho los dos se juntaban en una bola
       verde y el búho se quedaba sin silueta. Lo que asusta es la
       silueta negra CON dos puntos, no una mancha luminosa. */
    const g = ctx.createRadialGradient(ex, ey, 0, ex, ey, r * 0.46);
    g.addColorStop(0, `rgba(190,255,215,${0.95 * k})`);
    g.addColorStop(0.32, `rgba(60,225,145,${0.4 * k})`);
    g.addColorStop(1, "rgba(40,200,120,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(ex, ey, r * 0.46, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = `rgba(6,14,9,${0.92 * k})`;
    ctx.beginPath(); ctx.arc(ex, ey, r * 0.08, 0, 6.283); ctx.fill();
    ctx.globalCompositeOperation = "lighter";
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.restore();
}

function soltarBrillos(x, y, n, tono2) {
  for (let i = 0; i < n; i++) {
    const a = azar(0, 6.283);
    soltar(x, y, {
      vx: Math.cos(a) * azar(14, 70), vy: Math.sin(a) * azar(14, 60),
      vida: azar(1.4, 2.8), tam: azar(1, 2.4),
      tipo: TIPO.BRILLO, tono: tono2,
    });
  }
}

/* ---- Los botones ------------------------------------------------------- */

const btnDormir = document.getElementById("dormir");
const btnVolver = document.getElementById("volver");
const elSueno = document.getElementById("sueno");
const diceDormir = barajador(CONF.alDormir);

btnDormir.addEventListener("click", dormirse);
btnVolver.addEventListener("click", () => {
  if (raiz.classList.contains("is-durmiendo")) despertarse();
  else volverAlBosque();
});

function dormirse() {
  if (escena !== "habitacion" || bloqueado) return;
  escena = "durmiendo";
  raiz.classList.add("is-durmiendo");
  btnDormir.disabled = true;

  /* Los ambientes NO se callan: bajan. Dormirse con la fogata y los
     grillos de fondo es justo lo que se quiere sentir aquí. */
  agacharAmbientes(0.55, 3);
  if (cajita.gain) {
    const t = audio.ctx.currentTime;
    cajita.gain.gain.linearRampToValueAtTime(0.35, t + 3);
  }

  elSueno.textContent = diceDormir();
  animar((k) => { hab.dormida = k; }, 2800);
  tono(196, 3.2, "sine", 0.05);
}

function despertarse() {
  escena = "habitacion";
  raiz.classList.remove("is-durmiendo");
  btnDormir.disabled = false;
  agacharAmbientes(0.32, 1.6);
  animar((k) => { hab.dormida = 1 - k; }, 1400);
}

/* ---- La puerta de entrada ---------------------------------------------- */

const entrada = document.getElementById("entrada");

function entrar() {
  raiz.classList.add("is-dentro");
  despertarAudio();
  /* Los ambientes que empiezan encendidos, con su fundido. */
  for (const a of CONF.ambientes) if (a.on) ambiente(a.id, true, a.vol);
  setTimeout(() => {
    decir(sitio.fogata.x, sitio.fogata.y - U * 20,
      "Agarra el palo y acerca el malvavisco al fuego. :>", { dur: 5.2 });
  }, 1600);
}

/* `pointerup` además de `click`: esto es un `div`, no un `button`, y
   Safari en iOS sólo dispara `click` en elementos que no son de control
   si además tienen cursor de mano. Con los dos entra siempre, y el
   cerrojo de dentro evita que entre dos veces. */
let yaEntre = false;
function entrarUnaVez() { if (yaEntre) return; yaEntre = true; entrar(); }
entrada.addEventListener("click", entrarUnaVez);
entrada.addEventListener("pointerup", entrarUnaVez);
entrada.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); entrarUnaVez(); }
});

// ==========================================
// RESPONSIVE
// ==========================================
//
// No hay dos diseños: hay UNO que se mide contra `U` —la centésima
// parte del lado corto— y contra `apaisado`. Al girar el teléfono, la
// escena se reconstruye entera en `medir()`:
//
//   · la fogata y la cabaña se separan más en apaisado, que hay sitio;
//   · el arco de piedras se abre o se cierra;
//   · el bosque se vuelve a sembrar con la MISMA semilla, así que es el
//     mismo bosque y no otro distinto;
//   · el alcance del palo se recalcula.
//
// Lo único que se conserva entre medidas es el estado: qué ambientes
// están puestos, el tueste del bombón, si la carta está encontrada.

addEventListener("orientationchange", () => setTimeout(medir, 220));

// ==========================================
// OPTIMIZACIÓN
// ==========================================
//
// Se mide el ritmo de verdad durante los primeros segundos. Si no llega
// al mínimo, se baja la calidad UNA VEZ y no se vuelve a tocar: un
// ajuste que sube y baja solo se nota más que ir siempre algo peor.
//
// Lo que se baja: la resolución del lienzo, el número de partículas, el
// de estrellas y la frecuencia con la que salen chispas y humo.

let fpsAcum = 0, fpsCuenta = 0, yaBajado = false;

function vigilarRitmo(dt) {
  if (yaBajado) return;
  fpsAcum += dt;
  fpsCuenta++;
  if (fpsAcum < 2.5) return;
  const fps = fpsCuenta / fpsAcum;
  fpsAcum = 0; fpsCuenta = 0;
  if (fps >= CONF.perf.fpsMinimo) { yaBajado = true; return; }   // va bien

  /* ---- Se baja UN escalón, y el primero es el brillo ----
     Porque es lo único que se puede quitar sin que cambie nada de lo
     que pasa: la escena sigue estando entera debajo. Quitar partículas
     o resolución cambia cómo se ve el mundo; quitar el brillo sólo le
     baja el resplandor. Si con eso basta, no se toca nada más. */
  if (brillo.encendido) {
    apagarBrillo();
    fpsAcum = 0; fpsCuenta = 0;
    console.info("[noche] brillo apagado: el ritmo no llegaba al mínimo.");
    return;
  }

  yaBajado = true;
  flojo = true;
  crearParticulas(CONF.perf.particulasFlojo);
  medir();
  console.info("[noche] calidad reducida: el ritmo no llegaba al mínimo.");
}

/* Cuando la pestaña se va, se para todo: un bucle corriendo de fondo
   gasta batería para nadie. */
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    agacharAmbientes(0, 0.4);
  } else {
    t0 = performance.now();      // que no cuente el tiempo que ha estado fuera
    agacharAmbientes(1, 0.8);
  }
});

// ==========================================
// EL BRILLO — POSTPROCESADO EN WEBGL2
// ==========================================
//
// ── QUÉ HACE ─────────────────────────────────────────────────────────
// Coge el lienzo 2D ya pintado y lo vuelve a sacar por pantalla con
// tres cosas encima:
//
//   · BLOOM      lo que brilla se desborda. La fogata deja de ser una
//                mancha naranja recortada y pasa a repartir luz.
//   · VIÑETA     los cantos se cierran, con un pelín de aberración de
//                color en las esquinas, que es lo que hace que parezca
//                mirado a través de algo y no dibujado.
//   · GRANO      un ruido finísimo que se mueve. Una noche sin grano se
//                ve digital; con grano se ve fotografiada.
//
// ── POR QUÉ SUSTITUYE AL LIENZO EN VEZ DE SUMARSE ENCIMA ─────────────
// Porque la viñeta OSCURECE, y una capa que sólo suma no puede
// oscurecer nada. Así que este lienzo pinta la escena entera —ya
// tratada— y el otro se esconde. Si WebGL2 falla a mitad de camino,
// basta con volver a enseñar el de abajo: está completo y correcto.
//
// ── POR QUÉ NO CUESTA LO QUE PARECE ──────────────────────────────────
// El desenfoque no se hace a resolución completa. Se baja a una cuarta
// parte, se difumina ahí con dos pasadas de una sola dimensión —lo que
// en dos dimensiones costaría N² pasa a costar 2N— y se sube otra vez
// estirándolo. Un desenfoque estirado se ve exactamente igual de suave,
// porque es un desenfoque: no hay detalle que perder.
//
// El único gasto de verdad es subir el lienzo 2D a la GPU una vez por
// fotograma. Si eso no cabe en el presupuesto, el vigilante de ritmo
// apaga todo esto y no vuelve a intentarlo.

const brillo = {
  gl: null,
  listo: false,
  encendido: false,
  progEscena: null,
  progBrillo: null,
  progMezcla: null,
  texEscena: null,
  fbo: [],
  tex: [],
  ancho: 0, alto: 0,
  /* Cuánto se baja para difuminar. 4 = una cuarta parte de lado. */
  escala: 4,
};

const lienzoBrillo = document.getElementById("brillo");

/* ---- Los sombreadores ---------------------------------------------------
   ── POR QUÉ UN CUADRILÁTERO Y NO EL TRIÁNGULO DE SIEMPRE ────────────
   El truco habitual es no usar ningún búfer y sacarse un triángulo
   gigante de `gl_VertexID`. Es más elegante y ocupa menos, y en el
   teléfono de verdad dejaba MEDIA PANTALLA EN NEGRO, cortada por una
   diagonal dentada: justo la hipotenusa de ese triángulo.

   Sea cual sea el motivo exacto —el driver, la conversión de entero a
   flotante, el orden de los bits—, no hay forma de depurarlo a ciegas
   desde aquí, y un fallo que tapa media escena no se puede dejar
   puesto. Cuatro vértices en un búfer funcionan en todas partes, pesan
   treinta y dos bytes y no se pueden interpretar mal.

   Y por si acaso, más abajo hay una comprobación que mira las cuatro
   esquinas después del primer cuadro y apaga el brillo solo si alguna
   sale negra.                                                        */

const VS_PANTALLA = `#version 300 es
in vec2 aPos;
out vec2 uv;
void main() {
  uv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

/* Paso 1: quedarse sólo con lo que brilla, y ya bajado de tamaño.
   El corte no es duro: lo que está justo en el filo entra a medias, si
   no se ven escalones en los bordes de la llama. */
const FS_BRILLO = `#version 300 es
precision mediump float;
in vec2 uv;
uniform sampler2D uTex;
uniform float uCorte;
out vec4 color;
void main() {
  vec3 c = texture(uTex, uv).rgb;
  float luz = dot(c, vec3(0.299, 0.587, 0.114));
  float k = smoothstep(uCorte, uCorte + 0.25, luz);
  color = vec4(c * k, 1.0);
}`;

/* Paso 2: el desenfoque, en una sola dirección. Se llama dos veces —una
   horizontal y otra vertical—, que es lo que convierte un coste de N²
   en uno de 2N. Los pesos son una gaussiana de nueve muestras. */
const FS_DESENFOQUE = `#version 300 es
precision mediump float;
in vec2 uv;
uniform sampler2D uTex;
uniform vec2 uPaso;
out vec4 color;
void main() {
  float pesos[5] = float[](0.227027, 0.194595, 0.121622, 0.054054, 0.016216);
  vec3 c = texture(uTex, uv).rgb * pesos[0];
  for (int i = 1; i < 5; i++) {
    vec2 d = uPaso * float(i);
    c += texture(uTex, uv + d).rgb * pesos[i];
    c += texture(uTex, uv - d).rgb * pesos[i];
  }
  color = vec4(c, 1.0);
}`;

/* Paso 3: juntarlo todo. */
const FS_MEZCLA = `#version 300 es
precision mediump float;
in vec2 uv;
uniform sampler2D uEscena;
uniform sampler2D uBrillo;
uniform float uFuerza;
uniform float uTiempo;
uniform float uVineta;
out vec4 color;

/* Ruido barato y sin textura: un seno muy picado. No es un ruido
   estadísticamente bueno, y da igual: se usa a un dos por ciento. */
float ruido(vec2 p) {
  return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}

void main() {
  vec3 esc = texture(uEscena, uv).rgb;
  vec3 bri = texture(uBrillo, uv).rgb;

  /* El bloom SUMA. Un bloom que mezcla apaga la escena en vez de
     encenderla, que es justo lo contrario de lo que se quiere. */
  vec3 c = esc + bri * uFuerza;

  /* La viñeta, medida desde el centro en coordenadas cuadradas para que
     no se estire en pantallas alargadas. */
  vec2 d = uv - 0.5;
  float r = length(d * vec2(1.0, 1.0));
  float v = smoothstep(0.78, 0.28, r);
  c *= mix(1.0, v, uVineta);

  /* La aberración: en los cantos, el rojo se va un pelín hacia fuera.
     Dos muestras más y sólo donde se nota. */
  float ab = smoothstep(0.3, 0.72, r) * 0.0035;
  if (ab > 0.0002) {
    c.r = texture(uEscena, uv + d * ab).r + bri.r * uFuerza;
    c.b = texture(uEscena, uv - d * ab).b + bri.b * uFuerza;
    c.rb *= mix(vec2(1.0), vec2(v), uVineta);
  }

  /* Y el grano, que se mueve con el tiempo. */
  float g = ruido(uv * 900.0 + uTiempo) - 0.5;
  c += g * 0.018;

  color = vec4(c, 1.0);
}`;

function compilar(gl, tipo, fuente) {
  const sh = gl.createShader(tipo);
  gl.shaderSource(sh, fuente);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    console.warn("[noche] sombreador:", gl.getShaderInfoLog(sh));
    gl.deleteShader(sh);
    return null;
  }
  return sh;
}

function programa(gl, fs) {
  const v = compilar(gl, gl.VERTEX_SHADER, VS_PANTALLA);
  const f = compilar(gl, gl.FRAGMENT_SHADER, fs);
  if (!v || !f) return null;
  const p = gl.createProgram();
  gl.attachShader(p, v);
  gl.attachShader(p, f);
  /* El sitio del atributo se fija ANTES de enlazar: así los tres
     programas usan el mismo y basta con un solo montaje de vértices. */
  gl.bindAttribLocation(p, 0, "aPos");
  gl.linkProgram(p);
  gl.deleteShader(v);
  gl.deleteShader(f);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.warn("[noche] enlace:", gl.getProgramInfoLog(p));
    return null;
  }
  /* Se guardan los sitios de los uniformes una vez: buscarlos por
     nombre en cada fotograma es de las cosas más caras de WebGL. */
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const nom = gl.getActiveUniform(p, i).name;
    u[nom] = gl.getUniformLocation(p, nom);
  }
  return { p, u };
}

function arrancarBrillo() {
  /* Ya montado: no hay nada que montar, y decir que no se puede sería
     mentira. Devolviendo `false` aquí, volver a encenderlo después de
     que el vigilante lo apagara era imposible para siempre. */
  if (brillo.listo) return true;
  if (!CONF.perf.bloom || flojo) return false;
  let gl = null;
  try {
    gl = lienzoBrillo.getContext("webgl2", {
      alpha: false, antialias: false, depth: false, stencil: false,
      premultipliedAlpha: false, preserveDrawingBuffer: false,
      powerPreference: "low-power",
    });
  } catch { gl = null; }
  if (!gl) return false;

  brillo.gl = gl;
  brillo.progBrillo = programa(gl, FS_BRILLO);
  brillo.progDesenfoque = programa(gl, FS_DESENFOQUE);
  brillo.progMezcla = programa(gl, FS_MEZCLA);
  if (!brillo.progBrillo || !brillo.progDesenfoque || !brillo.progMezcla) {
    brillo.gl = null;
    return false;
  }

  /* La textura donde se sube el lienzo 2D. `CLAMP_TO_EDGE` es
     obligatorio: con el desenfoque cogiendo muestras fuera del borde, si
     repitiera se vería el otro lado de la pantalla asomando. */
  brillo.texEscena = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, brillo.texEscena);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

  /* Los dos destinos del desenfoque, que se van turnando. */
  for (let i = 0; i < 2; i++) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const f = gl.createFramebuffer();
    brillo.tex.push(t);
    brillo.fbo.push(f);
  }

  /* El cuadrilátero: dos triángulos en tira, cuatro vértices. */
  brillo.vao = gl.createVertexArray();
  gl.bindVertexArray(brillo.vao);
  const vbo = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER,
    new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  /* La posición va en el sitio 0 en los tres programas: se fija a mano
     antes de enlazar, para no tener que preguntarlo tres veces. */
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  brillo.listo = true;
  return true;
}

/** Reajusta los tamaños. Se llama desde `medir()`. */
function medirBrillo() {
  if (!brillo.listo) return;
  const gl = brillo.gl;
  const w = lienzo.width, h = lienzo.height;
  if (w === brillo.ancho && h === brillo.alto) return;
  brillo.ancho = w; brillo.alto = h;
  lienzoBrillo.width = w;
  lienzoBrillo.height = h;

  const bw = Math.max(1, Math.floor(w / brillo.escala));
  const bh = Math.max(1, Math.floor(h / brillo.escala));
  brillo.bw = bw; brillo.bh = bh;
  for (let i = 0; i < 2; i++) {
    gl.bindTexture(gl.TEXTURE_2D, brillo.tex[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, bw, bh, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.bindFramebuffer(gl.FRAMEBUFFER, brillo.fbo[i]);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, brillo.tex[i], 0);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/** Pinta el cuadrilátero que tapa la pantalla. */
function pintarPantalla(gl) {
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/**
 * Una pasada entera. Se llama al final de cada fotograma, después de
 * que el lienzo 2D esté terminado.
 */
function pasarBrillo() {
  if (!brillo.listo || !brillo.encendido) return;
  const gl = brillo.gl;
  if (gl.isContextLost && gl.isContextLost()) { apagarBrillo(); return; }
  /* Sin tamaño no se pinta. Un `viewport` de cero por cero deja el
     lienzo tal cual —o sea, negro— y desde fuera se ve exactamente
     igual que un fallo de dibujo. */
  if (!(brillo.ancho > 0) || !(brillo.alto > 0) ||
      !(brillo.bw > 0) || !(brillo.bh > 0)) return;

  gl.bindVertexArray(brillo.vao);
  gl.disable(gl.DEPTH_TEST);
  gl.disable(gl.SCISSOR_TEST);
  gl.colorMask(true, true, true, true);
  gl.disable(gl.BLEND);

  /* 1. Subir el lienzo 2D. Es el único gasto de verdad de todo esto. */
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, brillo.texEscena);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, lienzo);

  /* 2. Quedarse con lo que brilla, ya bajado de tamaño. */
  gl.viewport(0, 0, brillo.bw, brillo.bh);
  gl.bindFramebuffer(gl.FRAMEBUFFER, brillo.fbo[0]);
  gl.useProgram(brillo.progBrillo.p);
  gl.uniform1i(brillo.progBrillo.u.uTex, 0);
  /* El corte, alto a propósito: sólo desborda lo que de verdad está
     encendido —la llama, la luna, las ventanas, los ojos—. Con el corte
     bajo también desbordaba la madera iluminada y la escena entera se
     quedaba con los negros levantados, como una foto mal revelada. */
  gl.uniform1f(brillo.progBrillo.u.uCorte, 0.6);
  pintarPantalla(gl);

  /* 3. Difuminar: primero a lo ancho y luego a lo alto. */
  gl.useProgram(brillo.progDesenfoque.p);
  gl.uniform1i(brillo.progDesenfoque.u.uTex, 0);
  for (const [origen, destino, px, py] of [
    [0, 1, 1 / brillo.bw, 0],
    [1, 0, 0, 1 / brillo.bh],
  ]) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, brillo.fbo[destino]);
    gl.bindTexture(gl.TEXTURE_2D, brillo.tex[origen]);
    gl.uniform2f(brillo.progDesenfoque.u.uPaso, px, py);
    pintarPantalla(gl);
  }

  /* 4. Y juntarlo todo sobre el lienzo de verdad. */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, brillo.ancho, brillo.alto);
  gl.useProgram(brillo.progMezcla.p);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, brillo.texEscena);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, brillo.tex[0]);
  gl.uniform1i(brillo.progMezcla.u.uEscena, 0);
  gl.uniform1i(brillo.progMezcla.u.uBrillo, 1);
  /* El bloom sube un poco cuando hay relámpago o cuando la fogata está
     avivada: eso es lo que hace que un destello se sienta fuerte. */
  gl.uniform1f(brillo.progMezcla.u.uFuerza,
    0.5 + clima.destello * 0.8 + Math.max(0, fuego.vida - 1) * 0.28);
  gl.uniform1f(brillo.progMezcla.u.uTiempo, reloj);
  /* La viñeta ya la pinta el lienzo 2D, así que aquí se pone flojita:
     la de aquí es sólo la que cierra las esquinas del todo. */
  gl.uniform1f(brillo.progMezcla.u.uVineta, 0.32);
  pintarPantalla(gl);

  /* ---- La comprobación de las esquinas ----
     Una sola vez, en el primer cuadro con la escena ya puesta. Se leen
     cuatro píxeles de las esquinas; si alguno sale NEGRO DEL TODO, es
     que el cuadrilátero no ha tapado la pantalla —que es lo que pasaba
     en el móvil— y el brillo se apaga para siempre.

     Cuesta una lectura de cuatro píxeles, una vez en la vida. Lo que
     ahorra es que media escena se quede en negro en un teléfono que no
     tengo delante para probarlo. */
  if (!brillo.revisado && reloj > 2) {
    brillo.revisado = true;
    try {
      const px = new Uint8Array(4);
      const esquinas = [
        [2, 2], [brillo.ancho - 3, 2],
        [2, brillo.alto - 3], [brillo.ancho - 3, brillo.alto - 3],
      ];
      let negras = 0;
      for (const [x, y] of esquinas) {
        gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        if (px[0] === 0 && px[1] === 0 && px[2] === 0) negras++;
      }
      /* El centro también. Si el centro sale negro no hay discusión:
         no hay ninguna escena en la que el punto medio de la pantalla
         sea negro absoluto. */
      gl.readPixels(brillo.ancho >> 1, brillo.alto >> 1, 1, 1,
                    gl.RGBA, gl.UNSIGNED_BYTE, px);
      const centroNegro = px[0] === 0 && px[1] === 0 && px[2] === 0;

      /* Dos esquinas y no una: una esquina puede estar legítimamente a
         cero si la viñeta se la come del todo, y apagar el brillo por
         eso sería quitarlo donde funciona. Dos ya es un recorte. */
      if (negras >= 2 || centroNegro) {
        console.warn("[noche] el brillo no tapaba la pantalla entera: apagado.");
        CONF.perf.bloom = false;
        apagarBrillo();
        return;
      }
    } catch { /* si no deja leer, se deja como está */ }
  }
}

function encenderBrillo() {
  if (!arrancarBrillo()) return false;
  medirBrillo();
  brillo.encendido = true;
  lienzoBrillo.hidden = false;
  raiz.classList.add("is-brillo");
  return true;
}

/**
 * Apagarlo. Se vuelve a ver el lienzo 2D, que está entero y correcto:
 * nunca se ha dejado de pintar en él, sólo estaba escondido. Por eso
 * apagar esto no tiene ningún riesgo y se puede hacer a mitad de una
 * animación sin que se note más que porque baja un poco el brillo.
 */
function apagarBrillo() {
  brillo.encendido = false;
  lienzoBrillo.hidden = true;
  raiz.classList.remove("is-brillo");
}

/* Si la GPU se lleva el contexto —pasa al bloquear el móvil—, se apaga
   y se sigue con el lienzo 2D. Sin esto, la pantalla se quedaba negra. */
lienzoBrillo.addEventListener("webglcontextlost", (e) => {
  e.preventDefault();
  apagarBrillo();
});

// ==========================================
// BUCLE Y ARRANQUE
// ==========================================

let t0 = performance.now();
let reloj = 0;

function paso(ahora) {
  requestAnimationFrame(paso);
  if (!A || !H) return;
  if (document.hidden) return;

  /* El dt se ACOTA, no se sustituye. Cambiarlo por 1/60 en un salto
     largo hace que todo avance a cámara lenta en un móvil que se
     atasque: la escena entera se queda atrás y no se recupera. */
  let dt = (ahora - t0) / 1000;
  t0 = ahora;
  if (!(dt > 0) || dt > 0.5) dt = 1 / 60;
  else if (dt > 0.1) dt = 0.1;
  reloj += dt;

  vigilarRitmo(dt);

  /* ---- Parallax y cámara ---- */
  /* Si nadie toca, la escena respira sola: un vaivén lentísimo. Así no
     hay ni un fotograma completamente quieto. */
  if (!dedo.dentro) {
    par.ox = Math.sin(reloj * 0.11) * 0.28;
    par.oy = Math.sin(reloj * 0.08 + 1.2) * 0.2;
  }
  par.x = damp(par.x, par.ox, 2.6, dt);
  par.y = damp(par.y, par.oy, 2.6, dt);

  cam.z = damp(cam.z, cam.oz, 2.2, dt);
  cam.x = damp(cam.x, cam.ox, 2.2, dt);
  cam.y = damp(cam.y, cam.oy, 2.2, dt);

  meneo.t += dt;
  meneo.fuerza = damp(meneo.fuerza, 0, 4.4, dt);

  /* ---- Mover ---- */
  moverParticulas(dt);
  moverDichos(dt);

  moverViaje(dt);

  if (escena === "espesura") {
    moverClima(dt);
    moverEspesura(dt);
    moverBuhoEsp(dt);
    moverOjosEsp(dt);
    moverCaceria(dt);
    refrescarBolsa();
    refrescarHallado();
  } else if (escena === "bosque") {
    moverClima(dt);
    moverArboles(dt);
    /* El búho va DESPUÉS de los árboles: está agarrado a uno y lee su
       bamboleo, así que si fuera antes iría siempre un fotograma
       retrasado y se le vería despegarse de la rama. */
    moverBuho(dt);
    moverOjos(dt);
    moverNota(dt);
    moverFogata(dt);
    moverBombon(dt);
    moverPanel(dt);
    moverCajita(dt);
    moverCabana(dt);
    moverSecreto(dt);
    moverLuna(dt);
    moverMensajeCielo(dt);
    mirarFogataAzul();
  } else {
    moverHabitacion(dt);
    moverCajita(dt);
    /* La luna también, que se ve por la ventana: si no, una dona se
       quedaría congelada mientras estás dentro y al salir volvería de
       golpe sin que se viera nada. */
    moverLuna(dt);
    moverSusto(dt);
    moverReloj3(dt);
  }

  /* ---- Dibujar ---- */
  ctx.save();

  /* La cámara y la sacudida se aplican a TODO de una vez. */
  const mx = Math.sin(meneo.t * 43) * meneo.fuerza * U * 1.2;
  const my = Math.cos(meneo.t * 37) * meneo.fuerza * U * 1.1;
  ctx.translate(A / 2 + mx, H / 2 + my);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-A / 2 + cam.x / cam.z, -H / 2 + cam.y / cam.z);

  if (escena === "bosque") dibujarBosque(dt);
  else if (escena === "espesura") dibujarEspesura(dt);
  else dibujarHabitacion();

  ctx.restore();

  /* El velo de las cinemáticas va POR ENCIMA de la cámara: si entrara
     en la transformación, un zoom lo dejaría sin cubrir los cantos. */
  if (cine.velo > 0.001) {
    ctx.fillStyle = `rgba(2,3,8,${clamp01(cine.velo)})`;
    ctx.fillRect(0, 0, A, H);
    if (cine.texto && cine.velo > 0.8) {
      ctx.fillStyle = "rgba(190,200,230,0.5)";
      ctx.font = `${Math.round(U * 2.6)}px ui-sans-serif, system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(cine.texto, A / 2, H / 2);
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }
  }

  /* ---- Y el brillo, lo último de todo ----
     Tiene que ir DESPUÉS del velo de las cinemáticas: si fuera antes,
     el brillo cogería un lienzo a medio terminar y el fundido a negro
     se vería una imagen por detrás. */
  pasarBrillo();
}

/* ---- Arranque ---------------------------------------------------------- */

medir();
/* El brillo se enciende después de la primera medida: necesita saber
   de qué tamaño es el lienzo, y en el arranque todavía no lo sabe. */
encenderBrillo();
medirBrillo();
requestAnimationFrame(paso);

/* Si el navegador deja sonar sin tocar nada —pasa en escritorio con el
   sonido ya permitido—, se entra solo a los pocos segundos. Si no, la
   puerta espera el toque, que es lo que hace falta para el audio. */
setTimeout(() => {
  if (audio.ctx && audio.ctx.state === "running" && !raiz.classList.contains("is-dentro")) {
    entrar();
  }
}, 2600);

})();
</script>
