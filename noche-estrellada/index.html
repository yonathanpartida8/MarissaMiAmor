    for (const dy of [-S * 0.05, S * 0.02]) {
      const gb = c.createLinearGradient(0, dy, 0, dy + S * 0.07);
      gb.addColorStop(0, "#6e7681");
      gb.addColorStop(1, "#22272d");
      c.fillStyle = gb;
      c.beginPath();
      if (c.roundRect) c.roundRect(-S * 0.02, dy, S * 0.36, S * 0.07, S * 0.03);
      else c.rect(-S * 0.02, dy, S * 0.36, S * 0.07);
      c.fill();
    }
    c.fillStyle = "rgba(226,196,120,0.85)";
    c.beginPath(); c.arc(S * 0.32, -S * 0.06, S * 0.03, 0, 6.283); c.fill();
  }
  c.restore();
}

/* ---- La bolsa ----------------------------------------------------------- */

function refrescarBolsa() {
  const quiere = [...bolsa.tiene];
  /* Se rehace sólo si ha cambiado lo que hay: tocar el DOM por gusto en
     cada cuadro es la forma más fácil de que una escena que va a
     sesenta se ponga a treinta. */
  const firma = quiere.join(",") + "|" + (bolsa.enMano || "");
  if (firma === elBolsa.dataset.firma) return;
  elBolsa.dataset.firma = firma;

  elBolsa.textContent = "";
  for (const id of quiere) {
    const b = document.createElement("button");
    b.className = "ne-hueco" + (bolsa.enMano === id ? " is-mano" : "");
    b.type = "button";
    b.setAttribute("aria-label",
      id === "pala" ? "Pala" : id === "escopeta" ? "Escopeta" : "Reliquia");
    b.setAttribute("aria-pressed", String(bolsa.enMano === id));
    const cv = document.createElement("canvas");
    pintarIconoObjeto(cv, id, 34);
    b.append(cv);
    b.addEventListener("click", () => {
      /* La escopeta no se equipa ni se guarda: se usa. Tocarla en la
         bolsa, en el bosque y con todo en calma, vuelve a llamarlos.
         Sin esto la cacería sería de una sola vez en la vida, porque el
         arma desaparece del suelo en cuanto la recoges. */
      if (id === "escopeta") {
        if (escena === "espesura" && caza.fase === "no" && !bloqueado) {
          decir(A * 0.5, H * 0.56, CONF.caza.otraVez, { dur: 3 });
          setTimeout(() => arrancarCaceria(), 1400);
        }
        golpe(0.04, 1400, 0.12, "bandpass");
        return;
      }
      bolsa.alterna(id);
      golpe(0.03, bolsa.enMano === id ? 1800 : 900, 0.09, "bandpass");
      refrescarBolsa();
      if (escena === "espesura") {
        decir(A * 0.5, H * 0.62,
          bolsa.enMano === id ? CONF.espesura.palaEquipada : CONF.espesura.palaGuardada,
          { dur: 2 });
      }
    });
    elBolsa.append(b);
  }
}

/** Cuántos secretos del bosque llevas encontrados, de los que hay. */
const SECRETOS_DEL_BOSQUE = [
  "equis", "pala", "misterio", "revelado", "buho", "enjambre",
  "relojBosque", "escopeta", "caceria",
];

function refrescarHallado() {
  const total = SECRETOS_DEL_BOSQUE.length;
  let n = 0;
  for (const id of SECRETOS_DEL_BOSQUE) {
    if (historia.hecho(id)) n++;
  }
  const b = elHallado.querySelector("b");
  const txt = `${n}/${total}`;
  if (b.textContent !== txt) b.textContent = txt;
}

/* ---- El aviso ------------------------------------------------------------ */

let relojAviso = null;

function avisoObjeto(id, texto) {
  pintarIconoObjeto(elAvisoIco, id, 44);
  elAvisoTxt.textContent = texto;
  elAviso.classList.add("is-ver");
  elAviso.setAttribute("aria-hidden", "false");
  refrescarBolsa();
  clearTimeout(relojAviso);
  relojAviso = setTimeout(() => {
    elAviso.classList.remove("is-ver");
    elAviso.setAttribute("aria-hidden", "true");
  }, 1900);
}

/* ==========================================
   EL VIAJE AL BOSQUE
   ==========================================

   Del claro a la espesura no se llega cambiando de pantalla: se llega
   ANDANDO.

   ── POR QUÉ HAY QUE DECIDIRLO ────────────────────────────────────────
   Porque un sitio al que te llevan no es un sitio al que has ido. El
   sendero está ahí desde el principio, a la izquierda de la fogata,
   apenas insinuado entre dos troncos. Se ve si se mira. Y hasta que no
   se toca, no pasa nada.

   ── QUÉ HACE QUE SE SIENTA UNA CAMINATA ──────────────────────────────
   Cinco cosas a la vez, y hacen falta las cinco:

     1. la cámara SE METE —zoom y desplazamiento hacia el hueco—;
     2. la escena se apaga por delante, no de golpe;
     3. cruzan hojas y motas a toda velocidad, cada vez más deprisa:
        eso es lo que dice «me estoy moviendo»;
     4. el sonido cruza —la fogata se va, el bosque llega—, y no se
        corta ni un instante;
     5. y dura. Tres segundos largos. Una caminata de medio segundo es
        un corte con adornos.                                        */

const sendero = {
  /* Dónde está, en el claro. A la izquierda, lejos de la cabaña. */
  x: 0, y: 0, r: 0,
  brillo: 0,
  /* El estado del viaje: 0 quieto, si no, segundos desde que arrancó. */
  fase: -1,
  hacia: "espesura",
  /* Cuánto corre lo que cruza por delante. */
  prisa: 0,
};

function colocarSendero() {
  /* No pegado al canto: a 0.085 del ancho, en un móvil el hueco caía
     a treinta píxeles del borde, justo donde el pulgar va a tientas y
     donde el librito escucha los barridos de pasar página. */
  sendero.x = A * 0.125;
  sendero.y = mez(sitio.horizonte, sitio.suelo, 0.72);
  sendero.r = U * (apaisado ? 8 : 10);
}

/**
 * El hueco entre los árboles por el que se va.
 *
 * Se dibuja en el claro, entre la banda de en medio y la de cerca: por
 * delante de los árboles de fondo —para que se vea el hueco— y por
 * detrás de los troncos que enmarcan, para que se lea como algo que
 * está METIDO en el bosque y no pegado en la pantalla.
 */
function dibujarSendero() {
  if (escena !== "bosque") return;
  const d = desplazar(1.726);
  const x = sendero.x + d.x, y = sendero.y + d.y;
  const r = sendero.r;
  const k = sendero.brillo;

  /* La oscuridad del hueco: más negra que el bosque de alrededor. Un
     camino de noche no es una luz, es un agujero. */
  const gh = ctx.createRadialGradient(x, y - r * 0.3, 0, x, y - r * 0.3, r * 1.6);
  gh.addColorStop(0, "rgba(1,2,4,0.9)");
  gh.addColorStop(0.6, "rgba(2,4,8,0.55)");
  gh.addColorStop(1, "rgba(2,4,8,0)");
  ctx.fillStyle = gh;
  ctx.beginPath();
  ctx.ellipse(x, y - r * 0.3, r * 1.6, r * 1.9, 0, 0, 6.283);
  ctx.fill();

  /* Las piedras del camino, alejándose y juntándose. La perspectiva la
     hacen ellas solas: cada vez más pequeñas y más cerca entre sí. */
  for (let i = 0; i < 7; i++) {
    const t = i / 6;
    const py = y + r * mez(1.1, -0.5, t);
    const sep = r * mez(0.85, 0.12, t * t);
    const s = U * mez(1.9, 0.45, t);
    const il = fuego.brillo * mez(0.5, 0.06, t) + k * 0.25 * (1 - t);
    ctx.fillStyle = `rgb(${Math.round(mez(26, 116, il))},${Math.round(mez(26, 100, il))},${Math.round(mez(28, 78, il))})`;
    for (const lado of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(x + lado * sep + Math.sin(i * 3.1) * U * 0.6, py, s, s * 0.5, 0, 0, 6.283);
      ctx.fill();
    }
  }

  /* Dos luciérnagas verdes metidas en el hueco, muy al fondo. Son la
     única pista de que ahí dentro hay algo, y no se explican. */
  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 2; i++) {
    const a = reloj * (0.4 + i * 0.25) + i * 3;
    const lx = x + Math.sin(a) * r * 0.45;
    const ly = y - r * 0.5 + Math.cos(a * 0.8) * r * 0.3;
    const br = Math.pow(clamp01(0.5 + 0.5 * Math.sin(reloj * (0.7 + i * 0.4) + i * 2)), 2.2);
    const gg = ctx.createRadialGradient(lx, ly, 0, lx, ly, U * 3);
    gg.addColorStop(0, `rgba(170,255,205,${0.5 * br})`);
    gg.addColorStop(1, "rgba(60,220,140,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(lx, ly, U * 3, 0, 6.283); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";

  /* El aro de «se puede ir». A trazos y desvaneciéndose por arriba,
     como el de la cabaña: un óvalo continuo se lee como un objeto. */
  const pulso = 0.1 + 0.06 * Math.sin(reloj * 1.5) + k * 0.3;
  ctx.lineWidth = 1.3;
  ctx.lineCap = "round";
  for (let i = 0; i < 22; i++) {
    const a0 = (i / 22) * 6.283 + reloj * 0.1;
    const a1 = a0 + 6.283 / 22 * 0.44;
    const abajo = clamp01(0.25 + Math.sin(a0) * 0.75);
    ctx.strokeStyle = `rgba(168,232,198,${pulso * abajo})`;
    ctx.beginPath();
    ctx.ellipse(x, y - r * 0.1, r * 0.95, r * 1.15, 0, a0, a1);
    ctx.stroke();
  }
}

/** El viaje: se llama desde el toque en el claro. */
function irALaEspesura() {
  if (bloqueado || escena !== "bosque") return;
  bloqueado = true;
  historia.marcar("sendero");
  sendero.fase = 0;
  sendero.hacia = "espesura";
  sendero.prisa = 0;
  /* El sonido empieza a cruzar YA: si esperase al final, el cambio de
     ambiente se oiría como un corte. */
  cruzarAmbientes("espesura", 3.2);
}

/** Y la vuelta, por el mismo camino y con la misma caminata. */
function volverAlClaro() {
  if (bloqueado || escena !== "espesura") return;
  /* Irse en mitad de la cacería es una salida legítima —el botón está
     ahí y no se va a esconder—, pero el bosque tiene que quedar como
     estaba: sin lluvia pendiente, sin penumbra y sin búhos a medio
     camino esperando en una escena que ya no existe. */
  if (caza.fase !== "no") limpiarCaceria(true);
  bloqueado = true;
  sendero.fase = 0;
  sendero.hacia = "bosque";
  sendero.prisa = 0;
  cruzarAmbientes("bosque", 2.6);
}

/**
 * Cruzar el ambiente sonoro de un sitio al otro.
 *
 * No apaga y enciende: SUBE unos mientras BAJA otros, cada uno con su
 * propio destino. Por eso no hay ningún instante de silencio, que es lo
 * que delataría el cambio de escena.
 */
function cruzarAmbientes(destino, seg) {
  const aEspesura = destino === "espesura";
  const objetivos = aEspesura
    ? { fogata: 0, grillos: 0.22, aire: 0.5, bosque: 0.6, lluvia: null, relampagos: null }
    : { fogata: 0.55, grillos: 0.4, aire: 0.3, bosque: 0.2, lluvia: null, relampagos: null };

  for (const piedra of panel.piedras) {
    const obj = objetivos[piedra.conf.id];
    if (obj === null || obj === undefined) continue;
    /* Un ambiente que estaba apagado se enciende si el sitio nuevo lo
       pide, y al revés. Lo que el jugador haya tocado a mano se
       respeta en volumen relativo, no en el hecho de sonar. */
    const quiere = obj > 0.02;
    if (quiere && !piedra.on) { piedra.on = true; ambiente(piedra.conf.id, true, obj); }
    piedra.vol = obj;
    if (piedra.on) volumen(piedra.conf.id, obj);
    if (!quiere && piedra.on) { piedra.on = false; ambiente(piedra.conf.id, false, 0); }
  }
  sincronizarClima();
  void seg;
}

/* ---- La caminata, cuadro a cuadro --------------------------------------- */

function moverViaje(dt) {
  if (sendero.fase < 0) {
    sendero.brillo = damp(sendero.brillo, 0, 3, dt);
    return;
  }
  const t = sendero.fase += dt;
  const aEspesura = sendero.hacia === "espesura";
  const DUR = suaveMovimiento ? 1.2 : 3.4;

  /* La prisa sube hasta la mitad y baja: se arranca a andar, se cruza,
     y se llega parando. Un desplazamiento a velocidad constante se ve
     como una cinta transportadora. */
  sendero.prisa = Math.sin(clamp01(t / DUR) * Math.PI);

  /* 1. La cámara se mete en el hueco. */
  if (aEspesura) {
    const k = suave3(clamp01(t / (DUR * 0.7)));
    cam.oz = mez(1, 2.6, k);
    cam.ox = (A * 0.5 - sendero.x) * k * 2.2;
    cam.oy = (H * 0.5 - sendero.y) * k * 1.6;
  } else {
    const k = suave3(clamp01(t / (DUR * 0.7)));
    cam.oz = mez(1, 1.8, k);
  }

  /* 2. Se apaga por delante, y no de golpe: la mitad del viaje está a
     oscuras, que es cuando se cambia de sitio sin que se note. */
  const oscuro = clamp01((t - DUR * 0.25) / (DUR * 0.3));
  const aclara = clamp01((t - DUR * 0.62) / (DUR * 0.32));
  cine.velo = clamp01(oscuro - aclara);

  /* 3. El cambio de escena, justo en el negro. */
  if (!sendero.hecho && cine.velo > 0.96) {
    sendero.hecho = true;
    /* Las partículas del sitio que se deja NO se vienen. El humo de la
       fogata flotando en mitad de la espesura se ve como una mancha
       gris que nadie sabe de dónde salió. */
    limpiarParticulas();
    if (aEspesura) {
      escena = "espesura";
      raiz.classList.add("is-espesura");
      construirEspesura();
      /* Se entra por la izquierda, que es por donde se ha venido. */
      espesura.x = 0; espesura.vx = 0;
      historia.marcar("espesura");
      puntos.dichos.clear();
    } else {
      escena = "bosque";
      raiz.classList.remove("is-espesura");
    }
    cam.oz = 1; cam.ox = 0; cam.oy = 0;
    cam.z = 1; cam.x = 0; cam.y = 0;
  }

  /* 4. Lo que cruza por delante: hojas, motas y lucecitas. Cuanto más
     deprisa se anda, más y más rápidas. */
  const cuantas = dt * (aEspesura ? 90 : 55) * sendero.prisa;
  for (let i = 0; i < cuantas; i++) {
    const desde = Math.random() < 0.5 ? -U * 6 : A + U * 6;
    const haciaDentro = desde < 0 ? 1 : -1;
    const verde = Math.random() < (aEspesura ? 0.28 : 0.08);
    soltar(desde, azar(0, H), {
      vx: haciaDentro * azar(120, 420) * (0.4 + sendero.prisa),
      vy: azar(-60, 90),
      vida: azar(0.5, 1.4),
      tam: verde ? azar(1, 2.4) : U * azar(0.3, 0.9),
      tipo: verde ? TIPO.BRILLO : TIPO.HOJA,
      giro: azar(0, 6.283), giroV: azar(-6, 6),
      tono: verde ? 0.45 : Math.random(),
    });
  }

  /* 5. Y los pasos. Cinco, repartidos por la caminata, cada uno un poco
     distinto: la tierra no suena igual dos veces. */
  const pasos = Math.floor((t / DUR) * 6);
  if (pasos !== sendero.pasosDados) {
    sendero.pasosDados = pasos;
    if (pasos > 0 && pasos <= 6 && !suaveMovimiento) {
      golpe(0.1, azar(180, 340), azar(0.1, 0.17), "lowpass");
      golpe(0.05, azar(1800, 3200), 0.04, "highpass");
    }
  }

  /* 6. Y se acaba. */
  if (t >= DUR) {
    sendero.fase = -1;
    sendero.hecho = false;
    sendero.pasosDados = -1;
    cine.velo = 0;
    cam.oz = 1; cam.ox = 0; cam.oy = 0;
    bloqueado = false;
    if (aEspesura) {
      decir(A * 0.5, H * 0.4, CONF.espesura.alLlegar, { mimo: true, importante: true, dur: 4 });
    } else {
      decir(A * 0.5, H * 0.4, CONF.espesura.volver, { dur: 3 });
    }
  } else if (t > DUR * 0.34 && t < DUR * 0.42 && !sendero.dicho) {
    sendero.dicho = true;
    setTimeout(() => { sendero.dicho = false; }, 100);
  }
}

// ==========================================
// LA ESPESURA
// ==========================================
//
// El bosque de dentro. No es el claro con más árboles: es otro sitio,
// y tiene que sentirse como otro sitio desde el primer cuadro.
//
// ── QUÉ LO HACE OTRO SITIO ───────────────────────────────────────────
//   · No hay fogata. La única luz es la luna colándose entre las copas
//     y lo que brille por su cuenta.
//   · No se ve el cielo entero: arriba hay copas, no estrellas.
//   · Y SE ANDA. El claro cabe en una pantalla; esto mide tres, y para
//     ver la tercera hay que ir.
//
// ── POR QUÉ SE ARRASTRA PARA ANDAR ───────────────────────────────────
// Porque es lo único que funciona igual con el pulgar y con el ratón, y
// porque el gesto es el mismo que apartar una rama. Se le pone inercia
// y un freno: sueltas y sigues un poco, que es lo que hace que el
// bosque tenga peso en vez de ir pegado al dedo.
//
// Los bordes NO rebotan: se acaban. Un rebote elástico en el canto de
// un bosque dice «esto es una lista»; un tope seco dice «hasta aquí
// llega».
//
// ── LAS CAPAS ────────────────────────────────────────────────────────
// Seis, cada una con su factor: el fondo casi no se mueve y las ramas
// de delante se van a toda velocidad. Eso, más la NIEBLA que se mete
// entre ellas y la luz que reciben, es toda la profundidad. Las de
// atrás no son árboles pequeños: son árboles TRAGADOS.

const ESP = {
  /* Lo ancho que es el mundo, en pantallas. */
  ancho: 3.1,
  /* Las bandas de árboles, de la más lejana a la más cercana. */
  bandas: [
    /* Anchos y no estacas: con `ancho` a un par de unidades salía una
       valla de picos, no un bosque. Un abeto visto de lejos es casi tan
       ancho como alto por abajo. */
    { n: 46, nFlojo: 24, alto: [18, 40], ancho: [3.2, 6.0], niebla: 0.88, z: 0.10, toca: false },
    { n: 34, nFlojo: 18, alto: [30, 62], ancho: [4.6, 8.4], niebla: 0.62, z: 0.26, toca: false },
    { n: 24, nFlojo: 13, alto: [46, 88], ancho: [6.4, 11], niebla: 0.34, z: 0.52, toca: true  },
    { n: 12, nFlojo: 7,  alto: [80, 150], ancho: [9, 15],  niebla: 0.10, z: 1.0,  toca: true  },
  ],
  /* Los troncos de primerísimo plano, que enmarcan y tapan. */
  /* Pocos y anchos. Con siete finos, la pantalla se llenaba de postes
     rectos y parecía un tendido eléctrico; con cuatro gruesos, son los
     troncos entre los que se anda. */
  marco: { n: 4, z: 2.1 },
  /* Cuántas luciérnagas verdes flotan por ahí. */
  luces: 26, lucesFlojo: 12,
};

const espesura = {
  /* La cámara, en píxeles de mundo. */
  x: 0, vx: 0,
  /* El arrastre en curso. */
  agarre: null,
  /* Lo construido. */
  arboles: [], marco: [], luces: [], bruma: [], suelo: [], raices: [],
  /* Cuánto tira a verde todo el sitio. Sube al desenterrar el misterio
     y es lo que hace que el bosque «sepa» lo que ha pasado. */
  verde: 0, verdeObj: 0,
  /* El pulso del misterio, que recorre el bosque de golpe. */
  onda: 0, ondaX: 0,
  /* Lo ancho que es el mundo en píxeles, y hasta dónde llega la cámara. */
  W: 0, tope: 0,
};

function construirEspesura() {
  sembrar(31415926);
  const W = espesura.W = A * ESP.ancho;
  espesura.tope = Math.max(0, W - A);
  espesura.x = clamp(espesura.x, 0, espesura.tope);

  const suelo = H * (apaisado ? 0.78 : 0.82);
  espesura.sueloY = suelo;
  espesura.copasY = H * (apaisado ? 0.2 : 0.16);

  /* ---- LOS ÁRBOLES -------------------------------------------------

     ── POR QUÉ NO SE REPARTEN A DISTANCIAS IGUALES ──────────────────
     Porque un bosque no crece así. Antes cada árbol salía en `i/n` del
     mundo con un poco de temblor encima, y eso da un PEINE: mires
     donde mires, los troncos están a la misma distancia unos de otros.
     Se nota aunque no se sepa qué es lo que se está notando.

     Un bosque de verdad va a MATAS. Donde cayó luz hay cuatro juntos;
     donde cayó un árbol viejo, un claro. Así que primero se eligen unos
     cuantos centros de mata repartidos a lo bruto, y luego cada árbol
     sale cerca de uno de ellos, con la probabilidad cayendo hacia
     fuera. De ahí salen solos los claros y los grupos.

     ── Y POR QUÉ SE COMPRUEBA LA SEPARACIÓN ─────────────────────────
     Porque dos árboles que crecen en el mismo sitio no existen: se
     habrían matado entre ellos. Sin comprobarlo, la distribución por
     matas amontona dos o tres troncos en el mismo punto y lo que se ve
     es una mancha con ramas saliendo por todos lados.

     ── Y LA BASE VA EN EL SUELO ─────────────────────────────────────
     El suelo de cada banda tiembla un poco —el terreno no es una mesa—
     pero el árbol se apoya EN ÉL, no a treinta píxeles por encima. El
     temblor sale de una onda, no de un azar por árbol: con azar por
     árbol, dos vecinos podían acabar a distinta altura sin que hubiera
     ninguna loma que lo explicara.                                  */
  espesura.arboles = [];
  /* El relieve del terreno: dos ondas que no cuadran entre ellas. */
  const relieve = (x) => Math.sin(x * 0.0021) * H * 0.02
                       + Math.sin(x * 0.0057 + 1.7) * H * 0.012;
  espesura.relieve = relieve;

  ESP.bandas.forEach((banda, iB) => {
    const n = flojo ? banda.nFlojo : banda.n;
    /* Las matas: una cada cinco árboles, más o menos. */
    const nMatas = Math.max(3, Math.round(n / 5));
    const matas = [];
    for (let i = 0; i < nMatas; i++) {
      matas.push((i + azar(-0.35, 0.35)) / nMatas * W * 1.06 - W * 0.03);
    }
    const puestos = [];
    const baseBanda = mez(suelo - H * 0.17, suelo + H * 0.05, iB / 3);
    /* Cuánto tienen que separarse, en anchos de árbol. Los de lejos
       pueden estar más juntos: se solapan y no pasa nada, porque a esa
       distancia lo que se ve es masa. */
    const hueco = U * banda.ancho[1] * mez(0.5, 1.3, iB / 3);

    for (let i = 0; i < n; i++) {
      /* De qué mata sale, y cuánto se aparta de ella. */
      let x = 0;
      for (let intento = 0; intento < 12; intento++) {
        const m = matas[Math.floor(rnd() * matas.length)];
        /* Dos azares sumados: eso ya no es una caja, es una campana, y
           una campana amontona cerca del centro. */
        x = m + (azar(-1, 1) + azar(-1, 1)) * W * 0.055;
        let vale = true;
        for (const px of puestos) {
          if (Math.abs(px - x) < hueco) { vale = false; break; }
        }
        if (vale) break;
      }
      puestos.push(x);

      const alto = U * azar(banda.alto[0], banda.alto[1]);
      const ancho = U * azar(banda.ancho[0], banda.ancho[1]);
      const abeto = rnd() < (iB < 2 ? 0.7 : 0.42);
      espesura.arboles.push({
        banda: iB,
        x,
        /* Apoyado en el terreno de su banda, y ni un píxel flotando. */
        base: baseBanda + relieve(x) * mez(0.4, 1, iB / 3),
        alto, ancho,
        f: rnd() * 6.283,
        abeto,
        sac: 0, sacV: 0, toques: 0,
        tinte: azar(-0.5, 0.5),
        /* ---- La forma, que es de este árbol y de ningún otro ---- */
        /* Cuántos pisos de ramas tiene el pino, y cuánto caen. */
        pisos: Math.round(azar(8, 13)),
        caida: azar(0.12, 0.32),
        /* Cuánto se ladea el tronco. Ninguno crece recto del todo. */
        ladeo: azar(-0.08, 0.08),
        /* Y los bultos de la copa de los de hoja, cada uno a lo suyo. */
        bultos: Array.from({ length: Math.round(azar(6, 11)) }, () => ({
          a: rnd() * 6.283,
          d: azar(0.15, 0.85),
          r: azar(0.3, 0.62),
        })),
        /* Las raíces: cuántas y cómo se abren. */
        raices: Math.round(azar(3, 5)),
        raizF: rnd() * 6.283,
      });
    }
  });
  espesura.arboles.sort((a, b) => (a.banda - b.banda) || (a.base - b.base));

  /* ---- Los troncos del marco ----
     Cruzan la pantalla enteros, de arriba abajo, y van a más velocidad
     que nada. Son los que dan la sensación de estar METIDO entre los
     árboles y no mirándolos desde fuera. */
  espesura.marco = [];
  for (let i = 0; i < ESP.marco.n; i++) {
    espesura.marco.push({
      x: (i + azar(-0.3, 0.3)) / ESP.marco.n * W * ESP.marco.z,
      ancho: U * azar(4.5, 9),
      /* Cuánto se estrecha de abajo arriba. Un tronco recto es un
         poste; uno que se afina es un árbol. */
      afina: azar(0.55, 0.82),
      /* La corteza: seis surcos en sitios fijos. */
      surcos: Array.from({ length: 6 }, () => ({
        x: azar(-0.8, 0.8), y0: rnd(), largo: azar(0.1, 0.35), gr: azar(0.3, 0.9),
      })),
      incl: azar(-0.13, 0.13),
      f: rnd() * 6.283,
      /* Las ramas que salen de él y cruzan por arriba. */
      ramas: Array.from({ length: 3 }, () => ({
        y: azar(0.05, 0.5), lado: rnd() < 0.5 ? -1 : 1,
        largo: azar(0.3, 0.9), caida: azar(0.1, 0.5),
      })),
    });
  }

  /* ---- Las luciérnagas ----
     Verdes, lentísimas, cada una con su órbita. Son lo único vivo que
     se ve siempre, y sin ellas el bosque está muerto. */
  espesura.luces = [];
  const nL = flojo ? ESP.lucesFlojo : ESP.luces;
  for (let i = 0; i < nL; i++) {
    espesura.luces.push({
      x: rnd() * W,
      y: mez(espesura.copasY, suelo, azar(0.25, 1)),
      r: U * azar(0.28, 0.7),
      z: azar(0.3, 1.2),
      f: rnd() * 6.283,
      vel: azar(0.25, 0.8),
      radio: U * azar(2, 7),
      /* Cuánto tarda en apagarse y encenderse. Una luciérnaga que
         brilla continuo es una bombilla. */
      ritmo: azar(0.35, 1.1),
      fase: rnd() * 6.283,
    });
  }

  /* ---- La niebla, en bandas ---- */
  espesura.bruma = [];
  for (let i = 0; i < 6; i++) {
    espesura.bruma.push({
      y: mez(espesura.copasY + H * 0.1, suelo + H * 0.02, i / 5),
      alto: H * azar(0.05, 0.13),
      z: mez(0.1, 0.8, i / 5),
      v: azar(0.004, 0.016) * (rnd() < 0.5 ? -1 : 1),
      f: rnd() * 6.283,
      op: azar(0.3, 0.75),
    });
  }

  /* ---- El suelo: matas, raíces y piedras ---- */
  espesura.suelo = [];
  for (let i = 0; i < (flojo ? 60 : 130); i++) {
    const d = rnd();
    espesura.suelo.push({
      x: rnd() * W,
      y: suelo + H * azar(-0.01, 0.13),
      /* Y setas, que antes no había. Son lo que hace que un suelo de
         bosque de noche se lea como un suelo de bosque y no como una
         alfombra: algo que da luz propia y está a ras del piso. */
      tipo: d < 0.5 ? "hierba" : d < 0.72 ? "mata" : d < 0.88 ? "piedra" : "seta",
      s: U * azar(1, 4),
      f: rnd() * 6.283,
      tinte: azar(0, 1),
      /* Lo que aporta cada cosa al tocarla. */
      pulso: 0, veces: 0,
    });
  }
  /* ---- La piedra marcada ----
     Una sola, de todas, lleva una flecha rayada apuntando al fondo del
     bosque. Es la única pista que hay de que allá al final haya algo,
     y hay que tropezarse con ella: no brilla, no suena y no avisa. */
  const piedras = espesura.suelo.filter((z) => z.tipo === "piedra");
  if (piedras.length) {
    const marcada = piedras[Math.floor(rnd() * piedras.length)];
    marcada.marcada = true;
    marcada.s = Math.max(marcada.s, U * 3);
  }
  espesura.suelo.sort((a, b) => a.y - b.y);

  /* ---- Los charcos ----
     Están siempre, pero secos no se ven: sólo aparecen cuando llueve,
     que es exactamente lo que hacen los charcos. Y reflejan. */
  espesura.charcos = [];
  for (let i = 0; i < (flojo ? 5 : 11); i++) {
    espesura.charcos.push({
      x: rnd() * W,
      y: suelo + H * azar(0.04, 0.12),
      rx: U * azar(4, 11),
      f: rnd() * 6.283,
      onda: 0,
      /* Uno de cada tantos enseña algo que no está ahí. */
      raro: rnd() < 0.25,
    });
  }

  /* ---- Las raíces que cruzan el camino ---- */
  espesura.raices = [];
  for (let i = 0; i < 9; i++) {
    espesura.raices.push({
      x: rnd() * W,
      y: suelo + H * azar(0.02, 0.1),
      largo: U * azar(10, 26),
      grueso: U * azar(0.5, 1.4),
      comba: azar(-0.5, 0.5),
    });
  }

  construirPuntos();
  /* El búho se coloca DESPUÉS de los puntos: su sitio es uno de ellos.
     Sin esta línea se quedaba en el origen con radio cero, o sea
     invisible, y no había manera de encontrarlo ni de que atacara. */
  colocarBuhoEsp();
}

/* ---- Andar --------------------------------------------------------------
   La cámara se mueve con el dedo y sigue un poco al soltar. Nada de
   muelles ni de rebotes: velocidad, rozamiento y dos topes secos.    */

function moverEspesura(dt) {
  if (!espesura.agarre) {
    espesura.x += espesura.vx * dt;
    /* Rozamiento exponencial: frena igual a sesenta que a ciento veinte
       fotogramas, que es lo que no hace un `v *= 0.95`. */
    espesura.vx *= Math.exp(-3.4 * dt);
    if (Math.abs(espesura.vx) < 1) espesura.vx = 0;
  }
  if (espesura.x < 0) { espesura.x = 0; espesura.vx = 0; }
  if (espesura.x > espesura.tope) { espesura.x = espesura.tope; espesura.vx = 0; }

  espesura.verde = damp(espesura.verde, espesura.verdeObj, 0.9, dt);
  espesura.onda = Math.max(0, espesura.onda - dt * 0.55);

  /* Lo que se ha tocado, volviendo a su sitio. */
  for (const z of espesura.suelo) if (z.pulso > 0) z.pulso = Math.max(0, z.pulso - dt * 2.4);
  for (const c of espesura.charcos || []) if (c.onda > 0) c.onda = Math.max(0, c.onda - dt * 1.3);
  moverRuidosLejanos(dt);

  moverArbolesEspesura(dt);
  moverPuntos(dt);
}

/* ---- LO QUE SE OYE A LO LEJOS ------------------------------------------

   Cada tanto, un ruido. Una rama que se parte, algo pesado que se
   mueve, un ulular muy lejos. No se ve nada, no pasa nada y no se
   puede ir a mirar.

   ── POR QUÉ NO HAY NADA QUE MIRAR ────────────────────────────────────
   Porque un ruido con una causa visible deja de ser inquietante en el
   mismo instante en que se ve la causa. Lo que hace que un bosque dé
   respeto no es lo que hay: es que se oiga algo y no se sepa qué.

   Van siempre por un lado —izquierda o derecha— y con el volumen bajo,
   que es lo que dice «lejos» sin decirlo.                            */

const lejos = { reloj: azar(14, 30) };

function moverRuidosLejanos(dt) {
  if (bloqueado || caza.fase !== "no") return;
  lejos.reloj -= dt;
  if (lejos.reloj > 0) return;
  lejos.reloj = azar(22, 52);

  const cual = Math.floor(Math.random() * 4);
  if (cual === 0) {
    /* Una rama que se parte: un golpe seco y corto. */
    golpe(0.05, azar(900, 1600), 0.06, "bandpass");
    setTimeout(() => golpe(0.1, azar(300, 500), 0.04, "lowpass"), 90);
  } else if (cual === 1) {
    /* Algo pesado moviéndose entre la hojarasca. */
    for (let i = 0; i < 5; i++) {
      setTimeout(() => golpe(0.09, azar(2000, 4000), 0.018, "highpass"), i * azar(110, 240));
    }
  } else if (cual === 2) {
    /* Un ulular lejanísimo: dos notas que bajan. */
    tono(azar(300, 360), 0.5, "sine", 0.018);
    setTimeout(() => tono(azar(230, 270), 0.7, "sine", 0.015), 380);
  } else {
    /* Y lo peor: un crujido largo, de tronco. */
    for (let i = 0; i < 8; i++) {
      setTimeout(() => golpe(0.04, azar(180, 420), 0.016, "lowpass"), i * azar(60, 150));
    }
  }
}

/* El mismo muelle amortiguado que los árboles del claro, y por el mismo
   motivo: una sacudida rígida se ve como una animación, y un muelle se
   ve como un árbol. Paso fijo, que si no explota. */
const PASO_ESP = 1 / 120;
let sobraEsp = 0;

function moverArbolesEspesura(dtReal) {
  sobraEsp += dtReal;
  let pasos = 0;
  const k = CONF.bosque.muelleK, c = CONF.bosque.muelleAmortigua;
  while (sobraEsp >= PASO_ESP && pasos < 8) {
    sobraEsp -= PASO_ESP; pasos++;
    for (const t of espesura.arboles) {
      if (t.sac === 0 && t.sacV === 0) continue;
      t.sacV += (-k * t.sac - c * t.sacV) * PASO_ESP;
      t.sac += t.sacV * PASO_ESP;
      if (Math.abs(t.sac) < 0.0004 && Math.abs(t.sacV) < 0.004) { t.sac = 0; t.sacV = 0; }
    }
  }
  if (pasos >= 8) sobraEsp = 0;
}

/** Dónde cae en pantalla algo que está en `xMundo`, a profundidad `z`. */
function enPantalla(xMundo, z) {
  return xMundo - espesura.x * z;
}

/* ---- Dibujar ------------------------------------------------------------ */

function dibujarEspesura(dt) {
  const suelo = espesura.sueloY;
  const verde = espesura.verde;

  /* ---- 1. EL FONDO ----
     No es cielo: es el bosque que sigue y sigue hasta que ya no se ve
     nada. Por eso el degradado acaba en negro y no en azul. */
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, mezColor("#16244a", "#123a2c", verde * 0.55));
  g.addColorStop(0.42, mezColor("#18305a", "#154a34", verde * 0.55));
  g.addColorStop(0.78, mezColor("#0e1c38", "#0e2c20", verde * 0.45));
  g.addColorStop(1, "#070d16");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, A, H);

  /* La luna, colada entre las copas: un resplandor difuso arriba a la
     izquierda, sin disco. Aquí no se ve la luna, se ve SU LUZ. */
  ctx.globalCompositeOperation = "lighter";
  const lx = enPantalla(A * 0.35, 0.06);
  haloOvalado(lx, -H * 0.05, A * 0.85, H * 0.6, [
    [0, `rgba(170,200,255,${0.3 + verde * 0.06})`],
    [0.4, `rgba(130,170,240,0.13)`],
    [1, "rgba(100,140,220,0)"],
  ]);
  /* Y un segundo haz, más abajo y más estrecho: la luz que se cuela
     entre dos copas. Sin él, la luz viene «de arriba» en general, y un
     bosque de noche tiene HACES, no iluminación ambiente. */
  haloOvalado(enPantalla(A * 1.55, 0.2), H * 0.2, A * 0.3, H * 0.75, [
    [0, `rgba(160,195,255,${0.12 + verde * 0.05})`],
    [1, "rgba(120,160,230,0)"],
  ]);
  ctx.globalCompositeOperation = "source-over";

  /* ---- 2. LAS BANDAS DE ÁRBOLES ---- */
  for (let b = 0; b < ESP.bandas.length; b++) {
    /* Primero la MASA: una copa continua que recorre toda la banda por
       detrás de los árboles sueltos. Es lo que convierte «unos cuantos
       árboles en fila» en «un bosque que sigue». Sin ella se ve el
       fondo entre tronco y tronco y el bosque tiene dos dedos de
       espesor. */
    dibujarMasaEsp(b);
    dibujarArbolesEsp(b);
    /* Niebla ENTRE las bandas, no encima de todas: es lo que las separa
       de verdad. Dos bandas sin niebla en medio son la misma banda con
       dos tamaños. */
    dibujarBrumaEsp(b / ESP.bandas.length, (b + 1) / ESP.bandas.length);
  }

  /* ---- 3. EL SUELO ---- */
  dibujarSueloEsp();

  /* ---- 4. LOS PUNTOS DE INTERÉS ---- */
  dibujarPuntos();

  /* ---- Lo que mira desde el fondo, y el que habla ----
     Los ojos van ANTES que el búho: están más lejos. */
  dibujarOjosEsp();
  dibujarBuhoEsp();

  /* ---- Y los que vienen a por ti ----
     Van por delante del búho y por detrás del marco de troncos: se te
     echan encima, pero siguen estando DENTRO del bosque. */
  dibujarCaceria();

  /* ---- 5. LAS LUCIÉRNAGAS ---- */
  dibujarLuces(dt);

  /* ---- 6. LAS PARTÍCULAS ---- */
  dibujarParticulas();

  /* ---- 6b. LA LLUVIA Y LOS RELÁMPAGOS ----
     Esto faltaba desde el primer día y no se notaba porque en el bosque
     nunca llovía. Ahora sí: la cacería abre el cielo, y si el agua no
     se pintara, lo único que pasaría al recoger la escopeta es que la
     pantalla se oscurece.

     Va después de las partículas y antes del marco de troncos: el agua
     cae por delante del bosque, pero por detrás de lo que tienes a dos
     palmos de la cara. */
  if (clima.lluvia > 0.01) dibujarLluvia();

  if (clima.destello > 0.01) {
    const kd = clima.destello;
    const gx = A * clima.destelloX;
    const gr2 = ctx.createRadialGradient(gx, -H * 0.15, 0, gx, -H * 0.15, H * 1.5);
    /* Más frío y más flojo que en el claro: aquí no hay cielo abierto,
       lo que llega es lo que se cuela entre las copas. */
    gr2.addColorStop(0, `rgba(196,216,255,${kd * 0.34})`);
    gr2.addColorStop(0.45, `rgba(170,196,255,${kd * 0.13})`);
    gr2.addColorStop(1, "rgba(160,190,255,0)");
    ctx.fillStyle = gr2;
    ctx.fillRect(0, 0, A, H);
  }

  /* ---- 7. EL MARCO DE DELANTE ----
     Troncos enteros cruzando la pantalla. Van casi negros porque no les
     llega nada de luz: lo que está pegado a la cámara en un bosque de
     noche es lo que menos se ve. */
  dibujarMarcoEsp();

  /* ---- 8. LA ONDA DEL MISTERIO ---- */
  if (espesura.onda > 0.01) {
    /* Un frente blando que se abre, no un aro de trazo. El aro se veía
       como una raya dibujada encima del bosque; esto se ve como luz
       pasando por delante. El corazón del degradado es transparente y
       sólo brilla el borde, así lo ya recorrido se queda limpio. */
    const k = 1 - espesura.onda;
    const ox = enPantalla(espesura.ondaX, 1);
    const rx = A * (0.15 + k * 1.5), ry = H * (0.08 + k * 0.75);
    ctx.globalCompositeOperation = "lighter";
    haloOvalado(ox, suelo - H * 0.06, rx, ry, [
      [0, "rgba(90,255,180,0)"],
      [0.74, `rgba(90,255,180,${espesura.onda * 0.18})`],
      [0.92, `rgba(150,255,210,${espesura.onda * 0.28})`],
      [1, "rgba(90,255,180,0)"],
    ]);
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---- 9. LA OSCURIDAD DE LOS CANTOS ----
     Más cerrada que en el claro: aquí hay que sentir que lo que no se
     ve es la mayor parte. */
  const gv = ctx.createRadialGradient(A * 0.5, H * 0.52, Math.min(A, H) * 0.2,
                                      A * 0.5, H * 0.52, Math.max(A, H) * 0.78);
  gv.addColorStop(0, "rgba(2,5,4,0)");
  gv.addColorStop(0.7, `rgba(2,5,4,${0.16 + verde * 0.05})`);
  gv.addColorStop(1, "rgba(1,3,2,0.72)");
  ctx.fillStyle = gv;
  ctx.fillRect(0, 0, A, H);
}

/**
 * La masa de una banda: una silueta continua de copas.
 *
 * Es una curva hecha con tres senos de frecuencias que no encajan —el
 * mismo truco que el fuego— rellenada hasta el suelo. Como los senos se
 * evalúan sobre la posición del MUNDO y no sobre la de la pantalla, la
 * masa se queda quieta respecto a los árboles al andar, y no se ve
 * deslizarse por detrás de ellos.
 */
function dibujarMasaEsp(banda) {
  const conf = ESP.bandas[banda];
  if (banda >= 3) return;                 // los de delante no tienen masa
  const verde = espesura.verde;
  const suelo = espesura.sueloY;
  const base = mez(suelo - H * 0.17, suelo + H * 0.05, banda / 3) + H * 0.02;
  const alto = U * mez(24, 62, banda / 3);

  const deLaLuna = 0.42 * (1 - conf.z * 0.62);
  const il = clamp01(deLaLuna * 0.7);
  const delVerde = verde * 0.3 * (1 - conf.z * 0.25);
  let r = mez(mez(8, 60, il), 48, conf.niebla);
  let g2 = mez(mez(18, 100, il), 72, conf.niebla);
  let b2 = mez(mez(22, 80, il), 98, conf.niebla);
  r = mez(r, 20, delVerde); g2 = mez(g2, 140, delVerde); b2 = mez(b2, 84, delVerde);

  ctx.fillStyle = `rgba(${Math.round(r)},${Math.round(g2)},${Math.round(b2)},0.85)`;
  ctx.beginPath();
  ctx.moveTo(-20, H + 10);
  const sem = banda * 137.5;
  for (let x = -20; x <= A + 20; x += 12) {
    const xm = (x + espesura.x * conf.z) * 0.013 + sem;
    const h = alto * (0.55
      + Math.sin(xm) * 0.22
      + Math.sin(xm * 2.7 + 1.3) * 0.14
      + Math.sin(xm * 5.1 + 2.6) * 0.09);
    ctx.lineTo(x, base - h);
  }
  ctx.lineTo(A + 20, H + 10);
  ctx.closePath();
  ctx.fill();
}

function dibujarArbolesEsp(banda) {
  const conf = ESP.bandas[banda];
  const verde = espesura.verde;
  const margen = A * 0.3;

  for (const t of espesura.arboles) {
    if (t.banda !== banda) continue;
    const x = enPantalla(t.x, conf.z);
    /* Fuera de la pantalla no se pinta. Con casi ciento sesenta árboles
       y tres pantallas de mundo, pintarlos todos sería pintar dos
       tercios para nadie. */
    if (x < -margen || x > A + margen) continue;

    const base = t.base;
    const brisa = Math.sin(reloj * 0.38 + t.f) * (0.35 + clima.viento * 0.55);
    const mece = (brisa * 0.011 + t.sac) * (0.4 + conf.z * 0.6);

    /* La luz: sólo la luna, y sólo por arriba. Más la que dé el verde
       del misterio, que sube desde el suelo. */
    /* La luz de la luna llega mucho más a los de lejos que a los de
       cerca: lo de lejos está a la altura de las copas, por donde entra
       la luz, y lo de cerca está abajo, a la sombra. */
    const deLaLuna = 0.42 * (1 - conf.z * 0.62);
    const delVerde = verde * 0.38 * (1 - conf.z * 0.25);
    const il = clamp01(deLaLuna + clima.destello * 0.4);

    /* El color, ya con la niebla mezclada encima: lo que hace que los
       de lejos estén medio disueltos en el fondo. La niebla es AZUL
       CLARA, no gris: mezclarla en gris apagaba el bosque entero y lo
       dejaba en color ceniza. */
    let r = mez(mez(10, 74, il), 52, conf.niebla);
    let g2 = mez(mez(22, 122, il), 78, conf.niebla);
    let b2 = mez(mez(26, 96, il), 104, conf.niebla);
    /* Y el tinte propio de cada árbol, para que no sean todos el mismo. */
    g2 += t.tinte * 12;
    r += t.tinte * 4;
    /* El verde del misterio entra por abajo. */
    r = mez(r, 24, delVerde); g2 = mez(g2, 168, delVerde); b2 = mez(b2, 96, delVerde);
    ctx.fillStyle = `rgb(${Math.round(r)},${Math.round(g2)},${Math.round(b2)})`;

    ctx.save();
    ctx.translate(x, base);
    ctx.rotate(mece + t.ladeo * 0.5);
    /* Las raíces van SIN el meneo del viento: lo que se mece es la
       copa, no lo que está enterrado. Por eso se pintan aparte, antes
       de aplicar el giro… que ya está aplicado, así que se deshace. */
    ctx.save();
    ctx.rotate(-(mece + t.ladeo * 0.5));
    raicesEsp(t);
    ctx.restore();
    if (t.abeto) pinoEsp(t);
    else frondosoEsp(t);
    ctx.restore();
  }
}

/**
 * LAS RAÍCES.
 *
 * ── POR QUÉ HACEN FALTA ──────────────────────────────────────────────
 * Porque un tronco que acaba en una línea recta contra el suelo no está
 * plantado: está apoyado. Tres o cuatro cuñas cortas abriéndose hacia
 * los lados y metiéndose un poco en la tierra, y el árbol pasa de estar
 * puesto encima del suelo a salir de él. Cuesta cuatro triángulos.
 */
function raicesEsp(t) {
  const w = t.ancho;
  for (let i = 0; i < t.raices; i++) {
    const u = (i + 0.5) / t.raices;
    /* Repartidas a los dos lados, y ninguna igual a la de al lado. */
    const lado = u < 0.5 ? -1 : 1;
    const sep = (Math.abs(u - 0.5) * 2) * 0.9 + 0.25;
    const largo = w * (0.5 + Math.sin(t.raizF + i * 2.1) * 0.25 + sep * 0.7);
    const grueso = w * (0.2 - sep * 0.08);
    ctx.beginPath();
    ctx.moveTo(-grueso, -w * 0.12);
    ctx.quadraticCurveTo(lado * largo * 0.6, -w * 0.1,
                         lado * largo, w * 0.18);
    ctx.quadraticCurveTo(lado * largo * 0.55, w * 0.02,
                         grueso, -w * 0.02);
    ctx.closePath();
    ctx.fill();
  }
}

/**
 * UN PINO.
 *
 * ── POR QUÉ NO ES UN CONO ────────────────────────────────────────────
 * Antes era una silueta de quince vértices en zigzag: el cono con
 * escalones de toda la vida. Visto una vez pasa; visto ciento veinte
 * veces seguidas, con los mismos escalones en las mismas proporciones,
 * lo que se ve es un patrón repetido, no un bosque.
 *
 * Un pino de verdad es un PALO con PISOS de ramas colgando, y cada piso
 * es más ancho que el de arriba. Así que eso es lo que se dibuja: el
 * tronco entero de abajo arriba, y encima N pisos —entre cinco y nueve,
 * distintos en cada árbol— con las puntas caídas. La caída también es
 * de cada árbol: unos tienen las ramas casi horizontales y otros las
 * tienen desplomadas.
 *
 * Y cada piso se desplaza un pelín a un lado según una onda que
 * depende del árbol, así que ninguno sale simétrico. La simetría es lo
 * que delata que algo lo ha dibujado una fórmula.
 */
function pinoEsp(t) {
  const w = t.ancho, h = t.alto;

  /* El tronco, de abajo arriba, afinando. */
  ctx.beginPath();
  ctx.moveTo(-w * 0.17, 0);
  ctx.quadraticCurveTo(-w * 0.08, -h * 0.5, -w * 0.035, -h * 0.94);
  ctx.lineTo(w * 0.035, -h * 0.94);
  ctx.quadraticCurveTo(w * 0.08, -h * 0.5, w * 0.17, 0);
  ctx.closePath();
  ctx.fill();

  /* Los pisos. El de abajo es el más ancho y el de arriba, casi la
     punta. */
  const pisos = t.pisos;
  for (let i = 0; i < pisos; i++) {
    const u = i / (pisos - 1);          // 0 abajo, 1 arriba
    const y = mez(-h * 0.1, -h * 0.96, u);
    /* El ancho cae deprisa al principio y despacio al final: eso es lo
       que da la silueta de pino y no la de triángulo. */
    const ancho = w * (1.3 - Math.pow(u, 0.72) * 1.16);
    /* Los pisos se SOLAPAN. Si cada uno midiera menos que lo que hay
       entre él y el siguiente, se verían los huecos y el pino saldría
       una espina con aletas. Solapados, la silueta se cierra. */
    const alto = h * mez(0.24, 0.1, u);
    /* El desplazamiento de este piso: ninguno centrado del todo. */
    const desv = Math.sin(t.f + i * 1.7) * ancho * 0.13;

    for (const lado of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(desv, y - alto * 0.55);
      /* Sale hacia fuera y CAE: el punto de la punta está más abajo
         que el arranque. */
      ctx.quadraticCurveTo(
        desv + lado * ancho * 0.62, y - alto * 0.2,
        desv + lado * ancho, y + alto * t.caida * 3.2);
      /* Y vuelve por debajo, más recogida: eso le da grosor a la rama
         sin tener que dibujarla dos veces. */
      ctx.quadraticCurveTo(
        desv + lado * ancho * 0.5, y + alto * 0.62,
        desv, y + alto * 0.5);
      ctx.closePath();
      ctx.fill();
    }
  }
  /* La punta. */
  ctx.beginPath();
  ctx.moveTo(0, -h);
  ctx.lineTo(-w * 0.1, -h * 0.9);
  ctx.lineTo(w * 0.1, -h * 0.9);
  ctx.closePath();
  ctx.fill();
}

/**
 * UN ÁRBOL DE HOJA.
 *
 * ── POR QUÉ NO SON CINCO BULTOS ──────────────────────────────────────
 * Porque cinco elipses repartidas en círculo dan una piruleta. Se veía
 * el círculo: los cinco bultos a la misma distancia del centro y con el
 * mismo tamaño alterno.
 *
 * Ahora son entre seis y once, cada uno con SU ángulo, SU distancia al
 * centro y SU tamaño, todo sorteado por árbol. El contorno que sale de
 * eso es irregular de verdad, que es como se ve una copa a contraluz.
 *
 * Y el tronco se bifurca: sube, se abre en dos, y de cada brazo salen
 * ramas más finas que se meten en la copa. Un tronco recto rematado en
 * una bola es un champiñón.
 */
function frondosoEsp(t) {
  const w = t.ancho, h = t.alto;

  /* El tronco hasta la horquilla. */
  const yH = -h * 0.34;
  ctx.beginPath();
  ctx.moveTo(-w * 0.2, 0);
  ctx.quadraticCurveTo(-w * 0.13, yH * 0.5, -w * 0.09, yH);
  ctx.lineTo(w * 0.09, yH);
  ctx.quadraticCurveTo(w * 0.13, yH * 0.5, w * 0.2, 0);
  ctx.closePath();
  ctx.fill();

  /* Los dos brazos, y de cada uno dos ramas. */
  ctx.save();
  ctx.lineCap = "round";
  ctx.strokeStyle = ctx.fillStyle;
  for (const lado of [-1, 1]) {
    const abre = 0.42 + Math.abs(Math.sin(t.f + lado)) * 0.3;
    const ex = lado * w * abre, ey = -h * 0.76;
    ctx.lineWidth = w * 0.13;
    ctx.beginPath();
    ctx.moveTo(lado * w * 0.05, yH);
    ctx.quadraticCurveTo(lado * w * 0.16, -h * 0.62, ex, ey);
    ctx.stroke();
    /* Las ramas finas. */
    ctx.lineWidth = w * 0.06;
    for (let j = 0; j < 2; j++) {
      const u = 0.45 + j * 0.35;
      const bx = mez(lado * w * 0.05, ex, u), by = mez(yH, ey, u);
      const dir = j % 2 ? 1 : -1;
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(bx + lado * w * 0.2, by - h * 0.08,
                           bx + lado * w * 0.3 + dir * w * 0.1, by - h * 0.14);
      ctx.stroke();
    }
  }
  ctx.restore();

  /* Y la copa: muchos bultos, cada uno a lo suyo.

     Los bultos se miden contra el ANCHO del árbol, no contra su alto.
     Contra el alto, un árbol de banda cercana —que mide seis veces más
     de alto que de ancho— sacaba bultos de ciento veinte píxeles de
     radio vertical, y los seis o diez se fundían en un único almendrón
     gigante. Una copa es ancha, no larga. */
  const cy = -h * 0.72;
  const radio = w * 1.3;
  for (const b of t.bultos) {
    const cx = Math.cos(b.a) * radio * b.d;
    const cyy = cy + Math.sin(b.a) * radio * b.d * 0.52;
    const rx = w * b.r * 1.1;
    ctx.beginPath();
    ctx.ellipse(cx, cyy, rx, rx * 0.74, b.a * 0.3, 0, 6.283);
    ctx.fill();
  }
}

function dibujarBrumaEsp(desde, hasta) {
  for (const b of espesura.bruma) {
    if (b.z < desde || b.z >= hasta) continue;
    const y = b.y + Math.sin(reloj * 0.2 + b.f) * H * 0.008;
    const desliz = (reloj * b.v * A) % (A * 2);
    const x = enPantalla(0, b.z) + desliz;
    const op = b.op * (0.5 + clima.lluvia * 0.5) * (0.6 + espesura.verde * 0.4);
    const col = espesura.verde > 0.1
      ? `${Math.round(mez(150, 110, espesura.verde))},${Math.round(mez(180, 230, espesura.verde))},${Math.round(mez(220, 190, espesura.verde))}`
      : "150,180,220";
    /* La banda va de canto a canto de la PANTALLA, y el desplazamiento
       sólo mueve su textura. Antes se pintaba un rectángulo de ancho
       fijo que se paseaba, y lo que se veía era una mancha gris
       cruzando el bosque. */
    const gg = ctx.createLinearGradient(0, y - b.alto, 0, y + b.alto);
    gg.addColorStop(0, `rgba(${col},0)`);
    gg.addColorStop(0.5, `rgba(${col},${0.14 * op})`);
    gg.addColorStop(1, `rgba(${col},0)`);
    ctx.fillStyle = gg;
    ctx.fillRect(-10, y - b.alto, A + 20, b.alto * 2);
    /* Y dos jirones que sí se mueven, para que la niebla no sea una
       franja plana. */
    for (let j = 0; j < 2; j++) {
      const jx = ((x + j * A * 0.6) % (A * 1.6)) - A * 0.3;
      const gj = ctx.createRadialGradient(jx, y, 0, jx, y, A * 0.3);
      gj.addColorStop(0, `rgba(${col},${0.08 * op})`);
      gj.addColorStop(1, `rgba(${col},0)`);
      ctx.fillStyle = gj;
      ctx.beginPath();
      ctx.ellipse(jx, y, A * 0.3, b.alto * 1.2, 0, 0, 6.283);
      ctx.fill();
    }
  }
}

function dibujarSueloEsp() {
  const suelo = espesura.sueloY;
  const verde = espesura.verde;

  /* La tierra. */
  const gs = ctx.createLinearGradient(0, suelo - H * 0.04, 0, H);
  gs.addColorStop(0, mezColor("#1d2a24", "#1e402c", verde * 0.7));
  gs.addColorStop(0.45, mezColor("#141d19", "#142c1e", verde * 0.6));
  gs.addColorStop(1, "#080d0a");
  ctx.fillStyle = gs;
  ctx.beginPath();
  ctx.moveTo(-10, H + 10);
  ctx.lineTo(-10, suelo);
  for (let x = -10; x <= A + 10; x += 18) {
    const xm = x + espesura.x;
    ctx.lineTo(x, suelo - Math.sin(xm * 0.004) * U * 2 - Math.sin(xm * 0.011) * U * 1.2);
  }
  ctx.lineTo(A + 10, H + 10);
  ctx.closePath();
  ctx.fill();

  /* ---- El sendero gastado ----
     Una franja de tierra pisada que recorre el bosque entero. Es lo que
     dice «por aquí se anda», y de paso rompe la alfombra verde plana
     que quedaba antes. */
  const gp2 = ctx.createLinearGradient(0, suelo + H * 0.03, 0, H);
  gp2.addColorStop(0, `rgba(${Math.round(mez(52, 60, verde))},${Math.round(mez(44, 66, verde))},${Math.round(mez(34, 44, verde))},0.55)`);
  gp2.addColorStop(1, "rgba(30,26,20,0.3)");
  ctx.fillStyle = gp2;
  ctx.beginPath();
  ctx.moveTo(-10, H + 10);
  for (let x = -10; x <= A + 10; x += 16) {
    const xm = x + espesura.x;
    ctx.lineTo(x, suelo + H * 0.05 + Math.sin(xm * 0.0032) * H * 0.02
                 + Math.sin(xm * 0.0091 + 2) * H * 0.012);
  }
  ctx.lineTo(A + 10, H + 10);
  ctx.closePath();
  ctx.fill();

  /* Las raíces que cruzan. */
  ctx.strokeStyle = `rgba(${Math.round(mez(22, 30, verde))},${Math.round(mez(26, 44, verde))},${Math.round(mez(22, 30, verde))},0.9)`;
  ctx.lineCap = "round";
  for (const r of espesura.raices) {
    const x = enPantalla(r.x, 1);
    if (x < -r.largo || x > A + r.largo) continue;
    ctx.lineWidth = r.grueso;
    ctx.beginPath();
    ctx.moveTo(x - r.largo * 0.5, r.y);
    ctx.quadraticCurveTo(x, r.y + r.comba * U * 4, x + r.largo * 0.5, r.y);
    ctx.stroke();
  }

  /* ---- Los charcos ----
     Van antes que la hierba y las piedras: el agua está en el suelo y
     todo lo demás crece encima de ella. Con la tierra seca no existen;
     conforme llueve, aparecen. */
  dibujarCharcos();

  /* Las matas, la hierba y las piedras. */
  for (const s of espesura.suelo) {
    const x = enPantalla(s.x, 1);
    if (x < -20 || x > A + 20) continue;
    const prof = clamp01((s.y - suelo) / Math.max(1, H - suelo));
    const luz = 0.28 + prof * 0.3 + verde * 0.4 * (0.3 + prof);
    const col = `rgb(${Math.round(mez(20, 74, luz))},${Math.round(mez(44, 186, luz))},${Math.round(mez(28, 96, luz))})`;
    const mece = Math.sin(reloj * 1.05 + s.f) * U * (0.2 + clima.viento * 0.5) * (0.3 + prof);

    /* Al tocar cualquier cosa del suelo, da un saltito. Es lo que hace
       que TODO el bosque se sienta tocable: no hace falta que cada
       matojo tenga una frase, hace falta que conteste. */
    const salto = s.pulso * U * 0.9;

    if (s.tipo === "piedra") {
      ctx.save();
      ctx.translate(x, s.y - salto);
      ctx.rotate(s.tinte + s.pulso * 0.5);
      ctx.fillStyle = `rgb(${Math.round(mez(26, 56, luz))},${Math.round(mez(28, 54, luz))},${Math.round(mez(30, 50, luz))})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, s.s * 0.8, s.s * 0.45, 0, 0, 6.283);
      ctx.fill();
      /* La piedra marcada lleva una flecha rayada, apuntando al fondo
         del bosque. Es más clara que la piedra, no más brillante: una
         raya luminosa sería un cartel, y esto es una raya. */
      if (s.marcada) {
        ctx.strokeStyle = `rgba(206,196,176,${0.3 + s.pulso * 0.4})`;
        ctx.lineWidth = Math.max(1, s.s * 0.1);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(-s.s * 0.42, 0);
        ctx.lineTo(s.s * 0.42, 0);
        ctx.moveTo(s.s * 0.16, -s.s * 0.2);
        ctx.lineTo(s.s * 0.42, 0);
        ctx.lineTo(s.s * 0.16, s.s * 0.2);
        ctx.stroke();
      }
      ctx.restore();

    } else if (s.tipo === "seta") {
      /* Un sombrerito y un pie, y luz saliendo de debajo del sombrero,
         que es donde de verdad brillan las que brillan. */
      const sr = s.s * 0.62;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      haloOvalado(x, s.y - sr * 0.6 - salto, sr * 3.4, sr * 2.6, [
        [0, `rgba(140,255,200,${0.1 + s.pulso * 0.3})`],
        [1, "rgba(110,240,175,0)"],
      ]);
      ctx.restore();
      ctx.fillStyle = "rgba(216,222,200,0.55)";
      ctx.fillRect(x - sr * 0.16, s.y - sr * 1.1 - salto, sr * 0.32, sr * 1.1);
      ctx.fillStyle = `rgba(${Math.round(mez(196, 236, s.pulso))},${Math.round(mez(228, 255, s.pulso))},206,0.8)`;
      ctx.beginPath();
      ctx.ellipse(x, s.y - sr * 1.05 - salto, sr, sr * 0.62, 0, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = `rgba(160,255,210,${0.35 + s.pulso * 0.4})`;
      ctx.beginPath();
      ctx.ellipse(x, s.y - sr * 1.05 - salto, sr * 0.92, sr * 0.2, 0, 0, 6.283);
      ctx.fill();

    } else if (s.tipo === "mata") {
      /* Un helecho, no tres óvalos: cinco frondas saliendo del mismo
         punto. Los óvalos se veían como pegatinas de musgo. */
      ctx.strokeStyle = col;
      ctx.lineCap = "round";
      const abre = 1 + s.pulso * 0.5;
      for (let i = 0; i < 5; i++) {
        const a2 = -1.57 + (i - 2) * 0.38 * abre;
        ctx.lineWidth = Math.max(1, s.s * 0.16);
        ctx.beginPath();
        ctx.moveTo(x, s.y);
        ctx.quadraticCurveTo(
          x + Math.cos(a2) * s.s * 0.9 + mece * 0.3, s.y + Math.sin(a2) * s.s * 0.7,
          x + Math.cos(a2) * s.s * 1.5 + mece * 0.6, s.y + Math.sin(a2) * s.s * 1.5 * 0.7);
        ctx.stroke();
      }
    } else {
      ctx.strokeStyle = col;
      ctx.lineWidth = 1 + prof;
      ctx.beginPath();
      ctx.moveTo(x, s.y);
      ctx.quadraticCurveTo(x + mece * 0.5 + s.pulso * U, s.y - s.s * 1.2,
        x + mece + s.pulso * U * 1.6, s.y - s.s * 2);
      ctx.stroke();
    }
  }
}

/**
 * LOS CHARCOS.
 *
 * ── POR QUÉ REFLEJAN ─────────────────────────────────────────────────
 * Porque un charco que no refleja es una mancha oscura en el suelo. Lo
 * que convierte una mancha en agua es que se vea algo DENTRO, y lo que
 * hay encima de un charco en un bosque son las copas: así que lo que
 * reflejan es el cielo entre las copas, más claro que la tierra.
 *
 * ── Y POR QUÉ UNO DE CADA CUATRO REFLEJA OTRA COSA ───────────────────
 * Porque el bosque de este juego tiene algo raro, y un sitio con algo
 * raro tiene que enseñarlo de vez en cuando sin explicarlo. En uno de
 * cada cuatro, y sólo a ratos, lo que se ve en el agua son dos puntos
 * rojos. No hay nada arriba que los produzca. Quien lo vea, lo vio.
 */
function dibujarCharcos() {
  if (!espesura.charcos || clima.lluvia < 0.04) return;
  const k = clamp01((clima.lluvia - 0.04) / 0.5);

  for (const c of espesura.charcos) {
    const x = enPantalla(c.x, 1);
    if (x < -A * 0.2 || x > A * 1.2) continue;
    const rx = c.rx * k, ry = rx * 0.3;

    /* El agua. */
    ctx.save();
    ctx.globalAlpha = 0.6 * k;
    const g = ctx.createLinearGradient(0, c.y - ry, 0, c.y + ry);
    g.addColorStop(0, "rgba(96,124,150,0.55)");
    g.addColorStop(0.5, "rgba(40,58,76,0.7)");
    g.addColorStop(1, "rgba(22,32,44,0.75)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, c.y, rx, ry, 0, 0, 6.283);
    ctx.fill();

    /* El filo de luz del borde: sin él, el charco es un agujero. */
    ctx.strokeStyle = "rgba(170,200,230,0.2)";
    ctx.lineWidth = Math.max(1, U * 0.16);
    ctx.beginPath();
    ctx.ellipse(x, c.y, rx, ry, 0, 0, 6.283);
    ctx.stroke();
    ctx.restore();

    /* Lo que se ve dentro. */
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, c.y, rx, ry, 0, 0, 6.283);
    ctx.clip();
    ctx.globalCompositeOperation = "lighter";
    /* El cielo entre las copas, temblando. */
    const tem = Math.sin(reloj * 1.7 + c.f) * ry * 0.12;
    haloOvalado(x + tem, c.y, rx * 0.8, ry * 1.4, [
      [0, `rgba(130,166,220,${0.16 * k})`],
      [1, "rgba(110,150,210,0)"],
    ]);
    /* Y, en algunos, dos puntos rojos que no vienen de ninguna parte. */
    if (c.raro) {
      const asoma = clamp01(Math.sin(reloj * 0.21 + c.f) * 3 - 2.2);
      if (asoma > 0.01) {
        for (const lado of [-1, 1]) {
          haloOvalado(x + lado * rx * 0.18 + tem, c.y, rx * 0.16, ry * 0.5, [
            [0, `rgba(255,70,60,${0.7 * asoma * k})`],
            [1, "rgba(220,30,30,0)"],
          ]);
        }
      }
    }
    ctx.restore();

    /* Las ondas de haberlo tocado, y las de la lluvia cayendo. */
    if (c.onda > 0.01) {
      ctx.save();
      ctx.strokeStyle = `rgba(190,220,250,${c.onda * 0.5})`;
      ctx.lineWidth = Math.max(1, U * 0.16);
      for (let i = 0; i < 3; i++) {
        const t = clamp01((1 - c.onda) + i * 0.22);
        if (t >= 1) continue;
        ctx.globalAlpha = (1 - t) * c.onda;
        ctx.beginPath();
        ctx.ellipse(x, c.y, rx * t, ry * t, 0, 0, 6.283);
        ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function dibujarLuces(dt) {
  void dt;
  ctx.globalCompositeOperation = "lighter";
  for (const l of espesura.luces) {
    const x = enPantalla(l.x + Math.sin(reloj * l.vel + l.f) * l.radio, l.z);
    if (x < -30 || x > A + 30) continue;
    const y = l.y + Math.cos(reloj * l.vel * 0.7 + l.f * 1.7) * l.radio * 0.6;
    /* El parpadeo: un seno elevado, para que esté más tiempo apagada
       que encendida. Una luciérnaga es sobre todo oscuridad. */
    const k = Math.pow(clamp01(0.5 + 0.5 * Math.sin(reloj * l.ritmo + l.fase)), 2.4);
    if (k < 0.02) continue;
    const gg = ctx.createRadialGradient(x, y, 0, x, y, l.r * 7);
    /* Verde de bicho, no blanco de bombilla. El corazón tira a limón y
       el halo a esmeralda: una luciérnaga es amarilla por dentro y
       verde por fuera, y con el corazón blanco se leían como motas de
       polvo iluminadas. */
    gg.addColorStop(0, `rgba(210,255,170,${0.62 * k})`);
    gg.addColorStop(0.22, `rgba(90,255,150,${0.3 * k})`);
    gg.addColorStop(1, "rgba(30,200,110,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x, y, l.r * 7, 0, 6.283); ctx.fill();
    ctx.fillStyle = `rgba(228,255,200,${0.95 * k})`;
    ctx.beginPath(); ctx.arc(x, y, l.r, 0, 6.283); ctx.fill();
    /* Y una estela cortita: se están moviendo, aunque muy despacio. */
    if (k > 0.5) {
      ctx.strokeStyle = `rgba(120,255,170,${0.18 * k})`;
      ctx.lineWidth = l.r * 1.1;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - Math.cos(reloj * l.vel + l.f) * l.radio * 0.12,
                 y - Math.sin(reloj * l.vel * 0.7 + l.f * 1.7) * l.radio * 0.1);
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = "source-over";
}

function dibujarMarcoEsp() {
  const z = ESP.marco.z;
  /* Dónde hay algo que mirar ahora mismo. Un tronco de primer plano
     justo delante de la pala la tapa entera y no hay forma de
     apartarlo: el marco va a su velocidad y no se puede esquivar. Así
     que el tronco se aparta solo, desvaneciéndose. Se lee como que
     está tan cerca que queda fuera de foco, y no como un fallo. */
  const estorbos = [];
  for (const q of puntos.lista) {
    if (!q.hay()) continue;
    const sx = enPantalla(q.x, q.z);
    if (sx > -A * 0.2 && sx < A * 1.2) estorbos.push({ x: sx, r: q.r * 2.2 });
  }
  const bx = enPantalla(buhoEsp.x, 0.52);
  /* Con el tamaño de AHORA, no con el de reposo: atacando mide treinta
     veces más, y un tronco delante de él lo partiría por la mitad. */
  if (bx > -A * 0.2 && bx < A * 1.2 || buhoEsp.ataque >= 0) {
    estorbos.push({
      x: buhoEsp.ataque >= 0 ? mez(bx, A * 0.5, buhoEsp.centrado || 0) : bx,
      r: buhoEsp.r * buhoEsp.escala * 2.2,
    });
  }

  for (const m of espesura.marco) {
    const x = enPantalla(m.x, z);
    if (x < -m.ancho * 4 || x > A + m.ancho * 4) continue;
    const mece = Math.sin(reloj * 0.3 + m.f) * U * 0.6 * (0.4 + clima.viento * 0.6);

    let tapa = 1;
    for (const es of estorbos) {
      const d = Math.abs(x + mece - es.x);
      if (d < es.r + m.ancho * 2) {
        tapa = Math.min(tapa, clamp01((d - m.ancho) / Math.max(1, es.r * 1.6)) * 0.5 + 0.04);
      }
    }
    if (tapa < 0.04) continue;

    ctx.save();
    ctx.globalAlpha = tapa;
    ctx.translate(x + mece, 0);
    ctx.rotate(m.incl);
    /* El tronco, de arriba abajo de la pantalla. Casi negro: lo pegado
       a la cámara en un bosque de noche es lo que menos se ve. */
    /* Se estrecha hacia arriba y se ensancha en la base, que es la
       forma de un tronco de verdad visto desde el suelo. */
    const aA = m.ancho * m.afina, aB = m.ancho * 1.25;
    const gt = ctx.createLinearGradient(-m.ancho, 0, m.ancho, 0);
    gt.addColorStop(0, "rgb(7,11,13)");
    gt.addColorStop(0.28, "rgb(26,35,37)");
    gt.addColorStop(0.72, "rgb(13,19,20)");
    gt.addColorStop(1, "rgb(4,7,8)");
    ctx.fillStyle = gt;
    ctx.beginPath();
    ctx.moveTo(-aA, -20);
    ctx.quadraticCurveTo(-m.ancho * 0.9, H * 0.55, -aB, H + 20);
    ctx.lineTo(aB, H + 20);
    ctx.quadraticCurveTo(m.ancho * 0.9, H * 0.55, aA, -20);
    ctx.closePath();
    ctx.fill();

    /* La corteza: surcos verticales cortos, recortados a la silueta.
       Sin ellos el tronco es una mancha, y con ellos es madera. */
    ctx.save();
    ctx.clip();
    ctx.strokeStyle = "rgba(0,0,0,0.5)";
    ctx.lineCap = "round";
    for (const su of m.surcos) {
      ctx.lineWidth = m.ancho * 0.12 * su.gr;
      const y0 = su.y0 * H;
      ctx.beginPath();
      ctx.moveTo(su.x * m.ancho, y0);
      ctx.quadraticCurveTo(su.x * m.ancho + m.ancho * 0.1, y0 + H * su.largo * 0.5,
                           su.x * m.ancho, y0 + H * su.largo);
      ctx.stroke();
    }
    ctx.restore();
    /* Un filo de luna por un lado, finísimo: sin él son rectángulos
       negros y no se leen como troncos. */
    ctx.strokeStyle = "rgba(164,198,255,0.3)";
    ctx.lineWidth = Math.max(1, m.ancho * 0.13);
    ctx.beginPath();
    ctx.moveTo(-aA, -20);
    ctx.quadraticCurveTo(-m.ancho * 0.9, H * 0.55, -aB, H + 20);
    ctx.stroke();
    /* Y un rebote verdoso por el otro, mucho más flojo: la luz que
       sube del suelo del bosque. Con filo sólo por un lado, el tronco
       se lee como un recorte de papel pegado encima; con los dos, como
       una cosa redonda. */
    ctx.strokeStyle = "rgba(120,190,150,0.1)";
    ctx.lineWidth = Math.max(1, m.ancho * 0.1);
    ctx.beginPath();
    ctx.moveTo(aA, -20);
    ctx.quadraticCurveTo(m.ancho * 0.9, H * 0.55, aB, H + 20);
    ctx.stroke();

    /* Las ramas que cruzan por arriba. */
    /* Las ramas, con grosor de verdad y con ramitas colgando. Con un
       trazo fino y limpio parecían cables tendidos de lado a lado. */
    ctx.strokeStyle = "rgb(9,13,14)";
    ctx.lineCap = "round";
    for (const r of m.ramas) {
      const y0 = H * r.y;
      const ex = r.lado * A * r.largo, ey = y0 + H * r.caida * 0.3;
      /* Se pinta en dos pasadas: gruesa por dentro y fina por fuera,
         que es como se afina una rama sin poder variar el grosor de un
         trazo. */
      for (const [ini, fin, gr] of [[0, 0.62, 1], [0.5, 1, 0.45]]) {
        ctx.lineWidth = m.ancho * 0.62 * gr;
        ctx.beginPath();
        const x1 = mez(0, ex, ini), y1 = mez(y0, ey, ini) - H * 0.03 * ini;
        const x2 = mez(0, ex, fin), y2 = mez(y0, ey, fin);
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo((x1 + x2) * 0.5, mez(y1, y2, 0.5) - H * 0.035, x2, y2);
        ctx.stroke();
      }
      /* El canto de arriba de la rama, mojado de luna. Media línea, y
         es lo que las separa de ser cables tendidos. */
      ctx.save();
      ctx.strokeStyle = "rgba(150,186,246,0.16)";
      ctx.lineWidth = Math.max(1, m.ancho * 0.1);
      ctx.beginPath();
      ctx.moveTo(0, y0 - m.ancho * 0.26);
      ctx.quadraticCurveTo(ex * 0.5, mez(y0, ey, 0.5) - H * 0.035 - m.ancho * 0.26,
                           ex, ey - m.ancho * 0.1);
      ctx.stroke();
      ctx.restore();
      ctx.strokeStyle = "rgb(9,13,14)";

      /* Dos ramitas colgando hacia abajo. */
      ctx.lineWidth = m.ancho * 0.18;
      for (let j = 0; j < 2; j++) {
        const t = 0.4 + j * 0.3;
        const hx = mez(0, ex, t), hy = mez(y0, ey, t) - H * 0.02;
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.quadraticCurveTo(hx + r.lado * A * 0.03, hy + H * 0.03,
                             hx + r.lado * A * 0.01, hy + H * 0.06);
        ctx.stroke();
      }
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}

/* ==========================================
   LOS PUNTOS DE INTERÉS
   ==========================================

   Sitios del bosque donde hay algo. Cada uno sabe dónde está, si se ve
   ya, qué pasa al tocarlo y cómo se dibuja.

   ── POR QUÉ UNA LISTA Y NO UN `if` POR SITIO ─────────────────────────
   Porque el orden de los toques importa —lo pequeño gana a lo grande— y
   con una lista ordenada por tamaño eso sale solo. Y porque para saber
   «¿hay algo cerca?» basta recorrerla, en vez de preguntarle a cada
   cosa por su nombre.

   ── LO QUE SE VE Y LO QUE NO ─────────────────────────────────────────
   Cada punto tiene una condición para existir. La pala está desde el
   principio; la reliquia no aparece hasta que se ha cavado. Eso es lo
   que hace que volver a un sitio que ya conoces tenga sentido: la
   segunda vez hay algo que la primera no estaba.                    */

const puntos = {
  lista: [],
  /* El que tiene el dedo encima ahora mismo, para resaltarlo. */
  cerca: null,
  /* Lo que se ha dicho ya al acercarse, para no repetirlo en bucle. */
  dichos: new Set(),
};

function construirPuntos() {
  const suelo = espesura.sueloY;
  const W = espesura.W;

  puntos.lista = [
    /* ---- La vuelta al claro ----
       Un hueco entre los troncos por el que se cuela luz de fogata. Es
       lo único cálido de toda la espesura, y por eso se entiende sin
       cartel que es por ahí por donde se vuelve. */
    {
      id: "salida",
      x: W * 0.045, y: suelo - H * 0.08,
      r: U * 13, z: 0.52,
      hay: () => true,
    },

    /* ---- La marca del suelo ----
       Medio tapada de hojas. No se ve hasta que se está encima, y eso
       es a propósito: una X que se ve desde lejos es una señal, y ésta
       tiene que ser un hallazgo. */
    {
      id: "equis",
      x: W * 0.37, y: suelo + H * 0.055,
      r: U * 11, z: 1,
      hay: () => true,
      hojas: 1,          // cuánto queda por apartar
      golpes: 0,         // cuántas paladas lleva
      hoyo: 0,
      temblor: 0,
    },

    /* ---- El búho ----
       En un árbol de la banda de en medio, alto. */
    {
      id: "buho",
      x: W * 0.58, y: mez(espesura.copasY, suelo, 0.34),
      r: U * 9, z: 0.52,
      hay: () => true,
    },

    /* ---- La pala ----
       Apoyada en un tocón. Lejos de la X a propósito: el camino de ida
       y vuelta ES la parte que hace que encontrarla valga algo. */
    {
      id: "pala",
      x: W * 0.83, y: suelo + H * 0.035,
      r: U * 10, z: 1,
      hay: () => !bolsa.lleva("pala"),
      brillo: 0,
      cogida: 0,
    },

    /* ---- Lo que estaba enterrado ----
       No existe hasta que se cava. */
    {
      id: "reliquia",
      x: W * 0.37, y: suelo + H * 0.062,
      r: U * 8, z: 1,
      hay: () => historia.hecho("misterio"),
      pulso: 0, salida: 0, giro: 0,
    },

    /* ---- El reloj de pie ----
       Entre el búho y la pala, recargado en un árbol. No está
       escondido: está donde nadie esperaría uno, que es peor.

       Se ve de lejos porque brilla, pero el brillo es verde y flojo, y
       hasta que no se está encima parece una luciérnaga grande. */
    {
      id: "reloj",
      x: W * 0.665, y: suelo + H * 0.03,
      r: U * 10, z: 1,
      hay: () => true,
      latido: 0, fogonazo: 0, tic: 0, toques: 0, salto: 0,
    },

    /* ---- La roca de cobertura ----
       Un peñasco. Está desde siempre —no aparece con el jefe— y no da
       nada al tocarlo: lo único que hace es PARAR cosas. Quien no haya
       peleado nunca lo verá como una roca grande, que es lo que es. */
    {
      id: "roca",
      x: W * 0.79, y: suelo + H * 0.045,
      r: U * 13, z: 1,
      hay: () => true,
      musgo: 0,
    },

    /* ---- La escopeta ----
       Al final del todo, tirada entre las hojas. Hay que andar el
       bosque entero para dar con ella, y ni siquiera entonces salta a
       la vista: lo único que hace es un destello por el cañón cada
       cuatro o cinco segundos. */
    {
      id: "escopeta",
      x: W * 0.955, y: suelo + H * 0.055,
      r: U * 9, z: 1,
      hay: () => !bolsa.lleva("escopeta"),
      destello: 0, relojDestello: azar(1, 4), cogida: 0,
    },
  ];

  /* Al remedir se conserva lo vivido: si ya habías cavado dos veces, no
     se vuelve a empezar sólo porque hayas girado el teléfono. */
  for (const p of puntos.lista) {
    if (p.id === "equis") {
      p.hojas = historia.hecho("equis") ? 0 : 1;
      p.golpes = recuerdo.leer("golpes", 0);
      p.hoyo = clamp01(p.golpes / CONF.cavar.golpes);
    }
    if (p.id === "reliquia") p.salida = historia.hecho("misterio") ? 1 : 0;
  }
}

/** Dónde cae un punto en la pantalla. */
function puntoEnPantalla(p) {
  return { x: enPantalla(p.x, p.z), y: p.y };
}

function moverPuntos(dt) {
  const centro = A * 0.5;
  puntos.cerca = null;
  let mejorD = Infinity;

  for (const p of puntos.lista) {
    if (!p.hay()) continue;
    const s = puntoEnPantalla(p);

    /* ---- ¿Estoy encima? ----
       «Cerca» se mide contra el CENTRO de la pantalla, no contra el
       dedo: el dedo no está siempre puesto, y lo que cuenta aquí es
       hacia dónde estás mirando. */
    const d = Math.abs(s.x - centro);
    if (d < A * 0.22 && d < mejorD) { mejorD = d; puntos.cerca = p; }

    if (p.id === "pala") {
      p.brillo = 0.5 + 0.5 * Math.sin(reloj * 1.4);
      if (p.cogida > 0) p.cogida = Math.min(1, p.cogida + dt * 1.6);
    }
    if (p.id === "equis") {
      p.temblor = Math.max(0, p.temblor - dt * 3);
      p.hoyo = damp(p.hoyo, clamp01(p.golpes / CONF.cavar.golpes), 5, dt);
    }
    if (p.id === "reloj") {
      /* Respira despacio, y de vez en cuando le da un fogonazo. El
         fogonazo no es al azar del todo: va a un ritmo que no cuadra
         con nada, y eso es lo que lo hace inquietante. */
      p.latido = 0.5 + 0.5 * Math.sin(reloj * 0.62);
      p.fogonazo = Math.max(0, p.fogonazo - dt * 2.2);
      p.salto = Math.max(0, p.salto - dt * 2.6);
      if (Math.random() < dt * 0.14) p.fogonazo = azar(0.5, 1);
      /* Y el segundero: da el tic… y vuelve. Nunca avanza. Es todo el
         chiste del reloj, y está en dos líneas. */
      p.tic += dt;
      if (p.tic > 1) p.tic -= 1;
    }
    if (p.id === "escopeta") {
      p.destello = Math.max(0, p.destello - dt * 1.1);
      p.relojDestello -= dt;
      if (p.relojDestello <= 0) {
        p.relojDestello = azar(3.4, 5.6);
        p.destello = 1;
      }
      if (p.cogida > 0) p.cogida = Math.min(1, p.cogida + dt * 1.8);
    }
    if (p.id === "reliquia") {
      p.salida = damp(p.salida, 1, 1.1, dt);
      p.pulso = Math.max(0, p.pulso - dt * 0.9);
      p.giro += dt * 0.35;
      /* Suelta partículas verdes por su cuenta: es lo que hace que se
         vea que está VIVA y no que es un objeto puesto ahí. */
      if (Math.random() < dt * (3 + p.pulso * 20)) {
        const s2 = puntoEnPantalla(p);
        soltar(s2.x + azar(-U * 3, U * 3), s2.y - U * azar(0, 3), {
          vx: azar(-8, 8), vy: azar(-26, -8),
          vida: azar(1.6, 3.4), tam: azar(1, 2.4),
          tipo: TIPO.BRILLO, tono: 0.45,
        });
      }
    }
  }

  /* ---- Lo que se dice al acercarse ----
     Una vez por sitio y por visita. Repetirlo cada vez que pasas por
     delante convierte una pista en un cartel. */
  const c = puntos.cerca;
  if (c && !puntos.dichos.has(c.id)) {
    const frase = pistaDePunto(c);
    if (frase) {
      puntos.dichos.add(c.id);
      const s = puntoEnPantalla(c);
      decir(s.x, s.y - U * 6, frase, { dur: 4 });
    }
  }
}

/** La pista de acercarse, según lo que ya haya pasado. */
function pistaDePunto(p) {
  if (p.id === "equis") {
    if (historia.hecho("misterio")) return null;
    if (!historia.hecho("equis")) return null;   // primero hay que destaparla
    if (!bolsa.lleva("pala")) return CONF.espesura.equisSinPala;
    return CONF.espesura.equisConPala;
  }
  if (p.id === "pala" && !bolsa.lleva("pala")) return CONF.espesura.palaVista;
  if (p.id === "salida") return CONF.espesura.salidaVista;
  if (p.id === "escopeta") return CONF.caza.alVerla;
  /* El reloj NO avisa de nada. Si al acercarse saltara una frase, sería
     un sitio señalado; callado, es una cosa rarísima que alguien puso
     ahí y que hay que decidirse a tocar. */
  return null;
}

/* ---- Dibujar ------------------------------------------------------------ */

function dibujarPuntos() {
  for (const p of puntos.lista) {
    if (!p.hay()) continue;
    const s = puntoEnPantalla(p);
    if (s.x < -A * 0.4 || s.x > A * 1.4) continue;

    if (p.id === "salida") dibujarSalida(s.x, s.y, p);
    else if (p.id === "equis") dibujarEquis(s.x, s.y, p);
    else if (p.id === "pala") dibujarPala(s.x, s.y, p);
    else if (p.id === "reliquia") dibujarReliquia(s.x, s.y, p);
    else if (p.id === "roca") dibujarRocaGrande(s.x, s.y, p);
    else if (p.id === "reloj") dibujarRelojBosque(s.x, s.y, p);
    else if (p.id === "escopeta") dibujarEscopetaSuelo(s.x, s.y, p);
    /* El búho de la espesura se pinta con los demás bichos, aparte. */
  }
}

/**
 * LA ROCA GRANDE.
 *
 * Un peñasco de los que lleva ahí desde antes que el bosque. Tres capas
 * y un filo de luna: la cara de sombra, la cara que da a la luz, y el
 * musgo del lado norte, que es el detalle que dice que lleva siglos.
 *
 * Durante la pelea se le pinta encima un aviso de que ahí se está a
 * cubierto, pero sólo entonces: fuera de la pelea es una roca.
 */
function dibujarRocaGrande(x, y, p) {
  const r = p.r;

  /* La sombra en el suelo. */
  haloOvalado(x + U * 0.8, y + U * 1.4, r * 1.25, r * 0.36, [
    [0.4, "rgba(0,0,0,0.5)"],
    [1, "rgba(0,0,0,0)"],
  ]);

  ctx.save();
  ctx.translate(x, y);

  /* El bulto: un polígono irregular, no una elipse. Una roca con
     silueta suave es un huevo. */
  const perfil = [
    [-1.0, 0.18], [-0.92, -0.32], [-0.6, -0.7], [-0.2, -0.92],
    [0.25, -0.86], [0.66, -0.6], [0.95, -0.2], [1.0, 0.2],
  ];
  const trazo = () => {
    ctx.beginPath();
    ctx.moveTo(perfil[0][0] * r, perfil[0][1] * r);
    for (let i = 1; i < perfil.length; i++) {
      ctx.lineTo(perfil[i][0] * r, perfil[i][1] * r);
    }
    ctx.lineTo(r * 1.02, r * 0.28);
    ctx.lineTo(-r * 1.02, r * 0.28);
    ctx.closePath();
  };

  const g = ctx.createLinearGradient(-r, -r, r * 0.6, r * 0.3);
  g.addColorStop(0, "#3c4148");
  g.addColorStop(0.5, "#272c33");
  g.addColorStop(1, "#14181d");
  ctx.fillStyle = g;
  trazo();
  ctx.fill();

  /* Las grietas. */
  ctx.save();
  trazo();
  ctx.clip();
  ctx.strokeStyle = "rgba(8,10,13,0.6)";
  ctx.lineWidth = Math.max(1, r * 0.035);
  for (let i = 0; i < 4; i++) {
    const t = (i + 0.5) / 4;
    ctx.beginPath();
    ctx.moveTo(-r + t * r * 2, -r * 0.9);
    ctx.quadraticCurveTo(-r + t * r * 2 + r * 0.16, -r * 0.3,
                         -r + t * r * 2 - r * 0.1, r * 0.3);
    ctx.stroke();
  }
  /* Y el musgo del lado de abajo. */
  ctx.fillStyle = "rgba(56,88,56,0.4)";
  for (let i = 0; i < 7; i++) {
    ctx.beginPath();
    ctx.ellipse(-r * 0.8 + azarFijo(i * 3.7) * r * 1.6,
      r * (0.05 + azarFijo(i * 5.1) * 0.22),
      r * (0.1 + azarFijo(i * 7.3) * 0.16), r * 0.06, 0, 0, 6.283);
    ctx.fill();
  }
  ctx.restore();

  /* El filo de luna por el canto de arriba. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  ctx.strokeStyle = "rgba(154,186,240,0.24)";
  ctx.lineWidth = Math.max(1, r * 0.06);
  ctx.beginPath();
  ctx.moveTo(perfil[0][0] * r, perfil[0][1] * r);
  for (let i = 1; i < perfil.length; i++) ctx.lineTo(perfil[i][0] * r, perfil[i][1] * r);
  ctx.stroke();
  ctx.restore();

  ctx.restore();

  /* Y durante la pelea, el aviso de que ahí no llega el fuego. */
  if (jefe.vivo) {
    const pulso = 0.28 + 0.16 * Math.sin(reloj * 2.6);
    const dentro = aCubierto();
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    haloOvalado(x, y - r * 0.2, r * 1.5, r * 0.95, [
      [0, `rgba(${dentro ? "140,255,190" : "255,220,150"},${pulso * (dentro ? 0.16 : 0.1)})`],
      [1, "rgba(140,255,190,0)"],
    ]);
    ctx.restore();
  }
}

/**
 * EL RELOJ DE PIE DEL BOSQUE.
 *
 * ── POR QUÉ UN RELOJ Y NO OTRA COSA ──────────────────────────────────
 * Porque un reloj de pie en mitad de un bosque no da miedo por lo que
 * es: da miedo por lo que implica. Alguien lo trajo hasta aquí. Alguien
 * le dio cuerda. Y sigue marcando las tres, igual que el de la mesilla
 * de la cabaña, que es la hora a la que se despierta uno después del
 * ataque. Los dos relojes dicen lo mismo sin decirlo.
 *
 * ── DE DÓNDE SALE LO INQUIETANTE ─────────────────────────────────────
 * De tres cosas pequeñas, no de una grande:
 *
 *   1. El verde respira despacio, a un ritmo que no cuadra con ningún
 *      otro de la escena.
 *   2. Cada tanto le da un FOGONAZO que no viene a cuento: no está
 *      sincronizado con nada, así que no se puede anticipar.
 *   3. El segundero da el tic… y vuelve al mismo sitio. Nunca avanza.
 *      Eso lo ve todo el mundo a los cinco segundos, y es lo que cuenta
 *      la frase entera antes de tocarlo.
 */
function dibujarRelojBosque(x, y, p) {
  const alto = U * (apaisado ? 26 : 30);
  const ancho = alto * 0.26;
  const vivo = 0.45 + p.latido * 0.35 + p.fogonazo * 0.9;
  /* Recargado: se inclina, y por eso la sombra del suelo no va debajo
     del centro sino del pie. */
  const incl = -0.07;

  /* La sombra donde se apoya. */
  haloOvalado(x + U * 1.2, y + U * 0.6, ancho * 1.4, U * 1.8, [
    [0.35, "rgba(0,0,0,0.45)"],
    [1, "rgba(0,0,0,0)"],
  ]);

  /* El resplandor de alrededor, antes que la caja: es lo que se ve de
     lejos, cuando el reloj todavía es una mancha entre los árboles. */
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  haloOvalado(x, y - alto * 0.55, ancho * 5, alto * 0.95, [
    [0, `rgba(120,255,175,${0.15 * vivo})`],
    [0.45, `rgba(90,230,150,${0.05 * vivo})`],
    [1, "rgba(90,230,150,0)"],
  ]);
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(incl);
  ctx.translate(0, -alto);

  /* ---- La caja ---- */
  const g = ctx.createLinearGradient(-ancho / 2, 0, ancho / 2, 0);
  g.addColorStop(0, "#241a18");
  g.addColorStop(0.35, "#3d2b24");
  g.addColorStop(0.72, "#2a1e1a");
  g.addColorStop(1, "#160f0e");
  ctx.fillStyle = g;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-ancho / 2, 0, ancho, alto, [ancho * 0.3, ancho * 0.3, 2, 2]);
  else ctx.rect(-ancho / 2, 0, ancho, alto);
  ctx.fill();

  /* La cornisa de arriba y la base, que son lo que lo hace «de pie» y
     no una tabla. */
  ctx.fillStyle = "#3a2922";
  ctx.fillRect(-ancho * 0.62, alto * 0.06, ancho * 1.24, alto * 0.035);
  ctx.fillRect(-ancho * 0.6, alto * 0.965, ancho * 1.2, alto * 0.035);

  /* ---- El cristal del péndulo ----
     El hueco largo de en medio, con el péndulo dentro. Va en modo de
     sumar porque lo que se ve ahí no es madera iluminada: es luz. */
  const cy = alto * 0.58, ch = alto * 0.34;
  ctx.fillStyle = "rgba(8,14,10,0.9)";
  ctx.fillRect(-ancho * 0.3, cy - ch / 2, ancho * 0.6, ch);
  ctx.save();
  ctx.beginPath();
  ctx.rect(-ancho * 0.3, cy - ch / 2, ancho * 0.6, ch);
  ctx.clip();
  ctx.globalCompositeOperation = "lighter";
  /* El péndulo: quieto en el centro, porque el reloj no anda. Sólo
     tiembla un pelo. Un péndulo balanceándose diría que funciona, y lo
     que hay que decir es lo contrario. */
  const px2 = Math.sin(reloj * 0.9) * ancho * 0.05;
  ctx.strokeStyle = `rgba(150,255,190,${0.3 * vivo})`;
  ctx.lineWidth = Math.max(1, U * 0.24);
  ctx.beginPath();
  ctx.moveTo(0, cy - ch / 2);
  ctx.lineTo(px2, cy + ch * 0.26);
  ctx.stroke();
  haloOvalado(px2, cy + ch * 0.3, ancho * 0.34, ancho * 0.34, [
    [0, `rgba(180,255,210,${0.75 * vivo})`],
    [0.4, `rgba(110,240,160,${0.3 * vivo})`],
    [1, "rgba(110,240,160,0)"],
  ]);
  ctx.restore();

  /* ---- La esfera ---- */
  const ey = alto * 0.2, er = ancho * 0.34;
  ctx.fillStyle = "rgba(226,216,190,0.16)";
  ctx.beginPath(); ctx.arc(0, ey, er * 1.16, 0, 6.283); ctx.fill();
  ctx.fillStyle = "rgba(16,22,18,0.92)";
  ctx.beginPath(); ctx.arc(0, ey, er, 0, 6.283); ctx.fill();

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  /* Las doce marcas. */
