<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Corazones que suben</title>
<meta name="tamaño" content="360x480">
<meta name="decorativo" content="si">
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
canvas{display:block;width:100%;height:100%}
</style></head>
<body><canvas></canvas>
<script>
const c=document.querySelector("canvas"),g=c.getContext("2d"),d=Math.min(2,devicePixelRatio||1);
let W,H,p=[];
const colores=["#ff8fb1","#ffb3c7","#ff6f91","#ffd1dc"];
function medir(){W=c.width=innerWidth*d;H=c.height=innerHeight*d}
function nuevo(y){return{x:Math.random()*W,y:y??H+20*d,t:(8+Math.random()*12)*d,v:(.3+Math.random()*.6)*d,f:Math.random()*6,c:colores[Math.random()*4|0]}}
function corazon(x,y,t){g.beginPath();g.moveTo(x,y+t*.3);g.bezierCurveTo(x,y,x-t*.5,y,x-t*.5,y+t*.3);g.bezierCurveTo(x-t*.5,y+t*.6,x,y+t*.75,x,y+t);g.bezierCurveTo(x,y+t*.75,x+t*.5,y+t*.6,x+t*.5,y+t*.3);g.bezierCurveTo(x+t*.5,y,x,y,x,y+t*.3);g.fill()}
addEventListener("resize",medir);medir();
for(let i=0;i<22;i++)p.push(nuevo(Math.random()*H));
(function cuadro(ms){g.clearRect(0,0,W,H);for(const h of p){h.y-=h.v;h.x+=Math.sin(h.f+ms/900)*.3*d;if(h.y<-h.t)Object.assign(h,nuevo());g.globalAlpha=Math.min(1,h.y/(H*.3));g.fillStyle=h.c;corazon(h.x,h.y,h.t)}requestAnimationFrame(cuadro)})(0);
</script></body></html>
