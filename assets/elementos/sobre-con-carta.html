<!DOCTYPE html>
<html lang="es"><head><style id="sin-resaltado">html{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}*,*::before,*::after{-webkit-tap-highlight-color:transparent}body{-webkit-user-select:none;user-select:none}</style><meta charset="utf-8">
<title>Sobre con carta</title>
<meta name="tamaño" content="320x300">
<meta name="descripcion" content="Un sobre con sello de corazón; tócalo y se abre y sale una cartita">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}body{display:grid;place-items:end center;padding-bottom:7%;box-sizing:border-box;perspective:700px}.sobre{position:relative;width:74%;aspect-ratio:1.45;animation:flota 3.4s ease-in-out infinite;cursor:pointer}@keyframes flota{50%{transform:translateY(-6px) rotate(-1deg)}}.fondo,.frente{position:absolute;inset:0;border-radius:6px}.fondo{background:#f7c9d9}.carta{position:absolute;left:8%;right:8%;top:8%;height:84%;background:#fffaf3;border-radius:4px;box-shadow:0 2px 6px rgba(120,40,70,.15);transition:transform .7s cubic-bezier(.3,1.3,.5,1) .25s;display:grid;place-items:center;font:600 clamp(16px,9vw,30px)/1.1 Caveat,'Segoe Script','Comic Sans MS',cursive;color:#d8397a;text-align:center}.carta small{display:block;font-size:.55em;color:#b0648a}.frente{background:linear-gradient(160deg,#ffd9e6 0,#ffc2d6 100%);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);z-index:2}.tapa{position:absolute;left:0;right:0;top:0;height:60%;background:linear-gradient(#ffb8cf,#ffcadb);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .5s ease,z-index 0s .25s;z-index:3}.sello{position:absolute;left:50%;top:46%;width:18%;aspect-ratio:1;margin:-9% 0 0 -9%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7aa8,#d62a66);box-shadow:0 2px 4px rgba(120,20,60,.35);display:grid;place-items:center;color:#ffe0ec;font:16px/1 system-ui;z-index:4;transition:transform .4s,opacity .4s}.abierto .tapa{transform:rotateX(180deg);z-index:0}.abierto .sello{transform:scale(0) rotate(90deg);opacity:0}.abierto .carta{transform:translateY(-58%);z-index:1}</style>
</head><body><div class="sobre"><div class="fondo"></div><div class="carta"><div>te amo<small>muchísimo</small></div></div><div class="frente"></div><div class="tapa"></div><div class="sello">♥</div></div>
<script>
(function () {
  var quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function estallido(x, y, n, colores, simbolo) {
    for (var i = 0; i < n; i++) {
      var s = document.createElement("i"), a = Math.random() * 6.28, d = 40 + Math.random() * 70, t = 10 + Math.random() * 12;
      s.textContent = simbolo || "\u2665";
      s.style.cssText = "position:fixed;left:" + x + "px;top:" + y + "px;font:normal " + t + "px/1 system-ui;color:" + colores[i % colores.length] + ";pointer-events:none;text-shadow:0 1px 3px rgba(150,40,90,.25);z-index:9";
      document.body.appendChild(s);
      var an = s.animate([{ transform: "translate(-50%,-50%) scale(.2)", opacity: 1 }, { transform: "translate(calc(-50% + " + Math.cos(a) * d + "px),calc(-50% + " + (Math.sin(a) * d - 30) + "px)) scale(1) rotate(" + (Math.random() * 60 - 30) + "deg)", opacity: 0 }], { duration: 900 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.3,1)" });
      an.onfinish = (function (el) { return function () { el.remove(); }; })(s);
    }
  }
  var s = document.querySelector(".sobre");
  addEventListener("pointerdown", function (e) {
    var ab = s.classList.toggle("abierto");
    if (ab) setTimeout(function () { var r = s.getBoundingClientRect(); estallido(r.left + r.width / 2, r.top + r.height * .2, quieto ? 4 : 9, ["#ff5f9e", "#ffb3cf", "#f7a1c4"]); }, 650);
  });
})();
</script>
</body></html>
