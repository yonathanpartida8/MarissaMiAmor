<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Lluvia de pétalos</title>
<meta name="tamaño" content="360x480">
<meta name="descripcion" content="Pétalos de rosa que caen girando y meciéndose">
<meta name="decorativo" content="si">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}</style>
</head><body><canvas></canvas>
<script>
(function () {
  const c = document.querySelector("canvas"), x = c.getContext("2d");
  const quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, D = 1;
  function tam() { D = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; c.width = W * D; c.height = H * D; x.setTransform(D, 0, 0, D, 0, 0); }
  addEventListener("resize", tam); tam();
  const COL = [["#ffb3c9", "#ff7aa2"], ["#ffd0dc", "#ff9bb8"], ["#ff9fb6", "#e9557f"], ["#fff0f4", "#ffc2d2"]];
  const n = quieto ? 10 : 26;
  const P = Array.from({ length: n }, () => nuevo(true));
  function nuevo(inicio) {
    return { x: Math.random() * W, y: inicio ? Math.random() * H : -20, s: 7 + Math.random() * 9, vy: 0.35 + Math.random() * 0.6, fase: Math.random() * 6.3, giro: (Math.random() - 0.5) * 0.04, a: Math.random() * 6.3, col: COL[(Math.random() * COL.length) | 0] };
  }
  function petalo(p) {
    x.save();
    x.translate(p.x, p.y);
    x.rotate(p.a);
    x.scale(1, Math.abs(Math.cos(p.fase * 1.3)) * 0.8 + 0.2);
    const g = x.createLinearGradient(0, -p.s, 0, p.s);
    g.addColorStop(0, p.col[0]); g.addColorStop(1, p.col[1]);
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(0, -p.s);
    x.bezierCurveTo(p.s * 0.9, -p.s * 0.7, p.s * 0.8, p.s * 0.6, 0, p.s);
    x.bezierCurveTo(-p.s * 0.8, p.s * 0.6, -p.s * 0.9, -p.s * 0.7, 0, -p.s);
    x.fill();
    x.restore();
  }
  function pintar() {
    x.clearRect(0, 0, W, H);
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      p.fase += 0.02; p.a += p.giro;
      p.y += p.vy; p.x += Math.sin(p.fase) * 0.6;
      if (p.y > H + 20) P[i] = nuevo(false);
      petalo(p);
    }
    requestAnimationFrame(pintar);
  }
  requestAnimationFrame(pintar);
})();
</script>
</body></html>
