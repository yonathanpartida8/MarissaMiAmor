<!DOCTYPE html>
<html lang="es"><head><style id="sin-resaltado">html{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}*,*::before,*::after{-webkit-tap-highlight-color:transparent}body{-webkit-user-select:none;user-select:none}</style><meta charset="utf-8">
<title>Corazón latiendo</title>
<meta name="tamaño" content="300x300">
<meta name="descripcion" content="Un corazón que late suave con brillito; tócalo y suelta corazoncitos">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}body{display:grid;place-items:center}.halo{position:absolute;width:62%;height:62%;border-radius:50%;background:radial-gradient(circle,rgba(255,150,195,.55),rgba(255,150,195,0) 70%);animation:halo 1.3s ease-in-out infinite}svg{width:62%;height:62%;overflow:visible;animation:late 1.3s cubic-bezier(.3,0,.3,1) infinite;filter:drop-shadow(0 6px 10px rgba(200,40,100,.3));cursor:pointer}.fuerte svg{animation:fuerte .5s cubic-bezier(.3,1.6,.5,1)}.chispa{position:absolute;width:8px;height:8px;color:#fff3c4;animation:orbita 6s linear infinite}@keyframes late{0%,100%{transform:scale(1)}14%{transform:scale(1.09)}28%{transform:scale(1)}42%{transform:scale(1.13)}70%{transform:scale(1)}}@keyframes halo{0%,100%{transform:scale(.9);opacity:.6}42%{transform:scale(1.15);opacity:1}}@keyframes fuerte{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}@keyframes orbita{from{transform:rotate(0) translateX(110px) rotate(0) scale(.8)}50%{transform:rotate(180deg) translateX(110px) rotate(-180deg) scale(1.2)}to{transform:rotate(360deg) translateX(110px) rotate(-360deg) scale(.8)}}</style>
</head><body><div class="halo"></div><svg viewBox="0 0 100 92"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9cc6"/><stop offset=".55" stop-color="#ff5f9e"/><stop offset="1" stop-color="#e2306f"/></linearGradient></defs><path d="M50 88C18 66 3 50 3 29 3 14 15 3 29 3c9 0 16 5 21 12 5-7 12-12 21-12 14 0 26 11 26 26 0 21-15 37-47 59z" fill="url(#g)"/><ellipse cx="30" cy="24" rx="11" ry="7" fill="#fff" opacity=".45" transform="rotate(-30 30 24)"/><circle cx="22" cy="36" r="3" fill="#fff" opacity=".5"/></svg><svg class="chispa" viewBox="0 0 24 24"><path d="M12 0c1 6 4 9 12 12-8 3-11 6-12 12-1-6-4-9-12-12 8-3 11-6 12-12z" fill="currentColor"/></svg><svg class="chispa" style="animation-delay:-3s;color:#ffd1e6" viewBox="0 0 24 24"><path d="M12 0c1 6 4 9 12 12-8 3-11 6-12 12-1-6-4-9-12-12 8-3 11-6 12-12z" fill="currentColor"/></svg>
<script>
(function () {
  var quieto = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function estallido(x, y, n, colores, simbolo) {
    for (var i = 0; i < n; i++) {
      var s = document.createElement("i"), a = Math.random() * 6.28, d = 40 + Math.random() * 70, t = 10 + Math.random() * 12;
      s.textContent = simbolo || "\u2665";
      s.style.cssText = "position:fixed;left:" + x + "px;top:" + y + "px;font:normal " + t + "px/1 system-ui;color:" + colores[i % colores.length] + ";pointer-events:none;text-shadow:0 1px 3px rgba(150,40,90,.25);z-index:9";
      document.body.appendChild(s);
      var an = s.animate([{ transform: "translate(-50%,-50%) scale(.2)", opacity: 1 }, { transform: "translate(calc(-50% + " + Math.cos(a) * d + "px),calc(-50% + " + (Math.sin(a) * d - 30) + "px)) scale(1) rotate(" + (Math.random() * 60 - 30) + "deg)", opacity: 0 }], { duration: 900 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.3,1)" });
      an.onfinish = (function (el) { return function () { el.remove(); }; })(s);
    }
  }
  var svg = document.querySelector("svg");
  addEventListener("pointerdown", function (e) {
    document.body.classList.remove("fuerte"); void document.body.offsetWidth; document.body.classList.add("fuerte");
    estallido(e.clientX, e.clientY, quieto ? 5 : 12, ["#ff5f9e", "#ff9cc6", "#ffc1dc", "#e2306f"]);
    if (navigator.vibrate) navigator.vibrate(12);
  });
})();
</script>
</body></html>
