<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Cartita que se abre</title>
<meta name="tamaño" content="300x300">
<meta name="descripcion" content="Un sobre que se abre al tocarlo y saca una cartita">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}body{display:grid;place-items:center;font-family:Georgia,serif}.s{position:relative;width:220px;height:150px;margin-top:60px;cursor:pointer;-webkit-tap-highlight-color:transparent}.f{position:absolute;inset:0;background:#f9c5d5;border-radius:8px;box-shadow:0 8px 20px rgba(120,40,70,.2)}.c{position:absolute;left:14px;right:14px;top:10px;height:130px;background:#fffdf6;border-radius:6px;padding:14px;box-sizing:border-box;color:#8a3a5a;font-size:16px;line-height:1.35;text-align:center;transition:transform .7s cubic-bezier(.3,1.3,.5,1) .25s}.t{position:absolute;left:0;right:0;top:0;height:90px;background:#f7b0c6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .45s;z-index:3}.b{position:absolute;inset:0;background:linear-gradient(to top right,#f9c5d5 50%,transparent 50%) left/50% 100% no-repeat,linear-gradient(to top left,#f9c5d5 50%,transparent 50%) right/50% 100% no-repeat;border-radius:8px;z-index:2}.cor{position:absolute;left:50%;top:70px;margin-left:-14px;font-size:28px;color:#e8507a;z-index:4;transition:opacity .3s}.s.ab .t{transform:rotateX(180deg);z-index:0}.s.ab .c{transform:translateY(-95px)}.s.ab .cor{opacity:0}</style></head>
<body><div class="s" role="button" tabindex="0"><div class="f"></div><div class="c">Te escribí esto para que sepas que eres mi lugar favorito 💌</div><div class="b"></div><div class="t"></div><span class="cor">♥</span></div>
<script>const s=document.querySelector(".s");s.addEventListener("click",()=>s.classList.toggle("ab"))</script></body></html>
