<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Hojitas rosas flotando</title>
<meta name="tamaño" content="360x480">
<meta name="descripcion" content="Hojitas en forma de corazón que suben despacito">
<meta name="decorativo" content="si">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas></canvas><script>
const c=document.querySelector("canvas"),g=c.getContext("2d"),d=Math.min(2,devicePixelRatio||1),col=["#ff9fbf","#ffc1d6","#f78fb3","#ffd6e5"];
let W,H,p=[],quieto=matchMedia("(prefers-reduced-motion:reduce)").matches;
function medir(){W=c.width=innerWidth*d;H=c.height=innerHeight*d}
function nueva(y){return{x:Math.random()*W,y:y??(H+30*d),t:(9+Math.random()*9)*d,v:(0.25+Math.random()*0.44999999999999996)*d,r:Math.random()*6.3,vr:(Math.random()-.5)*.04,f:Math.random()*6.3,c:col[Math.random()*col.length|0]}}
function forma(t){g.beginPath();g.moveTo(0,t*.35);g.bezierCurveTo(-t*.6,-t*.05,-t*.35,-t*.6,0,-t*.25);g.bezierCurveTo(t*.35,-t*.6,t*.6,-t*.05,0,t*.35);g.fill()}
addEventListener("resize",medir);medir();
for(let i=0;i<20;i++)p.push(nueva(Math.random()*H));
(function cuadro(ms){g.clearRect(0,0,W,H);for(const h of p){if(!quieto){h.y+=-h.v;h.x+=Math.sin(h.f+ms/1100)*.6*d;h.r+=h.vr}if(h.y<-h.t*2)Object.assign(h,nueva());g.save();g.translate(h.x,h.y);g.rotate(h.r+Math.sin(ms/700+h.f)*.3);g.fillStyle=h.c;g.globalAlpha=.9;forma(h.t);g.restore()}if(!quieto)requestAnimationFrame(cuadro)})(0);
</script></body></html>
