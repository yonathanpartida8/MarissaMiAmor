<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Hoja de cuaderno</title>
<meta name="tamaño" content="300x380">
<meta name="descripcion" content="Una hoja de cuaderno con renglones, margen y cinta (para escribir encima)">
<meta name="decorativo" content="si">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}.p{position:absolute;inset:6% 6%;background:#fffdf6 repeating-linear-gradient(transparent 0 27px,#cfe0f2 27px 28px);background-position:0 46px;border-radius:4px;box-shadow:0 8px 20px rgba(60,40,20,.15);transform:rotate(-1.2deg)}.p::before{content:"";position:absolute;top:0;bottom:0;left:40px;border-left:2px solid #f6a9b8}.p::after{content:"";position:absolute;top:-12px;left:50%;width:90px;height:26px;margin-left:-45px;background:repeating-linear-gradient(45deg,rgba(247,168,196,.8) 0 6px,rgba(255,222,234,.8) 6px 12px);transform:rotate(3deg)}.a{position:absolute;left:14px;top:20%;display:grid;gap:44px}.a i{width:12px;height:12px;border-radius:50%;background:#efe6d6;box-shadow:inset 0 2px 3px rgba(0,0,0,.15)}</style></head>
<body><div class="p"><div class="a"><i></i><i></i><i></i></div></div></body></html>
