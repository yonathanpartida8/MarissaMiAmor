<!DOCTYPE html>
<html lang="es"><head><style id="sin-resaltado">html{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}*,*::before,*::after{-webkit-tap-highlight-color:transparent}body{-webkit-user-select:none;user-select:none}input,textarea,select,[contenteditable]:not([contenteditable="false"]),[contenteditable]:not([contenteditable="false"]) *{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}</style><meta charset="utf-8">
<title>Botón de crayón</title>
<meta name="tamaño" content="230x100">
<meta name="descripcion" content="Hecho a mano, con borde de crayón y garabatito">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}body{display:grid;place-items:center;font-family:"Comic Sans MS","Chalkboard SE","Patrick Hand",cursive}button{position:relative;border:3px solid #3b2a3f;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:12px 28px;background:#fff6a8;color:#3b2a3f;font-size:21px;box-shadow:4px 4px 0 #3b2a3f;cursor:pointer;transform:rotate(-2deg);transition:transform .15s,box-shadow .15s;-webkit-tap-highlight-color:transparent}button:active{transform:rotate(-2deg) translate(3px,3px);box-shadow:1px 1px 0 #3b2a3f}button::after{content:"♥";position:absolute;right:-12px;top:-14px;color:#e8507a;font-size:22px;transform:rotate(18deg)}</style></head>
<body><button type="button">Toca aquí</button></body></html>
