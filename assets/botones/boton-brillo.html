<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Botón con brillo</title>
<meta name="tamaño" content="240x90">
<meta name="descripcion" content="Un botón en forma de pastilla con un brillo que pasa">
<style>html,body{margin:0;height:100%;background:transparent;overflow:hidden}body{display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif}button{position:relative;overflow:hidden;border:0;padding:14px 30px;border-radius:999px;font:600 19px/1 inherit;color:#5a2a6e;background:linear-gradient(135deg,#ffe3f1,#e5d9ff);box-shadow:0 6px 16px rgba(120,70,160,.25),inset 0 -2px 0 rgba(0,0,0,.06);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s}button::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.9) 50%,transparent 65%);background-size:250% 100%;animation:b 2.8s ease-in-out infinite}button:active{transform:scale(.94)}@keyframes b{from{background-position:130% 0}to{background-position:-130% 0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></head>
<body><button type="button">Siguiente ✨</button></body></html>
