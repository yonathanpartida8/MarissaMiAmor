# PUBLICAR SIN TOKEN — cuando se sube un .zip a publicar/ (desde la web de
# GitHub: Add file → Upload files), lo abre en publicaciones/<nombre>/, actualiza
# publicaciones/lista.json, borra el .zip y le pide a GitHub Pages que publique.
# El .zip lo arma el editor: «Páginas publicadas» → «Publicar sin token».
name: Publicar páginas subidas

on:
  push:
    paths:
      - "publicar/**.zip"
      - "publicar/**.ZIP"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publicar-subidas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Averiguar la dirección de GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).html_url||"")}catch(e){}})' || true)
          echo "SITIO=$url" >> "$GITHUB_ENV"
          if [ -z "$url" ]; then echo "::warning::GitHub Pages parece apagado: enciéndelo en Settings → Pages (Deploy from a branch → ${GITHUB_REF_NAME} → / (root)) o desde el editor."; fi
      - name: Abrir los .zip en publicaciones/
        run: node herramientas/publicar-subidas.mjs
      - name: Guardar lo publicado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- publicaciones publicar
          git reset -q -- publicar/.errores || true
          if git diff --cached --quiet; then echo "Nada que guardar."; exit 0; fi
          git commit -m "Publicar páginas subidas"
          for i in 1 2 3; do git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep $((i * 4)); done
          exit 1
      - name: Pedirle a GitHub Pages que publique ya
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null \
            && echo "GitHub Pages lo está publicando: en 1 a 3 minutos está en línea." \
            || echo "::warning::No se pudo pedir la publicación (¿GitHub Pages apagado?). Enciéndelo en Settings → Pages."
      - name: ¿Algún .zip no se pudo publicar?
        run: |
          if [ -f publicar/.errores ]; then cat publicar/.errores; exit 1; fi
