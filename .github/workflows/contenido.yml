# Rehace src/data/contenido.js (la lista de fotos, vídeos y páginas que hay
# en las carpetas) cada vez que se sube algo. Así el libro nunca pide un
# archivo que no existe —cero 404— y lo nuevo aparece solo.
name: Lista de contenido

on:
  push:
    branches: [main, claude/interactive-love-book-redesign-5p93fv]
    paths:
      - "paginas-html/**"
      - "images/amores/**"
      - "fotos-paginas/**"
      - "mis-paginas/videos/**"
      - "mis-paginas/fotos/**"
      - "icono/**"
      - "noche-estrellada/**"
      - "assets/audio/**"
      - "herramientas/contenido.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node herramientas/contenido.mjs
      - name: Guardar la lista si cambió
        run: |
          if git diff --quiet -- src/data/contenido.js noche-estrellada/archivos.js; then
            echo "La lista ya estaba al día."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/contenido.js noche-estrellada/archivos.js
          git commit -m "Lista de contenido al día"
          git push
