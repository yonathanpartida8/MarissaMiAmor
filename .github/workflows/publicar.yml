# Publica el sitio con el JavaScript MINIFICADO (sin comentarios ni nombres legibles).
# El código fuente legible se queda sólo en el repositorio (ponlo privado).
# Requiere: Settings → Pages → Source: «GitHub Actions».
name: Publicar protegido

on:
  push:
    branches: [main, claude/interactive-love-book-redesign-5p93fv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save terser
      - run: node herramientas/proteger.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
