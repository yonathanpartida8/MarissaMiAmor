# (Fase 76) Cuando subes imágenes tuyas a assets/objetos-casita/<categoría>/, esto rehace la lista (indice.json)
# para que salgan como objetos en Nuestra casita. También se puede correr a mano: Actions → «Objetos de la casita».
name: Objetos de la casita

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "assets/objetos-casita/**"
      - "!assets/objetos-casita/indice.json"
      - "!assets/objetos-casita/LÉEME.md"
      - "!assets/objetos-casita/*/LÉEME.txt"

permissions:
  contents: write

concurrency:
  group: objetos-casita-${{ github.ref }}
  cancel-in-progress: true

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rehacer la lista de objetos
        run: node herramientas/objetos-casita.mjs
      - name: Guardarla
        run: |
          if [ -z "$(git status --porcelain assets/objetos-casita)" ]; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/objetos-casita
          git commit -m "Objetos de la casita: lista actualizada"
          git push
