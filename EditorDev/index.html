<body class="ed">
  <header class="ed-barra">
    <a class="ed-volver" href="../index.html" title="Volver al librito" aria-label="Volver al librito"></a>
    <button type="button" class="ed-btn ico ed-ajustes-b" aria-label="Configuración del editor" title="Configuración del editor"></button>
    <div class="ed-nombre">
      <input type="text" aria-label="Nombre del librito" spellcheck="false">
      <button type="button" class="ed-guardado" data-st="guardado" aria-live="polite">Guardado</button>
    </div>
    <div class="ed-acciones">
      <div class="ed-grupo-b">
        <button type="button" class="ed-btn ico ed-deshacer" aria-label="Deshacer" title="Deshacer" disabled></button>
        <button type="button" class="ed-btn ico ed-rehacer" aria-label="Rehacer" title="Rehacer" disabled></button>
      </div>
      <button type="button" class="ed-btn ed-paginas-b" aria-label="Páginas" title="Páginas del librito"><i class="ed-pg-ico" aria-hidden="true"></i><span>1/1</span></button>
      <button type="button" class="ed-btn ico ed-musica-b" aria-label="Música" title="Música: tocar para encender o apagar · mantener para el volumen"></button>
      <button type="button" class="ed-btn ico ed-ver" aria-label="Ver como" title="Ver como (hoja automática)"></button>
      <select class="ed-zoom ed-sel" aria-label="Zoom">
        <option value="">Ajustar</option>
        <option value="ajustar">Ajustar a la pantalla</option>
        <option value="0.5">50 %</option>
        <option value="0.75">75 %</option>
        <option value="1">100 %</option>
        <option value="1.5">150 %</option>
        <option value="2">200 %</option>
      </select>
      <button type="button" class="ed-btn primario-suave ed-probar" title="Probar esta página a pantalla completa"><span>Probar</span></button>
      <button type="button" class="ed-btn ed-previa" title="Ver el librito entero como lo verá ella"><span>Librito</span></button>
      <button type="button" class="ed-btn ico ed-guardar" aria-label="Guardar y borradores" title="Guardar y borradores"></button>
      <button type="button" class="ed-btn primario ed-exportar" title="Descargar el librito completo en .zip"><span>Exportar</span></button>
      <button type="button" class="ed-btn ico ed-mas" aria-label="Más" title="Más"></button>
    </div>
  </header>

  <!-- La barra lateral: el riel de categorías y su panel. En la computadora
       van fijos; en el teléfono y la tableta es un cajón que sigue al dedo. -->
  <div class="ed-lateral" aria-label="Herramientas">
    <nav class="ed-riel" aria-label="Secciones"></nav>
    <aside class="ed-panel" aria-label="Panel">
      <div class="ed-panel-cab">
        <h2 class="ed-panel-titulo"></h2>
        <button type="button" class="ed-panel-x" aria-label="Cerrar el panel" title="Cerrar"></button>
      </div>
      <div class="ed-panel-cuerpo"></div>
    </aside>
  </div>
  <div class="ed-velo" aria-hidden="true"></div>
  <div class="ed-borde-izq" aria-hidden="true"></div>
  <button type="button" class="ed-asa-lateral" aria-label="Abrir herramientas"></button>

  <main class="ed-centro">
    <div class="ed-contexto" role="toolbar" aria-label="Herramientas de lo elegido" hidden></div>
    <section class="ed-linea" hidden aria-label="Línea de tiempo"></section>
  </main>

  <!-- En el teléfono: Animar, Efectos, Transiciones, GIFs y Stickers en una hojita (la página se sigue viendo). -->
  <section class="ed-hoja-sec" aria-label="Panel">
    <button type="button" class="ed-asa-hoja" aria-label="Arrastra para subir o bajar · toca para cambiar"><i></i></button>
    <header class="ed-hoja-sec-cab"><h2></h2><button type="button" class="ed-hoja-sec-x" aria-label="Cerrar"></button></header>
    <div class="ed-hoja-sec-cuerpo"></div>
  </section>

  <aside class="ed-insp" aria-label="Inspector">
    <button type="button" class="ed-hoja-asa" aria-label="Cerrar"><i></i></button>
  </aside>

  <!-- El reproductor: el lienzo pinta con él (lo mismo que sale en el .zip). -->
  <script src="runtime/rt-base.js"></script>
  <script src="runtime/rt-render.js"></script>
  <script src="runtime/rt-anim.js"></script>
  <script src="runtime/rt-magia.js"></script>
  <script src="runtime/rt-comps.js"></script>
  <script src="runtime/rt-3d.js"></script>
  <script src="runtime/rt-trans.js"></script>
  <script src="runtime/rt-toques.js"></script>
  <script type="module" src="app.js"></script>
